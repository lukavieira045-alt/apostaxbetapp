<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApostaXBet - Jogos</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            min-height: 100vh; 
            color: #fff; 
            /* IMAGEM DE FUNDO CHONGQING */
            background: url('fundo-jogos.jpg') no-repeat center center fixed; 
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }

        /* CAMADA ESCURA PARA LEGIBILIDADE */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.8); 
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        header { width: 100%; padding: 20px; text-align: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        h1 { font-size: 28px; color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); display: flex; align-items: center; justify-content: center; gap: 10px; }

        .games-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 95%; max-width: 450px; padding: 10px; margin-top: 10px; }

        /* EFEITO NEON NOS CARDS */
        .game-card {
            background: rgba(30, 30, 35, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        /* BRILHO ROSA AO PASSAR O MOUSE/TOCAR */
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ff00cc;
            box-shadow: 0 0 25px rgba(255, 0, 204, 0.4);
        }

        .game-icon { font-size: 48px; margin-bottom: 12px; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .game-desc { font-size: 12px; color: #aaa; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 215, 0, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 12px; gap: 5px; }
        .nav-item.active { color: #ffd700; }
    </style>
</head>
<body>

    <header>
        <h1><span class="material-icons-round">sports_esports</span> Jogos</h1>
    </header>

    <div class="games-container">
        <!-- Roleta -->
        <div class="game-card" onclick="window.location.href='roleta.html'">
            <div class="game-icon">🎰</div>
            <div class="game-title">Roleta</div>
            <div class="game-desc">Gire a roleta</div>
        </div>

        <!-- Roleta Cassino -->
        <div class="game-card" onclick="window.location.href='roleta-cassino.html'">
            <div class="game-icon">🎰</div>
            <div class="game-title">Roleta Cassino</div>
            <div class="game-desc">Roleta automática</div>
        </div>

        <!-- Mines -->
        <div class="game-card" onclick="window.location.href='mines.html'">
            <div class="game-icon">💣</div>
            <div class="game-title">Mines</div>
            <div class="game-desc">Encontre os diamantes</div>
        </div>

        <!-- Crash -->
        <div class="game-card" onclick="window.location.href='crash.html'">
            <div class="game-icon">🚀</div>
            <div class="game-title">Crash</div>
            <div class="game-desc">Acompanhe o multiplicador</div>
        </div>

        <!-- Plinko -->
        <div class="game-card" onclick="window.location.href='plinko.html'">
            <div class="game-icon"></div>
            <div class="game-title">Plinko</div>
            <div class="game-desc">Solte a bola</div>
        </div>

        <!-- Dice -->
        <div class="game-card" onclick="window.location.href='dice.html'">
            <div class="game-icon">🎲</div>
            <div class="game-title">Dice</div>
            <div class="game-desc">Jogue os dados</div>
        </div>
    </div>

    <!-- Menu Inferior -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="material-icons-round">home</span>
            Início
        </a>
        <a href="#" class="nav-item">
            <span class="material-icons-round">sports_esports</span>
            Jogos
        </a>
        <a href="conta.html" class="nav-item">
            <span class="material-icons-round">person</span>
            Conta
        </a>
    </nav>

</body>
</html>
