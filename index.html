<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding-bottom: 90px;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.topo {
    text-align: center;
    padding: 25px 10px 20px;
    border-bottom: 2px solid #d9b21f;
}

.topo h1 {
    margin: 0 0 10px;
    color: #e6c229;
    font-size: 30px;
}

.saldo {
    font-size: 20px;
    color: #e6c229;
}

.saldo span {
    color: #00ed91;
    font-weight: bold;
}

/* BANNER */

.banner {
    width: 94%;
    max-width: 600px;
    margin: 25px auto;
    padding: 20px;
    text-align: center;

    background: linear-gradient(
        145deg,
        #9b7710,
        #e1b925,
        #8f6d0d
    );

    border: 2px solid #d9b21f;
    border-radius: 20px;

    box-shadow: 0 0 25px rgba(218,178,31,.35);
}

.banner h2 {
    margin: 15px 0 5px;
    font-size: 25px;
}

.banner p {
    margin: 5px;
    font-size: 16px;
}

.banner-img {
    width: 100%;
    max-width: 560px;
    display: block;
    margin: auto;
    border-radius: 12px;
}

/* BOTÕES */

.botoes {
    width: 94%;
    max-width: 600px;
    margin: 20px auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.botao {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 65px;

    border-radius: 15px;

    text-decoration: none;
    font-size: 19px;
    font-weight: bold;

    background: #e1bd28;
    color: #000;

    border: 2px solid #d9b21f;
}

.botao.sacar {
    background: #00df8a;
    border-color: #00df8a;
}

/* MENSAGEM */

.inicio {
    width: 94%;
    max-width: 600px;
    margin: 35px auto;
    text-align: center;
}

.inicio h2 {
    color: #e6c229;
    font-size: 26px;
}

.inicio p {
    color: #aaa;
    font-size: 16px;
    line-height: 1.6;
}

/* MENU INFERIOR */

.menu {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    height: 75px;

    background: #111;

    border-top: 2px solid #d9b21f;

    display: flex;
    justify-content: space-around;
    align-items: center;

    z-index: 1000;
}

.menu a {
    width: 33.33%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: white;
    text-decoration: none;

    font-size: 14px;
}

.menu .icone {
    font-size: 25px;
    margin-bottom: 3px;
}

.menu a.ativo {
    color: #e6c229;
}
</style>
</head>

<body>

<header class="topo">

    <h1>🎰 ApostaXBet</h1>

    <div class="saldo">
        💰 Saldo:
        <span id="saldo">R$ 2,00</span>
    </div>

</header>


<!-- BANNER PRINCIPAL -->

<section class="banner">

    <img
        src="img/file_000000009b24820eb29b3df2e7ebd768.png"
        alt="ApostaXBet"
        class="banner-img"
    >

    <h2>Bem-vindo ao ApostaXBet</h2>

    <p>🎮 Jogos, diversão e prêmios!</p>

</section>


<!-- BOTÕES -->

<section class="botoes">

    <a href="deposito.html" class="botao">
        💰 Depositar
    </a>

    <a
        href="#"
        class="botao sacar"
        onclick="alert('Área demonstrativa de saque.'); return false;"
    >
        💵 Sacar
    </a>

</section>


<!-- CONTEÚDO DA PÁGINA INICIAL -->

<section class="inicio">

    <h2>🎮 ApostaXBet</h2>

    <p>
        Bem-vindo à página inicial.
    </p>

    <p>
        Para acessar os jogos,
        toque em <strong>🎮 Jogos</strong>
        no menu abaixo.
    </p>

</section>


<!-- MENU INFERIOR -->

<nav class="menu">

    <a href="index.html" class="ativo">
        <span class="icone">🏠</span>
        Início
    </a>

    <a href="jogos.html">
        <span class="icone">🎮</span>
        Jogos
    </a>

    <a
        href="#"
        onclick="alert('Área da conta demonstrativa.'); return false;"
    >
        <span class="icone">👤</span>
        Conta
    </a>

</nav>

</body>
</html>
