<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ApostaXBet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOPO -->
  <header class="topo">
    <div class="logo">🎰 ApostaXBet</div>

    <div class="saldo">
      💰 Saldo:
      <span id="saldo">R$ 2,00</span>
    </div>
  </header>


  <!-- CONTEÚDO -->
  <main>

    <!-- BANNER -->
    <section class="banner">

      <img
        src="img/file_000000009b24820eb29b3df2e7ebd768.png"
        alt="Banner ApostaXBet"
        class="banner-img"
      >

      <div class="banner-texto">
        <h1>Bem-vindo ao ApostaXBet</h1>
        <p>🎮 Jogos, diversão e prêmios!</p>
      </div>

    </section>


    <!-- BOTÕES -->
    <section class="acoes">

      <button
        class="botao ouro"
        onclick="alert('Área de depósito')"
      >
        💰 Depositar
      </button>

      <button
        class="botao verde"
        onclick="alert('Área de saque')"
      >
        💵 Sacar
      </button>

    </section>


    <!-- JOGOS -->
    <h2 class="titulo">🎮 Jogos</h2>

    <section class="jogos">

      <a href="jogos/roleta.html" class="card">
        <div class="icone">🎰</div>
        <h3>Roleta</h3>
        <p>Gire a roleta</p>
      </a>


      <a href="jogos/mines.html" class="card">
        <div class="icone">💣</div>
        <h3>Mines</h3>
        <p>Encontre os diamantes</p>
      </a>


      <a href="jogos/crash.html" class="card">
        <div class="icone">🚀</div>
        <h3>Crash</h3>
        <p>Acompanhe o multiplicador</p>
      </a>


      <a href="jogos/plinko.html" class="card">
        <div class="icone">🎯</div>
        <h3>Plinko</h3>
        <p>Solte a bola</p>
      </a>


      <a href="jogos/dice.html" class="card">
        <div class="icone">🎲</div>
        <h3>Dice</h3>
        <p>Jogue os dados</p>
      </a>

    </section>

  </main>


  <!-- MENU INFERIOR -->
  <nav class="menu">

    <a href="index.html">
      <span>🏠</span>
      <small>Início</small>
    </a>

    <a href="jogos.html">
      <span>🎮</span>
      <small>Jogos</small>
    </a>

    <a href="#" onclick="alert('Área da conta')">
      <span>👤</span>
      <small>Conta</small>
    </a>

  </nav>


  <script src="saldo.js"></script>
  <script src="script.js"></script>

</body>
</html>
