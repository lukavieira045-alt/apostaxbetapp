<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ApostaXBet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .banner-img {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            margin: 0 auto 15px;
            border-radius: 15px;
        }

        .banner {
            text-align: center;
            padding: 20px;
        }

        .jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .card {
            text-decoration: none;
            color: inherit;
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }

        .card h3 {
            margin-top: 8px;
        }

        .botao-demo {
            padding: 12px 18px;
            margin: 5px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }

        .menu {
            text-align: center;
            padding: 20px;
        }

        .menu a {
            margin: 5px;
        }
    </style>
</head>

<body>

<header class="topo">

    <h1>🎰 ApostaXBet</h1>

    <div class="saldo">
        💰 Saldo:
        <span id="saldo">R$ 2,00</span>
    </div>

</header>

<section class="banner">

    <img
        src="img/banner.jpg"
        alt="Banner ApostaXBet"
        class="banner-img"
    >

    <h2>Bem-vindo ao ApostaXBet</h2>

    <p>🎮 Jogos, diversão e prêmios!</p>

</section>

<div class="botoes">

    <button
        class="botao-demo"
        onclick="alert('Função de depósito apenas demonstrativa.')"
    >
        💰 Depositar
    </button>

    <button
        class="botao-demo"
        onclick="alert('Função de saque apenas demonstrativa.')"
    >
        💸 Sacar
    </button>

</div>

<h2 class="titulo">🎮 Jogos</h2>

<section class="jogos">

    <a href="jogos/roleta.html" class="card">

        <img
            src="img/roleta.png"
            alt="Roleta"
        >

        <h3>Roleta</h3>

    </a>


    <a href="jogos/mines.html" class="card">

        <img
            src="img/mines.png"
            alt="Mines"
        >

        <h3>Mines</h3>

    </a>


    <a href="jogos/crash.html" class="card">

        <img
            src="img/crash.png"
            alt="Crash"
        >

        <h3>Crash</h3>

    </a>


    <a href="jogos/plinko.html" class="card">

        <img
            src="img/plinko.png"
            alt="Plinko"
        >

        <h3>Plinko</h3>

    </a>


    <a href="jogos/dice.html" class="card">

        <img
            src="img/dice.png"
            alt="Dice"
        >

        <h3>Dice</h3>

    </a>

</section>

<nav class="menu">

    <a href="index.html">🏠 Início</a>

    <a href="jogos.html">🎮 Jogos</a>

    <a href="#" onclick="alert('Área demonstrativa.')">
        👤 Conta
    </a>

</nav>

<script src="saldo.js"></script>
<script src="script.js"></script>

</body>
</html>
