<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ApostaXBet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 90px;
    }

    /* SALDO */
    .saldo {
      text-align: center;
      padding: 22px 10px;
      font-size: 28px;
      color: #00ff88;
      border-bottom: 3px solid #d8af28;
      background: #111;
    }

    /* BANNER */
    .banner {
      width: calc(100% - 30px);
      max-width: 900px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 28px;
      text-align: center;

      background: linear-gradient(
        145deg,
        #d5af2f,
        #7b5c00
      );

      box-shadow:
        0 0 20px rgba(218, 176, 35, 0.55),
        inset 0 0 20px rgba(255,255,255,0.08);
    }

    .banner img {
      width: 100%;
      max-width: 800px;
      display: block;
      margin: 0 auto 20px;
      border-radius: 18px;
    }

    .banner h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .banner p {
      font-size: 22px;
    }

    /* BOTÕES */
    .botoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      width: calc(100% - 50px);
      max-width: 900px;
      margin: 30px auto;
    }

    .botao {
      border: none;
      border-radius: 18px;
      padding: 22px 15px;
      background: #d8af28;
      color: #050505;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .botao:active {
      transform: scale(0.96);
    }

    /* TÍTULO */
    .titulo {
      text-align: center;
      color: #d8af28;
      font-size: 38px;
      margin: 35px 0 25px;
    }

    /* JOGOS */
    .jogos {
      width: calc(100% - 30px);
      max-width: 950px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      height: 270px;
      border: 3px solid #d8af28;
      border-radius: 28px;
      background: #151515;
      color: white;
      text-decoration: none;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding: 15px;
      overflow: hidden;

      box-shadow: 0 0 10px rgba(216,175,40,0.15);
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .icone {
      width: 100%;
      height: 190px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 80px;
    }

    .card h3 {
      font-size: 27px;
      margin-bottom: 5px;
    }

    /* MENU INFERIOR */
    .menu {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      height: 80px;

      background: #111;
      border-top: 3px solid #d8af28;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      z-index: 1000;
    }

    .menu a {
      color: white;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
    }

    .menu a:active {
      background: #222;
    }

    /* CELULAR */
    @media (max-width: 600px) {

      .saldo {
        font-size: 24px;
      }

      .banner {
        padding: 18px;
        margin-top: 25px;
      }

      .banner h1 {
        font-size: 30px;
      }

      .banner p {
        font-size: 19px;
      }

      .botoes {
        width: calc(100% - 40px);
        gap: 15px;
      }

      .botao {
        font-size: 18px;
        padding: 20px 8px;
      }

      .titulo {
        font-size: 34px;
      }

      .jogos {
        width: calc(100% - 30px);
        gap: 15px;
      }

      .card {
        height: 270px;
      }

      .icone {
        height: 190px;
        font-size: 70px;
      }

      .card h3 {
        font-size: 23px;
      }

      .menu {
        height: 75px;
      }

      .menu a {
        font-size: 17px;
      }
    }

    /* CELULAR MUITO PEQUENO */
    @media (max-width: 380px) {

      .jogos {
        grid-template-columns: 1fr;
      }

      .card {
        height: 250px;
      }

      .banner h1 {
        font-size: 25px;
      }

      .banner p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- SALDO -->
  <div class="saldo">
    💰 Saldo: <span id="saldo">R$ 2,00</span>
  </div>

  <!-- BANNER -->
  <section class="banner">

    <!-- SUA IMAGEM DO GITHUB -->
    <img
      src="img/file_000000009b24820eb29b3df2e7ebd768.png"
      alt="Banner ApostaXBet"
      onerror="this.style.display='none'"
    >

    <h1>Bem-vindo ao ApostaXBet</h1>

    <p>🎮 Jogos, diversão e prêmios!</p>

  </section>


  <!-- DEPÓSITO / SAQUE -->
  <div class="botoes">

    <button
      class="botao"
      onclick="demo('Depósito')">
      💰 Depositar
    </button>

    <button
      class="botao"
      onclick="demo('Saque')">
      💸 Sacar
    </button>

  </div>


  <!-- TÍTULO -->
  <h2 class="titulo">
    🎮 Jogos
  </h2>


  <!-- JOGOS -->
  <section class="jogos">

    <a href="jogos/roleta.html" class="card">
      <div class="icone">🎰</div>
      <h3>Roleta</h3>
    </a>


    <a href="jogos/mines.html" class="card">
      <div class="icone">💣</div>
      <h3>Mines</h3>
    </a>


    <a href="jogos/crash.html" class="card">
      <div class="icone">🚀</div>
      <h3>Crash</h3>
    </a>


    <a href="jogos/plinko.html" class="card">
      <div class="icone">🎯</div>
      <h3>Plinko</h3>
    </a>


    <a href="jogos/dice.html" class="card">
      <div class="icone">🎲</div>
      <h3>Dice</h3>
    </a>

  </section>


  <!-- MENU -->
  <nav class="menu">

    <a href="index.html">
      🏠 Início
    </a>

    <a href="#jogos">
      🎮 Jogos
    </a>

    <a href="#" onclick="demo('Conta'); return false;">
      👤 Conta
    </a>

  </nav>


  <script>

    function demo(nome) {
      alert(
        nome +
        " — função demonstrativa."
      );
    }

  </script>

</body>
</html>
