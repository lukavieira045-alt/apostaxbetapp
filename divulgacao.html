<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ApostaXBet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    .pagina {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      padding: 18px 14px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 5px;
      text-align: center;
    }

    .subtitulo {
      font-size: 14px;
      color: #cfcfcf;
      text-align: center;
      margin-bottom: 18px;
    }

    .video-container {
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255,255,255,0.08);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
    }

    .texto {
      text-align: center;
      margin: 18px 0 14px;
    }

    .texto h1 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .texto p {
      color: #cfcfcf;
      font-size: 14px;
      line-height: 1.5;
    }

    .botao {
      width: 100%;
      max-width: 500px;
      min-height: 58px;
      border: none;
      border-radius: 14px;
      background: #18b84b;
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .botao:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .rodape {
      margin-top: 20px;
      color: #777;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="pagina">

    <div class="logo">
      ApostaXBet
    </div>

    <div class="subtitulo">
      Confira o vídeo e acesse o site
    </div>

    <div class="video-container">
      <video
        controls
        playsinline
        preload="metadata"
      >
        <source src="video.mp4" type="video/mp4">
        Seu navegador não consegue reproduzir este vídeo.
      </video>
    </div>

    <div class="texto">
      <h1>Quer conhecer o ApostaXBet?</h1>

      <p>
        Toque no botão abaixo para entrar no site.
      </p>
    </div>

    <a
      class="botao"
      href="https://lukavieira045-alt.github.io/apostaxbetapp/"
    >
      ENTRAR NO APOSTAXBET
    </a>

    <div class="rodape">
      Acesse o site pelo botão acima.
    </div>

  </main>

</body>
</html>
