<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divulgação - ApostaXBet</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #02030b;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .header {
        width: 100%;
        padding: 20px;
        text-align: center;
        background: linear-gradient(#101d49, #071127);
        border-bottom: 2px solid #345a9e;
        box-shadow: 0 0 20px #00eaff44;
    }

    .header h1 {
        margin: 0;
        color: #61fff4;
        text-transform: uppercase;
        font-size: 24px;
        text-shadow: 0 0 10px #00ffff;
    }

    .video-wrapper {
        max-width: 500px; /* Ajustado para vídeos verticais/celular */
        width: 90%;
        margin: 40px auto;
        background: #101736;
        padding: 10px;
        border-radius: 15px;
        border: 3px solid #25eaf1;
        box-shadow: 0 0 30px rgba(37, 234, 241, 0.3);
    }

    video {
        width: 100%;
        height: auto;
        border-radius: 10px;
        display: block;
        object-fit: contain; /* Garante que o vídeo não seja cortado */
    }

    .cta-box {
        text-align: center;
        margin-top: 20px;
        padding: 20px;
    }

    .btn-site {
        background: radial-gradient(circle, #25eaf1, #0088ff);
        color: #02030b;
        padding: 15px 50px;
        font-size: 22px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 50px;
        box-shadow: 0 0 20px #25eaf1;
        transition: 0.3s;
        display: inline-block;
    }

    .btn-site:hover {
        transform: scale(1.1);
        box-shadow: 0 0 40px #25eaf1;
    }

    .back-link {
        margin-top: 30px;
        color: #8796b4;
        text-decoration: none;
        font-size: 14px;
    }
    
    .aviso-som {
        color: #ffd700;
        font-size: 12px;
        margin-top: 5px;
    }
</style>
</head>
<body>

    <div class="header">
        <h1>🎰 Veja como é fácil ganhar!</h1>
    </div>

    <div class="video-wrapper">
        <!-- Som ativado (removido o muted) e loop -->
        <video controls autoplay loop playsinline>
            <source src="video-promo~3.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
        <p class="aviso-som">🔊 Se o som não iniciar, clique no vídeo para ativar.</p>
    </div>

    <div class="cta-box">
        <p style="color: #a8ff67; font-size: 18px; margin-bottom: 20px;">
            Não fique só olhando! Acesse o site principal agora.
        </p>
        <!-- Link alterado para a Home do site -->
        <a href="index.html" class="btn-site">ACESSAR O SITE 🚀</a>
    </div>

    <a href="index.html" class="back-link">← Voltar para a Home</a>

</body>
</html>
