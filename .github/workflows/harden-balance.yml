name: Harden balance system
on:
  push:
    paths:
      - '.github/workflows/harden-balance.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch balance clients
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('saldo.js'); s = p.read_text()
          s = re.sub(r'async function salvarSaldo\(novoValor\) \{.*?\n\}\n\n\n// =====================================================\n// ATUALIZAR SALDO', '''async function salvarSaldo(novoValor) { return false; }


// =====================================================
// ATUALIZAR SALDO''', s, flags=re.S)
          s = re.sub(r'async function debitar\(valorAposta\) \{.*?\n\}\n\n\n// =====================================================\n// PROCESSAR VITÓRIA', '''async function debitar(valorAposta) {
    const valor = Number(valorAposta); if (!Number.isFinite(valor) || valor <= 0) return false;
    const user = await getUsuarioLogado(); if (!user) return false;
    const { error } = await supabase.rpc('debitar_saldo', { p_user_id: user.id, p_valor: valor });
    if (error) { console.error(error); return false; }
    await atualizarTela(); return true;
}


// =====================================================
// PROCESSAR VITÓRIA''', s, flags=re.S)
          s = re.sub(r'async function processarVitoria\(\n    valorAposta,\n    multiplicadorJusto\n\) \{.*?\n\}\n\n\n// =====================================================\n// CREDitar', '''async function processarVitoria(valorAposta, multiplicadorJusto) {
    const aposta = Number(valorAposta), multiplicador = Number(multiplicadorJusto);
    if (!Number.isFinite(aposta) || !Number.isFinite(multiplicador) || aposta <= 0 || multiplicador < 0) return 0;
    const user = await getUsuarioLogado(); if (!user) return 0;
    const { data, error } = await supabase.rpc('processar_vitoria', { p_user_id: user.id, p_aposta: aposta, p_multiplicador: multiplicador });
    if (error) { console.error(error); return 0; }
    await atualizarTela(); return Number(data) || 0;
}


// =====================================================
// CREDitar''', s, flags=re.S)
          s = re.sub(r'async function creditar\(valor\) \{.*?\n\}\n\n\n// =====================================================\n// SISTEMA GLOBAL', '''async function creditar(valor) { return false; }


// =====================================================
// SISTEMA GLOBAL''', s, flags=re.S)
          s = s.replace("    creditar: creditar,\n", "")
          p.write_text(s)

          p = Path('script.js'); s = p.read_text()
          s = re.sub(r'async function salvarSaldo\(novoValor\) \{.*?\n\}\n\n\n// =====================================================\n// ATUALIZAR SALDO', '''async function salvarSaldo(novoValor) { return false; }


// =====================================================
// ATUALIZAR SALDO''', s, flags=re.S)
          s = re.sub(r'async function descontarSaldo\(valor\) \{.*?\n\}\n\n\n// =====================================================\n// PROCESSAR VITÓRIA', '''async function descontarSaldo(valor) {
    const valorNumerico = Number(valor); if (!Number.isFinite(valorNumerico) || valorNumerico <= 0) return false;
    const user = await getUsuarioLogado(); if (!user) return false;
    const { error } = await clienteSupabase().rpc('debitar_saldo', { p_user_id: user.id, p_valor: valorNumerico });
    if (error) { console.error(error); return false; }
    await carregarSaldoDisplay(); return true;
}


// =====================================================
// PROCESSAR VITÓRIA''', s, flags=re.S)
          s = re.sub(r'async function processarVitoria\(\n    aposta,\n    multiplicador\n\) \{.*?\n\}\n\n\n// =====================================================\n// PROCESSAR SAQUE', '''async function processarVitoria(aposta, multiplicador) {
    const apostaNumerica = Number(aposta), multiplicadorNumerico = Number(multiplicador);
    if (!Number.isFinite(apostaNumerica) || !Number.isFinite(multiplicadorNumerico) || apostaNumerica <= 0 || multiplicadorNumerico < 0) return 0;
    const user = await getUsuarioLogado(); if (!user) return 0;
    const { data, error } = await clienteSupabase().rpc('processar_vitoria', { p_user_id: user.id, p_aposta: apostaNumerica, p_multiplicador: multiplicadorNumerico });
    if (error) { console.error(error); return 0; }
    await carregarSaldoDisplay(); return Number(data) || 0;
}


// =====================================================
// PROCESSAR SAQUE''', s, flags=re.S)
          s = s.replace("    salvar:\n        salvarSaldo\n", "")
          s = s.replace("    salvarSaldo:\n        salvarSaldo,\n\n", "")
          p.write_text(s)

          # Syntax sanity checks
          import subprocess, sys
          for fn in ['saldo.js','script.js']:
              subprocess.run(['node','--check',fn], check=True)

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/harden-balance.yml
          git add saldo.js script.js .github/workflows/harden-balance.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Harden balance mutations'
          git push