name: Roleta 2 - restaurar visual aprovado e remover segunda rodada

on:
  push:
    paths:
      - 'roleta2-restore-approved-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar versão visual aprovada e remover segunda rodada
        shell: bash
        run: |
          git show 1b4a507638556010561d5792739d96ab7964f443:jogos/roleta2.html > jogos/roleta2.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')

          # Mantém a roda profissional aprovada e o primeiro giro oposto.
          # Remove somente a animação da bolinha disparada pela rodada original,
          # que acontecia depois da contagem e criava a segunda rodada visual.
          s = re.sub(r'\n\s*ball\.animate\([^;]+;?', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*const\s+ballAnim\s*=\s*ball\.animate\([^;]+;?', '\n', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Roleta 2: restaurar visual aprovado e remover segunda rodada' || exit 0
          git push
