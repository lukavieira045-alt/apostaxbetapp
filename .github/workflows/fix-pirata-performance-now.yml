name: Optimize only Tesouro Pirata
on: push
permissions:
  contents: write
jobs:
  optimize:
    if: github.event.head_commit.message != 'Remove temporary Pirata performance workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minimal performance changes only in Pirata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.lobby-strip.lobby-spinning .cel img,.lobby-strip.lobby-spinning .letra{filter:blur(2px) brightness(1.15)}','',1)
          s=s.replace('const noise=8+c;tasks.push(spinOneReel(c,finalGrid[c],c,duration,delay,noise))','const noise=4+c;tasks.push(spinOneReel(c,finalGrid[c],c,duration,delay,noise))',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove extra Roleta 2 round and extra spin music
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 FINAL REAL CASINO WHEEL \*/.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 Physical Opposite Spin v1 \*/.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{function arm\(\).*?btn-girar.*?spin-fisico.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{function arm\(\).*?btn-girar.*?spin-real.*?</script>\s*','',s,flags=re.S)
          marker='/* ApostaXBet — Roleta 2 Real Spin Sound v2 */'
          if marker in s:
              start=s.find(marker);end=s.find('function pararSomRoleta()',start)
              if end!=-1:
                  close=s.find('}',end)
                  if close!=-1:
                      close+=1
                      original='function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}\nfunction pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'
                      s=s[:start]+original+s[close:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html jogos/roleta2.html
          git diff --cached --quiet && echo 'NO CHANGES' && exit 0
          git commit -m 'Otimizar travamento do Tesouro Pirata'
          git push
          rm -f .github/workflows/fix-pirata-performance-now.yml
          git add -u .github/workflows/fix-pirata-performance-now.yml
          git commit -m 'Remove temporary Pirata performance workflow' || true
          git push || true
