name: Optimize only Tesouro Pirata
on: push
permissions:
  contents: write
jobs:
  optimize:
    if: github.event.head_commit.message != 'Remove temporary Pirata performance workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minimal performance changes only in Pirata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.lobby-strip.lobby-spinning .cel img,.lobby-strip.lobby-spinning .letra{filter:blur(2px) brightness(1.15)}','',1)
          s=s.replace('const noise=8+c;tasks.push(spinOneReel(c,finalGrid[c],c,duration,delay,noise))','const noise=4+c;tasks.push(spinOneReel(c,finalGrid[c],c,duration,delay,noise))',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git commit -m 'Otimizar travamento do Tesouro Pirata' || exit 0
          git push
          rm -f .github/workflows/fix-pirata-performance-now.yml
          git add -u .github/workflows/fix-pirata-performance-now.yml
          git commit -m 'Remove temporary Pirata performance workflow' || true
          git push || true
