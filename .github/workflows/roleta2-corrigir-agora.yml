name: Corrigir Roleta 2 agora
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir giro unico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')

          # Remove a animacao separada da bola: o giro visual passa a ser um unico giro sincronizado.
          s,n=re.subn(r"bola\.animate\(\[.*?\],\{duration:5000,easing:'cubic-bezier\(\.12,\.75,\.16,1\)'\}\);", "", s, count=1, flags=re.S)

          # Remove o CSS antigo de transicao de 5s e instala giro profissional em sentidos opostos.
          s=s.replace("transition:transform 5s cubic-bezier(.12,.75,.16,1)", "transition:none")
          css='''<style id="ax-r2-single-spin">\n@keyframes axR2WheelSpin{from{transform:rotate(0deg)}to{transform:rotate(2520deg)}}\n@keyframes axR2BallSpin{from{transform:translate(-50%,-50%) translateY(-190px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-190px) rotate(-2880deg)}}\n.roleta.ax-r2-spin{animation:axR2WheelSpin 7.6s cubic-bezier(.15,.65,.20,1) both}\n.bola.ax-r2-spin{animation:axR2BallSpin 7.6s cubic-bezier(.08,.02,.12,1) both}\n@media(max-width:650px){@keyframes axR2BallSpinMobile{from{transform:translate(-50%,-50%) translateY(-125px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-125px) rotate(-2880deg)}}.bola.ax-r2-spin{animation-name:axR2BallSpinMobile}}\n</style>'''
          if 'id="ax-r2-single-spin"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          hook='''<script id="ax-r2-single-spin-hook">\nwindow.axR2SingleSpin=function(){\n  const r=document.getElementById('roleta'),b=document.getElementById('bola');\n  if(!r)return;\n  r.classList.remove('ax-r2-spin'); if(b)b.classList.remove('ax-r2-spin');\n  void r.offsetWidth; r.classList.add('ax-r2-spin'); if(b)b.classList.add('ax-r2-spin');\n  try{iniciarSomRoleta()}catch(e){}\n  setTimeout(()=>{try{pararSomRoleta()}catch(e){}},7600);\n};\n</script>'''
          if 'id="ax-r2-single-spin-hook"' not in s:
              s=s.replace('</head>',hook+'</head>',1)

          # Som suave: mesma funcao, cadencia menor e volume baixo.
          sound="""function iniciarSomRoleta(){try{iniciarAudio();clearInterval(tickTimer);tickTimer=setInterval(()=>{if(!girando)return;let now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=620+Math.random()*100;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+.07);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.075)},240)}catch(e){}}\nfunction pararSomRoleta(){clearInterval(tickTimer);tickTimer=null}"""
          s=re.sub(r"function iniciarSomRoleta\(\).*?function pararSomRoleta\(\)\{.*?\}",sound,s,count=1,flags=re.S)

          # Inicia o unico giro somente depois do numero ser sorteado, preservando a logica do resultado.
          marker="rotacaoAtual+=7*360+(360-indice*ang);"
          s=s.replace(marker, marker+"axR2SingleSpin();roleta.style.transform=`rotate(${rotacaoAtual}deg)`;",1)
          # Remove a antiga atribuicao da roleta e o timer de 5.1s; usa o mesmo fluxo de finalizacao apos 7.6s.
          s=re.sub(r"iniciarSomRoleta\(\);roleta\.style\.transform=`rotate\(\$\{rotacaoAtual\}deg\)`;setTimeout\(async\(\)=>\{pararSomRoleta\(\);await finalizarRodada\(numero\);girando=false;btnGirar\.disabled=false;await obterSaldo\(\);if\(auto&&apostas\.length\)setTimeout\(girarRoleta,1200\)\},5100\)","setTimeout(async()=>{pararSomRoleta();await finalizarRodada(numero);girando=false;btnGirar.disabled=false;await obterSaldo();if(auto&&apostas.length)setTimeout(girarRoleta,1200)},7700)",s,count=1,flags=re.S)

          if 'bola.animate(' in s: raise SystemExit('ERRO: animacao antiga da bola ainda existe')
          if 'duration:5000' in s: raise SystemExit('ERRO: giro antigo de 5s ainda existe')
          if 'axR2SingleSpin' not in s: raise SystemExit('ERRO: giro unico nao instalado')
          p.write_text(s,encoding='utf-8')
          print('ROLETAXBET2_CORRIGIDA')
          PY
      - name: Validar
        run: |
          grep -q 'ax-r2-single-spin' jogos/roleta2.html
          ! grep -q 'bola.animate(' jogos/roleta2.html
          ! grep -q 'duration:5000' jogos/roleta2.html
      - name: Publicar
        run: |
          git config user.name 'ApostaXBet Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir Roleta 2: giro unico, sentidos opostos e som suave'
          git push