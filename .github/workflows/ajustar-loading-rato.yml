name: ajustar-loading-rato
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajustar-loading-rato.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar carregamento do Tesouro Pirata
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('jogos/fortune-mouse.html')
          s=p.read_text(encoding='utf-8')

          css=r'''/* === LOADING IGUAL AO TESOURO PIRATA === */
          #ax-loading-screen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#174d63 0%,#062737 48%,#02090e 100%);padding:20px;transition:opacity .35s ease,visibility .35s ease}
          #ax-loading-screen.ax-loading-hide{opacity:0;visibility:hidden;pointer-events:none}
          .ax-loading-card{width:min(390px,92vw);text-align:center;padding:18px 18px 20px;background:linear-gradient(180deg,#111b20,#070b0d);border:2px solid #d6ad52;border-radius:14px;box-shadow:0 0 0 2px #3b2209,0 18px 55px #000c}
          .ax-loading-brand{font:900 16px Arial,sans-serif;letter-spacing:3px;color:#ffe27b;margin-bottom:10px;text-shadow:0 2px 5px #000}
          .ax-loading-img{display:block;width:100%;height:190px;object-fit:cover;border-radius:9px;border:2px solid #9f7833;box-shadow:inset 0 0 20px #000,0 8px 20px #000;object-position:center}
          .ax-loading-title{margin-top:12px;font:900 24px Georgia,serif;color:#ffd85d;text-shadow:0 2px 5px #000}
          .ax-loading-text{margin-top:10px;color:#fff;font-weight:800;font-size:13px}
          .ax-loading-track{height:12px;margin:10px 0 6px;border-radius:20px;background:#1a1a18;border:1px solid #8b6b30;overflow:hidden;box-shadow:inset 0 2px 5px #000}
          #ax-loading-bar{height:100%;width:0;background:linear-gradient(90deg,#0b7d35,#2ee66b,#ffd84e);box-shadow:0 0 12px #37e66d;transition:width .08s linear}
          .ax-loading-percent{font:900 13px Arial;color:#ffe37a}
          @media(max-width:760px){.ax-loading-img{height:165px}.ax-loading-title{font-size:20px}.ax-loading-card{padding:14px}}
          '''
          # Remove the old loading CSS section and replace it.
          s=re.sub(r'/\* === LOADING DE ENTRADA APOSTAXBET === \*/.*?\n</style>', css+'\n</style>', s, count=1, flags=re.S)

          body=r'''<div id="ax-loading-screen" aria-label="Carregando jogo">
              <div class="ax-loading-card">
                  <div class="ax-loading-brand">APOSTAXBET</div>
                  <img class="ax-loading-img" src="banner-mouse.png" alt="Rato da Fortuna">
                  <div class="ax-loading-title">RATO DA FORTUNA</div>
                  <div class="ax-loading-text">Carregando jogo...</div>
                  <div class="ax-loading-track"><div id="ax-loading-bar"></div></div>
                  <div class="ax-loading-percent" id="ax-loading-percent">0%</div>
              </div>
          </div>
          '''
          s=re.sub(r'<div id="ax-loading-screen" aria-label="Carregando jogo">.*?</div>\n\n\n<div class="game">', body+'\n<div class="game">', s, count=1, flags=re.S)

          loader=r'''<script>
          (function(){
              const screen=document.getElementById('ax-loading-screen');
              const bar=document.getElementById('ax-loading-bar');
              const pct=document.getElementById('ax-loading-percent');
              if(!screen||!bar||!pct)return;
              let value=0;
              const timer=setInterval(()=>{
                  value=Math.min(value+4,100);
                  bar.style.width=value+'%';
                  pct.textContent=value+'%';
                  if(value>=100){
                      clearInterval(timer);
                      setTimeout(()=>{screen.classList.add('ax-loading-hide');setTimeout(()=>screen.remove(),450)},250);
                  }
              },55);
          })();
          </script>'''
          s=re.sub(r'<script>\n\(function\(\)\{\n    const screen=document\.getElementById\(\'ax-loading-screen\'\);.*?</script>\n\n</body>', loader+'\n\n</body>', s, count=1, flags=re.S)

          p.write_text(s,encoding='utf-8')
          print('loading updated')
      - name: Commit e remover workflow temporario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/fortune-mouse.html
          git commit -m "Corrigir carregamento do Rato da Fortuna"
          git push
          rm -f .github/workflows/ajustar-loading-rato.yml
          git add .github/workflows/ajustar-loading-rato.yml
          git commit -m "Remover workflow temporario"
          git push
