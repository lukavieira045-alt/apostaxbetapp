name: Evolution APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'evolution-native/**'
      - '.github/workflows/evolution-apk.yml'
  push:
    branches: [ evolution-native ]
    paths:
      - 'evolution-native/**'
      - '.github/workflows/evolution-apk.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify project files
        working-directory: evolution-native
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/evolution/ai/MainActivity.kt
          test -f gradle.properties
          echo 'Projeto Android Evolution encontrado.'

      - name: Preserve nucleus and fix coroutine calls
        working-directory: evolution-native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evolution/ai/MainActivity.kt')
          s = p.read_text()
          old = 'private fun answerFor(q: String): String {'
          new = 'private suspend fun answerFor(q: String): String {'
          if old not in s:
              raise SystemExit('assinatura answerFor não encontrada')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Núcleo anterior preservado; answerFor agora pode chamar o cérebro suspend.')
          PY

      - name: Build Evolution APK
        working-directory: evolution-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s evolution-native/app/build/outputs/apk/debug/app-debug.apk
          ls -lh evolution-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-debug-apk
          path: evolution-native/app/build/outputs/apk/debug/app-debug.apk
