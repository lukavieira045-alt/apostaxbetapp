name: Fix Tesouro Pirata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch payout and premium UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('jogos/tesouro-pirata.html')
          s = p.read_text(encoding='utf-8')

          # The old table had 50x for the pirate symbol. With the existing
          # 3/4/5-match formula this could produce an enormous win on a R$1 bet.
          # Keep the existing SistemaSaldo debit/credit flow untouched and
          # only bring the game's symbol multipliers down to a normal slot range.
          new_payouts = """const PAYOUTS = {
              '🏴‍☠️': 2.00,
              '🦜': 1.60,
              '💰': 1.35,
              '🗺️': 1.15,
              '⚓': 1.00,
              '🧭': 0.85,
              'K': 0.70,
              'Q': 0.60,
              'J': 0.50,
              'A': 0.40
          };"""
          s, n = re.subn(
              r"const PAYOUTS = \{.*?\};",
              new_payouts,
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('PAYOUTS block not found')

          # Replace the prototype-looking visual layer without touching the
          # game DOM or SistemaSaldo logic.
          premium_css = r'''

/* ======================================================
   TESOURO PIRATA — CAMADA VISUAL PREMIUM
   Apenas aparência; lógica/saldo permanecem intactos.
====================================================== */
body{
    background:
      linear-gradient(rgba(3,10,14,.68),rgba(3,8,12,.92)),
      url('../jogos/tesouro-pirata.png') center/cover fixed no-repeat;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 12%,rgba(255,210,70,.18),transparent 28%),
      linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.42));
    z-index:-1;
}

.game-wrapper{
    max-width:760px;
    padding:12px;
    border:3px solid #c99a3a;
    border-radius:22px;
    background:
      linear-gradient(180deg,rgba(72,42,20,.97),rgba(17,10,6,.98));
    box-shadow:
      0 0 0 2px rgba(255,215,0,.14),
      0 18px 55px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 0 35px rgba(0,0,0,.9);
}

.game-wrapper::before{
    content:"⚓  •  TESOURO PIRATA  •  ⚓";
    display:block;
    text-align:center;
    color:#ffe29a;
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    padding:4px 0 9px;
    text-shadow:0 2px 5px #000;
}

.header{
    margin-bottom:10px;
    padding:10px 12px;
    border:1px solid rgba(255,215,0,.45);
    border-bottom:2px solid #d7a83e;
    border-radius:14px;
    background:linear-gradient(180deg,rgba(12,13,12,.9),rgba(0,0,0,.72));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 5px 16px rgba(0,0,0,.35);
}

.game-title{
    color:#ffd65a;
    font-size:clamp(16px,4vw,24px);
    letter-spacing:2px;
    text-shadow:0 2px 0 #6e4300,0 0 14px rgba(255,191,0,.38),2px 3px 5px #000;
}

.balance-display{
    border:1px solid #d9aa3d;
    border-radius:10px;
    padding:7px 10px;
    background:linear-gradient(180deg,#19140b,#050505);
    box-shadow:inset 0 0 12px #000,0 0 10px rgba(255,197,61,.08);
    color:#ffd75c;
}

.reels-container{
    gap:5px;
    padding:8px;
    border:3px solid #6d4926;
    border-radius:15px;
    background:
      linear-gradient(180deg,rgba(5,7,8,.98),rgba(20,10,5,.98));
    box-shadow:
      inset 0 0 28px #000,
      0 0 0 1px rgba(255,215,0,.14),
      0 8px 18px rgba(0,0,0,.55);
}

.symbol-cell{
    height:84px;
    border:1px solid #705c43;
    border-radius:9px;
    background:
      radial-gradient(circle at 50% 30%,rgba(255,255,255,.09),transparent 40%),
      linear-gradient(180deg,#263039,#0b0e11);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -8px 15px rgba(0,0,0,.55);
    font-size:2.45em;
}

.symbol-cell.winner{
    background:radial-gradient(circle,#fff8a0 0%,#ffc400 42%,#9c4d00 100%);
    border-color:#fff2a1;
    box-shadow:0 0 12px #ffd21f,0 0 32px rgba(255,178,0,.75),inset 0 0 18px rgba(255,255,255,.55);
}

.info-text{
    color:#d6c29a;
    font-size:10px;
    letter-spacing:.7px;
    padding:4px 2px;
}

.controls-panel{
    margin-top:5px;
    padding:10px;
    border:1px solid rgba(214,168,61,.42);
    border-top:2px solid #d6a83e;
    border-radius:14px;
    background:linear-gradient(180deg,rgba(7,7,7,.95),rgba(22,12,7,.96));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 7px 18px rgba(0,0,0,.45);
}

.bet-adjuster{
    border-color:#6d5635;
    background:linear-gradient(180deg,#17120d,#050505);
}

.current-bet{color:#ffd65a;}

.btn-small{
    border-color:#7b684b;
    background:linear-gradient(180deg,#3c3429,#17130f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}

.spin-button{
    min-width:150px;
    background:linear-gradient(180deg,#f0c84a 0%,#b8790c 52%,#6c3904 100%);
    border:2px solid #ffe28a;
    color:#1b1003;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    box-shadow:0 4px 0 #4d2803,0 0 20px rgba(255,183,0,.2),inset 0 1px 0 #fff0a8;
}

.spin-button:active:not(:disabled){box-shadow:0 0 0 #4d2803,0 0 12px rgba(255,183,0,.2);}

.win-popup{
    border:3px solid #f0c94f;
    background:radial-gradient(circle at 50% 20%,rgba(93,59,14,.98),rgba(4,4,4,.99) 65%);
    box-shadow:0 0 40px rgba(255,192,0,.35),inset 0 0 25px #000;
}

.win-popup h2{color:#ffd54f;}

@media(max-width:500px){
    .game-wrapper{padding:7px;border-radius:17px;}
    .game-wrapper::before{letter-spacing:1.5px;font-size:8px;}
    .symbol-cell{height:61px;font-size:1.8em;}
    .spin-button{min-width:135px;}
}
'''
          if 'TESOURO PIRATA — CAMADA VISUAL PREMIUM' not in s:
              s = s.replace('</style>', premium_css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          print('Tesouro Pirata patched successfully')
          print('PAYOUTS now:', new_payouts)

      - name: Verify critical rules
        run: |
          grep -n "'🏴‍☠️': 2.00" jogos/tesouro-pirata.html
          grep -n "TESOURO PIRATA — CAMADA VISUAL PREMIUM" jogos/tesouro-pirata.html
          grep -n "SistemaSaldo" jogos/tesouro-pirata.html | head

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/tesouro-pirata.html
          git diff --cached --quiet || git commit -m "Fix Tesouro Pirata payouts and premium UI"
          git push
