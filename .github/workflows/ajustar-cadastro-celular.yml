<label>E-mail</label>
<input id="emailLogin" type="email" placeholder="Digite seu e-mail" required>
<label>Senha</label>'''
          new_login = '''<form id="formLogin" class="form" onsubmit="entrar(event)">

<label>Celular</label>
<input id="telefoneLogin" type="tel" inputmode="tel" autocomplete="tel" placeholder="Digite seu número de celular" required>
<label>Senha</label>'''

          old_forgot = '''
<button type="button" class="esqueci" onclick="mostrarRecuperacao()">
