          old_cadastro_fn = '''async function cadastrar(event){
    event.preventDefault();

    const nome=
        document.getElementById(
            "nomeCadastro"
        ).value.trim();
    const email=
        document.getElementById(
            "emailCadastro"
        ).value.trim();

