    }catch(error){

        mensagem(
            "mensagemCadastro",
            traduzirErro(error.message),
            "erro"
        );
    }

    botao.disabled=false;
    botao.innerText="CRIAR CONTA";
}'''

          new_cadastro_fn = '''async function cadastrar(event){
    event.preventDefault();

    const nome=document.getElementById("nomeCadastro").value.trim();
    const telefoneDigitado=document.getElementById("telefoneCadastro").value.trim();
    const senha=document.getElementById("senhaCadastro").value;
    const confirmar=document.getElementById("confirmarSenha").value;
    const botao=document.getElementById("btnCadastro");

    if(senha!==confirmar){
        mensagem("mensagemCadastro","As senhas não são iguais.","erro");
        return;
    }

    if(senha.length<6){
        mensagem("mensagemCadastro","A senha precisa ter pelo menos 6 caracteres.","erro");
        return;
    }

    if(!telefoneDigitado){
        mensagem("mensagemCadastro","Digite seu número de celular.","erro");
        return;
    }

    const telefoneNumeros=telefoneDigitado.replace(/\D/g,"");
    let telefone=telefoneDigitado.replace(/\s+/g,"");

    if(telefone.startsWith("+")){
        telefone="+"+telefone.replace(/\D/g,"");
    }else if(telefoneNumeros.length===10 || telefoneNumeros.length===11){
        telefone="+55"+telefoneNumeros;
    }else{
        mensagem("mensagemCadastro","Digite um celular válido com DDD.","erro");
        return;
    }

    botao.disabled=true;
    botao.innerText="CRIANDO CONTA...";

    try{
        const {data,error}=await clienteSupabase().auth.signUp({
            phone:telefone,
            password:senha,
            options:{
                data:{
                    nome,
                    full_name:nome,
                    telefone,
                    phone:telefone
                }
            }
        });

        if(error)throw error;

        if(data?.session){
            sessionStorage.removeItem("apostaxbet_logout");
            mensagem("mensagemCadastro","Conta criada com sucesso! Entrando...","sucesso");
            setTimeout(()=>mostrarSite(data.session.user),500);
        }else{
            mensagem("mensagemCadastro","Conta criada, mas o Supabase não liberou a sessão automática. Verifique se a confirmação de telefone está desativada.","erro");
        }

    }catch(error){
        mensagem("mensagemCadastro",traduzirErro(error?.message||error),"erro");
    }

    botao.disabled=false;
    botao.innerText="CRIAR CONTA";
}'''

