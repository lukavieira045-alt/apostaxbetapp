                        phone:telefone,
                        cpf:cpfNumeros
                    }
                }
            });

        if(error)throw error;

        if(data.session){
            sessionStorage.removeItem(
                "apostaxbet_logout"
            );

            mensagem(
                "mensagemCadastro",
