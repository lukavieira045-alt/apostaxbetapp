name: Ajustar cadastro e login para celular

on: push

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracao
        run: python3 .github/scripts/patch_auth.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mudar cadastro e login para celular"
          git push
