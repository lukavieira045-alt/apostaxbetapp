name: Ajustar cadastro e login para celular

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Alterar autenticacao
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_form = '''<form id="formCadastro" class="form active" onsubmit="cadastrar(event)">

