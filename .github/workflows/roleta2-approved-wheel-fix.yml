name: Corrigir Roleta 2 - manter roda premium aprovada
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar somente Roleta 2 para a versão premium aprovada
        run: git checkout 1b4a507638556010561d5792739d96ab7964f443 -- jogos/roleta2.html
      - name: Remover segundo giro sem mexer na lógica do jogo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta2.html')
          s=p.read_text()
          old='''        iniciarSomRoleta();\n        const voltas=10;\n        const grausFinais=(voltas*360)+anguloFinal;\n        const animacaoBola=bola.animate([\n            {transform:`translate(-50%,-50%) rotate(0deg) translateY(-${raioBola}px)`,opacity:1},\n            {transform:`translate(-50%,-50%) rotate(${grausFinais*.08}deg) translateY(-${raioBola}px)`,opacity:1},\n            {transform:`translate(-50%,-50%) rotate(${grausFinais*.35}deg) translateY(-${raioBola}px)`,opacity:1},\n            {transform:`translate(-50%,-50%) rotate(${grausFinais*.72}deg) translateY(-${raioBola}px)`,opacity:1},\n            {transform:`translate(-50%,-50%) rotate(${grausFinais*.92}deg) translateY(-${raioBola}px)`,opacity:1},\n            {transform:`translate(-50%,-50%) rotate(${grausFinais}deg) translateY(-${raioBola}px)`,opacity:1}\n        ],{duration:10000,easing:"cubic-bezier(.08,.02,.12,1)",fill:"forwards"});\n        \n        mensagemEl.textContent=" A bolinha está girando...";\n        mensagemEl.className="mensagem";\n        await animacaoBola.finished;\n        \n        bola.style.opacity="1";bola.style.visibility="visible";bola.style.display="block";\n        bola.style.transform=`translate(-50%,-50%) rotate(${grausFinais}deg) translateY(-${raioBola}px)`;\n        pararSomRoleta();\n        await new Promise(resolve=>setTimeout(resolve,500));\n        '''
          new='''        // O giro visual ja foi iniciado pelo unico hook .spin-real no clique.\n        // Nao existe uma segunda animacao da bola apos a contagem regressiva.\n        pararSomRoleta();\n        await new Promise(resolve=>setTimeout(resolve,100));\n        '''
          if old not in s:
              raise SystemExit('Bloco da segunda animacao nao encontrado na versao aprovada')
          s=s.replace(old,new,1)
          s=s.replace('intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)','intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},240)',1)
          old_hook="setTimeout(function(){r.classList.remove('spin-real');b&&b.classList.remove('spin-real')},10100)"
          new_hook="setTimeout(function(){r.classList.remove('spin-real');b&&b.classList.remove('spin-real');pararSomRoleta()},10000)"
          if old_hook not in s:
              raise SystemExit('Hook visual aprovado nao encontrado')
          s=s.replace(old_hook,new_hook,1)
          p.write_text(s)
          print('OK: roda premium restaurada, segunda animacao removida e som suavizado')
          PY
      - name: Validar sem alterar logica de apostas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('jogos/roleta2.html').read_text()
          assert 'const voltas=10' not in s
          assert 'animacaoBola' not in s
          assert '.roleta.spin-real' in s
          assert '.bola.spin-real' in s
          assert 'function debitar(' in s
          assert 'function creditar(' in s
          assert 'function finalizarRodada(' in s
          print('VALIDADO')
          PY
      - name: Commitar somente Roleta 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Roleta 2: manter roda premium e usar giro unico'
          git push