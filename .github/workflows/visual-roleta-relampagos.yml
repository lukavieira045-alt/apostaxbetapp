name: Aplicar visual premium Roleta de Relampagos
on:
  push:
    paths:
      - 'jogos/roleta.html'
      - '.github/workflows/visual-roleta-relampagos.yml'
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar camada visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta.html')
          s=p.read_text()
          marker='/* APOSTAXBET PREMIUM RELAMPAGOS V2 */'
          if marker in s:
              print('Camada visual ja aplicada.')
              raise SystemExit(0)
          css=r'''<style>
          /* APOSTAXBET PREMIUM RELAMPAGOS V2 */
          :root{--gold:#f4d77b;--gold2:#9d7125;--green:#13b86d;--green2:#063b27;--red:#c52f3e;--black:#030605}
          html,body{min-height:100%;background:#020403!important}
          body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;background:radial-gradient(circle at 50% 18%,#173b2c 0,#08150f 24%,#030706 58%,#010202 100%)!important;color:#fff!important;overflow-x:hidden!important}
          body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(circle at 15% 25%,rgba(24,208,126,.12),transparent 25%),radial-gradient(circle at 85% 35%,rgba(247,211,109,.09),transparent 24%),linear-gradient(120deg,transparent 0 48%,rgba(255,255,255,.018) 49%,transparent 50%);}
          body:after{content:"";position:fixed;left:50%;top:55px;width:760px;height:760px;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(244,215,123,.06);box-shadow:0 0 140px rgba(19,184,109,.06);pointer-events:none;z-index:-1}
          .topo{height:72px!important;padding:0 18px!important;background:linear-gradient(180deg,#161c19,#070a09)!important;border-bottom:1px solid rgba(244,215,123,.42)!important;box-shadow:0 10px 35px #000!important}
          .topo:before{content:"ROULETA LIVE";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:6px;color:#647068;letter-spacing:4px;font-weight:800}
          .logo{font-size:16px!important;letter-spacing:3px!important;color:#fff0a9!important;text-shadow:0 0 18px rgba(244,215,123,.22)!important}
          .logo:before{content:"⚡";color:#f5d66f;margin-right:7px;font-size:13px}
          .saldo-topo{padding:7px 12px!important;min-width:112px!important;border:1px solid rgba(244,215,123,.35)!important;border-radius:11px!important;background:linear-gradient(145deg,#161c19,#070a09)!important;box-shadow:inset 0 1px rgba(255,255,255,.06),0 5px 18px #000!important}
          .saldo-label{font-size:7px!important;letter-spacing:2px!important;color:#747d77!important}.saldo-topo #displaySaldo{font-size:16px!important;color:#ffe48c!important}
          .container{max-width:900px!important;padding:24px 12px 90px!important}
          .lobby{position:fixed!important;top:88px!important;left:12px!important;width:76px!important;height:42px!important;border:1px solid rgba(244,215,123,.38)!important;border-radius:10px!important;background:linear-gradient(180deg,#171e1a,#050807)!important;box-shadow:0 8px 22px #000!important;font-size:9px!important;letter-spacing:1px!important;z-index:80!important}.lobby-icon{font-size:16px!important}
          .titulo{margin-top:4px!important;font-size:21px!important;letter-spacing:5px!important;color:#f6dc83!important;text-shadow:0 4px 20px #000,0 0 24px rgba(244,215,123,.18)!important}
          .subtitulo{margin:8px 0 18px!important;font-size:8px!important;letter-spacing:3px!important;color:#748078!important}
          .roleta-area{width:min(94vw,650px)!important;padding:42px!important;margin:0 auto 16px!important;border-radius:50%!important;background:radial-gradient(circle,rgba(255,255,255,.025),transparent 64%)!important;filter:drop-shadow(0 28px 40px rgba(0,0,0,.95))!important}
          .roleta-area:before{content:"";position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(244,215,123,.16);box-shadow:0 0 0 9px rgba(0,0,0,.22),0 0 100px rgba(0,0,0,.85),inset 0 0 80px rgba(0,0,0,.6);pointer-events:none}
          .roleta-area:after{content:"⚡  APOSTAXBET  ⚡";position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:4px;color:#8b7541;white-space:nowrap;text-shadow:0 0 12px rgba(244,215,123,.35)}
          .roleta{width:min(82vw,510px)!important;height:min(82vw,510px)!important;border:12px solid #d8b75e!important;background:radial-gradient(circle at 50% 45%,#234a3c 0 12%,#07110d 13% 22%,#050907 23% 100%)!important;box-shadow:0 0 0 2px #60451c,0 0 0 6px rgba(244,215,123,.09),0 28px 55px rgba(0,0,0,.95),0 0 85px rgba(244,215,123,.12),inset 0 0 65px #000!important}
          .roleta:before{inset:7px!important;border:18px solid #09100d!important;box-shadow:inset 0 0 18px #000,0 0 0 1px #705222!important}
          .roleta:after{inset:25px!important;background:repeating-conic-gradient(from -9deg,rgba(255,239,160,.95) 0deg 1deg,transparent 1deg 18deg)!important;opacity:.72!important}
          .roleta-inner{inset:34px!important;background:repeating-conic-gradient(#0b3b2b 0deg 9deg,#17634a 9deg 18deg)!important;box-shadow:inset 0 0 70px #000,inset 0 0 18px rgba(244,215,123,.32)!important}
          .roleta-inner:before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(255,226,133,.14);box-shadow:inset 0 0 35px #000}
          .roleta-inner:after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed rgba(255,255,255,.07)}
          .numero{width:60px!important;height:198px!important;margin-left:-30px!important;margin-top:-198px!important;transform-origin:30px 198px!important}
          .numero-conteudo{top:8px!important;min-width:55px!important;padding:6px 4px!important;border-radius:8px!important;background:linear-gradient(180deg,rgba(5,15,11,.9),rgba(4,7,6,.38))!important;border:1px solid rgba(255,233,151,.12)!important;color:#fff4bf!important;font-size:12px!important;line-height:14px!important;text-shadow:0 2px 4px #000,0 0 8px rgba(255,222,104,.45)!important;transition:all .18s ease!important}
          .numero:hover .numero-conteudo{transform:scale(1.14)!important;border-color:#f4d77b!important;background:linear-gradient(180deg,rgba(244,215,123,.28),rgba(4,10,7,.5))!important;box-shadow:0 0 20px rgba(244,215,123,.35)!important}
          .numero.perdeu .numero-conteudo{background:linear-gradient(180deg,rgba(139,21,32,.82),rgba(46,5,9,.45))!important;border-color:rgba(255,86,101,.55)!important;color:#ffb0b7!important}
          .numero.super-bonus .numero-conteudo{background:linear-gradient(180deg,#b77e17,#4e2800)!important;border-color:#ffe38a!important;color:#fff!important;box-shadow:0 0 25px rgba(255,178,24,.5),inset 0 0 12px rgba(255,239,150,.16)!important;font-size:10px!important}
          .numero.destaque .numero-conteudo{transform:scale(1.22)!important;background:linear-gradient(180deg,#ffe58a,#c97818)!important;border-color:#fff6bf!important;color:#fff!important;box-shadow:0 0 30px #ffe06c,0 0 60px rgba(255,143,0,.35)!important}
          .centro{width:112px!important;height:112px!important;background:radial-gradient(circle at 35% 25%,#4b6257,#0b1b14 54%,#010302 100%)!important;border:4px solid #e5c46c!important;box-shadow:0 0 0 3px #64491c,0 0 0 8px rgba(244,215,123,.06),0 0 35px rgba(244,215,123,.38),inset 0 0 30px #000!important}
          .centro:before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(255,240,177,.2)}
          .centro strong{font-size:28px!important;letter-spacing:6px!important;color:#ffe798!important}.centro span{font-size:7px!important;letter-spacing:4px!important;color:#adb8b0!important}
          .ponteiro{top:0!important;border-left:18px solid transparent!important;border-right:18px solid transparent!important;border-top:36px solid #fff!important;filter:drop-shadow(0 2px 3px #000) drop-shadow(0 0 13px #ffe48a)!important}
          .raio{height:3px!important;background:linear-gradient(90deg,transparent,#fff,#d8ffe8,transparent)!important;box-shadow:0 0 8px #fff,0 0 22px #a8ffd1!important}
          .resultado{max-width:570px!important;min-height:84px!important;margin:4px auto 9px!important;padding:13px!important;border-radius:13px!important;border:1px solid rgba(244,215,123,.3)!important;background:linear-gradient(145deg,rgba(20,29,24,.98),rgba(3,7,5,.98))!important;box-shadow:0 15px 32px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.05)!important;font-size:18px!important;line-height:24px!important;text-shadow:0 2px 7px #000!important}.resultado:before{content:"RESULTADO DA RODADA";display:block;margin-bottom:4px;color:#68736c;font-size:6px;letter-spacing:3px}
          .contagem{max-width:570px!important;margin:9px auto 14px!important;padding:10px 15px!important;border-radius:9px!important;border:1px solid rgba(244,215,123,.25)!important;background:linear-gradient(180deg,#0d1511,#040706)!important;box-shadow:inset 0 1px rgba(255,255,255,.04),0 8px 18px #000!important;color:#e9cf76!important;font-size:10px!important;letter-spacing:1.6px!important}.contagem strong{font-size:25px!important;margin:0 5px;color:#fff!important}.contagem.encerrada{border-color:rgba(255,68,82,.4)!important;background:linear-gradient(180deg,#1a0b0e,#060304)!important;color:#ff8c96!important}
          .painel{max-width:570px!important;margin:0 auto!important;padding:19px!important;border-radius:16px!important;border:1px solid rgba(244,215,123,.42)!important;background:linear-gradient(145deg,#151d18,#080d0a 62%,#030504)!important;box-shadow:0 22px 48px rgba(0,0,0,.85),inset 0 1px rgba(255,255,255,.055),inset 0 0 35px rgba(244,215,123,.035)!important}
          .painel:before{content:"PAINEL DE APOSTAS  •  ROLETE DE RELAMPAGOS";display:block;text-align:center;margin:-2px 0 13px;color:#78847c;font-size:7px;letter-spacing:2.3px;font-weight:800}
          .ficha-area{height:66px!important;margin-bottom:10px!important;border-radius:11px!important;border:1px solid rgba(255,255,255,.07)!important;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.3))!important;box-shadow:inset 0 0 22px #000!important}
          .ficha{width:54px!important;height:54px!important;background:radial-gradient(circle at 33% 25%,#fff,#d6d6d6 26%,#8c8c8c 38%,#d7a92d 40%,#f3d56c 65%,#77500c 100%)!important;border:2px solid #fff2bd!important;box-shadow:0 7px 17px #000,0 0 15px rgba(244,215,123,.18),inset 0 0 0 2px rgba(255,255,255,.28)!important;color:#201600!important;text-shadow:none!important}.ficha.selecionada{outline:2px solid #ffe78c!important;outline-offset:4px;transform:scale(1.13)!important;box-shadow:0 0 30px rgba(255,218,91,.7),0 8px 18px #000!important}
          .valores{gap:9px!important;margin-bottom:11px!important}.btn-valor{height:47px!important;border-radius:9px!important;border:1px solid #4e544e!important;background:linear-gradient(180deg,#19211c,#070a09)!important;color:#a8b0aa!important;font-weight:900!important;box-shadow:inset 0 1px rgba(255,255,255,.05)!important;transition:.18s ease!important}.btn-valor:hover{transform:translateY(-2px)!important;border-color:#d2ae50!important;color:#fff0a9!important}.btn-valor.ativo{background:linear-gradient(180deg,#4b3b12,#171105)!important;border-color:#f1d26d!important;color:#ffe89a!important;box-shadow:0 0 20px rgba(244,215,123,.23),inset 0 1px rgba(255,255,255,.1)!important}
          .btn-apostar{height:62px!important;margin-top:10px!important;border-radius:10px!important;border:1px solid #73e0a9!important;background:linear-gradient(180deg,#1cc77c,#087c4c 55%,#044a30)!important;color:#fff!important;font-size:17px!important;font-weight:950!important;letter-spacing:2.5px!important;box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 22px rgba(19,184,109,.18),inset 0 1px rgba(255,255,255,.2)!important}.btn-apostar:not(:disabled):hover{transform:translateY(-2px)!important;box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 28px rgba(19,184,109,.32)!important}.btn-apostar:disabled{filter:grayscale(.25)!important;opacity:.5!important}
          .info{margin-top:11px!important;padding:9px 11px!important;border-radius:8px!important;background:rgba(0,0,0,.24)!important;border:1px solid rgba(255,255,255,.04)!important;color:#929b95!important}.info strong{color:#ffe18a!important}.mensagem{font-size:7px!important;letter-spacing:1.5px!important;color:#5f6a63!important}
          .repeat-btn,.menu-btn{bottom:17px!important;width:55px!important;height:55px!important;border-radius:50%!important;border:1px solid rgba(244,215,123,.42)!important;background:linear-gradient(145deg,#18201b,#050807)!important;box-shadow:0 10px 25px #000!important;color:#ffe596!important}.repeat-btn{left:10px!important}.menu-btn{right:10px!important}
          #carregando{background:radial-gradient(circle,#10251b,#020403 65%)!important;color:#ffe38a!important;font-weight:900!important;letter-spacing:2px!important}
          .superbonus-overlay{background:radial-gradient(circle,rgba(255,222,90,.5),rgba(255,159,0,.16) 28%,rgba(0,0,0,.97) 72%)!important}.superbonus-titulo{font-size:40px!important;letter-spacing:5px!important}.superbonus-valor{font-size:58px!important}
          @media(max-width:600px){.container{padding-top:18px!important}.titulo{font-size:16px!important;letter-spacing:3px!important}.roleta-area{padding:28px!important}.roleta{width:min(84vw,390px)!important;height:min(84vw,390px)!important;border-width:9px!important}.numero{width:48px!important;height:150px!important;margin-left:-24px!important;margin-top:-150px!important;transform-origin:24px 150px!important}.numero-conteudo{min-width:45px!important;font-size:10px!important;padding:4px 2px!important}.centro{width:82px!important;height:82px!important}.centro strong{font-size:20px!important}.roleta-inner{inset:27px!important}.roleta:before{inset:6px!important;border-width:13px!important}.roleta:after{inset:21px!important}.painel,.resultado,.contagem{max-width:calc(100vw - 20px)!important}.lobby{top:84px!important;width:68px!important}.saldo-topo{min-width:98px!important}}
          @media(max-width:360px){.roleta{width:310px!important;height:310px!important}.numero{width:42px!important;height:123px!important;margin-left:-21px!important;margin-top:-123px!important;transform-origin:21px 123px!important}.numero-conteudo{min-width:39px!important;font-size:8px!important;padding:3px 1px!important;line-height:10px!important}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)
          print('Camada visual premium aplicada.')
          PY
      - name: Commitar alteracao
        run: |
          git config user.name 'ApostaXBet Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add jogos/roleta.html
          git diff --cached --quiet && exit 0
          git commit -m 'refine visual da roleta de relampagos'
          git push
