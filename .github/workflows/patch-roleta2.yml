name: Patch Roleta 2
on:
  push:
    paths:
      - 'jogos/performance.js'
      - '.github/workflows/patch-roleta2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bust performance.js on Roleta 2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="performance.js" defer></script>'
          new='<script src="performance.js?v=roleta2-20260905" defer></script>'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet || git commit -m 'fix: invalidar cache da animacao da Roleta 2'
          git push