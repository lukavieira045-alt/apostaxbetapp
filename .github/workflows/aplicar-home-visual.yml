name: Aplicar melhoria visual na home
on:
  push:
    paths:
      - '.github/workflows/aplicar-home-visual.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir bloco visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- APOSTAXBET HOME EXTRA V1 -->'
          if marker not in s:
              block = r'''<!-- APOSTAXBET HOME EXTRA V1 -->
          <style>
          .apostaxbet-home-extra{margin:14px 15px 18px;padding:18px 12px 14px;border:1px solid rgba(250,204,21,.28);border-radius:16px;background:linear-gradient(135deg,rgba(20,90,56,.72),rgba(7,42,26,.72));box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:center;overflow:hidden;position:relative}
          .apostaxbet-home-extra:before{content:'✦  ✧  ✦  ✧  ✦';position:absolute;left:0;right:0;top:7px;color:rgba(250,204,21,.25);font-size:11px;letter-spacing:7px;animation:axExtraBrilho 2.8s ease-in-out infinite;pointer-events:none}
          .apostaxbet-home-extra h2{position:relative;margin:4px 0 5px;color:#facc15;font-size:18px;font-weight:900;text-shadow:0 0 9px rgba(250,204,21,.3)}
          .apostaxbet-home-extra p{position:relative;margin:0 0 12px;color:#bbf7d0;font-size:12px}
          .ax-extra-cards{position:relative;display:flex;gap:8px;justify-content:center}
          .ax-extra-card{flex:1;min-width:0;padding:9px 5px;border:1px solid rgba(34,197,94,.45);border-radius:11px;background:rgba(0,0,0,.18)}
          .ax-extra-card b{display:block;color:#fff;font-size:11px;margin-top:3px}
          .ax-extra-card span{display:block;color:#86efac;font-size:9px;margin-top:2px}
          .ax-extra-resp{position:relative;margin-top:11px;color:rgba(255,255,255,.58);font-size:9px}
          @keyframes axExtraBrilho{0%,100%{opacity:.25;transform:translateX(-5px)}50%{opacity:.75;transform:translateX(5px)}}
          @media(max-width:420px){.apostaxbet-home-extra{margin-left:10px;margin-right:10px;padding-left:8px;padding-right:8px}.apostaxbet-home-extra h2{font-size:16px}.ax-extra-card{padding:8px 3px}.ax-extra-card b{font-size:10px}}
          </style>
          <section class="apostaxbet-home-extra" aria-label="Experiência ApostaXBet">
            <h2>✨ SUA EXPERIÊNCIA APOSTAXBET</h2>
            <p>Explore os jogos e encontre seu próximo favorito</p>
            <div class="ax-extra-cards">
              <div class="ax-extra-card"><div>🎰</div><b>JOGOS</b><span>Vários estilos</span></div>
              <div class="ax-extra-card"><div>⚡</div><b>RÁPIDOS</b><span>Entre e jogue</span></div>
              <div class="ax-extra-card"><div>💎</div><b>DESTAQUES</b><span>Confira as novidades</span></div>
            </div>
            <div class="ax-extra-resp">🔞 Jogue com responsabilidade • Divirta-se</div>
          </section>
          <!-- /APOSTAXBET HOME EXTRA V1 -->'''
              if '</body>' not in s:
                  raise SystemExit('index.html sem </body>')
              s = s.replace('</body>', block + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Adiciona elementos visuais leves na home'
          git push