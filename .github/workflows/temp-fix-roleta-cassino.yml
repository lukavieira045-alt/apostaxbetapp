name: Fix only Roleta Cassino
on:
  push:
    paths:
      - '.github/workflows/temp-fix-roleta-cassino.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path='jogos/roleta-cassino.html';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            let s=Buffer.from(data.content,'base64').toString('utf8');
            s=s.replace(/typeof window\.SistemaSaldo\.creditar === \\\"function\\\"/g,'typeof window.SistemaSaldo.processarVitoria === \\\"function\\\"');
            const old=/const creditado\s*=\s*await window\.SistemaSaldo\.creditar\(\s*premioFinal\s*\);/;
            const neu=`const totalApostado = apostas.reduce((total, aposta) => total + Number(aposta.valor || 0), 0);\n        const multiplicadorPremio = totalApostado > 0 ? premioFinal / (totalApostado * 0.95) : 0;\n        const creditado = totalApostado > 0 ? await window.SistemaSaldo.processarVitoria(totalApostado, multiplicadorPremio) : 0;`;
            if(!old.test(s)) core.setFailed('Bloco de crédito da Roleta Cassino não encontrado');
            s=s.replace(old,neu);
            const content=Buffer.from(s).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Corrige abertura da Roleta Cassino',content,sha:data.sha,branch:'main'});
      - uses: actions/github-script@v7
        with:
          script: |
            const path='.github/workflows/temp-fix-roleta-cassino.yml';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            await github.rest.repos.deleteFile({owner:context.repo.owner,repo:context.repo.repo,path,message:'Remove workflow temporário da Roleta Cassino',sha:data.sha,branch:'main'});