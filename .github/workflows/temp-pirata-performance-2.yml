name: Optimize only Tesouro Pirata 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize Pirata only
        shell: python
        run: |
          from pathlib import Path
          p = Path('jogos/tesouro-pirata.html')
          s = p.read_text(encoding='utf-8')
          old = '.lobby-strip.lobby-spinning .cel img,.lobby-strip.lobby-spinning .letra{filter:blur(2px) brightness(1.15)}'
          if old in s:
              s = s.replace(old, '')
          anchor = '.cel img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 5px 4px #000)}'
          replacement = anchor + '.lobby-strip .cel img{filter:none!important}'
          if '.lobby-strip .cel img{filter:none!important}' not in s and anchor in s:
              s = s.replace(anchor, replacement, 1)
          old_make = "const img=document.createElement('img');img.src=AS[s];img.alt=s==='treasure'?'Tesouro':'Pirata';"
          new_make = "const img=document.createElement('img');img.decoding='async';img.loading='eager';img.src=AS[s];img.alt=s==='treasure'?'Tesouro':'Pirata';"
          if old_make in s and "img.decoding='async'" not in s:
              s = s.replace(old_make, new_make, 1)
          preload = "Object.values(AS).forEach(src=>{const im=new Image();im.decoding='async';im.src=src});"
          if preload not in s:
              s = s.replace("function init(){", preload + "function init(){", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit Pirata-only change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temp-pirata-performance-2.yml
          git add jogos/tesouro-pirata.html .github/workflows/temp-pirata-performance-2.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Otimiza renderizacao do Tesouro Pirata no celular'
          git push origin main
