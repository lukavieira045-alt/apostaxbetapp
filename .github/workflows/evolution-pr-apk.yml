name: Evolution PR APK
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  build-evolution-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Evolution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Apply safe Evolution fixes
        working-directory: evolution-native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evolution/ai/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('private const val MODEL_URL = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true"','private const val MODEL_URL = "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"')
          s=s.replace('private const val MODEL = "Qwen3-4B-Q4_K_M.gguf"','private const val MODEL = "Qwen3-1.7B-Q4_K_M.gguf"')
          s=s.replace('modelFile.length() < 2_000_000_000L','modelFile.length() < 1_000_000_000L')
          s=s.replace('QWEN3-4B','QWEN3-1.7B')
          s=s.replace('text = "🎙"','text = "FALAR"')
          s=s.replace('text = "➤"','text = "ENVIAR"')
          s=s.replace('hint = "Converse com a Evolution..."','hint = "Escreva para a Evolution..."')
          old='''val research = q.length >= 18 && !conversational && (
            Regex("\\\\b(pesquise|pesquisa|procure|pesquisar|busque|buscar|atual|agora|hoje|notícia|noticias|últimas|último|última|preço atual|quanto está|fonte|fontes|recentemente)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q) ||
            Regex("^(quem|qual|quais|o que|como|por que|porque|quando|onde)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        )'''
          new='''val explicitSearch = Regex("^\\\\s*(pesquisar|pesquise|pesquisa|procure|buscar|busque)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        val research = !conversational && (explicitSearch || (q.length >= 18 && (
            Regex("\\\\b(pesquise|pesquisa|procure|pesquisar|busque|buscar|atual|agora|hoje|notícia|noticias|últimas|último|última|preço atual|quanto está|fonte|fontes|recentemente)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q) ||
            Regex("^(quem|qual|quais|o que|como|por que|porque|quando|onde)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        )))'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build NEW APK
        working-directory: evolution-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify NEW APK
        run: |
          test -s evolution-native/app/build/outputs/apk/debug/app-debug.apk
          stat -c '%n %s bytes %y' evolution-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-native-apk-final
          path: evolution-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
