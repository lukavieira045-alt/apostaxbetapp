name: Ajuste profissional da Roleta 2
on:
  push:
    paths:
      - '.github/workflows/ajuste-roleta2-profissional.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Melhorar somente roda e som
        shell: python
        run: |
          from pathlib import Path
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          marker='ApostaXBet — Roleta 2 Professional Wheel v2'
          if marker in s: raise SystemExit('Ajuste ja aplicado')
          css=r'''
/* ApostaXBet — Roleta 2 Professional Wheel v2 */
.roleta{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 38%),repeating-radial-gradient(circle at 50% 50%,#6f3b12 0 3px,#8f521d 3px 6px,#5a2d0d 6px 9px),linear-gradient(135deg,#3a1c08,#8c4c18 48%,#351706);border:18px solid #251208;box-shadow:0 0 0 3px #8f6a2b,0 0 0 7px #d7b65b,0 0 0 10px #4a2a0d,0 18px 35px rgba(0,0,0,.78),0 0 55px rgba(215,166,58,.22),inset 0 0 22px #080301}
.roleta::before{inset:18px;background:repeating-conic-gradient(from -4.865deg,transparent 0deg 9.38deg,rgba(255,235,170,.72) 9.38deg 9.73deg),repeating-conic-gradient(#c92822 0deg 9.73deg,#101010 9.73deg 19.46deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 7px #3a1b08,inset 0 0 28px rgba(0,0,0,.92),0 0 12px rgba(0,0,0,.75)}
.roleta::after{content:"";position:absolute;inset:76px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(44,20,6,.62) 0deg 1deg,transparent 1deg 10deg),radial-gradient(circle at 35% 28%,#b66b28 0%,#6e350e 42%,#3d1b08 73%,#1c0a03 100%);border:7px solid #c28a35;box-shadow:inset 0 0 20px #140701,inset 0 0 0 2px rgba(255,225,150,.55),0 0 0 3px #4b2a0d;z-index:1;pointer-events:none}
.numero-roleta{z-index:4}.numero-roleta span{width:38px;height:46px;margin-left:-19px;margin-top:-23px;border:1px solid rgba(255,220,150,.42);border-radius:5px 5px 8px 8px;box-shadow:inset 0 0 7px rgba(0,0,0,.62),0 1px 3px rgba(0,0,0,.65);font-size:16px;font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.95)}
.numero-roleta span:nth-child(1){background:linear-gradient(180deg,#0d9d51,#045a2d)}.numero-roleta span:nth-child(even){background:linear-gradient(180deg,#e23830,#8d1713)}.numero-roleta span:nth-child(odd):not(:first-child){background:linear-gradient(180deg,#292929,#080808)}
.roleta-centro{width:138px;height:138px;border:9px solid #a86f20;background:radial-gradient(circle at 34% 24%,#fff0b0 0%,#d8a340 18%,#9b6419 39%,#563007 63%,#1c0c02 100%);box-shadow:inset 0 0 0 3px rgba(255,228,160,.35),inset 0 -13px 20px rgba(20,7,0,.75),0 0 0 4px #3a2009,0 7px 15px rgba(0,0,0,.8);z-index:6}.roleta-centro::before{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff9dc,#d8a43c 45%,#6d400d 72%,#211003);border:4px solid #6e4310;box-shadow:inset 0 0 7px rgba(0,0,0,.85),0 2px 5px #000}
.bola{width:21px;height:21px;box-shadow:0 0 4px #fff,0 0 10px rgba(255,255,255,.7),inset -3px -3px 4px rgba(0,0,0,.35),inset 2px 2px 3px #fff;z-index:9}.roleta-area::before{top:calc(50% - 288px);border-top-color:#f7d56a;border-left-width:12px;border-right-width:12px;border-top-width:27px;filter:drop-shadow(0 2px 3px #000) drop-shadow(0 0 4px rgba(255,215,100,.4))}
@media(max-width:650px){.roleta{border-width:13px}.roleta::before{inset:13px}.roleta::after{inset:53px;border-width:5px}.numero-roleta span{width:30px;height:38px;margin-left:-15px;margin-top:-19px;font-size:13px}.roleta-centro{width:92px;height:92px;border-width:7px}.roleta-centro::before{width:28px;height:28px;border-width:3px}.bola{width:17px;height:17px}}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          sound=r'''<script>
/* ApostaXBet — Roleta 2 Professional Spin Sound v2 */
function iniciarSomRoleta(){try{if(somRoletaAtivo)return;somRoletaAtivo=true;audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const n=audioContext.currentTime,m=audioContext.createGain();m.gain.setValueAtTime(.0001,n);m.gain.exponentialRampToValueAtTime(.045,n+.12);m.gain.exponentialRampToValueAtTime(.026,n+2);m.connect(audioContext.destination);const b=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.4;const src=audioContext.createBufferSource(),lp=audioContext.createBiquadFilter(),hp=audioContext.createBiquadFilter(),g=audioContext.createGain();src.buffer=b;src.loop=true;hp.type='highpass';hp.frequency.value=90;lp.type='lowpass';lp.frequency.value=1300;g.gain.value=.15;src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(m);src.start();window.__r2noise=src;window.__r2master=m;let p=0;clearInterval(intervaloSomRoleta);intervaloSomRoleta=setInterval(()=>{if(!somRoletaAtivo)return;const t=audioContext.currentTime,o=audioContext.createOscillator(),x=audioContext.createGain(),f=audioContext.createBiquadFilter();f.type='bandpass';f.frequency.value=1900+(p%4)*170;f.Q.value=5;o.type='triangle';o.frequency.setValueAtTime(95+(p%3)*8,t);o.frequency.exponentialRampToValueAtTime(55,t+.045);x.gain.setValueAtTime(.0001,t);x.gain.exponentialRampToValueAtTime(.07,t+.006);x.gain.exponentialRampToValueAtTime(.0001,t+.055);o.connect(f);f.connect(x);x.connect(m);o.start(t);o.stop(t+.065);p++},105)}catch(e){console.warn('Som da roleta indisponivel',e)}}
function pararSomRoleta(){try{somRoletaAtivo=false;clearInterval(intervaloSomRoleta);if(audioContext&&window.__r2master){const t=audioContext.currentTime;window.__r2master.gain.cancelScheduledValues(t);window.__r2master.gain.setTargetAtTime(.0001,t,.16);const o=window.__r2noise;setTimeout(()=>{try{o&&o.stop()}catch(e){}},650)}window.__r2noise=null;window.__r2master=null}catch(e){}}
</script>'''
          s=s.replace('</body>',sound+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar logica preservada
        run: |
          grep -q 'const TAXA_CASA = 0.30;' jogos/roleta2.html
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
      - name: Commit e limpar workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Refina roda e som profissional da Roleta 2'
          git push
          git rm .github/workflows/ajuste-roleta2-profissional.yml
          git commit -m 'Remove workflow temporario da Roleta 2'
          git push
