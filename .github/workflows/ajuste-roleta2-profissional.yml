name: Ajuste profissional da Roleta 2
on:
  workflow_run:
    workflows: [".github/workflows/fix-roleta-chip.yml"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar apenas roda e som
        shell: python
        run: |
          from pathlib import Path
          p=Path('jogos/roleta2.html'); s=p.read_text(encoding='utf-8')
          marker='ApostaXBet — Roleta 2 Professional Wheel v2'
          if marker in s: raise SystemExit('Ajuste ja aplicado')
          css=r'''/* ApostaXBet — Roleta 2 Professional Wheel v2 */
.roleta{background:radial-gradient(circle,#8a4b18 0 26%,#4a2209 27% 29%,transparent 30%),repeating-conic-gradient(#c92822 0 9.73deg,#101010 9.73deg 19.46deg);border:18px solid #241106;box-shadow:0 0 0 3px #8f6a2b,0 0 0 7px #d7b65b,0 0 0 10px #43250b,0 18px 35px rgba(0,0,0,.8),0 0 50px rgba(215,166,58,.2),inset 0 0 24px #000}
.roleta::before{inset:18px;background:repeating-conic-gradient(from -4.865deg,transparent 0 9.38deg,rgba(255,235,170,.75) 9.38deg 9.73deg),repeating-conic-gradient(#c92822 0 9.73deg,#101010 9.73deg 19.46deg);box-shadow:inset 0 0 0 3px rgba(255,240,190,.45),inset 0 0 0 7px #341805,inset 0 0 30px #000}
.roleta::after{content:"";position:absolute;inset:76px;border-radius:50%;background:repeating-conic-gradient(rgba(50,22,5,.7) 0 1deg,transparent 1deg 10deg),radial-gradient(circle at 35% 28%,#b66b28,#6b330d 48%,#2b1004 100%);border:7px solid #c28a35;box-shadow:inset 0 0 20px #140701,0 0 0 3px #4b2a0d;z-index:1}
.numero-roleta{z-index:4}.numero-roleta span{width:38px;height:46px;margin-left:-19px;margin-top:-23px;border:1px solid rgba(255,220,150,.45);border-radius:5px 5px 8px 8px;box-shadow:inset 0 0 7px #000,0 1px 3px #000;font-size:16px;font-weight:900;text-shadow:0 2px 2px #000}.numero-roleta span:nth-child(1){background:linear-gradient(#0d9d51,#045a2d)}.numero-roleta span:nth-child(even){background:linear-gradient(#e23830,#8d1713)}.numero-roleta span:nth-child(odd):not(:first-child){background:linear-gradient(#292929,#080808)}
.roleta-centro{width:138px;height:138px;border:9px solid #a86f20;background:radial-gradient(circle at 34% 24%,#fff0b0,#d8a340 20%,#9b6419 42%,#563007 67%,#1c0c02);box-shadow:inset 0 0 0 3px rgba(255,228,160,.35),inset 0 -13px 20px rgba(20,7,0,.75),0 0 0 4px #3a2009,0 7px 15px #000;z-index:6}.roleta-centro::before{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff9dc,#d8a43c 45%,#6d400d 72%,#211003);border:4px solid #6e4310;box-shadow:inset 0 0 7px #000,0 2px 5px #000}.bola{width:21px;height:21px;box-shadow:0 0 5px #fff,0 0 10px rgba(255,255,255,.7),inset -3px -3px 4px rgba(0,0,0,.35),inset 2px 2px 3px #fff;z-index:9}
@media(max-width:650px){.roleta{border-width:13px}.roleta::before{inset:13px}.roleta::after{inset:53px;border-width:5px}.numero-roleta span{width:30px;height:38px;margin-left:-15px;margin-top:-19px;font-size:13px}.roleta-centro{width:92px;height:92px;border-width:7px}.roleta-centro::before{width:28px;height:28px;border-width:3px}.bola{width:17px;height:17px}}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          sound=r'''<script>/* ApostaXBet — Roleta 2 Professional Spin Sound v2 */
function iniciarSomRoleta(){try{if(somRoletaAtivo)return;somRoletaAtivo=true;audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume?.();const t=audioContext.currentTime,m=audioContext.createGain(),src=audioContext.createBufferSource(),b=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate),d=b.getChannelData(0),lp=audioContext.createBiquadFilter(),hp=audioContext.createBiquadFilter(),ng=audioContext.createGain();for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.35;src.buffer=b;src.loop=true;hp.type='highpass';hp.frequency.value=85;lp.type='lowpass';lp.frequency.value=1250;ng.gain.value=.13;m.gain.setValueAtTime(.0001,t);m.gain.exponentialRampToValueAtTime(.045,t+.12);m.gain.exponentialRampToValueAtTime(.025,t+2);m.connect(audioContext.destination);src.connect(hp);hp.connect(lp);lp.connect(ng);ng.connect(m);src.start();window.__r2noise=src;window.__r2master=m;let i=0;clearInterval(intervaloSomRoleta);intervaloSomRoleta=setInterval(()=>{if(!somRoletaAtivo)return;const n=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain(),f=audioContext.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+(i++%5)*160;f.Q.value=5;o.type='triangle';o.frequency.setValueAtTime(90,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.065,n+.006);g.gain.exponentialRampToValueAtTime(.0001,n+.055);o.connect(f);f.connect(g);g.connect(m);o.start(n);o.stop(n+.065)},110)}catch(e){console.warn(e)}}
function pararSomRoleta(){try{somRoletaAtivo=false;clearInterval(intervaloSomRoleta);if(audioContext&&window.__r2master){const t=audioContext.currentTime;window.__r2master.gain.setTargetAtTime(.0001,t,.16);const x=window.__r2noise;setTimeout(()=>{try{x?.stop()}catch(e){}},650)}window.__r2noise=null;window.__r2master=null}catch(e){}}</script>'''
          s=s.replace('</body>',sound+'\n</body>',1); p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'ApostaXBet — Roleta 2 Professional Wheel v2' jogos/roleta2.html
          grep -q 'const TAXA_CASA = 0.30;' jogos/roleta2.html
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
      - name: Commitar alteracao
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Melhora roda e som da Roleta 2'
          git push
          git rm .github/workflows/ajuste-roleta2-profissional.yml
          git commit -m 'Remove workflow temporario da Roleta 2'
          git push