name: Corrigir Roleta 2 diretamente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir apenas giro e som
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')

          # Remove qualquer segunda animação antiga, sem tocar no cálculo do resultado.
          s=re.sub(r'iniciarSomRoleta\(\);\s*const voltas=10;.*?await animacaoBola\.finished;\s*', '', s, count=1, flags=re.S)
          s=s.replace('const voltas=10;', '')

          # Som de giro mais suave.
          s=re.sub(r"function iniciarSomRoleta\(\).*?function pararSomRoleta\(\).*?\n", """function iniciarSomRoleta(){try{iniciarAudio();clearInterval(tickTimer);tickTimer=setInterval(()=>{if(!girando)return;let now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=700+Math.random()*120;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+.07);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.075)},240)}catch(e){}}
function pararSomRoleta(){clearInterval(tickTimer);tickTimer=null}
""", s, count=1, flags=re.S)

          css='''<style id="ax-r2-single-spin">@keyframes axR2Wheel{from{transform:rotate(0deg)}to{transform:rotate(2520deg)}}@keyframes axR2Ball{from{transform:translate(-50%,-50%) translateY(-190px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-190px) rotate(-2880deg)}}.roleta.ax-r2-spin{animation:axR2Wheel 7.6s cubic-bezier(.15,.65,.20,1) both}.bola.ax-r2-spin{animation:axR2Ball 7.6s cubic-bezier(.08,.02,.12,1) both}@media(max-width:650px){.bola.ax-r2-spin{animation-name:axR2BallMobile}}@keyframes axR2BallMobile{from{transform:translate(-50%,-50%) translateY(-125px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-125px) rotate(-2880deg)}}</style>'''
          if 'id="ax-r2-single-spin"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          hook='''<script id="ax-r2-single-spin-js">window.iniciarGiroVisual=function(){const r=document.getElementById('roleta'),b=document.getElementById('bola');if(!r)return;r.classList.remove('ax-r2-spin');if(b)b.classList.remove('ax-r2-spin');void r.offsetWidth;r.classList.add('ax-r2-spin');if(b)b.classList.add('ax-r2-spin');try{iniciarSomRoleta()}catch(e){}setTimeout(()=>{try{pararSomRoleta()}catch(e){}r.classList.remove('ax-r2-spin');if(b)b.classList.remove('ax-r2-spin')},7600)};</script>'''
          if 'id="ax-r2-single-spin-js"' not in s:
              s=s.replace('</body>',hook+'</body>',1)

          # A roleta atualiza o resultado no mesmo ponto; o giro visual começa uma única vez.
          s=s.replace('const anguloFinal=indice*anguloPorNumero;', 'const anguloFinal=indice*anguloPorNumero; iniciarGiroVisual();')
          if 'iniciarGiroVisual();' in s:
              # Evita chamadas duplicadas caso já exista mais de uma injeção.
              first=s.find('iniciarGiroVisual();')
              rest=s[first+len('iniciarGiroVisual();'):].replace('iniciarGiroVisual();','')
              s=s[:first+len('iniciarGiroVisual();')]+rest

          p.write_text(s,encoding='utf-8')
          if 'animacaoBola' in s or 'const voltas=10' in s: raise SystemExit('segunda animação ainda presente')
          if 'id="ax-r2-single-spin"' not in s or 'id="ax-r2-single-spin-js"' not in s: raise SystemExit('correção não inserida')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir Roleta 2: giro unico e som suave"
          git push
