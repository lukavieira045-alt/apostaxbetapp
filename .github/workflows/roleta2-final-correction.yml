name: Corrigir Roleta 2 sem voltar versao
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, 'APLICAR ROLETA2 FINAL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar a base visual aprovada
        run: git checkout 1b4a507638556010561d5792739d96ab7964f443 -- jogos/roleta2.html
      - name: Aplicar somente giro unico e som suave
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          # Remove apenas a segunda animacao da bola apos a contagem.
          pattern=r'\s*iniciarSomRoleta\(\);\s*const voltas=10;.*?await animacaoBola\.finished;\s*\n?\s*bola\.style\.opacity="1";bola\.style\.visibility="visible";bola\.style\.display="block";\s*\n?\s*bola\.style\.transform=`translate\(-50%,-50%\) rotate\(\$\{grausFinais\}deg\) translateY\(-\$\{raioBola\}px\)`;\s*\n?\s*pararSomRoleta\(\);\s*\n?\s*await new Promise\(resolve=>setTimeout\(resolve,500\)\);'
          s,n=re.subn(pattern,'\n        // Um unico giro visual: roda e bola em sentidos opostos.\n        iniciarAudio();\n        iniciarSomRoleta();\n        roleta.classList.remove("spin-real");\n        bola.classList.remove("spin-real");\n        void roleta.offsetWidth;\n        roleta.classList.add("spin-real");\n        bola.classList.add("spin-real");\n        mensagemEl.textContent=" A roleta está girando...";\n        mensagemEl.className="mensagem";\n        await new Promise(resolve=>setTimeout(resolve,10000));\n        roleta.classList.remove("spin-real");\n        bola.classList.remove("spin-real");\n        pararSomRoleta();\n        await new Promise(resolve=>setTimeout(resolve,500));',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Bloco antigo do segundo giro nao encontrado: {n}')
          # Som mais suave, sem alterar apostas/resultados.
          s=s.replace('intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)','intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},240)',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar
        shell: bash
        run: |
          set -e
          grep -q 'spin-real' jogos/roleta2.html
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
          ! grep -q 'const voltas=10' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
          ! grep -q 'r2-one-spin' jogos/roleta2.html
      - name: Publicar e encerrar este corretor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Roleta 2: giro unico aprovado e som suave'
          git push
