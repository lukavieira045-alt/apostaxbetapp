name: Corrigir Roleta 2 sem voltar versao
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, 'TRIGGER ROLETA2 CORRECAO') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar exatamente a base visual aprovada
        run: git checkout 1b4a507638556010561d5792739d96ab7964f443 -- jogos/roleta2.html
      - name: Corrigir somente o giro duplicado
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'\s*iniciarSomRoleta\(\);\s*const voltas=10;.*?await animacaoBola\.finished;'
          replacement='''\n        iniciarAudio();\n        iniciarSomRoleta();\n        roleta.classList.remove("spin-real");\n        bola.classList.remove("spin-real");\n        void roleta.offsetWidth;\n        roleta.classList.add("spin-real");\n        bola.classList.add("spin-real");\n        mensagemEl.textContent=" A roleta está girando...";\n        mensagemEl.className="mensagem";\n        await new Promise(resolve=>setTimeout(resolve,7600));\n        roleta.classList.remove("spin-real");\n        bola.classList.remove("spin-real");\n        pararSomRoleta();'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'Segundo giro nao encontrado: {n}')
          s=s.replace('intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)','intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},240)',1)
          s=re.sub(r"\n<script>\(function\(\)\{function a\(\)\{document\.addEventListener\('click',function\(e\)\{if\(!e\.target\.closest\('\.btn-girar'\)\)return;.*?</script>\s*\n</body>", '\n</body>', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Validar
        shell: bash
        run: |
          set -e
          grep -q 'spin-real' jogos/roleta2.html
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
          ! grep -q 'const voltas=10' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
          ! grep -q "document.addEventListener('click'" jogos/roleta2.html
          ! grep -q 'r2-one-spin' jogos/roleta2.html
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Roleta 2: remover segundo giro duplicado'
          git push
