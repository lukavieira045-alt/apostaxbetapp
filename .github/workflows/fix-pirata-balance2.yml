name: fix pirate balance 2
"on": push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          css='.top{display:flex;justify-content:center;align-items:flex-start;position:relative;z-index:4}'
          css2=css+'.top-balance{position:absolute;right:14px;top:10px;z-index:6;display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid #c89b45;border-radius:7px;background:linear-gradient(#171b1c,#07090a);box-shadow:inset 0 1px #fff2,0 3px 10px #000b;color:#f4d36c;font-size:11px;font-weight:900;letter-spacing:.4px}.top-balance span{color:#fff;font-size:14px}.top-balance strong{color:#9dffb5}@media(max-width:760px){.top-balance{right:6px;top:6px;padding:5px 7px;font-size:8px;gap:3px}.top-balance span{font-size:10px}.top-balance strong{font-size:10px}}'
          if 'top-balance' not in s:
              if css not in s: raise SystemExit('css marker missing')
              s=s.replace(css,css2,1)
          html='<div class="top">'
          html2=html+'<div class="top-balance" aria-label="Saldo atual">SALDO: <span>R$ <strong id="pirata-saldo-top">0,00</strong></span></div>'
          if 'id="pirata-saldo-top"' not in s:
              if html not in s: raise SystemExit('html marker missing')
              s=s.replace(html,html2,1)
          js='''<script>\n(function(){const el=document.getElementById('pirata-saldo-top');if(!el)return;function f(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'0,00'}async function u(){try{if(window.SistemaSaldo&&typeof window.SistemaSaldo.get==='function'){const r=window.SistemaSaldo.get();const v=r&&typeof r.then==='function'?await r:r;if(typeof v==='number')el.textContent=f(v);else if(v&&typeof v==='object')el.textContent=f(v.valor??v.saldo??v.balance??0)}}catch(e){}}u();setInterval(u,700);window.addEventListener('focus',u);document.addEventListener('visibilitychange',()=>{if(!document.hidden)u()})})();\n</script>\n</body>'''
          if 'id="pirata-saldo-top"' not in s or 'setInterval(u,700)' not in s:
              s=s.replace('</body>',js,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git commit -m 'Mostrar saldo no topo do Tesouro Pirata'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove temporary workflow files
        if: always()
        run: |
          rm -f .github/workflows/fix-pirata-balance2.yml .github/workflows/add-pirate-balance.yml
          git add -u .github/workflows/fix-pirata-balance2.yml .github/workflows/add-pirate-balance.yml || true
          git diff --cached --quiet || git commit -m 'Remover workflows temporarios'
          git push origin HEAD:main || true
