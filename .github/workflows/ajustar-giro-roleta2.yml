name: Ajustar giro natural Roleta 2
on:
  push:
    paths:
      - '.trigger-roleta2-giro'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar animação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta2.html')
          s=p.read_text()
          s=s.replace('animation:giroRoletaPremium var(--duracao-giro,8.2s) cubic-bezier(.12,.72,.16,1) forwards;','animation:giroRoletaPremium var(--duracao-giro,8.2s) cubic-bezier(.22,.70,.18,1) forwards;')
          s=s.replace('animation:giroBolaPremium var(--duracao-giro,8.2s) cubic-bezier(.18,.72,.12,1) forwards;','animation:giroBolaPremium var(--duracao-giro,8.2s) cubic-bezier(.24,.66,.16,1) forwards;')
          s=s.replace('const voltasRoleta=6;','const voltasRoleta=8;')
          s=s.replace('const voltasBola=9;','const voltasBola=12;')
          s=s.replace('"7.2s"','"9.6s"')
          s=s.replace('setTimeout(\nresolve,\n7200\n)','setTimeout(\nresolve,\n9600\n)')
          s=s.replace('animation-duration:7.8s','animation-duration:9.6s')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jogos/roleta2.html
          git commit -m 'Deixar giro da Roleta 2 mais natural' || exit 0
          git push
      - name: Limpar temporários
        if: always()
        run: |
          git rm -f .trigger-roleta2-giro .github/workflows/ajustar-giro-roleta2.yml || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Limpar arquivos temporários do ajuste da Roleta 2' || true
          git push || true
