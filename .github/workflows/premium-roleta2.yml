name: Premium visual Roleta 2
on:
  push:
    paths:
      - '.github/workflows/premium-roleta2.yml'
      - 'roleta2-premium.css'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar somente camada visual
        shell: python
        run: |
          from pathlib import Path
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          marker='ApostaXBet — Roleta 2 Premium Visual Layer'
          if marker in s:
              raise SystemExit('Camada visual ja aplicada')
          css=Path('roleta2-premium.css').read_text(encoding='utf-8')
          if '</style>' not in s:
              raise SystemExit('Bloco style nao encontrado')
          s=s.replace('</style>','\n'+css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar logica essencial
        shell: bash
        run: |
          grep -q 'const TAXA_CASA = 0.30;' jogos/roleta2.html
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
      - name: Commit e limpar temporarios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Aplica visual premium na Roleta 2'
          git push
          git rm .github/workflows/premium-roleta2.yml roleta2-premium.css
          git commit -m 'Remove arquivos temporarios da Roleta 2'
          git push
