name: R2 one spin now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current Roleta 2
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          # Replace only the existing spin section inside girarRoleta.
          pat=r"async function girarRoleta\(\).*?(?=async function finalizarRodada)"
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('girarRoleta not found')
          fn="""async function girarRoleta(){if(girando||!apostas.length)return mensagemEl.textContent='Faça pelo menos uma aposta antes de girar.',mensagemEl.className='mensagem resultado-derrota';let total=totalApostas();if(total<=0)return;try{iniciarAudio();girando=true;btnGirar.disabled=true;mensagemEl.textContent='🎰 A roleta está girando...';mensagemEl.className='mensagem';ultimaAposta=apostas.map(a=>({...a}));let d=await debitar(total);if(d===false)throw Error('❌ Saldo insuficiente.');let indice=Math.floor(Math.random()*SEQUENCIA.length),numero=SEQUENCIA[indice],ang=360/SEQUENCIA.length;rotacaoAtual+=7*360+(360-indice*ang);roleta.classList.remove('r2-one-spin');bola.classList.remove('r2-one-spin');void roleta.offsetWidth;roleta.classList.add('r2-one-spin');bola.classList.add('r2-one-spin');iniciarSomRoleta();setTimeout(async()=>{pararSomRoleta();roleta.classList.remove('r2-one-spin');bola.classList.remove('r2-one-spin');await finalizarRodada(numero);girando=false;btnGirar.disabled=false;await obterSaldo();if(auto&&apostas.length)setTimeout(girarRoleta,1200)},7600)}catch(e){pararSomRoleta();roleta.classList.remove('r2-one-spin');bola.classList.remove('r2-one-spin');girando=false;btnGirar.disabled=false;mensagemEl.textContent=e.message||'Não foi possível realizar a aposta.';mensagemEl.className='mensagem resultado-derrota';await obterSaldo()}}
"""
          s=s[:m.start()]+fn+s[m.end():]
          css='''<style id="r2-one-spin-css">@keyframes r2Wheel{from{transform:rotate(0deg)}to{transform:rotate(2520deg)}}@keyframes r2Ball{from{transform:translate(-50%,-50%) translateY(-190px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-190px) rotate(-2880deg)}}.roleta.r2-one-spin{animation:r2Wheel 7.6s cubic-bezier(.15,.65,.20,1) both}.bola.r2-one-spin{animation:r2Ball 7.6s cubic-bezier(.08,.02,.12,1) both}@keyframes r2BallMobile{from{transform:translate(-50%,-50%) translateY(-125px) rotate(0deg)}to{transform:translate(-50%,-50%) translateY(-125px) rotate(-2880deg)}}@media(max-width:650px){.bola.r2-one-spin{animation-name:r2BallMobile}}</style>'''
          if 'id="r2-one-spin-css"' not in s:s=s.replace('</head>',css+'</head>',1)
          # Replace the existing square 115ms tick with a softer 240ms triangle tick.
          s=re.sub(r"setInterval\(\(\)=>\{if\(!girando\)return;let now=audioCtx\.currentTime,o=audioCtx\.createOscillator\(\),g=audioCtx\.createGain\(\);o\.type='square';o\.frequency\.value=850\+Math\.random\(\)\*180;g\.gain\.setValueAtTime\(\.0001,now\);g\.gain\.exponentialRampToValueAtTime\(\.035,now\+\.003\);g\.gain\.exponentialRampToValueAtTime\(\.0001,now\+\.045\);o\.connect\(g\);g\.connect\(audioCtx\.destination\);o\.start\(now\);o\.stop\(now\+\.05\)\},115\)","setInterval(()=>{if(!girando)return;let now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=700+Math.random()*120;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+.07);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.075)},240)",s)
          p.write_text(s,encoding='utf-8')
          assert 'animacaoBola' not in s and 'const voltas=10' not in s
          assert 'r2-one-spin' in s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Fix Roleta 2 one spin' || exit 0
          git push
