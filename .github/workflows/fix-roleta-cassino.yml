name: Fix Roleta Cassino

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate broken chip script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta-cassino.html')
          s = p.read_text(encoding='utf-8')
          marker = '\\n<script>\\\n/* =====================================================\\\n   FICHAS VISUAIS DA APOSTA'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n</body>\n</html>\n'
          else:
              raise SystemExit('marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta-cassino.html
          git commit -m 'Fix Roleta Cassino betting chips' || true
          git rm .github/workflows/fix-roleta-cassino.yml
          git commit -m 'Remove temporary Roleta Cassino fix workflow'
          git push
