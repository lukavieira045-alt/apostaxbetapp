name: Fix Roleta Cassino
on:
  push:
    paths:
      - '.github/workflows/fix-roleta-cassino.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid characters at end of Roleta Cassino
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta-cassino.html')
          s = p.read_text(encoding='utf-8')
          marker = '\\n\\n\\n\n</script>\n\n</body>\n</html>'
          if marker not in s:
              raise SystemExit('Expected invalid tail not found')
          s = s.replace(marker, '\n</script>\n\n</body>\n</html>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta-cassino.html
          git diff --cached --quiet || git commit -m 'Fix invalid JavaScript tail in Roleta Cassino'
          git push
