name: Fix Roleta Cassino

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir script quebrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta-cassino.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<script>\s*/\*\s*={3,}\s*FICHAS VISUAIS DA APOSTA.*?</script>'
          novo,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Script duplicado não encontrado: {n}')
          p.write_text(novo,encoding='utf-8')
          PY
      - name: Validar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('jogos/roleta-cassino.html').read_text(encoding='utf-8')
          if 'FICHAS VISUAIS DA APOSTA' in s:
              raise SystemExit('Bloco duplicado ainda existe')
          if s.count('<script>') != s.count('</script>'):
              raise SystemExit('Tags script desbalanceadas')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta-cassino.html
          git commit -m 'Fix Roleta Cassino opening script' || true
          git rm .github/workflows/fix-roleta-cassino.yml
          git commit -m 'Remove temporary Roleta Cassino workflow'
          git push
