name: Roleta 2 fix real

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, 'EXECUTAR ROLETA2 FIX REAL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar roda profissional aprovada e remover segunda rodada
        shell: bash
        run: |
          set -e
          git show 1b4a507638556010561d5792739d96ab7964f443:jogos/roleta2.html > jogos/roleta2.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\s*const animacaoBola\s*=\s*bola\.animate\(\s*\[.*?\]\s*,\s*\{.*?\}\s*\);\s*\n?\s*await animacaoBola\.finished\s*;'
          s, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'ERRO: segunda animacao nao encontrada ({n})')
          if 'animacaoBola' in s:
              raise SystemExit('ERRO: animacaoBola ainda existe')
          if 'spin-real' not in s:
              raise SystemExit('ERRO: giro profissional aprovado ausente')
          if 'somGiroOsc' in s:
              raise SystemExit('ERRO: som pesado customizado ainda presente')
          p.write_text(s, encoding='utf-8')
          print('OK: segunda animacao removida; spin-real preservado; som pesado removido')
          PY

      - name: Publicar Roleta 2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'ROLETA2_FIX_APLICADO'
          git push origin HEAD:main
