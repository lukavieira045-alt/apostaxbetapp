name: Roleta 2 fix real

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, 'EXECUTAR ROLETA2 FIX REAL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar correcao diretamente no arquivo atual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, base64, urllib.request, re
          repo=os.environ['GITHUB_REPOSITORY']
          sha='195055aa4db70714abbcca5e6bc00b8f2a429cc7'
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
              headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','User-Agent':'github-actions'}
          )
          with urllib.request.urlopen(req) as r:
              data=json.load(r)
          s=base64.b64decode(data['content']).decode('utf-8')
          pattern=r'\s*const animacaoBola\s*=\s*bola\.animate\(\s*\[.*?\]\s*,\s*\{.*?\}\s*\);\s*\n?\s*await animacaoBola\.finished\s*;'
          s,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'Segunda animacao nao encontrada: {n}')
          if 'animacaoBola' in s: raise SystemExit('animacaoBola ainda existe')
          if 'spin-real' not in s: raise SystemExit('spin-real aprovado ausente')
          # A baseline aprovada nao contem o som pesado customizado.
          open('jogos/roleta2.html','w',encoding='utf-8').write(s)
          print('CORRECAO OK')
          PY
          grep -q 'spin-real' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
          ! grep -q 'somGiroOsc' jogos/roleta2.html

      - name: Publicar Roleta 2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'ROLETA2_FIX_APLICADO'
          git push origin HEAD:main
