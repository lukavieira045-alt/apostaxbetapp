name: Fix only Roleta Cassino 2
on:
  push:
    paths:
      - '.github/workflows/temp-fix-roleta-cassino-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path='jogos/roleta-cassino.html';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            let s=Buffer.from(data.content,'base64').toString('utf8');
            const old='typeof window.SistemaSaldo.creditar === "function"';
            const neu='typeof window.SistemaSaldo.processarVitoria === "function"';
            if(!s.includes(old)) core.setFailed('Verificação antiga não encontrada');
            s=s.replace(old,neu,1);
            const content=Buffer.from(s).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Corrige carregamento da Roleta Cassino',content,sha:data.sha,branch:'main'});
      - uses: actions/github-script@v7
        with:
          script: |
            const path='.github/workflows/temp-fix-roleta-cassino-2.yml';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            await github.rest.repos.deleteFile({owner:context.repo.owner,repo:context.repo.repo,path,message:'Remove workflow temporário da Roleta Cassino 2',sha:data.sha,branch:'main'});