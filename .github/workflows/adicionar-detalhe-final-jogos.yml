name: Adicionar detalhe final na página de jogos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adicionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir Roleta 2
        shell: bash
        run: |
          set -euo pipefail
          git show 1b4a507638556010561d5792739d96ab7964f443:jogos/roleta2.html > jogos/roleta2.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          # Remove somente a segunda animação da bola. Sorteio, aposta e resultado ficam intactos.
          s=re.sub(r'\s*iniciarSomRoleta\(\);\s*const voltas=10;.*?await animacaoBola\.finished;\s*', '\n', s, count=1, flags=re.S)
          if 'animacaoBola' in s or 'const voltas=10' in s:
              raise SystemExit('Ainda existe bloco do segundo giro')
          # Som de giro mais leve, usando o mesmo som já existente.
          s=re.sub(r'function iniciarSomRoleta\(\)\s*\{.*?\}\s*function pararSomRoleta\(\)\s*\{.*?\}', '''function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},240)}
          function pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}''', s, count=1, flags=re.S)
          css='''\n<style id="ax-r2-single-spin">\n@keyframes axR2Wheel{from{transform:rotate(0deg)}to{transform:rotate(2520deg)}}\n@keyframes axR2Ball{from{transform:translate(-50%,-50%) rotate(0deg) translateY(-188px)}to{transform:translate(-50%,-50%) rotate(-2880deg) translateY(-188px)}}\n@keyframes axR2BallMobile{from{transform:translate(-50%,-50%) rotate(0deg) translateY(-125px)}to{transform:translate(-50%,-50%) rotate(-2880deg) translateY(-125px)}}\n.roleta.ax-r2-spin{animation:axR2Wheel 7.6s cubic-bezier(.15,.65,.20,1) both}\n.bola.ax-r2-spin{animation:axR2Ball 7.6s cubic-bezier(.08,.02,.12,1) both}\n@media(max-width:650px){.bola.ax-r2-spin{animation-name:axR2BallMobile}}\n</style>\n'''
          if 'id="ax-r2-single-spin"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          js='''\n<script id="ax-r2-single-spin-js">\n(function(){\n  window.iniciarGiroVisual=function(){\n    var r=document.querySelector('.roleta'),b=document.querySelector('.bola');\n    if(!r)return;\n    r.classList.remove('ax-r2-spin');\n    if(b)b.classList.remove('ax-r2-spin');\n    void r.offsetWidth;\n    r.classList.add('ax-r2-spin');\n    if(b)b.classList.add('ax-r2-spin');\n    try{iniciarSomRoleta()}catch(e){}\n    setTimeout(function(){\n      try{pararSomRoleta()}catch(e){}\n      r.classList.remove('ax-r2-spin');\n      if(b)b.classList.remove('ax-r2-spin');\n    },7600);\n  };\n})();\n</script>\n'''
          if 'id="ax-r2-single-spin-js"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          marker='        const anguloFinal=indice*anguloPorNumero;\n'
          if 'iniciarGiroVisual();' not in s:
              if marker not in s: raise SystemExit('Ponto do giro não encontrado')
              s=s.replace(marker,marker+'        iniciarGiroVisual();\n',1)
          if s.count('iniciarGiroVisual();') != 1: raise SystemExit('Quantidade incorreta de giros visuais')
          if 'animacaoBola' in s or 'const voltas=10' in s: raise SystemExit('Segundo giro presente')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="ax-r2-single-spin"' jogos/roleta2.html
          grep -q 'iniciarGiroVisual();' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
          ! grep -q 'const voltas=10' jogos/roleta2.html
      - name: Publicar Roleta 2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Roleta 2: giro unico e som suave'
          git push
