name: Adicionar detalhe final na página de jogos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adicionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir Roleta 2 sem alterar estrutura
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'\s*const animacaoBola\s*=\s*bola\.animate\(\s*\[.*?\]\s*,\s*\{.*?\}\s*\);\s*\n?\s*mensagemEl\.textContent\s*=\s*" A bolinha está girando\.\.\.";\s*\n?\s*mensagemEl\.className\s*=\s*"mensagem";\s*\n?\s*await animacaoBola\.finished\s*;'
          s,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'Segunda animação não encontrada: {n}')
          if 'animacaoBola' in s: raise SystemExit('animacaoBola ainda existe')
          if 'spin-real' not in s: raise SystemExit('spin-real ausente')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'spin-real' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
      - name: Adicionar efeito somente no final dos jogos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='<!-- APOSTAXBET DETALHE FINAL JOGOS V1 -->'
          if marker in s: raise SystemExit(0)
          block='''<!-- APOSTAXBET DETALHE FINAL JOGOS V1 --><style>.ax-final-jogos{margin:24px 15px 18px;padding:18px 14px 15px;border:1px solid rgba(250,204,21,.28);border-radius:16px;background:linear-gradient(180deg,rgba(20,90,56,.72),rgba(7,42,26,.9));text-align:center}.ax-final-jogos h2{color:#facc15;font-size:16px;font-weight:900;margin-bottom:5px}.ax-final-jogos p{color:#bbf7d0;font-size:11px;margin-bottom:13px}.ax-final-itens{display:flex;justify-content:center;gap:8px}.ax-final-item{flex:1;padding:9px 5px;border-radius:11px;background:rgba(0,0,0,.18)}.ax-final-item b{display:block;color:#fff;font-size:10px}.ax-final-item span{color:#86efac;font-size:9px}</style><div class="ax-final-jogos"><h2>✨ SUA EXPERIÊNCIA APOSTAXBET</h2><p>Explore os jogos e encontre seu próximo favorito</p><div class="ax-final-itens"><div class="ax-final-item">🎰<b>JOGOS</b><span>Vários estilos</span></div><div class="ax-final-item">⚡<b>RÁPIDOS</b><span>Entre e jogue</span></div><div class="ax-final-item">💎<b>DESTAQUES</b><span>Confira as novidades</span></div></div></div>'''
          js='<script>document.addEventListener("DOMContentLoaded",()=>{const a=document.getElementById("areaJogos");if(!a)return;const w=document.createElement("div");w.id="ax-final-jogos-injected";w.innerHTML=`'+block+'`;a.appendChild(w)});</script>'
          s=re.sub(r'<!-- APOSTAXBET DETALHES AREA JOGOS V1 -->.*?(?=</body>)','',s,flags=re.S)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html jogos/roleta2.html
          git diff --cached --quiet || git commit -m 'Corrigir Roleta 2 segunda rodada'
          git push
