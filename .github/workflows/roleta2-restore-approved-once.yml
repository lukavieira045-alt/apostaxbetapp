name: Restaurar Roleta 2 aprovada - uma vez
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar exatamente a roda aprovada
        shell: bash
        run: |
          set -euo pipefail
          git checkout 1b4a507638556010561d5792739d96ab7964f443 -- jogos/roleta2.html
      - name: Remover qualquer segundo giro e manter som suave
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*iniciarSomRoleta\(\);\s*const voltas=10;.*?await animacaoBola\.finished;\s*', '\n', s, count=1, flags=re.S)
          s=re.sub(r'\n<style id="r2-one-spin-css">.*?</style>\s*', '\n', s, flags=re.S)
          s=re.sub(r'\n<style id="ax-r2-single-spin">.*?</style>\s*', '\n', s, flags=re.S)
          s=re.sub(r'\n<script id="ax-r2-single-spin-js">.*?</script>\s*', '\n', s, flags=re.S)
          s=s.replace('},145)', '},240)')
          s=s.replace('},115)', '},240)')
          s=s.replace('},110)', '},240)')
          p.write_text(s,encoding='utf-8')
      - name: Validar
        shell: bash
        run: |
          set -e
          grep -q 'function girarRoleta' jogos/roleta2.html
          grep -q 'function finalizarRodada' jogos/roleta2.html
          grep -q 'function debitar' jogos/roleta2.html
          grep -q 'function creditar' jogos/roleta2.html
          grep -q 'spin-real' jogos/roleta2.html
          ! grep -q 'r2-one-spin' jogos/roleta2.html
          ! grep -q 'ax-r2-spin' jogos/roleta2.html
          ! grep -q 'animacaoBola' jogos/roleta2.html
          ! grep -q 'const voltas=10' jogos/roleta2.html
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restaurar Roleta 2 para versao aprovada'
          git push
