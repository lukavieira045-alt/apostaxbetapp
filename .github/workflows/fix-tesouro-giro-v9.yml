name: Activate Tesouro lobby spin v9
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist lobby spin handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          old='spinBtn.onclick=lobbySpin;\n\nminusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;'
          new='spinBtn.onclick=lobbySpin;\n\nminusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=lobbySpin;'
          if old in s:s=s.replace(old,new,1);p.write_text(s,encoding='utf-8')
          PY
      - name: Remove second Roleta 2 animation and extra spin music
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 FINAL REAL CASINO WHEEL \*/.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 Physical Opposite Spin v1 \*/.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{function\s+\w+\(\).*?btn-girar.*?spin-fisico.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{function\s+\w+\(\).*?btn-girar.*?spin-real.*?</script>\s*','',s,flags=re.S)
          marker='/* ApostaXBet — Roleta 2 Real Spin Sound v2 */'
          if marker in s:
              start=s.find(marker);end=s.find('function pararSomRoleta()',start)
              if end!=-1:
                  close=s.find('}',end)
                  if close!=-1:
                      close+=1
                      original='function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}\nfunction pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'
                      s=s[:start]+original+s[close:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ApostaXBet Bot"
          git config user.email "actions@github.com"
          git add jogos/tesouro-pirata.html jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajustar rodada da Roleta 2"
          git pull --rebase origin main
          git push origin HEAD:main
