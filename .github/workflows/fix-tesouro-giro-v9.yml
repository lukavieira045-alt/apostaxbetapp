name: Activate Tesouro lobby spin v9
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist lobby spin handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          old='spinBtn.onclick=lobbySpin;\n\nminusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;'
          new='spinBtn.onclick=lobbySpin;\n\nminusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=lobbySpin;'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Ativação aplicada')
          else:
              print('Já ativado')
              raise SystemExit
          PY
          git config user.name "ApostaXBet Bot"
          git config user.email "actions@github.com"
          git add jogos/tesouro-pirata.html
          git commit -m "Ativar giro vertical do lobby" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main