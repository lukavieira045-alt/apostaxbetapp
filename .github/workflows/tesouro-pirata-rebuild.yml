name: Tesouro Pirata — reconstrução visual
on:
  push:
    paths:
      - '.github/workflows/tesouro-pirata-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir somente a interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          css='''
          *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;color:#fff;background:#06405d url('../jogos/tesouro-pirata.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,30,45,.02),rgba(0,0,0,.7));z-index:0}.casino{position:relative;z-index:1;width:min(1280px,100vw);height:min(800px,100vh);display:grid;grid-template-rows:80px minmax(0,1fr) 96px;overflow:hidden}.top{display:flex;justify-content:center;align-items:flex-start;z-index:5}.logo{position:relative;margin-top:5px;width:min(610px,58vw);height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e1ad48,#a36118 35%,#542707);border:4px solid #f5d579;border-radius:10px 10px 28px 28px;box-shadow:0 5px 0 #241006,0 9px 20px #000c,inset 0 2px #fff6}.logo:before,.logo:after{content:"";position:absolute;top:25px;width:250px;height:17px;background:linear-gradient(#b47a2a,#432008);border-top:2px solid #f1cb62;border-bottom:3px solid #241006;z-index:-1}.logo:before{right:100%}.logo:after{left:100%}.logo h1{margin:0;color:#ffe36f;font:900 clamp(25px,4vw,48px)/1 Georgia,serif;letter-spacing:2px;text-shadow:0 3px #6a3005,0 6px 8px #000,0 0 18px #ffb400}.skull{font-size:28px;margin:0 18px;filter:drop-shadow(0 4px 3px #000)}.stage{min-height:0;padding:0 24px 5px;display:flex;justify-content:center}.frame{position:relative;width:min(1110px,100%);height:100%;padding:13px 15px;background:linear-gradient(90deg,#281206,#87511f 3%,#c18b3b 5%,#5b3817 7%,#102326 10%,#050a0c 50%,#102326 90%,#5b3817 93%,#c18b3b 95%,#87511f 97%,#281206);border:8px solid #75471b;border-radius:7px;box-shadow:0 0 0 3px #e0b65b,0 0 0 7px #281306,0 17px 35px #000d,inset 0 0 25px #000}.frame:before,.frame:after{content:"";position:absolute;top:7px;bottom:7px;width:28px;background:repeating-linear-gradient(#aab4ad 0 12px,#4c5d58 12px 24px);border:2px solid #d5ddd7;box-shadow:inset 0 0 10px #000}.frame:before{left:-8px}.frame:after{right:-8px}.reel-window{height:100%;border:5px solid #251408;background:#050403;box-shadow:inset 0 0 35px #000,0 3px #000;overflow:hidden;position:relative}.reel-window:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 12%,transparent 84%,rgba(0,0,0,.35));z-index:9}.rolos{height:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#080604}.col{display:grid;grid-template-rows:repeat(3,1fr);border-right:2px solid #5b391b;background:linear-gradient(90deg,#070504,#24160c 50%,#070504)}.col:last-child{border-right:0}.cel{min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 34%,#432713,#1a0d05 65%,#080403);border-bottom:2px solid #593719;box-shadow:inset 0 0 24px #0009}.cel:last-child{border-bottom:0}.cel:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.08),transparent 25%,transparent 70%,rgba(0,0,0,.38));pointer-events:none}.cel img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 7px 5px #000)}.letra{font:900 clamp(46px,6vw,82px)/1 Georgia,serif;text-shadow:0 5px 3px #000,0 0 8px #000}.K{color:#da4bd0}.Q{color:#299dff}.J{color:#63e64d}.A{color:#ff4b44}.scatter{border:3px solid #e9b844;background:radial-gradient(circle,#6b430d,#190b03 68%);box-shadow:inset 0 0 28px #f2a900,0 0 18px #efaa0066}.scatter:after{content:'SCATTER';position:absolute;left:12%;right:12%;bottom:5px;text-align:center;background:linear-gradient(#b42a1d,#650e0b);border:1px solid #e4ad4a;padding:3px;color:#fff;font-size:9px;font-weight:900;letter-spacing:1px}.win{animation:win .42s infinite alternate;z-index:20}@keyframes win{to{transform:scale(1.07);filter:brightness(1.7);box-shadow:inset 0 0 30px #ffc21b,0 0 25px #ffc21b}}.bottom{display:grid;grid-template-columns:245px 1fr 430px;align-items:center;gap:12px;padding:7px 15px;background:linear-gradient(#302f2b,#17191a 45%,#07090a);border-top:4px solid #88632d;box-shadow:0 -7px 22px #000e,inset 0 1px #fff2}.left{display:flex;gap:7px;align-items:center}.round{width:40px;height:40px;border-radius:50%;border:2px solid #9a7d50;background:linear-gradient(#3c4242,#101415);color:#fff;font-weight:900;box-shadow:inset 0 1px #fff3,0 4px 7px #000b}.stats{padding:5px 8px;background:#080a0b;border:1px solid #755b38;border-radius:4px;font-size:10px;font-weight:900;line-height:15px;min-width:125px}.stats span{color:#f2d06d}.center{text-align:center}.hold{font-size:11px;font-weight:900;color:#f5e4b3;text-shadow:0 2px 3px #000}.winbar{font-size:23px;font-weight:1000;text-shadow:0 2px 4px #000}.winbar span{color:#ffd64d}.controls{display:flex;align-items:center;justify-content:flex-end;gap:7px}.bet{display:flex;align-items:center;gap:5px}.betvalue{text-align:center;min-width:62px}.betvalue small{display:block;color:#aaa;font-size:8px}.betvalue b{color:#ffe17a;font-size:13px}.spin{width:72px;height:72px;border-radius:50%;border:5px solid #dffff0;background:radial-gradient(circle at 32% 20%,#88ff9c,#29c65b 38%,#0e7834 66%,#03441c);color:#fff;font-size:14px;font-weight:1000;box-shadow:0 5px #023311,0 0 28px #20d95888,inset 0 2px 6px #fff8}.spin:disabled{opacity:.45;filter:grayscale(1)}.auto{height:40px;min-width:65px;border-radius:5px;border:2px solid #8e7652;background:linear-gradient(#3a4040,#111516);color:#fff;font-weight:900}.max{width:48px!important}.ativa{background:linear-gradient(#2fe165,#08782d)!important;border-color:#baffc2!important}.erro{display:none;position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:50;padding:9px 18px;background:#5b0b0b;border:2px solid #ff8a74;border-radius:5px}.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:60;min-width:310px;padding:28px 42px;text-align:center;background:radial-gradient(circle,#b47c20,#5a350e 45%,#100803 78%);border:4px solid #ffdc63;border-radius:8px;box-shadow:0 0 0 2px #5d370b,0 0 65px #ffc400aa;transition:.2s}.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1}.pop h2{margin:0;color:#ffdf62;font:900 31px Georgia,serif}.pop p{margin:9px 0 0;font-size:27px;font-weight:1000}@media(max-width:760px){.casino{width:100%;height:100vh;grid-template-rows:55px minmax(0,1fr) 92px}.logo{height:49px;width:86vw;border-width:3px;margin-top:2px}.logo:before,.logo:after{width:35px;height:8px;top:18px}.logo h1{font-size:18px}.skull{font-size:17px;margin:0 6px}.stage{padding:0 3px 3px}.frame{padding:5px;border-width:4px}.frame:before,.frame:after{display:none}.reel-window{border-width:2px}.col{border-right-width:1px}.cel{border-bottom-width:1px}.cel img{width:94%;height:94%}.letra{font-size:29px}.bottom{grid-template-columns:1fr 75px 1fr;gap:2px;padding:4px 3px}.left{gap:2px}.round{width:29px;height:29px;font-size:10px}.stats{display:none}.hold{font-size:7px}.winbar{font-size:15px;line-height:23px}.controls{gap:2px}.bet{gap:2px}.bet .round{width:29px;height:29px}.betvalue{min-width:42px}.betvalue small{font-size:6px}.betvalue b{font-size:9px}.max{width:34px!important;font-size:7px}.spin{width:61px;height:61px;font-size:12px;border-width:4px}.auto{min-width:46px;height:30px;font-size:7px;padding:0 3px}.pop{min-width:245px;padding:22px 25px}.pop h2{font-size:25px}.pop p{font-size:22px}}@media(max-width:390px){.casino{grid-template-rows:52px minmax(0,1fr) 86px}.logo{height:46px}.logo h1{font-size:16px}.bottom{grid-template-columns:1fr 66px 1fr}.spin{width:55px;height:55px}.auto{min-width:41px}.winbar{font-size:13px}}
          '''
          body='''
          <div class="casino">
            <div class="top"><div class="logo"><span class="skull">☠</span><h1>TESOURO PIRATA</h1><span class="skull">☠</span></div></div>
            <div class="stage"><div id="errorMessage" class="erro"></div><div class="frame"><div class="reel-window"><div id="reelsGrid" class="rolos"></div></div></div><div class="pop" id="winPopup"><h2>TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div></div>
            <div class="bottom"><div class="left"><button class="round">☰</button><button class="round">i</button><div class="stats"><div><span>CREDIT</span> R$ <b id="balance">0,00</b></div><div><span>BET</span> R$ <b id="betAmount">1,00</b></div></div></div><div class="center"><div class="hold" id="statusText">ENCONTRE 3 OU MAIS ☠ PARA GANHAR!</div><div class="winbar">WIN <span>R$ <b id="prizeValue">0,00</b></span></div></div><div class="controls"><div class="bet"><button class="round" id="minusBtn">−</button><div class="betvalue"><small>BET</small><b>R$ <span id="betAmount2">1,00</span></b></div><button class="round" id="plusBtn">+</button><button class="round max" id="maxBtn">MAX</button></div><button class="spin" id="spinBtn">GIRAR</button><button class="auto" id="turboBtn">⚡ TURBO</button><button class="auto" id="autoBtn">AUTO <span id="autoCount">10</span></button></div></div>
          </div>
          <script>const syncBet=()=>{const a=document.getElementById('betAmount'),b=document.getElementById('betAmount2');if(a&&b)b.textContent=a.textContent};new MutationObserver(syncBet).observe(document.getElementById('betAmount'),{childList:true,characterData:true,subtree:true});</script>
          '''
          s=re.sub(r'<style>.*?</style>','<style>'+css+'</style>',s,count=1,flags=re.S)
          s=re.sub(r'<body>.*?<script type="module">','<body>'+body+'<script type="module">',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git commit -m 'Tesouro Pirata: reconstruir interface de slot' || exit 0
          git push
      - name: Remover workflow temporario
        if: success()
        run: |
          rm -f .github/workflows/tesouro-pirata-rebuild.yml
          git add -A
          git commit -m 'Remover workflow temporario do Tesouro Pirata' || exit 0
          git push
