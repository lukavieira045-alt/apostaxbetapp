name: Fix Roleta 2 - ball stops once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir fisica final da bola
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')

          old = 'const giroBola=voltasBola*360+anguloFinal;'
          new = 'const giroBola=voltasBola*360-anguloFinal;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('giroBola source not found')

          marker = 'await new Promise(resolve=>setTimeout(resolve,7500));'
          if marker not in s:
              raise SystemExit('spin wait marker not found')
          capture = marker + '\nconst transformFinalBola=getComputedStyle(bola).transform;'
          if 'const transformFinalBola=getComputedStyle(bola).transform;' not in s:
              s = s.replace(marker, capture, 1)

          old_reset = '''bola.style.transform=\n`translate(-50%,-50%)\n rotate(0deg)\n translateY(-${raioBola}px)`;\n\nrotacaoBolaAtual=0;'''
          new_reset = '''bola.style.transform=transformFinalBola;\n\nrotacaoBolaAtual=anguloFinal;'''
          if old_reset in s:
              s = s.replace(old_reset, new_reset, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet || (git commit -m 'Fix Roleta 2 ball stopping without second movement' && git push)
