name: Fix Roleta 2 - ball stops once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir parada sincronizada da bola
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r'const\s+giroBola\s*=\s*voltasBola\s*\*\s*360\s*\+\s*anguloFinal\s*;', 'const giroBola=voltasBola*360-anguloFinal;', s, count=1)
          if n == 0 and 'const giroBola=voltasBola*360-anguloFinal;' not in s:
              raise SystemExit('giroBola source not found')

          if 'const transformFinalBola=getComputedStyle(bola).transform;' not in s:
              pattern = r'(await\s+new\s+Promise\s*\(\s*resolve\s*=>\s*setTimeout\(\s*resolve\s*,\s*7500\s*\)\s*\)\s*;)'
              s, n = re.subn(pattern, r'\1\n\nconst transformFinalBola=getComputedStyle(bola).transform;', s, count=1)
              if n == 0:
                  raise SystemExit('spin wait marker not found')

          pattern_reset = re.compile(r'bola\.style\.transform\s*=\s*`translate\(-50%,-50%\)\s*rotate\(0deg\)\s*translateY\(-\$\{raioBola\}px\)`\s*;\s*rotacaoBolaAtual\s*=\s*0\s*;')
          s, n = pattern_reset.subn('bola.style.transform=transformFinalBola;\n\nrotacaoBolaAtual=anguloFinal;', s, count=1)
          if n == 0 and 'bola.style.transform=transformFinalBola;' not in s:
              raise SystemExit('ball reset block not found')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git diff --cached --quiet || (git commit -m 'Fix Roleta 2 synchronized ball stop' && git push)
