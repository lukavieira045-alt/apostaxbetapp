name: ajustar-tesouro-super-bonus
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajustar-tesouro-super-bonus.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alterar Tesouro Pirata
        shell: python
        run: |
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          marker='<audio id="tesouroMusic" src="tesouro-pirata.mp3" loop preload="auto"></audio>'
          loading='''<div id="ax-loading-screen">\n  <div class="ax-loading-card">\n    <div class="ax-loading-brand">APOSTAXBET</div>\n    <img class="ax-loading-img" src="tesouro-pirata.png" alt="Tesouro Pirata">\n    <div class="ax-loading-title">TESOURO PIRATA</div>\n    <div class="ax-loading-text">Carregando jogo...</div>\n    <div class="ax-loading-track"><div id="ax-loading-bar"></div></div>\n    <div id="ax-loading-percent">0%</div>\n  </div>\n</div>\n<div id="superBonusOverlay">\n  <div class="super-bonus-card">\n    <div class="super-bonus-title">SUPER BÔNUS</div>\n    <div class="super-bonus-treasure">💰</div>\n    <div class="super-bonus-text">10 RODADAS GRÁTIS</div>\n  </div>\n</div>'''
          if 'id="ax-loading-screen"' not in s:
              s=s.replace(marker, marker+'\n'+loading, 1)
          css='''\n#ax-loading-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#174d63 0%,#062737 48%,#02090e 100%);padding:20px;transition:opacity .35s ease,visibility .35s ease}\n#ax-loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none}\n.ax-loading-card{width:min(390px,92vw);text-align:center;padding:18px 18px 20px;background:linear-gradient(180deg,#111b20,#070b0d);border:2px solid #d6ad52;border-radius:14px;box-shadow:0 0 0 2px #3b2209,0 18px 55px #000c}\n.ax-loading-brand{font:900 16px Arial,sans-serif;letter-spacing:3px;color:#ffe27b;margin-bottom:10px;text-shadow:0 2px 5px #000}\n.ax-loading-img{display:block;width:100%;height:190px;object-fit:cover;border-radius:9px;border:2px solid #9f7833;box-shadow:inset 0 0 20px #000,0 8px 20px #000;object-position:center}\n.ax-loading-title{margin-top:12px;font:900 24px Georgia,serif;color:#ffd85d;text-shadow:0 2px 5px #000}\n.ax-loading-text{margin-top:10px;color:#fff;font-weight:800;font-size:13px}\n.ax-loading-track{height:12px;margin:10px 0 6px;border-radius:20px;background:#1a1a18;border:1px solid #8b6b30;overflow:hidden;box-shadow:inset 0 2px 5px #000}\n#ax-loading-bar{height:100%;width:0;background:linear-gradient(90deg,#0b7d35,#2ee66b,#ffd84e);box-shadow:0 0 12px #37e66d;transition:width .08s linear}\n#ax-loading-percent{font:900 13px Arial;color:#ffe37a}\n#superBonusOverlay{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#fff59a 0%,#ffe62f 35%,#ffbd00 68%,#e58b00 100%);animation:superFlash .5s ease-in-out infinite alternate}\n#superBonusOverlay.on{display:flex}\n.super-bonus-card{text-align:center;color:#5a2600;padding:28px 25px;border:5px solid #fff2a0;border-radius:22px;background:rgba(255,248,170,.35);box-shadow:0 0 35px #fff,0 0 90px #ff9d00,inset 0 0 30px #fff}\n.super-bonus-title{font:1000 clamp(38px,10vw,76px)/1 Arial,sans-serif;letter-spacing:2px;text-shadow:0 4px 0 #fff,0 7px 15px #9d4d00;animation:superPulse .45s ease-in-out infinite alternate}\n.super-bonus-treasure{font-size:64px;margin:10px 0;filter:drop-shadow(0 5px 5px #a35a00)}\n.super-bonus-text{font:1000 clamp(20px,5vw,34px)/1 Arial,sans-serif;color:#7a2800;text-shadow:0 2px #fff}\n@keyframes superFlash{from{filter:brightness(1)}to{filter:brightness(1.16)}}\n@keyframes superPulse{from{transform:scale(1)}to{transform:scale(1.07)}}\n@media(max-width:760px){.ax-loading-img{height:165px}.ax-loading-title{font-size:20px}.ax-loading-card{padding:14px}.super-bonus-card{width:92vw;padding:22px 12px}}\n'''
          if '#ax-loading-screen{' not in s:
              s=s.replace('</style>\n<style id="lobby-spin-css">',css+'</style>\n<style id="lobby-spin-css">',1)
          s=s.replace("const SYMBOLS=['captain','K','Q','J','A'];", "const SYMBOLS=['captain','treasure','K','Q','J','A'];", 1)
          old="const AS={captain:A+'Captain_pirate.png',ship:A+'Pirate_ship_-_Pirates_(1922).png',chest:A+'Treasure_chest_with_gold_coins.svg',bottle:A+'Glass_bottle.jpg',compass:A+'Negus_liquid_compass.png',map:A+'Treasuremap.jpg',cannon:A+'Cannon_model.png',parrot:A+'Parrot_standard.png',scatter:A+'Skull_and_Crossbones.png'};"
          new="const AS={captain:A+'Captain_pirate.png',treasure:A+'Treasure_chest_with_gold_coins.svg'};"
          s=s.replace(old,new,1)
          s=s.replace("const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;", "const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;\nlet freeSpins=0;", 1)
          old_start="function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}"
          new_start="function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s==='treasure'?'Tesouro':'Pirata';img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='treasure'?'💰':'☠';img.parentNode?.appendChild(d)};return img}"
          s=s.replace(old_start,new_start,1)
          old="async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();"
          new="""async function startLoading(){\n  const screen=$('ax-loading-screen'),bar=$('ax-loading-bar'),pct=$('ax-loading-percent');\n  if(!screen)return;\n  let n=0;\n  await new Promise(resolve=>{const t=setInterval(()=>{n=Math.min(100,n+4);bar.style.width=n+'%';pct.textContent=n+'%';if(n>=100){clearInterval(t);setTimeout(resolve,250)}},55)});\n  screen.classList.add('hide');\n  setTimeout(()=>screen.remove(),450);\n}\nasync function start(){init();ui();startLoading();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();"""
          s=s.replace(old,new,1)
          a=s.index('async function wins(grid){')
          b=s.index('\nfunction buildLobbyStrip',a)
          new_wins="""async function wins(grid){\n  let totalMultiplier=0;\n  const winningCells=[];\n  let superBonus=false;\n  for(let r=0;r<ROWS;r++){\n    let treasureCount=0;\n    for(let c=0;c<COLS;c++){\n      if(grid[c][r]==='treasure')treasureCount++; else break;\n    }\n    if(treasureCount>=3){\n      superBonus=true;\n      for(let c=0;c<treasureCount;c++)winningCells.push(document.querySelector(`#col-${c} .cel:nth-child(${r+1})`));\n    }\n    const first=grid[0][r];\n    if(grid.every(col=>col[r]===first) && PAYOUTS[first]){\n      const mult=Math.min(5*PAYOUTS[first],MAX_TOTAL_MULTIPLIER-totalMultiplier);\n      if(mult>0){\n        totalMultiplier+=mult;\n        for(let c=0;c<COLS;c++)winningCells.push(document.querySelector(`#col-${c} .cel:nth-child(${r+1})`));\n      }\n    }\n  }\n  winningCells.filter(Boolean).forEach(c=>c.classList.add('win'));\n  if(totalMultiplier>0){\n    const prize=currentBet*totalMultiplier;\n    prizeValue.textContent=money(prize);\n    winValue.textContent=money(prize);\n    winPopup.classList.add('on');\n    await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);\n    setTimeout(()=>winPopup.classList.remove('on'),1400);\n  }else prizeValue.textContent='0,00';\n  return superBonus;\n}\nfunction showSuperBonus(){\n  const ov=$('superBonusOverlay');\n  if(!ov)return Promise.resolve();\n  ov.classList.add('on');\n  return new Promise(resolve=>setTimeout(()=>{ov.classList.remove('on');resolve()},2200));\n}\n"""
          s=s[:a]+new_wins+s[b:]
          s=s.replace("  if(isSpinning)return;await balance();\n  if(realBalance<currentBet){", "  if(isSpinning)return;await balance();\n  const usingFreeSpin=freeSpins>0;\n  if(!usingFreeSpin && realBalance<currentBet){", 1)
          s=s.replace("  const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}\n  realBalance=Math.max(0,realBalance-currentBet);ui();", "  if(!usingFreeSpin){const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);}\n  ui();", 1)
          s=s.replace("  await wins(finalGrid);isSpinning=false;await balance();ui();\n  if(autoRunning&&autoSpins>0){", "  const gotSuperBonus=await wins(finalGrid);isSpinning=false;await balance();ui();\n  if(gotSuperBonus&&!usingFreeSpin){\n    freeSpins=10;\n    statusText.textContent='SUPER BÔNUS: 10 RODADAS GRÁTIS';\n    await showSuperBonus();\n    setTimeout(lobbySpin,180);\n    return;\n  }\n  if(usingFreeSpin){\n    freeSpins--;\n    statusText.textContent=freeSpins>0?`RODADA GRÁTIS — ${freeSpins} RESTANTES`:'FIM DO SUPER BÔNUS';\n    if(freeSpins>0)setTimeout(lobbySpin,420);\n    return;\n  }\n  if(autoRunning&&autoSpins>0){", 1)
          p.write_text(s,encoding='utf-8')
          print('updated',p)
      - name: Commit target file and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/tesouro-pirata.html
          git commit -m "Adicionar super bonus e carregamento ao Tesouro Pirata"
          git push
          rm -f .github/workflows/ajustar-tesouro-super-bonus.yml
          git add .github/workflows/ajustar-tesouro-super-bonus.yml
          git commit -m "Remover workflow temporario"
          git push
