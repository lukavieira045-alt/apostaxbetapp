name: Add loaders to Fortune games

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'lukavieira045-alt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add loading overlay to Snake and Mouse
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [Path('jogos/fortune-snake.html'), Path('jogos/fortune-mouse.html')]

          css = r'''
          /* === LOADING DE ENTRADA APOSTAXBET === */
          #ax-loading-screen{
              position:fixed;
              inset:0;
              z-index:99999;
              display:flex;
              align-items:center;
              justify-content:center;
              padding:24px;
              background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),rgba(0,0,0,.97) 65%);
              opacity:1;
              visibility:visible;
              transition:opacity .35s ease,visibility .35s ease;
          }
          #ax-loading-screen.ax-loading-hide{
              opacity:0;
              visibility:hidden;
              pointer-events:none;
          }
          .ax-loader-box{
              width:min(330px,90vw);
              text-align:center;
          }
          .ax-loader-logo{
              font-size:25px;
              font-weight:1000;
              letter-spacing:3px;
              color:#ffe39a;
              text-shadow:0 0 18px rgba(255,210,80,.45);
              margin-bottom:18px;
          }
          .ax-loader-text{
              color:rgba(255,255,255,.72);
              font-size:10px;
              letter-spacing:2px;
              text-transform:uppercase;
              margin-bottom:10px;
          }
          .ax-loader-track{
              height:7px;
              overflow:hidden;
              border-radius:99px;
              background:rgba(255,255,255,.12);
              border:1px solid rgba(255,255,255,.16);
              box-shadow:inset 0 1px 4px rgba(0,0,0,.7),0 0 18px rgba(255,210,80,.12);
          }
          .ax-loader-bar{
              width:0%;
              height:100%;
              border-radius:inherit;
              background:linear-gradient(90deg,#9b641b,#f3c65b,#fff0a1,#f3c65b);
              box-shadow:0 0 14px rgba(255,220,110,.75);
              transition:width .12s linear;
          }
          .ax-loader-percent{
              margin-top:8px;
              color:rgba(255,255,255,.45);
              font-size:9px;
              font-weight:800;
              letter-spacing:1px;
          }
          '''

          html = '''
          <div id="ax-loading-screen" aria-label="Carregando jogo">
              <div class="ax-loader-box">
                  <div class="ax-loader-logo">APOSTAXBET</div>
                  <div class="ax-loader-text">Carregando jogo...</div>
                  <div class="ax-loader-track"><div class="ax-loader-bar" id="ax-loader-bar"></div></div>
                  <div class="ax-loader-percent" id="ax-loader-percent">0%</div>
              </div>
          </div>
          '''

          js = '''
          <script>
          (function(){
              const screen=document.getElementById('ax-loading-screen');
              const bar=document.getElementById('ax-loader-bar');
              const pct=document.getElementById('ax-loader-percent');
              if(!screen||!bar||!pct)return;
              let value=0;
              const timer=setInterval(()=>{
                  value=Math.min(value+(value<70?7:value<90?4:2),96);
                  bar.style.width=value+'%';
                  pct.textContent=value+'%';
              },100);
              function finish(){
                  clearInterval(timer);
                  bar.style.width='100%';
                  pct.textContent='100%';
                  setTimeout(()=>screen.classList.add('ax-loading-hide'),220);
              }
              if(document.readyState==='complete') setTimeout(finish,650);
              else window.addEventListener('load',()=>setTimeout(finish,650),{once:true});
              setTimeout(finish,3500);
          })();
          </script>
          '''

          for p in files:
              s=p.read_text(encoding='utf-8')
              if 'id="ax-loading-screen"' in s:
                  print(p, 'already patched')
                  continue
              if '</style>' not in s or '<body' not in s:
                  raise SystemExit(f'Formato inesperado: {p}')
              s=s.replace('</style>', css+'\n</style>', 1)
              pos=s.find('>', s.find('<body'))+1
              s=s[:pos]+'\n'+html+s[pos:]
              s=s.replace('</body>', js+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
              print(p, 'patched')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/fortune-snake.html jogos/fortune-mouse.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Adicionar carregamento aos jogos Cobra e Rato"
            git push
          fi
