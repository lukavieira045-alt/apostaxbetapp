name: Fix Tesouro Pirata 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          payouts='''const PAYOUTS = {\n    '🏴‍☠️': 2.00,\n    '🦜': 1.60,\n    '💰': 1.35,\n    '🗺️': 1.15,\n    '⚓': 1.00,\n    '🧭': 0.85,\n    'K': 0.70,\n    'Q': 0.60,\n    'J': 0.50,\n    'A': 0.40\n};'''
          s,n=re.subn(r'const PAYOUTS = \{.*?\};',payouts,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('PAYOUTS not found')
          css='''<style id="tesouro-premium">body{background:linear-gradient(rgba(2,8,12,.72),rgba(2,5,8,.94)),url(\'../jogos/tesouro-pirata.png\') center/cover fixed no-repeat}.game-wrapper{max-width:760px;border:3px solid #c99a3a;border-radius:22px;background:linear-gradient(180deg,rgba(72,42,20,.97),rgba(14,8,5,.99));box-shadow:0 0 0 2px rgba(255,215,0,.12),0 18px 55px #000,inset 0 0 35px #000}.game-wrapper:before{content:\"⚓  •  TESOURO PIRATA  •  ⚓\";display:block;text-align:center;color:#ffe29a;font-size:10px;font-weight:900;letter-spacing:3px;padding:3px 0 9px;text-shadow:0 2px 5px #000}.header{border:1px solid #c99a3a;border-bottom:2px solid #d7a83e;border-radius:14px;background:linear-gradient(#11110f,#000);box-shadow:inset 0 1px #ffffff14,0 5px 16px #0008}.game-title{color:#ffd65a;font-size:clamp(16px,4vw,24px);letter-spacing:2px;text-shadow:0 2px #6e4300,0 0 14px #ffbf0060,2px 3px 5px #000}.balance-display{border:1px solid #d9aa3d;border-radius:10px;background:linear-gradient(#19140b,#050505);color:#ffd75c}.reels-container{gap:5px;padding:8px;border:3px solid #6d4926;border-radius:15px;background:linear-gradient(#050708,#140a05);box-shadow:inset 0 0 28px #000,0 0 0 1px #ffd70024,0 8px 18px #0009}.symbol-cell{height:84px;border:1px solid #705c43;border-radius:9px;background:radial-gradient(circle at 50% 30%,#ffffff18,transparent 40%),linear-gradient(#263039,#0b0e11);box-shadow:inset 0 1px #ffffff14,inset 0 -8px 15px #0008}.symbol-cell.winner{background:radial-gradient(circle,#fff8a0,#ffc400 42%,#9c4d00);border-color:#fff2a1;box-shadow:0 0 12px #ffd21f,0 0 32px #ffb200bf}.info-text{color:#d6c29a;font-size:10px;letter-spacing:.7px}.controls-panel{border:1px solid #d6a83e66;border-top:2px solid #d6a83e;border-radius:14px;background:linear-gradient(#070707f5,#160c07f5);box-shadow:inset 0 1px #ffffff0f,0 7px 18px #0008}.bet-adjuster{border-color:#6d5635;background:linear-gradient(#17120d,#050505)}.current-bet{color:#ffd65a}.btn-small{border-color:#7b684b;background:linear-gradient(#3c3429,#17130f)}.spin-button{min-width:150px;background:linear-gradient(#f0c84a,#b8790c 52%,#6c3904);border:2px solid #ffe28a;color:#1b1003;box-shadow:0 4px #4d2803,0 0 20px #ffb70033,inset 0 1px #fff0a8}.win-popup{border:3px solid #f0c94f;background:radial-gradient(circle at 50% 20%,#5d3b0efc,#040404fc 65%);box-shadow:0 0 40px #ffc00059,inset 0 0 25px #000}@media(max-width:500px){.game-wrapper{padding:7px;border-radius:17px}.game-wrapper:before{letter-spacing:1.5px;font-size:8px}.symbol-cell{height:61px;font-size:1.8em}.spin-button{min-width:135px}} </style>'''
          if 'id="tesouro-premium"' not in s: s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          print('PATCH_OK')
          PY
      - name: Verify
        run: grep -q "'🏴‍☠️': 2.00" jogos/tesouro-pirata.html && grep -q 'id="tesouro-premium"' jogos/tesouro-pirata.html && echo VERIFIED
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git commit -m 'Fix Tesouro Pirata payouts and premium UI'
          git push
