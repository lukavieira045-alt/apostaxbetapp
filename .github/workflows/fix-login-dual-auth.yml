name: Fix authentication flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Use phone signup and email or phone login')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('''    const telefoneDigitado=document.getElementById("telefoneLogin").value.trim();
    const senha=document.getElementById("senhaLogin").value;
    const botao=document.getElementById("btnLogin");

    const numeros=telefoneDigitado.replace(/\\D/g,"");
    const telefone=telefoneDigitado.startsWith("+")
        ?"+"+numeros
        :(numeros.length===10||numeros.length===11?"+55"+numeros:"");

    if(!telefone){
        mensagem("mensagemLogin","Digite um celular válido com DDD.","erro");
        return;
    }''','''    const identificador=document.getElementById("telefoneLogin").value.trim();
    const senha=document.getElementById("senhaLogin").value;
    const botao=document.getElementById("btnLogin");
    let credenciais;
    if(identificador.includes("@")){
        credenciais={email:identificador,password:senha};
    }else{
        const numeros=identificador.replace(/\\D/g,"");
        const telefone=identificador.startsWith("+")?"+"+numeros:(numeros.length===10||numeros.length===11?"+55"+numeros:"");
        if(!telefone){ mensagem("mensagemLogin","Digite um e-mail ou celular válido com DDD.","erro"); return; }
        credenciais={phone:telefone,password:senha};
    }''',1)
          s=s.replace('''const {data,error}=await clienteSupabase().auth.signInWithPassword({
            phone:telefone,
            password:senha
        });''','''const {data,error}=await clienteSupabase().auth.signInWithPassword(credenciais);''',1)
          s=s.replace('<label>Celular</label>\n<input id="telefoneLogin" type="tel" inputmode="tel" autocomplete="tel" placeholder="Digite seu número de celular" required>','<label>E-mail ou celular</label>\n<input id="telefoneLogin" type="text" inputmode="email" autocomplete="username" placeholder="Digite seu e-mail ou celular" required>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use phone signup and email or phone login"
          git push
