name: Fix authentication flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Use phone signup and email or phone login')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<label>Celular</label>\s*<input id="telefoneLogin"[^>]*>', '<label>E-mail ou celular</label>\n<input id="telefoneLogin" type="text" inputmode="email" autocomplete="username" placeholder="Digite seu e-mail ou celular" required>', s, count=1)
          if n:
              start=s.find('async function entrar(event){')
              end=s.find('\n}\n\n/* ========================= DADOS DA CONTA', start)
              if start < 0 or end < 0: raise SystemExit('LOGIN FUNCTION NOT FOUND')
              new_func='''async function entrar(event){
              event.preventDefault();
              const identificador=document.getElementById("telefoneLogin").value.trim();
              const senha=document.getElementById("senhaLogin").value;
              const botao=document.getElementById("btnLogin");
              let credenciais;
              if(identificador.includes("@")){
                  credenciais={email:identificador,password:senha};
              }else{
                  const numeros=identificador.replace(/\\D/g,"");
                  const telefone=identificador.startsWith("+")?"+"+numeros:(numeros.length===10||numeros.length===11?"+55"+numeros:"");
                  if(!telefone){ mensagem("mensagemLogin","Digite um e-mail ou celular válido com DDD.","erro"); return; }
                  credenciais={phone:telefone,password:senha};
              }
              botao.disabled=true; botao.innerText="ENTRANDO...";
              try{
                  const {data,error}=await clienteSupabase().auth.signInWithPassword(credenciais);
                  if(error)throw error;
                  sessionStorage.removeItem("apostaxbet_logout");
                  mensagem("mensagemLogin","Login realizado! Entrando...","sucesso");
                  setTimeout(()=>mostrarSite(data.user),500);
              }catch(error){ mensagem("mensagemLogin",traduzirErro(error?.message||error),"erro"); }
              botao.disabled=false; botao.innerText="ENTRAR";
          }'''
              s=s[:start]+new_func+s[end+2:]
          elif 'auth.signInWithPassword(credenciais)' not in s:
              raise SystemExit('LOGIN MARKERS NOT FOUND')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify authentication patch
        run: |
          grep -q 'E-mail ou celular' index.html
          grep -q 'identificador.includes("@")' index.html
          grep -q 'auth.signInWithPassword(credenciais)' index.html
          grep -q 'auth.signUp({' index.html
          grep -q 'phone:telefone' index.html
          echo 'AUTH PATCH VERIFIED'
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && echo 'NO CHANGES' && exit 0
          git commit -m "Use phone signup and email or phone login"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
