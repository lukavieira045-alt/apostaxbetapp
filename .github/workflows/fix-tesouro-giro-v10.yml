name: Finalize Tesouro lobby spin v10
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize spin, line rule and sound
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("statusText.textContent='AUTO: 10 GIROS';spin()", "statusText.textContent='AUTO: 10 GIROS';lobbySpin()", 1)
          s=s.replace("if(m>=3&&PAYOUTS[fs]){mult+=PAYOUTS[fs]*(m-2);", "if(m>=3){mult+=(PAYOUTS[fs]??0.5)*(m-2);", 1)
          if 'function playTesouroSpinSound' not in s:
              marker='async function lobbySpin(){'
              sound='''function playTesouroSpinSound(){\n  try{\n    const C=window.AudioContext||window.webkitAudioContext;\n    if(!C)return;\n    const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());\n    if(ctx.state==='suspended')ctx.resume();\n    const now=ctx.currentTime;\n    const master=ctx.createGain();\n    master.gain.setValueAtTime(0.0001,now);\n    master.gain.exponentialRampToValueAtTime(0.58,now+0.025);\n    master.gain.exponentialRampToValueAtTime(0.0001,now+2.7);\n    const filter=ctx.createBiquadFilter();\n    filter.type='bandpass';filter.frequency.setValueAtTime(950,now);filter.Q.value=0.7;\n    const osc=ctx.createOscillator();\n    osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);\n    osc.frequency.exponentialRampToValueAtTime(620,now+2.4);\n    const lfo=ctx.createOscillator(),lg=ctx.createGain();\n    lfo.frequency.value=12;lg.gain.value=130;\n    lfo.connect(lg);lg.connect(osc.frequency);\n    osc.connect(filter);filter.connect(master);master.connect(ctx.destination);\n    osc.start(now);lfo.start(now);osc.stop(now+2.75);lfo.stop(now+2.75);\n  }catch(e){}\n}\n\n'''
              if marker in s:
                  s=s.replace(marker,sound+marker,1)
                  s=s.replace(marker,marker+'\n  playTesouroSpinSound();',1)
          old="""function playTesouroSpinSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.58,now+.025);master.gain.exponentialRampToValueAtTime(.0001,now+2.7);const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.setValueAtTime(950,now);filter.Q.value=.7;const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(620,now+2.4);const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=12;lg.gain.value=130;lfo.connect(lg);lg.connect(osc.frequency);osc.connect(filter);filter.connect(master);master.connect(ctx.destination);osc.start(now);lfo.start(now);osc.stop(now+2.75);lfo.stop(now+2.75)}catch(e){}}"""
          new="""function playTesouroSpinSound(){try{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.58,now+.025);master.gain.exponentialRampToValueAtTime(.0001,now+2.7);const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(620,now+2.4);osc.connect(master);master.connect(ctx.destination);osc.start(now);osc.stop(now+2.75)}catch(e){}}"""
          if old in s:
              s=s.replace(old,new,1)
          old_start="start:(i)=>{stop();tone(105+i*22,.07,.025,'square');timer=setInterval(()=>tone(115+i*24,.045,.018,'square'),220);return timer}"
          new_start="start:(i)=>{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return null;stop();tone(105+i*22,.07,.025,'square');timer=setInterval(()=>tone(115+i*24,.045,.018,'square'),220);return timer}"
          s=s.replace(old_start,new_start,1)
          old_stop="stop:(i,id)=>{if(timer===id){clearInterval(timer);timer=null}tone(170+i*42,.12,.055,'triangle')}"
          new_stop="stop:(i,id)=>{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return;if(timer===id){clearInterval(timer);timer=null}tone(170+i*42,.12,.055,'triangle')}"
          s=s.replace(old_stop,new_stop,1)
          p.write_text(s,encoding='utf-8')
          print('Otimização aplicada somente ao Tesouro Pirata')
          PY
          git config user.name "ApostaXBet Bot"
          git config user.email "actions@github.com"
          git add jogos/tesouro-pirata.html
          git commit -m "Otimiza audio somente do Tesouro Pirata" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

  evolution-apk:
    if: github.ref == 'refs/heads/evolution-native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare Evolution build
        working-directory: evolution-native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evolution/ai/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('private const val MODEL_URL = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true"','private const val MODEL_URL = "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"')
          s=s.replace('private const val MODEL = "Qwen3-4B-Q4_K_M.gguf"','private const val MODEL = "Qwen3-1.7B-Q4_K_M.gguf"')
          s=s.replace('modelFile.length() < 2_000_000_000L','modelFile.length() < 1_000_000_000L')
          s=s.replace('status.text = "  •  CÉREBRO QWEN3-4B • LOCAL"','status.text = "  •  CÉREBRO QWEN3-1.7B • LOCAL"')
          s=s.replace('hint = "Converse com a Evolution..."','hint = "Escreva para a Evolution..."')
          s=s.replace('text = "🎙"','text = "FALAR"')
          s=s.replace('text = "➤"','text = "ENVIAR"')
          s=s.replace('textSize = 18f; setTextColor(Color.WHITE); setOnClickListener { startListening() }','textSize = 11f; isAllCaps = false; minWidth = 88; minHeight = 54; setTextColor(Color.WHITE); setOnClickListener { startListening() }')
          s=s.replace('textSize = 21f; isEnabled = false; setTextColor(Color.WHITE); setOnClickListener { ask() }','textSize = 11f; isAllCaps = false; minWidth = 88; minHeight = 54; isEnabled = false; setTextColor(Color.WHITE); setOnClickListener { ask() }')
          s=s.replace('private lateinit var chat: TextView','private lateinit var chat: LinearLayout')
          old='''        chat = TextView(this).apply {
            textSize = 15f; setTextColor(Color.rgb(229, 242, 255)); setPadding(12, 10, 12, 10)
            text = "EVOLUTION\\nPreparando o cérebro local..."; setBackgroundColor(Color.rgb(7, 12, 22))
        }
        root.addView(ScrollView(this).apply { addView(chat); setBackgroundColor(Color.rgb(7, 12, 22)) }, LinearLayout.LayoutParams(-1, 0, .31f))'''
          new='''        chat = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(10,10,10,10); setBackgroundColor(Color.rgb(7,12,22)) }
        root.addView(ScrollView(this).apply { addView(chat); setBackgroundColor(Color.rgb(7,12,22)); isFillViewport = true }, LinearLayout.LayoutParams(-1, 0, .31f))'''
          s=s.replace(old,new)
          marker='    private fun setupSpeech() {'
          bubble='''    private fun addBubble(who: String, message: String) {
        val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = if (who == "Você") Gravity.END else Gravity.START; setPadding(4,5,4,5) }
        val bubble = TextView(this).apply { text = message; textSize = 15f; setTextColor(Color.WHITE); setPadding(16,11,16,11); maxWidth = (resources.displayMetrics.widthPixels * .80f).toInt(); background = android.graphics.drawable.GradientDrawable().apply { cornerRadius = 28f; setColor(if (who == "Você") Color.rgb(16,76,105) else Color.rgb(22,30,45)) } }
        val name = TextView(this).apply { text = who; textSize = 10f; setTextColor(Color.rgb(125,160,185)); setPadding(2,0,2,3) }
        val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = if (who == "Você") Gravity.END else Gravity.START }
        box.addView(name); box.addView(bubble); row.addView(box); chat.addView(row, LinearLayout.LayoutParams(-1,-2)); chat.post { (chat.parent as? ScrollView)?.fullScroll(View.FOCUS_DOWN) }
    }

'''
          if marker in s and 'private fun addBubble' not in s: s=s.replace(marker,bubble+marker,1)
          s=s.replace('chat.append("\\nVocê: $q\\n")','addBubble("Você", q)',1)
          s=s.replace('chat.append("Evolution: $a\\n")','addBubble("EVOLUTION", a)',1)
          s=s.replace('chat.append("Evolution: não consegui concluir: ${e.message}\\n")','addBubble("EVOLUTION", "Não consegui concluir: ${e.message ?: "erro desconhecido"}")',1)
          s=s.replace('''chat.text = "EVOLUTION ONLINE\\n\\nNúcleo de inteligência local avançado carregado.\\n\\nRaciocínio • memória • matemática • programação • pesquisa web • voz\\n\\nPode falar comigo, meu Rei."''','''chat.removeAllViews(); addBubble("EVOLUTION", "EVOLUTION ONLINE\\n\\nCérebro local Qwen3-1.7B carregado.\\n\\nRaciocínio • memória • matemática • programação • pesquisa web • voz\\n\\nPode falar comigo, meu Rei.")''',1)
          s=s.replace('''        controls.addView(input, LinearLayout.LayoutParams(0, -2, 1f)); controls.addView(mic, LinearLayout.LayoutParams(58, 58)); controls.addView(send, LinearLayout.LayoutParams(58, 58)); root.addView(controls)''','''        input.imeOptions = android.view.inputmethod.EditorInfo.IME_ACTION_SEND
        input.setOnEditorActionListener { _, actionId, _ -> if (actionId == android.view.inputmethod.EditorInfo.IME_ACTION_SEND) { ask(); true } else false }
        controls.addView(input, LinearLayout.LayoutParams(0, -2, 1f)); controls.addView(mic, LinearLayout.LayoutParams(88, 58)); controls.addView(send, LinearLayout.LayoutParams(88, 58)); root.addView(controls)''',1)
          s=s.replace('''val research = q.length >= 18 && !conversational && (''','''val explicitSearch = Regex("^\\\\s*(pesquisar|pesquise|pesquisa|procure|buscar|busque)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        val research = !conversational && (explicitSearch || q.length >= 18 && (''',1)
          s=s.replace('''Regex("^(quem|qual|quais|o que|como|por que|porque|quando|onde)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        )''','''Regex("^(quem|qual|quais|o que|como|por que|porque|quando|onde)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)
        ))''',1)
          s=s.replace('''val q = URLEncoder.encode(query, "UTF-8")
        val urls = listOf("https://www.google.com/search?q=$q&hl=pt-BR", "https://www.bing.com/search?q=$q&setlang=pt-BR")''','''val searchQuery = query.replace(Regex("^\\\\s*(pesquisar|pesquise|pesquisa|procure|buscar|busque)\\\\s+", RegexOption.IGNORE_CASE), "").trim().ifBlank { query }
        val q = URLEncoder.encode(searchQuery, "UTF-8")
        val urls = listOf("https://html.duckduckgo.com/html/?q=$q", "https://www.google.com/search?q=$q&hl=pt-BR", "https://www.bing.com/search?q=$q&setlang=pt-BR")''',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build APK
        working-directory: evolution-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s evolution-native/app/build/outputs/apk/debug/app-debug.apk
          stat -c '%n %s bytes %y' evolution-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-native-apk-new
          path: evolution-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
