name: temp-pirata-performance-5
on:
  push:
    paths:
      - '.github/workflows/temp-pirata-performance-5.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path='jogos/tesouro-pirata.html';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            let s=Buffer.from(data.content,'base64').toString('utf8');
            const css='.lobby-strip.lobby-spinning .cel{background:#120805;box-shadow:none}.lobby-strip.lobby-spinning .cel:before{display:none}';
            if(!s.includes(css)){
              const marker='</style>\n</head>';
              if(!s.includes(marker)) core.setFailed('style marker not found');
              s=s.replace(marker,css+'\n</style>\n</head>',1);
            }
            const old="const h=col.clientHeight/3;strip.style.height=(vals.length*h)+'px';[...strip.children].forEach(x=>x.style.height=h+'px');";
            const neu="const h=col.clientHeight/3;strip.style.height=(vals.length*h)+'px';strip.style.contain='layout paint';[...strip.children].forEach(x=>x.style.height=h+'px');";
            if(!s.includes(old)) core.setFailed('spin strip marker not found');
            s=s.replace(old,neu,1);
            const content=Buffer.from(s).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Otimiza renderizacao somente do Tesouro Pirata',content,sha:data.sha,branch:'main'});
      - uses: actions/github-script@v7
        with:
          script: |
            const path='.github/workflows/temp-pirata-performance-5.yml';
            const {data}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            await github.rest.repos.deleteFile({owner:context.repo.owner,repo:context.repo.repo,path,message:'Remove workflow temporario do Tesouro Pirata',sha:data.sha,branch:'main'});