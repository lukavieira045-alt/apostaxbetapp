name: Fix Roleta 2 ball stop

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix roulette final ball position
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')
          old = '''// A bola termina no topo, junto ao ponteiro.
bola.style.transform=
`translate(-50%,-50%)
 rotate(0deg)
 translateY(-${raioBola}px)`;

rotacaoBolaAtual=0;'''
          new = '''// A bola termina no topo, alinhada ao número sorteado.
// Como a roda é o elemento pai da bola, a rotação local da bola
// precisa ser igual ao ângulo do número sorteado para compensar
// a rotação da roda e deixar a bola exatamente sobre esse número.
bola.style.transform=
`translate(-50%,-50%)
 rotate(${anguloFinal}deg)
 translateY(-${raioBola}px)`;

rotacaoBolaAtual=anguloFinal;'''
          if old not in s:
              raise SystemExit('Final ball block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Fix Roleta 2 ball stopping on selected number'
          git push
