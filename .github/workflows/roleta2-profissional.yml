name: Roleta 2 audio final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Melhorar somente o som do giro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta2.html'); s=p.read_text(encoding='utf-8')
          marker='ApostaXBet — Roleta 2 Real Spin Sound v2'
          if marker in s: raise SystemExit(0)
          old='function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}\nfunction pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'
          new='''/* ApostaXBet — Roleta 2 Real Spin Sound v2 */
          let somGiroOsc=null,somGiroGain=null,somGiroFilter=null;
          function iniciarSomRoleta(){iniciarAudio();if(!audioContext||somRoletaAtivo)return;somRoletaAtivo=true;try{somGiroOsc=audioContext.createOscillator();somGiroGain=audioContext.createGain();somGiroFilter=audioContext.createBiquadFilter();somGiroOsc.type="triangle";somGiroOsc.frequency.setValueAtTime(78,audioContext.currentTime);somGiroFilter.type="lowpass";somGiroFilter.frequency.setValueAtTime(360,audioContext.currentTime);somGiroGain.gain.setValueAtTime(.0001,audioContext.currentTime);somGiroGain.gain.exponentialRampToValueAtTime(.025,audioContext.currentTime+.35);somGiroOsc.connect(somGiroFilter);somGiroFilter.connect(somGiroGain);somGiroGain.connect(audioContext.destination);somGiroOsc.start();somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},190)}catch(e){}}
          function pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}try{if(somGiroGain&&audioContext)somGiroGain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.22);if(somGiroOsc){setTimeout(()=>{try{somGiroOsc.stop()}catch(e){}somGiroOsc=null},260)}}catch(e){}}'''
          if old in s:s=s.replace(old,new,1)
          else: raise SystemExit('funcoes de som nao encontradas')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Roleta 2: som realista do giro' || exit 0
          git push
