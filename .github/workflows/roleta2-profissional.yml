name: Roleta 2 profissional
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar somente roda e audio da Roleta 2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta2.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ApostaXBet — Roleta 2 Professional Wheel v2 */'
          if marker not in s:
              css = r'''<style>
          /* ApostaXBet — Roleta 2 Professional Wheel v2 */
          .roleta{
            width:min(540px,78vw)!important;
            border:18px solid #3a2410!important;
            border-radius:50%!important;
            background:
              radial-gradient(circle at 50% 50%,#8b5a1f 0 7%,#c99a3d 7.5% 10%,#5a3513 10.5% 11.5%,transparent 12%),
              radial-gradient(circle at 50% 50%,#b87820 0 28%,#5c3410 28.5% 30%,#d5a94a 30.5% 31.5%,#2b1808 32% 34%,#9b651d 34.5% 100%)!important;
            box-shadow:0 0 0 3px #f0c65b,0 0 0 7px #5b3611,0 12px 32px rgba(0,0,0,.95),inset 0 0 25px rgba(0,0,0,.8)!important;
            overflow:visible!important;
          }
          .roleta::before{
            inset:34px!important;
            border-radius:50%!important;
            background:
              repeating-conic-gradient(from -4.86deg,#087a3d 0deg 9.72deg,#b51f25 9.72deg 19.44deg,#111 19.44deg 29.16deg),
              radial-gradient(circle,#15100a 0 54%,#c69232 54.5% 57%,#3b220c 57.5% 100%)!important;
            box-shadow:inset 0 0 0 3px #d7ad55,inset 0 0 0 8px #1b1007,inset 0 0 35px #000,0 0 8px rgba(0,0,0,.9)!important;
          }
          .roleta::after{
            content:"";
            position:absolute;
            inset:48px;
            border-radius:50%;
            z-index:2;
            pointer-events:none;
            background:repeating-conic-gradient(from -4.86deg,rgba(255,255,255,.16) 0deg .7deg,transparent .7deg 9.72deg);
            opacity:.55;
          }
          .numero-roleta{z-index:4!important}
          .numero-roleta span{
            width:31px!important;height:31px!important;margin-left:-15.5px!important;margin-top:-15.5px!important;
            border-radius:50%;
            font-size:13px!important;
            font-family:Georgia,serif;
            font-weight:900!important;
            background:rgba(0,0,0,.18);
            border:1px solid rgba(255,255,255,.16);
            box-shadow:0 1px 3px #000;
          }
          .roleta-centro{
            width:118px!important;height:118px!important;
            background:radial-gradient(circle at 35% 25%,#fff0a8 0,#d5a23e 28%,#9a6218 50%,#4d2a0a 72%,#171006 100%)!important;
            border:7px solid #e1b64d!important;
            box-shadow:inset 0 0 0 3px #633b0d,inset 0 0 22px #241200,0 4px 14px #000,0 0 20px rgba(255,210,80,.25)!important;
            z-index:7!important;
          }
          .roleta-centro::before{
            content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(255,235,160,.6);box-shadow:inset 0 0 8px #5a3107;
          }
          .roleta-centro::after{content:"A"!important;color:#fff1b0!important;font-family:Georgia,serif!important;text-shadow:0 2px 4px #2b1500!important}
          .bola{width:20px!important;height:20px!important;box-shadow:0 0 5px #fff,0 0 12px rgba(255,255,255,.8),inset -2px -2px 3px rgba(0,0,0,.3)!important;z-index:12!important}
          .roleta-area::before{
            top:calc(50% - 304px)!important;
            border-left:15px solid transparent!important;border-right:15px solid transparent!important;border-top:34px solid #e9b83f!important;
            filter:drop-shadow(0 3px 3px #000)!important;
          }
          @media(max-width:650px){
            .roleta{width:88vw!important;border-width:13px!important}
            .roleta::before{inset:25px!important}.roleta::after{inset:36px!important}
            .roleta-centro{width:88px!important;height:88px!important}.roleta-centro::before{inset:13px}
            .numero-roleta span{width:27px!important;height:27px!important;margin-left:-13.5px!important;margin-top:-13.5px!important;font-size:11px!important}
            .roleta-area::before{top:calc(50% - 238px)!important;border-left-width:12px!important;border-right-width:12px!important;border-top-width:28px!important}
          }
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
          # Replace only the roulette spinning sound routines; game/balance logic stays untouched.
          old = '''function somPalheta(){iniciarAudio();if(!audioContext)return;try{const agora=audioContext.currentTime;const osc=audioContext.createOscillator();const ganho=audioContext.createGain();osc.type="square";osc.frequency.setValueAtTime(900+Math.random()*250,agora);osc.frequency.exponentialRampToValueAtTime(480,agora+.045);ganho.gain.setValueAtTime(.0001,agora);ganho.gain.exponentialRampToValueAtTime(.055,agora+.003);ganho.gain.exponentialRampToValueAtTime(.0001,agora+.065);osc.connect(ganho);ganho.connect(audioContext.destination);osc.start(agora);osc.stop(agora+.07)}catch(e){}}
function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}
function pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'''
          new = '''let somGiroOsc=null,somGiroGain=null,somGiroFilter=null;
function somPalheta(){iniciarAudio();if(!audioContext)return;try{const agora=audioContext.currentTime;const osc=audioContext.createOscillator();const ganho=audioContext.createGain();osc.type="triangle";osc.frequency.setValueAtTime(1050+Math.random()*120,agora);osc.frequency.exponentialRampToValueAtTime(620,agora+.035);ganho.gain.setValueAtTime(.0001,agora);ganho.gain.exponentialRampToValueAtTime(.045,agora+.004);ganho.gain.exponentialRampToValueAtTime(.0001,agora+.055);osc.connect(ganho);ganho.connect(audioContext.destination);osc.start(agora);osc.stop(agora+.06)}catch(e){}}
function iniciarSomRoleta(){iniciarAudio();if(!audioContext||somRoletaAtivo)return;somRoletaAtivo=true;try{somGiroOsc=audioContext.createOscillator();somGiroGain=audioContext.createGain();somGiroFilter=audioContext.createBiquadFilter();somGiroOsc.type="sine";somGiroOsc.frequency.setValueAtTime(82,audioContext.currentTime);somGiroFilter.type="lowpass";somGiroFilter.frequency.setValueAtTime(420,audioContext.currentTime);somGiroGain.gain.setValueAtTime(.0001,audioContext.currentTime);somGiroGain.gain.exponentialRampToValueAtTime(.018,audioContext.currentTime+.25);somGiroOsc.connect(somGiroFilter);somGiroFilter.connect(somGiroGain);somGiroGain.connect(audioContext.destination);somGiroOsc.start();somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},190)}catch(e){}}
function pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}try{if(somGiroGain&&audioContext){somGiroGain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.18)}if(somGiroOsc){setTimeout(()=>{try{somGiroOsc.stop()}catch(e){}somGiroOsc=null},220)}}catch(e){}}
'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Melhora roda e som da Roleta 2' || exit 0
          git push
