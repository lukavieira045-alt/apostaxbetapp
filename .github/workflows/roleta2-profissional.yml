name: Roleta 2 profissional
on:
  push:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'ROULETA2-AUTO') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text()

          # Corrige a animação: valores finais absolutos, sem multiplicação de ângulos em calc().
          s=re.sub(r'@keyframes giroRoletaPremium\{.*?\}\s*@keyframes giroBolaPremium\{.*?\}', '''@keyframes giroRoletaPremium{
          from{transform:rotate(var(--inicio-roleta,0deg));}
          to{transform:rotate(var(--fim-roleta,0deg));}
          }

          @keyframes giroBolaPremium{
          from{transform:translate(-50%,-50%) rotate(var(--inicio-bola,0deg)) translateY(var(--raio-bola,-238px));}
          to{transform:translate(-50%,-50%) rotate(var(--fim-bola,0deg)) translateY(var(--raio-bola,-238px));}
          }''', s, count=1, flags=re.S)

          # Faz a bola realmente correr no trilho externo.
          s=s.replace('const raioBola=\nwindow.innerWidth<=650\n?125\n:188;', 'const raioBola=\nwindow.innerWidth<=650\n?165\n:238;')

          # Define os destinos absolutos da animação.
          old='''bola.style.setProperty(\n"--giro-bola",\n`${giroBola}deg`\n);'''
          new=old+'''\n\nroleta.style.setProperty(\n"--fim-roleta",\n`${inicioRoleta+giroRoleta}deg`\n);\n\nbola.style.setProperty(\n"--fim-bola",\n`${inicioBola-giroBola}deg`\n);'''
          if old in s and '"--fim-roleta"' not in s:
              s=s.replace(old,new,1)

          # Camada visual de roleta física: madeira, aro metálico, frets e anel de bolsos.
          visual='''

/* =========================================================
   ROULETTE PRO — VISUAL DE RODA FÍSICA DE CASINO
   ========================================================= */
.roleta{
  border:18px solid #24170c;
  background:
    radial-gradient(circle at 46% 42%,rgba(255,224,150,.18),transparent 17%),
    radial-gradient(circle at 52% 55%,#7b4514 0%,#4a250b 58%,#1c0d04 100%);
  box-shadow:
    0 0 0 3px #d5a24a,
    0 0 0 7px #5b3917,
    0 0 0 10px rgba(255,224,138,.18),
    0 20px 55px rgba(0,0,0,.82),
    inset 0 0 34px #000,
    inset 0 0 5px rgba(255,255,255,.18);
}

.roleta::before{
  inset:14px;
  background:
    repeating-conic-gradient(from -4.8649deg,
      rgba(247,211,125,.95) 0deg .85deg,
      transparent .85deg 9.729729deg),
    conic-gradient(
      #078b45 0deg 9.729729deg,
      #c92822 9.729729deg 19.459458deg,
      #080909 19.459458deg 29.189187deg,
      #c92822 29.189187deg 38.918916deg,
      #080909 38.918916deg 48.648645deg,
      #c92822 48.648645deg 58.378374deg,
      #080909 58.378374deg 68.108103deg,
      #c92822 68.108103deg 77.837832deg,
      #080909 77.837832deg 87.567561deg,
      #c92822 87.567561deg 97.29729deg,
      #080909 97.29729deg 107.027019deg,
      #c92822 107.027019deg 116.756748deg,
      #080909 116.756748deg 126.486477deg,
      #c92822 126.486477deg 136.216206deg,
      #080909 136.216206deg 145.945935deg,
      #c92822 145.945935deg 155.675664deg,
      #080909 155.675664deg 165.405393deg,
      #c92822 165.405393deg 175.135122deg,
      #080909 175.135122deg 184.864851deg,
      #c92822 184.864851deg 194.59458deg,
      #080909 194.59458deg 204.324309deg,
      #c92822 204.324309deg 214.054038deg,
      #080909 214.054038deg 223.783767deg,
      #c92822 223.783767deg 233.513496deg,
      #080909 233.513496deg 243.243225deg,
      #c92822 243.243225deg 252.972954deg,
      #080909 252.972954deg 262.702683deg,
      #c92822 262.702683deg 272.432412deg,
      #080909 272.432412deg 282.162141deg,
      #c92822 282.162141deg 291.89187deg,
      #080909 291.89187deg 301.621599deg,
      #c92822 301.621599deg 311.351328deg,
      #080909 311.351328deg 321.081057deg,
      #c92822 321.081057deg 330.810786deg,
      #080909 330.810786deg 340.540515deg,
      #c92822 340.540515deg 350.270244deg,
      #078b45 350.270244deg 360deg);
  box-shadow:
    inset 0 0 28px #000,
    inset 0 0 9px rgba(255,255,255,.18),
    0 0 0 2px rgba(255,224,138,.2);
}

.roleta::after{
  inset:5px;
  border:3px solid rgba(255,228,160,.42);
  box-shadow:
    inset 0 0 18px #000,
    0 0 0 2px rgba(0,0,0,.5);
}

.numero-roleta::before{
  content:"";
  position:absolute;
  inset:34px;
  border-radius:50%;
  border:3px solid rgba(245,205,119,.48);
  box-shadow:
    0 0 0 5px rgba(34,17,5,.72),
    inset 0 0 20px rgba(0,0,0,.7);
  pointer-events:none;
  z-index:1;
}

.numero-roleta::after{
  content:"";
  position:absolute;
  inset:56px;
  border-radius:50%;
  border:1px solid rgba(255,220,130,.22);
  pointer-events:none;
  z-index:1;
}

.numero-roleta span{
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:-.2px;
  text-shadow:0 2px 3px #000,0 0 4px rgba(0,0,0,.9);
  filter:drop-shadow(0 1px 1px #000);
}

.roleta-centro{
  width:136px;
  height:136px;
  border:8px solid #b77a19;
  background:
    radial-gradient(circle at 35% 25%,#fff5c6 0%,#edbd58 18%,#b97819 43%,#6c3c09 68%,#1c0b02 100%);
  box-shadow:
    inset 0 0 18px #3a1b00,
    inset 0 0 3px rgba(255,255,255,.55),
    0 0 0 4px #e1b557,
    0 0 0 7px #57320d,
    0 0 25px rgba(0,0,0,.85);
}

.roleta-centro::before{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:34px;height:34px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:4px solid #f4cf73;
  box-shadow:inset 0 0 8px #4a2606,0 2px 5px #000;
  pointer-events:none;
}

.roleta-centro::after{
  content:"A";
  font-size:42px;
  color:#fff4c4;
  text-shadow:0 2px 6px #000,0 0 10px rgba(255,218,120,.3);
}

.bola{
  width:20px;
  height:20px;
  background:radial-gradient(circle at 30% 25%,#fff 0%,#fff 34%,#e4e4e4 65%,#a9a9a9 100%);
  box-shadow:0 0 7px #fff,0 0 16px rgba(255,255,255,.95),0 0 28px rgba(255,255,255,.55),inset -2px -2px 3px rgba(0,0,0,.35);
  z-index:12;
}

@media(max-width:650px){
  .roleta{width:84vw;border-width:12px}
  .roleta-centro{width:90px;height:90px}
  .numero-roleta span{font-size:11px}
  .bola{width:16px;height:16px}
}
'''
          s=s.replace('</style>',visual+'\n</style>',1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'ROULETA2-AUTO: visual profissional e giro realista'
          git push
