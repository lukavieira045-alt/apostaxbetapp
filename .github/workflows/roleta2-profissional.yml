name: Roleta 2 cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Roleta 2: remove rodada extra') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover segunda rodada e som extra
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          # Remove only the extra visual spin layers previously injected.
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 FINAL REAL CASINO WHEEL \*/.*?</style>\s*', '', s, flags=re.S)
          s=re.sub(r'<style>\s*/\* ApostaXBet — Roleta 2 Physical Opposite Spin v1 \*/.*?</style>\s*', '', s, flags=re.S)
          # Remove the click hook that caused the second wheel/ball animation.
          s=re.sub(r'<script>\s*\(function\(\)\{function arm\(\).*?btn-girar.*?spin-fisico.*?</script>\s*', '', s, flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{function arm\(\).*?btn-girar.*?spin-real.*?</script>\s*', '', s, flags=re.S)
          # Restore the original spin sound controller; no continuous music/oscillator.
          marker='/* ApostaXBet — Roleta 2 Real Spin Sound v2 */'
          if marker in s:
              start=s.find(marker)
              end=s.find('function pararSomRoleta()', start)
              if end!=-1:
                  close=s.find('}', end)
                  if close!=-1:
                      close+=1
                      s=s[:start]+'function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}\nfunction pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'+s[close:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/roleta2.html
          git commit -m 'Roleta 2: remove rodada extra' || exit 0
          git push
