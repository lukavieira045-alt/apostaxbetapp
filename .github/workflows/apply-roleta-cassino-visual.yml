name: Apply Roleta Cassino visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-roleta-cassino-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    if: "!contains(github.event.head_commit.message, '[skip roleta visual]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual-only CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/roleta-cassino.html')
          s=p.read_text(encoding='utf-8')
          marker='<style id="ax-cassino-visual-v2">'
          if marker in s:
              raise SystemExit('visual already applied')
          css='''
          body{background:radial-gradient(circle at 50% -10%,#163d32 0,#07110e 38%,#020504 100%)!important;color:#f4f0e5!important;font-family:Arial,sans-serif!important;overflow-x:hidden}
          body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 18% 20%,rgba(31,194,112,.10),transparent 28%),radial-gradient(circle at 82% 12%,rgba(212,164,76,.08),transparent 25%)}
          .top{height:64px!important;background:linear-gradient(180deg,#101b17,#07100d)!important;border-bottom:1px solid #b88a3b!important;box-shadow:0 8px 28px rgba(0,0,0,.45)!important;padding:0 16px!important;font-size:13px!important;font-weight:800!important;letter-spacing:.3px}
          .online{color:#54e49a!important;text-shadow:0 0 12px rgba(84,228,154,.5)!important}
          .area{max-width:960px!important;padding:12px!important}
          .mesa{height:470px!important;border:1px solid rgba(203,166,92,.35)!important;border-radius:20px!important;background:radial-gradient(circle at 34% 20%,#17654a 0,#0a3327 34%,#061b15 70%,#030a08 100%)!important;box-shadow:0 18px 55px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.04)!important}
          .roleta-area{left:18px!important;top:66px!important;width:175px!important;height:175px!important}
          .ponteiro{top:-18px!important;border-left-width:12px!important;border-right-width:12px!important;border-top:31px solid #e8c46a!important;filter:drop-shadow(0 3px 5px #000)!important}
          .roleta{width:175px!important;height:175px!important;border:9px solid #9c7134!important;box-shadow:0 0 0 2px #e3bd67,0 0 0 7px rgba(31,18,7,.9),0 18px 34px rgba(0,0,0,.75),inset 0 0 22px rgba(0,0,0,.5)!important}
          .roleta::before{content:"";position:absolute;inset:10px;border:1px solid rgba(246,215,139,.75);border-radius:50%;pointer-events:none;z-index:3}
          .roleta::after{content:"";position:absolute;inset:25px;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none;z-index:3}
          .numero-roleta{font-size:10px!important;font-weight:900!important;text-shadow:0 1px 3px #000!important}
          .centro-roleta{width:50px!important;height:50px!important;margin-left:-25px!important;margin-top:-25px!important;border:2px solid #edc878!important;box-shadow:0 0 0 4px #2b1808,0 3px 10px #000!important}
          .mesa-jogo{left:22%!important;right:2%!important;top:42px!important;height:380px!important;background:linear-gradient(145deg,#0b4635,#083426 55%,#061f17)!important;border:2px solid #b99550!important;border-radius:16px!important;box-shadow:0 0 0 5px rgba(8,22,17,.85),0 18px 42px rgba(0,0,0,.7),inset 0 0 35px rgba(0,0,0,.28)!important;padding:15px!important}
          .numero{height:40px!important;border:1px solid rgba(218,199,150,.38)!important;background:linear-gradient(180deg,#123e32,#0b2b22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease!important}
          .numero:hover{filter:brightness(1.18)!important;transform:translateY(-1px)!important;box-shadow:inset 0 0 0 1px rgba(236,204,123,.55),0 5px 12px rgba(0,0,0,.25)!important}
          .vermelho{background:linear-gradient(180deg,#b72b32,#74191f)!important}
          .preto{background:linear-gradient(180deg,#151b19,#080b0a)!important}
          .zero{background:linear-gradient(180deg,#13945a,#075c39)!important;border:2px solid #e1c16f!important;box-shadow:0 0 14px rgba(40,205,121,.18),inset 0 0 18px rgba(0,0,0,.25)!important}
          .faixas{margin-top:6px!important}
          .faixa{height:46px!important;background:linear-gradient(180deg,#14503d,#0b3025)!important;border:1px solid rgba(224,195,126,.42)!important;border-radius:5px!important;margin:2px!important;transition:filter .16s ease,transform .16s ease!important}
          .faixa:hover{filter:brightness(1.18)!important;transform:translateY(-1px)!important}
          .faixa.vermelho{background:linear-gradient(180deg,#b62b33,#74191f)!important}
          .selecionado{box-shadow:inset 0 0 0 2px #e7c56d,0 0 12px rgba(231,197,109,.28)!important;filter:brightness(1.15)!important}
          .aviso{left:18px!important;bottom:16px!important;background:rgba(3,9,7,.92)!important;border:1px solid rgba(220,186,105,.48)!important;border-radius:999px!important;padding:10px 15px!important;box-shadow:0 8px 24px rgba(0,0,0,.45)!important;font-size:11px!important;backdrop-filter:blur(8px)!important}
          .controles{margin:12px 0 0!important;background:linear-gradient(180deg,#0d1713,#060a08)!important;border:1px solid rgba(200,169,99,.28)!important;border-radius:16px!important;padding:14px!important;box-shadow:0 14px 35px rgba(0,0,0,.45)!important}
          .linha{font-size:13px!important;color:#aeb8b2!important}.linha b{color:#70e7a2!important}
          .fichas{gap:10px!important;padding:2px 2px 14px!important}
          .ficha{min-width:48px!important;height:48px!important;border:2px solid #d9d1bc!important;background:radial-gradient(circle at 35% 25%,#f0d99a,#9b712f 58%,#493014 100%)!important;color:#17110a!important;box-shadow:0 5px 14px rgba(0,0,0,.45)!important;transition:transform .16s ease!important}
          .ficha:hover{transform:translateY(-2px)!important}
          .ficha.ativa{outline:2px solid #f3d47b!important;box-shadow:0 0 0 5px rgba(243,212,123,.12),0 7px 18px rgba(0,0,0,.55)!important}
          .botoes{gap:10px!important}
          button{border-radius:10px!important;border:1px solid rgba(220,196,143,.32)!important;background:linear-gradient(180deg,#1b2621,#0b100e)!important;box-shadow:0 6px 16px rgba(0,0,0,.3)!important;transition:transform .15s ease,filter .15s ease!important}
          button:hover{filter:brightness(1.12)!important;transform:translateY(-1px)!important}
          #btnGirar{background:linear-gradient(180deg,#19a767,#087143)!important;border-color:#62e8a4!important;box-shadow:0 0 20px rgba(25,167,103,.18),0 7px 18px rgba(0,0,0,.35)!important}
          #mensagem{color:#e7e1d3!important}.nota{color:#68736d!important}
          #carregando{background:radial-gradient(circle at 50% 45%,#12382c,#040807 70%)!important}
          @media(max-width:600px){.top{height:58px!important}.area{padding:8px!important}.mesa{height:450px!important;border-radius:14px!important}.roleta-area{left:8px!important;top:58px!important;width:150px!important;height:150px!important}.roleta{width:150px!important;height:150px!important}.mesa-jogo{left:20%!important;right:-7%!important;top:52px!important;height:360px!important;border-radius:12px!important;padding:12px!important}.numero{height:37px!important;font-size:10px!important}.faixa{height:42px!important}.controles{margin-top:8px!important;border-radius:13px!important}.ficha{min-width:46px!important;height:46px!important}}
          '''
          block=marker+css+'</style>'
          s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit visual change
        run: |
          git config user.name 'ApostaXBet Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add jogos/roleta-cassino.html
          git diff --cached --quiet || git commit -m 'style: premium visual roleta cassino [skip roleta visual]'
          git push
