name: Evolution Native APK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'evolution-native/**'
      - '.github/workflows/evolution-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: evolution-native
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s evolution-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-native-apk
          path: evolution-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
