name: Fix Roleta Relampago
on:
  push:
    paths:
      - '.github/workflows/fix-roleta-relampago.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolar performance da Roleta 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jogos/performance.js')
          s = p.read_text()
          old = "  function instalar() {\n"
          new = "  function instalar() {\n    if (document.title.includes('Roleta de Relâmpagos') || !document.querySelector('.roleta-centro')) return;\n"
          if new not in s:
              if old not in s:
                  raise SystemExit('assinatura não encontrada')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          git config user.name 'ApostaXBet Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add jogos/performance.js
          git diff --cached --quiet || git commit -m 'Fix botão GIRAR da Roleta de Relâmpagos'
          git push
      - name: Remover workflow temporario
        run: |
          git rm .github/workflows/fix-roleta-relampago.yml
          git commit -m 'Remove workflow temporario da Roleta de Relâmpagos'
          git push
