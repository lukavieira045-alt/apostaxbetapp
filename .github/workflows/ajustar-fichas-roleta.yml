name: Ajustar Fichas Roleta

on:
  push:
    branches: [ main ]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar roleta
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('jogos/roleta-cassino.html')
          s = p.read_text(encoding='utf-8')

          old = '''.ficha-aposta{
    position:absolute;
    right:2px;
    bottom:2px;
    min-width:19px;
    height:19px;
    padding:0 4px;
    border-radius:50%;
    border:2px solid #fff;
    background:radial-gradient(circle at 35% 30%,#fff7c7,#ffd43b 45%,#b8860b 100%);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:900;
    line-height:1;
    box-shadow:0 1px 3px #000;
    z-index:4;
    pointer-events:none;
}'''

          new = '''.ficha-aposta{
    position:absolute;
    right:2px;
    bottom:2px;
    width:25px;
    height:25px;
    padding:0;
    border-radius:50%;
    border:2px solid #fff;
    background:
        repeating-conic-gradient(
            from 0deg,
            #b51e25 0deg 12deg,
            #fff 12deg 24deg
        );
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:900;
    line-height:1;
    box-shadow:0 1px 4px #000, inset 0 0 0 2px #b51e25;
    z-index:4;
    pointer-events:none;
}

.ficha-aposta::before{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#e9e9e9 55%,#aaa 100%);
    border:1px solid #555;
    z-index:-1;
}

.ficha-aposta::after{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    border:1px dashed #b51e25;
    pointer-events:none;
}'''

          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('''    .ficha-aposta{
        right:1px;
        bottom:1px;
        min-width:17px;
        height:17px;
        font-size:7px;
        padding:0 3px
    }''', '''    .ficha-aposta{
        right:1px;
        bottom:1px;
        width:22px;
        height:22px;
        font-size:7px
    }

    .ficha-aposta::before{inset:4px}
    .ficha-aposta::after{inset:6px}''', 1)

          old_js = '''        botao.onclick =
            function(){

                fazerAposta(
                    botao.dataset.bet,
                    this
                );
            };'''
          new_js = '''        botao.onclick =
            function(event){

                if(event){
                    event.preventDefault();
                    event.stopPropagation();
                }

                fazerAposta(
                    botao.dataset.bet,
                    this
                );
            };

        botao.onpointerdown =
            function(event){
                if(event){
                    event.preventDefault();
                    event.stopPropagation();
                }
            };'''
          if old_js in s:
              s = s.replace(old_js, new_js, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Acrescentar detalhes visuais na pagina principal sem mexer no que ja existe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'apostaxbet-home-extra-v1' in s:
              print('Melhoria visual da home ja aplicada.')
          else:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Nao encontrei </body> no index.html')

              inject = r'''\n<!-- apostaxbet-home-extra-v1 -->
<style id="apostaxbet-home-extra-v1">
.ax-home-extra{
  margin:14px 15px 4px;
  padding:14px 12px 12px;
  border:1px solid rgba(250,204,21,.28);
  border-radius:16px;
  background:linear-gradient(135deg,rgba(20,90,56,.72),rgba(7,42,26,.88));
  box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
  overflow:hidden;
}
.ax-home-extra::before{
  content:"";
  position:absolute;
  width:130px;height:130px;
  right:-55px;top:-70px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(250,204,21,.16),transparent 68%);
  animation:axExtraGlow 3.6s ease-in-out infinite;
}
.ax-home-extra-head{
  position:relative;
  z-index:1;
  text-align:center;
  margin-bottom:10px;
}
.ax-home-extra-title{
  font-size:18px;
  font-weight:900;
  color:#facc15;
  letter-spacing:.3px;
  text-shadow:0 0 8px rgba(250,204,21,.28);
}
.ax-home-extra-sub{
  margin-top:3px;
  font-size:11px;
  color:#bbf7d0;
}
.ax-home-extra-items{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.ax-home-extra-item{
  min-height:58px;
  padding:8px 5px;
  border-radius:11px;
  background:rgba(10,46,28,.72);
  border:1px solid rgba(134,239,172,.14);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:3px;
}
.ax-home-extra-icon{font-size:20px;line-height:1}
.ax-home-extra-item strong{font-size:9px;color:#fff}
.ax-home-extra-item span{font-size:8px;color:#86efac;line-height:1.15}
.ax-home-extra-foot{
  position:relative;
  z-index:1;
  margin-top:9px;
  text-align:center;
  font-size:9px;
  color:rgba(255,255,255,.62);
}
@keyframes axExtraGlow{
  0%,100%{transform:scale(.9);opacity:.45}
  50%{transform:scale(1.18);opacity:1}
}
@media(max-width:360px){
  .ax-home-extra{margin-left:12px;margin-right:12px}
  .ax-home-extra-title{font-size:16px}
  .ax-home-extra-items{gap:5px}
}
</style>
<script id="apostaxbet-home-extra-v1">
(function(){
  function montar(){
    if(document.getElementById('ax-home-extra')) return;
    var site=document.getElementById('site');
    if(!site) return;
    var jackpot=site.querySelector('.jackpot-banner');
    if(!jackpot) return;
    var box=document.createElement('section');
    box.id='ax-home-extra';
    box.className='ax-home-extra';
    box.innerHTML=''
      +'<div class="ax-home-extra-head">'
      +'<div class="ax-home-extra-title">✨ SUA EXPERIÊNCIA APOSTAXBET</div>'
      +'<div class="ax-home-extra-sub">Explore os jogos e encontre seu próximo favorito</div>'
      +'</div>'
      +'<div class="ax-home-extra-items">'
      +'<div class="ax-home-extra-item"><div class="ax-home-extra-icon">🎰</div><strong>JOGOS</strong><span>Vários estilos</span></div>'
      +'<div class="ax-home-extra-item"><div class="ax-home-extra-icon">⚡</div><strong>RÁPIDOS</strong><span>Entre e jogue</span></div>'
      +'<div class="ax-home-extra-item"><div class="ax-home-extra-icon">💎</div><strong>DESTAQUES</strong><span>Confira as novidades</span></div>'
      +'</div>'
      +'<div class="ax-home-extra-foot">🔞 Jogue com responsabilidade • Divirta-se</div>';
    jackpot.insertAdjacentElement('afterend',box);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar);
  else montar();
  setTimeout(montar,800);
})();
</script>
'''
              s = s.replace(marker, inject + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Melhoria visual da home adicionada.')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/roleta-cassino.html index.html
          git diff --cached --quiet || git commit -m "Melhorar visual da home sem alterar funcionalidades"
          git push
