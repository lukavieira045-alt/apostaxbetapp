name: Fix email authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-auth:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'fix: apply email authentication correction'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal auth correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('<label>Telefone</label>\n<input id="telefoneCadastro" type="tel" placeholder="Digite seu telefone" required>', '<label>E-mail</label>\n<input id="emailCadastro" type="email" autocomplete="email" placeholder="Digite seu e-mail" required>'),
            ('<label>Celular</label>\n<input id="telefoneLogin" type="tel" inputmode="tel" autocomplete="tel" placeholder="Digite seu número de celular" required>', '<label>E-mail</label>\n<input id="emailLogin" type="email" inputmode="email" autocomplete="email" placeholder="Digite seu e-mail" required>'),
            ('const telefoneDigitado=document.getElementById("telefoneCadastro").value.trim();', 'const email=document.getElementById("emailCadastro").value.trim();'),
            ('    const numeros=telefoneDigitado.replace(/\\D/g,"");\n    const telefone=telefoneDigitado.startsWith("+")\n        ?"+"+numeros\n        :(numeros.length===10||numeros.length===11?"+55"+numeros:"");\n\n    if(!telefone){\n        mensagem("mensagemCadastro","Digite um celular válido com DDD.","erro");\n        return;\n    }', '    if(!email){\n        mensagem("mensagemCadastro","Digite um e-mail válido.","erro");\n        return;\n    }'),
            ('        const {data,error}=await clienteSupabase().auth.signUp({\n            phone:telefone,\n            password:senha,\n            options:{data:{nome,full_name:nome,telefone,phone:telefone}}\n        });', '        const {data,error}=await clienteSupabase().auth.signUp({\n            email,\n            password:senha,\n            options:{data:{nome,full_name:nome}}\n        });'),
            ('            mensagem("mensagemCadastro","Conta criada, mas a sessão automática não foi liberada. Desative a confirmação de telefone no Supabase para entrar imediatamente.","erro");', '            mensagem("mensagemCadastro","Conta criada, mas a sessão automática não foi liberada. Verifique a confirmação de e-mail no Supabase.","erro");'),
            ('    const telefoneDigitado=document.getElementById("telefoneLogin").value.trim();', '    const email=document.getElementById("emailLogin").value.trim();'),
            ('    const numeros=telefoneDigitado.replace(/\\D/g,"");\n    const telefone=telefoneDigitado.startsWith("+")\n        ?"+"+numeros\n        :(numeros.length===10||numeros.length===11?"+55"+numeros:"");\n\n    if(!telefone){\n        mensagem("mensagemLogin","Digite um celular válido com DDD.","erro");\n        return;\n    }', '    if(!email){\n        mensagem("mensagemLogin","Digite um e-mail válido.","erro");\n        return;\n    }'),
            ('        const {data,error}=await clienteSupabase().auth.signInWithPassword({\n            phone:telefone,\n            password:senha\n        });', '        const {data,error}=await clienteSupabase().auth.signInWithPassword({\n            email,\n            password:senha\n        });'),
            ('        return "Celular ou senha incorretos.";', '        return "E-mail ou senha incorretos.";'),
            ('        return "Esse celular já está cadastrado.";', '        return "Esse e-mail já está cadastrado.";'),
            ('        return "Digite um celular válido com DDD.";', '        return "Digite um e-mail válido.";'),
            ('        return "Confirme seu celular antes de entrar.";', '        return "Confirme seu e-mail antes de entrar.";'),
            ('            "Celular ou senha incorretos."', '            "E-mail ou senha incorretos."'),
            ('            "Esse celular já está cadastrado."', '            "Esse e-mail já está cadastrado."'),
            ('            "Digite um celular válido com DDD."', '            "Digite um e-mail válido."'),
            ('            "Confirme seu celular antes de entrar."', '            "Confirme seu e-mail antes de entrar."'),
            ('            "✅ Cadastro com nome, celular e senha — sem e-mail, sem CPF e sem SMS."', '            "✅ Cadastro com nome, e-mail e senha."'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:100]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- index.html

      - name: Commit corrected index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: apply email authentication correction"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-email-auth.yml
          git commit -m "chore: remove temporary auth fix workflow"
          git push
