name: AX temporary image patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'AX: add maca image') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add illustrative game image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '''\n</div>\n\n</div>\n</div>\n\n</section>'''
          card = '''\n<div class="game-card ilustrativo" data-cat="popular slots" data-jogo="Em breve" data-icon="🍎" data-ilustrativo="true">\n<img class="game-img" src="jogos/maca%20imagen.png" alt="Em breve" loading="lazy">\n<span class="like-icon">👍</span>\n<span class="fav-icon">⭐</span>\n<div class="game-overlay">\n<span class="game-name">EM BREVE</span>\n<span class="provider-tag">AX</span>\n</div>\n</div>\n'''
          anchor = '''<div class="game-card"\ndata-cat="popular slots"\ndata-jogo="Tesouro Pirata"'''
          pos = s.find(anchor)
          if pos < 0:
              raise SystemExit('Tesouro Pirata card not found')
          end = s.find(marker, pos)
          if end < 0:
              raise SystemExit('games-grid closing marker not found')
          s = s[:end] + card + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "AX: add maca image" --allow-empty
          git push
