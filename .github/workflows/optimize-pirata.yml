name: optimize pirate performance
on:
  push:
    paths:
      - '.github/workflows/optimize-pirata.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize only pirate game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jogos/tesouro-pirata.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* PERFORMANCE — TESOURO PIRATA */\n.rolos{contain:layout paint;backface-visibility:hidden;transform:translateZ(0)}\n.col,.cel{backface-visibility:hidden}\n.cel img{backface-visibility:hidden}\n.perf-spin .cel:before,.perf-spin .cel img{filter:none!important;box-shadow:none!important}\n.perf-spin .cel{box-shadow:inset 0 0 8px #000}\n.perf-spin .reelWindow,.perf-spin .machine{box-shadow:none!important}\n'''
          if '/* PERFORMANCE — TESOURO PIRATA */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          js='''\n<script>\n(function(){\n  const game=document.querySelector('.casino');\n  const spin=document.querySelector('.spin');\n  if(!game||!spin)return;\n  let timer=0;\n  spin.addEventListener('click',function(){\n    game.classList.add('perf-spin');\n    clearTimeout(timer);\n    timer=setTimeout(()=>game.classList.remove('perf-spin'),5200);\n  },{passive:true});\n})();\n</script>\n'''
          if 'perf-spin' not in s.split('</body>')[0] or 'clearTimeout(timer)' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git diff --cached --quiet || git commit -m 'Otimizar desempenho do Tesouro Pirata'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/optimize-pirata.yml
          git add -u .github/workflows/optimize-pirata.yml || true
          git diff --cached --quiet || git commit -m 'Remover workflow temporario de otimizacao'
          git push origin HEAD:main || true
