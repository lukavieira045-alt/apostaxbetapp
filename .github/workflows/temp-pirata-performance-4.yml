name: temp-pirata-performance-4
on:
  push:
    paths:
      - '.github/workflows/temp-pirata-performance-4.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Otimizar somente Tesouro Pirata
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'jogos/tesouro-pirata.html';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            let html = Buffer.from(data.content, 'base64').toString('utf8');
            const old = "function playTesouroSpinSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.58,now+.025);master.gain.exponentialRampToValueAtTime(.0001,now+2.7);const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.setValueAtTime(950,now);filter.Q.value=.7;const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(620,now+2.4);const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=12;lg.gain.value=130;lfo.connect(lg);lg.connect(osc.frequency);osc.connect(filter);filter.connect(master);master.connect(ctx.destination);osc.start(now);lfo.start(now);osc.stop(now+2.75);lfo.stop(now+2.75)}catch(e){}}";
            const replacement = "function playTesouroSpinSound(){try{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.58,now+.025);master.gain.exponentialRampToValueAtTime(.0001,now+2.7);const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(620,now+2.4);osc.connect(master);master.connect(ctx.destination);osc.start(now);osc.stop(now+2.75)}catch(e){}}";
            if (!html.includes(old)) core.setFailed('playTesouroSpinSound target not found; aborting.');
            html = html.replace(old, replacement);
            const oldStart = "start:(i)=>{stop();tone(105+i*22,.07,.025,'square');timer=setInterval(()=>tone(115+i*24,.045,.018,'square'),220);return timer}";
            const newStart = "start:(i)=>{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return null;stop();tone(105+i*22,.07,.025,'square');timer=setInterval(()=>tone(115+i*24,.045,.018,'square'),220);return timer}";
            if (!html.includes(oldStart)) core.setFailed('spinAudio target not found; aborting.');
            html = html.replace(oldStart, newStart);
            const oldStop = "stop:(i,id)=>{if(timer===id){clearInterval(timer);timer=null}tone(170+i*42,.12,.055,'triangle')}";
            const newStop = "stop:(i,id)=>{if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)return;if(timer===id){clearInterval(timer);timer=null}tone(170+i*42,.12,.055,'triangle')}";
            if (!html.includes(oldStop)) core.setFailed('spinAudio stop target not found; aborting.');
            html = html.replace(oldStop, newStop);
            const content = Buffer.from(html).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message:'Otimiza audio somente do Tesouro Pirata', content, sha:data.sha, branch:'main'});
      - name: Remover workflow temporario
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/temp-pirata-performance-4.yml';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref:'main'});
            await github.rest.repos.deleteFile({owner: context.repo.owner, repo: context.repo.repo, path, message:'Remove workflow temporario do Tesouro Pirata', sha:data.sha, branch:'main'});
