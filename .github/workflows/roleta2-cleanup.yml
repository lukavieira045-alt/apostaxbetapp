name: Roleta 2 ajuste final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajuste:
    if: ${{ !contains(github.event.head_commit.message, 'Roleta 2 giro e som final') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar visual aprovado e remover somente segunda rodada
        shell: bash
        run: |
          git show 1b4a507638556010561d5792739d96ab7964f443:jogos/roleta2.html > jogos/roleta2.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html')
          s=p.read_text(encoding='utf-8')
          # Mantém exatamente o visual/giro físico aprovado, inclusive spin-real.
          # Remove somente a segunda animação da bolinha iniciada após a contagem.
          pattern=r'\s*const animacaoBola\s*=\s*bola\.animate\(\s*\[.*?\]\s*,\s*\{\s*duration\s*:\s*10000\s*,.*?\}\s*\);\s*\n?\s*await animacaoBola\.finished\s*;'
          s,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Segunda animacao nao encontrada: {n}')
          # Garante que nao restou nenhuma animacao de 10s dessa rodada.
          if re.search(r'animacaoBola|duration\s*:\s*10000',s):
              raise SystemExit('Ainda existe animacao de 10 segundos')
          # Aprovado deve continuar com o hook spin-real de roda/bola em sentidos opostos.
          if 'spin-real' not in s:
              raise SystemExit('Hook spin-real aprovado ausente')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Roleta 2 giro e som final'
          git push
