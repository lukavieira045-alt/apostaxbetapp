name: Roleta 2 cleanup final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Roleta 2 ajuste giro final') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar somente giro e som da Roleta 2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/roleta2.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script>\s*\(function\(\)\{.*?closest\(\'\.btn-girar\'\).*?spin-real.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*\(function\(\)\{.*?closest\(\'\.btn-girar\'\).*?spin-fisico.*?</script>\s*','',s,flags=re.S)
          marker='/* ApostaXBet — Roleta 2 Real Spin Sound v2 */'
          if marker in s:
              start=s.find(marker); end=s.find('function pararSomRoleta()',start)
              if end!=-1:
                  close=s.find('}',end)
                  if close!=-1:
                      close+=1
                      original='function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=true;somPalheta();intervaloSomRoleta=setInterval(()=>{if(somRoletaAtivo)somPalheta()},145)}\nfunction pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}'
                      s=s[:start]+original+s[close:]
          s=s.replace('{duration:10000,easing:"cubic-bezier(.08,.02,.12,1)",fill:"forwards"}','{duration:7500,easing:"cubic-bezier(.08,.02,.12,1)",fill:"forwards"}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jogos/roleta2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Roleta 2 ajuste giro final'
          git push
