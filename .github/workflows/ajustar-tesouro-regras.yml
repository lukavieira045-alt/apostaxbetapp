name: Ajustar regras do Tesouro Pirata
on:
  push:
    paths:
      - '.github/workflows/ajustar-tesouro-regras.yml'
jobs:
  ajustar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar jogo
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path=Path('jogos/tesouro-pirata.html')
          s=path.read_text(encoding='utf-8')
          s=re.sub(r"const SYMBOLS=\[[^\n]*\];", "const SYMBOLS=['captain','K','Q','J','A'];", s, count=1)
          start=s.find('async function wins(')
          brace=s.find('{',start)
          depth=0
          end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          if start<0 or end is None: raise SystemExit('wins nao encontrada')
          new='''async function wins(grid){
            let totalMultiplier=0;
            const winningCells=[];
            for(let r=0;r<ROWS;r++){
              const first=grid[0][r];
              if(grid.every(col=>col[r]===first) && PAYOUTS[first]){
                const mult=Math.min(5*PAYOUTS[first],MAX_TOTAL_MULTIPLIER-totalMultiplier);
                if(mult>0){
                  totalMultiplier+=mult;
                  for(let c=0;c<COLS;c++) winningCells.push(document.querySelector(`#col-${c} .cel:nth-child(${r+1})`));
                }
              }
            }
            if(totalMultiplier<=0){prizeValue.textContent='0,00';return;}
            winningCells.filter(Boolean).forEach(c=>c.classList.add('win'));
            const prize=currentBet*totalMultiplier;
            prizeValue.textContent=money(prize);
            winValue.textContent=money(prize);
            winPopup.classList.add('on');
            if(typeof winSound==='function') winSound();
            await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);
            setTimeout(()=>winPopup.classList.remove('on'),1400);
          }'''
          s=s[:start]+new+s[end:]
          s=s.replace('ENCONTRE 3 OU MAIS ☠ PARA GANHAR!','5 IGUAIS NA MESMA LINHA PARA GANHAR!')
          s=s.replace("statusText.textContent='BOA SORTE!'","statusText.textContent='5 IGUAIS NA MESMA LINHA PARA GANHAR!'")
          path.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/tesouro-pirata.html
          git commit -m 'Simplificar simbolos e regra de cinco iguais'
          git push
      - name: Remover workflow temporario
        if: success()
        run: |
          git rm .github/workflows/ajustar-tesouro-regras.yml
          git commit -m 'Remover workflow temporario'
          git push
