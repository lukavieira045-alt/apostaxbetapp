name: Temporary Roleta Cassino Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update roulette betting logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('jogos/roleta-cassino.html')
          text = path.read_text(encoding='utf-8')

          old = '''    let premioBruto = 0;\n\n\n    apostas.forEach(\n        function(aposta){\n\n            if(\n                ganhou(\n                    aposta.tipo,\n                    resultado\n                )\n            ){\n\n                if(\n                    typeof aposta.tipo === "number"\n                ){\n\n                    premioBruto +=\n                        aposta.valor * 36;\n\n                }else{\n\n                    premioBruto +=\n                        aposta.valor * 2;\n                }\n            }\n        }\n    );\n\n\n    /*\n       MANTIDO O MESMO CÁLCULO\n       DA ROLETA ORIGINAL.\n\n       Apenas a forma de colocar\n       o prêmio no saldo mudou:\n       agora usa SistemaSaldo.\n    */\n\n    const premioFinal =\n        premioBruto * TAXA_CASA;'''

          new = '''    /*\n       CADA FICHA REPRESENTA UMA APOSTA INDEPENDENTE.\n       Em números, o retorno total é 2x o valor\n       colocado naquele número.\n\n       Exemplo:\n       R$5 no 1 -> R$10 de retorno se sair 1.\n       R$1 no 3 -> R$2 de retorno se sair 3.\n\n       As fichas de números diferentes são somadas\n       apenas quando os respectivos números vencem.\n       O desconto da aposta continua sendo feito\n       pelo SistemaSaldo no início da rodada.\n    */\n\n    let premioFinal = 0;\n\n\n    apostas.forEach(\n        function(aposta){\n\n            if(\n                ganhou(\n                    aposta.tipo,\n                    resultado\n                )\n            ){\n\n                if(\n                    typeof aposta.tipo === "number"\n                ){\n\n                    // Aposta em número: retorno total de 2x.\n                    premioFinal +=\n                        Number(aposta.valor || 0) * 2;\n\n                }else{\n\n                    // Mantém a regra já existente para apostas externas.\n                    premioFinal +=\n                        Number(aposta.valor || 0) * 2 * TAXA_CASA;\n                }\n            }\n        }\n    );'''

          if old not in text:
              raise SystemExit('Bloco de cálculo da premiação não encontrado; nenhuma alteração aplicada.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/roleta-cassino.html
          git add .github/workflows/temporary-fix-roleta-cassino.yml
          git commit -m "fix: make roulette number chips pay 2x" || exit 0
          git rm .github/workflows/temporary-fix-roleta-cassino.yml
          git commit -m "chore: remove temporary roulette workflow"
          git push