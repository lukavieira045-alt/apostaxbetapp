name: Evolution Final APK
on:
  push:
    branches: [evolution-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify project
        working-directory: evolution-native
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/evolution/ai/MainActivity.kt
          test -f app/src/main/java/com/evolution/ai/EvolutionLearningWorker.kt
      - name: Apply Evolution fixes
        working-directory: evolution-native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/evolution/ai/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import android.view.View\n','import android.view.View\nimport android.view.inputmethod.EditorInfo\n',1)
          s=s.replace('import dev.ffmpegkit.llama.LlamaConfig\n','import dev.ffmpegkit.llama.LlamaConfig\nimport dev.ffmpegkit.llama.LlamaModel\n',1)
          s=s.replace('private const val MODEL_URL = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true"','private const val MODEL_URL = "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"')
          s=s.replace('private const val MODEL = "Qwen3-4B-Q4_K_M.gguf"','private const val MODEL = "Qwen3-1.7B-Q4_K_M.gguf"')
          s=s.replace('modelFile.length() < 2_000_000_000L','modelFile.length() < 1_000_000_000L')
          s=s.replace('private var busy = false\n','private var busy = false\n    private var brainModel: LlamaModel? = null\n',1)
          s=s.replace('hint = "Converse com a Evolution..."','hint = "Escreva para a Evolution..."',1)
          s=s.replace('text = "🎙"','text = "FALAR"',1)
          s=s.replace('text = "➤"','text = "ENVIAR"',1)
          s=s.replace('textSize = 18f; setTextColor(Color.WHITE); setOnClickListener { startListening() }','textSize = 11f; isAllCaps = false; minWidth = 88; minHeight = 54; setTextColor(Color.WHITE); setOnClickListener { startListening() }',1)
          s=s.replace('textSize = 21f; isEnabled = false; setTextColor(Color.WHITE); setOnClickListener { ask() }','textSize = 11f; isAllCaps = false; minWidth = 88; minHeight = 54; isEnabled = false; setTextColor(Color.WHITE); setOnClickListener { ask() }',1)
          s=s.replace('controls.addView(input, LinearLayout.LayoutParams(0, -2, 1f)); controls.addView(mic, LinearLayout.LayoutParams(58, 58)); controls.addView(send, LinearLayout.LayoutParams(58, 58)); root.addView(controls)','input.imeOptions = EditorInfo.IME_ACTION_SEND\n        input.setOnEditorActionListener { _, actionId, _ -> if (actionId == EditorInfo.IME_ACTION_SEND) { ask(); true } else false }\n        controls.addView(input, LinearLayout.LayoutParams(0, -2, 1f)); controls.addView(mic, LinearLayout.LayoutParams(88, 58)); controls.addView(send, LinearLayout.LayoutParams(88, 58)); root.addView(controls)',1)
          s=s.replace('private lateinit var chat: TextView','private lateinit var chat: LinearLayout',1)
          old='''        chat = TextView(this).apply {
            textSize = 15f; setTextColor(Color.rgb(229, 242, 255)); setPadding(12, 10, 12, 10)
            text = "EVOLUTION\\nPreparando o cérebro local..."; setBackgroundColor(Color.rgb(7, 12, 22))
        }
        root.addView(ScrollView(this).apply { addView(chat); setBackgroundColor(Color.rgb(7, 12, 22)) }, LinearLayout.LayoutParams(-1, 0, .31f))'''
          new='''        chat = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(10,10,10,10); setBackgroundColor(Color.rgb(7,12,22)) }
        root.addView(ScrollView(this).apply { addView(chat); setBackgroundColor(Color.rgb(7,12,22)); isFillViewport = true }, LinearLayout.LayoutParams(-1, 0, .31f))'''
          s=s.replace(old,new,1)
          s=s.replace('status.text = "  •  CÉREBRO QWEN3-4B • LOCAL"','status.text = "  •  CÉREBRO QWEN3-1.7B • LOCAL"')
          s=s.replace('''            if (!modelFile.exists() || modelFile.length() < 1_000_000_000L) download(modelFile)
            withContext(Dispatchers.Main) {''','''            if (!modelFile.exists() || modelFile.length() < 1_000_000_000L) download(modelFile)
            if (brainModel?.isLoaded != true) brainModel = Llama.loadModel(modelFile.absolutePath, LlamaConfig(contextSize = 2048, threads = 2))
            withContext(Dispatchers.Main) {''',1)
          s=s.replace('chat.text = "EVOLUTION ONLINE\\n\\nNúcleo de inteligência local avançado carregado.\\n\\nRaciocínio • memória • matemática • programação • pesquisa web • voz\\n\\nPode falar comigo, meu Rei."','chat.removeAllViews(); addBubble("EVOLUTION", "EVOLUTION ONLINE\\n\\nCérebro local Qwen3-1.7B carregado.\\n\\nRaciocínio • memória • matemática • programação • pesquisa web • voz\\n\\nPode falar comigo, meu Rei.")',1)
          s=s.replace('val research = q.length >= 18 && !conversational && (','val explicitSearch = Regex("^\\\\s*(pesquisar|pesquise|pesquisa|procure|buscar|busque)\\\\b", RegexOption.IGNORE_CASE).containsMatchIn(q)\n        val research = !conversational && (explicitSearch ||',1)
          s=s.replace('val q = URLEncoder.encode(query, "UTF-8")\n        val urls = listOf("https://www.google.com/search?q=$q&hl=pt-BR", "https://www.bing.com/search?q=$q&setlang=pt-BR")','val searchQuery = query.replace(Regex("^\\\\s*(pesquisar|pesquise|pesquisa|procure|buscar|busque)\\\\s+", RegexOption.IGNORE_CASE), "").trim().ifBlank { query }\n        val q = URLEncoder.encode(searchQuery, "UTF-8")\n        val urls = listOf("https://html.duckduckgo.com/html/?q=$q", "https://www.google.com/search?q=$q&hl=pt-BR", "https://www.bing.com/search?q=$q&setlang=pt-BR")',1)
          marker='    private fun ask() {'
          bubble='''    private fun addBubble(who: String, message: String) {
        val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = if (who == "Você") Gravity.END else Gravity.START; setPadding(4,5,4,5) }
        val bubble = TextView(this).apply { text = message; textSize = 15f; setTextColor(Color.WHITE); setPadding(16,11,16,11); maxWidth = (resources.displayMetrics.widthPixels * .80f).toInt(); background = android.graphics.drawable.GradientDrawable().apply { cornerRadius = 28f; setColor(if (who == "Você") Color.rgb(16,76,105) else Color.rgb(22,30,45)) } }
        val name = TextView(this).apply { text = who; textSize = 10f; setTextColor(Color.rgb(125,160,185)); setPadding(2,0,2,3) }
        val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = if (who == "Você") Gravity.END else Gravity.START }
        box.addView(name); box.addView(bubble); row.addView(box); chat.addView(row, LinearLayout.LayoutParams(-1,-2)); chat.post { (chat.parent as? ScrollView)?.fullScroll(View.FOCUS_DOWN) }
    }

'''
          if marker in s and 'private fun addBubble' not in s: s=s.replace(marker,bubble+marker,1)
          s=s.replace('input.setText(""); chat.append("\\nVocê: $q\\n"); busy = true;','input.setText(""); addBubble("Você", q); busy = true;',1)
          s=s.replace('chat.append("Evolution: $a\\n")','addBubble("EVOLUTION", a)',1)
          s=s.replace('chat.append("Evolution: não consegui concluir: ${e.message}\\n")','addBubble("EVOLUTION", "Não consegui concluir agora: ${e.message ?: "erro desconhecido"}")',1)
          s=re.sub(r'val model = Llama\.loadModel\(modelFile\.absolutePath, LlamaConfig\(contextSize = 3072, threads = 3\)\)','val model = brainModel ?: error("cérebro local ainda não está carregado")',s,count=1)
          s=re.sub(r'\n        \} finally \{ Llama\.releaseModel\(model\) \}','\n        }',s,count=1)
          s=s.replace('override fun onDestroy() { recognizer?.destroy(); if (::tts.isInitialized) tts.shutdown(); if (::core.isInitialized) core.stop(); super.onDestroy() }','override fun onDestroy() { recognizer?.destroy(); if (::tts.isInitialized) tts.shutdown(); if (brainModel?.isLoaded == true) Llama.releaseModel(brainModel!!); brainModel = null; if (::core.isInitialized) core.stop(); super.onDestroy() }',1)
          s=s.replace('import androidx.lifecycle.lifecycleScope\n','import androidx.lifecycle.lifecycleScope\nimport androidx.work.ExistingPeriodicWorkPolicy\nimport androidx.work.PeriodicWorkRequestBuilder\nimport androidx.work.WorkManager\nimport java.util.concurrent.TimeUnit\n',1)
          s=s.replace('setupSpeech()\n        lifecycleScope.launch { prepareBrain() }','setupSpeech()\n        startLearningLoop()\n        lifecycleScope.launch { prepareBrain() }',1)
          marker='    private fun setupSpeech() {'
          method='''    private fun startLearningLoop() {
        val request = PeriodicWorkRequestBuilder<EvolutionLearningWorker>(30, TimeUnit.MINUTES).build()
        WorkManager.getInstance(this).enqueueUniquePeriodicWork("evolution-learning", ExistingPeriodicWorkPolicy.KEEP, request)
    }

'''
          if marker in s and 'private fun startLearningLoop()' not in s: s=s.replace(marker,method+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile and package APK
        working-directory: evolution-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm new APK
        run: |
          test -s evolution-native/app/build/outputs/apk/debug/app-debug.apk
          stat -c '%n %s bytes %y' evolution-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-native-corrected-apk
          path: evolution-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
