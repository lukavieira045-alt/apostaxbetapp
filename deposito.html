<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar - ApostaXBet</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: white; font-family: Arial, sans-serif; padding-bottom: 90px; }
        .topo { text-align: center; padding: 25px 10px; background: #111; border-bottom: 2px solid #d9b21f; }
        .topo h1 { margin: 0; color: #e6c229; font-size: 28px; }
        .saldo { margin-top: 8px; color: #00ed91; font-weight: bold; }
        .container { width: 94%; max-width: 600px; margin: 25px auto; }
        
        /* Estilos do Botão PIX */
        .btn-pix {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-pix:active { transform: scale(0.98); }

        /* Estilos da Janela Modal (QR Code) */
        .modal-pix {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-conteudo {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            color: #333;
            position: relative;
        }
        .modal-conteudo h3 { margin-top: 0; color: #111; }
        .modal-conteudo img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
        .btn-fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="topo">
        <h1>ApostaXBet</h1>
        <div class="saldo">Saldo: R$ 0,00</div>
    </div>

    <div class="container">
        <h2>Recarregar Saldo</h2>
        <p>Escolha um valor para depositar via PIX:</p>
        
        <!-- BOTÃO DE DEPOSITAR -->
        <button class="btn-pix" onclick="document.getElementById('modalPix').style.display='flex'">
            💰 Depositar via PIX
        </button>
    </div>

    <!-- JANELA DO QR CODE (MODAL) -->
    <div id="modalPix" class="modal-pix" onclick="if(event.target === this) this.style.display='none'">
        <div class="modal-conteudo">
            <h3>Escaneie o QR Code</h3>
            <!-- CAMINHO DA IMAGEM: pasta img + nome qrcode.png -->
            <img src="img/qrcode.png" alt="QR Code PIX">
            <p style="font-size: 14px; color: #666;">Após o pagamento, o saldo será creditado automaticamente.</p>
            <button class="btn-fechar" onclick="document.getElementById('modalPix').style.display='none'">Fechar</button>
        </div>
    </div>

</body>
</html>
