<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Depositar - ApostaXBet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 90px;
        }

        .topo {
            text-align: center;
            padding: 25px 10px;
            background: #111;
            border-bottom: 2px solid #d9b21f;
        }

        .topo h1 {
            margin: 0;
            color: #e6c229;
            font-size: 28px;
        }

        .saldo {
            margin-top: 8px;
            color: #00ed91;
            font-weight: bold;
            font-size: 18px;
        }

        .status-saldo {
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        .container {
            width: 94%;
            max-width: 600px;
            margin: 25px auto;
        }

        .valores-rapidos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-valor {
            flex: 1;
            min-width: 70px;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-valor.ativo {
            background: #e6c229;
            color: #000;
            border-color: #e6c229;
        }

        .btn-pix {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pix:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        .modal-pix {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 92%;
            max-width: 380px;
            color: #333;
        }

        .modal-conteudo h3 {
            margin-top: 0;
            color: #111;
        }

        #qrCodePix {
            width: 250px;
            height: 250px;
            max-width: 100%;
            object-fit: contain;
            margin: 15px auto;
            display: block;
            background: white;
        }

        .valor-selecionado {
            display: block;
            font-size: 20px;
            color: #28a745;
            font-weight: bold;
        }

        .area-copia {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            max-height: 100px;
            overflow-y: auto;
            border: 1px dashed #ccc;
        }

        .btn-copiar {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .carregando {
            color: #555;
            margin: 15px 0;
            font-size: 14px;
        }

        #mensagemDeposito {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .mensagem-erro {
            display: block !important;
            background: #3a1111;
            color: #ff7777;
            border: 1px solid #8b2222;
        }
    </style>
</head>

<body>

<div class="topo">

    <h1>ApostaXBet</h1>

    <div class="saldo" id="displaySaldo">
        💰 Saldo: R$ 0,00
    </div>

    <div class="status-saldo" id="statusSaldo">
        Carregando saldo...
    </div>

</div>

<div class="container">

    <h2>Recarregar Saldo</h2>

    <p>Escolha um valor para depositar via PIX:</p>

    <div class="valores-rapidos">

        <button class="btn-valor"
                onclick="selecionarValor(this,10)">
            R$ 10
        </button>

        <button class="btn-valor"
                onclick="selecionarValor(this,20)">
            R$ 20
        </button>

        <button class="btn-valor"
                onclick="selecionarValor(this,50)">
            R$ 50
        </button>

        <button class="btn-valor"
                onclick="selecionarValor(this,100)">
            R$ 100
        </button>

        <button class="btn-valor"
                onclick="selecionarValor(this,200)">
            R$ 200
        </button>

    </div>

    <button
        id="btnDepositar"
        class="btn-pix"
        onclick="abrirModal()"
        disabled>
        Depositar via PIX
    </button>

    <div id="mensagemDeposito"></div>

</div>

<div
    id="modalPix"
    class="modal-pix"
    onclick="if(event.target === this) fecharModal()">

    <div class="modal-conteudo">

        <h3>Pague com PIX</h3>

        <span id="valorDisplay"
              class="valor-selecionado"></span>

        <div id="carregandoPix"
             class="carregando">
            Criando PIX...
        </div>

        <img
            id="qrCodePix"
            src=""
            alt="QR Code PIX"
            style="display:none;"
        >

        <div
            class="area-copia"
            id="textoPix">
        </div>

        <button
            class="btn-copiar"
            onclick="copiarChave()">
            📋 Copiar Código PIX
        </button>

        <p style="font-size:12px;color:#888;">
            Escaneie o QR Code no aplicativo do seu banco
            ou copie o código PIX.
        </p>

        <button
            class="btn-fechar"
            onclick="fecharModal()">
            Fechar
        </button>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const WEBHOOK_DEPOSITO_URL =
    "https://jxbzjiwmajjzxgihfjgt.supabase.co/functions/v1/swift-action";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

let usuarioAtual = null;
let valorAtual = 0;


/* =====================================================
   FORMATAR
===================================================== */

function formatarValor(valor) {

    return Number(valor || 0)
        .toFixed(2)
        .replace(".", ",");

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarErro(mensagem) {

    const el =
        document.getElementById(
            "mensagemDeposito"
        );

    el.innerText = mensagem;
    el.className = "mensagem-erro";
    el.style.display = "block";

}


/* =====================================================
   USUÁRIO
===================================================== */

async function carregarUsuario() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();

    if (error || !data || !data.user) {

        throw new Error(
            "Usuário não identificado. Faça login novamente."
        );

    }

    usuarioAtual = data.user;

    console.log(
        "ApostaXBet usuário:",
        usuarioAtual.id
    );

}


/* =====================================================
   SALDO
   SOMENTE LEITURA
   NÃO ALTERA O SALDO
===================================================== */

async function carregarSaldo() {

    const status =
        document.getElementById(
            "statusSaldo"
        );

    try {

        status.innerText =
            "Carregando saldo...";

        if (!usuarioAtual) {
            await carregarUsuario();
        }

        const {
            data,
            error
        } =
            await supabaseClient
                .from("saldos")
                .select("valor")
                .eq(
                    "user_id",
                    usuarioAtual.id
                )
                .maybeSingle();

        if (error) {

            console.error(
                "Erro saldos:",
                error
            );

            throw new Error(
                "Erro ao consultar seu saldo."
            );

        }

        const saldo =
            Number(data?.valor ?? 0);

        document.getElementById(
            "displaySaldo"
        ).innerText =
            `💰 Saldo: R$ ${formatarValor(saldo)}`;

        status.innerText =
            "Saldo atualizado";

        console.log(
            "Saldo carregado:",
            saldo
        );

    } catch (erro) {

        console.error(
            "CARREGAR SALDO:",
            erro
        );

        status.innerText =
            "Erro ao carregar saldo";

        mostrarErro(
            erro.message
        );

    }

}


/* =====================================================
   ESCOLHER VALOR
===================================================== */

function selecionarValor(
    botao,
    valor
) {

    document
        .querySelectorAll(".btn-valor")
        .forEach(
            b => b.classList.remove("ativo")
        );

    botao.classList.add("ativo");

    valorAtual =
        Number(valor);

    const btn =
        document.getElementById(
            "btnDepositar"
        );

    btn.disabled = false;

    btn.innerText =
        `💰 Depositar R$ ${formatarValor(valorAtual)} via PIX`;

}


/* =====================================================
   CRIAR PIX
===================================================== */

async function abrirModal() {

    if (!valorAtual) {
        return;
    }

    const modal =
        document.getElementById(
            "modalPix"
        );

    const qr =
        document.getElementById(
            "qrCodePix"
        );

    const texto =
        document.getElementById(
            "textoPix"
        );

    const carregando =
        document.getElementById(
            "carregandoPix"
        );

    modal.style.display =
        "flex";

    qr.style.display =
        "none";

    qr.src = "";

    texto.innerText = "";

    carregando.innerText =
        "Criando PIX...";

    carregando.style.display =
        "block";

    document.getElementById(
        "valorDisplay"
    ).innerText =
        `Valor: R$ ${formatarValor(valorAtual)}`;

    try {

        if (!usuarioAtual) {
            await carregarUsuario();
        }

        /*
         * Pega a sessão atual.
         * O access_token é enviado para a Edge Function.
         */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();

        if (
            sessionError ||
            !sessionData ||
            !sessionData.session
        ) {

            throw new Error(
                "Sua sessão expirou. Faça login novamente."
            );

        }

        const session =
            sessionData.session;

        /*
         * A Edge Function recebe o usuário
         * pelo JWT e não depende de um userId
         * inventado no navegador.
         */

        const resposta =
            await fetch(
                WEBHOOK_DEPOSITO_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${session.access_token}`
                    },

                    body: JSON.stringify({

                        tipo:
                            "deposito_pix",

                        valor:
                            valorAtual,

                        userId:
                            usuarioAtual.id,

                        email:
                            usuarioAtual.email || ""

                    })
                }
            );

        const respostaTexto =
            await resposta.text();

        console.log(
            "Resposta da swift-action:",
            respostaTexto
        );

        let dados;

        try {

            dados =
                JSON.parse(
                    respostaTexto
                );

        } catch {

            throw new Error(
                "A Edge Function retornou uma resposta inválida."
            );

        }

        if (!resposta.ok) {

            throw new Error(
                dados.error ||
                dados.message ||
                `Erro HTTP ${resposta.status}`
            );

        }

        if (
            dados.sucesso === false ||
            dados.success === false
        ) {

            throw new Error(
                dados.error ||
                dados.message ||
                "Não foi possível criar o PIX."
            );

        }

        const codigoPix =
            dados.qr_code ||
            dados.qr_code_text ||
            dados.qr_code_copy_paste ||
            dados.point_of_interaction
                ?.transaction_data
                ?.qr_code;

        if (!codigoPix) {

            console.error(
                "Resposta sem código PIX:",
                dados
            );

            throw new Error(
                "O Mercado Pago não retornou o código PIX."
            );

        }

        texto.innerText =
            codigoPix;

        if (
            dados.qr_code_base64
        ) {

            qr.src =
                `data:image/png;base64,${dados.qr_code_base64}`;

        } else {

            qr.src =
                "https://api.qrserver.com/v1/create-qr-code/" +
                "?size=250x250&data=" +
                encodeURIComponent(codigoPix);

        }

        qr.onload =
            function() {

                carregando.style.display =
                    "none";

                qr.style.display =
                    "block";

            };

        qr.onerror =
            function() {

                carregando.innerText =
                    "QR Code não pôde ser exibido. Use o código PIX abaixo.";

            };

    } catch (erro) {

        console.error(
            "ERRO PIX:",
            erro
        );

        carregando.innerText =
            erro.message ||
            "Não foi possível criar o PIX.";

        texto.innerText = "";

        mostrarErro(
            erro.message ||
            "Não foi possível criar o PIX."
        );

    }

}


/* =====================================================
   COPIAR PIX
===================================================== */

async function copiarChave() {

    const texto =
        document.getElementById(
            "textoPix"
        ).innerText.trim();

    if (!texto) {

        alert(
            "O código PIX ainda não foi carregado."
        );

        return;

    }

    try {

        await navigator.clipboard.writeText(
            texto
        );

        const btn =
            document.querySelector(
                ".btn-copiar"
            );

        const original =
            btn.innerHTML;

        btn.innerHTML =
            "✅ Copiado!";

        btn.style.background =
            "#28a745";

        setTimeout(
            () => {

                btn.innerHTML =
                    original;

                btn.style.background =
                    "#007bff";

            },
            2000
        );

    } catch {

        alert(
            "Não foi possível copiar automaticamente."
        );

    }

}


/* =====================================================
   FECHAR
===================================================== */

function fecharModal() {

    document.getElementById(
        "modalPix"
    ).style.display =
        "none";

}


/* =====================================================
   INICIAR
===================================================== */

window.addEventListener(
    "load",
    async function() {

        try {

            await carregarUsuario();
            await carregarSaldo();

        } catch (erro) {

            console.error(
                "Inicialização:",
                erro
            );

            mostrarErro(
                erro.message
            );

        }

    }
);

</script>

</body>
</html>
