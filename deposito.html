<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Depositar - ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    padding-bottom: 90px;
}

.topo {
    text-align: center;
    padding: 25px 10px;
    background: #111;
    border-bottom: 2px solid #d9b21f;
}

.topo h1 {
    margin: 0;
    color: #e6c229;
    font-size: 28px;
}

.saldo {
    margin-top: 8px;
    color: #00ed91;
    font-weight: bold;
    font-size: 18px;
}

.container {
    width: 94%;
    max-width: 600px;
    margin: 25px auto;
}

.valores-rapidos {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.btn-valor {
    flex: 1;
    min-width: 70px;
    padding: 12px;
    background: #222;
    border: 1px solid #444;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-valor.ativo {
    background: #e6c229;
    color: #000;
    border-color: #e6c229;
}

.btn-pix {
    display: block;
    width: 100%;
    padding: 18px;
    font-size: 18px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-pix:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.modal-pix {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    overflow-y: auto;
    padding: 20px;
}

.modal-conteudo {
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    width: 100%;
    max-width: 370px;
    color: #333;
}

.modal-conteudo h3 {
    margin-top: 0;
}

.qr {
    width: 250px;
    max-width: 100%;
    height: 250px;
    object-fit: contain;
    margin: 15px auto;
    display: block;
}

.valor-selecionado {
    display: block;
    font-size: 20px;
    color: #28a745;
    font-weight: bold;
}

.area-copia {
    background: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
    margin: 15px 0;
    word-break: break-all;
    font-family: monospace;
    font-size: 11px;
    color: #555;
    max-height: 90px;
    overflow-y: auto;
    border: 1px dashed #ccc;
}

.btn-copiar {
    background: #007bff;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
}

.btn-fechar {
    background: #dc3545;
    color: white;
    border: none;
    padding: 11px 25px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
    width: 100%;
}

.status {
    margin-top: 12px;
    font-size: 14px;
    font-weight: bold;
}

.carregando {
    display: none;
    margin: 15px 0;
}
</style>
</head>

<body>

<div class="topo">
    <h1>ApostaXBet</h1>
    <div class="saldo" id="displaySaldo">
        Saldo: R$ 0,00
    </div>
</div>

<div class="container">

    <h2>Recarregar Saldo</h2>

    <p>
        Escolha um valor para depositar via PIX:
    </p>

    <div class="valores-rapidos">

        <button
            class="btn-valor"
            onclick="selecionarValor(this, 10)">
            R$ 10
        </button>

        <button
            class="btn-valor"
            onclick="selecionarValor(this, 20)">
            R$ 20
        </button>

        <button
            class="btn-valor"
            onclick="selecionarValor(this, 50)">
            R$ 50
        </button>

        <button
            class="btn-valor"
            onclick="selecionarValor(this, 100)">
            R$ 100
        </button>

        <button
            class="btn-valor"
            onclick="selecionarValor(this, 200)">
            R$ 200
        </button>

    </div>

    <button
        id="btnDepositar"
        class="btn-pix"
        onclick="criarPix()"
        disabled>

        Escolha um valor

    </button>

    <div
        id="carregando"
        class="carregando">
        Gerando PIX...
    </div>

</div>


<div
    id="modalPix"
    class="modal-pix">

    <div class="modal-conteudo">

        <h3>PIX para pagamento</h3>

        <span
            id="valorDisplay"
            class="valor-selecionado">
        </span>

        <img
            id="qrCode"
            class="qr"
            alt="QR Code PIX">

        <p>
            Escaneie o QR Code no aplicativo do seu banco.
        </p>

        <div
            id="textoPix"
            class="area-copia">
        </div>

        <button
            class="btn-copiar"
            onclick="copiarPix()">

            📋 Copiar código PIX

        </button>

        <div
            id="statusPagamento"
            class="status">

            Aguardando pagamento...

        </div>

        <button
            class="btn-fechar"
            onclick="fecharModal()">

            Fechar

        </button>

    </div>

</div>


<script type="module">

import {
    createClient
} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';


const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const FUNCTION_URL =
`${SUPABASE_URL}/functions/v1/swift-action`;


let valorAtual = 0;


/*
=====================================================
SALDO
=====================================================
*/

async function carregarSaldo() {

    const {
        data: sessionData
    } =
    await supabase.auth.getSession();

    const user =
        sessionData?.session?.user;

    if (!user) {

        document.getElementById(
            "displaySaldo"
        ).innerText =
        "Faça login para ver o saldo";

        return;
    }

    const {
        data,
        error
    } =
    await supabase
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();

    if (error) {

        console.error(
            "Erro saldo:",
            error
        );

        return;
    }

    const saldo =
        Number(
            data?.valor || 0
        );

    document.getElementById(
        "displaySaldo"
    ).innerText =
    `Saldo: R$ ${saldo.toFixed(2).replace(".", ",")}`;
}


/*
=====================================================
ESCOLHER VALOR
=====================================================
*/

window.selecionarValor =
function(botao, valor) {

    document
        .querySelectorAll(".btn-valor")
        .forEach(
            b =>
            b.classList.remove("ativo")
        );

    botao.classList.add("ativo");

    valorAtual = valor;

    const btn =
        document.getElementById(
            "btnDepositar"
        );

    btn.disabled = false;

    btn.innerText =
        `💰 Depositar R$ ${valor.toFixed(2).replace(".", ",")} via PIX`;
};


/*
=====================================================
CRIAR PIX REAL
=====================================================
*/

window.criarPix =
async function() {

    if (valorAtual <= 0) {
        return;
    }

    const btn =
        document.getElementById(
            "btnDepositar"
        );

    const carregando =
        document.getElementById(
            "carregando"
        );

    btn.disabled = true;

    carregando.style.display =
        "block";

    try {

        const {
            data: sessionData
        } =
        await supabase.auth.getSession();

        const session =
            sessionData?.session;

        if (!session) {

            alert(
                "Você precisa estar logado."
            );

            return;
        }


        const response =
        await fetch(
            FUNCTION_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${session.access_token}`
                },

                body: JSON.stringify({
                    action:
                        "criar_pix",

                    valor:
                        valorAtual
                })
            }
        );


        const resultado =
            await response.json();


        if (!response.ok) {

            console.error(
                "Erro criando PIX:",
                resultado
            );

            alert(
                resultado.error ||
                "Não foi possível criar o PIX."
            );

            return;
        }


        /*
         * QR CODE
         */

        if (
            resultado.qr_code_base64
        ) {

            document.getElementById(
                "qrCode"
            ).src =
            `data:image/png;base64,${resultado.qr_code_base64}`;

        } else {

            document.getElementById(
                "qrCode"
            ).style.display =
                "none";
        }


        /*
         * CÓDIGO COPIA E COLA
         */

        document.getElementById(
            "textoPix"
        ).innerText =
            resultado.qr_code ||
            "";


        document.getElementById(
            "valorDisplay"
        ).innerText =
            `Valor: R$ ${Number(valorAtual).toFixed(2).replace(".", ",")}`;


        document.getElementById(
            "statusPagamento"
        ).innerText =
            "⏳ Aguardando pagamento...";


        document.getElementById(
            "modalPix"
        ).style.display =
            "flex";


    } catch (erro) {

        console.error(
            erro
        );

        alert(
            "Erro de comunicação com o servidor."
        );

    } finally {

        carregando.style.display =
            "none";

        btn.disabled =
            false;
    }
};


/*
=====================================================
COPIAR PIX
=====================================================
*/

window.copiarPix =
async function() {

    const texto =
        document.getElementById(
            "textoPix"
        ).innerText;

    if (!texto) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            texto
        );

        const botao =
            document.querySelector(
                ".btn-copiar"
            );

        const original =
            botao.innerText;

        botao.innerText =
            "✅ Copiado!";

        setTimeout(
            () => {
                botao.innerText =
                    original;
            },
            2000
        );

    } catch {

        alert(
            "Não foi possível copiar automaticamente."
        );
    }
};


/*
=====================================================
FECHAR
=====================================================
*/

window.fecharModal =
function() {

    document.getElementById(
        "modalPix"
    ).style.display =
        "none";
};


/*
=====================================================
INICIALIZAÇÃO
=====================================================
*/

carregarSaldo();

</script>

</body>
</html>
