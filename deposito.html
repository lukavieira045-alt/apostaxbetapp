<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Depositar - ApostaXBet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- MESMO SISTEMA DE SALDO DO SITE -->
    <script src="saldo.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 90px;
        }

        .topo {
            text-align: center;
            padding: 25px 10px;
            background: #111;
            border-bottom: 2px solid #d9b21f;
        }

        .topo h1 {
            margin: 0;
            color: #e6c229;
            font-size: 28px;
        }

        .saldo {
            margin-top: 8px;
            color: #00ed91;
            font-weight: bold;
            font-size: 18px;
        }

        .container {
            width: 94%;
            max-width: 600px;
            margin: 25px auto;
        }

        .valores-rapidos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-valor {
            flex: 1;
            min-width: 70px;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-valor:hover,
        .btn-valor.ativo {
            background: #e6c229;
            color: #000;
            border-color: #e6c229;
        }

        .btn-pix {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pix:disabled {
            cursor: not-allowed;
        }

        .modal-pix {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 92%;
            max-width: 380px;
            color: #333;
        }

        .modal-conteudo h3 {
            margin-top: 0;
            color: #111;
        }

        #qrCodePix {
            width: 250px;
            height: 250px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            margin: 15px auto;
            display: block;
            background: white;
        }

        .valor-selecionado {
            font-size: 20px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .area-copia {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            max-height: 100px;
            overflow-y: auto;
            border: 1px dashed #ccc;
        }

        .btn-copiar {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .btn-fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        #mensagemDeposito {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .mensagem-erro {
            background: #3a1111;
            color: #ff7777;
            border: 1px solid #8b2222;
        }

        .mensagem-sucesso {
            background: #103a20;
            color: #70ff9b;
            border: 1px solid #227a3d;
        }

        .carregando {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="topo">
    <h1>ApostaXBet</h1>

    <div class="saldo" id="displaySaldo">
        Saldo: R$ 0,00
    </div>
</div>

<div class="container">

    <h2>Recarregar Saldo</h2>

    <p>Escolha um valor para depositar via PIX:</p>

    <div class="valores-rapidos">

        <button class="btn-valor" onclick="selecionarValor(this,10)">
            R$ 10
        </button>

        <button class="btn-valor" onclick="selecionarValor(this,20)">
            R$ 20
        </button>

        <button class="btn-valor" onclick="selecionarValor(this,50)">
            R$ 50
        </button>

        <button class="btn-valor" onclick="selecionarValor(this,100)">
            R$ 100
        </button>

        <button class="btn-valor" onclick="selecionarValor(this,200)">
            R$ 200
        </button>

    </div>

    <button
        id="btnDepositar"
        class="btn-pix"
        onclick="abrirModal()"
        disabled
        style="opacity:.6;"
    >
        Depositar via PIX
    </button>

    <div id="mensagemDeposito"></div>

</div>


<div
    id="modalPix"
    class="modal-pix"
    onclick="if(event.target===this)fecharModal()"
>

    <div class="modal-conteudo">

        <h3>Pague com PIX</h3>

        <span
            id="valorDisplay"
            class="valor-selecionado"
        ></span>

        <div
            id="carregandoPix"
            class="carregando"
        >
            Criando PIX...
        </div>

        <img
            id="qrCodePix"
            src=""
            alt="QR Code PIX"
            style="display:none;"
        >

        <div
            class="area-copia"
            id="textoPix"
        ></div>

        <button
            class="btn-copiar"
            onclick="copiarChave()"
        >
            📋 Copiar Código PIX
        </button>

        <p style="font-size:12px;color:#888;">
            Escaneie o QR Code no aplicativo do seu banco
            ou copie o código PIX.
        </p>

        <button
            class="btn-fechar"
            onclick="fecharModal()"
        >
            Fechar
        </button>

    </div>
</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_ANON_KEY =
    "<SECRET>";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const FUNCAO_PIX =
    "swift-action";

let valorAtual = 0;
let usuarioAtual = null;
let saldoAtual = 0;


/* =========================================================
   FORMATAR DINHEIRO
========================================================= */

function dinheiro(valor) {

    valor = Number(valor);

    if (!Number.isFinite(valor)) {
        valor = 0;
    }

    return valor
        .toFixed(2)
        .replace(".", ",");
}


/* =========================================================
   MOSTRAR SALDO
========================================================= */

function atualizarSaldoVisual() {

    const elemento =
        document.getElementById("displaySaldo");

    elemento.innerText =
        "Saldo: R$ " + dinheiro(saldoAtual);
}


/* =========================================================
   PEGAR USUÁRIO
========================================================= */

async function carregarUsuario() {

    try {

        const resultado =
            await supabaseClient.auth.getUser();

        const user =
            resultado?.data?.user;

        if (!user) {

            mostrarErro(
                "Usuário não identificado. Faça login novamente."
            );

            return null;
        }

        usuarioAtual = user;

        console.log(
            "ApostaXBet - usuário:",
            user.id
        );

        return user;

    } catch (erro) {

        console.error(
            "Erro ao obter usuário:",
            erro
        );

        mostrarErro(
            "Erro ao identificar sua conta."
        );

        return null;
    }
}


/* =========================================================
   PEGAR SALDO
   PRIMEIRO USA O MESMO SISTEMA DO SITE.
   DEPOIS TENTA A TABELA SALDOS.
========================================================= */

async function carregarSaldo() {

    try {

        if (!usuarioAtual) {

            const user =
                await carregarUsuario();

            if (!user) {
                return;
            }
        }


        /* -------------------------------------------------
           TENTATIVA 1
           MESMO SISTEMA USADO PELOS JOGOS
        ------------------------------------------------- */

        if (
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ) {

            try {

                let resultado =
                    window.SistemaSaldo.get();

                if (
                    resultado &&
                    typeof resultado.then === "function"
                ) {
                    resultado =
                        await resultado;
                }

                let valor = 0;

                if (typeof resultado === "number") {

                    valor = resultado;

                } else if (
                    resultado &&
                    typeof resultado === "object"
                ) {

                    valor =
                        resultado.valor ??
                        resultado.saldo ??
                        resultado.balance ??
                        0;
                }

                if (
                    Number.isFinite(Number(valor))
                ) {

                    saldoAtual =
                        Number(valor);

                    atualizarSaldoVisual();

                    console.log(
                        "Saldo carregado pelo SistemaSaldo:",
                        saldoAtual
                    );

                    return;
                }

            } catch (erroSistema) {

                console.warn(
                    "SistemaSaldo não conseguiu carregar:",
                    erroSistema
                );
            }
        }


        /* -------------------------------------------------
           TENTATIVA 2
           TABELA SALDOS
        ------------------------------------------------- */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("saldos")
                .select("valor")
                .eq(
                    "user_id",
                    usuarioAtual.id
                )
                .maybeSingle();


        if (error) {

            console.error(
                "Erro tabela saldos:",
                error
            );

            mostrarErro(
                "Não foi possível carregar seu saldo."
            );

            return;
        }


        saldoAtual =
            Number(data?.valor ?? 0);


        atualizarSaldoVisual();


        console.log(
            "Saldo carregado da tabela:",
            saldoAtual
        );

    } catch (erro) {

        console.error(
            "Erro geral ao carregar saldo:",
            erro
        );

        mostrarErro(
            "Não foi possível carregar seu saldo."
        );
    }
}


/* =========================================================
   SELECIONAR VALOR
========================================================= */

function selecionarValor(botao, valor) {

    document
        .querySelectorAll(".btn-valor")
        .forEach(
            b => b.classList.remove("ativo")
        );


    botao.classList.add("ativo");

    valorAtual =
        Number(valor);


    const btn =
        document.getElementById(
            "btnDepositar"
        );


    btn.disabled = false;

    btn.style.opacity = "1";

    btn.innerHTML =
        "💰 Depositar R$ " +
        dinheiro(valorAtual) +
        " via PIX";
}


/* =========================================================
   ABRIR MODAL
========================================================= */

async function abrirModal() {

    if (
        !valorAtual ||
        valorAtual <= 0
    ) {
        return;
    }


    const modal =
        document.getElementById(
            "modalPix"
        );

    const qr =
        document.getElementById(
            "qrCodePix"
        );

    const texto =
        document.getElementById(
            "textoPix"
        );

    const carregando =
        document.getElementById(
            "carregandoPix"
        );


    modal.style.display = "flex";

    qr.style.display = "none";

    qr.src = "";

    texto.innerText = "";

    carregando.style.display = "block";

    carregando.innerText =
        "Criando PIX...";


    document.getElementById(
        "valorDisplay"
    ).innerText =
        "Valor: R$ " +
        dinheiro(valorAtual);


    /* -------------------------------------------------
       GARANTIR USUÁRIO
    ------------------------------------------------- */

    if (!usuarioAtual) {

        const user =
            await carregarUsuario();

        if (!user) {

            fecharModal();

            return;
        }
    }


    /* -------------------------------------------------
       PEGAR SESSÃO AUTENTICADA
       IMPORTANTE PARA A EDGE FUNCTION
    ------------------------------------------------- */

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (
            sessionError ||
            !sessionData?.session
        ) {

            throw new Error(
                "Sua sessão expirou. Faça login novamente."
            );
        }


        const session =
            sessionData.session;


        console.log(
            "Criando PIX para:",
            usuarioAtual.id
        );


        /* -------------------------------------------------
           CHAMAR EDGE FUNCTION COM TOKEN
        ------------------------------------------------- */

        const resposta =
            await fetch(
                SUPABASE_URL +
                "/functions/v1/" +
                FUNCAO_PIX,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            session.access_token,

                        "apikey":
                            SUPABASE_ANON_KEY
                    },

                    body:
                        JSON.stringify({

                            tipo:
                                "deposito_pix",

                            valor:
                                valorAtual,

                            userId:
                                usuarioAtual.id,

                            data:
                                new Date()
                                    .toISOString(),

                            status:
                                "pendente"
                        })
                }
            );


        const respostaTexto =
            await resposta.text();


        console.log(
            "Resposta PIX:",
            respostaTexto
        );


        let dados = null;


        try {

            dados =
                JSON.parse(
                    respostaTexto
                );

        } catch {

            throw new Error(
                "A função do PIX retornou uma resposta inválida."
            );
        }


        if (!resposta.ok) {

            throw new Error(
                dados?.error ||
                dados?.message ||
                "Não foi possível criar o PIX."
            );
        }


        /* -------------------------------------------------
           ACEITAR OS FORMATOS MAIS COMUNS
        ------------------------------------------------- */

        const codigoPix =
            dados?.qr_code ||
            dados?.qrCode ||
            dados?.pix_code ||
            dados?.copy_paste ||
            dados?.qr_code_text ||
            dados?.point_of_interaction
                ?.transaction_data
                ?.qr_code;


        const base64 =
            dados?.qr_code_base64 ||
            dados?.qrCodeBase64 ||
            dados?.point_of_interaction
                ?.transaction_data
                ?.qr_code_base64;


        if (!codigoPix) {

            console.error(
                "Resposta completa da função:",
                dados
            );

            throw new Error(
                dados?.error ||
                "O Mercado Pago não retornou o código PIX."
            );
        }


        /* -------------------------------------------------
           MOSTRAR CÓDIGO PIX
        ------------------------------------------------- */

        texto.innerText =
            codigoPix;


        /* -------------------------------------------------
           MOSTRAR QR CODE
        ------------------------------------------------- */

        if (base64) {

            qr.src =
                base64.startsWith("data:")
                    ? base64
                    : "data:image/png;base64," +
                      base64;

        } else {

            qr.src =
                "https://api.qrserver.com/v1/create-qr-code/" +
                "?size=250x250&data=" +
                encodeURIComponent(
                    codigoPix
                );
        }


        qr.onload =
            function() {

                carregando.style.display =
                    "none";

                qr.style.display =
                    "block";
            };


        qr.onerror =
            function() {

                carregando.innerText =
                    "QR Code não pôde ser exibido. Use o código PIX abaixo.";

                qr.style.display =
                    "none";
            };


    } catch (erro) {

        console.error(
            "ERRO AO CRIAR PIX:",
            erro
        );


        carregando.innerText =
            erro?.message ||
            "Não foi possível criar o PIX.";


        texto.innerText = "";


        mostrarErro(
            erro?.message ||
            "Não foi possível criar o PIX."
        );
    }
}


/* =========================================================
   COPIAR PIX
========================================================= */

async function copiarChave() {

    const texto =
        document
            .getElementById("textoPix")
            .innerText
            .trim();


    if (!texto) {

        alert(
            "O código PIX ainda não foi carregado."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            texto
        );


        const btn =
            document.querySelector(
                ".btn-copiar"
            );


        const original =
            btn.innerHTML;


        btn.innerHTML =
            "✅ Copiado!";


        btn.style.background =
            "#28a745";


        setTimeout(
            () => {

                btn.innerHTML =
                    original;

                btn.style.background =
                    "#007bff";

            },
            2000
        );


    } catch {

        alert(
            "Não foi possível copiar automaticamente. Selecione e copie o código PIX."
        );
    }
}


/* =========================================================
   FECHAR MODAL
========================================================= */

function fecharModal() {

    document.getElementById(
        "modalPix"
    ).style.display =
        "none";
}


/* =========================================================
   ERRO
========================================================= */

function mostrarErro(mensagem) {

    const elemento =
        document.getElementById(
            "mensagemDeposito"
        );


    elemento.className =
        "mensagem-erro";


    elemento.innerText =
        mensagem;


    elemento.style.display =
        "block";


    setTimeout(
        () => {

            elemento.style.display =
                "none";

        },
        7000
    );
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

window.addEventListener(
    "load",
    async function() {

        console.log(
            "ApostaXBet - iniciando página de depósito..."
        );

        await carregarUsuario();

        await carregarSaldo();

    }
);

</script>

</body>
</html>
