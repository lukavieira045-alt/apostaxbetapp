<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar - ApostaXBet</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: white; font-family: Arial, sans-serif; padding-bottom: 90px; }
        .topo { text-align: center; padding: 25px 10px; background: #111; border-bottom: 2px solid #d9b21f; }
        .topo h1 { margin: 0; color: #e6c229; font-size: 28px; }
        .saldo { margin-top: 8px; color: #00ed91; font-weight: bold; font-size: 18px; }
        .container { width: 94%; max-width: 600px; margin: 25px auto; }
        
        /* Estilos dos Botões de Valor */
        .valores-rapidos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-valor {
            flex: 1;
            min-width: 70px;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-valor:hover, .btn-valor.ativo {
            background: #e6c229;
            color: #000;
            border-color: #e6c229;
        }

        /* Estilos do Botão PIX Principal */
        .btn-pix {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pix:active { transform: scale(0.98); }

        /* Estilos da Janela Modal (QR Code) */
        .modal-pix {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-conteudo {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            color: #333;
            position: relative;
        }
        .modal-conteudo h3 { margin-top: 0; color: #111; }
        .modal-conteudo img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
        .valor-selecionado { 
            font-size: 20px; 
            color: #28a745; 
            font-weight: bold; 
            margin-bottom: 10px; 
            display: block;
        }
        
        /* Área de Copia e Cola */
        .area-copia {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            max-height: 60px;
            overflow-y: auto;
            border: 1px dashed #ccc;
        }
        .btn-copiar {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-copiar:active { transform: scale(0.98); }
        
        .btn-confirmar {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-confirmar:active { transform: scale(0.98); }
        
        .btn-fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="topo">
        <h1>ApostaXBet</h1>
        <div class="saldo" id="displaySaldo">Saldo: R$ 0,00</div>
    </div>

    <div class="container">
        <h2>Recarregar Saldo</h2>
        <p>Escolha um valor para depositar via PIX:</p>
        
        <!-- BOTÕES DE VALORES RÁPIDOS (AGORA COM R$ 10) -->
        <div class="valores-rapidos">
            <button class="btn-valor" onclick="selecionarValor(this, 10)">R$ 10</button>
            <button class="btn-valor" onclick="selecionarValor(this, 20)">R$ 20</button>
            <button class="btn-valor" onclick="selecionarValor(this, 50)">R$ 50</button>
            <button class="btn-valor" onclick="selecionarValor(this, 100)">R$ 100</button>
            <button class="btn-valor" onclick="selecionarValor(this, 200)">R$ 200</button>
        </div>

        <!-- BOTÃO DE DEPOSITAR -->
        <button id="btnDepositar" class="btn-pix" onclick="abrirModal()" disabled style="opacity: 0.6;">
            💰 Depositar via PIX
        </button>
    </div>

    <!-- JANELA DO QR CODE (MODAL) -->
    <div id="modalPix" class="modal-pix" onclick="if(event.target === this) fecharModal()">
        <div class="modal-conteudo">
            <h3>Escaneie ou Copie</h3>
            <span id="valorDisplay" class="valor-selecionado"></span>
            
            <img src="img/qrcode.png" alt="QR Code PIX">
            
            <!-- ÁREA DE COPIA E COLA -->
            <div class="area-copia" id="textoPix">
                <!-- O código será inserido aqui pelo JavaScript -->
            </div>
            
            <button class="btn-copiar" onclick="copiarChave()">
                📋 Copiar Código PIX
            </button>
            
            <!-- BOTÃO DE CONFIRMAÇÃO DE PAGAMENTO -->
            <button class="btn-confirmar" onclick="confirmarPagamento()">
                ✅ Já realizei o pagamento
            </button>
            
            <p style="font-size: 12px; color: #888; margin: 10px 0;">Após confirmar, o saldo será creditado.</p>
            <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script>
        let valorAtual = 0;
        // ⚠️ SUBSTITUA PELO SEU CÓDIGO PIX REAL
        const chavePixReal = "00020101021126450014BR.GOV.BCB.PIX0123lukavieira045@gmail.com5204000053039865802BR5925Luka Vieira0456008Sao Paulo62070503***6304XXXX";

        // --- SISTEMA DE SALDO ---
        function carregarSaldo() {
            let saldo = localStorage.getItem('apostaXBet_saldo');
            if (!saldo) {
                saldo = 0;
                localStorage.setItem('apostaXBet_saldo', 0);
            }
            document.getElementById('displaySaldo').innerText = `Saldo: R$ ${parseFloat(saldo).toFixed(2).replace('.', ',')}`;
        }

        function adicionarSaldo(valor) {
            let saldoAtual = parseFloat(localStorage.getItem('apostaXBet_saldo')) || 0;
            let novoSaldo = saldoAtual + valor;
            localStorage.setItem('apostaXBet_saldo', novoSaldo);
            carregarSaldo();
            alert(`✅ Depósito de R$ ${valor},00 recebido com sucesso!`);
            fecharModal();
        }

        // --- FUNÇÕES DA MODAL ---
        function selecionarValor(botao, valor) {
            document.querySelectorAll('.btn-valor').forEach(b => b.classList.remove('ativo'));
            botao.classList.add('ativo');
            valorAtual = valor;
            const btnDepositar = document.getElementById('btnDepositar');
            btnDepositar.disabled = false;
            btnDepositar.style.opacity = '1';
            btnDepositar.innerHTML = `💰 Depositar R$ ${valor},00 via PIX`;
        }

        function abrirModal() {
            if (valorAtual > 0) {
                document.getElementById('valorDisplay').innerText = `Valor: R$ ${valorAtual},00`;
                document.getElementById('textoPix').innerText = chavePixReal; 
                document.getElementById('modalPix').style.display = 'flex';
            }
        }

        function fecharModal() {
            document.getElementById('modalPix').style.display = 'none';
        }

        function copiarChave() {
            const texto = document.getElementById('textoPix').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.querySelector('.btn-copiar');
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copiado!";
                btn.style.background = "#28a745";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = "#007bff";
                }, 2000);
            }).catch(err => {
                alert("Erro ao copiar. Tente selecionar e copiar manualmente.");
            });
        }

        function confirmarPagamento() {
            if (confirm(`Confirmar depósito de R$ ${valorAtual},00?`)) {
                adicionarSaldo(valorAtual);
            }
        }

        // Inicializa o saldo ao carregar a página
        window.onload = carregarSaldo;
    </script>

</body>
</html>
