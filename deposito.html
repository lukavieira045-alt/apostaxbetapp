<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar - ApostaXBet</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: white; font-family: Arial, sans-serif; padding-bottom: 90px; }
        .topo { text-align: center; padding: 25px 10px; background: #111; border-bottom: 2px solid #d9b21f; }
        .topo h1 { margin: 0; color: #e6c229; font-size: 28px; }
        .saldo { margin-top: 8px; color: #00ed91; font-weight: bold; font-size: 18px; }
        .container { width: 94%; max-width: 600px; margin: 25px auto; }
        .valores-rapidos { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-valor { flex: 1; min-width: 70px; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-valor:hover, .btn-valor.ativo { background: #e6c229; color: #000; border-color: #e6c229; }
        .btn-pix { display: block; width: 100%; padding: 18px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-pix:active { transform: scale(0.98); }
        .modal-pix { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .modal-conteudo { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; color: #333; position: relative; }
        .modal-conteudo h3 { margin-top: 0; color: #111; }
        .modal-conteudo img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
        .valor-selecionado { font-size: 20px; color: #28a745; font-weight: bold; margin-bottom: 10px; display: block; }
        .area-copia { background: #f0f0f0; padding: 10px; border-radius: 8px; margin: 15px 0; word-break: break-all; font-family: monospace; font-size: 12px; color: #555; max-height: 60px; overflow-y: auto; border: 1px dashed #ccc; }
        .btn-copiar { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-copiar:active { transform: scale(0.98); }
        .btn-fechar { background: #dc3545; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="topo">
        <h1>ApostaXBet</h1>
        <div class="saldo" id="displaySaldo">Saldo: R$ 0,00</div>
    </div>
    <div class="container">
        <h2>Recarregar Saldo</h2>
        <p>Escolha um valor para depositar via PIX:</p>
        <div class="valores-rapidos">
            <button class="btn-valor" onclick="selecionarValor(this, 10)">R$ 10</button>
            <button class="btn-valor" onclick="selecionarValor(this, 20)">R$ 20</button>
            <button class="btn-valor" onclick="selecionarValor(this, 50)">R$ 50</button>
            <button class="btn-valor" onclick="selecionarValor(this, 100)">R$ 100</button>
            <button class="btn-valor" onclick="selecionarValor(this, 200)">R$ 200</button>
        </div>
        <button id="btnDepositar" class="btn-pix" onclick="abrirModal()" disabled style="opacity: 0.6;">Depositar via PIX</button>
    </div>
    <div id="modalPix" class="modal-pix" onclick="if(event.target === this) fecharModal()">
        <div class="modal-conteudo">
            <h3>Escaneie ou Copie</h3>
            <span id="valorDisplay" class="valor-selecionado"></span>
            <img src="img/qrcode.png" alt="QR Code PIX">
            <div class="area-copia" id="textoPix"></div>
            <button class="btn-copiar" onclick="copiarChave()">📋 Copiar Código PIX</button>
            <p style="font-size: 12px; color: #888; margin: 10px 0;">O saldo será creditado automaticamente após a compensação bancária.</p>
            <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script>
        let valorAtual = 0;
        
        // CONFIGURAÇÃO DO SUPABASE
        const WEBHOOK_DEPOSITO_URL = 'https://jxbzjiwmajjzxgihfjgt.supabase.co/functions/v1/swift-action';
        const SECRET_KEY = 'L3'; // SENHA ATUALIZADA
        
        // CONFIGURAÇÃO MERCADO PAGO
        const MP_TOKEN = 'TEST-3171714729992991-082109-df9fca3eb1cbb0ba664f78a01ad06bb1-2454046269';

        function carregarSaldo() {
            let saldo = localStorage.getItem('apostaXBet_saldo');
            if (!saldo) { saldo = 0; localStorage.setItem('apostaXBet_saldo', 0); }
            document.getElementById('displaySaldo').innerText = `Saldo: R$ ${parseFloat(saldo).toFixed(2).replace('.', ',')}`;
        }

        function selecionarValor(botao, valor) {
            document.querySelectorAll('.btn-valor').forEach(b => b.classList.remove('ativo'));
            botao.classList.add('ativo');
            valorAtual = valor;
            const btnDepositar = document.getElementById('btnDepositar');
            btnDepositar.disabled = false;
            btnDepositar.style.opacity = '1';
            btnDepositar.innerHTML = `💰 Depositar R$ ${valor},00 via PIX`;
        }

        async function gerarPixDinamico(valor) {
            try {
                // Endpoint oficial do Mercado Pago para criar cobrança Pix
                const response = await fetch('https://api.mercadopago.com/v1/payments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${MP_TOKEN}`
                    },
                    body: JSON.stringify({
                        transaction_amount: valor,
                        description: `Depósito ApostaXBet - R$ ${valor}`,
                        payment_method_id: 'pix',
                        payer: { email: 'cliente@exemplo.com' } // Email genérico para teste
                    })
                });
                
                const data = await response.json();
                
                // O Mercado Pago retorna o point_of_interaction com o QR Code
                if (data.point_of_interaction && data.point_of_interaction.transaction_data) {
                    return {
                        qr_code: data.point_of_interaction.transaction_data.qr_code,
                        qr_code_base64: data.point_of_interaction.transaction_data.qr_code_base64
                    };
                }
                return null;
            } catch (erro) {
                console.error('Erro ao gerar Pix MP:', erro);
                return null;
            }
        }

        async function abrirModal() {
            if (valorAtual > 0) {
                document.getElementById('modalPix').style.display = 'flex';
                document.getElementById('valorDisplay').innerText = `Valor: R$ ${valorAtual},00`;
                document.getElementById('textoPix').innerText = "Gerando Pix seguro...";
                
                const pixData = await gerarPixDinamico(valorAtual);
                
                if (pixData) {
                    document.getElementById('textoPix').innerText = pixData.qr_code;
                    
                    // Se o MP já mandar a imagem em base64, usa ela. Se não, gera pela API externa
                    if (pixData.qr_code_base64) {
                        document.querySelector('.modal-conteudo img').src = `data:image/png;base64,${pixData.qr_code_base64}`;
                    } else {
                        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(pixData.qr_code)}`;
                        document.querySelector('.modal-conteudo img').src = qrUrl;
                    }
                    
                    // Envia para Supabase
                    try {
                        const userId = localStorage.getItem('apostaXBet_userId') || 'nao_identificado';
                        await fetch(WEBHOOK_DEPOSITO_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Betting-Secret': SECRET_KEY },
                            body: JSON.stringify({ tipo: 'deposito_pix', valor: valorAtual, userId: userId, data: new Date().toISOString(), status: 'pendente' })
                        });
                    } catch (e) { console.error('Erro Supabase:', e); }
                } else {
                    document.getElementById('textoPix').innerText = "Erro ao gerar Pix. Verifique o token.";
                }
            }
        }

        function fecharModal() { document.getElementById('modalPix').style.display = 'none'; }

        function copiarChave() {
            const texto = document.getElementById('textoPix').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.querySelector('.btn-copiar');
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copiado!";
                btn.style.background = "#28a745";
                setTimeout(() => { btn.innerHTML = originalText; btn.style.background = "#007bff"; }, 2000);
            }).catch(() => alert("Erro ao copiar. Tente manualmente."));
        }

        window.onload = carregarSaldo;
    </script>
</body>
</html>
