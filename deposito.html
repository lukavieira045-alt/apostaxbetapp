<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Depositar - ApostaXBet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="saldo.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 90px;
        }

        .topo {
            text-align: center;
            padding: 25px 10px;
            background: #111;
            border-bottom: 2px solid #d9b21f;
        }

        .topo h1 {
            margin: 0;
            color: #e6c229;
            font-size: 28px;
        }

        .saldo {
            margin-top: 8px;
            color: #00ed91;
            font-weight: bold;
            font-size: 18px;
        }

        .container {
            width: 94%;
            max-width: 600px;
            margin: 25px auto;
        }

        .valores-rapidos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-valor {
            flex: 1;
            min-width: 70px;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-valor:hover,
        .btn-valor.ativo {
            background: #e6c229;
            color: #000;
            border-color: #e6c229;
        }

        .btn-pix {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pix:disabled {
            cursor: not-allowed;
        }

        .btn-pix:active {
            transform: scale(0.98);
        }

        .modal-pix {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 92%;
            max-width: 380px;
            color: #333;
            position: relative;
        }

        .modal-conteudo h3 {
            margin-top: 0;
            color: #111;
        }

        #qrCodePix {
            width: 250px;
            height: 250px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            margin: 15px auto;
            display: block;
            background: white;
        }

        .valor-selecionado {
            font-size: 20px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .area-copia {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            max-height: 80px;
            overflow-y: auto;
            border: 1px dashed #ccc;
        }

        .btn-copiar {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .btn-copiar:active {
            transform: scale(0.98);
        }

        .btn-fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        #mensagemDeposito {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .mensagem-erro {
            background: #3a1111;
            color: #ff7777;
            border: 1px solid #8b2222;
        }

        .mensagem-sucesso {
            background: #103a20;
            color: #70ff9b;
            border: 1px solid #227a3d;
        }

        .carregando {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h1>ApostaXBet</h1>

        <div class="saldo" id="displaySaldo">
            Saldo: R$ 0,00
        </div>
    </div>

    <div class="container">

        <h2>Recarregar Saldo</h2>

        <p>
            Escolha um valor para depositar via PIX:
        </p>

        <div class="valores-rapidos">

            <button class="btn-valor" onclick="selecionarValor(this, 10)">
                R$ 10
            </button>

            <button class="btn-valor" onclick="selecionarValor(this, 20)">
                R$ 20
            </button>

            <button class="btn-valor" onclick="selecionarValor(this, 50)">
                R$ 50
            </button>

            <button class="btn-valor" onclick="selecionarValor(this, 100)">
                R$ 100
            </button>

            <button class="btn-valor" onclick="selecionarValor(this, 200)">
                R$ 200
            </button>

        </div>

        <button
            id="btnDepositar"
            class="btn-pix"
            onclick="abrirModal()"
            disabled
            style="opacity: 0.6;"
        >
            Depositar via PIX
        </button>

        <div id="mensagemDeposito"></div>

    </div>

    <div
        id="modalPix"
        class="modal-pix"
        onclick="if(event.target === this) fecharModal()"
    >

        <div class="modal-conteudo">

            <h3>Pague com PIX</h3>

            <span id="valorDisplay" class="valor-selecionado"></span>

            <div id="carregandoPix" class="carregando">
                Criando PIX...
            </div>

            <img
                id="qrCodePix"
                src=""
                alt="QR Code PIX"
                style="display:none;"
            >

            <div class="area-copia" id="textoPix"></div>

            <button class="btn-copiar" onclick="copiarChave()">
                📋 Copiar Código PIX
            </button>

            <p style="font-size:12px;color:#888;margin:10px 0;">
                Escaneie o QR Code no aplicativo do seu banco
                ou copie o código PIX.
            </p>

            <button class="btn-fechar" onclick="fecharModal()">
                Fechar
            </button>

        </div>

    </div>

    <script>

        // =====================================================
        // SUPABASE
        // =====================================================

        const SUPABASE_URL =
            "https://jxbzjiwmajjzxgihfjgt.supabase.co";

        const SUPABASE_ANON_KEY =
            "<SECRET>";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        // =====================================================
        // DEPÓSITO
        // =====================================================

        const WEBHOOK_DEPOSITO_URL =
            "https://jxbzjiwmajjzxgihfjgt.supabase.co/functions/v1/swift-action";

        let valorAtual = 0;

        let usuarioAtual = null;

        let saldoAtual = 0;


        // =====================================================
        // FORMATAR SALDO
        // =====================================================

        function formatarReais(valor) {

            const numero =
                Number(valor) || 0;

            return numero
                .toFixed(2)
                .replace(".", ",");
        }


        // =====================================================
        // MOSTRAR SALDO
        // =====================================================

        function atualizarSaldoVisual() {

            const numero =
                Number(saldoAtual) || 0;

            document.getElementById(
                "displaySaldo"
            ).innerText =
                `Saldo: R$ ${formatarReais(numero)}`;
        }


        // =====================================================
        // CARREGAR USUÁRIO
        // =====================================================

        async function carregarUsuario() {

            try {

                /*
                 * PRIMEIRO:
                 * usa a sessão atual do mesmo Supabase
                 * utilizado pelo site principal.
                 */

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                if (sessionError) {

                    console.error(
                        "Erro ao obter sessão:",
                        sessionError
                    );

                    throw new Error(
                        "Não foi possível verificar sua sessão."
                    );
                }


                const session =
                    sessionData?.session;


                if (!session?.user) {

                    mostrarErro(
                        "Usuário não identificado. Faça login novamente."
                    );

                    return null;
                }


                usuarioAtual =
                    session.user;


                console.log(
                    "ApostaXBet - usuário:",
                    usuarioAtual.id
                );


                return usuarioAtual;


            } catch (erro) {

                console.error(
                    "Erro ao carregar usuário:",
                    erro
                );

                mostrarErro(
                    erro.message ||
                    "Erro ao carregar sua conta."
                );

                return null;
            }
        }


        // =====================================================
        // CARREGAR O MESMO SALDO DA PÁGINA PRINCIPAL
        // =====================================================

        async function carregarSaldo() {

            try {

                /*
                 * TENTA PRIMEIRO O SISTEMA DE SALDO GLOBAL.
                 *
                 * É o mesmo SistemaSaldo utilizado pelos jogos
                 * e pela página principal.
                 */

                if (
                    window.SistemaSaldo &&
                    typeof window.SistemaSaldo.get === "function"
                ) {

                    let resultado =
                        window.SistemaSaldo.get();

                    if (
                        resultado &&
                        typeof resultado.then === "function"
                    ) {
                        resultado =
                            await resultado;
                    }

                    /*
                     * O SistemaSaldo pode retornar diretamente
                     * o número ou um objeto contendo o saldo.
                     */

                    if (
                        typeof resultado === "number"
                    ) {

                        saldoAtual =
                            resultado;

                        atualizarSaldoVisual();

                        console.log(
                            "Saldo carregado pelo SistemaSaldo:",
                            saldoAtual
                        );

                        return;
                    }


                    if (
                        resultado &&
                        typeof resultado === "object"
                    ) {

                        const possivelSaldo =
                            resultado.valor ??
                            resultado.saldo ??
                            resultado.balance;

                        if (
                            possivelSaldo !== undefined &&
                            possivelSaldo !== null
                        ) {

                            saldoAtual =
                                Number(possivelSaldo) || 0;

                            atualizarSaldoVisual();

                            console.log(
                                "Saldo carregado pelo SistemaSaldo:",
                                saldoAtual
                            );

                            return;
                        }
                    }
                }


                /*
                 * FALLBACK:
                 * caso o saldo.js ainda não esteja disponível,
                 * busca diretamente a mesma tabela "saldos".
                 */

                if (!usuarioAtual) {

                    const usuario =
                        await carregarUsuario();

                    if (!usuario) {
                        return;
                    }
                }


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("saldos")
                        .select("valor")
                        .eq(
                            "user_id",
                            usuarioAtual.id
                        )
                        .maybeSingle();


                if (error) {

                    console.error(
                        "Erro ao consultar saldo:",
                        error
                    );

                    throw new Error(
                        "Não foi possível carregar seu saldo."
                    );
                }


                saldoAtual =
                    Number(data?.valor) || 0;


                atualizarSaldoVisual();


                console.log(
                    "Saldo carregado da tabela saldos:",
                    saldoAtual
                );


            } catch (erro) {

                console.error(
                    "Erro ao carregar saldo:",
                    erro
                );

                /*
                 * NÃO transforma um erro de leitura em
                 * um falso saldo de R$ 0,00 silenciosamente.
                 */

                document.getElementById(
                    "displaySaldo"
                ).innerText =
                    "Saldo: --";

                mostrarErro(
                    erro.message ||
                    "Erro ao carregar seu saldo."
                );
            }
        }


        // =====================================================
        // ATUALIZAR SALDO
        // =====================================================

        async function atualizarSaldo() {

            await carregarUsuario();

            if (!usuarioAtual) {
                return;
            }

            await carregarSaldo();
        }


        // =====================================================
        // ESCOLHER VALOR
        // =====================================================

        function selecionarValor(botao, valor) {

            document
                .querySelectorAll(".btn-valor")
                .forEach(
                    b =>
                        b.classList.remove("ativo")
                );


            botao.classList.add("ativo");


            valorAtual =
                Number(valor);


            const btn =
                document.getElementById(
                    "btnDepositar"
                );


            btn.disabled =
                false;


            btn.style.opacity =
                "1";


            btn.innerHTML =
                `💰 Depositar R$ ${formatarReais(valor)} via PIX`;
        }


        // =====================================================
        // ABRIR MODAL / CRIAR PIX
        // =====================================================

        async function abrirModal() {

            if (
                !valorAtual ||
                valorAtual <= 0
            ) {
                return;
            }


            const modal =
                document.getElementById(
                    "modalPix"
                );

            const qr =
                document.getElementById(
                    "qrCodePix"
                );

            const texto =
                document.getElementById(
                    "textoPix"
                );

            const carregando =
                document.getElementById(
                    "carregandoPix"
                );


            modal.style.display =
                "flex";


            qr.style.display =
                "none";


            qr.src =
                "";


            texto.innerText =
                "";


            carregando.style.display =
                "block";


            carregando.innerText =
                "Criando PIX...";


            document.getElementById(
                "valorDisplay"
            ).innerText =
                `Valor: R$ ${formatarReais(valorAtual)}`;


            // GARANTIR USUÁRIO AUTENTICADO

            if (!usuarioAtual) {

                await carregarUsuario();

                if (!usuarioAtual) {

                    fecharModal();

                    return;
                }
            }


            const userId =
                usuarioAtual.id;


            console.log(
                "ApostaXBet - usuário utilizado no depósito:",
                userId
            );


            // =================================================
            // CHAMAR EDGE FUNCTION
            // =================================================

            try {

                const resposta =
                    await fetch(
                        WEBHOOK_DEPOSITO_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                tipo:
                                    "deposito_pix",

                                valor:
                                    valorAtual,

                                userId:
                                    userId,

                                data:
                                    new Date()
                                        .toISOString(),

                                status:
                                    "pendente"
                            })
                        }
                    );


                const textoResposta =
                    await resposta.text();


                let dados;


                try {

                    dados =
                        JSON.parse(
                            textoResposta
                        );

                } catch {

                    console.error(
                        "Resposta recebida:",
                        textoResposta
                    );

                    throw new Error(
                        "A função retornou uma resposta inválida."
                    );
                }


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    console.error(
                        "Resposta da função:",
                        dados
                    );

                    throw new Error(
                        dados.error ||
                        "Não foi possível criar o PIX."
                    );
                }


                // =================================================
                // PIX RECEBIDO
                // =================================================

                const codigoPix =
                    dados.qr_code;


                if (!codigoPix) {

                    throw new Error(
                        "O Mercado Pago não retornou o código PIX."
                    );
                }


                texto.innerText =
                    codigoPix;


                // =================================================
                // QR CODE
                // =================================================

                if (dados.qr_code_base64) {

                    qr.src =
                        `data:image/png;base64,${dados.qr_code_base64}`;

                } else {

                    qr.src =
                        "https://api.qrserver.com/v1/create-qr-code/" +
                        `?size=250x250&data=${encodeURIComponent(codigoPix)}`;
                }


                qr.onload =
                    function() {

                        carregando.style.display =
                            "none";

                        qr.style.display =
                            "block";
                    };


                qr.onerror =
                    function() {

                        carregando.innerText =
                            "QR Code não pôde ser exibido. Use o código PIX abaixo.";

                        qr.style.display =
                            "none";
                    };


            } catch (erro) {

                console.error(
                    "Erro ao criar PIX:",
                    erro
                );


                carregando.innerText =
                    erro.message ||
                    "Não foi possível criar o PIX.";


                texto.innerText =
                    "";


                mostrarErro(
                    erro.message ||
                    "Não foi possível criar o PIX."
                );
            }
        }


        // =====================================================
        // COPIAR PIX
        // =====================================================

        async function copiarChave() {

            const texto =
                document.getElementById(
                    "textoPix"
                ).innerText.trim();


            if (!texto) {

                alert(
                    "O código PIX ainda não foi carregado."
                );

                return;
            }


            try {

                await navigator.clipboard.writeText(
                    texto
                );


                const btn =
                    document.querySelector(
                        ".btn-copiar"
                    );


                const original =
                    btn.innerHTML;


                btn.innerHTML =
                    "✅ Copiado!";


                btn.style.background =
                    "#28a745";


                setTimeout(
                    () => {

                        btn.innerHTML =
                            original;

                        btn.style.background =
                            "#007bff";

                    },
                    2000
                );


            } catch {

                alert(
                    "Não foi possível copiar automaticamente. Selecione e copie o código PIX."
                );
            }
        }


        // =====================================================
        // FECHAR MODAL
        // =====================================================

        function fecharModal() {

            document.getElementById(
                "modalPix"
            ).style.display =
                "none";
        }


        // =====================================================
        // MENSAGEM DE ERRO
        // =====================================================

        function mostrarErro(mensagem) {

            const elemento =
                document.getElementById(
                    "mensagemDeposito"
                );


            elemento.className =
                "mensagem-erro";


            elemento.innerText =
                mensagem;


            elemento.style.display =
                "block";


            setTimeout(
                () => {

                    elemento.style.display =
                        "none";

                },
                7000
            );
        }


        // =====================================================
        // INICIAR
        // =====================================================

        window.addEventListener(
            "load",
            async function() {

                await carregarUsuario();

                if (usuarioAtual) {
                    await carregarSaldo();
                }

            }
        );

    </script>

</body>
</html>
