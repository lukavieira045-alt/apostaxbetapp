<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos - ApostaXBet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      border-bottom: 2px solid #d8af16;
      background: #111;
    }

    header h1 {
      color: #e6bc24;
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .titulo {
      text-align: center;
      color: #e6bc24;
      font-size: 28px;
      margin: 10px 0 25px;
    }

    .jogos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .jogo {
      background:
        radial-gradient(circle at top, #202060 0%, #171717 55%);
      border: 2px solid #d8af16;
      border-radius: 20px;
      min-height: 180px;
      padding: 20px 10px;
      text-align: center;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: .2s;
      box-shadow: 0 0 15px rgba(216,175,22,.15);
    }

    .jogo:active {
      transform: scale(.97);
    }

    .icone {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .descricao {
      color: #aaa;
      font-size: 14px;
    }

    .cassino {
      border-color: #8b5cff;
      box-shadow:
        0 0 12px rgba(139,92,255,.35),
        inset 0 0 20px rgba(40,20,90,.3);
    }

    .cassino .nome {
      color: #c6a7ff;
    }

    .voltar {
      display: block;
      text-align: center;
      margin: 25px auto;
      color: #e6bc24;
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #111;
      border-top: 2px solid #d8af16;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    nav a {
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
    }

    nav span {
      display: block;
      font-size: 27px;
      margin-bottom: 3px;
    }

    @media (max-width: 380px) {
      .jogos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎰 ApostaXBet</h1>
    <p>🎮 Escolha um jogo</p>
  </header>

  <main class="container">

    <h2 class="titulo">🎮 Jogos</h2>

    <div class="jogos">

      <!-- ROLETA -->
      <a class="jogo" href="roleta.html">
        <div class="icone">🎰</div>
        <div class="nome">Roleta</div>
        <div class="descricao">Gire a roleta</div>
      </a>

      <!-- MINES -->
      <a class="jogo" href="mines.html">
        <div class="icone">💣</div>
        <div class="nome">Mines</div>
        <div class="descricao">Encontre os diamantes</div>
      </a>

      <!-- CRASH -->
      <a class="jogo" href="crash.html">
        <div class="icone">🚀</div>
        <div class="nome">Crash</div>
        <div class="descricao">Acompanhe o multiplicador</div>
      </a>

      <!-- PLINKO -->
      <a class="jogo" href="plinko.html">
        <div class="icone">🎯</div>
        <div class="nome">Plinko</div>
        <div class="descricao">Solte a bola</div>
      </a>

      <!-- DICE -->
      <a class="jogo" href="dice.html">
        <div class="icone">🎲</div>
        <div class="nome">Dice</div>
        <div class="descricao">Jogue os dados</div>
      </a>

      <!-- NIGHT MONSTERS -->
      <a class="jogo" href="hotel-transylvania/index.html">
        <div class="icone">🧛</div>
        <div class="nome">Night Monsters</div>
        <div class="descricao">Hotel Transilvânia</div>
      </a>

      <!-- ROLETA CASSINO -->
      <a class="jogo cassino" href="roleta-cassino.html">
        <div class="icone">🎰</div>
        <div class="nome">Roleta Cassino</div>
        <div class="descricao">Roleta estilo cassino</div>
      </a>

    </div>

    <a class="voltar" href="../index.html">
      ← Voltar para o início
    </a>

  </main>

  <nav>

    <a href="../index.html">
      <span>🏠</span>
      Início
    </a>

    <a href="jogos.html">
      <span>🎮</span>
      Jogos
    </a>

    <a href="../index.html">
      <span>👤</span>
      Conta
    </a>

  </nav>

</body>
</html>
