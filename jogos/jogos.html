<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogos - ApostaXBet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
      border-bottom: 2px solid #d9ad21;
      background: #111;
    }

    header h1 {
      margin: 0;
      color: #e4b72d;
      font-size: 28px;
    }

    .saldo {
      margin-top: 8px;
      font-size: 18px;
      color: #00ff91;
    }

    .titulo {
      text-align: center;
      margin: 30px 0 20px;
      color: #e4b72d;
      font-size: 30px;
    }

    .jogos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 0 14px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      min-height: 220px;
      background: #171717;
      border: 2px solid #d9ad21;
      border-radius: 22px;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      transition: transform 0.15s, background 0.15s;
    }

    .card:active {
      transform: scale(0.96);
      background: #222;
    }

    .icone {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin: 5px 0;
      font-size: 23px;
    }

    .card p {
      margin: 5px 0 0;
      color: #aaa;
      text-align: center;
      font-size: 15px;
    }

    .voltar {
      display: block;
      width: calc(100% - 30px);
      max-width: 680px;
      margin: 25px auto;
      padding: 16px;
      text-align: center;
      background: #d9ad21;
      color: #000;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #111;
      border-top: 2px solid #d9ad21;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .menu a {
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
    }

    .menu span {
      display: block;
      font-size: 25px;
      margin-bottom: 3px;
    }

    @media (max-width: 420px) {
      .jogos {
        gap: 12px;
        padding: 0 10px;
      }

      .card {
        min-height: 200px;
      }

      .icone {
        font-size: 55px;
      }

      .card h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎰 ApostaXBet</h1>
    <div class="saldo">💰 Saldo: R$ 2,00</div>
  </header>

  <h1 class="titulo">🎮 Jogos</h1>

  <section class="jogos">

    <a href="roleta.html" class="card">
      <div class="icone">🎰</div>
      <h2>Roleta</h2>
      <p>Gire a roleta</p>
    </a>

    <a href="mines.html" class="card">
      <div class="icone">💣</div>
      <h2>Mines</h2>
      <p>Encontre os diamantes</p>
    </a>

    <a href="crash.html" class="card">
      <div class="icone">🚀</div>
      <h2>Crash</h2>
      <p>Acompanhe o multiplicador</p>
    </a>

    <a href="plinko.html" class="card">
      <div class="icone">🎯</div>
      <h2>Plinko</h2>
      <p>Solte a bola</p>
    </a>

    <a href="dice.html" class="card">
      <div class="icone">🎲</div>
      <h2>Dice</h2>
      <p>Jogue os dados</p>
    </a>

  </section>

  <a href="../index.html" class="voltar">
    ← Voltar para o início
  </a>

  <nav class="menu">
    <a href="../index.html">
      <span>🏠</span>
      Início
    </a>

    <a href="jogos.html">
      <span>🎮</span>
      Jogos
    </a>

    <a href="../index.html">
      <span>👤</span>
      Conta
    </a>
  </nav>

</body>
</html>
