<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080014">

<title>Night Monsters</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#05000b;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 10%,rgba(126,34,206,.35),transparent 28%),
        radial-gradient(circle at 15% 70%,rgba(236,72,153,.18),transparent 25%),
        radial-gradient(circle at 85% 75%,rgba(37,99,235,.20),transparent 25%),
        linear-gradient(160deg,#05000b,#10001d 45%,#05000c);
}

/* FUNDO */

.fundo{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.nevoa{
    position:absolute;
    border-radius:50%;
    filter:blur(55px);
    opacity:.35;
    animation:flutuar 8s ease-in-out infinite alternate;
}

.nevoa1{
    width:240px;
    height:240px;
    background:#7c3aed;
    top:5%;
    left:-80px;
}

.nevoa2{
    width:280px;
    height:280px;
    background:#db2777;
    right:-100px;
    top:30%;
    animation-delay:2s;
}

.nevoa3{
    width:220px;
    height:220px;
    background:#2563eb;
    bottom:-70px;
    left:30%;
    animation-delay:4s;
}

@keyframes flutuar{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(35px,-25px) scale(1.15);
    }
}

.estrelas{
    position:absolute;
    inset:0;
}

.estrela{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #fff;
    animation:piscar 2s ease-in-out infinite alternate;
}

.estrela:nth-child(1){left:8%;top:12%;animation-delay:.2s;}
.estrela:nth-child(2){left:20%;top:30%;animation-delay:1s;}
.estrela:nth-child(3){left:34%;top:8%;animation-delay:.5s;}
.estrela:nth-child(4){left:48%;top:22%;animation-delay:1.5s;}
.estrela:nth-child(5){left:62%;top:11%;animation-delay:.8s;}
.estrela:nth-child(6){left:76%;top:35%;animation-delay:1.2s;}
.estrela:nth-child(7){left:91%;top:15%;animation-delay:.3s;}
.estrela:nth-child(8){left:14%;top:65%;animation-delay:1.7s;}
.estrela:nth-child(9){left:42%;top:58%;animation-delay:.6s;}
.estrela:nth-child(10){left:70%;top:68%;animation-delay:1.4s;}
.estrela:nth-child(11){left:87%;top:80%;animation-delay:.9s;}
.estrela:nth-child(12){left:28%;top:88%;animation-delay:1.9s;}

@keyframes piscar{
    from{
        opacity:.2;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1.4);
    }
}

/* TOPO */

.topo{
    position:relative;
    z-index:5;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(5,0,12,.78);
    border-bottom:1px solid rgba(168,85,247,.25);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:20px;
    font-weight:1000;
    letter-spacing:.5px;
    background:linear-gradient(
        90deg,
        #f9a8d4,
        #c084fc,
        #818cf8,
        #67e8f9
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.voltar{
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:#fff;
    text-decoration:none;
    padding:9px 13px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
}

/* CONTAINER */

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:20px 13px 35px;
}

/* TÍTULO */

.titulo{
    text-align:center;
    margin-top:8px;
}

.icone{
    font-size:58px;
    display:block;
    margin-bottom:4px;
    filter:
        drop-shadow(0 0 8px rgba(192,132,252,.8))
        drop-shadow(0 0 25px rgba(236,72,153,.45));
    animation:flutuarIcone 2.5s ease-in-out infinite alternate;
}

@keyframes flutuarIcone{
    from{
        transform:translateY(4px) rotate(-2deg);
    }
    to{
        transform:translateY(-5px) rotate(2deg);
    }
}

.titulo h1{
    font-size:34px;
    line-height:1;
    font-weight:1000;
    background:linear-gradient(
        90deg,
        #f9a8d4,
        #c084fc,
        #818cf8,
        #67e8f9
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 25px rgba(168,85,247,.35);
}

.titulo p{
    margin-top:9px;
    color:#cfc4dd;
    font-size:12px;
    font-weight:bold;
}

/* SALDO */

.saldo{
    margin:18px 0 12px;
    padding:14px 16px;
    border-radius:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.25),
            rgba(219,39,119,.18)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 10px 25px rgba(0,0,0,.3),
        inset 0 0 20px rgba(255,255,255,.025);
}

.saldo-label{
    color:#c9bdd7;
    font-size:12px;
}

.saldo-valor{
    font-size:19px;
    font-weight:1000;
    color:#86efac;
    text-shadow:0 0 12px rgba(74,222,128,.3);
}

/* JOGO */

.jogo{
    position:relative;
    overflow:hidden;
    padding:16px;
    border-radius:23px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(168,85,247,.25),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            rgba(30,10,52,.96),
            rgba(9,8,28,.98)
        );
    border:1px solid rgba(192,132,252,.25);
    box-shadow:
        0 20px 45px rgba(0,0,0,.45),
        0 0 35px rgba(124,58,237,.12);
}

.jogo::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    left:50%;
    top:-150px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#a855f7;
    filter:blur(65px);
    opacity:.15;
    pointer-events:none;
}

/* PAINEL */

.painel{
    position:relative;
    z-index:2;
    padding:15px;
    border-radius:18px;
    text-align:center;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.08);
}

.status-label{
    color:#aaa0b7;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
}

.multiplicador{
    margin-top:3px;
    font-size:52px;
    line-height:1;
    font-weight:1000;
    color:#fff;
    text-shadow:
        0 0 12px rgba(192,132,252,.7),
        0 0 30px rgba(168,85,247,.4);
    transition:.25s ease;
}

.multiplicador.verde{
    color:#86efac;
    text-shadow:0 0 20px rgba(74,222,128,.7);
}

.multiplicador.vermelho{
    color:#fb7185;
    text-shadow:0 0 20px rgba(244,63,94,.7);
}

.multiplicador.roxo{
    color:#c084fc;
}

/* MONSTRO */

.arena{
    position:relative;
    z-index:2;
    height:265px;
    margin:14px 0;
    overflow:hidden;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 55%,
            rgba(124,58,237,.28),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            rgba(20,7,38,.8),
            rgba(3,5,18,.95)
        );
    border:1px solid rgba(255,255,255,.08);
}

.lua{
    position:absolute;
    width:95px;
    height:95px;
    border-radius:50%;
    top:24px;
    right:30px;
    background:#eee;
    box-shadow:
        0 0 20px rgba(255,255,255,.55),
        0 0 50px rgba(147,197,253,.35);
}

.lua::after{
    content:"";
    position:absolute;
    width:95px;
    height:95px;
    border-radius:50%;
    background:#090617;
    left:-24px;
    top:-8px;
}

.nuvem{
    position:absolute;
    bottom:35px;
    width:100%;
    height:75px;
    opacity:.25;
    background:
        radial-gradient(
            ellipse,
            #7c3aed 0%,
            transparent 65%
        );
    filter:blur(18px);
}

.monstro{
    position:relative;
    z-index:3;
    font-size:125px;
    line-height:1;
    filter:
        drop-shadow(0 0 8px rgba(192,132,252,.8))
        drop-shadow(0 0 30px rgba(124,58,237,.55));
    animation:monstroFlutua 2s ease-in-out infinite alternate;
    user-select:none;
}

@keyframes monstroFlutua{
    from{
        transform:translateY(7px) scale(.98);
    }
    to{
        transform:translateY(-8px) scale(1.03);
    }
}

.arena.jogando .monstro{
    animation:
        monstroFlutua .6s ease-in-out infinite alternate,
        brilhoMonstro .7s ease-in-out infinite alternate;
}

@keyframes brilhoMonstro{
    from{
        filter:
            drop-shadow(0 0 8px rgba(192,132,252,.8))
            drop-shadow(0 0 25px rgba(124,58,237,.5));
    }
    to{
        filter:
            drop-shadow(0 0 18px rgba(244,114,182,1))
            drop-shadow(0 0 45px rgba(168,85,247,.9));
    }
}

/* RESULTADO */

.resultado{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(5,0,15,.78);
    backdrop-filter:blur(4px);
    opacity:0;
    visibility:hidden;
    transition:.25s ease;
}

.resultado.ativo{
    opacity:1;
    visibility:visible;
}

.resultado-titulo{
    font-size:28px;
    font-weight:1000;
}

.resultado-texto{
    margin-top:7px;
    color:#d8cce3;
    font-size:13px;
}

/* CONTROLES */

.controles{
    position:relative;
    z-index:2;
}

.linha{
    display:flex;
    gap:9px;
}

.campo{
    flex:1;
}

.campo label{
    display:block;
    color:#aaa0b7;
    font-size:10px;
    font-weight:bold;
    margin-bottom:6px;
}

.input-box{
    width:100%;
    height:46px;
    padding:0 12px;
    border-radius:12px;
    outline:none;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.28);
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.input-box:focus{
    border-color:#a855f7;
    box-shadow:0 0 12px rgba(168,85,247,.2);
}

.botao{
    width:100%;
    height:50px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    color:#fff;
    font-size:16px;
    font-weight:1000;
    cursor:pointer;
    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #c026d3,
            #db2777
        );
    box-shadow:
        0 8px 20px rgba(124,58,237,.28),
        inset 0 1px rgba(255,255,255,.25);
    transition:.2s ease;
}

.botao:active{
    transform:scale(.97);
}

.botao:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.botao-retirar{
    display:none;
    background:
        linear-gradient(
            90deg,
            #059669,
            #10b981
        );
    box-shadow:
        0 8px 20px rgba(16,185,129,.25);
}

.botao-retirar.ativo{
    display:block;
}

/* INFO */

.info{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:12px;
}

.info-box{
    padding:10px 5px;
    text-align:center;
    border-radius:12px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.info-box small{
    display:block;
    color:#8f859a;
    font-size:9px;
    margin-bottom:3px;
}

.info-box strong{
    font-size:12px;
}

/* HISTÓRICO */

.historico{
    margin-top:14px;
}

.historico-titulo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.historico-titulo strong{
    font-size:13px;
}

.historico-titulo span{
    color:#85798e;
    font-size:10px;
}

.lista{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:3px;
    scrollbar-width:none;
}

.lista::-webkit-scrollbar{
    display:none;
}

.historico-item{
    flex:0 0 auto;
    min-width:61px;
    padding:8px 7px;
    border-radius:10px;
    text-align:center;
    font-size:11px;
    font-weight:bold;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

.historico-item.alto{
    color:#86efac;
    border-color:rgba(74,222,128,.22);
}

.historico-item.baixo{
    color:#fb7185;
    border-color:rgba(244,63,94,.2);
}

/* MENSAGEM */

.mensagem{
    min-height:18px;
    margin-top:10px;
    text-align:center;
    color:#aaa0b7;
    font-size:11px;
    font-weight:bold;
}

/* RESPONSIVO */

@media(max-width:380px){

    .container{
        padding-left:9px;
        padding-right:9px;
    }

    .titulo h1{
        font-size:30px;
    }

    .icone{
        font-size:50px;
    }

    .multiplicador{
        font-size:45px;
    }

    .arena{
        height:235px;
    }

    .monstro{
        font-size:105px;
    }

    .lua{
        width:75px;
        height:75px;
    }

    .lua::after{
        width:75px;
        height:75px;
    }
}

@media(min-width:700px){

    body{
        display:flex;
        justify-content:center;
    }

    .container{
        width:520px;
    }
}
</style>
</head>

<body>

<div class="fundo">

    <div class="nevoa nevoa1"></div>
    <div class="nevoa nevoa2"></div>

        <div class="estrela"></div>

<script>

/* =====================================================
   NIGHT MONSTERS
   JOGO COMPLETO
===================================================== */

let saldo = 1000;

let jogando = false;
let apostaAtual = 0;
let multiplicadorAtual = 1;
let multiplicadorFinal = 1;
let intervaloJogo = null;

const saldoElemento =
    document.getElementById("saldo");

const apostaElemento =
    document.getElementById("aposta");

const alvoElemento =
    document.getElementById("alvo");

const multiplicadorElemento =
    document.getElementById("multiplicador");

const botaoJogar =
    document.getElementById("botaoJogar");

const botaoRetirar =
    document.getElementById("botaoRetirar");

const arena =
    document.getElementById("arena");

const resultado =
    document.getElementById("resultado");

const resultadoTitulo =
    document.getElementById("resultadoTitulo");

const resultadoTexto =
    document.getElementById("resultadoTexto");

const infoAposta =
    document.getElementById("infoAposta");

const infoRetorno =
    document.getElementById("infoRetorno");

const infoStatus =
    document.getElementById("infoStatus");

const mensagem =
    document.getElementById("mensagem");

const historico =
    document.getElementById("historico");


/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}

function atualizarSaldo(){

    saldoElemento.textContent =
        dinheiro(saldo);

}


/* =====================================================
   HISTÓRICO
===================================================== */

const resultadosIniciais = [
    1.42,
    2.18,
    1.07,
    3.74,
    1.63,
    5.21
];

function criarHistorico(){

    historico.innerHTML = "";

    resultadosIniciais.forEach(
        function(valor){

            adicionarHistorico(valor);

        }
    );

}

function adicionarHistorico(valor){

    const item =
        document.createElement("div");

    item.className =
        "historico-item " +
        (valor >= 2 ? "alto" : "baixo");

    item.textContent =
        valor.toFixed(2) + "x";

    historico.prepend(item);

    while(
        historico.children.length > 8
    ){

        historico.removeChild(
            historico.lastElementChild
        );

    }

}


/* =====================================================
   GERADOR DO MULTIPLICADOR FINAL
===================================================== */

function gerarMultiplicadorFinal(){

    /*
        Distribuição simples para a demonstração:

        45% -> até 1.50x
        35% -> 1.50x até 3x
        15% -> 3x até 6x
        5%  -> acima de 6x
    */

    const sorteio =
        Math.random();

    let resultado;

    if(sorteio < 0.45){

        resultado =
            1 +
            Math.random() * 0.5;

    }else if(sorteio < 0.80){

        resultado =
            1.5 +
            Math.random() * 1.5;

    }else if(sorteio < 0.95){

        resultado =
            3 +
            Math.random() * 3;

    }else{

        resultado =
            6 +
            Math.random() * 9;

    }

    return Number(
        resultado.toFixed(2)
    );

}


/* =====================================================
   ATUALIZAR INTERFACE
===================================================== */

function atualizarInterface(){

    multiplicadorElemento.textContent =
        multiplicadorAtual.toFixed(2) + "x";

    infoAposta.textContent =
        dinheiro(apostaAtual);

    infoRetorno.textContent =
        dinheiro(
            apostaAtual *
            multiplicadorAtual
        );

}


/* =====================================================
   COMEÇAR JOGO
===================================================== */

function iniciarJogo(){

    if(jogando){
        return;
    }

    const aposta =
        Number(
            apostaElemento.value
        );

    const alvo =
        Number(
            alvoElemento.value
        );

    if(
        !Number.isFinite(aposta) ||
        aposta <= 0
    ){

        mensagem.textContent =
            "Digite um valor de aposta válido.";

        return;

    }

    if(aposta > saldo){

        mensagem.textContent =
            "Saldo insuficiente para essa aposta.";

        return;

    }

    if(
        !Number.isFinite(alvo) ||
        alvo < 1.01
    ){

        mensagem.textContent =
            "O multiplicador precisa ser maior que 1.00x.";

        return;

    }

    saldo -= aposta;

    atualizarSaldo();

    apostaAtual =
        aposta;

    multiplicadorAtual =
        1;

    multiplicadorFinal =
        gerarMultiplicadorFinal();

    jogando =
        true;

    resultado.classList.remove(
        "ativo"
    );

    arena.classList.add(
        "jogando"
    );

    multiplicadorElemento.className =
        "multiplicador roxo";

    infoStatus.textContent =
        "Jogando";

    mensagem.textContent =
        "A noite começou... retire antes do monstro atacar!";

    botaoJogar.disabled =
        true;

    botaoRetirar.classList.add(
        "ativo"
    );

    apostaElemento.disabled =
        true;

    alvoElemento.disabled =
        true;

    atualizarInterface();

    const inicio =
        Date.now();

    intervaloJogo =
        setInterval(
            function(){

                const tempo =
                    Date.now() - inicio;

                /*
                    Crescimento progressivo.
                */

                multiplicadorAtual =
                    1 +
                    (
                        tempo / 1000
                    ) * 0.38;

                multiplicadorAtual =
                    Number(
                        multiplicadorAtual.toFixed(2)
                    );

                if(
                    multiplicadorAtual >=
                    multiplicadorFinal
                ){

                    multiplicadorAtual =
                        multiplicadorFinal;

                    atualizarInterface();

                    finalizarPerda();

                    return;

                }

                atualizarInterface();

                const alvoAtual =
                    Number(
                        alvoElemento.value
                    );

                if(
                    multiplicadorAtual >=
                    alvoAtual &&
                    !botaoRetirar.dataset.aviso
                ){

                    botaoRetirar.dataset.aviso =
                        "1";

                    mensagem.textContent =
                        "🎯 Seu alvo foi alcançado! Você pode retirar agora.";

                }

            },
            100
        );

}


/* =====================================================
   RETIRAR
===================================================== */

function retirar(){

    if(!jogando){
        return;
    }

    const ganho =
        apostaAtual *
        multiplicadorAtual;

    saldo += ganho;

    atualizarSaldo();

    clearInterval(
        intervaloJogo
    );

    intervaloJogo =
        null;

    jogando =
        false;

    arena.classList.remove(
        "jogando"
    );

    multiplicadorElemento.className =
        "multiplicador verde";

    resultadoTitulo.textContent =
        "💰 VOCÊ GANHOU!";

    resultadoTexto.textContent =
        "Retorno de " +
        dinheiro(ganho) +
        " em " +
        multiplicadorAtual.toFixed(2) +
        "x.";

    resultado.classList.add(
        "ativo"
    );

    infoStatus.textContent =
        "Ganhou";

    mensagem.textContent =
        "Boa! O monstro não conseguiu pegar sua aposta.";

    adicionarHistorico(
        multiplicadorAtual
    );

    resetarControles();

}


/* =====================================================
   PERDEU
===================================================== */

function finalizarPerda(){

    if(!jogando){
        return;
    }

    clearInterval(
        intervaloJogo
    );

    intervaloJogo =
        null;

    jogando =
        false;

    arena.classList.remove(
        "jogando"
    );

    multiplicadorElemento.className =
        "multiplicador vermelho";

    resultadoTitulo.textContent =
        "💀 O MONSTRO PEGOU!";

    resultadoTexto.textContent =
        "A rodada terminou em " +
        multiplicadorFinal.toFixed(2) +
        "x.";

    resultado.classList.add(
        "ativo"
    );

    infoStatus.textContent =
        "Perdeu";

    mensagem.textContent =
        "A noite foi mais forte dessa vez.";

    adicionarHistorico(
        multiplicadorFinal
    );

    resetarControles();

}


/* =====================================================
   RESET
===================================================== */

function resetarControles(){

    botaoJogar.disabled =
        false;

    botaoRetirar.classList.remove(
        "ativo"
    );

    delete botaoRetirar.dataset.aviso;

    apostaElemento.disabled =
        false;

    alvoElemento.disabled =
        false;

    apostaAtual =
        0;

    infoAposta.textContent =
        dinheiro(0);

    infoRetorno.textContent =
        dinheiro(0);

}


/* =====================================================
   BOTÕES
===================================================== */

botaoJogar.addEventListener(
    "click",
    iniciarJogo
);

botaoRetirar.addEventListener(
    "click",
    retirar
);


/* =====================================================
   ATUALIZAÇÃO DOS CAMPOS
===================================================== */

apostaElemento.addEventListener(
    "input",
    function(){

        if(jogando){
            return;
        }

        const valor =
            Number(
                apostaElemento.value
            );

        infoAposta.textContent =
            dinheiro(
                Number.isFinite(valor)
                ? valor
                : 0
            );

        infoRetorno.textContent =
            dinheiro(
                Number.isFinite(valor)
                ? valor *
                  Number(alvoElemento.value || 1)
                : 0
            );

    }
);

alvoElemento.addEventListener(
    "input",
    function(){

        if(jogando){
            return;
        }

        const valor =
            Number(
                apostaElemento.value
            );

        const alvo =
            Number(
                alvoElemento.value
            );

        infoRetorno.textContent =
            dinheiro(
                Number.isFinite(valor) &&
                Number.isFinite(alvo)
                ? valor * alvo
                : 0
            );

    }
);


/* =====================================================
   FECHAR RESULTADO AO CLICAR
===================================================== */

resultado.addEventListener(
    "click",
    function(){

        resultado.classList.remove(
            "ativo"
        );

        multiplicadorElemento.className =
            "multiplicador";

        multiplicadorAtual =
            1;

        atualizarInterface();

        mensagem.textContent =
            "Escolha sua aposta e comece uma nova noite.";

        infoStatus.textContent =
            "Pronto";

    }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarSaldo();

criarHistorico();

atualizarInterface();

</script>

</body>
</html>
