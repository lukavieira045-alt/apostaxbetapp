<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mines - ApostaXBet</title>

<!-- SISTEMA DE SALDO REAL -->
<script type="module" src="../script.js"></script>

<style>

*{
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    color:white;
    background:#0a0a1a;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
    overflow-x:hidden;
    position:relative;
}

/* LUZES */

.luz{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.35;
    z-index:-1;
    pointer-events:none;
}

.luz1{
    background:#00ff88;
    left:-100px;
    top:-100px;
    animation:flutuar1 7s infinite alternate ease-in-out;
}

.luz2{
    background:#6a00ff;
    right:-100px;
    bottom:-100px;
    animation:flutuar2 7s infinite alternate ease-in-out;
}

@keyframes flutuar1{
    to{
        transform:translate(150px,150px);
    }
}

@keyframes flutuar2{
    to{
        transform:translate(-150px,-150px);
    }
}


/* PARTÍCULAS */

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    background:rgba(255,255,255,.6);
    border-radius:50%;
}

.particulas span:nth-child(1){
    left:10%;
    animation:subir 9s infinite linear;
}

.particulas span:nth-child(2){
    left:30%;
    animation:subir 11s infinite linear 1.5s;
}

.particulas span:nth-child(3){
    left:50%;
    animation:subir 8s infinite linear .5s;
}

.particulas span:nth-child(4){
    left:70%;
    animation:subir 10s infinite linear 2s;
}

.particulas span:nth-child(5){
    left:90%;
    animation:subir 12s infinite linear 3s;
}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}


/* TÍTULO */

h1{
    margin-top:20px;
    font-size:42px;
    color:#00ff88;
    text-shadow:
        0 0 20px rgba(0,255,136,.6);
    letter-spacing:2px;
}


/* SALDO */

#saldo{
    display:inline-block;
    font-size:20px;
    font-weight:bold;
    background:rgba(0,255,136,.08);
    padding:12px 30px;
    border-radius:40px;
    border:1px solid rgba(0,255,136,.4);
    margin:20px 0;
    backdrop-filter:blur(5px);
    transition:all .3s ease;
}


/* PAINEL */

.painel{
    width:92%;
    max-width:380px;
    margin:10px auto;
    background:rgba(255,255,255,.03);
    border-radius:24px;
    padding:25px 20px;
    text-align:center;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}


/* CRONÔMETRO */

#contador{
    min-height:34px;
    margin-bottom:8px;
    font-size:25px;
    font-weight:900;
    color:#00ff88;
    text-shadow:0 0 12px #00ff88;
}

#contador.alerta{
    color:#ff3333;
    text-shadow:
        0 0 10px #ff3333,
        0 0 25px #ff0000;
    animation:pulsarContador .5s infinite alternate;
}

@keyframes pulsarContador{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.12);
    }
}


/* PRÊMIO */

#premio{
    font-size:22px;
    margin-bottom:20px;
    min-height:28px;
    color:#ffd700;
    text-shadow:
        0 0 10px rgba(255,215,0,.3);
}


/* BOTÃO NOVO JOGO */

button#btnNovoJogo{
    background:
        linear-gradient(
            135deg,
            #00ff88,
            #00cc6a
        );

    color:#000;
    border:none;
    padding:16px 45px;
    font-size:18px;
    font-weight:800;
    border-radius:14px;
    cursor:pointer;
    transition:all .2s;
    box-shadow:
        0 0 20px rgba(0,255,136,.3);
    text-transform:uppercase;
    letter-spacing:1px;
}

button#btnNovoJogo:hover{
    transform:scale(1.03);
    box-shadow:
        0 0 30px rgba(0,255,136,.5);
}

button#btnNovoJogo:active{
    transform:scale(.98);
}

button#btnNovoJogo:disabled{
    background:#333;
    color:#666;
    cursor:not-allowed;
    box-shadow:none;
}


/* GRID */

#grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:25px auto;
    max-width:340px;
    width:90%;
}

.cell{
    aspect-ratio:1;
    background:
        linear-gradient(
            145deg,
            #20203a,
            #101020
        );

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    cursor:pointer;

    border:2px solid rgba(255,255,255,.08);

    transition:
        all .2s cubic-bezier(.4,0,.2,1);

    user-select:none;
    position:relative;
    overflow:hidden;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.6),
        0 5px 15px rgba(0,0,0,.25);
}

.cell::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.08),
            transparent 35%
        );
    pointer-events:none;
}

.cell:hover:not(.revealed):not(.bomb){
    background:#252545;
    border-color:rgba(0,255,136,.7);
    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 0 20px rgba(0,255,136,.15);
}

.cell.revealed{
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #55ffb0 20%,
            #00cc6a 65%,
            #008f4d
        );

    color:#000;
    border-color:#00ff88;

    box-shadow:
        0 0 20px rgba(0,255,136,.5),
        inset 0 0 15px rgba(255,255,255,.25);

    animation:
        revelar .35s ease forwards;
}

.cell.bomb{
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffaaaa,
            #ff3333 35%,
            #7a0000 80%
        );

    color:#fff;
    border-color:#ff3333;

    box-shadow:
        0 0 20px rgba(255,51,51,.6),
        0 0 40px rgba(255,0,0,.35);

    animation:
        explosao .5s ease;
}

.cell.abrindo{
    animation:
        pulsar .6s infinite;
}

.cell.bomba-ultima{
    animation:
        explosaoForte .7s ease;
}

@keyframes revelar{
    0%{
        transform:scale(.7) rotate(-8deg);
        opacity:0;
    }

    70%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes explosao{
    0%{
        transform:scale(.5);
        opacity:.2;
    }

    45%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes explosaoForte{
    0%{
        transform:scale(.7);
        filter:brightness(1);
    }

    40%{
        transform:scale(1.2);
        filter:brightness(2);
    }

    70%{
        transform:translateX(-5px) scale(1.05);
    }

    100%{
        transform:translateX(0) scale(1);
        filter:brightness(1);
    }
}

@keyframes pulsar{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.92);
        opacity:.7;
    }
}


/* OVERLAY */

.resultado-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.85);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transition:opacity .3s;

    z-index:100;

    backdrop-filter:blur(8px);
}

.resultado-overlay.mostrar{
    opacity:1;
    pointer-events:all;
}


/* RESULTADO */

.resultado-box{
    background:#16162a;
    padding:35px;
    border-radius:24px;
    text-align:center;

    border:2px solid #00ff88;

    box-shadow:
        0 0 40px rgba(0,255,136,.2);

    max-width:85%;

    animation:
        popIn .3s
        cubic-bezier(.175,.885,.32,1.275);
}

@keyframes popIn{
    0%{
        transform:scale(.8);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.resultado-icon{
    font-size:64px;
    margin-bottom:15px;
}

.resultado-text{
    font-size:24px;
    margin-bottom:25px;
    font-weight:bold;
}

.btn-fechar{
    background:transparent;
    border:2px solid #00ff88;
    color:#00ff88;
    padding:12px 35px;
    font-size:16px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    font-weight:bold;
}

.btn-fechar:hover{
    background:#00ff88;
    color:#000;
}


/* CELULAR */

@media(max-width:450px){

    h1{
        font-size:34px;
    }

    #grid{
        gap:12px;
    }

    .cell{
        border-radius:14px;
        font-size:30px;
    }

    #contador{
        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<h1>💣 MINES</h1>

<!-- IMPORTANTE:
     A classe "saldo" faz o SistemaSaldo atualizar
     este elemento também.
-->
<div id="saldo" class="saldo">
    💰 Saldo: R$ 0,00
</div>

<div class="painel">

    <div id="contador">
        ⏱️ AGUARDANDO...
    </div>

    <div id="premio">
        💎 Encontre os diamantes
    </div>

    <button
        id="btnNovoJogo"
        disabled
    >
        CARREGANDO SALDO...
    </button>

</div>

<div id="grid"></div>


<!-- RESULTADO -->

<div
    class="resultado-overlay"
    id="resultadoTela"
>

    <div class="resultado-box">

        <div
            class="resultado-icon"
            id="resultadoIcone"
        ></div>

        <div
            class="resultado-text"
            id="resultadoTexto"
        >
        </div>

        <button
            class="btn-fechar"
            onclick="fecharResultado()"
        >
            JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script>

/*
====================================================
CONFIGURAÇÃO
====================================================
*/

const VALOR_APOSTA = 1.00;

const PREMIO_DIAMANTE = 0.50;

const TEMPO_RODADA = 10;

const QUANTIDADE_BOMBAS = 3;

const TOTAL_CASAS = 9;


/*
====================================================
ELEMENTOS
====================================================
*/

const grid =
document.getElementById("grid");

const premio =
document.getElementById("premio");

const displaySaldo =
document.getElementById("saldo");

const contador =
document.getElementById("contador");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");

const btnNovoJogo =
document.getElementById("btnNovoJogo");


/*
====================================================
ESTADO
====================================================
*/

let bombas = [];

let jogando = false;

let tempoRestante = 0;

let intervalo = null;

let saldoAtual = 0;

let finalizando = false;


/*
====================================================
MOSTRAR SALDO
====================================================
*/

function mostrarSaldo(valor){

    saldoAtual =
        Number(valor) || 0;

    displaySaldo.textContent =
        "💰 Saldo: R$ " +
        saldoAtual
        .toFixed(2)
        .replace(".",",");

}


/*
====================================================
ESPERAR SISTEMA DE SALDO
====================================================
*/

function esperarSistemaSaldo(){

    return new Promise(
        function(resolve){

            if(window.SistemaSaldo){

                resolve(
                    window.SistemaSaldo
                );

                return;

            }

            let tentativas = 0;

            const espera =
            setInterval(
                function(){

                    tentativas++;

                    if(window.SistemaSaldo){

                        clearInterval(
                            espera
                        );

                        resolve(
                            window.SistemaSaldo
                        );

                        return;

                    }

                    if(tentativas >= 100){

                        clearInterval(
                            espera
                        );

                        resolve(null);

                    }

                },
                100
            );

        }
    );

}


/*
====================================================
CARREGAR SALDO REAL
====================================================
*/

async function carregarSaldoReal(){

    const sistema =
        await esperarSistemaSaldo();

    if(!sistema){

        btnNovoJogo.disabled =
            true;

        btnNovoJogo.textContent =
            "ERRO NO SALDO";

        premio.textContent =
            "❌ Sistema de saldo indisponível.";

        return false;

    }

    try{

        const valorReal =
            await sistema.get();

        mostrarSaldo(
            valorReal
        );

        await sistema.atualizarTela();

        /*
        Busca novamente depois da
        atualização para garantir
        que a tela use o valor real.
        */

        const valorConfirmado =
            await sistema.get();

        mostrarSaldo(
            valorConfirmado
        );

        btnNovoJogo.disabled =
            false;

        btnNovoJogo.textContent =
            "NOVO JOGO";

        return true;

    }catch(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        btnNovoJogo.disabled =
            true;

        btnNovoJogo.textContent =
            "ERRO NO SALDO";

        premio.textContent =
            "❌ Não foi possível carregar o saldo.";

        return false;

    }

}


/*
====================================================
ATUALIZAR SALDO REAL
====================================================
*/

async function atualizarSaldoReal(){

    if(!window.SistemaSaldo)
        return false;

    try{

        const valorReal =
            await window.SistemaSaldo.get();

        mostrarSaldo(
            valorReal
        );

        return true;

    }catch(error){

        console.error(error);

        return false;

    }

}


/*
====================================================
DEBITAR APOSTA
====================================================
*/

async function debitarAposta(){

    if(!window.SistemaSaldo){

        alert(
            "❌ Sistema de saldo indisponível."
        );

        return false;

    }

    try{

        /*
        O próprio SistemaSaldo verifica
        o saldo e salva no Supabase.
        */

        const sucesso =
            await window.SistemaSaldo
            .debitar(
                VALOR_APOSTA
            );

        if(!sucesso){

            await atualizarSaldoReal();

            return false;

        }

        await atualizarSaldoReal();

        return true;

    }catch(error){

        console.error(
            "Erro ao debitar aposta:",
            error
        );

        await atualizarSaldoReal();

        return false;

    }

}


/*
====================================================
CRIAR TABULEIRO
====================================================
*/

function criarTabuleiro(){

    grid.innerHTML = "";

    for(
        let i=0;
        i<TOTAL_CASAS;
        i++
    ){

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        cell.textContent =
            "?";

        cell.dataset.index =
            i;

        cell.onclick =
            function(){

                abrirCasa(
                    cell,
                    i
                );

            };

        grid.appendChild(
            cell
        );

    }

}


/*
====================================================
CRIAR BOMBAS
====================================================
*/

function criarBombas(){

    bombas = [];

    while(
        bombas.length <
        QUANTIDADE_BOMBAS
    ){

        const posicao =
            Math.floor(
                Math.random() *
                TOTAL_CASAS
            );

        if(
            !bombas.includes(
                posicao
            )
        ){

            bombas.push(
                posicao
            );

        }

    }

}


/*
====================================================
INICIAR CONTAGEM
====================================================
*/

function iniciarContagem(){

    clearInterval(
        intervalo
    );

    tempoRestante =
        TEMPO_RODADA;

    atualizarContador();

    intervalo =
        setInterval(
            function(){

                if(!jogando){

                    clearInterval(
                        intervalo
                    );

                    return;

                }

                tempoRestante--;

                atualizarContador();

                /*
                Quando chegar a zero,
                encerra automaticamente.
                */

                if(
                    tempoRestante <= 0
                ){

                    clearInterval(
                        intervalo
                    );

                    tempoEsgotado();

                }

            },
            1000
        );

}


/*
====================================================
ATUALIZAR CONTADOR
====================================================
*/

function atualizarContador(){

    if(
        tempoRestante <= 3 &&
        tempoRestante > 0
    ){

        contador.classList.add(
            "alerta"
        );

    }else{

        contador.classList.remove(
            "alerta"
        );

    }

    if(
        tempoRestante > 0
    ){

        contador.textContent =
            "⏱️ " +
            tempoRestante +
            "s";

    }else{

        contador.textContent =
            "⏱️ TEMPO ESGOTADO";

    }

}


/*
====================================================
INICIAR JOGO
====================================================
*/

async function iniciarJogo(){

    if(jogando){

        return;

    }

    if(finalizando){

        return;

    }

    /*
    Garante que estamos usando
    o saldo real.
    */

    const saldoAntes =
        await atualizarSaldoReal();

    if(!saldoAntes){

        alert(
            "❌ Não foi possível verificar seu saldo."
        );

        return;

    }

    if(
        saldoAtual <
        VALOR_APOSTA
    ){

        alert(
            "❌ Saldo insuficiente!\n\n" +
            "Aposta: R$ " +
            VALOR_APOSTA
            .toFixed(2)
            .replace(".",",") +
            "\n" +
            "Saldo: R$ " +
            saldoAtual
            .toFixed(2)
            .replace(".",",")
        );

        return;

    }


    /*
    DEBITA DO SUPABASE
    */

    btnNovoJogo.disabled =
        true;

    btnNovoJogo.textContent =
        "PREPARANDO...";

    const debitou =
        await debitarAposta();

    if(!debitou){

        btnNovoJogo.disabled =
            false;

        btnNovoJogo.textContent =
            "NOVO JOGO";

        return;

    }


    /*
    NOVA RODADA
    */

    jogando = true;

    finalizando = false;

    criarBombas();

    criarTabuleiro();

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.textContent =
        "💎 Encontre os diamantes!";

    btnNovoJogo.disabled =
        true;

    btnNovoJogo.textContent =
        "JOGANDO...";

    /*
    COMEÇA OS 10 SEGUNDOS
    */

    iniciarContagem();

}


/*
====================================================
ABRIR CASA
====================================================
*/

function abrirCasa(
    cell,
    indice
){

    if(!jogando)
        return;

    if(!cell)
        return;

    if(
        cell.classList.contains(
            "revealed"
        )
    ){

        return;

    }

    if(
        cell.classList.contains(
            "bomb"
        )
    ){

        return;

    }


    /*
    Efeito de abertura
    */

    cell.classList.add(
        "abrindo"
    );


    setTimeout(
        async function(){

            if(!jogando)
                return;

            cell.classList.remove(
                "abrindo"
            );


            /*
            BOMBA
            */

            if(
                bombas.includes(
                    indice
                )
            ){

                cell.classList.add(
                    "bomb"
                );

                cell.classList.add(
                    "bomba-ultima"
                );

                cell.textContent =
                    "💣";

                await perderJogo(
                    "💥 BOOM!"
                );

                return;

            }


            /*
            DIAMANTE
            */

            cell.classList.add(
                "revealed"
            );

            cell.textContent =
                "💎";


            /*
            CADA DIAMANTE PAGA
            R$ 0,50 NO SALDO REAL
            */

            if(
                window.SistemaSaldo
            ){

                try{

                    await window.SistemaSaldo
                    .creditar(
                        PREMIO_DIAMANTE
                    );

                    await atualizarSaldoReal();

                }catch(error){

                    console.error(
                        "Erro ao creditar prêmio:",
                        error
                    );

                }

            }


            premio.textContent =
                "💎 + R$ " +
                PREMIO_DIAMANTE
                .toFixed(2)
                .replace(".",",");


            /*
            VERIFICA QUANTAS
            CASAS SEGURAS FORAM ABERTAS
            */

            const abertas =
                document
                .querySelectorAll(
                    ".cell.revealed"
                )
                .length;


            /*
            Existem 9 casas e
            3 bombas = 6 diamantes.

            Se abriu os 6,
            venceu automaticamente.
            */

            if(
                abertas >=
                TOTAL_CASAS -
                QUANTIDADE_BOMBAS
            ){

                await vencerJogo();

            }

        },
        180
    );

}


/*
====================================================
TEMPO ESGOTADO
====================================================
*/

async function tempoEsgotado(){

    if(!jogando)
        return;

    jogando = false;

    finalizando = true;

    clearInterval(
        intervalo
    );

    contador.classList.remove(
        "alerta"
    );

    contador.textContent =
        "⏰ TEMPO ESGOTADO!";

    premio.textContent =
        "💥 Você demorou demais!";


    /*
    MOSTRA TODAS AS BOMBAS
    */

    await revelarTodasBombas();


    setTimeout(
        function(){

            resultadoIcone.textContent =
                "⏰";

            resultadoTexto.textContent =
                "Tempo esgotado!";

            resultadoTela.classList.add(
                "mostrar"
            );

            finalizando = false;

            btnNovoJogo.disabled =
                false;

            btnNovoJogo.textContent =
                "NOVO JOGO";

        },
        800
    );

}


/*
====================================================
PERDEU
====================================================
*/

async function perderJogo(
    texto
){

    if(!jogando)
        return;

    jogando = false;

    finalizando = true;

    clearInterval(
        intervalo
    );

    contador.classList.remove(
        "alerta"
    );

    contador.textContent =
        "💥 FIM DA RODADA";

    premio.textContent =
        texto;


    /*
    TODAS AS BOMBAS EXPLODEM
    */

    await revelarTodasBombas();


    setTimeout(
        function(){

            resultadoIcone.textContent =
                "💣";

            resultadoTexto.textContent =
                "Você perdeu!";

            resultadoTela.classList.add(
                "mostrar"
            );

            finalizando = false;

            btnNovoJogo.disabled =
                false;

            btnNovoJogo.textContent =
                "NOVO JOGO";

        },
        900
    );

}


/*
====================================================
REVELAR TODAS AS BOMBAS
====================================================
*/

function revelarTodasBombas(){

    return new Promise(
        function(resolve){

            const cells =
                document.querySelectorAll(
                    ".cell"
                );

            let atrasos = 0;

            bombas.forEach(
                function(
                    indice,
                    ordem
                ){

                    const cell =
                        cells[indice];

                    if(!cell)
                        return;

                    atrasos++;

                    setTimeout(
                        function(){

                            cell.classList.remove(
                                "abrindo"
                            );

                            cell.classList.add(
                                "bomb"
                            );

                            cell.classList.add(
                                "bomba-ultima"
                            );

                            cell.textContent =
                                "💣";

                            if(
                                ordem ===
                                bombas.length - 1
                            ){

                                setTimeout(
                                    resolve,
                                    350
                                );

                            }

                        },
                        180 +
                        ordem * 180
                    );

                }
            );

            if(
                atrasos === 0
            ){

                resolve();

            }

        }
    );

}
