<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - ApostaXBet</title>
    
    <!-- Carrega o sistema de saldo principal -->
    <script type="module" src="../script.js"></script>

    <style>
        /* CSS ORIGINAL MANTIDO INTACTO */
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { min-height: 100vh; color: white; background: #0a0a1a; display: flex; flex-direction: column; align-items: center; padding-top: 30px; overflow-x: hidden; position: relative; }
        .luz { position: fixed; width: 300px; height: 300px; border-radius: 50%; filter: blur(120px); opacity: 0.35; z-index: -1; pointer-events: none; }
        .luz1 { background: #00ff88; left: -100px; top: -100px; animation: flutuar1 7s infinite alternate ease-in-out; }
        .luz2 { background: #6a00ff; right: -100px; bottom: -100px; animation: flutuar2 7s infinite alternate ease-in-out; }
        @keyframes flutuar1 { to { transform: translate(150px, 150px); } }
        @keyframes flutuar2 { to { transform: translate(-150px, -150px); } }
        .particulas { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
        .particulas span { position: absolute; bottom: -20px; width: 4px; height: 4px; background: rgba(255,255,255,0.6); border-radius: 50%; }
        .particulas span:nth-child(1){left:10%;animation:subir 9s infinite linear;}
        .particulas span:nth-child(2){left:30%;animation:subir 11s infinite linear 1.5s;}
        .particulas span:nth-child(3){left:50%;animation:subir 8s infinite linear 0.5s;}
        .particulas span:nth-child(4){left:70%;animation:subir 10s infinite linear 2s;}
        .particulas span:nth-child(5){left:90%;animation:subir 12s infinite linear 3s;}
        @keyframes subir { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
        h1 { margin-top: 20px; font-size: 42px; color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.6); letter-spacing: 2px; }
        #saldo { display: inline-block; font-size: 20px; font-weight: bold; background: rgba(0,255,136,0.08); padding: 12px 30px; border-radius: 40px; border: 1px solid rgba(0,255,136,0.4); margin: 20px 0; backdrop-filter: blur(5px); transition: all 0.3s ease; }
        .painel { width: 92%; max-width: 380px; margin: 10px auto; background: rgba(255,255,255,0.03); border-radius: 24px; padding: 25px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #premio { font-size: 22px; margin-bottom: 20px; min-height: 28px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        button#btnNovoJogo { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; border: none; padding: 16px 45px; font-size: 18px; font-weight: 800; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 20px rgba(0,255,136,0.3); text-transform: uppercase; letter-spacing: 1px; }
        button#btnNovoJogo:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(0,255,136,0.5); }
        button#btnNovoJogo:active { transform: scale(0.98); }
        button#btnNovoJogo:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
        #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 25px auto; max-width: 340px; width: 90%; }
        .cell { aspect-ratio: 1; background: #16162a; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; border: 2px solid rgba(255,255,255,0.08); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; position: relative; overflow: hidden; }
        .cell:hover:not(.revealed):not(.bomb) { background: #1e1e38; border-color: rgba(0,255,136,0.5); transform: translateY(-2px); }
        .cell.revealed { background: #00ff88; color: #000; border-color: #00ff88; box-shadow: 0 0 20px rgba(0,255,136,0.4); animation: revelar 0.3s ease forwards; }
        .cell.bomb { background: #ff3333; color: #fff; border-color: #ff3333; box-shadow: 0 0 20px rgba(255,51,51,0.4); animation: tremer 0.4s ease; }
        .cell.abrindo { animation: pulsar 0.6s infinite; }
        @keyframes revelar { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes tremer { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes pulsar { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: 0.7; } }
        .resultado-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; backdrop-filter: blur(8px); }
        .resultado-overlay.mostrar { opacity: 1; pointer-events: all; }
        .resultado-box { background: #16162a; padding: 35px; border-radius: 24px; text-align: center; border: 2px solid #00ff88; box-shadow: 0 0 40px rgba(0,255,136,0.2); max-width: 85%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .resultado-icon { font-size: 64px; margin-bottom: 15px; }
        .resultado-text { font-size: 24px; margin-bottom: 25px; font-weight: bold; }
        .btn-fechar { background: transparent; border: 2px solid #00ff88; color: #00ff88; padding: 12px 35px; font-size: 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-fechar:hover { background: #00ff88; color: #000; }
    </style>
</head>
<body>
    <div class="luz luz1"></div>
    <div class="luz luz2"></div>
    <div class="particulas"><span></span><span></span><span></span><span></span><span></span></div>

    <h1>💣 MINES</h1>
    <div id="saldo">💰 Saldo: R$ 0,00</div>

    <div class="painel">
        <div id="premio">💎 Encontre os diamantes</div>
        <button id="btnNovoJogo">NOVO JOGO</button>
    </div>

    <div id="grid"></div>

    <div class="resultado-overlay" id="resultadoTela">
        <div class="resultado-box">
            <div class="resultado-icon" id="resultadoIcone"></div>
            <div class="resultado-text" id="resultadoTexto">Parabéns!</div>
            <button class="btn-fechar" onclick="fecharResultado()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <!-- LÓGICA DE SINCRONIZAÇÃO AGRESSIVA -->
    <script>
        let bombas = [];
        let jogando = false;
        const VALOR_APOSTA = 1.00;
        const PREMIO_DIAMANTE = 0.50;
        let syncTimer = null;

        const grid = document.getElementById("grid");
        const premio = document.getElementById("premio");
        const displaySaldoLocal = document.getElementById("saldo");
        const resultadoTela = document.getElementById("resultadoTela");
        const resultadoIcone = document.getElementById("resultadoIcone");
        const resultadoTexto = document.getElementById("resultadoTexto");
        const btnNovoJogo = document.getElementById("btnNovoJogo");

        function atualizarDisplaySaldo(valor) {
            if (displaySaldoLocal && typeof valor === 'number' && !isNaN(valor)) {
                displaySaldoLocal.textContent = `💰 Saldo: R$ ${valor.toFixed(2)}`;
                console.log(`[Mines] Saldo exibido: R$ ${valor.toFixed(2)}`);
            }
        }

        // Loop agressivo: tenta buscar saldo a cada 300ms até conseguir um valor > 0
        function iniciarSincronizacaoAgressiva() {
            if (syncTimer) clearInterval(syncTimer);
            
            syncTimer = setInterval(async () => {
                if (!window.SistemaSaldo) return;
                
                try {
                    const saldoReal = await window.SistemaSaldo.get();
                    
                    // Só atualiza se for um número válido E maior que 0
                    // Isso evita exibir "R$ 0,00" enquanto o sistema ainda está carregando
                    if (typeof saldoReal === 'number' && !isNaN(saldoReal) && saldoReal > 0) {
                        atualizarDisplaySaldo(saldoReal);
                        console.log(`[Mines] ✅ Sincronizado com sucesso: R$ ${saldoReal.toFixed(2)}`);
                        
                        // Para o loop após primeira sincronização bem-sucedida
                        // Mas mantém rodando em segundo plano para atualizações futuras
                        clearInterval(syncTimer);
                        
                        // Reinicia loop mais lento para manter sincronia contínua
                        syncTimer = setInterval(async () => {
                            if (window.SistemaSaldo) {
                                const s = await window.SistemaSaldo.get();
                                if (typeof s === 'number' && !isNaN(s)) {
                                    atualizarDisplaySaldo(s);
                                }
                            }
                        }, 2000); // Atualiza a cada 2s após sincronização inicial
                    }
                } catch (e) {
                    console.warn("[Mines] Aguardando sistema...", e.message);
                }
            }, 300); // Tenta a cada 300ms
        }

        async function iniciarJogo() {
            if (jogando) return alert("⚠️ Termine o jogo atual primeiro!");
            if (!window.SistemaSaldo) return alert(" Sistema carregando... aguarde.");

            try {
                // Busca SALDO REAL antes de debitar
                let saldoReal = await window.SistemaSaldo.get();
                
                if (saldoReal < VALOR_APOSTA) {
                    return alert(`❌ Saldo insuficiente! Precisa de R$ ${VALOR_APOSTA.toFixed(2)} e tem R$ ${saldoReal.toFixed(2)}`);
                }

                await window.SistemaSaldo.debitar(VALOR_APOSTA);
                
                // Atualiza display local IMEDIATAMENTE após débito
                let novoSaldo = saldoReal - VALOR_APOSTA;
                atualizarDisplaySaldo(novoSaldo);
                window.SistemaSaldo.atualizarTela();

                jogando = true;
                bombas = [];
                grid.innerHTML = "";
                premio.textContent = "💎 Encontre os diamantes";
                resultadoTela.classList.remove("mostrar");

                while (bombas.length < 3) {
                    let p = Math.floor(Math.random() * 9);
                    if (!bombas.includes(p)) bombas.push(p);
                }

                for (let i = 0; i < 9; i++) {
                    let cell = document.createElement("div");
                    cell.className = "cell";
                    cell.innerText = "?";
                    cell.onclick = () => abrirCasa(cell, i);
                    grid.appendChild(cell);
                }

            } catch (erro) {
                console.error("Erro ao iniciar:", erro);
                jogando = false;
            }
        }

        async function abrirCasa(cell, indice) {
            if (!jogando || !cell || cell.classList.contains("revealed") || cell.classList.contains("bomb")) return;

            cell.classList.add("abrindo");

            setTimeout(async () => {
                if (bombas.includes(indice)) {
                    cell.classList.remove("abrindo");
                    cell.classList.add("bomb");
                    cell.innerText = "💣";
                    revelarBombas();
                    jogando = false;
                    premio.textContent = "💥 BOOM!";
                    
                    setTimeout(() => {
                        resultadoIcone.textContent = "💣";
                        resultadoTexto.textContent = "Você perdeu!";
                        resultadoTela.classList.add("mostrar");
                    }, 600);
                    return;
                }

                cell.classList.remove("abrindo");
                cell.classList.add("revealed");
                cell.innerText = "💎";

                try {
                    await window.SistemaSaldo.ganhar(PREMIO_DIAMANTE, 1);
                    
                    // Força nova leitura do saldo real após ganhar
                    let saldoAtualizado = await window.SistemaSaldo.get();
                    atualizarDisplaySaldo(saldoAtualizado);
                    window.SistemaSaldo.atualizarTela();
                    
                    premio.textContent = `💎 + R$ ${PREMIO_DIAMANTE.toFixed(2)}`;

                    const abertas = document.querySelectorAll(".revealed").length;
                    if (abertas >= 6) {
                        jogando = false;
                        premio.textContent = "🏆 Vitória Máxima!";
                        setTimeout(() => {
                            resultadoIcone.textContent = "🏆";
                            resultadoTexto.textContent = "Lucro total!";
                            resultadoTela.classList.add("mostrar");
                        }, 600);
                    }
                } catch (erro) {
                    console.error("Erro no diamante:", erro);
                }
            }, 180);
        }

        function revelarBombas() {
            const cells = document.querySelectorAll(".cell");
            bombas.forEach((idx) => {
                if (!cells[idx]) return;
                setTimeout(() => {
                    if (!cells[idx].classList.contains("bomb")) {
                        cells[idx].classList.add("bomb");
                        cells[idx].innerText = "💣";
                    }
                }, 150 + idx * 80);
            });
        }

        function fecharResultado() {
            resultadoTela.classList.remove("mostrar");
        }

        // INICIALIZAÇÃO COM SINCRONIZAÇÃO AGRESSIVA
        window.addEventListener('DOMContentLoaded', () => {
            console.log(" Mines carregado. Iniciando sincronização agressiva...");
            
            // Inicia loop imediato
            iniciarSincronizacaoAgressiva();

            // Conecta botão
            if (btnNovoJogo) {
                btnNovoJogo.onclick = iniciarJogo;
                console.log("✅ Botão conectado!");
            }
        });
    </script>
</body>
</html>
