<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - ApostaXBet</title>
    
    <!-- Carrega o sistema de saldo principal -->
    <script type="module" src="../script.js"></script>

    <style>
        /* CSS ORIGINAL MANTIDO INTACTO */
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            margin: 0; min-height: 100vh; color: white; 
            background: #0a0a1a; display: flex; flex-direction: column; 
            align-items: center; padding-top: 20px; 
        }
        
        .luz { position: fixed; width: 280px; height: 280px; border-radius: 50%; filter: blur(100px); opacity: 0.4; z-index: -1; }
        .luz1 { background: #00ff88; left: -120px; top: -120px; animation: luz1 6s infinite alternate; }
        .luz2 { background: #6a00ff; right: -120px; bottom: -120px; animation: luz2 6s infinite alternate; }
        @keyframes luz1 { to { transform: translate(170px, 170px); } }
        @keyframes luz2 { to { transform: translate(-170px, -170px); } }

        .particulas { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
        .particulas span { position: absolute; bottom: -20px; width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%; }
        .particulas span:nth-child(1){left:5%;animation:subir 8s infinite linear;}
        .particulas span:nth-child(2){left:25%;animation:subir 10s infinite linear 1s;}
        .particulas span:nth-child(3){left:50%;animation:subir 7s infinite linear 2s;}
        .particulas span:nth-child(4){left:75%;animation:subir 9s infinite linear 0.5s;}
        .particulas span:nth-child(5){left:90%;animation:subir 11s infinite linear 3s;}
        @keyframes subir { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }

        h1 { margin-top: 25px; font-size: 40px; color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        #saldo { display: inline-block; font-size: 22px; background: rgba(0,255,136,0.1); padding: 10px 25px; border-radius: 30px; border: 1px solid #00ff88; margin-bottom: 20px; }
        .painel { width: 95%; max-width: 390px; margin: 10px auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        
        button { background: #00ff88; color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0,255,136,0.4); }
        button:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,136,0.6); }
        button:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px auto; max-width: 320px; }
        .cell { aspect-ratio: 1; background: #1a1a2e; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); transition: 0.2s; user-select: none; }
        .cell:hover:not(.revealed):not(.bomb) { background: #252540; border-color: #00ff88; }
        .cell.revealed { background: #00ff88; color: #000; border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.5); }
        .cell.bomb { background: #ff3333; color: #fff; border-color: #ff3333; box-shadow: 0 0 15px rgba(255,51,51,0.5); }
        .cell.abrindo { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.95); } }

        #premio { font-size: 24px; margin: 15px 0; min-height: 30px; }
        
        .resultado-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; }
        .resultado-overlay.mostrar { opacity: 1; pointer-events: all; }
        .resultado-box { background: #1a1a2e; padding: 30px; border-radius: 20px; text-align: center; border: 2px solid #00ff88; box-shadow: 0 0 30px rgba(0,255,136,0.3); max-width: 90%; }
        .resultado-icon { font-size: 60px; margin-bottom: 15px; }
        .resultado-text { font-size: 22px; margin-bottom: 20px; }
        .btn-fechar { background: transparent; border: 2px solid #00ff88; color: #00ff88; padding: 10px 30px; font-size: 16px; }
        .btn-fechar:hover { background: #00ff88; color: #000; }
    </style>
</head>
<body>
    <div class="luz luz1"></div>
    <div class="luz luz2"></div>
    <div class="particulas"><span></span><span></span><span></span><span></span><span></span></div>

    <h1>💣 MINES</h1>
    <div id="saldo">💰 Saldo: R$ 0,00</div>

    <div class="painel">
        <div id="premio">💎 Encontre os diamantes</div>
        <button id="btnNovoJogo">NOVO JOGO</button>
    </div>

    <div id="grid"></div>

    <div class="resultado-overlay" id="resultadoTela">
        <div class="resultado-box">
            <div class="resultado-icon" id="resultadoIcone"></div>
            <div class="resultado-text" id="resultadoTexto">Parabéns!</div>
            <button class="btn-fechar" onclick="fecharResultado()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <!-- SCRIPT NORMAL (SEM MODULE) PARA GARANTIR FUNCIONAMENTO DO BOTÃO -->
    <script>
        let bombas = [];
        let jogando = false;
        const VALOR_APOSTA = 1.00;
        const PREMIO_DIAMANTE = 0.50;

        // Captura elementos DOM originais
        const grid = document.getElementById("grid");
        const premio = document.getElementById("premio");
        const displaySaldoLocal = document.getElementById("saldo");
        const resultadoTela = document.getElementById("resultadoTela");
        const resultadoIcone = document.getElementById("resultadoIcone");
        const resultadoTexto = document.getElementById("resultadoTexto");
        const btnNovoJogo = document.getElementById("btnNovoJogo");

        function atualizarDisplaySaldo(valor) {
            if (displaySaldoLocal) {
                displaySaldoLocal.textContent = `💰 Saldo: R$ ${valor.toFixed(2)}`;
            }
        }

        async function iniciarJogo() {
            console.log("🎮 Iniciando Mines...");
            
            if (jogando) return alert("⚠️ Termine o jogo atual primeiro!");
            if (!window.SistemaSaldo) return alert("⏳ Sistema carregando... aguarde.");

            try {
                let saldo = await window.SistemaSaldo.get();
                if (saldo < VALOR_APOSTA) {
                    return alert(`❌ Saldo insuficiente! Precisa de R$ ${VALOR_APOSTA.toFixed(2)}`);
                }

                // Debita aposta e atualiza saldo local
                await window.SistemaSaldo.debitar(VALOR_APOSTA);
                saldo -= VALOR_APOSTA;
                atualizarDisplaySaldo(saldo);
                window.SistemaSaldo.atualizarTela();

                // Reseta estado do jogo
                jogando = true;
                bombas = [];
                grid.innerHTML = "";
                premio.textContent = "💎 Encontre os diamantes";
                resultadoTela.classList.remove("mostrar");

                // Gera 3 bombas aleatórias
                while (bombas.length < 3) {
                    let p = Math.floor(Math.random() * 9);
                    if (!bombas.includes(p)) bombas.push(p);
                }

                // Cria grid 3x3 com classes CSS originais
                for (let i = 0; i < 9; i++) {
                    let cell = document.createElement("div");
                    cell.className = "cell";
                    cell.innerText = "?";
                    cell.onclick = () => abrirCasa(cell, i);
                    grid.appendChild(cell);
                }
                
                console.log("✅ Jogo iniciado! Bombas:", bombas);

            } catch (erro) {
                console.error("Erro ao iniciar:", erro);
                jogando = false;
            }
        }

        async function abrirCasa(cell, indice) {
            if (!jogando || cell.classList.contains("revealed") || cell.classList.contains("bomb")) return;

            cell.classList.add("abrindo");

            setTimeout(async () => {
                if (bombas.includes(indice)) {
                    // BOMBA
                    cell.classList.remove("abrindo");
                    cell.classList.add("bomb");
                    cell.innerText = "💣";
                    revelarBombas();
                    jogando = false;
                    premio.textContent = " BOOM!";
                    
                    setTimeout(() => {
                        resultadoIcone.textContent = "💣";
                        resultadoTexto.textContent = "Você perdeu!";
                        resultadoTela.classList.add("mostrar");
                    }, 500);
                    return;
                }

                // DIAMANTE
                cell.classList.remove("abrindo");
                cell.classList.add("revealed");
                cell.innerText = "";

                try {
                    // Credita prêmio e atualiza saldo
                    await window.SistemaSaldo.ganhar(PREMIO_DIAMANTE, 1);
                    let novoSaldo = await window.SistemaSaldo.get();
                    atualizarDisplaySaldo(novoSaldo);
                    window.SistemaSaldo.atualizarTela();
                    premio.textContent = `💎 + R$ ${PREMIO_DIAMANTE.toFixed(2)}`;

                    // Verifica vitória máxima (6 diamantes)
                    const abertas = document.querySelectorAll(".revealed").length;
                    if (abertas >= 6) {
                        jogando = false;
                        premio.textContent = " Vitória Máxima!";
                        setTimeout(() => {
                            resultadoIcone.textContent = "🏆";
                            resultadoTexto.textContent = "Lucro total!";
                            resultadoTela.classList.add("mostrar");
                        }, 500);
                    }
                } catch (erro) {
                    console.error("Erro no diamante:", erro);
                }
            }, 180);
        }

        function revelarBombas() {
            const cells = document.querySelectorAll(".cell");
            bombas.forEach((idx) => {
                if (!cells[idx]) return;
                setTimeout(() => {
                    if (!cells[idx].classList.contains("bomb")) {
                        cells[idx].classList.add("bomb");
                        cells[idx].innerText = "";
                    }
                }, 150 + idx * 80);
            });
        }

        function fecharResultado() {
            resultadoTela.classList.remove("mostrar");
        }

        // Inicialização segura
        window.addEventListener('DOMContentLoaded', async () => {
            console.log(" Mines carregado (script normal)");
            
            // Carrega saldo inicial
            if (window.SistemaSaldo) {
                let s = await window.SistemaSaldo.get();
                atualizarDisplaySaldo(s);
            } else {
                setTimeout(async () => {
                    if (window.SistemaSaldo) {
                        let s = await window.SistemaSaldo.get();
                        atualizarDisplaySaldo(s);
                    }
                }, 1000);
            }

            // Conecta botão diretamente (funciona em script normal)
            if (btnNovoJogo) {
                btnNovoJogo.onclick = iniciarJogo;
                console.log("✅ Botão 'NOVO JOGO' conectado!");
            } else {
                console.warn("❌ Botão NÃO encontrado! Verifique HTML");
            }
        });
    </script>
</body>
</html>
