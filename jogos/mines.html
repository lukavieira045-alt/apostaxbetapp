Mines ApostaXBet — versão realista

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mines - ApostaXBet</title>

<script type="module" src="../script.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 15% 15%,#00ff88,transparent 25%),
        radial-gradient(circle at 85% 20%,#6500ff,transparent 27%),
        radial-gradient(circle at 50% 100%,#ff0055,transparent 30%),
        linear-gradient(135deg,#02030a,#070014,#00151d);
    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0 40px;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

/* LUZES */

.luz{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.32;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#00ff88;
    left:-130px;
    top:-100px;
    animation:luz1 7s infinite alternate ease-in-out;
}

.luz2{
    background:#7200ff;
    right:-130px;
    bottom:-100px;
    animation:luz2 8s infinite alternate ease-in-out;
}

@keyframes luz1{
    to{transform:translate(180px,150px) scale(1.3)}
}

@keyframes luz2{
    to{transform:translate(-180px,-150px) scale(1.3)}
}

/* PARTÍCULAS */

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 8px #00ffff,
        0 0 15px #00ff88;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:8%;animation-duration:8s}
.particulas span:nth-child(2){left:22%;animation-duration:11s}
.particulas span:nth-child(3){left:38%;animation-duration:7s}
.particulas span:nth-child(4){left:55%;animation-duration:10s}
.particulas span:nth-child(5){left:72%;animation-duration:8s}
.particulas span:nth-child(6){left:88%;animation-duration:12s}

@keyframes subir{
    0%{transform:translateY(0);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-110vh);opacity:0}
}

/* TÍTULO */

h1{
    margin-top:10px;
    font-size:42px;
    color:#00ff88;
    letter-spacing:3px;
    text-shadow:
        0 0 8px #00ff88,
        0 0 25px #00ff88,
        0 0 50px rgba(0,255,136,.7);
    animation:pulsoTitulo 2s infinite alternate;
}

@keyframes pulsoTitulo{
    from{filter:brightness(1)}
    to{filter:brightness(1.25)}
}

/* SALDO */

#saldo{
    margin:15px 0 12px;
    padding:11px 25px;
    border-radius:40px;
    color:#00ff88;
    font-size:20px;
    font-weight:bold;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,255,136,.5);
    box-shadow:
        0 0 15px rgba(0,255,136,.18),
        inset 0 0 15px rgba(0,255,136,.05);
}

/* PAINEL */

.painel{
    width:92%;
    max-width:400px;
    padding:18px;
    border-radius:25px;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            rgba(20,25,40,.96),
            rgba(3,5,15,.97)
        );
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 30px rgba(0,255,136,.03);
}

#premio{
    min-height:30px;
    margin-bottom:15px;
    color:#ffd700;
    font-size:21px;
    font-weight:bold;
    text-shadow:0 0 12px rgba(255,215,0,.5);
}

/* JOGO */

#grid{
    width:92%;
    max-width:380px;
    margin:18px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:12px;
    border-radius:25px;
    background:
        radial-gradient(circle at center,rgba(0,255,136,.08),transparent 65%),
        rgba(0,0,0,.4);
    border:1px solid rgba(0,255,136,.16);
    box-shadow:
        inset 0 0 35px rgba(0,0,0,.9),
        0 15px 45px rgba(0,0,0,.55);
}

/* CASAS */

.cell{
    aspect-ratio:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    user-select:none;

    border-radius:18px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #292945,
            #111126 60%,
            #080810
        );

    border:2px solid rgba(255,255,255,.08);

    color:#777;
    font-size:34px;
    font-weight:bold;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.7),
        0 7px 15px rgba(0,0,0,.4);

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.cell::before{
    content:"";
    position:absolute;
    width:70%;
    height:70%;
    border-radius:50%;
    background:rgba(255,255,255,.025);
    filter:blur(10px);
}

.cell:hover:not(.revealed):not(.bomb){
    transform:translateY(-4px) scale(1.02);
    border-color:rgba(0,255,136,.6);
    box-shadow:
        0 0 15px rgba(0,255,136,.2),
        inset 0 0 20px rgba(0,255,136,.08);
}

.cell:active:not(.revealed):not(.bomb){
    transform:scale(.94);
}

/* ABRINDO */

.cell.abrindo{
    animation:abrindo .55s infinite;
}

@keyframes abrindo{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 10px rgba(0,255,136,.15);
    }
    50%{
        transform:scale(.93);
        box-shadow:
            0 0 30px rgba(0,255,136,.5),
            inset 0 0 20px rgba(0,255,136,.15);
    }
}

/* DIAMANTE */

.cell.revealed{
    cursor:default;
    color:#06150d;
    background:
        radial-gradient(circle at 35% 25%,#ffffff,#9affd0 22%,#00ff88 60%,#00a85a);
    border-color:#00ff88;
    box-shadow:
        0 0 12px #00ff88,
        0 0 30px rgba(0,255,136,.65),
        inset 0 0 18px rgba(255,255,255,.35);
    animation:diamante .45s cubic-bezier(.17,.89,.32,1.3);
}

@keyframes diamante{
    0%{
        transform:scale(.35) rotate(-20deg);
        opacity:.2;
    }
    70%{
        transform:scale(1.12) rotate(4deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* BOMBA */

.cell.bomb{
    cursor:default;
    background:
        radial-gradient(circle at 35% 25%,#ffb0b0,#ff3333 35%,#850000 75%,#250000);
    border-color:#ff3333;
    color:white;
    box-shadow:
        0 0 15px #ff3333,
        0 0 40px rgba(255,0,0,.65),
        inset 0 0 20px rgba(0,0,0,.5);
    animation:explodir .6s;
}

@keyframes explodir{
    0%{transform:scale(.5);filter:brightness(2)}
    35%{transform:scale(1.2) rotate(-5deg)}
    55%{transform:scale(.9) rotate(5deg)}
    75%{transform:scale(1.08) rotate(-3deg)}
    100%{transform:scale(1)}
}

/* BOTÃO */

button#btnNovoJogo{
    width:100%;
    background:
        linear-gradient(135deg,#00ff88,#00cc6a);
    color:#00150c;
    border:0;
    padding:16px 30px;
    font-size:18px;
    font-weight:900;
    border-radius:14px;
    cursor:pointer;
    letter-spacing:1px;
    box-shadow:
        0 0 15px rgba(0,255,136,.35),
        0 7px 20px rgba(0,0,0,.35);
    transition:.2s;
}

button#btnNovoJogo:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 30px rgba(0,255,136,.55),
        0 8px 25px rgba(0,0,0,.45);
}

button#btnNovoJogo:active{
    transform:scale(.96);
}

button#btnNovoJogo:disabled{
    background:#292929;
    color:#666;
    box-shadow:none;
    cursor:not-allowed;
}

/* RESULTADO */

.resultado-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.resultado-overlay.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultado-box{
    width:86%;
    max-width:350px;
    padding:32px 22px;
    text-align:center;
    border-radius:25px;
    background:
        radial-gradient(circle at 50% 0%,rgba(0,255,136,.15),transparent 45%),
        linear-gradient(145deg,#17172b,#070711);
    border:2px solid #00ff88;
    box-shadow:
        0 0 25px rgba(0,255,136,.4),
        0 0 80px rgba(0,255,136,.15);
    animation:popIn .45s cubic-bezier(.175,.885,.32,1.275);
}

@keyframes popIn{
    0%{
        transform:scale(.55) rotate(-5deg);
        opacity:0;
    }
    70%{
        transform:scale(1.06) rotate(1deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.resultado-icon{
    font-size:72px;
    margin-bottom:12px;
    filter:drop-shadow(0 0 15px #00ff88);
    animation:iconeResultado 1s infinite alternate;
}

@keyframes iconeResultado{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

.resultado-text{
    font-size:25px;
    font-weight:900;
    margin-bottom:25px;
}

.btn-fechar{
    background:transparent;
    border:2px solid #00ff88;
    color:#00ff88;
    padding:13px 35px;
    font-size:16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.btn-fechar:hover{
    background:#00ff88;
    color:#000;
    box-shadow:0 0 20px #00ff88;
}

/* FLASH DE EXPLOSÃO */

.flash-bomba{
    position:fixed;
    inset:0;
    z-index:90;
    pointer-events:none;
    background:rgba(255,0,0,.55);
    opacity:0;
}

.flash-bomba.ativo{
    animation:flashBomba .35s;
}

@keyframes flashBomba{
    0%{opacity:0}
    25%{opacity:.8}
    100%{opacity:0}
}

/* RESPONSIVO */

@media(max-width:450px){

    body{
        padding-top:12px;
    }

    h1{
        font-size:35px;
    }

    #grid{
        gap:9px;
        padding:9px;
    }

    .cell{
        border-radius:15px;
        font-size:30px;
    }

    .painel{
        padding:16px;
    }
}
</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="flash-bomba" id="flashBomba"></div>

<h1>💣 MINES</h1>

<div id="saldo">
    💰 Saldo: R$ 0,00
</div>

<div class="painel">

    <div id="premio">
        💎 Encontre os diamantes
    </div>

    <button id="btnNovoJogo">
        💣 NOVO JOGO
    </button>

</div>

<div id="grid"></div>

<div class="resultado-overlay" id="resultadoTela">

    <div class="resultado-box">

        <div
            class="resultado-icon"
            id="resultadoIcone">
        </div>

        <div
            class="resultado-text"
            id="resultadoTexto">
        </div>

        <button
            class="btn-fechar"
            onclick="fecharResultado()">
            JOGAR NOVAMENTE
        </button>

    </div>

</div>

<script>

/* =========================================
   CONFIGURAÇÃO
========================================= */

let bombas = [];
let jogando = false;

const VALOR_APOSTA = 1.00;
const PREMIO_DIAMANTE = 0.50;

let saldoAtual = 2.00;


/* =========================================
   ELEMENTOS
========================================= */

const grid =
document.getElementById("grid");

const premio =
document.getElementById("premio");

const displaySaldoLocal =
document.getElementById("saldo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");

const btnNovoJogo =
document.getElementById("btnNovoJogo");

const flashBomba =
document.getElementById("flashBomba");


/* =========================================
   ÁUDIO
========================================= */

let audioContext = null;

function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}


/* Som genérico */

function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.08
){

    iniciarAudio();

    const oscilador =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    oscilador.type = tipo;
    oscilador.frequency.value =
    frequencia;

    ganho.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duracao
    );

    oscilador.connect(ganho);
    ganho.connect(audioContext.destination);

    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + duracao
    );
}


/* Clique */

function somClique(){

    tocarSom(
        420,
        .07,
        "square",
        .045
    );

}


/* Diamante */

function somDiamante(){

    tocarSom(
        620,
        .08,
        "sine",
        .08
    );

    setTimeout(
        () => tocarSom(
            880,
            .12,
            "sine",
            .07
        ),
        70
    );

    setTimeout(
        () => tocarSom(
            1180,
            .16,
            "sine",
            .06
        ),
        150
    );

}


/* Bomba */

function somBomba(){

    iniciarAudio();

    const agora =
    audioContext.currentTime;

    const oscilador =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    oscilador.type = "sawtooth";

    oscilador.frequency.setValueAtTime(
        150,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        35,
        agora + .55
    );

    ganho.gain.setValueAtTime(
        .18,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .65
    );

    oscilador.connect(ganho);
    ganho.connect(audioContext.destination);

    oscilador.start();

    oscilador.stop(
        agora + .65
    );

}


/* Vitória */

function somVitoria(){

    [523,659,784,1046].forEach(
        (freq,index)=>{

            setTimeout(
                () => tocarSom(
                    freq,
                    .18,
                    "sine",
                    .07
                ),
                index * 90
            );

        }
    );

}


/* =========================================
   SALDO
========================================= */

function atualizarDisplaySaldo(){

    displaySaldoLocal.textContent =
        `💰 Saldo: R$ ${saldoAtual.toFixed(2)}`;

    localStorage.setItem(
        "saldo",
        saldoAtual
    );

}

atualizarDisplaySaldo();


/* =========================================
   INICIAR JOGO
========================================= */

async function iniciarJogo(){

    iniciarAudio();

    somClique();

    if(jogando){

        alert(
            "⚠️ Termine o jogo atual primeiro!"
        );

        return;
    }


    if(saldoAtual < VALOR_APOSTA){

        alert(
            `❌ Saldo insuficiente! Precisa de R$ ${VALOR_APOSTA.toFixed(2)} e tem R$ ${saldoAtual.toFixed(2)}`
        );

        return;
    }


    /* DEBITA */

    saldoAtual -=
    VALOR_APOSTA;

    atualizarDisplaySaldo();


    /* SISTEMA EXTERNO */

    if(window.SistemaSaldo){

        try{

            await window.SistemaSaldo.debitar(
                VALOR_APOSTA
            );

            window.SistemaSaldo.atualizarTela();

        }catch(e){

            console.warn(
                "Sistema externo indisponível."
            );

        }

    }


    jogando = true;

    bombas = [];

    grid.innerHTML = "";

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.textContent =
        "💎 Encontre os diamantes";


    /* ESCOLHE 3 BOMBAS */

    while(
        bombas.length < 3
    ){

        const p =
        Math.floor(
            Math.random() * 9
        );

        if(!bombas.includes(p)){
            bombas.push(p);
        }

    }


    /* CRIA CASAS */

    for(
        let i=0;
        i<9;
        i++
    ){

        const cell =
        document.createElement("div");

        cell.className =
        "cell";

        cell.innerHTML =
        "✦";

        cell.dataset.index =
        i;

        cell.onclick =
        () => abrirCasa(
            cell,
            i
        );

        grid.appendChild(cell);

    }


    btnNovoJogo.textContent =
        "🎯 JOGO EM ANDAMENTO";

    btnNovoJogo.disabled = true;

}


/* =========================================
   ABRIR CASA
========================================= */

async function abrirCasa(
    cell,
    indice
){

    if(
        !jogando ||
        !cell ||
        cell.classList.contains("revealed") ||
        cell.classList.contains("bomb")
    ){

        return;
    }


    iniciarAudio();

    somClique();

    cell.classList.add(
        "abrindo"
    );


    setTimeout(
    async function(){

        /* BOMBA */

        if(
            bombas.includes(indice)
        ){

            cell.classList.remove(
                "abrindo"
            );

            cell.classList.add(
                "bomb"
            );

            cell.innerHTML =
                "💣";

            somBomba();

            flashBomba.classList.remove(
                "ativo"
            );

            void flashBomba.offsetWidth;

            flashBomba.classList.add(
                "ativo"
            );

            revelarBombas();

            jogando = false;

            premio.textContent =
                "💥 BOOM! Você encontrou uma bomba.";

            btnNovoJogo.disabled = false;

            btnNovoJogo.textContent =
                "💣 NOVO JOGO";


            setTimeout(
            function(){

                resultadoIcone.textContent =
                    "💣";

                resultadoTexto.textContent =
                    "Você perdeu!";

                resultadoTela.classList.add(
                    "mostrar"
                );

            },
            800
            );

            return;
        }


        /* DIAMANTE */

        cell.classList.remove(
            "abrindo"
        );

        cell.classList.add(
            "revealed"
        );

        cell.innerHTML =
            "💎";

        somDiamante();


        /* PREMIAÇÃO */

        saldoAtual +=
            PREMIO_DIAMANTE;

        atualizarDisplaySaldo();


        if(window.SistemaSaldo){

            try{

                await window.SistemaSaldo.ganhar(
                    PREMIO_DIAMANTE,
                    1
                );

                window.SistemaSaldo.atualizarTela();

            }catch(e){

                console.warn(
                    "Sistema externo indisponível."
                );

            }

        }


        const abertas =
        document.querySelectorAll(
            ".revealed"
        ).length;


        premio.textContent =
            `💎 Diamante encontrado! + R$ ${PREMIO_DIAMANTE.toFixed(2)} — ${abertas}/6`;


        /* 6 DIAMANTES */

        if(abertas >= 6){

            jogando = false;

            somVitoria();

            premio.textContent =
                "🏆 VITÓRIA MÁXIMA!";

            btnNovoJogo.disabled =
                false;

            btnNovoJogo.textContent =
                "💣 NOVO JOGO";


            setTimeout(
            function(){

                resultadoIcone.textContent =
                    "🏆";

                resultadoTexto.textContent =
                    "Vitória máxima!";

                resultadoTela.classList.add(
                    "mostrar"
                );

            },
            700
            );

        }

    },
    220
    );

}


/* =========================================
   REVELAR BOMBAS
========================================= */

function revelarBombas(){

    const cells =
    document.querySelectorAll(
        ".cell"
    );

    bombas.forEach(
    function(idx){

        if(!cells[idx])
            return;

        setTimeout(
        function(){

            if(
                !cells[idx].classList.contains(
                    "bomb"
                )
            ){

                cells[idx].classList.add(
                    "bomb"
                );

                cells[idx].innerHTML =
                    "💣";

            }

        },
        180 + idx * 100
        );

    });

}


/* =========================================
   FECHAR RESULTADO
========================================= */

function fecharResultado(){

    resultadoTela.classList.remove(
        "mostrar"
    );

}


/* =========================================
   BOTÃO
========================================= */

btnNovoJogo.onclick =
iniciarJogo;


/* =========================================
   SOM AO TOCAR NO BOTÃO
========================================= */

btnNovoJogo.addEventListener(
    "pointerdown",
    iniciarAudio
);


/* =========================================
   CARREGAMENTO
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        atualizarDisplaySaldo();

    }
);

</script>

</body>
</html>
