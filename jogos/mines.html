<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mines - ApostaXBet</title>

<style>
body {
    background:#0f1923;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1 {
    color:#00ff88;
}

#saldo {
    font-size:22px;
    color:#00ff88;
    margin:20px;
}

#grid {
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:10px;
    justify-content:center;
    margin:30px;
}

.cell {
    width:70px;
    height:70px;
    background:#1c2530;
    border:2px solid #2a3b4c;
    border-radius:8px;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.revealed {
    background:#00ff88;
}

.bomb {
    background:#ff4444;
}

button {
    padding:12px 25px;
    background:#00ff88;
    border:0;
    border-radius:8px;
    font-weight:bold;
}

a {
    display:block;
    margin-top:30px;
    color:#aaa;
}
</style>

</head>

<body>

<h1>💣 Mines</h1>

<div id="saldo"></div>

<div id="grid"></div>

<button onclick="iniciarJogo()">Novo Jogo</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);
let bombas = [];


function atualizarSaldo(){

document.getElementById("saldo").innerHTML =
"💰 Saldo: R$ " + saldo.toFixed(2);

localStorage.setItem("saldo", saldo);

}


function iniciarJogo(){

if(saldo < 1){
alert("Saldo insuficiente!");
return;
}

saldo -= 1;
atualizarSaldo();


let grid = document.getElementById("grid");
grid.innerHTML="";

bombas=[];


while(bombas.length < 3){

let p=Math.floor(Math.random()*9);

if(!bombas.includes(p)){
bombas.push(p);
}

}


for(let i=0;i<9;i++){

let cell=document.createElement("div");

cell.className="cell";
cell.innerText="?";


cell.onclick=function(){

if(this.classList.contains("revealed") ||
this.classList.contains("bomb")) return;


if(bombas.includes(i)){

this.classList.add("bomb");
this.innerText="💣";

alert("💥 Bomba!");


}else{

this.classList.add("revealed");
this.innerText="💎";

saldo += 0.50;
atualizarSaldo();

}

};


grid.appendChild(cell);

}


}


atualizarSaldo();
iniciarJogo();

</script>

</body>
</html>
