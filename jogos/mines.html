<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mines - ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 15% 15%,#003d2b,transparent 30%),
        radial-gradient(circle at 85% 20%,#25005c,transparent 30%),
        radial-gradient(circle at 50% 100%,#001f35,transparent 35%),
        linear-gradient(135deg,#020308,#070b16,#020612);
    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0 35px;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.25;
    pointer-events:none;
    z-index:-1;
}

.luz1{
    background:#00ff88;
    left:-120px;
    top:-100px;
    animation:flutuar1 7s infinite alternate ease-in-out;
}

.luz2{
    background:#6a00ff;
    right:-120px;
    bottom:-100px;
    animation:flutuar2 8s infinite alternate ease-in-out;
}

@keyframes flutuar1{
    to{transform:translate(150px,150px)}
}

@keyframes flutuar2{
    to{transform:translate(-150px,-150px)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px #00ff88;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:10%;animation-duration:9s}
.particulas span:nth-child(2){left:30%;animation-duration:11s}
.particulas span:nth-child(3){left:50%;animation-duration:8s}
.particulas span:nth-child(4){left:70%;animation-duration:10s}
.particulas span:nth-child(5){left:90%;animation-duration:12s}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{opacity:1}
    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

h1{
    margin-top:10px;
    font-size:40px;
    color:#00ff88;
    text-shadow:
        0 0 10px #00ff88,
        0 0 30px rgba(0,255,136,.5);
}

#saldo{
    margin:15px 0;
    padding:11px 25px;
    border-radius:30px;
    color:#00ff88;
    font-size:21px;
    font-weight:bold;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(0,255,136,.45);
    box-shadow:0 0 20px rgba(0,255,136,.15);
}

.painel{
    width:92%;
    max-width:390px;
    padding:20px;
    border-radius:24px;
    background:rgba(10,15,28,.94);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
        0 15px 50px rgba(0,0,0,.55),
        inset 0 0 25px rgba(0,255,136,.03);
    text-align:center;
}

#tempo{
    min-height:28px;
    margin-bottom:8px;
    color:#ffd700;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 10px #ffd700;
}

#premio{
    min-height:30px;
    margin-bottom:15px;
    color:#00ff88;
    font-size:19px;
    font-weight:bold;
}

#grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    width:92%;
    max-width:360px;
    margin:20px auto;
}

.cell{
    aspect-ratio:1;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:2px solid #26334a;
    background:
        radial-gradient(circle at 35% 25%,#263b58,#111a2a 55%,#080d17);
    box-shadow:
        inset 0 0 20px rgba(0,0,0,.8),
        0 5px 15px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    cursor:pointer;
    user-select:none;
    transition:.18s;
}

.cell::before{
    content:"?";
    color:#7890aa;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 8px rgba(120,180,255,.35);
}

.cell:hover:not(.revelada):not(.bomba){
    transform:translateY(-3px) scale(1.02);
    border-color:#00ff88;
    box-shadow:
        0 0 15px rgba(0,255,136,.25),
        inset 0 0 20px rgba(0,255,136,.08);
}

.cell.abrindo{
    animation:pulsar .45s infinite;
}

@keyframes pulsar{
    0%,100%{transform:scale(1)}
    50%{transform:scale(.93)}
}

.cell.revelada{
    cursor:default;
    background:
        radial-gradient(circle at 35% 25%,#eafff5,#00ff88 40%,#009e57);
    border-color:#00ff88;
    box-shadow:
        0 0 15px #00ff88,
        inset 0 0 20px rgba(255,255,255,.3);
    animation:diamante .35s ease;
}

.cell.revelada::before{
    content:"💎";
    font-size:34px;
    filter:drop-shadow(0 0 7px #fff);
}

@keyframes diamante{
    0%{transform:scale(.5);opacity:.2}
    70%{transform:scale(1.15)}
    100%{transform:scale(1);opacity:1}
}

.cell.bomba{
    cursor:default;
    background:
        radial-gradient(circle,#ffdddd,#ff3030 45%,#8b0000);
    border-color:#ff3333;
    box-shadow:
        0 0 25px #ff2222,
        inset 0 0 20px rgba(255,255,255,.2);
    animation:explodir .5s ease;
}

.cell.bomba::before{
    content:"💣";
    font-size:35px;
}

@keyframes explodir{
    0%{
        transform:scale(.5);
        filter:brightness(3);
    }
    45%{
        transform:scale(1.18) rotate(5deg);
    }
    100%{
        transform:scale(1);
        filter:brightness(1);
    }
}

.cell.bomba.explodindo{
    animation:explosao .55s ease;
}

@keyframes explosao{
    0%{
        transform:scale(.4);
        filter:brightness(4);
    }
    50%{
        transform:scale(1.25);
        filter:brightness(2);
    }
    100%{
        transform:scale(1);
        filter:brightness(1);
    }
}

.controles{
    margin-top:5px;
}

#aposta{
    width:120px;
    padding:11px;
    border-radius:10px;
    border:2px solid #34445d;
    background:#05080f;
    color:white;
    text-align:center;
    font-size:17px;
    outline:none;
}

#aposta:focus{
    border-color:#00ff88;
}

#btnNovoJogo{
    margin-top:14px;
    padding:15px 32px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#00ff88,#00bd64);
    color:#00150b;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,255,136,.3);
}

#btnNovoJogo:active{
    transform:scale(.96);
}

#btnNovoJogo:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.resultado-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.84);
    backdrop-filter:blur(8px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.resultado-overlay.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultado-box{
    width:86%;
    max-width:340px;
    padding:32px 22px;
    text-align:center;
    border-radius:25px;
    background:
        linear-gradient(145deg,#172133,#080d17);
    border:2px solid #00ff88;
    box-shadow:
        0 0 35px rgba(0,255,136,.3),
        0 20px 70px rgba(0,0,0,.8);
    animation:entrada .4s ease;
}

@keyframes entrada{
    0%{
        transform:scale(.65) rotate(-5deg);
        opacity:0;
    }
    70%{
        transform:scale(1.05) rotate(2deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

#resultadoIcone{
    font-size:65px;
    margin-bottom:12px;
}

#resultadoTexto{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.btn-fechar{
    padding:13px 28px;
    border-radius:12px;
    border:2px solid #00ff88;
    background:transparent;
    color:#00ff88;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-fechar:hover{
    background:#00ff88;
    color:#000;
}

@media(max-width:450px){
    h1{font-size:34px}
    #grid{gap:10px}
    .cell{border-radius:15px}
}
</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<h1>💣 MINES</h1>

<div id="saldo">💰 Saldo: R$ 0,00</div>

<div class="painel">

    <div id="tempo">
        ⏱️ Aguardando...
    </div>

    <div id="premio">
        💎 Encontre os diamantes
    </div>

    <div class="controles">

        <input
            id="aposta"
            type="number"
            value="1.00"
            min="0.10"
            step="0.10"
        >

        <br>

        <button id="btnNovoJogo">
            💣 NOVO JOGO
        </button>

    </div>

</div>

<div id="grid"></div>

<div
    class="resultado-overlay"
    id="resultadoTela"
>

    <div class="resultado-box">

        <div id="resultadoIcone"></div>

        <div id="resultadoTexto">
            Resultado
        </div>

        <button
            class="btn-fechar"
            onclick="fecharResultado()"
        >
            JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script>

/* =====================================================
   ESTADO
===================================================== */

let bombas = [];

let jogando = false;

let encerrando = false;

let tempoRestante = 0;

let contador = null;

let apostaAtual = 0;

let premioAtual = 0;

const TOTAL_CASAS = 9;

const TOTAL_BOMBAS = 3;

const PREMIO_DIAMANTE = 0.50;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
document.getElementById("grid");

const premio =
document.getElementById("premio");

const saldo =
document.getElementById("saldo");

const tempo =
document.getElementById("tempo");

const apostaInput =
document.getElementById("aposta");

const btnNovoJogo =
document.getElementById("btnNovoJogo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");


/* =====================================================
   SALDO — USA O MESMO SISTEMA DOS OUTROS JOGOS
===================================================== */

function obterSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const valor =
                Number(
                    window.SistemaSaldo.get()
                );

            return Number.isFinite(valor)
                ? valor
                : 0;
        }

    }catch(e){

        console.warn(
            "Não foi possível ler o SistemaSaldo.",
            e
        );

    }

    return 0;
}


function atualizarSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.atualizarTela === "function"
        ){

            window.SistemaSaldo.atualizarTela();

        }

    }catch(e){}


    const valor =
        obterSaldo();

    saldo.textContent =
        "💰 Saldo: R$ " +
        valor.toFixed(2);

}


/* =====================================================
   SOM
===================================================== */

let audioContext = null;

function obterAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return null;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

    return audioContext;

}


function somClique(){

    const ctx =
        obterAudio();

    if(!ctx)
        return;

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "sine";

    osc.frequency.value = 520;

    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .08,
        ctx.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .09
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + .1
    );

}


function somDiamante(){

    const ctx =
        obterAudio();

    if(!ctx)
        return;

    [700,900,1150].forEach(
    function(freq,i){

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sine";

        osc.frequency.value =
            freq;

        const inicio =
            ctx.currentTime +
            i * .06;

        gain.gain.setValueAtTime(
            .0001,
            inicio
        );

        gain.gain.exponentialRampToValueAtTime(
            .12,
            inicio + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            inicio + .16
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(inicio);

        osc.stop(
            inicio + .18
        );

    });

}


function somBomba(){

    const ctx =
        obterAudio();

    if(!ctx)
        return;

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        150,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        45,
        ctx.currentTime + .45
    );

    gain.gain.setValueAtTime(
        .2,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .5
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + .52
    );

}


/* =====================================================
   CRIAR CASAS
===================================================== */

function criarGrid(){

    grid.innerHTML = "";

    for(
        let i=0;
        i<TOTAL_CASAS;
        i++
    ){

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        cell.dataset.index =
            i;

        cell.onclick =
            function(){

                abrirCasa(
                    cell,
                    i
                );

            };

        grid.appendChild(
            cell
        );

    }

}


/* =====================================================
   GERAR BOMBAS
===================================================== */

function gerarBombas(){

    bombas = [];

    while(
        bombas.length <
        TOTAL_BOMBAS
    ){

        const pos =
            Math.floor(
                Math.random() *
                TOTAL_CASAS
            );

        if(
            !bombas.includes(pos)
        ){

            bombas.push(pos);

        }

    }

}


/* =====================================================
   CONTAGEM
===================================================== */

function iniciarContagem(){

    clearInterval(
        contador
    );

    tempoRestante = 10;

    tempo.innerHTML =
        "⏱️ Escolha uma casa: <b>10s</b>";

    contador =
        setInterval(
        function(){

            tempoRestante--;

            if(
                tempoRestante > 0
            ){

                tempo.innerHTML =
                    "⏱️ Escolha uma casa: <b>" +
                    tempoRestante +
                    "s</b>";

            }

            if(
                tempoRestante <= 3 &&
                tempoRestante > 0
            ){

                tempo.style.color =
                    "#ff4444";

            }

            if(
                tempoRestante <= 0
            ){

                clearInterval(
                    contador
                );

                tempo.innerHTML =
                    "⏰ <b>TEMPO ESGOTADO!</b>";

                encerrarPorTempo();

            }

        },
        1000
        );

}


/* =====================================================
   NOVO JOGO
===================================================== */

async function iniciarJogo(){

    if(jogando){

        return;

    }

    const valorAposta =
        Number(
            apostaInput.value
        );

    if(
        !Number.isFinite(
            valorAposta
        ) ||
        valorAposta <= 0
    ){

        alert(
            "Digite um valor de aposta válido."
        );

        return;

    }


    const saldoAtual =
        obterSaldo();


    if(
        saldoAtual <
        valorAposta
    ){

        alert(
            "❌ Saldo insuficiente."
        );

        atualizarSaldo();

        return;

    }


    /*
    DEBITA PELO SISTEMA CENTRAL
    */

    if(
        !window.SistemaSaldo ||
        typeof window.SistemaSaldo.debitar !== "function"
    ){

        alert(
            "Sistema de saldo não está disponível."
        );

        return;

    }


    try{

        const resultado =
            await window.SistemaSaldo.debitar(
                valorAposta
            );

        /*
        Se a função retornar false,
        não inicia a rodada.
        */

        if(
            resultado === false
        ){

            alert(
                "Não foi possível debitar a aposta."
            );

            atualizarSaldo();

            return;

        }

    }catch(error){

        console.error(
            error
        );

        alert(
            "Erro ao debitar a aposta."
        );

        atualizarSaldo();

        return;

    }


    /*
    PREPARA RODADA
    */

    apostaAtual =
        valorAposta;

    premioAtual = 0;

    jogando = true;

    encerrando = false;

    btnNovoJogo.disabled =
        true;

    apostaInput.disabled =
        true;

    resultadoTela.classList.remove(
        "mostrar"
    );

    tempo.style.color =
        "#ffd700";

    premio.textContent =
        "💎 Encontre os diamantes";

    criarGrid();

    gerarBombas();

    atualizarSaldo();

    somClique();

    iniciarContagem();

}


/* =====================================================
   ABRIR CASA
===================================================== */

function abrirCasa(
    cell,
    indice
){

    if(
        !jogando ||
        encerrando ||
        !cell
    ){

        return;

    }

    if(
        cell.classList.contains(
            "revelada"
        ) ||
        cell.classList.contains(
            "bomba"
        )
    ){

        return;

    }


    /*
    EVITA DUPLO CLIQUE
    */

    cell.classList.add(
        "abrindo"
    );


    setTimeout(
    function(){

        if(
            !jogando ||
            encerrando
        ){

            cell.classList.remove(
                "abrindo"
            );

            return;

        }


        /*
        BOMBA
        */

        if(
            bombas.includes(
                indice
            )
        ){

            cell.classList.remove(
                "abrindo"
            );

            cell.classList.add(
                "bomba",
                "explodindo"
            );

            somBomba();

            revelarTodasBombas();

            perder();

            return;

        }


        /*
        DIAMANTE
        */

        cell.classList.remove(
            "abrindo"
        );

        cell.classList.add(
            "revelada"
        );

        somDiamante();

        premioAtual +=
            PREMIO_DIAMANTE;


        premio.textContent =
            "💎 +" +
            premioAtual.toFixed(2);


        const abertas =
            document.querySelectorAll(
                ".cell.revelada"
            ).length;


        /*
        VITÓRIA MÁXIMA
        */

        if(
            abertas >=
            TOTAL_CASAS -
            TOTAL_BOMBAS
        ){

            vencer();

        }

    },
    180
    );

}


/* =====================================================
   REVELAR TODAS AS BOMBAS
===================================================== */

function revelarTodasBombas(){

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    bombas.forEach(
    function(indice,posicao){

        const cell =
            cells[indice];

        if(!cell)
            return;

        setTimeout(
        function(){

            if(
                !cell.classList.contains(
                    "bomba"
                )
            ){

                cell.classList.add(
                    "bomba",
                    "explodindo"
                );

            }

            /*
            Pequeno efeito sonoro
            para cada explosão.
            */

            if(
                posicao > 0
            ){

                setTimeout(
                    somBomba,
                    posicao * 80
                );

            }

        },
        120 +
        posicao * 130
        );

    });

}


/* =====================================================
   PERDEU
===================================================== */

function perder(){

    if(encerrando)
        return;

    encerrando = true;

    clearInterval(
        contador
    );

    jogando = false;

    tempo.innerHTML =
        "💥 <b>BOMBA!</b>";

    tempo.style.color =
        "#ff3333";

    premio.textContent =
        "💥 BOOM! Todas as bombas apareceram.";

    btnNovoJogo.disabled =
        true;


    setTimeout(
    function(){

        resultadoIcone.textContent =
            "💣";

        resultadoTexto.textContent =
            "Você perdeu a rodada!";

        resultadoTela.classList.add(
            "mostrar"
        );

        btnNovoJogo.disabled =
            false;

        apostaInput.disabled =
            false;

    },
    900
    );

}


/* =====================================================
   TEMPO ESGOTADO
===================================================== */

function encerrarPorTempo(){

    if(!jogando)
        return;

    encerrando = true;

    jogando = false;

    revelarTodasBombas();

    premio.textContent =
        "⏰ Tempo encerrado!";

    setTimeout(
    function(){

        resultadoIcone.textContent =
            "⏰";

        resultadoTexto.textContent =
            "Tempo esgotado!";

        resultadoTela.classList.add(
            "mostrar"
        );

        btnNovoJogo.disabled =
            false;

        apostaInput.disabled =
            false;

    },
    800
    );

}


/* =====================================================
   VITÓRIA
===================================================== */

async function vencer(){

    if(encerrando)
        return;

    encerrando = true;

    clearInterval(
        contador
    );

    jogando = false;


    /*
    RETORNA O PRÊMIO PELO SISTEMA CENTRAL
    */

    if(
        premioAtual > 0 &&
        window.SistemaSaldo &&
        typeof window.SistemaSaldo.ganhar === "function"
    ){

        try{

            await window.SistemaSaldo.ganhar(
                premioAtual,
                1
            );

        }catch(error){

            console.error(
                "Erro ao creditar prêmio:",
                error
            );

        }

    }


    atualizarSaldo();

    tempo.innerHTML =
        "🏆 <b>VITÓRIA!</b>";

    tempo.style.color =
        "#00ff88";

    premio.textContent =
        "🏆 Vitória máxima! + R$ " +
        premioAtual.toFixed(2);


    setTimeout(
    function(){

        resultadoIcone.textContent =
            "🏆";

        resultadoTexto.textContent =
            "Vitória! + R$ " +
            premioAtual.toFixed(2);

        resultadoTela.classList.add(
            "mostrar"
        );

        btnNovoJogo.disabled =
            false;

        apostaInput.disabled =
            false;

    },
    700
    );

}


/* =====================================================
   FECHAR RESULTADO
===================================================== */

function fecharResultado(){

    resultadoTela.classList.remove(
        "mostrar"
    );

    tempo.style.color =
        "#ffd700";

    tempo.innerHTML =
        "🎮 Pronto para jogar";

    premio.textContent =
        "💎 Encontre os diamantes";

    btnNovoJogo.disabled =
        false;

    apostaInput.disabled =
        false;

    atualizarSaldo();

}


/* =====================================================
   BOTÃO
===================================================== */

btnNovoJogo.onclick =
    iniciarJogo;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        criarGrid();

        atualizarSaldo();

        tempo.innerHTML =
            "🎮 Pronto para jogar";

    }
);


/*
Atualiza o saldo quando o sistema
central mudar.
*/

if(window.SistemaSaldo){

    try{

        if(
            typeof window.SistemaSaldo.atualizarTela ===
            "function"
        ){

            window.SistemaSaldo.atualizarTela();

        }

    }catch(e){}

}

</script>
