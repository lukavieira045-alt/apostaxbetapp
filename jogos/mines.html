<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mines Realista - ApostaXBet</title>

<script src="../saldo.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    text-align:center;
    background:
        radial-gradient(circle at 15% 15%,#003cff,transparent 28%),
        radial-gradient(circle at 85% 25%,#b000ff,transparent 28%),
        radial-gradient(circle at 50% 100%,#ff004c,transparent 30%),
        linear-gradient(135deg,#02030b,#090018,#001526);
    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
    padding:20px 0 40px;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.3;
    z-index:-1;
    pointer-events:none;
}

.luz1{
    background:#00ff88;
    left:-100px;
    top:-100px;
    animation:flutuar1 7s infinite alternate ease-in-out;
}

.luz2{
    background:#6a00ff;
    right:-100px;
    bottom:-100px;
    animation:flutuar2 7s infinite alternate ease-in-out;
}

@keyframes flutuar1{
    to{transform:translate(150px,150px)}
}

@keyframes flutuar2{
    to{transform:translate(-150px,-150px)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    box-shadow:
        0 0 8px #00ffff,
        0 0 15px #00ff88;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:10%;animation-duration:9s}
.particulas span:nth-child(2){left:30%;animation-duration:11s}
.particulas span:nth-child(3){left:50%;animation-duration:8s}
.particulas span:nth-child(4){left:70%;animation-duration:10s}
.particulas span:nth-child(5){left:90%;animation-duration:12s}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{opacity:1}
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

h1{
    margin-top:10px;
    font-size:40px;
    color:#00ff88;
    text-shadow:
        0 0 10px #00ff88,
        0 0 30px rgba(0,255,136,.6);
}

#saldo{
    display:inline-block;
    font-size:21px;
    font-weight:bold;
    color:#00ff88;
    background:rgba(0,0,0,.45);
    padding:12px 28px;
    border-radius:40px;
    border:1px solid rgba(0,255,136,.5);
    margin:15px 0;
    box-shadow:
        0 0 20px rgba(0,255,136,.15);
}

.painel{
    width:92%;
    max-width:410px;
    margin:10px auto 15px;
    padding:18px;
    background:
        linear-gradient(
            145deg,
            rgba(20,25,40,.96),
            rgba(3,5,15,.97)
        );
    border-radius:24px;
    border:1px solid rgba(0,255,136,.2);
    box-shadow:
        0 15px 45px rgba(0,0,0,.6);
}

#premio{
    min-height:30px;
    font-size:21px;
    color:#ffd700;
    font-weight:bold;
    margin-bottom:10px;
}

#timer{
    margin:8px auto 14px;
    width:150px;
    padding:9px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    color:#00ff88;
    background:rgba(0,255,136,.08);
    border:1px solid rgba(0,255,136,.35);
}

#timer.perigo{
    color:#ff3333;
    border-color:#ff3333;
    background:rgba(255,0,0,.12);
    animation:timerPerigo .45s infinite alternate;
}

@keyframes timerPerigo{
    from{transform:scale(1)}
    to{
        transform:scale(1.08);
        box-shadow:0 0 20px rgba(255,0,0,.5);
    }
}

#jogo{
    width:92%;
    max-width:410px;
    height:440px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-radius:25px;
    padding:18px;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,255,136,.08),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #090d18,
            #020309
        );
    border:2px solid rgba(0,255,136,.3);
    box-shadow:
        inset 0 0 50px rgba(0,0,0,.9),
        0 20px 60px rgba(0,0,0,.7);
}

#grid{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    align-content:center;
}

.cell{
    aspect-ratio:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    cursor:pointer;
    user-select:none;

    background:
        linear-gradient(
            145deg,
            #20263a,
            #0c101c
        );

    border-radius:18px;
    border:2px solid rgba(255,255,255,.1);

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.05),
        0 8px 15px rgba(0,0,0,.5);

    transition:
        transform .2s,
        background .2s,
        box-shadow .2s;
}

.cell::before{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.04);
    pointer-events:none;
}

.cell:hover:not(.revealed):not(.bomb):not(.bloqueada){
    transform:translateY(-4px);
    border-color:#00ff88;
    box-shadow:
        0 0 15px rgba(0,255,136,.25),
        inset 0 0 20px rgba(0,255,136,.06);
}

.cell.abrindo{
    animation:abrir .45s ease;
}

@keyframes abrir{
    0%{transform:scale(.9) rotateY(0)}
    50%{transform:scale(1.06) rotateY(90deg)}
    100%{transform:scale(1) rotateY(0)}
}

.cell.revealed{
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #00ff88 30%,
            #009955 75%,
            #004c2c
        );
    color:#001b10;
    border-color:#00ff88;
    box-shadow:
        0 0 15px #00ff88,
        0 0 35px rgba(0,255,136,.5);
    animation:diamante .5s ease;
}

@keyframes diamante{
    0%{
        transform:scale(.6) rotate(-15deg);
        opacity:0;
    }
    60%{
        transform:scale(1.15) rotate(8deg);
    }
    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}

.cell.bomb{
    background:
        radial-gradient(
            circle,
            #ff7777,
            #ff2222 45%,
            #580000
        );
    border-color:#ff2222;
    box-shadow:
        0 0 20px #ff2222,
        0 0 50px rgba(255,0,0,.65);
    animation:explodir .6s ease;
}

@keyframes explodir{
    0%{
        transform:scale(.7);
        filter:brightness(2);
    }
    35%{
        transform:scale(1.25) rotate(-8deg);
    }
    55%{
        transform:scale(.9) rotate(8deg);
    }
    100%{
        transform:scale(1);
    }
}

.cell.bloqueada{
    cursor:not-allowed;
    opacity:.75;
}

#btnNovoJogo{
    background:
        linear-gradient(
            135deg,
            #00ff88,
            #00bb66
        );
    color:#001a0d;
    border:none;
    padding:15px 40px;
    font-size:17px;
    font-weight:900;
    border-radius:14px;
    cursor:pointer;
    box-shadow:
        0 0 20px rgba(0,255,136,.35);
}

#btnNovoJogo:disabled{
    opacity:.45;
    cursor:not-allowed;
}

#btnNovoJogo:active{
    transform:scale(.96);
}

.resultado-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(9px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:100;
}

.resultado-overlay.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultado-box{
    width:85%;
    max-width:350px;
    padding:35px 25px;
    border-radius:25px;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            #151b2d,
            #060811
        );
    border:2px solid #00ff88;
    box-shadow:
        0 0 30px rgba(0,255,136,.35);
    animation:pop .4s ease;
}

@keyframes pop{
    0%{
        transform:scale(.6);
        opacity:0;
    }
    70%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.resultado-icon{
    font-size:70px;
    margin-bottom:15px;
}

.resultado-text{
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;
}

.btn-fechar{
    padding:13px 30px;
    border-radius:12px;
    border:2px solid #00ff88;
    background:transparent;
    color:#00ff88;
    font-size:16px;
    font-weight:bold;
}

@media(max-width:450px){

    h1{
        font-size:34px;
    }

    #jogo{
        height:420px;
    }

    .cell{
        font-size:30px;
    }
}

</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<h1>💣 MINES</h1>

<div id="saldo">
    💰 Saldo: R$ 0,00
</div>

<div class="painel">

    <div id="premio">
        💎 Encontre os diamantes
    </div>

    <div id="timer">
        ⏱️ AGUARDANDO
    </div>

    <button id="btnNovoJogo">
        NOVO JOGO
    </button>

</div>

<div id="jogo">
    <div id="grid"></div>
</div>

<div class="resultado-overlay" id="resultadoTela">

    <div class="resultado-box">

        <div
            class="resultado-icon"
            id="resultadoIcone">
        </div>

        <div
            class="resultado-text"
            id="resultadoTexto">
        </div>

        <button
            class="btn-fechar"
            onclick="fecharResultado()">
            JOGAR NOVAMENTE
        </button>

    </div>

</div>

<script>

/* =========================================
   CONFIGURAÇÃO
========================================= */

const VALOR_APOSTA = 1.00;
const PREMIO_DIAMANTE = 0.50;
const QUANTIDADE_BOMBAS = 3;
const TEMPO_RODADA = 10;


/* =========================================
   ELEMENTOS
========================================= */

const grid =
document.getElementById("grid");

const premio =
document.getElementById("premio");

const displaySaldo =
document.getElementById("saldo");

const timer =
document.getElementById("timer");

const btnNovoJogo =
document.getElementById("btnNovoJogo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");


/* =========================================
   ESTADO
========================================= */

let bombas = [];
let jogando = false;
let tempoRestante = 0;
let contador = null;


/* =========================================
   SOM
========================================= */

let audioContext = null;

function obterAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}


function som(
    frequencia,
    duracao,
    tipo="sine",
    volume=.08
){

    try{

        const ctx =
        obterAudio();

        const osc =
        ctx.createOscillator();

        const ganho =
        ctx.createGain();

        osc.type = tipo;

        osc.frequency.value =
        frequencia;

        ganho.gain.setValueAtTime(
            volume,
            ctx.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + duracao
        );

        osc.connect(ganho);
        ganho.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + duracao
        );

    }catch(e){

        console.warn(
            "Áudio indisponível."
        );

    }

}


/* =========================================
   SONS ESPECIAIS
========================================= */

function somClique(){
    som(520,.07,"square",.06);
}

function somDiamante(){

    som(700,.10,"sine",.10);

    setTimeout(
        () => som(1000,.16,"sine",.10),
        70
    );

}

function somBomba(){

    som(90,.45,"sawtooth",.18);

    setTimeout(
        () => som(55,.55,"square",.12),
        100
    );

}

function somContagem(){

    som(500,.06,"square",.045);

}


/* =========================================
   SALDO
========================================= */

async function obterSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const valorSaldo =
            await window.SistemaSaldo.get();

            if(
                typeof valorSaldo === "number" &&
                Number.isFinite(valorSaldo)
            ){

                return valorSaldo;

            }

        }

    }catch(e){

        console.warn(
            "Não foi possível obter saldo:",
            e
        );

    }

    return 0;

}


async function atualizarSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.atualizarTela === "function"
        ){

            await window.SistemaSaldo.atualizarTela();

        }

    }catch(e){

        console.warn(
            "Erro ao atualizar saldo:",
            e
        );

    }

    const valorSaldo =
    await obterSaldo();

    displaySaldo.textContent =
    "💰 Saldo: R$ " +
    Number(valorSaldo || 0)
    .toFixed(2);

}


/* =========================================
   DEBITAR
========================================= */

async function debitarAposta(){

    if(
        !window.SistemaSaldo ||
        typeof window.SistemaSaldo.debitar !== "function"
    ){

        alert(
            "Sistema de saldo não encontrado."
        );

        return false;

    }

    try{

        const resultado =
        await window.SistemaSaldo.debitar(
            VALOR_APOSTA
        );

        if(resultado === false){
            return false;
        }

        await atualizarSaldo();

        return true;

    }catch(e){

        console.error(e);

        alert(
            "Não foi possível debitar a aposta."
        );

        return false;

    }

}


/* =========================================
   PAGAR
========================================= */

async function pagarPremio(valor){

    if(
        !window.SistemaSaldo ||
        typeof window.SistemaSaldo.ganhar !== "function"
    ){

        console.warn(
            "Sistema de pagamento não encontrado."
        );

        return;

    }

    try{

        await window.SistemaSaldo.ganhar(
            valor,
            1
        );

        await atualizarSaldo();

    }catch(e){

        console.error(
            "Erro ao pagar prêmio:",
            e
        );

    }

}


/* =========================================
   CRIAR TABULEIRO
========================================= */

function criarTabuleiro(){

    grid.innerHTML = "";

    for(let i=0;i<9;i++){

        const cell =
        document.createElement("div");

        cell.className =
        "cell";

        cell.innerHTML =
        "💠";

        cell.dataset.index =
        i;

        cell.onclick =
        () => abrirCasa(cell,i);

        grid.appendChild(cell);

    }

}


/* =========================================
   CRIAR BOMBAS
========================================= */

function criarBombas(){

    bombas = [];

    while(
        bombas.length <
        QUANTIDADE_BOMBAS
    ){

        const numero =
        Math.floor(
            Math.random()*9
        );

        if(
            !bombas.includes(numero)
        ){

            bombas.push(numero);

        }

    }

}


/* =========================================
   TIMER
========================================= */

function iniciarTimer(){

    clearInterval(contador);

    tempoRestante =
    TEMPO_RODADA;

    atualizarTimer();

    contador =
    setInterval(
    function(){

        tempoRestante--;

        atualizarTimer();

        if(
            tempoRestante <= 0
        ){

            clearInterval(
                contador
            );

            tempoEsgotado();

        }

    },
    1000
    );

}


function atualizarTimer(){

    if(!jogando){

        timer.textContent =
        "⏱️ AGUARDANDO";

        timer.classList.remove(
            "perigo"
        );

        return;

    }

    timer.textContent =
    "⏱️ " +
    tempoRestante +
    "s";

    if(
        tempoRestante <= 3
    ){

        timer.classList.add(
            "perigo"
        );

        somContagem();

    }
    else{

        timer.classList.remove(
            "perigo"
        );

    }

}


/* =========================================
   NOVO JOGO
========================================= */

async function iniciarJogo(){

    if(jogando){

        return;

    }

    const saldoAtual =
    await obterSaldo();

    if(
        saldoAtual <
        VALOR_APOSTA
    ){

        alert(
            "❌ Saldo insuficiente para jogar."
        );

        return;

    }

    somClique();

    const debitado =
    await debitarAposta();

    if(!debitado){

        return;

    }

    jogando = true;

    btnNovoJogo.disabled = true;

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.textContent =
    "💎 Escolha uma casa!";

    criarBombas();

    criarTabuleiro();

    iniciarTimer();

}


/* =========================================
   ABRIR CASA
========================================= */

function abrirCasa(
    cell,
    indice
){

    if(
        !jogando ||
        !cell ||
        cell.classList.contains("revealed") ||
        cell.classList.contains("bomb") ||
        cell.classList.contains("bloqueada")
    ){

        return;

    }

    somClique();

    cell.classList.add(
        "abrindo"
    );

    setTimeout(
    async function(){

        if(!jogando){

            return;

        }

        cell.classList.remove(
            "abrindo"
        );

        /* BOMBA */

        if(
            bombas.includes(indice)
        ){

            somBomba();

            cell.classList.add(
                "bomb"
            );

            cell.innerHTML =
            "💣";

            jogando = false;

            clearInterval(
                contador
            );

            timer.textContent =
            "💥 EXPLODIU!";

            timer.classList.remove(
                "perigo"
            );

            premio.textContent =
            "💥 BOOM! Você encontrou uma bomba.";

            revelarBombas();

            bloquearTabuleiro();

            setTimeout(
            function(){

                resultadoIcone.textContent =
                "💣";

                resultadoTexto.textContent =
                "Você perdeu!";

                resultadoTela.classList.add(
                    "mostrar"
                );

                btnNovoJogo.disabled =
                false;

            },
            900
            );

            return;

        }

        /* DIAMANTE */

        somDiamante();

        cell.classList.add(
            "revealed"
        );

        cell.innerHTML =
        "💎";

        await pagarPremio(
            PREMIO_DIAMANTE
        );

        premio.textContent =
        "💎 + R$ " +
        PREMIO_DIAMANTE.toFixed(2);

        const abertas =
        document.querySelectorAll(
            ".cell.revealed"
        ).length;

        /*
        TODAS AS CASAS SEGURAS
        */

        if(
            abertas >=
            9 - QUANTIDADE_BOMBAS
        ){

            clearInterval(
                contador
            );

            jogando = false;

            revelarBombas();

            bloquearTabuleiro();

            timer.textContent =
            "🏆 VITÓRIA!";

            premio.textContent =
            "🏆 Você encontrou todos os diamantes!";

            setTimeout(
            function(){

                resultadoIcone.textContent =
                "🏆";

                resultadoTexto.textContent =
                "Vitória máxima!";

                resultadoTela.classList.add(
                    "mostrar"
                );

                btnNovoJogo.disabled =
                false;

            },
            900
            );

        }

    },
    180
    );

}


/* =========================================
   TEMPO ACABOU
========================================= */

function tempoEsgotado(){

    if(!jogando){
        return;
    }

    jogando = false;

    timer.textContent =
    "⏰ TEMPO ESGOTADO!";

    timer.classList.remove(
        "perigo"
    );

    premio.textContent =
    "💥 Tempo esgotado! As bombas explodiram!";

    somBomba();

    revelarBombas();

    bloquearTabuleiro();

    setTimeout(
    function(){

        resultadoIcone.textContent =
        "💣";

        resultadoTexto.textContent =
        "Tempo esgotado!";

        resultadoTela.classList.add(
            "mostrar"
        );

        btnNovoJogo.disabled =
        false;

    },
    1000
    );

}


/* =========================================
   REVELAR TODAS AS BOMBAS
========================================= */

function revelarBombas(){

    const cells =
    document.querySelectorAll(
        ".cell"
    );

    bombas.forEach(
    function(indice,posicao){

        if(!cells[indice]){
            return;
        }

        setTimeout(
        function(){

            if(
                !cells[indice].classList.contains(
                    "bomb"
                )
            ){

                cells[indice].classList.add(
                    "bomb"
                );

                cells[indice].innerHTML =
                "💣";

                somBomba();

            }

        },
        posicao * 180
        );

    });

}


/* =========================================
   BLOQUEAR
========================================= */

function bloquearTabuleiro(){

    document
    .querySelectorAll(".cell")
    .forEach(
    function(cell){

        cell.classList.add(
            "bloqueada"
        );

    });

}


/* =========================================
   FECHAR RESULTADO
========================================= */

function fecharResultado(){

    resultadoTela.classList.remove(
        "mostrar"
    );

    atualizarSaldo();

}


/* =========================================
   INICIALIZAÇÃO
========================================= */

window.addEventListener(
"DOMContentLoaded",
async function(){

    await atualizarSaldo();

    btnNovoJogo.onclick =
