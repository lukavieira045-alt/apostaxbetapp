<script>
"use strict";

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   CONFIGURAÇÃO DO JOGO
===================================================== */

const VALOR_APOSTA = 1.00;

const PREMIO_DIAMANTE = 0.50;

const QUANTIDADE_BOMBAS = 3;

const TEMPO_RODADA = 10;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
document.getElementById("grid");

const saldoDisplay =
document.getElementById("saldo");

const premio =
document.getElementById("premio");

const tempo =
document.getElementById("tempo");

const barra =
document.getElementById("barraProgresso");

const botao =
document.getElementById("btnNovoJogo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");


/* =====================================================
   ESTADO
===================================================== */

let usuarioAtual = null;

let saldoReal = 0;

let bombas = [];

let jogando = false;

let tempoRestante = TEMPO_RODADA;

let intervaloTempo = null;

let rodadaEncerrada = false;

let diamantesEncontrados = 0;

let audioContext = null;


/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){

    return Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   ÁUDIO
===================================================== */

function iniciarAudio(){

    try{

        if(!audioContext){

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioCtx)
                return;

            audioContext =
                new AudioCtx();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }catch(e){

        console.warn(
            "Áudio indisponível.",
            e
        );

    }

}


function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.06
){

    if(!audioContext)
        return;

    try{

        const oscilador =
            audioContext.createOscillator();

        const ganho =
            audioContext.createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duracao
        );

        oscilador.connect(ganho);

        ganho.connect(
            audioContext.destination
        );

        oscilador.start();

        oscilador.stop(
            audioContext.currentTime +
            duracao
        );

    }catch(e){}

}


function somContagem(){

    tocarSom(
        tempoRestante <= 3
            ? 520
            : 360,
        .08,
        "square",
        .045
    );

}


function somDiamante(){

    tocarSom(
        620,
        .08,
        "sine",
        .06
    );

    setTimeout(
        () => tocarSom(
            900,
            .13,
            "sine",
            .05
        ),
        70
    );

}


function somBomba(){

    tocarSom(
        110,
        .35,
        "sawtooth",
        .12
    );

    setTimeout(
        () => tocarSom(
            55,
            .45,
            "square",
            .08
        ),
        80
    );

}


function somVitoria(){

    tocarSom(
        523,
        .12,
        "sine",
        .06
    );

    setTimeout(
        () => tocarSom(
            659,
            .12,
            "sine",
            .06
        ),
        100
    );

    setTimeout(
        () => tocarSom(
            784,
            .2,
            "sine",
            .07
        ),
        200
    );

}


/* =====================================================
   ATUALIZAR SALDO NA TELA
===================================================== */

function atualizarTelaSaldo(){

    saldoDisplay.textContent =
        "💰 Saldo: R$ " +
        dinheiro(saldoReal);

    if(
        saldoReal >= VALOR_APOSTA
    ){

        saldoDisplay.style.color =
            "#00ff88";

    }else{

        saldoDisplay.style.color =
            "#ff4141";

    }

}


/* =====================================================
   BUSCAR USUÁRIO LOGADO
===================================================== */

async function obterUsuario(){

    try{

        const resposta =
            await supabaseClient.auth.getSession();

        if(resposta.error){

            console.error(
                "Erro sessão:",
                resposta.error
            );

            return null;

        }

        return resposta.data?.session?.user || null;

    }catch(error){

        console.error(
            "Erro ao obter usuário:",
            error
        );

        return null;

    }

}


/* =====================================================
   CARREGAR SALDO REAL
===================================================== */

async function carregarSaldo(){

    if(!usuarioAtual){

        throw new Error(
            "Usuário não encontrado."
        );

    }

    const {data,error} =
        await supabaseClient
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .maybeSingle();

    if(error){

        console.error(
            "Erro Supabase ao carregar saldo:",
            error
        );

        throw new Error(
            "Supabase: " +
            error.message
        );

    }

    if(!data){

        throw new Error(
            "Não existe saldo cadastrado para esta conta."
        );

    }

    saldoReal =
        Number(data.valor || 0);

    atualizarTelaSaldo();

}


/* =====================================================
   SALVAR SALDO
===================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {data,error} =
        await supabaseClient
        .from("saldos")
        .update({
            valor:valorFinal
        })
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .select("valor")
        .maybeSingle();

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        return false;

    }

    if(!data){

        console.error(
            "Nenhuma linha de saldo foi atualizada."
        );

        return false;

    }

    saldoReal =
        Number(data.valor);

    atualizarTelaSaldo();

    return true;

}


/* =====================================================
   DEBITAR APOSTA
===================================================== */

async function debitarAposta(){

    if(!usuarioAtual)
        return false;

    if(
        saldoReal <
        VALOR_APOSTA
    ){

        return false;

    }

    const novoSaldo =
        Number(
            (
                saldoReal -
                VALOR_APOSTA
            ).toFixed(2)
        );

    /*
      O dinheiro é descontado ANTES
      da rodada começar.
    */

    const sucesso =
        await salvarSaldo(
            novoSaldo
        );

    return sucesso;

}


/* =====================================================
   CREDITAR PRÊMIO
===================================================== */

async function creditarPremio(valor){

    if(!usuarioAtual)
        return false;

    const novoSaldo =
        Number(
            (
                saldoReal +
                Number(valor)
            ).toFixed(2)
        );

    return await salvarSaldo(
        novoSaldo
    );

}


/* =====================================================
   CRIAR BOMBAS
===================================================== */

function criarBombas(){

    bombas = [];

    while(
        bombas.length <
        QUANTIDADE_BOMBAS
    ){

        const posicao =
            Math.floor(
                Math.random() * 9
            );

        if(
            !bombas.includes(
                posicao
            )
        ){

            bombas.push(
                posicao
            );

        }

    }

}


/* =====================================================
   CRIAR TABULEIRO
===================================================== */

function criarTabuleiro(){

    grid.innerHTML = "";

    for(
        let i = 0;
        i < 9;
        i++
    ){

        const cell =
            document.createElement("div");

        cell.className =

        cell.textContent =

        cell.dataset.index =

        cell.addEventListener(
            "click",

            }
        );

        grid.appendChild(

        );

    }

}


/* =====================================================
   CONTAGEM
===================================================== */

function iniciarContagem(){

    clearInterval(
        intervaloTempo
    );

    tempoRestante =
        TEMPO_RODADA;

    atualizarContagem();

    intervaloTempo =
        setInterval(
            function(){

                if(!jogando)
                    return;

                tempoRestante--;

                atualizarContagem();

                somContagem();

                if(
                    tempoRestante <= 0
                ){

                    clearInterval(
                        intervaloTempo
                    );

                    tempoEsgotado();

                }

            },
            1000
        );

}


function atualizarContagem(){

    tempo.textContent =
        "⏱️ " +
        tempoRestante +
        "s";

    const porcentagem =
        Math.max(
            0,
            tempoRestante /
            TEMPO_RODADA
        );

    barra.style.transform =
        "scaleX(" +
        porcentagem +
        ")";

    if(
        tempoRestante <= 3
    ){

        tempo.classList.add(
            "perigo"
        );

    }else{

        tempo.classList.remove(
            "perigo"
        );

    }

}


/* =====================================================
   NOVO JOGO
===================================================== */

async function iniciarJogo(){

    iniciarAudio();

    if(jogando){

        premio.textContent =
            "⚠️ Termine a rodada atual.";

        return;

    }

    if(!usuarioAtual){

        premio.textContent =
            "❌ Conta não carregada.";

        return;

    }

    if(
        saldoReal <
        VALOR_APOSTA
    ){

        premio.textContent =
            "💰 Saldo insuficiente.";

        atualizarTelaSaldo();

        return;

    }

    botao.disabled = true;

    premio.textContent =
        "💰 Descontando aposta...";

    /*
      PRIMEIRO DESCONTA.
      SÓ DEPOIS COMEÇA O JOGO.
    */

    const debitado =
        await debitarAposta();

    if(!debitado){

        botao.disabled = false;

        premio.textContent =
            "❌ Não foi possível descontar a aposta.";

        await carregarSaldoComErroSeguro();

        return;

    }

    jogando = true;

    rodadaEncerrada = false;

    diamantesEncontrados = 0;

    criarBombas();

    criarTabuleiro();

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.textContent =
        "💎 Encontre os diamantes!";

    botao.textContent =
        "🎯 RODADA EM ANDAMENTO";

    iniciarContagem();

    atualizarTelaSaldo();

}


/* =====================================================
   ABRIR CASA
===================================================== */

function abrirCasa(
    cell,
    indice
){

    iniciarAudio();

    if(
        !jogando ||
        rodadaEncerrada ||
        !cell
    ){

        return;

    }

    if(
        cell.classList.contains(
            "revealed"
        ) ||
        cell.classList.contains(
            "bomb"
        ) ||
        cell.classList.contains(
            "bloqueada"
        )
    ){

        return;

    }

    cell.classList.add(
        "abrindo"
    );

    setTimeout(
        async function(){

            if(
                !jogando ||
                rodadaEncerrada
            ){

                cell.classList.remove(
                    "abrindo"
                );

                return;

            }

            cell.classList.remove(
                "abrindo"
            );

            /*
              BOMBA
            */

            if(
                bombas.includes(
                    indice
                )
            ){

                cell.classList.add(
                    "bomb"
                );

                cell.textContent =
                    "💣";

                somBomba();

                perderRodada();

                return;

            }

            /*
              DIAMANTE
            */

            cell.classList.add(
                "revealed"
            );

            cell.textContent =
                "💎";

            diamantesEncontrados++;

            somDiamante();

            /*
              Credita o prêmio
              imediatamente.
            */

            const creditado =
                await creditarPremio(
                    PREMIO_DIAMANTE
                );

            if(!creditado){

                rodadaEncerrada = true;
                jogando = false;

                clearInterval(
                    intervaloTempo
                );

                premio.textContent =
                    "❌ Erro ao creditar prêmio.";

                resultadoIcone.textContent =
                    "❌";

                resultadoTexto.textContent =
                    "Erro ao atualizar saldo.";

                resultadoTela.classList.add(
                    "mostrar"
                );

                botao.disabled = false;
                botao.textContent =
                    "💣 NOVO JOGO";

                return;

            }

            premio.textContent =
                "💎 + R$ " +
                dinheiro(
                    PREMIO_DIAMANTE
                );

            atualizarTelaSaldo();

            /*
              6 diamantes = vitória.
            */

            if(
                diamantesEncontrados >= 6
            ){

                ganharRodada();

            }

        },
        180
    );

}


/* =====================================================
   PERDEU
===================================================== */

function perderRodada(){

    if(
        rodadaEncerrada
    ){

        return;

    }

    rodadaEncerrada = true;

    jogando = false;

    clearInterval(
        intervaloTempo
    );

    tempo.textContent =
        "💥 BOOM!";

    tempo.classList.add(
        "perigo"
    );

    barra.style.transform =
        "scaleX(0)";

    /*
      NÃO DEVOLVE O R$ 1,00.

      A aposta já foi descontada
      antes da rodada começar.
    */

    premio.innerHTML =
        "💥 Você encontrou uma bomba!<br>" +
        "<small style='color:#ff5555'>" +
        "A aposta já foi descontada."
        + "</small>";

    revelarBombas();

    setTimeout(
        function(){

            resultadoIcone.textContent =
                "💣";

            resultadoTexto.innerHTML =
                "Você perdeu!<br>" +
                "<small style='font-size:14px;color:#ff5555'>" +
                "R$ " +
                dinheiro(VALOR_APOSTA) +
                " foi descontado."
                + "</small>";

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

    atualizarTelaSaldo();

}


/* =====================================================
   TEMPO ESGOTADO
===================================================== */

function tempoEsgotado(){

    if(
        rodadaEncerrada
    ){

        return;

    }

    rodadaEncerrada = true;

    jogando = false;

    tempo.textContent =
        "⏰ TEMPO ESGOTADO";

    tempo.classList.add(
        "perigo"
    );

    barra.style.transform =
        "scaleX(0)";

    premio.innerHTML =
        "⏰ O tempo acabou!<br>" +
        "<small style='color:#ff5555'>" +
        "A aposta já foi descontada."
        + "</small>";

    somBomba();

    revelarBombas();

    setTimeout(
        function(){

            resultadoIcone.textContent =
                "⏰";

            resultadoTexto.innerHTML =
                "Tempo esgotado!<br>" +
                "<small style='font-size:14px;color:#ff5555'>" +
                "R$ " +
                dinheiro(VALOR_APOSTA) +
                " foi descontado."
                + "</small>";

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

    atualizarTelaSaldo();

}


/* =====================================================
   REVELAR BOMBAS
===================================================== */

function revelarBombas(){

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    cells.forEach(
        function(cell){

            cell.classList.add(
                "bloqueada"
            );

        }
    );

    bombas.forEach(
        function(indice, ordem){

            const cell =
                cells[indice];

            if(!cell)
                return;

            setTimeout(
                function(){

                    if(
                        !cell.classList.contains(
                            "bomb"
                        )
                    ){

                        cell.classList.add(
                            "bomb"
                        );

                        cell.textContent =
                            "💣";

                        tocarSom(
                            100 + ordem * 30,
                            .18,
                            "sawtooth",
                            .06
                        );

                    }

                },
                ordem * 220
            );

        }
    );

}


/* =====================================================
   VITÓRIA
===================================================== */

function ganharRodada(){

    if(
        rodadaEncerrada
    ){

        return;

    }

    rodadaEncerrada = true;

    jogando = false;

    clearInterval(
        intervaloTempo
    );

    tempo.classList.remove(
        "perigo"
    );

    tempo.textContent =
        "🏆 VITÓRIA!";

    barra.style.transform =
        "scaleX(1)";

    premio.textContent =
        "🏆 Vitória máxima!";

    somVitoria();

    revelarBombas();

    setTimeout(
        function(){

            resultadoIcone.textContent =
                "🏆";

            resultadoTexto.textContent =
                "Vitória máxima!";

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

    atualizarTelaSaldo();

}


/* =====================================================
   FECHAR RESULTADO
===================================================== */

function fecharResultado(){

    iniciarAudio();

    resultadoTela.classList.remove(
        "mostrar"
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

}


/* =====================================================
   CARREGAMENTO SEGURO DO SALDO
===================================================== */

async function carregarSaldoComErroSeguro(){

    try{

        await carregarSaldo();

        return true;

    }catch(error){

        console.error(
            error
        );

        saldoDisplay.textContent =
            "💰 Saldo: ERRO";

        saldoDisplay.style.color =
            "#ff4141";

        premio.innerHTML =
            "❌ ERRO NO SUPABASE<br>" +
            "<small style='font-size:11px;color:#aaa'>" +
            error.message +
            "</small>";

        return false;

    }

}

   AUTENTICAÇÃO

            window.location.href =

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciar(){

    try{

        premio.textContent =
            "🔐 Verificando conta...";

        usuarioAtual =
            await obterUsuario();

        if(!usuarioAtual){

            premio.textContent =
                "❌ Usuário não está logado.";

            botao.disabled = true;

            return;

        }

        /*
          AQUI ESTÁ A PARTE IMPORTANTE:
          usa o MESMO usuário da conta
          e a MESMA tabela saldos da Roleta.
        */

        await carregarSaldo();

        criarTabuleiro();

        tempo.textContent =
            "⏱️ 10s";

        barra.style.transform =
            "scaleX(1)";

        premio.textContent =
            "💎 Encontre os diamantes";

        botao.disabled = false;

        botao.textContent =
            "💣 NOVO JOGO";

        atualizarTelaSaldo();

    }catch(error){

        console.error(
            "ERRO AO INICIAR MINES:",
            error
        );

        saldoDisplay.textContent =
            "💰 Saldo: ERRO";

        saldoDisplay.style.color =
            "#ff4141";

        premio.innerHTML =
            "❌ ERRO AO CARREGAR CONTA<br>" +
            "<small style='font-size:11px;color:#aaa'>" +
            error.message +
            "</small>";

        botao.disabled = true;

        botao.textContent =
            "ERRO AO CARREGAR";

    }

}

        );

    }
);


/* =====================================================
   COMEÇAR
===================================================== */

iniciar();
