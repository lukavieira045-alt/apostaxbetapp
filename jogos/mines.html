<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - ApostaXBet</title>
    <style>
        body { background-color: #0f1923; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #00ff88; }
        #grid { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; justify-content: center; margin: 30px auto; }
        .cell { width: 70px; height: 70px; background: #1c2530; border: 2px solid #2a3b4c; border-radius: 8px; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cell.revealed { background: #00ff88; border-color: #00ff88; }
        .cell.bomb { background: #ff4444; border-color: #ff4444; }
        button { padding: 12px 25px; font-size: 16px; background: #00ff88; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        a { display: block; margin-top: 30px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>
    <h1>💣 Mines</h1>
    <div id="grid"></div>
    <button onclick="iniciarJogo()">Novo Jogo</button>
    <br><br>
    <a href="../index.html">Voltar para o Menu</a>

    <script>
        function iniciarJogo() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i=0; i<9; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = '?';
                cell.onclick = function() {
                    if(this.classList.contains('revealed') || this.classList.contains('bomb')) return;
                    const isBomb = Math.random() > 0.7;
                    if(isBomb) {
                        this.classList.add('bomb');
this.innerText = '💣';
                    } else {
                        this.classList.add('revealed');
                        this.innerText = '💎';
                    }
                };
                grid.appendChild(cell);
            }
        }
        iniciarJogo();
    </script>
</body>
</html>
