<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const VALOR_APOSTA = 1.00;
const PREMIO_DIAMANTE = 0.50;
const QUANTIDADE_BOMBAS = 3;
const TEMPO_RODADA = 10;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
document.getElementById("grid");

const saldoDisplay =
document.getElementById("saldo");

const premio =
document.getElementById("premio");

const tempo =
document.getElementById("tempo");

const barra =
document.getElementById("barraProgresso");

const botao =
document.getElementById("btnNovoJogo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoIcone =
document.getElementById("resultadoIcone");

const resultadoTexto =
document.getElementById("resultadoTexto");

const erroInicial =
document.getElementById("erroInicial");


/* =====================================================
   ESTADO
===================================================== */

let usuarioAtual = null;
let saldoReal = 0;

let bombas = [];
let jogando = false;
let tempoRestante = TEMPO_RODADA;
let intervaloTempo = null;
let rodadaEncerrada = false;
let diamantesEncontrados = 0;
let processandoSaldo = false;


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

    return "R$ " +
        Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   MOSTRAR SALDO
===================================================== */

function atualizarTelaSaldo(){

    saldoDisplay.textContent =
        "💰 Saldo: " +
        dinheiro(saldoReal);

}


/* =====================================================
   PEGAR USUÁRIO LOGADO
===================================================== */

async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase.auth.getSession();

    if(error){

        console.error(
            "Erro sessão:",
            error
        );

        return null;

    }

    return data?.session?.user || null;

}


/* =====================================================
   CARREGAR SALDO REAL DA CONTA
===================================================== */

async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .maybeSingle();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        mostrarErro(
            "❌ Não foi possível carregar o saldo."
        );

        return false;

    }

    /*
      Se ainda não existir uma linha
      para o usuário, cria com zero.
    */

    if(!data){

        const {
            error: erroCriar
        } =
        await supabase
            .from("saldos")
            .insert({
                user_id:usuarioAtual.id,
                valor:0
            });

        if(erroCriar){

            console.error(
                "Erro ao criar saldo:",
                erroCriar
            );

            mostrarErro(
                "❌ Não foi possível carregar sua conta."
            );

            return false;

        }

        saldoReal = 0;

    }else{

        saldoReal =
            Number(data.valor || 0);

    }

    atualizarTelaSaldo();

    return true;

}


/* =====================================================
   SALVAR SALDO
===================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        data,
        error
    } =
    await supabase
        .from("saldos")
        .update({
            valor:valorFinal
        })
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .select("valor")
        .maybeSingle();

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        return false;

    }

    if(!data){

        console.error(
            "Saldo não foi atualizado."
        );

        return false;

    }

    saldoReal =
        Number(data.valor || 0);

    atualizarTelaSaldo();

    return true;

}


/* =====================================================
   DEBITAR APOSTA
===================================================== */

async function debitarAposta(){

    if(processandoSaldo)
        return false;

    processandoSaldo = true;

    try{

        /*
          Busca o saldo mais recente
          diretamente no Supabase.
        */

        const {
            data,
            error
        } =
        await supabase
            .from("saldos")
            .select("valor")
            .eq(
                "user_id",
                usuarioAtual.id
            )
            .single();

        if(error){

            console.error(
                "Erro ao verificar saldo:",
                error
            );

            return false;

        }

        const saldoAtual =
            Number(data?.valor || 0);

        saldoReal =
            saldoAtual;

        atualizarTelaSaldo();

        if(
            saldoAtual <
            VALOR_APOSTA
        ){

            premio.textContent =
                "💰 Saldo insuficiente.";

            return false;

        }

        const novoSaldo =
            Number(
                (
                    saldoAtual -
                    VALOR_APOSTA
                ).toFixed(2)
            );

        /*
          O desconto acontece AQUI,
          antes da rodada começar.
        */

        const {
            data: atualizado,
            error: erroUpdate
        } =
        await supabase
            .from("saldos")
            .update({
                valor:novoSaldo
            })
            .eq(
                "user_id",
                usuarioAtual.id
            )
            .select("valor")
            .single();

        if(erroUpdate){

            console.error(
                "Erro ao debitar aposta:",
                erroUpdate
            );

            return false;

        }

        saldoReal =
            Number(
                atualizado.valor
            );

        atualizarTelaSaldo();

        return true;

    }finally{

        processandoSaldo = false;

    }

}


/* =====================================================
   CREDITAR PRÊMIO
===================================================== */

async function creditarPremio(valor){

    if(processandoSaldo)
        return false;

    processandoSaldo = true;

    try{

        const {
            data,
            error
        } =
        await supabase
            .from("saldos")
            .select("valor")
            .eq(
                "user_id",
                usuarioAtual.id
            )
            .single();

        if(error){

            console.error(
                "Erro ao buscar saldo:",
                error
            );

            return false;

        }

        const saldoAtual =
            Number(data?.valor || 0);

        const novoSaldo =
            Number(
                (
                    saldoAtual +
                    Number(valor)
                ).toFixed(2)
            );

        const {
            data: atualizado,
            error: erroUpdate
        } =
        await supabase
            .from("saldos")
            .update({
                valor:novoSaldo
            })
            .eq(
                "user_id",
                usuarioAtual.id
            )
            .select("valor")
            .single();

        if(erroUpdate){

            console.error(
                "Erro ao creditar prêmio:",
                erroUpdate
            );

            return false;

        }

        saldoReal =
            Number(
                atualizado.valor
            );

        atualizarTelaSaldo();

        return true;

    }finally{

        processandoSaldo = false;

    }

}


/* =====================================================
   ERRO INICIAL
===================================================== */

function mostrarErro(texto){

    erroInicial.textContent =
        texto;

    erroInicial.style.display =
        "block";

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

function iniciarAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }catch(e){

        console.warn(
            "Áudio indisponível.",
            e
        );

    }

}


function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.06
){

    if(!audioContext)
        return;

    try{

        const oscilador =
            audioContext.createOscillator();

        const ganho =
            audioContext.createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duracao
        );

        oscilador.connect(ganho);
        ganho.connect(
            audioContext.destination
        );

        oscilador.start();

        oscilador.stop(
            audioContext.currentTime +
            duracao
        );

    }catch(e){}

}

/* =====================================================
   BOMBAS
===================================================== */

function criarBombas(){

    bombas = [];

    while(
        bombas.length <
        QUANTIDADE_BOMBAS
    ){

        const posicao =
            Math.floor(
                Math.random() * 9
            );

        if(
            !bombas.includes(
                posicao
            )
        ){

            bombas.push(
                posicao
            );

        }

    }

}


/* =====================================================
   TABULEIRO
===================================================== */

function criarTabuleiro(){

    grid.innerHTML = "";

    for(
        let i=0;
        i<9;
        i++
    ){

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        cell.textContent =
            "?";

        cell.dataset.index =
            i;

        cell.addEventListener(
            "click",
            function(){

                abrirCasa(
                    cell,
                    i
                );

            }
        );

        grid.appendChild(
            cell
        );

    }

}


/* =====================================================
   CONTAGEM
===================================================== */

function iniciarContagem(){

    clearInterval(
        intervaloTempo
    );

    tempoRestante =
        TEMPO_RODADA;

    atualizarContagem();

    intervaloTempo =
        setInterval(
        function(){

            if(!jogando)
                return;

            tempoRestante--;

            atualizarContagem();

            somContagem();

            if(
                tempoRestante <= 0
            ){

                clearInterval(
                    intervaloTempo
                );

                tempoEsgotado();

            }

        },
        1000
        );

}


function atualizarContagem(){

    tempo.textContent =
        "⏱️ " +
        tempoRestante +
        "s";

    const porcentagem =
        Math.max(
            0,
            tempoRestante /
            TEMPO_RODADA
        );

    barra.style.transform =
        "scaleX(" +
        porcentagem +
        ")";

    if(
        tempoRestante <= 3
    ){

        tempo.classList.add(
            "perigo"
        );

    }else{

        tempo.classList.remove(
            "perigo"
        );

    }

}


/* =====================================================
   NOVO JOGO
===================================================== */

async function iniciarJogo(){

    iniciarAudio();

    if(jogando){

        premio.textContent =
            "⚠️ Termine a rodada atual.";

        return;

    }

    if(!usuarioAtual){

        premio.textContent =
            "❌ Conta não encontrada.";

        return;

    }

    botao.disabled = true;

    premio.textContent =
        "💰 Verificando saldo...";

    const debitado =
        await debitarAposta();

    if(!debitado){

        botao.disabled = false;

        if(
            saldoReal <
            VALOR_APOSTA
        ){

            premio.textContent =
                "💰 Saldo insuficiente.";

        }else{

            premio.textContent =
                "❌ Erro ao processar aposta.";

        }

        return;

    }

    jogando = true;
    rodadaEncerrada = false;
    diamantesEncontrados = 0;

    criarBombas();
    criarTabuleiro();

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.textContent =
        "💎 Encontre os diamantes!";

    botao.textContent =
        "🎯 RODADA EM ANDAMENTO";

    iniciarContagem();

}


/* =====================================================
   ABRIR CASA
===================================================== */

function abrirCasa(
    cell,
    indice
){

    iniciarAudio();

    if(
        !jogando ||
        rodadaEncerrada ||
        !cell
    ){

        return;

    }

    if(
        cell.classList.contains("revealed") ||
        cell.classList.contains("bomb") ||
        cell.classList.contains("bloqueada")
    ){

        return;

    }

    cell.classList.add(
        "abrindo"
    );

    setTimeout(
    async function(){

        if(
            !jogando ||
            rodadaEncerrada
        ){

            cell.classList.remove(
                "abrindo"
            );

            return;

        }

        cell.classList.remove(
            "abrindo"
        );

        if(
            bombas.includes(indice)
        ){

            cell.classList.add(
                "bomb"
            );

            cell.textContent =
                "💣";

            somBomba();

            perderRodada();

            return;

        }

        cell.classList.add(
            "revealed"
        );

        cell.textContent =
            "💎";

        diamantesEncontrados++;

        somDiamante();

        /*
          Prêmio creditado imediatamente
          na mesma conta.
        */

        const creditado =
            await creditarPremio(
                PREMIO_DIAMANTE
            );

        if(!creditado){

            console.error(
                "Não foi possível creditar o prêmio."
            );

            premio.textContent =
                "❌ Erro ao creditar prêmio.";

            return;

        }

        premio.textContent =
            "💎 + " +
            dinheiro(
                PREMIO_DIAMANTE
            );

        if(
            diamantesEncontrados >= 6
        ){

            ganharRodada();

        }

    },
    180
    );

}


/* =====================================================
   PERDEU
===================================================== */

function perderRodada(){

    if(rodadaEncerrada)
        return;

    rodadaEncerrada = true;
    jogando = false;

    clearInterval(
        intervaloTempo
    );

    tempo.textContent =
        "💥 BOOM!";

    tempo.classList.add(
        "perigo"
    );

    barra.style.transform =
        "scaleX(0)";

    premio.textContent =
        "💥 Você encontrou uma bomba!";

    revelarBombas();

    setTimeout(
    function(){

        resultadoIcone.textContent =
            "💣";

        resultadoTexto.textContent =
            "Você perdeu!";

        resultadoTela.classList.add(
            "mostrar"
        );

    },
    900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

}


/* =====================================================
   TEMPO ESGOTADO
===================================================== */

function tempoEsgotado(){

    if(rodadaEncerrada)
        return;

    rodadaEncerrada = true;
    jogando = false;

    tempo.textContent =
        "⏰ TEMPO ESGOTADO";

    tempo.classList.add(
        "perigo"
    );

    barra.style.transform =
        "scaleX(0)";

    premio.textContent =
        "⏰ O tempo acabou!";

    somBomba();

    revelarBombas();

    setTimeout(
    function(){

        resultadoIcone.textContent =
            "⏰";

        resultadoTexto.textContent =
            "Tempo esgotado!";

        resultadoTela.classList.add(
            "mostrar"
        );

    },
    900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

}


/* =====================================================
   REVELAR BOMBAS
===================================================== */

function revelarBombas(){

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    cells.forEach(
        function(cell){

            cell.classList.add(
                "bloqueada"
            );

        }
    );

    bombas.forEach(
        function(indice,ordem){

            const cell =
                cells[indice];

            if(!cell)
                return;

            setTimeout(
            function(){

                if(
                    !cell.classList.contains(
                        "bomb"
                    )
                ){

                    cell.classList.add(
                        "bomb"
                    );

                    cell.textContent =
                        "💣";

                    tocarSom(
                        100 + ordem * 30,
                        .18,
                        "sawtooth",
                        .06
                    );

                }

            },
            ordem * 220
            );

        }
    );

}


/* =====================================================
   VITÓRIA
===================================================== */

function ganharRodada(){

    if(rodadaEncerrada)
        return;

    rodadaEncerrada = true;
    jogando = false;

    clearInterval(
        intervaloTempo
    );

    tempo.classList.remove(
        "perigo"
    );

    tempo.textContent =
        "🏆 VITÓRIA!";

    barra.style.transform =
        "scaleX(1)";

    premio.textContent =
        "🏆 Vitória máxima!";

    somVitoria();

    revelarBombas();

    setTimeout(
    function(){

        resultadoIcone.textContent =
            "🏆";

        resultadoTexto.textContent =
            "Vitória máxima!";

        resultadoTela.classList.add(
            "mostrar"
        );

    },
    900
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

}


/* =====================================================
   FECHAR RESULTADO
===================================================== */

function fecharResultado(){

    iniciarAudio();

    resultadoTela.classList.remove(
        "mostrar"
    );

    botao.disabled = false;

    botao.textContent =
        "💣 NOVO JOGO";

}

);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciarPagina(){

    try{

        botao.disabled = true;

        premio.textContent =
            "🔄 Carregando conta...";

        criarTabuleiro();

        usuarioAtual =
            await obterUsuario();

        if(!usuarioAtual){

            mostrarErro(
                "❌ Você precisa estar logado para jogar."
            );

            premio.textContent =
                "❌ Faça login primeiro.";

            botao.disabled = true;

            return;

        }

        const carregou =
            await carregarSaldo();

        if(!carregou){

            botao.disabled = true;

            return;

        }

        erroInicial.style.display =
            "none";

        premio.textContent =
            "💎 Encontre os diamantes";

        botao.disabled = false;

        botao.textContent =
            "💣 NOVO JOGO";

    }catch(error){

        console.error(
            "Erro ao iniciar Mines:",
            error
        );

        mostrarErro(
            "❌ Erro ao carregar o jogo."
        );

        premio.textContent =
            "❌ Não foi possível carregar.";

        botao.disabled = true;

    }

}


/* =====================================================
   BOTÃO
===================================================== */

botao.addEventListener(
    "click",
    iniciarJogo
);


/* =====================================================
   ÁUDIO POR INTERAÇÃO
===================================================== */

document.addEventListener(
    "click",
    iniciarAudio,
    {once:true}
);


/* =====================================================
   INICIAR
===================================================== */

iniciarPagina();


/* =====================================================
   SEGURANÇA AO SAIR
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        clearInterval(
            intervaloTempo
        );

    }
);

</script>
