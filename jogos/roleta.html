    15%{

    }

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =====================================================
   SUPABASE
   NÃO ALTERADO
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1.00;

let rotacaoAtual = 0;

let girando = false;


/* =====================================================
   MÚSICA
===================================================== */

const musicaRoleta =
document.getElementById("musicaRoleta");

musicaRoleta.volume = 0.10;

let musicaIniciada = false;

function iniciarMusica(){

    if(musicaIniciada)
        return;

    if(!musicaRoleta)
        return;

    musicaRoleta.volume = 0.10;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(function(){

            musicaIniciada = true;

        })
        .catch(function(){});

    }

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 70;


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    iniciarMusica();

}


function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        180,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        80,
        agora + 0.08
    );

    ganho.gain.setValueAtTime(
        1.0,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.08
    );

    oscilador.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(agora);

    oscilador.stop(
        agora + 0.08
    );

}


/* =====================================================
   SOM DA ROLETA
===================================================== */

function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 70;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        850,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        420,
        agora + 0.035
    );

    ganho.gain.setValueAtTime(
        0.45,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.055
    );

    oscilador.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(agora);

    oscilador.stop(
        agora + 0.06
    );

    velocidadeSom += 7;

    if(
        velocidadeSom > 240
    ){

        velocidadeSom = 240;

    }

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(
            timerRoleta
        );

        timerRoleta = null;

    }

}


/* =====================================================
   SOM DE PRÊMIO
===================================================== */

function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [523.25,659.25,783.99,1046.50];

    notas.forEach(
        function(frequencia,i){

            const oscilador =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                (i * 0.12);

            oscilador.type =
                "sine";

            oscilador.frequency.setValueAtTime(
                frequencia,
                inicio
            );

            ganho.gain.setValueAtTime(
                1.0,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                inicio + 0.45
            );

            oscilador.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            oscilador.start(inicio);

            oscilador.stop(
                inicio + 0.45
            );

        }
    );

}


/* =====================================================
   SOM SUPER BÔNUS
===================================================== */

function tocarSuperBonus(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [
            523.25,
            659.25,
            783.99,
            1046.50,
            1318.51
        ];

    notas.forEach(
        function(freq,i){

            const osc =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                i * 0.10;

            osc.type =
                "sine";

            osc.frequency.setValueAtTime(
                freq,
                inicio
            );

            ganho.gain.setValueAtTime(
                0.9,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                inicio + 0.8
            );

            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            osc.start(inicio);

            osc.stop(
                inicio + 0.8
            );

        }
    );

}

async function carregarSaldo(){

    const {
        data,
        error
    } =
    await supabase
    .from("saldos")
    .select("valor")
    .eq(
        "user_id",

    )
    .single();

    if(error){

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO ATUALIZAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        valorFinal;

    atualizarSaldo();

    return true;

}


/* =====================================================
   CRIAR CASAS
===================================================== */

function criarNumeros(){

    const area =
        document.getElementById(
            "numeros"
        );

    area.innerHTML = "";

    const total =
        premios.length;

    for(
        let i = 0;
        i < total;
        i++
    ){

        const numero =
            document.createElement(
                "div"
            );

        numero.className =
            "numero";

        const conteudo =
            document.createElement(
                "span"
            );

        conteudo.className =
            "numero-conteudo";

        if(i === indiceSuperBonus){

            numero.classList.add(
                "super"
            );

            conteudo.innerHTML =
                "⚡<br>SUPER<br>R$ 10";

        }else{

            conteudo.innerText =
                dinheiro(
                    premios[i]
                );

        }

        numero.appendChild(
            conteudo
        );

        const angulo =
            (
                i *
                (360 / total)
            ) - 90;

        /*
           Raio menor para deixar
           as casas bem posicionadas
           dentro da roleta.
        */

        const raio = 38;

        const x =
            Math.cos(
                angulo *
                Math.PI / 180
            ) * raio;

        const y =
            Math.sin(
                angulo *
                Math.PI / 180
            ) * raio;

        numero.style.transform =
            `translate(${x}px,${y}px) rotate(${angulo + 90}deg)`;

        numero.dataset.index =
            i;

        area.appendChild(
            numero
        );

    }

}

/* =====================================================
   GIRO MANUAL
   COMEÇA DEVAGAR
   ACELERA
   FICA MUITO TEMPO
   PARA LENTAMENTE
===================================================== */

function animarRoleta(
    rotacaoFinal,
    duracao,
    callback
){

    const inicio =
        performance.now();

    const rotacaoInicial =
        rotacaoAtual;

    function easeInOutCubic(t){

        if(t < 0.5){

            return 4 * t * t * t;

        }

        return 1 -
            Math.pow(
                -2 * t + 2,
                3
            ) / 2;

    }

    function animar(agora){

        const tempo =
            agora - inicio;

        let progresso =
            tempo / duracao;

        if(progresso > 1)
            progresso = 1;

        const suavizado =
            easeInOutCubic(
                progresso
            );

        const rotacao =
            rotacaoInicial +
            (
                rotacaoFinal -
                rotacaoInicial
            ) *
            suavizado;

        roleta.style.transform =
            `rotate(${rotacao}deg)`;

        if(progresso < 1){

            requestAnimationFrame(
                animar
            );

        }else{

            rotacaoAtual =
                rotacaoFinal;

            callback();

        }

    }

    requestAnimationFrame(
        animar
    );

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();

    if(!usuarioAtual){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }

    girando = true;

    atualizarBotao();

    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    /*
       MESMO DÉBITO DO SEU CÓDIGO.
    */

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }

    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";

    document
    .querySelectorAll(
        ".numero"
    )
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );

    iniciarSomRoleta();

    iniciarEfeitoNumeros();

    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];

    const tamanhoCasa =
        360 /
        premios.length;

    const anguloPremio =
        indice *
        tamanhoCasa;

    /*
       MAIS VOLTAS:
       a roleta fica girando
       por bastante tempo.
    */

    const voltas =
        360 * 10;

    const novaRotacao =
        rotacaoAtual +
        voltas +
        (360 - anguloPremio);

    /*
       9 segundos de animação.

       A função começa lenta,
       acelera no meio
       e desacelera lentamente
       no final.
    */

    animarRoleta(
        novaRotacao,
        9000,
        function(){

            finalizarRodada(
                indice,
                premio
            );

        }
    );

};


/* =====================================================
   FINALIZAR RODADA
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();

    pararEfeitoNumeros();

    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );

    if(numero){

        numero.classList.add(
            "destaque"
        );

    }

    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio;

    /*
       MESMO CRÉDITO DO SEU CÓDIGO.
       NÃO FOI CRIADO OUTRO SALDO.
    */

    const creditado =
        await salvarSaldo(
            novoSaldo
        );

    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }

    /* =================================================
       SUPER BÔNUS
    ================================================= */

    if(
        premio === 10
    ){

        tocarSuperBonus();

        superBonusOverlay
        .classList
        .add("ativo");

        resultado.innerHTML =
            "⚡ SUPER BÔNUS ⚡<br>" +
            "<span style='font-size:28px;color:#ffe36a'>" +
            "R$ 10,00" +
            "</span>";

        resultado.style.color =
            "#ffe36a";

        setTimeout(
            function(){

                superBonusOverlay
                .classList
                .remove("ativo");

            },
            3300
        );

    }

    /*
       SOM NORMAL
    */

    else{

        tocarPremio();

        /*
           IMPORTANTE:
           O resultado agora verifica
           se o prêmio foi maior ou igual
           à aposta.

           Assim um prêmio de R$ 1,00,
           com aposta de R$ 1,00,
           NÃO aparece como "PERDEU".
        */

        if(
            premio >= valorAposta
        ){

            resultado.innerHTML =
                "⚡ VOCÊ GANHOU ⚡<br>" +
                "<span style='font-size:25px;color:#ffe36a'>" +
                dinheiro(premio) +
                "</span>";

            resultado.style.color =
                "#ffe36a";

        }else{

            resultado.innerHTML =
                "❌ VOCÊ PERDEU<br>" +
                "<span style='font-size:25px;color:#ff5555'>" +
                dinheiro(premio) +
                "</span>";

            resultado.style.color =
                "#ff5555";

        }

    }

    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1800
    );

}
