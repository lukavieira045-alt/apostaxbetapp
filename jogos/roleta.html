/* =====================================================
   ROLETA
===================================================== */

.roleta-area{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:10px;
}

.roleta{
    width:min(94vw,400px);
    height:min(94vw,400px);

    border-radius:50%;
    position:relative;

    border:5px solid #d7ae31;

    background:
    radial-gradient(
        circle,
        #17221f 0 17%,
        #060a09 18% 27%,
        #101918 28% 100%
    );

    box-shadow:
    0 0 8px #ffd84a,
    0 0 25px rgba(255,205,45,.45),
    0 0 55px rgba(255,190,20,.2),
    inset 0 0 25px #000;

    /*
       Começa devagar e demora bastante
       para desacelerar.
    */
    transition:
        transform 8.5s cubic-bezier(.12,.02,.08,1);

    overflow:hidden;
}

/* Anel externo */
.roleta::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;

    border:12px solid #101a21;

    box-shadow:
    inset 0 0 8px #000,
    0 0 4px #000;

    z-index:3;
}

/* Divisões das casas */
.roleta::after{
    content:"";
    position:absolute;
    inset:25px;

    border-radius:50%;

    background:
    repeating-conic-gradient(
        from -9deg,
        rgba(255,225,100,.9) 0deg 1.5deg,
        transparent 1.5deg 18deg
    );

    z-index:2;

    pointer-events:none;
}

/* Parte interna */
.roleta-inner{
    position:absolute;

    inset:27px;

    border-radius:50%;

    background:
    repeating-conic-gradient(
        from -9deg,
        #24574f 0deg 9deg,
        #668c82 9deg 18deg
    );

    box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px #ffe05b;

    z-index:1;
}

/* =====================================================
   CASAS DOS PRÊMIOS
   Cada valor fica radialmente distribuído.
===================================================== */

.numeros{
    position:absolute;
    inset:27px;

    border-radius:50%;

    z-index:7;

    pointer-events:none;
}

/*
   Cada casa ocupa uma fatia da roleta.
   NÃO existe quadrado ao redor do número.
*/
.numero{
    position:absolute;

    left:50%;
    top:50%;

    width:52px;
    height:145px;

    margin-left:-26px;
    margin-top:-72.5px;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    flex-direction:column;

    color:#fff1a1;

    font-size:22px;
    font-weight:1000;

    text-shadow:
        0 2px 2px #000,
        0 0 6px #000,
        0 0 12px rgba(255,220,70,.8);

    /*
       A própria casa fica em pé.
       O número acompanha a casa.
    */
    transform-origin:26px 72.5px;

    background:transparent;

    border:none;
    border-radius:0;

    box-shadow:none;

    overflow:visible;
}

/*
   Separação visual das casas.
   Somente uma linha fina, sem quadrado.
*/
.numero::after{
    content:"";

    position:absolute;

    top:-3px;
    bottom:-3px;

    left:50%;

    width:1px;

    background:
    linear-gradient(
        transparent,
        rgba(255,225,100,.65),
        transparent
    );

    transform:translateX(-50%);
}

/*
   Texto realmente vertical:
   um caractere embaixo do outro.
*/
.numero-conteudo{
    width:100%;
    height:auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:flex-start;

    gap:0;

    white-space:normal;

    line-height:.88;

    transform:none;

    writing-mode:vertical-rl;
    text-orientation:upright;

    font-size:22px;
    font-weight:1000;

    letter-spacing:0;

    padding-top:8px;

    position:relative;
    z-index:3;
}

/*
   Para valores monetários,
   usamos caracteres empilhados.
*/
.numero-conteudo .linha{
    display:block;
    height:20px;
    line-height:20px;
}

/* SUPER BÔNUS */
.numero.super{
    color:#fff;
    font-size:18px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffd83d,
        0 0 25px #ff9d00,
        0 0 35px #ff6a00;
}

.numero.super .numero-conteudo{
    font-size:17px;
    line-height:1;
    padding-top:3px;
}

/* PERDER */
.numero.perder{
    color:#ff5d5d;

    text-shadow:
        0 2px 2px #000,
        0 0 8px #ff0000,
        0 0 18px rgba(255,0,0,.8);
}

.numero.perder .numero-conteudo{
    font-size:18px;
    line-height:.95;
    padding-top:4px;
}

/* Número vencedor */
.numero.destaque{
    color:#fff;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffe36a,
        0 0 25px #ffb300,
        0 0 40px #fff;

    filter:brightness(1.35);

    z-index:20;
}

.numero.destaque::before{
    content:"";

    position:absolute;

    width:68px;
    height:155px;

    top:-5px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
    radial-gradient(
        ellipse,
        rgba(255,220,70,.35),
        transparent 65%
    );

    animation:
    pulsarPremio .6s infinite alternate;

    z-index:-1;
}

@keyframes pulsarPremio{

    from{
        transform:translateX(-50%) scale(.85);
        opacity:.5;
    }

    to{
        transform:translateX(-50%) scale(1.15);
        opacity:1;
    }

}

/* =====================================================
   ANIMAÇÃO DOS NÚMEROS DURANTE GIRO
===================================================== */

.roleta.girando .numero-conteudo{
    animation:
    numeroGiro .35s linear infinite;
}

@keyframes numeroGiro{

    0%{
        opacity:.75;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.04);
    }

    100%{
        opacity:.75;
        transform:scale(1);
    }

}

/* =====================================================
   CENTRO
===================================================== */

.centro{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:82px;
    height:82px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #283d38,
        #08100e 65%,
        #020303
    );

    border:4px solid #d5ad36;

    z-index:12;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 15px rgba(255,211,53,.55),
    inset 0 0 15px #000;
}

.centro strong{
    color:#ffe36a;
    font-size:18px;
    letter-spacing:2px;
}

.centro span{
    color:#777;
    font-size:8px;
    letter-spacing:2px;
}

/* Ponteiro */
.ponteiro{
    position:absolute;

    z-index:20;

    top:-3px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:27px solid white;

    filter:
    drop-shadow(0 0 4px white)
    drop-shadow(0 0 9px #ffe66b);
}

/* Raios */
.raio{
    position:absolute;

    width:100px;
    height:4px;

    background:white;

    opacity:.7;

    z-index:18;

    box-shadow:
    0 0 5px white,
    0 0 15px #dfffca;

    animation:piscar .7s infinite alternate;
}

.raio1{
    left:4px;
    bottom:50px;
    transform:rotate(-35deg);
}

.raio2{
    right:4px;
    top:65px;
    transform:rotate(35deg);
}

.raio3{
    left:45px;
    top:20px;
    width:70px;
    transform:rotate(65deg);
}

@keyframes piscar{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }

}

/* =====================================================
   SUPER BÔNUS
===================================================== */

.super-bonus-effect{
    position:fixed;

    inset:0;

    z-index:500;

    pointer-events:none;

    display:none;

    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle,
        rgba(255,230,70,.35),
        rgba(0,0,0,.82) 65%
    );

    animation:bonusTela 2.4s ease-out forwards;
}

.super-bonus-effect.ativo{
    display:flex;
}

.super-texto{
    text-align:center;

    color:#fff;

    font-size:34px;
    font-weight:1000;

    letter-spacing:3px;

    text-shadow:
    0 0 5px #fff,
    0 0 15px #ffe000,
    0 0 30px #ff9d00,
    0 0 60px #ff4d00;

    animation:
    bonusTexto 2.4s ease-out forwards;
}

.super-texto span{
    display:block;
    font-size:52px;
    margin-top:8px;
}

@keyframes bonusTela{

    0%{
        opacity:0;
        transform:scale(.4);
    }

    15%{
        opacity:1;
        transform:scale(1.08);
    }

    70%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.25);
    }

}

@keyframes bonusTexto{

    0%{
        transform:scale(.3) rotate(-8deg);
        opacity:0;
    }

    15%{
        transform:scale(1.15) rotate(3deg);
        opacity:1;
    }

    35%{
        transform:scale(1) rotate(0deg);
    }

    75%{
        transform:scale(1.08);
        opacity:1;
    }

    100%{
        transform:scale(1.4);
        opacity:0;
    }

}

/* =====================================================
   RESULTADO
===================================================== */

.resultado{
    min-height:52px;

/* =====================================================

===================================================== */

.painel{

.ficha{

}

.valores{

    margin-bottom:8px;

.btn-valor{

    background:#090b0c;

    border-radius:4px;

}

.btn-valor.ativo{
    color:#ffe36a;

    border-color:#ffe36a;

}

.btn-apostar{
    width:100%;

    margin-top:9px;

    font-size:16px;
    font-weight:900;

.info{

.info strong{

}

.mensagem{
    text-align:center;

    color:#555;

    font-size:9px;

    margin-top:8px;
}

.repeat-btn,
.menu-btn{
    position:fixed;

    bottom:15px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid #777;

    background:#090b0c;

    color:#ddd;

    font-size:23px;

    z-index:40;
}

.repeat-btn{
    left:8px;
}

.menu-btn{

#carregando{
    position:fixed;

    }

    .numero-conteudo{
        font-size:18px;
    }

}

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1.00;

let rotacaoAtual = 0;

let girando = false;


/* =====================================================
   MÚSICA
===================================================== */

const musicaRoleta =
document.getElementById("musicaRoleta");

musicaRoleta.volume = 0.10;

let musicaIniciada = false;

function iniciarMusica(){

    if(musicaIniciada)
        return;

    if(!musicaRoleta)
        return;

    musicaRoleta.volume = 0.10;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(function(){

            musicaIniciada = true;

        })
        .catch(function(){});

    }

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 55;


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    iniciarMusica();

}


/* =====================================================
   CLIQUE
===================================================== */

function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        180,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        80,
        agora + 0.08
    );

    ganho.gain.setValueAtTime(
        1.0,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.08
    );

    oscilador.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(agora);

    oscilador.stop(
        agora + 0.08
    );

}


/* =====================================================
   SOM DA ROLETA
===================================================== */

function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 55;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        850,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        420,
        agora + 0.035
    );

    ganho.gain.setValueAtTime(
        0.45,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.055
    );

    oscilador.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(agora);

    oscilador.stop(
        agora + 0.06
    );

    velocidadeSom += 9;

    if(velocidadeSom > 300)
        velocidadeSom = 300;

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(
            timerRoleta
        );

        timerRoleta = null;

    }

}


/* =====================================================
   SOM DE PRÊMIO
===================================================== */

function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [523.25,659.25,783.99,1046.50];

    notas.forEach(
        function(frequencia,i){

            const oscilador =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                (i * 0.12);

            oscilador.type =
                "sine";

            oscilador.frequency.setValueAtTime(
                frequencia,
                inicio
            );

            ganho.gain.setValueAtTime(
                1.0,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                inicio + 0.45
            );

            oscilador.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            oscilador.start(inicio);

            oscilador.stop(
                inicio + 0.45
            );

        }
    );

}

/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

    return "R$ " +
        Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   SALDO
   MESMO SISTEMA DO SEU CÓDIGO
===================================================== */

function atualizarSaldo(){

    saldoEl.innerText =
        dinheiro(saldoReal);

    saldoPainel.innerText =
        dinheiro(saldoReal);

    if(
        saldoReal < valorAposta
    ){

/* =====================================================

===================================================== */

async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
    .auth
    .getSession();

    if(error){

/* =====================================================
   CARREGAR SALDO
   NÃO CRIA OUTRO SALDO
===================================================== */

async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
    .from("saldos")
    .select("valor")
    .eq(
        "user_id",
        usuarioAtual.id
    )
    .single();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO CARREGAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        Number(
            data?.valor || 0
        );

    atualizarSaldo();

    return true;

}


/* =====================================================
   SALVAR SALDO
   MESMA TABELA E MESMO CAMPO
===================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO ATUALIZAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        valorFinal;

    atualizarSaldo();

    return true;

}


/* =====================================================
   CRIAR AS CASAS
===================================================== */

function criarNumeros(){

    const area =
        document.getElementById("numeros");

    area.innerHTML = "";

    const total =
        premios.length;

    for(
        let i = 0;
        i < total;
        i++
    ){

        const numero =
            document.createElement("div");

        numero.className =
            "numero";

        /*
           O conteúdo será empilhado
           caractere por caractere.
        */
        const conteudo =
            document.createElement("div");

        conteudo.className =
            "numero-conteudo";

        let texto;

        if(premios[i] === 0){

            texto = "PERDER";

            numero.classList.add(
                "perder"
            );

        }
        else if(premios[i] === 10){

            texto = "SUPERBÔNUS";

            numero.classList.add(
                "super"
            );

        }
        else{

            texto =
                Number(premios[i])
                .toFixed(2)
                .replace(".",",");

        }

        /*
           Coloca cada caractere
           em sua própria linha.
        */
        [...texto].forEach(
            function(char){

                const linha =
                    document.createElement(
                        "span"
                    );

                linha.className =
                    "linha";

                linha.innerText =
                    char;

                conteudo.appendChild(
                    linha
                );

            }
        );

        numero.appendChild(
            conteudo
        );

        numero.dataset.index =
            i;

        /*
           Cada casa fica distribuída
           exatamente em círculo.
        */
        const angulo =
            i *
            (360 / total);

        numero.style.transform =
            `rotate(${angulo}deg)`;

        area.appendChild(
            numero
        );

    }

}

/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

    if(girando){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "ROLETA GIRANDO...";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "SALDO INSUFICIENTE";

        return;

    }

    btnApostar.disabled =
        false;

    btnApostar.innerText =
        "GIRAR ROLETA";

}

   EFEITO
===================================================== */

function iniciarEfeitoNumeros(){

    roleta.classList.add(
        "girando"
    );

}


function pararEfeitoNumeros(){

    roleta.classList.remove(
        "girando"
    );

}


/* =====================================================
   SUPER BÔNUS
===================================================== */

function mostrarSuperBonus(){

    superBonusEffect.classList.remove(
        "ativo"
    );

    /*
       força reinício da animação
    */
    void superBonusEffect.offsetWidth;

    superBonusEffect.classList.add(
        "ativo"
    );

    setTimeout(
        function(){

            superBonusEffect.classList.remove(
                "ativo"
            );

        },
        2500
    );

}


/* =====================================================
   GIRAR
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();

    if(!usuarioAtual){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }

    girando = true;

    atualizarBotao();

    /*
       SOMENTE debita a aposta.
       Continua usando o saldo real existente.
    */
    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }

    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";

    document
    .querySelectorAll(
        ".numero"
    )
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );

    iniciarSomRoleta();

    iniciarEfeitoNumeros();

    /*
       Sorteia exatamente uma das casas.
    */
    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];

    const total =
        premios.length;

    const tamanhoCasa =
        360 / total;

    /*
       A casa selecionada vai para
       o ponteiro superior.
    */
    const anguloPremio =
        indice *
        tamanhoCasa;

    /*
       MAIS voltas e desaceleração longa.
       O CSS transition também controla
       a saída lenta.
    */
    const voltas =
        360 * 10;

    const novaRotacao =
        rotacaoAtual +
        voltas +
        (360 - anguloPremio);

    roleta.style.transform =
        `rotate(${novaRotacao}deg)`;

    rotacaoAtual =
        novaRotacao;

    /*
       8,5 segundos de giro.
    */
    setTimeout(
        function(){

            finalizarRodada(
                indice,
                premio
            );

        },
        8500
    );

};


/* =====================================================
   FINALIZAR
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();

    pararEfeitoNumeros();

    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );

    if(numero){

        numero.classList.add(
            "destaque"
        );

    }

    /*
       PERDER:
       a aposta já foi debitada.
       Não devolve dinheiro.
    */
    if(premio === 0){

        resultado.innerHTML =
            "❌ PERDEU<br>" +
            "<span style='font-size:22px;color:#ff5555'>" +
            dinheiro(valorAposta) +
            "</span>";

        resultado.style.color =
            "#ff5555";

        girando = false;

        atualizarBotao();

        return;

    }

    /*
       GANHOU:
       adiciona o prêmio ao saldo
       real já existente.
    */
    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio;

    const creditado =
        await salvarSaldo(
            novoSaldo
        );

    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }

    /*
       SUPER BÔNUS
    */
    if(premio === 10){

        mostrarSuperBonus();

        tocarPremio();

        resultado.innerHTML =
            "⚡ SUPER BÔNUS ⚡<br>" +
            "<span style='font-size:30px;color:#fff'>" +
            "R$ 10,00" +
            "</span>";

        resultado.style.color =
            "#ffe36a";

    }
    else{

        tocarPremio();

        resultado.innerHTML =
            "⚡ PRÊMIO<br>" +
            "<span style='font-size:25px;color:#ffe36a'>" +
            dinheiro(premio) +
            "</span>";

        resultado.style.color =
            "#ffe36a";

    }

    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1500
    );

}

/* =====================================================

===================================================== */

async function iniciar(){

    try{

        usuarioAtual =
            await obterUsuario();

        if(!usuarioAtual){

            alert(
                "Você precisa estar logado para jogar."
            );

            window.location.href =
                "../index.html";

            return;

        }

        const carregou =
            await carregarSaldo();

        if(!carregou){

            carregando.style.display =
                "none";

            return;

        }

        criarNumeros();

        atualizarSaldo();

        carregando.style.display =
            "none";

    }
    catch(error){

        console.error(
            "Erro:",
            error
        );

        carregando.style.display =
            "none";

        resultado.innerHTML =
            "❌ ERRO AO INICIAR ROLETA";

        resultado.style.color =
            "#ff4141";

    }

}
