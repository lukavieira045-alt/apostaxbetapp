<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta Neon - ApostaXBet</title>
    <style>
        /* Reset e Base Neon */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: #050505; color: white; font-family: 'Segoe UI', system-ui, sans-serif; 
            min-height: 100vh; padding-bottom: 40px; 
        }
        
        /* Topo com Efeito Glow */
        .topo { 
            text-align: center; padding: 25px 15px; background: rgba(10,10,10,0.9); 
            border-bottom: 1px solid rgba(0, 255, 255, 0.3); 
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .topo h1 { 
            color: #00ffff; font-size: 24px; margin-bottom: 8px; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6), 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .saldo { 
            font-weight: bold; font-size: 18px; transition: all 0.3s ease; 
            text-shadow: 0 0 5px currentColor;
        }
        
        /* Container Principal */
        .container { width: 92%; max-width: 500px; margin: 30px auto; text-align: center; }
        .roleta-box { 
            background: rgba(20, 20, 20, 0.8); border-radius: 20px; padding: 30px 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }
        
        .info-text { color: #888; font-size: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Display de Resultado Neon */
        .resultado { 
            font-size: 48px; font-weight: 900; height: 80px; 
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0; color: #fff; 
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            animation: pulseText 2s infinite alternate;
        }
        
        /* Botões de Cores Estilo Glassmorphism */
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .btn-cor { 
            flex: 1; padding: 18px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            color: white; font-weight: bold; cursor: pointer; font-size: 14px;
            opacity: 0.5; transform: scale(1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.05); backdrop-filter: blur(5px);
            min-height: 50px; position: relative; overflow: hidden;
        }
        .btn-cor::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-cor:hover::before { left: 100%; }
        
        .btn-cor.ativo { opacity: 1; transform: scale(1.08); border-color: rgba(255,255,255,0.5); box-shadow: 0 0 20px currentColor; z-index: 2; }
        
        .btn-vermelho { color: #ff4d4d; }
        .btn-vermelho.ativo { background: rgba(255, 77, 77, 0.2); }
        .btn-preto { color: #aaaaaa; }
        .btn-preto.ativo { background: rgba(170, 170, 170, 0.2); }
        .btn-verde { color: #00ed91; }
        .btn-verde.ativo { background: rgba(0, 237, 145, 0.2); }
        
        /* Botão de Apostar Neon */
        .btn-apostar { 
            width: 100%; padding: 20px; background: transparent; color: #e6c229; 
            border: 2px solid #e6c229; border-radius: 12px; font-size: 18px; font-weight: 900; 
            cursor: pointer; transition: all 0.3s; min-height: 60px;
            text-shadow: 0 0 10px rgba(230, 194, 41, 0.5);
            box-shadow: 0 0 15px rgba(230, 194, 41, 0.2), inset 0 0 10px rgba(230, 194, 41, 0.1);
        }
        .btn-apostar:not(:disabled):hover { 
            background: rgba(230, 194, 41, 0.1); 
            box-shadow: 0 0 25px rgba(230, 194, 41, 0.4), inset 0 0 15px rgba(230, 194, 41, 0.2);
        }
        .btn-apostar:active:not(:disabled) { transform: scale(0.97); }
        .btn-apostar:disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(100%); box-shadow: none; border-color: #333; color: #333; text-shadow: none;}
        
        .btn-voltar { display: inline-block; margin-top: 30px; color: #555; text-decoration: none; font-size: 13px; transition: color 0.3s; }
        .btn-voltar:hover { color: #00ffff; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); }

        @keyframes pulseText { from { text-shadow: 0 0 10px rgba(255,255,255,0.3); } to { text-shadow: 0 0 20px rgba(255,255,255,0.8); } }
    </style>
</head>
<body>
    <div class="topo">
        <h1>🎰 ROLETA NEON</h1>
        <div class="saldo" id="displaySaldo">R$ 0,00</div>
    </div>
    <div class="container">
        <div class="roleta-box">
            <p class="info-text">Escolha uma cor e aposte R$ 5,00</p>
            <div class="resultado" id="resultadoDisplay">--</div>
            <div class="controles">
                <button type="button" class="btn-cor btn-vermelho" onclick="selecionarCor('vermelho', this)">Vermelho</button>
                <button type="button" class="btn-cor btn-verde" onclick="selecionarCor('verde', this)">Verde</button>
                <button type="button" class="btn-cor btn-preto" onclick="selecionarCor('preto', this)">Preto</button>
            </div>
            <button type="button" id="btnApostar" class="btn-apostar" onclick="girarRoleta()" disabled>APOSTAR R$ 5,00</button>
        </div>
        <a href="../index.html" class="btn-voltar">← Voltar para Lobby</a>
    </div>

    <!-- Script central com fallbacks -->
    <script src="../script.js" onerror="this.remove()"></script>
    <script>
        const VALOR_APOSTA = 5;
        let corSelecionada = null;
        const btnApostar = document.getElementById('btnApostar');
        const display = document.getElementById('resultadoDisplay');
        const saldoEl = document.getElementById('displaySaldo');

        // Fallbacks seguros
        function getSaldo() { try { return parseFloat(localStorage.getItem('apostaXBet_saldo')) || 0; } catch(e) { return 0; } }
        function setSaldo(v) { try { localStorage.setItem('apostaXBet_saldo', v); } catch(e) {} }
        function atualizarSaldoUI() {
            const s = getSaldo();
            saldoEl.innerText = `R$ ${s.toFixed(2).replace('.', ',')}`;
            saldoEl.style.color = s < 10 ? '#ff4d4d' : '#00ed91';
        }
        atualizarSaldoUI();

        window.verificarAcessoJogo = window.verificarAcessoJogo || function(custo, nome) {
            const saldo = getSaldo();
            if (saldo < custo) { alert(`⚠️ Saldo insuficiente!\nNecessário: R$ ${custo},00`); return false; }
            return true;
        };
        window.adicionarSaldo = window.adicionarSaldo || function(v) { setSaldo(getSaldo() + v); atualizarSaldoUI(); };
        window.descontarSaldo = window.descontarSaldo || function(v) { setSaldo(Math.max(0, getSaldo() - v)); atualizarSaldoUI(); };

        function selecionarCor(cor, botao) {
            document.querySelectorAll('.btn-cor').forEach(b => b.classList.remove('ativo'));
            botao.classList.add('ativo');
            corSelecionada = cor;
            btnApostar.disabled = false;
        }

        function girarRoleta() {
            if (!verificarAcessoJogo(VALOR_APOSTA, "Roleta")) return;
            if (!corSelecionada) return;

            btnApostar.disabled = true;
            document.querySelectorAll('.btn-cor').forEach(b => b.style.pointerEvents = 'none');
            display.innerText = "GIRANDO...";
            display.style.color = "#fff";

            setTimeout(() => {
                const rand = Math.random();
                const resultado = rand < 0.45 ? 'vermelho' : (rand < 0.90 ? 'preto' : 'verde');
                display.innerText = resultado.toUpperCase();
                const coresMap = { vermelho: '#ff4d4d', verde: '#00ed91', preto: '#aaa' };
                display.style.color = coresMap[resultado];
                display.style.textShadow = `0 0 25px ${coresMap[resultado]}`;

                if (resultado === corSelecionada) {
                    const mult = corSelecionada === 'verde' ? 14 : 2;
                    adicionarSaldo(VALOR_APOSTA * mult);
                } else { descontarSaldo(VALOR_APOSTA); }

                setTimeout(() => {
                    btnApostar.disabled = false;
                    document.querySelectorAll('.btn-cor').forEach(b => b.style.pointerEvents = 'auto');
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
