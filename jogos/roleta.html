/* =====================================================
   ROLETA
===================================================== */

.roleta-area{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:10px;
}

.roleta{
    width:min(92vw,390px);
    height:min(92vw,390px);

    border-radius:50%;
    position:relative;

    border:6px solid #d7ae31;

    background:
    radial-gradient(
        circle,
        #1b2925 0 15%,
        #060a09 16% 23%,
        transparent 24%
    );

    box-shadow:
    0 0 8px #ffd84a,
    0 0 25px rgba(255,205,45,.45),
    0 0 55px rgba(255,190,20,.2),
    inset 0 0 25px #000;

    /*
       IMPORTANTE:
       O giro agora começa mais devagar
       e termina lentamente.
    */
    transition:
        transform 9s cubic-bezier(.22,.82,.12,1);

    overflow:hidden;
}

.roleta::before{
    content:"";

    position:absolute;
    inset:7px;

    border-radius:50%;

    border:12px solid #101a21;

    box-shadow:
    inset 0 0 8px #000,
    0 0 4px #000;

    z-index:3;
}

.roleta::after{
    content:"";

    position:absolute;
    inset:27px;

    border-radius:50%;

    background:
    repeating-conic-gradient(
        from 0deg,
        rgba(255,225,100,.75) 0deg 1deg,
        transparent 1deg 22.5deg
    );

    z-index:5;
    pointer-events:none;
}

.roleta-inner{
    position:absolute;

    inset:30px;

    border-radius:50%;

    background:
    repeating-conic-gradient(
        from -11.25deg,
        #28645b 0deg 11.25deg,
        #152f2b 11.25deg 22.5deg
    );

    box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px #ffe05b;

    z-index:1;
}

/* =====================================================
   CASAS / NÚMEROS
===================================================== */

.numeros{
    position:absolute;
    inset:0;
    z-index:8;
}

/*
   NÃO existe quadrado aqui.
   Cada número fica diretamente dentro
   da sua casa e na posição vertical.
*/

.numero{
    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    min-height:72px;

    margin-left:-29px;
    margin-top:-36px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff1a0;

    font-size:20px;
    font-weight:900;

    text-shadow:
    0 2px 3px #000,
    0 0 8px rgba(255,215,70,.9);

    transform-origin:center;

    /*
       A casa não tem fundo quadrado.
    */
    background:transparent;

    border:none;

    box-shadow:none;

    pointer-events:none;
}

.numero-conteudo{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    line-height:.88;

    min-width:42px;

    text-align:center;

    white-space:nowrap;

    transform:rotate(0deg);
}

/*
   Os números ficam grandes e em pé.
*/

.numero-conteudo .linha{
    display:block;

    height:22px;

    font-size:21px;
    font-weight:900;
}

/*
   Para valores como 1,00:
       1
       0
       0
*/

.numero.valor-grande .linha{
    height:23px;
    font-size:22px;
}

/*
   SUPER BÔNUS
*/

.numero.super-bonus{
    color:#fff;

    font-size:14px;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #ffe34f,
    0 0 20px #ffb300;
}

.numero.super-bonus .linha{
    font-size:14px;
    height:16px;
}

/*
   PERDER
*/

.numero.perder{
    color:#ff6565;

    text-shadow:
    0 0 5px #ff0000,
    0 0 12px #ff0000,
    0 2px 3px #000;
}

.numero.perder .linha{
    font-size:19px;
    height:20px;
}

/* destaque do resultado */

.numero.destaque{
    color:#fff;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #ffe36a,
    0 0 25px #ffd000,
    0 2px 3px #000;

    transform:
        translate(var(--x),var(--y))
        scale(1.22);
}

.numero.destaque.perder{
    color:#ff5555;

    text-shadow:
    0 0 5px #ff0000,
    0 0 15px #ff0000,
    0 0 30px #ff0000;
}

.numero.destaque.super-bonus{
    color:#ffffff;

    text-shadow:
    0 0 5px white,
    0 0 15px #ffe600,
    0 0 30px #ffae00,
    0 0 50px #ff6a00;
}

/* =====================================================
   CENTRO
===================================================== */

.centro{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:82px;
    height:82px;

    border-radius:50%;

    background:
    radial-gradient(circle,#283d38,#08100e 65%,#020303);

    border:4px solid #d5ad36;

    z-index:12;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 15px rgba(255,211,53,.55),
    inset 0 0 15px #000;
}

.centro strong{
    color:#ffe36a;
    font-size:18px;
    letter-spacing:2px;
}

.centro span{
    color:#777;
    font-size:8px;
    letter-spacing:2px;
}

/* =====================================================
   PONTEIRO
===================================================== */

.ponteiro{
    position:absolute;

    z-index:20;

    top:-3px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:27px solid white;

    filter:
    drop-shadow(0 0 4px white)
    drop-shadow(0 0 9px #ffe66b);
}

/* =====================================================
   RAIOS
===================================================== */

.raio{
    position:absolute;

    width:100px;
    height:4px;

    background:white;

    opacity:.7;

    z-index:18;

    box-shadow:
    0 0 5px white,
    0 0 15px #dfffca;

    animation:
        piscar .7s infinite alternate;
}

.raio1{
    left:4px;
    bottom:50px;
    transform:rotate(-35deg);
}

.raio2{
    right:4px;
    top:65px;
    transform:rotate(35deg);
}

.raio3{
    left:45px;
    top:20px;
    width:70px;
    transform:rotate(65deg);
}

@keyframes piscar{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }

}

/* =====================================================
   RESULTADO
===================================================== */

.resultado{
    min-height:60px;

    text-align:center;

    color:#ddd;

    font-size:18px;

    font-weight:900;

    text-shadow:

    line-height:24px;

/* =====================================================
   PAINEL
===================================================== */

.painel{

.ficha-area{

.ficha{

}

.valores{

.btn-valor{

.btn-valor.ativo{

.btn-apostar{

.info{

.info strong{

.mensagem{

/* =====================================================
   BOTÕES
===================================================== */

.repeat-btn,

    bottom:15px;

.menu-btn{

/* =====================================================
   CARREGANDO
===================================================== */

#carregando{
    position:fixed;

    inset:0;

    background:#020303;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:999;

    color:#ffe36a;

    font-size:16px;
}

/* =====================================================
   SUPER BÔNUS
===================================================== */

#superBonusEfeito{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:1000;

    pointer-events:none;

    background:
    radial-gradient(
        circle,
        rgba(255,230,80,.25),
        rgba(255,120,0,.10),
        transparent 65%
    );
}

#superBonusEfeito.ativo{
    display:flex;

    animation:
        fundoBonus 2.8s ease-out forwards;
}

.super-texto{
    font-size:38px;

    font-weight:1000;

    color:#fff;

    text-align:center;

    text-shadow:
    0 0 5px #fff,
    0 0 15px #ffe600,
    0 0 30px #ffae00,
    0 0 60px #ff5500;

    animation:
        bonusEntrada .8s cubic-bezier(.1,.9,.2,1),
        bonusPulso .45s ease-in-out .8s infinite alternate;
}

.super-premio{
    margin-top:8px;

    font-size:28px;

    color:#ffe45c;

    font-weight:900;

    text-shadow:
    0 0 10px #ffcf00,
    0 0 30px #ff7b00;

    animation:
        bonusEntrada .9s ease-out;
}

.particula{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffe66b;

    box-shadow:
    0 0 8px #fff,
    0 0 18px #ffb300;

    animation:
        particulaVoar 1.8s ease-out forwards;
}

@keyframes fundoBonus{

    0%{
        opacity:0;
    }

    15%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}

@keyframes bonusEntrada{

    0%{
        transform:scale(.2) rotate(-8deg);
        opacity:0;
    }

    60%{
        transform:scale(1.25) rotate(3deg);
        opacity:1;
    }

    100%{
        transform:scale(1);
    }

}

@keyframes bonusPulso{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }

}

@keyframes particulaVoar{

    0%{
        transform:
            translate(0,0)
            scale(1);
        opacity:1;
    }

    100%{
        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.1);
        opacity:0;
    }

}

@media(max-width:360px){

    .roleta{
        width:310px;
        height:310px;
    }

    .numero{
        width:52px;
        min-height:68px;

        margin-left:-26px;
        margin-top:-34px;
    }

    .numero-conteudo .linha{
        font-size:18px;
        height:19px;
    }

    .numero.perder .linha{
        font-size:16px;
        height:17px;
    }

    .numero.super-bonus .linha{
        font-size:11px;
        height:13px;
    }

}

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =====================================================
   SUPABASE
   MANTIDO COMO NO SEU CÓDIGO
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1.00;

let rotacaoAtual = 0;

let girando = false;


/* =====================================================
   MÚSICA
===================================================== */

const musicaRoleta =
document.getElementById("musicaRoleta");

musicaRoleta.volume = 0.10;

let musicaIniciada = false;


function iniciarMusica(){

    if(musicaIniciada)
        return;

    if(!musicaRoleta)
        return;

    musicaRoleta.volume = 0.10;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(function(){

            musicaIniciada = true;

        })
        .catch(function(){

            console.log(
                "Aguardando interação."
            );

        });

    }

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 45;


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    iniciarMusica();

}


function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        180,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        80,
        agora + .08
    );

    ganho.gain.setValueAtTime(
        .7,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .08
    );

    oscilador.connect(ganho);
    ganho.connect(audioContext.destination);

    oscilador.start(agora);
    oscilador.stop(agora + .08);

}


/* =====================================================
   SOM DA ROLETA
===================================================== */

function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 55;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        850,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        420,
        agora + .035
    );

    ganho.gain.setValueAtTime(
        .40,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .055
    );

    oscilador.connect(ganho);
    ganho.connect(audioContext.destination);

    oscilador.start(agora);
    oscilador.stop(agora + .06);

    velocidadeSom += 8;

    if(velocidadeSom > 300)
        velocidadeSom = 300;

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(timerRoleta);

        timerRoleta = null;

    }

}


/* =====================================================
   SOM DE PRÊMIO
===================================================== */

function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [
            523.25,
            659.25,
            783.99,
            1046.50
        ];

    notas.forEach(
        function(frequencia,i){

            const oscilador =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora + i * .12;

            oscilador.type =
                "sine";

            oscilador.frequency.setValueAtTime(
                frequencia,
                inicio
            );

            ganho.gain.setValueAtTime(
                .9,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                .001,
                inicio + .45
            );

            oscilador.connect(ganho);
            ganho.connect(audioContext.destination);

            oscilador.start(inicio);
            oscilador.stop(inicio + .45);

        }
    );

}


/* =====================================================
   SOM SUPER BÔNUS
===================================================== */

function tocarSuperBonus(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [
            392,
            523.25,
            659.25,
            783.99,
            1046.50,
            1318.51
        ];

    notas.forEach(
        function(freq,i){

            const osc =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora + i * .13;

            osc.type =
                i % 2 === 0
                ? "sine"
                : "triangle";

            osc.frequency.setValueAtTime(
                freq,
                inicio
            );

            ganho.gain.setValueAtTime(
                .001,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                .8,
                inicio + .03
            );

            ganho.gain.exponentialRampToValueAtTime(
                .001,
                inicio + .55
            );

            osc.connect(ganho);
            ganho.connect(audioContext.destination);

            osc.start(inicio);
            osc.stop(inicio + .6);

        }
    );

}

        resultado.style.color =

        return false;

    saldoReal =
        valorFinal;

    atualizarSaldo();

}

/* =====================================================
   CRIAR CASAS
===================================================== */

function criarNumeros(){

    const area =
        document.getElementById("numeros");

    area.innerHTML = "";

    const total =
        premios.length;

    const raio =
        37;

    const tamanhoCasa =
        360 / total;

    premios.forEach(
        function(item,index){

            const numero =
                document.createElement("div");

            numero.className =
                "numero";

            if(item.tipo === "perder"){

                numero.classList.add(
                    "perder"
                );

                numero.appendChild(
                    criarPerder()
                );

            }else if(
                item.tipo === "super"
            ){

                numero.classList.add(
                    "super-bonus"
                );

                numero.appendChild(
                    criarSuperBonus()
                );

            }else{

                numero.classList.add(
                    "valor-grande"
                );

                numero.appendChild(
                    criarTextoVertical(
                        item.valor
                    )
                );

            }

            /*
               Cada casa fica ao redor
               da roleta.
            */

            const angulo =
                index *
                tamanhoCasa -
                90;

            const x =
                Math.cos(
                    angulo *
                    Math.PI / 180
                ) * raio;

            const y =
                Math.sin(
                    angulo *
                    Math.PI / 180
                ) * raio;

            numero.style.transform =
                `translate(${x}%,${y}%)`;

            numero.style.setProperty(
                "--x",
                `${x}%`
            );

            numero.style.setProperty(
                "--y",
                `${y}%`
            );

            numero.dataset.index =
                index;

            area.appendChild(
                numero
            );

        }
    );

}

/* =====================================================

function mostrarSuperBonus(){

    superBonusEfeito.classList.add(
        "ativo"
    );

    for(
        let i = 0;
        i < 70;
        i++
    ){

        const particula =
            document.createElement(
                "div"
            );

        particula.className =
            "particula";

        particula.style.left =
            "50%";

        particula.style.top =
            "50%";

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const distancia =
            100 +
            Math.random() * 500;

        const dx =
            Math.cos(angulo) *
            distancia;

        const dy =
            Math.sin(angulo) *
            distancia;

        particula.style.setProperty(
            "--dx",
            dx + "px"
        );

        particula.style.setProperty(
            "--dy",
            dy + "px"
        );

        superBonusEfeito.appendChild(
            particula
        );

        setTimeout(
            function(){

                particula.remove();

            },
            2000
        );

    }

    setTimeout(
        function(){

            superBonusEfeito.classList.remove(
                "ativo"
            );

        },
        2800
    );

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();

    if(!usuarioAtual){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }

    girando = true;

    atualizarBotao();

    /*
       MANTÉM O MESMO SISTEMA:
       primeiro debita a aposta.
    */

    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }

    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";

    document
    .querySelectorAll(".numero")
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );

    iniciarSomRoleta();

    /*
       Escolhe a casa.
    */

    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];

    const total =
        premios.length;

    const tamanhoCasa =
        360 / total;

    /*
       A casa escolhida será posicionada
       exatamente no ponteiro de cima.
    */

    const deslocamento =
        360 -
        (indice * tamanhoCasa);

    /*
       Mais voltas.

       8 voltas completas = giro longo.
       A transição CSS de 9 segundos
       começa devagar e termina devagar.
    */

    const voltas =
        360 * 8;

    const novaRotacao =
        rotacaoAtual +
        voltas +
        deslocamento;

    roleta.style.transform =
        `rotate(${novaRotacao}deg)`;

    rotacaoAtual =
        novaRotacao;

    /*
       O CSS leva 9 segundos.
       Esperamos um pouco mais para garantir
       que a roleta terminou completamente.
    */

    setTimeout(
        function(){

            finalizarRodada(
                indice,
                premio
            );

        },
        9300
    );

};


/* =====================================================
   FINALIZAR RODADA
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();

    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );

    if(numero){

        numero.classList.add(
            "destaque"
        );

    }

    /*
       PERDER
    */

    if(premio.tipo === "perder"){

        resultado.innerHTML =
            "❌ PERDEU<br>" +
            "<span style='font-size:18px;color:#ff5555'>" +
            "Tente novamente" +
            "</span>";

        resultado.style.color =
            "#ff5555";

        /*
           NÃO adiciona nada ao saldo.
           O valor da aposta já foi debitado.
        */

        setTimeout(
            function(){

                girando = false;

                atualizarBotao();

            },
            1800
        );

        return;

    }

    /*
       SUPER BÔNUS
    */

    if(premio.tipo === "super"){

        const saldoAtual =
            saldoReal;

        const novoSaldo =
            saldoAtual +
            premio.valor;

        const creditado =
            await salvarSaldo(
                novoSaldo
            );

        if(!creditado){

            girando = false;

            atualizarBotao();

            return;

        }

        tocarSuperBonus();

        mostrarSuperBonus();

        resultado.innerHTML =
            "⚡ SUPER BÔNUS ⚡<br>" +
            "<span style='font-size:30px;color:#ffe36a'>" +
            "R$ 10,00" +
            "</span>";

        resultado.style.color =
            "#ffe36a";

        setTimeout(
            function(){

                girando = false;

                atualizarBotao();

            },
            3000
        );

        return;

    }

    /*
       PRÊMIO NORMAL
    */

    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio.valor;

    const creditado =
        await salvarSaldo(
            novoSaldo
        );

    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }

    tocarPremio();

    resultado.innerHTML =
        "⚡ PRÊMIO<br>" +
        "<span style='font-size:27px;color:#ffe36a'>" +
        dinheiro(premio.valor) +
        "</span>";

    resultado.style.color =
        "#ffe36a";

    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1500
    );

}
