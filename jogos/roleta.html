<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Roleta Neon - ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    overflow-x:hidden;
}

.topo{
    text-align:center;
    padding:20px 15px;
    background:rgba(10,10,10,.95);
    border-bottom:1px solid rgba(0,255,255,.2);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}

.topo h1{
    color:#00ffff;
    font-size:22px;
    margin-bottom:5px;
    letter-spacing:2px;
    text-shadow:0 0 10px rgba(0,255,255,.6);
}

.saldo{
    font-weight:bold;
    font-size:18px;
}

.container{
    width:92%;
    max-width:500px;
    margin:20px auto;
    text-align:center;
}

.roleta-box{
    background:rgba(20,20,20,.8);
    border-radius:20px;
    padding:25px 15px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 30px rgba(0,0,0,.8);
}

.info-text{
    color:#777;
    font-size:11px;
    margin-bottom:18px;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* ÁREA DA ROLETA */

.roleta-area{
    position:relative;
    width:310px;
    height:310px;
    max-width:90vw;
    max-height:90vw;
    margin:0 auto 20px;
}

.seta-indicadora{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:25px solid white;
    z-index:20;
    filter:drop-shadow(0 0 6px white);
}

.roda-container{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:6px solid #222;
    overflow:hidden;
    box-shadow:
        0 0 25px #000,
        0 0 45px rgba(0,255,255,.15),
        inset 0 0 20px #000;

    transition:
        transform 4s cubic-bezier(.12,.8,.18,1);
}

.roda-segmentos{
    position:absolute;
    inset:0;
    border-radius:50%;

    background:conic-gradient(
        #e63946 0deg 20deg,
        #151515 20deg 40deg,
        #00b879 40deg 60deg,
        #e63946 60deg 80deg,
        #151515 80deg 100deg,
        #00b879 100deg 120deg,
        #e63946 120deg 140deg,
        #151515 140deg 160deg,
        #00b879 160deg 180deg,
        #e63946 180deg 200deg,
        #151515 200deg 220deg,
        #00b879 220deg 240deg,
        #e63946 240deg 260deg,
        #151515 260deg 280deg,
        #00b879 280deg 300deg,
        #e63946 300deg 320deg,
        #151515 320deg 340deg,
        #00b879 340deg 360deg
    );
}

/* LINHAS DOS SEGMENTOS */

.roda-segmentos::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        repeating-conic-gradient(
            transparent 0deg 19.5deg,
            rgba(255,255,255,.65) 19.5deg 20deg
        );
}

/* VALORES */

.valores{
    position:absolute;
    inset:0;
    border-radius:50%;
    z-index:5;
}

.valor{
    position:absolute;
    left:50%;
    top:50%;
    width:54px;
    height:25px;
    margin-left:-27px;
    margin-top:-12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:900;
    color:white;

    text-shadow:
        0 0 4px #000,
        0 0 7px #000;

    transform:
        rotate(var(--angulo))
        translateY(-112px)
        rotate(calc(var(--angulo) * -1));
}

/* CENTRO */

.roda-centro{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:65px;
    height:65px;

    background:#090909;
    border-radius:50%;

    border:3px solid #e6c229;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    color:#e6c229;

    font-size:13px;

    box-shadow:
        0 0 10px rgba(230,194,41,.5),
        inset 0 0 12px #000;
}

/* RESULTADO */

.resultado-texto{
    font-size:25px;
    font-weight:900;
    min-height:35px;
    margin-bottom:15px;

    text-shadow:0 0 12px currentColor;

    opacity:0;
    transition:opacity .3s;
}

.resultado-texto.visivel{
    opacity:1;
}

/* BOTÕES */

.controles{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:20px;
}

.btn-cor{
    flex:1;
    padding:14px 0;

    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;

    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;

    opacity:.4;
    transition:.3s;

    background:rgba(255,255,255,.03);
}

.btn-cor.ativo{
    opacity:1;
    transform:scale(1.05);
    box-shadow:0 0 15px currentColor;
}

.btn-vermelho{color:#ff4d4d;}
.btn-verde{color:#00ed91;}
.btn-preto{color:#aaa;}

.btn-apostar{
    width:100%;
    padding:16px;

    background:transparent;
    color:#e6c229;

    border:2px solid #e6c229;
    border-radius:10px;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    min-height:50px;

    box-shadow:0 0 15px rgba(230,194,41,.15);
}

.btn-apostar:disabled{
    opacity:.2;
    cursor:not-allowed;
    border-color:#333;
    color:#333;
    box-shadow:none;
}

.btn-voltar{
    display:inline-block;
    margin-top:20px;
    color:#444;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:350px){
    .roleta-area{
        width:280px;
        height:280px;
    }

    .valor{
        transform:
            rotate(var(--angulo))
            translateY(-100px)
            rotate(calc(var(--angulo) * -1));
    }
}
</style>
</head>

<body>

<div class="topo">
    <h1>🎰 ROLETA NEON</h1>
    <div class="saldo" id="displaySaldo">R$ 0,00</div>
</div>

<div class="container">

<div class="roleta-box">

<p class="info-text">
    Escolha uma cor e gire a roleta
</p>

<div class="roleta-area">

    <div class="seta-indicadora"></div>

    <div class="roda-container" id="rodaVisual">

        <div class="roda-segmentos"></div>

        <div class="valores" id="valoresRoleta"></div>

        <div class="roda-centro">
            AX
        </div>

    </div>

</div>

<div class="resultado-texto" id="resultadoDisplay">
    --
</div>

<div class="controles">

<button
    type="button"
    class="btn-cor btn-vermelho"
    onclick="selecionarCor('vermelho',this)">
    Vermelho
</button>

<button
    type="button"
    class="btn-cor btn-verde"
    onclick="selecionarCor('verde',this)">
    Verde
</button>

<button
    type="button"
    class="btn-cor btn-preto"
    onclick="selecionarCor('preto',this)">
    Preto
</button>

</div>

<button
    type="button"
    id="btnApostar"
    class="btn-apostar"
    onclick="girarRoleta()"
    disabled>

    GIRAR ROLETA

</button>

</div>

<a href="../index.html" class="btn-voltar">
    ← Voltar para Lobby
</a>

</div>

<script>

const VALOR_APOSTA = 5;

let corSelecionada = null;
let rotacaoAtual = 0;

const btnApostar =
    document.getElementById("btnApostar");

const display =
    document.getElementById("resultadoDisplay");

const saldoEl =
    document.getElementById("displaySaldo");

const roda =
    document.getElementById("rodaVisual");

const valoresRoleta =
    document.getElementById("valoresRoleta");


/* =========================
   VALORES DAS 18 CASAS
========================= */

const valores = [
    0.40,
    0.50,
    0.60,
    0.70,
    0.80,
    0.90,
    1.00,
    0.40,
    0.50,
    0.60,
    0.70,
    0.80,
    0.90,
    1.00,
    0.40,
    0.60,
    0.80,
    1.00
];


/* =========================
   CRIA OS VALORES NA ROLETA
========================= */

valores.forEach((valor,index)=>{

    const el =
        document.createElement("div");

    el.className="valor";

    const angulo =
        index * 20 + 10;

    el.style.setProperty(
        "--angulo",
        angulo + "deg"
    );

    el.innerText =
        "R$ " +
        valor.toFixed(2).replace(".",",");

    valoresRoleta.appendChild(el);

});


/* =========================
   SALDO
========================= */

function getSaldo(){

    try{
        return parseFloat(
            localStorage.getItem(
                "apostaXBet_saldo"
            )
        ) || 0;

    }catch(e){

        return 0;
    }
}


function setSaldo(valor){

    try{

        localStorage.setItem(
            "apostaXBet_saldo",
            valor
        );

    }catch(e){}
}


function atualizarSaldoUI(){

    const saldo=getSaldo();

    saldoEl.innerText =
        "R$ " +
        saldo.toFixed(2).replace(".",",");

    saldoEl.style.color =
        saldo < 5
        ? "#ff4d4d"
        : "#00ed91";
}


atualizarSaldoUI();


/* =========================
   SELECIONAR COR
========================= */

function selecionarCor(cor,botao){

    document
        .querySelectorAll(".btn-cor")
        .forEach(b=>{
            b.classList.remove("ativo");
        });

    botao.classList.add("ativo");

    corSelecionada=cor;

    btnApostar.disabled=false;
}


/* =========================
   GIRO
========================= */

function girarRoleta(){

    if(!corSelecionada)
        return;


    btnApostar.disabled=true;


    document
        .querySelectorAll(".btn-cor")
        .forEach(b=>{
            b.style.pointerEvents="none";
        });


    display.classList.remove("visivel");


    /*
       Escolhe uma casa aleatória.
    */

    const indice =
        Math.floor(
            Math.random()*18
        );


    const valor =
        valores[indice];


    /*
       Descobre a cor da casa.
    */

    const cores = [
        "vermelho",
        "preto",
        "verde"
    ];

    const corResultado =
        cores[indice % 3];


    /*
       Cada casa ocupa 20 graus.
       Colocamos a casa escolhida
       exatamente embaixo da seta.
    */

    const centroCasa =
        indice * 20 + 10;


    const girosExtras =
        360 * 6;


    const novaRotacao =
        rotacaoAtual +
        girosExtras +
        (360 - centroCasa);


    roda.style.transform =
        `rotate(${novaRotacao}deg)`;


    rotacaoAtual =
        novaRotacao;


    setTimeout(()=>{

        display.innerText =
            "PRÊMIO: R$ " +
            valor.toFixed(2).replace(".",",");


        const coresTexto={
            vermelho:"#ff4d4d",
            preto:"#aaa",
            verde:"#00ed91"
        };


        display.style.color =
            coresTexto[corResultado];


        display.classList.add("visivel");


        /*
           Resultado visual da aposta.
        */

        if(corResultado === corSelecionada){

            display.innerText +=
                "  🎉";

        }else{

            display.innerText +=
                "  • Tente novamente";

        }


        /*
           Libera os controles.
        */

        setTimeout(()=>{

            btnApostar.disabled=false;

            document
                .querySelectorAll(".btn-cor")
                .forEach(b=>{
                    b.style.pointerEvents="auto";
                });

        },700);


    },4000);

}

</script>

</body>
</html>
