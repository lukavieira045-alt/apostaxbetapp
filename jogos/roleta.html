<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta Cassino - ApostaXBet</title>

<style>
body{
    background:#080808;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.area{
    position:relative;
    width:320px;
    height:320px;
    margin:40px auto;
}


#ponteiro{
    position:absolute;
    top:-35px;
    left:50%;
    transform:translateX(-50%);
    font-size:45px;
    z-index:10;
}


#roleta{
    width:300px;
    height:300px;
    border-radius:50%;

    border:12px solid #ffd700;

    background:
    conic-gradient(
    #d32f2f 0deg 45deg,
    #222 45deg 90deg,
    #ffd700 90deg 135deg,
    #222 135deg 180deg,
    #d32f2f 180deg 225deg,
    #222 225deg 270deg,
    #ffd700 270deg 315deg,
    #222 315deg 360deg
    );


    box-shadow:
    0 0 25px #ffd700,
    inset 0 0 40px black;


    transition:
    transform 9s cubic-bezier(.12,.8,.18,1);


    position:relative;
}


.valor{

position:absolute;
width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:flex-start;

padding-top:25px;

font-size:22px;
font-weight:bold;

text-shadow:2px 2px 5px black;

}



.v1{transform:rotate(22.5deg);}
.v2{transform:rotate(67.5deg);}
.v3{transform:rotate(112.5deg);}
.v4{transform:rotate(157.5deg);}
.v5{transform:rotate(202.5deg);}
.v6{transform:rotate(247.5deg);}
.v7{transform:rotate(292.5deg);}
.v8{transform:rotate(337.5deg);}



button{

padding:18px 45px;

background:#ffd700;

border:none;

border-radius:15px;

font-size:20px;

font-weight:bold;

cursor:pointer;

}



a{

display:block;

margin-top:30px;

color:#aaa;

}

</style>

</head>


<body>


<h1>🎰 Roleta Cassino</h1>


<div id="saldo"></div>


<div class="area">

<div id="ponteiro">🔻</div>


<div id="roleta">

<div class="valor v1">R$1</div>
<div class="valor v2">R$5</div>
<div class="valor v3">R$0</div>
<div class="valor v4">R$10</div>
<div class="valor v5">R$2</div>
<div class="valor v6">R$0</div>
<div class="valor v7">R$50</div>
<div class="valor v8">R$1</div>


</div>

</div>


<button onclick="girar()">GIRAR</button>


<a href="../index.html">Voltar</a>



<script>


let saldo = Number(localStorage.getItem("saldo") || 2);

let girando=false;


let rotacao=0;



let premios=[

1,
5,
0,
10,
2,
0,
50,
1

];



function atualizarSaldo(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);


localStorage.setItem("saldo",saldo);

}


atualizarSaldo();



function girar(){


if(girando)return;


if(saldo<1){

alert("Saldo insuficiente!");

return;

}


girando=true;


saldo-=1;

atualizarSaldo();



let premioEscolhido =
Math.floor(Math.random()*premios.length);



let volta = 360*6;


// cada prêmio tem uma posição fixa
let parada =
360 - (premioEscolhido*45) - 22.5;



rotacao += volta + parada;



document.getElementById("roleta").style.transform =
"rotate("+rotacao+"deg)";




setTimeout(()=>{


let ganhou=premios[premioEscolhido];


saldo += ganhou;


atualizarSaldo();


alert("🎉 Você ganhou R$ "+ganhou.toFixed(2));


girando=false;



},9200);



}



</script>


</body>
</html>
