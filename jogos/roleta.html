<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta - ApostaXBet</title>

<style>
body{
    background:#0f1923;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#00ff88;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.container{
    position:relative;
    width:260px;
    height:260px;
    margin:30px auto;
}

#roleta{
    width:250px;
    height:250px;
    border-radius:50%;
    background:conic-gradient(
        #00ff88 0deg 45deg,
        #ff4444 45deg 90deg,
        #ffaa00 90deg 135deg,
        #00ff88 135deg 180deg,
        #ff4444 180deg 225deg,
        #ffaa00 225deg 270deg,
        #00ff88 270deg 315deg,
        #ff4444 315deg 360deg
    );
    border:8px solid white;
    transition:3s;
}

#valores{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

button{
    padding:15px 30px;
    background:#00ff88;
    border:0;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
}

a{
    display:block;
    margin-top:30px;
    color:#aaa;
}
</style>

</head>

<body>

<h1>🎡 Roleta da Sorte</h1>

<div id="saldo"></div>

<div class="container">
<div id="roleta"></div>
<div id="valores">
💰1 | 💰5 | 💰0 | 💰10<br>
💰2 | 💰0 | 💰50 | 💰1
</div>
</div>

<button onclick="girar()">GIRAR</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

function atualizarSaldo(){

document.getElementById("saldo").innerHTML =
"💰 Saldo: R$ " + saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}

atualizarSaldo();


function girar(){

if(saldo < 1){
alert("Saldo insuficiente!");
return;
}

saldo -= 1;
atualizarSaldo();


let roleta=document.getElementById("roleta");

let giro=1440 + Math.floor(Math.random()*360);

roleta.style.transform="rotate("+giro+"deg)";


setTimeout(()=>{

let premios=[
1,
5,
0,
10,
2,
0,
50,
1
];


let premio=premios[Math.floor(Math.random()*premios.length)];


saldo += premio;

atualizarSaldo();


alert("🎉 Você ganhou R$ "+premio.toFixed(2));


},3000);

}

</script>

</body>
</html>
