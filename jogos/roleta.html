<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta - ApostaXBet</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: Arial, sans-serif; padding-bottom: 50px; }
        .topo { text-align: center; padding: 20px; background: #111; border-bottom: 2px solid #d9b21f; position: sticky; top: 0; z-index: 100; }
        .topo h1 { margin: 0; color: #e6c229; font-size: 24px; }
        .saldo { margin-top: 5px; font-weight: bold; font-size: 18px; }
        
        .container { width: 90%; max-width: 500px; margin: 30px auto; text-align: center; }
        .roleta-box { background: #1a1a1a; border-radius: 15px; padding: 20px; border: 1px solid #333; }
        
        .resultado { font-size: 40px; font-weight: bold; height: 60px; display: flex; align-items: center; justify-content: center; margin: 20px 0; color: #fff; }
        
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn-cor { flex: 1; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; opacity: 0.5; transition: 0.2s; }
        .btn-cor.ativo { opacity: 1; transform: scale(1.05); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        
        .btn-vermelho { background: #dc3545; }
        .btn-preto { background: #222; border: 1px solid #555; }
        .btn-verde { background: #28a745; }
        
        .btn-apostar { width: 100%; padding: 15px; background: #e6c229; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-apostar:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-voltar { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="topo">
        <h1> Roleta</h1>
        <div class="saldo" id="displaySaldo">R$ 0,00</div>
    </div>

    <div class="container">
        <div class="roleta-box">
            <p style="color: #888; font-size: 14px;">Escolha uma cor e aposte R$ 5,00</p>
            <div class="resultado" id="resultadoDisplay">--</div>
            
            <div class="controles">
                <button class="btn-cor btn-vermelho" onclick="selecionarCor('vermelho', this)">Vermelho</button>
                <button class="btn-cor btn-verde" onclick="selecionarCor('verde', this)">Verde</button>
                <button class="btn-cor btn-preto" onclick="selecionarCor('preto', this)">Preto</button>
            </div>
            
            <button id="btnApostar" class="btn-apostar" onclick="girarRoleta()" disabled>Apostar R$ 5,00</button>
        </div>
        <a href="../index.html" class="btn-voltar">← Voltar para Lobby</a>
    </div>

    <!-- Caminho correto para buscar o script na pasta de cima -->
    <script src="../script.js"></script>

    <script>
        let corSelecionada = null;
        const VALOR_APOSTA = 5;

        function selecionarCor(cor, botao) {
            document.querySelectorAll('.btn-cor').forEach(b => b.classList.remove('ativo'));
            botao.classList.add('ativo');
            corSelecionada = cor;
            document.getElementById('btnApostar').disabled = false;
        }

        function girarRoleta() {
            // Verifica saldo antes de tudo
            if (!verificarAcessoJogo(VALOR_APOSTA, "Roleta")) return;

            const btn = document.getElementById('btnApostar');
            const display = document.getElementById('resultadoDisplay');
            
            btn.disabled = true;
            display.innerText = "Girando...";
            
            setTimeout(() => {
                const rand = Math.random();
                let resultado = rand < 0.45 ? 'vermelho' : (rand < 0.90 ? 'preto' : 'verde');
                
                display.innerText = resultado.toUpperCase();
                display.style.color = resultado === 'vermelho' ? '#dc3545' : (resultado === 'verde' ? '#28a745' : '#aaa');

                if (resultado === corSelecionada) {
                    const ganho = corSelecionada === 'verde' ? VALOR_APOSTA * 14 : VALOR_APOSTA * 2;
                    adicionarSaldo(ganho);
                    alert(`🎉 Ganhou R$ ${ganho},00!`);
                } else {
                    descontarSaldo(VALOR_APOSTA);
                }
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
