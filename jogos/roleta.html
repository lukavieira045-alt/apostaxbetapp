/* =====================================================
   ROLETA
===================================================== */

.roleta-area{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:10px;
}

.roleta{
    width:min(92vw,390px);
    height:min(92vw,390px);
    border-radius:50%;
    position:relative;

    border:5px solid #d7ae31;

    background:
    radial-gradient(
        circle,
        #1b2925 0 15%,
        #060a09 16% 23%,
        transparent 24%
    );

    box-shadow:
    0 0 8px #ffd84a,
    0 0 25px rgba(255,205,45,.45),
    0 0 55px rgba(255,190,20,.2),
    inset 0 0 25px #000;

    /*
       A rotação agora é controlada pelo JavaScript.
       A transição longa deixa a parada suave.
    */
    transition:
        transform 9s cubic-bezier(.12,.82,.18,1);

    overflow:hidden;
}

.roleta::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    border:12px solid #101a21;

    box-shadow:
    inset 0 0 8px #000,
    0 0 4px #000;

    z-index:3;
}

.roleta::after{
    content:"";
    position:absolute;
    inset:28px;
    border-radius:50%;

    background:
    repeating-conic-gradient(
        from 0deg,
        rgba(255,225,100,.7) 0deg 1deg,
        transparent 1deg 18deg
    );

    z-index:2;
}

.roleta-inner{
    position:absolute;
    inset:30px;
    border-radius:50%;

    background:
    repeating-conic-gradient(
        #28645b 0deg 9deg,
        #668c82 9deg 18deg
    );

    box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px #ffe05b;
}


/* =====================================================
   NÚMEROS
   SEM QUADRADOS
===================================================== */

.numeros{
    position:absolute;
    inset:0;
    z-index:7;
    pointer-events:none;
}

.numero{
    position:absolute;

    left:50%;
    top:50%;

    /*
       Nada de quadrado.
       Nada de borda.
       Nada de fundo.
    */

    width:72px;
    height:105px;

    margin-left:-36px;
    margin-top:-52px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff3a0;

    font-size:17px;
    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px #000,
        0 0 7px #000,
        0 0 12px rgba(255,215,70,.75);

    transform-origin:center center;

    transition:
        color .2s,
        text-shadow .2s,
        transform .2s;

    /*
       Não há:
       background
       border
       border-radius
       box-shadow
    */
}

.numero-conteudo{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    /*
       Texto em pé/radial.
    */
    transform:
        rotate(var(--texto-rotacao));

    white-space:nowrap;
}


/* =====================================================
   PERDEU
===================================================== */

.numero.perdeu{

/* =====================================================
   SUPER BÔNUS
===================================================== */

}

.numero.superbonus .numero-conteudo{

}

@keyframes brilhoBonus{

    from{
        transform:scale(1);
        filter:brightness(1);
    }

    to{
        transform:scale(1.12);
        filter:brightness(1.5);
    }

}


/* =====================================================
   NÚMERO PREMIADO
===================================================== */

.numero.destaque{

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffe36a,
        0 0 22px #ffbd00,
        0 0 35px #ff8c00;

    animation:
        numeroPremiado .7s infinite alternate;
}

@keyframes numeroPremiado{

    from{
        transform:
            translate(var(--x),var(--y))
            scale(1);
    }

    to{
        transform:
            translate(var(--x),var(--y))
            scale(1.18);
    }

}


/* =====================================================
   CENTRO
===================================================== */

.centro{

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

/* =====================================================

===================================================== */

.ponteiro{

    left:50%;

    width:0;
    height:0;

    drop-shadow(0 0 4px white)

/* =====================================================

===================================================== */

import {

/* =====================================================
   MÚSICA
===================================================== */

const musicaRoleta =
document.getElementById("musicaRoleta");

musicaRoleta.volume = 0.10;

let musicaIniciada = false;


function iniciarMusica(){

    if(musicaIniciada)
        return;

    if(!musicaRoleta)
        return;

    musicaRoleta.volume = 0.10;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(function(){

            musicaIniciada = true;

        })
        .catch(function(){

            console.log(
                "Aguardando interação..."
            );

        });

    }

}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 45;


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    iniciarMusica();

}


/* =====================================================
   CLIQUE
===================================================== */

function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        180,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        80,
        agora + 0.08
    );

    ganho.gain.setValueAtTime(
        1.0,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.08
    );

    oscilador.connect(
        ganho
    );

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(
        agora
    );

    oscilador.stop(
        agora + 0.08
    );

}


/* =====================================================
   SOM DA ROLETA
===================================================== */

function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 45;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        850,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        420,
        agora + 0.035
    );

    ganho.gain.setValueAtTime(
        0.45,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.055
    );

    oscilador.connect(
        ganho
    );

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(
        agora
    );

    oscilador.stop(
        agora + 0.06
    );

    velocidadeSom += 8;

    if(velocidadeSom > 280){

        velocidadeSom = 280;

    }

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(
            timerRoleta
        );

        timerRoleta = null;

    }

}


/* =====================================================
   SOM DO PRÊMIO
===================================================== */

function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [523.25,659.25,783.99,1046.50];

    notas.forEach(
        function(frequencia,i){

            const oscilador =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                (i * 0.12);

            oscilador.type =
                "sine";

            oscilador.frequency.setValueAtTime(
                frequencia,
                inicio
            );

            ganho.gain.setValueAtTime(
                1.0,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                inicio + 0.45
            );

            oscilador.connect(
                ganho
            );

            ganho.connect(
                audioContext.destination
            );

            oscilador.start(
                inicio
            );

            oscilador.stop(
                inicio + 0.45
            );

        }
    );

}

/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){

    return "R$ " +
        Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   SALDO — NÃO ALTERADO
===================================================== */

function atualizarSaldo(){

    saldoEl.innerText =
        dinheiro(saldoReal);

    saldoPainel.innerText =
        dinheiro(saldoReal);

    if(
        saldoReal < valorAposta
    ){

        saldoEl.style.color =
            "#ff4141";

    }else{

        saldoEl.style.color =
            "#ffe34f";

    }

    atualizarBotao();

}


async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
    .auth
    .getSession();

    if(error){

        console.error(
            "Erro de sessão:",
            error
        );

        return null;

    }

    return data?.session?.user || null;

}


async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
    .from("saldos")
    .select("valor")
    .eq(
        "user_id",
        usuarioAtual.id
    )
    .single();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO CARREGAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        Number(
            data?.valor || 0
        );

    atualizarSaldo();

    return true;

}


async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO ATUALIZAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        valorFinal;

    atualizarSaldo();

    return true;

}


/* =====================================================
   CRIAR NÚMEROS
===================================================== */

function criarNumeros(){

    const area =
        document.getElementById("numeros");

    area.innerHTML = "";

    const total =
        premios.length;

    const raio =
        37;

    for(
        let i = 0;
        i < total;
        i++
    ){

        const numero =
            document.createElement("div");

        numero.className =
            "numero";

        if(
            premios[i] === 0
        ){

            numero.classList.add(
                "perdeu"
            );

        }

        if(
            premios[i] === 10
        ){

            numero.classList.add(
                "superbonus"
            );

        }

        const conteudo =
            document.createElement("span");

        conteudo.className =
            "numero-conteudo";


        if(
            premios[i] === 10
        ){

            conteudo.innerHTML =
                "SUPER<br>BÔNUS";

        }else if(
            premios[i] === 0
        ){

            conteudo.innerText =
                "PERDEU";

        }else{

            conteudo.innerText =
                dinheiro(premios[i]);

        }


        numero.appendChild(
            conteudo
        );


        /*
           Cada número fica em sua própria posição.
           Não usamos quadrado nem borda.
        */

        const angulo =
            (
                i *
                (360 / total)
            ) - 90;

        const rad =
            angulo *
            Math.PI /
            180;

        const x =
            Math.cos(rad) *
            raio;

        const y =
            Math.sin(rad) *
            raio;


        numero.style.setProperty(
            "--x",
            x + "%"
        );

        numero.style.setProperty(
            "--y",
            y + "%"
        );


        numero.style.transform =
            `translate(${x}px,${y}px)`;


        /*
           Texto fica em pé/radial.
        */

        let rotacaoTexto =
            angulo + 90;

        /*
           Mantém a leitura mais natural.
        */

        if(
            rotacaoTexto > 90 &&
            rotacaoTexto < 270
        ){

            rotacaoTexto += 180;

        }


        conteudo.style.setProperty(
            "--texto-rotacao",
            rotacaoTexto + "deg"
        );


        numero.dataset.index =
            i;


        area.appendChild(
            numero
        );

    }

}

/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

    if(girando){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "ROLETA GIRANDO...";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "SALDO INSUFICIENTE";

        return;

    }

    btnApostar.disabled =
        false;

    btnApostar.innerText =
        "GIRAR ROLETA";

}


/* =====================================================
   GIRAR
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();


    if(!usuarioAtual){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }


    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }


    girando = true;

    atualizarBotao();


    /*
       SALDO ORIGINAL:
       continua usando exatamente o sistema real.
    */

    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );


    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }


    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";


    document
    .querySelectorAll(".numero")
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );


    iniciarSomRoleta();


    /*
       Escolhe o resultado.
    */

    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];


    const tamanhoCasa =
        360 /
        premios.length;


    const anguloPremio =
        indice *
        tamanhoCasa;


    /*
       GIRO MAIS LONGO.

       2 voltas iniciais suaves
       + 7 voltas completas
       + posição final.

       A transição de 9 segundos
       faz a parada desacelerar.
    */

    const voltas =
        360 * 9;


    const novaRotacao =
        rotacaoAtual +
        voltas +
        (360 - anguloPremio);


    /*
       Começa com uma pequena pausa
       para não parecer que dispara
       instantaneamente.
    */

    roleta.style.transition =
        "transform 10s cubic-bezier(.15,.10,.18,1)";


    /*
       Força o navegador a reconhecer
       a posição anterior antes de iniciar.
    */

    void roleta.offsetWidth;


    roleta.style.transform =
        `rotate(${novaRotacao}deg)`;


    rotacaoAtual =
        novaRotacao;


    /*
       O tempo precisa acompanhar
       a transição acima.
    */

    setTimeout(
        function(){

            finalizarRodada(
                indice,
                premio
            );

        },
        10000
    );

};


/* =====================================================
   FINALIZAR
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();


    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );


    if(numero){

        numero.classList.add(
            "destaque"
        );

    }


    /*
       IMPORTANTE:
       R$ 0,00 = perdeu.
       Qualquer valor acima de zero = ganhou.
    */

    if(
        premio === 0
    ){

        resultado.innerHTML =
            "❌ PERDEU";

        resultado.style.color =
            "#ff5555";


        girando = false;

        atualizarBotao();

        return;

    }


    /*
       CRÉDITO REAL DO PRÊMIO.
    */

    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio;


    const creditado =
        await salvarSaldo(
            novoSaldo
        );


    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }


    tocarPremio();


    /*
       SUPER BÔNUS
    */

    if(
        premio === 10
    ){

        efeitoBonus.classList.add(
            "ativo"
        );


        resultado.innerHTML =
            "⚡ SUPER BÔNUS ⚡<br>" +
            "<span style='font-size:28px;color:#ffe36a'>" +
            "R$ 10,00" +
            "</span>";

        resultado.style.color =
            "#ffe36a";


        setTimeout(
            function(){

                efeitoBonus.classList.remove(
                    "ativo"
                );

            },
            2600
        );


    }else{

        /*
           GANHO NORMAL.
           R$ 1,00 aparece corretamente
           como prêmio.
        */

        resultado.innerHTML =
            "⚡ GANHOU<br>" +
            "<span style='font-size:25px;color:#ffe36a'>" +
            dinheiro(premio) +
            "</span>";

        resultado.style.color =
            "#ffe36a";

    }


    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1500
    );

}

/* =====================================================

===================================================== */

async function iniciar(){

    try{

        usuarioAtual =
            await obterUsuario();


        if(!usuarioAtual){

            alert(
                "Você precisa estar logado para jogar."
            );

            window.location.href =
                "../index.html";

            return;

        }


        const carregou =
            await carregarSaldo();


        if(!carregou){

            carregando.style.display =
                "none";

            return;

        }


        criarNumeros();

        atualizarSaldo();


        carregando.style.display =
            "none";


    }catch(error){

        console.error(
            "Erro:",
            error
        );

        carregando.style.display =
            "none";

        resultado.innerHTML =
            "❌ ERRO AO INICIAR ROLETA";

        resultado.style.color =
            "#ff4141";

    }

}
