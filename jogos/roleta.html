<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta - ApostaXBet</title>

<style>
body{
    background:#0f1923;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#00ff88;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.area{
    position:relative;
    width:280px;
    height:280px;
    margin:40px auto;
}

#ponteiro{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    z-index:5;
}


#roleta{
    width:270px;
    height:270px;
    border-radius:50%;
    border:8px solid white;

    background:conic-gradient(
        #00ff88 0deg 45deg,
        #ff4444 45deg 90deg,
        #ffaa00 90deg 135deg,
        #00ff88 135deg 180deg,
        #ff4444 180deg 225deg,
        #ffaa00 225deg 270deg,
        #00ff88 270deg 315deg,
        #ff4444 315deg 360deg
    );

    transition:transform 5s cubic-bezier(.15,.8,.2,1);

    position:relative;
}


.valor{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:25px;
    font-size:18px;
    font-weight:bold;
}


.v1{transform:rotate(22deg);}
.v2{transform:rotate(67deg);}
.v3{transform:rotate(112deg);}
.v4{transform:rotate(157deg);}
.v5{transform:rotate(202deg);}
.v6{transform:rotate(247deg);}
.v7{transform:rotate(292deg);}
.v8{transform:rotate(337deg);}


button{
    padding:15px 35px;
    background:#00ff88;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}


a{
    display:block;
    margin-top:30px;
    color:#aaa;
}
</style>

</head>

<body>


<h1>🎡 Roleta da Sorte</h1>

<div id="saldo"></div>


<div class="area">

<div id="ponteiro">🔻</div>

<div id="roleta">

<div class="valor v1">R$1</div>
<div class="valor v2">R$5</div>
<div class="valor v3">R$0</div>
<div class="valor v4">R$10</div>
<div class="valor v5">R$2</div>
<div class="valor v6">R$0</div>
<div class="valor v7">R$50</div>
<div class="valor v8">R$1</div>

</div>

</div>


<button onclick="girar()">GIRAR</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

let girando=false;

let giroAtual=0;


let premios=[
1,
5,
0,
10,
2,
0,
50,
1
];


function atualizarSaldo(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizarSaldo();



function girar(){

if(girando)return;


if(saldo < 1){

alert("Saldo insuficiente!");

return;

}


girando=true;


saldo-=1;

atualizarSaldo();



let sorte=Math.floor(Math.random()*8);



let volta=360*6;


let ajuste=360-(sorte*45)-22;


giroAtual += volta + ajuste;



document.getElementById("roleta").style.transform=
"rotate("+giroAtual+"deg)";



setTimeout(()=>{


let premio=premios[sorte];


saldo+=premio;

atualizarSaldo();


alert("🎉 Você ganhou R$ "+premio.toFixed(2));


girando=false;


},5200);



}

</script>


</body>
</html>
