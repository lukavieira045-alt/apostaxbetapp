       GIRO MAIS LONGO.
       Começa devagar,
       ganha velocidade,
       e termina lentamente.
    */

.roleta::before{

    border-radius:50%;

===================================================== */

    top:50%;

   PONTEIRO
===================================================== */

.ponteiro{

    z-index:20;

    top:-3px;

    width:0;
    height:0;

    border-left:13px solid transparent;

    filter:
    drop-shadow(0 0 4px white)

}


/* =====================================================

===================================================== */

.raio{

    opacity:.7;

let usuarioAtual = null;

/* =====================================================
   ÁUDIO
===================================================== */

const musicaRoleta =
document.getElementById(
    "musicaRoleta"
);

musicaRoleta.volume = 0.10;

let musicaIniciada = false;

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 45;


function iniciarMusica(){

    if(musicaIniciada)
        return;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(
            function(){

                musicaIniciada = true;

            }
        )
        .catch(
            function(){}
        );

    }

}


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    iniciarMusica();

}


function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "square";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        80,
        agora + .08
    );

    ganho.gain.setValueAtTime(
        .6,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .08
    );

    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);

    osc.stop(
        agora + .08
    );

}


function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 65;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "square";

    osc.frequency.setValueAtTime(
        850,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        420,
        agora + .035
    );

    ganho.gain.setValueAtTime(
        .38,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .055
    );

    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);

    osc.stop(
        agora + .06
    );

    /*
       O som vai ficando mais espaçado,
       acompanhando a desaceleração.
    */

    velocidadeSom += 11;

    if(velocidadeSom > 300)
        velocidadeSom = 300;

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(
            timerRoleta
        );

        timerRoleta = null;

    }

}


function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
    [
        523.25,
        659.25,
        783.99,
        1046.50
    ];

    notas.forEach(
        function(freq,i){

            const osc =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                i * .12;

            osc.type =
                "sine";

            osc.frequency.setValueAtTime(
                freq,
                inicio
            );

            ganho.gain.setValueAtTime(
                .8,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                .001,
                inicio + .45
            );

            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            osc.start(inicio);

            osc.stop(
                inicio + .45
            );

        }
    );

}

/* =====================================================
   SALDO
   MESMO SISTEMA DO SEU CÓDIGO
===================================================== */

function atualizarSaldo(){

    saldoEl.innerText =
        dinheiro(saldoReal);

    saldoPainel.innerText =
        dinheiro(saldoReal);

    if(
        saldoReal < valorAposta
    ){

        saldoEl.style.color =
            "#ff4141";

    }else{

        saldoEl.style.color =
            "#ffe34f";

    }

    atualizarBotao();

}


async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
    .auth
    .getSession();

    if(error){

        console.error(
            "Erro de sessão:",
            error
        );

        return null;

    }

    return data?.session?.user || null;

}


async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
    .from("saldos")
    .select("valor")
    .eq(
        "user_id",
        usuarioAtual.id
    )
    .single();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO CARREGAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        Number(
            data?.valor || 0
        );

    atualizarSaldo();

    return true;

}


async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor:valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO ATUALIZAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        valorFinal;

    atualizarSaldo();

    return true;

}


/* =====================================================
   CRIAR NÚMEROS
===================================================== */

function textoVertical(valor){

    if(valor === 0){

        return "P\nE\nR\nD\nE\nU";

    }

    if(valor === 10){

        return "1\n0\nS\nU\nP\nE\nR";

    }

    /*
       Exemplo:
       R$ 1,00

       fica:

       1
       ,
       0
       0
    */

    const texto =
        Number(valor)
        .toFixed(2)
        .replace(".",",");

    return texto
        .split("")
        .join("\n");

}


function criarNumeros(){

    const area =
        document.getElementById(
            "numeros"
        );

    area.innerHTML = "";

    const total =
        premios.length;

    const raio =
        38;

    for(
        let i=0;
        i<total;
        i++
    ){

        const numero =
            document.createElement(
                "div"
            );

        numero.className =
            "numero";

        if(
            premios[i] === 0
        ){

            numero.classList.add(
                "perder"
            );

        }

        if(
            premios[i] === 10
        ){

            numero.classList.add(
                "super"
            );

        }

        const conteudo =
            document.createElement(
                "span"
            );

        conteudo.innerText =
            textoVertical(
                premios[i]
            );

        numero.appendChild(
            conteudo
        );

        const angulo =
            (
                i *
                (360 / total)
            ) - 90;

        const rad =
            angulo *
            Math.PI /
            180;

        const x =
            Math.cos(rad) *
            raio;

        const y =
            Math.sin(rad) *
            raio;

        /*
           Mantém o texto em pé.
        */

        numero.style.transform =
            `translate(${x}px,${y}px)`;

        numero.dataset.index =
            i;

        area.appendChild(
            numero
        );

    }

}

function mostrarSuperBonus(){

        document.getElementById(
            "efeitoBonus"
        );

    efeito.classList.remove(
        "ativo"
    );

/* =====================================================
   GIRAR
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();

    if(!usuarioAtual){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }

    girando = true;

    atualizarBotao();


    /*
       DEBITA SOMENTE A APOSTA.
       NÃO CRIA OUTRO SALDO.
    */

    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }


    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";


    document
    .querySelectorAll(
        ".numero"
    )
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );


    iniciarSomRoleta();


    /*
       Sorteia UMA casa.
       O resultado mostrado será exatamente
       a mesma casa sorteada.
    */

    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];


    const tamanhoCasa =
        360 /
        premios.length;

    const anguloPremio =
        indice *
        tamanhoCasa;


    /*
       8 voltas completas.
       O CSS faz a aceleração inicial
       e a desaceleração final.
    */

    const voltas =
        360 * 8;


    const novaRotacao =
        rotacaoAtual +
        voltas +
        (360 - anguloPremio);


    roleta.style.transform =
        `rotate(${novaRotacao}deg)`;


    rotacaoAtual =
        novaRotacao;


    /*
       O tempo é exatamente o mesmo
       da animação CSS: 8.5 segundos.
    */

    setTimeout(
        function(){

            finalizarRodada(
                indice,
                premio
            );

        },
        8600
    );

};


/* =====================================================
   FINALIZAR
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();


    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );


    if(numero){

        numero.classList.add(
            "destaque"
        );

    }


    /*
       IMPORTANTE:
       premio 0 = perdeu
       qualquer valor acima de 0 = ganhou.
    */

    if(premio === 0){

        resultado.innerHTML =
            "💥 PERDEU<br>" +
            "<span style='font-size:22px;color:#ff5555'>" +
            "TENTE NOVAMENTE" +
            "</span>";

        resultado.style.color =
            "#ff5555";


        setTimeout(
            function(){

                girando = false;

                atualizarBotao();

            },
            1200
        );

        return;

    }


    /*
       Crédito do prêmio.
       Continua usando o mesmo saldoReal
       e a mesma tabela do Supabase.
    */

    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio;


    const creditado =
        await salvarSaldo(
            novoSaldo
        );


    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }


    /*
       SUPER BÔNUS
    */

    if(premio === 10){

        mostrarSuperBonus();

        tocarPremio();

        resultado.innerHTML =
            "⚡ SUPER BÔNUS ⚡<br>" +
            "<span style='font-size:28px;color:#fff'>" +
            "R$ 10,00" +
            "</span>";

        resultado.style.color =
            "#ffe36a";

    }else{

        tocarPremio();

        /*
           Aqui não existe mais a possibilidade
           de mostrar PERDEU quando o prêmio é positivo.
        */

        resultado.innerHTML =
            "⚡ PRÊMIO<br>" +
            "<span style='font-size:28px;color:#ffe36a'>" +
            dinheiro(premio) +
            "</span>";

        resultado.style.color =
            "#ffe36a";

    }


    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1500
    );

}

/* =====================================================
   INICIAR
===================================================== */

async function iniciar(){

    try{

        usuarioAtual =
            await obterUsuario();


        if(!usuarioAtual){

            alert(
                "Você precisa estar logado para jogar."
            );

            window.location.href =
                "../index.html";

            return;

        }


        const carregou =
            await carregarSaldo();


        if(!carregou){

            carregando.style.display =
                "none";

            return;

        }


        criarNumeros();

        atualizarSaldo();


        carregando.style.display =
            "none";


    }catch(error){

        console.error(
            "Erro:",
            error
        );

        carregando.style.display =
            "none";

        resultado.innerHTML =
            "❌ ERRO AO INICIAR ROLETA";

        resultado.style.color =
            "#ff4141";

    }

}
