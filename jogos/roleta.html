    height:100%;

    transform-origin:center;

.roleta.girando .numero-conteudo{
    animation:
    esticarNumero .20s ease-in-out infinite alternate;
}

.roleta.girando .numero:nth-child(2n) .numero-conteudo{

}

.roleta.girando .numero:nth-child(3n) .numero-conteudo{

    45%{

<script type="module">

import {

/* =====================================================

   VOLUME = 10%
===================================================== */

const musicaRoleta =
    document.getElementById("musicaRoleta");

musicaRoleta.volume = 0.10;

let musicaIniciada = false;


function iniciarMusica(){

    if(musicaIniciada)
        return;

    if(!musicaRoleta)
        return;

    musicaRoleta.volume = 0.10;

    const promessa =
        musicaRoleta.play();

    if(promessa){

        promessa
        .then(function(){

            musicaIniciada = true;

        })
        .catch(function(error){

            console.log(
                "Aguardando interação para iniciar música:",
                error
            );

        });

    }

}


/* =====================================================
   ÁUDIO DOS EFEITOS
===================================================== */

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 45;


function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    /*
       Tenta iniciar a música junto com
       a primeira interação do jogador.
    */

    iniciarMusica();

}


/* =====================================================
   SOM DE CLIQUE
===================================================== */

function tocarClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        180,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        80,
        agora + 0.08
    );

    ganho.gain.setValueAtTime(
        1.0,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.08
    );

    oscilador.connect(
        ganho
    );

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(
        agora
    );

    oscilador.stop(
        agora + 0.08
    );

}


/* =====================================================
   SOM DA ROLETA
===================================================== */

function iniciarSomRoleta(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomRoleta();

    velocidadeSom = 45;

    tocarTic();

}


function tocarTic(){

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        850,
        agora
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        420,
        agora + 0.035
    );

    ganho.gain.setValueAtTime(
        0.45,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.055
    );

    oscilador.connect(
        ganho
    );

    ganho.connect(
        audioContext.destination
    );

    oscilador.start(
        agora
    );

    oscilador.stop(
        agora + 0.06
    );

    velocidadeSom += 8;

    if(
        velocidadeSom > 280
    ){

        velocidadeSom = 280;

    }

    timerRoleta =
        setTimeout(
            tocarTic,
            velocidadeSom
        );

}


function pararSomRoleta(){

    if(timerRoleta){

        clearTimeout(
            timerRoleta
        );

        timerRoleta = null;

    }

}


/* =====================================================
   SOM DE PRÊMIO
===================================================== */

function tocarPremio(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const notas =
        [523.25,659.25,783.99,1046.50];

    notas.forEach(
        function(frequencia,i){

            const oscilador =
                audioContext.createOscillator();

            const ganho =
                audioContext.createGain();

            const inicio =
                agora +
                (i * 0.12);

            oscilador.type =
                "sine";

            oscilador.frequency.setValueAtTime(
                frequencia,
                inicio
            );

            ganho.gain.setValueAtTime(
                1.0,
                inicio
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                inicio + 0.45
            );

            oscilador.connect(
                ganho
            );

            ganho.connect(
                audioContext.destination
            );

            oscilador.start(
                inicio
            );

            oscilador.stop(
                inicio + 0.45
            );

        }
    );

}

/* =====================================================

async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
    .auth
    .getSession();

    if(error){

        console.error(
            "Erro de sessão:",
            error
        );

        return null;

    }

    return data?.session?.user || null;

}


/* =====================================================
   CARREGAR SALDO
===================================================== */

async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
    .from("saldos")
    .select("valor")
    .eq(
        "user_id",
        usuarioAtual.id
    )
    .single();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO CARREGAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        Number(
            data?.valor || 0
        );

    atualizarSaldo();

    return true;

}


/* =====================================================
   SALVAR SALDO
===================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        resultado.innerHTML =
            "❌ ERRO AO ATUALIZAR SALDO";

        resultado.style.color =
            "#ff4141";

        return false;

    }

    saldoReal =
        valorFinal;

    atualizarSaldo();

    return true;

}

        );

    area.innerHTML = "";

    const total =
        premios.length;

    for(
        let i = 0;
        i < total;
        i++
    ){

        const numero =
            document.createElement(
                "div"
            );

        numero.className =
            "numero";

        const conteudo =
            document.createElement(
                "span"
            );

        conteudo.className =
            "numero-conteudo";

        conteudo.innerText =
            dinheiro(
                premios[i]
            );

        numero.appendChild(
            conteudo
        );

        const angulo =
            (
                i *
                (360 / total)
            ) - 90;

        const raio = 40;

        const x =
            Math.cos(
                angulo *
                Math.PI / 180
            ) * raio;

        const y =
            Math.sin(
                angulo *
                Math.PI / 180
            ) * raio;

        numero.style.transform =
            `translate(${x}px,${y}px)`;

        numero.dataset.index =
            i;

        area.appendChild(
            numero
        );

    }

}


/* =====================================================
   ESCOLHER VALOR
===================================================== */

window.selecionarValor =
function(
    valor,
    botao
){

    if(girando)
        return;

    tocarClique();

    valorAposta =
        Number(valor);

    document
    .querySelectorAll(
        ".btn-valor"
    )
    .forEach(
        function(b){

            b.classList.remove(
                "ativo"
            );

        }
    );

    botao.classList.add(
        "ativo"
    );

    apostaInfo.innerText =
        dinheiro(
            valorAposta
        );

    fichaDisplay.innerText =
        Number(valorAposta)
        .toFixed(2)
        .replace(".",",");

    atualizarSaldo();

};


/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

    if(girando){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "ROLETA GIRANDO...";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        btnApostar.disabled =
            true;

        btnApostar.innerText =
            "SALDO INSUFICIENTE";

        return;

    }

    btnApostar.disabled =
        false;

    btnApostar.innerText =
        "GIRAR ROLETA";

}


/* =====================================================
   EFEITO DOS NÚMEROS
===================================================== */

function iniciarEfeitoNumeros(){

    roleta.classList.add(
        "girando"
    );

}


function pararEfeitoNumeros(){

    roleta.classList.remove(
        "girando"
    );

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

window.girarRoleta =
async function(){

    if(girando)
        return;

    iniciarAudio();

    tocarClique();

    if(
        !usuarioAtual
    ){

        resultado.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        resultado.style.color =
            "#ff4141";

        return;

    }

    if(
        saldoReal <
        valorAposta
    ){

        resultado.innerHTML =
            "❌ SALDO INSUFICIENTE";

        resultado.style.color =
            "#ff4141";

        return;

    }

    girando = true;

    atualizarBotao();

    const saldoAnterior =
        saldoReal;

    const novoSaldo =
        saldoAnterior -
        valorAposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        girando = false;

        atualizarBotao();

        return;

    }

    resultado.innerHTML =
        "⚡ GIRANDO...";

    resultado.style.color =
        "#ffe36a";

    document
    .querySelectorAll(
        ".numero"
    )
    .forEach(
        function(n){

            n.classList.remove(
                "destaque"
            );

        }
    );

    iniciarSomRoleta();

    iniciarEfeitoNumeros();

    const indice =
        Math.floor(
            Math.random() *
            premios.length
        );

    const premio =
        premios[indice];

    const tamanhoCasa =
        360 /
        premios.length;

    const anguloPremio =
        indice *
        tamanhoCasa;

    const voltas =
        360 * 7;

    const novaRotacao =
        rotacaoAtual +
        voltas +
        (360 - anguloPremio);

    roleta.style.transform =
        `rotate(${novaRotacao}deg)`;

    rotacaoAtual =
        novaRotacao;

    setTimeout(
        function(){

            finalizarRodada(
                indice,
                premio
            );

        },
        4500
    );

};


/* =====================================================
   FINALIZAR
===================================================== */

async function finalizarRodada(
    indice,
    premio
){

    pararSomRoleta();

    pararEfeitoNumeros();

    const numero =
        document.querySelector(
            `.numero[data-index="${indice}"]`
        );

    if(numero){

        numero.classList.add(
            "destaque"
        );

    }

    const saldoAtual =
        saldoReal;

    const novoSaldo =
        saldoAtual +
        premio;

    const creditado =
        await salvarSaldo(
            novoSaldo
        );

    if(!creditado){

        girando = false;

        atualizarBotao();

        return;

    }

    tocarPremio();

    resultado.innerHTML =
        "⚡ PRÊMIO<br>" +
        "<span style='font-size:25px;color:#ffe36a'>" +
        dinheiro(premio) +
        "</span>";

    resultado.style.color =
        "#ffe36a";

    setTimeout(
        function(){

            girando = false;

            atualizarBotao();

        },
        1200
    );

}

/* =====================================================
   INICIAR
===================================================== */

async function iniciar(){

    try{

        usuarioAtual =
            await obterUsuario();

        if(!usuarioAtual){

            alert(
                "Você precisa estar logado para jogar."
            );

            window.location.href =
                "../index.html";

            return;

        }

        const carregou =
            await carregarSaldo();

        if(!carregou){

            carregando.style.display =
                "none";

            return;

        }

        criarNumeros();

        atualizarSaldo();

        carregando.style.display =
            "none";

    }catch(error){

        console.error(
            "Erro:",
            error
        );

        carregando.style.display =
            "none";

        resultado.innerHTML =
            "❌ ERRO AO INICIAR ROLETA";

        resultado.style.color =
            "#ff4141";

    }

}
