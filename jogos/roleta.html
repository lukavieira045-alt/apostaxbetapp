<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta - ApostaXBet</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
}

.topo{
    text-align:center;
    padding:20px 15px;
    background:#111;
    border-bottom:2px solid #d9b21f;
}

.topo h1{
    color:#e6c229;
    font-size:23px;
    margin-bottom:6px;
}

.saldo{
    color:#00ed91;
    font-size:18px;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:500px;
    margin:25px auto;
    text-align:center;
}

.roleta-box{
    background:#151515;
    border:1px solid #333;
    border-radius:18px;
    padding:22px 15px 28px;
    box-shadow:0 5px 25px rgba(0,0,0,.6);
}

.info-text{
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
}

/* ÁREA DA ROLETA */

.roleta-area{
    position:relative;
    width:300px;
    height:300px;
    max-width:85vw;
    max-height:85vw;
    margin:10px auto 25px;
}

.ponteiro{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:30px solid #e6c229;
    z-index:10;
    filter:drop-shadow(0 2px 3px #000);
}

.roleta{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid #d9b21f;
    position:relative;
    overflow:hidden;
    box-shadow:
        0 0 0 5px #222,
        0 0 25px rgba(217,178,31,.4);
    background:
        conic-gradient(
            #c92f3b 0deg 30deg,
            #111 30deg 60deg,
            #c92f3b 60deg 90deg,
            #111 90deg 120deg,
            #c92f3b 120deg 150deg,
            #111 150deg 180deg,
            #c92f3b 180deg 210deg,
            #111 210deg 240deg,
            #c92f3b 240deg 270deg,
            #111 270deg 300deg,
            #c92f3b 300deg 330deg,
            #159447 330deg 360deg
        );
    transition:transform 3s cubic-bezier(.15,.75,.15,1);
}

.roleta::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#111;
    border:5px solid #e6c229;
    border-radius:50%;
    box-shadow:0 0 10px #000;
}

.resultado{
    min-height:45px;
    font-size:27px;
    font-weight:bold;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.controles{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.btn-cor{
    flex:1;
    min-height:52px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    font-size:14px;
    opacity:.45;
    cursor:pointer;
}

.btn-cor.ativo{
    opacity:1;
    transform:scale(1.04);
    box-shadow:0 0 15px rgba(255,255,255,.35);
}

.btn-vermelho{
    background:#c92f3b;
}

.btn-preto{
    background:#222;
    border:1px solid #666;
}

.btn-verde{
    background:#159447;
}

.btn-apostar{
    width:100%;
    min-height:55px;
    border:0;
    border-radius:11px;
    background:#e6c229;
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn-apostar:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.btn-voltar{
    display:inline-block;
    margin-top:22px;
    color:#888;
    text-decoration:none;
    padding:10px;
}

.btn-voltar:hover{
    color:#e6c229;
}
</style></head><body><div class="topo">
    <h1>🎰 APOSTAXBET</h1>
    <div class="saldo">💰 R$ 0,00</div>
</div><div class="container"><div class="roleta-box">

    <p class="info-text">
        ROLETA
    </p>

    <div class="roleta-area">

        <div class="ponteiro"></div>

        <div class="roleta" id="roleta"></div>

    </div>

    <div class="resultado" id="resultado">
        Escolha uma cor
    </div>

    <div class="controles">

        <button
            class="btn-cor btn-vermelho"
            onclick="selecionarCor('vermelho',this)">
            Vermelho
        </button>

        <button
            class="btn-cor btn-verde"
            onclick="selecionarCor('verde',this)">
            Verde
        </button>

        <button
            class="btn-cor btn-preto"
            onclick="selecionarCor('preto',this)">
            Preto
        </button>

    </div>

    <button
        id="btnGirar"
        class="btn-apostar"
        onclick="girarRoleta()"
        disabled>
        GIRAR ROLETA
    </button>

</div>

<a href="../index.html" class="btn-voltar">
    ← Voltar para Lobby
</a>

</div><script>

let corSelecionada = null;
let girando = false;
let rotacaoAtual = 0;

const roleta = document.getElementById("roleta");
const resultado = document.getElementById("resultado");
const btnGirar = document.getElementById("btnGirar");

function selecionarCor(cor, botao){

    if(girando) return;

    document
        .querySelectorAll(".btn-cor")
        .forEach(btn => btn.classList.remove("ativo"));

    botao.classList.add("ativo");

    corSelecionada = cor;

    btnGirar.disabled = false;

    resultado.textContent =
        "Cor escolhida: " + cor.toUpperCase();
}

function girarRoleta(){

    if(girando || !corSelecionada) return;

    girando = true;
    btnGirar.disabled = true;

    document
        .querySelectorAll(".btn-cor")
        .forEach(btn => btn.style.pointerEvents = "none");

    resultado.textContent = "GIRANDO...";
    resultado.style.color = "#fff";

    const voltas = 5 + Math.floor(Math.random() * 3);
    const novoGiro = voltas * 360 + Math.floor(Math.random() * 360);

    rotacaoAtual += novoGiro;

    roleta.style.transform =
        "rotate(" + rotacaoAtual + "deg)";

    setTimeout(() => {

        const numero = Math.floor(Math.random() * 15);

        let resultadoCor;

        if(numero === 0){
            resultadoCor = "verde";
        }else if(numero % 2 === 0){
            resultadoCor = "preto";
        }else{
            resultadoCor = "vermelho";
        }

        resultado.textContent =
            "Resultado: " + resultadoCor.toUpperCase();

        if(resultadoCor === "vermelho"){
            resultado.style.color = "#ff4d4d";
        }

        if(resultadoCor === "preto"){
            resultado.style.color = "#aaa";
        }

        if(resultadoCor === "verde"){
            resultado.style.color = "#00ed91";
        }

        setTimeout(() => {

            girando = false;
            btnGirar.disabled = false;

            document
                .querySelectorAll(".btn-cor")
                .forEach(btn => btn.style.pointerEvents = "auto");

        },700);

    },3000);
}

</script></body>
</html>
