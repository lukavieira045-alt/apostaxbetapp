<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta Cassino - ApostaXBet</title>

<style>

body{
    background:#080808;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.area{
    width:320px;
    height:320px;
    margin:40px auto;
    position:relative;
}

#ponteiro{
    position:absolute;
    top:-35px;
    left:50%;
    transform:translateX(-50%);
    font-size:45px;
    z-index:5;
}

#roleta{
    width:300px;
    height:300px;
    border-radius:50%;
    border:12px solid #ffd700;

    background:conic-gradient(
        #111 0deg 60deg,
        #d40000 60deg 120deg,
        #111 120deg 180deg,
        #00aa55 180deg 240deg,
        #111 240deg 300deg,
        #ffd700 300deg 360deg
    );

    transition:transform 7s cubic-bezier(.15,.8,.2,1);

    box-shadow:0 0 30px #ffd700;

    position:relative;
}

.valor{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:25px;
    font-size:22px;
    font-weight:bold;
}


.v1{transform:rotate(0deg);}
.v2{transform:rotate(60deg);}
.v3{transform:rotate(120deg);}
.v4{transform:rotate(180deg);}
.v5{transform:rotate(240deg);}
.v6{transform:rotate(300deg);}


button{
    padding:15px 40px;
    background:#ffd700;
    border:0;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}


a{
    display:block;
    margin-top:30px;
    color:#aaa;
}

</style>

</head>

<body>

<h1>🎰 Roleta Cassino</h1>

<div id="saldo"></div>

<div class="area">

<div id="ponteiro">🔻</div>

<div id="roleta">

<div class="valor v1">R$0</div>
<div class="valor v2">R$1</div>
<div class="valor v3">R$2</div>
<div class="valor v4">R$5</div>
<div class="valor v5">R$10</div>
<div class="valor v6">R$50</div>

</div>

</div>


<button onclick="girar()">GIRAR</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

let girando=false;

let giroAtual=0;


const premios=[
0,
1,
2,
5,
10,
50
];


function atualizarSaldo(){

document.getElementById("saldo").innerHTML =
"💰 Saldo: R$ " + saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizarSaldo();



function girar(){

if(girando) return;


if(saldo < 1){

alert("Saldo insuficiente!");

return;

}


girando=true;


saldo-=1;

atualizarSaldo();


let casa=Math.floor(Math.random()*6);


let grausCasa=60;


let destino=-(casa*grausCasa)-30;


giroAtual += (360*6)+destino;


document.getElementById("roleta").style.transform =
"rotate("+giroAtual+"deg)";



setTimeout(()=>{


let premio=premios[casa];


saldo += premio;

atualizarSaldo();


alert("🎉 Você ganhou R$ "+premio.toFixed(2));


girando=false;


},7000);


}

</script>

</body>
</html>
