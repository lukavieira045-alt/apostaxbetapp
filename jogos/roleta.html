<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta - ApostaXBet</title>

<style>
body{
    background:#0f1923;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#00ff88;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.container{
    position:relative;
    width:280px;
    height:280px;
    margin:40px auto;
}

#ponteiro{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    font-size:35px;
    z-index:2;
}

#roleta{
    width:270px;
    height:270px;
    border-radius:50%;
    background:conic-gradient(
        #00ff88 0deg 45deg,
        #ff4444 45deg 90deg,
        #ffaa00 90deg 135deg,
        #00ff88 135deg 180deg,
        #ff4444 180deg 225deg,
        #ffaa00 225deg 270deg,
        #00ff88 270deg 315deg,
        #ff4444 315deg 360deg
    );
    border:8px solid white;
    transition:4s;
    display:flex;
    align-items:center;
    justify-content:center;
}

#texto{
    font-size:18px;
    font-weight:bold;
    color:white;
    transform:rotate(0deg);
}

button{
    padding:15px 35px;
    background:#00ff88;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

a{
    display:block;
    margin-top:30px;
    color:#aaa;
}
</style>

</head>

<body>

<h1>🎡 Roleta da Sorte</h1>

<div id="saldo"></div>

<div class="container">

<div id="ponteiro">🔻</div>

<div id="roleta">
<div id="texto">
R$1 | R$5 | R$0 | R$10<br>
R$2 | R$0 | R$50 | R$1
</div>
</div>

</div>


<button onclick="girar()">GIRAR</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

let rodando=false;

let premios=[
1,
5,
0,
10,
2,
0,
50,
1
];


function atualizarSaldo(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}

atualizarSaldo();



function girar(){

if(rodando)return;

if(saldo < 1){

alert("Saldo insuficiente!");

return;

}


rodando=true;

saldo-=1;

atualizarSaldo();


let roleta=document.getElementById("roleta");


let sorte=Math.floor(Math.random()*8);

let graus=(360*5)+(sorte*45)+22;


roleta.style.transform=
"rotate("+graus+"deg)";


setTimeout(()=>{


let premio=premios[sorte];


saldo+=premio;

atualizarSaldo();


alert("🎉 Você ganhou R$ "+premio.toFixed(2));


rodando=false;


},4000);


}

</script>

</body>
</html>
