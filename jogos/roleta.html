@media(max-width:600px){.container{padding-top:18px!important}.titulo{font-size:16px!important;letter-spacing:3px!important}.roleta-area{padding:28px!important}.roleta{width:min(84vw,390px)!important;height:min(84vw,390px)!important;border-width:9px!important}.numero{width:48px!important;height:150px!important;margin-left:-24px!important;margin-top:-150px!important;transform-origin:24px 150px!important}.numero-conteudo{min-width:45px!important;font-size:10px!important;padding:4px 2px!important}.centro{width:82px!important;height:82px!important}.centro strong{font-size:20px!important}.roleta-inner{inset:27px!important}.roleta:before{inset:6px!important;border-width:13px!important}.roleta:after{inset:21px!important}.painel,.resultado,.contagem{max-width:calc(100vw - 20px)!important}.lobby{top:84px!important;width:68px!important}.saldo-topo{min-width:98px!important}}
@media(max-width:360px){.roleta{width:310px!important;height:310px!important}.numero{width:42px!important;height:123px!important;margin-left:-21px!important;margin-top:-123px!important;transform-origin:21px 123px!important}.numero-conteudo{min-width:39px!important;font-size:8px!important;padding:3px 1px!important;line-height:10px!important}}
</style>
</head>
<body>
<audio id="musicaRoleta" src="musica-roleta.mp3" loop preload="auto"></audio>
<div id="carregando"> VERIFICANDO CONTA...</div>
<div class="superbonus-overlay" id="superBonusOverlay">
<div class="superbonus-raio"></div>
<div class="superbonus-titulo">⚡ SUPER BÔNUS </div>
<div class="superbonus-valor" id="superBonusValor">R$ 5,00</div>
</div>
<div class="topo">
<div class="logo"> APOSTAXBET</div>
<div class="saldo-topo"><div class="saldo-label">SALDO</div><div id="displaySaldo">R$ 0,00</div></div>
</div>
<a href="../index.html" class="lobby"><div class="lobby-icon"></div>Lobby</a>
<div class="container">
<div class="titulo">ROLETA DE RELÂMPAGOS</div>
<div class="subtitulo">ESCOLHA O VALOR DA APOSTA</div>
<div class="roleta-area">
<div class="ponteiro"></div>
<div class="raio raio1"></div><div class="raio raio2"></div><div class="raio raio3"></div>
<div class="roleta" id="roleta">
<div class="roleta-inner"></div>
<div class="numeros" id="numeros"></div>
<div class="centro"><strong>AX</strong><span>PRÊMIO</span></div>
</div>
</div>
<div class="resultado" id="resultado">ESCOLHA O VALOR DA APOSTA</div>
<div class="contagem" id="contagem">⏱️ APOSTAS ABERTAS:<strong>10</strong>s</div>
<div class="painel">
<div class="ficha-area"><div class="ficha" id="fichaDisplay">1,00</div></div>
<div class="valores">
<button class="btn-valor ativo" onclick="selecionarValor(1,this)">R$ 1</button>
<button class="btn-valor" onclick="selecionarValor(2,this)">R$ 2</button>
<button class="btn-valor" onclick="selecionarValor(5,this)">R$ 5</button>
</div>
<button id="btnApostar" class="btn-apostar" onclick="girarRoleta()" disabled>CARREGANDO...</button>
<div class="info"><span>Aposta:<strong id="apostaInfo">R$ 1,00</strong></span><span>Saldo:<strong id="saldoPainel">R$ 0,00</strong></span></div>
<div class="mensagem">SALDO CONECTADO À SUA CONTA</div>
</div>
</div>
<button class="repeat-btn" onclick="repetirAposta()">↻</button>
<button class="menu-btn" onclick="abrirMenu()"></button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const SUPABASE_URL = "https://jxbzjiwmajjzxgihfjgt.supabase.co";
const SUPABASE_KEY = "sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TAXA_CASA = 0.30;
let usuarioAtual=null, saldoReal=0, valorAposta=1, rotacaoAtual=0, girando=false;
let numeroEscolhido=null, fichaSelecionada=false, fichasNaRoleta=[];
let rodadaAberta=true, tempoRestante=10, intervaloContagem=null;
const premios=[0.10,0.20,0.30,0.10,0.50,0.10,0.20,0.00,0.30,0.10,0.20,0.30,0.10,0.50,5.00,0.10,0.00,0.20,0.30,0.10];
const roleta=document.getElementById("roleta"), resultado=document.getElementById("resultado"), btnApostar=document.getElementById("btnApostar");
const saldoEl=document.getElementById("displaySaldo"), saldoPainel=document.getElementById("saldoPainel"), apostaInfo=document.getElementById("apostaInfo");
const fichaDisplay=document.getElementById("fichaDisplay"), carregando=document.getElementById("carregando");
const superBonusOverlay=document.getElementById("superBonusOverlay"), superBonusValor=document.getElementById("superBonusValor"), contagem=document.getElementById("contagem");

function dinheiro(v){return "R$ "+Number(v||0).toFixed(2).replace(".",",")}
function iniciarContagem(){if(intervaloContagem){clearInterval(intervaloContagem);intervaloContagem=null}rodadaAberta=true;tempoRestante=10;contagem.classList.remove("encerrada");contagem.innerHTML='️ APOSTAS ABERTAS: <strong>10</strong>s';atualizarBotao();intervaloContagem=setInterval(function(){tempoRestante--;if(tempoRestante>0){contagem.innerHTML='⏱️ APOSTAS ABERTAS: <strong>'+tempoRestante+'</strong>s';return}clearInterval(intervaloContagem);intervaloContagem=null;rodadaAberta=false;contagem.classList.add("encerrada");contagem.innerHTML=' APOSTAS ENCERRADAS';fichaSelecionada=false;fichaDisplay.classList.remove("selecionada");if(fichasNaRoleta.length>0){resultado.innerHTML="⚡ TEMPO ENCERRADO<br><span style='font-size:13px;color:#aaa'>Suas fichas estão prontas. Clique em GIRAR ROLETA.</span>";resultado.style.color="#ffe36a";atualizarBotao()}else{resultado.innerHTML="⛔ TEMPO ENCERRADO<br><span style='font-size:13px;color:#aaa'>Nenhuma ficha foi colocada.</span>";resultado.style.color="#ff4141";atualizarBotao();setTimeout(function(){if(!girando&&fichasNaRoleta.length===0){iniciarContagem()}},1000)}},1000)}
function quantidadeMaximaFichas(){return Math.floor(saldoReal/valorAposta)}
function atualizarSaldo(){saldoEl.innerText=dinheiro(saldoReal);saldoPainel.innerText=dinheiro(saldoReal);saldoEl.style.color=saldoReal<valorAposta?"#ff4141":"#ffe34f";atualizarBotao()}
function atualizarBotao(){if(girando){btnApostar.disabled=true;btnApostar.innerText="ROLETA GIRANDO...";return}if(!usuarioAtual){btnApostar.disabled=true;btnApostar.innerText="AGUARDANDO CONTA";return}if(fichasNaRoleta.length===0){btnApostar.disabled=true;if(rodadaAberta){btnApostar.innerText="COLOQUE A FICHA"}else{btnApostar.innerText="AGUARDANDO FICHAS"}return}if(rodadaAberta){btnApostar.disabled=true;btnApostar.innerText="AGUARDE "+tempoRestante+"s";return}const valorTotal=Number((fichasNaRoleta.length*valorAposta).toFixed(2));if(saldoReal<valorTotal){btnApostar.disabled=true;btnApostar.innerText="SALDO INSUFICIENTE";return}btnApostar.disabled=false;btnApostar.innerText="GIRAR ROLETA"}

// FUNÇÕES DE SALDO CORRIGIDAS E SEGURAS
async function obterUsuario(){const {data,error}=await supabase.auth.getSession();if(error){console.error(error);return null}return data?.session?.user||null}
async function carregarSaldo(){if(!usuarioAtual)return false;const {data,error}=await supabase.from("saldos").select("valor").eq("user_id",usuarioAtual.id).maybeSingle();if(error){console.error(error);resultado.innerText=" ERRO AO CARREGAR SALDO: "+error.message;resultado.style.color="#ff4141";return false}saldoReal=Number(data?.valor||0);atualizarSaldo();return true}
async function salvarSaldo(novoSaldo){if(!usuarioAtual)return false;const valorFinal=Number(Number(novoSaldo).toFixed(2));const {error}=await supabase.from("saldos").update({valor:valorFinal}).eq("user_id",usuarioAtual.id);if(error){console.error("Erro ao salvar saldo:",error);return false}saldoReal=valorFinal;atualizarSaldo();return true}
async function debitarAposta(){if(!usuarioAtual)return false;const quantidadeFichas=fichasNaRoleta.length;const valorTotal=Number((quantidadeFichas*valorAposta).toFixed(2));const saldoAntes=Number(saldoReal);if(saldoAntes<valorTotal){return false}const novoSaldo=Number((saldoAntes-valorTotal).toFixed(2));const {error}=await supabase.from("saldos").update({valor:novoSaldo}).eq("user_id",usuarioAtual.id);if(error){console.error("Erro ao debitar apostas:",error);return false}saldoReal=novoSaldo;atualizarSaldo();return true}

function calcularPremio(valorRoleta){return Number(Number(valorRoleta*TAXA_CASA).toFixed(2))}
function criarNumeros(){const area=document.getElementById("numeros");area.innerHTML="";premios.forEach((premio,index)=>{const numero=document.createElement("div");const conteudo=document.createElement("div");numero.className="numero";conteudo.className="numero-conteudo";if(premio===0){numero.classList.add("perdeu");conteudo.innerText="PERDEU"}else if(premio===5){numero.classList.add("super-bonus");conteudo.innerHTML="<br>R$ 5,00<br>SUPER"}else{conteudo.innerText=dinheiro(premio)}numero.appendChild(conteudo);numero.dataset.index=index;numero.style.transform=`rotate(${index*(360/premios.length)}deg)`;numero.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();colocarFichaNoNumero(index)},{passive:false});area.appendChild(numero)})}
function colocarFichaNoNumero(index){if(girando)return;if(!rodadaAberta){resultado.innerHTML="⛔ TEMPO ENCERRADO<br><span style='font-size:12px;color:#aaa'>Aguarde a próxima rodada.</span>";resultado.style.color="#ff4141";return}if(!fichaSelecionada){resultado.innerHTML=" TOQUE PRIMEIRO NA FICHA<br><span style='font-size:12px;color:#aaa'>Depois escolha o número</span>";resultado.style.color="#ffe36a";return}const quantidadeMaxima=quantidadeMaximaFichas();if(fichasNaRoleta.length>=quantidadeMaxima){fichaSelecionada=false;fichaDisplay.classList.remove("selecionada");resultado.innerHTML="⚠️ VOCÊ JÁ USOU TODAS AS FICHAS<br><span style='font-size:12px;color:#aaa'>Máximo: "+quantidadeMaxima+" ficha(s)</span>";resultado.style.color="#ff4141";return}const ficha={index:index};fichasNaRoleta.push(ficha);const novaFicha=document.createElement("div");novaFicha.className="ficha-roleta visivel";novaFicha.innerText=valorAposta.toFixed(2).replace(".",",");novaFicha.dataset.fichaIndex=fichasNaRoleta.length-1;const quantidade=premios.length;const tamanho=roleta.clientWidth;const centro=tamanho/2;const raio=(tamanho/2)-48;const angulo=(index*(360/quantidade))-90;const rad=angulo*Math.PI/180;const x=centro+Math.cos(rad)*raio;const y=centro+Math.sin(rad)*raio;novaFicha.style.left=x+"px";novaFicha.style.top=y+"px";roleta.appendChild(novaFicha);fichaSelecionada=false;fichaDisplay.classList.remove("selecionada");const restantes=quantidadeMaxima-fichasNaRoleta.length;resultado.innerHTML=" FICHA COLOCADA NO Nº "+(index+1)+"<br><span style='font-size:13px;color:#aaa'>Fichas usadas: "+fichasNaRoleta.length+" / "+quantidadeMaxima+" — Restantes: "+restantes+"</span>";resultado.style.color="#ffe36a";atualizarBotao()}

window.selecionarValor=function(valor,botao){if(girando)return;valorAposta=Number(valor);document.querySelectorAll(".btn-valor").forEach(b=>b.classList.remove("ativo"));botao.classList.add("ativo");apostaInfo.innerText=dinheiro(valorAposta);fichaDisplay.innerText=valorAposta.toFixed(2).replace(".",",");document.querySelectorAll(".ficha-roleta").forEach(f=>{f.innerText=valorAposta.toFixed(2).replace(".",",")});atualizarSaldo()};

fichaDisplay.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();if(girando)return;if(!rodadaAberta){resultado.innerHTML="⛔ TEMPO ENCERRADO<br><span style='font-size:12px;color:#aaa'>Aguarde a próxima rodada.</span>";resultado.style.color="#ff4141";return}const quantidadeMaxima=quantidadeMaximaFichas();if(quantidadeMaxima<=fichasNaRoleta.length){resultado.innerHTML="⚠️ NÃO HÁ MAIS FICHAS DISPONÍVEIS<br><span style='font-size:12px;color:#aaa'>Você já colocou "+fichasNaRoleta.length+" ficha(s).</span>";resultado.style.color="#ff4141";return}fichaSelecionada=true;fichaDisplay.classList.add("selecionada");const restantes=quantidadeMaxima-fichasNaRoleta.length;resultado.innerHTML="🎯 ESCOLHA UMA CASA<br><span style='font-size:12px;color:#aaa'>Fichas disponíveis: "+restantes+"</span>";resultado.style.color="#ffe36a"},{passive:false});

let audioContext=null,timerRoleta=null,velocidadeSom=45,musicaIniciada=false;
function iniciarMusica(){if(musicaIniciada)return;const musica=document.getElementById("musicaRoleta");const promessa=musica.play();if(promessa){promessa.then(()=>{musicaIniciada=true}).catch(()=>{})}}
function iniciarAudio(){if(!audioContext){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;audioContext=new AudioCtx()}if(audioContext.state==="suspended"){audioContext.resume()}iniciarMusica()}
function tocarClique(){iniciarAudio();if(!audioContext)return;const agora=audioContext.currentTime;const o=audioContext.createOscillator();const g=audioContext.createGain();o.type="square";o.frequency.setValueAtTime(180,agora);o.frequency.exponentialRampToValueAtTime(80,agora+.08);g.gain.setValueAtTime(.5,agora);g.gain.exponentialRampToValueAtTime(.001,agora+.08);o.connect(g);g.connect(audioContext.destination);o.start(agora);o.stop(agora+.08)}
function iniciarSomRoleta(){iniciarAudio();pararSomRoleta();velocidadeSom=45;tocarTic()}
function tocarTic(){if(!audioContext)return;const agora=audioContext.currentTime;const o=audioContext.createOscillator();const g=audioContext.createGain();o.type="square";o.frequency.setValueAtTime(850,agora);o.frequency.exponentialRampToValueAtTime(420,agora+.035);g.gain.setValueAtTime(.45,agora);g.gain.exponentialRampToValueAtTime(.001,agora+.055);o.connect(g);g.connect(audioContext.destination);o.start(agora);o.stop(agora+.06);velocidadeSom+=8;if(velocidadeSom>280)velocidadeSom=280;timerRoleta=setTimeout(tocarTic,velocidadeSom)}
function pararSomRoleta(){if(timerRoleta){clearTimeout(timerRoleta);timerRoleta=null}}
function tocarPremio(){iniciarAudio();if(!audioContext)return;const agora=audioContext.currentTime;[523.25,659.25,783.99,1046.50].forEach((frequencia,i)=>{const o=audioContext.createOscillator();const g=audioContext.createGain();const inicio=agora+i*.12;o.type="sine";o.frequency.value=frequencia;g.gain.setValueAtTime(.8,inicio);g.gain.exponentialRampToValueAtTime(.001,inicio+.45);o.connect(g);g.connect(audioContext.destination);o.start(inicio);o.stop(inicio+.45)})}
function mostrarSuperBonus(valor){superBonusValor.innerText=dinheiro(valor);superBonusOverlay.classList.add("ativo");tocarPremio();setTimeout(()=>{superBonusOverlay.classList.remove("ativo")},5000)}
function calcularRotacaoCorreta(indice){const tamanhoCasa=360/premios.length;const anguloDaCasa=indice*tamanhoCasa;const atualNormalizado=((rotacaoAtual%360)+360)%360;let deslocamento=(360-anguloDaCasa-atualNormalizado+360)%360;deslocamento+=360*8;return rotacaoAtual+deslocamento}

window.girarRoleta=async function(){
    if(girando)return;
    if(rodadaAberta){resultado.innerHTML="️ AGUARDE O FIM DA CONTAGEM<br><span style='font-size:13px;color:#aaa'>Restam "+tempoRestante+" segundo(s).</span>";resultado.style.color="#ffe36a";return}
    if(fichasNaRoleta.length===0){resultado.innerHTML=" COLOQUE PELO MENOS UMA FICHA EM UM NÚMERO";resultado.style.color="#ffe36a";return}
    if(!usuarioAtual){resultado.innerText="⚠️ USUÁRIO NÃO LOGADO";resultado.style.color="#ff4141";return}
    
    // VALIDAÇÃO DE SALDO EM TEMPO REAL ANTES DO GIRO
    const saldoAtualizado = await carregarSaldo();
    const valorTotalAposta=Number((fichasNaRoleta.length*valorAposta).toFixed(2));
    if(saldoReal<valorTotalAposta){resultado.innerHTML="⚠️ SALDO INSUFICIENTE<br><span style='font-size:13px;color:#aaa'>Valor das fichas: "+dinheiro(valorTotalAposta)+"</span>";resultado.style.color="#ff4141";atualizarBotao();return}
    
    iniciarAudio();tocarClique();girando=true;atualizarBotao();
    const debitado=await debitarAposta();
    if(!debitado){girando=false;atualizarBotao();resultado.innerText="❌ NÃO FOI POSSÍVEL DEBITAR AS FICHAS";resultado.style.color="#ff4141";return}
    
    resultado.innerText=" GIRANDO...";resultado.style.color="#ffe36a";
    document.querySelectorAll(".numero").forEach(n=>n.classList.remove("destaque"));
    
    const indice=Math.floor(Math.random()*premios.length);
    const premio=premios[indice];
    const novaRotacao=calcularRotacaoCorreta(indice);
    iniciarSomRoleta();
    roleta.style.transform=`rotate(${novaRotacao}deg)`;
    rotacaoAtual=novaRotacao;
    
    setTimeout(()=>{finalizarRodada(indice,premio)},7600);
};

async function finalizarRodada(indice,valorRoleta){
    pararSomRoleta();
    const numero=document.querySelector(`.numero[data-index="${indice}"]`);
    if(numero){numero.classList.add("destaque")}
    const fichasVencedoras=fichasNaRoleta.filter(ficha=>ficha.index===indice);
    const quantidadeVencedoras=fichasVencedoras.length;
    
    if(quantidadeVencedoras===0||valorRoleta===0){
        resultado.innerHTML="💥 PERDEU<br><span style='font-size:14px;color:#aaa'>Resultado: nº "+(indice+1)+"<br>"+(valorRoleta===0?"Todas as fichas foram perdidas.":"Fichas jogadas: "+fichasNaRoleta.length+"<br><strong style='color:#ff4141'>"+dinheiro(fichasNaRoleta.length*valorAposta)+" foram descontados.</strong>")+"</span>";
        resultado.style.color="#ff4141";
        girando=false;
        document.querySelectorAll(".ficha-roleta").forEach(f=>f.remove());
        fichasNaRoleta=[];numeroEscolhido=null;fichaSelecionada=false;fichaDisplay.classList.remove("selecionada");
        atualizarBotao();iniciarContagem();return;
    }
    
    const premioPorFicha=calcularPremio(valorRoleta);
    const premioTotal=Number((premioPorFicha*quantidadeVencedoras).toFixed(2));
    const saldoAtual=Number(saldoReal);
    const saldoFinal=Number((saldoAtual+premioTotal).toFixed(2));
    const creditado=await salvarSaldo(saldoFinal);
    
    if(!creditado){girando=false;atualizarBotao();resultado.innerHTML="❌ ERRO AO CREDITAR O PRÊMIO";resultado.style.color="#ff4141";return}
    
    if(valorRoleta===5){
        resultado.innerHTML="⚡ SUPER BÔNUS ⚡<br><span style='font-size:22px;color:#ffe36a'>"+quantidadeVencedoras+" ficha(s) vencedora(s)</span><br><span style='font-size:30px;color:#ffe36a'>"+dinheiro(premioTotal)+"</span>";
        resultado.style.color="#ffe36a";mostrarSuperBonus(premioTotal);
    }else{
        tocarPremio();
        resultado.innerHTML="⚡ PRÊMIO<br><span style='font-size:18px;color:#aaa'>"+quantidadeVencedoras+" ficha(s) acertaram</span><br><span style='font-size:28px;color:#ffe36a'>"+dinheiro(premioTotal)+"</span>";
        resultado.style.color="#ffe36a";
    }
    
    setTimeout(()=>{girando=false;document.querySelectorAll(".ficha-roleta").forEach(f=>f.remove());fichasNaRoleta=[];numeroEscolhido=null;fichaSelecionada=false;fichaDisplay.classList.remove("selecionada");atualizarBotao();iniciarContagem()},700);
}

window.repetirAposta=function(){if(girando)return;if(rodadaAberta){resultado.innerHTML="️ A RODADA AINDA ESTÁ ABERTA<br><span style='font-size:13px;color:#aaa'>Restam "+tempoRestante+" segundo(s).</span>";resultado.style.color="#ffe36a";return}if(fichasNaRoleta.length===0){resultado.innerHTML="🎯 COLOQUE AS FICHAS NA ROLETA";resultado.style.color="#ffe36a";return}girarRoleta()};
window.abrirMenu=function(){alert(" APOSTAXBET\n\nROLETA DE RELÂMPAGOS\n\nSeu saldo está conectado à sua conta.")};

supabase.auth.onAuthStateChange((event,session)=>{if(!session){window.location.href="../index.html"}});
document.addEventListener("touchstart",iniciarMusica,{once:true});
document.addEventListener("click",iniciarMusica,{once:true});

async function iniciar(){
    try{
        usuarioAtual=await obterUsuario();
        if(!usuarioAtual){alert("Você precisa estar logado para jogar.");window.location.href="../index.html";return}
        const carregou=await carregarSaldo();
        if(!carregou){carregando.style.display="none";return}
        criarNumeros();atualizarSaldo();carregando.style.display="none";iniciarContagem();
    }catch(error){console.error(error);carregando.style.display="none";resultado.innerText="❌ ERRO AO INICIAR ROLETA: "+error.message;resultado.style.color="#ff4141"}
}
iniciar();
})();
</script>
</body>
</html>
