<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta ApostaXBet</title>

<style>
body{
    background:#080808;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#d4af37;
}

.area{
    width:330px;
    height:330px;
    margin:40px auto;
    position:relative;
}

#roleta{
    width:300px;
    height:300px;
    border-radius:50%;
    border:15px solid #d4af37;

    background:conic-gradient(
        red 0deg 45deg,
        black 45deg 90deg,
        gold 90deg 135deg,
        black 135deg 180deg,
        green 180deg 225deg,
        black 225deg 270deg,
        red 270deg 315deg,
        black 315deg 360deg
    );

    transition:transform 10s cubic-bezier(.15,.8,.15,1);

    box-shadow:0 0 40px #d4af37;
}

.ponteiro{
    font-size:45px;
}

button{
    padding:15px 40px;
    background:#d4af37;
    border:0;
    border-radius:15px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>🎰 Roleta Cassino</h1>

<div class="ponteiro">🔻</div>

<div class="area">
<div id="roleta"></div>
</div>

<button onclick="girar()">GIRAR</button>


<script>

let girando=false;
let giro=0;

let premios=[
"R$ 0",
"R$ 1",
"R$ 2",
"R$ 5",
"R$ 10",
"R$ 50"
];


function girar(){

if(girando)return;

girando=true;


let numero=Math.floor(Math.random()*premios.length);


giro += 360*6 + numero*60;


document.getElementById("roleta").style.transform=
"rotate("+giro+"deg)";


setTimeout(()=>{

alert("Resultado: "+premios[numero]);

girando=false;

},10000);


}

</script>

</body>
</html>
