<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://jxbzjiwmajjzxgihfjgt.supabase.co";
const SUPABASE_KEY = "sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

window.SistemaSaldoRoleta = {

    async usuario() {
        const { data, error } =
            await supabase.auth.getSession();

        if (error) {
            console.error(error);
            return null;
        }

        return data?.session?.user || null;
    },

    async saldo() {
        const usuario = await this.usuario();

        if (!usuario) return 0;

        const { data, error } =
            await supabase
                .from("saldos")
                .select("valor")
                .eq("user_id", usuario.id)
                .single();

        if (error) {
            console.error("Erro ao buscar saldo:", error);
            return 0;
        }

        return Number(data?.valor || 0);
    },

    async debitar(valor) {
        valor = Number(valor);

        if (!Number.isFinite(valor) || valor <= 0)
            return false;

        const usuario = await this.usuario();

        if (!usuario) {
            alert("Você precisa estar logado.");
            return false;
        }

        const saldoAtual = await this.saldo();

        if (saldoAtual < valor) {
            alert("Saldo insuficiente!");
            return false;
        }

        const novoSaldo =
            Number((saldoAtual - valor).toFixed(2));

        const { error } =
            await supabase
                .from("saldos")
                .update({
                    valor: novoSaldo
                })
                .eq("user_id", usuario.id);

        if (error) {
            console.error("Erro ao debitar:", error);
            alert("Não foi possível atualizar o saldo.");
            return false;
        }

        return true;
    },

    async creditar(valor) {
        valor = Number(valor);

        if (!Number.isFinite(valor) || valor <= 0)
            return false;

        const usuario = await this.usuario();

        if (!usuario) return false;

        const saldoAtual = await this.saldo();

        const novoSaldo =
            Number((saldoAtual + valor).toFixed(2));

        const { error } =
            await supabase
                .from("saldos")
                .update({
                    valor: novoSaldo
                })
                .eq("user_id", usuario.id);

        if (error) {
            console.error("Erro ao creditar:", error);
            return false;
        }

        return true;
    },

    async atualizarTela() {
        const saldoAtual = await this.saldo();

        const texto =
            "R$ " +
            saldoAtual.toFixed(2).replace(".", ",");

        document
            .querySelectorAll(
                "#displaySaldo, #display-saldo, #saldo, .saldo"
            )
            .forEach(elemento => {
                elemento.textContent = texto;
            });

        return saldoAtual;
    }
};

document.addEventListener("DOMContentLoaded", async () => {

    const usuario =
        await window.SistemaSaldoRoleta.usuario();

    if (!usuario) {
        alert("Você precisa estar logado para jogar.");
        window.location.href = "../index.html";
        return;
    }

    await window.SistemaSaldoRoleta.atualizarTela();
});
</script>
