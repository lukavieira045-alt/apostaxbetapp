<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta ApostaXBet</title>

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

h1{
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:15px;
}


.area{
    width:340px;
    height:380px;
    margin:40px auto;
    position:relative;
}


/* PONTEIRO */

#ponteiro{

    position:absolute;
    top:-5px;
    left:50%;

    transform:translateX(-50%);

    z-index:999;

    color:red;

    font-size:60px;

    font-weight:bold;

    text-shadow:
    0 0 10px red,
    0 0 20px red;

}



/* ROLETA */

#roleta{

    position:absolute;

    top:45px;
    left:20px;

    width:300px;
    height:300px;

    border-radius:50%;

    border:15px solid #d4af37;


    background:
    conic-gradient(
        #d00000 0deg 60deg,
        #111 60deg 120deg,
        #008000 120deg 180deg,
        #111 180deg 240deg,
        #d4af37 240deg 300deg,
        #111 300deg 360deg
    );


    transition:
    transform 12s cubic-bezier(.15,.8,.15,1);


    box-shadow:
    0 0 40px #ffd700,
    inset 0 0 30px #000;

}



/* PRÊMIOS */

.premio{

    position:absolute;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:25px;

    font-size:20px;

    font-weight:bold;

}


.p1{transform:rotate(30deg);}
.p2{transform:rotate(90deg);}
.p3{transform:rotate(150deg);}
.p4{transform:rotate(210deg);}
.p5{transform:rotate(270deg);}
.p6{transform:rotate(330deg);}



/* CENTRO */

.centro{

    position:absolute;

    top:115px;

    left:115px;

    width:70px;

    height:70px;


    background:#111;

    border:5px solid #ffd700;

    border-radius:50%;


    display:flex;

    justify-content:center;

    align-items:center;

    font-size:30px;

}



button{

    padding:18px 50px;

    background:#ffd700;

    border:0;

    border-radius:15px;

    font-size:20px;

    font-weight:bold;

}


</style>

</head>


<body>


<h1>🎰 Roleta Cassino</h1>


<div id="saldo"></div>


<div class="area">


<div id="ponteiro">
▼
</div>


<div id="roleta">


<div class="premio p1">R$0</div>
<div class="premio p2">R$1</div>
<div class="premio p3">R$2</div>
<div class="premio p4">R$5</div>
<div class="premio p5">R$10</div>
<div class="premio p6">R$50</div>


<div class="centro">
🎰
</div>


</div>


</div>



<button onclick="girar()">
GIRAR R$1
</button>



<script>


let saldo = Number(localStorage.getItem("saldo") || 2);

let girando=false;

let giroAtual=0;


const premios=[
0,
1,
2,
5,
10,
50
];



function atualizarSaldo(){

document.getElementById("saldo").innerHTML =
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizarSaldo();



function girar(){


if(girando)return;


if(saldo < 1){

alert("Saldo insuficiente");

return;

}


girando=true;


saldo-=1;

atualizarSaldo();



let casa=Math.floor(Math.random()*premios.length);


let parada=360-(casa*60);


giroAtual += 360*8 + parada;


document.getElementById("roleta").style.transform =
"rotate("+giroAtual+"deg)";



setTimeout(()=>{


let ganho=premios[casa];


saldo+=ganho;


atualizarSaldo();


if(ganho>0){

alert("🎉 Você ganhou R$ "+ganho.toFixed(2));

}else{

alert("😢 Você perdeu");

}


girando=false;


},12000);


}


</script>


</body>
</html>
