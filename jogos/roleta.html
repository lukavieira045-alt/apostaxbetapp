<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta Cassino - ApostaXBet</title>

<style>
body{
    background:#090d14;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    color:#00ff88;
    text-shadow:0 0 10px #00ff88;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.area{
    position:relative;
    width:310px;
    height:310px;
    margin:40px auto;
}

#ponteiro{
    position:absolute;
    top:-35px;
    left:50%;
    transform:translateX(-50%);
    font-size:45px;
    z-index:10;
}


#roleta{
    width:300px;
    height:300px;
    border-radius:50%;
    border:12px solid #d4af37;

    background:conic-gradient(
    #16a085 0deg 45deg,
    #c0392b 45deg 90deg,
    #f1c40f 90deg 135deg,
    #16a085 135deg 180deg,
    #c0392b 180deg 225deg,
    #f1c40f 225deg 270deg,
    #16a085 270deg 315deg,
    #c0392b 315deg 360deg
    );

    transition:transform 8s cubic-bezier(.12,.7,.15,1);

    box-shadow:
    0 0 20px #d4af37,
    inset 0 0 30px black;

    position:relative;
}


.valor{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:25px;
    font-size:20px;
    font-weight:bold;
}


.v1{transform:rotate(22deg);}
.v2{transform:rotate(67deg);}
.v3{transform:rotate(112deg);}
.v4{transform:rotate(157deg);}
.v5{transform:rotate(202deg);}
.v6{transform:rotate(247deg);}
.v7{transform:rotate(292deg);}
.v8{transform:rotate(337deg);}


button{
    padding:16px 40px;
    background:#00ff88;
    border:0;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}


a{
    display:block;
    margin-top:30px;
    color:#aaa;
}

</style>
</head>


<body>

<h1>🎰 Roleta da Sorte</h1>

<div id="saldo"></div>


<div class="area">

<div id="ponteiro">🔻</div>


<div id="roleta">

<div class="valor v1">R$1</div>
<div class="valor v2">R$5</div>
<div class="valor v3">R$0</div>
<div class="valor v4">R$10</div>
<div class="valor v5">R$2</div>
<div class="valor v6">R$0</div>
<div class="valor v7">R$50</div>
<div class="valor v8">R$1</div>

</div>

</div>


<button onclick="girar()">GIRAR</button>

<a href="../index.html">Voltar</a>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

let girando=false;

let rotacao=0;


let premios=[
1,
5,
0,
10,
2,
0,
50,
1
];


function atualizarSaldo(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizarSaldo();



function girar(){

if(girando)return;


if(saldo<1){

alert("Saldo insuficiente!");

return;

}


girando=true;


saldo-=1;

atualizarSaldo();



let casa=Math.floor(Math.random()*8);



let grausPorCasa=45;


// várias voltas + posição certa
rotacao += 360*5 + (360 - casa*grausPorCasa - 22);



document.getElementById("roleta").style.transform=
"rotate("+rotacao+"deg)";



setTimeout(()=>{


saldo += premios[casa];


atualizarSaldo();


alert("🎉 Você ganhou R$ "+premios[casa].toFixed(2));


girando=false;


},8200);


}


</script>

</body>
</html>
