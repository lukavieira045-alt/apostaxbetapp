<style>

/* =====================================================
ROLETA
===================================================== */

.roleta-area{
position:relative;
width:100%;
display:flex;
justify-content:center;
align-items:center;
margin-bottom:10px
}

.roleta{
width:min(92vw,390px);
height:min(92vw,390px);
border-radius:50%;
position:relative;
border:6px solid #d7ae31;
background:radial-gradient(circle,#1b2925 0 15%,#060a09 16% 23%,transparent 24%);
box-shadow:
0 0 8px #ffd84a,
0 0 25px rgba(255,205,45,.45),
0 0 55px rgba(255,190,20,.2),
inset 0 0 25px #000;
transition:transform 7.5s cubic-bezier(.15,.65,.20,1);
overflow:hidden
}

.roleta::before{
content:"";
position:absolute;
inset:7px;
border-radius:50%;
border:12px solid #101a21;
box-shadow:inset 0 0 8px #000,0 0 4px #000;
z-index:3
}

.roleta::after{
content:"";
position:absolute;
inset:28px;
border-radius:50%;
background:repeating-conic-gradient(
from 0deg,
rgba(255,225,100,.7) 0deg 1deg,
transparent 1deg 18deg
);
z-index:2
}

.roleta-inner{
position:absolute;
inset:30px;
border-radius:50%;
background:repeating-conic-gradient(
#28645b 0deg 9deg,
#668c82 9deg 18deg
);
box-shadow:
inset 0 0 35px rgba(0,0,0,.85),
inset 0 0 8px #ffe05b;
z-index:1
}

/* =====================================================
NÚMEROS
===================================================== */

.numeros{
position:absolute;
inset:0;
z-index:7;
pointer-events:none
}

.numero{
position:absolute;
left:50%;
top:50%;
width:54px;
height:160px;
margin-left:-27px;
margin-top:-160px;
transform-origin:27px 160px;
display:flex;
justify-content:center;
align-items:flex-start;
color:#fff3a6;
font-size:14px;
font-weight:900;
text-align:center;
z-index:8;
pointer-events:none
}

.numero-conteudo{
position:absolute;
top:8px;
min-width:48px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:#fff3a6;
line-height:15px;
white-space:nowrap;
text-shadow:
0 2px 3px #000,
0 0 7px rgba(255,215,70,.9);
transition:.2s
}

.numero.perdeu .numero-conteudo{
color:#ff7777;
font-size:11px;
text-shadow:
0 2px 3px #000,
0 0 9px rgba(255,40,40,.8)
}

.numero.super-bonus .numero-conteudo{
color:#fff;
font-size:10px;
line-height:12px;
text-shadow:
0 0 5px #fff,
0 0 12px #ffe33c,
0 0 20px #ff9d00
}

.numero.destaque .numero-conteudo{
color:#fff;
transform:scale(1.25);
text-shadow:
0 0 5px white,
0 0 12px #ffe36a,
0 0 25px #ffb300
}

/* =====================================================
NÚMERO ESCOLHIDO PELA FICHA
===================================================== */

.numero.selecionado .numero-conteudo{
color:#fff;
transform:scale(1.35);
text-shadow:
0 0 5px #fff,
0 0 12px #00ffcc,
0 0 25px #00ff99,
0 0 40px #00ff88
}

.numero.selecionado::after{
content:"";
position:absolute;
left:50%;
top:8px;
width:48px;
height:48px;
transform:translateX(-50%);
border:2px solid #00ff99;
border-radius:50%;
box-shadow:
0 0 8px #00ff99,
0 0 20px rgba(0,255,150,.8);
pointer-events:none
}

/* =====================================================
FICHA SOBRE A ROLETA
===================================================== */

.ficha-roleta{
position:absolute;
width:42px;
height:42px;
border-radius:50%;
z-index:50;
display:none;
align-items:center;
justify-content:center;
background:
radial-gradient(
circle,
#666 0 40%,
#f5f5f5 41% 48%,
#777 49% 66%,
#fff 67% 72%,
#333 73%
);
border:2px solid #eee;
color:white;
font-size:9px;
font-weight:bold;
text-shadow:0 1px 2px #000;
box-shadow:
0 0 8px rgba(255,255,255,.7),
0 0 18px rgba(255,220,80,.4),
0 3px 7px #000;
transform:translate(-50%,-50%);
touch-action:none;
user-select:none;
cursor:grab
}

.ficha-roleta.arrastando{
display:flex;
cursor:grabbing;
transform:translate(-50%,-50%) scale(1.15);
box-shadow:
0 0 10px #fff,
0 0 25px #ffe36a,
0 0 40px rgba(255,220,70,.8);
}

/* =====================================================
CENTRO
===================================================== */

.centro{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:82px;
height:82px;
border-radius:50%;
background:radial-gradient(
circle,
#283d38,
#08100e 65%,
#020303
);
border:4px solid #d5ad36;
z-index:12;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:
0 0 15px rgba(255,211,53,.55),
inset 0 0 15px #000
}

.centro strong{
color:#ffe36a;
font-size:18px;
letter-spacing:2px
}

.centro span{
color:#777;
font-size:8px;
letter-spacing:2px
}

/* =====================================================
PONTEIRO
===================================================== */

.ponteiro{
position:absolute;
z-index:20;
top:-3px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:13px solid transparent;
border-right:13px solid transparent;
border-top:27px solid white;
filter:
drop-shadow(0 0 4px white)
drop-shadow(0 0 9px #ffe66b)
}

/* =====================================================
RAIOS
===================================================== */

.raio{
position:absolute;
width:100px;
height:4px;
background:white;
opacity:.7;
z-index:18;
box-shadow:
0 0 5px white,
0 0 15px #dfffca;
animation:piscar .7s infinite alternate
}

.raio1{
left:4px;
bottom:50px;
transform:rotate(-35deg)
}

.raio2{
right:4px;
top:65px;
transform:rotate(35deg)
}

.raio3{
left:45px;
top:20px;
width:70px;
transform:rotate(65deg)
}

@keyframes piscar{
from{opacity:.2}
to{opacity:1}
}

/* =====================================================
RESULTADO
===================================================== */

.resultado{
min-height:52px;
text-align:center;
color:#ddd;
font-size:18px;
font-weight:900;
text-shadow:0 0 10px currentColor;

/* =====================================================
PAINEL
===================================================== */

.painel{
position:relative;
padding:16px 12px 13px;
background:linear-gradient(145deg,#0d1113,#050708);
border:1px solid #77642d;
box-shadow:
0 0 15px rgba(0,0,0,.9),
inset 0 0 15px rgba(255,200,50,.05)
}

.ficha-area{
height:52px;
display:flex;
justify-content:center;
align-items:center;
margin-bottom:5px
}

.ficha{
width:40px;
height:40px;
border-radius:50%;
background:
radial-gradient(
circle,
#555 0 45%,
#eee 46% 54%,
#666 55% 70%,
#eee 71% 74%,
#333 75%
);
border:2px solid #eee;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:9px;
font-weight:bold;
text-shadow:0 1px 2px #000;
box-shadow:
0 0 8px rgba(255,255,255,.3),
0 2px 4px #000;
cursor:grab;
touch-action:none;
user-select:none
}

.ficha.arrastando{
transform:scale(1.15);
box-shadow:
0 0 10px white,
0 0 25px #ffe36a,
0 0 40px rgba(255,220,70,.8);

}

.ficha-instrucao{
text-align:center;
font-size:9px;
color:#777;
margin-top:2px;
margin-bottom:5px;
letter-spacing:.5px
}

.valores{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
margin-bottom:8px
}

.btn-valor{
height:39px;
border:1px solid #5c4d26;
background:#090b0c;
color:#aaa;
border-radius:4px;
font-size:12px;
font-weight:bold
}

.btn-valor.ativo{
color:#ffe36a;
border-color:#ffe36a;
box-shadow:
0 0 10px rgba(255,215,60,.35),
inset 0 0 12px rgba(255,215,60,.1)
}

.btn-apostar{
width:100%;
height:54px;
margin-top:9px;
border:1px solid #d5af3d;
background:linear-gradient(180deg,#332b12,#171306);
color:#f5d76b;
font-size:16px;
font-weight:900;
letter-spacing:2px;
border-radius:4px;
box-shadow:
0 0 12px rgba(255,215,60,.18),

}

.btn-apostar:disabled{

}

.info{
display:flex;
justify-content:space-between;

}

.info strong{
color:#ffe04f
}

.mensagem{
text-align:center;

}

.repeat-btn,
.menu-btn{
position:fixed;

width:52px;
height:52px;

color:#ddd;

}

.repeat-btn{

}

.menu-btn{
right:8px
}

/* =====================================================
CARREGAMENTO
===================================================== */

#carregando{
position:fixed;
inset:0;
background:#020303;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
color:#ffe36a;
font-size:16px
}

/* =====================================================
SUPER BÔNUS
===================================================== */

.superbonus-overlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:
radial-gradient(
circle,
rgba(255,220,60,.45),
rgba(255,190,0,.18) 30%,
rgba(0,0,0,.96) 75%
);
z-index:1000;
pointer-events:none
}

.superbonus-overlay.ativo{
display:flex;
animation:superBonusTela 5s ease forwards
}

.superbonus-raio{
position:absolute;
width:5px;
height:100vh;
background:#fff;
box-shadow:
0 0 15px #fff,
0 0 35px #ffe33c;
animation:raioSuper .5s infinite alternate
}

.superbonus-titulo{
color:#fff;
font-size:34px;
font-weight:1000;
letter-spacing:3px;
text-align:center;
text-shadow:
0 0 8px white,
0 0 20px #ffe33c,
0 0 40px #ff9d00;
animation:superBonusTexto .8s ease-out
}

.superbonus-valor{
margin-top:10px;
color:#ffe44f;
font-size:48px;
font-weight:1000;
text-shadow:
0 0 10px #fff,
0 0 25px #ffe33c,
0 0 50px #ff8c00;
animation:superBonusValor 1s ease-out
}

@keyframes superBonusTela{
0%{opacity:0}
10%{opacity:1}
85%{opacity:1}
100%{opacity:0}
}

@keyframes superBonusTexto{
0%{transform:scale(.2);opacity:0}
60%{transform:scale(1.25);opacity:1}
100%{transform:scale(1)}
}

@keyframes superBonusValor{
0%{transform:scale(.2)}
60%{transform:scale(1.35)}
100%{transform:scale(1)}
}

@keyframes raioSuper{
from{
opacity:.2;
transform:scaleY(.7)
}
to{
opacity:1;
transform:scaleY(1.1)
}
}

@media(max-width:360px){

.roleta{
width:310px;
height:310px
}

.numero{
width:44px;
height:130px;
margin-left:-22px;
margin-top:-130px;
transform-origin:22px 130px
}

.numero-conteudo{
top:7px;
font-size:11px;
line-height:12px
}

.numero.perdeu .numero-conteudo{
font-size:9px
}

.numero.super-bonus .numero-conteudo{
font-size:8px;
line-height:9px
}

}
</style>

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1;

let rotacaoAtual = 0;

let girando = false;

/*
NOVO:

Número onde a ficha foi colocada.
*/

let numeroSelecionado = null;

let arrastandoFicha = false;


/* =====================================================
PRÊMIOS DA ROLETA
===================================================== */

const premios = [

0.20,
0.40,
0.50,
0.80,
1.00,
0.20,
0.50,
0,
0.80,
1.00,
0.40,
0.50,
0.20,
0.80,
5.00,
0.40,
0,
0.50,
1.00,
0.20

];


/* =====================================================
ELEMENTOS
===================================================== */

const roleta =
document.getElementById("roleta");

const resultado =
document.getElementById("resultado");

const btnApostar =
document.getElementById("btnApostar");

const saldoEl =
document.getElementById("displaySaldo");

const saldoPainel =
document.getElementById("saldoPainel");

const apostaInfo =
document.getElementById("apostaInfo");

const fichaDisplay =
document.getElementById("fichaDisplay");

const fichaRoleta =
document.getElementById("fichaRoleta");

const carregando =
document.getElementById("carregando");

const superBonusOverlay =
document.getElementById("superBonusOverlay");

const superBonusValor =
document.getElementById("superBonusValor");

const musicaRoleta =
document.getElementById("musicaRoleta");


/* =====================================================
DINHEIRO
===================================================== */

function dinheiro(valor){

return "R$ " +
Number(valor || 0)
.toFixed(2)
.replace(".",",");

}


/* =====================================================
SALDO
===================================================== */

function atualizarSaldo(){

saldoEl.innerText =
dinheiro(saldoReal);

saldoPainel.innerText =
dinheiro(saldoReal);

saldoEl.style.color =
saldoReal < valorAposta
? "#ff4141"
: "#ffe34f";

atualizarBotao();

}


/* =====================================================
BOTÃO
===================================================== */

function atualizarBotao(){

if(girando){

btnApostar.disabled = true;

btnApostar.innerText =
"ROLETA GIRANDO...";

return;

}

if(!usuarioAtual){

btnApostar.disabled = true;

btnApostar.innerText =
"AGUARDANDO CONTA";

return;

}

if(numeroSelecionado === null){

btnApostar.disabled = true;

btnApostar.innerText =
"COLOQUE A FICHA";

return;

}

if(saldoReal < valorAposta){

btnApostar.disabled = true;

btnApostar.innerText =
"SALDO INSUFICIENTE";

return;

}

btnApostar.disabled = false;

btnApostar.innerText =
"GIRAR ROLETA";

}


/* =====================================================
USUÁRIO
===================================================== */

async function obterUsuario(){

const {
data,
error
} =
await supabase.auth.getSession();

if(error){

console.error(error);

return null;

}

return data?.session?.user || null;

}


/* =====================================================
CARREGAR SALDO
===================================================== */

async function carregarSaldo(){

if(!usuarioAtual)
return false;

const {
data,
error
} =
await supabase
.from("saldos")
.select("valor")
.eq("user_id",usuarioAtual.id)
.single();

if(error){

console.error(error);

resultado.innerText =
"❌ ERRO AO CARREGAR SALDO";

resultado.style.color =
"#ff4141";

return false;

}

saldoReal =
Number(data?.valor || 0);

atualizarSaldo();

return true;

}


/* =====================================================
SALVAR SALDO
===================================================== */

async function salvarSaldo(novoSaldo){

if(!usuarioAtual)
return false;

const valorFinal =
Number(
Number(novoSaldo)
.toFixed(2)
);

const {
error
} =
await supabase
.from("saldos")
.update({
valor:valorFinal
})
.eq(
"user_id",
usuarioAtual.id
);

if(error){

console.error(error);

resultado.innerText =
"❌ ERRO AO ATUALIZAR SALDO";

resultado.style.color =
"#ff4141";

return false;

}

saldoReal =
valorFinal;

atualizarSaldo();

return true;

}


/* =====================================================
LÓGICA DO PRÊMIO
===================================================== */

function calcularPremio(valorRoleta){

if(valorRoleta === 0){

return 0;

}

if(valorRoleta === 5){

return 5;

}

return Number(
(valorRoleta * 2)
.toFixed(2)
);

}


/* =====================================================
NÚMEROS
===================================================== */

function criarNumeros(){

const area =
document.getElementById("numeros");

area.innerHTML = "";

premios.forEach(
(premio,index)=>{

const numero =
document.createElement("div");

const conteudo =
document.createElement("div");

numero.className =
"numero";

conteudo.className =
"numero-conteudo";


if(premio === 0){

numero.classList.add("perdeu");

conteudo.innerText =
"PERDEU";

}

else if(premio === 5){

numero.classList.add(

/* =====================================================
SISTEMA DA FICHA
===================================================== */

let inicioX = 0;
let inicioY = 0;


/*
Começa o arrasto.
*/

function iniciarArrasto(event){

if(girando)
return;

event.preventDefault();

arrastandoFicha = true;

fichaDisplay.classList.add(
"arrastando"
);

fichaRoleta.classList.add(
"arrastando"
);

fichaRoleta.style.display =
"flex";

moverFicha(event);

}


/*
Move a ficha.
*/

function moverFicha(event){

if(!arrastandoFicha)
return;

const toque =
event.touches
? event.touches[0]
: event;

const rect =
roleta.getBoundingClientRect();

const x =
toque.clientX - rect.left;

const y =
toque.clientY - rect.top;

fichaRoleta.style.left =
x + "px";

fichaRoleta.style.top =
y + "px";


/*
Descobre se a ficha está
sobre algum número.
*/

verificarNumeroSobFicha(
x,
y
);

}


/*
Finaliza o arrasto.
*/

function finalizarArrasto(event){

if(!arrastandoFicha)
return;

arrastandoFicha = false;

fichaDisplay.classList.remove(
"arrastando"
);

fichaRoleta.classList.remove(
"arrastando"
);


/*
Se não escolheu nenhum número,
volta para o painel.
*/

if(numeroSelecionado === null){

fichaRoleta.style.display =
"none";

resultado.innerText =
"ARRASTE A FICHA PARA UM NÚMERO";

resultado.style.color =
"#aaa";

atualizarBotao();

return;

}


/*
Coloca a ficha exatamente sobre
o número escolhido.
*/

posicionarFichaNoNumero(
numeroSelecionado
);

resultado.innerHTML =
"🎯 APOSTA NO NÚMERO " +
"<strong style='color:#00ff99'>" +
(numeroSelecionado + 1) +
"</strong>";

resultado.style.color =
"#00ff99";

atualizarBotao();

}


/*
Verifica qual número está
embaixo da ficha.
*/

function verificarNumeroSobFicha(x,y){

const centroX =
roleta.clientWidth / 2;

const centroY =
roleta.clientHeight / 2;

const dx =
x - centroX;

const dy =
y - centroY;


/*
Calcula o ângulo em relação
ao topo da roleta.
*/

let angulo =
Math.atan2(dx,-dy)
* 180 / Math.PI;

if(angulo < 0)
angulo += 360;


/*
Como existem 20 casas:
18 graus cada uma.
*/

const tamanhoCasa =
360 / premios.length;

const index =
Math.floor(
(angulo + tamanhoCasa / 2)
/
tamanhoCasa
)
% premios.length;


/*
Seleciona visualmente a casa.
*/

document
.querySelectorAll(".numero")
.forEach(
n =>
n.classList.remove(
"selecionado"
)
);

const numero =
document.querySelector(
`.numero[data-index="${index}"]`
);

if(numero){

numero.classList.add(
"selecionado"
);

numeroSelecionado =
index;

}

}


/*
Coloca a ficha no centro
da casa selecionada.
*/

function posicionarFichaNoNumero(index){

const numero =
document.querySelector(
`.numero[data-index="${index}"]`
);

if(!numero)
return;

const rectRoleta =
roleta.getBoundingClientRect();

const rectNumero =
numero.getBoundingClientRect();

const x =
rectNumero.left +
rectNumero.width / 2 -
rectRoleta.left;

const y =
rectNumero.top +
15 -
rectRoleta.top;

fichaRoleta.style.left =
x + "px";

fichaRoleta.style.top =
y + "px";

fichaRoleta.style.display =
"flex";

}

let audioContext = null;

let timerRoleta = null;

let velocidadeSom = 45;

let musicaIniciada = false;


function iniciarMusica(){

if(musicaIniciada)
return;

function iniciarAudio(){

if(!audioContext){

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioCtx)
return;

audioContext =
new AudioCtx();

}

if(
audioContext.state ===
"suspended"
){

audioContext.resume();

}

iniciarMusica();

}


function tocarClique(){

iniciarAudio();

if(!audioContext)
return;

const agora =
audioContext.currentTime;

const o =
audioContext.createOscillator();

const g =
audioContext.createGain();

o.type =
"square";

o.frequency.setValueAtTime(
180,
agora
);

o.frequency.exponentialRampToValueAtTime(
80,
agora + .08
);

g.gain.setValueAtTime(
.5,
agora
);

g.gain.exponentialRampToValueAtTime(
.001,
agora + .08
);

o.connect(g);

g.connect(
audioContext.destination
);

o.start(agora);

o.stop(
agora + .08
);

}


function iniciarSomRoleta(){

iniciarAudio();

pararSomRoleta();

velocidadeSom = 45;

tocarTic();

}


function tocarTic(){

if(!audioContext)
return;

const agora =
audioContext.currentTime;

const o =
audioContext.createOscillator();

const g =
audioContext.createGain();

o.type =
"square";

o.frequency.setValueAtTime(
850,
agora
);

o.frequency.exponentialRampToValueAtTime(
420,
agora + .035
);

g.gain.setValueAtTime(
.45,
agora
);

g.gain.exponentialRampToValueAtTime(
.001,
agora + .055
);

o.connect(g);

g.connect(
audioContext.destination
);

o.start(agora);

o.stop(
agora + .06
);

velocidadeSom += 8;

if(velocidadeSom > 280)
velocidadeSom = 280;

timerRoleta =
setTimeout(
tocarTic,
velocidadeSom
);

}


function pararSomRoleta(){

if(timerRoleta){

clearTimeout(
timerRoleta
);

timerRoleta = null;

}

}


function tocarPremio(){

iniciarAudio();

if(!audioContext)
return;

const agora =
audioContext.currentTime;

[
523.25,
659.25,
783.99,
1046.50
]
.forEach(
(frequencia,i)=>{

const o =
audioContext.createOscillator();

const g =
audioContext.createGain();

const inicio =
agora + i * .12;

o.type =
"sine";

o.frequency.value =
frequencia;

g.gain.setValueAtTime(
.8,
inicio
);

g.gain.exponentialRampToValueAtTime(
.001,
inicio + .45
);

o.connect(g);

g.connect(
audioContext.destination
);

o.start(inicio);

o.stop(
inicio + .45
);

});

}

/* =====================================================

===================================================== */

function calcularRotacaoCorreta(indice){

const tamanhoCasa =
360 / premios.length;

const anguloDaCasa =
indice * tamanhoCasa;

const atualNormalizado =
((rotacaoAtual % 360) + 360) % 360;

let deslocamento =
(360 -
anguloDaCasa -
atualNormalizado +
360)
% 360;

deslocamento +=
360 * 8;

return (
rotacaoAtual +
deslocamento
);

}
