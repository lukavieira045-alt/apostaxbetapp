*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#02030b;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
.game{width:100%;max-width:650px;min-height:100vh;background:radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);color:white;position:relative;overflow:hidden}
.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:linear-gradient(#101d49,#071127);border-bottom:2px solid #345a9e}
.top .home{font-size:29px}.top .name{font-size:18px;font-weight:bold;color:#eee}.clock{font:18px monospace}
.banner{height:105px;margin:18px 7px 9px;border-radius:8px;border:3px solid #17173c;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#352083 0,#171747 45%,#08091f 100%);box-shadow:0 0 16px #00dff077,inset 0 0 25px #6d38cc88}
.banner span{font-size:25px;font-weight:900;color:#61fff4;text-shadow:0 0 6px #00ffff,0 0 15px #00ffff}
.machine{margin:0 5px;padding:7px;background:linear-gradient(90deg,#101736,#4c2076 25%,#20266b 50%,#4c2076 75%,#101736);border-radius:12px 12px 4px 4px;box-shadow:0 0 25px #3927a855}
.reels{height:475px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:hidden;background:#0b1026;border:4px solid #080b1c;border-radius:7px;box-shadow:inset 0 0 20px #000}
.reel{overflow:hidden;background:#b9d59f;border-right:3px solid #35435a}
.strip{transition:transform 1.2s cubic-bezier(.12,.78,.18,1)}
.symbol{height:157px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e8f2d8,#b5d69b 70%,#86ad74);border-bottom:4px solid #566a5b}
.five{font-family:Georgia,serif;font-size:72px;font-weight:bold;color:#fff2d0;text-shadow:4px 4px #69343a,-2px -2px #9c6a2f}
.face{width:105px;height:105px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f0d29c;border:7px solid #f8e8bd;box-shadow:0 7px #557b49;font-size:56px}
.coin{width:116px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#7fa86e;border:5px solid #e4edc8;color:#edf5d4;font-family:Georgia,serif;font-size:37px;text-shadow:3px 3px #48663d}
.x2{position:absolute;bottom:4px;font-size:40px;font-weight:bold;color:#dce8c3;text-shadow:3px 3px #3b4a30}
.message{height:30px;display:flex;align-items:center;justify-content:center;color:#a8ff67;font-size:14px;font-weight:bold}
.info{height:70px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;background:linear-gradient(#101c3b,#091328);border:1px solid #2d4270;border-radius:17px;box-shadow:inset 0 0 15px #000}
.infoItem{text-align:center}.infoSmall{display:block;color:#8796b4;font-size:9px;margin-bottom:5px}.value{color:#aaff5d;font-size:20px;font-weight:bold}
.controls{min-height:150px;display:grid;grid-template-columns:58px 58px 1fr 58px 58px;gap:6px;align-items:center;padding:10px 3px 18px}
