<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lobby Mania - ApostaXBet</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#02030b;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

.game{
  width:100%;
  max-width:650px;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);
  color:white;
  position:relative;
  overflow:hidden;
}

/* =========================
   TOPO
========================= */

.top{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:linear-gradient(#101d49,#071127);
  border-bottom:2px solid #345a9e;
}

.top .home{
  font-size:29px;
}

.top .name{
  font-size:18px;
  font-weight:bold;
  color:#eee;
}

.clock{
  font:18px monospace;
}

/* =========================
   BANNER
========================= */

.banner{
  height:105px;
  margin:18px 7px 9px;
  border-radius:8px;
  border:3px solid #17173c;

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:
    radial-gradient(circle,#352083 0,#171747 45%,#08091f 100%);

  box-shadow:
    0 0 16px #00dff077,
    inset 0 0 25px #6d38cc88;
}

.banner span{
  font-size:25px;
  font-weight:900;
  color:#61fff4;

  text-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff;
}

/* =========================
   MÁQUINA
========================= */

.machine{
  margin:0 5px;
  padding:7px;

  background:
    linear-gradient(
      90deg,
      #101736,
      #4c2076 25%,
      #20266b 50%,
      #4c2076 75%,
      #101736
    );

  border-radius:12px 12px 4px 4px;

  box-shadow:
    0 0 25px #3927a855;
}

/* =========================
   ROLOS
========================= */

.reels{
  height:475px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;

  overflow:hidden;

  background:#0b1026;

  border:4px solid #080b1c;
  border-radius:7px;

  box-shadow:
    inset 0 0 20px #000;
}

.reel{
  overflow:hidden;
  background:#b9d59f;
  border-right:3px solid #35435a;
}

.strip{
  transform:translateY(0);
  will-change:transform;
}

/* =========================
   SÍMBOLOS
========================= */

.symbol{
  height:157px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      #e8f2d8,
      #b5d69b 70%,
      #86ad74
    );

  border-bottom:4px solid #566a5b;
}

.five{
  font-family:Georgia,serif;
  font-size:72px;
  font-weight:bold;

  color:#fff2d0;

  text-shadow:
    4px 4px #69343a,
    -2px -2px #9c6a2f;
}

.face{
  width:105px;
  height:105px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f0d29c;

  border:7px solid #f8e8bd;

  box-shadow:
    0 7px #557b49;

  font-size:56px;
}

.coin{
  width:116px;
  height:82px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#7fa86e;

  border:5px solid #e4edc8;

  color:#edf5d4;

  font-family:Georgia,serif;
  font-size:37px;

  text-shadow:3px 3px #48663d;
}

.x2{
  position:absolute;
  bottom:4px;

  font-size:40px;
  font-weight:bold;

  color:#dce8c3;

  text-shadow:
    3px 3px #3b4a30;
}

/* =========================
   MENSAGEM
========================= */

.message{
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#a8ff67;
  font-size:14px;
  font-weight:bold;

  text-align:center;
}

/* =========================
   PAINEL
========================= */

.info{
  min-height:78px;

  display:grid;
  grid-template-columns:1fr 1.4fr 1fr;

  align-items:center;

  background:
    linear-gradient(#101c3b,#091328);

  border:1px solid #2d4270;

  border-radius:17px;

  box-shadow:
    inset 0 0 15px #000;
}

.infoItem{
  text-align:center;
}

.infoSmall{
  display:block;
  color:#8796b4;
  font-size:9px;
  margin-bottom:5px;
}

.value{
  color:#aaff5d;
  font-size:20px;
  font-weight:bold;

  transition:
    transform .25s ease,
    color .25s ease;
}

#balance.atualizando{
  transform:scale(1.12);
  color:#fff36b;
}

/* =========================
   BOTÕES
========================= */

.controls{
  min-height:150px;

  display:grid;

  grid-template-columns:
    58px
    58px
    1fr
    58px
    58px;

  gap:6px;

  align-items:center;

  padding:10px 3px 18px;
}

.btn{
  width:56px;
  height:56px;

  border-radius:50%;

  border:1px solid #445477;

  background:
    linear-gradient(#314064,#111a32);

  color:white;

  font-size:27px;

  box-shadow:
    0 4px 8px #0008;

  cursor:pointer;

  touch-action:manipulation;
}

.spin{
  width:112px;
  height:112px;

  justify-self:center;

  border-radius:50%;

  border:7px solid #25eaf1;

  background:
    radial-gradient(
      circle,
      #173d47,
      #07121d 70%
    );

  color:#62fff6;

  font-size:43px;

  box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;

  cursor:pointer;

  touch-action:manipulation;
}

.btn:active,
.spin:active{
  transform:scale(.92);
}

.btn:disabled,
.spin:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================
   AVISO
========================= */

.notice{
  text-align:center;
  color:#667799;
  font-size:10px;
  padding:4px 5px 20px;
}

/* =========================
   CARREGANDO
========================= */

#carregando{
  position:fixed;
  inset:0;

  background:#02030b;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:9999;

  color:#62fff6;

  font-size:16px;
  font-weight:bold;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:400px){

  .reels{
    height:390px;
  }

  .symbol{
    height:129px;
  }

  .spin{
    width:96px;
    height:96px;
  }

  .controls{
    grid-template-columns:
      52px
      52px
      1fr
      52px
      52px;
  }

  .btn{
    width:50px;
    height:50px;
  }

}

</style>

</head>

<body>

<div id="carregando">
  🔐 VERIFICANDO CONTA...
</div>


<div class="game">

  <div class="top">

    <div class="home"
         onclick="voltarLobby()">
      ⌂
    </div>

    <div class="name">
      Lobby Mania
    </div>

    <div class="clock"
         id="clock">
      03:27:59
    </div>

  </div>


  <div class="banner">

    <span>
      » Nova rodada é de empurrar! «
    </span>

  </div>


  <div class="machine">


    <div class="reels">

      <div class="reel">
        <div
          class="strip"
          id="reel1">
        </div>
      </div>


      <div class="reel">
        <div
          class="strip"
          id="reel2">
        </div>
      </div>


      <div class="reel">
        <div
          class="strip"
          id="reel3">
        </div>
      </div>

    </div>


    <div
      class="message"
      id="message">

      Pronto para jogar

    </div>


    <div class="info">


      <div class="infoItem">

        👤

      </div>


      <div class="infoItem">

        <span class="infoSmall">
          SALDO
        </span>

        <span
          class="value"
          id="balance">

          R$ 0,00

        </span>

      </div>


      <div class="infoItem">

        <span class="infoSmall">
          APOSTA
        </span>

        <span
          class="value"
          id="bet">

          R$ 0,50

        </span>

      </div>


    </div>


    <div class="controls">


      <button
        class="btn"
        id="soundBtn"
        onclick="sound()">

        🔇

      </button>


      <button
        class="btn"
        onclick="minus()">

        −

      </button>


      <button
        class="spin"
        id="spinButton"
        onclick="spin()">

        ★

      </button>


      <button
        class="btn"
        onclick="plus()">

        +

      </button>


      <button
        class="btn"
        onclick="spin()">

        ▶

      </button>


    </div>


  </div>


  <div class="notice">
    ApostaXBet
  </div>

</div>


<script type="module">

/* =====================================================
   SUPABASE
===================================================== */

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let saldoReal = 0;

let bet = 0.50;

let spinning = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const reels = [

  document.getElementById("reel1"),

  document.getElementById("reel2"),

  document.getElementById("reel3")

];


const balanceElement =
document.getElementById("balance");


const betElement =
document.getElementById("bet");


const messageElement =
document.getElementById("message");


const spinButton =
document.getElementById("spinButton");


const loading =
document.getElementById("carregando");


/* =====================================================
   SÍMBOLOS
===================================================== */

const symbols = [

  `<div class="symbol">

     <div class="five">
       5
     </div>

   </div>`,

  `<div class="symbol">

     <div class="face">
       🙂
     </div>

     <div class="x2">
       ×2
     </div>

   </div>`,

  `<div class="symbol">

     <div class="coin">
       0,05
     </div>

   </div>`,

  `<div class="symbol">

     <div class="five">
       5
     </div>

   </div>`,

  `<div class="symbol">

     <div class="face">
       😄
     </div>

     <div class="x2">
       ×2
     </div>

   </div>`,

  `<div class="symbol">

     <div class="coin">
       0,05
     </div>

   </div>`

];


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

  return "R$ " +
    Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}


/* =====================================================
   ATUALIZAR APOSTA
===================================================== */

function atualizarAposta(){

  betElement.textContent =
    dinheiro(bet);

}


/* =====================================================
   ATUALIZAR SALDO
===================================================== */

function atualizarSaldo(){

  balanceElement.textContent =
    dinheiro(saldoReal);

  balanceElement.classList.add(
    "atualizando"
  );


  setTimeout(
    function(){

      balanceElement.classList.remove(
        "atualizando"
      );

    },
    250
  );


  atualizarBotao();

}


/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

  if(spinning){

    spinButton.disabled =
      true;

    spinButton.textContent =
      "↻";

    return;

  }


  if(
    saldoReal < bet
  ){

    spinButton.disabled =
      true;

    spinButton.textContent =
      "★";

    return;

  }


  spinButton.disabled =
    false;

  spinButton.textContent =
    "★";

}


/* =====================================================
   USUÁRIO
===================================================== */

async function obterUsuario(){

  const {
    data,
    error
  } =
  await supabase
  .auth
  .getSession();


  if(error){

    console.error(
      error
    );

    return null;

  }


  return data?.session?.user || null;

}


/* =====================================================
   CARREGAR SALDO
===================================================== */

async function carregarSaldo(){

  if(!usuarioAtual)
    return false;


  const {
    data,
    error
  } =
  await supabase
  .from("saldos")
  .select("valor")
  .eq(
    "user_id",
    usuarioAtual.id
  )
  .single();


  if(error){

    console.error(
      "Erro saldo:",
      error
    );


    messageElement.textContent =
      "❌ ERRO AO CARREGAR SALDO";


    return false;

  }


  saldoReal =
    Number(
      data?.valor || 0
    );


  atualizarSaldo();


  return true;

}


/* =====================================================
   SALVAR SALDO
===================================================== */

async function salvarSaldo(
  novoSaldo
){

  if(!usuarioAtual)
    return false;


  const valorFinal =
    Number(
      Number(novoSaldo)
      .toFixed(2)
    );


  const {
    error
  } =
  await supabase
  .from("saldos")
  .update({
    valor:valorFinal
  })
  .eq(
    "user_id",
    usuarioAtual.id
  );


  if(error){

    console.error(
      "Erro ao salvar saldo:",
      error
    );


    messageElement.textContent =
      "❌ ERRO AO ATUALIZAR SALDO";


    return false;

  }


  saldoReal =
    valorFinal;


  atualizarSaldo();


  return true;

}


/* =====================================================
   MONTAR ROLOS
===================================================== */

function buildReels(){

  reels.forEach(
    function(reel,col){

      let html = "";


      /*
         Muitas casas para o movimento
         ficar visível.
      */

      for(
        let i = 0;
        i < 40;
        i++
      ){

        html +=
          symbols[
            (i + col * 2)
            % symbols.length
          ];

      }


      reel.innerHTML =
        html;


      reel.style.transform =
        "translateY(0)";


      reel.style.transition =
        "none";

    }
  );

}


/* =====================================================
   GIRAR
===================================================== */

async function spin(){

  if(spinning)
    return;


  if(!usuarioAtual){

    messageElement.textContent =
      "❌ USUÁRIO NÃO LOGADO";

    return;

  }


  if(
    saldoReal < bet
  ){

    messageElement.textContent =
      "❌ SALDO INSUFICIENTE";

    return;

  }


  spinning = true;

  atualizarBotao();


  /*
     DESCONTA A APOSTA
  */

  const saldoAntes =
    saldoReal;


  const saldoDepois =
    saldoAntes - bet;


  const debitado =
    await salvarSaldo(
      saldoDepois
    );


  if(!debitado){

    spinning = false;

    atualizarBotao();

    return;

  }


  messageElement.textContent =
    "🎰 Girando...";


  /*
     RECOMEÇA OS ROLOS
  */

  reels.forEach(
    function(reel){

      reel.style.transition =
        "none";

      reel.style.transform =
        "translateY(0)";

    }
  );


  /*
     Força o navegador
     a aplicar a posição inicial.
  */

  void reels[0].offsetHeight;


  /*
     SORTEIO
  */

  const ganhou =
    Math.random() < 0.20;


  let simboloVencedor;


  if(ganhou){

    simboloVencedor =
      Math.floor(
        Math.random() *
        symbols.length
      );

  }else{

    simboloVencedor =
      Math.floor(
        Math.random() *
        symbols.length
      );

  }


  /*
     CADA ROLO PARA EM UMA POSIÇÃO.
  */

  reels.forEach(
    function(reel,index){

      const casasBase =
        20 + index * 4;


      const casasExtra =
        Math.floor(
          Math.random() * 5
        );


      const casas =
        casasBase +
        casasExtra;


      const distancia =
        -(casas * 157);


      const duracao =
        1.5 +
        index * 0.35;


      reel.style.transition =
        "transform " +
        duracao +
        "s cubic-bezier(.12,.78,.18,1)";


      reel.style.transform =
        "translateY(" +
        distancia +
        "px)";

    }
  );


  /*
     FINAL DA RODADA
  */

  setTimeout(
    async function(){

      /*
         Resultado da rodada.
      */

      if(ganhou){

        const premio =
          Number(
            (bet * 2)
            .toFixed(2)
          );


        const novoSaldo =
          saldoReal +
          premio;


        const creditado =
          await salvarSaldo(
            novoSaldo
          );


        if(creditado){

          messageElement.textContent =
            "🎉 VOCÊ GANHOU " +
            dinheiro(premio);

        }

      }else{

        messageElement.textContent =
          "Nova rodada";

      }


      spinning =
        false;


      atualizarBotao();

    },
    2500
  );

}


/* =====================================================
   MAIS
===================================================== */

window.plus =
function(){

  if(spinning)
    return;


  bet =
    Math.min(
      5,
      bet + 0.50
    );


  atualizarAposta();

  atualizarBotao();

};


/* =====================================================
   MENOS
===================================================== */

window.minus =
function(){

  if(spinning)
    return;


  bet =
    Math.max(
      0.50,
      bet - 0.50
    );


  atualizarAposta();

  atualizarBotao();

};


/* =====================================================
   SOM
===================================================== */

let somLigado = false;

window.sound =
function(){

  somLigado =
    !somLigado;


  const botao =
    document.getElementById(
      "soundBtn"
    );


  if(somLigado){

    botao.textContent =
      "🔊";

    messageElement.textContent =
      "🔊 Som ligado";

  }else{

    botao.textContent =
      "🔇";

    messageElement.textContent =
      "🔇 Som desligado";

  }

};


/* =====================================================
   VOLTAR
===================================================== */

window.voltarLobby =
function(){

  window.location.href =
    "../index.html";

};


/* =====================================================
   RELÓGIO
===================================================== */

let segundos =
  3 * 3600 +
  27 * 60 +
  59;


setInterval(
  function(){

    segundos++;


    const h =
      Math.floor(
        segundos / 3600
      ) % 24;


    const m =
      Math.floor(
        (segundos % 3600) / 60
      );


    const s =
      segundos % 60;


    const clock =
      document.getElementById(
        "clock"
      );


    if(clock){

      clock.textContent =
        [h,m,s]
        .map(
          function(n){

            return String(n)
              .padStart(2,"0");

          }
        )
        .join(":");

    }

  },
  1000
);


/* =====================================================
   INICIAR
===================================================== */

async function iniciar(){

  try{

    usuarioAtual =
      await obterUsuario();


    if(!usuarioAtual){

      alert(
        "Você precisa estar logado para jogar."
      );


      window.location.href =
        "../index.html";


      return;

    }


    const carregou =
      await carregarSaldo();


    if(!carregou){

      loading.style.display =
        "none";

      return;

    }


    buildReels();

    atualizarAposta();

    atualizarSaldo();


    loading.style.display =
      "none";


  }catch(error){

    console.error(
      "Erro ao iniciar:",
      error
    );


    loading.style.display =
      "none";


    messageElement.textContent =
      "❌ ERRO AO INICIAR JOGO";

  }

}


/* =====================================================
   LOGIN
===================================================== */

supabase
.auth
.onAuthStateChange(
  function(
    event,
    session
  ){

    if(!session){

      window.location.href =
        "../index.html";

    }

  }
);


/* =====================================================
   INICIAR
===================================================== */

iniciar();

</script>

</body>

</html>
