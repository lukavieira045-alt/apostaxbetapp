<!DOCTYPE html>
<html lang="pt-BR">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030b;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.game{
    width:100%;
    max-width:650px;
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);
    color:white;
    position:relative;
    overflow:hidden;
}

.game.tremendo{
    animation:tremorJogo .09s infinite;
}

@keyframes tremorJogo{
    0%{transform:translate(0,0)}
    20%{transform:translate(-4px,2px)}
    40%{transform:translate(3px,-3px)}
    60%{transform:translate(-3px,-2px)}
    80%{transform:translate(4px,3px)}
    100%{transform:translate(0,0)}
}

.raio{
    position:fixed;
    inset:0;
    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(255,255,255,.95),
        rgba(80,220,255,.55) 15%,
        transparent 60%
    );
    opacity:0;
    pointer-events:none;
    z-index:999;
    mix-blend-mode:screen;
}

.raio.ativo{
    animation:clarãoRaio .75s ease-out;
}

@keyframes clarãoRaio{
    0%{opacity:0}
    12%{opacity:.9}
    25%{opacity:.25}
    42%{opacity:.75}
    58%{opacity:.15}
    72%{opacity:.5}
    100%{opacity:0}
}

.descarga{
    position:absolute;
    width:4px;
    height:150px;
    background:#fff;
    box-shadow:
    0 0 7px #00ffff,
    0 0 18px #00ffff,
    0 0 35px #fff;
    opacity:0;
    pointer-events:none;
    z-index:500;
    transform:rotate(var(--angulo));
}

.descarga.ativa{
    animation:descargaAnim 1s ease-out;
}

@keyframes descargaAnim{
    0%{
        opacity:0;
        transform:rotate(var(--angulo)) scaleY(.1);
    }
    15%{opacity:1}
    30%{opacity:.4}
    45%{opacity:1}
    65%{opacity:.7}
    100%{
        opacity:0;
        transform:rotate(var(--angulo)) scaleY(1);
    }
}

.top{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    background:linear-gradient(#101d49,#071127);
    border-bottom:2px solid #345a9e;
}

.top .home{
    font-size:29px;
    cursor:pointer;
}

.top .name{
    font-size:18px;
    font-weight:bold;
    color:#eee;
}

.clock{
    font:18px monospace;
}

.banner{

    border:3px solid #17173c;

    align-items:center;

.banner span{

    text-shadow:

}

.machine{

        #4c2076 25%,
        #20266b 50%,

    );

    box-shadow:0 0 25px #3927a855;
}

.reels{
    height:475px;

    grid-template-columns:repeat(3,1fr);
    gap:4px;

}

.reel{

}

.strip{

}

.symbol{

.five{

    text-shadow:

}

.gema{
    width:85px;

    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    filter:

}

@keyframes brilhoGema{
    from{transform:scale(.96)}

}

.moeda{
    width:95px;
    height:95px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(

    );
    border:6px solid #fff0a0;
    color:#6a3500;
    font-size:42px;
    font-weight:900;
    box-shadow:
    0 0 10px #ffd700,
    0 0 25px #ff9800;
}

.trofeu{
    font-size:78px;
    filter:
    drop-shadow(0 0 8px #ffd700)
    drop-shadow(0 0 18px #ff9800);
    animation:trofeuAnim 1.5s infinite alternate;
}

@keyframes trofeuAnim{
    from{transform:translateY(3px) rotate(-3deg)}
    to{transform:translateY(-3px) rotate(3deg)}
}

.x2{
    position:absolute;
    bottom:4px;
    font-size:40px;
    font-weight:bold;
    color:#dce8c3;
    text-shadow:3px 3px #3b4a30;
}

.message{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a8ff67;
    font-size:14px;
    font-weight:bold;
}

.info{
    height:70px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    background:linear-gradient(#101c3b,#091328);
    border:1px solid #2d4270;
    border-radius:17px;
    box-shadow:inset 0 0 15px #000;
}

.infoItem{
    text-align:center;
}

.infoSmall{
    display:block;
    color:#8796b4;
    font-size:9px;
    margin-bottom:5px;
}

.value{
    color:#aaff5d !important;
    font-size:20px;
    font-weight:bold;
}

.controls{
    min-height:150px;
    display:grid;
    grid-template-columns:58px 58px 1fr 58px 58px;
    gap:6px;
    align-items:center;
    padding:10px 3px 18px;
}

.btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid #445477;
    background:linear-gradient(#314064,#111a32);
    color:white;
    font-size:27px;

    cursor:pointer;
}

.spin{
    width:112px;

    justify-self:center;

    border:7px solid #25eaf1;
    background:

        circle,
        #173d47,
        #07121d 70%
    );
    color:#62fff6;
    font-size:43px;
    box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;
    cursor:pointer;
}

.btn:active,
.spin:active{
    transform:scale(.92);
}

.btn:disabled,
.spin:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.btn.somAtivo{
    box-shadow:

.notice{

@media(max-width:380px){

    }

    }

    .btn{

        height:48px;
        font-size:23px;
    }

    .spin{
        width:92px;
        height:92px;
        font-size:36px;
    }

}

</style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';

let supabaseClient = null;
let sistemaOnline = false;

try{

    if(window.supabase){

        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        sistemaOnline = true;
    }

}catch(e){

    console.error(
        "Erro Supabase:",
        e
    );

}


/* =====================================================
   SISTEMA DE SALDO
===================================================== */

window.SistemaSaldo = {

    saldoLocal:0,

    async get(){

        if(!sistemaOnline){
            return this.saldoLocal;
        }

        try{

            const {data} =
            await supabaseClient
            .auth
            .getSession();

            if(!data?.session){
                throw new Error(
                    "Sem sessão"
                );
            }

            const {
                data:saldoData,
                error
            } =
            await supabaseClient
            .from("saldos")
            .select("valor")
            .eq(
                "user_id",
                data.session.user.id
            )
            .single();

            if(error){
                throw error;
            }

            this.saldoLocal =
            Number(
                saldoData?.valor || 0
            );

            return this.saldoLocal;

        }catch(e){

            console.warn(
                "Falha ao buscar saldo:",
                e
            );

            return this.saldoLocal;
        }
    },

    async debitar(valor){

        this.saldoLocal -= valor;

        if(!sistemaOnline){
            return;
        }

        try{

            const {data} =
            await supabaseClient
            .auth
            .getSession();

            if(!data?.session){
                return;
            }

            const {error} =
            await supabaseClient.rpc(
                "debitar_saldo",
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );

            if(error){
                console.warn(
                    "Erro RPC débito:",
                    error
                );
            }

        }catch(e){

            console.warn(
                "Erro ao sincronizar débito:",
                e
            );
        }
    },

    async creditar(valor){

        this.saldoLocal += valor;

        if(!sistemaOnline){
            return;
        }

        try{

            const {data} =
            await supabaseClient
            .auth
            .getSession();

            if(!data?.session){
                return;
            }

            const {error} =
            await supabaseClient.rpc(
                "creditar_saldo",
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );

            if(error){
                console.warn(
                    "Erro RPC crédito:",
                    error
                );
            }

        }catch(e){

            console.warn(
                "Erro ao sincronizar crédito:",
                e
            );
        }
    },

    async atualizarTela(){

        const saldo =
        await this.get();

        const el =
        document.getElementById(
            "balance"
        );

        if(el){

            el.textContent =
            dinheiro(saldo);

            el.style.color =
            "#aaff5d";
        }

        return saldo;
    }

};


/* =====================================================
   ELEMENTOS
===================================================== */

const game =
document.getElementById("game");

const raio =
document.getElementById("raio");

const reels = [

    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")

];

const messageEl =
document.getElementById("message");

const spinBtn =
document.getElementById("spinButton");

const soundButton =
document.getElementById("soundButton");


/* =====================================================
   SÍMBOLOS
===================================================== */

const symbols = [

`
<div class="symbol">
    <div class="gema">💎</div>
</div>
`,

`
<div class="symbol">
    <div class="moeda">★</div>
    <div class="x2">×2</div>
</div>
`,

`
<div class="symbol">
    <div class="trofeu">🏆</div>
</div>
`,

`
<div class="symbol">
    <div class="five">5</div>
</div>
`,

`
<div class="symbol">
    <div class="gema">💠</div>
</div>
`,

`
<div class="symbol">
    <div class="moeda">★</div>
</div>
`

];


let bet = 0.50;

const betMin = 0.50;

let spinning = false;


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

let somLigado = true;


/*
   MÚSICA DO LOBBY

   O arquivo precisa estar na mesma pasta
   do lobby.html:

   jogos/musica-lobby.mp3
*/

const musicaLobby =
new Audio("musica-lobby.mp3");

musicaLobby.loop = true;
musicaLobby.volume = 0.28;

let musicaIniciada = false;


/* =====================================================
   INICIAR AUDIO
===================================================== */

function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

}


/* =====================================================
   INICIAR MÚSICA
===================================================== */

function iniciarMusica(){

    if(!somLigado)
        return;

    if(musicaIniciada)
        return;

    musicaLobby.play()
    .then(()=>{

        musicaIniciada = true;

    })
    .catch(()=>{

        /*
        O navegador pode bloquear
        o autoplay até o primeiro
        toque do usuário.
        */

        musicaIniciada = false;

    });

}


/* =====================================================
   SOM DE CLIQUE
===================================================== */

function somClique(){

    if(!somLigado)
        return;

    iniciarAudio();

    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    osc.frequency.value =
    650;

    osc.type =
    "square";

    gain.gain.setValueAtTime(
        0.045,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + .08
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + .08
    );

}


/* =====================================================
   SOM DO GIRO
===================================================== */

function somGiro(){

    if(!somLigado)
        return;

    iniciarAudio();

    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    osc.type =
    "sawtooth";

    osc.frequency.setValueAtTime(
        90,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        220,
        audioContext.currentTime + 2
    );

    gain.gain.setValueAtTime(
        0.018,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 2
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + 2
    );

}


/* =====================================================
   SOM TROVÃO
===================================================== */

function somTrovao(){

    if(!somLigado)
        return;

    iniciarAudio();

    const duracao =
    1.1;

    const buffer =
    audioContext.createBuffer(
        1,
        audioContext.sampleRate *
        duracao,
        audioContext.sampleRate
    );

    const data =
    buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        const queda =
        1 - i/data.length;

        data[i] =
        (
            Math.random() * 2 - 1
        ) *
        queda *
        queda;
    }

    const noise =
    audioContext.createBufferSource();

    noise.buffer =
    buffer;

    const gain =
    audioContext.createGain();

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.28,
        audioContext.currentTime + .04
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duracao
    );

    noise.connect(gain);

    gain.connect(
        audioContext.destination
    );

    noise.start();

}


/* =====================================================
   BOTÃO DE SOM
===================================================== */

function sound(){

    iniciarAudio();

    somLigado =
    !somLigado;

    if(somLigado){

        soundButton.textContent =
        "🔊";

        soundButton.classList.add(
            "somAtivo"
        );

        musicaLobby.volume =
        0.28;

        musicaLobby.play()
        .then(()=>{

            musicaIniciada =
            true;

        })
        .catch(()=>{

            musicaIniciada =
            false;

        });

        messageEl.textContent =
        "🔊 Som ativado";

        somClique();

    }else{

        soundButton.textContent =
        "🔇";

        soundButton.classList.remove(
            "somAtivo"
        );

        musicaLobby.pause();

        messageEl.textContent =
        "🔇 Som desligado";

    }

}


/* =====================================================
   LIBERAR MÚSICA NO PRIMEIRO TOQUE
===================================================== */

function primeiroToque(){

    iniciarAudio();

    iniciarMusica();

    document.removeEventListener(
        "click",
        primeiroToque
    );

    document.removeEventListener(
        "touchstart",
        primeiroToque
    );

}

document.addEventListener(
    "click",
    primeiroToque
);

document.addEventListener(
    "touchstart",
    primeiroToque
);


/* =====================================================
   RAIOS
===================================================== */

function criarDescarga(){

    const d =
    document.createElement(
        "div"
    );

    d.className =
    "descarga";

    d.style.left =
    (
        Math.random() * 100
    ) + "%";

    d.style.top =
    (
        10 +
        Math.random() * 65
    ) + "%";

    d.style.setProperty(
        "--angulo",
        (
            -40 +
            Math.random() * 80
        ) + "deg"
    );

    game.appendChild(d);

    requestAnimationFrame(
        () => {

            d.classList.add(
                "ativa"
            );

        }
    );

    setTimeout(
        () => d.remove(),
        1200
    );

}


/* =====================================================
   EFEITO TROVÃO
===================================================== */

function efeitoTrovao(){

    game.classList.add(
        "tremendo"
    );

    if(
        navigator.vibrate
    ){

        navigator.vibrate([
            120,
            70,
            180,
            80,
            220
        ]);

    }

    raio.classList.remove(
        "ativo"
    );

    void raio.offsetWidth;

    raio.classList.add(
        "ativo"
    );

    somTrovao();

    criarDescarga();

    setTimeout(
        criarDescarga,
        350
    );

    setTimeout(
        criarDescarga,
        700
    );

    setTimeout(
        criarDescarga,
        1050
    );

    setTimeout(
        criarDescarga,
        1400
    );

    setTimeout(
        () => {

            game.classList.remove(
                "tremendo"
            );

        },
        1700
    );

}


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(v){

    return "R$" +
    Number(v)
    .toFixed(2)
    .replace(
        ".",
        ","
    );

}


/* =====================================================
   CONSTRUIR ROLOS
===================================================== */

function buildReels(){

    reels.forEach(
        (reel,col) => {

            let html =
            "";

            for(
                let i=0;
                i<80;
                i++
            ){

                html +=
                symbols[
                    (
                        i +
                        col * 2
                    )
                    %
                    symbols.length
                ];

            }

            reel.innerHTML =
            html;

        }
    );

}


/* =====================================================
   APOSTA
===================================================== */

function atualizarAposta(){

    const el =
    document.getElementById(
        "bet"
    );

    el.textContent =
    dinheiro(bet);

}


function plus(){

    if(spinning)
        return;

    iniciarAudio();

    iniciarMusica();

    somClique();

    bet =
    Math.min(
        5,
        Number(
            (
                bet +
                .50
            ).toFixed(2)
        )
    );

    atualizarAposta();

}


function minus(){

    if(spinning)
        return;

    iniciarAudio();

    iniciarMusica();

    somClique();

    bet =
    Math.max(
        betMin,
        Number(
            (
                bet -
                .50
            ).toFixed(2)
        )
    );

    atualizarAposta();

}


/* =====================================================
   RELÓGIO
===================================================== */

let segundos =
0;

function updateClock(){

    setInterval(
        () => {

            segundos++;

            const h =
            Math.floor(
                segundos / 3600
            ) % 24;

            const m =
            Math.floor(
                (
                    segundos % 3600
                ) / 60
            );

            const s =
            segundos % 60;

            document
            .getElementById(
                "clock"
            )
            .textContent =

            [h,m,s]
            .map(
                n =>
                String(n)
                .padStart(2,"0")
            )
            .join(":");

        },
        1000
    );

}


/* =====================================================
   INICIAR
===================================================== */

async function init(){

    buildReels();

    atualizarAposta();

    updateClock();

    await window
    .SistemaSaldo
    .atualizarTela();

    messageEl.textContent =
    "Pronto para jogar";

}


/* =====================================================
   GIRAR COM SORTE REAL
===================================================== */

async function spin(){

    if(spinning)
        return;

    iniciarAudio();

    iniciarMusica();

    somClique();

    const saldoAtual =
    await window
    .SistemaSaldo
    .get();

    if(
        saldoAtual < bet
    ){

        messageEl.textContent =
        "❌ Saldo insuficiente";

        messageEl.style.color =
        "#ff4d4d";

        return;
    }

    efeitoTrovao();

    spinning =
    true;

    spinBtn.disabled =
    true;

    messageEl.textContent =
    "⚡ Girando...";

    messageEl.style.color =
    "#61fff4";

    somGiro();

    await window
    .SistemaSaldo
    .debitar(
        bet
    );

    await window
    .SistemaSaldo
    .atualizarTela();

    // FORÇA A VITÓRIA: Todos os rolos param no mesmo símbolo
    const totalSimbolos = symbols.length;
    const simboloVencedor = Math.floor(Math.random() * totalSimbolos);
    
    const posicoesFinais = [
        simboloVencedor,
        simboloVencedor,
        simboloVencedor
    ];

    reels.forEach(
        (reel,index) => {

            reel.style.transition =
            "none";

            reel.style.transform =
            "translateY(0)";

            void reel.offsetHeight;

            // Calcula a distância para parar no símbolo sorteado
            const casas =
            45 +
            Math.floor(
                Math.random() * 15
            );

            const altura =
            157;

            // Ajuste fino para alinhar o símbolo sorteado no centro
            const distancia =
            -(
                (
                    casas +
                    index * 3 +
                    posicoesFinais[index]
                )
                *
                altura
            );

            const duracao =
            2.7 +
            (
                index *
                0.55
            );

            reel.style.transition =
            `transform ${duracao}s cubic-bezier(.08,.72,.16,1)`;

            reel.style.transform =
            `translateY(${distancia}px)`;

        }
    );

    const tempoFinal =
    3900;

    setTimeout(
        async () => {

            // Verifica se os 3 rolos pararam no mesmo índice (Sorte Real)
            const r1 = posicoesFinais[0];
            const r2 = posicoesFinais[1];
            const r3 = posicoesFinais[2];

            let ganhoValor = 0;

            if(r1 === r2 && r2 === r3){

                /* 
                   TAXA DA CASA (HOUSE EDGE)
                   Aplica 8% de taxa sobre o prêmio final.
                */
                const TAXA_CASA = 90; 

                // Multiplicador entre 10x e 20x para compensar a dificuldade
                const multiplicador = 20; 
                
                const premioBruto = bet * multiplicador;
                ganhoValor = premioBruto * TAXA_CASA;

                await window
                .SistemaSaldo
                .creditar(
                    ganhoValor
                );

                messageEl.textContent =
                `⚡ 🎉 JACKPOT! ${dinheiro(ganhoValor)}!`;

                messageEl.style.color =
                "#aaff5d";

            }else{

                messageEl.textContent =
                "⚡ Não foi desta vez.";

                messageEl.style.color =
                "#ff7b7b";

            }

            await window
            .SistemaSaldo
            .atualizarTela();

            spinning =
            false;

            spinBtn.disabled =
            false;

        },
        tempoFinal
    );

}


/* =====================================================
   INICIAR JOGO
===================================================== */

init();

</script>
