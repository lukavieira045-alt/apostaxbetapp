<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lobby Mania - ApostaXBet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030b;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.game{
    width:100%;
    max-width:650px;
    min-height:100vh;

    background:
    radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);

    color:white;
    position:relative;
    overflow:hidden;
}


/* =====================================================
   EFEITO DE TROVÃO
===================================================== */

.game.tremendo{
    animation:
    tremorJogo .10s infinite;
}

@keyframes tremorJogo{

    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-3px,2px);
    }

    50%{
        transform:translate(3px,-2px);
    }

    75%{
        transform:translate(-2px,-3px);
    }

    100%{
        transform:translate(2px,3px);
    }
}


/* CLARÃO */

.raio{
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(255,255,255,.95),
        rgba(80,220,255,.55) 15%,
        transparent 55%
    );

    opacity:0;
    pointer-events:none;

    z-index:999;

    mix-blend-mode:screen;
}

.raio.ativo{
    animation:
    clarãoRaio .18s ease-out;
}

@keyframes clarãoRaio{

    0%{
        opacity:0;
    }

    20%{
        opacity:.95;
    }

    45%{
        opacity:.15;
    }

    65%{
        opacity:.75;
    }

    100%{
        opacity:0;
    }
}


/* DESCARGA */

.descarga{
    position:absolute;

    width:3px;
    height:120px;

    background:#ffffff;

    box-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff,
    0 0 30px #ffffff;

    opacity:0;

    pointer-events:none;

    z-index:500;

    transform:rotate(var(--angulo));
}

.descarga.ativa{
    animation:
    descargaAnim .22s ease-out;
}

@keyframes descargaAnim{

    0%{
        opacity:0;
        transform:
        rotate(var(--angulo))
        scaleY(.2);
    }

    20%{
        opacity:1;
    }

    50%{
        opacity:.9;
    }

    100%{
        opacity:0;
        transform:
        rotate(var(--angulo))
        scaleY(1);
    }
}


/* =====================================================
   TOPO
===================================================== */

.top{
    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 14px;

    background:
    linear-gradient(#101d49,#071127);

    border-bottom:2px solid #345a9e;
}

.top .home{
    font-size:29px;
    cursor:pointer;
}

.top .name{
    font-size:18px;
    font-weight:bold;
    color:#eee;
}

.clock{
    font:18px monospace;
}


/* =====================================================
   BANNER
===================================================== */

.banner{
    height:105px;

    margin:18px 7px 9px;

    border-radius:8px;
    border:3px solid #17173c;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    radial-gradient(
        circle,
        #352083 0,
        #171747 45%,
        #08091f 100%
    );

    box-shadow:
    0 0 16px #00dff077,
    inset 0 0 25px #6d38cc88;
}

.banner span{
    font-size:25px;
    font-weight:900;

    color:#61fff4;

    text-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff;
}


/* =====================================================
   MÁQUINA
===================================================== */

.machine{
    margin:0 5px;

    padding:7px;

    background:
    linear-gradient(
        90deg,
        #101736,
        #4c2076 25%,
        #20266b 50%,
        #4c2076 75%,
        #101736
    );

    border-radius:12px 12px 4px 4px;

    box-shadow:
    0 0 25px #3927a855;
}


/* =====================================================
   ROLOS
===================================================== */

.reels{
    height:475px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:4px;

    overflow:hidden;

    background:#0b1026;

    border:4px solid #080b1c;

    border-radius:7px;

    box-shadow:
    inset 0 0 20px #000;
}

.reel{
    overflow:hidden;

    background:#b9d59f;

    border-right:3px solid #35435a;
}

.strip{
    transform:translateY(0);
}


/* =====================================================
   SÍMBOLOS
===================================================== */

.symbol{

    height:157px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        #e8f2d8,
        #b5d69b 70%,
        #86ad74
    );

    border-bottom:4px solid #566a5b;
}


/* 5 */

.five{

    font-family:Georgia,serif;

    font-size:72px;

    font-weight:bold;

    color:#fff2d0;

    text-shadow:
    4px 4px #69343a,
    -2px -2px #9c6a2f;
}


/* NOVOS SÍMBOLOS */

.gema{

    width:85px;
    height:85px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:55px;

    filter:
    drop-shadow(0 0 8px #00ffff)
    drop-shadow(0 0 15px #0088ff);

    animation:
    brilhoGema 1.8s infinite alternate;
}

@keyframes brilhoGema{

    from{
        transform:scale(.96);
    }

    to{
        transform:scale(1.06);
    }
}


.moeda{

    width:95px;
    height:95px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at 35% 30%,
        #fff36a,
        #ffd000 40%,
        #e38a00 75%,
        #8a4700
    );

    border:6px solid #fff0a0;

    color:#6a3500;

    font-size:42px;
    font-weight:900;

    box-shadow:
    0 0 10px #ffd700,
    0 0 25px #ff9800;

    text-shadow:
    1px 2px #fff4a0;
}


.trofeu{

    font-size:78px;

    filter:
    drop-shadow(0 0 8px #ffd700)
    drop-shadow(0 0 18px #ff9800);

    animation:
    trofeuAnim 1.5s infinite alternate;
}

@keyframes trofeuAnim{

    from{
        transform:translateY(3px) rotate(-3deg);
    }

    to{
        transform:translateY(-3px) rotate(3deg);
    }
}


.x2{

    position:absolute;

    bottom:4px;

    font-size:40px;

    font-weight:bold;

    color:#dce8c3;

    text-shadow:
    3px 3px #3b4a30;
}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

    height:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#a8ff67;

    font-size:14px;

    font-weight:bold;
}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.info{

    height:70px;

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr;

    align-items:center;

    background:
    linear-gradient(
        #101c3b,
        #091328
    );

    border:1px solid #2d4270;

    border-radius:17px;

    box-shadow:
    inset 0 0 15px #000;
}

.infoItem{
    text-align:center;
}

.infoSmall{

    display:block;

    color:#8796b4;

    font-size:9px;

    margin-bottom:5px;
}

.value{

    color:#aaff5d !important;

    font-size:20px;

    font-weight:bold;

    transition:
    transform .25s ease;
}

#balance.atualizando{

    transform:scale(1.12);

    color:#fff36b !important;
}


/* =====================================================
   CONTROLES
===================================================== */

.controls{

    min-height:150px;

    display:grid;

    grid-template-columns:
    58px 58px 1fr 58px 58px;

    gap:6px;

    align-items:center;

    padding:10px 3px 18px;
}

.btn{

    width:56px;
    height:56px;

    border-radius:50%;

    border:1px solid #445477;

    background:
    linear-gradient(
        #314064,
        #111a32
    );

    color:white;

    font-size:27px;

    box-shadow:
    0 4px 8px #0008;

    cursor:pointer;
}

.spin{

    width:112px;
    height:112px;

    justify-self:center;

    border-radius:50%;

    border:7px solid #25eaf1;

    background:
    radial-gradient(
        circle,
        #173d47,
        #07121d 70%
    );

    color:#62fff6;

    font-size:43px;

    box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;

    cursor:pointer;

    transition:
    transform .12s ease;
}

.btn:active,
.spin:active{

    transform:scale(.92);
}

.btn:disabled,
.spin:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* BOTÃO DE SOM ATIVO */

.btn.somAtivo{

    box-shadow:
    0 0 12px #00ffff,
    0 4px 8px #0008;

    border-color:#00ffff;

}


/* =====================================================
   AVISO
===================================================== */

.notice{

    text-align:center;

    color:#667799;

    font-size:10px;

    padding:4px 5px 20px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:380px){

    .reels{
        height:390px;
    }

    .symbol{
        height:130px;
    }

    .controls{

        grid-template-columns:
        48px 48px 1fr 48px 48px;
    }

    .btn{

        width:48px;
        height:48px;

        font-size:23px;
    }

    .spin{

        width:92px;
        height:92px;

        font-size:36px;
    }

}

</style>
</head>

<body>

<div class="game" id="game">

    <!-- CLARÃO DOS TROVÕES -->
    <div class="raio" id="raio"></div>

    <div class="top">

        <div
            class="home"
            onclick="window.location.href='index.html'"
        >
            🏠
        </div>

        <div class="name">
            Lobby Mania
        </div>

        <div
            class="clock"
            id="clock"
        >
            00:00:00
        </div>

    </div>


    <div class="banner">

        <span>
            » Aposta Real Ativada! «
        </span>

    </div>


    <div class="machine">

        <div class="reels">

            <div class="reel">
                <div
                    class="strip"

                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel2"
                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel3"
                ></div>
            </div>

        </div>

            class="message"
            id="message"
        >
            Iniciando...
        </div>

                <span class="infoSmall">

                id="spinButton"
                type="button"
                onclick="spin()"
            >
                ★
            </button>


            <button
                class="btn"
                type="button"
                onclick="plus()"
            >
                +
            </button>

                class="btn"
                type="button"
                onclick="spin()"
            >
                ▶
            </button>

        </div>

    </div>


    <div class="notice">
        Jogo integrado ao sistema financeiro real.
    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';


let supabaseClient = null;

let sistemaOnline = false;


try{

    if(window.supabase){

        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        sistemaOnline = true;

    }

}catch(e){

    console.error(
        "Erro Supabase:",
        e
    );

}


/* =====================================================
   SISTEMA DE SALDO
===================================================== */

window.SistemaSaldo = {

    saldoLocal:0,


    async get(){

        if(!sistemaOnline){

            return this.saldoLocal;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                throw new Error(
                    'Sem sessão'
                );

            }


            const {
                data:saldoData,
                error
            } =
            await supabaseClient
            .from('saldos')
            .select('valor')
            .eq(
                'user_id',
                data.session.user.id
            )
            .single();


            if(error){

                throw error;

            }


            this.saldoLocal =
            Number(
                saldoData?.valor || 0
            );


            return this.saldoLocal;


        }catch(e){

            console.warn(
                "Falha ao buscar saldo:",
                e
            );

            return this.saldoLocal;

        }

    },


    async debitar(valor){

        this.saldoLocal -= valor;


        if(!sistemaOnline){

            return;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                return;

            }


            await supabaseClient.rpc(
                'debitar_saldo',
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );


        }catch(e){

            console.warn(
                "Erro ao sincronizar débito:",
                e
            );

        }

    },


    async creditar(valor){

        this.saldoLocal += valor;


        if(!sistemaOnline){

            return;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                return;

            }


            await supabaseClient.rpc(
                'creditar_saldo',
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );


        }catch(e){

            console.warn(
                "Erro ao sincronizar crédito:",
                e
            );

        }

    },


    async atualizarTela(){

        const saldo =
        await this.get();


        const el =
        document.getElementById(
            'balance'
        );


        if(el){

            el.textContent =
            dinheiro(saldo);

            el.style.color =
            '#aaff5d';

        }


        return saldo;

    }

};


/* =====================================================
   ELEMENTOS
===================================================== */

const game =
document.getElementById(
    "game"
);

const raio =
document.getElementById(
    "raio"
);

const reels = [

    document.getElementById(
        "reel1"
    ),

    document.getElementById(
        "reel2"
    ),

    document.getElementById(
        "reel3"
    )

];

const messageEl =
document.getElementById(
    "message"
);

const balanceEl =
document.getElementById(
    "balance"
);

const betEl =
document.getElementById(
    "bet"
);

const spinBtn =
document.getElementById(
    "spinButton"
);

const soundButton =
document.getElementById(
    "soundButton"
);


/* =====================================================
   SÍMBOLOS
===================================================== */

const symbols = [

    `
    <div class="symbol">
        <div class="gema">💎</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="moeda">★</div>
        <div class="x2">×2</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="trofeu">🏆</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="five">5</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="gema">💠</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="moeda">★</div>
    </div>
    `

];


const betMin =
0.50;

let bet =
0.50;

let spinning =
false;


/* =====================================================
   SOM
===================================================== */

let audioContext =
null;

let somLigado =
true;


function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* SOM DO CLIQUE */

function somClique(){

    if(!somLigado) return;

    iniciarAudio();

    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();


    osc.frequency.value =
    650;

    osc.type =
    "square";


    gain.gain.setValueAtTime(
        0.045,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.08
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.stop(
        audioContext.currentTime + 0.08
    );

}


/* SOM DO TROVÃO */

function somTrovao(){

    if(!somLigado) return;

    iniciarAudio();


    const duracao =
    0.5;


    const buffer =
    audioContext.createBuffer(
        1,
        audioContext.sampleRate * duracao,
        audioContext.sampleRate
    );


    const data =
    buffer.getChannelData(0);


    for(
        let i=0;
        i<data.length;
        i++
    ){

        const queda =
        1 - i/data.length;

        data[i] =
        (
            Math.random() * 2 - 1
        ) *
        queda *
        queda;

    }


    const noise =
    audioContext.createBufferSource();

    noise.buffer =
    buffer;


    const gain =
    audioContext.createGain();


    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.35,
        audioContext.currentTime + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duracao
    );


    noise.connect(gain);

    gain.connect(
        audioContext.destination
    );


    noise.start();

}


/* BOTÃO DE SOM */

function sound(){

    somLigado =
    !somLigado;


    if(somLigado){

        soundButton.textContent =
        "🔊";

        soundButton.classList.add(
            "somAtivo"
        );

        messageEl.textContent =
        "🔊 Som ativado";


        somClique();

    }else{

        soundButton.textContent =
        "🔇";

        soundButton.classList.remove(
            "somAtivo"
        );

        messageEl.textContent =
        "🔇 Som desligado";

    }

}


/* =====================================================
   TROVÕES VISUAIS
===================================================== */

function criarDescarga(){

    const d =
    document.createElement(
        "div"
    );

    d.className =
    "descarga";


    d.style.left =
    (
        Math.random() * 100
    ) + "%";


    d.style.top =
    (
        15 +
        Math.random() * 55
    ) + "%";


    d.style.setProperty(
        "--angulo",
        (
            -35 +
            Math.random() * 70
        ) + "deg"
    );


    game.appendChild(d);


    requestAnimationFrame(
        () => {

            d.classList.add(
                "ativa"
            );

        }
    );


    setTimeout(
        () => d.remove(),
        300
    );

}


/* EFEITO PRINCIPAL */

function efeitoTrovao(){

    game.classList.add(
        "tremendo"
    );


    raio.classList.remove(
        "ativo"
    );


    void raio.offsetWidth;


    raio.classList.add(
        "ativo"
    );


    somTrovao();


    criarDescarga();


    setTimeout(
        criarDescarga,
        100
    );


    setTimeout(
        criarDescarga,
        190
    );


    setTimeout(
        () => {

            game.classList.remove(
                "tremendo"
            );

        },
        650
    );

}


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(v){

    return "R$" +
    Number(v)
    .toFixed(2)
    .replace(
        ".",
        ","
    );

}


/* =====================================================
   CONSTRUIR ROLOS
===================================================== */

function buildReels(){

    reels.forEach(
        (reel,col) => {

            let html = "";


            for(
                let i=0;
                i<45;
                i++
            ){

                html +=
                symbols[
                    (
                        i +
                        col * 2
                    )
                    %
                    symbols.length
                ];

            }


            reel.innerHTML =
            html;

        }
    );

}


/* =====================================================
   APOSTA
===================================================== */

function atualizarAposta(){

    betEl.textContent =
    dinheiro(bet);

    betEl.style.color =
    "#aaff5d";

}


function plus(){

    if(spinning)
    return;


    somClique();


    bet =
    Math.min(
        5,
        Number(
            (
                bet +
                0.50
            ).toFixed(2)
        )
    );


    atualizarAposta();

}


function minus(){

    if(spinning)
    return;


    somClique();


    bet =
    Math.max(
        betMin,
        Number(
            (
                bet -
                0.50
            ).toFixed(2)
        )
    );


    atualizarAposta();

}


/* =====================================================
   RELÓGIO
===================================================== */

let segundos =
0;


function updateClock(){

    setInterval(
        () => {

            segundos++;


            const h =
            Math.floor(
                segundos / 3600
            ) % 24;


            const m =
            Math.floor(
                (
                    segundos % 3600
                ) / 60
            );


            const s =
            segundos % 60;


            document
            .getElementById(
                "clock"
            )
            .textContent =

            [h,m,s]
            .map(
                n =>
                String(n)
                .padStart(2,"0")
            )
            .join(":");

        },
        1000
    );

}


/* =====================================================
   INICIAR
===================================================== */

async function init(){

    buildReels();

    updateClock();

    atualizarAposta();

    await window
    .SistemaSaldo
    .atualizarTela();


    messageEl.textContent =
    "Pronto para jogar";

    messageEl.style.color =
    "#a8ff67";

}


/* =====================================================
   GIRAR
===================================================== */

async function spin(){

    if(spinning)
    return;


    iniciarAudio();


    somClique();


    const saldoAtual =
    await window
    .SistemaSaldo
    .get();


    if(saldoAtual < bet){

        messageEl.textContent =
        "❌ Saldo insuficiente";

        messageEl.style.color =
        "#ff4d4d";

        return;

    }


    /*
    TROVÃO NO MOMENTO DO CLIQUE
    */

    efeitoTrovao();


    spinning =
    true;


    spinBtn.disabled =
    true;


    messageEl.textContent =
    "⚡ Girando...";


    messageEl.style.color =
    "#61fff4";


    /*
    DEBITA
    */

    await window
    .SistemaSaldo
    .debitar(
        bet
    );


    await window
    .SistemaSaldo
    .atualizarTela();


    /*
    GIRO DOS ROLOS
    */

    reels.forEach(
        (reel,index) => {

            reel.style.transition =
            "none";

            reel.style.transform =
            "translateY(0)";


            void reel.offsetHeight;


            const casas =
            16 +
            Math.floor(
                Math.random() * 5
            );


            const altura =
            157;


            const distance =
            -(
                (
                    casas +
                    index * 2
                ) *
                altura
            );


            /*
            GIRO MAIS LEVE
            */

            const duracao =
            0.75 +
            (
                index *
                0.16
            );


            reel.style.transition =
            `transform ${duracao}s cubic-bezier(.16,.82,.18,1)`;


            reel.style.transform =
            `translateY(${distance}px)`;

        }
    );


    /*
    RESULTADO
    */

    setTimeout(
        async () => {

            const ganhou =
            Math.random() > 0.6;


            let ganhoValor =
            0;


            if(ganhou){

                ganhoValor =
                bet *
                (
                    Math.floor(
                        Math.random() * 5
                    ) + 2
                );


                await window
                .SistemaSaldo
                .creditar(
                    ganhoValor
                );


                messageEl.textContent =
                `⚡ ✅ Ganhou ${dinheiro(ganhoValor)}!`;


                messageEl.style.color =
                "#aaff5d";


            }else{

                messageEl.textContent =
                "⚡ Não foi desta vez.";


                messageEl.style.color =
                "#ff7b7b";

            }


            await window
            .SistemaSaldo
            .atualizarTela();


            spinning =
            false;


            spinBtn.disabled =
            false;


        },
        1250
    );

}


/* =====================================================
   INICIAR JOGO
===================================================== */

init();

</script>
