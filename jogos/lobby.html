<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lobby Mania</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#02030b;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

.game{
  width:100%;
  max-width:650px;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);
  color:white;
  position:relative;
  overflow:hidden;
}

/* TOPO */

.top{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:linear-gradient(#101d49,#071127);
  border-bottom:2px solid #345a9e;
}

.top .home{
  font-size:29px;
}

.top .name{
  font-size:18px;
  font-weight:bold;
  color:#eee;
}

.clock{
  font:18px monospace;
}

/* BANNER */

.banner{
  height:105px;
  margin:18px 7px 9px;
  border-radius:8px;
  border:3px solid #17173c;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:
    radial-gradient(circle,#352083 0,#171747 45%,#08091f 100%);

  box-shadow:
    0 0 16px #00dff077,
    inset 0 0 25px #6d38cc88;
}

.banner span{
  font-size:25px;
  font-weight:900;
  color:#61fff4;
  text-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff;
}

/* MÁQUINA */

.machine{
  margin:0 5px;
  padding:7px;

  background:
    linear-gradient(
      90deg,
      #101736,
      #4c2076 25%,
      #20266b 50%,
      #4c2076 75%,
      #101736
    );

  border-radius:12px 12px 4px 4px;

  box-shadow:
    0 0 25px #3927a855;
}

/* ROLOS */

.reels{
  height:475px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;

  overflow:hidden;

  background:#0b1026;

  border:4px solid #080b1c;
  border-radius:7px;

  box-shadow:
    inset 0 0 20px #000;
}

.reel{
  overflow:hidden;

  background:#b9d59f;

  border-right:3px solid #35435a;
}

.strip{
  transition:
    transform 1.1s cubic-bezier(.12,.78,.18,1);
}

/* SÍMBOLOS */

.symbol{
  height:157px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      #e8f2d8,
      #b5d69b 70%,
      #86ad74
    );

  border-bottom:4px solid #566a5b;
}

.five{
  font-family:Georgia,serif;
  font-size:72px;
  font-weight:bold;

  color:#fff2d0;

  text-shadow:
    4px 4px #69343a,
    -2px -2px #9c6a2f;
}

.face{
  width:105px;
  height:105px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f0d29c;

  border:7px solid #f8e8bd;

  box-shadow:
    0 7px #557b49;

  font-size:56px;
}

.coin{
  width:116px;
  height:82px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#7fa86e;

  border:5px solid #e4edc8;

  color:#edf5d4;

  font-family:Georgia,serif;
  font-size:37px;

  text-shadow:3px 3px #48663d;
}

.x2{
  position:absolute;
  bottom:4px;

  font-size:40px;
  font-weight:bold;

  color:#dce8c3;

  text-shadow:
    3px 3px #3b4a30;
}

/* MENSAGEM */

.message{
  height:26px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#a8ff67;
  font-size:14px;
}

/* PAINEL */

.info{
  height:70px;

  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  align-items:center;

  background:
    linear-gradient(#101c3b,#091328);

  border:1px solid #2d4270;

  border-radius:17px;

  box-shadow:
    inset 0 0 15px #000;
}

.infoItem{
  text-align:center;
}

.infoSmall{
  display:block;
  color:#8796b4;
  font-size:9px;
  margin-bottom:5px;
}

.value{
  color:#aaff5d;
  font-size:20px;
  font-weight:bold;
}

/* BOTÕES */

.controls{
  height:150px;

  display:grid;

  grid-template-columns:
    58px
    58px
    1fr
    58px
    58px;

  gap:6px;

  align-items:center;

  padding:10px 3px 18px;
}

.btn{
  width:56px;
  height:56px;

  border-radius:50%;

  border:1px solid #445477;

  background:
    linear-gradient(#314064,#111a32);

  color:white;

  font-size:27px;

  box-shadow:
    0 4px 8px #0008;
}

.spin{
  width:112px;
  height:112px;

  justify-self:center;

  border-radius:50%;

  border:7px solid #25eaf1;

  background:
    radial-gradient(
      circle,
      #173d47,
      #07121d 70%
    );

  color:#62fff6;

  font-size:43px;

  box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;
}

.btn:active,
.spin:active{
  transform:scale(.92);
}

.notice{
  text-align:center;
  color:#667799;
  font-size:10px;
  padding:4px 5px 20px;
}
</style>
</head>

<body>

<div class="game">

  <div class="top">
    <div class="home">⌂</div>
    <div class="name">Lobby Mania</div>
    <div class="clock" id="clock">03:27:59</div>
  </div>

  <div class="banner">
    <span>» Nova rodada é de empurrar! «</span>
  </div>

  <div class="machine">

    <div class="reels">

      <div class="reel">
        <div class="strip" id="reel1"></div>
      </div>

      <div class="reel">
        <div class="strip" id="reel2"></div>
      </div>

      <div class="reel">
        <div class="strip" id="reel3"></div>
      </div>

    </div>

    <div class="message" id="message">
      Pronto para jogar
    </div>

    <div class="info">

      <div class="infoItem">
        👤
      </div>

      <div class="infoItem">
        <span class="infoSmall">SALDO DEMO</span>
        <span class="value" id="balance">R$0,03</span>
      </div>

      <div class="infoItem">
        <span class="infoSmall">APOSTA</span>
        <span class="value" id="bet">R$0,50</span>
      </div>

    </div>

    <div class="controls">

      <button class="btn" onclick="sound()">🔇</button>

      <button class="btn" onclick="minus()">−</button>

      <button class="spin" onclick="spin()">★</button>

      <button class="btn" onclick="plus()">+</button>

      <button class="btn" onclick="spin()">▶</button>

    </div>

  </div>

  <div class="notice">
    Jogo demonstrativo com créditos fictícios.
  </div>

</div>

<script>

const symbols = [

  `<div class="symbol">
     <div class="five">5</div>
   </div>`,

  `<div class="symbol">
     <div class="face">🙂</div>
     <div class="x2">×2</div>
   </div>`,

  `<div class="symbol">
     <div class="coin">0,05</div>
   </div>`,

  `<div class="symbol">
     <div class="five">5</div>
   </div>`,

  `<div class="symbol">
     <div class="face">😄</div>
     <div class="x2">×2</div>
   </div>`,

  `<div class="symbol">
     <div class="coin">0,05</div>
   </div>`

];

const reels = [
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
];

let balance = 0.03;
let bet = 0.50;
let spinning = false;

function buildReels(){

  reels.forEach((reel,col)=>{

    let html = "";

    for(let i=0;i<25;i++){

      html += symbols[
        (i + col * 2) % symbols.length
      ];

    }

    reel.innerHTML = html;

  });

}

function update(){

  document.getElementById("balance").textContent =
    "R$" + balance.toFixed(2).replace(".",",");

  document.getElementById("bet").textContent =
    "R$" + bet.toFixed(2).replace(".",",");

}

function spin(){

  if(spinning) return;

  spinning = true;

  document.getElementById("message").textContent =
    "Girando...";

  reels.forEach((reel,index)=>{

    const distance =
      -(Math.floor(Math.random()*10)+10) * 157;

    reel.style.transition =
      "transform " +
      (0.9 + index * 0.25) +
      "s cubic-bezier(.12,.78,.18,1)";

    reel.style.transform =
      "translateY(" + distance + "px)";

  });

  setTimeout(()=>{

    const win = Math.random() < 0.20;

    if(win){

      balance += bet * 2;

      document.getElementById("message").textContent =
        "Você ganhou!";

    }else{

      document.getElementById("message").textContent =
        "Nova rodada";

    }

    update();

    spinning = false;

  },1500);

}

function plus(){

  bet = Math.min(5,bet + 0.50);

  update();

}

function minus(){

  bet = Math.max(0.50,bet - 0.50);

  update();

}

function sound(){

  document.getElementById("message").textContent =
    "Som alternado";

}

let seconds = 3*3600 + 27*60 + 59;

setInterval(()=>{

  seconds++;

  const h = Math.floor(seconds/3600) % 24;
  const m = Math.floor((seconds%3600)/60);
  const s = seconds % 60;

  document.getElementById("clock").textContent =
    [h,m,s]
      .map(n => String(n).padStart(2,"0"))
      .join(":");

},1000);

buildReels();
update();

</script>

</body>
</html>
