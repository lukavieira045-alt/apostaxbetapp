<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lobby Mania</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020611;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.game{
    width:100%;
    max-width:660px;
    min-height:100vh;
    margin:auto;
    background:
        radial-gradient(circle at 50% 15%,#1854a5 0%,#081b46 35%,#020611 80%);
}

/* TOPO */

.top{
    height:65px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(#0d2a63,#07152f);
    border-bottom:2px solid #31549a;
}

.home{
    font-size:30px;
}

.title{
    font-size:18px;
    color:#eee;
}

.clock{
    font-family:monospace;
    font-size:18px;
}

/* BANNER */

.banner{
    margin:25px 5px 15px;
    height:125px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        linear-gradient(#171744,#080824);

    border:3px solid #181638;
    border-radius:8px;

    box-shadow:
        0 0 20px #00eaff88,
        inset 0 0 30px #5428b888;
}

.banner span{
    color:#5afff5;
    font-size:27px;
    font-weight:900;
    text-shadow:0 0 10px #00ffff;
}

/* MÁQUINA */

.machine{
    margin:0 5px;
    padding:7px;

    background:
        linear-gradient(
            90deg,
            #10183b,
            #52227e,
            #151c46,
            #52227e,
            #10183b
        );

    border-radius:12px 12px 0 0;
}

.reels{
    height:500px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;

    overflow:hidden;

    background:#11162c;
    border:4px solid #080c20;
    border-radius:8px;
}

.reel{
    overflow:hidden;
    background:#b8d29e;
    border-right:3px solid #34415b;
}

.strip{
    transition:
        transform 1.1s cubic-bezier(.12,.78,.18,1);
}

.symbol{
    height:165px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            #e4f1d4,
            #b1d497 70%,
            #83aa70
        );

    border-bottom:4px solid #52665b;
}

/* SÍMBOLO 5 */

.five{
    font-family:Georgia,serif;
    font-size:75px;
    font-weight:bold;

    color:#fff2d0;

    text-shadow:
        4px 4px #693238,
        -2px -2px #9a692e;
}

/* MOEDA */

.coin{
    width:120px;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#83aa70;

    border:5px solid #e2edc5;

    color:#eef4d5;

    font-family:Georgia,serif;
    font-size:39px;

    text-shadow:3px 3px #48653f;
}

/* PERSONAGEM */

.face{
    width:112px;
    height:112px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f0d19b;

    border:7px solid #f7e5bb;

    box-shadow:
        0 7px #547848;

    font-size:60px;
}

.x2{
    position:absolute;
    bottom:5px;

    font-size:42px;
    font-weight:bold;

    color:#dce8c4;

    text-shadow:
        3px 3px #39492d;
}

/* INFORMAÇÕES */

.info{
    height:72px;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;

    align-items:center;

    background:#0b1730;

    border:1px solid #283b66;

    border-radius:18px;

    margin-top:7px;
}

.info-item{
    text-align:center;
}

.info-small{
    display:block;
    color:#91a1c0;
    font-size:10px;
    margin-bottom:5px;
}

.green{
    color:#a8ff5b;
    font-size:20px;
}

/* CONTROLES */

.controls{
    display:grid;

    grid-template-columns:
        60px
        60px
        1fr
        60px
        60px;

    align-items:center;
    gap:7px;

    padding:15px 4px 25px;
}

.btn{
    width:58px;
    height:58px;

    border:0;
    border-radius:50%;

    background:
        linear-gradient(#2b3d68,#111a34);

    color:white;

    font-size:28px;
}

.spin{
    width:120px;
    height:120px;

    justify-self:center;

    border-radius:50%;

    border:7px solid #20eaf1;

    background:
        radial-gradient(
            circle,
            #153b44,
            #07121d
        );

    color:#5ffff6;

    font-size:42px;

    box-shadow:
        0 0 25px #00eaff,
        inset 0 0 25px #00eaff55;
}

.btn:active,
.spin:active{
    transform:scale(.93);
}

/* MENSAGEM */

.message{
    height:25px;

    text-align:center;

    color:#a7ff68;

    font-size:15px;
}

/* AVISO */

.notice{
    text-align:center;

    color:#68789b;

    font-size:10px;

    padding:10px 5px 25px;
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <div class="home">⌂</div>

        <div class="title">
            Lobby Mania
        </div>

        <div class="clock" id="clock">
            03:27:59
        </div>
    </div>


    <div class="banner">
        <span>
            » Nova rodada é de empurrar! «
        </span>
    </div>


    <div class="machine">

        <div class="reels">

            <div class="reel">
                <div class="strip" id="reel1"></div>
            </div>

            <div class="reel">
                <div class="strip" id="reel2"></div>
            </div>

            <div class="reel">
                <div class="strip" id="reel3"></div>
            </div>

        </div>


        <div class="message" id="message">
            Pronto para jogar
        </div>


        <div class="info">

            <div class="info-item">
                👤
            </div>

            <div class="info-item">
                <span class="info-small">
                    SALDO DEMO
                </span>

                <span class="green" id="balance">
                    R$0,03
                </span>
            </div>

            <div class="info-item">
                <span class="info-small">
                    APOSTA
                </span>

                <span class="green" id="bet">
                    R$0,50
                </span>
            </div>

        </div>


        <div class="controls">

            <button class="btn" onclick="sound()">
                🔇
            </button>

            <button class="btn" onclick="minus()">
                −
            </button>

            <button class="spin" onclick="spin()">
                ★
            </button>

            <button class="btn" onclick="plus()">
                +
            </button>

            <button class="btn" onclick="autoSpin()">
                ▶
            </button>

        </div>

    </div>


    <div class="notice">
        Jogo demonstrativo com créditos fictícios.
    </div>

</div>


<script>

const symbols = [

    `
    <div class="symbol">
        <div class="five">5</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="face">🙂</div>
        <div class="x2">×2</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="coin">0,05</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="five">5</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="face">😄</div>
        <div class="x2">×2</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="coin">0,05</div>
    </div>
    `
];


const reels = [
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];


let balance = 0.03;
let bet = 0.50;
let spinning = false;


function createReels(){

    reels.forEach((reel,column)=>{

        let html = "";

        for(let i=0;i<20;i++){

            html += symbols[
                (i + column * 2) % symbols.length
            ];

        }

        reel.innerHTML = html;

    });

}


function update(){

    document.getElementById("balance").textContent =
        "R$" + balance.toFixed(2).replace(".",",");

    document.getElementById("bet").textContent =
        "R$" + bet.toFixed(2).replace(".",",");

}


function spin(){

    if(spinning){
        return;
    }

    spinning = true;

    document.getElementById("message").textContent =
        "Girando...";


    reels.forEach((reel,index)=>{

        const position =
            -(Math.floor(Math.random()*8)+8) * 165;

        reel.style.transition =
            "transform " +
            (0.9 + index * 0.25) +
            "s cubic-bezier(.12,.78,.18,1)";

        reel.style.transform =
            "translateY(" + position + "px)";

    });


    setTimeout(()=>{

        const win = Math.random() < 0.20;

        if(win){

            balance += bet * 2;

            document.getElementById("message").textContent =
                "Você ganhou!";

        }else{

            document.getElementById("message").textContent =
                "Nova rodada";

        }

        update();

        spinning = false;

    },1500);

}


function plus(){

    bet = Math.min(
        5,
        bet + 0.50
    );

    update();

}


function minus(){

    bet = Math.max(
        0.50,
        bet - 0.50
    );

    update();

}


function autoSpin(){

    if(!spinning){
        spin();
    }

}


function sound(){

    document.getElementById("message").textContent =
        "Som alternado";

}


let seconds =
    3 * 3600 +
    27 * 60 +
    59;


setInterval(()=>{

    seconds++;

    const h =
        Math.floor(seconds / 3600) % 24;

    const m =
        Math.floor((seconds % 3600) / 60);

    const s =
        seconds % 60;

    document.getElementById("clock").textContent =
        [h,m,s]
        .map(n => String(n).padStart(2,"0"))
        .join(":");

},1000);


createReels();
update();

</script>

</body>
</html>
