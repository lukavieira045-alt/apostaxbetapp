<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lobby Mania - Real</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030b;
    font-family:Arial,sans-serif
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden
}

.game{
    width:100%;
    max-width:650px;
    min-height:100vh;
    background:
    radial-gradient(
        circle at 50% 22%,
        #245da9 0,
        #102d68 28%,
        #070d29 55%,
        #02030b 100%
    );
    color:white;
    position:relative;
    overflow:hidden
}

.top{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    background:linear-gradient(#101d49,#071127);
    border-bottom:2px solid #345a9e
}

.top .home{
    font-size:29px
}

.top .name{
    font-size:18px;
    font-weight:bold;
    color:#eee
}

.clock{
    font:18px monospace
}

.banner{
    height:105px;
    margin:18px 7px 9px;
    border-radius:8px;
    border:3px solid #17173c;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
    radial-gradient(
        circle,
        #352083 0,
        #171747 45%,
        #08091f 100%
    );
    box-shadow:
    0 0 16px #00dff077,
    inset 0 0 25px #6d38cc88
}

.banner span{
    font-size:25px;
    font-weight:900;
    color:#61fff4;
    text-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff
}

.machine{
    margin:0 5px;
    padding:7px;
    background:
    linear-gradient(
        90deg,
        #101736,
        #4c2076 25%,
        #20266b 50%,
        #4c2076 75%,
        #101736
    );
    border-radius:12px 12px 4px 4px;
    box-shadow:0 0 25px #3927a855
}

.reels{
    height:475px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    overflow:hidden;
    background:#0b1026;
    border:4px solid #080b1c;
    border-radius:7px;
    box-shadow:inset 0 0 20px #000
}

.reel{
    overflow:hidden;
    background:#b9d59f;
    border-right:3px solid #35435a
}

.strip{
    will-change:transform;
}

.symbol{
    height:157px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    linear-gradient(
        #e8f2d8,
        #b5d69b 70%,
        #86ad74
    );
    border-bottom:4px solid #566a5b
}

.five{
    font-family:Georgia,serif;
    font-size:72px;
    font-weight:bold;
    color:#fff2d0;
    text-shadow:
    4px 4px #69343a,
    -2px -2px #9c6a2f
}

.face{
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f0d29c;
    border:7px solid #f8e8bd;
    box-shadow:0 7px #557b49;
    font-size:56px
}

.coin{
    width:116px;
    height:82px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#7fa86e;
    border:5px solid #e4edc8;
    color:#edf5d4;
    font-family:Georgia,serif;
    font-size:37px;
    text-shadow:3px 3px #48663d
}

.x2{
    position:absolute;
    bottom:4px;
    font-size:40px;
    font-weight:bold;
    color:#dce8c3;
    text-shadow:3px 3px #3b4a30
}

.message{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a8ff67;
    font-size:14px;
    font-weight:bold
}

.info{
    height:70px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    background:
    linear-gradient(#101c3b,#091328);
    border:1px solid #2d4270;
    border-radius:17px;
    box-shadow:inset 0 0 15px #000
}

.infoItem{
    text-align:center
}

.infoSmall{
    display:block;
    color:#8796b4;
    font-size:9px;
    margin-bottom:5px
}

.value{
    color:#aaff5d !important;
    font-size:20px;
    font-weight:bold;
    transition:transform .25s ease
}

#balance.atualizando{
    transform:scale(1.12);
    color:#fff36b !important
}

.controls{
    min-height:150px;
    display:grid;
    grid-template-columns:58px 58px 1fr 58px 58px;
    gap:6px;
    align-items:center;
    padding:10px 3px 18px
}

.btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid #445477;
    background:
    linear-gradient(#314064,#111a32);
    color:white;
    font-size:27px;
    box-shadow:0 4px 8px #0008;
    cursor:pointer
}

.spin{
    width:112px;
    height:112px;
    justify-self:center;
    border-radius:50%;
    border:7px solid #25eaf1;
    background:
    radial-gradient(
        circle,
        #173d47,
        #07121d 70%
    );
    color:#62fff6;
    font-size:43px;
    box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;
    cursor:pointer
}

.btn:active,
.spin:active{
    transform:scale(.92)
}

.btn:disabled,
.spin:disabled{
    opacity:.45;
    cursor:not-allowed
}

.notice{
    text-align:center;
    color:#667799;
    font-size:10px;
    padding:4px 5px 20px
}

@media(max-width:380px){

    .reels{
        height:390px
    }

    .symbol{
        height:130px
    }

    .controls{
        grid-template-columns:
        48px 48px 1fr 48px 48px
    }

    .btn{
        width:48px;
        height:48px;
        font-size:23px
    }

    .spin{
        width:92px;
        height:92px;
        font-size:36px
    }
}

</style>
</head>

<body>

<div class="game">

    <div class="top">

        <div
            class="home"
            onclick="window.location.href='index.html'"
        ></div>

        <div class="name">
            Lobby Mania
        </div>

        <div
            class="clock"
            id="clock"
        >
            00:00:00
        </div>

    </div>


    <div class="banner">
        <span>
            » Aposta Real Ativada! «
        </span>
    </div>


    <div class="machine">

        <div class="reels">

            <div class="reel">
                <div
                    class="strip"
                    id="reel1"
                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel2"
                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel3"
                ></div>
            </div>

        </div>


        <div
            class="message"
            id="message"
        >
            Iniciando...
        </div>


        <div class="info">

            <div class="infoItem"></div>

            <div class="infoItem">

                <span class="infoSmall">
                    SALDO
                </span>

                <span
                    class="value"
                    id="balance"
                >
                    R$0,00
                </span>

            </div>

            <div class="infoItem">

                <span class="infoSmall">
                    APOSTA
                </span>

                <span
                    class="value"
                    id="bet"
                >
                    R$0,50
                </span>

            </div>

        </div>


        <div class="controls">

            <!-- BOTÃO SOM -->
            <button
                class="btn"
                type="button"
                id="soundButton"
                onclick="sound()"
            >
                🔊
            </button>


            <button
                class="btn"
                type="button"
                onclick="minus()"
            >
                −
            </button>


            <button
                class="spin"
                id="spinButton"
                type="button"
                onclick="spin()"
            >
                ★
            </button>


            <button
                class="btn"
                type="button"
                onclick="plus()"
            >
                +
            </button>


            <button
                class="btn"
                type="button"
                onclick="spin()"
            >
                ▶
            </button>

        </div>

    </div>


    <div class="notice">
        Jogo integrado ao sistema financeiro real.
    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';


let supabaseClient = null;

let sistemaOnline = false;


try{

    if(window.supabase){

        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        sistemaOnline = true;

    }

}catch(e){

    console.error(
        "Erro Supabase:",
        e
    );

}


/* =====================================================
   SISTEMA DE SALDO
===================================================== */

window.SistemaSaldo = {

    saldoLocal:0,


    async get(){

        if(!sistemaOnline){

            return this.saldoLocal;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                throw new Error(
                    'Sem sessão'
                );

            }


            const {data:saldoData,error} =
            await supabaseClient

                .from('saldos')

                .select('valor')

                .eq(
                    'user_id',
                    data.session.user.id
                )

                .single();


            if(error){

                throw error;

            }


            this.saldoLocal =
            Number(
                saldoData?.valor || 0
            );


            return this.saldoLocal;


        }catch(e){

            console.warn(
                "Falha ao buscar saldo real:",
                e
            );


            return this.saldoLocal;

        }

    },


    async debitar(valor){

        this.saldoLocal -= valor;


        if(!sistemaOnline){

            return;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                return;

            }


            await supabaseClient.rpc(
                'debitar_saldo',
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );


        }catch(e){

            console.warn(
                "Débito local realizado:",
                e
            );

        }

    },


    async creditar(valor){

        this.saldoLocal += valor;


        if(!sistemaOnline){

            return;

        }


        try{

            const {data} =
            await supabaseClient.auth.getSession();


            if(!data?.session){

                return;

            }


            await supabaseClient.rpc(
                'creditar_saldo',
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    valor
                }
            );


        }catch(e){

            console.warn(
                "Crédito local realizado:",
                e
            );

        }

    },


    async atualizarTela(){

        const saldo =
        await this.get();


        const el =
        document.getElementById(
            'balance'
        );


        el.textContent =
        dinheiro(saldo);


        el.style.color =
        '#aaff5d';


        return saldo;

    }

};


/* =====================================================
   SÍMBOLOS ORIGINAIS
===================================================== */

const symbols = [

    `<div class="symbol">
        <div class="five">5</div>
    </div>`,

    `<div class="symbol">
        <div class="face">🙂</div>
        <div class="x2">×2</div>
    </div>`,

    `<div class="symbol">
        <div class="coin">0,05</div>
    </div>`,

    `<div class="symbol">
        <div class="five">5</div>
    </div>`,

    `<div class="symbol">
        <div class="face">😄</div>
        <div class="x2">×2</div>
    </div>`,

    `<div class="symbol">
        <div class="coin">0,05</div>
    </div>`

];


const reels = [

    document.getElementById(
        "reel1"
    ),

    document.getElementById(
        "reel2"
    ),

    document.getElementById(
        "reel3"
    )

];


const messageEl =
document.getElementById(
    "message"
);


const balanceEl =
document.getElementById(
    "balance"
);


const betEl =
document.getElementById(
    "bet"
);


const spinBtn =
document.getElementById(
    "spinButton"
);


const soundButton =
document.getElementById(
    "soundButton"
);


let bet = 0.50;

let spinning = false;


/* =====================================================
   SOM
===================================================== */

let somLigado = true;

let audioContext = null;

let somInterval = null;


function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


function tocarSom(
    frequencia,
    duracao=0.06,
    volume=0.035
){

    if(!somLigado){

        return;

    }


    iniciarAudio();


    const osc =
    audioContext.createOscillator();


    const gain =
    audioContext.createGain();


    osc.type =
    "square";


    osc.frequency.value =
    frequencia;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duracao
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start();

    osc.stop(
        audioContext.currentTime +
        duracao
    );

}


function somGiro(){

    if(!somLigado){

        return;

    }


    if(somInterval){

        clearInterval(
            somInterval
        );

    }


    let contador = 0;


    somInterval =
    setInterval(
        () => {

            if(
                !spinning ||
                !somLigado
            ){

                clearInterval(
                    somInterval
                );

                somInterval = null;

                return;

            }


            tocarSom(
                contador % 2 === 0
                ? 700
                : 520,
                0.045,
                0.025
            );


            contador++;

        },
        105
    );

}


function pararSomGiro(){

    if(somInterval){

        clearInterval(
            somInterval
        );

        somInterval = null;

    }

}


function som(){

    somLigado =
    !somLigado;


    if(somLigado){

        soundButton.textContent =
        "🔊";

        messageEl.textContent =
        spinning
        ? "🔊 Som ligado"
        : "🔊 Som ligado";

        tocarSom(
            850,
            0.08,
            0.04
        );


        if(spinning){

            somGiro();

        }

    }else{

        soundButton.textContent =
        "🔇";

        pararSomGiro();

        messageEl.textContent =
        "🔇 Som desligado";

    }

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(v){

    return "R$" +
    Number(v)
    .toFixed(2)
    .replace(
        ".",
        ","
    );

}


/* =====================================================
   REELS
===================================================== */

function buildReels(){

    reels.forEach(
        (reel,col) => {

            let html = "";


            /*
            Muitas repetições para permitir
            um giro contínuo e suave.
            */

            for(
                let i=0;
                i<70;
                i++
            ){

                html +=
                symbols[
                    (i + col * 2) %
                    symbols.length
                ];

            }


            reel.innerHTML =
            html;

        }
    );

}


/* =====================================================
   APOSTA
===================================================== */

function atualizarAposta(){

    betEl.textContent =
    dinheiro(bet);


    betEl.style.color =
    '#aaff5d';

}


function plus(){

    if(spinning){

        return;

    }


    bet =
    Math.min(
        5,
        Number(
            (
                bet + 0.50
            ).toFixed(2)
        )
    );


    atualizarAposta();

    tocarSom(
        760,
        0.06,
        0.035
    );

}


function minus(){

    if(spinning){

        return;

    }


    bet =
    Math.max(
        0.50,
        Number(
            (
                bet - 0.50
            ).toFixed(2)
        )
    );


    atualizarAposta();

    tocarSom(
        520,
        0.06,
        0.035
    );

}


/* =====================================================
   RELÓGIO
===================================================== */

let segundos = 0;


function updateClock(){

    setInterval(
        () => {

            segundos++;


            const h =
            Math.floor(
                segundos / 3600
            ) % 24;


            const m =
            Math.floor(
                (segundos % 3600) /
                60
            );


            const s =
            segundos % 60;


            document
            .getElementById(
                "clock"
            )
            .textContent =

            [
                h,
                m,
                s
            ]
            .map(
                n =>
                String(n)
                .padStart(2,"0")
            )
            .join(":");

        },
        1000
    );

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function init(){

    buildReels();

    atualizarAposta();

    updateClock();

    await
    window.SistemaSaldo
    .atualizarTela();


    messageEl.textContent =
    "Pronto para jogar";


    messageEl.style.color =
    "#a8ff67";

}


/* =====================================================
   GIRO
===================================================== */

async function spin(){

    if(spinning){

        return;

    }


    iniciarAudio();


    const saldoAtual =
    await
    window.SistemaSaldo.get();


    if(saldoAtual < bet){

        messageEl.textContent =
        "❌ Saldo insuficiente";


        messageEl.style.color =
        "#ff4d4d";


        tocarSom(
            180,
            0.18,
            0.05
        );


        return;

    }


    spinning = true;

    spinBtn.disabled = true;


    messageEl.textContent =
    "🎰 Girando...";


    messageEl.style.color =
    "#61fff4";


    /*
    SOM DO GIRO
    */

    somGiro();


    /*
    DEBITA
    */

    await
    window.SistemaSaldo
    .debitar(bet);


    await
    window.SistemaSaldo
    .atualizarTela();


    /*
    =================================================
    GIRO NOVO
    MAIS RÁPIDO E MAIS LEVE
    =================================================
    */

    const resultados = [];


    reels.forEach(
        (reel,index) => {

            /*
            Remove animação anterior.
            */

            reel.style.transition =
            "none";

            reel.style.transform =
            "translateY(0)";


            void reel.offsetHeight;


            /*
            Quantidade de voltas.
            */

            const voltas =
            9 +
            Math.floor(
                Math.random() * 4
            );


            /*
            Cada rolo para em
            uma posição diferente.
            */

            const extra =
            index * 2;


            const casas =
            voltas *
            symbols.length +
            extra;


            const distancia =
            -(
                casas * 157
            );


            /*
            Giro leve.
            */

            const duracao =
            0.95 +
            index * 0.16;


            /*
            Efeito de caça-níqueis:
            rápido no início,
            desaceleração suave.
            */

            reel.style.transition =
            `transform ${duracao}s cubic-bezier(.15,.72,.25,1)`;


            reel.style.transform =
            `translate3d(0,${distancia}px,0)`;


            resultados.push({
                duracao:duracao
            });

        }
    );


    /*
    =================================================
    RESULTADO
    =================================================
    */

    const tempoFinal =
    1150;


    setTimeout(
        async () => {

            pararSomGiro();


            /*
            Som de parada
            */

            tocarSom(
                900,
                0.07,
                0.045
            );


            setTimeout(
                () => {

                    tocarSom(
                        1100,
                        0.10,
                        0.045
                    );

                },
                90
            );


            /*
            RESULTADO
            */

            const ganhou =
            Math.random() > 0.6;


            let ganhoValor = 0;


            if(ganhou){

                ganhoValor =
                bet *
                (
                    Math.floor(
                        Math.random() * 5
                    ) + 2
                );


                await
                window.SistemaSaldo
                .creditar(
                    ganhoValor
                );


                messageEl.textContent =
                `✅ Ganhou ${dinheiro(
                    ganhoValor
                )}!`;


                messageEl.style.color =
                "#aaff5d";


                tocarSom(
                    950,
                    0.08,
                    0.045
                );


            }else{

                messageEl.textContent =
                "Não foi desta vez.";


                messageEl.style.color =
                "#ff7b7b";


                tocarSom(
                    300,
                    0.12,
                    0.04
                );

            }


            await
            window.SistemaSaldo
            .atualizarTela();


            spinning = false;

            spinBtn.disabled =
            false;


        },
        tempoFinal
    );

}


/* =====================================================
   INICIA
===================================================== */

init();

</script>

</body>
</html>
