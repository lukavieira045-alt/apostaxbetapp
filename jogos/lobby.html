<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lobby Mania - ApostaXBet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030b;
    font-family:Arial,sans-serif
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden
}

.game{
    width:100%;
    max-width:650px;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 22%,#245da9 0,#102d68 28%,#070d29 55%,#02030b 100%);
    color:white;
    position:relative;
    overflow:hidden
}

.top{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    background:linear-gradient(#101d49,#071127);
    border-bottom:2px solid #345a9e
}

.top .home{
    font-size:29px;
    cursor:pointer
}

.top .name{
    font-size:18px;
    font-weight:bold;
    color:#eee
}

.clock{
    font:18px monospace
}

.banner{
    height:105px;
    margin:18px 7px 9px;
    border-radius:8px;
    border:3px solid #17173c;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle,#352083 0,#171747 45%,#08091f 100%);
    box-shadow:
        0 0 16px #00dff077,
        inset 0 0 25px #6d38cc88
}

.banner span{
    font-size:25px;
    font-weight:900;
    color:#61fff4;
    text-shadow:
        0 0 6px #00ffff,
        0 0 15px #00ffff
}

.machine{
    margin:0 5px;
    padding:7px;
    background:
        linear-gradient(
            90deg,
            #101736,
            #4c2076 25%,
            #20266b 50%,
            #4c2076 75%,
            #101736
        );
    border-radius:12px 12px 4px 4px;
    box-shadow:0 0 25px #3927a855
}

.reels{
    height:475px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    overflow:hidden;
    background:#0b1026;
    border:4px solid #080b1c;
    border-radius:7px;
    box-shadow:inset 0 0 20px #000
}

.reel{
    overflow:hidden;
    background:#b9d59f;
    border-right:3px solid #35435a;
    position:relative
}

.strip{
    transform:translateY(0);
    will-change:transform
}

.symbol{
    height:157px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(#e8f2d8,#b5d69b 70%,#86ad74);
    border-bottom:4px solid #566a5b
}

.five{
    font-family:Georgia,serif;
    font-size:72px;
    font-weight:bold;
    color:#fff2d0;
    text-shadow:
        4px 4px #69343a,
        -2px -2px #9c6a2f
}

/* NOVOS SÍMBOLOS ANIMADOS */
.gema{
    width:82px;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:63px;
    filter:
        drop-shadow(0 0 5px #00ffff)
        drop-shadow(0 0 12px #008cff);
    animation:brilhoGema 1.2s ease-in-out infinite alternate
}

@keyframes brilhoGema{
    from{
        transform:scale(.94);
        filter:
            drop-shadow(0 0 5px #00ffff)
            drop-shadow(0 0 10px #008cff)
    }
    to{
        transform:scale(1.05);
        filter:
            drop-shadow(0 0 10px #ffffff)
            drop-shadow(0 0 22px #00ffff)
    }
}

.moeda{
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fffbd0,
            #ffe600 25%,
            #ff9d00 65%,
            #b95a00
        );
    border:7px solid #fff0a0;
    color:#fff;
    font-size:47px;
    font-weight:900;
    text-shadow:
        2px 2px #8b4d00,
        0 0 10px #fff;
    box-shadow:
        0 6px 0 #704000,
        0 0 18px #ffd000,
        inset 0 0 12px #fff5a0;
    animation:girarMoeda 1.5s linear infinite
}

@keyframes girarMoeda{
    0%{
        transform:rotateY(0deg)
    }
    50%{
        transform:rotateY(180deg)
    }
    100%{
        transform:rotateY(360deg)
    }
}

.raio{
    font-size:78px;
    color:#fff700;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffff00,
        0 0 30px #ff7b00;
    animation:raioPulse .8s infinite alternate
}

@keyframes raioPulse{
    from{
        transform:scale(.92) rotate(-4deg);
        opacity:.85
    }
    to{
        transform:scale(1.08) rotate(4deg);
        opacity:1
    }
}

.coroa{
    font-size:75px;
    filter:
        drop-shadow(0 0 8px #ffd700)
        drop-shadow(0 0 18px #ff8c00);
    animation:coroaPulse 1s infinite alternate
}

@keyframes coroaPulse{
    from{
        transform:translateY(2px) scale(.96)
    }
    to{
        transform:translateY(-4px) scale(1.06)
    }
}

.x2{
    position:absolute;
    bottom:4px;
    font-size:40px;
    font-weight:bold;
    color:#dce8c3;
    text-shadow:3px 3px #3b4a30
}

.message{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a8ff67;
    font-size:14px;
    font-weight:bold
}

.info{
    height:70px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    background:linear-gradient(#101c3b,#091328);
    border:1px solid #2d4270;
    border-radius:17px;
    box-shadow:inset 0 0 15px #000
}

.infoItem{
    text-align:center
}

.infoSmall{
    display:block;
    color:#8796b4;
    font-size:9px;
    margin-bottom:5px
}

.value{
    color:#aaff5d !important;
    font-size:20px;
    font-weight:bold;
    transition:transform .25s ease
}

.value.error,
.value.insufficient{
    color:#aaff5d !important
}

#balance.atualizando{
    transform:scale(1.12);
    color:#fff36b !important
}

.controls{
    min-height:150px;
    display:grid;
    grid-template-columns:58px 58px 1fr 58px 58px;
    gap:6px;
    align-items:center;
    padding:10px 3px 18px
}

.btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid #445477;
    background:linear-gradient(#314064,#111a32);
    color:white;
    font-size:27px;
    box-shadow:0 4px 8px #0008;
    cursor:pointer
}

.spin{
    width:112px;
    height:112px;
    justify-self:center;
    border-radius:50%;
    border:7px solid #25eaf1;
    background:
        radial-gradient(circle,#173d47,#07121d 70%);
    color:#62fff6;
    font-size:43px;
    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 22px #00eaff66;
    cursor:pointer
}

.btn:active,
.spin:active{
    transform:scale(.92)
}

.btn:disabled,
.spin:disabled{
    opacity:.45;
    cursor:not-allowed
}

.notice{
    text-align:center;
    color:#667799;
    font-size:10px;
    padding:4px 5px 20px
}

@media(max-width:380px){

    .reels{
        height:390px
    }

    .symbol{
        height:130px
    }

    .controls{
        grid-template-columns:48px 48px 1fr 48px 48px
    }

    .btn{
        width:48px;
        height:48px;
        font-size:23px
    }

    .spin{
        width:92px;
        height:92px;
        font-size:36px
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <div class="home" onclick="window.location.href='index.html'">⌂</div>
        <div class="name">Lobby Mania</div>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="banner">
        <span>» Aposta Real Ativada! «</span>
    </div>

    <div class="machine">

        <div class="reels">

            <div class="reel">
                <div class="strip" id="reel1"></div>
            </div>

            <div class="reel">
                <div class="strip" id="reel2"></div>
            </div>

            <div class="reel">
                <div class="strip" id="reel3"></div>
            </div>

        </div>

        <div class="message" id="message">
            Iniciando...
        </div>

        <div class="info">

            <div class="infoItem"></div>

            <div class="infoItem">
                <span class="infoSmall">SALDO</span>
                <span class="value" id="balance">
                    R$0,00
                </span>
            </div>

            <div class="infoItem">
                <span class="infoSmall">APOSTA</span>
                <span class="value" id="bet">
                    R$0,50
                </span>
            </div>

        </div>

        <div class="controls">

            <button
                class="btn"
                id="soundButton"
                type="button"
                onclick="sound()">
                🔊
            </button>

            <button
                class="btn"
                type="button"
                onclick="minus()">
                −
            </button>

            <button
                class="spin"
                id="spinButton"
                type="button"
                onclick="spin()">
                ★
            </button>

            <button
                class="btn"
                type="button"
                onclick="plus()">
                +
            </button>

            <button
                class="btn"
                type="button"
                onclick="spin()">
                ▶
            </button>

        </div>

    </div>

    <div class="notice">
        Jogo integrado ao sistema financeiro real.
    </div>

</div>

<script>

/* =====================================================
   SUPABASE / SALDO
===================================================== */

const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';

let supabaseClient = null;
let sistemaOnline = false;

try{

    if(window.supabase){

        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        sistemaOnline = true;

    }

}catch(e){

    console.error(
        "Erro Supabase:",
        e
    );

}


/* =====================================================
   SISTEMA DE SALDO
===================================================== */

window.SistemaSaldo = {

    saldoLocal:0,

    async get(){

        if(!sistemaOnline)
            return this.saldoLocal;

        try{

            const {data} =
            await supabaseClient.auth.getSession();

            if(!data?.session)
                throw new Error("Sem sessão");

            const {
                data:saldoData,
                error
            } =
            await supabaseClient
                .from("saldos")
                .select("valor")
                .eq(
                    "user_id",
                    data.session.user.id
                )
                .single();

            if(error)
                throw error;

            this.saldoLocal =
            Number(
                saldoData?.valor || 0
            );

            return this.saldoLocal;

        }catch(e){

            console.warn(
                "Falha ao buscar saldo:",
                e
            );

            return this.saldoLocal;

        }

    },

    async debitar(valor){

        this.saldoLocal -=
        Number(valor);

        if(!sistemaOnline)
            return;

        try{

            const {data} =
            await supabaseClient.auth.getSession();

            if(!data?.session)
                return;

            await supabaseClient.rpc(
                "debitar_saldo",
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    Number(valor)
                }
            );

        }catch(e){

            console.warn(
                "Débito sincronizado em segundo plano:",
                e
            );

        }

    },

    async creditar(valor){

        this.saldoLocal +=
        Number(valor);

        if(!sistemaOnline)
            return;

        try{

            const {data} =
            await supabaseClient.auth.getSession();

            if(!data?.session)
                return;

            await supabaseClient.rpc(
                "creditar_saldo",
                {
                    p_user_id:
                    data.session.user.id,

                    p_valor:
                    Number(valor)
                }
            );

        }catch(e){

            console.warn(
                "Crédito sincronizado em segundo plano:",
                e
            );

        }

    },

    async atualizarTela(){

        const saldo =
        await this.get();

        const el =
        document.getElementById(
            "balance"
        );

        if(el){

            el.textContent =
            dinheiro(saldo);

            el.style.color =
            "#aaff5d";

        }

        return saldo;

    }

};


/* =====================================================
   SÍMBOLOS
   SEM CARINHAS
===================================================== */

const symbols = [

    `<div class="symbol">
        <div class="gema">💎</div>
    </div>`,

    `<div class="symbol">
        <div class="moeda">★</div>
        <div class="x2">×2</div>
    </div>`,

    `<div class="symbol">
        <div class="raio">⚡</div>
    </div>`,

    `<div class="symbol">
        <div class="five">5</div>
    </div>`,

    `<div class="symbol">
        <div class="coroa">👑</div>
        <div class="x2">×2</div>
    </div>`,

    `<div class="symbol">
        <div class="moeda">★</div>
    </div>`

];


/* =====================================================
   ELEMENTOS
===================================================== */

const reels = [

    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")

];

const messageEl =
document.getElementById("message");

const balanceEl =
document.getElementById("balance");

const betEl =
document.getElementById("bet");

const spinBtn =
document.getElementById("spinButton");

const soundButton =
document.getElementById("soundButton");


let bet = 0.50;
let spinning = false;


/* =====================================================
   SOM
===================================================== */

let audioContext = null;
let somLigado = true;

function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


function beep(
    frequencia,
    duracao,
    tipo="square",
    volume=.035
){

    if(!somLigado)
        return;

    try{

        iniciarAudio();

        const osc =
        audioContext.createOscillator();

        const gain =
        audioContext.createGain();

        osc.type = tipo;

        osc.frequency.value =
        frequencia;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duracao
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();

        osc.stop(
            audioContext.currentTime +
            duracao
        );

    }catch(e){}

}


function somGiro(){

    if(!somLigado)
        return;

    iniciarAudio();

    let total = 0;

    const intervalo =
    setInterval(()=>{

        if(
            !spinning ||
            !somLigado
        ){

            clearInterval(
                intervalo
            );

            return;

        }

        beep(
            180 + Math.random()*90,
            .035,
            "square",
            .025
        );

        total++;

        if(total > 35){

            clearInterval(
                intervalo
            );

        }

    },75);

}


function somResultado(ganhou){

    if(!somLigado)
        return;

    if(ganhou){

        beep(520,.12,"sine",.05);

        setTimeout(
            ()=>beep(700,.15,"sine",.05),
            100
        );

        setTimeout(
            ()=>beep(900,.2,"sine",.05),
            220
        );

    }else{

        beep(180,.18,"sawtooth",.035);

    }

}


function somBotao(){

    beep(
        500,
        .06,
        "square",
        .04
    );

}


function sound(){

    somLigado =
    !somLigado;

    if(somLigado){

        soundButton.textContent =
        "🔊";

        messageEl.textContent =
        "🔊 Som ligado";

        somBotao();

    }else{

        soundButton.textContent =
        "🔇";

        messageEl.textContent =
        "🔇 Som desligado";

    }

}


/* =====================================================
   FORMATAR DINHEIRO
===================================================== */

function dinheiro(v){

    return "R$" +
    Number(v)
    .toFixed(2)
    .replace(".",",");

}


/* =====================================================
   CRIAR ROLOS
===================================================== */

function buildReels(){

    reels.forEach(
        (reel,col)=>{

            let html = "";

            /*
             * MAIS SÍMBOLOS PARA EVITAR
             * QUALQUER ÁREA VAZIA.
             */
            for(
                let i=0;
                i<80;
                i++
            ){

                const indice =
                (
                    i +
                    col * 2
                ) %
                symbols.length;

                html +=
                symbols[indice];

            }

            reel.innerHTML =
            html;

            reel.style.transform =
            "translateY(0)";

        }
    );

}


/* =====================================================
   APOSTA
===================================================== */

function atualizarAposta(){

    betEl.textContent =
    dinheiro(bet);

    betEl.style.color =
    "#aaff5d";

}


function plus(){

    if(spinning)
        return;

    somBotao();

    bet =
    Math.min(
        5,
        Number(
            (bet + .50)
            .toFixed(2)
        )
    );

    atualizarAposta();

}


function minus(){

    if(spinning)
        return;

    somBotao();

    bet =
    Math.max(
        .50,
        Number(
            (bet - .50)
            .toFixed(2)
        )
    );

    atualizarAposta();

}


/* =====================================================
   RELÓGIO
===================================================== */

let segundos = 0;

function updateClock(){

    setInterval(()=>{

        segundos++;

        const h =
        Math.floor(
            segundos / 3600
        ) % 24;

        const m =
        Math.floor(
            (segundos % 3600) /
            60
        );

        const s =
        segundos % 60;

        document.getElementById(
            "clock"
        ).textContent =

        [h,m,s]
        .map(
            n =>
            String(n)
            .padStart(2,"0")
        )
        .join(":");

    },1000);

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function init(){

    buildReels();

    atualizarAposta();

    updateClock();

    await window.SistemaSaldo
        .atualizarTela();

    messageEl.textContent =
    "Pronto para jogar";

    messageEl.style.color =
    "#a8ff67";

}


/* =====================================================
   GIRO
===================================================== */

async function spin(){

    if(spinning)
        return;

    iniciarAudio();

    somBotao();

    const saldoAtual =
    await window.SistemaSaldo
        .get();

    if(
        saldoAtual < bet
    ){

        messageEl.textContent =
        "❌ Saldo insuficiente";

        messageEl.style.color =
        "#ff4d4d";

        beep(
            130,
            .18,
            "sawtooth",
            .04
        );

        return;

    }


    spinning = true;

    spinBtn.disabled = true;

    messageEl.textContent =
    "🎰 Girando...";

    messageEl.style.color =
    "#61fff4";


    /*
     * DEBITA
     */

    await window.SistemaSaldo
        .debitar(bet);

    await window.SistemaSaldo
        .atualizarTela();


    /*
     * SOM DOS ROLOS
     */

    somGiro();


    /*
     * GIRO MAIS LEVE
     */

    reels.forEach(
        (reel,index)=>{

            reel.style.transition =
            "none";

            reel.style.transform =
            "translateY(0)";

            void reel.offsetHeight;


            /*
             * MUITO MAIS CASAS,
             * MAS VELOCIDADE MAIS LEVE.
             */

            const casas =
            20 +
            Math.floor(
                Math.random()*8
            );


            /*
             * CADA ROLO PARA
             * EM UM PONTO DIFERENTE.
             */

            const distance =
            -(
                casas *
                157
            );


            const duracao =
            1.05 +
            index * .18;


            reel.style.transition =
            `transform ${duracao}s cubic-bezier(.16,.72,.22,1)`;


            reel.style.transform =
            `translateY(${distance}px)`;

        }
    );


    /*
     * RESULTADO
     */

    setTimeout(
        async()=>{

            const ganhou =
            Math.random() > .60;

            let ganhoValor = 0;


            if(ganhou){

                ganhoValor =
                bet *
                (
                    Math.floor(
                        Math.random()*5
                    ) + 2
                );


                await window.SistemaSaldo
                    .creditar(
                        ganhoValor
                    );


                messageEl.textContent =
                `💎 Ganhou ${dinheiro(ganhoValor)}!`;

                messageEl.style.color =
                "#aaff5d";

            }else{

                messageEl.textContent =
                "🎰 Não foi desta vez.";

                messageEl.style.color =
                "#ff7b7b";

            }


            somResultado(
                ganhou
            );


            await window.SistemaSaldo
                .atualizarTela();


            spinning = false;

            spinBtn.disabled = false;


        },
        1700
    );

}


/* =====================================================
   GARANTE QUE OS ROLOS NUNCA FIQUEM VAZIOS
===================================================== */

window.addEventListener(
    "resize",
    ()=>{
        reels.forEach(
            reel=>{
                if(!reel.children.length){
                    buildReels();
                }
            }
        );
    }
);


/* =====================================================
   INICIAR
===================================================== */

init();

</script>

</body>
</html>
