<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lobby Mania - ApostaXBet</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#02030b;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

.game{
  width:100%;
  max-width:650px;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% 22%,
      #245da9 0,
      #102d68 28%,
      #070d29 55%,
      #02030b 100%
    );

  color:white;
  position:relative;
  overflow:hidden;
}


/* =====================================================
   CARREGANDO
===================================================== */

#carregando{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#02030b;

  color:#61fff4;

  font-size:16px;
  font-weight:bold;

  z-index:9999;
}


/* =====================================================
   TOPO
===================================================== */

.top{
  height:62px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 14px;

  background:
    linear-gradient(
      #101d49,
      #071127
    );

  border-bottom:2px solid #345a9e;
}

.home{
  font-size:29px;
  cursor:pointer;
}

.name{
  font-size:18px;
  font-weight:bold;
  color:#eee;
}

.clock{
  font:18px monospace;
}


/* =====================================================
   BANNER
===================================================== */

.banner{
  height:105px;

  margin:18px 7px 9px;

  border-radius:8px;

  border:3px solid #17173c;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    radial-gradient(
      circle,
      #352083 0,
      #171747 45%,
      #08091f 100%
    );

  box-shadow:
    0 0 16px #00dff077,
    inset 0 0 25px #6d38cc88;
}

.banner span{
  font-size:25px;
  font-weight:900;

  color:#61fff4;

  text-shadow:
    0 0 6px #00ffff,
    0 0 15px #00ffff;
}


/* =====================================================
   MÁQUINA
===================================================== */

.machine{
  margin:0 5px;
  padding:7px;

  background:
    linear-gradient(
      90deg,
      #101736,
      #4c2076 25%,
      #20266b 50%,
      #4c2076 75%,
      #101736
    );

  border-radius:12px 12px 4px 4px;

  box-shadow:
    0 0 25px #3927a855;
}


/* =====================================================
   ROLOS
===================================================== */

.reels{
  height:475px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:4px;

  overflow:hidden;

  background:#0b1026;

  border:4px solid #080b1c;

  border-radius:7px;

  box-shadow:
    inset 0 0 20px #000;
}

.reel{
  overflow:hidden;

  background:#b9d59f;

  border-right:3px solid #35435a;

  position:relative;
}

.reel:last-child{
  border-right:0;
}

.strip{
  display:block;

  width:100%;

  transform:
    translate3d(
      0,
      0,
      0
    );

  will-change:transform;
}


/* =====================================================
   SÍMBOLOS
===================================================== */

.symbol{
  height:157px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      #e8f2d8,
      #b5d69b 70%,
      #86ad74
    );

  border-bottom:4px solid #566a5b;

  flex-shrink:0;
}

.five{
  font-family:Georgia,serif;

  font-size:72px;

  font-weight:bold;

  color:#fff2d0;

  text-shadow:
    4px 4px #69343a,
    -2px -2px #9c6a2f;
}

.face{
  width:105px;
  height:105px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f0d29c;

  border:7px solid #f8e8bd;

  box-shadow:
    0 7px #557b49;

  font-size:56px;
}

.coin{
  width:116px;
  height:82px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#7fa86e;

  border:5px solid #e4edc8;

  color:#edf5d4;

  font-family:Georgia,serif;

  font-size:37px;

  text-shadow:
    3px 3px #48663d;
}

.x2{
  position:absolute;

  bottom:4px;

  font-size:40px;

  font-weight:bold;

  color:#dce8c3;

  text-shadow:
    3px 3px #3b4a30;
}


/* =====================================================
   MENSAGEM
===================================================== */

.message{
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#a8ff67;

  font-size:14px;

  font-weight:bold;
}


/* =====================================================
   PAINEL
===================================================== */

.info{
  min-height:70px;

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  align-items:center;

  background:
    linear-gradient(
      #101c3b,
      #091328
    );

  border:1px solid #2d4270;

  border-radius:17px;

  box-shadow:
    inset 0 0 15px #000;
}

.infoItem{
  text-align:center;
}

.infoSmall{
  display:block;

  color:#8796b4;

  font-size:9px;

  margin-bottom:5px;
}

.value{
  color:#aaff5d;

  font-size:20px;

  font-weight:bold;

  transition:
    transform .25s ease,
    color .25s ease;
}

.value.atualizando{
  transform:scale(1.12);

  color:#fff36b;
}


/* =====================================================
   CONTROLES
===================================================== */

.controls{
  min-height:150px;

  display:grid;

  grid-template-columns:
    58px
    58px
    1fr
    58px
    58px;

  gap:6px;

  align-items:center;

  padding:10px 3px 18px;
}

.btn{
  width:56px;
  height:56px;

  border-radius:50%;

  border:1px solid #445477;

  background:
    linear-gradient(
      #314064,
      #111a32
    );

  color:white;

  font-size:27px;

  box-shadow:
    0 4px 8px #0008;

  cursor:pointer;

  touch-action:manipulation;
}

.spin{
  width:112px;
  height:112px;

  justify-self:center;

  border-radius:50%;

  border:7px solid #25eaf1;

  background:
    radial-gradient(
      circle,
      #173d47,
      #07121d 70%
    );

  color:#62fff6;

  font-size:43px;

  box-shadow:
    0 0 20px #00eaff,
    inset 0 0 22px #00eaff66;

  cursor:pointer;

  touch-action:manipulation;
}

.btn:active,
.spin:active{
  transform:scale(.92);
}

.spin.girando{
  animation:
    pulsar .55s infinite alternate;
}

@keyframes pulsar{

  from{
    box-shadow:
      0 0 12px #00eaff,
      inset 0 0 15px #00eaff66;
  }

  to{
    box-shadow:
      0 0 35px #00ffff,
      inset 0 0 30px #00eaff99;
  }

}


/* =====================================================
   AVISO
===================================================== */

.notice{
  text-align:center;

  color:#667799;

  font-size:10px;

  padding:4px 5px 20px;
}


/* =====================================================
   CELULAR PEQUENO
===================================================== */

@media(max-width:360px){

  .banner span{
    font-size:20px;
  }

  .reels{
    height:420px;
  }

  .symbol{
    height:140px;
  }

  .face{
    width:90px;
    height:90px;
    font-size:48px;
  }

  .coin{
    width:100px;
    height:72px;
    font-size:31px;
  }

}

</style>
</head>


<body>


<div id="carregando">
  🔐 CARREGANDO CONTA...
</div>


<div class="game">


  <!-- =================================================
       TOPO
  ================================================== -->

  <div class="top">

    <div
      class="home"
      id="homeButton">
      ⌂
    </div>


    <div class="name">
      Lobby Mania
    </div>


    <div
      class="clock"
      id="clock">

      03:27:59

    </div>

  </div>


  <!-- =================================================
       BANNER
  ================================================== -->

  <div class="banner">

    <span>
      » Nova rodada é de empurrar! «
    </span>

  </div>


  <!-- =================================================
       MÁQUINA
  ================================================== -->

  <div class="machine">


    <div class="reels">


      <div class="reel">

        <div
          class="strip"
          id="reel1">
        </div>

      </div>


      <div class="reel">

        <div
          class="strip"
          id="reel2">
        </div>

      </div>


      <div class="reel">

        <div
          class="strip"
          id="reel3">
        </div>

      </div>


    </div>


    <div
      class="message"
      id="message">

      Pronto para jogar

    </div>


    <!-- =================================================
         SALDO
    ================================================== -->

    <div class="info">


      <div class="infoItem">
        👤
      </div>


      <div class="infoItem">

        <span class="infoSmall">
          SALDO
        </span>

        <span
          class="value"
          id="balance">

          R$ 0,00

        </span>

      </div>


      <div class="infoItem">

        <span class="infoSmall">
          APOSTA
        </span>

        <span
          class="value"
          id="bet">

          R$ 0,50

        </span>

      </div>


    </div>


    <!-- =================================================
         BOTÕES
    ================================================== -->

    <div class="controls">


      <button
        class="btn"
        id="soundButton"
        type="button">

        🔇

      </button>


      <button
        class="btn"
        id="minusButton"
        type="button">

        −

      </button>


      <button
        class="spin"
        id="spinButton"
        type="button">

        ★

      </button>


      <button
        class="btn"
        id="plusButton"
        type="button">

        +

      </button>


      <button
        class="btn"
        id="playButton"
        type="button">

        ▶

      </button>


    </div>


  </div>


  <div class="notice">

    ApostaXBet

  </div>


</div>


<script type="module">


/* =====================================================
   SUPABASE
===================================================== */

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ELEMENTOS
===================================================== */

const carregando =
document.getElementById(
  "carregando"
);


const message =
document.getElementById(
  "message"
);


const balanceElement =
document.getElementById(
  "balance"
);


const betElement =
document.getElementById(
  "bet"
);


const spinButton =
document.getElementById(
  "spinButton"
);


const soundButton =
document.getElementById(
  "soundButton"
);


const minusButton =
document.getElementById(
  "minusButton"
);


const plusButton =
document.getElementById(
  "plusButton"
);


const playButton =
document.getElementById(
  "playButton"
);


const homeButton =
document.getElementById(
  "homeButton"
);


const reels = [

  document.getElementById(
    "reel1"
  ),

  document.getElementById(
    "reel2"
  ),

  document.getElementById(
    "reel3"
  )

];


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual =
null;


let saldoReal =
0;


let bet =
0.50;


let spinning =
false;


/* =====================================================
   SÍMBOLOS
===================================================== */

const symbols = [

  `
  <div class="symbol">

    <div class="five">
      5
    </div>

  </div>
  `,


  `
  <div class="symbol">

    <div class="face">
      🙂
    </div>

    <div class="x2">
      ×2
    </div>

  </div>
  `,


  `
  <div class="symbol">

    <div class="coin">
      0,05
    </div>

  </div>
  `,


  `
  <div class="symbol">

    <div class="five">
      5
    </div>

  </div>
  `,


  `
  <div class="symbol">

    <div class="face">
      😄
    </div>

    <div class="x2">
      ×2
    </div>

  </div>
  `,


  `
  <div class="symbol">

    <div class="coin">
      0,05
    </div>

  </div>
  `

];


/* =====================================================
   CRIAR ROLOS
===================================================== */

function buildReels(){

  reels.forEach(
    function(
      reel,
      coluna
    ){

      let html = "";


      for(
        let i = 0;
        i < 50;
        i++
      ){

        const indice =
          (
            i +
            coluna * 2
          )
          %
          symbols.length;


        html +=
          symbols[indice];

      }


      reel.innerHTML =
        html;


      reel.style.transition =
        "none";


      reel.style.transform =
        "translate3d(0,0,0)";

    }
  );

}


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(
  valor
){

  return "R$ " +
    Number(
      valor || 0
    )
    .toFixed(2)
    .replace(
      ".",
      ","
    );

}


/* =====================================================
   ATUALIZAR SALDO
===================================================== */

function atualizarSaldo(){

  balanceElement.textContent =
    dinheiro(
      saldoReal
    );


  balanceElement.classList.remove(
    "atualizando"
  );


  void balanceElement.offsetWidth;


  balanceElement.classList.add(
    "atualizando"
  );

}


/* =====================================================
   ATUALIZAR APOSTA
===================================================== */

function atualizarAposta(){

  betElement.textContent =
    dinheiro(
      bet
    );

}


/* =====================================================
   USUÁRIO
===================================================== */

async function carregarUsuario(){

  const {
    data,
    error
  } =
  await supabase
  .auth
  .getSession();


  if(error){

    console.error(
      error
    );

    return null;

  }


  return data?.session?.user ||
    null;

}


/* =====================================================
   SALDO
===================================================== */

async function carregarSaldo(){

  if(!usuarioAtual)
    return;


  const {
    data,
    error
  } =
  await supabase
  .from(
    "saldos"
  )
  .select(
    "valor"
  )
  .eq(
    "user_id",
    usuarioAtual.id
  )
  .single();


  if(error){

    console.error(
      "Erro ao carregar saldo:",
      error
    );


    message.textContent =
      "❌ Erro ao carregar saldo";


    return;

  }


  saldoReal =
    Number(
      data?.valor ||
      0
    );


  atualizarSaldo();

}


/* =====================================================
   GIRAR
===================================================== */

function spin(){

  if(spinning)
    return;


  spinning =
    true;


  spinButton.classList.add(
    "girando"
  );


  message.textContent =
    "🎰 Girando...";


  /*
    Primeiro coloca os rolos
    no ponto inicial.
  */

  reels.forEach(
    function(reel){

      reel.style.transition =
        "none";


      reel.style.transform =
        "translate3d(0,0,0)";

    }
  );


  /*
    Força o navegador a
    registrar o estado inicial.
  */

  void document.body.offsetHeight;


  /*
    Agora começa o movimento.
  */

  reels.forEach(
    function(
      reel,
      index
    ){

      const casas =
        20 +
        Math.floor(
          Math.random() *
          8
        );


      const distancia =
        -(
          casas *
          157
        );


      const duracao =
        1.5 +
        (
          index *
          0.3
        );


      reel.style.transition =
        "transform " +
        duracao +
        "s cubic-bezier(.12,.78,.18,1)";


      reel.style.transform =
        "translate3d(0," +
        distancia +
        "px,0)";

    }
  );


  /*
    Finalização.
  */

  setTimeout(
    function(){

      message.textContent =
        "⚡ Nova rodada";


      spinning =
        false;


      spinButton.classList.remove(
        "girando"
      );

    },
    2500
  );

}


/* =====================================================
   MAIS
===================================================== */

function plus(){

  if(spinning)
    return;


  bet =
    Math.min(
      5,
      Number(
        (
          bet +
          0.50
        ).toFixed(2)
      )
    );


  atualizarAposta();

}


/* =====================================================
   MENOS
===================================================== */

function minus(){

  if(spinning)
    return;


  bet =
    Math.max(
      0.50,
      Number(
        (
          bet -
          0.50
        ).toFixed(2)
      )
    );


  atualizarAposta();

}


/* =====================================================
   SOM
===================================================== */

function sound(){

  if(
    soundButton.textContent
    .includes("🔇")
  ){

    soundButton.textContent =
      "🔊";


    message.textContent =
      "🔊 Som ativado";

  }else{

    soundButton.textContent =
      "🔇";


    message.textContent =
      "🔇 Som desligado";

  }

}


/* =====================================================
   BOTÕES
===================================================== */

spinButton.addEventListener(
  "click",
  spin
);


playButton.addEventListener(
  "click",
  spin
);


plusButton.addEventListener(
  "click",
  plus
);


minusButton.addEventListener(
  "click",
  minus
);


soundButton.addEventListener(
  "click",
  sound
);


homeButton.addEventListener(
  "click",
  function(){

    window.location.href =
      "../index.html";

  }
);


/* =====================================================
   RELÓGIO
===================================================== */

let segundos =
  3 * 3600 +
  27 * 60 +
  59;


setInterval(
  function(){

    segundos++;


    const h =
      Math.floor(
        segundos /
        3600
      ) % 24;


    const m =
      Math.floor(
        (
          segundos %
          3600
        ) / 60
      );


    const s =
      segundos %
      60;


    document.getElementById(
      "clock"
    ).textContent =

      [
        h,
        m,
        s
      ]
      .map(
        function(n){

          return String(
            n
          )
          .padStart(
            2,
            "0"
          );

        }
      )
      .join(
        ":"
      );

  },
  1000
);


/* =====================================================
   LOGIN
===================================================== */

supabase
.auth
.onAuthStateChange(
  function(
    event,
    session
  ){

    if(!session){

      window.location.href =
        "../index.html";

    }

  }
);


/* =====================================================
   INICIAR
===================================================== */

async function iniciar(){

  try{

    buildReels();


    atualizarAposta();


    usuarioAtual =
      await carregarUsuario();


    if(!usuarioAtual){

      window.location.href =
        "../index.html";

      return;

    }


    await carregarSaldo();


    carregando.style.display =
      "none";


  }catch(error){

    console.error(
      "Erro:",
      error
    );


    carregando.style.display =
      "none";


    message.textContent =
      "❌ Erro ao iniciar";

  }

}


iniciar();

</script>

</body>
</html>
