<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Super 777 - ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030b;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.game{
    width:100%;
    max-width:650px;
    min-height:100vh;
    color:#fff;
    overflow:hidden;
    position:relative;
    background:
        radial-gradient(circle at 50% 20%,#7d2200 0,#3b0c08 28%,#10030a 62%,#02030b 100%);
}

.top{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    background:linear-gradient(#321006,#140604);
    border-bottom:2px solid #f5b400;
    box-shadow:0 0 18px #ffb00066;
}

.home{
    font-size:29px;
    cursor:pointer;
}

.name{
    font-size:20px;
    font-weight:900;
    color:#ffd84a;
    text-shadow:0 0 6px #ff8c00,0 0 15px #ff5e00;
}

.clock{
    font:17px monospace;
}

.title{
    text-align:center;
    padding:18px 5px 8px;
}

.title h1{
    font-size:48px;
    font-weight:1000;
    letter-spacing:4px;
    color:#ffe44c;
    text-shadow:
        3px 3px #8c2500,
        0 0 8px #ffd000,
        0 0 20px #ff6a00,
        0 0 35px #ff2d00;
}

.title p{
    color:#fff1a0;
    font-size:12px;
    font-weight:bold;
    margin-top:3px;
}

.machine{
    margin:8px 6px 0;
    padding:8px;
    border-radius:15px;
    background:
        linear-gradient(
            90deg,
            #501006,
            #d17800 18%,
            #5b1605 35%,
            #d99a00 50%,
            #5b1605 65%,
            #d17800 82%,
            #501006
        );
    box-shadow:
        0 0 15px #ff9800,
        0 0 35px #ff450055;
}

.reels{
    height:420px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    overflow:hidden;
    background:#140706;
    border:5px solid #260b06;
    border-radius:10px;
    box-shadow:
        inset 0 0 25px #000,
        0 0 10px #ffcf3377;
}

.reel{
    overflow:hidden;
    background:#fff2bf;
    border-right:3px solid #663d17;
}

.strip{
    transform:translateY(0);
    will-change:transform;
}

.symbol{
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
        linear-gradient(
            #fffdf0,
            #ffe7a0 68%,
            #d59b31
        );
    border-bottom:3px solid #8b6525;
}

.seven{
    font-family:Georgia,serif;
    font-size:92px;
    font-weight:1000;
    color:#ff2020;
    text-shadow:
        4px 4px #7d0808,
        -2px -2px #fff5a0,
        0 0 12px #ff4500;
}

.gem{
    font-size:72px;
    filter:
        drop-shadow(0 0 8px #00ffff)
        drop-shadow(0 0 18px #008cff);
}

.coin{
    width:88px;
    height:88px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    font-weight:900;
    color:#8a4000;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fffbd0,
            #ffd52a 38%,
            #f18b00 75%,
            #8c3b00
        );
    border:6px solid #fff1a0;
    box-shadow:
        0 0 12px #ffd000,
        0 0 25px #ff7b00;
}

.crown{
    font-size:78px;
    filter:
        drop-shadow(0 0 8px #ffd000)
        drop-shadow(0 0 18px #ff7000);
}

.bar{
    font-size:58px;
    font-weight:1000;
    color:#ff173b;
    text-shadow:
        3px 3px #7a0017,
        0 0 12px #ff1744;
}

.message{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:15px;
    font-weight:900;
    color:#ffe66b;
    text-shadow:0 0 8px #ff9d00;
}

.info{
    height:76px;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:linear-gradient(#30100a,#110505);
    border:1px solid #a85e17;
    border-radius:15px;
    box-shadow:inset 0 0 18px #000;
}

.infoItem{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.infoSmall{
    color:#c6a879;
    font-size:10px;
    margin-bottom:5px;
}

.value{
    color:#b9ff54;
    font-size:21px;
    font-weight:bold;
}

.controls{
    padding:15px 5px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.spin{
    width:120px;
    height:120px;
    border-radius:50%;
    border:8px solid #ffe12e;
    background:
        radial-gradient(
            circle,
            #e42c00,
            #8b0800 68%,
            #390400
        );
    color:#fff7a0;
    font-size:22px;
    font-weight:1000;
    letter-spacing:1px;
    box-shadow:
        0 0 12px #ffe100,
        0 0 30px #ff6800,
        inset 0 0 20px #ffb000;
    cursor:pointer;
}

.spin:active{
    transform:scale(.92);
}

.spin:disabled{
    opacity:.5;
}

.bonus{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle,
            #fffbd0 0,
            #ffd21c 18%,
            #e98a00 42%,
            #8c2800 72%,
            #180400 100%
        );
}

.bonus.active{
    display:flex;
    animation:bonusEntrada .5s ease-out;
}

@keyframes bonusEntrada{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.bonusBox{
    width:100%;
    max-width:520px;
    text-align:center;
    padding:20px 15px 30px;
    border:7px solid #fff2a0;
    border-radius:25px;
    background:
        radial-gradient(
            circle,
            #fff6a0,
            #ffbd00 42%,
            #df5200 100%
        );
    box-shadow:
        0 0 20px #fff,
        0 0 50px #ffd000,
        0 0 100px #ff5e00;
}

.bonusImage{
    width:100%;
    max-width:430px;
    max-height:230px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 25px #ffea00)
        drop-shadow(0 0 40px #ff6500);
}

.bonusTitle{
    font-size:42px;
    font-weight:1000;
    color:#fff;
    text-shadow:
        4px 4px #9c2100,
        0 0 10px #ffdf00,
        0 0 25px #ff5e00;
}

.bonus777{
    font-size:85px;
    font-weight:1000;
    color:#e60000;
    text-shadow:
        4px 4px #fff0a0,
        0 0 20px #ff2a00;
    margin:5px 0;
}

.bonusText{
    font-size:27px;
    font-weight:1000;
    color:#fff;
    text-shadow:0 0 10px #8c1b00;
}

.bonusCount{
    margin-top:15px;
    font-size:22px;
    color:#fff;
    font-weight:bold;
}

.bonusButton{
    margin-top:22px;
    padding:14px 28px;
    border:3px solid #fff6a0;
    border-radius:30px;
    background:#b80000;
    color:#fff;
    font-size:18px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 0 20px #ff3c00;
}

.jackpot{
    position:fixed;
    inset:0;
    z-index:1100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle,
            #162d6d 0,
            #07133a 45%,
            #01030e 100%
        );
}

.jackpot.active{
    display:flex;
    animation:jackpotEntrada .45s ease-out;
}

@keyframes jackpotEntrada{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.jackpotBox{
    width:100%;
    max-width:500px;
    text-align:center;
    padding:20px 15px 28px;
    border:5px solid #d8a5ff;
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            #17105b,
            #43228c,
            #120d46
        );
    box-shadow:
        0 0 20px #b76cff,
        0 0 55px #7038ff;
}

.jackpotImage{
    width:100%;
    max-width:420px;
    max-height:230px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 25px #b76cff);
}

.jackpotTitle{
    font-size:50px;
    font-weight:1000;
    color:#fff;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #c75cff;
}

.jackpotText{
    margin-top:10px;
    color:#ffe75b;
    font-size:25px;
    font-weight:bold;
}

.star{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 8px #fff,
        0 0 18px #ffe600;
    animation:estrela 1.2s infinite alternate;
    pointer-events:none;
}

@keyframes estrela{
    from{
        opacity:.2;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.7);
    }
}

.notice{
    text-align:center;
    color:#9d8061;
    font-size:10px;
    padding:4px 5px 20px;
}

@media(max-width:380px){

    .title h1{
        font-size:40px;
    }

    .reels{
        height:390px;
    }

    .symbol{
        height:130px;
    }

    .seven{
        font-size:78px;
    }

    .spin{
        width:100px;
        height:100px;
    }

    .bonusTitle,
    .jackpotTitle{
        font-size:40px;
    }

    .bonusImage,
    .jackpotImage{
        max-height:190px;
    }
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="top">

        <div
            class="home"
            onclick="window.location.href='../index.html'"
        >
            🏠
        </div>

        <div class="name">
            SUPER 777
        </div>

        <div
            class="clock"
            id="clock"
        >
            00:00:00
        </div>

    </div>

    <div class="title">

        <h1>SUPER 777</h1>

        <p>
            A GRANDE MÁQUINA DE PRÊMIOS
        </p>

    </div>

    <div class="machine">

        <div class="reels">

            <div class="reel">
                <div
                    class="strip"
                    id="reel1"
                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel2"
                ></div>
            </div>

            <div class="reel">
                <div
                    class="strip"
                    id="reel3"
                ></div>
            </div>

        </div>

        <div
            class="message"
            id="message"
        >
            Pronto para jogar
        </div>

        <div class="info">

            <div class="infoItem">

                <span class="infoSmall">
                    SALDO
                </span>

                <span
                    class="value"
                    id="balance"
                >
                    R$0,00
                </span>

            </div>

            <div class="infoItem">

                <span class="infoSmall">
                    APOSTA
                </span>

                <span
                    class="value"
                    id="bet"
                >
                    R$0,50
                </span>

            </div>

        </div>

        <div class="controls">

            <button
                class="spin"
                id="spinButton"
                onclick="spin()"
            >
                GIRAR
            </button>

        </div>

    </div>

    <div class="notice">
        SUPER 777 • APOSTAXBET
    </div>

</div>

<!-- SUPER BÔNUS -->

<div
    class="bonus"
    id="bonus"
>

    <div class="bonusBox">

        <img
            src="super-bonus.png"
            class="bonusImage"
            alt="Super Bônus"
        >

        <div class="bonusTitle">
            SUPER BÔNUS
        </div>

        <div class="bonus777">
            777
        </div>

        <div class="bonusText">
            🎰 10 GIROS GRÁTIS 🎰
        </div>

        <div
            class="bonusCount"
            id="bonusCount"
        >
            10 giros restantes
        </div>

        <button
            class="bonusButton"
            onclick="iniciarBonus()"
        >
            COMEÇAR
        </button>

    </div>

</div>

<!-- JACKPOT -->

<div
    class="jackpot"
    id="jackpot"
>

    <div class="jackpotBox">

        <img
            src="jackpot.png"
            class="jackpotImage"
            alt="Jackpot"
        >

        <div class="jackpotTitle">
            JACKPOT
        </div>

        <div class="jackpotText">
            🎉 PRÊMIO ESPECIAL! 🎉
        </div>

        <button
            class="bonusButton"
            onclick="fecharJackpot()"
        >
            CONTINUAR
        </button>

    </div>

</div>

<script>

const symbols = [

    `
    <div class="symbol">
        <div class="seven">7</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="gem">💎</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="coin">★</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="crown">👑</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="bar">BAR</div>
    </div>
    `,

    `
    <div class="symbol">
        <div class="seven">7</div>
    </div>
    `
];

const reels = [
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

const message =
    document.getElementById("message");

const spinButton =
    document.getElementById("spinButton");

const balanceEl =
    document.getElementById("balance");

const betEl =
    document.getElementById("bet");

const bonus =
    document.getElementById("bonus");

const bonusCount =
    document.getElementById("bonusCount");

const jackpot =
    document.getElementById("jackpot");

let saldo = 0;
let aposta = 0.50;

let girando = false;
let girosBonus = 0;

function dinheiro(valor){

    return "R$" +
        Number(valor)
        .toFixed(2)
        .replace(".",",");

}

function atualizarSaldo(){

    balanceEl.textContent =
        dinheiro(saldo);

}

function construirRolos(){

    reels.forEach(
        (reel,index)=>{

            let html = "";

            for(
                let i=0;
                i<80;
                i++
            ){

                html +=
                    symbols[
                        (
                            i + index
                        ) % symbols.length
                    ];

            }

            reel.innerHTML = html;

        }
    );

}

function estrelas(){

    for(
        let i=0;
        i<18;
        i++
    ){

        const estrela =
            document.createElement("div");

        estrela.className =
            "star";

        estrela.style.left =
            Math.random() * 100 + "%";

        estrela.style.top =
            Math.random() * 100 + "%";

        estrela.style.animationDelay =
            Math.random() * 1.5 + "s";

        document
            .getElementById("game")
            .appendChild(estrela);

    }

}

let segundos = 0;

function relogio(){

    setInterval(()=>{

        segundos++;

        const horas =
            Math.floor(
                segundos / 3600
            ) % 24;

        const minutos =
            Math.floor(
                (segundos % 3600) / 60
            );

        const segundosAtual =
            segundos % 60;

        document
            .getElementById("clock")
            .textContent =

            [
                horas,
                minutos,
                segundosAtual
            ]
            .map(
                n =>
                    String(n)
                    .padStart(2,"0")
            )
            .join(":");

    },1000);

}

function obterSaldoSistema(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const valor =
                Number(
                    window.SistemaSaldo.get()
                );

            if(Number.isFinite(valor)){
                saldo = valor;
            }

        }

    }catch(e){

        console.log(
            "SistemaSaldo não disponível."
        );

    }

    atualizarSaldo();

}

function debitarAposta(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.debitar === "function"
        ){

            const resultado =
                window.SistemaSaldo.debitar(aposta);

            if(resultado === false){
                return false;
            }

            obterSaldoSistema();

            return true;

        }

    }catch(e){

        console.log(e);

    }

    if(saldo < aposta){

        return false;

    }

    saldo -= aposta;

    atualizarSaldo();

    return true;

}

function adicionarPremio(valor){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const atual =
                Number(
                    window.SistemaSaldo.get()
                );

            if(Number.isFinite(atual)){

                saldo =
                    atual + valor;

                if(
                    typeof window.SistemaSaldo.atualizarSaldoSaque === "function"
                ){
                    window.SistemaSaldo.atualizarSaldoSaque();
                }

                atualizarSaldo();

                return;

            }

        }

    }catch(e){

        console.log(e);

    }

    saldo += valor;

    atualizarSaldo();

}

function spin(opcoes = {}){

    if(girando)
        return;

    const bonusSpin =
        opcoes.bonus === true;

    if(!bonusSpin){

        if(!debitarAposta()){

            message.textContent =
                "❌ Saldo insuficiente";

            return;

        }

    }

    girando = true;
    spinButton.disabled = true;

    message.textContent =
        bonusSpin
        ? "🎁 Giro grátis..."
        : "⚡ Girando...";

    const resultados = [

        Math.floor(
            Math.random() *
            symbols.length
        ),

        Math.floor(
            Math.random() *
            symbols.length
        ),

        Math.floor(
            Math.random() *
            symbols.length
        )

    ];

    reels.forEach(
        (reel,index)=>{

            reel.style.transition =
                "none";

            reel.style.transform =
                "translateY(0)";

            void reel.offsetHeight;

            const casas =
                42 +
                Math.floor(
                    Math.random() * 15
                );

            const altura = 140;

            const distancia =
                -(
                    (
                        casas +
                        resultados[index]
                    ) * altura
                );

            const duracao =
                2.4 +
                index * .5;

            reel.style.transition =
                `transform ${duracao}s cubic-bezier(.08,.72,.16,1)`;

            reel.style.transform =
                `translateY(${distancia}px)`;

        }
    );

    setTimeout(()=>{

        finalizarGiro(
            resultados,
            bonusSpin
        );

    },3900);

}

function finalizarGiro(
    resultados,
    bonusSpin
){

    const venceu =
        resultados[0] === resultados[1] &&
        resultados[1] === resultados[2];

    if(venceu){

        const eh777 =
            resultados[0] === 0;

        if(eh777){

            const premio =
                aposta * 20;

            adicionarPremio(premio);

            message.textContent =
                "🔥 SUPER 777! " +
                dinheiro(premio);

            abrirJackpot();

        }else{

            const premio =
                aposta * 5;

            adicionarPremio(premio);

            message.textContent =
                "🎉 GANHOU " +
                dinheiro(premio);

        }

    }else{

        message.textContent =
            bonusSpin
            ? "🎁 Giro grátis concluído"
            : "Não foi desta vez.";

    }

    if(bonusSpin){

        girosBonus--;

        atualizarContadorBonus();

        if(girosBonus > 0){

            setTimeout(()=>{

                spin({
                    bonus:true
                });

            },900);

            return;

        }else{

            setTimeout(()=>{

                bonus.classList.remove(
                    "active"
                );

                message.textContent =
                    "🎰 Bônus concluído!";

                liberarJogo();

            },900);

            return;

        }

    }

    liberarJogo();

}

function liberarJogo(){

    girando = false;
    spinButton.disabled = false;

}

function abrirBonus(){

    if(girando)
        return;

    girosBonus = 10;

    atualizarContadorBonus();

    bonus.classList.add(
        "active"
    );

}

function atualizarContadorBonus(){

    if(girosBonus <= 0){

        bonusCount.textContent =
            "Bônus concluído";

    }else{

        bonusCount.textContent =
            girosBonus +
            (
                girosBonus === 1
                ? " giro restante"
                : " giros restantes"
            );

    }

}

function iniciarBonus(){

    bonus.classList.remove(
        "active"
    );

    setTimeout(()=>{

        spin({
            bonus:true
        });

    },500);

}

function abrirJackpot(){

    setTimeout(()=>{

        jackpot.classList.add(
            "active"
        );

    },500);

}

function fecharJackpot(){

    jackpot.classList.remove(
        "active"
    );

}

construirRolos();

obterSaldoSistema();

betEl.textContent =
    dinheiro(aposta);

relogio();

estrelas();

setTimeout(()=>{

    if(!girando){

        abrirBonus();

    }

},5000);

</script>

</body>
</html>
