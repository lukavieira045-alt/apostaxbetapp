<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash ApostaXBet</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at 20% 20%,#002b55,transparent 30%),
    radial-gradient(circle at 80% 70%,#33002f,transparent 30%),
    linear-gradient(135deg,#02030a,#080014,#001322);
    background-size:180% 180%;
    animation:fundo 10s ease-in-out infinite alternate;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-3;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4)}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-2;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#00ffcc;
    box-shadow:0 0 8px #00ffcc,0 0 18px #0088ff;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:6s}
.particulas span:nth-child(2){left:15%;animation-duration:9s}
.particulas span:nth-child(3){left:25%;animation-duration:7s}
.particulas span:nth-child(4){left:35%;animation-duration:11s}
.particulas span:nth-child(5){left:45%;animation-duration:8s}
.particulas span:nth-child(6){left:55%;animation-duration:10s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:9s}
.particulas span:nth-child(9){left:85%;animation-duration:6s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{transform:translateY(0);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-110vh);opacity:0}
}

h1{
    margin-top:22px;
    color:#ffd700;
    font-size:34px;
    text-shadow:0 0 8px #fff,0 0 18px #ffd700,0 0 35px #ff8800;
}

#saldo{
    display:inline-block;
    color:#00ff88;
    font-size:21px;
    margin:5px 15px 18px;
    padding:9px 20px;
    border:1px solid #00ff88;
    border-radius:30px;
    background:rgba(0,0,0,.55);
    box-shadow:0 0 15px rgba(0,255,136,.25);
}

.box{
    width:94%;
    max-width:470px;
    margin:auto;
    background:
    linear-gradient(145deg,rgba(20,25,40,.95),rgba(3,5,15,.97));
    border:0;
    border-radius:22px;
    padding:18px;
    box-shadow:0 20px 70px rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
}

#numero{
    font-size:58px;
    font-weight:900;
    color:#00ff88;
    margin:3px 0 15px;
    text-shadow:0 0 8px #00ff88,0 0 25px #00ff88;
}

#numero.subindo{
    animation:pulsar .35s infinite alternate;
}

@keyframes pulsar{
    from{transform:scale(1)}
    to{
        transform:scale(1.05);
        text-shadow:0 0 12px #00ff88,0 0 35px #00ff88;
    }
}

.area{
    height:300px;
    background:
    radial-gradient(circle at 20% 80%,rgba(0,255,136,.18),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(0,100,255,.20),transparent 35%),
    linear-gradient(160deg,#020711,#050014);
    border-radius:18px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(0,255,136,.35);
    box-shadow:inset 0 0 40px rgba(0,0,0,.8);
}

.grade{
    position:absolute;
    inset:0;
    opacity:.13;
    background-image:
    linear-gradient(rgba(0,255,136,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,136,.35) 1px,transparent 1px);
    background-size:35px 35px;
}

#energia{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        rgba(0,255,136,.55),
        rgba(0,150,255,.15),
        transparent 70%
    );
    filter:blur(15px);
    left:5px;
    bottom:0;
    opacity:.2;
    transform:scale(.7);
    transition:transform .15s,opacity .15s;
}

/* =========================
   LINHA DO VOO
========================= */

.linha-voo{
    position:absolute;
    left:18px;
    top:15px;
    bottom:15px;
    width:48px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    z-index:8;
}

.marca{
    position:relative;
    color:#555;
    font-size:10px;
    font-weight:bold;
    text-align:left;
    transition:.15s;
}

.marca::after{
    content:"";
    position:absolute;
    left:29px;
    top:6px;
    width:13px;
    height:2px;
    background:#333;
}

.marca.ativo{
    color:#00ff88;
    text-shadow:0 0 8px #00ff88;
}

.marca.ativo::after{
    background:#00ff88;
    box-shadow:0 0 8px #00ff88;
}

.trilha{
    position:absolute;
    left:48px;
    top:15px;
    bottom:15px;
    width:2px;
    background:linear-gradient(
        to top,
        rgba(0,255,136,.1),
        rgba(0,255,136,.5),
        rgba(0,255,136,.1)
    );
    z-index:3;
}

/* =========================
   LINHA DO AVIÃO
========================= */

#linha{
    position:absolute;
    width:4px;
    height:0;
    background:linear-gradient(to top,#00ff88,#00ffff);
    bottom:25px;
    left:72px;
    transform-origin:bottom center;
    transform:rotate(-35deg);
    border-radius:10px;
    box-shadow:0 0 8px #00ff88,0 0 20px #00ff88,0 0 35px #00ffff;
    transition:height .12s,left .12s;
}

/* =========================
   AVIÃO
========================= */

#aviao{
    position:absolute;
    bottom:23px;
    left:65px;
    font-size:48px;
    z-index:10;
    filter:
    drop-shadow(0 0 8px #00ccff)
    drop-shadow(0 0 18px #0088ff);
    transition:bottom .12s,left .12s,transform .12s;
    transform:rotate(-18deg);
}

#aviao.voando{
    animation:balanco .25s infinite alternate;
}

@keyframes balanco{
    from{transform:rotate(-17deg) translateY(0)}
    to{transform:rotate(-13deg) translateY(-3px)}
}

.rastro{
    position:absolute;
    width:70px;
    height:4px;
    left:28px;
    bottom:39px;
    border-radius:10px;
    background:linear-gradient(to left,rgba(0,255,255,.9),transparent);
    opacity:0;
    z-index:6;
    transform:rotate(-18deg);
}

.rastro.ativo{
    opacity:1;
    animation:rastro .2s infinite alternate;
}

@keyframes rastro{
    from{width:50px}
    to{width:90px}
}

.area.crash{
    animation:tremer .35s;
    border-color:#ff1744;
    box-shadow:0 0 25px #ff1744,inset 0 0 50px rgba(255,0,40,.4);
}

@keyframes tremer{
    0%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}
    75%{transform:translateX(-5px)}
    100%{transform:translateX(0)}
}

.apostas-titulo{
    margin-top:18px;
    color:#aaa;
    font-size:13px;
}

.apostas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.aposta-btn{
    padding:11px 4px;
    margin:0;
    border:1px solid #245b51;
    border-radius:9px;
    background:#07110f;
    color:#aaa;
    font-size:14px;
    font-weight:bold;
    box-shadow:none;
}

.aposta-btn.ativo{
    color:#00ff88;
    border-color:#00ff88;
    box-shadow:0 0 12px rgba(0,255,136,.3);
}

button{
    padding:15px 25px;
    margin:6px 4px;
    border:0;
    border-radius:12px;
    background:linear-gradient(180deg,#66ffbb,#00cc77);
    color:#001f12;
    font-weight:bold;
    font-size:18px;
    box-shadow:0 0 12px rgba(0,255,136,.35);
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:disabled{
    opacity:.45;
}

#voarBtn{
    width:90%;
    margin-top:16px;
}

#sacarBtn{
    background:linear-gradient(180deg,#ffe66b,#ffb000);
    color:#211600;
    box-shadow:0 0 12px rgba(255,215,0,.35);
}

#mensagem{
    min-height:28px;
    margin-top:10px;
    font-size:17px;
    font-weight:bold;
}

.mensagemCrash{
    color:#ff416d;
    text-shadow:0 0 12px #ff1744;
}

.mensagemSaque{
    color:#00ff88;
    text-shadow:0 0 12px #00ff88;
}

#historico{
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.12);
    color:#aaa;
    line-height:2;
}

@media(max-width:450px){

    h1{
        font-size:29px;
    }

    .box{
        width:96%;
        padding:14px;
    }

    .area{
        height:290px;
    }

    #numero{
        font-size:52px;
    }

    #aviao{
        font-size:43px;
    }

    .apostas{
        grid-template-columns:repeat(3,1fr);
    }

}

</style>

</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
<span></span><span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span><span></span>
</div>

<h1>✈️ Crash ApostaXBet</h1>

<div id="saldo">💰 Saldo: R$ 0,00</div>

<div class="box">

<div id="numero">1.00x</div>

<div class="area" id="area">

<div class="grade"></div>

<div id="energia"></div>

<div class="trilha"></div>

<div class="linha-voo">

<div class="marca" data-multi="3.00">3.00x</div>
<div class="marca" data-multi="2.50">2.50x</div>
<div class="marca" data-multi="2.00">2.00x</div>
<div class="marca" data-multi="1.80">1.80x</div>
<div class="marca" data-multi="1.60">1.60x</div>
<div class="marca" data-multi="1.40">1.40x</div>
<div class="marca" data-multi="1.20">1.20x</div>
<div class="marca" data-multi="1.00">1.00x</div>

</div>

<div id="linha"></div>

<div class="rastro" id="rastro"></div>

<div id="aviao">✈️</div>

</div>

<div id="mensagem"></div>

<div class="apostas-titulo">
ESCOLHA O VALOR DA APOSTA
</div>

<div class="apostas">

<button class="aposta-btn ativo" onclick="selecionarAposta(1,this)">
R$ 1
</button>

<button class="aposta-btn" onclick="selecionarAposta(2,this)">
R$ 2
</button>

<button class="aposta-btn" onclick="selecionarAposta(5,this)">
R$ 5
</button>

<button class="aposta-btn" onclick="selecionarAposta(10,this)">
R$ 10
</button>

<button class="aposta-btn" onclick="selecionarAposta(20,this)">
R$ 20
</button>

<button class="aposta-btn" onclick="selecionarAposta(50,this)">
R$ 50
</button>

<button class="aposta-btn" onclick="selecionarAposta(100,this)">
R$ 100
</button>

</div>

<button id="voarBtn" onclick="voar()">
✈️ VOAR
</button>

<button id="sacarBtn" onclick="sacar()">
💰 SACAR
</button>

<div id="historico">
Últimas rodadas:
</div>

</div>

<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let rodando = false;
let valor = 1;
let aposta = 1;
let queda = 0;
let tempo = null;
let historico = [];

let audioContext = null;
let osciladorMotor = null;
let ganhoMotor = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const numero =
document.getElementById("numero");

const aviao =
document.getElementById("aviao");

const linha =
document.getElementById("linha");

const energia =
document.getElementById("energia");

const rastro =
document.getElementById("rastro");

const area =
document.getElementById("area");

const mensagem =
document.getElementById("mensagem");

const voarBtn =
document.getElementById("voarBtn");


/* =====================================================
   SALDO — SOMENTE LEITURA
===================================================== */

async function atualizarSaldoTela(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const saldo =
                await window.SistemaSaldo.get();

            document.getElementById("saldo").innerText =
                "💰 Saldo: R$ " +
                Number(saldo || 0)
                .toFixed(2)
                .replace(".",",");

            return;
        }

    }catch(e){

        console.error(e);

    }

    document.getElementById("saldo").innerText =
        "💰 Saldo conectado";

}

atualizarSaldoTela();


/* =====================================================
   SOM
===================================================== */

function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

}


/* =====================================================
   SOM DE DECOLAGEM
===================================================== */

function somDecolagem(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        90,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        280,
        agora + .8
    );

    ganho.gain.setValueAtTime(
        .0001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .12,
        agora + .15
    );

    ganho.gain.exponentialRampToValueAtTime(
        .0001,
        agora + .9
    );

    osc.connect(ganho);
    ganho.connect(audioContext.destination);

    osc.start(agora);
    osc.stop(agora + .95);

}


/* =====================================================
   SOM DO AVIÃO VOANDO
===================================================== */

function iniciarSomVoo(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomVoo();

    osciladorMotor =
        audioContext.createOscillator();

    ganhoMotor =
        audioContext.createGain();

    osciladorMotor.type =
        "triangle";

    osciladorMotor.frequency.setValueAtTime(
        115,
        audioContext.currentTime
    );

    ganhoMotor.gain.setValueAtTime(
        .025,
        audioContext.currentTime
    );

    osciladorMotor.connect(
        ganhoMotor
    );

    ganhoMotor.connect(
        audioContext.destination
    );

    osciladorMotor.start();

}


/* =====================================================
   SOM VUUUM
===================================================== */

function somVuum(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        agora + .35
    );

    ganho.gain.setValueAtTime(
        .0001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .16,
        agora + .08
    );

    ganho.gain.exponentialRampToValueAtTime(
        .0001,
        agora + .5
    );

    osc.connect(ganho);
    ganho.connect(audioContext.destination);

    osc.start(agora);
    osc.stop(agora + .55);

}


/* =====================================================
   PARAR SOM
===================================================== */

function pararSomVoo(){

    if(
        osciladorMotor &&
        ganhoMotor &&
        audioContext
    ){

        const agora =
            audioContext.currentTime;

        ganhoMotor.gain.cancelScheduledValues(
            agora
        );

        ganhoMotor.gain.setValueAtTime(
            ganhoMotor.gain.value,
            agora
        );

        ganhoMotor.gain.exponentialRampToValueAtTime(
            .0001,
            agora + .25
        );

        try{
            osciladorMotor.stop(
                agora + .3
            );
        }catch(e){}

        osciladorMotor = null;
        ganhoMotor = null;

    }

}


/* =====================================================
   SELECIONAR APOSTA
===================================================== */

function selecionarAposta(valorEscolhido,botao){

    if(rodando)
        return;

    iniciarAudio();

    aposta =
        Number(valorEscolhido);

    document
    .querySelectorAll(".aposta-btn")
    .forEach(function(btn){

        btn.classList.remove("ativo");

    });

    botao.classList.add("ativo");

}


/* =====================================================
   MARCAS DA LINHA
===================================================== */

function atualizarMarcas(){

    const marcas =
        document.querySelectorAll(".marca");

    marcas.forEach(function(marca){

        const multiplicador =
            Number(
                marca.dataset.multi
            );

        if(valor >= multiplicador){

            marca.classList.add("ativo");

        }else{

            marca.classList.remove("ativo");

        }

    });

}


/* =====================================================
   VOAR
===================================================== */

function voar(){

    if(rodando)
        return;

    iniciarAudio();

    rodando = true;

    valor = 1;

    queda =
        Math.random() * 3.5 + 1.3;

    mensagem.className = "";

    mensagem.innerHTML =
        "✈️ AVIÃO DECOLANDO...";

    numero.innerHTML =
        "1.00x";

    numero.style.color =
        "#00ff88";

    area.classList.remove("crash");

    aviao.classList.add("voando");

    rastro.classList.add("ativo");

    numero.classList.add("subindo");

    voarBtn.disabled = true;

    somDecolagem();

    setTimeout(function(){

        iniciarSomVoo();

    },700);

    tempo =
    setInterval(function(){

        valor += .05;

        numero.innerHTML =
            valor.toFixed(2) + "x";

        atualizarMarcas();


        /* POSIÇÃO VERTICAL */

        let altura =
            23 + (valor - 1) * 72;

        if(altura > 235){
            altura = 235;
        }

        aviao.style.bottom =
            altura + "px";


        /* POSIÇÃO HORIZONTAL */

        let esquerda =
            65 + (valor - 1) * 20;

        if(esquerda > 310){
            esquerda = 310;
        }

        aviao.style.left =
            esquerda + "px";


        /* LINHA */

        let tamanhoLinha =
            (valor - 1) * 48;

        if(tamanhoLinha > 250){
            tamanhoLinha = 250;
        }

        linha.style.height =
            tamanhoLinha + "px";

        linha.style.left =
            (esquerda + 8) + "px";


        /* ENERGIA */

        let escala =
            .7 + valor * .12;

        if(escala > 2.7){
            escala = 2.7;
        }

        energia.style.transform =
            "scale(" + escala + ")";

        energia.style.opacity =
            Math.min(
                .2 + valor * .045,
                .85
            );


        /* VUUUM */

        if(
            valor > 2 &&
            Math.abs(
                valor % 1
            ) < .051
        ){

            somVuum();

        }


        /* CRASH */

        if(valor >= queda){

            finalizarCrash();

        }

    },100);

}


/* =====================================================
   SACAR — VISUAL APENAS
===================================================== */

function sacar(){

    if(!rodando)
        return;

    const premio =
        aposta * valor;

    mensagem.className =
        "mensagemSaque";

    mensagem.innerHTML =
        "🎉 Saque de R$ " +
        premio.toFixed(2).replace(".",",");

    adicionarHistorico(
        valor.toFixed(2) + "x"
    );

    pararJogo();

}


/* =====================================================
   CRASH
===================================================== */

function finalizarCrash(){

    clearInterval(tempo);

    pararSomVoo();

    rodando = false;

    numero.classList.remove("subindo");

    aviao.classList.remove("voando");

    rastro.classList.remove("ativo");

    area.classList.add("crash");

    numero.style.color =
        "#ff416d";

    numero.style.textShadow =
        "0 0 10px #ff1744,0 0 30px #ff1744";

    mensagem.className =
        "mensagemCrash";

    mensagem.innerHTML =
        "💥 CRASH em " +
        valor.toFixed(2) +
        "x";

    adicionarHistorico(
        valor.toFixed(2) + "x"
    );

    voarBtn.disabled = false;

    setTimeout(function(){

        numero.style.color =
            "#00ff88";

        numero.style.textShadow =
            "0 0 8px #00ff88,0 0 25px #00ff88";

        area.classList.remove("crash");

        aviao.style.bottom =
            "23px";

        aviao.style.left =
            "65px";

        linha.style.height =
            "0px";

        linha.style.left =
            "72px";

        energia.style.transform =
            "scale(.7)";

        energia.style.opacity =
            ".2";

        numero.innerHTML =
            "1.00x";

        atualizarMarcas();

    },900);

}


/* =====================================================
   PARAR
===================================================== */

function pararJogo(){

    clearInterval(tempo);

    pararSomVoo();

    rodando = false;

    numero.classList.remove("subindo");

    aviao.classList.remove("voando");

    rastro.classList.remove("ativo");

    aviao.style.bottom =
        "23px";

    aviao.style.left =
        "65px";

    linha.style.height =
        "0px";

    linha.style.left =
        "72px";

    energia.style.transform =
        "scale(.7)";

    energia.style.opacity =
        ".2";

    numero.innerHTML =
        "1.00x";

    atualizarMarcas();

    voarBtn.disabled = false;

}


/* =====================================================
   HISTÓRICO
===================================================== */

function adicionarHistorico(valorHistorico){

    historico.unshift(
        valorHistorico
    );

    if(historico.length > 5){
        historico.pop();
    }

    document.getElementById(
        "historico"
    ).innerHTML =
        "Últimas rodadas:<br>" +
        historico.join(" | ");

}

</script>
