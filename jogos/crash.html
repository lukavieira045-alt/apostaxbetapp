*{

    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;

body{
    margin:0;
    min-height:100vh;

    background:
    radial-gradient(circle at 20% 20%,#002b55,transparent 30%),
    radial-gradient(circle at 80% 70%,#33002f,transparent 30%),

    background-size:180% 180%;

    color:white;
    text-align:center;
    overflow-x:hidden;

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}


/* =========================
   LUZES
========================= */

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-3;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{
        transform:translate(180px,100px) scale(1.4);
    }
}

@keyframes luz2{
    to{
        transform:translate(-180px,-100px) scale(1.4);
    }
}


/* =========================
   PARTICULAS
========================= */

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-2;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#00ffcc;

    box-shadow:
    0 0 8px #00ffcc,
    0 0 18px #0088ff;

    animation:subirParticula linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:6s}
.particulas span:nth-child(2){left:15%;animation-duration:9s}
.particulas span:nth-child(3){left:25%;animation-duration:7s}
.particulas span:nth-child(4){left:35%;animation-duration:11s}
.particulas span:nth-child(5){left:45%;animation-duration:8s}
.particulas span:nth-child(6){left:55%;animation-duration:10s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:9s}
.particulas span:nth-child(9){left:85%;animation-duration:6s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subirParticula{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}


/* =========================
   TITULO
========================= */

h1{
    margin-top:25px;
    color:#ffd700;
    font-size:38px;

/* =========================

========================= */

/* =========================
   CAIXA
========================= */

   MULTIPLICADOR
========================= */

#numero{

    color:#00ff88;

    margin:5px 0 15px;

}

#numero.subindo{
    animation:pulsar .35s infinite alternate;
}

@keyframes pulsar{
    from{

    }

        transform:scale(1.05);

/* =========================
   ÁREA DO AVIÃO
========================= */

.area{

    inset 0 0 40px rgba(0,0,0,.8);

/* =========================
   CÂMERA / MUNDO DO AVIÃO
========================= */

#mundo{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    transition:
    transform .12s linear;
}


/* =========================
   GRADE
========================= */

.grade{
    position:absolute;
    inset:-500px;

    opacity:.14;

    background-image:

    linear-gradient(
        rgba(0,255,136,.35) 1px,
        transparent 1px
    ),

        90deg,
        rgba(0,255,136,.35) 1px,
        transparent 1px
    );

    background-size:35px 35px;

    transform:perspective(400px) rotateX(55deg);

    transform-origin:center bottom;
}


/* =========================
   LINHA DA ALTURA
========================= */

#linha{
    position:absolute;

    width:4px;

    height:260px;

    left:45px;

    0 0 8px #00ff88,

}


/* =========================
   ESCALA DE MULTIPLICADORES
========================= */

#escala{
    position:absolute;

    left:8px;
    bottom:-80px;

    width:75px;
    height:260px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    transition:transform .12s linear;
}

.marcacao{
    display:flex;
    align-items:center;
    gap:5px;

    color:#555;

    font-size:12px;
    font-weight:bold;

    transition:.15s;
}

.marcacao::after{
    content:"";

    display:block;

    width:18px;
    height:1px;

    background:#444;
}

.marcacao.ativo{
    color:#00ff88;

    text-shadow:
    0 0 8px #00ff88,
    0 0 15px #00ff88;
}

.marcacao.ativo::after{
    background:#00ff88;
    box-shadow:0 0 8px #00ff88;
}


/* =========================
   AVIÃO
========================= */

#aviao{
    position:absolute;

    bottom:25px;
    left:70px;

    font-size:55px;

    z-index:10;

    transform:rotate(-15deg);

    filter:
    drop-shadow(0 0 8px #00ffff)
    drop-shadow(0 0 18px #0088ff);

    transition:
    bottom .12s linear,

/* =========================
   RASTRO
========================= */

#rastro{
    position:absolute;

    width:5px;
    height:70px;

    left:95px;
    bottom:5px;

    linear-gradient(

    transform:rotate(35deg);

    0 0 20px #00ff88;

}

#rastro.ativo{
    opacity:1;
    animation:rastro .15s infinite alternate;
}

@keyframes rastro{
    from{
        opacity:.55;
        transform:rotate(35deg) scaleY(.8);
    }

    to{
        opacity:1;
        transform:rotate(35deg) scaleY(1.2);
    }
}


/* =========================
   CRASH
========================= */

.area.crash{
    animation:tremer .35s;

    border-color:#ff1744;

    box-shadow:
    0 0 25px #ff1744,
    inset 0 0 50px rgba(255,0,40,.4);

@keyframes tremer{
    0%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}
    75%{transform:translateX(-5px)}
    100%{transform:translateX(0)}

/* =========================

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let saldoReal = 0;

let aposta = 1;

let valor = 1;

let queda = 0;

let rodando = false;

let tempo = null;

let historico = [];


/* =====================================================
   ELEMENTOS
===================================================== */

const saldoEl =
document.getElementById("saldo");

const numero =
document.getElementById("numero");

const aviao =
document.getElementById("aviao");

const rastro =
document.getElementById("rastro");

const linha =
document.getElementById("linha");

const escala =
document.getElementById("escala");

const area =
document.getElementById("area");

const mensagem =
document.getElementById("mensagem");

const jogarBtn =
document.getElementById("jogarBtn");


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

    return Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =====================================================
   USUÁRIO LOGADO
===================================================== */

async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
        .auth
        .getSession();

    if(error){

        console.error(
            "Erro de sessão:",
            error
        );

        return null;
    }

    return data?.session?.user || null;
}


/* =====================================================
   BUSCAR SALDO REAL
===================================================== */

async function buscarSaldo(){

    if(!usuarioAtual)
        return 0;

    const {
        data,
        error
    } =
    await supabase
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .single();

    if(error){

        console.error(
            "Erro ao buscar saldo:",
            error
        );

        return 0;
    }

    return Number(
        data?.valor || 0
    );
}


/* =====================================================
   ATUALIZAR SALDO NA TELA
===================================================== */

async function atualizarSaldo(){

    saldoReal =
        await buscarSaldo();

    saldoEl.innerHTML =
        "💰 Saldo: R$ " +
        dinheiro(saldoReal);

    atualizarBotao();
}


/* =====================================================
   SALVAR SALDO REAL
===================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;

    const valorFinal =
        Number(
            Number(novoSaldo)
            .toFixed(2)
        );

    const {
        error
    } =
    await supabase
        .from("saldos")
        .update({
            valor:valorFinal
        })
        .eq(
            "user_id",
            usuarioAtual.id
        );

    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        return false;
    }

    saldoReal =
        valorFinal;

    saldoEl.innerHTML =
        "💰 Saldo: R$ " +
        dinheiro(saldoReal);

    return true;
}


/* =====================================================
   SELECIONAR APOSTA
===================================================== */

window.selecionarAposta =
function(
    valorSelecionado,
    botao
){

    if(rodando)
        return;

    aposta =
        Number(valorSelecionado);

    document
        .querySelectorAll(".valorBtn")
        .forEach(
            b =>
            b.classList.remove("ativo")
        );

    botao.classList.add("ativo");

    atualizarBotao();
};


/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

    if(rodando){

        jogarBtn.disabled = true;

        jogarBtn.innerText =
            "✈️ VOANDO...";

        return;
    }

    if(saldoReal < aposta){

        jogarBtn.disabled = true;

        jogarBtn.innerText =
            "SALDO INSUFICIENTE";

        return;
    }

    jogarBtn.disabled = false;

    jogarBtn.innerText =
        "✈️ INICIAR";
}


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext = null;

function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }
}


/* =====================================================
   SOM DE DECOLAGEM
===================================================== */

function somDecolagem(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        90,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        330,
        agora + .8
    );

    ganho.gain.setValueAtTime(
        .001,
        agora
    );

    ganho.gain.linearRampToValueAtTime(
        .10,
        agora + .1
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .9
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(agora + .9);
}


/* =====================================================
   SOM DO AVIÃO VOANDO
===================================================== */

let somVoo = null;
let ganhoVoo = null;

function iniciarSomVoo(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomVoo();

    somVoo =
        audioContext.createOscillator();

    ganhoVoo =
        audioContext.createGain();

    somVoo.type =
        "triangle";

    somVoo.frequency.setValueAtTime(
        75,
        audioContext.currentTime
    );

    ganhoVoo.gain.setValueAtTime(
        .025,
        audioContext.currentTime
    );

    somVoo.connect(
        ganhoVoo
    );

    ganhoVoo.connect(
        audioContext.destination
    );

    somVoo.start();
}


function pararSomVoo(){

    if(
        somVoo &&
        ganhoVoo &&
        audioContext
    ){

        const agora =
            audioContext.currentTime;

        ganhoVoo.gain.cancelScheduledValues(
            agora
        );

        ganhoVoo.gain.setValueAtTime(
            .025,
            agora
        );

        ganhoVoo.gain.exponentialRampToValueAtTime(
            .001,
            agora + .2
        );

        try{

            somVoo.stop(
                agora + .21
            );

        }catch(e){}

        somVoo = null;
        ganhoVoo = null;
    }
}


/* =====================================================
   SOM "VUM"
===================================================== */

function somVum(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        700,
        agora + .22
    );

    ganho.gain.setValueAtTime(
        .001,
        agora
    );

    ganho.gain.linearRampToValueAtTime(
        .18,
        agora + .03
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .28
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(agora + .3);
}


/* =====================================================
   SOM CRASH
===================================================== */

function somCrash(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "square";

    osc.frequency.setValueAtTime(
        120,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        45,
        agora + .45
    );

    ganho.gain.setValueAtTime(
        .12,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .45
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(agora + .45);
}


/* =====================================================
   POSIÇÃO DO AVIÃO
===================================================== */

function atualizarAviao(){

    /*
       O avião sobe, mas a câmera acompanha.
       Assim ele não fica batendo no topo da tela.
    */

    const subida =
        Math.min(
            (valor - 1) * 28,
            800
        );

    const horizontal =
        Math.min(
            70 + (valor - 1) * 8,
            300
        );

    aviao.style.left =
        horizontal + "px";

    /*
       Movimento vertical.
    */

    aviao.style.bottom =
        (25 + subida) + "px";


    /*
       A câmera acompanha depois de determinado ponto.
    */

    const camera =
        Math.max(
            0,
            subida - 170
        );

    const mundo =
        document.getElementById(
            "mundo"
        );

    mundo.style.transform =
        "translateY(" +
        camera +
        "px)";


    /*
       Linha acompanha.
    */

    linha.style.height =
        Math.min(
            260 + subida,
            900
        ) + "px";


    /*
       Escala acompanha.
    */

    escala.style.transform =
        "translateY(" +
        camera +
        "px)";


    /*
       Marcações verdes.
    */

    document
        .querySelectorAll(".marcacao")
        .forEach(
            function(marcacao){

                const numeroMarca =
                    Number(
                        marcacao.dataset.valor
                    );

                if(
                    valor >=
                    numeroMarca
                ){

                    marcacao.classList.add(
                        "ativo"
                    );

                }else{

                    marcacao.classList.remove(
                        "ativo"
                    );
                }
            }
        );
}


/* =====================================================
   RESET VISUAL
===================================================== */

function resetarAviao(){

    const mundo =
        document.getElementById(
            "mundo"
        );

    mundo.style.transform =
        "translateY(0px)";

    aviao.style.left =
        "70px";

    aviao.style.bottom =
        "25px";

    linha.style.height =
        "260px";

    escala.style.transform =
        "translateY(0px)";

    document
        .querySelectorAll(".marcacao")
        .forEach(
            m =>
            m.classList.remove("ativo")
        );

    rastro.classList.remove(
        "ativo"
    );
}


/* =====================================================
   JOGAR
===================================================== */

window.jogar =
async function(){

    if(rodando)
        return;

    iniciarAudio();

    if(!usuarioAtual){

        mensagem.innerHTML =
            "❌ USUÁRIO NÃO LOGADO";

        return;
    }


    /*
       BUSCA NOVAMENTE O SALDO REAL
       ANTES DE DEBITAR.
    */

    saldoReal =
        await buscarSaldo();

    saldoEl.innerHTML =
        "💰 Saldo: R$ " +
        dinheiro(saldoReal);


    if(
        aposta <= 0 ||
        aposta > saldoReal
    ){

        mensagem.innerHTML =
            "❌ SALDO INSUFICIENTE";

        return;
    }


    /*
       DEBITA DO SALDO REAL.
    */

    const novoSaldo =
        saldoReal - aposta;

    const debitado =
        await salvarSaldo(
            novoSaldo
        );

    if(!debitado){

        mensagem.innerHTML =
            "❌ NÃO FOI POSSÍVEL DEBITAR A APOSTA";

        return;
    }


    /*
       COMEÇA A RODADA.
    */

    rodando = true;

    valor = 1;

    /*
       Ponto aleatório de crash.
    */

    queda =
        Math.random() * 5 + 1;

    mensagem.className = "";

    mensagem.innerHTML =
        "✈️ DECOLANDO...";

    area.classList.remove(
        "crash"
    );

    numero.classList.add(
        "subindo"
    );

    rastro.classList.add(
        "ativo"
    );

    resetarAviao();

    atualizarBotao();

    somDecolagem();

    setTimeout(
        function(){

            if(rodando){

                iniciarSomVoo();

                mensagem.innerHTML =
                    "✈️ VOANDO...";

            }

        },
        800
    );


    /*
       ANIMAÇÃO.
    */

    tempo =
        setInterval(
            function(){

                valor += .05;

                numero.innerHTML =
                    valor.toFixed(2) +
                    "x";


                atualizarAviao();


                /*
                   SOM VUM EM VELOCIDADE ALTA.
                */

                if(
                    valor >= 3 &&
                    valor < 3.06
                ){

                    somVum();
                }


                /*
                   CRASH.
                */

                if(
                    valor >= queda
                ){

                    finalizarCrash();
                }

            },
            100
        );

};


/* =====================================================
   SACAR
===================================================== */

window.sacar =
function(){

    /*
       O saque continua no sistema de saque
       da conta, sem criar saldo paralelo.
    */

    window.location.href =
        "../saque.html";
};


/* =====================================================
   CRASH
===================================================== */

function finalizarCrash(){

    clearInterval(tempo);

    pararSomVoo();

    somCrash();

    rodando = false;

    numero.classList.remove(
        "subindo"
    );

    rastro.classList.remove(
        "ativo"
    );

    area.classList.add(
        "crash"
    );

    numero.style.color =
        "#ff416d";

    numero.style.textShadow =
        "0 0 10px #ff1744,0 0 30px #ff1744";

    mensagem.className =
        "mensagemCrash";

    mensagem.innerHTML =
        "💥 CRASH em " +
        valor.toFixed(2) +
        "x";

    adicionarHistorico(
        valor.toFixed(2) + "x"
    );

    atualizarSaldo();

    jogarBtn.disabled = false;

    setTimeout(
        function(){

            numero.style.color =
                "";

            numero.style.textShadow =
                "";

            area.classList.remove(
                "crash"
            );

            numero.innerHTML =
                "1.00x";

            resetarAviao();

            atualizarBotao();

        },
        900
    );
}


/* =====================================================
   HISTÓRICO
===================================================== */

function adicionarHistorico(
    valorHistorico
){

    historico.unshift(
        valorHistorico
    );

    if(
        historico.length > 5
    ){

        historico.pop();
    }

    document.getElementById(
        "historico"
    ).innerHTML =
        "Últimas rodadas:<br>" +
        historico.join(" | ");
}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciar(){

    usuarioAtual =
        await obterUsuario();

    if(!usuarioAtual){

        alert(
            "Você precisa estar logado para jogar."
        );

        window.location.href =
            "../index.html";

        return;
    }

    /*
       CARREGA SOMENTE O SALDO
       EXISTENTE NA CONTA.
    */

    await atualizarSaldo();

    resetarAviao();
}
