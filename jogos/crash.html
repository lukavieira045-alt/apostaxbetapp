<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash ApostaXBet</title>

<style>
body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#ffd700;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:20px;
}

.box{
    width:90%;
    max-width:380px;
    margin:auto;
    background:#151515;
    border:2px solid #ffd700;
    border-radius:20px;
    padding:20px;
}

#numero{
    font-size:55px;
    color:#00ff88;
    margin:20px;
}

.campo{
    height:180px;
    background:#000;
    border-radius:15px;
    position:relative;
    overflow:hidden;
}

#foguete{
    position:absolute;
    bottom:20px;
    left:45%;
    font-size:60px;
}

input{
    padding:12px;
    width:100px;
    margin:20px;
    border-radius:10px;
}

button{
    padding:15px 30px;
    border:0;
    border-radius:12px;
    background:#ffd700;
    font-weight:bold;
    font-size:18px;
}

.sacar{
    background:#00ff88;
}
</style>

</head>

<body>

<h1>🚀 Crash</h1>

<div id="saldo"></div>

<div class="box">

<div id="numero">
1.00x
</div>

<div class="campo">
<div id="foguete">🚀</div>
</div>

<input id="aposta" type="number" value="1">

<br>

<button onclick="jogar()">JOGAR</button>

<button class="sacar" onclick="retirar()">SACAR</button>

</div>


<script>

let saldo = Number(localStorage.getItem("saldo") || 2);

let rodando=false;
let valor=1;
let aposta=0;
let queda=0;
let tempo;


function tela(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}

tela();


function jogar(){

if(rodando)return;


aposta=Number(document.getElementById("aposta").value);


if(aposta>saldo){

alert("Saldo insuficiente");
return;

}


saldo-=aposta;

tela();


valor=1;

queda=Math.random()*4+1;

rodando=true;



tempo=setInterval(()=>{


valor+=0.05;


document.getElementById("numero").innerHTML=
valor.toFixed(2)+"x";


document.getElementById("foguete").style.bottom=
(20+valor*15)+"px";



if(valor>=queda){


clearInterval(tempo);

alert("💥 Caiu!");

rodando=false;

voltar();

}


},150);


}



function retirar(){

if(!rodando)return;


saldo+=aposta*valor;

tela();


alert("🎉 Retirou em "+valor.toFixed(2)+"x");


clearInterval(tempo);


rodando=false;

voltar();

}



function voltar(){

valor=1;

document.getElementById("numero").innerHTML="1.00x";

document.getElementById("foguete").style.bottom="20px";

}


</script>

</body>
</html>
