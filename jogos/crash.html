<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avião ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at 20% 20%,#002b55,transparent 30%),
    radial-gradient(circle at 80% 70%,#33002f,transparent 30%),
    linear-gradient(135deg,#02030a,#080014,#001322);
    background-size:180% 180%;
    animation:fundo 10s ease-in-out infinite alternate;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

h1{
    margin-top:25px;
    color:#ffd700;
    font-size:36px;
    text-shadow:
    0 0 8px #fff,
    0 0 18px #ffd700,
    0 0 35px #ff8800;
}

#saldo{
    display:inline-block;
    color:#00ff88;
    font-size:21px;
    margin:10px 15px 20px;
    padding:10px 20px;
    border:1px solid #00ff88;
    border-radius:30px;
    background:rgba(0,0,0,.55);
}

.box{
    width:94%;
    max-width:450px;
    margin:auto;
    background:
    linear-gradient(145deg,rgba(20,25,40,.95),rgba(3,5,15,.97));
    border:2px solid #ffd700;
    border-radius:25px;
    padding:20px;
    box-shadow:
    0 0 25px rgba(255,215,0,.25),
    0 20px 70px rgba(0,0,0,.7);
}

#numero{
    font-size:58px;
    font-weight:900;
    color:#00ff88;
    margin:5px 0 15px;
    text-shadow:
    0 0 8px #00ff88,
    0 0 25px #00ff88;
}

.area{
    height:290px;
    background:
    radial-gradient(circle at 20% 80%,rgba(0,255,136,.18),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(0,100,255,.20),transparent 35%),
    linear-gradient(160deg,#020711,#050014);
    border-radius:18px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(0,255,136,.35);
    box-shadow:inset 0 0 40px rgba(0,0,0,.8);
}

.grade{
    position:absolute;
    inset:0;
    opacity:.14;
    background-image:
    linear-gradient(rgba(0,255,136,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,136,.35) 1px,transparent 1px);
    background-size:35px 35px;
}

#linha{
    position:absolute;
    width:5px;
    height:0;
    background:linear-gradient(to top,#00ff88,#00ffff);
    bottom:25px;
    left:45px;
    transform:rotate(-35deg);
    transform-origin:bottom center;
    border-radius:10px;
    box-shadow:
    0 0 8px #00ff88,
    0 0 20px #00ff88,
    0 0 35px #00ffff;
    transition:.12s;
}

#aviao{
    position:absolute;
    left:30px;
    bottom:20px;
    font-size:55px;
    z-index:5;
    filter:
    drop-shadow(0 0 8px #00ffff)
    drop-shadow(0 0 18px #0088ff);
    transform:rotate(-18deg);
    transition:.12s;
}

#fundoVelocidade{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    background:
    repeating-linear-gradient(
        -25deg,
        transparent 0 18px,
        rgba(255,255,255,.18) 19px 21px,
        transparent 22px 40px
    );
}

#fundoVelocidade.ativo{
    opacity:.5;
    animation:velocidade .18s linear infinite;
}

@keyframes velocidade{
    from{background-position:0 0}
    to{background-position:-80px 100px}
}

#mensagem{
    min-height:30px;
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.valores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:15px;
}

.valor{
    padding:12px 5px;
    border:1px solid #555;
    border-radius:10px;
    background:#080b12;
    color:#aaa;
    font-size:16px;
    font-weight:bold;
}

.valor.ativo{
    color:#00ff88;
    border-color:#00ff88;
    box-shadow:0 0 12px rgba(0,255,136,.35);
}

button{
    cursor:pointer;
}

#historico{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.12);
    color:#aaa;
    line-height:2;
}

#carregando{
    position:fixed;
    inset:0;
    z-index:999;
    background:#02030a;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#ffe36a;
    font-size:17px;
}

@media(max-width:450px){
    h1{font-size:31px}
    #numero{font-size:52px}
    #aviao{font-size:48px}
    .area{height:270px}
}
</style>
</head>

<body>

<div id="carregando">
    🔐 CARREGANDO CONTA...
</div>

<h1>✈️ Avião ApostaXBet</h1>

<div id="saldo">
    💰 Saldo: R$ 0,00
</div>

<div class="box">

    <div id="numero">1.00x</div>

    <div class="area" id="area">

        <div class="grade"></div>

        <div id="fundoVelocidade"></div>

        <div id="linha"></div>

        <div id="aviao">✈️</div>

    </div>

    <div id="mensagem">
        AVIÃO PRONTO PARA DECOLAR
    </div>

    <div class="valores">

        <button class="valor ativo" onclick="selecionarValor(1,this)">
            R$ 1
        </button>

        <button class="valor" onclick="selecionarValor(2,this)">
            R$ 2
        </button>

        <button class="valor" onclick="selecionarValor(5,this)">
            R$ 5
        </button>

        <button class="valor" onclick="selecionarValor(10,this)">
            R$ 10
        </button>

        <button class="valor" onclick="selecionarValor(20,this)">
            R$ 20
        </button>

        <button class="valor" onclick="selecionarValor(50,this)">
            R$ 50
        </button>

        <button class="valor" onclick="selecionarValor(100,this)">
            R$ 100
        </button>

    </div>

    <div id="historico">
        Últimas rodadas:
    </div>

</div>

<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

let usuarioAtual = null;
let saldoReal = 0;
let valorSelecionado = 1;

let multiplicador = 1;
let intervalo = null;
let voando = false;

let historico = [];


/* =========================================
   ELEMENTOS
========================================= */

const saldoEl =
document.getElementById("saldo");

const numero =
document.getElementById("numero");

const aviao =
document.getElementById("aviao");

const linha =
document.getElementById("linha");

const area =
document.getElementById("area");

const mensagem =
document.getElementById("mensagem");

const fundoVelocidade =
document.getElementById("fundoVelocidade");

const carregando =
document.getElementById("carregando");


/* =========================================
   FORMATAÇÃO
========================================= */

function dinheiro(valor){

    return Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


/* =========================================
   BUSCAR USUÁRIO
========================================= */

async function obterUsuario(){

    const {
        data,
        error
    } =
    await supabase
        .auth
        .getSession();

    if(error){

        console.error(
            "Erro de sessão:",
            error
        );

        return null;

    }

    return data?.session?.user || null;

}


/* =========================================
   BUSCAR SALDO REAL EXISTENTE
========================================= */

async function carregarSaldo(){

    if(!usuarioAtual)
        return false;

    const {
        data,
        error
    } =
    await supabase
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .single();

    if(error){

        console.error(
            "Erro ao carregar saldo:",
            error
        );

        saldoEl.innerText =
            "💰 Saldo: R$ 0,00";

        mensagem.innerText =
            "❌ NÃO FOI POSSÍVEL CARREGAR O SALDO";

        mensagem.style.color =
            "#ff416d";

        return false;

    }

    saldoReal =
        Number(data?.valor || 0);

    saldoEl.innerText =
        "💰 Saldo: R$ " +
        dinheiro(saldoReal);

    return true;

}


/* =========================================
   ÁUDIO
========================================= */

let audioContext = null;

function iniciarAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext)
            return;

        audioContext =
            new AudioContext();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* =========================================
   SOM DE DECOLAGEM
========================================= */

function somDecolagem(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        90,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        240,
        agora + .8
    );

    ganho.gain.setValueAtTime(
        .001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .12,
        agora + .12
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .9
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(agora + .9);

}


/* =========================================
   SOM DE VOO
========================================= */

let somVoo = null;
let ganhoVoo = null;

function iniciarSomVoo(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomVoo();

    somVoo =
        audioContext.createOscillator();

    ganhoVoo =
        audioContext.createGain();

    somVoo.type =
        "triangle";

    somVoo.frequency.value =
        105;

    ganhoVoo.gain.value =
        .025;

    somVoo.connect(
        ganhoVoo
    );

    ganhoVoo.connect(
        audioContext.destination
    );

    somVoo.start();

}


function pararSomVoo(){

    if(
        somVoo &&
        ganhoVoo &&
        audioContext
    ){

        const agora =
            audioContext.currentTime;

        ganhoVoo.gain.exponentialRampToValueAtTime(
            .001,
            agora + .15
        );

        try{

            somVoo.stop(
                agora + .16
            );

        }catch(e){}

        somVoo = null;
        ganhoVoo = null;

    }

}


/* =========================================
   SOM "VUM"
========================================= */

function somVum(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "sine";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        70,
        agora + .3
    );

    ganho.gain.setValueAtTime(
        .001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .18,
        agora + .03
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .35
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(agora + .36);

}


/* =========================================
   SELECIONAR VALOR
========================================= */

window.selecionarValor =
function(valor,botao){

    valorSelecionado =
        Number(valor);

    document
        .querySelectorAll(".valor")
        .forEach(
            b =>
            b.classList.remove("ativo")
        );

    botao.classList.add("ativo");

};


/* =========================================
   ANIMAÇÃO
========================================= */

function iniciarVoo(){

    multiplicador = 1;

    voando = true;

    numero.innerText =
        "1.00x";

    numero.style.color =
        "#00ff88";

    mensagem.innerText =
        "✈️ DECOLANDO...";

    mensagem.style.color =
        "#00ff88";

    fundoVelocidade.classList.add(
        "ativo"
    );

    somDecolagem();

    setTimeout(
        iniciarSomVoo,
        700
    );

    intervalo =
        setInterval(
            function(){

                multiplicador +=
                    0.03 +
                    multiplicador * 0.008;

                numero.innerText =
                    multiplicador.toFixed(2) +
                    "x";

                numero.style.color =
                    "#00ff88";

                let altura =
                    20 +
                    multiplicador * 24;

                if(altura > 210)
                    altura = 210;

                aviao.style.bottom =
                    altura + "px";

                let esquerda =
                    30 +
                    multiplicador * 8;

                if(esquerda > 300)
                    esquerda = 300;

                aviao.style.left =
                    esquerda + "px";

                let tamanho =
                    35 +
                    multiplicador * 38;

                if(tamanho > 240)
                    tamanho = 240;

                linha.style.height =
                    tamanho + "px";

                linha.style.left =
                    (esquerda + 18) +
                    "px";

                if(
                    multiplicador > 3 &&
                    multiplicador < 3.2
                ){

                    somVum();

                }

                if(
                    multiplicador > 6
                ){

                    fundoVelocidade.style.opacity =
                        ".8";

                }

                mensagem.innerText =
                    "✈️ VOANDO " +
                    multiplicador.toFixed(2) +
                    "x";

            },
            100
        );

}


/* =========================================
   CRASH VISUAL
========================================= */

function crash(){

    clearInterval(intervalo);

    pararSomVoo();

    voando = false;

    fundoVelocidade.classList.remove(
        "ativo"
    );

    numero.style.color =
        "#ff416d";

    numero.innerText =
        multiplicador.toFixed(2) +
        "x";

    mensagem.innerText =
        "💥 CRASH EM " +
        multiplicador.toFixed(2) +
        "x";

    mensagem.style.color =
        "#ff416d";

    area.style.borderColor =
        "#ff1744";

    somVum();

    setTimeout(
        function(){

            area.style.borderColor =
                "";

            aviao.style.left =
                "30px";

            aviao.style.bottom =
                "20px";

            linha.style.height =
                "0px";

            linha.style.left =
                "45px";

            numero.style.color =
                "#00ff88";

            numero.innerText =
                "1.00x";

            mensagem.innerText =
                "AVIÃO PRONTO PARA DECOLAR";

            mensagem.style.color =
                "";

        },
        1200
    );

}


/* =========================================
   HISTÓRICO VISUAL
========================================= */

function adicionarHistorico(valor){

    historico.unshift(valor);

    if(
        historico.length > 5
    ){

        historico.pop();

    }

    document.getElementById(
        "historico"
    ).innerHTML =
        "Últimas rodadas:<br>" +
        historico.join(" | ");

}


/* =========================================
   INICIAR
========================================= */

async function iniciar(){

    usuarioAtual =
        await obterUsuario();

    if(!usuarioAtual){

        alert(
            "Você precisa estar logado."
        );

        window.location.href =
            "../index.html";

        return;

    }

    const carregou =
        await carregarSaldo();

    if(!carregou){

        carregando.style.display =
            "none";

        return;

    }

    carregando.style.display =
        "none";

}


/* =========================================
   LOGIN
========================================= */

supabase
.auth
.onAuthStateChange(
    function(event,session){

        if(!session){

            window.location.href =
                "../index.html";

        }

    }
);


/*
   Inicialização
*/

iniciar();

</script>

</body>
</html>
