<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash ApostaXBet</title>

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

#saldo{
    color:#00ff88;
    font-size:22px;
    margin:15px;
}

.box{
    width:90%;
    max-width:400px;
    margin:auto;
    background:#111;
    border:2px solid #ffd700;
    border-radius:20px;
    padding:20px;
}

#numero{
    font-size:55px;
    color:#00ff88;
}

.area{
    height:220px;
    background:linear-gradient(#000,#101010);
    border-radius:15px;
    overflow:hidden;
    position:relative;
    border:1px solid #333;
}


#linha{
    position:absolute;
    width:4px;
    height:0;
    background:#00ff88;
    bottom:20px;
    left:50px;
    transform:rotate(-35deg);
    box-shadow:0 0 15px #00ff88;
}


#foguete{
    position:absolute;
    bottom:20px;
    left:40px;
    font-size:60px;
    transition:.15s;
}


input{
    width:100px;
    padding:10px;
    margin:15px;
    border-radius:10px;
}


button{
    padding:15px 30px;
    border:0;
    border-radius:12px;
    background:#ffd700;
    font-weight:bold;
    font-size:18px;
}


.sacar{
    background:#00ff88;
}


#historico{
    margin-top:20px;
    color:#aaa;
}


</style>

</head>


<body>


<h1>🚀 Crash ApostaXBet</h1>


<div id="saldo"></div>


<div class="box">


<div id="numero">
1.00x
</div>


<div class="area">

<div id="linha"></div>

<div id="foguete">
🚀
</div>

</div>


<input id="aposta" type="number" value="1">


<br>


<button onclick="jogar()">
JOGAR
</button>


<button class="sacar" onclick="sacar()">
SACAR
</button>


<div id="historico">
Últimas rodadas:
</div>


</div>



<script>


let saldo=Number(localStorage.getItem("saldo")||2);

let rodando=false;

let valor=1;

let aposta=0;

let queda;

let tempo;


let historico=[];



function atualizar(){

document.getElementById("saldo").innerHTML=
"💰 Saldo: R$ "+saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}

atualizar();



function jogar(){


if(rodando)return;


aposta=Number(document.getElementById("aposta").value);


if(aposta<=0 || aposta>saldo){

alert("Saldo inválido");
return;

}


saldo-=aposta;

atualizar();


valor=1;

queda=Math.random()*5+1;


rodando=true;


tempo=setInterval(()=>{


valor+=0.05;


document.getElementById("numero").innerHTML=
valor.toFixed(2)+"x";


document.getElementById("foguete").style.bottom=
20+valor*12+"px";


document.getElementById("linha").style.height=
valor*30+"px";



if(valor>=queda){


finalizar();


}


},120);


}



function sacar(){


if(!rodando)return;


let premio=aposta*valor;


saldo+=premio;


atualizar();


alert("🎉 Ganhou R$ "+premio.toFixed(2));


finalizar();



}



function finalizar(){


clearInterval(tempo);


historico.unshift(valor.toFixed(2)+"x");


if(historico.length>5)
historico.pop();



document.getElementById("historico").innerHTML=
"Últimas rodadas:<br>"+
historico.join(" | ");



rodando=false;


valor=1;


document.getElementById("numero").innerHTML="1.00x";


document.getElementById("linha").style.height="0px";


document.getElementById("foguete").style.bottom="20px";


}


</script>

</body>
</html>
