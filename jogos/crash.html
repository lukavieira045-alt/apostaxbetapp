<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{

    margin:0;

    min-height:100vh;

    background:
    radial-gradient(circle at 20% 20%,#002b55,transparent 30%),
    radial-gradient(circle at 80% 70%,#33002f,transparent 30%),
    linear-gradient(135deg,#02030a,#080014,#001322);

    background-size:180% 180%;

    animation:fundo 10s ease-in-out infinite alternate;

    color:white;

    text-align:center;

    overflow-x:hidden;
}

@keyframes fundo{

    0%{
        background-position:0% 0%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 100%;
    }

}

.luz{

    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.35;

    pointer-events:none;

    z-index:-3;
}

.luz1{

    background:#0066ff;

    left:-120px;
    top:10%;

    animation:luz1 8s infinite alternate;
}

.luz2{

    background:#ff0088;

    right:-120px;
    bottom:10%;

    animation:luz2 9s infinite alternate;
}

@keyframes luz1{

    to{
        transform:translate(180px,100px) scale(1.4);
    }

}

@keyframes luz2{

    to{
        transform:translate(-180px,-100px) scale(1.4);
    }

}

.particulas{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-2;
}

.particulas span{

    position:absolute;

    bottom:-20px;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#00ffcc;

    box-shadow:
    0 0 8px #00ffcc,
    0 0 18px #0088ff;

    animation:subir linear infinite;
}

.particulas span:nth-child(1){
    left:5%;
    animation-duration:6s;
}

.particulas span:nth-child(2){
    left:15%;
    animation-duration:9s;
}

.particulas span:nth-child(3){
    left:25%;
    animation-duration:7s;
}

.particulas span:nth-child(4){
    left:35%;
    animation-duration:11s;
}

.particulas span:nth-child(5){
    left:45%;
    animation-duration:8s;
}

.particulas span:nth-child(6){
    left:55%;
    animation-duration:10s;
}

.particulas span:nth-child(7){
    left:65%;
    animation-duration:7s;
}

.particulas span:nth-child(8){
    left:75%;
    animation-duration:9s;
}

.particulas span:nth-child(9){
    left:85%;
    animation-duration:6s;
}

.particulas span:nth-child(10){
    left:95%;
    animation-duration:12s;
}

@keyframes subir{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }

}

h1{

    margin-top:22px;

.box{

#numero{

}

@keyframes pulsar{

/* =================================
   ÁREA DO AVIÃO
================================= */

.area{

    overflow:hidden;

    position:relative;

    border:1px solid rgba(0,255,136,.35);

    box-shadow:
    inset 0 0 40px rgba(0,0,0,.8);
}

.grade{

    position:absolute;

    inset:-200px;

    opacity:.13;

    background-image:

    linear-gradient(
        rgba(0,255,136,.35) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,255,136,.35) 1px,
        transparent 1px
    );

    background-size:35px 35px;

    transition:
    transform .2s linear;
}

/* =================================
   LINHA DE MULTIPLICADORES
================================= */

.eixo{

    position:absolute;

    left:10px;

    top:15px;

    bottom:15px;

    width:65px;

    z-index:10;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}

.marca{

    position:relative;

    color:#444;

    font-size:10px;

    font-weight:bold;

    text-align:left;

    transition:
    color .2s,
    text-shadow .2s;
}

.marca::after{

    content:"";

    position:absolute;

    left:38px;

    top:6px;

    width:20px;

    height:2px;

    background:#333;

    transition:.2s;
}

.marca.ativo{

    color:#00ff88;

    text-shadow:
    0 0 8px #00ff88;
}

.marca.ativo::after{

    background:#00ff88;

    box-shadow:
    0 0 8px #00ff88;
}

.linha-eixo{

    position:absolute;

    left:48px;

    top:15px;

    bottom:15px;

    width:2px;

    background:
    linear-gradient(
        to top,
        rgba(0,255,136,.1),
        rgba(0,255,136,.55),
        rgba(0,255,136,.1)
    );

    z-index:4;
}

/* =================================
   LINHA DO VOO
================================= */

#linha{

    position:absolute;

    width:4px;

    height:0;

    background:
    linear-gradient(
        to top,
        #00ff88,
        #00ffff
    );

    bottom:35px;

    left:90px;

    transform-origin:bottom center;

    transform:rotate(-35deg);

    border-radius:10px;

    box-shadow:
    0 0 8px #00ff88,
    0 0 20px #00ff88,
    0 0 35px #00ffff;

    transition:
    height .12s,
    left .12s;
}

/* =================================
   AVIÃO
================================= */

#aviao{

    position:absolute;

    bottom:30px;

    left:82px;

    font-size:46px;

    z-index:20;

    filter:
    drop-shadow(0 0 8px #00ccff)
    drop-shadow(0 0 18px #0088ff);

    transition:
    bottom .12s,
    left .12s,
    transform .12s;

    transform:rotate(-18deg);
}

#aviao.voando{

    animation:
    balanco .25s infinite alternate;
}

@keyframes balanco{

    from{
        transform:
        rotate(-17deg)
        translateY(0);
    }

    to{
        transform:
        rotate(-13deg)
        translateY(-3px);
    }

}

.rastro{

    position:absolute;

    width:70px;

    height:4px;

    left:45px;

    bottom:48px;

    border-radius:10px;

    background:
    linear-gradient(
        to left,
        rgba(0,255,255,.9),
        transparent
    );

    opacity:0;

    z-index:12;

    transform:rotate(-18deg);
}

.rastro.ativo{

    opacity:1;

    animation:
    rastro .2s infinite alternate;
}

@keyframes rastro{

    from{
        width:50px;
    }

    to{
        width:95px;
    }

}

/* =================================
   ENERGIA
================================= */

#energia{

    position:absolute;

    width:180px;

    height:180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(0,255,136,.55),
        rgba(0,150,255,.15),
        transparent 70%
    );

    filter:blur(15px);

    left:40px;

    bottom:0;

    opacity:.2;

    transform:scale(.7);

    transition:
    transform .15s,
    opacity .15s;
}

/* =================================
   CRASH
================================= */

.area.crash{

    animation:
    tremer .35s;

    border-color:#ff1744;

    box-shadow:
    0 0 25px #ff1744,
    inset 0 0 50px rgba(255,0,40,.4);
}

@keyframes tremer{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-5px);
    }

    100%{
        transform:translateX(0);
    }

}

/* =================================

================================= */

.apostas-titulo{

}

.apostas{

    display:grid;

.aposta-btn{

button{

/* =================================

/* =================================

#historico{

    }

        repeat(3,1fr);
    }

}

<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let rodando = false;

let valor = 1;

let aposta = 1;

let queda = 0;

let tempo = null;

let historico = [];

let audioContext = null;

let osciladorMotor = null;

let ganhoMotor = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const numero =
document.getElementById("numero");

const aviao =
document.getElementById("aviao");

const linha =
document.getElementById("linha");

const energia =
document.getElementById("energia");

const rastro =
document.getElementById("rastro");

const area =
document.getElementById("area");

const grade =
document.getElementById("grade");

const mensagem =
document.getElementById("mensagem");

const voarBtn =
document.getElementById("voarBtn");


/* =====================================================
   SALDO REAL — SOMENTE LEITURA
===================================================== */

async function atualizarSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const saldo =
                await window.SistemaSaldo.get();

            document.getElementById("saldo").innerText =
                "💰 Saldo: R$ " +
                Number(saldo || 0)
                .toFixed(2)
                .replace(".",",");

            return;
        }

    }catch(error){

        console.error(
            "Erro ao consultar saldo:",
            error
        );

    }

    document.getElementById("saldo").innerText =
        "💰 Saldo: indisponível";
}


/* =====================================================
   ÁUDIO
===================================================== */

function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }
}


/* =====================================================
   SOM DE DECOLAGEM
===================================================== */

function somDecolagem(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        80,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        280,
        agora + .8
    );

    ganho.gain.setValueAtTime(
        .0001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .10,
        agora + .15
    );

    ganho.gain.exponentialRampToValueAtTime(
        .0001,
        agora + .9
    );

    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);

    osc.stop(
        agora + .95
    );
}


/* =====================================================
   SOM DO VOO
===================================================== */

function iniciarSomVoo(){

    iniciarAudio();

    if(!audioContext)
        return;

    pararSomVoo();

    osciladorMotor =
        audioContext.createOscillator();

    ganhoMotor =
        audioContext.createGain();

    osciladorMotor.type =
        "triangle";

    osciladorMotor.frequency.setValueAtTime(
        115,
        audioContext.currentTime
    );

    ganhoMotor.gain.setValueAtTime(
        .025,
        audioContext.currentTime
    );

    osciladorMotor.connect(
        ganhoMotor
    );

    ganhoMotor.connect(
        audioContext.destination
    );

    osciladorMotor.start();
}


/* =====================================================
   VUUUM
===================================================== */

function somVuum(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        agora + .35
    );

    ganho.gain.setValueAtTime(
        .0001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .12,
        agora + .08
    );

    ganho.gain.exponentialRampToValueAtTime(
        .0001,
        agora + .5
    );

    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);

    osc.stop(
        agora + .55
    );
}


/* =====================================================
   PARAR MOTOR
===================================================== */

function pararSomVoo(){

    if(
        osciladorMotor &&
        ganhoMotor &&
        audioContext
    ){

        const agora =
            audioContext.currentTime;

        ganhoMotor.gain.cancelScheduledValues(
            agora
        );

        ganhoMotor.gain.setValueAtTime(
            .025,
            agora
        );

        ganhoMotor.gain.exponentialRampToValueAtTime(
            .0001,
            agora + .25
        );

        try{

            osciladorMotor.stop(
                agora + .3
            );

        }catch(e){}

        osciladorMotor = null;

        ganhoMotor = null;
    }
}


/* =====================================================
   APOSTA
===================================================== */

function selecionarAposta(
    valorEscolhido,
    botao
){

    if(rodando)
        return;

    iniciarAudio();

    aposta =
        Number(valorEscolhido);

    document
    .querySelectorAll(".aposta-btn")
    .forEach(
        function(btn){

            btn.classList.remove(
                "ativo"
            );

        }
    );

    botao.classList.add(
        "ativo"
    );
}


/* =====================================================
   MARCAS
===================================================== */

function atualizarMarcas(){

    document
    .querySelectorAll(".marca")
    .forEach(
        function(marca){

            const multiplicador =
                Number(
                    marca.dataset.multi
                );

            if(
                valor >=
                multiplicador
            ){

                marca.classList.add(
                    "ativo"
                );

            }else{

                marca.classList.remove(
                    "ativo"
                );

            }

        }
    );
}


/* =====================================================
   ACOMPANHAR AVIÃO
===================================================== */

function acompanharAviao(){

    /*
       O avião fica próximo do centro.
       A grade se move para baixo conforme
       ele sobe, criando o efeito de câmera
       acompanhando o voo.
    */

    const deslocamento =
        Math.max(
            0,
            (valor - 1) * 28
        );

    grade.style.transform =
        "translateY(" +
        deslocamento +
        "px)";

    /*
       Mantém o avião sempre dentro
       da área visível.
    */

    let altura =
        30 +
        (valor - 1) * 38;

    if(altura > 225){

        altura =
            225;

    }

    aviao.style.bottom =
        altura + "px";

    /*
       Movimento horizontal limitado.
    */

    let esquerda =
        82 +
        (valor - 1) * 12;

    if(esquerda > 315){

        esquerda =
            315;

    }

    aviao.style.left =
        esquerda + "px";

    /*
       Linha acompanha o avião.
    */

    let tamanho =
        (valor - 1) * 42;

    if(tamanho > 220){

        tamanho =
            220;

    }

    linha.style.height =
        tamanho + "px";

    linha.style.left =
        (esquerda + 8) + "px";
}


/* =====================================================
   INICIAR
===================================================== */

function voar(){

    if(rodando)
        return;

    iniciarAudio();

    rodando =
        true;

    valor =
        1;

    /*
       Resultado visual aleatório.
    */

    queda =
        Math.random() * 3.5 + 1.3;

    mensagem.className =
        "";

    mensagem.innerHTML =
        "✈️ AVIÃO DECOLANDO...";

    numero.innerHTML =
        "1.00x";

    numero.style.color =
        "#00ff88";

    area.classList.remove(
        "crash"
    );

    aviao.classList.add(
        "voando"
    );

    rastro.classList.add(
        "ativo"
    );

    numero.classList.add(
        "subindo"
    );

    voarBtn.disabled =
        true;

    somDecolagem();

    setTimeout(
        function(){

            if(rodando){

                iniciarSomVoo();

            }

        },
        700
    );

    tempo =
        setInterval(
            function(){

                valor +=
                    .05;

                numero.innerHTML =
                    valor.toFixed(2) +
                    "x";

                atualizarMarcas();

                acompanharAviao();

                /*
                   Energia.
                */

                let escala =
                    .7 +
                    valor * .12;

                if(
                    escala >
                    2.7
                ){

                    escala =
                        2.7;

                }

                energia.style.transform =
                    "scale(" +
                    escala +
                    ")";

                energia.style.opacity =
                    Math.min(
                        .2 +
                        valor * .045,
                        .85
                    );

                /*
                   Efeito rápido.
                */

                if(
                    valor > 2 &&
                    Math.abs(
                        valor % 1
                    ) < .051
                ){

                    somVuum();

                }

                /*
                   Crash visual.
                */

                if(
                    valor >=
                    queda
                ){

                    finalizarCrash();

                }

            },
            100
        );
}


/* =====================================================
   SACAR — CONTROLE VISUAL DA RODADA
===================================================== */

function sacar(){

    if(!rodando)
        return;

    const multiplicador =
        valor.toFixed(2);

    mensagem.className =
        "mensagemSaque";

    mensagem.innerHTML =
        "💰 Saque solicitado em " +
        multiplicador +
        "x";

    adicionarHistorico(
        multiplicador + "x"
    );

    pararJogo();
}


/* =====================================================
   CRASH
===================================================== */

function finalizarCrash(){

    clearInterval(
        tempo
    );

    pararSomVoo();

    rodando =
        false;

    numero.classList.remove(
        "subindo"
    );

    aviao.classList.remove(
        "voando"
    );

    rastro.classList.remove(
        "ativo"
    );

    area.classList.add(
        "crash"
    );

    numero.style.color =
        "#ff416d";

    numero.style.textShadow =
        "0 0 10px #ff1744," +
        "0 0 30px #ff1744";

    mensagem.className =
        "mensagemCrash";

    mensagem.innerHTML =
        "💥 CRASH em " +
        valor.toFixed(2) +
        "x";

    adicionarHistorico(
        valor.toFixed(2) +
        "x"
    );

    voarBtn.disabled =
        false;

    setTimeout(
        function(){

            resetarAviao();

        },
        900
    );
}


/* =====================================================
   PARAR
===================================================== */

function pararJogo(){

    clearInterval(
        tempo
    );

    pararSomVoo();

    rodando =
        false;

    numero.classList.remove(
        "subindo"
    );

    aviao.classList.remove(
        "voando"
    );

    rastro.classList.remove(
        "ativo"
    );

    voarBtn.disabled =
        false;

    resetarAviao();
}


/* =====================================================
   RESETAR AVIÃO
===================================================== */

function resetarAviao(){

    numero.style.color =
        "#00ff88";

    numero.style.textShadow =
        "0 0 8px #00ff88," +
        "0 0 25px #00ff88";

    area.classList.remove(
        "crash"
    );

    aviao.style.bottom =
        "30px";

    aviao.style.left =
        "82px";

    linha.style.height =
        "0px";

    linha.style.left =
        "90px";

    grade.style.transform =
        "translateY(0px)";

    energia.style.transform =
        "scale(.7)";

    energia.style.opacity =
        ".2";

    numero.innerHTML =
        "1.00x";

    valor =
        1;

    atualizarMarcas();

    atualizarSaldo();
}


/* =====================================================
   HISTÓRICO
===================================================== */

function adicionarHistorico(
    valorHistorico
){

    historico.unshift(
        valorHistorico
    );

    if(
        historico.length >
        5
    ){

        historico.pop();

    }

    document.getElementById(
        "historico"
    ).innerHTML =

        "Últimas rodadas:<br>" +
        historico.join(" | ");
}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarSaldo();

atualizarMarcas();

</script>
