<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dice ApostaXBet</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 15% 15%,#0066ff 0,transparent 25%),
radial-gradient(circle at 85% 20%,#e600ff 0,transparent 25%),
radial-gradient(circle at 50% 100%,#ff0066 0,transparent 30%),
linear-gradient(135deg,#02020c,#09001c,#00132c);

background-size:180% 180%;
animation:fundo 12s ease-in-out infinite alternate;
}

@keyframes fundo{
0%{background-position:0% 0%}
50%{background-position:100% 50%}
100%{background-position:0% 100%}
}


/* LUZES */

.luz{
position:fixed;
width:280px;
height:280px;
border-radius:50%;
filter:blur(90px);
opacity:.45;
pointer-events:none;
z-index:-2;
}

.luz1{
background:#0066ff;
left:-100px;
top:15%;
animation:mov1 8s infinite alternate;
}

.luz2{
background:#ff0088;
right:-100px;
top:40%;
animation:mov2 9s infinite alternate;
}

.luz3{
background:#7b00ff;
left:30%;
bottom:-180px;
animation:mov3 7s infinite alternate;
}

@keyframes mov1{
to{transform:translate(180px,100px) scale(1.3)}
}

@keyframes mov2{
to{transform:translate(-150px,-80px) scale(1.4)}
}

@keyframes mov3{
to{transform:translate(80px,-100px) scale(1.3)}
}


/* PARTÍCULAS */

.particulas{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1;
}

.particulas i{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:white;

box-shadow:
0 0 10px #00ccff,
0 0 20px #ff00aa;

animation:subir linear infinite;
}

.particulas i:nth-child(1){left:5%;animation-duration:7s}
.particulas i:nth-child(2){left:15%;animation-duration:11s}
.particulas i:nth-child(3){left:25%;animation-duration:8s}
.particulas i:nth-child(4){left:35%;animation-duration:13s}
.particulas i:nth-child(5){left:45%;animation-duration:9s}
.particulas i:nth-child(6){left:55%;animation-duration:12s}
.particulas i:nth-child(7){left:65%;animation-duration:8s}
.particulas i:nth-child(8){left:75%;animation-duration:10s}
.particulas i:nth-child(9){left:85%;animation-duration:7s}
.particulas i:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh);
opacity:0;
}
}


/* SALDO REAL */

#saldo{
display:inline-block;

margin:15px auto 5px;

padding:10px 22px;

border-radius:30px;

background:rgba(0,0,0,.6);

border:1px solid #00ff91;

color:#00ff91;

font-size:21px;

font-weight:bold;
}


/* TÍTULO */

.titulo{
margin-top:8px;

font-size:44px;

font-weight:900;

color:#ffd21c;

text-shadow:
0 0 8px #fff,
0 0 18px #ffd21c,
0 0 35px #ff8c00;
}


/* CAIXA */

.caixa{
width:92%;
max-width:440px;

margin:auto;

padding:25px 18px 30px;

border-radius:28px;

background:
linear-gradient(
145deg,
rgba(20,20,35,.94),
rgba(3,4,15,.96)
);

box-shadow:
0 0 25px rgba(255,215,0,.25),
0 0 70px rgba(0,100,255,.18);

backdrop-filter:blur(12px);
}


/* =====================================================
   ÁREA DOS DADOS
   SEM QUADRADO/TELA PRETA ATRÁS
===================================================== */

.area-dados{

height:250px;

display:flex;

align-items:center;

justify-content:center;

gap:28px;

position:relative;

background:transparent !important;

border:0 !important;

box-shadow:none !important;

overflow:visible;

perspective:700px;
}


/* SOMBRAS DOS DADOS */

.sombra{

position:absolute;

bottom:42px;

width:150px;
height:18px;

border-radius:50%;

background:rgba(0,0,0,.45);

filter:blur(14px);

opacity:.6;

pointer-events:none;
}


/* =====================================================
   DADOS
===================================================== */

.dado{

position:relative;

z-index:2;

font-family:
"Noto Color Emoji",
"Apple Color Emoji",
"Segoe UI Emoji",
sans-serif;

font-size:68px;

line-height:1;

display:block;

width:78px;
height:78px;

user-select:none;

will-change:transform;

filter:
drop-shadow(0 12px 8px rgba(0,0,0,.75))
drop-shadow(0 0 12px rgba(255,215,0,.25));

transform-origin:center center;
}


/* =====================================================
   ROLAGEM DOS DADOS
===================================================== */

.dado.rolando1{

animation:
rolagemDado1
1900ms
cubic-bezier(.15,.72,.18,1)
both;
}

.dado.rolando2{

animation:
rolagemDado2
1900ms
cubic-bezier(.15,.72,.18,1)
both;
}


/* PRIMEIRO DADO */

@keyframes rolagemDado1{

0%{
transform:
translate3d(-20px,35px,0)
rotateX(0deg)
rotateY(0deg)
rotateZ(0deg)
scale(1);
}

12%{
transform:
translate3d(-45px,-45px,20px)
rotateX(180deg)
rotateY(120deg)
rotateZ(90deg)
scale(1.02);
}

25%{
transform:
translate3d(-15px,-78px,30px)
rotateX(360deg)
rotateY(270deg)
rotateZ(180deg)
scale(.98);
}

38%{
transform:
translate3d(35px,-25px,15px)
rotateX(540deg)
rotateY(420deg)
rotateZ(300deg)
scale(1.04);
}

52%{
transform:
translate3d(45px,-65px,25px)
rotateX(720deg)
rotateY(570deg)
rotateZ(450deg)
scale(.98);
}

66%{
transform:
translate3d(20px,-12px,10px)
rotateX(900deg)
rotateY(720deg)
rotateZ(600deg)
scale(1.03);
}

78%{
transform:
translate3d(-18px,-35px,5px)
rotateX(1040deg)
rotateY(830deg)
rotateZ(700deg)
scale(1);
}

89%{
transform:
translate3d(8px,-8px,0)
rotateX(1140deg)
rotateY(900deg)
rotateZ(770deg)
scale(1);
}

96%{
transform:
translate3d(-3px,3px,0)
rotateX(1180deg)
rotateY(930deg)
rotateZ(795deg)
scale(1);
}

100%{
transform:
translate3d(0,0,0)
rotateX(1200deg)
rotateY(960deg)
rotateZ(810deg)
scale(1);
}

}


/* SEGUNDO DADO */

@keyframes rolagemDado2{

0%{
transform:
translate3d(20px,35px,0)
rotateX(0deg)
rotateY(0deg)
rotateZ(0deg)
scale(1);
}

12%{
transform:
translate3d(45px,-48px,20px)
rotateX(-180deg)
rotateY(-120deg)
rotateZ(-90deg)
scale(1.02);
}

25%{
transform:
translate3d(15px,-80px,30px)
rotateX(-360deg)
rotateY(-270deg)
rotateZ(-180deg)
scale(.98);
}

38%{
transform:
translate3d(-35px,-25px,15px)
rotateX(-540deg)
rotateY(-420deg)
rotateZ(-300deg)
scale(1.04);
}

52%{
transform:
translate3d(-45px,-68px,25px)
rotateX(-720deg)
rotateY(-570deg)
rotateZ(-450deg)
scale(.98);
}

66%{
transform:
translate3d(-20px,-12px,10px)
rotateX(-900deg)
rotateY(-720deg)
rotateZ(-600deg)
scale(1.03);
}

78%{
transform:
translate3d(18px,-35px,5px)
rotateX(-1040deg)
rotateY(-830deg)
rotateZ(-700deg)
scale(1);
}

89%{
transform:
translate3d(-8px,-8px,0)
rotateX(-1140deg)
rotateY(-900deg)
rotateZ(-770deg)
scale(1);
}

96%{
transform:
translate3d(3px,3px,0)
rotateX(-1180deg)
rotateY(-930deg)
rotateZ(-795deg)
scale(1);
}

100%{
transform:
translate3d(0,0,0)
rotateX(-1200deg)
rotateY(-960deg)
rotateZ(-810deg)
scale(1);
}

}


/* RESULTADO */

#resultadoDados{

min-height:42px;

margin:5px 0 10px;

font-size:26px;

font-weight:bold;

color:#ffd21c;

text-shadow:
0 0 12px #ffd21c;
}

#resultado{

min-height:40px;

margin:5px 0 18px;

font-size:22px;

font-weight:bold;

color:#ffd21c;

text-shadow:
0 0 12px #ffd21c;
}

.vitoria{

color:#00ff91 !important;

text-shadow:
0 0 10px #00ff91,
0 0 30px #00ff91 !important;
}

.derrota{

color:#ff416d !important;

text-shadow:
0 0 10px #ff416d,
0 0 25px #ff416d !important;
}


/* NÚMEROS */

.selecao{
margin:10px auto 18px;
}

.selecao-titulo{

font-size:14px;

color:#aaa;

margin-bottom:10px;
}

.numeros{

display:flex;

justify-content:center;

gap:7px;
}

.numero{

width:45px;
height:45px;

padding:0;
margin:0;

border-radius:50%;

border:1px solid #4b5870;

background:
linear-gradient(
180deg,
#18253d,
#080f1c
);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

box-shadow:none;
}

.numero.ativo{

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

border-color:#ffe78a;

box-shadow:
0 0 14px rgba(255,210,28,.55);
}


/* APOSTA */

.aposta-area{
margin:10px auto;
}

label{

display:block;

color:#aaa;

font-size:14px;

margin-bottom:6px;
}

input{

width:170px;

padding:13px;

border-radius:13px;

border:2px solid #444;

background:#050505;

color:white;

font-size:20px;

font-weight:bold;

text-align:center;

outline:none;
}

input:focus{

border-color:#ffd21c;

box-shadow:0 0 10px #ffd21c;
}


/* BOTÃO */

button#botao{

width:90%;

max-width:320px;

margin-top:15px;

padding:17px;

border:2px solid #ffe78a;

border-radius:16px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

font-size:22px;

font-weight:900;

cursor:pointer;

box-shadow:
0 0 12px #ffd21c,
0 0 35px rgba(255,170,0,.45);
}

button#botao:active{
transform:scale(.95);
}

button#botao:disabled{
opacity:.55;
}


/* INFO */

.info{

margin-top:25px;

padding-top:18px;

border-top:1px solid rgba(255,255,255,.12);

font-size:14px;

line-height:1.7;
}

.ganha{
color:#00ff91;
}

.perde{
color:#ff416d;

/* CELULAR */

@media(max-width:450px){

.titulo{
font-size:38px;
}

.area-dados{

}

.dado{

}

.numero{

height:42px;
}

}

</style>

</head>


<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>
<div class="luz luz3"></div>


<div class="particulas">

<i></i>

<h1 class="titulo">
🎲 DICE
</h1>


<div id="saldo">
💰 Saldo: R$ 0,00
</div>


<div class="caixa">

<div class="area-dados">

<div class="sombra"></div>

<div id="dado1" class="dado">⚀</div>

<div id="dado2" class="dado">⚀</div>

</div>


<div id="resultadoDados">
⚀ + ⚀ = 2
</div>

Escolha sua sorte
</div>

<div class="selecao-titulo">
ESCOLHA O NÚMERO
</div>

<button class="numero ativo" data-numero="1">1</button>
<button class="numero" data-numero="2">2</button>
<button class="numero" data-numero="3">3</button>
<button class="numero" data-numero="4">4</button>
<button class="numero" data-numero="5">5</button>
<button class="numero" data-numero="6">6</button>

</div>

</div>

<label>
VALOR DA APOSTA
</label>

<input
id="aposta"
type="number"
value="1"
min="0.10"
step="0.10"
>

</div>

🎲 JOGAR
</button>


<div class="info">

<div class="ganha">
🎉 Se o número escolhido aparecer em um dos dados = GANHA 2X
</div>

<div class="perde">
😢 Se não aparecer = PERDE
</div>

</div>

<script type="module" src="../saldo.js"></script>


<script>

/* =====================================================
   FACES REAIS DOS DADOS
===================================================== */

const FACES = [
"⚀",
"⚁",
"⚂",
"⚃",
"⚄",
"⚅"
];


/* =====================================================
   ELEMENTOS
===================================================== */

const saldoEl =
document.getElementById("saldo");

const dado1 =
document.getElementById("dado1");

const dado2 =
document.getElementById("dado2");

const resultadoDados =
document.getElementById("resultadoDados");

const resultado =
document.getElementById("resultado");

const botao =
document.getElementById("botao");

const apostaInput =
document.getElementById("aposta");

const botoesNumero =
document.querySelectorAll(".numero");


let numeroEscolhido = 1;
let jogando = false;


/* =====================================================
   SALDO REAL
===================================================== */

async function atualizarSaldo(){

try{

if(
window.SistemaSaldo &&
typeof window.SistemaSaldo.get === "function"
){

const valor =
await window.SistemaSaldo.get();

if(
typeof valor === "number" &&
Number.isFinite(valor)
){

saldoEl.textContent =
"💰 Saldo: R$ " +
valor.toFixed(2).replace(".",",");

}

}

}catch(erro){

console.error(
"Erro ao atualizar saldo:",
erro
);

}

}


/* =====================================================
   ESCOLHA DO NÚMERO
===================================================== */

botoesNumero.forEach(
botaoNumero=>{

botaoNumero.addEventListener(
"click",
()=>{

if(jogando)
return;

botoesNumero.forEach(
b=>b.classList.remove("ativo")
);

botaoNumero.classList.add("ativo");

numeroEscolhido =
Number(
botaoNumero.dataset.numero
);

resultado.className="";

resultado.textContent =
"🎯 Número escolhido: " +
numeroEscolhido;

});

});


/* =====================================================
   VIBRAÇÃO
===================================================== */

function vibrar(){

if(
navigator.vibrate
){

navigator.vibrate([
35,
35,
30,
35,
25,
35,
20
]);

}

}


/* =====================================================
   SOM DE DADO
===================================================== */

let audioCtx = null;

function somDado(){

try{

if(!audioCtx){

audioCtx =
new(
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioCtx.state === "suspended"
){

audioCtx.resume();

}

const agora =
audioCtx.currentTime;


/*
   PEQUENOS IMPACTOS,
   COMO DADO QUICANDO
*/

for(
let i=0;
i<12;
i++
){

const osc =
audioCtx.createOscillator();

const ganho =
audioCtx.createGain();

osc.type="triangle";

osc.frequency.value =
70 +
Math.random()*170;

const inicio =
agora +
i*0.14;

ganho.gain.setValueAtTime(
0.0001,
inicio
);

ganho.gain.exponentialRampToValueAtTime(
0.07,
inicio+0.008
);

ganho.gain.exponentialRampToValueAtTime(
0.0001,
inicio+0.065
);

osc.connect(ganho);

ganho.connect(
audioCtx.destination
);

osc.start(inicio);

osc.stop(
inicio+0.075
);

}

}catch(erro){

console.log(
"Áudio indisponível:",
erro
);

}

}


/* =====================================================
   ANIMAÇÃO DAS FACES
===================================================== */

let intervaloFaces = null;

function iniciarMisturaFaces(){

let contador = 0;

clearInterval(
intervaloFaces
);

intervaloFaces =
setInterval(
()=>{

/*
   Durante a rolagem,
   cada dado mostra faces
   diferentes rapidamente.
*/

const face1 =
Math.floor(
Math.random()*6
);

const face2 =
Math.floor(
Math.random()*6
);

dado1.textContent =
FACES[face1];

dado2.textContent =
FACES[face2];

contador++;

if(contador >= 12){

clearInterval(
intervaloFaces
);

}

},
145
);

}


/* =====================================================
   PARA NA FACE FINAL
===================================================== */

function mostrarResultadoFinal(
numero1,
numero2
){

dado1.textContent =
FACES[numero1-1];

dado2.textContent =
FACES[numero2-1];

resultadoDados.textContent =
FACES[numero1-1] +
" + " +
FACES[numero2-1] +
" = " +
(numero1+numero2);

}


/* =====================================================
   JOGAR
===================================================== */

botao.addEventListener(
"click",
async()=>{

if(jogando)
return;


/*
   SISTEMA REAL
*/

if(!window.SistemaSaldo){

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Sistema de saldo não encontrado.";

return;

}


const aposta =
Number(
apostaInput.value
);


/*
   VALIDAÇÃO
*/

if(
!Number.isFinite(aposta) ||
aposta < 0.10
){

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Aposta mínima: R$ 0,10.";

return;

}


/*
   CONSULTA SALDO REAL
*/

let saldoAtual;

try{

saldoAtual =
Number(
await window.SistemaSaldo.get()
);

}catch(erro){

console.error(erro);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Não foi possível consultar o saldo.";

return;

}


if(
!Number.isFinite(saldoAtual) ||
saldoAtual < aposta
){

resultado.className =
"derrota";

resultado.textContent =
"❌ Saldo insuficiente.";

await atualizarSaldo();

return;

}


/*
   BLOQUEIA
*/

jogando = true;

botao.disabled = true;


/*
   DEBITA SALDO REAL
*/

try{

await window.SistemaSaldo.debitar(
aposta
);

}catch(erro){

console.error(
"Erro ao debitar:",
erro
);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Não foi possível realizar a aposta.";

jogando = false;

botao.disabled = false;

await atualizarSaldo();

return;

}


/*
   MOSTRA SALDO DESCONTADO
*/

await atualizarSaldo();


/*
   MENSAGEM
*/

resultado.className="";

resultado.textContent =
"🎲 JOGANDO OS DADOS...";

resultadoDados.textContent =
"🎲 🎲";


/*
   SORTEIA OS DOIS RESULTADOS
   DE FORMA INDEPENDENTE
*/

const numero1 =
Math.floor(
Math.random()*6
)+1;

const numero2 =
Math.floor(
Math.random()*6
)+1;


/*
   REINICIA ANIMAÇÃO
*/

dado1.classList.remove(
"rolando1"
);

dado2.classList.remove(
"rolando2"
);

void dado1.offsetWidth;
void dado2.offsetWidth;


/*
   COMEÇA A ROLAGEM
*/

dado1.classList.add(
"rolando1"
);

dado2.classList.add(
"rolando2"
);


/*
   COMEÇA A MUDAR AS FACES
*/

iniciarMisturaFaces();


/*
   SOM
*/

somDado();


/*
   VIBRAÇÃO
*/

vibrar();


/*
   ESPERA A ROLAGEM
*/

setTimeout(
async()=>{

clearInterval(
intervaloFaces
);


dado1.classList.remove(
"rolando1"
);

dado2.classList.remove(
"rolando2"
);


/*
   AGORA OS DADOS PARAM
   NOS NÚMEROS SORTEADOS
*/

mostrarResultadoFinal(
numero1,
numero2
);


/*
   REGRA CORRETA:

   ESCOLHEU 3

   3 + 5 = GANHA

   2 + 5 = PERDE
*/

const acertou =
numero1 === numeroEscolhido ||
numero2 === numeroEscolhido;


/*
   GANHOU
*/

if(acertou){

const premio =
aposta*2;

try{

await window.SistemaSaldo.ganhar(
aposta,
2
);

resultado.className =
"vitoria";

resultado.textContent =
"🎉 GANHOU R$ " +
premio.toFixed(2).replace(".",",");

vibrar();

}catch(erro){

console.error(
"Erro ao registrar prêmio:",
erro
);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Erro ao registrar o prêmio.";

}

}


/*
   PERDEU
*/

else{

resultado.className =
"derrota";

resultado.textContent =
"😢 PERDEU! O número " +
numeroEscolhido +
" não saiu.";

}


/*
   SALDO REAL FINAL
*/

await atualizarSaldo();


/*
   LIBERA
*/

jogando = false;

botao.disabled = false;

},
1900
