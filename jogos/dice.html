<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dice ApostaXBet</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
overflow-x:hidden;
color:#fff;
text-align:center;

background:
radial-gradient(circle at 15% 20%,#19cfff 0,transparent 24%),
radial-gradient(circle at 85% 20%,#ff28bd 0,transparent 25%),
radial-gradient(circle at 50% 90%,#7b38ff 0,transparent 30%),
linear-gradient(135deg,#071329,#10051d,#06152b);

position:relative;
}

/* FUNDO */

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;

background:
radial-gradient(circle at 20% 30%,rgba(0,220,255,.18),transparent 22%),
radial-gradient(circle at 80% 70%,rgba(255,0,180,.16),transparent 25%);

animation:luzes 9s ease-in-out infinite alternate;
}

@keyframes luzes{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}

/* =====================================================
SALDO
===================================================== */

#saldo{

display:inline-block;

margin:20px auto 8px;

padding:10px 22px;

border:1px solid #00ff91;

border-radius:25px;

background:rgba(0,0,0,.45);

color:#00ff91;

font-size:20px;

font-weight:bold;

box-shadow:
0 0 18px rgba(0,255,145,.25);

}

/* =====================================================
TÍTULO
===================================================== */

.titulo{

margin:5px 0 8px;

font-size:42px;

font-weight:900;

color:#ffd21c;

text-shadow:
0 0 8px #fff,
0 0 20px #ffd21c,
0 0 35px #ff8c00;

}

/* =====================================================
ÁREA DOS DADOS
===================================================== */

.area-dados{

width:100%;
max-width:500px;
margin:auto;

min-height:230px;

display:flex;

justify-content:center;
align-items:center;

gap:25px;

position:relative;

perspective:700px;

}

/* =====================================================
DADO
===================================================== */

.dado{

width:62px;
height:62px;

position:relative;

flex:0 0 62px;

transform-style:preserve-3d;

margin:0;

user-select:none;

will-change:transform;

filter:
drop-shadow(
0 12px 8px rgba(0,0,0,.65)
)
drop-shadow(
0 0 12px rgba(255,215,0,.25)
);

}

/* CUBO */

.dado-cubo{

width:62px;
height:62px;

position:relative;

transform-style:preserve-3d;

}

/* FACES */

.face-dado{

position:absolute;

width:62px;
height:62px;

display:flex;

align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
#ffffff,
#dedede
);

border:2px solid #aaa;

border-radius:10px;

box-shadow:
inset 0 0 8px rgba(0,0,0,.25);

font-size:25px;

font-weight:900;

color:#111;

backface-visibility:hidden;

}

/* POSIÇÃO DAS FACES */

.face-1{
transform:translateZ(31px);
}

.face-6{
transform:
rotateY(180deg)
translateZ(31px);
}

.face-2{
transform:
rotateY(90deg)
translateZ(31px);
}

.face-5{
transform:
rotateY(-90deg)
translateZ(31px);
}

.face-3{
transform:
rotateX(90deg)
translateZ(31px);
}

.face-4{
transform:
rotateX(-90deg)
translateZ(31px);
}

/* =====================================================
ROLAGEM DOS DOIS DADOS
===================================================== */

.dado.girando{

animation:
dadoRolando
0.75s
cubic-bezier(.15,.75,.25,1)
forwards;

}

@keyframes dadoRolando{

0%{
transform:
translate3d(0,0,0)
rotateX(0deg)
rotateY(0deg)
rotateZ(0deg);
}

15%{
transform:
translate3d(-12px,-20px,0)
rotateX(110deg)
rotateY(80deg)
rotateZ(20deg);
}

35%{
transform:
translate3d(15px,-35px,0)
rotateX(250deg)
rotateY(180deg)
rotateZ(-35deg);
}

55%{
transform:
translate3d(-12px,-18px,0)
rotateX(410deg)
rotateY(300deg)
rotateZ(25deg);
}

75%{
transform:
translate3d(8px,-8px,0)
rotateX(530deg)
rotateY(420deg)
rotateZ(-15deg);
}

90%{
transform:
translate3d(-3px,2px,0)
rotateX(620deg)
rotateY(510deg)
rotateZ(5deg);
}

100%{
transform:
translate3d(0,0,0)
rotateX(720deg)
rotateY(540deg)
rotateZ(0deg);
}

}

/* =====================================================
RESULTADO
===================================================== */

.resultado-dados{

min-height:50px;

font-size:32px;

font-weight:900;

color:#ffd21c;

text-shadow:
0 0 15px #ffd21c;

}

/* =====================================================
MENSAGEM
===================================================== */

#mensagem{

min-height:35px;

font-size:21px;

font-weight:bold;

}

.ganha{
color:#00ff91 !important;
text-shadow:0 0 10px #00ff91;
}

.perde{
color:#ff416d !important;
text-shadow:0 0 10px #ff416d;
}

/* =====================================================
SELEÇÃO
===================================================== */

.selecao{

width:92%;
max-width:420px;

margin:10px auto;

padding:14px;

border-radius:18px;

background:rgba(0,0,0,.35);

border:
1px solid rgba(255,255,255,.15);

}

.selecao-titulo{

color:#aaa;

font-size:13px;

margin-bottom:10px;

}

.numeros{

display:flex;

justify-content:center;

gap:8px;

}

.numero{

width:45px;
height:45px;

padding:0;
margin:0;

border-radius:50%;

border:1px solid #466083;

background:
linear-gradient(
180deg,
#172541,
#091221
);

color:white;

font-size:19px;

font-weight:bold;

box-shadow:none;

cursor:pointer;

}

.numero.ativo{

background:
linear-gradient(
180deg,
#ffe66b,
#ffad00
);

color:#211600;

border-color:#ffe78a;

box-shadow:
0 0 14px rgba(255,210,28,.55);

}

/* =====================================================
APOSTAS
===================================================== */

.apostas{

width:92%;
max-width:420px;

margin:10px auto;

padding:12px;

border-radius:18px;

background:rgba(0,0,0,.30);

border:
1px solid rgba(255,255,255,.12);

}

.apostas-titulo{

color:#aaa;

font-size:13px;

margin-bottom:9px;

}

.valores{

display:flex;

justify-content:center;

gap:7px;

flex-wrap:wrap;

}

.valor{

padding:8px 12px;

border-radius:18px;

background:#111b31;

border:1px solid #466083;

color:white;

font-weight:bold;

}

/* =====================================================
BOTÃO
===================================================== */

#jogar{

width:90%;
max-width:320px;

padding:16px;

margin-top:12px;

border:0;

border-radius:17px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffad00
);

color:#211600;

font-size:21px;

font-weight:900;

box-shadow:
0 0 18px rgba(255,190,0,.4);

cursor:pointer;

}

#jogar:active{
transform:scale(.96);
}

#jogar:disabled{
opacity:.55;
}

/* =====================================================
INFO
===================================================== */

.info{

margin:18px auto;

color:#bfc7d8;

font-size:14px;

line-height:1.7;

}

.ganha{
color:#00ff91;
}

.perde{
color:#ff416d;
}

/* =====================================================
CELULAR
===================================================== */

@media(max-width:430px){

.titulo{
font-size:36px;
}

.area-dados{
min-height:210px;
gap:18px;
}

/*
OS DOIS DADOS FICAM
EXATAMENTE IGUAIS
*/

.dado{
width:56px;
height:56px;
flex:0 0 56px;
}

.dado-cubo{
width:56px;
height:56px;
}

.face-dado{
width:56px;
height:56px;
font-size:23px;
}

.face-1{
transform:translateZ(28px);
}

.face-6{
transform:
rotateY(180deg)
translateZ(28px);
}

.face-2{
transform:
rotateY(90deg)
translateZ(28px);
}

.face-5{
transform:
rotateY(-90deg)
translateZ(28px);
}

.face-3{
transform:
rotateX(90deg)
translateZ(28px);
}

.face-4{
transform:
rotateX(-90deg)
translateZ(28px);
}

.numero{
width:42px;
height:42px;
}

}

</style>

</head>

<body>

<div id="saldo">
💰 Saldo: R$ 0,00
</div>

<div class="titulo">
🎲 DICE
</div>


<!-- =====================================================
DOIS DADOS IGUAIS
===================================================== -->

<div class="area-dados">

<div class="dado" id="dado1">

<div class="dado-cubo">

<div class="face-dado face-1">1</div>
<div class="face-dado face-2">2</div>
<div class="face-dado face-3">3</div>
<div class="face-dado face-4">4</div>
<div class="face-dado face-5">5</div>
<div class="face-dado face-6">6</div>

</div>

</div>


<div class="dado" id="dado2">

<div class="dado-cubo">

<div class="face-dado face-1">1</div>
<div class="face-dado face-2">2</div>
<div class="face-dado face-3">3</div>
<div class="face-dado face-4">4</div>
<div class="face-dado face-5">5</div>
<div class="face-dado face-6">6</div>

</div>

</div>

</div>


<div
class="resultado-dados"
id="resultadoDados">

🎲 🎲

</div>


<div id="mensagem">
Escolha o número
</div>


<!-- ESCOLHA -->

<div class="selecao">

<div class="selecao-titulo">
ESCOLHA O NÚMERO
</div>

<div class="numeros">

<button class="numero ativo" data-numero="1">1</button>
<button class="numero" data-numero="2">2</button>
<button class="numero" data-numero="3">3</button>
<button class="numero" data-numero="4">4</button>
<button class="numero" data-numero="5">5</button>
<button class="numero" data-numero="6">6</button>

</div>

</div>


<!-- APOSTA -->

<div class="apostas">

<div class="apostas-titulo">
VALOR DA APOSTA
</div>

<div class="valores">

<div class="valor">R$ 0,50</div>
<div class="valor">R$ 1,00</div>
<div class="valor">R$ 2,00</div>
<div class="valor">R$ 5,00</div>
<div class="valor">R$ 10,00</div>

</div>

</div>


<button id="jogar">
🎲 JOGAR
</button>


<div class="info">

<div class="ganha">
🎉 Se o número escolhido aparecer nos dados, ganha 2X
</div>

<div class="perde">
😢 Se não aparecer, perde a aposta
</div>

</div>


<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
CONFIGURAÇÃO
===================================================== */

const APOSTA = 1.00;
const MULTIPLICADOR = 2;


/* =====================================================
ELEMENTOS
===================================================== */

const saldoEl =
document.getElementById("saldo");

const dado1 =
document.getElementById("dado1");

const dado2 =
document.getElementById("dado2");

const resultadoDados =
document.getElementById("resultadoDados");

const mensagem =
document.getElementById("mensagem");

const jogar =
document.getElementById("jogar");

const botoesNumero =
document.querySelectorAll(".numero");


let numeroEscolhido = 1;
let jogando = false;


/* =====================================================
SALDO
===================================================== */

async function atualizarSaldo(){

try{

if(
window.SistemaSaldo &&
window.SistemaSaldo.get
){

const valor =
await window.SistemaSaldo.get();

saldoEl.textContent =
"💰 Saldo: R$ " +
Number(valor)
.toFixed(2)
.replace(".",",");

}

}catch(erro){

console.error(
"Erro ao atualizar saldo:",
erro
);

}

}


/* =====================================================
ESCOLHA DO NÚMERO
===================================================== */

botoesNumero.forEach(botao=>{

botao.addEventListener(
"click",
()=>{

if(jogando)
return;

botoesNumero.forEach(b=>{
b.classList.remove("ativo");
});

botao.classList.add("ativo");

numeroEscolhido =
Number(
botao.dataset.numero
);

mensagem.className="";

mensagem.textContent =
"🎯 Número escolhido: " +
numeroEscolhido;

});

});


/* =====================================================
MOSTRAR FACE
===================================================== */

function mostrarFace(dado,numero){

const cubo =
dado.querySelector(".dado-cubo");

const faces =
cubo.querySelectorAll(".face-dado");

faces.forEach(face=>{
face.style.opacity="0";
});

const face =
cubo.querySelector(
".face-"+numero
);

if(face){
face.style.opacity="1";
}

}


/* =====================================================
VIBRAÇÃO
===================================================== */

function vibrar(){

if(navigator.vibrate){

navigator.vibrate([
25,
30,
25
]);

}

}


/* =====================================================
SOM DE DADO
===================================================== */

let audioCtx=null;

function somDado(){

try{

if(!audioCtx){

audioCtx =
new(
window.AudioContext ||
window.webkitAudioContext
)();

}

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const agora =
audioCtx.currentTime;

for(
let i=0;
i<7;
i++
){

const osc =
audioCtx.createOscillator();

const ganho =
audioCtx.createGain();

osc.type="triangle";

osc.frequency.value =
100 +
Math.random()*130;

ganho.gain.setValueAtTime(
0.0001,
agora+i*.085
);

ganho.gain.exponentialRampToValueAtTime(
0.06,
agora+i*.085+.012
);

ganho.gain.exponentialRampToValueAtTime(
0.0001,
agora+i*.085+.055
);

osc.connect(ganho);

ganho.connect(
audioCtx.destination
);

osc.start(
agora+i*.085
);

osc.stop(
agora+i*.085+.065
);

}

}catch(e){

console.log(e);

}

}


/* =====================================================
JOGAR
===================================================== */

jogar.addEventListener(
"click",
async()=>{

if(jogando)
return;

if(!window.SistemaSaldo){

mensagem.className="perde";

mensagem.textContent =
"⚠️ Sistema de saldo não encontrado.";

return;

}

jogando=true;
jogar.disabled=true;


/* BUSCA SALDO */

let saldoAtual=0;

try{

saldoAtual =
Number(
await window.SistemaSaldo.get()
);

}catch(e){

console.error(e);

}


/* SALDO INSUFICIENTE */

if(
!Number.isFinite(saldoAtual) ||
saldoAtual < APOSTA
){

mensagem.className="perde";

mensagem.textContent =
"❌ Saldo insuficiente.";

jogando=false;
jogar.disabled=false;

return;

}


/* DEBITA */

try{

await window.SistemaSaldo.debitar(
APOSTA
);

}catch(erro){

console.error(
"Erro ao debitar:",
erro
);

mensagem.className="perde";

mensagem.textContent =
"⚠️ Não foi possível realizar a aposta.";

jogando=false;
jogar.disabled=false;

await atualizarSaldo();

return;

}


/* ATUALIZA SALDO */

await atualizarSaldo();


/* INÍCIO */

mensagem.className="";

mensagem.textContent =
"🎲 Os dados estão rolando...";

resultadoDados.textContent =
"🎲 🎲";


/* REINICIA ANIMAÇÃO */

dado1.classList.remove("girando");
dado2.classList.remove("girando");

void dado1.offsetWidth;
void dado2.offsetWidth;


/* OS DOIS COMEÇAM JUNTOS */

dado1.classList.add("girando");
dado2.classList.add("girando");

somDado();
vibrar();


/* SORTEIO */

const numero1 =
Math.floor(Math.random()*6)+1;

const numero2 =
Math.floor(Math.random()*6)+1;


/* RESULTADO */

setTimeout(
async()=>{

dado1.classList.remove("girando");
dado2.classList.remove("girando");

mostrarFace(dado1,numero1);
mostrarFace(dado2,numero2);

resultadoDados.textContent =
numero1 +
" + " +
numero2 +
" = " +
(numero1+numero2);


/* VERIFICAÇÃO */

const acertouPrimeiro =
numero1 === numeroEscolhido;

const acertouSegundo =
numero2 === numeroEscolhido;

const ganhou =
acertouPrimeiro ||
acertouSegundo;


/* VITÓRIA */

if(ganhou){

const premio =
APOSTA * MULTIPLICADOR;

try{

if(
window.SistemaSaldo.ganhar
){

await window.SistemaSaldo.ganhar(
APOSTA,
MULTIPLICADOR
);

}else if(
window.SistemaSaldo.creditar
){

await window.SistemaSaldo.creditar(
premio
);

}

mensagem.className="ganha";

mensagem.textContent =
"🎉 ACERTOU! + R$ " +
premio
.toFixed(2)
.replace(".",",");

vibrar();

}catch(erro){

console.error(
"Erro ao creditar:",
erro
);

mensagem.className="perde";

mensagem.textContent =
"⚠️ Erro ao registrar o prêmio.";

}

}


/* DERROTA */

else{

mensagem.className="perde";

mensagem.textContent =
"😢 PERDEU! O número " +
numeroEscolhido +
" não saiu.";

}


/* SALDO FINAL */

await atualizarSaldo();

jogando=false;
jogar.disabled=false;

},
750
);

});


/* =====================================================
CARREGAR SALDO
===================================================== */

atualizarSaldo();

</script>

</body>
</html>
