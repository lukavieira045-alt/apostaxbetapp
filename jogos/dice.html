<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 10% 10%,rgba(0,255,255,.55),transparent 25%),
radial-gradient(circle at 90% 15%,rgba(255,0,200,.45),transparent 28%),
radial-gradient(circle at 50% 90%,rgba(255,220,0,.35),transparent 30%),
linear-gradient(135deg,#f8fbff,#dfeeff,#f5e9ff);

background-size:180% 180%;
animation:fundoAnimado 10s ease-in-out infinite alternate;

position:relative;
}

/* CAMADA DE LUZ */
body::before{
content:"";
position:fixed;
inset:-20%;
pointer-events:none;
z-index:-5;

background:
radial-gradient(circle at 20% 25%,
rgba(0,210,255,.30),
transparent 20%),

radial-gradient(circle at 80% 30%,
rgba(255,0,180,.25),
transparent 22%),

radial-gradient(circle at 50% 80%,
rgba(255,210,0,.25),
transparent 24%);

filter:blur(35px);

animation:luzes 8s ease-in-out infinite alternate;
}

/* PARTÍCULAS */
body::after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:-4;

background-image:
radial-gradient(
circle,
rgba(255,255,255,.95) 1px,
transparent 2px
);

background-size:45px 45px;

opacity:.55;

animation:particulas 9s linear infinite;
}

@keyframes fundoAnimado{

0%{
background-position:0% 0%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 100%;
}

}

@keyframes luzes{

0%{
transform:translate(-4%,-3%) scale(1);
}

50%{
transform:translate(5%,4%) scale(1.08);
}

100%{
transform:translate(-3%,6%) scale(1.04);
}

}

@keyframes particulas{

from{
transform:translateY(0);
}

to{
transform:translateY(-90px);
}

}

/* LUZES LATERAIS */

.luz{
position:fixed;
width:260px;
height:260px;
border-radius:50%;
filter:blur(80px);
opacity:.38;
pointer-events:none;
z-index:-3;
}

.luz1{
background:#00d9ff;
left:-100px;
top:15%;
animation:mov1 7s infinite alternate;
}

.luz2{
background:#ff00aa;
right:-100px;
top:35%;
animation:mov2 8s infinite alternate;
}

.luz3{
background:#ffe000;
left:35%;
bottom:-180px;
animation:mov3 9s infinite alternate;
}

@keyframes mov1{
to{
transform:translate(170px,100px) scale(1.25);
}
}

@keyframes mov2{
to{
transform:translate(-150px,-90px) scale(1.3);
}
}

@keyframes mov3{
to{
transform:translate(80px,-100px) scale(1.25);
}
}

/* SALDO */

#saldo{
display:inline-block;

margin:25px auto 20px;

padding:12px 25px;

border-radius:30px;

background:rgba(5,15,30,.85);

border:2px solid #00ff91;

color:#00ff91;

font-size:21px;

font-weight:bold;

box-shadow:
0 0 12px rgba(0,255,145,.35),
0 0 30px rgba(0,255,145,.12);
}

/* CAIXA */

.caixa{

width:92%;
max-width:440px;

margin:auto;

padding:25px 18px 30px;

border:1px solid rgba(0,120,255,.25);

border-radius:28px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.92),
rgba(238,246,255,.94)
);

box-shadow:
0 12px 40px rgba(0,60,130,.20),
0 0 60px rgba(0,200,255,.12);

backdrop-filter:blur(12px);

color:#111;
}

/* ÁREA DO DADO */

.area-dado{

height:300px;

display:flex;

align-items:center;

justify-content:center;

position:relative;

perspective:900px;
}

/* SOMBRA */

.sombra{

position:absolute;

bottom:48px;

width:150px;

height:30px;

border-radius:50%;

background:#000;

filter:blur(15px);

opacity:.45;
}

/* DADO */

.dado-3d{

position:relative;

width:125px;

height:125px;

transform-style:preserve-3d;

transform:
rotateX(-18deg)
rotateY(25deg);

}

/* FACES */

.face{

position:absolute;

width:125px;

height:125px;

background:
linear-gradient(
145deg,
#ffffff,
#dedede
);

border:4px solid #aaa;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
inset 0 0 20px rgba(0,0,0,.18),
0 18px 25px rgba(0,0,0,.35);

backface-visibility:hidden;
}

/* PONTOS */

.ponto{

position:absolute;

width:19px;

height:19px;

border-radius:50%;

background:#171717;

box-shadow:
inset 0 2px 4px rgba(255,255,255,.25);
}

/* FACES */

.frente{
transform:translateZ(62.5px);
}

.tras{
transform:
rotateY(180deg)
translateZ(62.5px);
}

.direita{
transform:
rotateY(90deg)
translateZ(62.5px);
}

.esquerda{
transform:
rotateY(-90deg)
translateZ(62.5px);
}

.cima{
transform:
rotateX(90deg)
translateZ(62.5px);
}

.baixo{
transform:
rotateX(-90deg)
translateZ(62.5px);
}

/* POSIÇÕES */

.p1{
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.p2a{top:20%;left:20%}
.p2b{bottom:20%;right:20%}

.p3a{top:20%;left:20%}
.p3b{
top:50%;
left:50%;
transform:translate(-50%,-50%);
}
.p3c{bottom:20%;right:20%}

.p4a{top:20%;left:20%}
.p4b{top:20%;right:20%}
.p4c{bottom:20%;left:20%}
.p4d{bottom:20%;right:20%}

.p5a{top:20%;left:20%}
.p5b{top:20%;right:20%}
.p5c{
top:50%;
left:50%;
transform:translate(-50%,-50%);
}
.p5d{bottom:20%;left:20%}
.p5e{bottom:20%;right:20%}

.p6a{top:17%;left:20%}
.p6b{top:17%;right:20%}
.p6c{
top:50%;
left:20%;
transform:translateY(-50%);
}
.p6d{
top:50%;
right:20%;
transform:translateY(-50%);
}
.p6e{bottom:17%;left:20%}
.p6f{bottom:17%;right:20%}

/* GIRO MAIS RÁPIDO */

.dado-3d.rolando{

animation:
rolarDado .95s
cubic-bezier(.15,.75,.25,1)
forwards;

}

@keyframes rolarDado{

0%{
transform:
translateY(0)
rotateX(-15deg)
rotateY(20deg)
rotateZ(0);
}

20%{
transform:
translateY(-95px)
rotateX(180deg)
rotateY(240deg)
rotateZ(40deg);
}

40%{
transform:
translateY(-40px)
rotateX(390deg)
rotateY(520deg)
rotateZ(-45deg);
}

60%{
transform:
translateY(-75px)
rotateX(600deg)
rotateY(780deg)
rotateZ(40deg);
}

78%{
transform:
translateY(-20px)
rotateX(780deg)
rotateY(1040deg)
rotateZ(-20deg);
}

90%{
transform:
translateY(5px)
rotateX(900deg)
rotateY(1210deg)
rotateZ(8deg);
}

100%{
transform:
translateY(0)
rotateX(1080deg)
rotateY(1440deg)
rotateZ(0);
}

}

/* RESULTADO */

#faceResultado{

position:relative;

z-index:3;

margin-top:-5px;

min-width:70px;

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:52px;

font-weight:900;

color:#111;

text-shadow:
0 0 8px white,
0 0 20px #00ccff;

opacity:0;

transform:scale(.5);

transition:.25s;

}

#faceResultado.mostrar{

opacity:1;

transform:scale(1);

}

/* TEXTO */

#resultado{

min-height:40px;

margin:5px 0 20px;

font-size:24px;

font-weight:bold;

color:#b37a00;

text-shadow:
0 0 10px rgba(255,190,0,.45);

}

.vitoria{

color:#00a866 !important;

text-shadow:
0 0 10px #00ff91,
0 0 25px #00ff91 !important;

}

.derrota{

color:#e72b55 !important;

text-shadow:
0 0 10px #ff416d,
0 0 20px #ff416d !important;

}

/* INPUT */

label{

display:block;

color:#555;

font-size:14px;

margin-bottom:6px;

}

input{

width:170px;

padding:14px;

border-radius:13px;

border:2px solid #bbb;

background:#fff;

color:#111;

font-size:21px;

font-weight:bold;

text-align:center;

outline:none;

}

input:focus{

border-color:#00aaff;

box-shadow:
0 0 10px rgba(0,170,255,.35);

}

/* BOTÃO */

button{

width:90%;

max-width:320px;

margin-top:15px;

padding:17px;

border:2px solid #ffe78a;

border-radius:16px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

font-size:22px;

font-weight:900;

cursor:pointer;

box-shadow:
0 0 12px #ffd21c,
0 0 35px rgba(255,170,0,.35);

}

button:active{
transform:scale(.95);
}

button:disabled{
opacity:.55;
}

/* INFO */

.info{

margin-top:25px;

padding-top:18px;

border-top:1px solid rgba(0,0,0,.12);

font-size:14px;

line-height:1.7;

}

.ganha{
color:#00a866;
}

.perde{
color:#e72b55;
}

@media(max-width:450px){

.area-dado{
height:270px;
}

.dado-3d,
.face{
width:115px;
height:115px;
}

.face{
border-radius:16px;
}

}
</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>
<div class="luz luz3"></div>

<div id="saldo">💰 Saldo: R$ 0,00</div>

<div class="caixa">

<div class="area-dado">

<div class="sombra"></div>

<div id="dado" class="dado-3d">

<div class="face frente">
<span class="ponto p1"></span>
</div>

<div class="face tras">
<span class="ponto p4a"></span>
<span class="ponto p4b"></span>
<span class="ponto p4c"></span>
<span class="ponto p4d"></span>
</div>

<div class="face direita">
<span class="ponto p3a"></span>
<span class="ponto p3b"></span>
<span class="ponto p3c"></span>
</div>

<div class="face esquerda">
<span class="ponto p5a"></span>
<span class="ponto p5b"></span>
<span class="ponto p5c"></span>
<span class="ponto p5d"></span>
<span class="ponto p5e"></span>
</div>

<div class="face cima">
<span class="ponto p6a"></span>
<span class="ponto p6b"></span>
<span class="ponto p6c"></span>
<span class="ponto p6d"></span>
<span class="ponto p6e"></span>
<span class="ponto p6f"></span>
</div>

<div class="face baixo">
<span class="ponto p2a"></span>
<span class="ponto p2b"></span>
</div>

</div>

<div id="faceResultado"></div>

</div>

<div id="resultado">
Escolha sua sorte
</div>

<label>
VALOR DA APOSTA
</label>

<input
id="aposta"
type="number"
value="1"
min="0.10"
step="0.10"
>

<br>

<button id="botao">
🎲 JOGAR
</button>

<div class="info">

<div class="ganha">
🎉 4, 5 ou 6 = GANHA 2X
</div>

<div class="perde">
😢 1, 2 ou 3 = PERDE
</div>

</div>

</div>

<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
   SOM REALISTA DE DADO
===================================================== */

let audioCtx = null;

function iniciarAudio(){

if(!audioCtx){

audioCtx = new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(audioCtx.state === "suspended"){
audioCtx.resume();
}

}

function impactoDado(){

iniciarAudio();

const agora =
audioCtx.currentTime;

const buffer =
audioCtx.createBuffer(
1,
audioCtx.sampleRate * .055,
audioCtx.sampleRate
);

const dados =
buffer.getChannelData(0);

for(let i=0;i<dados.length;i++){

dados[i] =
(Math.random()*2-1) *
Math.exp(
-i/(audioCtx.sampleRate*.010)
);

}

const fonte =
audioCtx.createBufferSource();

const ganho =
audioCtx.createGain();

const filtro =
audioCtx.createBiquadFilter();

filtro.type="lowpass";
filtro.frequency.value=2300;

ganho.gain.setValueAtTime(
.20,
agora
);

ganho.gain.exponentialRampToValueAtTime(
.001,
agora+.055
);

fonte.buffer=buffer;

fonte.connect(filtro);
filtro.connect(ganho);
ganho.connect(audioCtx.destination);

fonte.start();
}

function somDado(){

iniciarAudio();

impactoDado();

setTimeout(impactoDado,120);
setTimeout(impactoDado,240);
setTimeout(impactoDado,360);
setTimeout(impactoDado,480);
setTimeout(impactoDado,600);
setTimeout(impactoDado,720);
setTimeout(impactoDado,840);

}

function somResultado(numero){

iniciarAudio();

const frequencias={
1:180,
2:220,
3:260,
4:330,
5:390,
6:480
};

const oscilador =
audioCtx.createOscillator();

const ganho =
audioCtx.createGain();

oscilador.type="triangle";

oscilador.frequency.value =
frequencias[numero] || 300;

ganho.gain.setValueAtTime(
.001,
audioCtx.currentTime
);

ganho.gain.linearRampToValueAtTime(
.08,
audioCtx.currentTime+.02
);

ganho.gain.exponentialRampToValueAtTime(
.001,
audioCtx.currentTime+.22
);

oscilador.connect(ganho);
ganho.connect(audioCtx.destination);

oscilador.start();

oscilador.stop(
audioCtx.currentTime+.24
);

}

/* =====================================================
   ELEMENTOS
===================================================== */

const dado =
document.getElementById("dado");

const botao =
document.getElementById("botao");

const resultado =
document.getElementById("resultado");

const faceResultado =
document.getElementById("faceResultado");

/* =====================================================
   VIBRAÇÃO
===================================================== */

function vibrar(){

if("vibrate" in navigator){

navigator.vibrate([
25,35,
35,45,
45
]);

}

}

/* =====================================================
   SALDO REAL
===================================================== */

async function atualizarSaldo(){

try{

if(
window.SistemaSaldo &&
window.SistemaSaldo.atualizarTela
){

await window.SistemaSaldo.atualizarTela();

}

}catch(erro){

console.error(
"Erro ao atualizar saldo:",
erro
);

}

}

/* Aguarda o saldo.js */
window.addEventListener(
"load",
async function(){

await new Promise(
resolve=>setTimeout(resolve,150)
);

await atualizarSaldo();

});

/* =====================================================
   JOGAR
===================================================== */

botao.addEventListener(
"click",
async function(){

if(!window.SistemaSaldo){

resultado.className="derrota";

resultado.textContent=
"⚠️ Sistema de saldo não encontrado.";

return;

}

const aposta =
Number(
document.getElementById("aposta").value
);

if(!Number.isFinite(aposta)){

alert(
"Digite um valor válido."
);

return;

}

if(aposta<0.10){

alert(
"A aposta mínima é R$ 0,10."
);

return;

}

/* SALDO REAL */
const saldoAtual =
Number(
await window.SistemaSaldo.get()
);

if(
!Number.isFinite(saldoAtual) ||
saldoAtual<aposta
){

resultado.className=
"derrota";

resultado.textContent=
"❌ Saldo insuficiente";

await atualizarSaldo();

return;

}

botao.disabled=true;

/*
Som e animação começam
IMEDIATAMENTE no clique.
*/

iniciarAudio();

somDado();

vibrar();

resultado.className="";

resultado.textContent=
"🎲 JOGANDO...";

faceResultado.classList.remove(
"mostrar"
);

faceResultado.textContent="";

/* DEBITA */
await window.SistemaSaldo.debitar(
aposta
);

await atualizarSaldo();

/* SORTEIO */
const numero=
Math.floor(
Math.random()*6
)+1;

/* GIRO IMEDIATO */
dado.classList.remove(
"rolando"
);

void dado.offsetWidth;

dado.classList.add(
"rolando"
);

/* IMPACTOS */
setTimeout(vibrar,300);
setTimeout(vibrar,600);
setTimeout(vibrar,850);

/* RESULTADO */

setTimeout(
async function(){

dado.classList.remove(
"rolando"
);

faceResultado.textContent=
numero;

faceResultado.classList.add(
"mostrar"
);

somResultado(numero);

if(numero>=4){

const premio=
aposta*2;

/*
Somente o prêmio é creditado,
pois a aposta já foi debitada.
*/

await window.SistemaSaldo.ganhar(
aposta,
premio/aposta
);

resultado.className=
"vitoria";

resultado.textContent=
"🎉 GANHOU R$ "+
premio.toFixed(2);

vibrar();

}else{

resultado.className=
"derrota";

resultado.textContent=
"😢 PERDEU";

}

await atualizarSaldo();

botao.disabled=false;

},
950
);

});

</script>

</body>
</html>
