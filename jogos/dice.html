<!-- TROQUE SOMENTE O SCRIPT ANTIGO POR ESTE -->

<script>

let saldo =
Number(localStorage.getItem("saldo") || 1000);

function atualizar(){

    document.getElementById("saldo").innerHTML =
        "💰 Saldo: R$ " + saldo.toFixed(2);

    localStorage.setItem("saldo", saldo);
}

atualizar();


function jogar(){

    const aposta =
        Number(document.getElementById("aposta").value);

    const botao =
        document.getElementById("botao");

    const dado =
        document.getElementById("dado");

    const resultado =
        document.getElementById("resultado");


    /* VERIFICA APOSTA */

    if(!Number.isFinite(aposta) || aposta < 0.10){

        alert("A aposta mínima é R$ 0,10.");

        return;
    }


    if(aposta > saldo){

        alert("Saldo insuficiente.");

        return;
    }


    /* BLOQUEIA O BOTÃO */

    botao.disabled = true;


    /* DESCONTA APOSTA */

    saldo -= aposta;

    atualizar();


    /* TEXTO */

    resultado.className = "";

    resultado.innerHTML =
        "🎲 ROLANDO...";


    /*
       GARANTE QUE O DADO CONTINUE
       SENDO O EMOJI 🎲
    */

    dado.innerHTML = "🎲";


    /* REINICIA A ANIMAÇÃO */

    dado.classList.remove("rolando");

    dado.classList.remove("final");

    void dado.offsetWidth;


    /* COMEÇA A ROLAR */

    dado.classList.add("rolando");


    /*
       SORTEIA O RESULTADO
    */

    const numero =
        Math.floor(Math.random() * 6) + 1;


    /*
       ESPERA A ANIMAÇÃO TERMINAR
    */

    setTimeout(function(){

        dado.classList.remove("rolando");


        /*
           MANTÉM O EMOJI 🎲
        */

        dado.innerHTML = "🎲";


        /*
           PEQUENO EFEITO AO PARAR
        */

        dado.classList.add("final");


        setTimeout(function(){

            dado.classList.remove("final");

        },450);


        /*
           VERIFICA RESULTADO
        */

        if(numero >= 4){

            const premio =
                aposta * 2;


            saldo += premio;


            resultado.className =
                "vitoria";


            resultado.innerHTML =
                "🎉 GANHOU R$ " +
                premio.toFixed(2) +
                " — DADO: " +
                numero;


        }else{

            resultado.className =
                "derrota";


            resultado.innerHTML =
                "😢 PERDEU — DADO: " +
                numero;

        }


        atualizar();


        /* LIBERA BOTÃO */

        botao.disabled = false;


    },1800);

}

</script>
