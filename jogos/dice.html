<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dice ApostaXBet</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
padding:0;
min-height:100%;
}

body{

color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 15% 15%,#0066ff 0,transparent 25%),
radial-gradient(circle at 85% 20%,#e600ff 0,transparent 25%),
radial-gradient(circle at 50% 100%,#ff0066 0,transparent 30%),
linear-gradient(135deg,#02020c,#09001c,#00132c);

background-size:180% 180%;

animation:fundo 12s ease-in-out infinite alternate;

}

@keyframes fundo{

0%{
background-position:0% 0%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 100%;
}

}


/* LUZES */

.luz{

position:fixed;

width:280px;
height:280px;

border-radius:50%;

filter:blur(90px);

opacity:.45;

pointer-events:none;

z-index:-2;

}

.luz1{

background:#0066ff;

left:-100px;
top:15%;

animation:moveluz1 8s infinite alternate;

}

.luz2{

background:#ff0088;

right:-100px;
top:40%;

animation:moveluz2 9s infinite alternate;

}

.luz3{

background:#7b00ff;

left:30%;
bottom:-180px;

animation:moveluz3 7s infinite alternate;

}

@keyframes moveluz1{

to{
transform:translate(180px,100px) scale(1.3);
}

}

@keyframes moveluz2{

to{
transform:translate(-150px,-80px) scale(1.4);
}

}

@keyframes moveluz3{

to{
transform:translate(80px,-100px) scale(1.3);
}

}


/* PARTÍCULAS */

.particulas{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:-1;

}

.particulas i{

position:absolute;

bottom:-20px;

width:4px;
height:4px;

border-radius:50%;

background:white;

box-shadow:
0 0 10px #00ccff,
0 0 20px #ff00aa;

animation:particula linear infinite;

}

.particulas i:nth-child(1){left:5%;animation-duration:7s}
.particulas i:nth-child(2){left:15%;animation-duration:11s}
.particulas i:nth-child(3){left:25%;animation-duration:8s}
.particulas i:nth-child(4){left:35%;animation-duration:13s}
.particulas i:nth-child(5){left:45%;animation-duration:9s}
.particulas i:nth-child(6){left:55%;animation-duration:12s}
.particulas i:nth-child(7){left:65%;animation-duration:8s}
.particulas i:nth-child(8){left:75%;animation-duration:10s}
.particulas i:nth-child(9){left:85%;animation-duration:7s}
.particulas i:nth-child(10){left:95%;animation-duration:12s}

@keyframes particula{

0%{
transform:translateY(0) scale(.3);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh) scale(1.8);
opacity:0;
}

}


/* TÍTULO */

.titulo{

margin-top:25px;

font-size:46px;

font-weight:900;

letter-spacing:5px;

color:#ffd21c;

text-shadow:
0 0 5px white,
0 0 15px #ffd21c,
0 0 35px #ff8c00;

}


/* SALDO */

#saldo{

display:inline-block;

margin:15px auto 20px;

padding:12px 25px;

border:1px solid rgba(0,255,150,.6);

border-radius:30px;

background:rgba(0,0,0,.6);

color:#00ff91;

font-size:21px;

font-weight:bold;

box-shadow:
0 0 15px rgba(0,255,150,.25);

}


/* CAIXA */

.caixa{

width:92%;

max-width:440px;

margin:auto;

padding:25px 18px 30px;

border:1px solid rgba(255,215,0,.8);

border-radius:28px;

background:
linear-gradient(
145deg,
rgba(20,20,35,.94),
rgba(3,4,15,.96)
);

box-shadow:
0 0 20px rgba(255,215,0,.25),
0 0 70px rgba(0,100,255,.18),
0 25px 70px rgba(0,0,0,.7);

backdrop-filter:blur(12px);

}


/* ÁREA DO DADO */

.area-dado{

height:300px;

display:flex;

justify-content:center;

align-items:center;

perspective:900px;

position:relative;

}


/* SOMBRA */

.sombra{

position:absolute;

bottom:32px;

left:50%;

width:150px;

height:35px;

border-radius:50%;

background:#000;

filter:blur(14px);

opacity:.7;

transform:translateX(-50%);

}


/* CUBO */

.cubo{

position:relative;

width:130px;

height:130px;

transform-style:preserve-3d;

transform:
rotateX(-18deg)
rotateY(25deg);

transition:transform .3s;

filter:
drop-shadow(0 20px 12px rgba(0,0,0,.8))
drop-shadow(0 0 18px rgba(255,255,255,.25));

}


/* ROLAGEM */

.cubo.rolando{

animation:rolar 1.8s cubic-bezier(.15,.75,.25,1);

}

@keyframes rolar{

0%{

transform:
rotateX(-18deg)
rotateY(25deg)
rotateZ(0deg);

}

20%{

transform:
rotateX(160deg)
rotateY(220deg)
rotateZ(80deg)
scale(1.12);

}

40%{

transform:
rotateX(330deg)
rotateY(440deg)
rotateZ(160deg)
scale(1.18);

}

60%{

transform:
rotateX(500deg)
rotateY(680deg)
rotateZ(240deg)
scale(1.12);

}

80%{

transform:
rotateX(650deg)
rotateY(820deg)
rotateZ(310deg)
scale(1.05);

}

100%{

transform:
rotateX(720deg)
rotateY(900deg)
rotateZ(360deg)
scale(1);

}

}


/* FACE */

.face{

position:absolute;

width:130px;

height:130px;

display:grid;

grid-template-columns:repeat(3,1fr);

grid-template-rows:repeat(3,1fr);

padding:16px;

border-radius:27px;

background:
linear-gradient(
145deg,
#ffffff 0%,
#f5f5f5 35%,
#d2d2d2 70%,
#888888 100%
);

border:3px solid #fff;

box-shadow:

inset 8px 8px 15px rgba(255,255,255,.9),

inset -10px -10px 18px rgba(0,0,0,.3),

0 2px 5px rgba(0,0,0,.4);

}


/* FACES */

.frente{

transform:translateZ(65px);

}

.tras{

transform:
rotateY(180deg)
translateZ(65px);

}

.direita{

transform:
rotateY(90deg)
translateZ(65px);

}

.esquerda{

transform:
rotateY(-90deg)
translateZ(65px);

}

.cima{

transform:
rotateX(90deg)
translateZ(65px);

}

.baixo{

transform:
rotateX(-90deg)
translateZ(65px);

}


/* PONTOS */

.ponto{

width:21px;

height:21px;

align-self:center;

justify-self:center;

border-radius:50%;

background:

radial-gradient(
circle at 35% 28%,
#555 0%,
#171717 40%,
#000 100%
);

box-shadow:

inset 2px 2px 4px rgba(255,255,255,.3),

inset -3px -3px 5px rgba(0,0,0,.8),

0 2px 5px rgba(0,0,0,.6);

}


/* RESULTADO */

#resultado{

min-height:38px;

margin:5px 0 20px;

font-size:24px;

font-weight:bold;

color:#ffd21c;

text-shadow:0 0 12px #ffd21c;

}


/* VITÓRIA */

.vitoria{

color:#00ff91 !important;

animation:vitoria .7s infinite alternate;

}

@keyframes vitoria{

from{
transform:scale(1);
}

to{

transform:scale(1.08);

text-shadow:
0 0 10px #00ff91,
0 0 30px #00ff91;

}

}


/* DERROTA */

.derrota{

color:#ff416d !important;

text-shadow:
0 0 15px #ff416d !important;

}


/* INPUT */

label{

display:block;

color:#aaa;

font-size:14px;

margin-bottom:5px;

}

input{

width:170px;

padding:14px;

border-radius:13px;

border:2px solid #444;

background:#050505;

color:white;

font-size:21px;

font-weight:bold;

text-align:center;

outline:none;

}

input:focus{

border-color:#ffd21c;

box-shadow:
0 0 10px #ffd21c;

}


/* BOTÃO */

button{

width:90%;

max-width:320px;

margin-top:15px;

padding:17px;

border:2px solid #ffe78a;

border-radius:16px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

font-size:22px;

font-weight:900;

cursor:pointer;

box-shadow:
0 0 12px #ffd21c,
0 0 35px rgba(255,170,0,.45);

transition:.2s;

}

button:active{

transform:scale(.95);

}

button:disabled{

opacity:.55;

cursor:not-allowed;

}


/* INFO */

.info{

margin-top:25px;

padding-top:18px;

border-top:1px solid rgba(255,255,255,.12);

font-size:14px;

line-height:1.7;

}

.ganha{

color:#00ff91;

}

.perde{

color:#ff416d;

}


/* MOBILE */

@media(max-width:450px){

.titulo{

font-size:38px;

}

.caixa{

width:94%;

}

.area-dado{

height:270px;

}

.cubo{

width:110px;

height:110px;

}

.face{

width:110px;

height:110px;

border-radius:24px;

padding:13px;

}

.frente{

transform:translateZ(55px);

}

.tras{

transform:
rotateY(180deg)
translateZ(55px);

}

.direita{

transform:
rotateY(90deg)
translateZ(55px);

}

.esquerda{

transform:
rotateY(-90deg)
translateZ(55px);

}

.cima{

transform:
rotateX(90deg)
translateZ(55px);

}

.baixo{

transform:
rotateX(-90deg)
translateZ(55px);

}

.ponto{

width:18px;

height:18px;

}

}

</style>

</head>

<label>
VALOR DA APOSTA
</label>


<input
id="aposta"
type="number"
value="1"
min="0.10"
step="0.10"
>


<br>


<button
id="botao"
onclick="jogar()"
>

🎲 JOGAR

</button>

<div class="ganha">

🎉 4, 5 ou 6 = GANHA 2X

</div>

<div class="perde">

😢 1, 2 ou 3 = PERDE

</div>

<script>


let saldo =
Number(localStorage.getItem("saldo") || 1000);


function atualizar(){

document.getElementById("saldo").innerHTML =

"💰 Saldo: R$ " +
saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizar();


/* POSIÇÃO FINAL */

function mostrarNumero(numero){

const dado =
document.getElementById("dado");


const rotacoes={

1:"rotateX(0deg) rotateY(0deg)",

2:"rotateX(90deg) rotateY(0deg)",

3:"rotateY(-90deg)",

4:"rotateY(90deg)",

5:"rotateX(-90deg)",

6:"rotateY(180deg)"

};


dado.style.transform =
rotacoes[numero];

}


/* JOGAR */

function jogar(){

const aposta =
Number(
document.getElementById("aposta").value
);


const botao =
document.getElementById("botao");


const dado =
document.getElementById("dado");


const resultado =
document.getElementById("resultado");


if(aposta < 0.10){

alert(
"A aposta mínima é R$ 0,10."
);

return;

}


if(aposta > saldo){

alert(
"Saldo insuficiente."
);

return;

}


/* BLOQUEIA */

botao.disabled=true;


/* RETIRA */

saldo-=aposta;

atualizar();


/* TEXTO */

resultado.className="";

resultado.innerHTML=
"🎲 DADO ROLANDO...";


/* REINICIA */

dado.classList.remove("rolando");

void dado.offsetWidth;


/* ROLA */

dado.classList.add("rolando");


/* SORTEIA */

const numero=
Math.floor(Math.random()*6)+1;


/* ESPERA */

setTimeout(function(){


dado.classList.remove("rolando");


mostrarNumero(numero);


/* RESULTADO */

if(numero>=4){

const premio=
aposta*2;

saldo+=premio;


resultado.className=
"vitoria";


resultado.innerHTML=

"🎉 GANHOU R$ " +
premio.toFixed(2) +
" — DADO: " +
numero;

}else{

resultado.className=
"derrota";


resultado.innerHTML=

"😢 PERDEU — DADO: " +
numero;

}


atualizar();


botao.disabled=false;


},1800);

}

</script>
