<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dice ApostaXBet</title><style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,215,0,.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(0,255,136,.12), transparent 25%),
        linear-gradient(135deg,#020204,#080808,#111);
}

/* FUNDO ANIMADO */

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    z-index:-1;
    animation:mover 8s infinite alternate ease-in-out;
}

body::before{
    background:#ffd700;
    top:-100px;
    left:-100px;
}

body::after{
    background:#00ff88;
    bottom:-100px;
    right:-100px;
    animation-delay:2s;
}

@keyframes mover{
    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(100px,80px) scale(1.2);
    }

    100%{
        transform:translate(-50px,120px) scale(.9);
    }
}

h1{
    color:#ffd700;
    font-size:36px;
    margin-top:25px;
    text-shadow:
        0 0 8px #ffd700,
        0 0 20px rgba(255,215,0,.7);
}

#saldo{
    color:#00ff88;
    font-size:23px;
    font-weight:bold;
    margin:20px;
    text-shadow:0 0 10px rgba(0,255,136,.5);
}

.caixa{
    width:90%;
    max-width:420px;
    margin:25px auto;
    padding:25px 20px 30px;
    background:rgba(15,15,15,.88);
    border:2px solid rgba(255,215,0,.8);
    border-radius:24px;
    box-shadow:
        0 0 20px rgba(255,215,0,.2),
        0 20px 50px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
}

/* ÁREA DO DADO */

.area-dado{
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:800px;
}

/* DADO */

.dado{
    width:125px;
    height:125px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:100px;
    line-height:1;

    border-radius:22px;

    background:
        linear-gradient(145deg,#ffffff,#d7d7d7 45%,#999);

    color:#111;

    border:5px solid #eee;

    box-shadow:
        inset 8px 8px 15px rgba(255,255,255,.9),
        inset -10px -10px 20px rgba(0,0,0,.35),
        0 15px 25px rgba(0,0,0,.65),
        0 0 25px rgba(255,215,0,.25);

    transform:rotateX(-8deg) rotateY(12deg);

    text-shadow:
        2px 2px 3px rgba(0,0,0,.35);

    transition:transform .2s;
}

/* ANIMAÇÃO DO DADO */

.rolando{
    animation:
        rolar .8s ease-in-out,
        brilho .8s ease-in-out;
}

@keyframes rolar{

    0%{
        transform:
            rotateX(0deg)
            rotateY(0deg)
            rotateZ(0deg)
            scale(1);
    }

    25%{
        transform:
            rotateX(180deg)
            rotateY(120deg)
            rotateZ(90deg)
            scale(1.12);
    }

    50%{
        transform:
            rotateX(360deg)
            rotateY(240deg)
            rotateZ(180deg)
            scale(.92);
    }

    75%{
        transform:
            rotateX(540deg)
            rotateY(360deg)
            rotateZ(270deg)
            scale(1.08);
    }

    100%{
        transform:
            rotateX(720deg)
            rotateY(480deg)
            rotateZ(360deg)
            scale(1);
    }
}

@keyframes brilho{

    0%,100%{
        box-shadow:
            inset 8px 8px 15px rgba(255,255,255,.9),
            inset -10px -10px 20px rgba(0,0,0,.35),
            0 15px 25px rgba(0,0,0,.65);
    }

    50%{
        box-shadow:
            inset 8px 8px 15px white,
            inset -10px -10px 20px rgba(0,0,0,.25),
            0 0 45px #ffd700;
    }
}

#resultado{
    min-height:35px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    margin:10px 0 15px;
    text-shadow:0 0 10px rgba(255,215,0,.5);
}

input{
    width:150px;
    padding:13px;

    color:white;
    background:#080808;

    border:2px solid #555;
    border-radius:12px;

    text-align:center;
    font-size:18px;
    font-weight:bold;

    outline:none;
}

input:focus{
    border-color:#ffd700;
    box-shadow:0 0 10px rgba(255,215,0,.3);
}

button{
    margin-top:10px;

    padding:15px 45px;

    background:linear-gradient(145deg,#ffe55c,#ffd000,#c99d00);

    color:#111;

    border:0;
    border-radius:14px;

    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 0 #8d6d00,
        0 0 20px rgba(255,215,0,.35);

    transition:.15s;
}

button:active{
    transform:translateY(5px);
    box-shadow:
        0 1px 0 #8d6d00,
        0 0 15px rgba(255,215,0,.3);
}

button:disabled{
    opacity:.5;
}

/* EFEITO DE VITÓRIA */

.ganhou{
    animation:ganhou .6s ease;
}

@keyframes ganhou{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
        text-shadow:
            0 0 10px #ffd700,
            0 0 30px #ffd700;
    }

    100%{
        transform:scale(1);
    }
}

</style></head><body><h1>🎲 Dice</h1><div id="saldo"></div><div class="caixa"><div class="area-dado">

    <div id="dado" class="dado">
        ⚀
    </div>

</div>

<div id="resultado">
    Escolha sua sorte
</div>

<input
    id="aposta"
    type="number"
    value="1"
    min="1"
    step="0.01"
>

<br>

<button id="botaoJogar" onclick="jogar()">
    🎲 JOGAR
</button>

</div><script>

let saldo =
Number(localStorage.getItem("saldo") || 1000);

function atualizar(){

    document.getElementById("saldo").innerHTML =
        "💰 Saldo: R$ " + saldo.toFixed(2);

    localStorage.setItem("saldo",saldo);

}

atualizar();


function jogar(){

    let aposta =
        Number(document.getElementById("aposta").value);

    if(aposta <= 0 || aposta > saldo){

        alert("Saldo inválido");

        return;

    }

    const dado =
        document.getElementById("dado");

    const resultado =
        document.getElementById("resultado");

    const botao =
        document.getElementById("botaoJogar");


    /* DESCONTA A APOSTA */

    saldo -= aposta;

    atualizar();


    /* BLOQUEIA O BOTÃO DURANTE A ANIMAÇÃO */

    botao.disabled = true;


    resultado.innerHTML =
        "🎲 Rolando...";


    /* REINICIA A ANIMAÇÃO */

    dado.classList.remove("rolando");

    void dado.offsetWidth;

    dado.classList.add("rolando");


    /* ANIMAÇÃO VISUAL */

    let dados = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    let contador = 0;

    let intervalo =
        setInterval(function(){

            let numeroVisual =
                Math.floor(Math.random()*6);

            dado.innerHTML =
                dados[numeroVisual];

            contador++;

            if(contador >= 8){

                clearInterval(intervalo);

                finalizarJogo();

            }

        },100);


    function finalizarJogo(){

        let numero =
            Math.floor(Math.random()*6)+1;


        dado.innerHTML =
            dados[numero-1];


        /* RESULTADO */

        if(numero >= 4){

            let premio =
                aposta * 2;


            saldo += premio;


            resultado.innerHTML =
                "🎉 Ganhou R$ " +
                premio.toFixed(2);


            resultado.classList.remove("ganhou");

            void resultado.offsetWidth;

            resultado.classList.add("ganhou");


        }else{

            resultado.innerHTML =
                "😢 Perdeu R$ " +
                aposta.toFixed(2);

        }


        atualizar();


        botao.disabled = false;

    }

}

</script></body></html>
