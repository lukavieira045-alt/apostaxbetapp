<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

html,body{
 margin:0;
 min-height:100%;
}

body{
 min-height:100vh;
 overflow-x:hidden;
 color:#fff;
 text-align:center;
 background:
   radial-gradient(circle at 15% 20%,#19cfff 0,transparent 24%),
   radial-gradient(circle at 85% 20%,#ff28bd 0,transparent 25%),
   radial-gradient(circle at 50% 90%,#7b38ff 0,transparent 30%),
   linear-gradient(135deg,#071329,#10051d,#06152b);
 position:relative;
}

/* FUNDO LEVE */
body::before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background:
   radial-gradient(circle at 20% 30%,rgba(0,220,255,.18),transparent 22%),
   radial-gradient(circle at 80% 70%,rgba(255,0,180,.16),transparent 25%);
 animation:luzes 9s ease-in-out infinite alternate;
}

@keyframes luzes{
 from{transform:scale(1)}
 to{transform:scale(1.08)}
}

/* SALDO */
#saldo{
 display:inline-block;
 margin:20px auto 12px;
 padding:10px 22px;
 border:1px solid #00ff91;
 border-radius:25px;
 background:rgba(0,0,0,.45);
 color:#00ff91;
 font-size:20px;
 font-weight:bold;
 box-shadow:0 0 18px rgba(0,255,145,.25);
}

/* TÍTULO */
.titulo{
 margin:5px 0 10px;
 font-size:42px;
 font-weight:900;
 color:#ffd21c;
 text-shadow:
   0 0 8px #fff,
   0 0 20px #ffd21c,
   0 0 35px #ff8c00;
}

/* ÁREA DOS DADOS — SEM QUADRADO */
.area-dados{
 width:100%;
 max-width:500px;
 margin:auto;
 min-height:300px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:28px;
 position:relative;
}

/* DADO */
.dado{
 width:120px;
 height:120px;
 border-radius:22px;
 background:
   linear-gradient(145deg,#fff,#d9d9d9);
 border:4px solid #aaa;
 position:relative;
 box-shadow:
   0 18px 25px rgba(0,0,0,.45),
   inset 0 0 18px rgba(0,0,0,.15);
 transition:transform .12s;
}

/* PONTOS */
.ponto{
 position:absolute;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#151515;
 box-shadow:inset 0 2px 3px #555;
}

.centro{
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
}

.tl{top:18%;left:18%}
.tr{top:18%;right:18%}
.ml{top:50%;left:18%;transform:translateY(-50%)}
.mr{top:50%;right:18%;transform:translateY(-50%)}
.bl{bottom:18%;left:18%}
.br{bottom:18%;right:18%}

/* ANIMAÇÃO RÁPIDA */
.dado.rolando{
 animation:
   dadoRapido .78s cubic-bezier(.2,.8,.25,1);
}

@keyframes dadoRapido{
 0%{
  transform:translateY(0) rotate(0deg);
 }
 20%{
  transform:translateY(-35px) rotate(110deg);
 }
 45%{
  transform:translateY(10px) rotate(250deg);
 }
 70%{
  transform:translateY(-18px) rotate(390deg);
 }
 100%{
  transform:translateY(0) rotate(540deg);
 }
}

/* RESULTADO */
.resultado-dados{
 min-height:55px;
 font-size:38px;
 font-weight:900;
 color:#ffd21c;
 text-shadow:0 0 15px #ffd21c;
}

#mensagem{
 min-height:35px;
 font-size:21px;
 font-weight:bold;
}

/* APOSTAS */
.apostas{
 width:92%;
 max-width:420px;
 margin:12px auto;
 padding:14px;
 border-radius:18px;
 background:rgba(0,0,0,.35);
 border:1px solid rgba(255,255,255,.15);
}

.apostas-titulo{
 color:#aaa;
 font-size:13px;
 margin-bottom:10px;
}

.valores{
 display:flex;
 justify-content:center;
 gap:8px;
 flex-wrap:wrap;
}

.valor{
 padding:9px 14px;
 border-radius:18px;
 background:#111b31;
 border:1px solid #466083;
 color:white;
 font-weight:bold;
}

.valor.ativo{
 border-color:#ffd21c;
 color:#ffd21c;
 box-shadow:0 0 10px rgba(255,210,28,.35);
}

/* BOTÃO */
button{
 width:90%;
 max-width:320px;
 padding:16px;
 margin-top:12px;
 border:0;
 border-radius:17px;
 background:linear-gradient(180deg,#ffe66b,#ffad00);
 color:#211600;
 font-size:21px;
 font-weight:900;
 box-shadow:0 0 18px rgba(255,190,0,.4);
}

button:active{
 transform:scale(.96);
}

button:disabled{
 opacity:.55;
}

/* INFO */
.info{
 margin:18px auto;
 color:#bfc7d8;
 font-size:14px;
 line-height:1.7;
}

.ganha{color:#00ff91}
.perde{color:#ff416d}

@media(max-width:430px){
 .titulo{font-size:36px}
 .area-dados{gap:14px;min-height:270px}
 .dado{width:105px;height:105px}
 .ponto{width:16px;height:16px}
}
</style>
</head>

<body>

<div id="saldo">💰 Saldo: R$ 0,00</div>

<div class="titulo">🎲 DICE</div>

<div class="area-dados">

 <!-- DADO 1 -->
 <div class="dado" id="dado1">
  <span class="ponto centro"></span>
 </div>

 <!-- DADO 2 -->
 <div class="dado" id="dado2">
  <span class="ponto centro"></span>
 </div>

</div>

<div class="resultado-dados" id="resultadoDados">
🎲 🎲
</div>

<div id="mensagem">
Escolha sua aposta
</div>

<div class="apostas">

<div class="apostas-titulo">
VALOR DA APOSTA
</div>

<div class="valores">

<div class="valor ativo">R$ 0,50</div>
<div class="valor">R$ 1,00</div>
<div class="valor">R$ 2,00</div>
<div class="valor">R$ 5,00</div>
<div class="valor">R$ 10,00</div>

</div>

</div>

<button id="jogar">
🎲 JOGAR
</button>

<div class="info">
<div class="ganha">🎉 Resultado 8 a 12 = vitória</div>
<div class="perde">😢 Resultado 2 a 7 = derrota</div>
</div>

<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
   SALDO
===================================================== */

async function atualizarSaldo(){

 try{

  if(
   window.SistemaSaldo &&
   window.SistemaSaldo.atualizarTela
  ){

   await window.SistemaSaldo.atualizarTela();

   const elemento =
    document.getElementById("saldo");

   /*
    O saldo.js normalmente atualiza
    o elemento #balance.

    Aqui também mostramos o valor
    diretamente caso get() esteja disponível.
   */

   if(window.SistemaSaldo.get){

    const valor =
     await window.SistemaSaldo.get();

    if(Number.isFinite(Number(valor))){
     elemento.textContent =
      "💰 Saldo: R$ " +
      Number(valor).toFixed(2).replace(".",",");
    }

   }

  }

 }catch(e){
  console.error("Saldo:",e);
 }

}

window.addEventListener("load",()=>{
 setTimeout(atualizarSaldo,300);
});


/* =====================================================
   DADOS
===================================================== */

const dado1 =
 document.getElementById("dado1");

const dado2 =
 document.getElementById("dado2");

const resultadoDados =
 document.getElementById("resultadoDados");

const mensagem =
 document.getElementById("mensagem");

const jogar =
 document.getElementById("jogar");


/* =====================================================
   DESENHA A FACE DO DADO
===================================================== */

function mostrarFace(dado,numero){

 dado.innerHTML="";

 const faces={
  1:["centro"],
  2:["tl","br"],
  3:["tl","centro","br"],
  4:["tl","tr","bl","br"],
  5:["tl","tr","centro","bl","br"],
  6:["tl","tr","ml","mr","bl","br"]
 };

 faces[numero].forEach(pos=>{
  const p=document.createElement("span");
  p.className="ponto "+pos;
  dado.appendChild(p);
 });

}


/* =====================================================
   VIBRAÇÃO
===================================================== */

function vibrar(){

 if(navigator.vibrate){
  navigator.vibrate(35);
 }

}


/* =====================================================
   SOM SIMPLES DE DADO
===================================================== */

let audio=null;

function somDado(){

 try{

  if(!audio){
   audio=new AudioContext();
  }

  const agora=audio.currentTime;

  for(let i=0;i<5;i++){

   const osc=
    audio.createOscillator();

   const ganho=
    audio.createGain();

   osc.type="triangle";

   osc.frequency.value=
    150+Math.random()*100;

   ganho.gain.setValueAtTime(
    .0001,
    agora+i*.11
   );

   ganho.gain.exponentialRampToValueAtTime(
    .07,
    agora+i*.11+.015
   );

   ganho.gain.exponentialRampToValueAtTime(
    .0001,
    agora+i*.11+.07
   );

   osc.connect(ganho);
   ganho.connect(audio.destination);

   osc.start(agora+i*.11);
   osc.stop(agora+i*.11+.08);

  }

 }catch(e){}

}


/* =====================================================
   JOGAR — DEMONSTRAÇÃO VISUAL
===================================================== */

jogar.addEventListener("click",async()=>{

 jogar.disabled=true;

 mensagem.textContent="🎲 Rolando os dois dados...";

 resultadoDados.textContent="🎲 🎲";

 dado1.classList.remove("rolando");
 dado2.classList.remove("rolando");

 void dado1.offsetWidth;
 void dado2.offsetWidth;

 dado1.classList.add("rolando");
 dado2.classList.add("rolando");

 somDado();
 vibrar();

 const n1=
  Math.floor(Math.random()*6)+1;

 const n2=
  Math.floor(Math.random()*6)+1;

 setTimeout(()=>{

  dado1.classList.remove("rolando");
  dado2.classList.remove("rolando");

  mostrarFace(dado1,n1);
  mostrarFace(dado2,n2);

  const total=n1+n2;

  resultadoDados.textContent=
   n1+" + "+n2+" = "+total;

  if(total>=8){

   mensagem.className="ganha";
   mensagem.textContent="🎉 VITÓRIA!";

  }else{

   mensagem.className="perde";
   mensagem.textContent="😢 NÃO FOI DESSA VEZ";

  }

  vibrar();

  jogar.disabled=false;

 },780);

});

</script>

</body>
</html>
