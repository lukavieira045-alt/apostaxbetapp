<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 15% 15%,#0066ff 0,transparent 25%),
radial-gradient(circle at 85% 20%,#e600ff 0,transparent 25%),
radial-gradient(circle at 50% 100%,#ff0066 0,transparent 30%),
linear-gradient(135deg,#02020c,#09001c,#00132c);

background-size:180% 180%;
animation:fundo 12s ease-in-out infinite alternate;
}

@keyframes fundo{
0%{background-position:0% 0%}
50%{background-position:100% 50%}
100%{background-position:0% 100%}
}


/* LUZES */

.luz{
position:fixed;
width:280px;
height:280px;
border-radius:50%;
filter:blur(90px);
opacity:.45;
pointer-events:none;
z-index:-2;
}

.luz1{
background:#0066ff;
left:-100px;
top:15%;
animation:mov1 8s infinite alternate;
}

.luz2{
background:#ff0088;
right:-100px;
top:40%;
animation:mov2 9s infinite alternate;
}

.luz3{
background:#7b00ff;
left:30%;
bottom:-180px;
animation:mov3 7s infinite alternate;
}

@keyframes mov1{
to{transform:translate(180px,100px) scale(1.3)}
}

@keyframes mov2{
to{transform:translate(-150px,-80px) scale(1.4)}
}

@keyframes mov3{
to{transform:translate(80px,-100px) scale(1.3)}
}


/* PARTÍCULAS */

.particulas{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1;
}

.particulas i{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:white;

box-shadow:
0 0 10px #00ccff,
0 0 20px #ff00aa;

animation:subir linear infinite;
}

.particulas i:nth-child(1){left:5%;animation-duration:7s}
.particulas i:nth-child(2){left:15%;animation-duration:11s}
.particulas i:nth-child(3){left:25%;animation-duration:8s}
.particulas i:nth-child(4){left:35%;animation-duration:13s}
.particulas i:nth-child(5){left:45%;animation-duration:9s}
.particulas i:nth-child(6){left:55%;animation-duration:12s}
.particulas i:nth-child(7){left:65%;animation-duration:8s}
.particulas i:nth-child(8){left:75%;animation-duration:10s}
.particulas i:nth-child(9){left:85%;animation-duration:7s}
.particulas i:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh);
opacity:0;
}
}


/* TÍTULO */

.titulo{
margin-top:20px;
font-size:44px;
font-weight:900;

color:#ffd21c;

text-shadow:
0 0 8px #fff,
0 0 18px #ffd21c,
0 0 35px #ff8c00;
}


/* SALDO REAL */

#saldo{

display:inline-block;

margin:10px auto 15px;

padding:10px 22px;

border-radius:30px;

background:rgba(0,0,0,.6);

border:1px solid #00ff91;

color:#00ff91;

font-size:21px;

font-weight:bold;
}


/* CAIXA */

.caixa{

width:92%;
max-width:440px;

margin:auto;

padding:25px 18px 30px;

border-radius:28px;

background:
linear-gradient(
145deg,
rgba(20,20,35,.94),
rgba(3,4,15,.96)
);

box-shadow:
0 0 25px rgba(255,215,0,.25),
0 0 70px rgba(0,100,255,.18);

backdrop-filter:blur(12px);
}


/* =====================================================
   ÁREA DOS DADOS
   SEM TELA PRETA
===================================================== */

.area-dados{

height:250px;

display:flex;

align-items:center;

justify-content:center;

gap:34px;

position:relative;

background:transparent;

border:0;

box-shadow:none;

perspective:900px;

overflow:visible;
}


/* CHÃO/SOMBRA */

.sombra{

position:absolute;

bottom:35px;

width:150px;

height:22px;

border-radius:50%;

background:rgba(0,0,0,.38);

filter:blur(14px);

}


/* =====================================================
   DADO
===================================================== */

.dado-container{

width:76px;

height:76px;

position:relative;

z-index:3;

perspective:700px;

}


.dado{

width:64px;

height:64px;

position:absolute;

left:6px;

top:6px;

transform-style:preserve-3d;

transition:
transform .65s cubic-bezier(.15,.75,.2,1);

}


/* =====================================================
   FACES
===================================================== */

.face{

position:absolute;

width:64px;

height:64px;

border-radius:13px;

background:
linear-gradient(
145deg,
#ffffff,
#dcdcdc
);

border:2px solid #bcbcbc;

box-shadow:
inset 0 0 7px rgba(0,0,0,.22),
0 7px 12px rgba(0,0,0,.45);

display:grid;

grid-template-columns:repeat(3,1fr);

grid-template-rows:repeat(3,1fr);

padding:8px;

backface-visibility:hidden;
}


/* PONTOS */

.ponto{

width:10px;

height:10px;

border-radius:50%;

background:#151515;

box-shadow:
inset 1px 1px 2px rgba(255,255,255,.3),
0 1px 2px rgba(0,0,0,.4);

align-self:center;

justify-self:center;

}


/* POSIÇÕES */

.centro{
grid-column:2;
grid-row:2;
}

.sup-esq{
grid-column:1;
grid-row:1;
}

.sup-dir{
grid-column:3;
grid-row:1;
}

.inf-esq{
grid-column:1;
grid-row:3;
}

.inf-dir{
grid-column:3;
grid-row:3;
}

.meio-esq{
grid-column:1;
grid-row:2;
}

.meio-dir{
grid-column:3;
grid-row:2;
}


/* FACES DO CUBO */

.face1{
transform:translateZ(32px);
}

.face6{
transform:rotateY(180deg) translateZ(32px);
}

.face2{
transform:rotateY(90deg) translateZ(32px);
}

.face5{
transform:rotateY(-90deg) translateZ(32px);
}

.face3{
transform:rotateX(90deg) translateZ(32px);
}

.face4{
transform:rotateX(-90deg) translateZ(32px);
}


/* =====================================================
   ANIMAÇÃO DE ROLAGEM
===================================================== */

.dado.rolando1{

animation:
rolar1
1.45s
cubic-bezier(.15,.55,.18,1)
both;
}

.dado.rolando2{

animation:
rolar2
1.45s
cubic-bezier(.15,.55,.18,1)
both;
}


@keyframes rolar1{

0%{
transform:
translate(-25px,45px)
rotateX(0deg)
rotateY(0deg)
rotateZ(0deg);
}

15%{
transform:
translate(-45px,-45px)
rotateX(190deg)
rotateY(240deg)
rotateZ(110deg);
}

30%{
transform:
translate(20px,-65px)
rotateX(390deg)
rotateY(480deg)
rotateZ(240deg);
}

45%{
transform:
translate(48px,-15px)
rotateX(590deg)
rotateY(710deg)
rotateZ(370deg);
}

60%{
transform:
translate(-25px,-55px)
rotateX(790deg)
rotateY(950deg)
rotateZ(500deg);
}

75%{
transform:
translate(28px,-18px)
rotateX(960deg)
rotateY(1150deg)
rotateZ(620deg);
}

88%{
transform:
translate(-8px,-5px)
rotateX(1090deg)
rotateY(1280deg)
rotateZ(710deg);
}

100%{
transform:
translate(0,0)
rotateX(1180deg)
rotateY(1380deg)
rotateZ(780deg);
}

}


@keyframes rolar2{

0%{
transform:
translate(25px,45px)
rotateX(0deg)
rotateY(0deg)
rotateZ(0deg);
}

15%{
transform:
translate(45px,-48px)
rotateX(-180deg)
rotateY(-260deg)
rotateZ(-120deg);
}

30%{
transform:
translate(-20px,-68px)
rotateX(-390deg)
rotateY(-500deg)
rotateZ(-260deg);
}

45%{
transform:
translate(-48px,-18px)
rotateX(-590deg)
rotateY(-720deg)
rotateZ(-390deg);
}

60%{
transform:
translate(25px,-58px)
rotateX(-790deg)
rotateY(-970deg)
rotateZ(-520deg);
}

75%{
transform:
translate(-28px,-18px)
rotateX(-960deg)
rotateY(-1160deg)
rotateZ(-650deg);
}

88%{

translate(8px,-5px)

rotateY(-1290deg)
rotateZ(-730deg);
}

100%{
transform:
translate(0,0)
rotateX(-1200deg)
rotateY(-1390deg)
rotateZ(-800deg);
}

<script type="module" src="../saldo.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const saldoEl =
document.getElementById("saldo");

const dado1 =
document.getElementById("dado1");

const dado2 =
document.getElementById("dado2");

const resultadoDados =
document.getElementById("resultadoDados");

const resultado =
document.getElementById("resultado");

const botao =
document.getElementById("botao");

const apostaInput =
document.getElementById("aposta");

const botoesNumero =
document.querySelectorAll(".numero");


let numeroEscolhido = 1;

let jogando = false;


/* =====================================================
   ATUALIZA SALDO REAL
===================================================== */

async function atualizarSaldo(){

try{

if(
window.SistemaSaldo &&
typeof window.SistemaSaldo.get === "function"
){

const valor =
Number(
await window.SistemaSaldo.get()
);

if(
Number.isFinite(valor)
){

saldoEl.textContent =
"💰 Saldo: R$ " +
valor
.toFixed(2)
.replace(".",",");

}

}

}catch(erro){

console.error(
"Erro ao atualizar saldo:",
erro
);

}

}


/* =====================================================
   ESCOLHA DO NÚMERO
===================================================== */

botoesNumero.forEach(
botaoNumero=>{

botaoNumero.addEventListener(
"click",
()=>{

if(jogando)
return;


botoesNumero.forEach(
b=>{
b.classList.remove("ativo");
}
);


botaoNumero.classList.add("ativo");


numeroEscolhido =
Number(
botaoNumero.dataset.numero
);


resultado.className="";

resultado.textContent =
"🎯 Número escolhido: " +
numeroEscolhido;

});

});


/* =====================================================
   SOM DE DADO
===================================================== */

let audioCtx = null;


function somDado(){

try{

if(!audioCtx){

audioCtx =
new(
window.AudioContext ||
window.webkitAudioContext
)();

}


if(
audioCtx.state === "suspended"
){

audioCtx.resume();

}


const agora =
audioCtx.currentTime;


/*
   Vários pequenos impactos.
   O som fica parecido com
   um dado batendo no chão.
*/

for(
let i=0;
i<11;
i++
){

const osc =
audioCtx.createOscillator();

const ganho =
audioCtx.createGain();


osc.type="triangle";


osc.frequency.value =
65 +
Math.random()*150;


const inicio =
agora +
i*0.13;


ganho.gain.setValueAtTime(
0.0001,
inicio
);


ganho.gain.exponentialRampToValueAtTime(
0.055,
inicio+0.008
);


ganho.gain.exponentialRampToValueAtTime(
0.0001,
inicio+0.07
);


osc.connect(ganho);

ganho.connect(
audioCtx.destination
);


osc.start(inicio);

osc.stop(
inicio+0.08
);

}

}catch(e){

console.log(
"Áudio indisponível"
);

}

}


/* =====================================================
   TRANSFORMAÇÃO FINAL DAS FACES
=====================================================

   Cada transformação coloca uma face
   específica olhando para frente.

   1 = frente
   6 = trás
   2 = lado direito
   5 = lado esquerdo
   3 = cima
   4 = baixo
*/

const faces = {

1:
"rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

2:
"rotateY(-90deg) rotateX(0deg) rotateZ(0deg)",

3:
"rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

4:
"rotateX(90deg) rotateY(0deg) rotateZ(0deg)",

5:
"rotateY(90deg) rotateX(0deg) rotateZ(0deg)",

6:
"rotateY(180deg) rotateX(0deg) rotateZ(0deg)"

};


/* =====================================================
   POSICIONA O DADO NA FACE FINAL
===================================================== */

function mostrarFace(dado, numero, giroExtra){

dado.classList.remove(
"rolando1",
"rolando2"
);


/*
   Pequena rotação adicional
   para não parecer uma troca instantânea.
*/

dado.style.transform =
faces[numero] +
" rotateZ(" +
giroExtra +
"deg)";

}


/* =====================================================
   JOGAR
===================================================== */

botao.addEventListener(
"click",
async()=>{


if(jogando)
return;


/*
   VERIFICA SISTEMA DE SALDO
*/

if(!window.SistemaSaldo){

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Sistema de saldo não encontrado.";

return;

}


const aposta =
Number(
apostaInput.value
);


/*
   VALIDA APOSTA
*/

if(
!Number.isFinite(aposta) ||
aposta < 0.10
){

resultado.className =
"derrota";

resultado.textContent =
"⚠️ A aposta mínima é R$ 0,10.";

return;

}


/*
   CONSULTA SALDO REAL
*/

let saldoAtual;


try{

saldoAtual =
Number(
await window.SistemaSaldo.get()
);

}catch(erro){

console.error(erro);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Não foi possível consultar o saldo.";

return;

}


if(
!Number.isFinite(saldoAtual) ||
saldoAtual < aposta
){

resultado.className =
"derrota";

resultado.textContent =
"❌ Saldo insuficiente.";

await atualizarSaldo();

return;

}


/*
   BLOQUEIA
*/

jogando = true;

botao.disabled = true;


/*
   DEBITA APOSTA REAL
*/

try{

await window.SistemaSaldo.debitar(
aposta
);

}catch(erro){

console.error(erro);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Não foi possível realizar a aposta.";

jogando = false;

botao.disabled = false;

await atualizarSaldo();

return;

}


await atualizarSaldo();


/*
   MENSAGEM
*/

resultado.className="";

resultado.textContent =
"🎲 ROLANDO...";

resultadoDados.textContent =
"🎲 + 🎲";


/*
=====================================================
SORTEIO DOS DOIS DADOS
=====================================================

Cada dado recebe um número independente.

Exemplos possíveis:

1 + 6
2 + 2
3 + 5
4 + 1
6 + 3

Nunca fica preso no 1.
*/

const numero1 =
Math.floor(
Math.random()*6
)+1;

const numero2 =
Math.floor(
Math.random()*6
)+1;


/*
   REINICIA TRANSFORMAÇÕES
*/

dado1.style.transform="";
dado2.style.transform="";


dado1.classList.remove(
"rolando1"
);

dado2.classList.remove(
"rolando2"
);


/*
   FORÇA REINÍCIO DA ANIMAÇÃO
*/

void dado1.offsetWidth;
void dado2.offsetWidth;


/*
   COMEÇA A ROLAGEM
*/

dado1.classList.add(
"rolando1"
);

dado2.classList.add(
"rolando2"
);


/*
   SOM
*/

somDado();


/*
   APÓS 1,45s OS DADOS PARAM
*/

setTimeout(
async()=>{


/*
   FACE FINAL REAL DO DADO 1
*/

mostrarFace(
dado1,
numero1,
0
);


/*
   FACE FINAL REAL DO DADO 2
*/

mostrarFace(
dado2,
numero2,
0
);


/*
   MOSTRA OS RESULTADOS
*/

resultadoDados.textContent =
"🎲 " +
numero1 +
"   +   " +
"🎲 " +
numero2 +
"   =   " +
(numero1 + numero2);


/*
=====================================================
LÓGICA DA APOSTA
=====================================================

Se escolheu 2:

2 + 6 = GANHA

Se escolheu 2:

4 + 6 = PERDE

*/

const acertou =
numero1 === numeroEscolhido ||
numero2 === numeroEscolhido;


/*
=====================================================
GANHOU
=====================================================
*/

if(acertou){

const premio =
aposta * 2;


try{

await window.SistemaSaldo.ganhar(
aposta,
2
);


resultado.className =
"vitoria";

resultado.textContent =
"🎉 GANHOU R$ " +
premio
.toFixed(2)
.replace(".",",");


}catch(erro){

console.error(erro);

resultado.className =
"derrota";

resultado.textContent =
"⚠️ Erro ao registrar o prêmio.";

}

}


/*
=====================================================
PERDEU
=====================================================
*/

else{

resultado.className =
"derrota";

resultado.textContent =
"😢 PERDEU! O número " +
numeroEscolhido +
" não saiu.";

}


/*
   SALDO REAL FINAL
*/

await atualizarSaldo();


/*
   LIBERA BOTÃO
*/

jogando = false;

botao.disabled = false;


},
1450
);

});


/* =====================================================
   SALDO AO ABRIR
===================================================== */

atualizarSaldo();

</script>
