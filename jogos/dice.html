<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100vh;
overflow-x:hidden;
color:#fff;
text-align:center;

background:
radial-gradient(circle at 15% 20%,#19cfff 0,transparent 24%),
radial-gradient(circle at 85% 20%,#ff28bd 0,transparent 25%),
radial-gradient(circle at 50% 90%,#7b38ff 0,transparent 30%),
linear-gradient(135deg,#071329,#10051d,#06152b);

position:relative;
}

/* FUNDO ANIMADO */

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;

background:
radial-gradient(circle at 20% 30%,rgba(0,220,255,.18),transparent 22%),
radial-gradient(circle at 80% 70%,rgba(255,0,180,.16),transparent 25%);

animation:luzes 9s ease-in-out infinite alternate;
}

@keyframes luzes{

from{
transform:scale(1);
}

to{
transform:scale(1.08);
}

}


/* =====================================================
   SALDO
===================================================== */

#saldo{

display:inline-block;

margin:20px auto 8px;

padding:10px 22px;

border:1px solid #00ff91;

border-radius:25px;

background:rgba(0,0,0,.45);

color:#00ff91;

font-size:20px;

font-weight:bold;

box-shadow:
0 0 18px rgba(0,255,145,.25);

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo{

margin:5px 0 8px;

font-size:42px;

font-weight:900;

color:#ffd21c;

text-shadow:
0 0 8px #fff,
0 0 20px #ffd21c,
0 0 35px #ff8c00;

}


/* =====================================================
   ÁREA DOS DADOS
===================================================== */

.area-dados{

width:100%;

max-width:500px;

margin:auto;

min-height:250px;

display:flex;

justify-content:center;

align-items:center;

gap:25px;

position:relative;

}


/* =====================================================
   DADO
===================================================== */

.dado{

width:88px;

height:88px;

border-radius:17px;

background:
linear-gradient(
145deg,
#ffffff,
#dddddd
);

border:3px solid #aaa;

position:relative;

box-shadow:
0 13px 20px rgba(0,0,0,.45),
inset 0 0 14px rgba(0,0,0,.15);

}


/* =====================================================
   PONTOS
===================================================== */

.ponto{

position:absolute;

width:13px;

height:13px;

border-radius:50%;

background:#151515;

box-shadow:
inset 0 2px 3px #555;

}

.centro{

top:50%;
left:50%;

transform:
translate(-50%,-50%);

}

.tl{
top:17%;
left:17%;
}

.tr{
top:17%;
right:17%;
}

.ml{

top:50%;
left:17%;

transform:
translateY(-50%);

}

.mr{

top:50%;
right:17%;

transform:
translateY(-50%);

}

.bl{
bottom:17%;
left:17%;
}

.br{
bottom:17%;
right:17%;
}


/* =====================================================
   ROLAGEM MAIS NATURAL
===================================================== */

.dado.rolando{

animation:
rolarDado .78s
cubic-bezier(.2,.75,.25,1);

}

@keyframes rolarDado{

0%{

transform:
translate(0,0)
rotate(0deg);

}

20%{

transform:
translate(-10px,-28px)
rotate(65deg);

}

40%{

transform:
translate(8px,5px)
rotate(145deg);

}

60%{

transform:
translate(-7px,-20px)
rotate(225deg);

}

80%{

transform:
translate(5px,3px)
rotate(300deg);

}

100%{

transform:
translate(0,0)
rotate(360deg);

}

}


/* =====================================================
   RESULTADO
===================================================== */

.resultado-dados{

min-height:50px;

font-size:32px;

font-weight:900;

color:#ffd21c;

text-shadow:
0 0 15px #ffd21c;

}


/* =====================================================
   MENSAGEM
===================================================== */

#mensagem{

min-height:35px;

font-size:21px;

font-weight:bold;

}

.ganha{

color:#00ff91 !important;

text-shadow:
0 0 10px #00ff91;

}

.perde{

color:#ff416d !important;

text-shadow:
0 0 10px #ff416d;

}


/* =====================================================
   SELEÇÃO DO NÚMERO
===================================================== */

.selecao{

width:92%;

max-width:420px;

margin:10px auto;

padding:14px;

border-radius:18px;

background:rgba(0,0,0,.35);

border:
1px solid rgba(255,255,255,.15);

}

.selecao-titulo{

color:#aaa;

font-size:13px;

margin-bottom:10px;

}

.numeros{

display:flex;

justify-content:center;

gap:8px;

}

.numero{

width:45px;

height:45px;

padding:0;

margin:0;

border-radius:50%;

border:1px solid #466083;

background:
linear-gradient(
180deg,
#172541,
#091221
);

color:white;

font-size:19px;

font-weight:bold;

box-shadow:none;

}

.numero.ativo{

background:
linear-gradient(
180deg,
#ffe66b,
#ffad00
);

color:#211600;

border-color:#ffe78a;

box-shadow:
0 0 14px rgba(255,210,28,.55);

}


/* =====================================================
   APOSTA
===================================================== */

.apostas{

width:92%;

max-width:420px;

margin:10px auto;

padding:12px;

border-radius:18px;

background:rgba(0,0,0,.30);

border:
1px solid rgba(255,255,255,.12);

}

.apostas-titulo{

color:#aaa;

font-size:13px;

margin-bottom:9px;

}

.valores{

display:flex;

justify-content:center;

gap:7px;

flex-wrap:wrap;

}

.valor{

padding:8px 12px;

border-radius:18px;

background:#111b31;

border:1px solid #466083;

color:white;

font-weight:bold;

}


/* =====================================================
   BOTÃO
===================================================== */

#jogar{

width:90%;

max-width:320px;

padding:16px;

margin-top:12px;

border:0;

border-radius:17px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffad00
);

color:#211600;

font-size:21px;

font-weight:900;

box-shadow:
0 0 18px rgba(255,190,0,.4);

cursor:pointer;

}

#jogar:active{

transform:scale(.96);

}

#jogar:disabled{

opacity:.55;

}


/* =====================================================
   INFO
===================================================== */

.info{

margin:18px auto;

color:#bfc7d8;

font-size:14px;

line-height:1.7;

}

@media(max-width:430px){

.titulo{
font-size:36px;
}

.area-dados{

min-height:230px;

gap:18px;

}

.dado{

width:78px;

height:78px;

}

.ponto{

width:12px;

height:12px;

}

.numero{

width:42px;

height:42px;

}

}

</style>

</head>


<body>


<!-- SALDO -->

<div id="saldo">

💰 Saldo: R$ 0,00

</div>


<div class="titulo">

🎲 DICE

</div>


<!-- =====================================================
     DADOS
===================================================== -->

<div class="area-dados">


<div class="dado" id="dado1">

<span class="ponto centro"></span>

</div>


<div class="dado" id="dado2">

<span class="ponto centro"></span>

</div>


</div>


<div
class="resultado-dados"
id="resultadoDados">

🎲 🎲

</div>


<div id="mensagem">

Escolha o número

</div>


<!-- =====================================================
     ESCOLHA DO NÚMERO
===================================================== -->

<div class="selecao">

<div class="selecao-titulo">

ESCOLHA O NÚMERO

</div>


<div class="numeros">

<button class="numero ativo" data-numero="1">
1
</button>

<button class="numero" data-numero="2">
2
</button>

<button class="numero" data-numero="3">
3
</button>

<button class="numero" data-numero="4">
4
</button>

<button class="numero" data-numero="5">
5
</button>

<button class="numero" data-numero="6">
6
</button>

</div>

</div>


<!-- =====================================================
     APOSTA
===================================================== -->

<div class="apostas">

<div class="apostas-titulo">

VALOR DA APOSTA

</div>


<div class="valores">

<div class="valor">
R$ 0,50
</div>

<div class="valor">
R$ 1,00
</div>

<div class="valor">
R$ 2,00
</div>

<div class="valor">
R$ 5,00
</div>

<div class="valor">
R$ 10,00
</div>

</div>

</div>


<button id="jogar">

🎲 JOGAR

</button>


<div class="info">

<div class="ganha">

🎉 Se o número escolhido aparecer nos dados, ganha 2X

</div>

<div class="perde">

😢 Se não aparecer, perde a aposta

</div>

</div>


<script type="module" src="../saldo.js"></script>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const APOSTA = 1.00;

const MULTIPLICADOR = 2;


/* =====================================================
   ELEMENTOS
===================================================== */

const saldoEl =
document.getElementById("saldo");

const dado1 =
document.getElementById("dado1");

const dado2 =
document.getElementById("dado2");

const resultadoDados =
document.getElementById("resultadoDados");

const mensagem =
document.getElementById("mensagem");

const jogar =
document.getElementById("jogar");

const botoesNumero =
document.querySelectorAll(".numero");


let numeroEscolhido = 1;

let jogando = false;


/* =====================================================
   SALDO
===================================================== */

async function atualizarSaldo(){

try{

if(
window.SistemaSaldo &&
window.SistemaSaldo.get
){

const valor =
await window.SistemaSaldo.get();

saldoEl.textContent =
"💰 Saldo: R$ " +
Number(valor)
.toFixed(2)
.replace(".",",");

}

}catch(erro){

console.error(
"Erro ao atualizar saldo:",
erro
);

}

}


/* =====================================================
   ESCOLHER NÚMERO
===================================================== */

botoesNumero.forEach(botao=>{

botao.addEventListener(
"click",
()=>{

if(jogando) return;

botoesNumero.forEach(b=>{
b.classList.remove("ativo");
});

botao.classList.add("ativo");

numeroEscolhido =
Number(
botao.dataset.numero
);

mensagem.textContent =
"🎯 Número escolhido: " +
numeroEscolhido;

mensagem.className="";

}

);

});


/* =====================================================
   MOSTRAR FACE
===================================================== */

function mostrarFace(
dado,
numero
){

dado.innerHTML="";

const faces={

1:["centro"],

2:["tl","br"],

3:["tl","centro","br"],

4:["tl","tr","bl","br"],

5:["tl","tr","centro","bl","br"],

6:["tl","tr","ml","mr","bl","br"]

};

faces[numero].forEach(pos=>{

const ponto =
document.createElement("span");

ponto.className =
"ponto "+pos;

dado.appendChild(ponto);

});

}


/* =====================================================
   VIBRAÇÃO
===================================================== */

function vibrar(){

if(
navigator.vibrate
){

navigator.vibrate([
25,
30,
25
]);

}

}


/* =====================================================
   SOM DE DADO
===================================================== */

let audioCtx=null;


function somDado(){

try{

if(!audioCtx){

audioCtx =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioCtx.state ===
"suspended"
){

audioCtx.resume();

}

const agora =
audioCtx.currentTime;


/*
   Pequenos impactos
   simulando o dado
   batendo no chão.
*/

for(
let i=0;
i<6;
i++
){

const osc =
audioCtx.createOscillator();

const ganho =
audioCtx.createGain();

osc.type="triangle";

osc.frequency.value =
130 +
Math.random()*100;

ganho.gain.setValueAtTime(
0.0001,
agora + i*0.10
);

ganho.gain.exponentialRampToValueAtTime(
0.07,
agora + i*0.10 + 0.015
);

ganho.gain.exponentialRampToValueAtTime(
0.0001,
agora + i*0.10 + 0.065
);

osc.connect(ganho);

ganho.connect(
audioCtx.destination
);

osc.start(
agora + i*0.10
);

osc.stop(
agora + i*0.10 + 0.075
);

}

}catch(e){

console.log(e);

}

}


/* =====================================================
   JOGAR
===================================================== */

jogar.addEventListener(
"click",
async()=>{

if(jogando)
return;


if(
!window.SistemaSaldo
){

mensagem.textContent =
"⚠️ Sistema de saldo não encontrado.";

return;

}


jogando=true;

jogar.disabled=true;


/* =====================================================
   VERIFICA SALDO REAL
===================================================== */

let saldoAtual=0;

try{

saldoAtual =
Number(
await window.SistemaSaldo.get()
);

}catch(e){

saldoAtual=0;

}


if(
!Number.isFinite(saldoAtual) ||
saldoAtual < APOSTA
){

mensagem.textContent =
"❌ Saldo insuficiente.";

mensagem.className="perde";

jogando=false;

jogar.disabled=false;

return;

}


/* =====================================================
   DEBITA A APOSTA REAL
===================================================== */

try{

await window.SistemaSaldo.debitar(
APOSTA
);

}catch(erro){

console.error(
"Erro ao debitar:",
erro
);

mensagem.textContent =
"⚠️ Não foi possível realizar a aposta.";

mensagem.className="perde";

jogando=false;

jogar.disabled=false;

await atualizarSaldo();

return;

}


/* ATUALIZA IMEDIATAMENTE */

await atualizarSaldo();


/* =====================================================
   INICIA GIRO
===================================================== */

mensagem.className="";

mensagem.textContent =
"🎲 Rolando...";

resultadoDados.textContent =
"🎲 🎲";


dado1.classList.remove(
"rolando"
);

dado2.classList.remove(
"rolando"
);

void dado1.offsetWidth;

void dado2.offsetWidth;

dado1.classList.add(
"rolando"
);

dado2.classList.add(
"rolando"
);


somDado();

vibrar();


/* =====================================================
   SORTEIO
===================================================== */

const numero1 =
Math.floor(
Math.random()*6
)+1;

const numero2 =
Math.floor(
Math.random()*6
)+1;


/* =====================================================
   FINAL
===================================================== */

setTimeout(
async()=>{

dado1.classList.remove(
"rolando"
);

dado2.classList.remove(
"rolando"
);


mostrarFace(
dado1,
numero1
);

mostrarFace(
dado2,
numero2
);


resultadoDados.textContent =
numero1 +
" + " +
numero2 +
" = " +
(numero1+numero2);


/* =====================================================
   VERIFICA NÚMERO ESCOLHIDO
===================================================== */

const ganhou =
numero1 === numeroEscolhido ||
numero2 === numeroEscolhido;


if(ganhou){

const premio =
APOSTA *
MULTIPLICADOR;


/*
   Credita pelo SistemaSaldo.
*/

try{

if(
window.SistemaSaldo.ganhar
){

await window.SistemaSaldo.ganhar(
APOSTA,
MULTIPLICADOR
);

}else if(
window.SistemaSaldo.creditar
){

await window.SistemaSaldo.creditar(
premio
);

}

mensagem.className =
"ganha";

mensagem.textContent =
"🎉 ACERTOU! +" +
"R$ " +
premio
.toFixed(2)
.replace(".",",");

vibrar();


}catch(erro){

console.error(
"Erro ao creditar:",
erro
);

mensagem.className =
"perde";

mensagem.textContent =
"⚠️ Erro ao registrar o prêmio.";

}

}else{

mensagem.className =
"perde";

mensagem.textContent =
"😢 Não saiu o número " +
numeroEscolhido +
".";

vibrar();

}


/* =====================================================
   ATUALIZA SALDO FINAL
===================================================== */

await atualizarSaldo();


jogando=false;

jogar.disabled=false;

},
780
);

});


/* =====================================================
   INICIALIZA
===================================================== */

atualizarSaldo();

</script>

</body>

</html>
