<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dice ApostaXBet</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

html,body{
margin:0;
padding:0;
min-height:100%;
}

body{

color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 15% 20%, rgba(0,110,255,.35), transparent 25%),
radial-gradient(circle at 85% 20%, rgba(255,0,100,.30), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(130,0,255,.35), transparent 30%),
linear-gradient(135deg,#02000c,#09001b,#00152b,#100018);

background-size:
100% 100%,
100% 100%,
100% 100%,
400% 400%;

animation:fundo 12s ease infinite;

min-height:100vh;

}

@keyframes fundo{

0%{
background-position:0% 50%,0% 50%,0% 50%,0% 50%;
}

50%{
background-position:100% 50%,20% 80%,80% 20%,100% 50%;
}

100%{
background-position:0% 50%,0% 50%,0% 50%,0% 50%;
}

}


/* LUZES COLORIDAS */

body::before,
body::after{

content:"";

position:fixed;

width:300px;
height:300px;

border-radius:50%;

filter:blur(80px);

opacity:.45;

pointer-events:none;

z-index:-1;

}

body::before{

background:#0066ff;

left:-120px;
top:20%;

animation:luz1 7s infinite alternate;

}

body::after{

background:#ff0088;

right:-120px;
bottom:10%;

animation:luz2 8s infinite alternate;

}

@keyframes luz1{

from{
transform:translate(0,0) scale(1);
}

to{
transform:translate(180px,80px) scale(1.4);
}

}

@keyframes luz2{

from{
transform:translate(0,0) scale(1);
}

to{
transform:translate(-180px,-100px) scale(1.4);
}

}


/* PARTÍCULAS */

.particulas{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:-1;

}

.particulas span{

position:absolute;

width:5px;
height:5px;

border-radius:50%;

background:#fff;

box-shadow:
0 0 8px #fff,
0 0 18px #00ccff;

animation:subir linear infinite;

}

.particulas span:nth-child(1){left:5%;animation-duration:8s;animation-delay:1s}
.particulas span:nth-child(2){left:15%;animation-duration:11s;animation-delay:2s}
.particulas span:nth-child(3){left:25%;animation-duration:7s;animation-delay:4s}
.particulas span:nth-child(4){left:35%;animation-duration:10s;animation-delay:1s}
.particulas span:nth-child(5){left:45%;animation-duration:9s;animation-delay:5s}
.particulas span:nth-child(6){left:55%;animation-duration:12s;animation-delay:2s}
.particulas span:nth-child(7){left:65%;animation-duration:8s;animation-delay:4s}
.particulas span:nth-child(8){left:75%;animation-duration:10s;animation-delay:1s}
.particulas span:nth-child(9){left:85%;animation-duration:7s;animation-delay:3s}
.particulas span:nth-child(10){left:95%;animation-duration:11s;animation-delay:5s}

@keyframes subir{

0%{
transform:translateY(110vh) scale(.3);
opacity:0;
}

15%{
opacity:1;
}

85%{
opacity:1;
}

100%{
transform:translateY(-20vh) scale(1.5);
opacity:0;
}

}


/* TÍTULO */

h1{

font-size:48px;

margin:25px 0 10px;

color:#ffd700;

text-shadow:
0 0 5px #fff,
0 0 15px #ffd700,
0 0 35px #ff8c00;

animation:titulo 2s infinite alternate;

}

@keyframes titulo{

from{
transform:scale(1);
}

to{
transform:scale(1.04);
}

}


/* SALDO */

#saldo{

display:inline-block;

color:#00ff88;

font-size:22px;

font-weight:bold;

margin:15px;

padding:12px 25px;

border-radius:30px;

background:rgba(0,0,0,.55);

border:1px solid rgba(0,255,136,.5);

box-shadow:
0 0 15px rgba(0,255,136,.25),
inset 0 0 15px rgba(0,255,136,.08);

}


/* CAIXA */

.caixa{

width:92%;
max-width:430px;

margin:10px auto 30px;

padding:25px 20px 30px;

background:

linear-gradient(
145deg,
rgba(20,20,30,.94),
rgba(5,5,15,.97)
);

border:2px solid #ffd700;

border-radius:25px;

box-shadow:

0 0 15px #ffd700,
0 0 50px rgba(0,119,255,.35),
0 20px 60px rgba(0,0,0,.7);

backdrop-filter:blur(10px);

}


/* ÁREA DO DADO */

.area-dado{

height:250px;

display:flex;

align-items:center;

justify-content:center;

perspective:900px;

}


/* DADO 3D */

.dado3d{

width:120px;
height:120px;

position:relative;

transform-style:preserve-3d;

transition:transform .3s;

filter:
drop-shadow(0 25px 15px rgba(0,0,0,.7))
drop-shadow(0 0 20px rgba(255,215,0,.35));

}


/* FACES */

.face{

position:absolute;

width:120px;
height:120px;

background:

linear-gradient(
145deg,
#ffffff,
#d9d9d9 55%,
#999999
);

border:4px solid #eeeeee;

border-radius:22px;

box-shadow:
inset 5px 5px 12px rgba(255,255,255,.9),
inset -8px -8px 15px rgba(0,0,0,.25);

display:grid;

grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(3,1fr);

padding:15px;

}


/* PONTOS */

.ponto{

width:20px;
height:20px;

background:
radial-gradient(circle at 35% 30%,#555,#050505 70%);

border-radius:50%;

box-shadow:
inset 2px 2px 4px rgba(255,255,255,.3),
0 2px 4px rgba(0,0,0,.7);

align-self:center;
justify-self:center;

}


/* POSIÇÃO DAS FACES */

.frente{
transform:translateZ(60px);
}

.tras{
transform:rotateY(180deg) translateZ(60px);
}

.direita{
transform:rotateY(90deg) translateZ(60px);
}

.esquerda{
transform:rotateY(-90deg) translateZ(60px);
}

.cima{
transform:rotateX(90deg) translateZ(60px);
}

.baixo{
transform:rotateX(-90deg) translateZ(60px);
}


/* ROLAGEM */

.rolando{

animation:

rolar 1.4s cubic-bezier(.2,.8,.2,1);

}

@keyframes rolar{

0%{
transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
}

25%{
transform:rotateX(180deg) rotateY(220deg) rotateZ(90deg) scale(1.12);
}

50%{
transform:rotateX(360deg) rotateY(450deg) rotateZ(180deg) scale(1.18);
}

75%{
transform:rotateX(540deg) rotateY(680deg) rotateZ(270deg) scale(1.10);
}

100%{
transform:rotateX(720deg) rotateY(900deg) rotateZ(360deg) scale(1);
}

}


/* RESULTADO */

#resultado{

font-size:25px;

font-weight:bold;

color:#ffd700;

min-height:35px;

margin:10px 0 20px;

text-shadow:
0 0 10px #ffd700;

}


/* INPUT */

input{

width:150px;

padding:14px;

border-radius:12px;

border:2px solid #555;

background:#080808;

color:white;

font-size:20px;

font-weight:bold;

text-align:center;

margin:10px;

outline:none;

}

input:focus{

border-color:#ffd700;

box-shadow:0 0 15px #ffd700;

}


/* BOTÃO */

button{

padding:16px 50px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffb700
);

border:2px solid #fff0a0;

border-radius:15px;

font-size:20px;

font-weight:bold;

color:#241700;

cursor:pointer;

box-shadow:
0 0 10px #ffd700,
0 0 30px rgba(255,170,0,.5);

transition:.2s;

}

button:hover{

transform:scale(1.06);

box-shadow:
0 0 20px #ffd700,
0 0 45px #ff8800;

}

button:active{

transform:scale(.94);

}

button:disabled{

opacity:.5;

cursor:not-allowed;

transform:none;

}


/* TEXTO INFORMATIVO */

.info{

margin-top:25px;

padding:15px;

border-top:1px solid rgba(255,255,255,.15);

font-size:14px;

color:#bbb;

}

.ganha{

color:#00ff88;
font-weight:bold;
}

.perde{

color:#ff426d;
font-weight:bold;
}


/* BRILHO DO RESULTADO */

.vitoria{

color:#00ff88 !important;

animation:
ganhou .7s infinite alternate;

}

.derrota{

color:#ff426d !important;

}

@keyframes ganhou{

from{
text-shadow:0 0 5px #00ff88;
transform:scale(1);
}

to{
text-shadow:
0 0 10px #00ff88,
0 0 30px #00ff88;

transform:scale(1.08);
}

}


/* RESPONSIVO */

@media(max-width:450px){

h1{
font-size:40px;
}

.caixa{
padding:20px 15px 25px;
}

.area-dado{
height:220px;
}

.dado3d,
.face{
width:105px;
height:105px;
}

.face{
padding:12px;
}

.frente{
transform:translateZ(52px);
}

.tras{
transform:rotateY(180deg) translateZ(52px);
}

.direita{
transform:rotateY(90deg) translateZ(52px);
}

.esquerda{
transform:rotateY(-90deg) translateZ(52px);
}

.cima{
transform:rotateX(90deg) translateZ(52px);
}

.baixo{
transform:rotateX(-90deg) translateZ(52px);
}

.ponto{
width:17px;
height:17px;
}

button{
width:90%;
}

}


/* FUNDO COM CÍRCULOS */

.anel{

position:fixed;

width:400px;
height:400px;

border:2px solid rgba(0,140,255,.15);

border-radius:50%;

left:50%;
top:55%;

transform:translate(-50%,-50%);

pointer-events:none;

z-index:-1;

animation:girarAnel 12s linear infinite;

}

.anel::before{

content:"";

position:absolute;

inset:30px;

border:2px solid rgba(255,0,150,.15);

border-radius:50%;

}

.anel::after{

content:"";

position:absolute;

inset:70px;

border:2px solid rgba(255,215,0,.12);

border-radius:50%;

}

@keyframes girarAnel{

from{
transform:translate(-50%,-50%) rotate(0deg);
}

to{
transform:translate(-50%,-50%) rotate(360deg);
}

}

</style>

</head>

<body>


<!-- FUNDO ANIMADO -->

<div class="particulas">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="anel"></div>


<h1>🎲 DICE</h1>


<div id="saldo"></div>


<div class="caixa">


<div class="area-dado">


<div id="dado" class="dado3d">


<!-- FRENTE -->

<div class="face frente">

<div></div>
<div></div>
<div></div>

<div></div>
<div class="ponto"></div>
<div></div>

<div></div>
<div></div>
<div></div>

</div>


<!-- TRÁS -->

<div class="face tras">

<div class="ponto"></div>
<div></div>
<div class="ponto"></div>

<div></div>
<div></div>
<div></div>

<div class="ponto"></div>
<div></div>
<div class="ponto"></div>

</div>


<!-- DIREITA -->

<div class="face direita">

<div class="ponto"></div>
<div></div>
<div></div>

<div></div>
<div class="ponto"></div>
<div></div>

<div></div>
<div></div>
<div class="ponto"></div>

</div>


<!-- ESQUERDA -->

<div class="face esquerda">

<div class="ponto"></div>
<div></div>
<div></div>

<div class="ponto"></div>
<div></div>

<div></div>
<div></div>

<!-- CIMA -->

<div class="face cima">

<div class="ponto"></div>
<div></div>

<div></div>

<div></div>

<div></div>

<div id="resultado">
Escolha sua sorte
</div>


<input
id="aposta"
type="number"
value="1"
min="0.10"
step="0.10"
>


<br>


<button id="botao" onclick="jogar()">
🎲 JOGAR
</button>


<div class="info">

<div class="ganha">
🎉 GANHA: 4, 5 ou 6 = 2X
</div>

<br>

<div class="perde">
😢 PERDE: 1, 2 ou 3 = 0X
</div>

</div>

<script>


let saldo =
Number(localStorage.getItem("saldo") || 1000);


function atualizar(){

document.getElementById("saldo").innerHTML =
"💰 Saldo: R$ " + saldo.toFixed(2);

localStorage.setItem("saldo",saldo);

}


atualizar();


function mostrarFace(numero){

const dado =
document.getElementById("dado");


/*

Cada posição mostra uma face diferente.
A rotação final acontece depois da animação.

*/

const rotações = {

1:"rotateX(0deg) rotateY(0deg)",

2:"rotateY(-90deg)",

3:"rotateX(-90deg)",

4:"rotateY(90deg)",

5:"rotateX(90deg)",

6:"rotateY(180deg)"

};

dado.style.transform =
rotações[numero];

}


function jogar(){

const aposta =
Number(document.getElementById("aposta").value);

const botao =
document.getElementById("botao");

const dado =
document.getElementById("dado");

const resultado =
document.getElementById("resultado");


if(aposta < 0.10){

alert("A aposta mínima é R$ 0,10.");

return;

}


if(aposta > saldo){

alert("Saldo insuficiente.");

return;

}


/* BLOQUEIA O BOTÃO */

botao.disabled=true;


/* RETIRA APOSTA */

saldo-=aposta;

atualizar();


/* LIMPA RESULTADO */

resultado.className="";
resultado.innerHTML="🎲 Rolando...";


/* REMOVE ANIMAÇÃO ANTIGA */

dado.classList.remove("rolando");


/* FORÇA REINÍCIO DA ANIMAÇÃO */

void dado.offsetWidth;


/* COMEÇA ROLAGEM */

dado.classList.add("rolando");


/* RESULTADO */

const numero =
Math.floor(Math.random()*6)+1;


/* ESPERA O DADO ROLAR */

setTimeout(function(){


dado.classList.remove("rolando");


mostrarFace(numero);


/* VITÓRIA */

if(numero>=4){

const premio =
aposta*2;

saldo+=premio;

resultado.className="vitoria";

resultado.innerHTML =
"🎉 Ganhou R$ " +
premio.toFixed(2) +
" — Dado: " +
numero;


/* DERROTA */

}else{

resultado.className="derrota";

resultado.innerHTML =
"😢 Perdeu — Dado: " +
numero;

}


atualizar();


/* LIBERA BOTÃO */

botao.disabled=false;


},1400);

}


</script>
