<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
color:white;
text-align:center;
overflow-x:hidden;

background:
radial-gradient(circle at 15% 15%,#0066ff 0,transparent 25%),
radial-gradient(circle at 85% 20%,#e600ff 0,transparent 25%),
radial-gradient(circle at 50% 100%,#ff0066 0,transparent 30%),
linear-gradient(135deg,#02020c,#09001c,#00132c);

background-size:180% 180%;
animation:fundo 12s ease-in-out infinite alternate;
}

@keyframes fundo{
0%{background-position:0% 0%}
50%{background-position:100% 50%}
100%{background-position:0% 100%}
}

.luz{
position:fixed;
width:280px;
height:280px;
border-radius:50%;
filter:blur(90px);
opacity:.45;
pointer-events:none;
z-index:-2;
}

.luz1{
background:#0066ff;
left:-100px;
top:15%;
animation:mov1 8s infinite alternate;
}

.luz2{
background:#ff0088;
right:-100px;
top:40%;
animation:mov2 9s infinite alternate;
}

.luz3{
background:#7b00ff;
left:30%;
bottom:-180px;
animation:mov3 7s infinite alternate;
}

@keyframes mov1{
to{
transform:
translate(180px,100px)
scale(1.3)
}
}

@keyframes mov2{
to{
transform:
translate(-150px,-80px)
scale(1.4)
}
}

@keyframes mov3{
to{
transform:
translate(80px,-100px)
scale(1.3)
}
}

.particulas{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1;
}

.particulas i{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:white;

box-shadow:
0 0 10px #00ccff,
0 0 20px #ff00aa;

animation:subir linear infinite;
}

.particulas i:nth-child(1){left:5%;animation-duration:7s}
.particulas i:nth-child(2){left:15%;animation-duration:11s}
.particulas i:nth-child(3){left:25%;animation-duration:8s}
.particulas i:nth-child(4){left:35%;animation-duration:13s}
.particulas i:nth-child(5){left:45%;animation-duration:9s}
.particulas i:nth-child(6){left:55%;animation-duration:12s}
.particulas i:nth-child(7){left:65%;animation-duration:8s}
.particulas i:nth-child(8){left:75%;animation-duration:10s}
.particulas i:nth-child(9){left:85%;animation-duration:7s}
.particulas i:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh);
opacity:0;
}

}

.titulo{
margin-top:20px;
font-size:44px;
font-weight:900;
color:#ffd21c;

text-shadow:
0 0 8px #fff,
0 0 18px #ffd21c,
0 0 35px #ff8c00;
}

#displaySaldo{

display:inline-block;

margin:8px auto 18px;

padding:11px 24px;

border-radius:30px;

background:rgba(0,0,0,.60);

border:1px solid #00ff91;

color:#00ff91;

font-size:21px;

font-weight:bold;

min-width:190px;

box-shadow:
0 0 12px rgba(0,255,145,.20);

}

.caixa{

width:92%;
max-width:440px;

margin:auto;

padding:25px 18px 30px;

border-radius:28px;

background:
linear-gradient(
145deg,
rgba(20,20,35,.94),
rgba(3,4,15,.96)
);

box-shadow:
0 0 25px rgba(255,215,0,.25),
0 0 70px rgba(0,100,255,.18);

backdrop-filter:blur(12px);

}

.area-dados{

height:250px;

display:flex;

align-items:center;

justify-content:center;

gap:34px;

position:relative;

perspective:900px;

background:transparent;

border:0;

box-shadow:none;

}

.sombra{

position:absolute;

bottom:35px;

width:150px;

height:22px;

border-radius:50%;

background:rgba(0,0,0,.25);

filter:blur(14px);

}

.dado-container{

width:76px;
height:76px;

position:relative;

perspective:700px;

}

.dado{

width:64px;
height:64px;

position:absolute;

left:6px;
top:6px;

transform-style:preserve-3d;

}

.face{

position:absolute;

width:64px;
height:64px;

border-radius:13px;

background:
linear-gradient(
145deg,
#ffffff,
#dcdcdc
);

border:2px solid #bcbcbc;

box-shadow:
inset 0 0 7px rgba(0,0,0,.22),
0 7px 12px rgba(0,0,0,.45);

display:grid;

grid-template-columns:
repeat(3,1fr);

grid-template-rows:
repeat(3,1fr);

padding:8px;

backface-visibility:hidden;

}

.ponto{

width:10px;
height:10px;

border-radius:50%;

background:#151515;

box-shadow:
inset 1px 1px 2px rgba(255,255,255,.3),
0 1px 2px rgba(0,0,0,.4);

align-self:center;
justify-self:center;

}

.centro{
grid-column:2;
grid-row:2;
}

.sup-esq{
grid-column:1;
grid-row:1;
}

.sup-dir{
grid-column:3;
grid-row:1;
}

.inf-esq{
grid-column:1;
grid-row:3;
}

.inf-dir{
grid-column:3;
grid-row:3;
}

.meio-esq{
grid-column:1;
grid-row:2;
}

.meio-dir{
grid-column:3;
grid-row:2;
}

.face1{
transform:
translateZ(32px);
}

.face6{
transform:
rotateY(180deg)
translateZ(32px);
}

.face2{
transform:
rotateY(90deg)
translateZ(32px);
}

.face5{
transform:
rotateY(-90deg)
translateZ(32px);
}

.face3{
transform:
rotateX(90deg)
translateZ(32px);
}

.face4{
transform:
rotateX(-90deg)
translateZ(32px);
}

.rolando1{

animation:
rolar1 1.45s
cubic-bezier(.15,.55,.18,1)
both;

}

.rolando2{

animation:
rolar2 1.45s
cubic-bezier(.15,.55,.18,1)
both;

}

@keyframes rolar1{

0%{
transform:
translate(-20px,30px)
rotateX(0)
rotateY(0)
rotateZ(0);
}

25%{
transform:
translate(35px,-45px)
rotateX(270deg)
rotateY(360deg)
rotateZ(160deg);
}

50%{
transform:
translate(-35px,-25px)
rotateX(560deg)
rotateY(690deg)
rotateZ(320deg);
}

75%{
transform:
translate(25px,-40px)
rotateX(850deg)
rotateY(1030deg)
rotateZ(480deg);
}

100%{
transform:
translate(0,0)
rotateX(1080deg)
rotateY(1260deg)
rotateZ(540deg);
}

}

@keyframes rolar2{

0%{
transform:
translate(20px,30px)
rotateX(0)
rotateY(0)
rotateZ(0);
}

25%{
transform:
translate(-35px,-45px)
rotateX(-270deg)
rotateY(-360deg)
rotateZ(-160deg);
}

50%{
transform:
translate(35px,-25px)
rotateX(-560deg)
rotateY(-690deg)
rotateZ(-320deg);
}

75%{
transform:
translate(-25px,-40px)
rotateX(-850deg)
rotateY(-1030deg)
rotateZ(-480deg);
}

100%{
transform:
translate(0,0)
rotateX(-1080deg)
rotateY(-1260deg)
rotateZ(-540deg);
}

}

#resultadoDados{

min-height:42px;

margin:5px 0 10px;

font-size:25px;
font-weight:bold;

color:#ffd21c;

text-shadow:
0 0 12px #ffd21c;

}

#resultado{

min-height:40px;

margin:5px 0 18px;

font-size:22px;
font-weight:bold;

color:#ffd21c;

text-shadow:
0 0 12px #ffd21c;

}

.vitoria{

color:#00ff91 !important;

text-shadow:
0 0 10px #00ff91,
0 0 30px #00ff91 !important;

}

.derrota{

color:#ff416d !important;

text-shadow:
0 0 10px #ff416d,
0 0 25px #ff416d !important;

}

.selecao{
margin:10px auto 18px;
}

.selecao-titulo{

font-size:14px;
color:#aaa;
margin-bottom:10px;

}

.numeros{

display:flex;
justify-content:center;
gap:7px;

}

.numero{

width:45px;
height:45px;

padding:0;
margin:0;

border-radius:50%;

border:1px solid #4b5870;

background:
linear-gradient(
180deg,
#18253d,
#080f1c
);

color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

box-shadow:none;

}

.numero.ativo{

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

border-color:#ffe78a;

box-shadow:
0 0 14px rgba(255,210,28,.55);

}

label{

display:block;

color:#aaa;

font-size:14px;

margin-bottom:6px;

}

input{

width:170px;

padding:13px;

border-radius:13px;

border:2px solid #444;

background:#050505;

color:white;

font-size:20px;

font-weight:bold;

text-align:center;

outline:none;

}

input:focus{

border-color:#ffd21c;

box-shadow:0 0 10px #ffd21c;

}

button#botao{

width:90%;
max-width:320px;

margin-top:15px;

padding:17px;

border:2px solid #ffe78a;

border-radius:16px;

background:
linear-gradient(
180deg,
#ffe66b,
#ffb000
);

color:#211600;

font-size:22px;
font-weight:900;

cursor:pointer;

box-shadow:
0 0 12px #ffd21c,
0 0 35px rgba(255,170,0,.45);

}

button#botao:active{
transform:scale(.95);
}

button#botao:disabled{
opacity:.55;
}

.info{

margin-top:25px;

padding-top:18px;

border-top:
1px solid rgba(255,255,255,.12);

font-size:14px;

line-height:1.7;

}

.ganha{
color:#00ff91;
}

.perde{
color:#ff416d;
}

@media(max-width:450px){

.titulo{
font-size:38px;
}

.area-dados{
height:225px;
gap:20px;
}

.dado-container{
width:68px;
height:68px;
}

.dado{
width:58px;
height:58px;
left:5px;
top:5px;
}

.face{
width:58px;
height:58px;
padding:7px;
}

.face1{
transform:translateZ(29px);
}

.face6{
transform:
rotateY(180deg)
translateZ(29px);
}

.face2{
transform:
rotateY(90deg)
translateZ(29px);
}

.face5{
transform:
rotateY(-90deg)
translateZ(29px);
}

.face3{
transform:
rotateX(90deg)
translateZ(29px);
}

.face4{
transform:
rotateX(-90deg)
translateZ(29px);
}

.ponto{
width:8px;
height:8px;
}

.numero{
width:42px;
height:42px;
}

}

</style>

<body>

<script>

/*
====================================================
SALDO REAL
====================================================
*/

async function atualizarSaldoReal(){

try{

if(
window.SistemaSaldo &&
typeof window.SistemaSaldo.atualizarTela ===
"function"
){

await window.SistemaSaldo.atualizarTela();

return;

}

setTimeout(
atualizarSaldoReal,
300
);

}catch(error){

console.error(
"Erro ao atualizar saldo:",
error
);

}

}

window.addEventListener(
"load",
function(){

atualizarSaldoReal();

});


/*
====================================================
ELEMENTOS
====================================================
*/

const dado1 =
document.getElementById("dado1");

const dado2 =
document.getElementById("dado2");

const resultadoDados =
document.getElementById("resultadoDados");

const resultado =
document.getElementById("resultado");

const botao =
document.getElementById("botao");

const botoesNumero =
document.querySelectorAll(".numero");

const musicaDice =
document.getElementById("musicaDice");

let numeroEscolhido = 1;

let jogando = false;


/*
====================================================
ESCOLHER NÚMERO
====================================================
*/

botoesNumero.forEach(
function(btn){

btn.addEventListener(
"click",
function(){

if(jogando)
return;

botoesNumero.forEach(
function(b){

b.classList.remove("ativo");

});

btn.classList.add("ativo");

numeroEscolhido =
Number(
btn.dataset.numero
);

resultado.className = "";

resultado.textContent =
"🎯 Número escolhido: " +
numeroEscolhido;

});

});


/*
====================================================
SORTEIO
====================================================
*/

function sortearDado(){

return Math.floor(
Math.random() * 6
) + 1;

}


/*
====================================================
FACES
====================================================
*/

const faces = {

1:
"rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

2:
"rotateY(-90deg) rotateX(0deg) rotateZ(0deg)",

3:
"rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

4:
"rotateX(90deg) rotateY(0deg) rotateZ(0deg)",

5:
"rotateY(90deg) rotateX(0deg) rotateZ(0deg)",

6:
"rotateY(180deg) rotateX(0deg) rotateZ(0deg)"

};


/*
====================================================
MOSTRAR FACE
====================================================
*/

function mostrarFace(
dado,
numero
){

dado.style.transform =
faces[numero];

}


/*
====================================================
MÚSICA
====================================================
*/

function iniciarMusicaDice(){

if(!musicaDice)
return;

musicaDice.volume = 0.35;

musicaDice.play().catch(
function(error){

console.log(
"Música aguardando interação:",
error
);

});

}


/*
====================================================
JOGAR
====================================================
*/

botao.addEventListener(
"click",
async function(){

if(jogando)
return;

const aposta =
Number(
document.getElementById("aposta").value
);

if(
!Number.isFinite(aposta) ||
aposta < 0.10
){

alert(
"A aposta mínima é R$ 0,10."
);

return;

}


/*
====================================================
DEBITA DO SALDO REAL
====================================================
*/

if(
!window.SistemaSaldo ||
typeof window.SistemaSaldo.debitar !==
"function"
){

alert(
"Sistema de saldo ainda não carregou."
);

return;

}

const debitado =
await window.SistemaSaldo.debitar(
aposta
);

if(!debitado)
return;


/*
====================================================
INICIA MÚSICA
====================================================
*/

iniciarMusicaDice();


jogando = true;

botao.disabled = true;

resultado.className = "";

resultado.textContent =
"🎲 ROLANDO...";

resultadoDados.textContent =
"🎲 + 🎲";


/*
====================================================
DOIS DADOS INDEPENDENTES
====================================================
*/

const numero1 =
sortearDado();

const numero2 =
sortearDado();


/*
====================================================
INICIA ANIMAÇÃO
====================================================
*/

dado1.classList.remove(
"rolando1"
);

dado2.classList.remove(
"rolando2"
);

dado1.style.transform = "";

dado2.style.transform = "";

void dado1.offsetWidth;
void dado2.offsetWidth;

dado1.classList.add(
"rolando1"
);

dado2.classList.add(
"rolando2"
);


/*
====================================================
FINAL DA ROLAGEM
====================================================
*/

setTimeout(
async function(){

dado1.classList.remove(
"rolando1"
);

dado2.classList.remove(
"rolando2"
);

mostrarFace(
dado1,
numero1
);

mostrarFace(
dado2,
numero2
);

resultadoDados.textContent =
"🎲 " +
numero1 +
"   +   🎲 " +
numero2;


/*
====================================================
LÓGICA DA APOSTA
====================================================
*/

const acertou =
numero1 === numeroEscolhido ||
numero2 === numeroEscolhido;


if(acertou){

const ganho =
await window.SistemaSaldo.processarVitoria(
aposta,
2
);

resultado.className =
"vitoria";

resultado.textContent =
"🎉 GANHOU R$ " +
Number(ganho).toFixed(2);

}else{

resultado.className =
"derrota";

resultado.textContent =
"😢 PERDEU R$ " +
aposta.toFixed(2);

}


/*
====================================================
ATUALIZA SALDO
====================================================
*/

await atualizarSaldoReal();

jogando = false;

botao.disabled = false;


},
1450
);

});

</script>
