<script>

const TAXA_CASA = 0.30;

const grade =
    document.getElementById("grade");

const numerosRoleta =
    document.getElementById("numerosRoleta");

const roleta =
    document.getElementById("roleta");

const saldoEl =
    document.getElementById("saldo");

const valorEl =
    document.getElementById("valor");

const mensagem =
    document.getElementById("mensagem");

const aviso =
    document.getElementById("aviso");

const btnGirar =
    document.getElementById("btnGirar");

const carregando =
    document.getElementById("carregando");

const musicaFundo =
    document.getElementById("musicaFundo");


musicaFundo.volume = 0.10;
musicaFundo.loop = true;

let ficha = 1;
let apostas = [];
let girando = false;
let apostasAbertas = false;
let tempoAposta = 10;
let contador = null;
let rotacao = 0;

let audioContext = null;
let audioLiberado = false;

let sistemaPronto = false;


/* =====================================================
   ESPERAR SISTEMA DE SALDO REAL
===================================================== */

async function esperarSistemaSaldo(){

    for(let i = 0; i < 100; i++){

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function" &&
            typeof window.SistemaSaldo.debitar === "function" &&
            typeof window.SistemaSaldo.processarVitoria === "function"
        ){

            sistemaPronto = true;
            return true;
        }

        await new Promise(
            resolver => setTimeout(resolver,100)
        );
    }

    return false;
}


/* =====================================================
   SALDO REAL
===================================================== */

async function carregarSaldoReal(){

    if(!sistemaPronto){
        return false;
    }

    try{

        const saldo =
            await window.SistemaSaldo.get();

        saldoEl.textContent =
            formatar(saldo);

        return true;

    }catch(error){

        console.error(
            "Erro ao consultar saldo real:",
            error
        );

        mensagem.textContent =
            "Não foi possível carregar seu saldo.";

        return false;
    }
}


async function atualizarSaldoReal(){

    if(!sistemaPronto){
        return 0;
    }

    try{

        const saldo =
            await window.SistemaSaldo.get();

        saldoEl.textContent =
            formatar(saldo);

        return Number(saldo || 0);

    }catch(error){

        console.error(
            "Erro ao atualizar saldo:",
            error
        );

        return 0;
    }
}


/* =====================================================
   MÚSICA
===================================================== */

async function iniciarMusica(){

    try{

        musicaFundo.volume = 0.10;

        if(musicaFundo.paused){
            await musicaFundo.play();
        }

    }catch(error){

        console.log(
            "Aguardando interação para iniciar música:",
            error
        );
    }
}


/* =====================================================
   ÁUDIO
===================================================== */

document.addEventListener(
    "pointerdown",
    function(){

        iniciarMusica();
        iniciarAudio();

    },
    {passive:true}
);


function iniciarAudio(){

    try{

        if(!audioContext){

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioCtx)return;

            audioContext =
                new AudioCtx();
        }

        if(
            audioContext.state === "suspended"
        ){
            audioContext.resume();
        }

        audioLiberado = true;

    }catch(error){

        console.log(
            "Áudio indisponível:",
            error
        );
    }
}


function somFicha(){

    if(!audioLiberado)
        iniciarAudio();

    if(!audioContext)return;

    try{

        const agora =
            audioContext.currentTime;

        const osc =
            audioContext.createOscillator();

        const ganho =
            audioContext.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            620,
            agora
        );

        osc.frequency.exponentialRampToValueAtTime(
            900,
            agora + 0.055
        );

        ganho.gain.setValueAtTime(
            0.0001,

let timerSomRoleta = null;


function iniciarSomRoleta(){

    if(!audioLiberado)
        iniciarAudio();

    pararSomRoleta();

    let intervalo = 125;
    let quantidade = 0;

    function tic(){

        if(!girando)return;

        somTicRoleta();

        quantidade++;

        if(quantidade < 25){

            intervalo += 7;

        }else if(quantidade < 40){

            intervalo += 12;

        }else{

            intervalo += 20;
        }

        timerSomRoleta =
            setTimeout(tic,intervalo);
    }

    tic();
}


function pararSomRoleta(){

    if(timerSomRoleta){

        clearTimeout(
            timerSomRoleta
        );

        timerSomRoleta = null;
    }
}

/* =====================================================
   FAZER APOSTA
===================================================== */

async function fazerAposta(
    tipo,
    elemento
){

    if(!apostasAbertas){

        mensagem.textContent =
            "🔒 As apostas estão fechadas.";

        return;
    }

    if(girando)return;


    /*
       CONSULTA O SALDO REAL
       ANTES DE ACEITAR A APOSTA
    */

    const saldoAtual =
        await atualizarSaldoReal();


    if(saldoAtual < ficha){

        mensagem.textContent =
            "Saldo insuficiente.";

        return;
    }


    somFicha();


    /*
       APOSTA FICA REGISTRADA.
       O DESCONTO REAL ACONTECE
       QUANDO A RODADA COMEÇA.
    */

    apostas.push({
        tipo:tipo,
        valor:ficha
    });


    elemento.classList.add(
        "selecionado"
    );

    atualizarFichaVisual(
        tipo,
        elemento
    );


    mensagem.textContent =
        "Aposta adicionada.";
}


/* =====================================================
   FICHA VISUAL DA APOSTA
===================================================== */

function chaveAposta(tipo){
    return String(tipo);
}

function atualizarFichaVisual(tipo, elemento){

    const total = apostas
        .filter(function(aposta){
            return chaveAposta(aposta.tipo) === chaveAposta(tipo);
        })
        .reduce(function(sum, aposta){
            return sum + Number(aposta.valor || 0);
        }, 0);

    let chip = elemento.querySelector(".ficha-aposta");

    if(!chip){
        chip = document.createElement("span");
        chip.className = "ficha-aposta";
        elemento.appendChild(chip);
    }

    chip.textContent =
        total >= 100
            ? Math.round(total)
            : (Number.isInteger(total) ? total : total.toFixed(2).replace(".",","));
}

function limparFichasVisuais(){
    document
        .querySelectorAll(".ficha-aposta")
        .forEach(function(chip){
            chip.remove();
        });
}


/* =====================================================
   VERIFICAR VITÓRIA
===================================================== */

function ganhou(tipo,numero){

    if(typeof tipo === "number"){

        return tipo === numero;
    }

    if(tipo === "vermelho"){

        return vermelhos.includes(
            numero
        );
    }

    if(tipo === "preto"){

        return (
            numero !== 0 &&
            !vermelhos.includes(numero)
        );
    }

    if(tipo === "baixo"){

        return (
            numero >= 1 &&
            numero <= 18
        );
    }

    if(tipo === "alto"){

        return (
            numero >= 19 &&
            numero <= 36
        );
    }

    if(tipo === "par"){

        return (
            numero !== 0 &&
            numero % 2 === 0
        );
    }

    if(tipo === "impar"){

        return numero % 2 === 1;
    }

    return false;
}

/* =====================================================
   INICIAR RODADA
===================================================== */

function iniciarRodada(){

    clearInterval(contador);

    tempoAposta = 10;

    apostasAbertas = true;

    girando = false;

    pararSomRoleta();

    btnGirar.disabled = true;

    btnGirar.textContent =
        "AGUARDE";

    aviso.innerHTML =
        "⏱️ APOSTAS: <b>10s</b>";

    mensagem.textContent =
        "Faça suas apostas.";

    iniciarMusica();

    somContagem();


    contador =
        setInterval(
            function(){

                tempoAposta--;

                if(tempoAposta > 0){

                    somContagem();

                    aviso.innerHTML =
                        "️ APOSTAS: <b>" +
                        tempoAposta +
                        "s</b>";
                }


                if(tempoAposta <= 0){

                    clearInterval(contador);

                    fecharApostas();
                }

            },
            1000
        );
}


/* =====================================================
   FECHAR APOSTAS
===================================================== */

function fecharApostas(){

    apostasAbertas = false;

    document
        .querySelectorAll(".ficha")
        .forEach(
            function(el){

                el.classList.remove(
                    "ativa"
                );
            }
        );

    aviso.innerHTML =
        "🔒 <b>APOSTAS ENCERRADAS</b>";

    mensagem.textContent =
        "🎰 Preparando o giro...";

    setTimeout(
        girarAutomaticamente,
        800
    );
}


/* =====================================================
   GIRAR
===================================================== */

async function girarAutomaticamente(){

    if(girando)return;


    if(apostas.length === 0){

        mensagem.textContent =
            "Nenhuma aposta feita. Aguardando próxima rodada...";

        setTimeout(
            iniciarRodada,
            3000
        );

        return;
    }


    girando = true;

    btnGirar.disabled = true;

    aviso.innerHTML =
        "🎰 <b>ROLETA GIRANDO...</b>";

    mensagem.textContent =
        "Aguarde o resultado...";

    iniciarMusica();

    iniciarSomRoleta();


    /*
       =================================================
       SALDO REAL
       =================================================

       O valor agora é debitado pelo
       SistemaSaldo da plataforma.

       NÃO existe mais dinheiro local.
       NÃO existe mais salvarSaldo local.
    */

    const totalAposta =
        apostas.reduce(
            function(sum,a){

                return sum + a.valor;

            },
            0
        );


    const saldoAntes =
        await atualizarSaldoReal();


    if(saldoAntes < totalAposta){

        pararSomRoleta();

        girando = false;

        btnGirar.disabled = false;

        apostas = [];
        limparFichasVisuais();

        document
            .querySelectorAll(".selecionado")
            .forEach(
                function(el){

                    el.classList.remove(
                        "selecionado"
                    );
                }
            );

        mensagem.textContent =
            "❌ Saldo insuficiente para processar as apostas.";

        setTimeout(
            iniciarRodada,
            3000
        );

        return;
    }


    /*
       DEBITA O SALDO REAL
    */

    const debitado =
        await window.SistemaSaldo.debitar(
            totalAposta
        );


    if(!debitado){

        pararSomRoleta();

        girando = false;

        btnGirar.disabled = false;

        mensagem.textContent =
            "❌ Erro ao processar aposta. Tente novamente.";

        setTimeout(
            iniciarRodada,
            3000
        );

        return;
    }


    await atualizarSaldoReal();


    /*
       RESULTADO
    */

    const resultado =
        Math.floor(
            Math.random() * 37
        );


    const indice =
        ordemRoleta.indexOf(
            resultado
        );

    const setor =
        360 / 37;

    const alvo =
        -(indice * setor);

    rotacao += 360 * 8;

    const atualModulo =
        rotacao % 360;

    const ajuste =
        alvo - atualModulo;

    rotacao += ajuste;

    roleta.style.transform =
        "rotate(" +
        rotacao +
        "deg)";


    setTimeout(
        function(){

            finalizarRodada(
                resultado
            );

        },
        7050
    );
}


/* =====================================================
   FINALIZAR RODADA
===================================================== */

async function finalizarRodada(
    resultado
){

    pararSomRoleta();

    somResultado();


    /*
       CADA FICHA REPRESENTA UMA APOSTA INDEPENDENTE.
       Em números, o retorno total é 2x o valor
       colocado naquele número.

       Exemplo:
       R$5 no 1 -> R$10 de retorno se sair 1.
       R$1 no 3 -> R$2 de retorno se sair 3.

       As fichas de números diferentes são somadas
       apenas quando os respectivos números vencem.
       O desconto da aposta continua sendo feito
       pelo SistemaSaldo no início da rodada.
    */

    let premioFinal = 0;


    apostas.forEach(
        function(aposta){

            if(
                ganhou(
                    aposta.tipo,
                    resultado
                )
            ){

                if(
                    typeof aposta.tipo === "number"
                ){

                    // Aposta em número: retorno total de 2x.
                    premioFinal +=
                        Number(aposta.valor || 0) * 2;

                }else{

                    // Mantém a regra já existente para apostas externas.
                    premioFinal +=
                        Number(aposta.valor || 0) * 2 * TAXA_CASA;
                }
            }
        }
    );


    /*
       CREDITA NO SALDO REAL
    */

    if(premioFinal > 0){

        const totalApostado = apostas.reduce((total, aposta) => total + Number(aposta.valor || 0), 0);
        const multiplicadorPremio = totalApostado > 0 ? premioFinal / (totalApostado * 0.95) : 0;
        const creditado = totalApostado > 0 ? await window.SistemaSaldo.processarVitoria(totalApostado, multiplicadorPremio) : 0;


        if(!creditado){

            console.error(
                "Erro ao creditar prêmio no saldo real."
            );

            mensagem.textContent =
                "⚠️ Resultado saiu, mas houve erro ao creditar o prêmio.";

        }
    }


    await atualizarSaldoReal();


    let cor;


    if(resultado === 0){

        cor = "VERDE";

    }else if(
        vermelhos.includes(resultado)
    ){

        cor = "VERMELHO";

    }else{

        cor = "PRETO";
    }


    if(premioFinal > 0){

        mensagem.textContent =
            "🏆 Resultado: " +
            resultado +
            " — " +
            cor +
            " | Prêmio: R$ " +
            formatar(premioFinal);

    }else{

        mensagem.textContent =
            "Resultado: " +
            resultado +
            " — " +
            cor +
            " | Sem prêmio.";
    }


    aviso.innerHTML =
        "🎯 RESULTADO: <b>" +
        resultado +
        "</b> — " +
        cor;


    apostas = [];
    limparFichasVisuais();


    document
        .querySelectorAll(".selecionado")
        .forEach(
            function(el){

                el.classList.remove(
                    "selecionado"
                );
            }
        );


    await atualizarSaldoReal();


    girando = false;


    setTimeout(
        function(){

            iniciarRodada();

        },
        3000
    );
}


/* =====================================================
   INICIAR JOGO
===================================================== */

async function iniciar(){

    try{

           ESPERA O saldo.js

        */
