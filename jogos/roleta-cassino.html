<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Roleta Cassino</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:20px;
}

.top{
  height:52px;
  background:#111;
  border-bottom:2px solid #b88925;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-size:12px;
}

.online{
  color:#45df7d;
}

.area{
  width:100%;
  max-width:900px;
  margin:auto;
}

/* MESA */

.mesa{
  position:relative;
  height:450px;
  overflow:hidden;
  background:
    linear-gradient(135deg,#06152d,#123d94,#071936);
}

/* ROLETA */

.roleta-area{
  position:absolute;
  left:10px;
  top:55px;
  width:150px;
  height:150px;
}

.roleta{
  width:150px;
  height:150px;
  border-radius:50%;
  border:9px solid #8a4b20;

  background:
    conic-gradient(
      #087c3d 0deg 10deg,
      #b51e24 10deg 30deg,
      #111 30deg 50deg,
      #b51e24 50deg 70deg,
      #111 70deg 90deg,
      #b51e24 90deg 110deg,
      #111 110deg 130deg,
      #b51e24 130deg 150deg,
      #111 150deg 170deg,
      #b51e24 170deg 190deg,
      #111 190deg 210deg,
      #b51e24 210deg 230deg,
      #111 230deg 250deg,
      #b51e24 250deg 270deg,
      #111 270deg 290deg,
      #b51e24 290deg 310deg,
      #111 310deg 330deg,
      #b51e24 330deg 350deg,
      #111 350deg 360deg
    );

  box-shadow:
    0 0 0 3px #d09a50,
    0 10px 25px #000;

  transition:transform 3s cubic-bezier(.12,.75,.18,1);
}

.roleta::after{
  content:"";
  position:absolute;
  left:32%;
  top:32%;
  width:36%;
  height:36%;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #e0ad65 0 14%,
      #4b230d 15% 30%,
      #111 31% 60%,
      #d09a50 61% 70%,
      #222 71%
    );

  border:2px solid #e0ad65;
}

/* MESA DE APOSTAS */

.mesa-jogo{
  position:absolute;
  left:23%;
  right:-10%;
  top:55px;
  height:345px;

  background:#12419a;

  border:3px solid #fff;

  box-shadow:
    0 0 0 3px #152d68,
    0 15px 30px #000;

  padding:15px;
}

.grade{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  margin-left:7%;
}

.numero{
  height:39px;
  border:1px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  font-weight:bold;

  cursor:pointer;
  user-select:none;
}

.vermelho{
  background:#b51e25;
}

.preto{
  background:#111;
}

.zero{
  position:absolute;
  left:9px;
  top:15px;
  width:6%;
  height:77%;

  background:#087d3d;
  border:1px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;
}

.faixas{
  margin-left:7%;
  margin-top:3px;

  display:grid;
  grid-template-columns:repeat(6,1fr);
}

.faixa{
  height:45px;

  background:#12377d;
  border:1px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:bold;

  cursor:pointer;
}

.faixa.vermelho{
  background:#a91d25;
}

.selecionado{
  box-shadow:inset 0 0 0 3px #ffd43b;
  filter:brightness(1.4);
}

/* AVISO */

.aviso{
  position:absolute;
  left:8px;
  bottom:8px;

  background:rgba(0,0,0,.85);

  padding:9px;

  border-radius:5px;

  font-size:10px;
}

/* CONTROLES */

.controles{
  background:#0d0d0d;
  border-top:2px solid #444;
  padding:12px;
}

.linha{
  display:flex;
  justify-content:space-between;

  margin-bottom:12px;

  font-size:13px;
  color:#aaa;
}

.linha b{
  color:#6fe38b;
}

.fichas{
  display:flex;
  gap:8px;
  overflow-x:auto;

  padding-bottom:12px;
}

.ficha{
  min-width:44px;
  height:44px;

  border-radius:50%;

  border:3px solid white;

  background:#8b3030;

  color:white;

  font-weight:bold;

  cursor:pointer;
}

.ficha.ativa{
  outline:3px solid #ffd43b;
}

.botoes{
  display:flex;
  gap:8px;
}

button{
  flex:1;

  padding:14px;

  border-radius:8px;

  background:#191919;

  border:1px solid #666;

  color:white;

  font-weight:bold;

  font-size:14px;
}

#btnGirar{
  background:#087642;
  border-color:#39d97b;
}

#btnGirar:disabled{
  opacity:.5;
}

#mensagem{
  text-align:center;
  margin-top:10px;
  min-height:20px;
  font-size:12px;
}

.nota{
  text-align:center;
  color:#777;
  font-size:9px;
  margin-top:8px;
}

@media(max-width:600px){

  .mesa{
    height:450px;
  }

  .roleta-area{
    left:3px;
  }

  .mesa-jogo{
    left:21%;
    right:-20%;
  }

  .numero{
    height:37px;
    font-size:10px;
  }

  .faixa{
    height:43px;
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="top">
  <span>🎰 Roleta Cassino — DEMO</span>
  <span class="online">● ONLINE</span>
</div>

<div class="area">

<div class="mesa">

  <div class="roleta-area">
    <div id="roleta" class="roleta"></div>
  </div>

  <div class="mesa-jogo">

    <div
      id="zero"
      class="zero"
      data-bet="0">
      0
    </div>

    <div
      id="grade"
      class="grade">
    </div>

    <div class="faixas">

      <div class="faixa" data-bet="baixo">
        1-18
      </div>

      <div class="faixa" data-bet="par">
        PAR
      </div>

      <div
        class="faixa vermelho"
        data-bet="vermelho">
        VERMELHO
      </div>

      <div class="faixa" data-bet="preto">
        PRETO
      </div>

      <div class="faixa" data-bet="impar">
        ÍMPAR
      </div>

      <div class="faixa" data-bet="alto">
        19-36
      </div>

    </div>

  </div>

  <div id="aviso" class="aviso">
    FAÇA SUAS APOSTAS
  </div>

</div>


<div class="controles">

  <div class="linha">

    <span>
      Créditos virtuais:
      <b id="saldo">100,00</b>
    </span>

    <span>
      Ficha:
      <b id="valor">1,00</b>
    </span>

  </div>


  <div class="fichas">

    <button class="ficha ativa" data-valor="1">
      1
    </button>

    <button class="ficha" data-valor="5">
      5
    </button>

    <button class="ficha" data-valor="10">
      10
    </button>

    <button class="ficha" data-valor="25">
      25
    </button>

    <button class="ficha" data-valor="50">
      50
    </button>

  </div>


  <div class="botoes">

    <button id="limpar">
      LIMPAR
    </button>

    <button id="btnGirar">
      GIRAR
    </button>

  </div>


  <div id="mensagem"></div>

  <div class="nota">
    Jogo demonstrativo com créditos virtuais.
    Não utiliza dinheiro real.
  </div>

</div>

</div>


<script>

const vermelhos = [
  1,3,5,7,9,
  12,14,16,18,
  19,21,23,25,27,
  30,32,34,36
];

const grade =
  document.getElementById("grade");

const roleta =
  document.getElementById("roleta");

const saldo =
  document.getElementById("saldo");

const valor =
  document.getElementById("valor");

const mensagem =
  document.getElementById("mensagem");

const aviso =
  document.getElementById("aviso");

const btnGirar =
  document.getElementById("btnGirar");

let dinheiro = 100;

let ficha = 1;

let apostas = [];

let girando = false;

let rotacao = 0;


/* CRIAR NÚMEROS */

for(let n=1;n<=36;n++){

  const numero =
    document.createElement("div");

  numero.className =
    "numero " +
    (
      vermelhos.includes(n)
      ? "vermelho"
      : "preto"
    );

  numero.textContent = n;

  numero.dataset.bet = n;

  numero.onclick = function(){

    fazerAposta(
      n,
      numero
    );

  };

  grade.appendChild(numero);
}


/* ZERO */

document
.getElementById("zero")
.onclick = function(){

  fazerAposta(
    0,
    this
  );

};


/* FAIXAS */

document
.querySelectorAll(".faixa")
.forEach(function(botao){

  botao.onclick = function(){

    fazerAposta(
      botao.dataset.bet,
      botao
    );

  };

});


/* FICHAS */

document
.querySelectorAll(".ficha")
.forEach(function(botao){

  botao.onclick = function(){

    document
    .querySelectorAll(".ficha")
    .forEach(function(x){
      x.classList.remove("ativa");
    });

    botao.classList.add("ativa");

    ficha =
      Number(
        botao.dataset.valor
      );

    valor.textContent =
      ficha.toFixed(2).replace(".",",");

  };

});


/* APOSTAR */

function fazerAposta(
  tipo,
  elemento
){

  if(girando)
    return;

  if(dinheiro < ficha){

    mensagem.textContent =
      "Créditos insuficientes.";

    return;
  }

  dinheiro -= ficha;

  apostas.push({
    tipo:tipo,
    valor:ficha
  });

  elemento.classList.add(
    "selecionado"
  );

  atualizar();

  mensagem.textContent =
    "Aposta virtual adicionada.";

}


/* VERIFICAR GANHADOR */

function ganhou(
  tipo,
  numero
){

  if(typeof tipo === "number"){
    return tipo === numero;
  }

  if(tipo === "vermelho"){
    return vermelhos.includes(numero);
  }

  if(tipo === "preto"){
    return numero !== 0 &&
           !vermelhos.includes(numero);
  }

  if(tipo === "baixo"){
    return numero >= 1 &&
           numero <= 18;
  }

  if(tipo === "alto"){
    return numero >= 19 &&
           numero <= 36;
  }

  if(tipo === "par"){
    return numero !== 0 &&
           numero % 2 === 0;
  }

  if(tipo === "impar"){
    return numero % 2 === 1;
  }

  return false;
}


/* LIMPAR */

document
.getElementById("limpar")
.onclick = function(){

  if(girando)
    return;

  apostas.forEach(function(aposta){

    dinheiro += aposta.valor;

  });

  apostas = [];

  document
  .querySelectorAll(".selecionado")
  .forEach(function(el){

    el.classList.remove(
      "selecionado"
    );

  });

  aviso.textContent =
    "FAÇA SUAS APOSTAS";

  mensagem.textContent =
    "Apostas limpas.";

  atualizar();

};


/* GIRAR */

btnGirar.onclick = function(){

  if(girando)
    return;

  if(apostas.length === 0){

    mensagem.textContent =
      "Escolha uma aposta primeiro.";

    return;
  }

  girando = true;

  btnGirar.disabled = true;

  mensagem.textContent =
    "🎰 A roleta está girando...";

  aviso.textContent =
    "AGUARDE O RESULTADO...";


  /*
     A cada giro acrescentamos
     várias voltas.
  */

  rotacao +=
    1440 +
    Math.floor(
      Math.random() * 720
    );


  roleta.style.transform =
    "rotate(" +
    rotacao +
    "deg)";


  /*
     Espera a animação terminar.
  */

  setTimeout(function(){

    const resultado =
      Math.floor(
        Math.random() * 37
      );


    let premio = 0;


    apostas.forEach(function(aposta){

      if(
        ganhou(
          aposta.tipo,
          resultado
        )
      ){

        /*
          Número exato = 35:1
          Outras opções = 1:1
        */

        if(
          typeof aposta.tipo === "number"
        ){

          premio +=
            aposta.valor * 36;

        }
        else{

          premio +=
            aposta.valor * 2;

        }

      }

    });


    dinheiro += premio;


    let cor;

    if(resultado === 0){

      cor = "VERDE";

    }
    else if(
      vermelhos.includes(resultado)
    ){

      cor = "VERMELHO";

    }
    else{

      cor = "PRETO";

    }


    if(premio > 0){

      mensagem.textContent =
        "🏆 Resultado: " +
        resultado +
        " — " +
        cor +
        " | Prêmio virtual: " +
        premio
        .toFixed(2)
        .replace(".",",");

    }
    else{

      mensagem.textContent =
        "Resultado: " +
        resultado +
        " — " +
        cor +
        " | Sem prêmio.";

    }


    aviso.innerHTML =
      "RESULTADO: <b>" +
      resultado +
      "</b> — " +
      cor;


    apostas = [];


    document
    .querySelectorAll(".selecionado")
    .forEach(function(el){

      el.classList.remove(
        "selecionado"
      );

    });


    atualizar();


    girando = false;

    btnGirar.disabled = false;

  },3050);

};


/* ATUALIZAR SALDO */

function atualizar(){

  saldo.textContent =
    dinheiro
    .toFixed(2)
    .replace(".",",");

}

atualizar();

</script>

</body>
</html>
