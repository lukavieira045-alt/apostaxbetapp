<script>

/* ==================================================

================================================== */

const SUPABASE_URL =
'https://jxbzjiwmajjzxgihfjgt.supabase.co';

const SUPABASE_KEY =
'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';

window.supabase.createClient(

/*

   0.95 significa que a casa retém 5% de cada prêmio pago.
*/

/* ==================================================

================================================== */

const grade =
document.getElementById("grade");

const numerosRoleta =
document.getElementById("numerosRoleta");

const roleta =
document.getElementById("roleta");

const saldo =
document.getElementById("saldo");

const valor =
document.getElementById("valor");

const mensagem =
document.getElementById("mensagem");

const aviso =
document.getElementById("aviso");

const btnGirar =
document.getElementById("btnGirar");

const carregando =
document.getElementById("carregando");

const musicaFundo =
document.getElementById("musicaFundo");


/* ==================================================
   MÚSICA DE FUNDO
   VOLUME = 10%
================================================== */

musicaFundo.volume = 0.10;

musicaFundo.loop = true;

let musicaIniciada = false;


/*
   Inicia a música depois do primeiro
   toque/clique do jogador.

   Isso é necessário porque o navegador
   pode bloquear reprodução automática.
*/

async function iniciarMusica(){

  try{

    musicaFundo.volume = 0.10;

    if(
      musicaFundo.paused
    ){

      await musicaFundo.play();

    }

    musicaIniciada = true;

  }catch(error){

    console.log(
      "Aguardando interação para iniciar música:",
      error
    );

  }

}


/*
   Primeiro toque do jogador.
*/

document.addEventListener(
  "pointerdown",
  function(){

    iniciarMusica();

    iniciarAudio();

  },
  {
    passive:true
  }
);


/* ==================================================
   VARIÁVEIS
================================================== */

const vermelhos = [
  1,3,5,7,9,
  12,14,16,18,
  19,21,23,25,27,
  30,32,34,36
];

const ordemRoleta = [
  0,
  32,15,19,4,21,2,25,17,34,6,
  27,13,36,11,30,8,23,10,5,24,
  16,33,1,20,14,31,9,22,18,29,
  7,28,12,35,3,26
];

let usuarioAtual = null;

let dinheiro = 0;

let ficha = 1;

let apostas = [];

let girando = false;

let apostasAbertas = false;

let tempoAposta = 10;

let contador = null;

let rotacao = 0;


/* ==================================================
   SISTEMA DE SOM DOS EFEITOS
================================================== */

let audioContext = null;

let audioLiberado = false;


function iniciarAudio(){

  try{

    if(!audioContext){

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioCtx)
        return;

      audioContext =
        new AudioCtx();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

    audioLiberado = true;

  }catch(error){

    console.log(
      "Áudio indisponível:",
      error
    );

  }

}


/* ==================================================
   SOM DA FICHA
================================================== */

function somFicha(){

  if(!audioLiberado)
    iniciarAudio();

  if(!audioContext)
    return;

  try{

    const agora =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const ganho =
      audioContext.createGain();

    osc.type =
      "sine";

    osc.frequency.setValueAtTime(
      620,
      agora
    );

    osc.frequency.exponentialRampToValueAtTime(
      900,
      agora + 0.055
    );

    ganho.gain.setValueAtTime(
      0.0001,
      agora
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.22,
      agora + 0.008
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.0001,
      agora + 0.075
    );

    osc.connect(
      ganho
    );

    ganho.connect(
      audioContext.destination
    );

    osc.start(
      agora
    );

    osc.stop(
      agora + 0.08
    );

  }catch(error){

    console.log(error);

  }

}


/* ==================================================
   SOM DA CONTAGEM
================================================== */

function somContagem(){

  if(!audioLiberado)
    iniciarAudio();

  if(!audioContext)
    return;

  try{

    const agora =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const ganho =
      audioContext.createGain();

    osc.type =
      "sine";

    osc.frequency.setValueAtTime(
      480,
      agora
    );

    osc.frequency.exponentialRampToValueAtTime(
      320,
      agora + 0.09
    );

    ganho.gain.setValueAtTime(
      0.0001,
      agora
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.18,
      agora + 0.01
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.0001,
      agora + 0.12
    );

    osc.connect(
      ganho
    );

    ganho.connect(
      audioContext.destination
    );

    osc.start(

    );

    osc.stop(
      agora + 0.13
    );

  }catch(error){

    console.log(error);

  }

}


/* ==================================================
   SOM TIC TIC DA ROLETA
================================================== */

function somTicRoleta(){

  if(!audioLiberado)
    iniciarAudio();

  if(!audioContext)
    return;

  try{

    const agora =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const ganho =
      audioContext.createGain();

    osc.type =
      "square";

    osc.frequency.setValueAtTime(
      1450,
      agora
    );

    osc.frequency.exponentialRampToValueAtTime(
      650,
      agora + 0.035
    );

    ganho.gain.setValueAtTime(
      0.0001,
      agora
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.16,
      agora + 0.003
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.0001,
      agora + 0.045
    );

    osc.connect(
      ganho
    );

    ganho.connect(
      audioContext.destination
    );

    osc.start(
      agora
    );

    osc.stop(
      agora + 0.05
    );

  }catch(error){

    console.log(error);

  }

}


/* ==================================================
   SEQUÊNCIA DO TIC TIC
================================================== */

let timerSomRoleta = null;

function iniciarSomRoleta(){

  if(!audioLiberado)
    iniciarAudio();

  pararSomRoleta();

  let intervalo = 125;

  let quantidade = 0;

  function tic(){

    if(!girando)
      return;

    somTicRoleta();

    quantidade++;

    if(quantidade < 25){

      intervalo += 7;

    }else if(quantidade < 40){

      intervalo += 12;

    }else{

      intervalo += 20;

    }

    timerSomRoleta =
      setTimeout(
        tic,
        intervalo
      );

  }

  tic();

}


function pararSomRoleta(){

  if(timerSomRoleta){

    clearTimeout(
      timerSomRoleta
    );

    timerSomRoleta =
      null;

  }

}


/* ==================================================
   SOM DO RESULTADO
================================================== */

function somResultado(){

  if(!audioLiberado)
    iniciarAudio();

  if(!audioContext)
    return;

  try{

    const agora =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const ganho =
      audioContext.createGain();

    osc.type =
      "sine";

    osc.frequency.setValueAtTime(
      520,
      agora
    );

    osc.frequency.setValueAtTime(
      700,
      agora + 0.08
    );

    osc.frequency.setValueAtTime(
      900,
      agora + 0.16
    );

    ganho.gain.setValueAtTime(
      0.0001,
      agora
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.20,
      agora + 0.02
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.0001,
      agora + 0.30
    );

    osc.connect(
      ganho
    );

    ganho.connect(
      audioContext.destination
    );

    osc.start(
      agora
    );

    osc.stop(
      agora + 0.32
    );

  }catch(error){

    console.log(error);

  }

}


/* ==================================================
   FORMATAÇÃO
================================================== */

function formatar(valor){

  return Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}


/* ==================================================
   CARREGAR SALDO
================================================== */

async function carregarSaldo(){

  if(!usuarioAtual)
    return false;

  const {data,error} =
    await supabaseClient
    .from("saldos")
    .select("valor")
    .eq(
      "user_id",
      usuarioAtual.id
    )
    .single();

  if(error){

    console.error(
      "Erro ao carregar saldo:",
      error
    );

    mensagem.textContent =
      "Não foi possível carregar seu saldo.";

    return false;

  }

  dinheiro =
    Number(data?.valor || 0);

  atualizar();

  return true;

}


/* ==================================================
   ATUALIZAR SALDO
================================================== */

function atualizar(){

  saldo.textContent =
    formatar(dinheiro);

}


/* ==================================================
   SALVAR SALDO
================================================== */

async function salvarSaldo(){

  if(!usuarioAtual)
    return false;

  const {error} =
    await supabaseClient
    .from("saldos")
    .update({
      valor:dinheiro
    })
    .eq(
      "user_id",
      usuarioAtual.id
    );

  if(error){

    console.error(
      "Erro ao salvar saldo:",
      error
    );

    mensagem.textContent =
      "Erro ao atualizar o saldo.";

    return false;

  }

  return true;

}


/* ==================================================
   NÚMEROS DA ROLETA
================================================== */

ordemRoleta.forEach(
function(numero,index){

  const el =
    document.createElement("div");

  el.className =
    "numero-roleta";

  el.textContent =
    numero;

  const angulo =
    index * (360 / 37);

  const raio =
    61;

  const rad =
    (angulo - 90) *
    Math.PI / 180;

  const x =
    Math.cos(rad) * raio;

  const y =
    Math.sin(rad) * raio;

  el.style.transform =
    "translate(" +
    x +
    "px," +
    y +
    "px)";

  if(numero === 0){

    el.style.color =
      "#63e58d";

  }

  numerosRoleta.appendChild(el);

});


/* ==================================================
   TABULEIRO
================================================== */

for(
  let n=1;
  n<=36;
  n++
){

  const numero =
    document.createElement("div");

  numero.className =
    "numero " +
    (
      vermelhos.includes(n)
      ? "vermelho"
      : "preto"
    );

  numero.textContent =
    n;

  numero.onclick =
  function(){

    fazerAposta(
      n,
      numero
    );

  };

  grade.appendChild(numero);

}


/* ==================================================
   ZERO
================================================== */

document
.getElementById("zero")

function(){

};


/* ==================================================
   FAIXAS
================================================== */

document
.querySelectorAll(".faixa")
.forEach(
function(botao){

  botao.onclick =
  function(){

    fazerAposta(
      botao.dataset.bet,
      botao
    );

  };

});


/* ==================================================
   FICHAS
================================================== */

document
.querySelectorAll(".ficha")
.forEach(
function(botao){

  botao.onclick =
  function(){

    if(!apostasAbertas)
      return;

    somFicha();

    document
    .querySelectorAll(".ficha")
    .forEach(
    function(x){

      x.classList.remove(
        "ativa"
      );

    });

    botao.classList.add(
      "ativa"
    );

    ficha =
      Number(
        botao.dataset.valor
      );

});


/* ==================================================
   FAZER APOSTA
================================================== */

function fazerAposta(
  tipo,
  elemento
){

  if(!apostasAbertas){

    mensagem.textContent =
      "🔒 As apostas estão fechadas.";

    return;

  }

  if(girando)
    return;

  if(dinheiro < ficha){

    mensagem.textContent =
      "Saldo virtual insuficiente.";

    return;

  }

  somFicha();

  dinheiro -= ficha;

  apostas.push({
    tipo:tipo,
    valor:ficha
  });

  elemento.classList.add(
    "selecionado"
  );

  atualizar();

  mensagem.textContent =
    "Aposta virtual adicionada.";

}


/* ==================================================
   VERIFICAR GANHO
================================================== */

function ganhou(
  tipo,
  numero
){

  if(
    typeof tipo === "number"
  ){

    return tipo === numero;

  }

  if(tipo === "vermelho"){

    return vermelhos.includes(
      numero
    );

  }

  if(tipo === "preto"){

    return (
      numero !== 0 &&
      !vermelhos.includes(
        numero
      )
    );

  }

  if(tipo === "baixo"){

    return (
      numero >= 1 &&
      numero <= 18
    );

  }

  if(tipo === "alto"){

    return (
      numero >= 19 &&
      numero <= 36
    );

  }

  if(tipo === "par"){

    return (
      numero !== 0 &&
      numero % 2 === 0
    );

  }

  if(tipo === "impar"){

    return numero % 2 === 1;

  }

  return false;

}


/* ==================================================
   LIMPAR
================================================== */

document
.getElementById("limpar")
.onclick =
function(){

  if(!apostasAbertas)
    return;

  somFicha();

  apostas.forEach(
  function(aposta){

    dinheiro +=
      aposta.valor;

  });

  apostas = [];

  document
  .querySelectorAll(".selecionado")
  .forEach(
  function(el){

    el.classList.remove(
      "selecionado"
    );

  });

  atualizar();

  mensagem.textContent =
    "Apostas limpas.";

};


/* ==================================================
   INICIAR RODADA
================================================== */

function iniciarRodada(){

  clearInterval(contador);

  tempoAposta = 10;

  apostasAbertas = true;

  girando = false;

  pararSomRoleta();

  btnGirar.disabled = true;

  btnGirar.textContent =
    "AGUARDE";

  aviso.innerHTML =
    "⏱️ APOSTAS: <b>10s</b>";

  mensagem.textContent =
    "Faça suas apostas.";

  iniciarMusica();

  somContagem();

  contador =
    setInterval(
    function(){

      tempoAposta--;

      if(tempoAposta > 0){

        somContagem();

        aviso.innerHTML =
          "⏱️ APOSTAS: <b>" +
          tempoAposta +
          "s</b>";

      }

      if(tempoAposta <= 0){

        clearInterval(contador);

        fecharApostas();

      }

    },
    1000
    );

}


/* ==================================================
   FECHAR APOSTAS
================================================== */

function fecharApostas(){

  apostasAbertas = false;

  document
  .querySelectorAll(".ficha")
  .forEach(
  function(el){

    el.classList.remove(
      "ativa"
    );

  });

  aviso.innerHTML =
    "🔒 <b>APOSTAS ENCERRADAS</b>";

  mensagem.textContent =
    "🎰 Preparando o giro...";

  setTimeout(
    girarAutomaticamente,
    800
  );

}


/* ==================================================
   GIRAR
================================================== */

function girarAutomaticamente(){

  if(girando)
    return;

  girando = true;

  btnGirar.disabled = true;

  aviso.innerHTML =
    "🎰 <b>ROLETA GIRANDO...</b>";

  mensagem.textContent =
    "Aguarde o resultado...";

  iniciarMusica();

  iniciarSomRoleta();

  const resultado =
    Math.floor(
      Math.random() * 37
    );

  const indice =
    ordemRoleta.indexOf(
      resultado
    );

  const setor =
    360 / 37;

  const alvo =
    -(indice * setor);

  rotacao +=
    360 * 8;

  const atualModulo =
    rotacao % 360;

  const ajuste =
    alvo - atualModulo;

  rotacao +=
    ajuste;

  roleta.style.transform =
    "rotate(" +
    rotacao +
    "deg)";

  setTimeout(
  function(){

    finalizarRodada(
      resultado
    );

  },
  7050
  );

}


/* ==================================================
   FINALIZAR COM TAXA DA CASA
================================================== */

async function finalizarRodada(
  resultado
){

  pararSomRoleta();

  somResultado();

  let premioBruto = 0;

  apostas.forEach(
  function(aposta){

    if(
      ganhou(
        aposta.tipo,
        resultado
      )
    ){

      if(
        typeof aposta.tipo === "number"
      ){

        premioBruto +=
          aposta.valor * 36;

      }
      else{

        premioBruto +=
          aposta.valor * 2;

      }

    }

  });

  /* 
     APLICAÇÃO DA TAXA DA CASA
     O jogador recebe 95% do prêmio bruto.
  */
  const premioFinal = premioBruto * TAXA_CASA;

  dinheiro += premioFinal;

  await salvarSaldo();

  let cor;

  if(resultado === 0){

    cor = "VERDE";

  }
  else if(
    vermelhos.includes(
      resultado
    )
  ){

    cor = "VERMELHO";

  }
  else{

    cor = "PRETO";

  }

  if(premioFinal > 0){

    mensagem.textContent =
      "🏆 Resultado: " +
      resultado +
      " — " +
      cor +
      " | Prêmio virtual: " +
      formatar(premioFinal);

  }
  else{

    mensagem.textContent =
      "Resultado: " +
      resultado +
      " — " +
      cor +
      " | Sem prêmio.";

  }

  aviso.innerHTML =
    "🎯 RESULTADO: <b>" +
    resultado +
    "</b> — " +
    cor;

  apostas = [];

  document
  .querySelectorAll(".selecionado")
  .forEach(
  function(el){

    el.classList.remove(
      "selecionado"
    );

  });

  atualizar();

  girando = false;

  setTimeout(
    function(){

      iniciarRodada();

    },
    3000
  );

}
