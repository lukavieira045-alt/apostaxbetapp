<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Roleta Cassino</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:20px;
}

.top{
  height:52px;
  background:#111;
  border-bottom:2px solid #b88925;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-size:12px;
}

.online{
  color:#45df7d;
}

.area{
  width:100%;
  max-width:900px;
  margin:auto;
}

.mesa{
  position:relative;
  height:450px;
  overflow:hidden;
  background:linear-gradient(135deg,#06152d,#123d94,#071936);
}

/* ÁREA DA ROLETA */

.roleta-area{
  position:absolute;
  left:8px;
  top:55px;
  width:155px;
  height:155px;
  z-index:5;
}

/* PONTEIRO */

.ponteiro{
  position:absolute;
  top:-14px;
  left:50%;

  transform:translateX(-50%);

  width:0;
  height:0;

  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:30px solid #ffd43b;

  filter:drop-shadow(0 2px 3px #000);

  z-index:30;
}

/* ROLETA */

.roleta{
  position:relative;

  width:155px;
  height:155px;

  border-radius:50%;

  border:8px solid #a86b32;

  background:
    conic-gradient(
      #087c3d 0deg 9.73deg,
      #b51e24 9.73deg 19.46deg,
      #111 19.46deg 29.19deg,
      #b51e24 29.19deg 38.92deg,
      #111 38.92deg 48.65deg,
      #b51e24 48.65deg 58.38deg,
      #111 58.38deg 68.11deg,
      #b51e24 68.11deg 77.84deg,
      #111 77.84deg 87.57deg,
      #b51e24 87.57deg 97.30deg,
      #111 97.30deg 107.03deg,
      #b51e24 107.03deg 116.76deg,
      #111 116.76deg 126.49deg,
      #b51e24 126.49deg 136.22deg,
      #111 136.22deg 145.95deg,
      #b51e24 145.95deg 155.68deg,
      #111 155.68deg 165.41deg,
      #b51e24 165.41deg 175.14deg,
      #111 175.14deg 184.87deg,
      #b51e24 184.87deg 194.60deg,
      #111 194.60deg 204.33deg,
      #b51e24 204.33deg 214.06deg,
      #111 214.06deg 223.79deg,
      #b51e24 223.79deg 233.52deg,
      #111 233.52deg 243.25deg,
      #b51e24 243.25deg 252.98deg,
      #111 252.98deg 262.71deg,
      #b51e24 262.71deg 272.44deg,
      #111 272.44deg 282.17deg,
      #b51e24 282.17deg 291.90deg,
      #111 291.90deg 301.63deg,
      #b51e24 301.63deg 311.36deg,
      #111 311.36deg 321.09deg,
      #b51e24 321.09deg 330.82deg,
      #111 330.82deg 340.55deg,
      #b51e24 340.55deg 350.28deg,
      #111 350.28deg 360deg
    );

  box-shadow:
    0 0 0 3px #d09a50,
    0 10px 25px #000;

  /* GIRO LENTO */

  transition:
    transform 7s cubic-bezier(.08,.55,.15,1);

  overflow:hidden;
}

/* NÚMEROS DA ROLETA */

.numeros-roleta{
  position:absolute;
  inset:5px;
  border-radius:50%;
  pointer-events:none;
}

.numero-roleta{
  position:absolute;

  left:50%;
  top:50%;

  width:18px;
  height:18px;

  margin-left:-9px;
  margin-top:-9px;

  color:#fff;

  font-size:9px;
  font-weight:bold;

  text-align:center;
  line-height:18px;

  text-shadow:0 1px 2px #000;

  transform-origin:9px 9px;
}

/* CENTRO */

.centro-roleta{
  position:absolute;

  left:50%;
  top:50%;

  width:43px;
  height:43px;

  margin-left:-21.5px;
  margin-top:-21.5px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #e0ad65 0 15%,
      #5a2a0d 16% 35%,
      #111 36% 62%,
      #d09a50 63% 70%,
      #222 71%
    );

  border:2px solid #e0ad65;

  z-index:5;
}

/* TABULEIRO */

.mesa-jogo{
  position:absolute;

  left:23%;
  right:-10%;
  top:55px;

  height:345px;

  background:#12419a;

  border:3px solid white;

  box-shadow:
    0 0 0 3px #152d68,
    0 15px 30px #000;

  padding:15px;
}

.grade{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  margin-left:7%;
}

.numero{
  height:39px;

  border:1px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  font-weight:bold;

  cursor:pointer;
  user-select:none;
}

.vermelho{
  background:#b51e25;
}

.preto{
  background:#111;
}

.zero{
  position:absolute;

  left:9px;
  top:15px;

  width:6%;
  height:77%;

  background:#087d3d;

  border:1px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;
}

.faixas{
  margin-left:7%;
  margin-top:3px;

  display:grid;
  grid-template-columns:repeat(6,1fr);
}

.faixa{
  height:45px;

  background:#12377d;

  border:1px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:bold;

  cursor:pointer;
}

.faixa.vermelho{
  background:#a91d25;
}

.selecionado{
  box-shadow:inset 0 0 0 3px #ffd43b;
  filter:brightness(1.4);
}

.aviso{
  position:absolute;

  left:8px;
  bottom:8px;

  background:rgba(0,0,0,.85);

  padding:9px;

  border-radius:5px;

  font-size:10px;

  z-index:10;
}

/* CONTROLES */

.controles{
  background:#0d0d0d;

  border-top:2px solid #444;

  padding:12px;
}

.linha{
  display:flex;

  justify-content:space-between;

  margin-bottom:12px;

  font-size:13px;

  color:#aaa;
}

.linha b{
  color:#6fe38b;
}

.fichas{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}

.ficha{
  min-width:44px;
  height:44px;

  border-radius:50%;

  border:3px solid white;

  background:#8b3030;

  color:white;

  font-weight:bold;

  cursor:pointer;
}

.ficha.ativa{
  outline:3px solid #ffd43b;
}

.botoes{
  display:flex;
  gap:8px;
}

button{
  flex:1;

  padding:14px;

  border-radius:8px;

  background:#191919;

  border:1px solid #666;

  color:white;

  font-weight:bold;

  font-size:14px;

  cursor:pointer;
}

#btnGirar{
  background:#087642;
  border-color:#39d97b;
}

#btnGirar:disabled{
  opacity:.5;
}

#mensagem{
  text-align:center;

  margin-top:10px;

  min-height:20px;

  font-size:12px;
}

.nota{
  text-align:center;

  color:#777;

  font-size:9px;

  margin-top:8px;
}

@media(max-width:600px){

  .mesa{
    height:450px;
  }

  .roleta-area{
    left:3px;
  }

  .mesa-jogo{
    left:21%;
    right:-20%;
  }

  .numero{
    height:37px;
    font-size:10px;
  }

  .faixa{
    height:43px;
    font-size:8px;
  }

  .numero-roleta{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="top">

  <span>🎰 Roleta Cassino — DEMO</span>

  <span class="online">● ONLINE</span>

</div>

<div class="area">

<div class="mesa">

  <div class="roleta-area">

    <div class="ponteiro"></div>

    <div
      id="roleta"
      class="roleta">

      <div
        id="numerosRoleta"
        class="numeros-roleta">
      </div>

      <div class="centro-roleta"></div>

    </div>

  </div>


  <div class="mesa-jogo">

    <div
      id="zero"
      class="zero">
      0
    </div>

    <div
      id="grade"
      class="grade">
    </div>

    <div class="faixas">

      <div
        class="faixa"
        data-bet="baixo">
        1-18
      </div>

      <div
        class="faixa"
        data-bet="par">
        PAR
      </div>

      <div
        class="faixa vermelho"
        data-bet="vermelho">
        VERMELHO
      </div>

      <div
        class="faixa"
        data-bet="preto">
        PRETO
      </div>

      <div
        class="faixa"
        data-bet="impar">
        ÍMPAR
      </div>

      <div
        class="faixa"
        data-bet="alto">
        19-36
      </div>

    </div>

  </div>


  <div
    id="aviso"
    class="aviso">

    FAÇA SUAS APOSTAS

  </div>

</div>


<div class="controles">

  <div class="linha">

    <span>
      Créditos virtuais:
      <b id="saldo">100,00</b>
    </span>

    <span>
      Ficha:
      <b id="valor">1,00</b>
    </span>

  </div>


  <div class="fichas">

    <button
      class="ficha ativa"
      data-valor="1">
      1
    </button>

    <button
      class="ficha"
      data-valor="5">
      5
    </button>

    <button
      class="ficha"
      data-valor="10">
      10
    </button>

    <button
      class="ficha"
      data-valor="25">
      25
    </button>

    <button
      class="ficha"
      data-valor="50">
      50
    </button>

  </div>


  <div class="botoes">

    <button id="limpar">
      LIMPAR
    </button>

    <button id="btnGirar">
      GIRAR
    </button>

  </div>


  <div id="mensagem"></div>

  <div class="nota">
    Jogo demonstrativo com créditos virtuais.
    Não utiliza dinheiro real.
  </div>

</div>

</div>


<script>

const vermelhos = [
  1,3,5,7,9,
  12,14,16,18,
  19,21,23,25,27,
  30,32,34,36
];


/* ORDEM PADRÃO DA ROLETA */

const ordemRoleta = [
  0,
  32,15,19,4,21,2,25,17,34,6,
  27,13,36,11,30,8,23,10,5,24,
  16,33,1,20,14,31,9,22,18,29,
  7,28,12,35,3,26
];


const grade =
  document.getElementById("grade");

const numerosRoleta =
  document.getElementById("numerosRoleta");

const roleta =
  document.getElementById("roleta");

const saldo =
  document.getElementById("saldo");

const valor =
  document.getElementById("valor");

const mensagem =
  document.getElementById("mensagem");

const aviso =
  document.getElementById("aviso");

const btnGirar =
  document.getElementById("btnGirar");


let dinheiro = 100;

let ficha = 1;

let apostas = [];

let girando = false;

let rotacao = 0;


/* NÚMEROS NA ROLETA */

ordemRoleta.forEach(
function(numero,index){

  const el =
    document.createElement("div");

  el.className =
    "numero-roleta";

  el.textContent =
    numero;

  const angulo =
    index * (360 / 37);

  const raio = 61;

  const rad =
    (angulo - 90) *
    Math.PI / 180;

  const x =
    Math.cos(rad) * raio;

  const y =
    Math.sin(rad) * raio;

  el.style.transform =
    "translate(" +
    x +
    "px," +
    y +
    "px)";

  if(numero === 0){

    el.style.color =
      "#63e58d";

  }

  numerosRoleta.appendChild(el);

});


/* TABULEIRO */

for(
  let n=1;
  n<=36;
  n++
){

  const numero =
    document.createElement("div");

  numero.className =
    "numero " +
    (
      vermelhos.includes(n)
      ? "vermelho"
      : "preto"
    );

  numero.textContent =
    n;

  numero.onclick =
    function(){

      fazerAposta(
        n,
        numero
      );

    };

  grade.appendChild(numero);

}


/* ZERO */

document
.getElementById("zero")
.onclick =
function(){

  fazerAposta(
    0,
    this
  );

};


/* FAIXAS */

document
.querySelectorAll(".faixa")
.forEach(
function(botao){

  botao.onclick =
  function(){

    fazerAposta(
      botao.dataset.bet,
      botao
    );

  };

});


/* FICHAS */

document
.querySelectorAll(".ficha")
.forEach(
function(botao){

  botao.onclick =
  function(){

    document
    .querySelectorAll(".ficha")
    .forEach(
    function(x){

      x.classList.remove(
        "ativa"
      );

    });

    botao.classList.add(
      "ativa"
    );

    ficha =
      Number(
        botao.dataset.valor
      );

    valor.textContent =
      ficha
      .toFixed(2)
      .replace(".",",");

  };

});


/* APOSTA */

function fazerAposta(
  tipo,
  elemento
){

  if(girando)
    return;

  if(dinheiro < ficha){

    mensagem.textContent =
      "Créditos insuficientes.";

    return;
  }

  dinheiro -= ficha;

  apostas.push({
    tipo:tipo,
    valor:ficha
  });

  elemento.classList.add(
    "selecionado"
  );

  atualizar();

  mensagem.textContent =
    "Aposta virtual adicionada.";

}


/* VERIFICAR RESULTADO */

function ganhou(
  tipo,
  numero
){

  if(
    typeof tipo === "number"
  ){

    return tipo === numero;

  }

  if(tipo === "vermelho"){

    return vermelhos.includes(
      numero
    );

  }

  if(tipo === "preto"){

    return (
      numero !== 0 &&
      !vermelhos.includes(numero)
    );

  }

  if(tipo === "baixo"){

    return (
      numero >= 1 &&
      numero <= 18
    );

  }

  if(tipo === "alto"){

    return (
      numero >= 19 &&
      numero <= 36
    );

  }

  if(tipo === "par"){

    return (
      numero !== 0 &&
      numero % 2 === 0
    );

  }

  if(tipo === "impar"){

    return numero % 2 === 1;

  }

  return false;

}


/* LIMPAR */

document
.getElementById("limpar")
.onclick =
function(){

  if(girando)
    return;

  apostas.forEach(
  function(aposta){

    dinheiro +=
      aposta.valor;

  });

  apostas = [];

  document
  .querySelectorAll(".selecionado")
  .forEach(
  function(el){

    el.classList.remove(
      "selecionado"
    );

  });

  aviso.textContent =
    "FAÇA SUAS APOSTAS";

  mensagem.textContent =
    "Apostas limpas.";

  atualizar();

};


/* GIRAR */

btnGirar.onclick =
function(){

  if(girando)
    return;

  if(apostas.length === 0){

    mensagem.textContent =
      "Escolha uma aposta primeiro.";

    return;
  }

  girando = true;

  btnGirar.disabled = true;

  mensagem.textContent =
    "🎰 A roleta está girando...";

  aviso.textContent =
    "AGUARDE O RESULTADO...";


  /*
    Escolhe o resultado antes
    do giro visual.
  */

  const resultado =
    Math.floor(
      Math.random() * 37
    );


  const indice =
    ordemRoleta.indexOf(
      resultado
    );


  const setor =
    360 / 37;


  const alvo =
    -(indice * setor);


  /*
    7 segundos de giro.
    Começa rápido e desacelera
    bastante perto do final.
  */

  rotacao +=
    360 * 8;


  const atualModulo =
    rotacao % 360;


  const ajuste =
    alvo - atualModulo;


  rotacao +=
    ajuste;


  roleta.style.transform =
    "rotate(" +
    rotacao +
    "deg)";


  /*
    Aguarda exatamente o final
    da animação de 7 segundos.
  */

  setTimeout(
  function(){

    let premio = 0;


    apostas.forEach(
    function(aposta){

      if(
        ganhou(
          aposta.tipo,
          resultado
        )
      ){

        if(
          typeof aposta.tipo === "number"
        ){

          premio +=
            aposta.valor * 36;

        }
        else{

          premio +=
            aposta.valor * 2;

        }

      }

    });


    dinheiro +=
      premio;


    let cor;


    if(resultado === 0){

      cor = "VERDE";

    }
    else if(
      vermelhos.includes(resultado)
    ){

      cor = "VERMELHO";

    }
    else{

      cor = "PRETO";

    }


    if(premio > 0){

      mensagem.textContent =
        "🏆 Resultado: " +
        resultado +
        " — " +
        cor +
        " | Prêmio virtual: " +
        premio
        .toFixed(2)
        .replace(".",",");

    }
    else{

      mensagem.textContent =
        "Resultado: " +
        resultado +
        " — " +
        cor +
        " | Sem prêmio.";

    }


    aviso.innerHTML =
      "RESULTADO: <b>" +
      resultado +
      "</b> — " +
      cor;


    apostas = [];


    document
    .querySelectorAll(".selecionado")
    .forEach(
    function(el){

      el.classList.remove(
        "selecionado"
      );

    });


    atualizar();


    girando = false;

    btnGirar.disabled = false;

  },
  7050
  );

};


/* ATUALIZAR SALDO */

function atualizar(){

  saldo.textContent =
    dinheiro
    .toFixed(2)
    .replace(".",",");

}

atualizar();

</script>

</body>
</html>
