<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    color:white;
    text-align:center;
    background:
        radial-gradient(circle at 15% 15%,#0066ff,transparent 28%),
        radial-gradient(circle at 85% 25%,#e600ff,transparent 28%),
        radial-gradient(circle at 50% 100%,#ff0066,transparent 30%),
        linear-gradient(135deg,#02030b,#090018,#001526);
    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

#carregando{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:#020305;
    color:#ffd700;
    font-weight:bold;
}

.loader{
    width:38px;
    height:38px;
    border:4px solid rgba(255,215,0,.2);
    border-top-color:#ffd700;
    border-radius:50%;
    animation:girarLoader .8s linear infinite;
}

@keyframes girarLoader{
    to{transform:rotate(360deg)}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4)}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #00ffff,0 0 18px #ff00aa;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:7s}
.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}
.particulas span:nth-child(4){left:35%;animation-duration:12s}
.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{transform:translateY(0);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-110vh);opacity:0}
}

    }

<script>
"use strict";

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* ==================================================
   ELEMENTOS
================================================== */

const carregando =
document.getElementById("carregando");

const textoCarregando =
document.getElementById("textoCarregando");

const saldoEl =
document.getElementById("saldo");

const jogo =
document.getElementById("jogo");

const bola =
document.getElementById("bola");

const casas =
document.getElementById("casas");

const fichas =
document.querySelectorAll(".ficha");

const valorSelecionadoEl =
document.getElementById("valorSelecionado");

const apostaTexto =
document.getElementById("apostaTexto");

const contagem =
document.getElementById("contagem");

const mensagem =
document.getElementById("mensagem");

const premio =
document.getElementById("premio");

const botao =
document.getElementById("botao");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoTitulo =
document.getElementById("resultadoTitulo");

const resultadoNumero =
document.getElementById("resultadoNumero");

const resultadoPremio =
document.getElementById("resultadoPremio");

const fecharResultado =
document.getElementById("fecharResultado");

/* ==================================================
   ESTADO
================================================== */

let usuarioAtual = null;
let saldoReal = 0;
let valorAposta = 0;
let numeroEscolhido = null;
let jogando = false;
let fichaSelecionada = false;
let timer = null;
let segundos = 0;

/*
   Os multiplicadores continuam apenas como
   referência visual das casas.

   IMPORTANTE:
   multiplicador NÃO significa vitória automática.

   A vitória depende EXCLUSIVAMENTE de:
   indiceResultado === numeroEscolhido
*/

const premios = [
    0.5,
    "PERDEU",
    1,
    2,
    "PERDEU",
    10,
    2,
    "PERDEU",
    0.5
];

/* ==================================================
   DINHEIRO
================================================== */

function dinheiro(valor){

    return "R$ " +
    Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}

/* ==================================================
   SALDO
================================================== */

function atualizarSaldo(){

    saldoEl.innerText =
    dinheiro(saldoReal);

}

/* ==================================================
   SESSÃO
================================================== */

async function obterUsuario(){

    try{

        const resposta =
        await supabaseClient.auth.getSession();

        if(resposta.error){

            console.error(
                resposta.error
            );

            return null;
        }

        return resposta.data?.session?.user || null;

    }catch(error){

        console.error(error);

        return null;
    }

}

/* ==================================================
   CARREGAR SALDO REAL
================================================== */

async function carregarSaldo(){

    if(!usuarioAtual){

        return false;
    }

    try{

        const resposta =
        await supabaseClient
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .maybeSingle();

        if(resposta.error){

            console.error(
                resposta.error
            );

            return false;
        }

        saldoReal =
        Number(
            resposta.data?.valor || 0
        );

        atualizarSaldo();

        return true;

    }catch(error){

        console.error(error);

        return false;
    }

}

/* ==================================================
   SALVAR SALDO REAL
================================================== */

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual){

        return false;
    }

    try{

        const resposta =
        await supabaseClient
        .from("saldos")
        .update({
            valor:Number(novoSaldo)
        })
        .eq(
            "user_id",
            usuarioAtual.id
        );

        if(resposta.error){

            console.error(
                "Erro ao salvar saldo:",
                resposta.error
            );

            return false;
        }

        saldoReal =
        Number(novoSaldo);

        atualizarSaldo();

        return true;

    }catch(error){

        console.error(error);

        return false;
    }

}

/* ==================================================
   DEBITAR APOSTA
================================================== */

async function debitarAposta(){

    if(valorAposta <= 0){

        return false;
    }

    if(valorAposta > saldoReal){

        mensagem.innerText =
        "❌ SALDO INSUFICIENTE";

        mensagem.classList.add(
            "erro"
        );

        return false;
    }

    const saldoAntes =
    saldoReal;

    const novoSaldo =
    Number(
        (
            saldoAntes -
            valorAposta
        ).toFixed(2)
    );

    const salvo =
    await salvarSaldo(
        novoSaldo
    );

    if(!salvo){

        saldoReal =
        saldoAntes;

        atualizarSaldo();

        mensagem.innerText =
        "❌ NÃO FOI POSSÍVEL DEBITAR A APOSTA";

        mensagem.classList.add(
            "erro"
        );

        return false;
    }

    return true;
}

/* ==================================================
   CREDITAR PRÊMIO
================================================== */

async function creditarPremio(valor){

    if(valor <= 0){

        return true;
    }

    const novoSaldo =
    Number(
        (
            saldoReal +
            valor
        ).toFixed(2)
    );

    return await salvarSaldo(
        novoSaldo
    );
}

/* ==================================================
   PINOS
================================================== */

function criarPinos(){

    document
    .querySelectorAll(".pino")
    .forEach(
        p => p.remove()
    );

    const largura =
    jogo.clientWidth;

    const centro =
    largura / 2;

    for(
        let linha = 0;
        linha < 7;
        linha++
    ){

        const quantidade =
        linha + 3;

        const espacamento =
        35;

        const larguraLinha =
        (
            quantidade - 1
        ) * espacamento;

        const inicio =
        centro -
        larguraLinha / 2;

        for(
            let coluna = 0;
            coluna < quantidade;
            coluna++
        ){

            const p =
            document.createElement(
                "div"
            );

            p.className =
            "pino";

            p.style.top =
            (
                38 +
                linha * 38
            ) + "px";

            p.style.left =
            (
                inicio +
                coluna * espacamento -
                5.5
            ) + "px";

            jogo.appendChild(p);
        }
    }
}

/* ==================================================
   CASAS
================================================== */

function criarCasas(){

    casas.innerHTML = "";

    premios.forEach(
        function(valor,index){

            const casa =
            document.createElement(
                "div"
            );

            casa.className =
            "casa";

            casa.dataset.index =
            index;

            if(valor === "PERDEU"){

                casa.classList.add(
                    "perdeu"

            );

            );
        }
    );
}

/* ==================================================
   ÁUDIO
================================================== */

let audioContext = null;

function iniciarAudio(){

    if(!audioContext){

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AudioContext)return;

        audioContext =
        new AudioContext();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }
}

function tocarSom(
    frequencia,
    duracao=.08
){

    iniciarAudio();

    if(!audioContext)return;

    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    osc.type =
    "triangle";

    osc.frequency.setValueAtTime(
        frequencia,
        agora
    );

    ganho.gain.setValueAtTime(
        .20,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + duracao
    );

    osc.connect(
        ganho
    );

    ganho.connect(
        audioContext.destination
    );

    osc.start(
        agora
    );

    osc.stop(
        agora + duracao
    );
}

function somPremio(){

    iniciarAudio();

    [523,659,784,1047]
    .forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    tocarSom(
                        freq,
                        .3
                    );
                },
                i * 100
            );
        }
    );
}

function somPerdeu(){

    iniciarAudio();

    [220,180,140]
    .forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    tocarSom(
                        freq,
                        .3
                    );

        }
    );
}

/* ==================================================

================================================== */

async function iniciarJogo(){

    if(jogando)return;

    if(
        numeroEscolhido === null ||
        valorAposta <= 0
    ){

        mensagem.innerText =
        "🎯 Escolha uma ficha e uma casa";

        return;
    }

    clearInterval(timer);

    timer = null;

    /*
       Guardamos a casa escolhida ANTES
       de iniciar a animação.
    */

    const casaEscolhidaDuranteAposta =
    numeroEscolhido;

    const apostaAtual =
    valorAposta;

    contagem.innerText =
    "🎯 PREPARANDO...";

    /*
       O valor é descontado do saldo
       real antes da rodada.
    */

    const debitou =
    await debitarAposta();

    if(!debitou){

        botao.disabled =
        false;

        return;
    }

    iniciarAudio();

    tocarSom(520);

    jogando =
    true;

    botao.disabled =
    true;

    document
    .querySelectorAll(".casa")
    .forEach(
        c =>
        c.classList.remove(
            "vencedora"
        )
    );

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.innerText =
    "🎯 A bolinha está descendo...";

    mensagem.innerText =
    "⚡ PLINKO EM ANDAMENTO...";

    bola.classList.add(
        "caindo"
    );

    let x =
    jogo.clientWidth / 2;

    let y =
    15;

    bola.style.left =
    x + "px";

    bola.style.top =
    y + "px";

    /*
       Sorteia somente a CASA onde a
       bolinha realmente vai terminar.
    */

    const indiceResultado =
    Math.floor(
        Math.random() *
        premios.length
    );

    const larguraCasa =
    jogo.clientWidth /
    premios.length;

    const destinoX =
    (
        indiceResultado +
        .5
    ) * larguraCasa;

    const inicioX =
    x;

    const inicioY =
    y;

    const fimY =
    jogo.clientHeight -
    82;

    const duracao =
    3000;

    const inicio =
    performance.now();

    let ultimoSom = 0;

    function animar(agora){

        const progresso =
        Math.min(
            (
                agora -
                inicio
            ) / duracao,
            1
        );

        const suave =
        progresso *
        progresso *
        (
            3 -
            2 * progresso
        );

        const ondas =
        Math.sin(
            progresso *
            Math.PI *
            15
        ) *
        (
            1 -
            progresso
        ) *
        22;

        x =
        inicioX +
        (
            destinoX -
            inicioX
        ) * suave +
        ondas;

        y =
        inicioY +
        (
            fimY -
            inicioY
        ) * suave;

        bola.style.left =
        x + "px";

        bola.style.top =
        y + "px";

        if(
            agora -
            ultimoSom >
            180
        ){

            tocarSom(
                700 +
                Math.random() *
                250,
                .05
            );

            ultimoSom =
            agora;
        }

        if(
            Math.random() >
            .55
        ){

            criarTrilha(
                x,
                y
            );
        }

        if(
            progresso < 1
        ){

            requestAnimationFrame(
                animar
            );

        }else{

            finalizarBola(
                indiceResultado,
                casaEscolhidaDuranteAposta,
                apostaAtual
            );
        }
    }

    requestAnimationFrame(
        animar
    );
}

/* ==================================================
   FINALIZAR BOLA
================================================== */

async function finalizarBola(
    indiceResultado,
    casaEscolhida,
    apostaAtual
){

    const lista =
    document.querySelectorAll(
        ".casa"
    );

    const casaResultado =
    lista[indiceResultado];

    /*
       =================================================
       REGRA PRINCIPAL DO PLINKO
       =================================================

       Só ganha se:

       CASA ONDE CAIU === CASA ESCOLHIDA

       Qualquer outra casa = PERDE.

       O multiplicador da casa onde caiu NÃO
       transforma a rodada em vitória.
    */

    const acertou =
    Number(indiceResultado) ===
    Number(casaEscolhida);

    let premioReal = 0;

    if(acertou){

        /*
           ACERTOU A CASA.
           Agora sim o multiplicador da casa
           escolhida pode ser utilizado.
        */

        if(casaResultado){

            casaResultado.classList.add(
                "vencedora"
            );
        }

        const multiplicador =
        premios[indiceResultado];

        /*
           Caso a casa escolhida seja uma
           casa marcada como PERDEU, ela
           continua sendo perda.
        */

        if(
            multiplicador ===
            "PERDEU"
        ){

            somPerdeu();

            premioReal = 0;

            mensagem.innerHTML =
            "💥 VOCÊ PERDEU " +
            dinheiro(apostaAtual);

            premio.innerHTML =
            "💥 PERDEU — " +
            dinheiro(apostaAtual);

            resultadoTitulo.innerText =
            "💥 VOCÊ PERDEU";

            resultadoPremio.innerText =
            "Você perdeu " +
            dinheiro(apostaAtual);

        }else{

            premioReal =
            Number(
                (
                    apostaAtual *
                    Number(
                        multiplicador
                    )
                ).toFixed(2)
            );

            somPremio();

            mensagem.innerHTML =
            "🎉 VOCÊ ACERTOU A CASA " +
            (indiceResultado + 1) +
            "!";

            mensagem.style.color =
            "#00ff88";

            premio.innerHTML =
            "🎉 " +
            multiplicador +
            "x — " +
            dinheiro(
                premioReal
            );

            resultadoTitulo.innerText =
            "🎉 VOCÊ GANHOU";

            resultadoPremio.innerText =
            dinheiro(
                premioReal
            ) +
            " (" +
            multiplicador +
            "x)";
        }

    }else{

        /*
           =================================================
           PERDEU
           =================================================

           Mesmo que a casa onde caiu tenha 0.5x,
           1x, 2x ou 10x, NÃO paga nada porque
           o jogador escolheu outra casa.
        */

        somPerdeu();

        premioReal = 0;

        if(casaResultado){

            casaResultado.classList.add(
                "vencedora"
            );

            casaResultado.classList.add(
                "perdeu"
            );
        }

        mensagem.innerHTML =
        "💥 VOCÊ PERDEU " +
        dinheiro(apostaAtual);

        mensagem.style.color =
        "#ff5555";

        premio.innerHTML =
        "💥 PERDEU — " +
        dinheiro(apostaAtual);

        resultadoTitulo.innerText =
        "💥 VOCÊ PERDEU";

        resultadoPremio.innerText =
        "Você perdeu " +
        dinheiro(apostaAtual);

        /*
           Mostra também qual casa foi escolhida
           e qual foi a casa real onde caiu.
        */

        setTimeout(
            ()=>{
                mensagem.innerHTML =
                "💥 CASA ESCOLHIDA: " +
                (casaEscolhida + 1) +
                " — CAIU NA CASA " +
                (indiceResultado + 1) +
                " — VOCÊ PERDEU " +
                dinheiro(apostaAtual);
            },
            500
        );
    }

    /*
       Só existe crédito quando houve acerto
       em uma casa que possui multiplicador.
    */

    if(premioReal > 0){

        const creditado =
        await creditarPremio(
            premioReal
        );

        if(!creditado){

            mensagem.innerText =
            "⚠️ ERRO AO ATUALIZAR O PRÊMIO";

            mensagem.classList.add(
                "erro"
            );
        }
    }

    resultadoNumero.innerText =
    indiceResultado + 1;

    /*
       Resultado final fica preparado
       antes de abrir a tela.
    */

    setTimeout(
        function(){

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        350
    );

    jogando =
    false;

    botao.disabled =
    false;

    botao.innerText =
    "🎯 JOGAR NOVAMENTE";

    setTimeout(
        function(){

            bola.classList.remove(
                "caindo"
            );

        },
        400
    );
}
