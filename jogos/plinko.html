<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Plinko ApostaXBet</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;

    background:
    radial-gradient(circle at 15% 15%,#0066ff,transparent 28%),
    radial-gradient(circle at 85% 25%,#e600ff,transparent 28%),
    radial-gradient(circle at 50% 100%,#ff0066,transparent 30%),
    linear-gradient(135deg,#02030b,#090018,#001526);

    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
    padding-bottom:30px;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4)}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;

    box-shadow:
    0 0 8px #00ffff,
    0 0 18px #ff00aa;

    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:7s}
.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}
.particulas span:nth-child(4){left:35%;animation-duration:12s}
.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{opacity:1}

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

h1{
    margin-top:25px;
    color:#ffd700;
    font-size:38px;

    text-shadow:
    0 0 8px #fff,
    0 0 18px #ffd700,
    0 0 35px #ff8800;
}

#saldo{
    display:inline-block;
    color:#00ff88;
    font-size:22px;
    margin:10px 15px 20px;
    padding:10px 22px;
    border:1px solid #00ff88;
    border-radius:30px;
    background:rgba(0,0,0,.6);

    box-shadow:
    0 0 15px rgba(0,255,136,.25);
}

#statusConta{
    min-height:20px;
    margin:-8px 15px 12px;
    color:#aaa;
    font-size:12px;
}

.caixa{
    width:95%;
    max-width:430px;
    margin:auto;
    padding:20px;

    background:
    linear-gradient(
        145deg,
        rgba(20,25,40,.96),
        rgba(3,5,15,.97)
    );

    border:2px solid #ffd700;
    border-radius:25px;

    box-shadow:
    0 0 25px rgba(255,215,0,.25),
    0 20px 70px rgba(0,0,0,.7);

    backdrop-filter:blur(10px);
}

#jogo{
    height:370px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:1px solid rgba(255,215,0,.35);

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(0,150,255,.20),
        transparent 45%
    ),

    linear-gradient(
        180deg,
        #030712,
        #02020a
    );

    box-shadow:
    inset 0 0 40px rgba(0,0,0,.9);
}

.grade{
    position:absolute;
    inset:0;
    opacity:.12;

    background-image:
    linear-gradient(
        rgba(0,255,255,.4) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,255,255,.4) 1px,
        transparent 1px
    );

    background-size:35px 35px;
}

.pino{
    position:absolute;
    width:11px;
    height:11px;

    background:
    radial-gradient(
        circle at 35% 30%,
        white,
        #ffd700 35%,
        #ff9800
    );

    border-radius:50%;

    box-shadow:
    0 0 6px #ffd700,
    0 0 14px rgba(255,215,0,.7);

    z-index:2;
}

#bola{
    position:absolute;
    top:10px;
    left:50%;
    width:24px;
    height:24px;
    margin-left:-12px;
    border-radius:50%;

    background:
    radial-gradient(
        circle at 30% 25%,
        white,
        #00ff88 30%,
        #00aaff 75%
    );

    box-shadow:
    0 0 10px #00ff88,
    0 0 25px #00ffff;

    z-index:10;
    opacity:0;
}

#bola.caindo{
    opacity:1;
}

.trilha{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#00ffff;

    box-shadow:
    0 0 8px #00ffff;

    pointer-events:none;
}

#casas{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:58px;
    display:flex;
    align-items:stretch;
    justify-content:center;
    z-index:4;
}

.casa{
    flex:1;
    max-width:58px;
    margin:2px;
    border-radius:10px 10px 4px 4px;

    border:1px solid rgba(255,255,255,.15);

    background:
    linear-gradient(
        180deg,
        #151525,
        #080811
    );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:.25s;

    cursor:pointer;
    touch-action:manipulation;
}

.casaNumero{
    font-size:15px;
    font-weight:bold;
    color:#ffd700;
}

.casaTipo{
    font-size:9px;
    color:#777;
}

.casa.escolhida{
    border-color:#00ff88;

    box-shadow:
    0 0 10px #00ff88,
    0 0 25px rgba(0,255,136,.6);

    transform:translateY(-5px) scale(1.05);
}

.casa.escolhida .casaNumero{
    color:#00ff88;
}

.casa.vencedora{
    background:
    linear-gradient(
        180deg,
        #ffe66b,
        #ff9800
    );

    color:#160e00;

    transform:
    translateY(-8px)
    scale(1.08);

    border-color:white;

    box-shadow:
    0 0 10px #ffd700,
    0 0 30px #ff9800,
    0 0 50px rgba(255,215,0,.7);

    animation:ganhadora .5s infinite alternate;
}

@keyframes ganhadora{
    from{filter:brightness(1)}
    to{filter:brightness(1.4)}
}

.casa.superbonus{
    border-color:#ff00ff;

    box-shadow:
    0 0 10px #ff00ff,
    0 0 25px #ff00ff,
    inset 0 0 15px rgba(255,0,255,.2);
}

.casa.superbonus .casaTipo{
    color:#ff66ff;
}

#ficha{
    position:absolute;

    width:43px;
    height:43px;

    border-radius:50%;

    background:

        circle,
        #555 0 42%,
        #eee 43% 51%,
        #777 52% 68%,

        #222 74%
    );

    border:2px solid white;

    box-shadow:
    0 0 8px white,
    0 0 20px #ffd700,
    0 3px 7px #000;

    align-items:center;
    justify-content:center;

    text-shadow:0 1px 2px #000;

}

#ficha.visivel{
    display:flex;
}

.instrucoes{
    margin-top:10px;
    min-height:30px;
    color:#aaa;
    font-size:13px;
}

#premio{
    margin-top:10px;
    min-height:45px;

    color:#ffd700;
    font-size:20px;
    font-weight:bold;

}

.areaFicha{

}

.fichaBotao{
    width:55px;

    border-radius:50%;

        #222 74%

    border:2px solid white;

    box-shadow:

    0 3px 8px #000;

    color:white;
    font-size:11px;
    font-weight:bold;

    cursor:pointer;
    padding:0;

    transition:.2s;
}

.fichaBotao.selecionada{
    transform:scale(1.12);

    box-shadow:

    0 0 20px #ffe36a,

}

.valores{

    margin-bottom:8px;
}

.valorBtn{
    height:42px;
    padding:5px;

    border:1px solid #555;
    border-radius:8px;

    background:#080a10;
    color:#aaa;

    font-size:13px;
    font-weight:bold;

    box-shadow:none;
}

.valorBtn.ativo{
    border-color:#ffd700;
    color:#ffd700;

    box-shadow:
    0 0 10px rgba(255,215,0,.35);
}

#botao{
    width:100%;
    margin-top:8px;

    padding:15px 20px;

    background:
    linear-gradient(

        #ffe66b,
        #ffb000
    );

    font-weight:bold;

    box-shadow:

}

#botao:active{
    transform:scale(.97);
}

#botao:disabled{
    opacity:.5;
}

.info{
    display:flex;
    justify-content:space-between;

    margin-top:12px;

    color:#aaa;
    font-size:12px;
}

.info strong{
    color:#ffe34f;
}

#resultadoTela{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);

    opacity:0;
    pointer-events:none;

    z-index:100;

    transition:.25s;
}

#resultadoTela.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultadoCard{
    width:85%;
    max-width:340px;
    padding:30px 20px;

    border-radius:25px;

    border:2px solid #ffd700;

    background:
    linear-gradient(
        145deg,
        #11172a,
        #080912
    );

    box-shadow:
    0 0 25px #ffd700,
    0 0 80px rgba(0,150,255,.5);

    transform:scale(.5);
}

#resultadoTela.mostrar .resultadoCard{
    animation:entrarResultado .45s forwards;
}

@keyframes entrarResultado{
    0%{
        transform:scale(.5) rotate(-8deg);
    }

    70%{
        transform:scale(1.08) rotate(2deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }
}

.resultadoTitulo{
    font-size:22px;
    color:#00ff88;
}

.resultadoNumero{
    margin:10px 0;

    font-size:70px;
    font-weight:900;

    color:#ffd700;

    text-shadow:
    0 0 10px #ffd700,
    0 0 35px #ff8800;
}

.resultadoPremio{
    font-size:22px;
    color:white;
}

#fecharResultado{
    margin-top:20px;

    padding:13px 30px;

    border:0;
    border-radius:12px;

    background:#ffd700;

    font-weight:bold;
    font-size:17px;
}

.superbonus-overlay{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
    radial-gradient(
        circle,
        rgba(255,0,255,.5),
        rgba(255,180,0,.25) 35%,
        rgba(0,0,0,.96) 75%
    );

    z-index:200;
    pointer-events:none;
}

.superbonus-overlay.mostrar{
    display:flex;
    animation:bonusTela 4s forwards;
}

.superbonus-titulo{
    color:white;

    font-size:34px;
    font-weight:900;

    text-shadow:
    0 0 8px white,
    0 0 20px #ff00ff,
    0 0 40px #ffd700;

    animation:bonusTexto .8s ease-out;
}

.superbonus-valor{
    margin-top:12px;

    color:#ffe44f;

    font-size:50px;
    font-weight:900;

    text-shadow:
    0 0 10px white,
    0 0 25px #ffd700,
    0 0 50px #ff00ff;

    animation:bonusValor 1s ease-out;
}

@keyframes bonusTela{
    0%{opacity:0}
    10%{opacity:1}
    80%{opacity:1}
    100%{opacity:0}
}

@keyframes bonusTexto{
    0%{transform:scale(.2)}
    60%{transform:scale(1.25)}
    100%{transform:scale(1)}
}

@keyframes bonusValor{
    0%{transform:scale(.2)}
    60%{transform:scale(1.35)}
    100%{transform:scale(1)}
}

#carregando{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#020303;

    z-index:999;

    color:#ffe36a;
    font-size:16px;
}

#carregando small{
    margin-top:12px;
    color:#777;
    font-size:11px;
}

.erroConta{
    color:#ff4141 !important;
}

@media(max-width:450px){

    h1{
        font-size:34px;
    }

    #jogo{
        height:370px;
    }

    .casa{
        margin:1px;
    }

    .casaNumero{
        font-size:13px;
    }

}

</style>

</head>

<script>

"use strict";

/*
========================================================
SUPABASE
MESMA CONFIGURAÇÃO USADA NA ROLETA
========================================================
*/

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/*
========================================================
ESTADO
========================================================
*/

let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1;

let numeroEscolhido = null;

let fichaSelecionada = false;

let jogando = false;


/*
Número 5 será o SUPER BÔNUS.
*/

const SUPER_BONUS_INDEX = 4;

const SUPER_BONUS_VALOR = 10;


/*
========================================================
ELEMENTOS
========================================================
*/

const carregando =
document.getElementById("carregando");

const textoCarregando =
document.getElementById("textoCarregando");

const saldoEl =
document.getElementById("saldo");

const saldoInfo =
document.getElementById("saldoInfo");

const statusConta =
document.getElementById("statusConta");

const botao =
document.getElementById("botao");

const fichaBotao =
document.getElementById("fichaBotao");

const ficha =
document.getElementById("ficha");

const jogo =
document.getElementById("jogo");

const bola =
document.getElementById("bola");

const casas =
document.getElementById("casas");

const premio =
document.getElementById("premio");

const instrucoes =
document.getElementById("instrucoes");

const apostaInfo =
document.getElementById("apostaInfo");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoTitulo =
document.getElementById("resultadoTitulo");

const resultadoNumero =
document.getElementById("resultadoNumero");

const resultadoPremio =
document.getElementById("resultadoPremio");

const superbonusOverlay =
document.getElementById("superbonusOverlay");

const superbonusValor =
document.getElementById("superbonusValor");


/*
========================================================
DINHEIRO
========================================================
*/

function dinheiro(valor){

    return "R$ " +
    Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}


/*
========================================================
ATUALIZAR SALDO NA TELA
========================================================
*/

function atualizarSaldo(){

    saldoEl.textContent =
    "💰 Saldo: " +
    dinheiro(saldoReal);

    saldoInfo.textContent =
    dinheiro(saldoReal);

    saldoEl.style.color =
    saldoReal < valorAposta
    ? "#ff4141"
    : "#00ff88";

    atualizarBotao();

}


/*
========================================================
BOTÃO
========================================================
*/

function atualizarBotao(){

    if(jogando){

        botao.disabled = true;

        botao.innerText =
        "🎯 BOLINHA DESCENDO...";

        return;

    }

    if(!usuarioAtual){

        botao.disabled = true;

        botao.innerText =
        "AGUARDANDO CONTA";

        return;

    }

    if(numeroEscolhido === null){

        botao.disabled = true;

        botao.innerText =
        "ESCOLHA UM NÚMERO";

        return;

    }

    if(saldoReal < valorAposta){

        botao.disabled = true;

        botao.innerText =
        "SALDO INSUFICIENTE";

        return;

    }

    botao.disabled = false;

    botao.innerText =
    "🎯 SOLTAR BOLA";

}


/*
========================================================
OBTER USUÁRIO
========================================================
*/

async function obterUsuario(){

    const resultado =
    await supabase.auth.getSession();

    if(resultado.error){

        throw resultado.error;

    }

    return resultado.data?.session?.user || null;

}


/*
========================================================
CARREGAR SALDO REAL
========================================================
*/

async function carregarSaldo(){

    if(!usuarioAtual){

        return false;

    }

    const {data,error} =
    await supabase
    .from("saldos")
    .select("valor")
    .eq("user_id",usuarioAtual.id)
    .maybeSingle();

    if(error){

        console.error(
            "Erro Supabase ao carregar saldo:",
            error
        );

        statusConta.innerText =
        "❌ Erro ao carregar saldo: " +
        error.message;

        statusConta.classList.add(
            "erroConta"
        );

        return false;

    }


    /*
    Se existir saldo, usa o valor real.
    */

    saldoReal =
    Number(data?.valor || 0);


    atualizarSaldo();


    statusConta.innerText =
    "✅ Conta conectada";


    return true;

}


/*
========================================================
SALVAR SALDO REAL
========================================================
*/

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual){

        return false;

    }

    const valorFinal =
    Number(
        Number(novoSaldo)
        .toFixed(2)
    );

async function debitarAposta(){

    if(!usuarioAtual){

        return false;

    }

    const saldoAntes =
    Number(saldoReal);


    if(saldoAntes < valorAposta){

        return false;

    }


    const novoSaldo =
    Number(
        (saldoAntes - valorAposta)
        .toFixed(2)
    );


    const {error} =
    await supabase
    .from("saldos")
    .update({
        valor:novoSaldo
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );


    if(error){

        console.error(
            "Erro ao debitar:",
            error
        );

        return false;

    }


    saldoReal =
    novoSaldo;

    atualizarSaldo();

    return true;

}


/*
========================================================
AUDIO
========================================================
*/

let audioContext = null;

let somLiberado = false;


function iniciarAudio(){

    try{

        if(!audioContext){

            const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

            if(!AudioCtx){

                return;

            }

            audioContext =
            new AudioCtx();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        somLiberado = true;

    }catch(error){

        console.log(
            "Áudio indisponível:",
            error
        );

    }

}


function somClique(){

    iniciarAudio();

    if(!audioContext)
        return;


    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "square";


    osc.frequency.setValueAtTime(
        520,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        260,
        agora + .06
    );


    ganho.gain.setValueAtTime(
        .45,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .07
    );


    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);

    osc.stop(
        agora + .08
    );

}


function somPino(){

    if(!somLiberado || !audioContext)
        return;


    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "triangle";


    osc.frequency.setValueAtTime(
        850 + Math.random()*180,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        430,
        agora + .045
    );


    ganho.gain.setValueAtTime(
        .32,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .06
    );


    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);

    osc.stop(
        agora + .07
    );

}


function somQueda(){

    if(!somLiberado || !audioContext)
        return;


    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "sine";


    osc.frequency.setValueAtTime(
        180,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        70,
        agora + .45
    );


    ganho.gain.setValueAtTime(
        .16,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .45
    );


    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);

    osc.stop(
        agora + .46
    );

}


function somPremio(){

    if(!somLiberado || !audioContext)
        return;


    const notas = [
        523.25,
        659.25,
        783.99,
        1046.50
    ];


    notas.forEach(
    function(freq,index){

        setTimeout(
        function(){

            const agora =
            audioContext.currentTime;

            const osc =
            audioContext.createOscillator();

            const ganho =
            audioContext.createGain();


            osc.type =
            "sine";


            osc.frequency.value =
            freq;


            ganho.gain.setValueAtTime(
                .42,
                agora
            );


            ganho.gain.exponentialRampToValueAtTime(
                .001,
                agora + .28
            );


            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );


            osc.start(agora);

            osc.stop(
                agora + .30
            );

        },
        index * 100
        );

    });

}

/*
========================================================
SOLTAR BOLA
========================================================
*/

window.soltar =
async function(){

    somClique();


    if(jogando)
        return;


    if(!usuarioAtual){

        instrucoes.innerText =
        "❌ Conta não carregada.";

        return;

    }


    if(numeroEscolhido === null){

        instrucoes.innerText =
        "🎯 Escolha primeiro o número.";

        return;

    }


    if(saldoReal < valorAposta){

        instrucoes.innerText =
        "⚠️ Saldo insuficiente.";

        atualizarBotao();

        return;

    }


    /*
    Desconta a aposta ANTES da bola cair.
    */

    const debitado =
    await debitarAposta();


    if(!debitado){

        instrucoes.innerText =
        "❌ Não foi possível descontar a aposta.";

        return;

    }


    jogando = true;

    atualizarBotao();


    const escolhaJogador =
    numeroEscolhido;


    /*
    Sorteia onde a bola vai cair.
    */

    const indiceResultado =
    Math.floor(
        Math.random() * 9
    );


    /*
    Limpa visual.
    */

    document
    .querySelectorAll(".casa")
    .forEach(
        function(c){

            c.classList.remove(
                "vencedora"
            );

        }
    );


    resultadoTela.classList.remove(
        "mostrar"
    );


    premio.innerText =
    "🎯 A bolinha está descendo...";


    instrucoes.innerText =
    "⚡ Não tire os olhos da bolinha!";


    /*
    Som.
    */

    somQueda();


    /*
    Posição inicial.
    */

    let x =
    jogo.clientWidth / 2 - 12;

    let y = 10;


    bola.style.left =
    x + "px";

    bola.style.top =
    y + "px";

    bola.classList.add(
        "caindo"
    );


    /*
    Destino.
    */

    let destinoX =
    (
        indiceResultado + .5
    ) *
    (
        jogo.clientWidth / 9
    ) - 12;


    destinoX =
    Math.max(
        10,
        Math.min(
            destinoX,
            jogo.clientWidth - 35
        )
    );


    const inicioX =
    x;

    const inicioY =
    y;


    const fimY =
    jogo.clientHeight - 75;


    const duracao =
    2600;


    const inicio =
    performance.now();


    let ultimoTic = 0;


    function animar(agora){

        const progresso =
        Math.min(
            (agora - inicio) /
            duracao,
            1
        );


        const suave =
        progresso *
        progresso *
        (3 - 2 * progresso);


        const ondas =
        Math.sin(
            progresso * Math.PI * 18
        ) *
        (1 - progresso) *
        20;


        x =
        inicioX +
        (
            destinoX -
            inicioX
        ) *
        suave +
        ondas;


        y =
        inicioY +
        (
            fimY -
            inicioY
        ) *
        suave;


        bola.style.left =
        x + "px";


        bola.style.top =
        y + "px";


        if(
            somLiberado &&
            agora - ultimoTic > 145
        ){

            somPino();

            ultimoTic =
            agora;

        }


        if(
            Math.random() > .55
        ){

            criarTrilha(
                x + 12,
                y + 12
            );

        }


        if(progresso < 1){

            requestAnimationFrame(
                animar
            );

        }else{

            finalizarBola(
                indiceResultado,
                escolhaJogador,
                valorAposta
            );

        }

    }


    requestAnimationFrame(
        animar
    );

};

/*
========================================================
FINALIZAR BOLA
========================================================
*/

async function finalizarBola(
    indiceResultado,
    escolhaJogador,
    aposta
){

    const lista =
    document.querySelectorAll(
        ".casa"
    );


    if(lista[indiceResultado]){

        lista[indiceResultado]
        .classList.add(
            "vencedora"
        );

    }


    /*
    O jogador só ganha se a bola
    cair exatamente no número escolhido.
    */

    const acertou =
    indiceResultado ===
    escolhaJogador;


    /*
    ================================================
    PERDEU
    ================================================
    */

    if(!acertou){

        resultadoTitulo.innerText =
        "💥 VOCÊ PERDEU";


        resultadoTitulo.style.color =
        "#ff4141";


        resultadoNumero.innerText =
        indiceResultado + 1;


        resultadoPremio.innerText =
        "Aposta perdida: " +
        dinheiro(aposta);


        premio.innerText =
        "💥 A bola caiu no nº " +
        (indiceResultado + 1);


        instrucoes.innerText =
        "Você escolheu o nº " +
        (escolhaJogador + 1) +
        ".";


        jogando = false;


        bola.classList.remove(
            "caindo"
        );


        atualizarBotao();


        setTimeout(
            function(){

                resultadoTela.classList.add(
                    "mostrar"
                );

            },
            350
        );


        return;

    }


    /*
    ================================================
    ACERTOU
    ================================================
    */


    let valorPremio = 0;


    /*
    Se acertar o número 5:
    SUPER BÔNUS R$ 10.
    */

    if(indiceResultado === SUPER_BONUS_INDEX){

        valorPremio =
        SUPER_BONUS_VALOR;

    }else{

        /*
        Acertou número normal:
        paga 2x a aposta.
        */

        valorPremio =
        Number(
            (aposta * 2)
            .toFixed(2)
        );

    }


    /*
    Credita o prêmio no saldo real.
    */

    const saldoAntes =
    Number(saldoReal);


    const saldoDepois =
    Number(
        (
            saldoAntes +
            valorPremio
        ).toFixed(2)
    );


    const creditado =
    await salvarSaldo(
        saldoDepois
    );


    if(!creditado){

        /*
        A aposta já foi debitada.
        Não inventamos crédito local.
        */

        resultadoTitulo.innerText =
        "❌ ERRO AO CREDITAR";


        resultadoTitulo.style.color =
        "#ff4141";


        resultadoNumero.innerText =
        indiceResultado + 1;


        resultadoPremio.innerText =
        "Prêmio pendente de processamento";


        premio.innerText =
        "❌ Não foi possível atualizar o saldo.";


        jogando = false;


        bola.classList.remove(
            "caindo"
        );


        atualizarBotao();


        resultadoTela.classList.add(
            "mostrar"
        );


        return;

    }


    /*
    ================================================
    SUPER BÔNUS
    ================================================
    */

    if(indiceResultado === SUPER_BONUS_INDEX){

        resultadoTitulo.innerText =
        "⚡ SUPER BÔNUS!";


        resultadoTitulo.style.color =
        "#ff66ff";


        resultadoNumero.innerText =
        indiceResultado + 1;


        resultadoPremio.innerText =
        "⚡ R$ 10,00";


        premio.innerText =
        "⚡ SUPER BÔNUS DE R$ 10,00!";


        instrucoes.innerText =
        "🎉 Você acertou o SUPER BÔNUS!";


        somGrandePremio();


        mostrarSuperBonus();

    }else{

        resultadoTitulo.innerText =
        "🎉 VOCÊ GANHOU!";


        resultadoTitulo.style.color =
        "#00ff88";


        resultadoNumero.innerText =
        indiceResultado + 1;


        resultadoPremio.innerText =
        "Prêmio: " +
        dinheiro(valorPremio);


        premio.innerText =
        "🎉 ACERTOU! +" +
        dinheiro(valorPremio);


        instrucoes.innerText =
        "⚡ A bola caiu exatamente no seu número!";


        somPremio();

    }


    jogando = false;


    bola.classList.remove(
        "caindo"
    );


    atualizarBotao();


    setTimeout(
        function(){

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        450
    );

}

            error
        );


        statusConta.innerText =
        "❌ " + error.message;


        statusConta.classList.add(
            "erroConta"
        );


        carregando.innerHTML =
        `
        <div style="text-align:center;padding:25px">

            ❌ <strong>ERRO AO CARREGAR CONTA</strong>

            <br><br>

            <small style="color:#aaa">
            ${String(error.message)
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")}
            </small>

            <br><br>

            <button
            onclick="location.reload()"
            style="
            padding:12px 20px;
            border:0;
            border-radius:10px;
            background:#ffd700;
            font-weight:bold;
            "
            >
            TENTAR NOVAMENTE
            </button>

            <br><br>

            <button
            onclick="window.location.href='../index.html'"
            style="
            padding:10px 18px;
            border:1px solid #555;
            border-radius:10px;
            background:#111;
            color:white;
            font-weight:bold;
            "
            >
            VOLTAR
            </button>

        </div>
        `;

    }

}


/*
========================================================
INICIAR
========================================================
*/

iniciar();

</script>
