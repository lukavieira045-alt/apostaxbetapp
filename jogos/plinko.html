<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plinko ApostaXBet</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;

    background:
    radial-gradient(circle at 15% 15%,#0066ff,transparent 28%),
    radial-gradient(circle at 85% 25%,#e600ff,transparent 28%),
    radial-gradient(circle at 50% 100%,#ff0066,transparent 30%),
    linear-gradient(135deg,#02030b,#090018,#001526);

    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 100%;}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4);}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4);}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;

    box-shadow:
    0 0 8px #00ffff,
    0 0 18px #ff00aa;

    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:7s}
.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}
.particulas span:nth-child(4){left:35%;animation-duration:12s}
.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{opacity:1;}

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

h1{
    margin-top:25px;
    color:#ffd700;
    font-size:40px;

    text-shadow:
    0 0 8px #fff,
    0 0 18px #ffd700,
    0 0 35px #ff8800;
}

#saldo{
    display:inline-block;
    color:#00ff88;
    font-size:22px;
    margin:10px 15px 20px;
    padding:10px 22px;
    border:1px solid #00ff88;
    border-radius:30px;
    background:rgba(0,0,0,.6);

    box-shadow:
    0 0 15px rgba(0,255,136,.25);
}

.caixa{
    width:95%;
    max-width:430px;
    margin:auto;
    padding:20px;

    background:
    linear-gradient(
        145deg,
        rgba(20,25,40,.96),
        rgba(3,5,15,.97)
    );

    border:2px solid #ffd700;
    border-radius:25px;

    box-shadow:
    0 0 25px rgba(255,215,0,.25),
    0 20px 70px rgba(0,0,0,.7);

    backdrop-filter:blur(10px);
}

#jogo{
    height:370px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:1px solid rgba(255,215,0,.35);

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(0,150,255,.20),
        transparent 45%
    ),

    linear-gradient(
        180deg,
        #030712,
        #02020a
    );

    box-shadow:
    inset 0 0 40px rgba(0,0,0,.9);
}

.grade{
    position:absolute;
    inset:0;
    opacity:.12;

    background-image:
    linear-gradient(
        rgba(0,255,255,.4) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,255,255,.4) 1px,
        transparent 1px
    );

    background-size:35px 35px;
}

.pino{
    position:absolute;
    width:11px;
    height:11px;

    background:
    radial-gradient(
        circle at 35% 30%,
        white,
        #ffd700 35%,
        #ff9800
    );

    border-radius:50%;

    box-shadow:
    0 0 6px #ffd700,
    0 0 14px rgba(255,215,0,.7);

    z-index:2;
}

#bola{
    position:absolute;
    top:10px;
    left:50%;
    width:24px;
    height:24px;
    margin-left:-12px;
    border-radius:50%;

    background:
    radial-gradient(
        circle at 30% 25%,
        white,
        #00ff88 30%,
        #00aaff 75%
    );

    box-shadow:
    0 0 10px #00ff88,
    0 0 25px #00ffff;

    z-index:10;
    opacity:0;
}

#bola.caindo{
    opacity:1;
}

.trilha{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#00ffff;

    box-shadow:
    0 0 8px #00ffff;

    pointer-events:none;
}

#casas{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:55px;
    display:flex;
    align-items:stretch;
    justify-content:center;
    z-index:4;
}

.casa{
    flex:1;
    max-width:58px;
    margin:2px;
    border-radius:10px 10px 4px 4px;
    border:1px solid rgba(255,255,255,.15);

    background:
    linear-gradient(
        180deg,
        #151525,
        #080811
    );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:.25s;
}

.casaNumero{
    font-size:15px;
    font-weight:bold;
    color:#ffd700;
}

.casaMult{
    font-size:11px;
    color:#aaa;
}

.casa.vencedora{
    background:
    linear-gradient(
        180deg,
        #ffe66b,
        #ff9800
    );

    color:#160e00;

    transform:
    translateY(-8px)
    scale(1.08);

    border-color:white;

    box-shadow:
    0 0 10px #ffd700,
    0 0 30px #ff9800,
    0 0 50px rgba(255,215,0,.7);

    animation:ganhadora .5s infinite alternate;
}

@keyframes ganhadora{
    from{filter:brightness(1);}
    to{filter:brightness(1.4);}
}

.casa.vencedora .casaNumero{
    color:#160e00;
}

#premio{
    margin-top:15px;
    min-height:35px;
    color:#ffd700;
    font-size:25px;
    font-weight:bold;

    text-shadow:
    0 0 12px #ffd700;
}

#resultadoTela{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:.25s;
}

#resultadoTela.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultadoCard{
    width:85%;
    max-width:340px;
    padding:30px 20px;
    border-radius:25px;
    border:2px solid #ffd700;

    background:
    linear-gradient(
        145deg,
        #11172a,
        #080912
    );

    box-shadow:
    0 0 25px #ffd700,
    0 0 80px rgba(0,150,255,.5);

    transform:scale(.5);
    animation:none;
}

#resultadoTela.mostrar .resultadoCard{
    animation:entrarResultado .45s forwards;
}

@keyframes entrarResultado{
    0%{
        transform:scale(.5) rotate(-8deg);
    }

    70%{
        transform:scale(1.08) rotate(2deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }
}

.resultadoTitulo{
    font-size:22px;
    color:#00ff88;
}

.resultadoNumero{
    margin:10px 0;
    font-size:70px;
    font-weight:900;
    color:#ffd700;

    text-shadow:
    0 0 10px #ffd700,
    0 0 35px #ff8800;
}

.resultadoPremio{
    font-size:24px;
    color:white;
}

#fecharResultado{
    margin-top:20px;
    padding:13px 30px;
    border:0;
    border-radius:12px;
    background:#ffd700;
    font-weight:bold;
    font-size:17px;
}

input{
    width:120px;
    padding:12px;
    margin:15px;
    border-radius:10px;
    border:2px solid #444;
    background:#050505;
    color:white;
    font-size:18px;
    text-align:center;
}

button{
    padding:15px 30px;

    background:
    linear-gradient(
        180deg,
        #ffe66b,
        #ffb000
    );

    border:0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

    box-shadow:
    0 0 15px rgba(255,215,0,.4);
}

button:active{
    transform:scale(.95);
}

button:disabled{
    opacity:.5;
}

@media(max-width:450px){

    h1{
        font-size:34px;
    }

    #jogo{
        height:370px;
    }

    .casa{
        margin:1px;
    }

    .casaNumero{
        font-size:13px;
    }

}

</style>

</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">

<h1>
🎯 Plinko
</h1>

<div id="saldo"></div>

<div class="caixa">

<div id="jogo">

<div class="grade"></div>

<div id="bola"></div>

<div id="casas"></div>

</div>

<div id="premio">
Prêmio: R$ 0
</div>

<input
id="aposta"
type="number"
value="1"
min="0.10"
step="0.10"
>

<br>

<button
id="botao"
onclick="soltar()"
>

🎯 SOLTAR BOLA

</button>

</div>

<div id="resultadoTela">

<div class="resultadoCard">

<div class="resultadoTitulo">
🎉 RESULTADO
</div>

<div
class="resultadoNumero"
id="resultadoNumero"
>
0
</div>

<div
class="resultadoPremio"
id="resultadoPremio"
>
R$ 0,00
</div>

<button
id="fecharResultado"
onclick="fecharResultado()"
>
CONTINUAR
</button>

</div>

</div>

<script>

/*
========================================
SISTEMA DE SOM — VOLUME 100%
========================================
*/

let audioContext = null;

let somLiberado = false;


/*
Cria o áudio somente depois do
primeiro toque do usuário.
*/

function iniciarAudio(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

    somLiberado = true;

}


/*
Som curto de clique.
*/

function somClique(){

    iniciarAudio();

    if(!audioContext)
        return;

    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    osc.type =
    "square";

    osc.frequency.setValueAtTime(
        520,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        260,
        agora + 0.06
    );

    ganho.gain.setValueAtTime(
        0.45,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.07
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(
        agora + 0.08
    );

}


/*
Som dos pinos:
tic metálico curto.
*/

function somPino(){

    if(!somLiberado)
        return;

    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    osc.type =
    "triangle";

    osc.frequency.setValueAtTime(
        850 + Math.random()*180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        430,
        agora + 0.045
    );

    ganho.gain.setValueAtTime(
        0.32,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.06
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(
        agora + 0.07
    );

}


/*
Som da bola caindo.
*/

function somQueda(){

    if(!somLiberado)
        return;

    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    osc.type =
    "sine";

    osc.frequency.setValueAtTime(
        180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        70,
        agora + 0.45
    );

    ganho.gain.setValueAtTime(
        0.16,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        agora + 0.45
    );

    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);
    osc.stop(
        agora + 0.46
    );

}


/*
Som de prêmio.
*/

function somPremio(){

    if(!somLiberado)
        return;

    const notas = [
        523.25,
        659.25,
        783.99,
        1046.50
    ];

    notas.forEach(
    function(freq,index){

        setTimeout(
        function(){

            const agora =
            audioContext.currentTime;

            const osc =
            audioContext.createOscillator();

            const ganho =
            audioContext.createGain();

            osc.type =
            "sine";

            osc.frequency.setValueAtTime(
                freq,
                agora
            );

            ganho.gain.setValueAtTime(
                0.42,
                agora
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                agora + 0.28
            );

            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            osc.start(agora);

            osc.stop(
                agora + 0.30
            );

        },
        index * 100
        );

    });

}


/*
Som de prêmio maior.
*/

function somGrandePremio(){

    if(!somLiberado)
        return;

    const notas = [
        523.25,
        659.25,
        783.99,
        1046.50,
        1318.51
    ];

    notas.forEach(
    function(freq,index){

        setTimeout(
        function(){

            const agora =
            audioContext.currentTime;

            const osc =
            audioContext.createOscillator();

            const ganho =
            audioContext.createGain();

            osc.type =
            "triangle";

            osc.frequency.setValueAtTime(
                freq,
                agora
            );

            ganho.gain.setValueAtTime(
                0.5,
                agora
            );

            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                agora + 0.42
            );

            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );

            osc.start(agora);

            osc.stop(
                agora + 0.45
            );

        },
        index * 110
        );

    });

}


/*
========================================
SALDO
========================================
*/

let saldo =
Number(
localStorage.getItem("saldo") || 1000
);

function atualizar(){

    document.getElementById("saldo").textContent =
    "💰 Saldo: R$ " +
    saldo.toFixed(2);

    localStorage.setItem(
        "saldo",
        saldo
    );

}

atualizar();


/*
========================================
ELEMENTOS
========================================
*/

const jogo =
document.getElementById("jogo");

const bola =
document.getElementById("bola");

const casas =
document.getElementById("casas");

const premio =
document.getElementById("premio");

const botao =
document.getElementById("botao");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoNumero =
document.getElementById("resultadoNumero");

const resultadoPremio =
document.getElementById("resultadoPremio");


/*
========================================
CRIAR PINOS
========================================
*/

for(
    let linha=0;
    linha<7;
    linha++
){

    for(
        let coluna=0;
        coluna<linha+3;
        coluna++
    ){

        let p =
        document.createElement("div");

        p.className =
        "pino";

        p.style.top =
        (35 + linha * 35) +
        "px";

        p.style.left =
        (90 +
        coluna * 35 -
        (linha * 17)) +
        "px";

        jogo.appendChild(p);

    }

}


/*
========================================
CASAS
========================================
*/

const multiplicadores = [
    "0.5x",
    "1x",
    "1.5x",
    "2x",
    "3x",
    "2x",
    "1.5x",
    "1x",
    "0.5x"
];

for(
    let i=0;
    i<multiplicadores.length;
    i++
){

    const casa =
    document.createElement("div");

    casa.className =
    "casa";

    casa.innerHTML =

    "<div class='casaNumero'>" +
    (i+1) +
    "</div>" +

    "<div class='casaMult'>" +
    multiplicadores[i] +
    "</div>";

    casa.dataset.index =
    i;

    casas.appendChild(casa);

}


/*
========================================
ESTADO
========================================
*/

let jogando = false;


/*
========================================
SOLTAR
========================================
*/

function soltar(){

    /*
    SOM DO BOTÃO
    */

    somClique();


    if(jogando){
        return;
    }


    const aposta =
    Number(
        document.getElementById("aposta").value
    );


    if(
        !Number.isFinite(aposta) ||
        aposta <= 0 ||
        aposta > saldo
    ){

        alert(
            "Saldo ou aposta inválida."
        );

        return;

    }


    /*
    DESCONTA
    */

    saldo -= aposta;

    atualizar();

    jogando = true;

    botao.disabled = true;


    /*
    LIMPA CASAS
    */

    document
    .querySelectorAll(".casa")
    .forEach(function(c){

        c.classList.remove(
            "vencedora"
        );

    });


    resultadoTela.classList.remove(
        "mostrar"
    );


    premio.textContent =
    "🎯 A bolinha está descendo...";


    /*
    SOM DA QUEDA
    */

    somQueda();


    /*
    POSIÇÃO INICIAL
    */

    let x =
    jogo.clientWidth / 2 - 12;

    let y = 10;


    bola.style.left =
    x + "px";

    bola.style.top =
    y + "px";

    bola.classList.add(
        "caindo"
    );


    /*
    ESCOLHE A CASA
    */

    const indice =
    Math.floor(
        Math.random() *
        multiplicadores.length
    );


    let destinoX =
    (indice + 0.5) *
    (jogo.clientWidth /
    multiplicadores.length) - 12;


    if(destinoX < 10){
        destinoX = 10;
    }

    if(
        destinoX >
        jogo.clientWidth - 35
    ){

        destinoX =
        jogo.clientWidth - 35;

    }


    /*
    ANIMAÇÃO
    */

    const inicioX = x;

    const inicioY = y;

    const fimY =
    jogo.clientHeight - 75;

    const duracao = 2300;

    const inicio =
    performance.now();

    /*
    Controle do som dos pinos.
    */

    let ultimoTic = 0;

    function animar(agora){

        const progresso =
        Math.min(
            (agora - inicio) /
            duracao,
            1
        );


        const suave =
        progresso *
        progresso *
        (3 - 2 * progresso);


        const ondas =
        Math.sin(
            progresso * Math.PI * 14
        ) *
        (1 - progresso) *
        18;


        x =
        inicioX +
        (destinoX - inicioX) *
        suave +
        ondas;


        y =
        inicioY +
        (fimY - inicioY) *
        suave;


        bola.style.left =
        x + "px";

        bola.style.top =
        y + "px";


        /*
        TICS DOS PINOS
        */

        if(
            somLiberado &&
            agora - ultimoTic > 150
        ){

            somPino();

            ultimoTic = agora;

        }


        /*
        TRILHA
        */

        if(
            Math.random() > .55
        ){

            criarTrilha(
                x + 12,
                y + 12
            );

        }


        if(progresso < 1){

            requestAnimationFrame(
                animar
            );

        }
        else{

            finalizarBola(
                indice,
                aposta
            );

        }

    }


    requestAnimationFrame(
        animar
    );

}


/*
========================================
TRILHA
========================================
*/

function criarTrilha(x,y){

    const ponto =
    document.createElement("div");

    ponto.className =
    "trilha";

    ponto.style.left =
    x + "px";

    ponto.style.top =
    y + "px";

    jogo.appendChild(
        ponto
    );

    setTimeout(function(){

        ponto.remove();

    },400);

}


/*
========================================
FINALIZA
========================================
*/

function finalizarBola(
    indice,
    aposta
){

    const lista =
    document.querySelectorAll(
        ".casa"
    );


    if(lista[indice]){

        lista[indice]
        .classList.add(
            "vencedora"
        );

    }


    const multiplicador =
    Number(
        multiplicadores[indice]
        .replace("x","")
    );


    const valorPremio =
    aposta *
    multiplicador;


    saldo +=
    valorPremio;

    atualizar();


    premio.textContent =

    "🎉 Casa " +
    (indice + 1) +
    " — " +
    multiplicadores[indice] +
    " = R$ " +
    valorPremio.toFixed(2);


    /*
    SOM DO RESULTADO
    */

    if(multiplicador >= 2){

        somGrandePremio();

    }
    else{

        somPremio();

    }


    /*
    TELA DE RESULTADO
    */

    setTimeout(function(){

        resultadoNumero.textContent =
        indice + 1;

        resultadoPremio.textContent =

        multiplicadores[indice] +
        "  •  R$ " +
        valorPremio.toFixed(2);

        resultadoTela.classList.add(
            "mostrar"
        );

    },350);


    jogando = false;

    botao.disabled = false;


    setTimeout(function(){

        bola.classList.remove(
            "caindo"
        );

    },300);

}


/*
========================================
FECHAR RESULTADO
========================================
*/

function fecharResultado(){

    somClique();

    resultadoTela.classList.remove(
        "mostrar"
    );

}

</script>
