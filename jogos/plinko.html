.luz{

.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}

.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}

<script>
"use strict";

/*
====================================================
SUPABASE
====================================================
*/

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/*
====================================================
ELEMENTOS
====================================================
*/

const carregando =
document.getElementById("carregando");

const textoCarregando =
document.getElementById("textoCarregando");

const saldoEl =
document.getElementById("saldo");

const jogo =
document.getElementById("jogo");

const bola =
document.getElementById("bola");

const casas =
document.getElementById("casas");

const ficha =
document.getElementById("ficha");

const mensagem =
document.getElementById("mensagem");

const premio =
document.getElementById("premio");

const botao =
document.getElementById("botao");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoNumero =
document.getElementById("resultadoNumero");

const resultadoPremio =
document.getElementById("resultadoPremio");

const fecharResultado =
document.getElementById("fecharResultado");

/*
====================================================
ESTADO
====================================================
*/

let usuarioAtual = null;

let saldoReal = 0;

let fichaSelecionada = false;

let numeroEscolhido = null;

let jogando = false;

/*
Valor visual da ficha.
Não altera o saldo da conta.
*/

const valorFicha = 1.00;

/*
====================================================
PRÊMIOS VISUAIS
====================================================
*/

const premios = [
    0.5,
    1,
    1.5,
    2,
    10,
    2,
    1.5,
    1,
    0.5
];

/*
====================================================
DINHEIRO
====================================================
*/

function dinheiro(valor){

    return "R$ " +
    Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}

/*
====================================================
MOSTRAR SALDO REAL
====================================================
*/

function atualizarSaldo(){

    saldoEl.innerText =
    dinheiro(saldoReal);

}

/*
====================================================
OBTER SESSÃO
====================================================
*/

async function obterUsuario(){

    try{

        const resposta =
        await supabaseClient.auth.getSession();

        if(resposta.error){

            console.error(
                "Erro sessão:",
                resposta.error
            );

            return null;
        }

        return resposta.data?.session?.user || null;

    }catch(error){

        console.error(
            "Erro obter sessão:",
            error
        );

        return null;
    }

}

/*
====================================================
CARREGAR SALDO REAL
====================================================
*/

async function carregarSaldo(){

    if(!usuarioAtual){

        return false;
    }

    try{

        const resposta =
        await supabaseClient
        .from("saldos")
        .select("valor")
        .eq(
            "user_id",
            usuarioAtual.id
        )
        .maybeSingle();

        if(resposta.error){

            console.error(
                "Erro ao buscar saldo:",
                resposta.error
            );

            mensagem.innerText =
            "❌ ERRO AO CARREGAR SALDO";

            mensagem.classList.add("erro");

            return false;
        }

        saldoReal =
        Number(
            resposta.data?.valor || 0
        );

        atualizarSaldo();

        return true;

    }catch(error){

        console.error(
            "Erro saldo:",
            error
        );

        mensagem.innerText =
        "❌ ERRO AO CONECTAR AO SALDO";

        mensagem.classList.add("erro");

        return false;
    }

}

/*
====================================================
CRIAR PINOS
====================================================
*/

function criarPinos(){

    document
    .querySelectorAll(".pino")
    .forEach(
        p => p.remove()
    );

    const largura =
    jogo.clientWidth;

    const centro =
    largura / 2;

    for(
        let linha = 0;
        linha < 7;
        linha++
    ){

        const quantidade =
        linha + 3;

        const espacamento = 35;

        const larguraLinha =
        (quantidade - 1) *
        espacamento;

        const inicio =
        centro -
        larguraLinha / 2;

        for(
            let coluna = 0;
            coluna < quantidade;
            coluna++
        ){

            const p =
            document.createElement("div");

            p.className =
            "pino";

            p.style.top =
            (38 + linha * 38) +
            "px";

            p.style.left =
            (inicio +
            coluna * espacamento -
            5.5) +
            "px";

            jogo.appendChild(p);
        }
    }

}

/*
====================================================
CRIAR CASAS
====================================================
*/

function criarCasas(){

    casas.innerHTML = "";

    premios.forEach(
        function(valor,index){

            const casa =
            document.createElement("div");

            casa.className =
            "casa";

            casa.dataset.index =
            index;

            casa.innerHTML =
            "<div class='casaNumero'>" +
            (index + 1) +
            "</div>" +
            "<div class='casaMult'>" +
            (valor === 10
                ? "⚡ SUPER"
                : valor + "x") +
            "</div>";

            casa.addEventListener(
                "click",
                function(){

                    escolherCasa(index);

                }
            );

            casas.appendChild(casa);

        }
    );

}

/*
====================================================
ESCOLHER FICHA
====================================================
*/

ficha.addEventListener(
    "click",
    function(){

        if(jogando)return;

        fichaSelecionada = true;

        numeroEscolhido = null;

        document
        .querySelectorAll(".casa")
        .forEach(
            c => c.classList.remove("escolhida")
        );

        ficha.classList.add(
            "selecionada"
        );

        mensagem.innerHTML =
        "🎯 Agora toque no número que deseja escolher";

        mensagem.classList.remove(
            "erro"
        );

        botao.disabled = true;

        botao.innerText =
        "🎯 ESCOLHA UMA CASA";

    }
);

/*
====================================================
ESCOLHER CASA
====================================================
*/

function escolherCasa(index){

    if(jogando)return;

    if(!fichaSelecionada){

        mensagem.innerHTML =
        "🎯 Primeiro toque na ficha";

        return;
    }

    numeroEscolhido = index;

    fichaSelecionada = false;

    ficha.classList.remove(
        "selecionada"
    );

    document
    .querySelectorAll(".casa")
    .forEach(
        c => c.classList.remove("escolhida")
    );

    const casa =
    document.querySelector(
        `.casa[data-index="${index}"]`
    );

    if(casa){

        casa.classList.add(
            "escolhida"
        );
    }

    mensagem.innerHTML =
    "🎯 NÚMERO ESCOLHIDO: " +
    (index + 1);

    botao.disabled = false;

    botao.innerText =
    "🎯 SOLTAR BOLA";

}

/*
====================================================
ÁUDIO
====================================================
*/

let audioContext = null;

function iniciarAudio(){

    if(!audioContext){

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AudioContext)return;

        audioContext =
        new AudioContext();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }
}

function tocarSom(
    frequencia,
    duracao = .08
){

    iniciarAudio();

    if(!audioContext)return;

    const agora =
    audioContext.currentTime;

    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();

    osc.type =
    "triangle";

    osc.frequency.setValueAtTime(
        frequencia,
        agora
    );

    ganho.gain.setValueAtTime(
        .25,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + duracao
    );

    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );

    osc.start(agora);

    osc.stop(
        agora + duracao
    );
}

function somPremio(){

    iniciarAudio();

    [523,659,784,1047].forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    tocarSom(
                        freq,
                        .3
                    );
                },
                i * 100
            );
        }
    );
}

function somSuperBonus(){

    iniciarAudio();

    [523,659,784,1047,1319].forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    tocarSom(
                        freq,
                        .45
                    );
                },
                i * 110
            );
        }
    );
}

/*
====================================================
TRILHA
====================================================
*/

function criarTrilha(x,y){

    const ponto =
    document.createElement("div");

    ponto.className =
    "trilha";

    ponto.style.left =
    x + "px";

    ponto.style.top =
    y + "px";

    jogo.appendChild(
        ponto
    );

    setTimeout(
        ()=>{
            ponto.remove();
        },
        350
    );
}

/*
====================================================
SOLTAR BOLA
====================================================
*/

function soltar(){

    if(jogando)return;

    if(numeroEscolhido === null){

        mensagem.innerText =
        "🎯 Escolha primeiro um número";

        return;
    }

    /*
    Nesta versão o saldo real é apenas
    consultado/exibido. Nenhum valor é
    debitado ou creditado.
    */

    iniciarAudio();

    tocarSom(520);

    jogando = true;

    botao.disabled = true;

    document
    .querySelectorAll(".casa")
    .forEach(
        c => c.classList.remove(
            "vencedora"
        )
    );

    resultadoTela.classList.remove(
        "mostrar"
    );

    premio.innerText =
    "🎯 A bolinha está descendo...";

    mensagem.innerText =
    "⚡ PLINKO EM ANDAMENTO...";

    bola.classList.add(
        "caindo"
    );

    let x =
    jogo.clientWidth / 2;

    let y = 15;

    bola.style.left =
    x + "px";

    bola.style.top =
    y + "px";

    /*
    Resultado visual da bolinha.
    */

    const indiceResultado =
    Math.floor(
        Math.random() *
        premios.length
    );

    const larguraCasa =
    jogo.clientWidth /
    premios.length;

    const destinoX =
    (indiceResultado + .5) *
    larguraCasa;

    const inicioX = x;

    const inicioY = y;

    const fimY =
    jogo.clientHeight - 82;

    const duracao = 2600;

    const inicio =
    performance.now();

    let ultimoSom = 0;

    function animar(agora){

        const progresso =
        Math.min(
            (agora - inicio) /
            duracao,
            1
        );

        const suave =
        progresso *
        progresso *
        (3 - 2 * progresso);

        const ondas =
        Math.sin(
            progresso *
            Math.PI *
            15
        ) *
        (1 - progresso) *
        22;

        x =
        inicioX +
        (destinoX - inicioX) *
        suave +
        ondas;

        y =
        inicioY +
        (fimY - inicioY) *
        suave;

        bola.style.left =
        x + "px";

        bola.style.top =
        y + "px";

        if(
            agora - ultimoSom > 180
        ){

            tocarSom(
                700 + Math.random()*250,
                .05
            );

            ultimoSom = agora;
        }

        if(
            Math.random() > .55
        ){

            criarTrilha(
                x,
                y
            );
        }

        if(progresso < 1){

            requestAnimationFrame(
                animar
            );

        }else{

            finalizarBola(
                indiceResultado
            );
        }
    }

    requestAnimationFrame(
        animar
    );
}

/*
====================================================
FINALIZAR
====================================================
*/

function finalizarBola(
    indiceResultado
){

    const lista =
    document.querySelectorAll(
        ".casa"
    );

    const casaResultado =
    lista[indiceResultado];

    if(casaResultado){

        casaResultado.classList.add(
            "vencedora"
        );
    }

    const valor =
    premios[indiceResultado];

    const acertou =
    indiceResultado ===
    numeroEscolhido;

    if(valor === 10){

        somSuperBonus();

        premio.innerHTML =
        "⚡ SUPER BÔNUS — R$ 10,00";

    }else{

        somPremio();

        premio.innerHTML =
        "🎯 CASA " +
        (indiceResultado + 1) +
        " — " +
        valor +
        "x";

    }

    if(acertou){

        mensagem.innerHTML =
        "🎉 VOCÊ ACERTOU O NÚMERO!";

        mensagem.style.color =
        "#00ff88";

    }else{

        mensagem.innerHTML =
        "💥 A BOLINHA CAIU EM OUTRO NÚMERO";

        mensagem.style.color =
        "#ff7777";
    }

    setTimeout(
        function(){

            resultadoNumero.innerText =
            indiceResultado + 1;

            if(valor === 10){

                resultadoPremio.innerText =
                "⚡ SUPER BÔNUS — R$ 10,00";

            }else{

                resultadoPremio.innerText =
                valor + "x";

            }

            resultadoTela.classList.add(
                "mostrar"
            );

        },
        350
    );

    jogando = false;

    botao.disabled = false;

    botao.innerText =
    "🎯 JOGAR NOVAMENTE";

    setTimeout(
        function(){

            bola.classList.remove(
                "caindo"
            );

        },
        400
    );
}

/*
====================================================
FECHAR RESULTADO
====================================================
*/

fecharResultado.addEventListener(

        tocarSom(520);

        resultadoTela.classList.remove(

        );

        numeroEscolhido = null;

        .forEach(

            )
        );

        mensagem.innerHTML =
        "🎯 Toque na ficha e escolha uma casa";

        mensagem.style.color =
        "#ffe36a";

        premio.innerText =
        "Prêmio: R$ 0,00";

        botao.disabled = true;

        botao.innerText =
        "🎯 ESCOLHA UMA CASA";
    }
);

/*
====================================================
AUTENTICAÇÃO
====================================================
*/

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(
            !session &&
            event !== "INITIAL_SESSION"
        ){

            window.location.href =
            "../index.html";
        }
    }
);

/*
====================================================
INICIAR JOGO
====================================================
*/

async function iniciar(){

    textoCarregando.innerText =
    "🔐 VERIFICANDO CONTA...";

    try{

        usuarioAtual =
        await obterUsuario();

        if(!usuarioAtual){

            textoCarregando.innerText =
            "⚠️ REDIRECIONANDO PARA LOGIN...";

            setTimeout(
                ()=>{
                    window.location.href =
                    "../index.html";
                },
                800
            );

            return;
        }

        textoCarregando.innerText =
        "💰 CARREGANDO SALDO...";

        const saldoCarregado =
        await carregarSaldo();

        if(!saldoCarregado){

            textoCarregando.innerText =
            "❌ NÃO FOI POSSÍVEL CARREGAR O SALDO";

            setTimeout(
                ()=>{
                    carregando.style.display =
                    "none";
                },
                1200
            );

            return;
        }

        criarPinos();

        criarCasas();

        atualizarSaldo();

        carregando.style.display =
        "none";

    }catch(error){

        console.error(
            "Erro inicial:",
            error
        );

        textoCarregando.innerText =
        "❌ ERRO AO INICIAR PLINKO";

        setTimeout(
            ()=>{
                carregando.style.display =
                "none";

                mensagem.innerText =
                "❌ Erro ao iniciar o jogo";

                mensagem.classList.add(
                    "erro"
                );
            },
            1200
        );
    }
}

/*
Recria os pinos se a tela mudar
de tamanho.
*/

window.addEventListener(
    "resize",
    function(){

        if(
            usuarioAtual &&
            !jogando
        ){

            criarPinos();
        }
    }
);

iniciar();

</script>
