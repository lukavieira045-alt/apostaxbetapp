<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;

    background:
    radial-gradient(circle at 15% 15%,#0066ff,transparent 28%),
    radial-gradient(circle at 85% 25%,#e600ff,transparent 28%),
    radial-gradient(circle at 50% 100%,#ff0066,transparent 30%),
    linear-gradient(135deg,#02030b,#090018,#001526);

    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4)}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;

    box-shadow:
    0 0 8px #00ffff,
    0 0 18px #ff00aa;

    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:7s}
.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}
.particulas span:nth-child(4){left:35%;animation-duration:12s}
.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{opacity:1}

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

    align-items:center;

}

.logo{

    font-weight:900;
    letter-spacing:1px;
    font-size:15px;
}

.saldo-box{

}

.saldo-label{

}

#saldo{

    font-weight:bold;
}

.container{

h1{

.caixa{

#jogo{

.casaMult{

.superbonus-overlay.ativo{

.super-raio{

@keyframes superTela{
    0%{opacity:0}

@keyframes raio{

#carregando{

    }

</style>

<script>

"use strict";

/*
====================================================
SUPABASE
MESMA CONTA/SALDO USADA NA ROLETA
====================================================
*/

const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/*
====================================================
ESTADO
====================================================
*/

let usuarioAtual = null;

let saldoReal = 0;

let valorAposta = 1;

let casaEscolhida = null;

let fichaSelecionada = false;

let jogando = false;

let audioContext = null;

let somLiberado = false;


/*
====================================================
ELEMENTOS
====================================================
*/

const jogo =
document.getElementById("jogo");

const bola =
document.getElementById("bola");

const casas =
document.getElementById("casas");

const premio =
document.getElementById("premio");

const botao =
document.getElementById("botao");

const saldoEl =
document.getElementById("saldo");

const saldoInfo =
document.getElementById("saldoInfo");

const fichaDisplay =
document.getElementById("fichaDisplay");

const apostaInfo =
document.getElementById("apostaInfo");

const instrucao =
document.getElementById("instrucao");

const resultadoTela =
document.getElementById("resultadoTela");

const resultadoNumero =
document.getElementById("resultadoNumero");

const resultadoPremio =
document.getElementById("resultadoPremio");

const resultadoTitulo =
document.getElementById("resultadoTitulo");

const resultadoDetalhe =
document.getElementById("resultadoDetalhe");

const superBonusOverlay =
document.getElementById("superBonusOverlay");

const carregando =
document.getElementById("carregando");


/*
====================================================
MULTIPLICADORES
====================================================
*/

const multiplicadores = [

    "0.5x",
    "1x",
    "1.5x",
    "2x",

    "SUPER",

    "2x",
    "1.5x",
    "1x",
    "0.5x"

];


/*
====================================================
DINHEIRO
====================================================
*/

function dinheiro(valor){

    return "R$ " +
    Number(valor || 0)
    .toFixed(2)
    .replace(".",",");

}


/*
====================================================
ATUALIZAR SALDO
====================================================
*/

function atualizarSaldo(){

    saldoEl.textContent =
    dinheiro(saldoReal);

    saldoInfo.textContent =
    dinheiro(saldoReal);

    saldoEl.classList.toggle(
        "erro-saldo",
        saldoReal < valorAposta
    );

    atualizarBotao();

}


/*
====================================================
BOTÃO
====================================================
*/

function atualizarBotao(){

    if(jogando){

        botao.disabled = true;
        botao.textContent =
        "🎯 BOLA DESCENDO...";

        return;

    }

    if(!usuarioAtual){

        botao.disabled = true;
        botao.textContent =
        "AGUARDANDO CONTA";

        return;

    }

    if(casaEscolhida === null){

        botao.disabled = true;
        botao.textContent =
        "ESCOLHA UMA CASA";

        return;

    }

    if(saldoReal < valorAposta){

        botao.disabled = true;
        botao.textContent =
        "SALDO INSUFICIENTE";

        return;

    }

    botao.disabled = false;
    botao.textContent =
    "🎯 SOLTAR BOLA";

}

/*
====================================================
SALVAR SALDO REAL
====================================================
*/

async function salvarSaldo(novoSaldo){

    if(!usuarioAtual)
        return false;


    const valorFinal =
    Number(
        Number(novoSaldo)
        .toFixed(2)
    );


    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: valorFinal
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );


    if(error){

        console.error(
            "Erro ao salvar saldo:",
            error
        );

        return false;

    }


    saldoReal =
    valorFinal;


    atualizarSaldo();

    return true;

}


/*
====================================================
DEBITAR APOSTA
====================================================
*/

async function debitarAposta(){

    const saldoAntes =
    Number(saldoReal);


    if(saldoAntes < valorAposta){

        return false;

    }


    const novoSaldo =
    Number(
        (
            saldoAntes -
            valorAposta
        ).toFixed(2)
    );


    /*
    A aposta é descontada
    antes da bola começar.
    */

    const {
        error
    } =
    await supabase
    .from("saldos")
    .update({
        valor: novoSaldo
    })
    .eq(
        "user_id",
        usuarioAtual.id
    );


    if(error){

        console.error(
            "Erro ao debitar:",
            error
        );

        return false;

    }


    saldoReal =
    novoSaldo;


    atualizarSaldo();

    return true;

}


/*
====================================================
ÁUDIO
====================================================
*/

function iniciarAudio(){

    if(!audioContext){

        const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AudioCtx)
            return;

        audioContext =
        new AudioCtx();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    somLiberado = true;

}


function somClique(){

    iniciarAudio();

    if(!audioContext)
        return;


    const agora =
    audioContext.currentTime;


    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "square";


    osc.frequency.setValueAtTime(
        520,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        260,
        agora + .06
    );


    ganho.gain.setValueAtTime(
        .45,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .07
    );


    osc.connect(ganho);
    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);
    osc.stop(
        agora + .08
    );

}


function somPino(){

    if(!somLiberado)
        return;


    const agora =
    audioContext.currentTime;


    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "triangle";


    osc.frequency.setValueAtTime(
        850 + Math.random()*180,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        430,
        agora + .045
    );


    ganho.gain.setValueAtTime(
        .32,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .06
    );


    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);

    osc.stop(
        agora + .07
    );

}


function somQueda(){

    if(!somLiberado)
        return;


    const agora =
    audioContext.currentTime;


    const osc =
    audioContext.createOscillator();

    const ganho =
    audioContext.createGain();


    osc.type =
    "sine";


    osc.frequency.setValueAtTime(
        180,
        agora
    );


    osc.frequency.exponentialRampToValueAtTime(
        70,
        agora + .45
    );


    ganho.gain.setValueAtTime(
        .16,
        agora
    );


    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora + .45
    );


    osc.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    osc.start(agora);

    osc.stop(
        agora + .46
    );

}


function somPremio(){

    if(!somLiberado)
        return;


    const notas = [
        523.25,
        659.25,
        783.99,
        1046.50
    ];


    notas.forEach(
    function(freq,index){

        setTimeout(
        function(){

            const agora =
            audioContext.currentTime;


            const osc =
            audioContext.createOscillator();

            const ganho =
            audioContext.createGain();


            osc.type =
            "sine";

            osc.frequency.value =
            freq;


            ganho.gain.setValueAtTime(
                .42,
                agora
            );


            ganho.gain.exponentialRampToValueAtTime(
                .001,
                agora + .28
            );


            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );


            osc.start(agora);

            osc.stop(
                agora + .30
            );

        },
        index * 100
        );

    });

}


function somGrandePremio(){

    if(!somLiberado)
        return;


    const notas = [
        523.25,
        659.25,
        783.99,
        1046.50,
        1318.51
    ];


    notas.forEach(
    function(freq,index){

        setTimeout(
        function(){

            const agora =
            audioContext.currentTime;


            const osc =
            audioContext.createOscillator();

            const ganho =
            audioContext.createGain();


            osc.type =
            "triangle";

            osc.frequency.value =
            freq;


            ganho.gain.setValueAtTime(
                .55,
                agora
            );


            ganho.gain.exponentialRampToValueAtTime(
                .001,
                agora + .42
            );


            osc.connect(ganho);

            ganho.connect(
                audioContext.destination
            );


            osc.start(agora);

            osc.stop(
                agora + .45
            );

        },
        index * 110
        );

    });

}

window.soltar =
async function(){

    if(jogando)
        return;


    somClique();


    if(!usuarioAtual){

        premio.innerHTML =
        "⚠️ USUÁRIO NÃO LOGADO";

        premio.style.color =
        "#ff4141";

        return;

    }


    if(casaEscolhida === null){

        premio.innerHTML =
        "🎯 ESCOLHA PRIMEIRO UMA CASA";

        premio.style.color =
        "#ffe36a";

        return;

    }


    if(saldoReal < valorAposta){

        premio.innerHTML =
        "⚠️ SALDO INSUFICIENTE";

        premio.style.color =
        "#ff4141";

        atualizarBotao();

        return;

    }


    /*
    ================================================
    DEBITA O CRÉDITO REAL ANTES DA RODADA
    ================================================
    */

    jogando = true;

    atualizarBotao();


    const debitado =
    await debitarAposta();


    if(!debitado){

        jogando = false;

        atualizarBotao();


        premio.innerHTML =
        "❌ NÃO FOI POSSÍVEL DEBITAR A APOSTA";

        premio.style.color =
        "#ff4141";

        return;

    }


    /*
    ================================================
    LIMPAR RESULTADOS
    ================================================
    */

    resultadoTela
    .classList.remove(
        "mostrar"
    );


    document
    .querySelectorAll(".casa")
    .forEach(
        function(casa){

            casa.classList.remove(
                "vencedora"
            );

        }
    );


    premio.innerHTML =
    "⚡ A BOLA ESTÁ DESCENDO...";


    premio.style.color =
    "#ffe36a";


    instrucao.innerHTML =
    "A aposta já foi descontada do seu saldo.";


    /*
    ================================================
    SOM
    ================================================
    */

    somQueda();


    /*
    ================================================
    A CASA QUE A BOLA VAI ATINGIR
    ================================================
    */

    const indiceResultado =
    Math.floor(
        Math.random() *
        multiplicadores.length
    );


    /*
    ================================================
    POSIÇÃO DA BOLA
    ================================================
    */

    let x =
    jogo.clientWidth / 2 - 12;


    let y = 10;


    bola.style.left =
    x + "px";


    bola.style.top =
    y + "px";


    bola.classList.add(
        "caindo"
    );


    /*
    ================================================
    DESTINO
    ================================================
    */

    let destinoX =
    (
        indiceResultado + .5
    ) *
    (
        jogo.clientWidth /
        multiplicadores.length
    ) - 12;


    destinoX =
    Math.max(
        10,
        Math.min(
            destinoX,
            jogo.clientWidth - 35
        )
    );


    const inicioX =
    x;


    const inicioY =
    y;


    const fimY =
    jogo.clientHeight - 82;


    const duracao =
    2800;


    const inicio =
    performance.now();


    let ultimoTic = 0;


    /*
    ================================================
    ANIMAÇÃO
    ================================================
    */

    function animar(agora){

        const progresso =
        Math.min(
            (
                agora -
                inicio
            ) / duracao,
            1
        );


        const suave =
        progresso *
        progresso *
        (
            3 -
            2 * progresso
        );


        /*
        Oscilação simulando
        a bolinha batendo nos pinos.
        */

        const ondas =
        Math.sin(
            progresso *
            Math.PI *
            16
        ) *
        (
            1 -
            progresso
        ) *
        20;


        x =
        inicioX +
        (
            destinoX -
            inicioX
        ) *
        suave +
        ondas;


        y =
        inicioY +
        (
            fimY -
            inicioY
        ) *
        suave;


        bola.style.left =
        x + "px";


        bola.style.top =
        y + "px";


        /*
        SOM DOS PINOS
        */

        if(
            somLiberado &&
            agora -
            ultimoTic >
            145
        ){

            somPino();

            ultimoTic =
            agora;

        }


        /*
        TRILHA
        */

        if(
            Math.random() >
            .55
        ){

            criarTrilha(
                x + 12,
                y + 12
            );

        }


        if(progresso < 1){

            requestAnimationFrame(
                animar
            );

        }
        else{

            finalizarBola(
                indiceResultado
            );

        }

    }


    requestAnimationFrame(
        animar
    );

};

async function finalizarBola(
    indiceResultado
){

    const casasLista =
    document.querySelectorAll(
        ".casa"
    );


    if(casasLista[indiceResultado]){

        casasLista[indiceResultado]
        .classList.add(
            "vencedora"
        );

    }


    /*
    ================================================
    RESULTADO REAL DA BOLA
    ================================================
    */

    const numeroResultado =
    indiceResultado + 1;


    const numeroEscolhido =
    casaEscolhida + 1;


    /*
    ================================================
    SE A BOLA NÃO CAIU NA CASA ESCOLHIDA
    ================================================
    */

    if(
        indiceResultado !==
        casaEscolhida
    ){

        resultadoTitulo.textContent =
        "💥 VOCÊ PERDEU";


        resultadoTitulo
        .className =
        "resultadoTitulo derrota";


        resultadoNumero.textContent =
        numeroResultado;


        resultadoPremio.textContent =
        "R$ 0,00";


        resultadoDetalhe.innerHTML =
        "Você escolheu a casa " +
        numeroEscolhido +
        ".<br>" +
        "A bola caiu na casa " +
        numeroResultado +
        ".<br><br>" +
        "<strong style='color:#ff4141'>" +
        dinheiro(valorAposta) +
        " foi descontado.</strong>";


        premio.innerHTML =
        "💥 PERDEU — A BOLA CAIU NO Nº " +
        numeroResultado;


        premio.style.color =
        "#ff4141";


        /*
        Não devolve a aposta.

        */


        jogando = false;


        atualizarBotao();


        resultadoTela
        .classList.add(
            "mostrar"
        );


        setTimeout(
            function(){

                bola.classList.remove(
                    "caindo"
                );

            },
            300
        );


        return;

    }


    /*
    ================================================
    ACERTOU A CASA ESCOLHIDA
    ================================================
    */

    const resultadoCasa =
    multiplicadores[
        indiceResultado
    ];


    /*
    ================================================
    SUPER BÔNUS
    ================================================
    */

    if(
        resultadoCasa ===
        "SUPER"
    ){

        const premioFinal =
        10;


        const saldoAtual =
        Number(saldoReal);


        const saldoFinal =
        Number(
            (
                saldoAtual +
                premioFinal
            ).toFixed(2)
        );


        const creditado =
        await salvarSaldo(
            saldoFinal
        );


        if(!creditado){

            atualizarBotao();


            premio.innerHTML =
            "❌ ERRO AO CREDITAR O PRÊMIO";


            premio.style.color =
            "#ff4141";


            return;

        }


        somGrandePremio();


        resultadoTitulo.textContent =
        "⚡ SUPER BÔNUS ⚡";


        resultadoTitulo
        .className =
        "resultadoTitulo super";


        resultadoNumero.textContent =
        numeroResultado;


        resultadoPremio.textContent =
        "R$ 10,00";


        resultadoDetalhe.innerHTML =
        "🎯 Você acertou a casa " +
        numeroEscolhido +
        "!<br>" +
        "<strong style='color:#ff63f5'>" +
        "SUPER BÔNUS DE R$ 10,00" +
        "</strong>";


        premio.innerHTML =
        "⚡ SUPER BÔNUS — R$ 10,00";


        premio.style.color =
        "#ff63f5";


        superBonusOverlay
        .classList.add(
            "ativo"
        );


        setTimeout(
            function(){

                .classList.remove(
                    "ativo"
                );

            },
            4000
        );


        resultadoTela
        .classList.add(
            "mostrar"
        );


        jogando = false;


        atualizarBotao();


        setTimeout(
            function(){

                bola.classList.remove(
                    "caindo"
                );

            },
            300
        );


        return;

    }


    /*
    ================================================
    PRÊMIO NORMAL
    ================================================
    */

    const multiplicador =
    Number(
        resultadoCasa
        .replace("x","")
    );


    const premioFinal =
    Number(
        (
            valorAposta *
            multiplicador
        ).toFixed(2)
    );


    /*
    ================================================
    ADICIONAR PRÊMIO AO SALDO REAL

    */

    const saldoAtual =

        (

    /*
    A ficha antiga é retirada.
    Para jogar novamente,
    escolha a ficha e um novo número.
    */

    document
    .querySelectorAll(".casa")
    .forEach(
        function(casa){

            casa.classList.remove(
                "selecionada"
            );

        }
    );


    casaEscolhida =
    null;


    fichaSelecionada =
    false;


    fichaDisplay
    .classList.remove(
        "selecionada"
    );


    instrucao.innerHTML =
    "Toque na ficha e depois toque no número desejado.";


    premio.innerHTML =
    "🎯 Escolha uma casa para colocar sua ficha";


    premio.style.color =
    "#ffd700";


    atualizarBotao();

};


/*
====================================================
AUTENTICAÇÃO
====================================================
*/

supabase.auth.onAuthStateChange(
function(event,session){

    if(!session){

        window.location.href =
        "../index.html";

    }

});


/*
====================================================
INICIAR
====================================================
*/

async function iniciar(){

    try{

        usuarioAtual =
        await obterUsuario();


        if(!usuarioAtual){

            alert(
                "Você precisa estar logado para jogar."
            );


            window.location.href =
            "../index.html";


            return;

        }


        const carregou =
        await carregarSaldo();


        if(!carregou){

            carregando.style.display =
            "none";


            botao.disabled =
            true;


            botao.textContent =
            "ERRO NO SALDO";


            return;

        }


        atualizarSaldo();


        carregando.style.display =
        "none";


    }
    catch(error){

        console.error(
            "Erro ao iniciar Plinko:",
            error
        );


        carregando.style.display =
        "none";


        premio.innerHTML =
        "❌ ERRO AO INICIAR PLINKO";


        premio.style.color =
        "#ff4141";

    }

}


/*
====================================================
LIBERAR ÁUDIO NO PRIMEIRO TOQUE
====================================================
*/

document.addEventListener(
    "touchstart",
    iniciarAudio,
    {once:true}
);


document.addEventListener(
    "click",
    iniciarAudio,
    {once:true}
);


/*
====================================================
INICIAR JOGO
====================================================
*/

iniciar();

</script>
