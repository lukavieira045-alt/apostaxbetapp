<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plinko ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;
    background:
    radial-gradient(circle at 15% 15%,#0066ff,transparent 28%),
    radial-gradient(circle at 85% 25%,#e600ff,transparent 28%),
    radial-gradient(circle at 50% 100%,#ff0066,transparent 30%),
    linear-gradient(135deg,#02030b,#090018,#001526);
    background-size:180% 180%;
    animation:fundo 12s ease-in-out infinite alternate;
    overflow-x:hidden;
    padding-bottom:30px;
}

@keyframes fundo{
    0%{background-position:0% 0%}
    50%{background-position:100% 50%}
    100%{background-position:0% 100%}
}

.luz{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    pointer-events:none;
    z-index:-2;
}

.luz1{
    background:#0066ff;
    left:-120px;
    top:10%;
    animation:luz1 8s infinite alternate;
}

.luz2{
    background:#ff0088;
    right:-120px;
    bottom:10%;
    animation:luz2 9s infinite alternate;
}

@keyframes luz1{
    to{transform:translate(180px,100px) scale(1.4)}
}

@keyframes luz2{
    to{transform:translate(-180px,-100px) scale(1.4)}
}

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particulas span{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #00ffff,0 0 18px #ff00aa;
    animation:subir linear infinite;
}

.particulas span:nth-child(1){left:5%;animation-duration:7s}
.particulas span:nth-child(2){left:15%;animation-duration:10s}
.particulas span:nth-child(3){left:25%;animation-duration:8s}
.particulas span:nth-child(4){left:35%;animation-duration:12s}
.particulas span:nth-child(5){left:45%;animation-duration:9s}
.particulas span:nth-child(6){left:55%;animation-duration:11s}
.particulas span:nth-child(7){left:65%;animation-duration:7s}
.particulas span:nth-child(8){left:75%;animation-duration:10s}
.particulas span:nth-child(9){left:85%;animation-duration:8s}
.particulas span:nth-child(10){left:95%;animation-duration:12s}

@keyframes subir{
    0%{transform:translateY(0);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-110vh);opacity:0}
}

.topo{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:rgba(0,0,0,.7);
    border-bottom:1px solid rgba(255,215,0,.3);
}

.logo{
    color:#ffd700;
    font-weight:900;
    letter-spacing:1px;
}

.saldo-box{
    text-align:right;
}

.saldo-label{
    font-size:9px;
    color:#888;
}

#saldo{
    color:#00ff88;
    font-size:17px;
    font-weight:bold;
}

h1{
    margin:20px 0 5px;
    color:#ffd700;
    font-size:36px;
    text-shadow:
    0 0 8px #fff,
    0 0 18px #ffd700,
    0 0 35px #ff8800;
}

.subtitulo{
    color:#aaa;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.caixa{
    width:95%;
    max-width:430px;
    margin:auto;
    padding:16px;
    background:linear-gradient(145deg,rgba(20,25,40,.96),rgba(3,5,15,.97));
    border:2px solid #ffd700;
    border-radius:25px;
    box-shadow:
    0 0 25px rgba(255,215,0,.25),
    0 20px 70px rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
}

#jogo{
    height:390px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:1px solid rgba(255,215,0,.35);
    background:
    radial-gradient(circle at 50% 0%,rgba(0,150,255,.20),transparent 45%),
    linear-gradient(180deg,#030712,#02020a);
    box-shadow:inset 0 0 40px rgba(0,0,0,.9);
}

.grade{
    position:absolute;
    inset:0;
    opacity:.12;
    background-image:
    linear-gradient(rgba(0,255,255,.4) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,.4) 1px,transparent 1px);
    background-size:35px 35px;
}

.pino{
    position:absolute;
    width:11px;
    height:11px;
    background:radial-gradient(circle at 35% 30%,white,#ffd700 35%,#ff9800);
    border-radius:50%;
    box-shadow:0 0 6px #ffd700,0 0 14px rgba(255,215,0,.7);
    z-index:2;
}

#bola{
    position:absolute;
    top:8px;
    left:50%;
    width:24px;
    height:24px;
    margin-left:-12px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 25%,white,#00ff88 30%,#00aaff 75%);
    box-shadow:0 0 10px #00ff88,0 0 25px #00ffff;
    z-index:10;
    opacity:0;
}

#bola.caindo{
    opacity:1;
}

.trilha{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#00ffff;
    box-shadow:0 0 8px #00ffff;
    pointer-events:none;
}

#casas{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:60px;
    display:flex;
    align-items:stretch;
    justify-content:center;
    z-index:4;
}

.casa{
    flex:1;
    max-width:52px;
    margin:2px;
    border-radius:10px 10px 4px 4px;
    border:1px solid rgba(255,255,255,.15);
    background:linear-gradient(180deg,#151525,#080811);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:.25s;
    position:relative;
}

.casaNumero{
    font-size:14px;
    font-weight:bold;
    color:#ffd700;
}

.casaMult{
    font-size:10px;
    color:#aaa;
}

.casa.escolhida{
    border:2px solid #00ff88;
    box-shadow:
    0 0 10px #00ff88,
    0 0 25px rgba(0,255,136,.5);
    transform:translateY(-5px);
}

.casa.escolhida::after{
    content:"SUA FICHA";
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    color:#00ff88;
    font-size:8px;
    font-weight:bold;
}

.casa.vencedora{
    background:linear-gradient(180deg,#ffe66b,#ff9800);
    color:#160e00;
    transform:translateY(-8px) scale(1.08);
    border-color:white;
    box-shadow:
    0 0 10px #ffd700,
    0 0 30px #ff9800,
    0 0 50px rgba(255,215,0,.7);
    animation:ganhadora .5s infinite alternate;
}

@keyframes ganhadora{
    from{filter:brightness(1)}
    to{filter:brightness(1.5)}
}

.casa.vencedora .casaNumero{
    color:#160e00;
}

.casa.bonus{
    border-color:#ff00ff;
}

.casa.bonus .casaMult{
    color:#ff62ff;
    font-weight:bold;
}

#ficha{
    width:45px;
    height:45px;
    border-radius:50%;
    margin:12px auto 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle,#555 0 43%,#fff 44% 51%,#666 52% 67%,#fff 68% 72%,#333 73%);
    border:2px solid white;
    color:white;
    font-size:10px;
    font-weight:bold;
    text-shadow:0 1px 2px #000;
    box-shadow:0 0 8px rgba(255,255,255,.4),0 3px 6px #000;
    cursor:pointer;
    user-select:none;
}

#ficha.selecionada{
    box-shadow:
    0 0 8px white,
    0 0 18px #ffe36a,
    0 0 30px #ff9800;
    transform:scale(1.08);
}

.ficha-jogo{
    position:absolute;
    width:42px;
    height:42px;
    margin-left:-21px;
    margin-top:-21px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle,#555 0 43%,#fff 44% 51%,#666 52% 67%,#fff 68% 72%,#333 73%);
    border:2px solid white;
    color:white;
    font-size:9px;
    font-weight:bold;
    text-shadow:0 1px 2px #000;
    box-shadow:0 0 12px #ffe36a;
    z-index:20;
    pointer-events:none;
}

.ficha-jogo.visivel{
    display:flex;
}

#instrucao{
    min-height:42px;
    margin:10px 0;
    color:#ffe36a;
    font-size:14px;
    font-weight:bold;
    line-height:20px;
}

.valores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin:8px 0;
}

.valor-btn{
    height:40px;
    padding:5px;
    border:1px solid #655323;
    border-radius:8px;
    background:#080a10;
    color:#aaa;
    font-size:12px;
}

.valor-btn.ativo{
    color:#ffe36a;
    border-color:#ffe36a;
    box-shadow:0 0 10px rgba(255,215,60,.35);
}

#premio{
    min-height:35px;
    margin-top:10px;
    color:#ffd700;
    font-size:19px;
    font-weight:bold;
    text-shadow:0 0 12px #ffd700;
}

#botao{
    width:100%;
    margin-top:8px;
    padding:15px;
    background:linear-gradient(180deg,#ffe66b,#ffb000);
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,215,0,.4);
}

#botao:disabled{
    opacity:.45;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    color:#999;
    font-size:11px;
}

.info strong{
    color:#ffe36a;
}

#resultadoTela{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:.25s;
}

#resultadoTela.mostrar{
    opacity:1;
    pointer-events:auto;
}

.resultadoCard{
    width:86%;
    max-width:350px;
    padding:30px 20px;
    border-radius:25px;
    border:2px solid #ffd700;
    background:linear-gradient(145deg,#11172a,#080912);
    box-shadow:0 0 25px #ffd700,0 0 80px rgba(0,150,255,.5);
    transform:scale(.5);
}

#resultadoTela.mostrar .resultadoCard{
    animation:entrarResultado .45s forwards;
}

@keyframes entrarResultado{
    0%{transform:scale(.5) rotate(-8deg)}
    70%{transform:scale(1.08) rotate(2deg)}
    100%{transform:scale(1) rotate(0)}
}

.resultadoTitulo{
    font-size:22px;
    color:#00ff88;
}

.resultadoNumero{
    margin:10px 0;
    font-size:65px;
    font-weight:900;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700,0 0 35px #ff8800;
}

.resultadoPremio{
    font-size:23px;
    color:white;
    line-height:32px;
}

#fecharResultado{
    margin-top:20px;
    padding:13px 30px;
    border:0;
    border-radius:12px;
    background:#ffd700;
    font-weight:bold;
    font-size:17px;
}

#superBonus{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:200;
    background:
    radial-gradient(circle,rgba(255,0,255,.5),rgba(0,0,0,.96) 70%);
    pointer-events:none;
}

#superBonus.mostrar{
    display:flex;
    animation:bonusTela 4s forwards;
}

.superTitulo{
    color:white;
    font-size:35px;
    font-weight:900;
    text-shadow:
    0 0 10px white,
    0 0 25px #ff00ff,
    0 0 50px #ff8800;
    animation:bonusTexto .7s ease-out;
}

.superValor{
    margin-top:12px;
    color:#ffe44f;
    font-size:58px;
    font-weight:900;
    text-shadow:
    0 0 10px white,
    0 0 25px #ffe33c,
    0 0 50px #ff8c00;
}

@keyframes bonusTela{
    0%{opacity:0}
    10%{opacity:1}
    85%{opacity:1}
    100%{opacity:0}
}

@keyframes bonusTexto{
    0%{transform:scale(.2)}
    70%{transform:scale(1.2)}
    100%{transform:scale(1)}
}

@media(max-width:380px){
    h1{font-size:31px}
    #jogo{height:380px}
    .casa{margin:1px}
    .casaNumero{font-size:12px}
}
</style>
</head>

<body>

<div class="luz luz1"></div>
<div class="luz luz2"></div>

<div class="particulas">
<span></span><span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span><span></span>
</div>

<div class="topo">
    <div class="logo">⚡ APOSTAXBET</div>

    <div class="saldo-box">
        <div class="saldo-label">CRÉDITOS</div>
        <div id="saldo">0</div>
    </div>
</div>

<h1>🎯 Plinko</h1>

<div class="subtitulo">
ESCOLHA A FICHA E O NÚMERO
</div>

<div class="caixa">

    <div id="jogo">

        <div class="grade"></div>

        <div id="bola"></div>

        <div id="fichaJogo" class="ficha-jogo">
            1,00
        </div>

        <div id="casas"></div>

    </div>

    <div id="instrucao">
        🎯 TOQUE NA FICHA
    </div>

    <div id="ficha">
        1,00
    </div>

    <div class="valores">

        <button class="valor-btn ativo"
        onclick="selecionarValor(1,this)">
            1 crédito
        </button>

        <button class="valor-btn"
        onclick="selecionarValor(2,this)">
            2 créditos
        </button>

        <button class="valor-btn"
        onclick="selecionarValor(5,this)">
            5 créditos
        </button>

    </div>

    <div id="premio">
        Escolha um número
    </div>

    <button id="botao"
    onclick="soltar()"
    disabled>

    </button>

    <div class="info">
        <span>
            Ficha:
            <strong id="apostaInfo">1,00</strong>
        </span>

        <span>
            Créditos:
            <strong id="saldoPainel">0,00</strong>
        </span>
    </div>

</div>

    <div class="resultadoCard">

        <div class="resultadoTitulo">
            🎉 RESULTADO
        </div>

        <div
        class="resultadoNumero"
        id="resultadoNumero">
            0
        </div>

        <div
        class="resultadoPremio"
        id="resultadoPremio">
            0 créditos
        </div>

        <button
        id="fecharResultado"
        onclick="fecharResultado()">
            CONTINUAR
        </button>

    </div>

</div>

<div id="superBonus">

    <div class="superTitulo">
        ⚡ SUPER BÔNUS ⚡
    </div>

    <div class="superValor">
        +10
    </div>

    <div style="color:white;margin-top:5px;font-weight:bold">
        CRÉDITOS
    </div>

</div>

<script>

"use strict";

/* =====================================================
   ÁUDIO
===================================================== */

let audioContext=null;
let somLiberado=false;

function iniciarAudio(){

    if(!audioContext){

        const AudioCtx=
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AudioCtx)return;

        audioContext=new AudioCtx();

    }

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }

    somLiberado=true;
}

function somClique(){

    iniciarAudio();

    if(!audioContext)return;

    const agora=audioContext.currentTime;

    const osc=audioContext.createOscillator();
    const ganho=audioContext.createGain();

    osc.type="square";

    osc.frequency.setValueAtTime(520,agora);

    osc.frequency.exponentialRampToValueAtTime(
        260,
        agora+.06
    );

    ganho.gain.setValueAtTime(.45,agora);

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora+.07
    );

    osc.connect(ganho);
    ganho.connect(audioContext.destination);

    osc.start(agora);
    osc.stop(agora+.08);
}

function somPino(){

    if(!somLiberado)return;

    const agora=audioContext.currentTime;

    const osc=audioContext.createOscillator();
    const ganho=audioContext.createGain();

    osc.type="triangle";

    osc.frequency.setValueAtTime(
        850+Math.random()*180,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        430,
        agora+.045
    );

    ganho.gain.setValueAtTime(.32,agora);

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        agora+.06
    );

    osc.connect(ganho);
    ganho.connect(audioContext.destination);

    osc.start(agora);
    osc.stop(agora+.07);
}

function somPremio(){

    if(!somLiberado)return;

    [523.25,659.25,783.99,1046.50]
    .forEach((freq,index)=>{

        setTimeout(()=>{

            const agora=
            audioContext.currentTime;

            const osc=
            audioContext.createOscillator();

            const ganho=
            audioContext.createGain();

            osc.type="sine";
            osc.frequency.value=freq;

            ganho.gain.setValueAtTime(.42,agora);

            ganho.gain.exponentialRampToValueAtTime(
                .001,
                agora+.28
            );

            osc.connect(ganho);
            ganho.connect(audioContext.destination);

            osc.start(agora);
            osc.stop(agora+.3);

        },index*100);

    });
}

function somGrandePremio(){

    if(!somLiberado)return;

    [
        523.25,
        659.25,
        783.99,
        1046.50,
        1318.51
    ].forEach((freq,index)=>{

        setTimeout(()=>{

            const agora=
            audioContext.currentTime;

            const osc=
            audioContext.createOscillator();

            const ganho=
            audioContext.createGain();

            osc.type="triangle";
            osc.frequency.value=freq;

            ganho.gain.setValueAtTime(.5,agora);

            ganho.gain.exponentialRampToValueAtTime(
                .001,
                agora+.42
            );

            osc.connect(ganho);
            ganho.connect(audioContext.destination);

            osc.start(agora);
            osc.stop(agora+.45);

        },index*110);

    });
}


/* =====================================================
   SALDO VIRTUAL
===================================================== */

let saldo=Number(
    localStorage.getItem("plinko_creditos") || 100
);

function atualizarSaldo(){

    document.getElementById("saldo").innerText=
        saldo.toFixed(2).replace(".",",");

    document.getElementById("saldoPainel").innerText=
        saldo.toFixed(2).replace(".",",");

    localStorage.setItem(
        "plinko_creditos",
        saldo.toFixed(2)
    );

    atualizarBotao();
}

function dinheiro(valor){

    return Number(valor||0)
        .toFixed(2)
        .replace(".",",");
}


/* =====================================================
   ELEMENTOS
===================================================== */

const jogo=
document.getElementById("jogo");

const bola=
document.getElementById("bola");

const casas=
document.getElementById("casas");

const ficha=
document.getElementById("ficha");

const fichaJogo=
document.getElementById("fichaJogo");

const instrucao=
document.getElementById("instrucao");

const premio=
document.getElementById("premio");

const botao=
document.getElementById("botao");

const resultadoTela=
document.getElementById("resultadoTela");

const resultadoNumero=
document.getElementById("resultadoNumero");

const resultadoPremio=
document.getElementById("resultadoPremio");

const superBonus=
document.getElementById("superBonus");


/* =====================================================
   VALORES
===================================================== */

let valorAposta=1;
let numeroEscolhido=null;
let fichaSelecionada=false;
let jogando=false;

const numeros=9;


/* =====================================================
   CASAS
===================================================== */

const casasDados=[
    {mult:0.5},
    {mult:1},
    {mult:1.5},
    {mult:2},
    {mult:10,bonus:true},
    {mult:2},
    {mult:1.5},
    {mult:1},
    {mult:0.5}
];

for(let i=0;i<numeros;i++){

    const casa=
    document.createElement("div");

    casa.className="casa";

    if(casasDados[i].bonus){
        casa.classList.add("bonus");
    }

    let textoMult;

    if(casasDados[i].bonus){

        textoMult="⚡ +10";

    }else{

        textoMult=
        casasDados[i].mult+"x";

    }

    casa.innerHTML=
        "<div class='casaNumero'>"+
        (i+1)+
        "</div>"+
        "<div class='casaMult'>"+
        textoMult+
        "</div>";

    casa.dataset.index=i;

    casa.addEventListener("click",function(){

        escolherNumero(i);

    });

    casas.appendChild(casa);
}


/* =====================================================
   PINOS
===================================================== */

for(let linha=0;linha<7;linha++){

    for(let coluna=0;coluna<linha+3;coluna++){

        const p=
        document.createElement("div");

        p.className="pino";

        p.style.top=
        (35+linha*35)+"px";

        p.style.left=
        (90+coluna*35-(linha*17))+"px";

        jogo.appendChild(p);
    }
}


/* =====================================================
   ESCOLHER VALOR
===================================================== */

window.selecionarValor=function(valor,botaoSelecionado){

    if(jogando)return;

    valorAposta=Number(valor);

    document
    .querySelectorAll(".valor-btn")
    .forEach(b=>{
        b.classList.remove("ativo");
    });

    botaoSelecionado.classList.add("ativo");

    ficha.innerText=
        dinheiro(valorAposta);

    fichaJogo.innerText=
        dinheiro(valorAposta);

    document.getElementById("apostaInfo").innerText=
        dinheiro(valorAposta);

    atualizarBotao();
};


/* =====================================================
   SELECIONAR FICHA
===================================================== */

ficha.addEventListener("click",function(){

    if(jogando)return;

    if(saldo<valorAposta){

        instrucao.innerText=
        "⚠️ CRÉDITOS INSUFICIENTES";

        instrucao.style.color="#ff4141";

        return;
    }

    fichaSelecionada=true;

    ficha.classList.add("selecionada");

    instrucao.innerText=
        "🎯 AGORA TOQUE NO NÚMERO ESCOLHIDO";

    instrucao.style.color="#ffe36a";

    premio.innerText=
        "Escolha uma das casas abaixo";

    atualizarBotao();
});


/* =====================================================
   ESCOLHER NÚMERO
===================================================== */

function escolherNumero(index){

    if(jogando)return;

    if(!fichaSelecionada){

        instrucao.innerText=
        "🎯 TOQUE PRIMEIRO NA FICHA";

        instrucao.style.color="#ffe36a";

        return;
    }

    numeroEscolhido=index;

    document
    .querySelectorAll(".casa")
    .forEach(c=>{
        c.classList.remove("escolhida");
    });

    const casa=
    document.querySelector(
        `.casa[data-index="${index}"]`
    );

    if(casa){
        casa.classList.add("escolhida");
    }

    posicionarFicha(index);

    fichaSelecionada=false;

    ficha.classList.remove("selecionada");

    instrucao.innerHTML=
        "🎯 SUA FICHA ESTÁ NO NÚMERO "+
        (index+1)+
        "<br><span style='font-size:11px;color:#aaa'>Agora solte a bolinha</span>";

    premio.innerText=
        "Boa sorte!";

    atualizarBotao();
}


/* =====================================================
   POSICIONAR FICHA
===================================================== */

function posicionarFicha(index){

    const largura=
        jogo.clientWidth/numeros;

    const x=
        largura*index+
        largura/2;

    const y=
        jogo.clientHeight-75;

    fichaJogo.style.left=
        x+"px";

    fichaJogo.style.top=
        y+"px";

    fichaJogo.innerText=
        dinheiro(valorAposta);

    fichaJogo.classList.add("visivel");
}


/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao(){

    if(jogando){

        botao.disabled=true;
        botao.innerText="⚡ BOLINHA DESCENDO...";
        return;
    }

    if(numeroEscolhido===null){

        botao.disabled=true;
        botao.innerText="COLOQUE A FICHA";
        return;
    }

    if(saldo<valorAposta){

        botao.disabled=true;
        botao.innerText="CRÉDITOS INSUFICIENTES";
        return;
    }

    botao.disabled=false;
    botao.innerText="🎯 SOLTAR BOLINHA";
}


/* =====================================================
   SOLTAR
===================================================== */

window.soltar=function(){

    somClique();

    if(jogando)return;

    if(numeroEscolhido===null){

        instrucao.innerText=
        "🎯 ESCOLHA UM NÚMERO PRIMEIRO";

        return;
    }

    if(saldo<valorAposta){

        instrucao.innerText=
        "⚠️ CRÉDITOS INSUFICIENTES";

        return;
    }

    jogando=true;

    atualizarBotao();

    /*
    Desconta os créditos antes da rodada.
    */

    saldo=
        Number(
            (saldo-valorAposta)
            .toFixed(2)
        );

    atualizarSaldo();

    document
    .querySelectorAll(".casa")
    .forEach(c=>{
        c.classList.remove("vencedora");
    });

    resultadoTela.classList.remove("mostrar");

    premio.innerText=
        "⚡ A BOLINHA ESTÁ DESCENDO...";

    instrucao.innerText=
        "Boa sorte!";

    somQueda();

    /*
    Resultado da bolinha.
    */

    const indiceResultado=
        Math.floor(
            Math.random()*numeros
        );

    /*
    Posição inicial.
    */

    let x=
        jogo.clientWidth/2-12;

    let y=8;

    bola.style.left=x+"px";
    bola.style.top=y+"px";

    bola.classList.add("caindo");

    /*
    Destino.
    */

    const largura=
        jogo.clientWidth/numeros;

    let destinoX=
        largura*indiceResultado+
        largura/2-12;

    destinoX=
        Math.max(
            10,
            Math.min(
                destinoX,
                jogo.clientWidth-35
            )
        );

    const inicioX=x;
    const inicioY=y;

    const fimY=
        jogo.clientHeight-75;

    const duracao=2700;

    const inicio=
        performance.now();

    let ultimoTic=0;

    function animar(agora){

        const progresso=
            Math.min(
                (agora-inicio)/duracao,
                1
            );

        const suave=
            progresso*
            progresso*
            (3-2*progresso);

        const ondas=
            Math.sin(
                progresso*Math.PI*18
            )*
            (1-progresso)*
            20;

        x=
            inicioX+
            (destinoX-inicioX)*
            suave+
            ondas;

        y=
            inicioY+
            (fimY-inicioY)*
            suave;

        bola.style.left=x+"px";
        bola.style.top=y+"px";

        if(
            somLiberado &&
            agora-ultimoTic>145
        ){

            somPino();
            ultimoTic=agora;
        }

        if(Math.random()>.55){

            criarTrilha(
                x+12,
                y+12
            );
        }

        if(progresso<1){

            requestAnimationFrame(animar);

        }else{

            finalizarBola(
                indiceResultado
            );
        }
    }

    requestAnimationFrame(animar);
};


/* =====================================================
   TRILHA
===================================================== */

function criarTrilha(x,y){

    const ponto=
        document.createElement("div");

    ponto.className="trilha";

    ponto.style.left=x+"px";
    ponto.style.top=y+"px";

    jogo.appendChild(ponto);

    setTimeout(()=>{
        ponto.remove();
    },400);
}


/* =====================================================
   FINALIZAR
===================================================== */

function finalizarBola(indiceResultado){

    const lista=
        document.querySelectorAll(".casa");

    if(lista[indiceResultado]){

        lista[indiceResultado]
        .classList.add("vencedora");
    }

    const acertou=
        indiceResultado===
        numeroEscolhido;

    const dados=
        casasDados[indiceResultado];

    /*
    =====================================================
    ACERTO
    =====================================================
    */

    if(acertou){

        if(dados.bonus){

            /*
            SUPER BÔNUS:
            +10 créditos.
            */

            const premioFinal=10;

            saldo=
                Number(
                    (saldo+premioFinal)
                    .toFixed(2)
                );

            atualizarSaldo();

            premio.innerHTML=
                "⚡ SUPER BÔNUS! +10 CRÉDITOS";

            somGrandePremio();

            mostrarSuperBonus();

            resultadoNumero.innerText=
                indiceResultado+1;

            resultadoPremio.innerHTML=
                "⚡ SUPER BÔNUS<br>+10 CRÉDITOS";

        }else{

            const premioFinal=
                Number(
                    (valorAposta*dados.mult)
                    .toFixed(2)
                );

            saldo=
                Number(
                    (saldo+premioFinal)
                    .toFixed(2)
                );

            atualizarSaldo();

            premio.innerHTML=
                "🎉 ACERTOU! +"+
                dinheiro(premioFinal)+
                " CRÉDITOS";

            if(dados.mult>=2){
                somGrandePremio();
            }else{
                somPremio();
            }

            resultadoNumero.innerText=
                indiceResultado+1;

            resultadoPremio.innerHTML=
                "🎉 ACERTOU!<br>"+
                "+"+
                dinheiro(premioFinal)+
                " créditos";
        }

    }else{

        /*
        =================================================
        ERROU
        =================================================
        */

        somClique();

        premio.innerHTML=
            "💥 NÃO FOI DESSA VEZ";

        resultadoNumero.innerText=
            indiceResultado+1;

        resultadoPremio.innerHTML=
            "Você escolheu: nº "+
            (numeroEscolhido+1)+
            "<br>"+
            "A bolinha caiu: nº "+
            (indiceResultado+1)+
            "<br>"+
            "<span style='color:#ff4141'>"+
            "-"+
            dinheiro(valorAposta)+
            " créditos"+
            "</span>";
    }

    setTimeout(()=>{

        resultadoTela.classList.add("mostrar");

    },450);

    jogando=false;

    numeroEscolhido=null;

    fichaJogo.classList.remove("visivel");

    document
    .querySelectorAll(".casa")
    .forEach(c=>{
        c.classList.remove("escolhida");
    });

    botao.disabled=false;

    atualizarBotao();

    setTimeout(()=>{

        bola.classList.remove("caindo");

    },350);
}


/* =====================================================
   SUPER BÔNUS
===================================================== */

function mostrarSuperBonus(){

    superBonus.classList.add("mostrar");

    setTimeout(()=>{

        superBonus.classList.remove("mostrar");

    },4000);
}


/* =====================================================
   FECHAR RESULTADO
===================================================== */

window.fecharResultado=function(){

    somClique();

    resultadoTela.classList.remove("mostrar");

    instrucao.innerText=
        "🎯 TOQUE NA FICHA";

    premio.innerText=
        "Escolha um novo número";

    atualizarBotao();
};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarSaldo();

</script>
