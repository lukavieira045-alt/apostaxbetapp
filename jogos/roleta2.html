<script>
// CONFIGURAÇÃO SUPABASE DIRETA (SUBSTITUI saldo.js)
const SUPABASE_URL = 'https://jxbzjiwmajjzxgihfjgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEQUENCIA=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const VERMELHOS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const TAXA_CASA = 0.30;

let fichaSelecionadaValor=.50;
let fichasDisponiveis=0;
let valorPorFicha=.50;
let apostas=[];
let ultimaAposta=[];
let resultados=[];
let girando=false;
let auto=false;
let audioContext=null;
let somRoletaAtivo=false;
let intervaloSomRoleta=null;

function iniciarAudio(){try{if(!audioContext){audioContext=new(window.AudioContext||window.webkitAudioContext)()}if(audioContext.state==="suspended")audioContext.resume()}catch(e){}}
function somFicha(){iniciarAudio();if(!audioContext)return;try{const agora=audioContext.currentTime;const osc=audioContext.createOscillator();const ganho=audioContext.createGain();osc.type="triangle";osc.frequency.setValueAtTime(850,agora);osc.frequency.exponentialRampToValueAtTime(1250,agora+.045);ganho.gain.setValueAtTime(.0001,agora);ganho.gain.exponentialRampToValueAtTime(.20,agora+.005);ganho.gain.exponentialRampToValueAtTime(.0001,agora+.10);osc.connect(ganho);ganho.connect(audioContext.destination);osc.start(agora);osc.stop(agora+.11)}catch(e){}}
function somPalheta(){iniciarAudio();if(!audioContext)return;try{const agora=audioContext.currentTime;const osc=audioContext.createOscillator();const ganho=audioContext.createGain();osc.type="square";osc.frequency.setValueAtTime(900+Math.random()*250,agora);osc.frequency.exponentialRampToValueAtTime(480,agora+.045);ganho.gain.setValueAtTime(.0001,agora);ganho.gain.exponentialRampToValueAtTime(.055,agora+.003);ganho.gain.exponentialRampToValueAtTime(.0001,agora+.065);osc.connect(ganho);ganho.connect(audioContext.destination);osc.start(agora);osc.stop(agora+.07)}catch(e){}}
function iniciarSomRoleta(){iniciarAudio();if(somRoletaAtivo)return;somRoletaAtivo=false}
function pararSomRoleta(){somRoletaAtivo=false;if(intervaloSomRoleta){clearInterval(intervaloSomRoleta);intervaloSomRoleta=null}}try{if(somGiroGain&&audioContext)somGiroGain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.22);if(somGiroOsc){setTimeout(()=>{try{somGiroOsc.stop()}catch(e){}somGiroOsc=null},260)}}catch(e){}}

const roleta=document.getElementById("roleta");
const bola=document.getElementById("bola");
const saldoEl=document.getElementById("saldo");
const valorApostaEl=document.getElementById("valorAposta");
const mensagemEl=document.getElementById("mensagem");
const btnGirar=document.getElementById("btnGirar");
const fichaSelecionadaEl=document.getElementById("fichaSelecionada");
const fichaContadorEl=document.getElementById("fichaContador");
const contagemEl=document.getElementById("contagemRoleta");

function moeda(valor){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(valor)||0)}

// FUNÇÕES DE SALDO CORRIGIDAS E SEGURAS
async function getUsuario(){const {data,error}=await supabaseClient.auth.getSession();if(error){console.error("Erro na sessão:",error);return null}return data?.session?.user||null}

async function obterSaldo(){const user=await getUsuario();if(!user)return 0;const {data,error}=await supabaseClient.from("saldos").select("valor").eq("user_id",user.id).single();if(error){console.error("Erro ao buscar saldo:",error);return 0}const saldo=Number(data?.valor||0);saldoEl.textContent=moeda(saldo);return saldo}

async function debitar(valor){const user=await getUsuario();if(!user)throw new Error("Usuário não logado");const saldoAtual=await obterSaldo();if(saldoAtual<valor)throw new Error("Saldo insuficiente");const novoSaldo=Number((saldoAtual-valor).toFixed(2));const {error}=await supabaseClient.from("saldos").update({valor:novoSaldo}).eq("user_id",user.id);if(error)throw new Error("Erro ao debitar: "+error.message);await obterSaldo();return true}

async function creditar(valor){const user=await getUsuario();if(!user)throw new Error("Usuário não logado");const saldoAtual=await obterSaldo();const novoSaldo=Number((saldoAtual+valor).toFixed(2));const {error}=await supabaseClient.from("saldos").update({valor:novoSaldo}).eq("user_id",user.id);if(error)throw new Error("Erro ao creditar: "+error.message);await obterSaldo();return true}

function criarNumerosRoleta(){const area=document.getElementById("numerosRoleta");area.innerHTML="";SEQUENCIA.forEach((numero,index)=>{const span=document.createElement("span");const angulo=index*(360/SEQUENCIA.length);span.textContent=numero;span.style.transform=`rotate(${angulo}deg) translateY(-205px) rotate(-${angulo}deg)`;area.appendChild(span)})}

function criarTabela(){const grid=document.getElementById("numeroGrid");grid.innerHTML="";const zero=document.createElement("button");zero.className="num zero";zero.textContent="0";zero.onclick=()=>apostar("numero",0);grid.appendChild(zero);for(let linha=0;linha<3;linha++){for(let coluna=1;coluna<=12;coluna++){const numero=coluna*3-linha;const botao=document.createElement("button");botao.className="num "+(VERMELHOS.includes(numero)?"red":"black");botao.textContent=numero;botao.onclick=()=>apostar("numero",numero);grid.appendChild(botao)}}}

function classeFicha(valor){valor=Number(valor);if(valor===.50)return"f05";if(valor===1)return"f1";if(valor===2)return"f2";if(valor===5)return"f5";if(valor===10)return"f10";if(valor===50)return"f50";return"f1"}

function colocarFichaNoNumero(numero,valor){const botoes=document.querySelectorAll(".num");botoes.forEach(botao=>{const texto=botao.childNodes[0]?.nodeValue?.trim();if(Number(texto)===Number(numero)){const ficha=document.createElement("div");ficha.className="fichas-na-aposta";const chip=document.createElement("div");chip.className="ficha-mesa "+classeFicha(valor);chip.textContent=Number(valor)===.50?"0,50":Number(valor).toLocaleString("pt-BR",{minimumFractionDigits:Number(valor)%1!==0?2:0});ficha.appendChild(chip);botao.appendChild(ficha)}})}

function limparFichasVisuais(){document.querySelectorAll(".fichas-na-aposta").forEach(e=>e.remove())}

function selecionarFicha(valor,elemento){if(girando)return;iniciarAudio();somFicha();fichaSelecionadaValor=Number(valor);valorPorFicha=Number(valor);fichasDisponiveis=0;document.querySelectorAll(".ficha").forEach(x=>x.classList.remove("selecionada"));elemento.classList.add("selecionada");fichaSelecionadaEl.textContent=moeda(fichaSelecionadaValor);atualizarContadorFichas();mensagemEl.textContent=`Ficha selecionada: ${moeda(fichaSelecionadaValor)}`;mensagemEl.className="mensagem"}

function atualizarContadorFichas(){if(fichasDisponiveis===0){fichaContadorEl.textContent="0 fichas";return}fichaContadorEl.textContent=fichasDisponiveis===1?"1 ficha":`${fichasDisponiveis} fichas`}

function apostar(tipo,valor){if(girando)return;iniciarAudio();somFicha();apostas.push({tipo:tipo,valor:valor,quantia:valorPorFicha});fichasDisponiveis++;atualizarContadorFichas();atualizarAposta();if(tipo==="numero"){colocarFichaNoNumero(valor,valorPorFicha)}mensagemEl.textContent=`Ficha adicionada: ${moeda(valorPorFicha)}`;mensagemEl.className="mensagem"}

function totalApostas(){return apostas.reduce((total,aposta)=>total+Number(aposta.quantia),0)}
function atualizarAposta(){valorApostaEl.textContent=moeda(totalApostas())}

function contagemRegressiva(){return new Promise(resolve=>{let numero=10;contagemEl.textContent=numero;contagemEl.style.display="flex";const intervalo=setInterval(()=>{numero--;if(numero>0){contagemEl.textContent=numero}else{clearInterval(intervalo);contagemEl.textContent="GO!";setTimeout(()=>{contagemEl.style.display="none";resolve()},500)}},1000)})}

function numeroAleatorioSeguro(max){if(window.crypto&&typeof window.crypto.getRandomValues==="function"){const limite=Math.floor(4294967296/max)*max;const array=new Uint32Array(1);do{window.crypto.getRandomValues(array)}while(array[0]>=limite);return array[0]%max}return Math.floor(Math.random()*max)}

async function girarRoleta(){
    if(girando)return;
    if(apostas.length===0){mensagemEl.textContent="Faça pelo menos uma aposta antes de girar.";mensagemEl.className="mensagem resultado-derrota";return}
    const total=totalApostas();
    if(total<=0){mensagemEl.textContent="Valor de aposta inválido.";mensagemEl.className="mensagem resultado-derrota";return}

    try{
        iniciarAudio();
        girando=true;
        btnGirar.disabled=true;
        mensagemEl.textContent="⏳ Prepare-se...";
        mensagemEl.className="mensagem";
        ultimaAposta=apostas.map(a=>({...a}));
        
        await contagemRegressiva();
        
        // Debita a aposta com tratamento de erro real
        await debitar(total);
        
        const indice=numeroAleatorioSeguro(SEQUENCIA.length);
        const numeroFinal=SEQUENCIA[indice];
        const anguloPorNumero=360/SEQUENCIA.length;
        const anguloFinal=indice*anguloPorNumero;
        
        bola.getAnimations().forEach(animacao=>{animacao.cancel()});
        const raioBola=window.innerWidth<=650?125:188;
        bola.style.opacity="1";bola.style.visibility="visible";bola.style.display="block";
        bola.style.transform=`translate(-50%,-50%) rotate(0deg) translateY(-${raioBola}px)`;
        await new Promise(resolve=>requestAnimationFrame(resolve));
        
        iniciarSomRoleta();
        const voltas=10;
        const grausFinais=(voltas*360)+anguloFinal;
        const animacaoBola=bola.animate([
            {transform:`translate(-50%,-50%) rotate(0deg) translateY(-${raioBola}px)`,opacity:1},
            {transform:`translate(-50%,-50%) rotate(${grausFinais*.08}deg) translateY(-${raioBola}px)`,opacity:1},
            {transform:`translate(-50%,-50%) rotate(${grausFinais*.35}deg) translateY(-${raioBola}px)`,opacity:1},
            {transform:`translate(-50%,-50%) rotate(${grausFinais*.72}deg) translateY(-${raioBola}px)`,opacity:1},
            {transform:`translate(-50%,-50%) rotate(${grausFinais*.92}deg) translateY(-${raioBola}px)`,opacity:1},
            {transform:`translate(-50%,-50%) rotate(${grausFinais}deg) translateY(-${raioBola}px)`,opacity:1}
        ],{duration:7500,easing:"cubic-bezier(.08,.02,.12,1)",fill:"forwards"});
        
        mensagemEl.textContent=" A bolinha está girando...";
        mensagemEl.className="mensagem";
        await animacaoBola.finished;
        
        bola.style.opacity="1";bola.style.visibility="visible";bola.style.display="block";
        bola.style.transform=`translate(-50%,-50%) rotate(${grausFinais}deg) translateY(-${raioBola}px)`;
        pararSomRoleta();
        await new Promise(resolve=>setTimeout(resolve,500));
        
        await finalizarRodada(numeroFinal);
        
        girando=false;
        btnGirar.disabled=false;
        await obterSaldo();
        
        if(auto&&apostas.length>0){setTimeout(girarRoleta,1200)}
    }catch(erro){
        pararSomRoleta();
        console.error("Erro ao girar:",erro);
        contagemEl.style.display="none";
        girando=false;
        btnGirar.disabled=false;
        // Mostra o erro REAL do Supabase
        mensagemEl.textContent=erro.message||"Não foi possível realizar a aposta.";
        mensagemEl.className="mensagem resultado-derrota";
        await obterSaldo();
    }
}

async function finalizarRodada(numero){
    resultados.unshift(numero);
    resultados=resultados.slice(0,8);
    atualizarResultados();
    document.getElementById("ultimoResultado").textContent=numero;
    
    let premioBruto=0;
    apostas.forEach(aposta=>{
        if(aposta.tipo==="numero"){
            if(aposta.valor===numero){
                if(numero===0){premioBruto+=aposta.quantia*30}else{premioBruto+=aposta.quantia*36}
            }
        }else if(aposta.tipo==="cor"){
            const cor=corNumero(numero);
            if(cor===aposta.valor){premioBruto+=aposta.quantia*2}
        }else if(aposta.tipo==="par"){
            if(numero!==0){const par=numero%2===0?"par":"impar";if(par===aposta.valor){premioBruto+=aposta.quantia*2}}
        }else if(aposta.tipo==="baixo"){if(numero>=1&&numero<=18){premioBruto+=aposta.quantia*2}}
        else if(aposta.tipo==="alto"){if(numero>=19&&numero<=36){premioBruto+=aposta.quantia*2}}
        else if(aposta.tipo==="dozen"){if(aposta.valor===1&&numero>=1&&numero<=12){premioBruto+=aposta.quantia*3}}
        else if(aposta.tipo==="doze"){const grupo=numero>=1&&numero<=12?1:numero>=13&&numero<=24?2:numero>=25&&numero<=36?3:0;if(grupo===aposta.valor){premioBruto+=aposta.quantia*3}}
    });
    
    const premioFinal=premioBruto*TAXA_CASA;
    const cor=corNumero(numero);
    
    if(premioFinal>0){
        await creditar(premioFinal);
        mensagemEl.textContent=`🎉 Saiu ${numero} (${cor.toUpperCase()}) — prêmio ${moeda(premioFinal)}!`;
        mensagemEl.className="mensagem resultado-vitoria";
    }else{
        mensagemEl.textContent=`Saiu ${numero} (${cor.toUpperCase()}). Boa sorte na próxima!`;
        mensagemEl.className="mensagem resultado-derrota";
    }
    
    atualizarEstatisticas();
    apostas=[];
    atualizarAposta();
    fichasDisponiveis=0;
    atualizarContadorFichas();
    limparFichasVisuais();
    await obterSaldo();
}

function restaurarFichas(){fichasDisponiveis=0;valorPorFicha=fichaSelecionadaValor;atualizarContadorFichas()}
function corNumero(numero){if(numero===0)return"verde";return VERMELHOS.includes(numero)?"vermelho":"preto"}

function atualizarResultados(){const box=document.getElementById("ultimosResultados");box.innerHTML="";if(resultados.length===0){box.innerHTML="<span style='opacity:.7;'>Nenhum resultado</span>";return}resultados.forEach(numero=>{const span=document.createElement("span");span.className="resultado "+corNumero(numero);span.textContent=numero;box.appendChild(span)})}

function atualizarEstatisticas(){if(resultados.length===0)return;let red=0;let black=0;let green=0;resultados.forEach(numero=>{const cor=corNumero(numero);if(cor==="vermelho")red++;if(cor==="preto")black++;if(cor==="verde")green++});const total=resultados.length;document.getElementById("estatRed").textContent=Math.round(red/total*100)+"%";document.getElementById("estatBlack").textContent=Math.round(black/total*100)+"%";document.getElementById("estatGreen").textContent=Math.round(green/total*100)+"%"}

function limparApostas(){if(girando)return;apostas=[];atualizarAposta();fichasDisponiveis=0;atualizarContadorFichas();limparFichasVisuais();mensagemEl.textContent="Apostas limpas.";mensagemEl.className="mensagem"}

function repetirAposta(){if(girando)return;if(ultimaAposta.length===0){mensagemEl.textContent="Ainda não existe uma aposta anterior.";mensagemEl.className="mensagem";return}apostas=ultimaAposta.map(a=>({...a}));limparFichasVisuais();apostas.forEach(aposta=>{if(aposta.tipo==="numero"){colocarFichaNoNumero(aposta.valor,aposta.quantia)}});fichasDisponiveis=apostas.length;atualizarAposta();atualizarContadorFichas();mensagemEl.textContent="Aposta anterior repetida.";mensagemEl.className="mensagem"}

function toggleAuto(){auto=!auto;document.getElementById("switchAuto").classList.toggle("ativo",auto)}
function irDeposito(){window.location.href="../deposito.html"}

document.addEventListener("DOMContentLoaded",async()=>{
    criarNumerosRoleta();
    criarTabela();
    restaurarFichas();
    await obterSaldo();
    setInterval(async()=>{if(!girando){await obterSaldo()}},5000);
});
</script>
