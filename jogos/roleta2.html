<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleta 2 - ApostaXBet</title>

<script type="module" src="../saldo.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at center,#123d25 0%,#06140d 48%,#020604 100%);
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 35%,rgba(0,255,120,.10),transparent 35%),
        linear-gradient(115deg,transparent 40%,rgba(255,255,255,.025),transparent 60%);
}

.topo{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(2,8,6,.96);
    border-bottom:1px solid rgba(255,255,255,.15);
    position:relative;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#00e875;
}

.voltar{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #555;
    background:#101714;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.titulo{
    font-size:29px;
    font-weight:900;
    letter-spacing:1px;
}

.titulo::before,
.titulo::after{
    content:"☘";
    color:#20d96f;
    margin:0 12px;
}

.acoes-topo{
    display:flex;
    align-items:center;
    gap:18px;
}

.icone{
    font-size:29px;
}

.saldo-box{
    min-width:165px;
    border:1px solid #777;
    border-radius:12px;
    padding:7px 12px;
    background:#0d1511;
    text-align:center;
}

.saldo-label{
    font-size:13px;
    font-weight:bold;
}

#saldo{
    color:#d9ff00;
    font-size:21px;
    font-weight:900;
}

.btn-deposito{
    border:0;
    width:38px;
    height:38px;
    border-radius:8px;
    background:#20c94f;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:min(1450px,96%);
    margin:18px auto 35px;
}

.painel-superior{
    display:grid;
    grid-template-columns:280px 1fr 280px;
    gap:18px;
    align-items:center;
}

.card{
    border:1px solid rgba(255,255,255,.35);
    border-radius:14px;
    background:rgba(2,10,7,.78);
    box-shadow:0 0 18px rgba(0,0,0,.4);
    padding:18px;
}

.card h3{
    text-align:center;
    margin-bottom:18px;
    font-size:17px;
}

.resultados{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
}

.resultado{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-weight:bold;
    font-size:17px;
}

.vermelho{
    background:#d52c23;
}

.preto{
    background:#050505;
    border:1px solid #444;
}

.verde{
    background:#0a9b46;
}

.estatistica{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
    font-weight:bold;
}

.bolinha{
    display:inline-block;
    width:13px;
    height:13px;
    border-radius:50%;
    margin-right:7px;
}

.roleta-area{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:520px;
    position:relative;
}

.roleta{
    width:min(520px,75vw);
    aspect-ratio:1;
    border-radius:50%;
    position:relative;
    background:#22150a;
    border:16px solid #5f3915;
    box-shadow:
        0 0 0 5px #d29a38,
        0 0 35px rgba(0,0,0,.9),
        inset 0 0 30px #000;
    transition:transform 5s cubic-bezier(.12,.75,.16,1);
}

.roleta::before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:50%;
    background:
        conic-gradient(
            #0a9b46 0deg 9.73deg,
            #d52c23 9.73deg 19.46deg,
            #050505 19.46deg 29.19deg,
            #d52c23 29.19deg 38.92deg,
            #050505 38.92deg 48.65deg,
            #d52c23 48.65deg 58.38deg,
            #050505 58.38deg 68.11deg,
            #d52c23 68.11deg 77.84deg,
            #050505 77.84deg 87.57deg,
            #d52c23 87.57deg 97.30deg,
            #050505 97.30deg 107.03deg,
            #d52c23 107.03deg 116.76deg,
            #050505 116.76deg 126.49deg,
            #d52c23 126.49deg 136.22deg,
            #050505 136.22deg 145.95deg,
            #d52c23 145.95deg 155.68deg,
            #050505 155.68deg 165.41deg,
            #d52c23 165.41deg 175.14deg,
            #050505 175.14deg 184.87deg,
            #d52c23 184.87deg 194.60deg,
            #050505 194.60deg 204.33deg,
            #d52c23 204.33deg 214.06deg,
            #050505 214.06deg 223.79deg,
            #d52c23 223.79deg 233.52deg,
            #050505 233.52deg 243.25deg,
            #d52c23 243.25deg 252.98deg,
            #050505 252.98deg 262.71deg,
            #d52c23 262.71deg 272.44deg,
            #050505 272.44deg 282.17deg,
            #d52c23 282.17deg 291.90deg,
            #050505 291.90deg 301.63deg,
            #d52c23 301.63deg 311.36deg,
            #050505 311.36deg 321.09deg,
            #d52c23 321.09deg 330.82deg,
            #050505 330.82deg 340.55deg,
            #d52c23 340.55deg 350.28deg,
            #050505 350.28deg 360deg
        );
    box-shadow:inset 0 0 25px #000;
}

.numero-roleta{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%);
    z-index:2;
}

.numero-roleta span{
    position:absolute;
    left:50%;
    top:50%;
    width:34px;
    height:34px;
    margin-left:-17px;
    margin-top:-17px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:14px;
    color:#fff;
    text-shadow:0 1px 2px #000;
}

.roleta-centro{
    position:absolute;
    width:125px;
    height:125px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle at 35% 30%,#ffe39a,#b87917 45%,#6a3808 70%,#2b1604);
    border:8px solid #c58b2c;
    box-shadow:
        inset 0 0 15px #3b1d00,
        0 0 12px #000;
    z-index:5;
}

.roleta-centro::after{
    content:"A";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:42px;
    font-weight:900;
    color:#fff2b0;
    text-shadow:0 2px 5px #000;
}

.bola{
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 10px #fff;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) translateY(-190px);
    z-index:7;
}

.roleta-area::before{
    content:"";
    position:absolute;
    top:calc(50% - 285px);
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:30px solid #ffd400;
    z-index:20;
    filter:drop-shadow(0 2px 4px #000);
}

.aposta-atual{
    text-align:center;
}

.valor-aposta{
    color:#ffe500;
    font-size:28px;
    font-weight:900;
    margin:15px 0 25px;
}

.ultimo{
    font-size:38px;
    font-weight:900;
    margin-top:20px;
}

.btn-girar{
    width:100%;
    padding:20px 10px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:linear-gradient(#22d95c,#08a53e);
    color:white;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,255,90,.22);
}

.btn-girar:hover{
    filter:brightness(1.15);
}

.btn-girar:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.auto{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
    padding:14px;
    border:1px solid #555;
    border-radius:10px;
}

.switch{
    width:48px;
    height:25px;
    border-radius:20px;
    background:#555;
    position:relative;
    cursor:pointer;
}

.switch::after{
    content:"";
    position:absolute;
    width:21px;
    height:21px;
    border-radius:50%;
    background:#fff;
    left:2px;
    top:2px;
    transition:.2s;
}

.switch.ativo{
    background:#15b94b;
}

.switch.ativo::after{
    left:25px;
}

.mesa{
    margin-top:15px;
    border:2px solid #b7db27;
    border-radius:17px;
    padding:15px;
    background:rgba(0,15,7,.75);
    box-shadow:0 0 18px rgba(200,255,0,.08);
}

.cores{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
}

.btn-cor{
    min-height:75px;
    border:2px solid #b7db27;
    border-radius:10px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.btn-cor.vermelho-btn{
    background:linear-gradient(#a92b20,#4d0b07);
}

.btn-cor.verde-btn{
    background:linear-gradient(#159d45,#063d19);
}

.btn-cor.preto-btn{
    background:linear-gradient(#181818,#020202);
}

.ficha-atual{
    text-align:center;
    margin:15px 0;
    font-size:17px;
}

.ficha-contador{
    color:#ffe500;
    font-weight:900;
    margin-left:8px;
}

.numero-grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:4px;
}

.num{
    min-height:55px;
    border:1px solid #80951d;
    border-radius:4px;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    position:relative;
}

.num.red{
    background:#a51f19;
}

.num.black{
    background:#060606;
}

.num.zero{
    background:#07863b;
    grid-row:span 3;
}

.num:hover,
.aposta-extra:hover,
.btn-cor:hover{
    filter:brightness(1.3);
    transform:translateY(-1px);
}

.extras{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    margin-top:5px;
}

.aposta-extra{
    min-height:55px;
    background:#06180d;
    color:white;
    border:1px solid #80951d;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.fichas{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:20px;
    flex-wrap:wrap;
}

.ficha{
    width:62px;
    height:62px;
    border-radius:50%;
    border:6px dashed #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 10px #000;
}

.ficha:hover{
    transform:scale(1.08);
}

.ficha.selecionada{
    outline:4px solid #ffe900;
    transform:scale(1.08);
}

.f05{background:#7253a5;}
.f1{background:#bd3029;}
.f2{background:#0b9e48;}
.f5{background:#333;}
.f10{background:#2464b5;}
.f50{background:#b56b18;}

.botoes-final{
    margin-left:auto;
    display:flex;
    gap:10px;
}

.btn-final{
    padding:15px 22px;
    border:1px solid #3e9259;
    border-radius:9px;
    background:#07140d;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-final:hover{
    background:#102b1b;
}

.mensagem{
    text-align:center;
    min-height:32px;
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

.resultado-vitoria{
    color:#28ff78;
}

.resultado-derrota{
    color:#ff6666;
}


/* ===============================
   FICHAS SOBRE OS NÚMEROS
================================ */

.ficha-no-numero{
    position:absolute;
    width:34px;
    height:34px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px dashed #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:900;
    color:#fff;
    z-index:10;
    box-shadow:
        0 2px 6px #000,
        0 0 8px rgba(255,255,255,.35);
    pointer-events:none;
}

.ficha-no-numero.f05{
    background:#7253a5;
}

.ficha-no-numero.f1{
    background:#bd3029;
}

.ficha-no-numero.f2{
    background:#0b9e48;
}

.ficha-no-numero.f5{
    background:#333;
}

.ficha-no-numero.f10{
    background:#2464b5;
}

.ficha-no-numero.f50{
    background:#b56b18;
}

@media(max-width:1050px){

    .painel-superior{
        grid-template-columns:1fr;
    }

    .roleta-area{
        min-height:470px;
    }

    .card{
        width:100%;
    }

    .numero-grid{
        grid-template-columns:repeat(12,1fr);
    }

}

@media(max-width:650px){

    .topo{
        height:auto;
        min-height:62px;
        padding:8px;
        gap:5px;
    }

    .logo{
        font-size:18px;
    }

    .titulo{
        font-size:16px;
    }

    .titulo::before,
    .titulo::after{
        margin:0 3px;
    }

    .voltar{
        width:40px;
        height:40px;
    }

    .acoes-topo{
        gap:5px;
    }

    .icone{
        display:none;
    }

    .saldo-box{
        min-width:105px;
    }

    #saldo{
        font-size:16px;
    }

    .btn-deposito{
        width:32px;
        height:32px;
    }

    .roleta{
        width:82vw;
    }

    .roleta-centro{
        width:85px;
        height:85px;
    }

    .bola{
        transform:translate(-50%,-50%) translateY(-125px);
    }

    .roleta-area::before{
        top:calc(50% - 225px);
    }

    .cores{
        grid-template-columns:1fr;
    }

    .numero-grid{
        grid-template-columns:repeat(6,1fr);
    }

    .num.zero{
        grid-row:auto;
    }

    .extras{
        grid-template-columns:repeat(2,1fr);
    }

    .fichas{
        justify-content:center;
    }

    .botoes-final{
        width:100%;
        margin-left:0;
    }

    .btn-final{
        flex:1;
    }

}

</style>
</head>

<body>
