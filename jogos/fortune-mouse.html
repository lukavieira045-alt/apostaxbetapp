<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fortune Ember — Rato da Fortuna</title>

<!-- MÚSICA DE FUNDO -->
<audio id="bgMusic" loop>
    <source src="som_fundo.mp3" type="audio/mpeg">
</audio>

<style>
:root{
    --bg:#07050b; --panel:#140d19; --gold:#f3c65b; --gold2:#fff0a1;
    --text:#fff8e4; --muted:#a99aad;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; width:100%; min-height:100%; background: radial-gradient(circle at 50% 0%,#3a1b38 0%,#07050b 78%); color:white; font-family: system-ui, sans-serif; }
body{ display:flex; justify-content:center; overflow-x:hidden; }
button{ font-family:inherit; border:0; cursor:pointer; }
.game{ width:min(100%,560px); min-height:100vh; padding:10px; position:relative; }
.glow{ position:fixed; width:500px; height:500px; left:50%; top:-260px; transform:translateX(-50%); pointer-events:none; background: radial-gradient(circle, rgba(243,198,91,.25), transparent 70%); filter:blur(10px); }

/* TOPO */
.top{ height:58px; display:flex; align-items:center; justify-content:space-between; z-index:5; position:relative; }
.brand{ display:flex; align-items:center; gap:9px; }
.brand-icon{ width:43px; height:43px; border-radius:14px; display:grid; place-items:center; font-size:25px; background: linear-gradient(145deg, #fff0a0, #8d5315); box-shadow: 0 5px 20px rgba(0,0,0,.5); }
.balance{ min-width:108px; padding:7px 10px; border-radius:13px; text-align:right; background: linear-gradient(180deg, #24162b, #120b17); border:1px solid #58405f; }
.balance-label{ display:block; color:#938298; font-size:8px; }
.balance-value{ display:block; color:var(--gold2); font-size:15px; font-weight:900; }

/* TÍTULO */
.title-area{ text-align:center; padding:4px 0 10px; }
.title{ margin:0; font-size: clamp(27px, 8vw, 42px); font-weight:1000; letter-spacing:3px; text-transform:uppercase; background: linear-gradient(180deg, #fff6bc, #ad6919); -webkit-background-clip:text; color:transparent; }
.subtitle{ color:#aa99b0; font-size:9px; letter-spacing:2.5px; }

/* MÁQUINA */
.machine{ padding:8px; border-radius:27px; background: linear-gradient(145deg, #ffe17b, #100913); box-shadow: 0 20px 45px rgba(0,0,0,.65); }
.machine-inner{ padding:10px; border-radius:21px; background: linear-gradient(180deg, #29172e, #100912); }
.reels{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:8px; border-radius:18px; background:#08050b; border:1px solid #725333; position:relative; overflow:hidden; }
.reel{ height:205px; border-radius:13px; overflow:hidden; position:relative; background: linear-gradient(180deg, #100913, #2b1a31 50%, #0d0811); border:1px solid #62466c; }
.strip{ position:absolute; left:0; right:0; top:0; will-change:transform; }
.symbol{ height:68px; display:grid; place-items:center; font-size:38px; filter: drop-shadow(0 5px 7px rgba(0,0,0,.8)); }
.reel.spinning .symbol{ filter: blur(1.8px) brightness(1.15); }
.reel.win{ box-shadow: inset 0 0 25px rgba(255,210,80,.35), 0 0 24px rgba(255,210,80,.7); }
@keyframes winPulse{ from{ filter:brightness(1); } to{ filter:brightness(1.45) drop-shadow(0 0 10px gold); } }
.symbol.win-symbol{ animation: winPulse .5s ease-in-out infinite alternate; }

/* CONTROLES */
.status{ min-height:32px; display:flex; align-items:center; justify-content:center; margin-top:7px; padding:7px; border-radius:11px; background:#0b0710; border:1px solid #3b293f; font-size:10px; text-align:center; }
.main-controls{ display:grid; grid-template-columns: 1fr 1.55fr 1fr; gap:8px; margin-top:10px; }
.control-box{ min-height:61px; padding:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:15px; background: linear-gradient(180deg, #2a1931, #160c1d); border:1px solid #59405f; }
.control-label{ color:#94849c; font-size:7px; }
.control-value{ margin-top:3px; color:#ffe39a; font-size:15px; font-weight:900; }
.spin-button{ min-height:61px; border-radius:18px; background: radial-gradient(circle at 50% 18%, #fff4b0, #8c4813); color:#351407; font-size:20px; font-weight:1000; border:3px solid #fff3b0; box-shadow: 0 7px 0 #62330e; transition: transform .1s; }
.spin-button:active{ transform:translateY(5px); box-shadow: 0 2px 0 #62330e; }
.spin-button:disabled{ opacity:.55; }

.bet-panel{ margin-top:9px; padding:9px; display:flex; align-items:center; justify-content:space-between; border-radius:15px; background:#120b18; border:1px solid #3b2942; }
.bet{ min-width:47px; padding:8px; border-radius:9px; background:#21142a; border:1px solid #4a3552; color:#d8c5dd; font-size:10px; }
.bet.active{ color:#ffe99c; border-color:#dfb84e; }

.extra-controls{ margin-top:8px; display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.extra{ padding:10px; border-radius:11px; background:#17101e; border:1px solid #3d2c45; color:#c6b7cb; font-size:9px; }
.extra.active{ color:#ffe08b; border-color:#d7a83f; }

/* SUPER BÔNUS */
.super-bonus-overlay { position: fixed; inset: 0; background: rgba(255, 215, 0, 0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.super-bonus-overlay.active { display: flex; animation: bonusFlash 0.5s; }
@keyframes bonusFlash { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
.bonus-text { font-size: 40px; font-weight: 1000; color: #8B4513; text-align: center; }
.free-spins-indicator { position: absolute; top: 70px; right: 10px; background: gold; color: #8B4513; padding: 8px; border-radius: 10px; font-weight: 900; display: none; z-index: 100; }
.free-spins-indicator.active { display: block; }
</style>
</head>
<body>

<div class="game">
<div class="glow"></div>
<div class="free-spins-indicator" id="freeSpinsIndicator">🎰 <span id="freeSpinsLabel">AUTO:</span> <span id="freeSpinsCount">0</span></div>
<div class="super-bonus-overlay" id="superBonusOverlay">
    <div class="bonus-text">🏆 SUPER BÔNUS 🏆<br>10 RODADAS GRÁTIS!</div>
</div>

<header class="top">
    <div class="brand"><div class="brand-icon">🐭</div><div><div style="font-weight:1000">FORTUNE EMBER</div></div></div>
    <div class="balance"><span class="balance-label">SALDO</span><span class="balance-value" id="saldo">R$ 0,00</span></div>
</header>

<section class="title-area"><h1 class="title">RATO DA FORTUNA</h1></section>

<section class="machine">
<div class="machine-inner">
    <div class="reels" id="reels">
        <div class="reel"><div class="strip" id="r1"></div></div>
        <div class="reel"><div class="strip" id="r2"></div></div>
        <div class="reel"><div class="strip" id="r3"></div></div>
    </div>
    <div class="status" id="status">Pronto para girar</div>
</div>
</section>

<section class="main-controls">
    <div class="control-box"><span class="control-label">APOSTA</span><span class="control-value" id="betDisplay">R$ 1,00</span></div>
    <button class="spin-button" id="spinButton">GIRAR</button>
    <div class="control-box"><span class="control-label">PRÊMIO</span><span class="control-value" id="winDisplay">R$ 0,00</span></div>
</section>

<section class="bet-panel">
    <span style="color:#95849d;font-size:8px">VALOR</span>
    <div style="display:flex;gap:5px">
        <button class="bet" data-bet="0.50">0,50</button>
        <button class="bet active" data-bet="1.00">1,00</button>
        <button class="bet" data-bet="2.00">2,00</button>
    </div>
</section>

<section class="extra-controls">
    <button class="extra" id="turbo">⚡ Turbo</button>
    <button class="extra active" id="sound">🔊 Som</button>
    <button class="extra" id="respin" disabled>↻ Respin</button>
</section>

<button class="extra" id="auto10Button" style="width:100%;margin-top:8px;background:#2a1931;border-color:#f3c65b;color:#fff0a1;font-weight:bold">🔄 10x AUTO</button>

</div>

<script>
"use strict";
const CONFIG = {
    apostaInicial: 1.00,
    pesos: { "🍒": 35, "🍋": 30, "🪙": 20, "🏮": 12, "💎": 6, "🐭": 4, "🔥": 3 },
    pagamentos: { "🍒": 1.20, "🍋": 1.50, "🪙": 2.00, "🏮": 3.00, "💎": 5.00, "🐭": 8.00, "🔥": 12.00 },
    tempos: [1000, 1500, 2000] // VELOCIDADE RÁPIDA
};

const saldoEl = document.getElementById("saldo");
const betDisplay = document.getElementById("betDisplay");
const winDisplay = document.getElementById("winDisplay");
const statusEl = document.getElementById("status");
const spinButton = document.getElementById("spinButton");
const auto10Button = document.getElementById("auto10Button");
const bgMusic = document.getElementById("bgMusic");
const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
const reelBoxes = [...document.querySelectorAll(".reel")];
const freeSpinsIndicator = document.getElementById("freeSpinsIndicator");
const freeSpinsCount = document.getElementById("freeSpinsCount");
const superBonusOverlay = document.getElementById("superBonusOverlay");

let aposta = CONFIG.apostaInicial;
let girando = false;
let som = true;
let rodadasRestantes = 0;
let modoAuto = false;

function obterSaldo(){ return window.SistemaSaldo ? Number(window.SistemaSaldo.get()) || 0 : 0; }
function debitar(v){ return window.SistemaSaldo ? window.SistemaSaldo.debitar(v) : false; }
function creditar(v){ return window.SistemaSaldo ? window.SistemaSaldo.creditar(v) : false; }
function atualizarSaldoVisual(){ 
    saldoEl.textContent = Number(obterSaldo()).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    if(window.SistemaSaldo && window.SistemaSaldo.atualizarTela) window.SistemaSaldo.atualizarTela();
}

const simbolos = Object.keys(CONFIG.pesos);
function escolherSimbolo(){
    let total = simbolos.reduce((s, k) => s + CONFIG.pesos[k], 0);
    let r = Math.random() * total;
    for(let k of simbolos){ r -= CONFIG.pesos[k]; if(r <= 0) return k; }
    return simbolos[0];
}

function criarSimbolo(s){ return `<div class="symbol">${s}</div>`; }
function preencherRolo(el){ el.innerHTML = Array(18).fill(0).map(()=>criarSimbolo(escolherSimbolo())).join(""); }

function prepararResultado(el, vals){
    const extras = Array(7).fill(0).map(()=>escolherSimbolo());
    el.innerHTML = [...extras, ...vals, ...extras].map(criarSimbolo).join("");
    el.style.transition = "none";
    el.style.transform = `translateY(${-7 * 68}px)`;
}

function encontrarLinhas(res){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return linhas.filter(l => {
        const v = l.map(i => res[i]);
        const normais = v.filter(x => x !== "🔥");
        return normais.length === 0 || normais.every(x => x === normais[0]);
    });
}

function calcularPremio(res){
    let premio = 0;
    encontrarLinhas(res).forEach(l => {
        const v = l.map(i => res[i]);
        const s = v.find(x => x !== "🔥") || "🔥";
        premio += aposta * (CONFIG.pagamentos[s] || 0);
    });
    return premio;
}

function tocarSom(f, d, t="sine"){
    if(!som) return;
    try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.05, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + d);
    }catch(e){}
}

async function girar(isFreeOrAuto = false){
    if(girando) return;
    girando = true;
    spinButton.disabled = true;
    auto10Button.disabled = true;

    // Tocar música na primeira interação
    if(bgMusic.paused) bgMusic.play().catch(()=>{});

    // DESCONTO IMEDIATO
    if(!isFreeOrAuto){
        if(obterSaldo() < aposta){ statusEl.textContent = "Saldo insuficiente."; girando=false; spinButton.disabled=false; return; }
        if(!debitar(aposta)){ statusEl.textContent = "Erro ao apostar."; girando=false; spinButton.disabled=false; return; }
    } else if(isFreeOrAuto && modoAuto){
        if(!debitar(aposta)){ rodadasRestantes=0; girando=false; freeSpinsIndicator.classList.remove('active'); return; }
    }

    statusEl.textContent = modoAuto ? `AUTO (${rodadasRestantes})` : "Girando...";
    reelBoxes.forEach(r => r.classList.add("spinning"));
    tocarSom(150, 0.1, "sawtooth");

    const res = Array(9).fill(0).map(escolherSimbolo);
    const cols = [[res[0],res[3],res[6]], [res[1],res[4],res[7]], [res[2],res[5],res[8]]];
    
    reels.forEach(preencherRolo);
    
    await Promise.all(reels.map((el, i) => new Promise(resolve => {
        el.style.transition = `transform ${CONFIG.tempos[i]}ms cubic-bezier(.1,.8,.1,1)`;
        el.style.transform = `translateY(-${(11+Math.random()*5)*68}px)`;
        setTimeout(() => { prepararResultado(el, cols[i]); tocarSom(300+i*100, 0.1); resolve(); }, CONFIG.tempos[i]);
    })));

    reelBoxes.forEach(r => r.classList.remove("spinning"));
    
    const premio = calcularPremio(res);
    if(premio > 0){
        winDisplay.textContent = Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
        statusEl.textContent = `Vitória! ${Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" })}`;
        creditar(premio);
        tocarSom(600, 0.3);
    } else {
        winDisplay.textContent = "R$ 0,00";
        statusEl.textContent = modoAuto ? `Quase! (${rodadasRestantes})` : "Quase!";
    }

    // Super Bônus (3 Ratinhos)
    if(res.filter(x=>x==="🐭").length >= 3 && Math.random() < 0.02 && !isFreeOrAuto){
        superBonusOverlay.classList.add('active');
        rodadasRestantes = 10; modoAuto = false;
        freeSpinsIndicator.classList.add('active');
        setTimeout(() => { superBonusOverlay.classList.remove('active'); iniciarLoop(); }, 2000);
        girando = false; return;
    }

    atualizarSaldoVisual();
    girando = false;
    spinButton.disabled = false;
    auto10Button.disabled = false;
}

async function iniciarLoop(){
    while(rodadasRestantes > 0 && !girando){
        await new Promise(r => setTimeout(r, 1000));
        if(rodadasRestantes > 0){
            await girar(true);
            rodadasRestantes--;
            freeSpinsCount.textContent = rodadasRestantes;
        }
    }
    if(rodadasRestantes === 0){ freeSpinsIndicator.classList.remove('active'); modoAuto = false; }
}

document.querySelectorAll(".bet").forEach(b => b.onclick = () => {
    if(girando) return;
    aposta = Number(b.dataset.bet);
    document.querySelectorAll(".bet").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    betDisplay.textContent = Number(aposta).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
});

spinButton.onclick = () => girar(false);
auto10Button.onclick = () => {
    if(girando || obterSaldo() < aposta) return;
    rodadasRestantes = 10; modoAuto = true;
    freeSpinsIndicator.classList.add('active');
    iniciarLoop();
};

document.getElementById("sound").onclick = function(){
    som = !som;
    this.textContent = som ? "🔊 Som" : "🔇 Som";
    som ? bgMusic.play().catch(()=>{}) : bgMusic.pause();
};

reels.forEach(preencherRolo);
atualizarSaldoVisual();
</script>
</body>
</html>
