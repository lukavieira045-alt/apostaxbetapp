<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Mouse - Clone Premium</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .phone-frame {
            width: 360px;
            height: 720px;
            background: linear-gradient(180deg, #8B0000 0%, #4a0404 100%);
            border-radius: 30px;
            border: 8px solid #d4af37;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
            overflow: hidden;
        }

        /* Fundo decorativo */
        .bg-decoration {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, transparent 20%, #000 120%);
            z-index: 1;
        }

        .game-header {
            text-align: center;
            padding-top: 40px;
            z-index: 2;
            position: relative;
        }
        
        .logo {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .slots-container {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #ffd700;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 2;
            box-shadow: inset 0 0 20px #000;
        }

        .reel {
            width: 30%;
            height: 80%;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .reel-content {
            position: absolute;
            width: 100%;
            text-align: center;
        }

        .spin-btn {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 0 30px #ffd700;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #4a0404;
            transition: transform 0.1s;
        }

        .spin-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .info-bar {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 2;
        }

        .balance-display {
            background: rgba(0,0,0,0.8);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #ffd700;
            font-weight: bold;
        }

        /* Animação de Giro */
        @keyframes blurSpin {
            0% { filter: blur(0px); transform: translateY(0); }
            50% { filter: blur(5px); transform: translateY(-10px); }
            100% { filter: blur(0px); transform: translateY(0); }
        }

        .spinning {
            animation: blurSpin 0.1s infinite;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="bg-decoration"></div>
        
        <div class="game-header">
            <div class="logo">FORTUNE MOUSE</div>
        </div>

        <div class="slots-container">
            <div class="reel"><div class="reel-content" id="r1">🐭</div></div>
            <div class="reel"><div class="reel-content" id="r2">💰</div></div>
            <div class="reel"><div class="reel-content" id="r3">🧨</div></div>
        </div>

        <button class="spin-btn" onclick="startSpin()">GIRAR</button>

        <div class="info-bar">
            <div class="balance-display">Saldo: R$ <span id="saldo">100,00</span></div>
            <div class="balance-display">Aposta: R$ 2,00</div>
        </div>
    </div>

    <script>
        let saldo = 100.00;
        const icones = ['🐭', '💰', '🧨', '🏮', '🧧'];
        let isSpinning = false;

        function startSpin() {
            if (isSpinning || saldo < 2) return;
            
            isSpinning = true;
            saldo -= 2;
            document.getElementById('saldo').innerText = saldo.toFixed(2).replace('.', ',');
            
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            
            // Adiciona efeito de blur/velocidade
            reels.forEach(r => r.parentElement.classList.add('spinning'));

            let spins = 0;
            const interval = setInterval(() => {
                reels.forEach(r => r.innerText = icones[Math.floor(Math.random() * icones.length)]);
                spins++;
                
                if (spins > 20) {
                    clearInterval(interval);
                    finishSpin(reels);
                }
            }, 100);
        }

        function finishSpin(reels) {
            reels.forEach(r => r.parentElement.classList.remove('spinning'));
            
            // Resultado final (simulado)
            const res = [icones[0], icones[0], icones[0]]; // Força vitória do rato para teste
            
            reels[0].innerText = res[0];
            reels[1].innerText = res[1];
            reels[2].innerText = res[2];
            
            saldo += 20;
            document.getElementById('saldo').innerText = saldo.toFixed(2).replace('.', ',');
            isSpinning = false;
        }
    </script>
</body>
</html>
