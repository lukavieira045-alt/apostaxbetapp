<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fortune Mouse - Web Version</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; }
        
        .phone {
            width: 375px; height: 667px;
            background: url('https://i.imgur.com/8QJkZ9l.png') no-repeat center center; /* Fundo genérico vermelho/dourado */
            background-size: cover;
            border: 5px solid #d4af37;
            border-radius: 25px;
            position: relative;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
            overflow: hidden;
        }

        .slots-frame {
            position: absolute; top: 200px; left: 25px; right: 25px; height: 180px;
            background: rgba(0,0,0,0.6);
            border: 3px solid #ffd700;
            border-radius: 15px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px;
        }

        .reel {
            width: 30%; height: 100%;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .reel img { width: 80%; height: auto; }

        .spin-btn {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            width: 110px; height: 110px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border-radius: 50%; border: 4px solid #fff;
            box-shadow: 0 0 25px #ffd700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #5c4003; font-size: 20px;
        }

        .ui-bar {
            position: absolute; bottom: 20px; width: 90%; left: 5%;
            background: rgba(0,0,0,0.8);
            border-radius: 20px; padding: 10px;
            display: flex; justify-content: space-between; color: #ffd700; font-weight: bold;
            border: 1px solid #ffd700;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="slots-frame">
            <!-- Usando imagens placeholder da internet para simular -->
            <div class="reel"><img src="https://cdn-icons-png.flaticon.com/512/2829/2829878.png" id="r1"></div>
            <div class="reel"><img src="https://cdn-icons-png.flaticon.com/512/2454/2454269.png" id="r2"></div>
            <div class="reel"><img src="https://cdn-icons-png.flaticon.com/512/2665/2665479.png" id="r3"></div>
        </div>

        <button class="spin-btn" onclick="girar()">GIRAR</button>

        <div class="ui-bar">
            <span>Saldo: R$ <span id="saldo">100,00</span></span>
            <span>Aposta: R$ 2,00</span>
        </div>
    </div>

    <script>
        // Links de imagens públicas para teste
        const icons = [
            'https://cdn-icons-png.flaticon.com/512/2829/2829878.png', // Rato
            'https://cdn-icons-png.flaticon.com/512/2454/2454269.png', // Moeda
            'https://cdn-icons-png.flaticon.com/512/2665/2665479.png'  // Fogos
        ];
        
        let saldo = 100;

        function girar() {
            if(saldo < 2) return alert("Sem saldo!");
            saldo -= 2;
            document.getElementById('saldo').innerText = saldo.toFixed(2).replace('.', ',');
            
            const r1 = document.getElementById('r1');
            const r2 = document.getElementById('r2');
            const r3 = document.getElementById('r3');
            
            let count = 0;
            const interval = setInterval(() => {
                r1.src = icons[Math.floor(Math.random()*3)];
                r2.src = icons[Math.floor(Math.random()*3)];
                r3.src = icons[Math.floor(Math.random()*3)];
                count++;
                if(count > 15) {
                    clearInterval(interval);
                    // Resultado final
                    r1.src = icons[0]; r2.src = icons[0]; r3.src = icons[0];
                    saldo += 20;
                    document.getElementById('saldo').innerText = saldo.toFixed(2).replace('.', ',');
                }
            }, 100);
        }
    </script>
</body>
</html>
