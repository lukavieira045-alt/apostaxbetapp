<script>const syncBet=()=>{const a=document.getElementById('betAmount'),b=document.getElementById('betAmount2');if(a&&b)b.textContent=a.textContent};new MutationObserver(syncBet).observe(document.getElementById('betAmount'),{childList:true,characterData:true,subtree:true});</script>
<script>
(function(){
  const music=document.getElementById('tesouroMusic');
  if(!music)return;
  music.volume=0.32;
  let started=false;
  function startTesouroMusic(){
    if(started)return;
    started=true;
    const p=music.play();
    if(p&&p.catch)p.catch(()=>{started=false});
  }
  ['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,startTesouroMusic,{once:false,passive:true}));
})();

<script type="module">
import "../saldo.js";
const SYMBOLS=['captain','treasure','K','Q','J','A'];
const PAYOUTS={captain:1.5,parrot:1.25,chest:1.05,map:.9,compass:.8,bottle:.7,K:.6,Q:.5,J:.4,A:.3};
const A='https://commons.wikimedia.org/wiki/Special:FilePath/';
const AS={captain:A+'Captain_pirate.png',treasure:A+'Treasure_chest_with_gold_coins.svg'};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
let freeSpins=0;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function money(v){return Number(v||0).toFixed(2).replace('.',',')}
function error(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){error('Não foi possível carregar seu saldo.')}}
function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}
function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s==='treasure'?'Tesouro':'Pirata';img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='treasure'?'💰':'☠';img.parentNode?.appendChild(d)};return img}
function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cel';cell.appendChild(makeCell(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}
function setCell(cell,s){cell.innerHTML='';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s))}
function clear(){document.querySelectorAll('.cel').forEach(c=>c.classList.remove('win'))}
function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}
function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}
async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .cel');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}
async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter=''}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='5 IGUAIS NA MESMA LINHA PARA GANHAR!';ui()}}else statusText.textContent='5 IGUAIS NA MESMA LINHA PARA GANHAR!'}
async function wins(grid){
  let totalMultiplier=0;
  const winningCells=[];
  let superBonus=false;
  for(let r=0;r<ROWS;r++){
    let treasureCount=0;
    for(let c=0;c<COLS;c++){
      if(grid[c][r]==='treasure')treasureCount++; else break;
    }
    if(treasureCount>=3){
      superBonus=true;
      for(let c=0;c<treasureCount;c++)winningCells.push(document.querySelector(`#col-${c} .cel:nth-child(${r+1})`));
    }
    const first=grid[0][r];
    if(grid.every(col=>col[r]===first) && PAYOUTS[first]){
      const mult=Math.min(5*PAYOUTS[first],MAX_TOTAL_MULTIPLIER-totalMultiplier);
      if(mult>0){
        totalMultiplier+=mult;
        for(let c=0;c<COLS;c++)winningCells.push(document.querySelector(`#col-${c} .cel:nth-child(${r+1})`));
      }
    }
  }
  winningCells.filter(Boolean).forEach(c=>c.classList.add('win'));
  if(totalMultiplier>0){
    const prize=currentBet*totalMultiplier;
    prizeValue.textContent=money(prize);
    winValue.textContent=money(prize);
    winPopup.classList.add('on');
    await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);
    setTimeout(()=>winPopup.classList.remove('on'),1400);
  }else prizeValue.textContent='0,00';
  return superBonus;
}
function showSuperBonus(){
  const ov=$('superBonusOverlay');
  if(!ov)return Promise.resolve();
  ov.classList.add('on');
  return new Promise(resolve=>setTimeout(()=>{ov.classList.remove('on');resolve()},2200));
}

function buildLobbyStrip(col,finalValues){
  const strip=document.createElement('div');strip.className='lobby-strip';
  const noise=18,vals=[];for(let i=0;i<noise;i++)vals.push(random());vals.push(...finalValues);
  vals.forEach(s=>{const cell=document.createElement('div');cell.className='cel';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s));strip.appendChild(cell)});
  col.querySelectorAll(':scope > .cel').forEach(c=>c.style.visibility='hidden');col.appendChild(strip);
  const h=col.clientHeight/3;strip.style.height=(vals.length*h)+'px';[...strip.children].forEach(c=>c.style.height=h+'px');
  strip.style.transform='translate3d(0,0,0)';strip.classList.add('lobby-spinning');return {strip,h,noise};
}
function makeSpinAudio(){
  let ctx=null;
  const get=()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx};
  const tone=(freq,dur=.055,vol=.035,type='square')=>{
    try{const c=get(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}catch(e){}
  };
  return {start:(i)=>{tone(105+i*22,.07,.025,'square');const id=setInterval(()=>tone(115+i*24,.045,.018,'square'),145+i*13);return id},stop:(i,id)=>{clearInterval(id);tone(170+i*42,.12,.055,'triangle')},win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,.06,'sine'),i*90))}};
}
const spinAudio=makeSpinAudio();
async function spinOneReel(c,finalValues,index,duration,delay,noise){
  await new Promise(r=>setTimeout(r,delay));
  const col=$('col-'+c);
  const strip=document.createElement('div');strip.className='lobby-strip';
  const vals=[];for(let i=0;i<noise;i++)vals.push(random());vals.push(...finalValues);
  vals.forEach(s=>{const cell=document.createElement('div');cell.className='cel';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s));strip.appendChild(cell)});
  col.querySelectorAll(':scope > .cel').forEach(x=>x.style.visibility='hidden');
  col.appendChild(strip);
  const h=col.clientHeight/3;strip.style.height=(vals.length*h)+'px';[...strip.children].forEach(x=>x.style.height=h+'px');
  strip.style.transform='translate3d(0,0,0)';strip.classList.add('lobby-spinning');
  const soundId=spinAudio.start(index);
  await new Promise(r=>requestAnimationFrame(()=>{strip.style.transition=`transform ${duration}ms cubic-bezier(.12,.68,.16,1)`;strip.style.transform=`translate3d(0,${-(noise*h)}px,0)`;r()}));
  await new Promise(r=>setTimeout(r,duration));
  spinAudio.stop(index,soundId);
  strip.remove();
  const cells=col.querySelectorAll(':scope > .cel');
  finalValues.forEach((sym,r)=>{cells[r].innerHTML='';cells[r].classList.toggle('scatter',sym==='scatter');cells[r].appendChild(makeCell(sym));cells[r].style.visibility='visible'});
}
function playTesouroSpinSound(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=window.__tesouroAudio||(window.__tesouroAudio=new C());
    if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime;
    const master=ctx.createGain();
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.58,now+0.025);
    master.gain.exponentialRampToValueAtTime(0.0001,now+2.7);
    const filter=ctx.createBiquadFilter();
    filter.type='bandpass';filter.frequency.setValueAtTime(950,now);filter.Q.value=0.7;
    const osc=ctx.createOscillator();
    osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);
    osc.frequency.exponentialRampToValueAtTime(620,now+2.4);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=12;lg.gain.value=130;
    lfo.connect(lg);lg.connect(osc.frequency);
    osc.connect(filter);filter.connect(master);master.connect(ctx.destination);
    osc.start(now);lfo.start(now);osc.stop(now+2.75);lfo.stop(now+2.75);
  }catch(e){}
}

async function lobbySpin(){
  playTesouroSpinSound();
  if(isSpinning)return;await balance();
  const usingFreeSpin=freeSpins>0;
  if(!usingFreeSpin && realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}
  if(!usingFreeSpin){const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);}
  ui();clear();winPopup.classList.remove('on');prizeValue.textContent='0,00';
  isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();
  const finalGrid=[];
  for(let c=0;c<COLS;c++){const vals=[];for(let r=0;r<ROWS;r++)vals.push(random());finalGrid.push(vals)}
  const base=turbo?980:2050;
  const step=turbo?115:170;
  const tasks=[];
  for(let c=0;c<COLS;c++){
    const duration=base+c*step;
    const delay=c*(turbo?55:90);
    const noise=16+c*2;
    tasks.push(spinOneReel(c,finalGrid[c],c,duration,delay,noise));
  }
  await Promise.all(tasks);
  const gotSuperBonus=await wins(finalGrid);isSpinning=false;await balance();ui();
  if(gotSuperBonus&&!usingFreeSpin){
    freeSpins=10;
    statusText.textContent='SUPER BÔNUS: 10 RODADAS GRÁTIS';
    await showSuperBonus();
    setTimeout(lobbySpin,180);
    return;
  }
  if(usingFreeSpin){
    freeSpins--;
    statusText.textContent=freeSpins>0?`RODADA GRÁTIS — ${freeSpins} RESTANTES`:'FIM DO SUPER BÔNUS';
    if(freeSpins>0)setTimeout(lobbySpin,420);
    return;
  }
  if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(lobbySpin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='5 IGUAIS NA MESMA LINHA PARA GANHAR!';ui()}}else statusText.textContent='5 IGUAIS NA MESMA LINHA PARA GANHAR!';
}
spinBtn.onclick=lobbySpin;

minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=lobbySpin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';lobbySpin()};
async function startLoading(){
  const screen=$('ax-loading-screen'),bar=$('ax-loading-bar'),pct=$('ax-loading-percent');
  if(!screen)return;
  let n=0;
  await new Promise(resolve=>{const t=setInterval(()=>{n=Math.min(100,n+4);bar.style.width=n+'%';pct.textContent=n+'%';if(n>=100){clearInterval(t);setTimeout(resolve,250)}},55)});
  screen.classList.add('hide');
  setTimeout(()=>screen.remove(),450);
}
async function start(){init();ui();startLoading();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();
</script>
