<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
:root{--gold:#ffd45a;--gold2:#a96813;--wood:#241207;--dark:#06090b;--text:#fff3cf;--red:#8d1d16}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{min-height:100vh;padding:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(2,7,10,.70),rgba(2,5,8,.94)),url('../jogos/tesouro-pirata.png') center/cover fixed no-repeat;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 8%,rgba(255,211,91,.18),transparent 30%),linear-gradient(180deg,transparent,rgba(0,0,0,.35));z-index:-1}
.game-wrapper{width:100%;max-width:760px;padding:10px;border:3px solid #c79635;border-radius:22px;background:linear-gradient(180deg,rgba(66,38,18,.98),rgba(12,7,4,.99));box-shadow:0 0 0 2px rgba(255,215,0,.12),0 20px 60px #000, inset 0 0 35px #000;position:relative}
.game-wrapper:before{content:"⚓  •  TESOURO PIRATA  •  ⚓";display:block;text-align:center;color:#ffe6a2;font-size:9px;font-weight:900;letter-spacing:3px;padding:2px 0 8px;text-shadow:0 2px 5px #000}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin-bottom:9px;border:1px solid #c79635;border-bottom:2px solid #e1b94e;border-radius:14px;background:linear-gradient(#11110f,#020202);box-shadow:inset 0 1px #ffffff14,0 6px 18px #0009}
.balance-display{background:linear-gradient(#1a150c,#050505);border:1px solid #d3a23b;padding:7px 10px;border-radius:10px;font-weight:900;color:var(--gold);white-space:nowrap;box-shadow:inset 0 0 12px #000}
.game-title{color:#ffd85f;font-size:clamp(16px,4vw,24px);font-weight:1000;letter-spacing:2px;text-align:right;text-shadow:0 2px #6a3d00,0 0 16px #ffbd0048,2px 3px 5px #000}
.reels-container{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:linear-gradient(#030506,#160b05);padding:8px;border:3px solid #704a27;border-radius:15px;box-shadow:inset 0 0 30px #000,0 0 0 1px #ffd70022,0 9px 20px #000a}
.reel-col{display:flex;flex-direction:column;gap:5px}
.symbol-cell{height:82px;background:radial-gradient(circle at 50% 25%,#ffffff16,transparent 40%),linear-gradient(#28343a,#090c0f);border:1px solid #756044;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:2.35em;text-shadow:2px 3px 5px #000;transition:.15s;box-shadow:inset 0 1px #ffffff12,inset 0 -10px 16px #0008}
.symbol-cell.spinning{filter:blur(2px);opacity:.7;transform:scaleY(.92)}
.symbol-cell.winner{background:radial-gradient(circle,#fff9a6 0%,#ffc928 43%,#8e4500 100%);border-color:#fff0a0;animation:pulseWin .55s infinite alternate;z-index:10;box-shadow:0 0 12px #ffd21f,0 0 30px #ffae00aa,inset 0 0 18px #fff9}
@keyframes pulseWin{from{transform:scale(1)}to{transform:scale(1.10)}}
.info-text{text-align:center;color:#d9c49a;font-size:10px;letter-spacing:.6px;padding:5px 2px}
.controls-panel{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px;margin-top:3px;border:1px solid #d6a83e66;border-top:2px solid #d6a83e;border-radius:14px;background:linear-gradient(#080808f5,#180d07f5);box-shadow:inset 0 1px #ffffff0c,0 8px 18px #0009}
.bet-adjuster{display:flex;align-items:center;gap:6px;background:linear-gradient(#17120d,#050505);padding:5px 7px;border-radius:9px;border:1px solid #705a39}
.btn-small{background:linear-gradient(#3d352a,#15110d);border:1px solid #816d50;color:#fff;width:34px;height:34px;border-radius:7px;cursor:pointer;font-weight:900;box-shadow:inset 0 1px #fff1}
.btn-small:active{transform:scale(.94)}
.current-bet{color:var(--gold);font-weight:900;min-width:65px;text-align:center}
.spin-button{min-width:150px;background:linear-gradient(#f4cd59,#b9790d 52%,#683703);border:2px solid #ffe28d;color:#1d1103;padding:12px 30px;border-radius:9px;font-weight:1000;cursor:pointer;font-size:1.15em;box-shadow:0 4px #482401,0 0 20px #ffb70022,inset 0 1px #fff3b0;text-shadow:0 1px #ffffff55}
.spin-button:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.spin-button:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.win-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 50% 20%,#68420df8,#030303fa 68%);border:3px solid var(--gold);padding:24px 38px;border-radius:15px;z-index:100;text-align:center;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 0 45px #ffc00055,inset 0 0 25px #000}
.win-popup.active{transform:translate(-50%,-50%) scale(1);opacity:1}
.win-popup h2{margin:0;color:#ffd957;font-size:2em;text-shadow:0 0 12px #ffd000}
.win-popup p{margin:5px 0 0;font-size:1.5em;font-weight:900}
.error-message{display:none;text-align:center;color:#ff9b9b;background:#300;border:1px solid #f44;border-radius:7px;padding:8px;margin-bottom:9px}
@media(max-width:500px){body{padding:4px}.game-wrapper{padding:7px;border-width:2px;border-radius:17px}.game-wrapper:before{font-size:8px;letter-spacing:1.5px}.header{padding:8px;flex-direction:column}.game-title{text-align:center;font-size:1.05em}.balance-display{font-size:.9em}.symbol-cell{height:59px;font-size:1.8em}.controls-panel{flex-wrap:wrap;justify-content:center}.spin-button{min-width:135px;padding:10px 24px;font-size:1.05em}}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="header"><div class="balance-display">SALDO: R$ <span id="balance">0,00</span></div><div class="game-title">🏴‍☠️ TESOURO PIRATA</div></div>
<div id="errorMessage" class="error-message"></div>
<div class="reels-container" id="reelsGrid"></div>
<div class="info-text">3+ SÍMBOLOS IGUAIS • 25 LINHAS DE PAGAMENTO</div>
<div class="controls-panel">
<div class="bet-adjuster"><button class="btn-small" id="minusBtn">−</button><div class="current-bet">R$ <span id="betAmount">1,00</span></div><button class="btn-small" id="plusBtn">+</button></div>
<button class="spin-button" id="spinBtn">GIRAR</button>
<button class="btn-small" id="maxBtn" style="width:auto;padding:0 10px">MAX</button>
</div>
<div class="win-popup" id="winPopup"><h2>VITÓRIA!</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
</div>
<script type="module">
import "../saldo.js";
const SYMBOLS=['🏴‍☠️','🦜','💰','🗺️','⚓','🧭','K','Q','J','A'];
/* Faixa de pagamento equilibrada. 3/4/5 símbolos = base x1/x2/x3. */
const PAYOUTS={'🏴‍☠️':1.50,'🦜':1.25,'💰':1.05,'🗺️':0.90,'⚓':0.80,'🧭':0.70,'K':0.60,'Q':0.50,'J':0.40,'A':0.30};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0;
const balanceEl=document.getElementById('balance'),betEl=document.getElementById('betAmount'),spinBtn=document.getElementById('spinBtn'),minusBtn=document.getElementById('minusBtn'),plusBtn=document.getElementById('plusBtn'),maxBtn=document.getElementById('maxBtn'),reelsGrid=document.getElementById('reelsGrid'),errorMessage=document.getElementById('errorMessage'),winPopup=document.getElementById('winPopup'),winValue=document.getElementById('winValue');
function formatMoney(v){return Number(v||0).toFixed(2).replace('.',',')}
function showError(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function updateRealBalance(){try{if(!window.SistemaSaldo||typeof window.SistemaSaldo.get!=='function'){realBalance=0;balanceEl.textContent='0,00';showError('Sistema de saldo não carregado.');return}realBalance=await window.SistemaSaldo.get();balanceEl.textContent=formatMoney(realBalance);updateUI()}catch(e){console.error(e);realBalance=0;balanceEl.textContent='0,00';showError('Não foi possível carregar seu saldo.')}}
function updateUI(){betEl.textContent=formatMoney(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}
function adjustBet(v){if(isSpinning)return;currentBet=Math.max(1,Math.min(100,currentBet+v));updateUI()}
function setMaxBet(){if(isSpinning)return;currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));updateUI()}
function getRandomSymbol(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function initGame(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='reel-col';col.id=`col-${c}`;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='symbol-cell';cell.textContent=getRandomSymbol();col.appendChild(cell)}reelsGrid.appendChild(col)}}
function clearHighlights(){document.querySelectorAll('.symbol-cell').forEach(c=>c.classList.remove('winner'))}
function highlightWinners(indices){indices.forEach(i=>{const col=document.getElementById(`col-${Math.floor(i/ROWS)}`);if(col&&col.children[i%ROWS])col.children[i%ROWS].classList.add('winner')})}
async function spin(){if(isSpinning)return;await updateRealBalance();if(realBalance<currentBet){showError('❌ Saldo insuficiente para esta aposta.');return}const debitoOK=await window.SistemaSaldo.debitar(currentBet);if(!debitoOK){await updateRealBalance();return}realBalance=Math.max(0,realBalance-currentBet);updateUI();clearHighlights();hideWinPopup();isSpinning=true;updateUI();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll(`#col-${c} .symbol-cell`);reels.push(cells);cells.forEach(x=>x.classList.add('spinning'))}let count=0;const animation=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)reels[c][r].textContent=getRandomSymbol();if(++count>=30){clearInterval(animation);finalizeSpin(reels)}},60)}
async function finalizeSpin(reels){const finalGrid=[];for(let c=0;c<COLS;c++){const result=[];for(let r=0;r<ROWS;r++){const s=getRandomSymbol();result.push(s);reels[c][r].textContent=s;reels[c][r].classList.remove('spinning')}finalGrid.push(result)}await checkWins(finalGrid);isSpinning=false;await updateRealBalance();updateUI()}
async function checkWins(grid){let totalMultiplier=0;const winningCells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let matches=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)matches++;else break}if(matches>=3&&PAYOUTS[fs]){totalMultiplier+=PAYOUTS[fs]*(matches-2);for(let i=0;i<matches;i++)winningCells.add(line[i])}});if(totalMultiplier<=0)return;totalMultiplier=Math.min(totalMultiplier,MAX_TOTAL_MULTIPLIER);const ganhoReal=await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);if(ganhoReal&&ganhoReal>0){showWinPopup(ganhoReal);highlightWinners(winningCells)}}
function showWinPopup(v){winValue.textContent=formatMoney(v);winPopup.classList.add('active');setTimeout(hideWinPopup,2200)}
function hideWinPopup(){winPopup.classList.remove('active')}
minusBtn.addEventListener('click',()=>adjustBet(-1));plusBtn.addEventListener('click',()=>adjustBet(1));maxBtn.addEventListener('click',setMaxBet);spinBtn.addEventListener('click',spin);
async function startGame(){initGame();updateUI();let attempts=0;while(!window.SistemaSaldo&&attempts<50){await new Promise(r=>setTimeout(r,50));attempts++}if(!window.SistemaSaldo){showError('Erro ao carregar o sistema de saldo.');return}await updateRealBalance()}
startGame();
</script>
</body>
</html>
