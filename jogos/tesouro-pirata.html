<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}

.title h1{margin:0;color:#ffdf69;font:900 clamp(27px,4vw,47px)/1 Georgia,serif;letter-spacing:2px;text-shadow:0 3px #602708,0 5px 7px #000,0 0 16px #f7a900}

.line{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,#fff6a6,#e3aa2e 40%,#71400b 75%,#261003);border:2px solid #f4d46e;color:#fff;font-size:11px;font-weight:1000;text-shadow:0 2px 2px #000;box-shadow:0 2px 5px #000}.line.hot{background:radial-gradient(circle,#ffdf68,#b92b12 48%,#450903);border-color:#ff9b45}
.machine{position:relative;width:min(1115px,100%);height:100%;padding:14px 17px 17px;background:linear-gradient(90deg,#160803,#5a2c0d 2%,#b1762c 4%,#e1b34e 5%,#6e3d12 7%,#281409 9%,#0a1213 11%,#071014 50%,#0a1213 89%,#281409 91%,#6e3d12 93%,#e1b34e 95%,#b1762c 96%,#5a2c0d 98%,#160803);border:7px solid #2a1206;border-radius:10px;box-shadow:0 0 0 2px #e3bd61,0 0 0 6px #311406,0 18px 35px #000,inset 0 0 35px #000}
.machine:before,.machine:after{content:"";position:absolute;top:7px;bottom:7px;width:35px;background:linear-gradient(90deg,#271106,#85501c 22%,#c18b39 35%,#6a3c13 60%,#2a1105);border:2px solid #e0b35a;box-shadow:inset 0 0 12px #000}.machine:before{left:-7px}.machine:after{right:-7px}
.machineTop{position:absolute;left:10%;right:10%;top:-13px;height:17px;background:linear-gradient(#d7a94d,#684017,#271006);border:2px solid #e4c168;border-radius:4px;box-shadow:0 3px 0 #160702;z-index:6}
.reelWindow{position:relative;width:100%;height:100%;overflow:hidden;border:6px solid #180a04;background:#030607;box-shadow:inset 0 0 35px #000,0 3px 0 #000}
.reelWindow:before{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;border:2px solid #d7ae56;box-shadow:inset 0 0 16px #000}
.reelWindow:after{content:"";position:absolute;left:0;right:0;top:0;height:13%;z-index:21;pointer-events:none;background:linear-gradient(rgba(255,255,255,.11),transparent)}
.rolos{height:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#090604}
.col{display:grid;grid-template-rows:repeat(3,1fr);background:linear-gradient(90deg,#050505,#1d1209 50%,#050505);border-right:2px solid #795022;position:relative}.col:last-child{border-right:0}.col:after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:#f0c65b55}

.letra{font:900 clamp(48px,6vw,82px)/1 Georgia,serif;text-shadow:0 4px 2px #000,0 0 10px #000}.K{color:#5fc5ff}.Q{color:#4bdf74}.J{color:#c85cff}.A{color:#ef4545}
.scatter{border:3px solid #d9ae45;background:radial-gradient(circle,#765018,#271004 67%);box-shadow:inset 0 0 30px #e9a900,0 0 18px #e0a30055}.scatter:after{content:'SCATTER';position:absolute;left:13%;right:13%;bottom:5px;text-align:center;background:linear-gradient(#b92b18,#5c0b07);border:1px solid #e9b955;padding:3px;color:#fff;font-size:9px;font-weight:1000;letter-spacing:1.2px;text-shadow:0 1px #000}
.win{animation:win .4s infinite alternate;z-index:30}@keyframes win{to{transform:scale(1.06);filter:brightness(1.7);box-shadow:inset 0 0 28px #ffd321,0 0 27px #ffc000}}
.erro{display:none;position:absolute;top:25px;left:50%;transform:translateX(-50%);z-index:60;padding:9px 18px;background:#650d0b;border:2px solid #ff9c77;border-radius:5px;font-weight:900}.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.65);opacity:0;z-index:70;min-width:330px;padding:30px 45px;text-align:center;background:radial-gradient(circle,#b98324,#5b350d 45%,#100703 80%);border:4px solid #f6d15e;border-radius:9px;box-shadow:0 0 0 2px #5d370b,0 0 70px #ffc400aa;transition:.22s}.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1}.pop h2{margin:0;color:#ffdf62;font:900 32px Georgia,serif;text-shadow:0 3px #632707}.pop p{margin:9px 0 0;font-size:28px;font-weight:1000}
.bottom{position:relative;display:grid;grid-template-columns:270px 1fr 520px;align-items:center;gap:12px;padding:8px 18px;background:linear-gradient(#182126,#0a1115 48%,#030607);border-top:5px solid #9a6b28;box-shadow:0 -8px 25px #000,inset 0 1px #fff2;z-index:8}
.bottom:before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:linear-gradient(90deg,transparent,#f4d16a 20%,#fff 50%,#f4d16a 80%,transparent);opacity:.35}
.leftPanel{display:flex;align-items:center;gap:7px}.round{width:42px;height:42px;border-radius:50%;border:2px solid #a27a3a;background:radial-gradient(circle at 35% 25%,#48565a,#141c1f 60%,#050708);color:#fff;font-weight:1000;box-shadow:inset 0 1px #fff4,0 4px 8px #000}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:7px 10px;background:linear-gradient(#0e1518,#05090b);border:1px solid #73552b;border-radius:4px;min-width:180px}.stat small{display:block;color:#a9a9a9;font-size:8px;letter-spacing:1px}.stat b{display:block;color:#f4d36c;font-size:14px;margin-top:2px}.center{text-align:center}.hold{font-size:10px;font-weight:1000;color:#e9d9a5;letter-spacing:.6px;text-shadow:0 2px 3px #000}.winbar{font-size:25px;font-weight:1000;text-shadow:0 2px 4px #000;margin-top:3px}.winbar span{color:#ffd958}.controls{display:flex;align-items:center;justify-content:flex-end;gap:8px}.bet{display:flex;align-items:center;gap:5px}.betvalue{text-align:center;min-width:68px}.betvalue small{display:block;color:#9d9d9d;font-size:8px;letter-spacing:1px}.betvalue b{color:#ffe17a;font-size:14px}.spin{width:78px;height:78px;border-radius:50%;border:5px solid #e5ffe8;background:radial-gradient(circle at 32% 18%,#91ff9f,#2ccf5d 38%,#0d7d35 67%,#03451d);color:#fff;font-size:14px;font-weight:1000;box-shadow:0 6px #022f10,0 0 30px #22df6288,inset 0 2px 7px #fff9}.spin:disabled{opacity:.45;filter:grayscale(1)}.auto{height:42px;min-width:70px;border-radius:5px;border:2px solid #96794d;background:linear-gradient(#414a4d,#101619);color:#fff;font-weight:1000;box-shadow:inset 0 1px #fff3}.max{width:52px!important}.ativa{background:linear-gradient(#30e267,#087b2e)!important;border-color:#baffc4!important}
@media(max-width:760px){.casino{height:100vh;grid-template-rows:59px minmax(0,1fr) 91px}.top{grid-template-columns:1fr 2fr 1fr;padding:2px 8px}.top:before,.top:after{width:7px}.jack{display:none}.title{height:51px;width:92vw;border-width:3px;border-radius:6px 6px 17px 17px}.title:before,.title:after{width:30px;height:13px;top:17px}.title h1{font-size:19px}.title .sk{font-size:18px;margin:0 7px}.lantern{top:43px;transform:scale(.65)}.lantern.left{left:7px}.lantern.right{right:7px}.stage{padding:0 8px 3px}.side{display:none}.machine{padding:6px 7px 8px;border-width:4px}.machine:before,.machine:after{width:14px}.machineTop{display:none}.reelWindow{border-width:3px}.col{border-right-width:1px}.cel{border-bottom-width:1px}.cel img{width:95%;height:95%}.letra{font-size:30px}.bottom{grid-template-columns:1fr 74px 1fr;gap:3px;padding:4px 4px}.leftPanel{gap:2px}.leftPanel>.round{width:30px;height:30px;font-size:10px}.stats{display:none}.hold{font-size:7px;line-height:10px}.winbar{font-size:15px;line-height:18px}.controls{gap:2px}.bet{gap:2px}.bet .round{width:29px;height:29px}.betvalue{min-width:42px}.betvalue small{font-size:6px}.betvalue b{font-size:9px}.max{width:34px!important;font-size:7px}.spin{width:62px;height:62px;font-size:11px;border-width:4px}.auto{min-width:45px;height:30px;font-size:7px;padding:0 3px}.pop{min-width:245px;padding:22px 25px}.pop h2{font-size:25px}.pop p{font-size:22px}}
@media(max-width:390px){.casino{grid-template-rows:54px minmax(0,1fr) 86px}.title{height:47px}.title h1{font-size:17px}.bottom{grid-template-columns:1fr 67px 1fr}.spin{width:56px;height:56px}.auto{min-width:40px}.winbar{font-size:13px}}
</style>
</head>
<body>
<div class="casino">
  <div class="top">
    <div class="jack"><small>MAJOR</small><b>R$ 8.000</b></div>
    <div class="title"><span class="sk">☠</span><h1>TESOURO PIRATA</h1><span class="sk">☠</span></div>
    <div class="jack"><small>GRAND</small><b>R$ 40.000</b></div>
    <div class="lantern left"></div><div class="lantern right"></div>
  </div>
  <div class="stage">
    <div class="side left"><span class="line">1</span><span class="line">2</span><span class="line hot">3</span><span class="line">4</span><span class="line">5</span></div>
    <div class="side right"><span class="line">25</span><span class="line">24</span><span class="line hot">23</span><span class="line">22</span><span class="line">21</span></div>
    <div id="errorMessage" class="erro"></div>
    <div class="machine">
      <div class="machineTop"></div>
      <div class="reelWindow"><div id="reelsGrid" class="rolos"></div></div>
    </div>
    <div class="pop" id="winPopup"><h2>TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
  </div>
  <div class="bottom">
    <div class="leftPanel"><button class="round">☰</button><button class="round">i</button><div class="stats"><div class="stat"><small>CREDIT</small><b>R$ <span id="balance">0,00</span></b></div><div class="stat"><small>BET</small><b>R$ <span id="betAmount">1,00</span></b></div></div></div>
    <div class="center"><div class="hold" id="statusText">ENCONTRE 3 OU MAIS ☠ PARA GANHAR!</div><div class="winbar">WIN <span>R$ <b id="prizeValue">0,00</b></span></div></div>
    <div class="controls"><div class="bet"><button class="round" id="minusBtn">−</button><div class="betvalue"><small>APOSTA</small><b>R$ <span id="betAmount2">1,00</span></b></div><button class="round" id="plusBtn">+</button><button class="round max" id="maxBtn">MAX</button></div><button class="spin" id="spinBtn">GIRAR</button><button class="auto" id="turboBtn">⚡ TURBO</button><button class="auto" id="autoBtn">AUTO <span id="autoCount">10</span></button></div>
  </div>
</div>
<script>const syncBet=()=>{const a=document.getElementById('betAmount'),b=document.getElementById('betAmount2');if(a&&b)b.textContent=a.textContent};new MutationObserver(syncBet).observe(document.getElementById('betAmount'),{childList:true,characterData:true,subtree:true});</script>
<script type="module">
import "../saldo.js";
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];const PAYOUTS={captain:1.5,parrot:1.25,chest:1.05,map:.9,compass:.8,bottle:.7,K:.6,Q:.5,J:.4,A:.3};const A='https://commons.wikimedia.org/wiki/Special:FilePath/';const AS={captain:A+'Captain_pirate.png',ship:A+'Pirate_ship_-_Pirates_(1922).png',chest:A+'Treasure_chest_with_gold_coins.svg',bottle:A+'Glass_bottle.jpg',compass:A+'Negus_liquid_compass.png',map:A+'Treasuremap.jpg',cannon:A+'Cannon_model.png',parrot:A+'Parrot_standard.png',scatter:A+'Skull_and_Crossbones.png'};const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');function money(v){return Number(v||0).toFixed(2).replace('.',',')}function error(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){error('Não foi possível carregar seu saldo.')}}function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cel';cell.appendChild(makeCell(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}function setCell(cell,s){cell.innerHTML='';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s))}function clear(){document.querySelectorAll('.cel').forEach(c=>c.classList.remove('win'))}function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .cel');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter=''}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!'}async function wins(grid){let mult=0;const cells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let m=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)m++;else break}if(m>=3&&PAYOUTS[fs]){mult+=PAYOUTS[fs]*(m-2);for(let i=0;i<m;i++)cells.add(line[i])}});if(mult<=0){prizeValue.textContent='0,00';return}mult=Math.min(mult,MAX_TOTAL_MULTIPLIER);const ganho=await window.SistemaSaldo.processarVitoria(currentBet,mult);if(ganho&&ganho>0){prizeValue.textContent=money(ganho);winValue.textContent=money(ganho);winPopup.classList.add('on');setTimeout(()=>winPopup.classList.remove('on'),2200);cells.forEach(i=>$('col-'+Math.floor(i/ROWS))?.children[i%ROWS]?.classList.add('win'));statusText.textContent='TESOURO ENCONTRADO!'}}minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';spin()};async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();</script>
