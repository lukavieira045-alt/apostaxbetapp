<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Tesouro Pirata — ApostaXBet</title>

<style>
:root{
    --gold:#ffd700;
    --dark-wood:#2a1b0d;
    --win:#ffeb3b;
}

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top,#315b6d 0%,#172f39 45%,#081318 100%);
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
}

.game-wrapper{
    width:100%;
    max-width:700px;
    background:linear-gradient(#3b2614,#211308);
    border:4px solid var(--gold);
    border-radius:15px;
    box-shadow:
        0 0 40px rgba(0,0,0,.9),
        inset 0 0 20px rgba(0,0,0,.7);
    padding:15px;
    position:relative;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 15px;
    background:rgba(0,0,0,.65);
    border-bottom:2px solid var(--gold);
    margin-bottom:15px;
    border-radius:8px;
}

.balance-display{
    background:#000;
    border:1px solid var(--gold);
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
    color:var(--gold);
    white-space:nowrap;
}

.game-title{
    color:var(--gold);
    font-size:1.35em;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:2px 2px 4px #000;
    text-align:right;
}

.reels-container{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    background:#000;
    padding:10px;
    border:3px solid #65452c;
    border-radius:8px;
    box-shadow:inset 0 0 15px #000;
}

.reel-col{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.symbol-cell{
    height:80px;
    background:linear-gradient(#34495e,#151d24);
    border:1px solid #555;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.7em;
    text-shadow:2px 2px 4px #000;
    transition:.15s;
}

.symbol-cell.spinning{
    filter:blur(2px);
    opacity:.65;
    transform:scaleY(.9);
}

.symbol-cell.winner{
    background:radial-gradient(circle,#fff76b,#f4a900);
    border-color:#fff;
    animation:pulseWin .55s infinite alternate;
    z-index:10;
}

@keyframes pulseWin{
    from{
        transform:scale(1);
        box-shadow:0 0 10px var(--gold);
    }
    to{
        transform:scale(1.12);
        box-shadow:0 0 28px var(--gold);
    }
}

.info-text{
    font-size:.78em;
    color:#aaa;
    text-align:center;
    margin:10px 0;
}

.controls-panel{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    background:rgba(0,0,0,.85);
    border-radius:8px;
    border-top:2px solid var(--gold);
}

.bet-adjuster{
    display:flex;
    align-items:center;
    gap:7px;
    background:#111;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid #555;
}

.btn-small{
    background:#333;
    border:1px solid #777;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn-small:active{
    transform:scale(.94);
}

.current-bet{
    color:var(--gold);
    font-weight:bold;
    min-width:65px;
    text-align:center;
}

.spin-button{
    background:linear-gradient(#4caf50,#2e7d32);
    border:2px solid #81c784;
    color:#fff;
    padding:12px 35px;
    border-radius:8px;
    font-weight:900;
    cursor:pointer;
    font-size:1.2em;
    box-shadow:0 4px 0 #1b5e20;
}

.spin-button:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:none;
}

.spin-button:disabled{
    filter:grayscale(1);
    opacity:.55;
    cursor:not-allowed;
}

.win-popup{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:rgba(0,0,0,.96);
    border:3px solid var(--gold);
    padding:25px 40px;
    border-radius:12px;
    z-index:100;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.win-popup.active{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
}

.win-popup h2{
    margin:0;
    color:var(--gold);
    font-size:2em;
    text-shadow:0 0 10px var(--gold);
}

.win-popup p{
    margin:5px 0 0;
    font-size:1.5em;
}

.error-message{
    display:none;
    text-align:center;
    color:#ff7777;
    background:#300;
    border:1px solid #f00;
    border-radius:6px;
    padding:8px;
    margin-bottom:10px;
}

@media(max-width:500px){

    body{
        padding:5px;
    }

    .game-wrapper{
        border-width:2px;
        padding:8px;
    }

    .header{
        padding:8px;
        flex-direction:column;
    }

    .game-title{
        font-size:1em;
        text-align:center;
    }

    .balance-display{
        font-size:.9em;
    }

    .symbol-cell{
        height:58px;
        font-size:1.9em;
    }

    .controls-panel{
        flex-wrap:wrap;
        justify-content:center;
    }

    .spin-button{
        padding:10px 25px;
        font-size:1.05em;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <div class="header">

        <div class="balance-display">
            SALDO:
            R$ <span id="balance">0,00</span>
        </div>

        <div class="game-title">
            🏴‍☠️ TESOURO PIRATA
        </div>

    </div>

    <div id="errorMessage" class="error-message"></div>

    <div class="reels-container" id="reelsGrid"></div>

    <div class="info-text">
        ENCONTRE 3+ SÍMBOLOS IGUAIS NAS LINHAS
        • 25 LINHAS DE PAGAMENTO
    </div>

    <div class="controls-panel">

        <div class="bet-adjuster">

            <button class="btn-small"
                    id="minusBtn">−</button>

            <div class="current-bet">
                R$ <span id="betAmount">1,00</span>
            </div>

            <button class="btn-small"
                    id="plusBtn">+</button>

        </div>

        <button class="spin-button"
                id="spinBtn">
            GIRAR
        </button>

        <button class="btn-small"
                id="maxBtn"
                style="width:auto;padding:0 10px;">
            MAX
        </button>

    </div>

    <div class="win-popup" id="winPopup">

        <h2>VITÓRIA!</h2>

        <p>
            + R$
            <span id="winValue">0,00</span>
        </p>

    </div>

</div>


<script type="module">

/*
=========================================================
TESOURO PIRATA — APOSTAXBET
SALDO REAL
=========================================================

O saldo NÃO é criado neste jogo.

O jogo utiliza:

../saldo.js

através de:

window.SistemaSaldo

Não alterar o sistema de saldo.
=========================================================
*/

import "../saldo.js";


/* ======================================================
   CONFIGURAÇÕES
====================================================== */

const SYMBOLS = [
    '🏴‍☠️',
    '🦜',
    '💰',
    '🗺️',
    '⚓',
    '🧭',
    'K',
    'Q',
    'J',
    'A'
];


/*
Multiplicadores base.

3 símbolos:
multiplicador normal

4 símbolos:
multiplicador x2

5 símbolos:
multiplicador x3

O SistemaSaldo aplica a vantagem da casa
já definida no saldo.js.
*/

const PAYOUTS = {

    '🏴‍☠️': 50,
    '🦜': 30,
    '💰': 20,
    '🗺️': 15,
    '⚓': 10,
    '🧭': 8,
    'K': 5,
    'Q': 4,
    'J': 3,
    'A': 2

};


const ROWS = 3;
const COLS = 5;


/*
25 linhas.

Cada número representa:

coluna * 3 + linha

Portanto:

0 = coluna 0 linha 0
1 = coluna 0 linha 1
2 = coluna 0 linha 2

3 = coluna 1 linha 0
...
14 = coluna 4 linha 2
*/

const PAYLINES = [

    // 1 — linha superior
    [0,3,6,9,12],

    // 2 — linha central
    [1,4,7,10,13],

    // 3 — linha inferior
    [2,5,8,11,14],

    // 4
    [0,4,8,10,12],

    // 5
    [2,4,6,10,14],

    // 6
    [0,3,7,11,14],

    // 7
    [2,5,7,9,12],

    // 8
    [0,4,7,10,14],

    // 9
    [2,4,7,10,12],

    // 10
    [0,3,7,9,12],

    // 11
    [2,5,7,11,14],

    // 12
    [0,4,6,10,14],

    // 13
    [2,4,8,10,12],

    // 14
    [0,3,8,11,14],

    // 15
    [2,5,6,9,12],

    // 16
    [0,4,8,11,12],

    // 17
    [2,4,6,9,14],

    // 18
    [0,3,7,10,14],

    // 19
    [2,5,7,10,12],

    // 20
    [0,4,7,9,14],

    // 21
    [2,4,7,11,12],

    // 22
    [0,3,6,10,14],

    // 23
    [2,5,8,10,12],

    // 24
    [0,4,8,9,14],

    // 25
    [2,4,6,11,12]

];


/* ======================================================
   ESTADO DO JOGO
====================================================== */

let currentBet = 1.00;

let isSpinning = false;

let realBalance = 0;


/* ======================================================
   ELEMENTOS
====================================================== */

const balanceEl =
    document.getElementById('balance');

const betEl =
    document.getElementById('betAmount');

const spinBtn =
    document.getElementById('spinBtn');

const minusBtn =
    document.getElementById('minusBtn');

const plusBtn =
    document.getElementById('plusBtn');

const maxBtn =
    document.getElementById('maxBtn');

const reelsGrid =
    document.getElementById('reelsGrid');

const errorMessage =
    document.getElementById('errorMessage');

const winPopup =
    document.getElementById('winPopup');

const winValue =
    document.getElementById('winValue');


/* ======================================================
   FORMATAÇÃO
====================================================== */

function formatMoney(value){

    return Number(value || 0)
        .toFixed(2)
        .replace('.',',');

}


/* ======================================================
   MENSAGEM DE ERRO
====================================================== */

function showError(message){

    errorMessage.textContent = message;

    errorMessage.style.display = 'block';

    setTimeout(() => {

        errorMessage.style.display = 'none';

    },4000);

}


/* ======================================================
   ATUALIZAR SALDO REAL
====================================================== */

async function updateRealBalance(){

    try{

        if(
            !window.SistemaSaldo ||
            typeof window.SistemaSaldo.get !== 'function'
        ){

            realBalance = 0;

            balanceEl.textContent = '0,00';

            showError(
                'Sistema de saldo não carregado.'
            );

            return;
        }


        realBalance =
            await window.SistemaSaldo.get();


        balanceEl.textContent =
            formatMoney(realBalance);


        updateUI();

    }catch(error){

        console.error(
            'Erro ao carregar saldo:',
            error
        );

        realBalance = 0;

        balanceEl.textContent = '0,00';

        showError(
            'Não foi possível carregar seu saldo.'
        );

    }

}


/* ======================================================
   ATUALIZAR INTERFACE
====================================================== */

function updateUI(){

    betEl.textContent =
        formatMoney(currentBet);


    spinBtn.disabled =
        isSpinning ||
        realBalance < currentBet;


    minusBtn.disabled =
        isSpinning;


    plusBtn.disabled =
        isSpinning;


    maxBtn.disabled =
        isSpinning;

}


/* ======================================================
   AJUSTAR APOSTA
====================================================== */

function adjustBet(value){

    if(isSpinning) return;


    currentBet += value;


    if(currentBet < 1){
        currentBet = 1;
    }


    if(currentBet > 100){
        currentBet = 100;
    }


    updateUI();

}


/* ======================================================
   APOSTA MÁXIMA
====================================================== */

function setMaxBet(){

    if(isSpinning) return;


    currentBet =
        Math.min(
            100,
            Math.floor(realBalance)
        );


    if(currentBet < 1){
        currentBet = 1;
    }


    updateUI();

}


/* ======================================================
   SÍMBOLO ALEATÓRIO
====================================================== */

function getRandomSymbol(){

    return SYMBOLS[
        Math.floor(
            Math.random() * SYMBOLS.length
        )
    ];

}


/* ======================================================
   CRIAR REELS
====================================================== */

function initGame(){

    reelsGrid.innerHTML = '';


    for(
        let col = 0;
        col < COLS;
        col++
    ){

        const column =
            document.createElement('div');

        column.className =
            'reel-col';

        column.id =
            `col-${col}`;


        for(
            let row = 0;
            row < ROWS;
            row++
        ){

            const cell =
                document.createElement('div');

            cell.className =
                'symbol-cell';

            cell.textContent =
                getRandomSymbol();


            column.appendChild(cell);

        }


        reelsGrid.appendChild(column);

    }

}


/* ======================================================
   LIMPAR GANHADORES
====================================================== */

function clearHighlights(){

    document
        .querySelectorAll('.symbol-cell')
        .forEach(cell => {

            cell.classList.remove('winner');

        });

}


/* ======================================================
   MOSTRAR GANHADORES
====================================================== */

function highlightWinners(indices){

    indices.forEach(index => {

        const col =
            Math.floor(index / ROWS);

        const row =
            index % ROWS;


        const column =
            document.getElementById(
                `col-${col}`
            );


        if(!column) return;


        const cell =
            column.children[row];


        if(cell){

            cell.classList.add('winner');

        }

    });

}


/* ======================================================
   GIRAR
====================================================== */

async function spin(){

    if(isSpinning) return;


    /*
    Confere novamente o saldo real antes
    de permitir o giro.
    */

    await updateRealBalance();


    if(realBalance < currentBet){

        showError(
            '❌ Saldo insuficiente para esta aposta.'
        );

        return;
    }


    /*
    =====================================================
    DÉBITO REAL
    =====================================================
    */

    const debitoOK =
        await window.SistemaSaldo
            .debitar(currentBet);


    if(!debitoOK){

        await updateRealBalance();

        return;
    }


    /*
    Atualiza saldo local depois do débito.
    */

    realBalance -= currentBet;

    if(realBalance < 0){
        realBalance = 0;
    }


    updateUI();

    clearHighlights();

    hideWinPopup();

    isSpinning = true;

    updateUI();


    const spinDuration = 1800;

    const intervalTime = 60;

    const iterations =
        Math.floor(
            spinDuration / intervalTime
        );


    const reels = [];


    for(
        let col = 0;
        col < COLS;
        col++
    ){

        const cells =
            document.querySelectorAll(
                `#col-${col} .symbol-cell`
            );


        reels.push(cells);


        cells.forEach(cell => {

            cell.classList.add('spinning');

        });

    }


    let count = 0;


    const animation =
        setInterval(() => {

            for(
                let col = 0;
                col < COLS;
                col++
            ){

                for(
                    let row = 0;
                    row < ROWS;
                    row++
                ){

                    reels[col][row]
                        .textContent =
                        getRandomSymbol();

                }

            }


            count++;


            if(count >= iterations){

                clearInterval(animation);

                finalizeSpin(reels);

            }

        },intervalTime);

}


/* ======================================================
   RESULTADO FINAL
====================================================== */

async function finalizeSpin(reels){

    const finalGrid = [];


    for(
        let col = 0;
        col < COLS;
        col++
    ){

        const columnResult = [];


        for(
            let row = 0;
            row < ROWS;
            row++
        ){

            const symbol =
                getRandomSymbol();


            columnResult.push(symbol);


            reels[col][row]
                .textContent =
                symbol;


            reels[col][row]
                .classList
                .remove('spinning');

        }


        finalGrid.push(
            columnResult
        );

    }


    await checkWins(finalGrid);


    isSpinning = false;


    await updateRealBalance();


    updateUI();

}


/* ======================================================
   VERIFICAR VITÓRIAS
====================================================== */

async function checkWins(grid){

    let totalMultiplier = 0;

    const winningCells =
        new Set();


    /*
    Cada linha paga independentemente.

    O primeiro símbolo precisa ser repetido
    nas posições seguintes da linha.
    */

    PAYLINES.forEach(line => {

        const firstIndex =
            line[0];


        const firstCol =
            Math.floor(
                firstIndex / ROWS
            );


        const firstRow =
            firstIndex % ROWS;


        const firstSymbol =
            grid[firstCol][firstRow];


        let matchCount = 1;


        for(
            let i = 1;
            i < line.length;
            i++
        ){

            const index =
                line[i];


            const col =
                Math.floor(
                    index / ROWS
                );


            const row =
                index % ROWS;


            if(
                grid[col][row] ===
                firstSymbol
            ){

                matchCount++;

            }else{

                break;

            }

        }


        /*
        Só paga símbolos cadastrados
        */

        if(
            matchCount >= 3 &&
            PAYOUTS[firstSymbol]
        ){

            /*
            3 = x1
            4 = x2
            5 = x3
            */

            const multiplier =
                PAYOUTS[firstSymbol] *
                (matchCount - 2);


            totalMultiplier +=
                multiplier;


            for(
                let i = 0;
                i < matchCount;
                i++
            ){

                winningCells.add(
                    line[i]
                );

            }

        }

    });


    if(totalMultiplier <= 0){

        return;

    }


    /*
    =====================================================
    CRÉDITO REAL
    =====================================================

    O saldo.js aplica a regra CASA_VANTAGEM = 0.95.

    Portanto NÃO fazemos:
        balance += prêmio

    aqui.

    O SistemaSaldo faz o crédito real.
    */

    const ganhoReal =
        await window.SistemaSaldo
            .processarVitoria(
                currentBet,
                totalMultiplier
            );


    if(
        ganhoReal &&
        ganhoReal > 0
    ){

        showWinPopup(ganhoReal);

        highlightWinners(
            winningCells
        );

    }

}


/* ======================================================
   POPUP
====================================================== */

function showWinPopup(amount){

    winValue.textContent =
        formatMoney(amount);


    winPopup.classList.add(
        'active'
    );


    setTimeout(
        hideWinPopup,
        2200
    );

}


function hideWinPopup(){

    winPopup.classList.remove(
        'active'
    );

}


/* ======================================================
   BOTÕES
====================================================== */

minusBtn.addEventListener(
    'click',
    () => adjustBet(-1)
);


plusBtn.addEventListener(
    'click',
    () => adjustBet(1)
);


maxBtn.addEventListener(
    'click',
    setMaxBet
);


spinBtn.addEventListener(
    'click',
    spin
);


/* ======================================================
   INICIALIZAÇÃO
====================================================== */

async function startGame(){

    initGame();

    updateUI();


    /*
    Espera o módulo saldo.js terminar
    de criar window.SistemaSaldo.
    */

    let attempts = 0;


    while(
        !window.SistemaSaldo &&
        attempts < 50
    ){

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );


        attempts++;

    }


    if(!window.SistemaSaldo){

        showError(
            'Erro ao carregar o sistema de saldo.'
        );

        return;

    }


    await updateRealBalance();

}


startGame();

</script>

</body>
</html>
