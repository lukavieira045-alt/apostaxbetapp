.K{color:#d94dd1}.Q{color:#36a8ff}.J{color:#63e84c}.A{color:#ff5148}

.pop{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.65);opacity:0;z-index:50;min-width:310px;padding:28px 46px;text-align:center;background:radial-gradient(circle at 50% 20%,#b47c20,#5a350e 42%,#120a03 76%);border:4px solid #ffdc63;border-radius:8px;box-shadow:0 0 0 2px #5d370b,0 0 65px #ffc400aa, inset 0 0 28px #000;transition:.2s cubic-bezier(.2,.9,.2,1.1)}.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1}.pop h2{margin:0;color:#ffdf62;font-family:Georgia,serif;font-size:32px;text-shadow:0 3px 4px #4c2603}.pop p{margin:9px 0 0;font-size:27px;font-weight:1000}
@media(max-width:700px){body{align-items:flex-start;background-position:center top}.cabine{width:100%;height:100vh;padding:2px 3px 3px}.titulo{height:48px;flex-basis:48px;width:86vw;border-width:3px;margin-bottom:-1px}.titulo:before,.titulo:after{width:22px;height:7px}.titulo h1{font-size:18px;letter-spacing:1px}.titulo b{font-size:17px;margin:0 5px}.barra{height:29px;flex-basis:29px}.saldo{min-width:0;font-size:9px;padding:4px 7px}.acao{width:27px;height:25px;font-size:11px}.msg{height:17px;flex-basis:17px;font-size:8px}.mesa{grid-template-columns:21px minmax(0,1fr) 21px;gap:2px}.linhas{font-size:5.5px;letter-spacing:1px}.moldura{padding:5px;border-width:4px}.moldura:before,.moldura:after{display:none}.rolos{border-width:2px}.col{border-right-width:1px}.cel{border-bottom-width:1px}.cel img{width:94%;height:94%}.letra{font-size:29px}.controle{height:102px;flex-basis:102px;grid-template-columns:1fr 82px 1fr;gap:2px;padding:4px}.grupo,.ferr{gap:2px}.btn{height:31px;min-width:31px;font-size:9px}.max{padding:0 4px}.aposta{min-width:48px;font-size:9px}.girar{width:70px;height:59px;font-size:14px;border-width:4px}.ferr{justify-content:center}.ferr button{height:31px;padding:0 4px;font-size:8px}.rodape{height:18px;flex-basis:18px;font-size:7px;padding:0 4px}.pop{min-width:245px;padding:22px 25px}.pop h2{font-size:25px}.pop p{font-size:22px}}
</style></head><body><div class="cabine"><div class="titulo"><b>⚔</b><h1>TESOURO PIRATA</h1><b>⚔</b></div><div class="barra"><div class="saldo">CREDIT R$ <span id="balance">0,00</span></div><div class="acoes"><button class="acao">☰</button><button class="acao">ⓘ</button><button class="acao">🔊</button></div></div><div class="msg">Encontre 3 ou mais 💀 para ganhar!</div><div id="errorMessage" class="erro"></div><div class="mesa"><div class="linhas">25 LINHAS</div><div class="moldura"><div id="reelsGrid" class="rolos"></div></div><div class="linhas">25 LINHAS</div></div><div class="controle"><div class="grupo"><button class="btn" id="minusBtn">−</button><div class="aposta"><small>BET</small>R$ <span id="betAmount">1,00</span></div><button class="btn" id="plusBtn">+</button><button class="btn max" id="maxBtn">MAX</button></div><button class="girar" id="spinBtn">GIRAR</button><div class="ferr"><button class="btn" id="turboBtn">⚡ TURBO</button><button class="btn" id="autoBtn">AUTO <span id="autoCount">10</span></button></div></div><div class="rodape"><span id="statusText">BOA SORTE!</span><span class="premio">WIN R$ <span id="prizeValue">0,00</span></span></div><div class="pop" id="winPopup"><h2>🏆 TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div></div><script type="module">
import "../saldo.js";
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];const PAYOUTS={captain:1.5,parrot:1.25,chest:1.05,map:.9,compass:.8,bottle:.7,K:.6,Q:.5,J:.4,A:.3};const A='https://commons.wikimedia.org/wiki/Special:FilePath/';const AS={captain:A+'Captain_pirate.png',ship:A+'Pirate_ship_-_Pirates_(1922).png',chest:A+'Treasure_chest_with_gold_coins.svg',bottle:A+'Glass_bottle.jpg',compass:A+'Negus_liquid_compass.png',map:A+'Treasuremap.jpg',cannon:A+'Cannon_model.png',parrot:A+'Parrot_standard.png',scatter:A+'Skull_and_Crossbones.png'};const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');function money(v){return Number(v||0).toFixed(2).replace('.',',')}function error(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){error('Não foi possível carregar seu saldo.')}}function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cel';cell.appendChild(makeCell(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}function setCell(cell,s){cell.innerHTML='';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s))}function clear(){document.querySelectorAll('.cel').forEach(c=>c.classList.remove('win'))}function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .cel');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter=''}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!'}async function wins(grid){let mult=0;const cells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let m=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)m++;else break}if(m>=3&&PAYOUTS[fs]){mult+=PAYOUTS[fs]*(m-2);for(let i=0;i<m;i++)cells.add(line[i])}});if(mult<=0){prizeValue.textContent='0,00';return}mult=Math.min(mult,MAX_TOTAL_MULTIPLIER);const ganho=await window.SistemaSaldo.processarVitoria(currentBet,mult);if(ganho&&ganho>0){prizeValue.textContent=money(ganho);winValue.textContent=money(ganho);winPopup.classList.add('on');setTimeout(()=>winPopup.classList.remove('on'),2200);cells.forEach(i=>$('col-'+Math.floor(i/ROWS))?.children[i%ROWS]?.classList.add('win'));statusText.textContent='TESOURO ENCONTRADO!'}}minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';spin()};async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();</script></body></html>
