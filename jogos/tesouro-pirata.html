<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
:root{--gold:#ffd45a;--gold2:#8b5a18;--wood:#2b1508;--navy:#061a31;--green:#10b83f;--red:#9d1714}*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}body{min-height:100vh;padding:5px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:#031426 url('../jogos/tesouro-pirata.png') center/cover fixed no-repeat}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(1,16,35,.15),rgba(0,7,13,.82)),radial-gradient(circle at 75% 25%,transparent 0 20%,rgba(0,0,0,.35) 65%,rgba(0,0,0,.72));z-index:-1}.game-wrapper{width:100%;max-width:920px;padding:9px;border:4px solid #b97b22;border-radius:24px;background:linear-gradient(180deg,#3c2110,#120804 58%,#281307);box-shadow:0 0 0 2px #ffe28a33,0 22px 70px #000,inset 0 0 38px #000;position:relative}.top-logo{text-align:center;color:#ffd85b;font-weight:1000;letter-spacing:2px;font-size:clamp(20px,5vw,34px);text-shadow:0 3px #542d00,0 0 18px #ffc40088;margin:1px 0 6px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.balance{background:linear-gradient(#192536,#05080c);border:2px solid #d3a33e;border-radius:11px;padding:7px 11px;color:#ffe27b;font-weight:900;box-shadow:inset 0 0 12px #000}.icons{display:flex;gap:6px}.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid #d5a63f;background:linear-gradient(#405264,#111820);color:#fff;font-size:18px;font-weight:900}.mission{text-align:center;color:#fff1bd;font-size:12px;font-weight:900;letter-spacing:.5px;padding:4px 0 8px}.mission b{color:#ffe04e}.machine{display:grid;grid-template-columns:55px 1fr 55px;gap:6px;align-items:stretch}.side-label{display:flex;align-items:center;justify-content:center;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);border:2px solid #c58a28;border-radius:13px;background:linear-gradient(#613719,#170a04);color:#ffe083;font-size:12px;font-weight:1000;letter-spacing:1px;text-shadow:0 2px #000;box-shadow:inset 0 0 14px #000}.reels-container{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px;border:4px solid #d49a30;border-radius:17px;background:linear-gradient(#102c43,#06121e);box-shadow:inset 0 0 25px #000,0 0 0 2px #ffe07a33,0 10px 24px #000}.reel-col{display:flex;flex-direction:column;gap:5px}.symbol-cell{height:94px;background:radial-gradient(circle at 50% 15%,#ffffff20,transparent 40%),linear-gradient(180deg,#29495d,#07111a);border:2px solid #8e7548;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 1px #fff2,inset 0 -14px 20px #000b,0 2px 3px #000}.symbol-cell img{width:88%;height:88%;object-fit:contain;display:block;filter:drop-shadow(0 5px 4px #000b) drop-shadow(0 0 5px #fff2);transform:translateZ(0);transition:transform .15s}.symbol-cell:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#fff3,transparent 22%,transparent 72%,#0003)}.symbol-cell.spinning img{filter:blur(2px) drop-shadow(0 5px 4px #000b);opacity:.72;transform:scaleY(.92)}.symbol-cell.winner{background:radial-gradient(circle,#fff9a6,#ffc928 45%,#7c3900);border-color:#fff1a0;animation:pulseWin .55s infinite alternate;z-index:10;box-shadow:0 0 14px #ffd21f,0 0 35px #ffae00}.symbol-cell.winner img{transform:scale(1.08)}.symbol-cell.scatter{border-color:#ff4b36;background:radial-gradient(circle,#3a1512,#08090d 70%)}.scatter-badge{position:absolute;left:5px;right:5px;bottom:3px;background:linear-gradient(#c51e18,#74100d);border:1px solid #ff8274;border-radius:4px;color:#fff;font-size:7px;font-weight:1000;letter-spacing:1.4px;text-align:center;z-index:3;text-shadow:0 1px #000}@keyframes pulseWin{from{transform:scale(1)}to{transform:scale(1.09)}}.controls{margin-top:8px;padding:10px;border:2px solid #b98027;border-radius:16px;background:linear-gradient(#24150b,#080707);box-shadow:inset 0 0 20px #000,0 8px 20px #000;display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.bet-area{display:flex;align-items:center;gap:5px}.btn-small,.tool-btn{height:38px;min-width:38px;border:1px solid #96794b;border-radius:8px;background:linear-gradient(#465463,#121920);color:#fff;font-weight:1000;cursor:pointer}.current-bet{min-width:70px;text-align:center;color:#ffe071;font-weight:1000}.spin-button{min-width:175px;height:58px;background:linear-gradient(#39dc67,#079334 55%,#056522);border:3px solid #aaffb8;border-radius:15px;color:#fff;font-size:22px;font-weight:1000;text-shadow:0 2px 3px #064317;box-shadow:0 5px #033d16,0 0 24px #19c84b55,inset 0 2px #fff9;cursor:pointer}.spin-button:active:not(:disabled){transform:translateY(4px);box-shadow:none}.spin-button:disabled{filter:grayscale(1);opacity:.5}.right-controls{display:flex;justify-content:flex-end;gap:5px}.tool-btn.active{background:linear-gradient(#1db94b,#08752a);border-color:#9cffb3}.max-btn{padding:0 10px;width:auto}.statusbar{margin-top:7px;border:2px solid #b77d24;border-radius:10px;background:linear-gradient(#071a2a,#03080d);padding:7px;text-align:center;color:#ffe07b;font-weight:1000;letter-spacing:1px}.prize{float:right;color:#fff;font-size:12px}.error-message{display:none;text-align:center;color:#ffb2b2;background:#450d0d;border:1px solid #ff5555;border-radius:7px;padding:8px;margin-bottom:8px}.win-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 50% 20%,#704a0df8,#030303fa 68%);border:4px solid var(--gold);padding:26px 42px;border-radius:18px;z-index:100;text-align:center;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 0 50px #ffc00077,inset 0 0 25px #000}.win-popup.active{transform:translate(-50%,-50%) scale(1);opacity:1}.win-popup h2{margin:0;color:#ffd957;font-size:2em;text-shadow:0 0 12px #ffd000}.win-popup p{margin:5px 0 0;font-size:1.5em;font-weight:900}
@media(max-width:650px){body{padding:2px}.game-wrapper{padding:6px;border-width:2px;border-radius:18px}.top-logo{font-size:21px}.balance{font-size:12px}.icon-btn{width:31px;height:31px;font-size:15px}.mission{font-size:10px;padding-bottom:5px}.machine{grid-template-columns:31px 1fr 31px;gap:3px}.side-label{font-size:8px;letter-spacing:0}.reels-container{padding:5px;gap:3px;border-width:2px}.reel-col{gap:3px}.symbol-cell{height:62px;font-size:25px;border-width:1px}.symbol-cell img{width:92%;height:92%}.scatter-badge{font-size:6px;bottom:2px}.controls{grid-template-columns:1fr;justify-items:center;padding:7px}.bet-area,.right-controls{justify-content:center}.spin-button{height:54px;min-width:160px}.statusbar{font-size:10px}.prize{font-size:10px}}
</style>
</head>
<body><div class="game-wrapper"><div class="top-logo">💀 <span>TESOURO PIRATA</span> 🏴‍☠️</div><div class="topbar"><div class="balance">SALDO: R$ <span id="balance">0,00</span></div><div class="icons"><button class="icon-btn" title="Som">🔊</button><button class="icon-btn" title="Informações">ℹ️</button><button class="icon-btn" title="Menu">☰</button></div></div><div class="mission">Encontre 3 ou mais <b>💀</b> para ganhar!</div><div id="errorMessage" class="error-message"></div><div class="machine"><div class="side-label">25 LINHAS</div><div class="reels-container" id="reelsGrid"></div><div class="side-label">25 LINHAS</div></div><div class="controls"><div class="bet-area"><button class="btn-small" id="minusBtn">−</button><div class="current-bet">R$ <span id="betAmount">1,00</span></div><button class="btn-small" id="plusBtn">+</button><button class="btn-small max-btn" id="maxBtn">APOSTA MÁXIMA</button></div><button class="spin-button" id="spinBtn">GIRAR</button><div class="right-controls"><button class="tool-btn" id="turboBtn">⚡ TURBO</button><button class="tool-btn" id="autoBtn">AUTO <span id="autoCount">10</span></button></div></div><div class="statusbar"><span id="statusText">BOA SORTE!</span><span class="prize">PRÊMIO: R$ <span id="prizeValue">0,00</span></span></div><div class="win-popup" id="winPopup"><h2>🏆 VITÓRIA!</h2><p>+ R$ <span id="winValue">0,00</span></p></div></div>
<script type="module">
import "../saldo.js";
/*
  Símbolos visuais externos de fontes públicas / livres:
  Captain_pirate.png (CC0), Treasure_chest_with_gold_coins.svg (CC0),
  Parrot_standard.png (domínio público), Negus_liquid_compass.png (domínio público),
  Treasuremap.jpg (domínio público), Cannon_model.png (domínio público),
  Pirate_ship_-_Pirates_(1922).png (domínio público), Skull_and_Crossbones.png (domínio público),
  Glass_bottle.jpg (CC0). As fontes foram escolhidas para evitar copiar arte proprietária de outros slots.
*/
const ASSET='https://commons.wikimedia.org/wiki/Special:FilePath/';
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];
const SYMBOL_ASSETS={
 captain:ASSET+'Captain_pirate.png',
 ship:ASSET+'Pirate_ship_-_Pirates_(1922).png',
 chest:ASSET+'Treasure_chest_with_gold_coins.svg',
 bottle:ASSET+'Glass_bottle.jpg',
 compass:ASSET+'Negus_liquid_compass.png',
 map:ASSET+'Treasuremap.jpg',
 cannon:ASSET+'Cannon_model.png',
 parrot:ASSET+'Parrot_standard.png',
 scatter:ASSET+'Skull_and_Crossbones.png'
};
const LABELS={captain:'Capitão',ship:'Navio Pirata',chest:'Baú do Tesouro',bottle:'Garrafa',compass:'Bússola',map:'Mapa',cannon:'Canhão',parrot:'Papagaio',K:'K',Q:'Q',J:'J',A:'A',scatter:'SCATTER'};
/* FINANCEIRO — mantido exatamente como estava */
const PAYOUTS={'captain':1.50,'parrot':1.25,'chest':1.05,'map':0.90,'compass':0.80,'bottle':0.70,'K':0.60,'Q':0.50,'J':0.40,'A':0.30};
const PAYOUT_KEYS={captain:'captain',parrot:'parrot',chest:'chest',map:'map',compass:'compass',bottle:'bottle',K:'K',Q:'Q',J:'J',A:'A'};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function formatMoney(v){return Number(v||0).toFixed(2).replace('.',',')}function showError(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function updateRealBalance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=formatMoney(realBalance);updateUI()}catch(e){showError('Não foi possível carregar seu saldo.')}}function updateUI(){betEl.textContent=formatMoney(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}function adjustBet(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));updateUI()}}function setMaxBet(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));updateUI()}}
function getRandomSymbol(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function renderSymbol(cell,symbol){cell.innerHTML='';cell.dataset.symbol=symbol;if(SYMBOL_ASSETS[symbol]){const img=document.createElement('img');img.src=SYMBOL_ASSETS[symbol];img.alt=LABELS[symbol];img.loading='lazy';img.referrerPolicy='no-referrer';cell.appendChild(img)}else{const span=document.createElement('span');span.textContent=symbol;span.className='card-symbol '+symbol;cell.appendChild(span)}}
function markScatter(cell,symbol){cell.classList.remove('scatter');if(symbol==='scatter'){cell.classList.add('scatter');const b=document.createElement('div');b.className='scatter-badge';b.textContent='SCATTER';cell.appendChild(b)}}
function initGame(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='reel-col';col.id=`col-${c}`;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='symbol-cell';renderSymbol(cell,getRandomSymbol());col.appendChild(cell)}reelsGrid.appendChild(col)}}function clearHighlights(){document.querySelectorAll('.symbol-cell').forEach(c=>c.classList.remove('winner'))}function highlightWinners(indices){indices.forEach(i=>{const col=$(`col-${Math.floor(i/ROWS)}`);if(col?.children[i%ROWS])col.children[i%ROWS].classList.add('winner')})}
async function spin(){if(isSpinning)return;await updateRealBalance();if(realBalance<currentBet){showError('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const debitoOK=await window.SistemaSaldo.debitar(currentBet);if(!debitoOK){await updateRealBalance();return}realBalance=Math.max(0,realBalance-currentBet);updateUI();clearHighlights();hideWinPopup();isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';updateUI();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll(`#col-${c} .symbol-cell`);reels.push(cells);cells.forEach(x=>x.classList.add('spinning'))}let count=0;const limit=turbo?8:30,delay=turbo?45:60;const animation=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)renderSymbol(reels[c][r],getRandomSymbol());if(++count>=limit){clearInterval(animation);finalizeSpin(reels)}},delay)}
async function finalizeSpin(reels){const finalGrid=[];for(let c=0;c<COLS;c++){const result=[];for(let r=0;r<ROWS;r++){const s=getRandomSymbol();result.push(s);renderSymbol(reels[c][r],s);reels[c][r].classList.remove('spinning');markScatter(reels[c][r],s)}finalGrid.push(result)}await checkWins(finalGrid);isSpinning=false;await updateRealBalance();updateUI();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet){setTimeout(spin,turbo?80:350)}else{autoRunning=false;autoSpins=0;statusText.textContent='BOA SORTE!';$('autoCount').textContent='10';updateUI()}}else statusText.textContent='BOA SORTE!'}
async function checkWins(grid){let totalMultiplier=0;const winningCells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let matches=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)matches++;else break}if(matches>=3&&PAYOUTS[fs]){totalMultiplier+=PAYOUTS[fs]*(matches-2);for(let i=0;i<matches;i++)winningCells.add(line[i])}});if(totalMultiplier<=0){prizeValue.textContent='0,00';return}totalMultiplier=Math.min(totalMultiplier,MAX_TOTAL_MULTIPLIER);const ganhoReal=await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);if(ganhoReal&&ganhoReal>0){prizeValue.textContent=formatMoney(ganhoReal);showWinPopup(ganhoReal);highlightWinners(winningCells);statusText.textContent='TESOURO ENCONTRADO!'}}
function showWinPopup(v){winValue.textContent=formatMoney(v);winPopup.classList.add('active');setTimeout(hideWinPopup,2200)}function hideWinPopup(){winPopup.classList.remove('active')}
minusBtn.addEventListener('click',()=>adjustBet(-1));plusBtn.addEventListener('click',()=>adjustBet(1));maxBtn.addEventListener('click',setMaxBet);spinBtn.addEventListener('click',spin);$('turboBtn').addEventListener('click',e=>{turbo=!turbo;e.currentTarget.classList.toggle('active',turbo)});$('autoBtn').addEventListener('click',()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;statusText.textContent='AUTO CANCELADO';$('autoCount').textContent='10';return}autoSpins=10;autoRunning=true;$('autoCount').textContent=autoSpins;statusText.textContent='AUTO: 10 GIROS';spin()});
async function startGame(){initGame();updateUI();let attempts=0;while(!window.SistemaSaldo&&attempts<50){await new Promise(r=>setTimeout(r,50));attempts++}if(!window.SistemaSaldo){showError('Erro ao carregar o sistema de saldo.');return}await updateRealBalance()}startGame();
</script></body></html>
