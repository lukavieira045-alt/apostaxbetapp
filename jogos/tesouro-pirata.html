<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
:root{--gold:#f4c65b;--gold-hi:#fff0a4;--gold-deep:#70410f;--wood:#241207;--wood2:#4b2812;--sea:#06253a;--sea2:#0b4660;--green:#17c956;--red:#a71916}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;color:#fff;background:#020b12}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;padding:8px;background:linear-gradient(180deg,#031c2d,#02080d 70%)}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 22%,rgba(26,126,163,.35),transparent 38%),linear-gradient(180deg,rgba(0,20,35,.2),rgba(0,0,0,.88)),url('../jogos/tesouro-pirata.png') center/cover no-repeat;filter:saturate(1.1);z-index:-3}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.72) 100%);pointer-events:none;z-index:-2}
.game-wrapper{position:relative;width:min(1120px,100%);padding:14px 14px 12px;border-radius:28px;background:linear-gradient(180deg,#563116 0%,#241207 11%,#090708 58%,#1c0d06 100%);border:3px solid #9b641d;box-shadow:0 30px 90px #000,0 0 0 1px #ffd76a44,inset 0 0 0 2px #2c1608,inset 0 0 55px #000;overflow:hidden}
.game-wrapper:before{content:"";position:absolute;inset:6px;border:1px solid #f5ce6b55;border-radius:22px;pointer-events:none}
.deck-light{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(180deg,#f6d57a18,transparent);pointer-events:none}
.header{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:10px}
.brand{justify-self:center;text-align:center;position:relative;padding:9px 36px 11px;min-width:390px;border:2px solid #c48b2d;border-radius:12px;background:linear-gradient(180deg,#5a3215,#241006 70%);box-shadow:0 5px 0 #130803,inset 0 0 20px #000,inset 0 1px #ffeaa0;clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%)}
.brand small{display:block;color:#f6d27b;font-size:8px;letter-spacing:4px;font-weight:900;margin-bottom:1px}.brand strong{display:block;font-family:Georgia,serif;font-size:clamp(25px,4vw,40px);line-height:.9;letter-spacing:3px;color:#ffd866;text-shadow:0 2px #3a1800,0 0 12px #ffb90066}.brand em{font-style:normal;color:#e9a936;font-size:9px;letter-spacing:5px;font-weight:900}
.header-side{display:flex;align-items:center;gap:8px}.header-side.right{justify-content:flex-end}.balance{min-width:180px;padding:9px 13px;border-radius:9px;border:1px solid #a97827;background:linear-gradient(180deg,#172d3a,#050b10);box-shadow:inset 0 0 15px #000,0 3px 8px #000;color:#f5d574;font-size:11px;font-weight:900;letter-spacing:1px}.balance span{display:block;color:#fff;font-size:18px;margin-top:2px;letter-spacing:0}.icon-btn{width:38px;height:38px;border:1px solid #a97827;border-radius:9px;background:linear-gradient(#344e5d,#0a1218);color:#fff;font-size:17px;box-shadow:inset 0 1px #fff3,0 3px 8px #000}
.rule{position:relative;z-index:2;text-align:center;margin:0 auto 10px;max-width:620px;color:#e8dfc5;font-size:11px;font-weight:800;letter-spacing:1px}.rule b{color:#ffd84f}.rule:before,.rule:after{content:"";display:inline-block;width:70px;height:1px;vertical-align:middle;margin:0 10px;background:linear-gradient(90deg,transparent,#c99339)}.rule:after{background:linear-gradient(90deg,#c99339,transparent)}
.machine{position:relative;display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:stretch}
.side-rail{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #8f5c1e;border-radius:13px;background:linear-gradient(180deg,#42230f,#130804);box-shadow:inset 0 0 18px #000,0 8px 18px #000}.side-rail:before{content:"⚓";position:absolute;top:8px;color:#c99b43;font-size:18px}.side-rail:after{content:"⚓";position:absolute;bottom:8px;color:#c99b43;font-size:18px}.side-rail span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:1000;letter-spacing:2px;color:#eac66b;text-shadow:0 2px #000}
.reel-frame{position:relative;padding:10px;border-radius:18px;background:linear-gradient(135deg,#b27a2b,#4e2b0e 18%,#d6a343 50%,#4b280c 82%,#c18a31);box-shadow:0 10px 30px #000,inset 0 0 0 2px #ffe79b,inset 0 0 0 5px #5a300d}.reel-frame:before{content:"";position:absolute;inset:6px;border:1px solid #fff0a044;border-radius:13px;pointer-events:none}.reel-window{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border-radius:12px;background:linear-gradient(180deg,#03141e,#061f2c 50%,#02080d);box-shadow:inset 0 0 28px #000,0 0 0 2px #221207;overflow:hidden}.reel-window:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.09),transparent 8%,transparent 92%,rgba(255,255,255,.06)),linear-gradient(180deg,#fff2,transparent 10%,transparent 90%,#0008);z-index:3}
.reel-col{display:flex;flex-direction:column;gap:4px;min-width:0}.symbol-cell{height:103px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #6f5a39;border-radius:6px;background:radial-gradient(circle at 50% 18%,#4d7180,#122a36 42%,#061017 100%);box-shadow:inset 0 1px #fff4,inset 0 -18px 22px #000b,0 2px 3px #000}.symbol-cell:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff3,transparent 18%,transparent 76%,#0005);pointer-events:none;z-index:2}.symbol-cell img{width:91%;height:91%;object-fit:contain;display:block;filter:drop-shadow(0 7px 4px #000d) drop-shadow(0 0 4px #fff2);transform:translateZ(0);transition:transform .15s;z-index:1}.symbol-cell.spinning img{filter:blur(2px) drop-shadow(0 5px 4px #000b);opacity:.7;transform:scaleY(.88)}
.card-symbol{font-family:Georgia,serif;font-size:46px;font-weight:900;text-shadow:0 3px 0 #000,0 0 10px #fff5}.card-symbol.K{color:#52baff}.card-symbol.Q{color:#6cff87}.card-symbol.J{color:#d18cff}.card-symbol.A{color:#ff5e5e}
.symbol-cell.winner{background:radial-gradient(circle,#fff4ad,#e9a72c 48%,#4a1d00);border-color:#fff1a0;animation:winPulse .5s infinite alternate;z-index:10;box-shadow:0 0 18px #ffd21f,0 0 38px #ffae00}.symbol-cell.winner img{transform:scale(1.09)}.symbol-cell.scatter{border-color:#ff4939;background:radial-gradient(circle,#4b1714,#08090d 70%);box-shadow:inset 0 0 20px #000,0 0 10px #f33}.scatter-badge{position:absolute;left:7px;right:7px;bottom:4px;padding:3px 0;background:linear-gradient(#d52b20,#6d0d0a);border:1px solid #ff9c8f;border-radius:4px;color:#fff;font-size:7px;font-weight:1000;letter-spacing:1.5px;text-align:center;z-index:4;text-shadow:0 1px #000}
@keyframes winPulse{from{transform:scale(1)}to{transform:scale(1.035)}}
.bottom-panel{position:relative;margin-top:10px;padding:10px;border-radius:16px;border:2px solid #8d5a1c;background:linear-gradient(180deg,#3a1e0c,#140904 62%,#080707);box-shadow:0 10px 24px #000,inset 0 0 25px #000;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.bottom-panel:before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,#ffe79b88,transparent)}
.bet-area,.right-controls{display:flex;align-items:center;gap:5px}.right-controls{justify-content:flex-end}.btn-small,.tool-btn{height:40px;min-width:40px;border:1px solid #80663d;border-radius:8px;background:linear-gradient(180deg,#536773,#121b20 65%);color:#fff;font-weight:1000;box-shadow:inset 0 1px #fff4,0 3px 6px #000;cursor:pointer}.btn-small:active,.tool-btn:active{transform:translateY(2px)}.current-bet{min-width:72px;text-align:center;color:#ffe07a;font-weight:1000;font-size:12px}.max-btn{padding:0 9px;width:auto;font-size:10px}.tool-btn.active{background:linear-gradient(#27c85b,#086b28);border-color:#9cffb3}.spin-button{position:relative;min-width:190px;height:66px;border:3px solid #d8ffdf;border-radius:50%;background:radial-gradient(circle at 50% 28%,#68f58d,#15bf50 48%,#057226 78%,#024116);color:#fff;font-size:23px;font-weight:1000;text-shadow:0 2px 3px #063d16;box-shadow:0 0 0 4px #154b25,0 0 0 7px #a67627,0 9px 20px #000,0 0 28px #1bd45066,inset 0 4px 7px #fff8,inset 0 -8px 12px #003e16;cursor:pointer}.spin-button:after{content:"";position:absolute;inset:7px;border:1px solid #fff5;border-radius:50%;pointer-events:none}.spin-button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 4px #154b25,0 0 0 7px #a67627,0 4px 10px #000,inset 0 4px 7px #fff8}.spin-button:disabled{filter:grayscale(1);opacity:.45}
.statusbar{position:relative;margin-top:8px;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid #77501e;border-radius:8px;background:linear-gradient(180deg,#071d29,#02070b);box-shadow:inset 0 0 12px #000;color:#e8c866;font-size:10px;font-weight:1000;letter-spacing:1px}.prize{color:#fff}.error-message{display:none;text-align:center;color:#ffb2b2;background:#450d0d;border:1px solid #ff5555;border-radius:7px;padding:8px;margin-bottom:8px}
.win-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);min-width:300px;padding:30px 46px;border-radius:20px;background:radial-gradient(circle at 50% 15%,#7c5515f5,#030303f7 70%);border:4px solid var(--gold);z-index:100;text-align:center;opacity:0;pointer-events:none;transition:.28s;box-shadow:0 0 0 2px #fff2,0 0 65px #ffc00099,inset 0 0 30px #000}.win-popup.active{transform:translate(-50%,-50%) scale(1);opacity:1}.win-popup h2{margin:0;color:#ffe16a;font-family:Georgia,serif;font-size:2.2em;text-shadow:0 0 14px #ffd000}.win-popup p{margin:7px 0 0;font-size:1.55em;font-weight:1000}
@media(max-width:760px){body{padding:2px}.game-wrapper{padding:7px;border-radius:18px;border-width:2px}.header{grid-template-columns:1fr auto;gap:6px}.brand{grid-column:1/-1;grid-row:1;min-width:0;padding:7px 20px}.header-side.left{grid-column:1}.header-side.right{grid-column:2}.balance{min-width:0;padding:7px 9px}.icon-btn{width:32px;height:32px}.rule{font-size:9px}.rule:before,.rule:after{width:25px;margin:0 4px}.machine{grid-template-columns:25px 1fr 25px;gap:3px}.side-rail{border-width:1px}.side-rail span{font-size:7px;letter-spacing:1px}.reel-frame{padding:5px;border-radius:12px}.reel-window{padding:4px;gap:2px}.reel-col{gap:2px}.symbol-cell{height:68px;border-radius:4px}.symbol-cell img{width:94%;height:94%}.card-symbol{font-size:31px}.scatter-badge{font-size:5px;left:3px;right:3px;bottom:2px;padding:2px 0}.bottom-panel{grid-template-columns:1fr;justify-items:center;padding:7px;gap:7px}.bet-area,.right-controls{justify-content:center;flex-wrap:wrap}.spin-button{width:170px;height:58px;min-width:170px}.statusbar{font-size:8px}.win-popup{min-width:250px;padding:22px 28px}}
@media(max-width:420px){.game-wrapper{padding:5px}.brand strong{font-size:24px}.brand em{font-size:7px}.balance{font-size:9px}.balance span{font-size:14px}.machine{grid-template-columns:19px 1fr 19px}.side-rail:before,.side-rail:after{font-size:12px}.symbol-cell{height:57px}.card-symbol{font-size:26px}.spin-button{width:150px;height:53px;min-width:150px;font-size:19px}}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="deck-light"></div>
<header class="header">
<div class="header-side left"><div class="balance">SALDO<span>R$ <b id="balance">0,00</b></span></div></div>
<div class="brand"><small>APOSTAXBET • ORIGINAL</small><strong>TESOURO PIRATA</strong><em>HIGH SEAS • TREASURE • FORTUNE</em></div>
<div class="header-side right"><button class="icon-btn" title="Som">🔊</button><button class="icon-btn" title="Informações">ℹ️</button><button class="icon-btn" title="Menu">☰</button></div>
</header>
<div class="rule">Encontre 3 ou mais <b>☠</b> para ganhar • <b>25 LINHAS</b> FIXAS</div>
<div id="errorMessage" class="error-message"></div>
<section class="machine">
<div class="side-rail"><span>25 LINHAS</span></div>
<div class="reel-frame"><div class="reel-window" id="reelsGrid"></div></div>
<div class="side-rail"><span>25 LINHAS</span></div>
</section>
<section class="bottom-panel">
<div class="bet-area"><button class="btn-small" id="minusBtn">−</button><div class="current-bet">APOSTA<br><span>R$ <b id="betAmount">1,00</b></span></div><button class="btn-small" id="plusBtn">+</button><button class="btn-small max-btn" id="maxBtn">MAX</button></div>
<button class="spin-button" id="spinBtn">GIRAR</button>
<div class="right-controls"><button class="tool-btn" id="turboBtn">⚡ TURBO</button><button class="tool-btn" id="autoBtn">AUTO <span id="autoCount">10</span></button></div>
</section>
<div class="statusbar"><span id="statusText">BOA SORTE!</span><span class="prize">PRÊMIO: R$ <span id="prizeValue">0,00</span></span></div>
<div class="win-popup" id="winPopup"><h2>TESOURO ENCONTRADO</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
</div>
<script type="module">
import "../saldo.js";
const ASSET='https://commons.wikimedia.org/wiki/Special:FilePath/';
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];
const SYMBOL_ASSETS={captain:ASSET+'Captain_pirate.png',ship:ASSET+'Pirate_ship_-_Pirates_(1922).png',chest:ASSET+'Treasure_chest_with_gold_coins.svg',bottle:ASSET+'Glass_bottle.jpg',compass:ASSET+'Negus_liquid_compass.png',map:ASSET+'Treasuremap.jpg',cannon:ASSET+'Cannon_model.png',parrot:ASSET+'Parrot_standard.png',scatter:ASSET+'Skull_and_Crossbones.png'};
const LABELS={captain:'Capitão',ship:'Navio Pirata',chest:'Baú do Tesouro',bottle:'Garrafa',compass:'Bússola',map:'Mapa',cannon:'Canhão',parrot:'Papagaio',K:'K',Q:'Q',J:'J',A:'A',scatter:'SCATTER'};
/* FINANCEIRO — mantido exatamente como estava */
const PAYOUTS={'captain':1.50,'parrot':1.25,'chest':1.05,'map':0.90,'compass':0.80,'bottle':0.70,'K':0.60,'Q':0.50,'J':0.40,'A':0.30};
const PAYOUT_KEYS={captain:'captain',parrot:'parrot',chest:'chest',map:'map',compass:'compass',bottle:'bottle',K:'K',Q:'Q',J:'J',A:'A'};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function formatMoney(v){return Number(v||0).toFixed(2).replace('.',',')}function showError(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function updateRealBalance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=formatMoney(realBalance);updateUI()}catch(e){showError('Não foi possível carregar seu saldo.')}}function updateUI(){betEl.textContent=formatMoney(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}function adjustBet(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));updateUI()}}function setMaxBet(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));updateUI()}}
function getRandomSymbol(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function renderSymbol(cell,symbol){cell.innerHTML='';cell.dataset.symbol=symbol;if(SYMBOL_ASSETS[symbol]){const img=document.createElement('img');img.src=SYMBOL_ASSETS[symbol];img.alt=LABELS[symbol];img.loading='lazy';img.referrerPolicy='no-referrer';cell.appendChild(img)}else{const span=document.createElement('span');span.textContent=symbol;span.className='card-symbol '+symbol;cell.appendChild(span)}}
function markScatter(cell,symbol){cell.classList.remove('scatter');if(symbol==='scatter'){cell.classList.add('scatter');const b=document.createElement('div');b.className='scatter-badge';b.textContent='SCATTER';cell.appendChild(b)}}
function initGame(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='reel-col';col.id=`col-${c}`;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='symbol-cell';renderSymbol(cell,getRandomSymbol());col.appendChild(cell)}reelsGrid.appendChild(col)}}function clearHighlights(){document.querySelectorAll('.symbol-cell').forEach(c=>c.classList.remove('winner'))}function highlightWinners(indices){indices.forEach(i=>{const col=$(`col-${Math.floor(i/ROWS)}`);if(col?.children[i%ROWS])col.children[i%ROWS].classList.add('winner')})}
async function spin(){if(isSpinning)return;await updateRealBalance();if(realBalance<currentBet){showError('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const debitoOK=await window.SistemaSaldo.debitar(currentBet);if(!debitoOK){await updateRealBalance();return}realBalance=Math.max(0,realBalance-currentBet);updateUI();clearHighlights();hideWinPopup();isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';updateUI();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll(`#col-${c} .symbol-cell`);reels.push(cells);cells.forEach(x=>x.classList.add('spinning'))}let count=0;const limit=turbo?8:30,delay=turbo?45:60;const animation=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)renderSymbol(reels[c][r],getRandomSymbol());if(++count>=limit){clearInterval(animation);finalizeSpin(reels)}},delay)}
async function finalizeSpin(reels){const finalGrid=[];for(let c=0;c<COLS;c++){const result=[];for(let r=0;r<ROWS;r++){const s=getRandomSymbol();result.push(s);renderSymbol(reels[c][r],s);reels[c][r].classList.remove('spinning');markScatter(reels[c][r],s)}finalGrid.push(result)}await checkWins(finalGrid);isSpinning=false;await updateRealBalance();updateUI();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet){setTimeout(spin,turbo?80:350)}else{autoRunning=false;autoSpins=0;statusText.textContent='BOA SORTE!';$('autoCount').textContent='10';updateUI()}}else statusText.textContent='BOA SORTE!'}
async function checkWins(grid){let totalMultiplier=0;const winningCells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let matches=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)matches++;else break}if(matches>=3&&PAYOUTS[fs]){totalMultiplier+=PAYOUTS[fs]*(matches-2);for(let i=0;i<matches;i++)winningCells.add(line[i])}});if(totalMultiplier<=0){prizeValue.textContent='0,00';return}totalMultiplier=Math.min(totalMultiplier,MAX_TOTAL_MULTIPLIER);const ganhoReal=await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);if(ganhoReal&&ganhoReal>0){prizeValue.textContent=formatMoney(ganhoReal);showWinPopup(ganhoReal);highlightWinners(winningCells);statusText.textContent='TESOURO ENCONTRADO!'}}
function showWinPopup(v){winValue.textContent=formatMoney(v);winPopup.classList.add('active');setTimeout(hideWinPopup,2200)}function hideWinPopup(){winPopup.classList.remove('active')}
minusBtn.addEventListener('click',()=>adjustBet(-1));plusBtn.addEventListener('click',()=>adjustBet(1));maxBtn.addEventListener('click',setMaxBet);spinBtn.addEventListener('click',spin);$('turboBtn').addEventListener('click',e=>{turbo=!turbo;e.currentTarget.classList.toggle('active',turbo)});$('autoBtn').addEventListener('click',()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;statusText.textContent='AUTO CANCELADO';$('autoCount').textContent='10';return}autoSpins=10;autoRunning=true;$('autoCount').textContent=autoSpins;statusText.textContent='AUTO: 10 GIROS';spin()});
async function startGame(){initGame();updateUI();let attempts=0;while(!window.SistemaSaldo&&attempts<50){await new Promise(r=>setTimeout(r,50));attempts++}if(!window.SistemaSaldo){showError('Erro ao carregar o sistema de saldo.');return}await updateRealBalance()}startGame();
</script>
</body>
</html>
