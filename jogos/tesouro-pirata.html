<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tesouro Pirata — ApostaXBet</title><style>
:root{--g:#f5c94a;--g2:#9b631c;--w:#251307;--n:#061a2b;--gr:#20bd4e}*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px;background:#031426 url('../jogos/tesouro-pirata.png') center/cover fixed no-repeat}body:after{content:"";position:fixed;inset:0;background:linear-gradient(#001a2a22,#000914cc);pointer-events:none;z-index:-1}.cabine{width:min(1080px,100%);padding:9px;background:linear-gradient(#4a2b13,#180b04 18%,#07090b 82%,#32190a);border:5px solid #a96d20;border-radius:9px;box-shadow:0 0 0 2px #f6d46a55,0 25px 70px #000,inset 0 0 30px #000}.titulo{height:62px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#c98c2b,#6c3a0d);border:3px solid #eac45e;box-shadow:inset 0 0 0 2px #4b2508,0 4px 12px #000}.titulo h1{margin:0;color:#ffe16b;font-size:clamp(25px,5vw,43px);font-weight:1000;letter-spacing:3px;text-shadow:0 3px #432100,0 0 15px #ffbf18}.titulo b{font-size:32px;margin:0 14px}.barra{display:flex;justify-content:space-between;align-items:center;margin:7px 3px}.saldo{padding:7px 13px;background:linear-gradient(#1b2b39,#060a0e);border:2px solid #b88a32;color:#ffd96b;font-weight:900}.acoes{display:flex;gap:5px}.acao{width:37px;height:34px;border:2px solid #a9792d;background:linear-gradient(#43525c,#10161b);color:#fff;border-radius:4px;font-size:17px}.msg{text-align:center;color:#ffe39a;font-weight:900;font-size:13px;margin-bottom:7px}.erro{display:none;text-align:center;background:#500e0e;border:2px solid #f55;padding:7px;margin-bottom:6px}.mesa{display:grid;grid-template-columns:52px 1fr 52px;gap:7px}.linhas{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);background:linear-gradient(#5a310f,#180903);border:3px solid #9c661e;color:#ffd968;font-size:11px;font-weight:1000;letter-spacing:1px}.moldura{padding:8px;background:linear-gradient(#a97524,#5d340e 9%,#10100d 10%);border:5px solid #b9822b;box-shadow:inset 0 0 0 2px #3b2109,0 8px 22px #000}.rolos{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#020609;border:3px solid #76501c;padding:3px}.col{display:grid;gap:3px}.cel{height:108px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#34596f,#07121b 70%);border:2px solid #70552e;box-shadow:inset 0 0 16px #000}.cel img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 5px 4px #000)}.letra{font-weight:1000;font-size:clamp(35px,5vw,54px);text-shadow:0 3px 4px #000,0 0 8px currentColor}.K{color:#43a7ff}.Q{color:#3bdd87}.J{color:#c47cff}.A{color:#ff5148}.scatter{border-color:#ef392c}.scatter:after{content:'SCATTER';position:absolute;bottom:2px;left:7px;right:7px;text-align:center;background:#a61716;font-size:8px;font-weight:1000;padding:2px}.win{animation:win .45s infinite alternate;z-index:3}@keyframes win{to{transform:scale(1.08);filter:brightness(1.7);box-shadow:0 0 25px #ffd21c}}.controle{display:grid;grid-template-columns:1fr 210px 1fr;gap:10px;align-items:center;margin-top:8px;padding:9px;background:linear-gradient(#171b1e,#050607);border:3px solid #80551d;box-shadow:inset 0 0 20px #000}.grupo,.ferr{display:flex;align-items:center;gap:5px}.ferr{justify-content:flex-end}.btn{height:39px;min-width:39px;border:2px solid #806b45;border-radius:4px;background:linear-gradient(#53606a,#13191e);color:#fff;font-weight:1000}.max{padding:0 9px}.aposta{text-align:center;min-width:70px;color:#ffd96b;font-weight:1000}.aposta small{display:block;color:#aaa;font-size:9px}.girar{height:66px;border:4px solid #a9f6b7;border-radius:6px;background:linear-gradient(#43df6b,#15963b 60%,#075c22);color:#fff;font-size:25px;font-weight:1000;box-shadow:0 5px #033b15,0 0 20px #16c94c55;text-shadow:0 2px 3px #064317}.girar:disabled{opacity:.5;filter:grayscale(1)}.ferr button{height:39px;padding:0 9px}.ativa{background:linear-gradient(#24c553,#087529);border-color:#9affad}.rodape{display:flex;justify-content:space-between;margin-top:7px;padding:7px 10px;background:#05090c;border:2px solid #76501c;color:#f6d66b;font-size:11px;font-weight:1000}.premio{color:#fff}.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);opacity:0;background:radial-gradient(circle,#77510c,#050505 65%);border:4px solid #ffd85c;padding:25px 42px;text-align:center;z-index:20;box-shadow:0 0 50px #ffc40099}.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1}.pop h2{margin:0;color:#ffdb59}.pop p{font-size:24px;font-weight:1000;margin:7px 0 0}@media(max-width:700px){body{padding:2px}.cabine{padding:5px;border-width:3px}.titulo{height:47px}.titulo h1{font-size:21px;letter-spacing:1px}.titulo b{font-size:22px;margin:0 6px}.saldo{font-size:11px;padding:5px 8px}.acao{width:31px;height:30px;font-size:14px}.msg{font-size:10px}.mesa{grid-template-columns:28px 1fr 28px;gap:3px}.linhas{font-size:7px}.moldura{padding:4px;border-width:3px}.rolos{gap:2px;padding:2px}.col{gap:2px}.cel{height:68px;border-width:1px}.cel img{width:86%;height:86%}.letra{font-size:27px}.controle{grid-template-columns:1fr;justify-items:center;padding:6px}.grupo,.ferr{justify-content:center}.girar{width:180px;height:54px;font-size:21px}.rodape{font-size:9px}}
</style></head><body><div class="cabine"><div class="titulo"><b>💀</b><h1>TESOURO PIRATA</h1><b>☠️</b></div><div class="barra"><div class="saldo">SALDO: R$ <span id="balance">0,00</span></div><div class="acoes"><button class="acao">🔊</button><button class="acao">ⓘ</button><button class="acao">☰</button></div></div><div class="msg">Encontre 3 ou mais 💀 para ganhar!</div><div id="errorMessage" class="erro"></div><div class="mesa"><div class="linhas">25 LINHAS</div><div class="moldura"><div id="reelsGrid" class="rolos"></div></div><div class="linhas">25 LINHAS</div></div><div class="controle"><div class="grupo"><button class="btn" id="minusBtn">−</button><div class="aposta"><small>APOSTA</small>R$ <span id="betAmount">1,00</span></div><button class="btn" id="plusBtn">+</button><button class="btn max" id="maxBtn">APOSTA MÁXIMA</button></div><button class="girar" id="spinBtn">GIRAR</button><div class="ferr"><button class="btn" id="turboBtn">⚡ TURBO</button><button class="btn" id="autoBtn">AUTO <span id="autoCount">10</span></button></div></div><div class="rodape"><span id="statusText">BOA SORTE!</span><span class="premio">PRÊMIO: R$ <span id="prizeValue">0,00</span></span></div><div class="pop" id="winPopup"><h2>🏆 TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div></div><script type="module">
import "../saldo.js";
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];const PAYOUTS={captain:1.5,parrot:1.25,chest:1.05,map:.9,compass:.8,bottle:.7,K:.6,Q:.5,J:.4,A:.3};const A='https://commons.wikimedia.org/wiki/Special:FilePath/';const AS={captain:A+'Captain_pirate.png',ship:A+'Pirate_ship_-_Pirates_(1922).png',chest:A+'Treasure_chest_with_gold_coins.svg',bottle:A+'Glass_bottle.jpg',compass:A+'Negus_liquid_compass.png',map:A+'Treasuremap.jpg',cannon:A+'Cannon_model.png',parrot:A+'Parrot_standard.png',scatter:A+'Skull_and_Crossbones.png'};const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');function money(v){return Number(v||0).toFixed(2).replace('.',',')}function error(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){error('Não foi possível carregar seu saldo.')}}function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cel';cell.appendChild(makeCell(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}function setCell(cell,s){cell.innerHTML='';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s))}function clear(){document.querySelectorAll('.cel').forEach(c=>c.classList.remove('win'))}function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .cel');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter=''}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!'}async function wins(grid){let mult=0;const cells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let m=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)m++;else break}if(m>=3&&PAYOUTS[fs]){mult+=PAYOUTS[fs]*(m-2);for(let i=0;i<m;i++)cells.add(line[i])}});if(mult<=0){prizeValue.textContent='0,00';return}mult=Math.min(mult,MAX_TOTAL_MULTIPLIER);const ganho=await window.SistemaSaldo.processarVitoria(currentBet,mult);if(ganho&&ganho>0){prizeValue.textContent=money(ganho);winValue.textContent=money(ganho);winPopup.classList.add('on');setTimeout(()=>winPopup.classList.remove('on'),2200);cells.forEach(i=>$('col-'+Math.floor(i/ROWS))?.children[i%ROWS]?.classList.add('win'));statusText.textContent='TESOURO ENCONTRADO!'}}minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';spin()};async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();</script></body></html>
