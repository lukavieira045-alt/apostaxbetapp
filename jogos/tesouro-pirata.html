<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
:root{--gold:#f7c94a;--gold2:#8d5617;--wood:#2a1609;--navy:#061a2c;--green:#1dbb4b;--red:#9d1717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px;background:#031424 url('../jogos/tesouro-pirata.png') center/cover fixed no-repeat;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,16,35,.18),rgba(0,5,12,.78));z-index:-1}.cabine{width:min(1100px,100%);padding:10px;background:linear-gradient(180deg,#503016,#1a0c04 18%,#08090b 82%,#32190b);border:5px solid #a96c20;box-shadow:0 0 0 2px #f8d36a55,0 22px 70px #000,inset 0 0 30px #000;border-radius:12px}.titulo{height:64px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;background:linear-gradient(#c18425,#6c3a0d);border:3px solid #e9c35d;border-radius:7px;box-shadow:inset 0 0 0 2px #4c2608,0 4px 10px #000}.titulo h1{margin:0;color:#ffe16b;font-size:clamp(25px,5vw,43px);font-weight:1000;letter-spacing:3px;text-shadow:0 3px #432200,0 0 16px #ffca27}.titulo .skull{font-size:34px;margin:0 14px}.barra-top{display:flex;justify-content:space-between;align-items:center;margin:5px 4px 8px}.saldo{background:linear-gradient(#192b3b,#060a0e);border:2px solid #b88a32;border-radius:4px;padding:7px 14px;color:#ffd96a;font-weight:900}.acoes{display:flex;gap:5px}.acao{width:38px;height:35px;border:2px solid #a9792d;background:linear-gradient(#374957,#0a1015);color:white;border-radius:4px;font-size:18px}.mensagem{text-align:center;color:#f9df91;font-size:13px;font-weight:900;margin:2px 0 7px}.mesa{display:grid;grid-template-columns:54px 1fr 54px;gap:7px}.linhas{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);background:linear-gradient(#56300e,#1b0b04);border:3px solid #9c661e;color:#ffd968;font-size:12px;font-weight:1000;letter-spacing:1px;box-shadow:inset 0 0 18px #000}.painel-rolos{padding:9px;background:linear-gradient(180deg,#b37a26,#5e350e 8%,#17100a 9%,#070d13 100%);border:5px solid #b8832b;box-shadow:inset 0 0 0 2px #3d2209,0 8px 22px #000}.rolos{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#020609;border:3px solid #7b521d;padding:3px}.coluna{display:grid;gap:3px}.celula{height:112px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#31566d,#08131c 68%);border:2px solid #765a30;box-shadow:inset 0 0 15px #000,inset 0 1px #ffffff22;font-size:44px}.celula img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 5px 4px #000)}.celula .letra{font-weight:1000;font-size:clamp(34px,5vw,54px);text-shadow:0 3px 4px #000,0 0 8px currentColor}.K{color:#49a7ff}.Q{color:#39dc87}.J{color:#c47bff}.A{color:#ff5148}.scatter{border-color:#ed3b2c}.scatter:after{content:'SCATTER';position:absolute;bottom:2px;left:8px;right:8px;text-align:center;background:#a71816;color:#fff;font-size:8px;font-weight:1000;letter-spacing:1px;padding:2px}.vencedor{animation:ganha .45s infinite alternate;z-index:3}@keyframes ganha{to{transform:scale(1.08);filter:brightness(1.6);box-shadow:0 0 20px #ffd51f,inset 0 0 20px #ff9d00}}.controle{display:grid;grid-template-columns:1fr 210px 1fr;align-items:center;gap:10px;margin-top:8px;padding:10px;background:linear-gradient(#161b1e,#050607);border:3px solid #80551d;box-shadow:inset 0 0 20px #000}.grupo{display:flex;align-items:center;gap:5px}.info{min-width:68px;text-align:center;color:#f9d86c;font-weight:1000;font-size:14px}.label{font-size:9px;color:#aaa;text-transform:uppercase}.btn{height:39px;min-width:39px;border:2px solid #806b45;border-radius:4px;background:linear-gradient(#53606a,#13191e);color:#fff;font-weight:1000}.max{padding:0 9px}.girar{height:67px;border-radius:6px;border:4px solid #a7f5b4;background:linear-gradient(#42df69,#15953a 60%,#075c22);color:#fff;font-size:25px;font-weight:1000;box-shadow:0 5px #033b15,0 0 20px #16c94c55;text-shadow:0 2px 3px #064317}.girar:disabled{opacity:.5;filter:grayscale(1)}.ferramentas{display:flex;justify-content:flex-end;gap:5px}.ferramenta{height:39px;border:2px solid #806b45;border-radius:4px;background:linear-gradient(#53606a,#13191e);color:#fff;font-weight:1000;padding:0 9px}.ferramenta.ativa{background:linear-gradient(#24c553,#087529);border-color:#9affad}.rodape{display:flex;justify-content:space-between;margin-top:7px;padding:7px 10px;background:#05090c;border:2px solid #76501c;color:#f6d66b;font-size:11px;font-weight:1000}.premio{color:#fff}.erro{display:none;text-align:center;background:#4a0d0d;border:2px solid #ff4b4b;padding:7px;margin-bottom:6px}.popup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;background:radial-gradient(circle,#77510c,#050505 65%);border:4px solid #ffd85c;padding:25px 42px;text-align:center;z-index:20;box-shadow:0 0 50px #ffc40099}.popup.ativo{transform:translate(-50%,-50%) scale(1);opacity:1}.popup h2{margin:0;color:#ffdb59;font-size:28px}.popup p{font-size:24px;font-weight:1000;margin:7px 0 0}
@media(max-width:700px){body{padding:2px}.cabine{padding:5px;border-width:3px}.titulo{height:48px}.titulo h1{font-size:21px;letter-spacing:1px}.titulo .skull{font-size:22px;margin:0 6px}.saldo{font-size:11px;padding:5px 8px}.acao{width:31px;height:30px;font-size:14px}.mensagem{font-size:10px}.mesa{grid-template-columns:29px 1fr 29px;gap:3px}.linhas{font-size:7px;border-width:2px}.painel-rolos{padding:4px;border-width:3px}.rolos{gap:2px;padding:2px}.coluna{gap:2px}.celula{height:70px;font-size:27px;border-width:1px}.celula .letra{font-size:27px}.controle{grid-template-columns:1fr;justify-items:center;padding:6px}.grupo,.ferramentas{justify-content:center}.girar{width:180px;height:55px;font-size:21px}.rodape{font-size:9px}.max{font-size:10px}}
</style>
</head>
<body>
<div class="cabine">
  <div class="titulo"><span class="skull">💀</span><h1>TESOURO PIRATA</h1><span class="skull">☠️</span></div>
  <div class="barra-top"><div class="saldo">SALDO: R$ <span id="balance">0,00</span></div><div class="acoes"><button class="acao">🔊</button><button class="acao">ⓘ</button><button class="acao">☰</button></div></div>
  <div class="mensagem">Encontre 3 ou mais 💀 para ganhar!</div>
  <div id="errorMessage" class="erro"></div>
  <div class="mesa"><div class="linhas">25 LINHAS</div><div class="painel-rolos"><div id="reelsGrid" class="rolos"></div></div><div class="linhas">25 LINHAS</div></div>
  <div class="controle"><div class="grupo"><button class="btn" id="minusBtn">−</button><div class="info"><div class="label">APOSTA</div>R$ <span id="betAmount">1,00</span></div><button class="btn" id="plusBtn">+</button><button class="btn max" id="maxBtn">APOSTA MÁXIMA</button></div><button class="girar" id="spinBtn">GIRAR</button><div class="ferramentas"><button class="ferramenta" id="turboBtn">⚡ TURBO</button><button class="ferramenta" id="autoBtn">AUTO <span id="autoCount">10</span></button></div></div>
  <div class="rodape"><span id="statusText">BOA SORTE!</span><span class="premio">PRÊMIO: R$ <span id="prizeValue">0,00</span></span></div>
  <div class="popup" id="winPopup"><h2>🏆 TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
</div>
<script type="module">
import "../saldo.js";
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];
const PAYOUTS={captain:1.50,parrot:1.25,chest:1.05,map:.90,compass:.80,bottle:.70,K:.60,Q:.50,J:.40,A:.30};
const ASSET='https://commons.wikimedia.org/wiki/Special:FilePath/';
const ASSETS={captain:ASSET+'Captain_pirate.png',ship:ASSET+'Pirate_ship_-_Pirates_(1922).png',chest:ASSET+'Treasure_chest_with_gold_coins.svg',bottle:ASSET+'Glass_bottle.jpg',compass:ASSET+'Negus_liquid_compass.png',map:ASSET+'Treasuremap.jpg',cannon:ASSET+'Cannon_model.png',parrot:ASSET+'Parrot_standard.png',scatter:ASSET+'Skull_and_Crossbones.png'};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,6,11,12],[0,3,6,9,14]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function money(v){return Number(v||0).toFixed(2).replace('.',',')}function err(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){err('Não foi possível carregar seu saldo.')}}function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}
function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function cellSymbol(s){if(['K','Q','J','A'].includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=ASSETS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}
function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='coluna';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='celula';cell.appendChild(cellSymbol(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}
function clear(){document.querySelectorAll('.celula').forEach(x=>x.classList.remove('vencedor','scatter'))}
function setCell(cell,s){cell.innerHTML='';cell.appendChild(cellSymbol(s));if(s==='scatter')cell.classList.add('scatter')}
function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}
async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){err('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('ativo');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .celula');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}
async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter='';}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!'}
async function wins(grid){let mult=0;const cells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let matches=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)matches++;else break}if(matches>=3&&PAYOUTS[fs]){mult+=PAYOUTS[fs]*(matches-2);for(let i=0;i<matches;i++)cells.add(line[i])}});if(mult<=0){prizeValue.textContent='0,00';return}mult=Math.min(mult,MAX_TOTAL_MULTIPLIER);const ganho=await window.SistemaSaldo.processarVitoria(currentBet,mult);if(ganho&&ganho>0){prizeValue.textContent=money(ganho);winValue.textContent=money(ganho);winPopup.classList.add('ativo');setTimeout(()=>winPopup.classList.remove('ativo'),2200);cells.forEach(i=>{const col=$('col-'+Math.floor(i/ROWS));col?.children[i%ROWS]?.classList.add('vencedor')});statusText.textContent='TESOURO ENCONTRADO!'}}
minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=spin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';spin()};
async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){err('Erro ao carregar o sistema de saldo.');return}await balance()}start();
</script>
</body>
</html>
