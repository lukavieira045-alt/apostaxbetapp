<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
:root{--gold:#dca83a;--gold2:#ffe28a;--wood:#32190b;--wood2:#5a3216;--teal:#063f4b;--teal2:#087184;--ink:#07090b;--green:#18b957;--green2:#70ef98}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#071725;color:#fff}
body{background-image:linear-gradient(180deg,rgba(4,22,37,.05),rgba(2,7,13,.5)),url('../jogos/tesouro-pirata.png');background-size:cover;background-position:center;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(12,75,103,.12),rgba(0,0,0,.62) 72%,rgba(0,0,0,.88));pointer-events:none}
#game{position:relative;width:min(1180px,100vw);height:min(100vh,800px);margin:auto;display:flex;flex-direction:column;justify-content:center;padding:14px 22px 8px;filter:drop-shadow(0 22px 35px #0009)}
.header{height:64px;display:flex;justify-content:center;align-items:flex-end;position:relative;z-index:3}
.logo{position:relative;min-width:390px;text-align:center;padding:10px 42px 13px;color:#ffe37b;font-weight:1000;font-size:clamp(24px,4vw,40px);letter-spacing:1px;text-shadow:0 3px 0 #3a1800,0 0 12px #ffcf4d;line-height:1;background:linear-gradient(#704116,#2b1508);border:4px solid #b98227;border-radius:10px 10px 4px 4px;box-shadow:inset 0 2px #ffe5a0,inset 0 -7px 12px #160802,0 4px 0 #1b0b04}
.logo:before,.logo:after{content:"⚔";position:absolute;top:7px;color:#c6a05c;font-size:26px;text-shadow:0 2px #111}.logo:before{left:10px;transform:rotate(-25deg)}.logo:after{right:10px;transform:scaleX(-1) rotate(-25deg)}
.top-status{position:absolute;left:22px;bottom:10px;display:flex;gap:8px;z-index:5}.round{width:38px;height:38px;border-radius:50%;border:2px solid #bda77c;background:linear-gradient(#28313a,#080b0e);color:#fff;font-size:18px;box-shadow:inset 0 2px #fff3,0 2px 4px #000;cursor:pointer}
.machine{position:relative;display:flex;flex:1;min-height:0;background:linear-gradient(90deg,#102f3b,#06242f 50%,#102f3b);border:8px solid #68401d;border-top-width:6px;border-radius:12px 12px 5px 5px;box-shadow:inset 0 0 0 2px #d7a449,inset 0 0 0 6px #2a1408,inset 0 0 35px #000,0 7px 0 #1b0d05;overflow:hidden}
.machine:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#087e8d33,transparent 45%),linear-gradient(90deg,#0008,transparent 12%,transparent 88%,#0008);pointer-events:none}
.reel-frame{position:relative;flex:1;margin:12px 13px 10px;border:4px solid #b98735;background:#08151a;box-shadow:inset 0 0 0 2px #321b09,inset 0 0 30px #000,0 3px 8px #000;overflow:hidden}
.reel-frame:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent 7%,transparent 93%,rgba(0,0,0,.7)),repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),rgba(220,190,120,.3) calc(20% - 1px),rgba(220,190,120,.3) 20%);pointer-events:none}
.reels{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.reel{display:grid;grid-template-rows:repeat(3,1fr);min-width:0;border-right:1px solid #7d5a2d66}.reel:last-child{border-right:0}
.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(90deg,#080b0d,#17110d 48%,#070a0c);border-bottom:1px solid #8a672f55;min-height:0}
.cell:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff2,transparent 20%,transparent 75%,#0005);pointer-events:none}
.cell img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 5px 4px #000) drop-shadow(0 0 5px #fff2);transition:transform .16s;position:relative;z-index:1}.cell.spinning img{filter:blur(2px) brightness(.75);transform:scaleY(.88)}
.card-symbol{font-weight:1000;font-size:clamp(34px,6vw,64px);font-family:Georgia,serif;text-shadow:0 3px 0 #000,0 0 8px currentColor}.card-symbol.K{color:#d34adf}.card-symbol.Q{color:#23a8e8}.card-symbol.J{color:#4ee15c}.card-symbol.A{color:#e84c3e}
.cell.scatter{background:radial-gradient(circle,#41220d,#08090a 70%);box-shadow:inset 0 0 24px #ff8a0018}.cell.scatter:before{content:"SCATTER";position:absolute;bottom:5px;left:14%;right:14%;z-index:3;text-align:center;font-weight:1000;font-size:9px;letter-spacing:2px;color:#fff;background:linear-gradient(#d8341f,#6f1008);border:1px solid #ff9b65;border-radius:3px;padding:2px;text-shadow:0 1px #000}
.cell.winner{background:radial-gradient(circle,#ffe27b,#b96b08 45%,#221006);box-shadow:inset 0 0 25px #fff5,0 0 18px #ffbd2e;z-index:4}.cell.winner img{transform:scale(1.1)}
.bottom{height:92px;position:relative;display:grid;grid-template-columns:260px 1fr 250px;align-items:center;gap:12px;padding:7px 10px;background:linear-gradient(#161a1d,#050708);border-top:5px solid #71461d;box-shadow:inset 0 2px #d1a04d,inset 0 12px 25px #000,0 6px 0 #1b0c04;z-index:5}
.stats{display:flex;flex-direction:column;justify-content:center;color:#f0c65d;font-weight:1000;font-size:15px;line-height:1.45;text-shadow:0 2px #000}.stats strong{color:#fff;font-size:18px;margin-left:5px}.winline{text-align:center;font-weight:1000;font-size:18px;color:#fff;letter-spacing:.5px}.winline b{display:block;font-size:13px;color:#ffcf5a;margin-top:3px}
.controls{display:flex;justify-content:flex-end;align-items:center;gap:9px}.bet-btn,.auto{width:42px;height:42px;border-radius:50%;border:2px solid #bbb4a8;background:linear-gradient(#363c40,#0a0d0f);color:#fff;font-size:25px;font-weight:900;box-shadow:inset 0 2px #fff4,0 2px 4px #000;cursor:pointer}.spin{width:72px;height:72px;border-radius:50%;border:4px solid #d7b56b;background:radial-gradient(circle at 35% 30%,#43545a,#11191c 55%,#030506);color:#fff;font-size:43px;line-height:1;box-shadow:inset 0 3px #fff4,0 0 0 2px #30200d,0 5px 9px #000;cursor:pointer}.spin:active:not(:disabled){transform:scale(.95)}.spin:disabled{opacity:.4}.auto{width:80px;border-radius:18px;font-size:11px;line-height:1.1}.auto b{display:block;color:#ffcf58;font-size:12px}.turbo{width:52px;height:30px;border-radius:15px;border:1px solid #82785e;background:#171b1c;color:#ddd;font-weight:900}.turbo.active{background:#128d3c;border-color:#70e99a;color:#fff}
.message{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.7);z-index:20;opacity:0;pointer-events:none;text-align:center;transition:.22s;background:linear-gradient(180deg,#5d350d,#0b0804);border:4px solid #f1c04e;border-radius:8px;padding:18px 35px;box-shadow:0 0 0 3px #3b1b06,0 15px 50px #000;min-width:280px}.message.active{opacity:1;transform:translate(-50%,-50%) scale(1)}.message h2{margin:0;color:#ffd34f;font-size:34px;text-shadow:0 3px #3b1800}.message p{margin:4px 0 0;font-size:22px;font-weight:1000}
.error{position:absolute;z-index:30;left:50%;top:15%;transform:translateX(-50%);display:none;background:#4c0c0c;border:1px solid #ff6255;padding:8px 15px;border-radius:5px;color:#fff;font-weight:900}
@media(max-width:700px){#game{height:100vh;padding:5px 4px 3px}.header{height:43px}.logo{min-width:240px;padding:7px 30px 9px;font-size:21px;border-width:2px}.logo:before,.logo:after{font-size:16px;top:5px}.top-status{left:5px;bottom:5px}.round{width:29px;height:29px;font-size:13px}.machine{border-width:4px}.reel-frame{margin:6px 4px;border-width:2px}.cell img{width:91%;height:91%}.card-symbol{font-size:28px}.cell.scatter:before{font-size:6px;bottom:2px}.bottom{height:75px;grid-template-columns:1fr 1fr;gap:3px;padding:4px}.stats{font-size:10px}.stats strong{font-size:12px}.winline{font-size:12px}.winline b{font-size:9px}.controls{grid-column:1/3;position:absolute;right:3px;bottom:5px;gap:4px}.bet-btn{width:30px;height:30px;font-size:18px}.spin{width:52px;height:52px;font-size:30px}.auto{width:52px;height:29px;font-size:8px}.auto b{font-size:9px}.turbo{display:none}}
@media(max-height:600px) and (min-width:701px){.header{height:47px}.bottom{height:74px}.reel-frame{margin:7px 12px}}
</style>
</head>
<body>
<div id="game">
  <div class="header">
    <div class="top-status"><button class="round" title="Menu">☰</button><button class="round" title="Som">🔊</button><button class="round" title="Informações">i</button></div>
    <div class="logo">TESOURO PIRATA</div>
  </div>
  <div class="machine">
    <div class="reel-frame"><div id="reelsGrid" class="reels"></div></div>
  </div>
  <div class="bottom">
    <div class="stats">CRÉDITO <strong>R$ <span id="balance">0,00</span></strong><br>APOSTA <strong>R$ <span id="betAmount">1,00</span></strong></div>
    <div class="winline"><span id="statusText">BOA SORTE!</span><b>PRÊMIO: R$ <span id="prizeValue">0,00</span></b></div>
    <div class="controls"><button class="bet-btn" id="minusBtn">−</button><button class="spin" id="spinBtn" title="GIRAR">↻</button><button class="bet-btn" id="plusBtn">+</button><button class="auto" id="autoBtn"><b>AUTO</b><span id="autoCount">10</span></button><button class="turbo" id="turboBtn">TURBO</button></div>
  </div>
  <div id="errorMessage" class="error"></div>
  <div id="winPopup" class="message"><h2>TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
</div>
<script type="module">
import "../saldo.js";
const ASSET='https://commons.wikimedia.org/wiki/Special:FilePath/';
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];
const SYMBOL_ASSETS={captain:ASSET+'Captain_pirate.png',ship:ASSET+'Pirate_ship_-_Pirates_(1922).png',chest:ASSET+'Treasure_chest_with_gold_coins.svg',bottle:ASSET+'Glass_bottle.jpg',compass:ASSET+'Negus_liquid_compass.png',map:ASSET+'Treasuremap.jpg',cannon:ASSET+'Cannon_model.png',parrot:ASSET+'Parrot_standard.png',scatter:ASSET+'Skull_and_Crossbones.png'};
const LABELS={captain:'Capitão',ship:'Navio Pirata',chest:'Baú do Tesouro',bottle:'Garrafa',compass:'Bússola',map:'Mapa',cannon:'Canhão',parrot:'Papagaio',K:'K',Q:'Q',J:'J',A:'A',scatter:'SCATTER'};
/* FINANCEIRO PRESERVADO */
const PAYOUTS={captain:1.50,parrot:1.25,chest:1.05,map:0.90,compass:0.80,bottle:0.70,K:0.60,Q:0.50,J:0.40,A:0.30};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function formatMoney(v){return Number(v||0).toFixed(2).replace('.',',')}
function showError(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function updateRealBalance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=formatMoney(realBalance);updateUI()}catch(e){showError('Não foi possível carregar seu saldo.')}}
function updateUI(){betEl.textContent=formatMoney(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=isSpinning}
function adjustBet(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));updateUI()}}
function getRandomSymbol(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function renderSymbol(cell,symbol){cell.innerHTML='';cell.dataset.symbol=symbol;if(SYMBOL_ASSETS[symbol]){const img=document.createElement('img');img.src=SYMBOL_ASSETS[symbol];img.alt=LABELS[symbol];img.loading='lazy';img.referrerPolicy='no-referrer';cell.appendChild(img)}else{const span=document.createElement('span');span.textContent=symbol;span.className='card-symbol '+symbol;cell.appendChild(span)}if(symbol==='scatter'){cell.classList.add('scatter')}else cell.classList.remove('scatter')}
function initGame(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='reel';for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cell';renderSymbol(cell,getRandomSymbol());col.appendChild(cell)}reelsGrid.appendChild(col)}}
function clearHighlights(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('winner'))}
function highlightWinners(indices){indices.forEach(i=>{const col=reelsGrid.children[Math.floor(i/ROWS)];if(col?.children[i%ROWS])col.children[i%ROWS].classList.add('winner')})}
async function spin(){if(isSpinning)return;await updateRealBalance();if(realBalance<currentBet){showError('Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const debitoOK=await window.SistemaSaldo.debitar(currentBet);if(!debitoOK){await updateRealBalance();return}realBalance=Math.max(0,realBalance-currentBet);updateUI();clearHighlights();winPopup.classList.remove('active');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO':'GIRANDO...';const reels=[...document.querySelectorAll('.reel')];reels.forEach(col=>[...col.children].forEach(x=>x.classList.add('spinning')));let count=0;const limit=turbo?8:30,delay=turbo?45:60;const animation=setInterval(()=>{for(const col of reels)for(const cell of col.children)renderSymbol(cell,getRandomSymbol());if(++count>=limit){clearInterval(animation);finalizeSpin(reels)}},delay)}
async function finalizeSpin(reels){const finalGrid=[];for(let c=0;c<COLS;c++){const result=[];for(let r=0;r<ROWS;r++){const s=getRandomSymbol();result.push(s);renderSymbol(reels[c].children[r],s);reels[c].children[r].classList.remove('spinning')}finalGrid.push(result)}await checkWins(finalGrid);isSpinning=false;await updateRealBalance();updateUI();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!'}}else statusText.textContent='BOA SORTE!'}
async function checkWins(grid){let totalMultiplier=0;const winningCells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let matches=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)matches++;else break}if(matches>=3&&PAYOUTS[fs]){totalMultiplier+=PAYOUTS[fs]*(matches-2);for(let i=0;i<matches;i++)winningCells.add(line[i])}});if(totalMultiplier<=0){prizeValue.textContent='0,00';return}totalMultiplier=Math.min(totalMultiplier,MAX_TOTAL_MULTIPLIER);const ganhoReal=await window.SistemaSaldo.processarVitoria(currentBet,totalMultiplier);if(ganhoReal&&ganhoReal>0){prizeValue.textContent=formatMoney(ganhoReal);winValue.textContent=formatMoney(ganhoReal);winPopup.classList.add('active');setTimeout(()=>winPopup.classList.remove('active'),2200);highlightWinners(winningCells);statusText.textContent='TESOURO ENCONTRADO!'}}
minusBtn.addEventListener('click',()=>adjustBet(-1));plusBtn.addEventListener('click',()=>adjustBet(1));spinBtn.addEventListener('click',spin);$('turboBtn').addEventListener('click',e=>{turbo=!turbo;e.currentTarget.classList.toggle('active',turbo)});$('autoBtn').addEventListener('click',()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;statusText.textContent='AUTO CANCELADO';$('autoCount').textContent='10';return}autoSpins=10;autoRunning=true;$('autoCount').textContent=autoSpins;statusText.textContent='AUTO: 10 GIROS';spin()});
async function startGame(){initGame();let attempts=0;while(!window.SistemaSaldo&&attempts<50){await new Promise(r=>setTimeout(r,50));attempts++}if(!window.SistemaSaldo){showError('Erro ao carregar o sistema de saldo.');return}await updateRealBalance()}startGame();
</script>
</body>
</html>
