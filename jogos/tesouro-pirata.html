<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tesouro Pirata — ApostaXBet</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;color:#fff;background:#063b55 url('../jogos/tesouro-pirata.png') center/cover no-repeat;position:relative}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,45,70,.02),rgba(0,0,0,.18) 48%,rgba(0,0,0,.78));z-index:0}
.casino{position:relative;z-index:1;width:100%;height:100%;max-width:1280px;max-height:800px;margin:auto;display:grid;grid-template-rows:64px minmax(0,1fr) 82px;overflow:hidden}
.top{display:flex;justify-content:center;align-items:flex-start;position:relative;z-index:4}
.title{position:relative;margin-top:2px;width:470px;height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#b77a2c,#713b12 48%,#321605);border:3px solid #e6c260;border-radius:8px 8px 22px 22px;box-shadow:0 4px 0 #241006,0 6px 12px #000c,inset 0 2px #fff5}
.title:before,.title:after{content:"";position:absolute;top:20px;width:115px;height:15px;background:linear-gradient(#8c5822,#3b1b08);border:2px solid #c3913d;z-index:-1}.title:before{right:100%}.title:after{left:100%}
.title h1{margin:0;color:#ffe16a;font:900 35px/1 Georgia,serif;letter-spacing:1px;text-shadow:0 3px #642b08,0 4px 7px #000,0 0 12px #f6a800}
.title .sk{font-size:23px;margin:0 12px;filter:drop-shadow(0 3px 3px #000)}
.stage{min-height:0;display:flex;align-items:center;justify-content:center;padding:0 38px 4px;position:relative}
.machine{position:relative;width:min(1030px,100%);height:100%;padding:7px 9px;background:linear-gradient(90deg,#2a1206,#734216 2%,#b57a2c 3.5%,#513014 5%,#211006 6%,#100b08 8%,#0a0b0a 50%,#100b08 92%,#211006 94%,#513014 95%,#b57a2c 96.5%,#734216 98%,#2a1206);border:5px solid #3a1b08;box-shadow:0 0 0 2px #d7ad55,0 0 0 5px #2b1105,0 10px 24px #000e}
.machine:before,.machine:after{content:"";position:absolute;top:2px;bottom:2px;width:18px;background:linear-gradient(90deg,#2b1206,#a66c28,#4d2a0e);border:1px solid #e2bc61;box-shadow:inset 0 0 8px #000}.machine:before{left:-5px}.machine:after{right:-5px}
.reelWindow{height:100%;overflow:hidden;background:#130905;border:3px solid #211006;box-shadow:inset 0 0 20px #000;position:relative}
.reelWindow:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:10;border:1px solid #b88439;box-shadow:inset 0 0 12px #000}
.reelWindow:after{content:"";position:absolute;left:0;right:0;top:0;height:10%;pointer-events:none;z-index:11;background:linear-gradient(rgba(255,255,255,.1),transparent)}
.rolos{height:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#120805}
.col{display:grid;grid-template-rows:repeat(3,1fr);background:linear-gradient(90deg,#0b0503,#28150b 48%,#0b0503);border-right:2px solid #66401d;position:relative}.col:last-child{border-right:0}.col:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#d2a34844}
.cel{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#4b2d18,#271309 54%,#0b0503);border-bottom:2px solid #68401c;box-shadow:inset 0 0 18px #000}.cel:last-child{border-bottom:0}.cel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#fff1,transparent 18%,transparent 70%,#0007)}.cel img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 5px 4px #000)}
.letra{font:900 clamp(52px,6vw,82px)/1 Georgia,serif;text-shadow:0 4px 3px #000,0 0 8px #000}.K{color:#2ea9ff}.Q{color:#48e35d}.J{color:#cf45ef}.A{color:#ef3838}
.scatter{border:2px solid #d9a93d;background:radial-gradient(circle,#6d470e,#210c03 68%);box-shadow:inset 0 0 24px #efa800,0 0 12px #f0a80055}.scatter:after{content:'SCATTER';position:absolute;bottom:4px;left:14%;right:14%;padding:2px;text-align:center;background:#8f180e;border:1px solid #d8aa47;color:#fff;font-size:8px;font-weight:900;letter-spacing:1px}
.win{animation:win .4s infinite alternate;z-index:20}@keyframes win{to{transform:scale(1.06);filter:brightness(1.7);box-shadow:inset 0 0 25px #ffd21b,0 0 24px #ffc000}}
.bottom{display:grid;grid-template-columns:260px 1fr 470px;align-items:center;gap:8px;padding:5px 14px;background:linear-gradient(#252a2b,#111618 48%,#050708);border-top:4px solid #8d642d;box-shadow:0 -5px 18px #000d,inset 0 1px #fff2;position:relative;z-index:5}
.leftPanel{display:flex;align-items:center;gap:6px}.round{width:36px;height:36px;border-radius:50%;border:2px solid #8e7144;background:radial-gradient(circle at 35% 25%,#4a5455,#111719 62%,#050708);color:#fff;font-weight:900;box-shadow:inset 0 1px #fff3,0 3px 6px #000}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:175px;padding:5px 8px;background:#06090a;border:1px solid #67502c;border-radius:3px}.stat small{display:block;color:#999;font-size:7px;letter-spacing:1px}.stat b{display:block;color:#f4d36c;font-size:13px;margin-top:1px}
.center{text-align:center}.hold{font-size:10px;font-weight:900;color:#e8d9a5;letter-spacing:.5px}.winbar{font-size:23px;font-weight:1000;margin-top:3px;text-shadow:0 2px 4px #000}.winbar span{color:#ffd650}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:6px}.bet{display:flex;align-items:center;gap:4px}.betvalue{text-align:center;min-width:58px}.betvalue small{display:block;color:#999;font-size:7px}.betvalue b{color:#ffe27b;font-size:12px}.spin{width:70px;height:70px;border-radius:50%;border:4px solid #dffff0;background:radial-gradient(circle at 32% 18%,#8aff9b,#28c95a 40%,#0d7934 68%,#03431b);color:#fff;font-size:13px;font-weight:1000;box-shadow:0 5px #022f11,0 0 22px #1dd95c88,inset 0 2px 6px #fff8}.spin:disabled{opacity:.45;filter:grayscale(1)}.auto{height:36px;min-width:62px;border-radius:4px;border:2px solid #806b49;background:linear-gradient(#3b4243,#101517);color:#fff;font-size:10px;font-weight:900}.max{width:45px!important}.ativa{background:linear-gradient(#2ee065,#08782d)!important;border-color:#baffc2!important}
.erro{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;padding:7px 15px;background:#640c09;border:2px solid #ff9673;border-radius:4px;font-weight:900}.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:60;min-width:290px;padding:25px 35px;text-align:center;background:radial-gradient(circle,#b37b20,#5a340d 46%,#100704 80%);border:4px solid #f5d15f;border-radius:7px;box-shadow:0 0 0 2px #573509,0 0 55px #ffc400aa;transition:.2s}.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1}.pop h2{margin:0;color:#ffdf62;font:900 28px Georgia,serif}.pop p{margin:8px 0 0;font-size:24px;font-weight:1000}
@media(max-width:760px){.casino{grid-template-rows:52px minmax(0,1fr) 86px}.title{width:84vw;height:47px;border-width:3px}.title:before,.title:after{width:25px;height:10px;top:16px}.title h1{font-size:17px}.title .sk{font-size:15px;margin:0 6px}.stage{padding:0 4px 3px}.machine{padding:4px;border-width:3px}.machine:before,.machine:after{display:none}.reelWindow{border-width:2px}.col{border-right-width:1px}.cel{border-bottom-width:1px}.cel img{width:94%;height:94%}.letra{font-size:30px}.bottom{grid-template-columns:1fr 68px 1fr;gap:2px;padding:3px}.leftPanel{gap:2px}.leftPanel>.round{width:28px;height:28px;font-size:9px}.stats{display:none}.hold{font-size:6px;line-height:9px}.winbar{font-size:14px;line-height:18px}.controls{gap:2px}.bet{gap:2px}.bet .round{width:28px;height:28px}.betvalue{min-width:39px}.betvalue small{font-size:5px}.betvalue b{font-size:8px}.max{width:31px!important;font-size:6px}.spin{width:57px;height:57px;font-size:10px;border-width:3px}.auto{min-width:40px;height:28px;font-size:6px;padding:0 2px}.pop{min-width:235px;padding:20px 24px}.pop h2{font-size:24px}.pop p{font-size:20px}}
</style>
<style id="lobby-spin-css">
.lobby-strip{position:absolute;left:0;right:0;top:0;display:block;z-index:8;will-change:transform}
.lobby-strip .cel{width:100%;display:flex}
.lobby-strip.lobby-spinning .cel img,.lobby-strip.lobby-spinning .letra{filter:blur(2px) brightness(1.15)}
.col{overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="casino">
  <div class="top"><div class="title"><span class="sk">☠</span><h1>TESOURO PIRATA</h1><span class="sk">☠</span></div></div>
  <div class="stage">
    <div id="errorMessage" class="erro"></div>
    <div class="machine"><div class="reelWindow"><div id="reelsGrid" class="rolos"></div></div></div>
    <div class="pop" id="winPopup"><h2>TESOURO!</h2><p>+ R$ <span id="winValue">0,00</span></p></div>
  </div>
  <div class="bottom">
    <div class="leftPanel"><button class="round">☰</button><button class="round">i</button><div class="stats"><div class="stat"><small>CREDIT</small><b>R$ <span id="balance">0,00</span></b></div><div class="stat"><small>BET</small><b>R$ <span id="betAmount">1,00</span></b></div></div></div>
    <div class="center"><div class="hold" id="statusText">ENCONTRE 3 OU MAIS ☠ PARA GANHAR!</div><div class="winbar">WIN <span>R$ <b id="prizeValue">0,00</b></span></div></div>
    <div class="controls"><div class="bet"><button class="round" id="minusBtn">−</button><div class="betvalue"><small>BET</small><b>R$ <span id="betAmount2">1,00</span></b></div><button class="round" id="plusBtn">+</button><button class="round max" id="maxBtn">MAX</button></div><button class="spin" id="spinBtn">GIRAR</button><button class="auto" id="turboBtn">⚡ TURBO</button><button class="auto" id="autoBtn">AUTO <span id="autoCount">10</span></button></div>
  </div>
</div>
<script>const syncBet=()=>{const a=document.getElementById('betAmount'),b=document.getElementById('betAmount2');if(a&&b)b.textContent=a.textContent};new MutationObserver(syncBet).observe(document.getElementById('betAmount'),{childList:true,characterData:true,subtree:true});</script>
<script type="module">
import "../saldo.js";
const SYMBOLS=['captain','ship','chest','bottle','compass','map','cannon','parrot','K','Q','J','A','scatter'];
const PAYOUTS={captain:1.5,parrot:1.25,chest:1.05,map:.9,compass:.8,bottle:.7,K:.6,Q:.5,J:.4,A:.3};
const A='https://commons.wikimedia.org/wiki/Special:FilePath/';
const AS={captain:A+'Captain_pirate.png',ship:A+'Pirate_ship_-_Pirates_(1922).png',chest:A+'Treasure_chest_with_gold_coins.svg',bottle:A+'Glass_bottle.jpg',compass:A+'Negus_liquid_compass.png',map:A+'Treasuremap.jpg',cannon:A+'Cannon_model.png',parrot:A+'Parrot_standard.png',scatter:A+'Skull_and_Crossbones.png'};
const ROWS=3,COLS=5,MAX_TOTAL_MULTIPLIER=8;
const PAYLINES=[[0,3,6,9,12],[1,4,7,10,13],[2,5,8,11,14],[0,4,8,10,12],[2,4,6,10,14],[0,3,7,11,14],[2,5,7,9,12],[0,4,7,10,14],[2,4,7,10,12],[0,3,7,9,12],[2,5,7,11,14],[0,4,6,10,14],[2,4,8,10,12],[0,3,8,11,14],[2,5,6,9,12],[0,4,8,11,12],[2,4,6,9,14],[0,3,7,10,14],[2,5,7,10,12],[0,4,7,9,14],[2,4,7,11,12],[0,3,6,10,14],[2,5,8,10,12],[0,4,8,9,14],[2,4,6,11,12]];
let currentBet=1,isSpinning=false,realBalance=0,turbo=false,autoSpins=0,autoRunning=false;
const $=id=>document.getElementById(id),balanceEl=$('balance'),betEl=$('betAmount'),spinBtn=$('spinBtn'),minusBtn=$('minusBtn'),plusBtn=$('plusBtn'),maxBtn=$('maxBtn'),reelsGrid=$('reelsGrid'),errorMessage=$('errorMessage'),winPopup=$('winPopup'),winValue=$('winValue'),prizeValue=$('prizeValue'),statusText=$('statusText');
function money(v){return Number(v||0).toFixed(2).replace('.',',')}
function error(m){errorMessage.textContent=m;errorMessage.style.display='block';setTimeout(()=>errorMessage.style.display='none',4000)}
async function balance(){try{realBalance=await window.SistemaSaldo.get();balanceEl.textContent=money(realBalance);ui()}catch(e){error('Não foi possível carregar seu saldo.')}}
function ui(){betEl.textContent=money(currentBet);spinBtn.disabled=isSpinning||realBalance<currentBet;minusBtn.disabled=plusBtn.disabled=maxBtn.disabled=isSpinning}
function random(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}
function makeCell(s){if('KQJA'.includes(s)){const d=document.createElement('div');d.className='letra '+s;d.textContent=s;return d}const img=document.createElement('img');img.src=AS[s];img.alt=s;img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='letra';d.textContent=s==='scatter'?'💀':'⚓';img.parentNode?.appendChild(d)};return img}
function init(){reelsGrid.innerHTML='';for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';col.id='col-'+c;for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cel';cell.appendChild(makeCell(random()));col.appendChild(cell)}reelsGrid.appendChild(col)}}
function setCell(cell,s){cell.innerHTML='';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s))}
function clear(){document.querySelectorAll('.cel').forEach(c=>c.classList.remove('win'))}
function adjust(v){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,currentBet+v));ui()}}
function max(){if(!isSpinning&&!autoRunning){currentBet=Math.max(1,Math.min(100,Math.floor(realBalance)));ui()}}
async function spin(){if(isSpinning)return;await balance();if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();const reels=[];for(let c=0;c<COLS;c++){const cells=document.querySelectorAll('#col-'+c+' .cel');reels.push(cells);cells.forEach(x=>x.style.filter='blur(2px)')}let n=0;const limit=turbo?8:30,delay=turbo?45:60;const timer=setInterval(()=>{for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)setCell(reels[c][r],random());if(++n>=limit){clearInterval(timer);finish(reels)}},delay)}
async function finish(reels){const grid=[];for(let c=0;c<COLS;c++){const arr=[];for(let r=0;r<ROWS;r++){const s=random();arr.push(s);setCell(reels[c][r],s);reels[c][r].style.filter=''}grid.push(arr)}await wins(grid);isSpinning=false;await balance();ui();if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(spin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!'}
async function wins(grid){let mult=0;const cells=new Set();PAYLINES.forEach(line=>{const first=line[0],fc=Math.floor(first/ROWS),fr=first%ROWS,fs=grid[fc][fr];let m=1;for(let i=1;i<line.length;i++){const idx=line[i],c=Math.floor(idx/ROWS),r=idx%ROWS;if(grid[c][r]===fs)m++;else break}if(m>=3){mult+=(PAYOUTS[fs]??0.5)*(m-2);for(let i=0;i<m;i++)cells.add(line[i])}});if(mult<=0){prizeValue.textContent='0,00';return}mult=Math.min(mult,MAX_TOTAL_MULTIPLIER);const ganho=await window.SistemaSaldo.processarVitoria(currentBet,mult);if(ganho&&ganho>0){prizeValue.textContent=money(ganho);winValue.textContent=money(ganho);winPopup.classList.add('on');setTimeout(()=>winPopup.classList.remove('on'),2200);cells.forEach(i=>$('col-'+Math.floor(i/ROWS))?.children[i%ROWS]?.classList.add('win'));statusText.textContent='TESOURO ENCONTRADO!'}}
function buildLobbyStrip(col,finalValues){
  const strip=document.createElement('div');strip.className='lobby-strip';
  const noise=18,vals=[];for(let i=0;i<noise;i++)vals.push(random());vals.push(...finalValues);
  vals.forEach(s=>{const cell=document.createElement('div');cell.className='cel';cell.classList.toggle('scatter',s==='scatter');cell.appendChild(makeCell(s));strip.appendChild(cell)});
  col.querySelectorAll(':scope > .cel').forEach(c=>c.style.visibility='hidden');col.appendChild(strip);
  const h=col.clientHeight/3;strip.style.height=(vals.length*h)+'px';[...strip.children].forEach(c=>c.style.height=h+'px');
  strip.style.transform='translate3d(0,0,0)';strip.classList.add('lobby-spinning');return {strip,h,noise};
}
async function lobbySpin(){
  if(isSpinning)return;await balance();
  if(realBalance<currentBet){error('❌ Saldo insuficiente para esta aposta.');autoRunning=false;autoSpins=0;return}
  const ok=await window.SistemaSaldo.debitar(currentBet);if(!ok){await balance();return}
  realBalance=Math.max(0,realBalance-currentBet);ui();clear();winPopup.classList.remove('on');prizeValue.textContent='0,00';
  isSpinning=true;statusText.textContent=turbo?'GIRO TURBO...':'GIRANDO...';ui();
  const finalGrid=[],strips=[];
  for(let c=0;c<COLS;c++){const vals=[];for(let r=0;r<ROWS;r++)vals.push(random());finalGrid.push(vals);strips.push(buildLobbyStrip($('col-'+c),vals))}
  const distance=-(strips[0].noise*strips[0].h),duration=turbo?1500:2600;
  requestAnimationFrame(()=>strips.forEach(x=>{x.strip.style.transition=`transform ${duration}ms cubic-bezier(.12,.68,.16,1)`;x.strip.style.transform=`translate3d(0,${distance}px,0)`}));
  await new Promise(r=>setTimeout(r,duration+120));
  strips.forEach((x,c)=>{const col=$('col-'+c);x.strip.remove();const cells=col.querySelectorAll(':scope > .cel');finalGrid[c].forEach((sym,r)=>{cells[r].innerHTML='';cells[r].classList.toggle('scatter',sym==='scatter');cells[r].appendChild(makeCell(sym));cells[r].style.visibility='visible'})});
  await wins(finalGrid);isSpinning=false;await balance();ui();
  if(autoRunning&&autoSpins>0){autoSpins--;$('autoCount').textContent=autoSpins;if(autoSpins>0&&realBalance>=currentBet)setTimeout(lobbySpin,turbo?80:350);else{autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='BOA SORTE!';ui()}}else statusText.textContent='BOA SORTE!';
}
spinBtn.onclick=lobbySpin;

minusBtn.onclick=()=>adjust(-1);plusBtn.onclick=()=>adjust(1);maxBtn.onclick=max;spinBtn.onclick=lobbySpin;$('turboBtn').onclick=e=>{turbo=!turbo;e.currentTarget.classList.toggle('ativa',turbo)};$('autoBtn').onclick=()=>{if(isSpinning)return;if(autoRunning){autoRunning=false;autoSpins=0;$('autoCount').textContent='10';statusText.textContent='AUTO CANCELADO';return}autoSpins=10;autoRunning=true;$('autoCount').textContent='10';statusText.textContent='AUTO: 10 GIROS';lobbySpin()};
async function start(){init();ui();let tries=0;while(!window.SistemaSaldo&&tries<50){await new Promise(r=>setTimeout(r,50));tries++}if(!window.SistemaSaldo){error('Erro ao carregar o sistema de saldo.');return}await balance()}start();
</script>
</body>
</html>
