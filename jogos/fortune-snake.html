<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortune Snake - ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#08000f;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* =====================================================
   FUNDO ANIMADO
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-10;

    background:
        radial-gradient(circle at 15% 20%,rgba(255,0,204,.32),transparent 28%),
        radial-gradient(circle at 85% 18%,rgba(0,140,255,.28),transparent 28%),
        radial-gradient(circle at 80% 82%,rgba(255,190,0,.25),transparent 30%),
        radial-gradient(circle at 18% 82%,rgba(120,0,255,.32),transparent 30%);
    filter:blur(18px);

    animation:luzes 10s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-9;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 2px);

    background-size:55px 55px;
    opacity:.25;

    animation:estrelas 12s linear infinite;
}

@keyframes luzes{
    0%{
        transform:scale(1);
        opacity:.65;
    }
    50%{
        transform:scale(1.08) translate(1%,1%);
        opacity:.9;
    }
    100%{
        transform:scale(1.04) translate(-1%,2%);
        opacity:.7;
    }
}

@keyframes estrelas{
    from{transform:translateY(0);}
    to{transform:translateY(-80px);}
}

/* =====================================================
   NOME GRANDE NO FUNDO
===================================================== */

.background-title{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:-8;

    width:100%;
    text-align:center;

    font-size:clamp(42px,13vw,105px);
    font-weight:1000;
    letter-spacing:5px;

    color:rgba(255,215,0,.08);

    text-shadow:
        0 0 15px rgba(255,215,0,.10),
        0 0 35px rgba(255,0,204,.08),
        0 0 70px rgba(120,0,255,.08);

    white-space:nowrap;
    pointer-events:none;

    animation:nomeFundo 5s ease-in-out infinite alternate;
}

@keyframes nomeFundo{
    from{
        opacity:.55;
        transform:translate(-50%,-50%) scale(.98);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.02);
    }
}

/* =====================================================
   EFEITOS DE RAIO E FUMAÇA
===================================================== */

.lightning{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    opacity:0;
    background:
        radial-gradient(circle at 50% 35%,
        rgba(255,255,255,.75),
        rgba(0,200,255,.18) 18%,
        transparent 48%);
}

.lightning.active{
    animation:raioLento .85s ease-out;
}

@keyframes raioLento{
    0%{opacity:0;}
    15%{opacity:.85;}
    28%{opacity:.12;}
    43%{opacity:.62;}
    58%{opacity:.08;}
    75%{opacity:.28;}
    100%{opacity:0;}
}

.smoke{
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    pointer-events:none;
    z-index:-5;

    background:
        radial-gradient(circle,
        rgba(150,150,150,.13),
        rgba(80,50,110,.08) 40%,
        transparent 70%);

    filter:blur(25px);

    animation:fumaça 8s ease-in-out infinite alternate;
}

.smoke.s1{
    left:-120px;
    bottom:-100px;
}

.smoke.s2{
    right:-120px;
    top:-80px;
    animation-delay:2s;
}

@keyframes fumaça{
    from{
        transform:translate(0,0) scale(.9);
        opacity:.4;
    }
    to{
        transform:translate(80px,-50px) scale(1.25);
        opacity:.8;
    }
}

/* =====================================================
   CONTAINER
===================================================== */

.game-container{
    width:420px;
    max-width:94vw;
    padding:24px;

    text-align:center;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.97),
            rgba(22,9,34,.98)
        );

    box-shadow:
        0 0 25px rgba(255,215,0,.18),
        0 0 70px rgba(145,0,255,.18);

    backdrop-filter:blur(8px);
    position:relative;
}

/* =====================================================
   TÍTULO
===================================================== */

h2{
    margin:0 0 5px;

    font-size:34px;
    font-weight:1000;

    color:#ffd700;

    text-shadow:
        0 0 8px #ffd700,
        0 0 20px #ff00cc,
        0 0 35px #8a00ff;
}

.subtitle{
    color:#c5b7d6;
    font-size:13px;
}

/* =====================================================
   MENSAGEM
===================================================== */

.message-area{
    min-height:30px;
    margin:12px 0;

    font-weight:bold;
    color:#00ed91;

    text-shadow:0 0 8px rgba(0,237,145,.35);
}

/* =====================================================
   MÁQUINA
===================================================== */

.slot-machine{
    display:flex;
    gap:7px;

    padding:12px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #050207
        );

    border:2px solid #4a2c7a;
    border-radius:15px;

    overflow:hidden;

    box-shadow:
        inset 0 0 25px #000,
        0 0 15px rgba(115,0,255,.15);
}

.reel{
    flex:1;
    height:100px;

    overflow:hidden;
    position:relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border:2px solid #51306d;
    border-radius:10px;

    box-shadow:inset 0 0 15px #000;
}

.reel-strip{
    position:absolute;
    width:100%;
    top:0;
    left:0;

    will-change:transform;
}

.symbol{
    height:100px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;

    transform:translateZ(0);
    backface-visibility:hidden;
}

.reel.stopping{
    box-shadow:
        0 0 20px rgba(255,215,0,.6),
        inset 0 0 15px #000;
}

.win{
    animation:pulse .5s infinite;
    text-shadow:0 0 15px #ffd700;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

/* =====================================================
   RESULTADO
===================================================== */

.result{
    margin-top:12px;
    min-height:32px;
    font-weight:bold;
    font-size:18px;
}

/* =====================================================
   CONTROLES
===================================================== */

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.bet{
    background:#0b0610;
    border:1px solid #4a2c7a;
    border-radius:20px;
    padding:10px 13px;
    color:#ffd700;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    font-size:17px;
    padding:13px 25px;
    border-radius:25px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 18px rgba(255,0,204,.35);

    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:hover{
    box-shadow:
        0 0 25px rgba(255,0,204,.65);
}

button:disabled{
    opacity:.5;
    filter:grayscale(1);
}

/* =====================================================
   VIBRAÇÃO DO JOGO
===================================================== */

.game-container.vibrando{
    animation:vibrarJogo .12s linear 5;
}

@keyframes vibrarJogo{
    0%{transform:translate(0,0);}
    25%{transform:translate(-3px,2px);}
    50%{transform:translate(3px,-2px);}
    75%{transform:translate(-2px,-2px);}
    100%{transform:translate(0,0);}
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:380px){

    .game-container{
        width:96vw;
        padding:18px;
    }

    .reel{
        height:82px;
    }

    .symbol{
        height:82px;
        font-size:42px;
    }

    .background-title{
        font-size:39px;
    }

    h2{
        font-size:29px;
    }
}
</style>
</head>

<body>

<div class="background-title">FORTUNE SNAKE</div>

<div class="lightning" id="lightning"></div>

<div class="smoke s1"></div>
<div class="smoke s2"></div>

<div class="game-container" id="gameContainer">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin" type="button">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>
// =====================================================
// SOM DE CAÇA-NÍQUEL
// =====================================================

let audioCtx=null;

function iniciarAudio(){

    if(!audioCtx){

        audioCtx=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function tocarSom(freq,duracao,tipo="square",volume=.035){

    iniciarAudio();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=tipo;

    osc.frequency.setValueAtTime(
        freq,
        audioCtx.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duracao
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duracao);
}

/* Som mecânico do caça-níquel */
function somGiro(){

    iniciarAudio();

    const notas=[
        95,110,125,140,160,180,
        200,220,245,270,300,330
    ];

    notas.forEach((freq,i)=>{

        setTimeout(()=>{

            tocarSom(
                freq,
                .055,
                "square",
                .025
            );

        },i*95);

    });
}

/* Moedas */
function somMoedas(){

    const notas=[
        880,1100,1320,1760
    ];

    notas.forEach((freq,i)=>{

        setTimeout(()=>{

            tocarSom(
                freq,
                .12,
                "sine",
                .07
            );

        },i*90);

    });
}

/* Trovão eletrônico */
function somTrovao(){

    iniciarAudio();

    tocarSom(
        65,
        .55,
        "sawtooth",
        .045
    );

    setTimeout(()=>{

        tocarSom(
            48,
            .7,
            "sawtooth",
            .035
        );

    },180);
}

/* =====================================================
   EFEITOS
===================================================== */

function efeitosGiro(){

    const lightning=
        document.getElementById("lightning");

    const game=
        document.getElementById("gameContainer");

    lightning.classList.remove("active");

    void lightning.offsetWidth;

    lightning.classList.add("active");

    game.classList.remove("vibrando");

    void game.offsetWidth;

    game.classList.add("vibrando");

    if(navigator.vibrate){

        navigator.vibrate([
            80,
            120,
            80
        ]);

    }

    setTimeout(()=>{

        somTrovao();

    },260);
}

/* =====================================================
   CONFIGURAÇÃO DO JOGO
===================================================== */

const APOSTA=1.00;

const SIMBOLOS=[
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS={
    "🍒":1.20,
    "🍋":1.50,
    "💰":2.00,
    "💎":3.00,
    "🏆":4.00,
    "🐍":7.00
};

const msg=
    document.getElementById("msgArea");

const result=
    document.getElementById("result");

const button=
    document.getElementById("btnSpin");

const reels=[
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips=[
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(texto,cor="#00ed91"){

    msg.textContent=texto;
    msg.style.color=cor;
}

function criarRolo(strip){

    strip.innerHTML="";

    /*
      14 voltas:
      suficiente para o efeito visual,
      sem criar uma lista gigante que cause travamento.
    */

    const fragment=
        document.createDocumentFragment();

    for(let volta=0;volta<14;volta++){

        for(const simbolo of SIMBOLOS){

            const div=
                document.createElement("div");

            div.className="symbol";
            div.textContent=simbolo;

            fragment.appendChild(div);
        }
    }

    strip.appendChild(fragment);
}

strips.forEach(criarRolo);

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random()*SIMBOLOS.length
        )
    ];
}

function prepararRolo(strip){

    strip.style.transition="none";
    strip.style.transform="translate3d(0,0,0)";

    strip.offsetHeight;
}

/* =====================================================
   GIRO MAIS FLUIDO
===================================================== */

function girarRolo(
    index,
    resultado,
    duracao
){

    return new Promise(resolve=>{

        const strip=strips[index];
        const reel=reels[index];

        const altura=100;

        const quantidade=
            SIMBOLOS.length;

        const simboloFinal=
            resultado[index];

        const posFinal=
            SIMBOLOS.indexOf(
                simboloFinal
            );

        /*
          Começa mais longe e gira várias
          voltas antes de desacelerar.
        */

        const voltas=
            8+index;

        const deslocamento=-(
            (
                voltas*
                quantidade
            )+
            posFinal
        )*altura;

        prepararRolo(strip);

        reel.classList.remove("stopping");

        requestAnimationFrame(()=>{

            strip.style.transition=
                `transform ${duracao}ms cubic-bezier(.10,.72,.12,1)`;

            strip.style.transform=
                `translate3d(0,${deslocamento}px,0)`;

        });

        setTimeout(()=>{

            reel.classList.add("stopping");

            resolve();

        },duracao);

    });
}

async function executarGiro(resultado){

    /*
      Os três rolos terminam em momentos
      diferentes, como uma máquina real.
    */

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1750
        ),

        girarRolo(
            1,
            resultado,
            2050
        ),

        girarRolo(
            2,
            resultado,
            2350
        )

    ]);
}

function calcularPremio(resultado){

    if(
        resultado[0]===resultado[1] &&
        resultado[1]===resultado[2]
    ){

        return PAGAMENTOS[
            resultado[0]
        ]||0;
    }

    return 0;
}

/* =====================================================
   GIRO PRINCIPAL
===================================================== */

button.addEventListener(
    "click",
    async function(){

        if(!window.SistemaSaldo){

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled=true;

        try{

            iniciarAudio();

            const saldo=
                await window.SistemaSaldo.get();

            if(
                typeof saldo!=="number" ||
                saldo<APOSTA
            ){

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled=false;

                return;
            }

            /*
              Escolhe o resultado antes do giro.
              Assim os símbolos permanecem visíveis
              no final e não desaparecem.
            */

            const resultado=[

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            mensagem(
                "🎰 Girando..."
            );

            result.textContent="";

            /* Efeitos */
            efeitosGiro();
            somGiro();

            /* Giro dos rolos */
            await executarGiro(resultado);

            result.textContent=
                resultado.join("   ");

            const premio=
                calcularPremio(resultado);

            if(premio>0){

                reels.forEach(reel=>{

                    reel.classList.add("win");

                });

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio/APOSTA
                );

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent=
                    `${resultado.join("   ")} 💰`;

                somMoedas();

                if(navigator.vibrate){

                    navigator.vibrate([
                        100,
                        80,
                        100,
                        80,
                        180
                    ]);

                }

            }else{

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if(
                window.SistemaSaldo.atualizarTela
            ){

                await window.SistemaSaldo
                    .atualizarTela();

            }

        }catch(erro){

            console.error(erro);

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        }finally{

            setTimeout(()=>{

                reels.forEach(reel=>{

                    reel.classList.remove(
                        "stopping",
                        "win"
                    );

                });

                button.disabled=false;

            },400);

        }

    }
);

</script>

</body>
</html>
