*{

html,

body{

/* =====================================================
   CONTAINER
===================================================== */

.game{
    width:min(100%,560px);
    min-height:100vh;
    padding:10px 10px 22px;
    position:relative;
    overflow:hidden;
}

.game::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.12;

    background-image:
        radial-gradient(#fff .7px,transparent .8px);

    background-size:20px 20px;
}

.glow{
    position:fixed;
    width:520px;
    height:520px;
    left:50%;
    top:-270px;
    transform:translateX(-50%);
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(75,213,121,.28),
            rgba(75,213,121,.08) 35%,
            transparent 70%
        );

    filter:blur(10px);
}

/* =====================================================
   TOPO
===================================================== */

.top{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.brand-icon{
    width:43px;
    height:43px;

    border-radius:14px;

    display:grid;
    place-items:center;

    font-size:25px;

    background:
        linear-gradient(
            145deg,
            #caffd7,
            #51ce78 48%,
            #14592c
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.8),
        0 5px 20px rgba(0,0,0,.5),
        0 0 22px rgba(75,213,121,.25);
}

.brand-title{
    font-weight:1000;
    font-size:15px;
    letter-spacing:1px;
}

.brand-sub{
    margin-top:3px;
    color:#8fa695;
    font-size:8px;
    letter-spacing:1.8px;
}

.balance{
    min-width:112px;

    padding:7px 10px;

    border-radius:13px;

    text-align:right;

    background:
        linear-gradient(
            180deg,
            #17271c,
            #09110c

    border:1px solid #3c6247;

    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        0 5px 15px rgba(0,0,0,.35);
}

.balance-label{
    display:block;
    color:#829486;
    font-size:8px;
    letter-spacing:1px;
}

.balance-value{
    display:block;
    margin-top:2px;
    color:#caffd7;
    font-size:15px;
    font-weight:900;
}

/* =====================================================
   TÍTULO
===================================================== */

.title-area{
    position:relative;
    z-index:2;

    text-align:center;

    padding:4px 0 10px;
}

.title{
    margin:0;

    font-size:
        clamp(
            27px,
            8vw,
            42px
        );

    line-height:1;

    font-weight:1000;

    letter-spacing:3px;

    text-transform:uppercase;

    background:
        linear-gradient(
            180deg,
            #eaffef 0%,
            #68df8d 42%,
            #1d7a42 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 4px 8px rgba(0,0,0,.8)
        );
}

.subtitle{
    margin-top:7px;

    color:#91a596;

    font-size:9px;

    letter-spacing:2.5px;

    text-transform:uppercase;
}

/* =====================================================
   MÁQUINA
===================================================== */

.machine{
    position:relative;
    z-index:3;

    padding:8px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            #c9ffd7 0%,
            #3f9557 10%,
            #183d25 17%,
            #07100a 78%,
            #72c487 100%
        );

    box-shadow:
        0 20px 45px rgba(0,0,0,.65),
        0 0 0 1px rgba(153,255,177,.35);
}

.machine-inner{
    padding:10px;

    border-radius:21px;

    background:
        linear-gradient(
            180deg,
            #18301f,
            #08100a 48%,
            #102317
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.12),
        inset 0 -20px 40px rgba(0,0,0,.5);
}

.machine-header{
    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;
}

.machine-header-line{
    width:25%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #65d985,
            transparent
        );
}

.machine-header-text{
    margin:0 12px;

    color:#9cf3b2;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;
}

.machine-feature{
    position:absolute;

    right:4px;
    top:5px;

    color:#6d8173;

    font-size:7px;

    letter-spacing:1px;
}

/* =====================================================
   ROLOS GRANDES
===================================================== */

.reels{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    padding:8px;

    border-radius:18px;

    background:#050805;

    border:1px solid #376b45;

    box-shadow:
        inset 0 0 30px #000,
        0 7px 18px rgba(0,0,0,.5);

    position:relative;

    overflow:hidden;
}

.reels::before{
    content:"";

    position:absolute;

    left:5%;
    right:5%;

    top:50%;

    height:2px;

    transform:translateY(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(127,255,158,.55),
            transparent
        );

    box-shadow:
        0 0 12px rgba(91,255,128,.45);

    z-index:10;

    pointer-events:none;
}

.reel{
    height:215px;

    border-radius:13px;

    overflow:hidden;

    position:relative;

    background:
        linear-gradient(
            180deg,
            #071008,
            #17351f 50%,
            #050b07
        );

    border:1px solid #426c4c;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.8),
        0 4px 10px rgba(0,0,0,.45);
}

.reel::before,
.reel::after{
    content:"";

    position:absolute;

    left:0;
    right:0;

    height:28%;

    z-index:4;

    pointer-events:none;
}

.reel::before{
    top:0;

    background:
        linear-gradient(
            rgba(3,8,4,.96),
            transparent
        );
}

.reel::after{
    bottom:0;

    background:
        linear-gradient(
            transparent,
            rgba(3,8,4,.96)
        );
}

.strip{
    position:absolute;

    left:0;
    right:0;
    top:0;

    will-change:transform;
}

.symbol{
    height:71px;

    display:grid;

    place-items:center;

    position:relative;

    font-size:41px;

    filter:
        drop-shadow(
            0 5px 7px rgba(0,0,0,.8)
        );
}

.symbol-label{
    position:absolute;

    bottom:1px;

    color:#8fa695;

    font-size:6px;

    letter-spacing:1px;
}

.reel.spinning .symbol{
    filter:
        blur(1.8px)
        brightness(1.15);
}

.reel.win{
    box-shadow:
        inset 0 0 25px rgba(90,255,130,.35),
        0 0 24px rgba(90,255,130,.7);
}

@keyframes winPulse{

    from{
        filter:
            brightness(1)
            drop-shadow(
                0 0 0 rgba(120,255,150,0)
            );
    }

    to{
        filter:
            brightness(1.45)
            drop-shadow(
                0 0 11px rgba(120,255,150,.95)
            );
    }
}

.symbol.win-symbol{
    animation:
        winPulse .5s ease-in-out infinite alternate;
}

/* =====================================================
   MENSAGENS
===================================================== */

.status{
    min-height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-top:7px;

    padding:7px 10px;

    border-radius:11px;

    background:#071009;

    border:1px solid #304b37;

    color:#c7d8cb;

    font-size:10px;

}

.result-line{

    align-items:center;

    justify-content:center;

    color:#8fa294;

    font-size:9px;

    letter-spacing:1px;
}

/* =====================================================
   CONTROLES
===================================================== */

.main-controls{
    display:grid;

    grid-template-columns:
        1fr
        1.55fr
        1fr;

    gap:8px;

    margin-top:10px;
}

.control-box{
    min-height:61px;

    padding:9px 6px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            180deg,
            #18291c,
            #0b140d
        );

    border:1px solid #3b5742;

    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 5px 14px rgba(0,0,0,.4);
}

.control-label{
    color:#87988c;

    font-size:7px;

    letter-spacing:1px;
}

.control-value{
    margin-top:3px;

    color:#d4ffdf;

    font-size:15px;

    font-weight:900;
}

.spin-button{
    min-height:61px;

    border-radius:18px;

    background:
        radial-gradient(

            #dffff0 0%,
            #68df8d 35%,
            #2b984f 68%,
            #145229 100%
        );

    color:#05210d;

    font-size:20px;

    font-weight:1000;

    letter-spacing:1px;

    border:3px solid #c5ffd4;

    box-shadow:
        0 7px 0 #0d4d25,
        0 12px 22px rgba(0,0,0,.55),
        inset 0 2px 3px rgba(255,255,255,.8);

    transition:
        transform .1s,
        filter .15s;
}

.spin-button:active{
    transform:translateY(5px);

    box-shadow:
        0 2px 0 #0d4d25,
        0 6px 12px rgba(0,0,0,.5);
}

.spin-button:disabled{
    opacity:.55;
    filter:grayscale(.4);
}

/* =====================================================
   APOSTA
===================================================== */

.bet-panel{
    margin-top:9px;

    padding:9px;

    display:flex;

    align-items:center;

    border:1px solid #304735;
}

.bet-label{

    letter-spacing:1px;
}

.bet-buttons{

.bet{

.bet:disabled{

/* =====================================================
   EXTRAS
===================================================== */

.extra-controls{
    margin-top:8px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

.extra{

.extra.active{

    background:#14261a;
}

.extra:disabled{
    opacity:.4;
}

   AUTO
===================================================== */

.auto10{

    margin-top:8px;

    border-radius:13px;

        );

    border:1px solid #62d482;

    color:#dcffe5;

    font-weight:1000;

    font-size:12px;
}

.auto10:disabled{
    opacity:.45;
}

/* =====================================================
   INFO
===================================================== */

.info{
    margin-top:8px;

    padding:11px;

    border-radius:14px;

    background:#081009;

    border:1px solid #2d4433;

}

    color:#d1e3d6;

/* =====================================================
   BÔNUS
===================================================== */

.free-spins-indicator{
    position:fixed;

    top:70px;

    right:10px;

    background:
        linear-gradient(
            135deg,
            #c7ffd5,
            #4bd579
        );

    color:#073016;

    padding:8px 12px;

    border-radius:10px;

    font-weight:1000;

    font-size:11px;

    box-shadow:
        0 4px 15px rgba(75,213,121,.6);

    display:none;

    z-index:100;
}

.free-spins-indicator.active{
    display:block;

    animation:
        pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }
}

.super-bonus-overlay{
    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(184,255,202,.98),
            rgba(21,116,54,.98)
        );

    z-index:1000;

    display:none;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.super-bonus-overlay.active{
    display:flex;

    animation:
        bonusFlash .5s ease-in-out;
}

@keyframes bonusFlash{

    0%{
        opacity:0;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.05);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

.bonus-snake{
    font-size:80px;

    animation:
        snakeFloat 1s ease-in-out infinite;
}

@keyframes snakeFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50%{
        transform:
            translateY(-15px)
            rotate(5deg);
    }
}

.bonus-text{
    margin-top:10px;

    font-size:
        clamp(
            30px,
            10vw,
            62px
        );

    font-weight:1000;

    color:#03210d;

    text-align:center;

    text-transform:uppercase;

    letter-spacing:3px;

    text-shadow:
        0 0 20px rgba(255,255,255,.8),
        0 0 40px rgba(110,255,145,1);
}

.bonus-subtext{
    font-size:
        clamp(
            17px,
            5vw,
            27px
        );

    color:#062c13;

    margin-top:15px;

    font-weight:900;

    text-align:center;
}

.bonus-spins{
    font-size:
        clamp(
            55px,
            16vw,
            100px
        );

    color:#eaffef;

    margin-top:15px;

    font-weight:1000;

    text-shadow:
        0 0 30px rgba(255,255,255,.8);
}

/* =====================================================
   EFEITOS
===================================================== */

.particle{
    position:fixed;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#8dffad;

    z-index:1500;

    pointer-events:none;

    animation:
        particleFly .85s ease-out forwards;
}

@keyframes particleFly{

    to{

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.1);

        opacity:0;
    }
}

.coin{
    position:fixed;

    z-index:1501;

    pointer-events:none;

    font-size:17px;

    animation:
        coinFly .9s ease-out forwards;
}

@keyframes coinFly{

    to{

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(360deg)
            scale(.25);

        opacity:0;
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:390px){

        font-size:35px;
    }

    .bet{
        min-width:43px;
        padding:8px 2px;
    }

    .control-value{
        font-size:14px;
    }
}

function obterSaldo(){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            const valor =
                Number(
                    window.SistemaSaldo.get()
                );

            if(
                Number.isFinite(
                    valor
                )
            ){

                return valor;

            }

        }

    }catch(e){}

    return 0;
}

function debitar(
    valor
){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.debitar === "function"
        ){

            return window.SistemaSaldo.debitar(
                valor
            );

        }

    }catch(e){

        console.error(
            "Erro ao debitar:",
            e
        );

        return false;

    }

    return false;
}

function creditar(
    valor
){

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.creditar === "function"
        ){

            return window.SistemaSaldo.creditar(
                valor
            );

        }

    }catch(e){

        console.error(
            "Erro ao creditar:",
            e
        );

        return false;

    }

    return false;
}

function formatarDinheiro(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}

function atualizarSaldoVisual(){

    const saldo =
        obterSaldo();

    saldoEl.textContent =
        formatarDinheiro(
            saldo

    try{

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.atualizarTela === "function"
        ){

            window.SistemaSaldo.atualizarTela();

        }

    }catch(e){}

}

const simbolos =
    Object.keys(
        CONFIG.pesos
    );

const nomes={

    "🍒":"CHERRY",

    "🍋":"CITRUS",

    "🪙":"COIN",

    "🏮":"LANTERN",

    "💎":"JADE",

    "🐍":"FORTUNE"

};

function escolherSimbolo(){

    const total =
        simbolos.reduce(
            (
                soma,
                simbolo
            )=>
                soma+
                CONFIG.pesos[
                    simbolo
                ],
            0
        );

    let valor =
        Math.random()*
        total;

    for(
        const simbolo
        of simbolos
    ){

        valor -=
            CONFIG.pesos[
                simbolo
            ];

        if(
            valor<=0
        ){

            return simbolo;

        }

    }

    return simbolos[0];

}

function criarSimbolo(
    simbolo
){

    return `
        <div class="symbol">
            <span>${simbolo}</span>
            <span class="symbol-label">
                ${nomes[simbolo] || ""}
            </span>
        </div>
    `;

}

function preencherRolo(
    elemento
){

    let html="";

    for(
        let i=0;
        i<18;
        i++
    ){

        html +=
            criarSimbolo(
                escolherSimbolo()
            );

    }

    elemento.innerHTML =
        html;

}

function gerarResultado(){

    const resultado=[];

    for(
        let i=0;
        i<9;
        i++
    ){

        resultado.push(
            escolherSimbolo()
        );

    }

    return resultado;

}

function prepararResultado(
    elemento,
    valores
){

    const extras=[];

    for(
        let i=0;
        i<7;
        i++
    ){

        extras.push(
            escolherSimbolo()
        );

    }

    const lista=[
        ...extras,
        ...valores,
        ...extras
    ];

    elemento.innerHTML =
        lista
        .map(
            criarSimbolo
        )
        .join("");

    const altura =
        elemento
        .querySelector(
            ".symbol"
        )
        .offsetHeight;

    const inicio =
        extras.length;

    elemento.style.transition =
        "none";

    elemento.style.transform =
        `translateY(${-inicio*altura}px)`;

}

/* =====================================================
   REGRA DE VITÓRIA
===================================================== */

const linhas=[

    [0,1,2],

    [3,4,5],

    [6,7,8],

    [0,3,6],

    [1,4,7],

    [2,5,8],

    [0,4,8],

    [2,4,6]

];

function encontrarLinhas(
    resultado
){

    const vencedoras=[];

    for(
        const linha
        of linhas
    ){

        const a =
            resultado[
                linha[0]
            ];

        const b =
            resultado[
                linha[1]
            ];

        const c =
            resultado[
                linha[2]
            ];

        /*
           SOMENTE 3 IGUAIS.
        */

        if(
            a===b &&
            b===c
        ){

            vencedoras.push(
                linha
            );

        }

    }

    return vencedoras;

}

function calcularPremio(
    resultado
){

    const vencedoras =
        encontrarLinhas(
            resultado
        );

    let premio=0;

    const detalhes=[];

    for(
        const linha
        of vencedoras
    ){

        const simbolo =
            resultado[
                linha[0]
            ];

        const multiplicador =
            CONFIG.pagamentos[
                simbolo
            ] || 0;

        if(
            multiplicador>0
        ){

            const valor =
                aposta*
                multiplicador;

            premio +=
                valor;

            detalhes.push({
                linha,
                simbolo,
                valor
            });

        }

    }

    return{
        premio,
        linhas:vencedoras,
        detalhes
    };

}

function initAudio(){

    try{

        if(
            !audioContext
        ){

            audioContext =
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

    }catch(e){}

}

function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.15
){

    if(
        !som ||
        !audioContext
    ){

        return;

    }

    try{

        const oscilador =
            audioContext
            .createOscillator();

        const ganho =
            audioContext
            .createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            volume,
            audioContext.currentTime+
            .015
        );

        ganho.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime+
            duracao
        );

        oscilador.connect(
            ganho
        );

        ganho.connect(
            audioContext.destination
        );

        oscilador.start();

        oscilador.stop(
            audioContext.currentTime+
            duracao+
            .03
        );

    }catch(e){}

}

function destacarVitoria(
    linhasVencedoras
){

    document
        .querySelectorAll(
            ".symbol"

        .forEach(
            elemento=>
                elemento.classList.remove(
                    "win-symbol"
                )
        );

    reelBoxes.forEach(
        elemento=>
            elemento.classList.remove(
                "win"
            )
    );

    const indices=[
        ...new Set(
            linhasVencedoras.flat()
        )
    ];

    indices.forEach(
        indice=>{

            const coluna =
                indice%3;

            const linha =
                Math.floor(
                    indice/3
                );

            const rolo =
                reels[
                    coluna
                ];

            const simbolosRolo =
                rolo.querySelectorAll(
                    ".symbol"
                );

            const alvo =
                simbolosRolo[
                    7+linha
                ];

            if(
                alvo
            ){

                alvo.classList.add(
                    "win-symbol"
                );

            }

            reelBoxes[
                coluna
            ].classList.add(
                "win"
            );

        }
    );

}

){

            setTimeout(

/* =====================================================
   RODADAS GRÁTIS
===================================================== */

async function iniciarRodadasGratis(){

    autoExecutando=true;

    while(
        rodadasRestantes>0
    ){

        await esperar(
            turbo
            ?400
            :800
        );

        await girar(
            true
        );

        rodadasRestantes--;

        freeSpinsCount.textContent =
            rodadasRestantes;

    }

    autoExecutando=false;

    modoAuto=false;

    freeSpinsIndicator
        .classList.remove(
            "active"
        );

    statusEl.textContent =
        "🎁 10 rodadas grátis finalizadas!";

    atualizarSaldoVisual();

    liberarControles();

}

/* =====================================================
   AUTO 10 PAGO
===================================================== */

function iniciarAuto10(){

    if(
        girando ||
        autoExecutando ||
        rodadasRestantes>0
    ){

        return;

    }

    const saldo =
        obterSaldo();

    if(
        saldo<
        aposta
    ){

        statusEl.textContent =
            "Saldo insuficiente.";

        atualizarSaldoVisual();

        return;

    }

    rodadasRestantes=10;

    modoAuto=true;

    autoExecutando=true;

    freeSpinsLabel.textContent =
        "AUTO:";

    freeSpinsCount.textContent =
        "10";

    freeSpinsIndicator
        .classList.add(
            "active"
        );

    iniciarAutoPago();

}

async function iniciarAutoPago(){

    while(
        rodadasRestantes>0
    ){

        await esperar(
            turbo
            ?400
            :800
        );

        if(
            obterSaldo()<
            aposta
        ){

            statusEl.textContent =
                "Saldo insuficiente. AUTO encerrado.";

            rodadasRestantes=0;

            break;

        }

        await girar(
            true
        );

        rodadasRestantes--;

        freeSpinsCount.textContent =
            rodadasRestantes;

    }

    autoExecutando=false;

    modoAuto=false;

    freeSpinsIndicator
        .classList.remove(
            "active"
        );

    liberarControles();

}

/* =====================================================
   GIRO
===================================================== */

async function girar(
    isFreeOrAuto=false
){

    if(
        girando
    ){

        return;

    }

    girando=true;

    spinButton.disabled=true;

    auto10Button.disabled=true;

    document
        .querySelectorAll(
            ".bet"
        )
        .forEach(
            botao=>
                botao.disabled=true
        );

    initAudio();

    /*
       A música é iniciada depois da interação,
       igual ao fluxo do Mouse.
    */

    if(
        som
    ){

        try{

            const musica =
                document.getElementById(
                    "bgMusic"
                );

            if(
                musica &&
                musica.paused
            ){

                musica.volume=.40;

                musica.play()
                    .catch(
                        ()=>{}
                    );

            }

        }catch(e){}

    }

    /*
       =================================================
       SALDO — MESMA LÓGICA DO FORTUNE MOUSE
       =================================================
    */

    if(
        !isFreeOrAuto
    ){

        const saldo =
            obterSaldo();

        if(
            saldo<
            aposta
        ){

            statusEl.textContent =
                "Saldo insuficiente.";

            liberarControles();

            return;

        }

        const sucesso =
            debitar(
                aposta
            );

        if(
            !sucesso
        ){

            statusEl.textContent =
                "Erro ao registrar aposta.";

            liberarControles();

            return;

        }

    }else if(
        isFreeOrAuto &&
        modoAuto
    ){

        /*
           AUTO NORMAL:
           cobra uma aposta por rodada.
        */

        const sucesso =
            debitar(
                aposta
            );

        if(
            !sucesso
        ){

            rodadasRestantes=0;

            statusEl.textContent =
                "Erro ao registrar aposta.";

            liberarControles();

            return;

        }

    }

    /*
       Se isFreeOrAuto=true e modoAuto=false,
       é rodada grátis do Super Bônus.
       NÃO desconta nada.
    */

    atualizarSaldoVisual();

    winDisplay.textContent =
        formatarDinheiro(
            0
        );

    if(
        isFreeOrAuto
    ){

        statusEl.textContent =
            modoAuto
            ? `🔄 AUTO (${rodadasRestantes} restantes)`
            : `🎁 GRÁTIS (${rodadasRestantes} restantes)`;

    }else{

        statusEl.textContent =
            "Girando...";

    }

    resultLineEl.textContent =
        "Boa sorte...";

    reelBoxes.forEach(
        reel=>
            reel.classList.add(
                "spinning"
            )
    );

    somGiro();

    /*
       =================================================
       GERA RESULTADO
       =================================================
    */

    const resultado =
        gerarResultado();

    /*
       Matriz 3x3:
       
       0 1 2
       3 4 5
       6 7 8
    */

    const colunas=[

        [
            resultado[0],
            resultado[3],
            resultado[6]
        ],

        [
            resultado[1],
            resultado[4],
            resultado[7]
        ],

        [
            resultado[2],
            resultado[5],
            resultado[8]
        ]

    ];

    /*
       Prepara os rolos.
    */

    reels.forEach(
        preencherRolo
    );

    const tempos =
        turbo
        ?[
            450,
            550,
            650
        ]
        :CONFIG.tempos;

    /*
       Animação dos três rolos.
    */

    await Promise.all(

        reels.map(
            (
                elemento,
                indice
            )=>{

                return new Promise(
                    resolver=>{

                        const altura =
                            71;

                        const distancia =
                            -(
                                11+
                                Math.floor(
                                    Math.random()*6
                                )
                            )*
                            altura;

                        elemento.style.transition =
                            `transform ${tempos[indice]}ms cubic-bezier(.12,.72,.16,1)`;

                        elemento.style.transform =
                            `translateY(${distancia}px)`;

                        setTimeout(
                            ()=>{

                                prepararResultado(
                                    elemento,
                                    colunas[indice]
                                );

                                somParada(
                                    indice
                                );

                                resolver();

                            },
                            tempos[indice]
                        );

                    }
                );

            }
        )

    );

    reelBoxes.forEach(
        reel=>
            reel.classList.remove(
                "spinning"
            )
    );

    /*
       =================================================
       SUPER BÔNUS
       EXATAMENTE 3 COBRINHAS
       =================================================
    */

    const quantidadeCobras =
        resultado.filter(
            simbolo=>
                simbolo==="🐍"
        ).length;

    if(
        quantidadeCobras>=3 &&
        !isFreeOrAuto
    ){

        /*
           O resultado pode pagar normalmente.
        */

        const premioSnake =
            calcularPremio(
                resultado
            );

        if(
            premioSnake.premio>0
        ){

            creditar(
                premioSnake.premio
            );

            winDisplay.textContent =
                formatarDinheiro(
                    premioSnake.premio
                );

            destacarVitoria(
                premioSnake.linhas
            );

        }

        statusEl.textContent =
            "🐍🐍🐍 SUPER BÔNUS!";

        resultLineEl.textContent =
            "3 COBRINHAS — 10 RODADAS GRÁTIS!";

        atualizarSaldoVisual();

        girando=false;

        setTimeout(
            ()=>{
                ativarSuperBonus();
            },
            800
        );

        return;

    }

    /*
       =================================================
       PAGAMENTO NORMAL
       =================================================
    */

    const resultadoFinal =
        calcularPremio(
            resultado
        );

    if(
        resultadoFinal.premio>0
    ){

        const premio =
            resultadoFinal.premio;

        /*
           CRÉDITA NO MESMO SistemaSaldo
           DO FORTUNE MOUSE.
        */

        const creditou =
            creditar(
                premio
            );

        if(
            creditou
        ){

            winDisplay.textContent =
                formatarDinheiro(
                    premio
                );

            statusEl.textContent =
                `✨ Vitória! ${formatarDinheiro(premio)}`;

            resultLineEl.textContent =
                `${resultadoFinal.linhas.length} linha(s) premiada(s)`;

            destacarVitoria(
                resultadoFinal.linhas
            );

            somVitoria();

            criarParticulas(
                28
            );

            criarMoedas();

        }

    }else{

        winDisplay.textContent =
            formatarDinheiro(
                0
            );

        statusEl.textContent =
            isFreeOrAuto
            ? "Quase!"
            : "❌ Perdeu — não formou 3 iguais.";

        resultLineEl.textContent =
            "2 iguais + 1 diferente = PERDE";

    }

    atualizarSaldoVisual();

    liberarControles();

}

/* =====================================================
   LIBERAR CONTROLES
===================================================== */

function liberarControles(){

    girando=false;

    spinButton.disabled=
        autoExecutando ||
        rodadasRestantes>0;

    auto10Button.disabled=
        autoExecutando ||
        rodadasRestantes>0;

    document
        .querySelectorAll(
            ".bet"
        )
        .forEach(
            botao=>{
                botao.disabled=
                    autoExecutando ||
                    rodadasRestantes>0;
            }
        );

    atualizarSaldoVisual();

}

/* =====================================================
   APOSTAS
===================================================== */

document
    .querySelectorAll(
        ".bet"
    )
    .forEach(
        botao=>{

            botao.addEventListener(
                "click",
                ()=>{

                    if(
                        girando ||
                        autoExecutando ||
                        rodadasRestantes>0
                    ){

                        return;

                    }

                    aposta =
                        Number(
                            botao.dataset.bet
                        );

                    aposta =
                        Math.max(
                            CONFIG.apostaMinima,
                            Math.min(
                                CONFIG.apostaMaxima,
                                aposta
                            )
                        );

                    document
                        .querySelectorAll(
                            ".bet"
                        )
                        .forEach(
                            b=>
                                b.classList.remove(
                                    "active"
                                )
                        );

                    botao.classList.add(
                        "active"
                    );

                    betDisplay.textContent =
                        formatarDinheiro(
                            aposta
                        );

                }
            );

        }
    );

/* =====================================================
   GIRAR
===================================================== */

spinButton.addEventListener(
    "click",
    ()=>{
        girar(false);
    }
);

/* =====================================================
   AUTO 10
===================================================== */

auto10Button.addEventListener(
    "click",
    ()=>{
        iniciarAuto10();
    }
);

/* =====================================================
   TURBO
===================================================== */

turboButton.addEventListener(
    "click",
    ()=>{

        turbo=
            !turbo;

        turboButton.classList.toggle(
            "active",
            turbo
        );

        turboButton.textContent =
            turbo
            ? "⚡ Turbo ON"
            : "⚡ Turbo";

    }
);

/* =====================================================
   SOM
===================================================== */

soundButton.addEventListener(
    "click",
    ()=>{

        som=
            !som;

        soundButton.classList.toggle(
            "active",
            som
        );

        soundButton.textContent =
            som
            ? "🔊 Som"
            : "🔇 Som";

        if(
            !som
        ){

            const musica =
                document.getElementById(
                    "bgMusic"
                );

            if(
                musica
            ){

                musica.pause();

            }

        }

    }
);

/* =====================================================
   INFO
===================================================== */

infoButton.addEventListener(
    "click",
    ()=>{

        infoEl.hidden =
            !infoEl.hidden;

        infoButton.classList.toggle(
            "active",
            !infoEl.hidden
        );

    }
);

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

reels.forEach(
    preencherRolo
);

reels.forEach(
    (
        elemento
    )=>{

        prepararResultado(
            elemento,
            [
                escolherSimbolo(),
                escolherSimbolo(),
                escolherSimbolo()
            ]
        );

    }
);

betDisplay.textContent =
    formatarDinheiro(
        aposta
    );

winDisplay.textContent =
    formatarDinheiro(
        0
    );

/*
   ESSA É A MESMA CHAMADA DO MOUSE.
   Não cria saldo novo.
*/

atualizarSaldoVisual();

/*
   Atualiza quando o saldo do ApostaXBet mudar.
*/

window.addEventListener(
    "focus",
    atualizarSaldoVisual
);

</script></body>
</html>
