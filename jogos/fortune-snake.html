<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fortune Snake - ApostaXBet</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 10% 20%,#5b00a8,transparent 35%),
        radial-gradient(circle at 90% 20%,#8a6200,transparent 35%),
        radial-gradient(circle at 80% 80%,#68005f,transparent 35%),
        #08000f;

    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    padding:78px 0 30px;
}

/* FUNDO */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-10;

    background:
        radial-gradient(circle at 20% 30%,rgba(255,0,204,.45),transparent 25%),
        radial-gradient(circle at 80% 20%,rgba(0,150,255,.40),transparent 25%),
        radial-gradient(circle at 75% 80%,rgba(255,190,0,.40),transparent 25%),
        radial-gradient(circle at 20% 80%,rgba(130,0,255,.45),transparent 25%);

    filter:blur(25px);

    animation:
        luzesSnake
        8s
        ease-in-out
        infinite
        alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-9;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 2px
        );

    background-size:45px 45px;

    opacity:.45;

    animation:
        estrelasSnake
        7s
        linear
        infinite;
}

@keyframes luzesSnake{

    0%{
        transform:
            translate(-5%,-5%)
            scale(1);
    }

    50%{
        transform:
            translate(5%,4%)
            scale(1.12);
    }

    100%{
        transform:
            translate(-3%,7%)
            scale(1.05);
    }

}

@keyframes estrelasSnake{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-90px);
    }

}

/* GLOW */

.background-glow{

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.18),
            rgba(155,0,255,.10),
            transparent 70%
        );

    filter:blur(15px);

    animation:
        glow
        5s
        ease-in-out
        infinite
        alternate;

    pointer-events:none;

    z-index:-2;
}

@keyframes glow{

    from{
        transform:scale(.9);
        opacity:.55;
    }

    to{
        transform:scale(1.15);
        opacity:.9;
    }

}

/* SALDO */

.saldo-jogo{

    position:fixed;

    top:12px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:100;

    min-width:190px;

    padding:10px 22px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:8px;

    border-radius:25px;

    background:
        rgba(5,5,15,.94);

    color:#aaff5d;

    font-size:20px;

    font-weight:bold;

    white-space:nowrap;

    box-shadow:
        0 0 15px rgba(170,255,93,.25),
        0 5px 20px rgba(0,0,0,.35);
}

.saldo-jogo span{

    color:#aaff5d;

    text-shadow:
        0 0 8px
        rgba(170,255,93,.5);
}

/* PÁGINA */

.page-content{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

/* JOGO */

.game-container{

    width:350px;

    max-width:94vw;

    padding:20px;

    text-align:center;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.96),
            rgba(22,9,34,.97)
        );

    box-shadow:
        0 0 20px
        rgba(255,215,0,.25),

        0 0 60px
        rgba(145,0,255,.20);

    backdrop-filter:blur(8px);

    position:relative;

    z-index:5;

    transform:none !important;

    rotate:none !important;
}

h2{

    margin:
        0 0 5px;

    color:#ffd700;

    text-shadow:
        0 0 8px
        rgba(255,215,0,.5),

        0 0 20px
        rgba(255,150,0,.25);
}

.subtitle{

    color:#c5b7d6;

    font-size:13px;
}

.message-area{

    min-height:30px;

    margin:12px 0;

    font-weight:bold;

    color:#00ed91;

    text-shadow:
        0 0 8px
        rgba(0,237,145,.35);
}

/* SLOT */

.slot-machine{

    display:flex;

    gap:7px;

    padding:12px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #050207
        );

    border:
        2px solid
        #4a2c7a;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
        inset 0 0 25px #000,

        0 0 15px
        rgba(115,0,255,.15);
}

.reel{

    flex:1;

    height:88px;

    overflow:hidden;

    position:relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border:
        2px solid
        #51306d;

    border-radius:10px;

    box-shadow:
        inset 0 0 15px #000;
}

.reel-strip{

    position:absolute;

    width:100%;

    top:0;
    left:0;
}

.symbol{

    height:88px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:42px;
}

.reel.stopping{

    box-shadow:
        0 0 20px
        rgba(255,215,0,.6),

        inset 0 0 15px #000;
}

.win{

    animation:
        pulse
        .5s
        infinite;

    text-shadow:
        0 0 15px
        #ffd700;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}

.result{

    margin-top:12px;

    min-height:32px;

    font-weight:bold;

    font-size:18px;
}

/* CONTROLES */

.controls{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-top:18px;
}

.bet{

    background:#0b0610;

    border:
        1px solid
        #4a2c7a;

    border-radius:20px;

    padding:10px 13px;

    color:#ffd700;

    font-weight:bold;

    white-space:nowrap;
}

button{

    border:0;

    color:white;

    font-weight:bold;

    font-size:17px;

    padding:13px 25px;

    border-radius:25px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 18px
        rgba(255,0,204,.35);

    cursor:pointer;
}

button:active{

    transform:scale(.95);
}

button:hover{

    box-shadow:
        0 0 25px
        rgba(255,0,204,.65);
}

button:disabled{

    opacity:.5;

    filter:grayscale(1);
}

/* CELULAR */

@media(max-width:420px){

    .saldo-jogo{

        top:8px;

        min-width:175px;

        padding:9px 17px;

        font-size:18px;
    }

    .game-container{

        width:94vw;

        transform:none !important;

        rotate:none !important;
    }

}

</style>
</head>

<body>

<audio
    id="musicaFortuneSnake"
    src="musica-fortune-snake.mp3"
    loop
    preload="auto">
</audio>

<div class="background-glow"></div>

<div class="saldo-jogo">

    💰

    <span id="displaySaldo">
        R$ 0,00
    </span>

</div>

<div class="page-content">

    <div class="game-container">

        <h2>
            🐍 Fortune Snake
        </h2>

        <div class="subtitle">
            🐍 Boa sorte!
        </div>

        <div
            class="message-area"
            id="msgArea"
        >
            Carregando saldo...
        </div>

        <div class="slot-machine">

            <div
                class="reel"
                id="reel0"
            >

                <div
                    class="reel-strip"
                    id="strip0">
                </div>

            </div>

            <div
                class="reel"
                id="reel1"
            >

                <div
                    class="reel-strip"
                    id="strip1">
                </div>

            </div>

            <div
                class="reel"
                id="reel2"
            >

                <div
                    class="reel-strip"
                    id="strip2">
                </div>

            </div>

        </div>

        <div
            class="result"
            id="result"
        >
            Boa sorte!
        </div>

        <div class="controls">

            <div class="bet">
                Aposta: R$ 1,00
            </div>

            <button id="btnSpin">
                GIRAR
            </button>

        </div>

    </div>

</div>

<script
    type="module"
    src="../saldo.js">
</script>

<script>

/* =====================================================
   MÚSICA
===================================================== */

const musica =
    document.getElementById(
        "musicaFortuneSnake"
    );

musica.volume = 0.35;

async function garantirMusica(){

    try{

        if(musica.paused){

            musica.volume = 0.35;

            await musica.play();

        }

    }catch(erro){

        console.log(
            "Música aguardando interação:",
            erro
        );

    }

}

document.addEventListener(
    "pointerdown",
    garantirMusica,
    {
        once:true,
        passive:true
    }
);

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.visibilityState ===
            "visible"
        ){

            garantirMusica();

        }

    }
);


/* =====================================================
   SONS DO JOGO
===================================================== */

let audioCtx = null;

function iniciarAudio(){

    if(!audioCtx){

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioCtx.state ===
        "suspended"
    ){

        audioCtx.resume();

    }

}

function tocarTom(
    frequencia,
    duracao,
    tipo="sine",
    volume=0.04
){

    try{

        iniciarAudio();

        const oscilador =
            audioCtx.createOscillator();

        const ganho =
            audioCtx.createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.setValueAtTime(
            frequencia,
            audioCtx.currentTime
        );

        ganho.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime +
            duracao
        );

        oscilador.connect(
            ganho
        );

        ganho.connect(
            audioCtx.destination
        );

        oscilador.start();

        oscilador.stop(
            audioCtx.currentTime +
            duracao
        );

    }catch(erro){

        console.log(
            "Erro no som:",
            erro
        );

    }

}


/* SOM IMEDIATO DO BOTÃO */

function somBotao(){

    iniciarAudio();

    tocarTom(
        520,
        .07,
        "square",
        .06
    );

}


/* SOM DO GIRO */

function somGiro(){

    garantirMusica();

    iniciarAudio();

    tocarTom(
        180,
        .08,
        "square",
        .05
    );

    setTimeout(()=>{

        tocarTom(
            220,
            .08,
            "square",
            .05
        );

    },100);

    setTimeout(()=>{

        tocarTom(
            270,
            .08,
            "square",
            .05
        );

    },200);

    setTimeout(()=>{

        tocarTom(
            330,
            .08,
            "square",
            .05
        );

    },300);

    setTimeout(()=>{

        tocarTom(
            400,
            .10,
            "square",
            .06
        );

    },400);

}


/* SOM DA VITÓRIA */

function somVitoria(){

    garantirMusica();

    iniciarAudio();

    tocarTom(
        523,
        .15,
        "sine",
        .08
    );

    setTimeout(()=>{

        tocarTom(
            659,
            .15,
            "sine",
            .08
        );

    },130);

    setTimeout(()=>{

        tocarTom(
            784,
            .20,
            "sine",
            .09
        );

    },260);

    setTimeout(()=>{

        tocarTom(
            1046,
            .30,
            "sine",
            .07
        );

    },420);

}


/* SOM DA DERROTA */

function somDerrota(){

    garantirMusica();

    iniciarAudio();

    tocarTom(
        190,
        .18,
        "sawtooth",
        .05
    );

    setTimeout(()=>{

        tocarTom(
            140,
            .25,
            "sawtooth",
            .045
        );

    },180);

}


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const APOSTA = 1.00;

const SIMBOLOS = [

    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"

];

const PAGAMENTOS = {

    "🍒":1.20,
    "🍋":1.50,
    "💰":2.00,
    "💎":3.00,
    "🏆":4.00,
    "🐍":7.00

};

const msg =
    document.getElementById(
        "msgArea"
    );

const result =
    document.getElementById(
        "result"
    );

const button =
    document.getElementById(
        "btnSpin"
    );

const reels = [

    document.getElementById(
        "reel0"
    ),

    document.getElementById(
        "reel1"
    ),

    document.getElementById(
        "reel2"
    )

];

const strips = [

    document.getElementById(
        "strip0"
    ),

    document.getElementById(
        "strip1"
    ),

    document.getElementById(
        "strip2"
    )

];

function mensagem(
    texto,
    cor="#00ed91"
){

    msg.textContent =
        texto;

    msg.style.color =
        cor;

}


/* =====================================================
   ROLOS
===================================================== */

function criarRolo(strip){

    strip.innerHTML = "";

    for(
        let volta=0;
        volta<8;
        volta++
    ){

        for(
            const simbolo of SIMBOLOS
        ){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "symbol";

            div.textContent =
                simbolo;

            strip.appendChild(
                div
            );

        }

    }

}

strips.forEach(
    criarRolo
);


/* =====================================================
   ALEATÓRIO
===================================================== */

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random() *
            SIMBOLOS.length
        )
    ];

}


/* =====================================================
   PREPARAR
===================================================== */

function prepararRolo(
    strip
){

    strip.style.transition =
        "none";

    strip.style.transform =
        "translateY(0px)";

    strip.offsetHeight;

}


/* =====================================================
   GIRAR ROLO
===================================================== */

function girarRolo(
    index,
    resultado,
    duracao
){

    return new Promise(
        resolve=>{

            const strip =
                strips[index];

            const reel =
                reels[index];

            const altura =
                88;

            const quantidade =
                SIMBOLOS.length;

            const simboloFinal =
                resultado[index];

            const posFinal =
                SIMBOLOS.indexOf(
                    simboloFinal
                );

            const voltas =
                5 +
                Math.floor(
                    Math.random()*3
                );

            const deslocamento =
                -(
                    (
                        voltas *
                        quantidade
                    ) +
                    posFinal
                ) * altura;

            prepararRolo(
                strip
            );

            reel.classList.remove(
                "stopping"
            );

            requestAnimationFrame(
                ()=>{

                    strip.style.transition =
                        `transform ${duracao}ms cubic-bezier(.12,.7,.18,1)`;

                    strip.style.transform =
                        `translateY(${deslocamento}px)`;

                }
            );

            setTimeout(
                ()=>{

                    reel.classList.add(
                        "stopping"
                    );

                    resolve();

                },
                duracao
            );

        }
    );

}


/* =====================================================
   EXECUTAR
===================================================== */

async function executarGiro(
    resultado
){

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1900
        ),

        girarRolo(
            1,
            resultado,
            2300
        ),

        girarRolo(
            2,
            resultado,
            2700
        )

    ]);

}


/* =====================================================
   PRÊMIO
===================================================== */

function calcularPremio(
    resultado
){

    if(
        resultado[0] ===
        resultado[1] &&
        resultado[1] ===
        resultado[2]
    ){

        return PAGAMENTOS[
            resultado[0]
        ] || 0;

    }

    return 0;

}


/* =====================================================
   BOTÃO GIRAR
===================================================== */

button.addEventListener(
    "click",
    async function(){

        /*
         * O primeiro som acontece
         * imediatamente no clique.
         * Isso mantém o áudio liberado
         * pelo gesto do usuário.
         */

        somBotao();

        garantirMusica();

        iniciarAudio();

        if(
            !window.SistemaSaldo
        ){

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;

        }

        button.disabled =
            true;

        try{

            const saldo =
                await window.SistemaSaldo.get();

            if(
                typeof saldo !==
                "number" ||
                saldo < APOSTA
            ){

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled =
                    false;

                return;

            }

            somGiro();

            const debito =
                await window.SistemaSaldo.debitar(
                    APOSTA
                );

            if(
                debito === false
            ){

                throw new Error(
                    "Não foi possível debitar a aposta."
                );

            }

            if(
                window.SistemaSaldo.atualizarTela
            ){

                await window.SistemaSaldo
                    .atualizarTela();

            }

            mensagem(
                "🎰 Os rolos estão girando..."
            );

            result.textContent =
                "";

            const resultado = [

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            await executarGiro(
                resultado
            );

            result.textContent =
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if(
                premio > 0
            ){

                reels.forEach(
                    reel=>{

                        reel.classList.add(
                            "win"
                        );

                    }
                );

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio / APOSTA
                );

                somVitoria();

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent =
                    `${resultado.join("   ")} 💰`;

            }else{

                somDerrota();

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );

            }

            await garantirMusica();

            if(
                window.SistemaSaldo.atualizarTela
            ){

                await window.SistemaSaldo
                    .atualizarTela();

            }

        }catch(erro){

            console.error(
                "Erro no Fortune Snake:",
                erro
            );

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        }finally{

            setTimeout(
                ()=>{

                    garantirMusica();

                    reels.forEach(
                        reel=>{

                            reel.classList.remove(
                                "stopping",
                                "win"
                            );

                        }
                    );

                    button.disabled =
                        false;

                },
                500
            );

        }

    }
);


/* =====================================================
   SALDO
===================================================== */

window.addEventListener(
    "load",
    async()=>{

        if(
            window.SistemaSaldo &&
            window.SistemaSaldo.atualizarTela
        ){

            await window.SistemaSaldo
                .atualizarTela();

        }

        mensagem(
            "Pronto para jogar!"
        );

    }
);

</script>

</body>
</html>
