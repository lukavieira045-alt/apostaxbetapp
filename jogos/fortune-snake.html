<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fortune Snake - Clone</title>
<style>
    /* RESET E BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

    /* CONTAINER PRINCIPAL (CELULAR) */
    .game-container {
        width: 100%; height: 100%;
        background: linear-gradient(180deg, #2a0e45 0%, #1a0530 100%); /* Fundo Roxo Templo */
        display: flex; flex-direction: column; align-items: center;
        position: relative;
    }

    /* TOPO (LOBBY / TROFÉU) */
    .top-ui {
        width: 100%; padding: 10px 15px;
        display: flex; justify-content: space-between; align-items: flex-start;
        z-index: 20; color: white;
    }
    .lobby-btn { font-size: 12px; opacity: 0.8; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .trophy-icon { width: 35px; height: 35px; background: radial-gradient(circle, #ffd700, #b8860b); border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; font-size: 20px; box-shadow: 0 0 10px rgba(255,215,0,0.5); }

    /* ÁREA DA MÁQUINA E COBRA */
    .slot-stage {
        flex-grow: 1; width: 100%; max-width: 500px;
        position: relative; display: flex; justify-content: center; align-items: center;
    }

    /* COBRA GIGANTE (MASCOTE) - CSS PURO SIMULANDO A FOTO */
    .snake-mascot {
        position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
        width: 90%; height: 80%; z-index: 1; pointer-events: none;
        /* Simulando a cobra verde com gradientes */
        background: 
            radial-gradient(circle at 30% 30%, #4ade80 0%, #166534 40%, transparent 60%), /* Cabeça/Corpo */
            radial-gradient(circle at 70% 20%, #4ade80 0%, #166534 30%, transparent 50%); /* Cauda */
        filter: drop-shadow(0 0 20px rgba(74, 222, 128, 0.4));
        border-radius: 50% 50% 0 0;
    }
    /* Detalhe do Boné da Cobra */
    .snake-hat {
        position: absolute; top: 15%; left: 50%; transform: translateX(-50%) rotate(-10deg);
        width: 60px; height: 30px; background: #ef4444; border-radius: 10px 10px 0 0;
        border-bottom: 4px solid #991b1b; z-index: 2;
    }
    .snake-hat::after { content: "PG"; position: absolute; top: 5px; left: 15px; color: white; font-weight: bold; font-size: 12px; }

    /* FRAME DOS ROLOS (ROXO COM BORDA DOURADA/NEON) */
    .reels-frame {
        width: 85%; height: 55%;
        background: rgba(45, 27, 78, 0.9);
        border: 3px solid #d946ef; /* Borda Neon Rosa/Roxo */
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(217, 70, 239, 0.3), inset 0 0 30px #000;
        z-index: 5; position: relative;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 5px;
    }

    .reel-col {
        background: #1e1b4b; border-radius: 8px; overflow: hidden;
        display: flex; flex-direction: column; justify-content: space-around;
        border: 1px solid #4c1d95;
    }

    /* SÍMBOLOS (SIMULANDO OS DA FOTO) */
    .symbol {
        height: 33%; display: grid; place-items: center; font-size: 35px;
        filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
    }
    /* Tigela Dourada */
    .sym-bowl { background: radial-gradient(circle at 30% 30%, #fef08a, #ca8a04); -webkit-background-clip: text; color: transparent; }
    /* Corrente $ */
    .sym-chain { background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309); -webkit-background-clip: text; color: transparent; }
    /* Cobra Wild */
    .sym-wild { font-size: 40px; filter: drop-shadow(0 0 10px #4ade80); }

    /* PAINEL INFERIOR (VERMELHO/BORDÔ) */
    .bottom-panel {
        width: 100%; background: linear-gradient(180deg, #7f1d1d 0%, #450a0a 100%);
        border-top-left-radius: 30px; border-top-right-radius: 30px;
        border-top: 2px solid #fca5a5;
        padding: 15px 10px 25px; z-index: 10;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        display: flex; flex-direction: column; align-items: center; gap: 10px;
    }

    /* BARRA DE INFORMAÇÃO (SALDO / APOSTA) */
    .info-bar {
        width: 95%; background: #2a0505; border-radius: 20px;
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 15px; border: 1px solid #555;
    }
    .info-item { display: flex; align-items: center; gap: 8px; color: #fca5a5; font-weight: bold; font-size: 14px; }
    .info-icon { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #fca5a5; display: grid; place-items: center; font-size: 10px; }
    
    /* CONTROLES DE APOSTA E GIRO */
    .controls-row {
        width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
    }
    
    .btn-small {
        width: 45px; height: 45px; border-radius: 50%;
        background: #2a0505; border: 1px solid #555; color: white;
        display: grid; place-items: center; font-size: 18px;
        box-shadow: 0 4px 0 #1a0505;
    }
    .btn-small:active { transform: translateY(4px); box-shadow: none; }

    /* BOTÃO GIRAR CENTRAL (ESTILO PG) */
    .spin-btn {
        width: 80px; height: 80px; border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #d8b4fe 0%, #9333ea 50%, #581c87 100%);
        border: 4px solid #4ade80; /* Borda Verde */
        box-shadow: 0 0 0 4px #166534, 0 0 20px rgba(147, 51, 234, 0.6), inset 0 5px 10px rgba(255,255,255,0.3);
        display: grid; place-items: center; cursor: pointer;
        position: relative;
    }
    .spin-btn::after {
        content: ""; width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
        animation: spinAnim 2s linear infinite;
    }
    @keyframes spinAnim { to { transform: rotate(360deg); } }
    
    .spin-btn:active { transform: scale(0.95); }
    .spin-btn.disabled { filter: grayscale(1); opacity: 0.7; pointer-events: none; }

    /* TEXTO FLUTUANTE (NOVAS RODADAS...) */
    .banner-text {
        position: absolute; bottom: 110px; width: 100%; text-align: center;
        color: #bef264; font-style: italic; font-weight: bold; font-size: 14px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none;
    }

    /* STATUS MSG */
    .status-msg { color: #fca5a5; font-size: 12px; font-weight: bold; min-height: 15px; }

</style>
</head>
<body>

<div class="game-container">
    <!-- TOPO -->
    <div class="top-ui">
        <div class="lobby-btn"><span>🏠</span><span>Lobby</span></div>
        <div style="font-size:12px; color:#aaa;">Fortune Snake</div>
        <div class="trophy-icon">🏆</div>
    </div>

    <!-- PALCO DO JOGO -->
    <div class="slot-stage">
        <!-- Cobra Mascote (CSS) -->
        <div class="snake-mascot">
            <div class="snake-hat"></div>
        </div>

        <!-- Rolos -->
        <div class="reels-frame">
            <div class="reel-col" id="r1">
                <div class="symbol sym-bowl">🥣</div>
                <div class="symbol sym-bowl"></div>
                <div class="symbol sym-bowl">🥣</div>
            </div>
            <div class="reel-col" id="r2">
                <div class="symbol sym-wild">🐍</div>
                <div class="symbol sym-wild">🐍</div>
                <div class="symbol sym-wild">🐍</div>
            </div>
            <div class="reel-col" id="r3">
                <div class="symbol sym-chain">💲</div>
                <div class="symbol sym-chain">💲</div>
                <div class="symbol sym-chain">💲</div>
            </div>
        </div>
        
        <div class="banner-text">Novas Rodadas na Funcionalidade Cobra</div>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div class="bottom-panel">
        <!-- Barra de Info -->
        <div class="info-bar">
            <div class="info-item"><div class="info-icon"></div> <span id="saldo">R$0,00</span></div>
            <div class="info-item" style="color:#aaa; font-size:10px;">PG SOFT</div>
            <div class="info-item"><span id="aposta">R$5,00</span> <div class="info-icon">$</div></div>
        </div>

        <!-- Botões -->
        <div class="controls-row">
            <button class="btn-small" onclick="toggleSom()">🔇</button>
            <button class="btn-small" onclick="mudarAposta(-1)">➖</button>
            
            <div class="spin-btn" id="btnGirar" onclick="girar()"></div>
            
            <button class="btn-small" onclick="mudarAposta(1)">➕</button>
            <button class="btn-small">🔄</button>
        </div>
        
        <div class="status-msg" id="msg">PRONTO</div>
    </div>
</div>

<script>
    // LÓGICA DO SALDO E JOGO
    let saldoAtual = 0;
    let valorAposta = 5.00;
    let girando = false;

    function atualizarDisplay() {
        document.getElementById('saldo').innerText = saldoAtual.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('aposta').innerText = valorAposta.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    // TENTAR PEGAR O SALDO DO SISTEMA EXTERNO (SE EXISTIR)
    try {
        if(window.SistemaSaldo && typeof window.SistemaSaldo.get === 'function') {
            saldoAtual = Number(window.SistemaSaldo.get()) || 0;
        }
    } catch(e) {}
    atualizarDisplay();

    function mudarAposta(dir) {
        if(girando) return;
        const valores = [0.50, 1.00, 2.00, 5.00, 10.00, 20.00];
        let idx = valores.indexOf(valorAposta);
        if(dir > 0 && idx < valores.length - 1) idx++;
        if(dir < 0 && idx > 0) idx--;
        valorAposta = valores[idx];
        atualizarDisplay();
    }

    async function girar() {
        if(girando) return;
        
        // CHECAGEM DE SALDO
        if(saldoAtual < valorAposta) {
            document.getElementById('msg').innerText = "SALDO INSUFICIENTE";
            return;
        }

        // DEBITAR
        try {
            if(window.SistemaSaldo && typeof window.SistemaSaldo.debitar === 'function') {
                if(!window.SistemaSaldo.debitar(valorAposta)) return;
            } else {
                saldoAtual -= valorAposta; // Fallback local
            }
        } catch(e) { saldoAtual -= valorAposta; }
        
        atualizarDisplay();
        girando = true;
        document.getElementById('btnGirar').classList.add('disabled');
        document.getElementById('msg').innerText = "GIRANDO...";

        // ANIMAÇÃO SIMPLES DOS ROLOS
        const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
        const simbolos = ['sym-bowl', 'sym-wild', 'sym-chain'];
        const icones = ['🥣', '🐍', '💲'];
        
        // Efeito visual de giro
        let intervalo = setInterval(() => {
            reels.forEach(r => {
                r.innerHTML = `<div class="symbol ${simbolos[Math.floor(Math.random()*3)]}">${icones[Math.floor(Math.random()*3)]}</div>`.repeat(3);
            });
        }, 100);

        // PARAR APÓS 1.5 SEGUNDOS
        setTimeout(() => {
            clearInterval(intervalo);
            girando = false;
            document.getElementById('btnGirar').classList.remove('disabled');
            
            // RESULTADO FIXO IGUAL À FOTO (3 BOWLS, 3 WILDS, 3 CHAINS)
            reels[0].innerHTML = `<div class="symbol sym-bowl"></div><div class="symbol sym-bowl">🥣</div><div class="symbol sym-bowl">🥣</div>`;
            reels[1].innerHTML = `<div class="symbol sym-wild">🐍</div><div class="symbol sym-wild">🐍</div><div class="symbol sym-wild">🐍</div>`;
            reels[2].innerHTML = `<div class="symbol sym-chain">💲</div><div class="symbol sym-chain">💲</div><div class="symbol sym-chain">💲</div>`;
            
            document.getElementById('msg').innerText = "WILD x10!";
            
            // CREDITAR GANHO (EXEMPLO)
            let ganho = valorAposta * 10;
            try {
                if(window.SistemaSaldo && typeof window.SistemaSaldo.creditar === 'function') {
                    window.SistemaSaldo.creditar(ganho);
                } else {
                    saldoAtual += ganho;
                }
            } catch(e) { saldoAtual += ganho; }
            atualizarDisplay();
            
        }, 1500);
    }

    function toggleSom() {
        // Apenas visual por enquanto
        const btn = event.target;
        btn.innerText = btn.innerText === '🔇' ? '🔊' : '🔇';
    }
</script>

</body>
</html>
