<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Snake - ApostaXBet</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#4b2375 0%,#1a0b2e 45%,#08030d 100%);
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game-container{
    width:350px;
    max-width:94vw;
    padding:20px;
    text-align:center;
    border:2px solid #ffd700;
    border-radius:20px;
    background:linear-gradient(180deg,#321957,#160922);
    box-shadow:0 0 30px rgba(255,215,0,.25);
}

h2{
    margin:0 0 5px;
    color:#ffd700;
}

.subtitle{
    color:#aaa;
    font-size:13px;
}

.message-area{
    min-height:30px;
    margin:12px 0;
    font-weight:bold;
    color:#00ed91;
}

.slot-machine{
    display:flex;
    gap:7px;
    padding:12px;
    background:#09030e;
    border:2px solid #4a2c7a;
    border-radius:15px;
    overflow:hidden;
}

.reel{
    flex:1;
    height:88px;
    overflow:hidden;
    position:relative;
    background:#211331;
    border:2px solid #51306d;
    border-radius:10px;
    box-shadow:inset 0 0 15px #000;
}

.reel-strip{
    position:absolute;
    width:100%;
    top:0;
    left:0;
}

.symbol{
    height:88px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.reel.stopping{
    box-shadow:
        0 0 20px rgba(255,215,0,.6),
        inset 0 0 15px #000;
}

.result{
    margin-top:12px;
    min-height:32px;
    font-weight:bold;
    font-size:18px;
}

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.bet{
    background:#0b0610;
    border:1px solid #4a2c7a;
    border-radius:20px;
    padding:10px 13px;
    color:#ffd700;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    font-size:17px;
    padding:13px 25px;
    border-radius:25px;
    background:linear-gradient(45deg,#ff00cc,#3333ff);
    box-shadow:0 5px 18px rgba(255,0,204,.35);
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:disabled{
    opacity:.5;
    filter:grayscale(1);
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

.win{
    animation:pulse .5s infinite;
    text-shadow:0 0 15px #ffd700;
}
</style>
</head>

<body>

<div class="game-container">

    <h2>🐍 Fortune Snake</h2>
    <div class="subtitle">Fortuna está girando...</div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin">
            GIRAR
        </button>

    </div>

</div>

<!-- SISTEMA DE SALDO -->
<script type="module" src="../saldo.js"></script>

<script>
const APOSTA = 1.00;

/*
 * Símbolos e valores.
 *
 * A tabela de pagamentos é fixa.
 * O resultado continua aleatório.
 */
const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

/*
 * Pagamentos por linha de 3 símbolos iguais.
 *
 * 3x 🍒 = 1.50
 * 3x 🍋 = 2.00
 * 3x 💰 = 3.00
 * 3x 💎 = 4.00
 * 3x 🏆 = 6.00
 * 3x 🐍 = 10.00
 */
const PAGAMENTOS = {
    "🍒":1.5,
    "🍋":2,
    "💰":3,
    "💎":4,
    "🏆":6,
    "🐍":10
};

const msg = document.getElementById("msgArea");
const result = document.getElementById("result");
const button = document.getElementById("btnSpin");

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips = [
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];


/* --------------------------------
   MENSAGEM
-------------------------------- */

function mensagem(texto, cor="#00ed91"){
    msg.textContent = texto;
    msg.style.color = cor;
}


/* --------------------------------
   CRIA OS ROLOS
-------------------------------- */

function criarRolo(strip){

    strip.innerHTML = "";

    /*
     * Repetimos símbolos para criar
     * uma faixa longa de máquina.
     */
    for(let volta=0; volta<8; volta++){

        for(const simbolo of SIMBOLOS){

            const div = document.createElement("div");

            div.className="symbol";
            div.textContent=simbolo;

            strip.appendChild(div);
        }
    }
}


/* --------------------------------
   INICIALIZA
-------------------------------- */

strips.forEach(criarRolo);


/* --------------------------------
   SÍMBOLO ALEATÓRIO
-------------------------------- */

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random()*SIMBOLOS.length
        )
    ];
}


/* --------------------------------
   PREPARA ROTAÇÃO
-------------------------------- */

function prepararRolo(strip){

    strip.style.transition="none";
    strip.style.transform="translateY(0px)";

    /*
     * Força o navegador a aplicar
     * a posição inicial antes da animação.
     */
    strip.offsetHeight;
}


/* --------------------------------
   GIRO DE UM ROLO
-------------------------------- */

function girarRolo(index, resultado, duracao){

    return new Promise(resolve=>{

        const strip = strips[index];
        const reel = reels[index];

        const altura=88;
        const simbolosPorVolta=SIMBOLOS.length;

        /*
         * Escolhe a posição final.
         */
        const simboloFinal=resultado[index];

        const posFinal=SIMBOLOS.indexOf(
            simboloFinal
        );

        /*
         * Muitas voltas antes de parar.
         * Isso cria o efeito de caça-níquel.
         */
        const voltas=5+Math.floor(
            Math.random()*3
        );

        const deslocamento=
            -(
                (
                    voltas*
                    simbolosPorVolta
                )+
                posFinal
            )*altura;

        prepararRolo(strip);

        reel.classList.remove("stopping");

        /*
         * Pequeno atraso deixa os três
         * rolos começarem de maneira natural.
         */
        setTimeout(()=>{

            strip.style.transition=
                `transform ${duracao}ms cubic-bezier(.12,.7,.18,1)`;

            strip.style.transform=
                `translateY(${deslocamento}px)`;

            setTimeout(()=>{

                reel.classList.add(
                    "stopping"
                );

                resolve();

            },duracao);

        },index*120);
    });
}


/* --------------------------------
   GIRO COMPLETO
-------------------------------- */

async function executarGiro(resultado){

    /*
     * Cada rolo possui duração diferente.
     */
    const promessas=[
        girarRolo(0,resultado,1900),
        girarRolo(1,resultado,2300),
        girarRolo(2,resultado,2700)
    ];

    await Promise.all(promessas);
}


/* --------------------------------
   RESULTADO
-------------------------------- */

function calcularPremio(resultado){

    /*
     * Só existe prêmio quando
     * os três símbolos são iguais.
     */
    if(
        resultado[0] === resultado[1] &&
        resultado[1] === resultado[2]
    ){

        return PAGAMENTOS[
            resultado[0]
        ] || 0;
    }

    return 0;
}


/* --------------------------------
   GIRO
-------------------------------- */

button.addEventListener(
"click",
async function(){

    if(!window.SistemaSaldo){

        mensagem(
            "⚠️ Sistema de saldo não encontrado!",
            "#ff4d4d"
        );

        return;
    }

    button.disabled=true;

    try{

        const saldo=
            await window.SistemaSaldo.get();

        if(
            typeof saldo !== "number" ||
            saldo < APOSTA
        ){

            mensagem(
                "❌ Saldo insuficiente!",
                "#ff4d4d"
            );

            button.disabled=false;
            return;
        }


        /*
         * Debita a aposta.
         */
        await window.SistemaSaldo.debitar(
            APOSTA
        );


        mensagem(
            "🎰 Os rolos estão girando..."
        );

        result.textContent="";


        /*
         * Resultado aleatório.
         *
         * Não escolhemos previamente
         * vitória ou derrota.
         */
        const resultado=[
            simboloAleatorio(),
            simboloAleatorio(),
            simboloAleatorio()
        ];


        await executarGiro(
            resultado
        );


        /*
         * Mostra o resultado final.
         */
        result.textContent=
            resultado.join("   ");


        /*
         * Calcula pagamento.
         */
        const premio=
            calcularPremio(
                resultado
            );


        if(premio>0){

            /*
             * Destaca os rolos.
             */
            reels.forEach(reel=>{
                reel.classList.add("win");
            });


            await window.SistemaSaldo.ganhar(
                APOSTA,
                premio / APOSTA
            );


            mensagem(
                `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                "#00ed91"
            );

            result.textContent=
                `${resultado.join("   ")}  💰`;

        }else{

            mensagem(
                "😈 Não foi dessa vez...",
                "#aaa"
            );
        }


        /*
         * Atualiza o saldo visual.
         */
        if(
            window.SistemaSaldo.atualizarTela
        ){

            await window.SistemaSaldo
                .atualizarTela();
        }


    }catch(erro){

        console.error(erro);

        mensagem(
            "⚠️ Ocorreu um erro no giro.",
            "#ff4d4d"
        );

    }finally{

        setTimeout(()=>{

            reels.forEach(reel=>{
                reel.classList.remove(
                    "stopping",
                    "win"
                );
            });

            button.disabled=false;

        },500);
    }

});
</script>

</body>
</html>
