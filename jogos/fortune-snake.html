<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fortune Snake - No Frame</title>
<style>
    /* RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a0b2e; }

    .app-container {
        width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
        display: flex; flex-direction: column;
        background: linear-gradient(180deg, #2e1065 0%, #4c1d95 40%, #1e1b4b 100%);
    }

    /* TOPO */
    .top-bar {
        height: 50px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
        color: white; z-index: 20;
    }
    .lobby-text { font-size: 12px; opacity: 0.8; }
    .title-text { font-size: 12px; letter-spacing: 1px; opacity: 0.9; text-transform: uppercase; }
    .trophy { 
        width: 32px; height: 32px; border-radius: 50%;
        background: radial-gradient(circle, #fbbf24, #b45309);
        border: 2px solid #fff; display: grid; place-items: center; font-size: 16px;
        box-shadow: 0 0 10px rgba(251,191,36,0.5);
    }

    /* ÁREA DOS ROLOS - SEM CONTAINER DE CAIXA */
    .game-stage {
        flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
        padding: 0 5px; overflow: hidden;
    }

    /* ROLAS DIRETAS NA TELA (SEM BORDA EXTERNA) */
    .reel-column {
        flex: 1; height: 65%; margin: 0 3px;
        background: rgba(30, 27, 75, 0.3); /* Fundo sutil integrado ao roxo */
        border-radius: 12px; overflow: hidden;
        position: relative;
        /* Sombra INTERNA apenas para dar profundidade, sem criar caixa */
        box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        /* Máscara para suavizar as pontas durante o giro */
        mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    /* TIRA DE SÍMBOLOS QUE VAI GIRAR */
    .symbol-strip {
        position: absolute; top: 0; left: 0; width: 100%;
        will-change: transform;
    }

    .sym-cell {
        height: 33.33%; display: grid; place-items: center;
        font-size: 40px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    }

    /* TEXTO FLUTUANTE */
    .feature-banner {
        position: absolute; bottom: 10px; width: 100%; text-align: center;
        color: #bef264; font-style: italic; font-weight: bold; font-size: 13px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9); pointer-events: none; z-index: 6;
    }

    /* PAINEL INFERIOR VERMELHO */
    .control-panel {
        background: linear-gradient(180deg, #7f1d1d 0%, #450a0a 60%, #2a0505 100%);
        border-top-left-radius: 30px; border-top-right-radius: 30px;
        border-top: 1px solid rgba(252, 165, 165, 0.3);
        padding: 15px 10px 25px; z-index: 10;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    .info-strip {
        width: 96%; background: rgba(42, 5, 5, 0.8); border-radius: 20px;
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 15px; border: 1px solid rgba(85,85,85,0.5);
    }
    .info-group { display: flex; align-items: center; gap: 8px; color: #fca5a5; font-weight: bold; font-size: 14px; }
    .info-label { font-size: 8px; color: #888; text-transform: uppercase; display: block; margin-bottom: 1px; }
    .pg-logo { font-size: 9px; color: #aaa; font-weight: 900; border: 1px solid #666; padding: 2px 5px; border-radius: 3px; }

    .btn-row { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
    
    .ctrl-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: #2a0505; border: 1px solid #444; color: #ccc;
        display: grid; place-items: center; font-size: 16px;
        box-shadow: 0 3px 0 #1a0505; transition: all 0.1s;
    }
    .ctrl-btn:active { transform: translateY(3px); box-shadow: none; }

    .spin-button {
        width: 80px; height: 80px; border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #e9d5ff 0%, #a855f7 40%, #6b21a8 100%);
        border: 3px solid #4ade80; outline: 3px solid #166534;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), inset 0 5px 10px rgba(255,255,255,0.3);
        display: grid; place-items: center; cursor: pointer; position: relative;
    }
    .spin-inner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
        animation: rotate 1.5s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    
    .spin-button.disabled { filter: grayscale(1); opacity: 0.6; pointer-events: none; }

    .status-text { color: #fca5a5; font-size: 11px; font-weight: bold; min-height: 14px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="lobby-text">Lobby</div>
        <div class="title-text">FORTUNE SNAKE</div>
        <div class="trophy"></div>
    </div>

    <!-- PALCO DO JOGO - ROLAS DIRETAS NO STAGE -->
    <div class="game-stage">
        <div class="reel-column" id="r1"><div class="symbol-strip"></div></div>
        <div class="reel-column" id="r2"><div class="symbol-strip"></div></div>
        <div class="reel-column" id="r3"><div class="symbol-strip"></div></div>
        
        <div class="feature-banner">Novas Rodadas na Funcionalidade Cobra</div>
    </div>

    <div class="control-panel">
        <div class="info-strip">
            <div class="info-group">
                <div style="border:1px solid #fca5a5; border-radius:50%; width:20px; height:20px; display:grid; place-items:center; font-size:9px;"></div>
                <div><span class="info-label">SALDO</span><span id="saldo-display">R$0,00</span></div>
            </div>
            <div class="pg-logo">PG</div>
            <div class="info-group" style="flex-direction:row-reverse;">
                <div style="border:1px solid #fca5a5; border-radius:50%; width:20px; height:20px; display:grid; place-items:center; font-size:9px;">$</div>
                <div style="text-align:right;"><span class="info-label">APOSTA</span><span id="bet-display">R$1,00</span></div>
            </div>
        </div>

        <div class="btn-row">
            <button class="ctrl-btn" onclick="toggleSound()">🔇</button>
            <button class="ctrl-btn" onclick="changeBet(-1)">➖</button>
            
            <div class="spin-button" id="spin-btn" onclick="spin()">
                <div class="spin-inner"></div>
            </div>
            
            <button class="ctrl-btn" onclick="changeBet(1)">➕</button>
            <button class="ctrl-btn">🔄</button>
        </div>
        
        <div class="status-text" id="status-msg">PRONTO PARA JOGAR</div>
    </div>
</div>

<script>
    let currentBet = 1.00;
    let isSpinning = false;
    const SYMBOLS = ['🥣','','💲','','🏆',''];

    function getBalance() {
        try { return window.SistemaSaldo?.get ? Number(window.SistemaSaldo.get()) || 0 : 0; } 
        catch(e) { return 0; }
    }

    function updateUI() {
        document.getElementById('saldo-display').innerText = getBalance().toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('bet-display').innerText = currentBet.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        try { window.SistemaSaldo?.atualizarTela?.(); } catch(e){}
    }

    function changeBet(dir) {
        if(isSpinning) return;
        const bets = [0.40, 0.60, 0.80, 1.00, 2.00, 4.00, 6.00, 8.00, 10.00];
        let idx = bets.indexOf(currentBet);
        if(idx === -1) idx = 3;
        if(dir > 0 && idx < bets.length - 1) idx++;
        if(dir < 0 && idx > 0) idx--;
        currentBet = bets[idx];
        updateUI();
    }

    // INICIALIZA OS ROLOS COM 3 SÍMBOLOS VISÍVEIS
    function initReels() {
        const reels = document.querySelectorAll('.reel-column');
        reels.forEach(r => {
            const strip = r.querySelector('.symbol-strip');
            strip.innerHTML = '';
            for(let i=0; i<3; i++) {
                const sym = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
                strip.innerHTML += `<div class="sym-cell">${sym}</div>`;
            }
        });
    }

    async function spin() {
        if(isSpinning) return;
        const bal = getBalance();
        
        if(bal < currentBet) {
            document.getElementById('status-msg').innerText = "SALDO INSUFICIENTE";
            return;
        }

        try {
            if(window.SistemaSaldo?.debitar) {
                if(!window.SistemaSaldo.debitar(currentBet)) return;
            }
        } catch(e) {}
        
        updateUI();
        isSpinning = true;
        document.getElementById('spin-btn').classList.add('disabled');
        document.getElementById('status-msg').innerText = "";

        const reelColumns = document.querySelectorAll('.reel-column');
        
        // DEFINE RESULTADO FINAL ANTES DO GIRO
        const finalResults = Array.from(reelColumns).map(() => [
            SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],
            '🐍', // Linha central fixa para demo
            SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]
        ]);

        // PREPARA AS TIRAS LONGAS PARA GIRO VERTICAL REAL
        reelColumns.forEach((col, i) => {
            const strip = col.querySelector('.symbol-strip');
            
            // Mantém os símbolos atuais visíveis no topo
            const currentVisible = Array.from(strip.querySelectorAll('.sym-cell')).map(el => el.innerText);
            let newHTML = currentVisible.map(s => `<div class="sym-cell">${s}</div>`).join('');
            
            // Adiciona 30 símbolos aleatórios para criar o efeito de giro longo
            for(let j=0; j<30; j++) {
                newHTML += `<div class="sym-cell">${SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}</div>`;
            }
            
            // Adiciona os 3 símbolos finais do resultado
            finalResults[i].forEach(s => newHTML += `<div class="sym-cell">${s}</div>`);
            
            strip.innerHTML = newHTML;
            
            // RESETA A POSIÇÃO DA TIRA
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0)';
        });

        // FORÇA REFLOW PARA GARANTIR QUE O RESET FUNCIONE ANTES DA ANIMAÇÃO
        void reelColumns[0].offsetHeight;

        // ANIMAÇÃO DE GIRO PARA CIMA COM TIMING ESCALONADO
        reelColumns.forEach((col, i) => {
            const strip = col.querySelector('.symbol-strip');
            const duration = 1.8 + (i * 0.4);
            const totalSymbols = strip.querySelectorAll('.sym-cell').length;
            const targetIndex = totalSymbols - 3; // Para nos últimos 3 símbolos
            const translateY = -(targetIndex * (100 / 3)); // Cada símbolo = 33.33% da altura
            
            strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.8, 0.15, 1)`;
            strip.style.transform = `translateY(${translateY}%)`;
        });

        // FINALIZA APÓS O ÚLTIMO ROLO PARAR
        setTimeout(() => {
            reelColumns.forEach((col, i) => {
                const strip = col.querySelector('.symbol-strip');
                // REMOVE TODOS OS SÍMBOLOS E MANTÉM APENAS OS 3 FINAIS
                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0)';
                strip.innerHTML = finalResults[i].map(s => `<div class="sym-cell">${s}</div>`).join('');
            });

            isSpinning = false;
            document.getElementById('spin-btn').classList.remove('disabled');
            
            const win = currentBet * 5;
            document.getElementById('status-msg').innerText = `GANHOU R$ ${win.toFixed(2)}!`;
            
            try {
                if(window.SistemaSaldo?.creditar) window.SistemaSaldo.creditar(win);
            } catch(e) {}
            updateUI();
            
        }, 3000);
    }

    function toggleSound() {
        const btn = event.currentTarget;
        btn.innerText = btn.innerText === '' ? '🔊' : '';
    }

    initReels();
    updateUI();
    window.addEventListener('focus', updateUI);
</script>
</body>
</html>
