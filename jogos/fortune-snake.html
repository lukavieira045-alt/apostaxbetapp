<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Fortune Snake 3D - ApostaXBet</title>

<!-- MÚSICA ORIGINAL DO SNAKE -->
<audio id="bgMusic" loop preload="auto">
    <source src="musica-fortune-snake.mp3" type="audio/mpeg">
</audio>

<style>
:root{
    --bg:#050207;
    --gold:#ffd700;
    --purple:#9100ff;
    --dark-purple:#1a0b2e;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; width:100%; min-height:100%; background: radial-gradient(circle at 50% -20%, #2a0e45 0%, #050207 70%); color:white; font-family: system-ui, sans-serif; }
body{ display:flex; justify-content:center; overflow-x:hidden; }
button{ font-family:inherit; border:0; cursor:pointer; }

.game{ width:min(100%,560px); min-height:100vh; padding:10px; position:relative; }

/* FUNDO 3D */
.glow{ position:fixed; width:600px; height:600px; left:50%; top:-300px; transform:translateX(-50%); pointer-events:none; background: radial-gradient(circle, rgba(145,0,255,.3), transparent 70%); filter:blur(40px); z-index:-1; }

/* TOPO */
.top{ height:60px; display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-icon{ width:45px; height:45px; border-radius:12px; display:grid; place-items:center; font-size:28px; background: linear-gradient(135deg, #ffd700, #b8860b); box-shadow: 0 4px 15px rgba(255,215,0,.4), inset 0 2px 2px rgba(255,255,255,.5); border: 2px solid #fff; }
.brand-title{ font-weight:900; font-size:18px; color:var(--gold); text-transform:uppercase; letter-spacing:1px; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
.balance{ padding:8px 15px; border-radius:50px; background: linear-gradient(180deg, #1a0b2e, #000); border: 1px solid #4a2c7a; box-shadow: inset 0 0 10px rgba(0,0,0,.8); text-align:right; }
.balance-value{ color:#00ff88; font-weight:bold; font-size:16px; text-shadow: 0 0 10px rgba(0,255,136,.4); }

/* MÁQUINA 3D */
.machine{ 
    padding:12px; 
    border-radius:30px; 
    background: linear-gradient(180deg, #ffd700 0%, #b8860b 15%, #1a0b2e 30%, #000 100%); 
    box-shadow: 
        0 20px 50px rgba(0,0,0,.8), 
        0 0 0 4px #4a2c7a,
        inset 0 0 20px rgba(0,0,0,.5);
    position:relative;
}

.machine-inner{ 
    padding:15px; 
    border-radius:20px; 
    background: linear-gradient(180deg, #2a0e45, #050207); 
    box-shadow: inset 0 10px 30px rgba(0,0,0,.9);
    border: 1px solid #5b00a8;
}

.reels{ 
    display:grid; 
    grid-template-columns:repeat(3,1fr); 
    gap:10px; 
    padding:10px; 
    border-radius:15px; 
    background:#000; 
    border: 4px solid #333;
    box-shadow: inset 0 0 40px #000;
    position:relative; 
    overflow:hidden; 
}

/* LINHA DE PAGAMENTO BRILHANTE */
.reels::before{
    content:""; position:absolute; left:0; right:0; top:50%; height:3px; 
    background: linear-gradient(90deg, transparent, #ff00cc, transparent); 
    box-shadow: 0 0 15px #ff00cc; z-index:10; opacity:.7;
}

.reel{ 
    height:210px; 
    border-radius:10px; 
    overflow:hidden; 
    position:relative; 
    background: linear-gradient(180deg, #111, #222 50%, #111); 
    border: 2px solid #444;
    box-shadow: inset 0 0 20px #000;
}

.strip{ position:absolute; left:0; right:0; top:0; will-change:transform; }

/* SÍMBOLOS COM EFEITO 3D */
.symbol{ 
    height:70px; 
    display:grid; 
    place-items:center; 
    position:relative; 
}

.symbol img{ 
    width:55px; 
    height:55px; 
    object-fit:contain; 
    /* O SEGREDO DO 3D: Sombras e Filtros */
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.8)) drop-shadow(0 2px 2px rgba(255,255,255,.2));
    transition: transform .2s;
}

.reel.spinning .symbol img{ filter: blur(3px) brightness(1.2); }

/* CONTROLES ESTILO CASSINO */
.main-controls{ display:grid; grid-template-columns: 1fr 1.6fr 1fr; gap:10px; margin-top:15px; }
.control-box{ 
    background: linear-gradient(180deg, #2a0e45, #000); 
    border-radius:15px; 
    padding:10px; 
    text-align:center; 
    border: 1px solid #4a2c7a;
    box-shadow: 0 5px 15px rgba(0,0,0,.5);
}
.control-label{ font-size:9px; color:#aaa; text-transform:uppercase; }
.control-value{ font-size:16px; font-weight:900; color:#fff; margin-top:4px; }

.spin-button{ 
    height:65px; 
    border-radius:50px; 
    background: linear-gradient(180deg, #ff00cc 0%, #9100ff 100%); 
    color:white; 
    font-size:22px; 
    font-weight:900; 
    text-transform:uppercase;
    border: 3px solid #ff88ee;
    box-shadow: 0 8px 0 #5b00a8, 0 15px 20px rgba(145,0,255,.4);
    transition: all .1s;
}
.spin-button:active{ transform:translateY(8px); box-shadow: 0 0 0 #5b00a8; }
.spin-button:disabled{ opacity:.5; filter:grayscale(1); }

.bet-panel{ margin-top:12px; display:flex; justify-content:center; gap:8px; }
.bet{ 
    padding:8px 15px; 
    border-radius:8px; 
    background:#1a0b2e; 
    border:1px solid #4a2c7a; 
    color:#ccc; 
    font-weight:bold;
}
.bet.active{ background:#ffd700; color:#000; border-color:#fff; box-shadow: 0 0 15px rgba(255,215,0,.5); }

.status{ text-align:center; margin-top:10px; color:#aaa; font-size:12px; min-height:20px; }
</style>
</head>

<body>

<div class="game">
<div class="glow"></div>

<header class="top">
    <div class="brand">
        <div class="brand-icon">🐍</div>
        <div class="brand-title">FORTUNE<br>SNAKE 3D</div>
    </div>
    <div class="balance">
        <div style="font-size:9px;color:#aaa">SALDO</div>
        <span class="balance-value" id="saldo">R$ 0,00</span>
    </div>
</header>

<section class="machine">
<div class="machine-inner">
    <div class="reels" id="reels">
        <div class="reel"><div class="strip" id="r1"></div></div>
        <div class="reel"><div class="strip" id="r2"></div></div>
        <div class="reel"><div class="strip" id="r3"></div></div>
    </div>
</div>
</section>

<section class="main-controls">
    <div class="control-box"><div class="control-label">Aposta</div><div class="control-value" id="betDisplay">R$ 1,00</div></div>
    <button class="spin-button" id="spinButton">GIRAR</button>
    <div class="control-box"><div class="control-label">Ganho</div><div class="control-value" id="winDisplay">R$ 0,00</div></div>
</section>

<section class="bet-panel">
    <button class="bet" data-bet="0.50">0.50</button>
    <button class="bet active" data-bet="1.00">1.00</button>
    <button class="bet" data-bet="2.00">2.00</button>
    <button class="bet" data-bet="5.00">5.00</button>
</section>

<div class="status" id="status">Pronto para jogar</div>
</div>

<script>
"use strict";
const CONFIG = {
    apostaInicial: 1.00,
    pesos: { "snake": 3, "diamond": 5, "trophy": 10, "coin": 25, "lemon": 30, "cherry": 35 },
    pagamentos: { "snake": 10.00, "diamond": 6.00, "trophy": 4.00, "coin": 2.50, "lemon": 1.50, "cherry": 1.20 },
    tempos: [1200, 1700, 2200]
};

// IMAGENS 3D PROFISSIONAIS (PNGs Reais)
const IMAGENS = {
    "snake": "https://cdn-icons-png.flaticon.com/512/616/616408.png",
    "diamond": "https://cdn-icons-png.flaticon.com/512/2933/2933116.png",
    "trophy": "https://cdn-icons-png.flaticon.com/512/3112/3112946.png",
    "coin": "https://cdn-icons-png.flaticon.com/512/2535/2535063.png",
    "lemon": "https://cdn-icons-png.flaticon.com/512/1135/1135543.png",
    "cherry": "https://cdn-icons-png.flaticon.com/512/1135/1135548.png"
};

const saldoEl = document.getElementById("saldo");
const betDisplay = document.getElementById("betDisplay");
const winDisplay = document.getElementById("winDisplay");
const statusEl = document.getElementById("status");
const spinButton = document.getElementById("spinButton");
const bgMusic = document.getElementById("bgMusic");
const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
const reelBoxes = [...document.querySelectorAll(".reel")];

let aposta = CONFIG.apostaInicial;
let girando = false;
let audioContext = null;

function obterSaldo(){ return window.SistemaSaldo ? Number(window.SistemaSaldo.get()) || 0 : 0; }
function debitar(v){ return window.SistemaSaldo ? window.SistemaSaldo.debitar(v) : false; }
function creditar(v){ return window.SistemaSaldo ? window.SistemaSaldo.creditar(v) : false; }
function atualizarSaldoVisual(){ 
    saldoEl.textContent = Number(obterSaldo()).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    if(window.SistemaSaldo && window.SistemaSaldo.atualizarTela) window.SistemaSaldo.atualizarTela();
}

const simbolos = Object.keys(CONFIG.pesos);
function escolherSimbolo(){
    let total = simbolos.reduce((s, k) => s + CONFIG.pesos[k], 0);
    let r = Math.random() * total;
    for(let k of simbolos){ r -= CONFIG.pesos[k]; if(r <= 0) return k; }
    return simbolos[0];
}

function criarSimbolo(key){
    return `<div class="symbol"><img src="${IMAGENS[key]}" draggable="false"></div>`;
}

function preencherRolo(el){ el.innerHTML = Array(20).fill(0).map(()=>criarSimbolo(escolherSimbolo())).join(""); }

function prepararResultado(el, vals){
    const extras = Array(8).fill(0).map(()=>escolherSimbolo());
    el.innerHTML = [...extras, ...vals, ...extras].map(criarSimbolo).join("");
    el.style.transition = "none";
    el.style.transform = `translateY(${-8 * 70}px)`;
}

function encontrarLinhas(res){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return linhas.filter(l => {
        const v = l.map(i => res[i]);
        return v.every(x => x === v[0]);
    });
}

function calcularPremio(res){
    let premio = 0;
    encontrarLinhas(res).forEach(l => {
        premio += aposta * (CONFIG.pagamentos[res[l[0]]] || 0);
    });
    return premio;
}

function initAudio() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
function tocarSom(f, d, t="sine", v=0.15){
    if(!audioContext) return;
    try{
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.001, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(v, audioContext.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + d);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d);
    }catch(e){}
}

async function girar(){
    if(girando) return;
    girando = true;
    spinButton.disabled = true;

    initAudio();
    if(bgMusic.paused) bgMusic.play().catch(()=>{});

    // DESCONTO IMEDIATO
    if(obterSaldo() < aposta){ statusEl.textContent = "Saldo insuficiente."; girando=false; spinButton.disabled=false; return; }
    if(!debitar(aposta)){ statusEl.textContent = "Erro ao apostar."; girando=false; spinButton.disabled=false; return; }

    statusEl.textContent = "Girando...";
    reelBoxes.forEach(r => r.classList.add("spinning"));
    tocarSom(115, 0.18, "sawtooth", 0.15);

    const res = Array(9).fill(0).map(escolherSimbolo);
    const cols = [[res[0],res[3],res[6]], [res[1],res[4],res[7]], [res[2],res[5],res[8]]];
    
    reels.forEach(preencherRolo);
    
    await Promise.all(reels.map((el, i) => new Promise(resolve => {
        el.style.transition = `transform ${CONFIG.tempos[i]}ms cubic-bezier(.15,.8,.1,1)`;
        el.style.transform = `translateY(-${(12+Math.random()*5)*70}px)`;
        setTimeout(() => { prepararResultado(el, cols[i]); tocarSom(230+i*80, 0.12, "triangle", 0.15); resolve(); }, CONFIG.tempos[i]);
    })));

    reelBoxes.forEach(r => r.classList.remove("spinning"));
    
    const premio = calcularPremio(res);
    if(premio > 0){
        winDisplay.textContent = Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
        statusEl.textContent = `VITÓRIA! +${Number(premio).toFixed(2)}`;
        creditar(premio);
        tocarSom(600, 0.3, "sine", 0.15);
        reelBoxes.forEach(r => r.style.boxShadow = "inset 0 0 30px #ffd700");
        setTimeout(() => reelBoxes.forEach(r => r.style.boxShadow = ""), 1000);
    } else {
        winDisplay.textContent = "R$ 0,00";
        statusEl.textContent = "Tente novamente";
    }

    atualizarSaldoVisual();
    girando = false;
    spinButton.disabled = false;
}

document.querySelectorAll(".bet").forEach(b => b.onclick = () => {
    if(girando) return;
    aposta = Number(b.dataset.bet);
    document.querySelectorAll(".bet").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    betDisplay.textContent = Number(aposta).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
});

spinButton.onclick = girar;
atualizarSaldoVisual();
reels.forEach(preencherRolo);
</script>
</body>
</html>
