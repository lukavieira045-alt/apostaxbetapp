<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Snake - ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #09030f;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

/* =====================================================
   FUNDO ANIMADO
===================================================== */

body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: -3;
}

body::before {
    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(151, 43, 255, .35),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255, 190, 0, .20),
            transparent 25%
        ),
        radial-gradient(
            circle at 70% 80%,
            rgba(255, 0, 204, .22),
            transparent 28%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(74, 0, 255, .25),
            transparent 28%
        );

    animation: fundoMovimento 12s ease-in-out infinite alternate;
}

body::after {
    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.18) 0 2px,
            transparent 3px
        );

    background-size: 70px 70px;

    opacity: .35;

    animation: particulas 18s linear infinite;
}

@keyframes fundoMovimento {

    0% {
        transform: translate(-3%, -2%) scale(1);
    }

    50% {
        transform: translate(3%, 2%) scale(1.08);
    }

    100% {
        transform: translate(-2%, 3%) scale(1.03);
    }
}

@keyframes particulas {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-140px);
    }
}


/* =====================================================
   BRILHO ATRÁS DO JOGO
===================================================== */

.background-glow {
    position: fixed;
    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.18),
            rgba(155,0,255,.10),
            transparent 70%
        );

    filter: blur(15px);

    animation: glow 5s ease-in-out infinite alternate;

    pointer-events: none;
    z-index: -2;
}

@keyframes glow {

    from {
        transform: scale(.9);
        opacity: .55;
    }

    to {
        transform: scale(1.15);
        opacity: .9;
    }
}


/* =====================================================
   JOGO
===================================================== */

.game-container {

    width: 350px;
    max-width: 94vw;

    padding: 20px;

    text-align: center;

    border: 2px solid #ffd700;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.96),
            rgba(22,9,34,.97)
        );

    box-shadow:
        0 0 20px rgba(255,215,0,.25),
        0 0 60px rgba(145,0,255,.20);

    backdrop-filter: blur(8px);

    position: relative;
}


/* brilho da borda */

.game-container::before {

    content: "";

    position: absolute;

    inset: -2px;

    border-radius: 20px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,215,0,.65),
            transparent,
            rgba(183,0,255,.55),
            transparent
        );

    background-size: 300% 300%;

    animation: borda 5s linear infinite;

    z-index: -1;
}

@keyframes borda {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =====================================================
   TÍTULO
===================================================== */

h2 {

    margin: 0 0 5px;

    color: #ffd700;

    text-shadow:
        0 0 8px rgba(255,215,0,.5),
        0 0 20px rgba(255,150,0,.25);
}

.subtitle {

    color: #c5b7d6;

    font-size: 13px;
}


/* =====================================================
   MENSAGEM
===================================================== */

.message-area {

    min-height: 30px;

    margin: 12px 0;

    font-weight: bold;

    color: #00ed91;

    text-shadow:
        0 0 8px rgba(0,237,145,.35);
}


/* =====================================================
   MÁQUINA
===================================================== */

.slot-machine {

    display: flex;

    gap: 7px;

    padding: 12px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #050207
        );

    border: 2px solid #4a2c7a;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        inset 0 0 25px #000,
        0 0 15px rgba(115,0,255,.15);
}

.reel {

    flex: 1;

    height: 88px;

    overflow: hidden;

    position: relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border: 2px solid #51306d;

    border-radius: 10px;

    box-shadow:
        inset 0 0 15px #000;
}

.reel-strip {

    position: absolute;

    width: 100%;

    top: 0;

    left: 0;
}

.symbol {

    height: 88px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 42px;
}

.reel.stopping {

    box-shadow:
        0 0 20px rgba(255,215,0,.6),
        inset 0 0 15px #000;
}

.win {

    animation: pulse .5s infinite;

    text-shadow:
        0 0 15px #ffd700;
}

@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}


/* =====================================================
   RESULTADO
===================================================== */

.result {

    margin-top: 12px;

    min-height: 32px;

    font-weight: bold;

    font-size: 18px;
}


/* =====================================================
   CONTROLES
===================================================== */

.controls {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-top: 18px;
}

.bet {

    background: #0b0610;

    border: 1px solid #4a2c7a;

    border-radius: 20px;

    padding: 10px 13px;

    color: #ffd700;

    font-weight: bold;

    white-space: nowrap;
}

button {

    border: 0;

    color: white;

    font-weight: bold;

    font-size: 17px;

    padding: 13px 25px;

    border-radius: 25px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 18px rgba(255,0,204,.35);

    cursor: pointer;
}

button:active {

    transform: scale(.95);
}

button:hover {

    box-shadow:
        0 0 25px rgba(255,0,204,.65);
}

button:disabled {

    opacity: .5;

    filter: grayscale(1);
body {
    background:
        radial-gradient(circle at 10% 20%, #5b00a8, transparent 35%),
        radial-gradient(circle at 90% 20%, #8a6200, transparent 35%),
        radial-gradient(circle at 80% 80%, #68005f, transparent 35%),
        #08000f !important;
}

h2 {
    color: #ffd700 !important;
    text-shadow:
        0 0 8px #ffd700,
        0 0 18px #ff00cc;
}

.message-area {
    color: #00ed91 !important;
}

.bet-display {
    color: #ffd700 !important;
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="game-container">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>

const APOSTA = 1.00;

const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS = {
    "🍒": 1.20,
    "🍋": 1.50,
    "💰": 2.00,
    "💎": 3.00,
    "🏆": 4.00,
    "🐍": 7.00
};

const msg =
    document.getElementById("msgArea");

const result =
    document.getElementById("result");

const button =
    document.getElementById("btnSpin");

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips = [
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(
    texto,
    cor = "#00ed91"
) {
    msg.textContent = texto;
    msg.style.color = cor;
}

function criarRolo(strip) {

    strip.innerHTML = "";

    for (let volta = 0; volta < 8; volta++) {

        for (const simbolo of SIMBOLOS) {

            const div =
                document.createElement("div");

            div.className = "symbol";

            div.textContent = simbolo;

            strip.appendChild(div);
        }
    }
}

strips.forEach(criarRolo);

function simboloAleatorio() {

    return SIMBOLOS[
        Math.floor(
            Math.random() * SIMBOLOS.length
        )
    ];
}

function prepararRolo(strip) {

    strip.style.transition = "none";

    strip.style.transform =
        "translateY(0px)";

    strip.offsetHeight;
}

function girarRolo(
    index,
    resultado,
    duracao
) {

    return new Promise(resolve => {

        const strip =
            strips[index];

        const reel =
            reels[index];

        const altura = 88;

        const simbolosPorVolta =
            SIMBOLOS.length;

        const simboloFinal =
            resultado[index];

        const posFinal =
            SIMBOLOS.indexOf(
                simboloFinal
            );

        const voltas =
            5 + Math.floor(
                Math.random() * 3
            );

        const deslocamento =
            -(
                (
                    voltas *
                    simbolosPorVolta
                ) +
                posFinal
            ) * altura;

        prepararRolo(strip);

        reel.classList.remove(
            "stopping"
        );

        setTimeout(() => {

            strip.style.transition =
                `transform ${duracao}ms cubic-bezier(.12,.7,.18,1)`;

            strip.style.transform =
                `translateY(${deslocamento}px)`;

            setTimeout(() => {

                reel.classList.add(
                    "stopping"
                );

                resolve();

            }, duracao);

        }, index * 120);

    });
}

async function executarGiro(resultado) {

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1900
        ),

        girarRolo(
            1,
            resultado,
            2300
        ),

        girarRolo(
            2,
            resultado,
            2700
        )

    ]);
}

function calcularPremio(resultado) {

    if (
        resultado[0] === resultado[1] &&
        resultado[1] === resultado[2]
    ) {

        return PAGAMENTOS[
            resultado[0]
        ] || 0;
    }

    return 0;
}

button.addEventListener(
    "click",
    async function() {

        if (!window.SistemaSaldo) {

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled = true;

        try {

            const saldo =
                await window.SistemaSaldo.get();

            if (
                typeof saldo !== "number" ||
                saldo < APOSTA
            ) {

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled = false;

                return;
            }

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            mensagem(
                "🎰 Os rolos estão girando..."
            );

            result.textContent = "";

            const resultado = [

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            await executarGiro(
                resultado
            );

            result.textContent =
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if (premio > 0) {

                reels.forEach(reel => {

                    reel.classList.add(
                        "win"
                    );

                });

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio / APOSTA
                );

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent =
                    `${resultado.join("   ")} 💰`;

            } else {

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if (
                window.SistemaSaldo.atualizarTela
            ) {

                await window.SistemaSaldo
                    .atualizarTela();
            }

        } catch (erro) {

            console.error(erro);

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        } finally {

            setTimeout(() => {

                reels.forEach(reel => {

                    reel.classList.remove(
                        "stopping",
                        "win"
                    );

                });

                button.disabled = false;

            }, 500);
        }
    }
);

</script>

</body>
</html>
