<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Fortune Snake - ApostaXBet</title>

<!-- MÚSICA ORIGINAL DO SNAKE -->
<audio id="bgMusic" loop preload="auto">
    <source src="musica-fortune-snake.mp3" type="audio/mpeg">
</audio>

<style>
:root{
    --bg:#07050b;
    --panel:#140d19;
    --gold:#f3c65b;
    --gold2:#fff0a1;
    --purple:#9100ff;
    --text:#fff8e4;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; width:100%; min-height:100%; background: radial-gradient(circle at 50% 0%,#3a1b38 0%,#160b1c 32%,#07050b 78%); color:white; font-family: system-ui, sans-serif; }
body{ display:flex; justify-content:center; overflow-x:hidden; }
button{ font-family:inherit; border:0; cursor:pointer; }

.game{ width:min(100%,560px); min-height:100vh; padding:10px; position:relative; overflow:hidden; }

/* FUNDO */
.game::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.13; background-image: radial-gradient(#fff 0.7px,transparent .8px); background-size:20px 20px; }
.glow{ position:fixed; width:500px; height:500px; left:50%; top:-260px; transform:translateX(-50%); pointer-events:none; background: radial-gradient(circle, rgba(145,0,255,.25), rgba(255,215,0,.08) 35%, transparent 70%); filter:blur(10px); }

/* TOPO */
.top{ height:58px; display:flex; align-items:center; justify-content:space-between; z-index:5; position:relative; }
.brand{ display:flex; align-items:center; gap:9px; }
.brand-icon{ width:43px; height:43px; border-radius:14px; display:grid; place-items:center; font-size:25px; background: linear-gradient(145deg, #ffd700, #9100ff 48%, #5b00a8); box-shadow: 0 5px 20px rgba(0,0,0,.5), 0 0 22px rgba(145,0,255,.4); }
.brand-title{ font-weight:1000; font-size:15px; color:var(--gold); text-shadow: 0 0 10px rgba(255,215,0,.6); }
.balance{ min-width:108px; padding:7px 10px; border-radius:13px; text-align:right; background: rgba(5,5,15,.94); border:1px solid #5b00a8; box-shadow: 0 0 15px rgba(170,255,93,.25); }
.balance-value{ display:block; color:#aaff5d; font-size:15px; font-weight:900; }

/* MÁQUINA */
.machine{ padding:8px; border-radius:27px; background: linear-gradient(145deg, #ffd700 0%, #9100ff 10%, #321957 17%, #160922 78%, #5b00a8 100%); box-shadow: 0 20px 45px rgba(0,0,0,.65); }
.machine-inner{ padding:10px; border-radius:21px; background: linear-gradient(180deg, #321957, #160922 48%, #08000f); }
.reels{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:8px; border-radius:18px; background:#050207; border:1px solid #4a2c7a; position:relative; overflow:hidden; }
.reel{ height:205px; border-radius:13px; overflow:hidden; position:relative; background: linear-gradient(180deg, #29153c, #13091d 50%, #050207); border:1px solid #51306d; }
.strip{ position:absolute; left:0; right:0; top:0; will-change:transform; }

/* SÍMBOLOS COM IMAGENS */
.symbol{ height:68px; display:grid; place-items:center; position:relative; }
.symbol img{ width:50px; height:50px; object-fit:contain; filter: drop-shadow(0 5px 7px rgba(0,0,0,.8)); }
.reel.spinning .symbol img{ filter: blur(2px) brightness(1.2); }
.reel.win{ box-shadow: inset 0 0 25px rgba(255,215,0,.35), 0 0 24px rgba(255,215,0,.7); }

/* CONTROLES */
.main-controls{ display:grid; grid-template-columns: 1fr 1.55fr 1fr; gap:8px; margin-top:10px; }
.control-box{ min-height:61px; padding:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:15px; background: linear-gradient(180deg, #2a1931, #160c1d); border:1px solid #59405f; }
.control-value{ color:#ffe39a; font-size:15px; font-weight:900; }
.spin-button{ min-height:61px; border-radius:18px; background: radial-gradient(circle at 50% 18%, #fff4b0 0%, #9100ff 35%, #5b00a8 100%); color:#fff; font-size:20px; font-weight:1000; border:3px solid #ffd700; box-shadow: 0 7px 0 #321957; transition: transform .1s; }
.spin-button:active{ transform:translateY(5px); }
.bet-panel{ margin-top:9px; padding:9px; display:flex; justify-content:space-between; border-radius:15px; background:#120b18; border:1px solid #3b2942; }
.bet{ min-width:47px; padding:8px; border-radius:9px; background:#21142a; border:1px solid #4a3552; color:#d8c5dd; }
.bet.active{ color:#ffd700; border-color:#ffd700; }
.status{ min-height:32px; display:flex; align-items:center; justify-content:center; margin-top:7px; padding:7px; border-radius:11px; background:#0b0710; border:1px solid #3b293f; font-size:10px; text-align:center; }
</style>
</head>

<body>

<div class="game">
<div class="glow"></div>

<header class="top">
    <div class="brand">
        <div class="brand-icon">🐍</div>
        <div>
            <div class="brand-title">FORTUNE SNAKE</div>
            <div style="font-size:8px;color:#c5b7d6">PREMIUM SLOT</div>
        </div>
    </div>
    <div class="balance">
        <span style="font-size:8px;color:#aaff5d">SALDO</span>
        <span class="balance-value" id="saldo">R$ 0,00</span>
    </div>
</header>

<section class="machine">
<div class="machine-inner">
    <div class="reels" id="reels">
        <div class="reel"><div class="strip" id="r1"></div></div>
        <div class="reel"><div class="strip" id="r2"></div></div>
        <div class="reel"><div class="strip" id="r3"></div></div>
    </div>
    <div class="status" id="status">Pronto para girar</div>
</div>
</section>

<section class="main-controls">
    <div class="control-box"><span style="font-size:7px;color:#94849c">APOSTA</span><span class="control-value" id="betDisplay">R$ 1,00</span></div>
    <button class="spin-button" id="spinButton">GIRAR</button>
    <div class="control-box"><span style="font-size:7px;color:#94849c">PRÊMIO</span><span class="control-value" id="winDisplay">R$ 0,00</span></div>
</section>

<section class="bet-panel">
    <span style="color:#95849d;font-size:8px">VALOR</span>
    <div style="display:flex;gap:5px">
        <button class="bet" data-bet="0.50">0,50</button>
        <button class="bet active" data-bet="1.00">1,00</button>
        <button class="bet" data-bet="2.00">2,00</button>
    </div>
</section>

</div>

<script>
"use strict";
const CONFIG = {
    apostaInicial: 1.00,
    pesos: { "snake": 4, "diamond": 6, "trophy": 12, "coin": 20, "lemon": 30, "cherry": 35 },
    pagamentos: { "snake": 8.00, "diamond": 5.00, "trophy": 3.00, "coin": 2.00, "lemon": 1.50, "cherry": 1.20 },
    tempos: [1000, 1500, 2000]
};

// LINKS DE IMAGENS PROFISSIONAIS (PNG Transparente)
const IMAGENS = {
    "snake": "https://cdn-icons-png.flaticon.com/512/616/616408.png", // Cobra Dourada
    "diamond": "https://cdn-icons-png.flaticon.com/512/2933/2933116.png", // Diamante
    "trophy": "https://cdn-icons-png.flaticon.com/512/3112/3112946.png", // Troféu
    "coin": "https://cdn-icons-png.flaticon.com/512/2535/2535063.png", // Moeda
    "lemon": "https://cdn-icons-png.flaticon.com/512/1135/1135543.png", // Limão
    "cherry": "https://cdn-icons-png.flaticon.com/512/1135/1135548.png" // Cereja
};

const saldoEl = document.getElementById("saldo");
const betDisplay = document.getElementById("betDisplay");
const winDisplay = document.getElementById("winDisplay");
const statusEl = document.getElementById("status");
const spinButton = document.getElementById("spinButton");
const bgMusic = document.getElementById("bgMusic");
const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
const reelBoxes = [...document.querySelectorAll(".reel")];

let aposta = CONFIG.apostaInicial;
let girando = false;
let audioContext = null;

function obterSaldo(){ return window.SistemaSaldo ? Number(window.SistemaSaldo.get()) || 0 : 0; }
function debitar(v){ return window.SistemaSaldo ? window.SistemaSaldo.debitar(v) : false; }
function creditar(v){ return window.SistemaSaldo ? window.SistemaSaldo.creditar(v) : false; }
function atualizarSaldoVisual(){ 
    saldoEl.textContent = Number(obterSaldo()).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    if(window.SistemaSaldo && window.SistemaSaldo.atualizarTela) window.SistemaSaldo.atualizarTela();
}

const simbolos = Object.keys(CONFIG.pesos);
function escolherSimbolo(){
    let total = simbolos.reduce((s, k) => s + CONFIG.pesos[k], 0);
    let r = Math.random() * total;
    for(let k of simbolos){ r -= CONFIG.pesos[k]; if(r <= 0) return k; }
    return simbolos[0];
}

function criarSimbolo(key){
    return `<div class="symbol"><img src="${IMAGENS[key]}" alt="${key}"></div>`;
}

function preencherRolo(el){ el.innerHTML = Array(18).fill(0).map(()=>criarSimbolo(escolherSimbolo())).join(""); }

function prepararResultado(el, vals){
    const extras = Array(7).fill(0).map(()=>escolherSimbolo());
    el.innerHTML = [...extras, ...vals, ...extras].map(criarSimbolo).join("");
    el.style.transition = "none";
    el.style.transform = `translateY(${-7 * 68}px)`;
}

function encontrarLinhas(res){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return linhas.filter(l => {
        const v = l.map(i => res[i]);
        return v.every(x => x === v[0]);
    });
}

function calcularPremio(res){
    let premio = 0;
    encontrarLinhas(res).forEach(l => {
        premio += aposta * (CONFIG.pagamentos[res[l[0]]] || 0);
    });
    return premio;
}

function initAudio() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
function tocarSom(f, d, t="sine", v=0.15){
    if(!audioContext) return;
    try{
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.001, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(v, audioContext.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + d);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d);
    }catch(e){}
}

async function girar(){
    if(girando) return;
    girando = true;
    spinButton.disabled = true;

    initAudio();
    if(bgMusic.paused) bgMusic.play().catch(()=>{});

    // DESCONTO IMEDIATO
    if(obterSaldo() < aposta){ statusEl.textContent = "Saldo insuficiente."; girando=false; spinButton.disabled=false; return; }
    if(!debitar(aposta)){ statusEl.textContent = "Erro ao apostar."; girando=false; spinButton.disabled=false; return; }

    statusEl.textContent = "Girando...";
    reelBoxes.forEach(r => r.classList.add("spinning"));
    tocarSom(115, 0.18, "sawtooth", 0.15);

    const res = Array(9).fill(0).map(escolherSimbolo);
    const cols = [[res[0],res[3],res[6]], [res[1],res[4],res[7]], [res[2],res[5],res[8]]];
    
    reels.forEach(preencherRolo);
    
    await Promise.all(reels.map((el, i) => new Promise(resolve => {
        el.style.transition = `transform ${CONFIG.tempos[i]}ms cubic-bezier(.1,.8,.1,1)`;
        el.style.transform = `translateY(-${(11+Math.random()*5)*68}px)`;
        setTimeout(() => { prepararResultado(el, cols[i]); tocarSom(230+i*80, 0.12, "triangle", 0.15); resolve(); }, CONFIG.tempos[i]);
    })));

    reelBoxes.forEach(r => r.classList.remove("spinning"));
    
    const premio = calcularPremio(res);
    if(premio > 0){
        winDisplay.textContent = Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
        statusEl.textContent = `Vitória! ${Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" })}`;
        creditar(premio);
        tocarSom(600, 0.3, "sine", 0.15);
        reelBoxes.forEach(r => r.classList.add("win"));
    } else {
        winDisplay.textContent = "R$ 0,00";
        statusEl.textContent = "Quase!";
        reelBoxes.forEach(r => r.classList.remove("win"));
    }

    atualizarSaldoVisual();
    girando = false;
    spinButton.disabled = false;
}

document.querySelectorAll(".bet").forEach(b => b.onclick = () => {
    if(girando) return;
    aposta = Number(b.dataset.bet);
    document.querySelectorAll(".bet").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    betDisplay.textContent = Number(aposta).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
});

spinButton.onclick = girar;
atualizarSaldoVisual();
reels.forEach(preencherRolo);
</script>
</body>
</html>
