Fortune Snake — versão ampliada com efeitos

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortune Snake - ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #09030f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* =====================================================
   FUNDO
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: -20%;
    pointer-events: none;
    z-index: -3;

    background:
        radial-gradient(circle at 15% 25%, rgba(255,0,204,.35), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(0,150,255,.28), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(255,190,0,.25), transparent 28%),
        radial-gradient(circle at 20% 85%, rgba(130,0,255,.35), transparent 28%);

    filter: blur(20px);
    animation: fundo 10s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 2px);

    background-size: 55px 55px;
    opacity: .28;

    animation: estrelas 12s linear infinite;
}

@keyframes fundo {
    0% {
        transform: translate(-3%, -2%) scale(1);
    }

    50% {
        transform: translate(4%, 3%) scale(1.08);
    }

    100% {
        transform: translate(-2%, 4%) scale(1.04);
    }
}

@keyframes estrelas {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-100px);
    }
}

/* =====================================================
   EFEITO DE RAIO
===================================================== */

.raio {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.35),
            rgba(120,180,255,.15),
            transparent 65%
        );
}

.raio.ativo {
    animation: clarãoRaio 1.15s ease-out;
}

@keyframes clarãoRaio {
    0% {
        opacity: 0;
    }

    18% {
        opacity: .9;
    }

    30% {
        opacity: .15;
    }

    48% {
        opacity: .65;
    }

    100% {
        opacity: 0;
    }
}

/* =====================================================
   BRILHO
===================================================== */

.background-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.18),
            rgba(155,0,255,.12),
            transparent 70%
        );

    filter: blur(15px);
    animation: glow 5s ease-in-out infinite alternate;

    pointer-events: none;
    z-index: -1;
}

@keyframes glow {
    from {
        transform: scale(.9);
        opacity: .55;
    }

    to {
        transform: scale(1.15);
        opacity: .9;
    }
}

/* =====================================================
   JOGO — MAIOR
===================================================== */

.game-container {
    width: 440px;
    max-width: 96vw;

    padding: 25px;

    text-align: center;

    border: 2px solid #ffd700;
    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.97),
            rgba(22,9,34,.98)
        );

    box-shadow:
        0 0 25px rgba(255,215,0,.28),
        0 0 70px rgba(145,0,255,.22);

    backdrop-filter: blur(8px);

    position: relative;

    transition: transform .12s ease;
}

.game-container.tremendo {
    animation: tremor .22s linear 3;
}

@keyframes tremor {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-3px,2px); }
    40%  { transform: translate(3px,-2px); }
    60%  { transform: translate(-2px,-3px); }
    80%  { transform: translate(3px,2px); }
    100% { transform: translate(0,0); }
}

/* =====================================================
   TÍTULO
===================================================== */

h2 {
    margin: 0 0 5px;
    color: #ffd700;

    text-shadow:
        0 0 8px #ffd700,
        0 0 20px #ff00cc;
}

.subtitle {
    color: #c5b7d6;
    font-size: 14px;
}

/* =====================================================
   MENSAGEM
===================================================== */

.message-area {
    min-height: 32px;
    margin: 14px 0;

    font-weight: bold;
    font-size: 15px;

    color: #00ed91;

    text-shadow:
        0 0 8px rgba(0,237,145,.35);
}

/* =====================================================
   MÁQUINA
===================================================== */

.slot-machine {
    display: flex;
    gap: 9px;

    padding: 15px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #050207
        );

    border: 2px solid #4a2c7a;
    border-radius: 17px;

    overflow: hidden;

    box-shadow:
        inset 0 0 30px #000,
        0 0 20px rgba(115,0,255,.18);
}

.reel {
    flex: 1;

    height: 115px;

    overflow: hidden;

    position: relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border: 2px solid #51306d;
    border-radius: 12px;

    box-shadow:
        inset 0 0 18px #000;

    transition: box-shadow .25s ease;
}

.reel-strip {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
}

.symbol {
    height: 115px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 56px;

    text-shadow:
        0 0 12px rgba(255,255,255,.2);
}

.reel.stopping {
    box-shadow:
        0 0 25px rgba(255,215,0,.65),
        inset 0 0 18px #000;
}

.win {
    animation: pulse .5s infinite;
    text-shadow:
        0 0 15px #ffd700;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

/* =====================================================
   RESULTADO
===================================================== */

.result {
    margin-top: 15px;

    min-height: 35px;

    font-weight: bold;
    font-size: 20px;
}

/* =====================================================
   CONTROLES
===================================================== */

.controls {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-top: 20px;
}

.bet {
    background: #0b0610;

    border: 1px solid #4a2c7a;
    border-radius: 22px;

    padding: 12px 15px;

    color: #ffd700;
    font-weight: bold;

    white-space: nowrap;
}

button {
    border: 0;

    color: white;

    font-weight: bold;
    font-size: 18px;

    padding: 14px 28px;

    border-radius: 28px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 20px rgba(255,0,204,.35);

    cursor: pointer;

    transition:
        transform .15s,
        box-shadow .2s;
}

button:active {
    transform: scale(.94);
}

button:hover {
    box-shadow:
        0 0 28px rgba(255,0,204,.65);
}

button:disabled {
    opacity: .5;
    filter: grayscale(1);
    cursor: not-allowed;
}

/* =====================================================
   BOTÃO DE SOM
===================================================== */

.sound-button {
    position: absolute;

    top: 15px;
    right: 15px;

    width: 42px;
    height: 42px;

    padding: 0;

    border-radius: 50%;

    font-size: 20px;

    background:
        linear-gradient(
            145deg,
            #29153c,
            #12081d
        );

    border: 1px solid #7046a1;

    box-shadow:
        0 0 10px rgba(140,0,255,.3);
}

/* =====================================================
   CELULAR
===================================================== */

@media(max-width:480px) {

    .game-container {
        width: 96vw;
        padding: 20px;
    }

    .reel {
        height: 105px;
    }

    .symbol {
        height: 105px;
        font-size: 50px;
    }

    .slot-machine {
        padding: 12px;
        gap: 7px;
    }
}

@media(max-width:380px) {

    .game-container {
        padding: 17px;
    }

    .reel {
        height: 90px;
    }

    .symbol {
        height: 90px;
        font-size: 43px;
    }

    .controls {
        gap: 7px;
    }

    .bet {
        padding: 10px;
        font-size: 13px;
    }

    button {
        padding: 12px 20px;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>
<div class="raio" id="raio"></div>

<div class="game-container" id="gameContainer">

    <button
        class="sound-button"
        id="soundButton"
        type="button"
        onclick="alternarSom()"
    >🔊</button>

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin" type="button">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
   SISTEMA DE SOM
===================================================== */

let audioCtx = null;
let somLigado = true;
let somGiroInterval = null;

function iniciarAudio() {

    if (!audioCtx) {

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function tocarTom(
    frequencia,
    duracao,
    tipo = "sine",
    volume = 0.04
) {

    if (!somLigado) return;

    iniciarAudio();

    const oscilador =
        audioCtx.createOscillator();

    const ganho =
        audioCtx.createGain();

    oscilador.type = tipo;

    oscilador.frequency.setValueAtTime(
        frequencia,
        audioCtx.currentTime
    );

    ganho.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duracao
    );

    oscilador.connect(ganho);
    ganho.connect(audioCtx.destination);

    oscilador.start();

    oscilador.stop(
        audioCtx.currentTime + duracao
    );
}

/* =====================================================
   SOM DE GIRO — TIPO ROLETA
===================================================== */

function iniciarSomRoleta() {

    if (!somLigado) return;

    pararSomRoleta();

    let passo = 0;

    somGiroInterval = setInterval(() => {

        const frequencias = [
            220,
            250,
            280,
            310,
            340
        ];

        tocarTom(
            frequencias[passo % frequencias.length],
            0.055,
            "square",
            0.025
        );

        passo++;

    }, 115);
}

function pararSomRoleta() {

    if (somGiroInterval) {

        clearInterval(somGiroInterval);

        somGiroInterval = null;
    }
}

/* =====================================================
   SOM DE VITÓRIA
===================================================== */

function somVitoria() {

    if (!somLigado) return;

    tocarTom(523, .15, "sine", .07);

    setTimeout(() => {
        tocarTom(659, .15, "sine", .07);
    }, 130);

    setTimeout(() => {
        tocarTom(784, .20, "sine", .08);
    }, 260);

    setTimeout(() => {
        tocarTom(1046, .30, "sine", .06);
    }, 420);
}

/* =====================================================
   SOM DE DERROTA
===================================================== */

function somDerrota() {

    if (!somLigado) return;

    tocarTom(
        190,
        .18,
        "sawtooth",
        .045
    );

    setTimeout(() => {

        tocarTom(
            140,
            .25,
            "sawtooth",
            .04
        );

    }, 180);
}

/* =====================================================
   SOM DE TROVÃO
===================================================== */

function somTrovao() {

    if (!somLigado) return;

    iniciarAudio();

    const duracao = 1.0;

    const ruido =
        audioCtx.createBufferSource();

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * duracao,
            audioCtx.sampleRate
        );

    const dados =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < dados.length;
        i++
    ) {

        const envelope =
            Math.pow(
                1 - i / dados.length,
                2
            );

        dados[i] =
            (Math.random() * 2 - 1)
            * envelope;
    }

    ruido.buffer = buffer;

    const ganho =
        audioCtx.createGain();

    ganho.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    ganho.gain.linearRampToValueAtTime(
        .12,
        audioCtx.currentTime + .08
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duracao
    );

    ruido.connect(ganho);
    ganho.connect(audioCtx.destination);

    ruido.start();
}

/* =====================================================
   LIGA / DESLIGA SOM
===================================================== */

function alternarSom() {

    somLigado = !somLigado;

    const botao =
        document.getElementById("soundButton");

    if (somLigado) {

        botao.textContent = "🔊";

        iniciarAudio();

    } else {

        botao.textContent = "🔇";

        pararSomRoleta();
    }
}

/* =====================================================
   EFEITOS DE GIRO
===================================================== */

function efeitosGiro() {

    const raio =
        document.getElementById("raio");

    const container =
        document.getElementById("gameContainer");

    raio.classList.remove("ativo");

    void raio.offsetWidth;

    raio.classList.add("ativo");

    container.classList.remove("tremendo");

    void container.offsetWidth;

    container.classList.add("tremendo");

    if (
        navigator.vibrate
    ) {

        navigator.vibrate([
            80,
            60,
            100,
            70,
            120
        ]);
    }

    /* trovão mais lento */

    setTimeout(() => {

        somTrovao();

    }, 380);
}

/* =====================================================
   CONFIGURAÇÃO DO JOGO
===================================================== */

const APOSTA = 1.00;

const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS = {

    "🍒": 1.20,
    "🍋": 1.50,
    "💰": 2.00,
    "💎": 3.00,
    "🏆": 4.00,
    "🐍": 7.00

};

const msg =
    document.getElementById("msgArea");

const result =
    document.getElementById("result");

const button =
    document.getElementById("btnSpin");

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips = [
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(
    texto,
    cor = "#00ed91"
) {

    msg.textContent = texto;
    msg.style.color = cor;
}

/* =====================================================
   CRIAR ROLOS
===================================================== */

function criarRolo(strip) {

    strip.innerHTML = "";

    for (
        let volta = 0;
        volta < 10;
        volta++
    ) {

        for (
            const simbolo of SIMBOLOS
        ) {

            const div =
                document.createElement("div");

            div.className = "symbol";

            div.textContent = simbolo;

            strip.appendChild(div);
        }
    }
}

strips.forEach(criarRolo);

/* =====================================================
   SÍMBOLO ALEATÓRIO
===================================================== */

function simboloAleatorio() {

    return SIMBOLOS[
        Math.floor(
            Math.random() *
            SIMBOLOS.length
        )
    ];
}

/* =====================================================
   PREPARAR ROLO
===================================================== */

function prepararRolo(strip) {

    strip.style.transition = "none";

    strip.style.transform =
        "translateY(0px)";

    strip.offsetHeight;
}

/* =====================================================
   GIRAR ROLO
===================================================== */

function girarRolo(
    index,
    resultado,
    duracao
) {

    return new Promise(resolve => {

        const strip =
            strips[index];

        const reel =
            reels[index];

        const altura = 115;

        const simbolosPorVolta =
            SIMBOLOS.length;

        const simboloFinal =
            resultado[index];

        const posFinal =
            SIMBOLOS.indexOf(
                simboloFinal
            );

        /*
         * Mais voltas para dar
         * sensação de caça-níquel.
         */

        const voltas =
            7 +
            Math.floor(
                Math.random() * 3
            );

        const deslocamento =
            -(
                (
                    voltas *
                    simbolosPorVolta
                ) +
                posFinal
            ) * altura;

        prepararRolo(strip);

        reel.classList.remove(
            "stopping"
        );

        setTimeout(() => {

            strip.style.transition =
                `transform ${duracao}ms cubic-bezier(.10,.72,.16,1)`;

            strip.style.transform =
                `translateY(${deslocamento}px)`;

            setTimeout(() => {

                reel.classList.add(
                    "stopping"
                );

                resolve();

            }, duracao);

        }, index * 140);

    });
}

/* =====================================================
   EXECUTAR GIRO
===================================================== */

async function executarGiro(
    resultado
) {

    await Promise.all([

        girarRolo(
            0,
            resultado,
            2400
        ),

        girarRolo(
            1,
            resultado,
            2800
        ),

        girarRolo(
            2,
            resultado,
            3200
        )

    ]);
}

/* =====================================================
   CALCULAR PRÊMIO
===================================================== */

function calcularPremio(
    resultado
) {

    if (
        resultado[0] === resultado[1] &&
        resultado[1] === resultado[2]
    ) {

        return PAGAMENTOS[
            resultado[0]
        ] || 0;
    }

    return 0;
}

/* =====================================================
   BOTÃO GIRAR
===================================================== */

button.addEventListener(
    "click",
    async function() {

        if (!window.SistemaSaldo) {

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled = true;

        try {

            iniciarAudio();

            const saldo =
                await window.SistemaSaldo.get();

            if (
                typeof saldo !== "number" ||
                saldo < APOSTA
            ) {

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled = false;

                return;
            }

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            /* efeitos visuais */

            efeitosGiro();

            /* som de roleta */

            iniciarSomRoleta();

            mensagem(
                "🎰 Os rolos estão girando..."
            );

            result.textContent = "";

            const resultado = [

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            await executarGiro(
                resultado
            );

            /* parar som */

            pararSomRoleta();

            result.textContent =
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if (premio > 0) {

                reels.forEach(
                    reel => {

                        reel.classList.add(
                            "win"
                        );

                    }
                );

                somVitoria();

                if (
                    navigator.vibrate
                ) {

                    navigator.vibrate([
                        100,
                        70,
                        150,
                        70,
                        220
                    ]);
                }

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio / APOSTA
                );

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent =
                    `${resultado.join("   ")} 💰`;

            } else {

                somDerrota();

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if (
                window.SistemaSaldo.atualizarTela
            ) {

                await window.SistemaSaldo
                    .atualizarTela();
            }

        } catch (erro) {

            console.error(erro);

            pararSomRoleta();

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        } finally {

            setTimeout(() => {

                reels.forEach(
                    reel => {

                        reel.classList.remove(
                            "stopping",
                            "win"
                        );

                    }
                );

                button.disabled = false;

            }, 600);
        }
    }
);

</script>

</body>
</html>
