<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Snake - ApostaXBet</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#08000f;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* FUNDO */
body::before{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:-10;
    background:
        radial-gradient(circle at 20% 25%,rgba(255,0,204,.38),transparent 25%),
        radial-gradient(circle at 80% 20%,rgba(0,150,255,.32),transparent 25%),
        radial-gradient(circle at 75% 80%,rgba(255,190,0,.30),transparent 25%),
        radial-gradient(circle at 20% 80%,rgba(130,0,255,.40),transparent 25%);
    filter:blur(25px);
    animation:luzes 10s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-9;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 2px);
    background-size:45px 45px;
    opacity:.35;
    animation:estrelas 12s linear infinite;
}

@keyframes luzes{
    0%{transform:translate(-3%,-2%) scale(1)}
    50%{transform:translate(3%,3%) scale(1.08)}
    100%{transform:translate(-2%,5%) scale(1.04)}
}

@keyframes estrelas{
    from{transform:translateY(0)}
    to{transform:translateY(-90px)}
}

/* NOME GRANDE AO FUNDO */
.background-title{
    position:fixed;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:clamp(42px,13vw,95px);
    font-weight:900;
    letter-spacing:4px;
    color:rgba(255,215,0,.10);
    text-shadow:
        0 0 12px rgba(255,215,0,.18),
        0 0 35px rgba(255,0,204,.12);
    pointer-events:none;
    user-select:none;
    z-index:-5;
    white-space:nowrap;
}

/* BRILHO */
.background-glow{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,215,0,.16),
        rgba(155,0,255,.10),
        transparent 70%
    );
    filter:blur(15px);
    animation:glow 5s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:-6;
}

@keyframes glow{
    from{transform:scale(.9);opacity:.55}
    to{transform:scale(1.15);opacity:.9}
}

/* JOGO */
.game-container{
    width:440px;
    max-width:96vw;
    padding:22px;
    text-align:center;
    background:linear-gradient(
        180deg,
        rgba(50,25,87,.96),
        rgba(22,9,34,.97)
    );
    border-radius:20px;
    box-shadow:
        0 0 35px rgba(145,0,255,.20),
        0 15px 50px rgba(0,0,0,.5);
    backdrop-filter:blur(8px);
    position:relative;
}

/* TÍTULO */
h2{
    margin:0 0 5px;
    color:#ffd700;
    font-size:30px;
    text-shadow:
        0 0 8px #ffd700,
        0 0 18px #ff00cc;
}

.subtitle{
    color:#c5b7d6;
    font-size:13px;
}

/* MENSAGEM */
.message-area{
    min-height:30px;
    margin:12px 0;
    font-weight:bold;
    color:#00ed91;
    text-shadow:0 0 8px rgba(0,237,145,.35);
}

/* MÁQUINA */
.slot-machine{
    display:flex;
    gap:7px;
    padding:12px;
    background:linear-gradient(145deg,#100719,#050207);
    border-radius:15px;
    overflow:hidden;
    box-shadow:
        inset 0 0 25px #000,
        0 0 15px rgba(115,0,255,.15);
}

.reel{
    flex:1;
    height:105px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(
        180deg,
        #29153c,
        #13091d
    );
    border:2px solid #51306d;
    border-radius:10px;
    box-shadow:inset 0 0 15px #000;
}

.reel-strip{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    will-change:transform;
}

.symbol{
    height:105px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
}

.reel.stopping{
    box-shadow:
        0 0 20px rgba(255,215,0,.6),
        inset 0 0 15px #000;
}

.win{
    animation:pulse .5s infinite;
    text-shadow:0 0 15px #ffd700;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

/* RESULTADO */
.result{
    margin-top:12px;
    min-height:32px;
    font-weight:bold;
    font-size:18px;
}

/* CONTROLES */
.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.bet{
    background:#0b0610;
    border:1px solid #4a2c7a;
    border-radius:20px;
    padding:10px 13px;
    color:#ffd700;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    font-size:17px;
    padding:13px 25px;
    border-radius:25px;
    background:linear-gradient(45deg,#ff00cc,#3333ff);
    box-shadow:0 5px 18px rgba(255,0,204,.35);
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:hover{
    box-shadow:0 0 25px rgba(255,0,204,.65);
}

button:disabled{
    opacity:.5;
    filter:grayscale(1);
}

@media(max-width:420px){
    .game-container{
        width:96vw;
        padding:16px;
    }

    .reel{
        height:92px;
    }

    .symbol{
        height:92px;
        font-size:43px;
    }

    .background-title{
        top:7%;
        font-size:15vw;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="background-title">
    FORTUNE SNAKE
</div>

<div class="game-container">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin" type="button">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>
/* =====================================================
   SOM DE MOEDA / CAÇA-NÍQUEL
===================================================== */

let audioCtx = null;

function iniciarAudio(){

    if(!audioCtx){

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

/* Som curto de moeda */
function somMoeda(){

    iniciarAudio();

    const agora = audioCtx.currentTime;

    const notas = [880,1175,1568];

    notas.forEach((freq,index)=>{

        const osc =
            audioCtx.createOscillator();

        const ganho =
            audioCtx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            freq,
            agora + index * 0.045
        );

        ganho.gain.setValueAtTime(
            0.0001,
            agora + index * 0.045
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.055,
            agora + index * 0.045 + 0.008
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.0001,
            agora + index * 0.045 + 0.12
        );

        osc.connect(ganho);
        ganho.connect(audioCtx.destination);

        osc.start(
            agora + index * 0.045
        );

        osc.stop(
            agora + index * 0.045 + 0.13
        );

    });
}

/* Som suave das máquinas enquanto giram */
function somRolos(){

    iniciarAudio();

    const agora = audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const ganho =
        audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        95,
        agora
    );

    osc.frequency.exponentialRampToValueAtTime(
        55,
        agora + 0.18
    );

    ganho.gain.setValueAtTime(
        0.0001,
        agora
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.025,
        agora + 0.015
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.0001,
        agora + 0.20
    );

    osc.connect(ganho);
    ganho.connect(audioCtx.destination);

    osc.start(agora);
    osc.stop(agora + 0.21);
}

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const APOSTA = 1.00;

const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS = {
    "🍒":1.20,
    "🍋":1.50,
    "💰":2.00,
    "💎":3.00,
    "🏆":4.00,
    "🐍":7.00
};

const msg =
    document.getElementById("msgArea");

const result =
    document.getElementById("result");

const button =
    document.getElementById("btnSpin");

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips = [
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(
    texto,
    cor="#00ed91"
){

    msg.textContent = texto;
    msg.style.color = cor;

}

function criarRolo(strip){

    strip.innerHTML = "";

    /*
       Mais símbolos no rolo evita que
       os ícones desapareçam durante o giro.
    */

    for(let volta=0;volta<12;volta++){

        for(const simbolo of SIMBOLOS){

            const div =
                document.createElement("div");

            div.className="symbol";
            div.textContent=simbolo;

            strip.appendChild(div);

        }

    }

}

strips.forEach(criarRolo);

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random()*SIMBOLOS.length
        )
    ];

}

function prepararRolo(strip){

    strip.style.transition="none";

    strip.style.transform=
        "translate3d(0,0,0)";

}

/* =====================================================
   GIRO — SEM DELAY
===================================================== */

function girarRolo(
    index,
    resultado,
    duracao
){

    return new Promise(resolve=>{

        const strip =
            strips[index];

        const reel =
            reels[index];

        const altura=105;

        const total =
            SIMBOLOS.length;

        const posFinal =
            SIMBOLOS.indexOf(
                resultado[index]
            );

        const voltas =
            7 + Math.floor(
                Math.random()*2
            );

        const deslocamento =
            -(
                (
                    voltas*total
                )+
                posFinal
            )*altura;

        prepararRolo(strip);

        reel.classList.remove(
            "stopping"
        );

        /*
           Começa imediatamente.
           Não existe setTimeout antes do giro.
        */

        strip.style.transition=
            `transform ${duracao}ms cubic-bezier(.10,.72,.16,1)`;

        strip.style.transform=
            `translate3d(0,${deslocamento}px,0)`;

        setTimeout(()=>{

            reel.classList.add(
                "stopping"
            );

            resolve();

        },duracao);

    });

}

/* =====================================================
   EXECUTAR GIRO
===================================================== */

async function executarGiro(resultado){

    /*
       Os três rolos começam juntos,
       deixando a resposta do botão imediata.
    */

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1450
        ),

        girarRolo(
            1,
            resultado,
            1750
        ),

        girarRolo(
            2,
            resultado,
            2050
        )

    ]);

}

function calcularPremio(resultado){

    if(
        resultado[0]===resultado[1] &&
        resultado[1]===resultado[2]
    ){

        return PAGAMENTOS[
            resultado[0]
        ]||0;

    }

    return 0;

}

/* =====================================================
   BOTÃO GIRAR
===================================================== */

button.addEventListener(
    "click",
    async function(){

        if(!window.SistemaSaldo){

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;

        }

        /*
           Som executado PRIMEIRO no toque.
           Assim não espera o saldo nem a animação.
        */

        somMoeda();

        if(button.disabled){
            return;
        }

        button.disabled=true;

        try{

            const saldo =
                await window.SistemaSaldo.get();

            if(
                typeof saldo!=="number" ||
                saldo<APOSTA
            ){

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled=false;

                return;

            }

            /*
               Débito.
            */

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            mensagem(
                "🎰 Girando..."
            );

            result.textContent="";

            /*
               Resultado definido antes da animação.
            */

            const resultado=[

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            /*
               Som curto dos rolos.
            */

            somRolos();

            /*
               Giro começa imediatamente.
            */

            await executarGiro(
                resultado
            );

            result.textContent=
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if(premio>0){

                reels.forEach(reel=>{

                    reel.classList.add(
                        "win"
                    );

                });

                /*
                   Som de moeda novamente
                   quando ganha.
                */

                somMoeda();

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio/APOSTA
                );

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent=
                    `${resultado.join("   ")} 💰`;

            }else{

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );

            }

            if(
                window.SistemaSaldo.atualizarTela
            ){

                await window.SistemaSaldo
                    .atualizarTela();

            }

        }catch(erro){

            console.error(erro);

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        }finally{

            setTimeout(()=>{

                reels.forEach(reel=>{

                    reel.classList.remove(
                        "stopping",
                        "win"
                    );

                });

                button.disabled=false;

            },300);

        }

    }
);

</script>

</body>
</html>
