<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Snake - ApostaXBet</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#08000f;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:-10;
    background:
        radial-gradient(circle at 15% 25%,rgba(255,0,204,.35),transparent 24%),
        radial-gradient(circle at 85% 20%,rgba(0,140,255,.30),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(255,190,0,.25),transparent 25%),
        radial-gradient(circle at 20% 85%,rgba(120,0,255,.35),transparent 28%);
    filter:blur(30px);
    animation:luzesFundo 10s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-9;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 2px);
    background-size:55px 55px;
    opacity:.30;
    animation:estrelas 14s linear infinite;
}

@keyframes luzesFundo{
    0%{transform:translate(-3%,-2%) scale(1)}
    50%{transform:translate(4%,3%) scale(1.08)}
    100%{transform:translate(-2%,5%) scale(1.04)}
}

@keyframes estrelas{
    from{transform:translateY(0)}
    to{transform:translateY(-120px)}
}

.background-glow{
    position:fixed;
    width:520px;
    height:520px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(255,215,0,.16),
        rgba(160,0,255,.14),
        transparent 70%);
    filter:blur(20px);
    pointer-events:none;
    z-index:-8;
    animation:brilho 6s ease-in-out infinite alternate;
}

@keyframes brilho{
    from{transform:scale(.90);opacity:.45}
    to{transform:scale(1.15);opacity:.85}
}

.lightning{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0;
    background:
        radial-gradient(ellipse at center,
        rgba(120,220,255,.28),
        transparent 55%);
    transition:opacity .18s ease;
}

.lightning.flash{
    opacity:1;
}

.game-container{
    width:420px;
    max-width:94vw;
    padding:22px;
    text-align:center;
    border:none;
    border-radius:20px;
    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.97),
            rgba(22,9,34,.98)
        );
    box-shadow:
        0 0 30px rgba(145,0,255,.22),
        0 0 80px rgba(255,0,204,.10);
    backdrop-filter:blur(8px);
    position:relative;
}

.game-container::before{
    display:none !important;
}

h2{
    margin:0 0 5px;
    color:#ffd700;
    text-shadow:
        0 0 8px #ffd700,
        0 0 18px #ff00cc;
}

.subtitle{
    color:#c5b7d6;
    font-size:13px;
}

.message-area{
    min-height:30px;
    margin:12px 0;
    font-weight:bold;
    color:#00ed91;
    text-shadow:0 0 8px rgba(0,237,145,.35);
}

.slot-machine{
    display:flex;
    gap:8px;
    padding:12px;
    background:
        linear-gradient(145deg,#100719,#050207);
    border:2px solid #4a2c7a;
    border-radius:15px;
    overflow:hidden;
    box-shadow:
        inset 0 0 25px #000,
        0 0 20px rgba(115,0,255,.20);
}

.reel{
    flex:1;
    height:100px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(180deg,#29153c,#13091d);
    border:2px solid #51306d;
    border-radius:10px;
    box-shadow:inset 0 0 15px #000;
}

.reel-strip{
    position:absolute;
    width:100%;
    top:0;
    left:0;
}

.symbol{
    height:100px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
}

.reel.stopping{
    box-shadow:
        0 0 20px rgba(255,215,0,.45),
        inset 0 0 15px #000;
}

.win{
    animation:pulse .5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

.slot-machine.girando{
    animation:maquinaVibrando .12s infinite;
}

@keyframes maquinaVibrando{
    0%{transform:translateX(0)}
    25%{transform:translateX(-1px)}
    50%{transform:translateX(1px)}
    75%{transform:translateX(-1px)}
    100%{transform:translateX(0)}
}

.result{
    margin-top:12px;
    min-height:32px;
    font-weight:bold;
    font-size:18px;
}

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.bet{
    background:#0b0610;
    border:1px solid #4a2c7a;
    border-radius:20px;
    padding:10px 13px;
    color:#ffd700;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    font-size:17px;
    padding:13px 25px;
    border-radius:25px;
    background:
        linear-gradient(45deg,#ff00cc,#3333ff);
    box-shadow:0 5px 18px rgba(255,0,204,.35);
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:hover{
    box-shadow:0 0 25px rgba(255,0,204,.65);
}

button:disabled{
    opacity:.5;
    filter:grayscale(1);
}

body.girando::before{
    animation:luzesGiro 2.8s ease-in-out infinite alternate;
}

@keyframes luzesGiro{
    0%{transform:translate(-4%,-2%) scale(1)}
    50%{transform:translate(4%,2%) scale(1.12)}
    100%{transform:translate(-2%,4%) scale(1.05)}
}

@media(max-width:380px){
    .game-container{
        width:94vw;
        padding:17px;
    }

    .reel{
        height:88px;
    }

    .symbol{
        height:88px;
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>
<div class="lightning" id="lightning"></div>

<div class="game-container">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine" id="slotMachine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>
let audioCtx=null;
let somAtivo=true;

function iniciarAudio(){
    if(!audioCtx){
        audioCtx=new(
            window.AudioContext||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function tocarNota(
    frequencia,
    duracao,
    tipo="sine",
    volume=.04
){
    if(!somAtivo)return;

    iniciarAudio();

    const osc=audioCtx.createOscillator();
    const ganho=audioCtx.createGain();

    osc.type=tipo;

    osc.frequency.setValueAtTime(
        frequencia,
        audioCtx.currentTime
    );

    ganho.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duracao
    );

    osc.connect(ganho);
    ganho.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+duracao
    );
}

function cliqueRolo(){
    if(!somAtivo)return;

    tocarNota(
        115+Math.random()*35,
        .055,
        "square",
        .035
    );
}

function somCacaNiquel(){

    if(!somAtivo)return;

    iniciarAudio();

    let inicio=Date.now();
    let ultimo=0;

    function tocar(){

        const agora=Date.now();
        const decorrido=agora-inicio;

        if(decorrido>2700)return;

        cliqueRolo();

        let intervalo;

        if(decorrido<1800){
            intervalo=75;
        }else{
            intervalo=120;
        }

        setTimeout(
            tocar,
            intervalo
        );
    }

    tocar();
}

function somParada(){

    if(!somAtivo)return;

    [330,440,550].forEach(
        (nota,index)=>{
            setTimeout(()=>{
                tocarNota(
                    nota,
                    .09,
                    "square",
                    .045
                );
            },index*80);
        }
    );
}

function somVitoria(){

    if(!somAtivo)return;

    [523,659,784,1046].forEach(
        (nota,index)=>{
            setTimeout(()=>{
                tocarNota(
                    nota,
                    .18,
                    "sine",
                    .06
                );
            },index*120);
        }
    );
}

const lightning=
    document.getElementById("lightning");

function raio(){

    if(!lightning)return;

    lightning.classList.add("flash");

    setTimeout(()=>{
        lightning.classList.remove("flash");
    },180);
}

function iniciarTrovoes(){

    let ativo=true;

    function ciclo(){

        if(!ativo)return;

        raio();

        if(navigator.vibrate){
            try{
                navigator.vibrate([
                    60,
                    100,
                    35
                ]);
            }catch(e){}
        }

        setTimeout(
            ciclo,
            1100+Math.random()*900
        );
    }

    ciclo();

    setTimeout(()=>{
        ativo=false;
    },3300);
}

const APOSTA=1.00;

const SIMBOLOS=[
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS={
    "🍒":1.20,
    "🍋":1.50,
    "💰":2.00,
    "💎":3.00,
    "🏆":4.00,
    "🐍":7.00
};

const msg=
    document.getElementById("msgArea");

const result=
    document.getElementById("result");

const button=
    document.getElementById("btnSpin");

const slotMachine=
    document.getElementById("slotMachine");

const reels=[
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips=[
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(
    texto,
    cor="#00ed91"
){
    msg.textContent=texto;
    msg.style.color=cor;
}

function criarRolo(strip){

    strip.innerHTML="";

    for(let volta=0;volta<8;volta++){

        for(const simbolo of SIMBOLOS){

            const div=
                document.createElement("div");

            div.className="symbol";
            div.textContent=simbolo;

            strip.appendChild(div);
        }
    }
}

strips.forEach(criarRolo);

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random()*SIMBOLOS.length
        )
    ];
}

function prepararRolo(strip){

    strip.style.transition="none";

    strip.style.transform=
        "translateY(0px)";

    strip.offsetHeight;
}

function girarRolo(
    index,
    resultado,
    duracao
){

    return new Promise(resolve=>{

        const strip=strips[index];
        const reel=reels[index];

        const altura=100;

        const posFinal=
            SIMBOLOS.indexOf(
                resultado[index]
            );

        const voltas=
            6+
            Math.floor(
                Math.random()*3
            );

        const deslocamento=
            -(
                (
                    voltas*
                    SIMBOLOS.length
                )+
                posFinal
            )*altura;

        prepararRolo(strip);

        reel.classList.remove(
            "stopping"
        );

        setTimeout(()=>{

            strip.style.transition=
                `transform ${duracao}ms cubic-bezier(.12,.7,.18,1)`;

            strip.style.transform=
                `translateY(${deslocamento}px)`;

            setTimeout(()=>{

                reel.classList.add(
                    "stopping"
                );

                somParada();

                resolve();

            },duracao);

        },index*120);
    });
}

async function executarGiro(resultado){

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1900
        ),

        girarRolo(
            1,
            resultado,
            2250
        ),

        girarRolo(
            2,
            resultado,
            2550
        )

    ]);
}

function calcularPremio(resultado){

    if(
        resultado[0]===resultado[1] &&
        resultado[1]===resultado[2]
    ){
        return PAGAMENTOS[
            resultado[0]
        ]||0;
    }

    return 0;
}

button.addEventListener(
    "click",
    async function(){

        if(!window.SistemaSaldo){

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled=true;

        document.body.classList.add(
            "girando"
        );

        slotMachine.classList.add(
            "girando"
        );

        try{

            iniciarAudio();

            const saldo=
                await window.SistemaSaldo.get();

            if(
                typeof saldo!=="number"||
                saldo<APOSTA
            ){

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                return;
            }

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            mensagem("🎰 GIRANDO...");

            result.textContent="";

            somCacaNiquel();
            iniciarTrovoes();

            if(navigator.vibrate){
                try{
                    navigator.vibrate([
                        80,
                        50,
                        40
                    ]);
                }catch(e){}
            }

            const resultado=[
                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()
            ];

            await executarGiro(
                resultado
            );

            result.textContent=
                resultado.join("   ");

            const premio=
                calcularPremio(
                    resultado
                );

            if(premio>0){

                reels.forEach(
                    reel=>{
                        reel.classList.add(
                            "win"
                        );
                    }
                );

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio/APOSTA
                );

                somVitoria();

                if(navigator.vibrate){
                    try{
                        navigator.vibrate([
                            80,
                            60,
                            120,
                            60,
                            180
                        ]);
                    }catch(e){}
                }

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent=
                    `${resultado.join("   ")} 💰`;

            }else{

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if(
                window.SistemaSaldo.atualizarTela
            ){
                await window.SistemaSaldo
                    .atualizarTela();
            }

        }catch(erro){

            console.error(erro);

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        }finally{

            document.body.classList.remove(
                "girando"
            );

            slotMachine.classList.remove(
                "girando"
            );

            setTimeout(()=>{

                reels.forEach(
                    reel=>{
                        reel.classList.remove(
                            "stopping",
                            "win"
                        );
                    }
                );

                button.disabled=false;

            },600);
        }
    }
);
</script>

</body>
</html>
