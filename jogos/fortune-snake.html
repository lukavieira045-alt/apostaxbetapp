<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fortune Snake - Mini</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background: #050008;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* =====================================================
           FUNDO DA TELA INTEIRA
        ===================================================== */

        body::before,
        body::after {
            content: "";
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: -5;
        }

        body::before {
            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(157, 0, 255, .35),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(255, 215, 0, .25),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 80% 85%,
                    rgba(255, 0, 204, .30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(50, 0, 255, .30),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #05000b,
                    #120020,
                    #05000b
                );

            background-size:
                120% 120%,
                120% 120%,
                120% 120%,
                120% 120%,
                100% 100%;

            animation:
                fundoCompleto 12s ease-in-out infinite alternate;
        }

        /* PARTÍCULAS */

        body::after {
            background-image:
                radial-gradient(
                    circle,
                    rgba(255, 215, 0, .85) 0 1.5px,
                    transparent 2px
                );

            background-size: 65px 65px;

            opacity: .32;

            animation:
                estrelas 20s linear infinite;
        }

        @keyframes fundoCompleto {

            0% {
                background-position:
                    0% 0%,
                    100% 0%,
                    100% 100%,
                    0% 100%,
                    center;
            }

            50% {
                background-position:
                    30% 20%,
                    70% 30%,
                    60% 70%,
                    30% 80%,
                    center;
            }

            100% {
                background-position:
                    60% 40%,
                    40% 60%,
                    20% 40%,
                    80% 60%,
                    center;
            }
        }

        @keyframes estrelas {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-65px);
            }
        }


        /* =====================================================
           BRILHO CENTRAL DA TELA
        ===================================================== */

        .background-glow {
            position: fixed;

            width: 600px;
            height: 600px;

            max-width: 100vw;
            max-height: 100vh;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(180, 0, 255, .16),
                    rgba(255, 215, 0, .08),
                    transparent 70%
                );

            filter: blur(25px);

            pointer-events: none;

            z-index: -4;

            animation:
                brilhoTela 6s ease-in-out infinite alternate;
        }

        @keyframes brilhoTela {

            0% {
                transform: scale(.85);
                opacity: .5;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }


        /* =====================================================
           CONTAINER DO JOGO
        ===================================================== */

        .game-container {

            background:
                linear-gradient(
                    180deg,
                    rgba(45, 27, 78, .97),
                    rgba(26, 11, 46, .98)
                );

            border: 2px solid #ffd700;

            border-radius: 20px;

            padding: 20px;

            width: 350px;
            max-width: 94vw;

            text-align: center;

            box-shadow:
                0 0 20px rgba(255, 215, 0, .30),
                0 0 60px rgba(150, 0, 255, .25);

            position: relative;

            z-index: 1;
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        .titulo {

            color: #ffd700;

            margin: 0;

            text-shadow:
                0 0 8px rgba(255, 215, 0, .6),
                0 0 20px rgba(255, 180, 0, .3);
        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .message-area {

            min-height: 30px;

            margin-top: 10px;

            color: #00ed91;

            font-weight: bold;

            font-size: 14px;

            text-shadow:
                0 0 7px rgba(0, 237, 145, .5);
        }


        /* =====================================================
           GRID
        ===================================================== */

        .slot-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 5px;

            margin: 20px 0;

            background: #0f0518;

            padding: 10px;

            border-radius: 10px;

            border: 1px solid #4a2c7a;

            box-shadow:
                inset 0 0 20px rgba(0,0,0,.6);
        }

        .slot-cell {

            width: 80px;
            height: 80px;

            background: #2a1b3d;

            border-radius: 8px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 40px;

            border: 1px solid #3d2b5a;

            transition:
                background .2s,
                transform .15s,
                box-shadow .2s;
        }

        .slot-cell.spinning {

            transform: scale(1.04);

            box-shadow:
                0 0 12px
                rgba(255, 215, 0, .25);
        }

        .slot-cell.wild {

            background: #ffd700;

            border-color: #ffaa00;

            box-shadow:
                0 0 15px #ffd700;

            animation:
                pulse 1s infinite;
        }

        .slot-cell.win {

            background: #00ed91;

            border-color: #00ffaa;

            box-shadow:
                0 0 18px
                rgba(0, 237, 145, .7);
        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .controls {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-top: 15px;
        }

        .bet-display {

            background: #0f0518;

            padding: 8px 15px;

            border-radius: 20px;

            border: 1px solid #4a2c7a;

            font-weight: bold;

            color: #ffd700;

            white-space: nowrap;
        }

        button.spin-btn {

            background:
                linear-gradient(
                    45deg,
                    #ff00cc,
                    #3333ff
                );

            border: none;

            color: white;

            padding: 12px 25px;

            border-radius: 25px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(255, 0, 204, .4);

            transition:
                transform .1s,
                box-shadow .2s;
        }

        button.spin-btn:active {

            transform: scale(.95);
        }

        button.spin-btn:hover {

            box-shadow:
                0 0 22px
                rgba(255, 0, 204, .7);
        }

        button.spin-btn:disabled {

            opacity: .5;

            cursor: not-allowed;

            filter: grayscale(1);
        }


        /* =====================================================
           ANIMAÇÃO
        ===================================================== */

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =====================================================
           CELULAR PEQUENO
        ===================================================== */

        @media (max-width: 380px) {

            .game-container {
                padding: 15px;
            }

            .slot-cell {

                width: 72px;
                height: 72px;

                font-size: 35px;
            }

            .controls {
                flex-direction: column;
            }

            .bet-display {
                width: 100%;
            }

            button.spin-btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="background-glow"></div>


<div class="game-container">

    <h2 class="titulo">
        🐍 Fortune Snake
    </h2>

    <div
        class="message-area"
        id="msgArea"
    >
        Carregando saldo...
    </div>


    <div
        class="slot-grid"
        id="grid"
    >
        <!-- Células criadas pelo JavaScript -->
    </div>


    <div class="controls">

        <div class="bet-display">
            Aposta: R$ 1,00
        </div>

        <button
            class="spin-btn"
            id="btnSpin"
        >
            GIRAR
        </button>

    </div>

</div>


<!-- =====================================================
     SISTEMA DE SALDO
===================================================== -->

<script
    type="module"
    src="../saldo.js">
</script>


<script>

// =====================================================
// CONFIGURAÇÃO
// =====================================================

const SIMBOLOS = [
    '🏆',
    '💰',
    '💎',
    '🧧'
];

const VALORES = {
    '🏆': 5,
    '💰': 3,
    '💎': 4,
    '🧧': 2
};

const APOSTA_FIXA = 1.00;

const MULTIPLICADOR_BONUS = 10;


// =====================================================
// ELEMENTOS
// =====================================================

const gridEl =
    document.getElementById('grid');

const msgEl =
    document.getElementById('msgArea');

const btnSpin =
    document.getElementById('btnSpin');


// =====================================================
// GRID 3x3
// =====================================================

for (let i = 0; i < 9; i++) {

    const cell =
        document.createElement('div');

    cell.className =
        'slot-cell';

    cell.textContent =
        '❓';

    gridEl.appendChild(cell);
}


// =====================================================
// MENSAGEM
// =====================================================

async function atualizarMsg(
    texto,
    cor = '#00ed91'
) {

    msgEl.style.color = cor;

    msgEl.textContent = texto;
}


// =====================================================
// CARREGA SALDO
// =====================================================

async function carregarSaldo() {

    if (window.SistemaSaldo) {

        try {

            const saldo =
                await window.SistemaSaldo.get();

            await atualizarMsg(
                `Saldo: R$ ${Number(saldo).toFixed(2)}`
            );

        } catch (erro) {

            console.error(erro);

            await atualizarMsg(
                '⚠️ Erro ao carregar saldo!',
                '#ff4d4d'
            );
        }

    } else {

        await atualizarMsg(
            '⚠️ Sistema de saldo não encontrado!',
            '#ff4d4d'
        );
    }
}

carregarSaldo();


// =====================================================
// SÍMBOLO PARA ANIMAÇÃO
// =====================================================

function simboloAleatorio() {

    const simbolosAnimacao = [
        '🏆',
        '💰',
        '💎',
        '🧧',
        '🐍'
    ];

    return simbolosAnimacao[
        Math.floor(
            Math.random() *
            simbolosAnimacao.length
        )
    ];
}


// =====================================================
// GIRO VISUAL
// =====================================================

async function animarGiro(cells) {

    const DURACAO = 3000;

    const INTERVALO_INICIAL = 45;

    const INTERVALO_FINAL = 260;

    const inicio =
        performance.now();


    return new Promise(resolve => {

        function animarAgora(tempoAtual) {

            const decorrido =
                tempoAtual - inicio;

            const progresso =
                Math.min(
                    decorrido / DURACAO,
                    1
                );


            const desaceleracao =
                1 - Math.pow(
                    1 - progresso,
                    3
                );


            const intervalo =
                INTERVALO_INICIAL +
                (
                    INTERVALO_FINAL -
                    INTERVALO_INICIAL
                ) *
                desaceleracao;


            cells.forEach(cell => {

                cell.textContent =
                    simboloAleatorio();

                cell.classList.add(
                    'spinning'
                );

            });


            if (progresso >= 1) {

                cells.forEach(cell => {

                    cell.classList.remove(
                        'spinning'
                    );

                });

                resolve();

                return;
            }


            setTimeout(() => {

                requestAnimationFrame(
                    animarAgora
                );

            }, intervalo);
        }


        requestAnimationFrame(
            animarAgora
        );

    });
}


// =====================================================
// GIRO
// =====================================================

btnSpin.addEventListener(
    'click',
    async () => {

        if (!window.SistemaSaldo) {

            alert(
                'Sistema de saldo não carregado!'
            );

            return;
        }


        try {

            const saldo =
                await window.SistemaSaldo.get();


            if (
                Number(saldo) <
                APOSTA_FIXA
            ) {

                await atualizarMsg(
                    '❌ Saldo insuficiente!',
                    '#ff4d4d'
                );

                return;
            }


            btnSpin.disabled = true;


            await window.SistemaSaldo
                .debitar(
                    APOSTA_FIXA
                );


            await atualizarMsg(
                '🎰 Girando...'
            );


            const cells =
                document.querySelectorAll(
                    '.slot-cell'
                );


            cells.forEach(cell => {

                cell.className =
                    'slot-cell';

            });


            // =================================================
            // ANIMAÇÃO
            // =================================================

            await animarGiro(
                cells
            );


            // =================================================
            // RESULTADO
            // =================================================

            const resultado = [];

            let temWild = false;


            for (
                let i = 0;
                i < 9;
                i++
            ) {

                const isWild =
                    Math.random() < 0.2;


                const simbolo =
                    isWild
                        ? '🐍'
                        : SIMBOLOS[
                            Math.floor(
                                Math.random() *
                                SIMBOLOS.length
                            )
                        ];


                resultado.push(
                    simbolo
                );


                if (isWild) {

                    temWild = true;
                }


                cells[i].textContent =
                    simbolo;


                if (isWild) {

                    cells[i].classList.add(
                        'wild'
                    );
                }

            }


            // =================================================
            // CALCULA GANHO
            // =================================================

            let ganho = 0;


            for (
                let row = 0;
                row < 3;
                row++
            ) {

                const idx =
                    row * 3;


                const s1 =
                    resultado[idx];

                const s2 =
                    resultado[idx + 1];

                const s3 =
                    resultado[idx + 2];


                if (
                    s1 === s2 &&
                    s2 === s3
                ) {

                    const valorBase =
                        VALORES[s1] || 0;


                    ganho +=
                        APOSTA_FIXA *
                        valorBase;


                    cells[idx]
                        .classList.add('win');

                    cells[idx + 1]
                        .classList.add('win');

                    cells[idx + 2]
                        .classList.add('win');

                }

            }


            // =================================================
            // BONUS WILD
            // =================================================

            if (
                temWild &&
                ganho > 0
            ) {

                ganho *=
                    MULTIPLICADOR_BONUS;


                await atualizarMsg(
                    `🔥 WILD ATIVO! x${MULTIPLICADOR_BONUS}`,
                    '#ffd700'
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );
            }


            // =================================================
            // PAGAMENTO
            // =================================================

            if (ganho > 0) {

                await window.SistemaSaldo
                    .ganhar(
                        APOSTA_FIXA,
                        ganho / APOSTA_FIXA
                    );


                await atualizarMsg(
                    `✅ Ganhou R$ ${ganho.toFixed(2)}!`,
                    '#00ed91'
                );

            } else {

                await atualizarMsg(
                    '❌ Não ganhou desta vez. Tente novamente...',
                    '#aaa'
                );
            }


            // =================================================
            // ATUALIZA SALDO
            // =================================================

            if (
                window.SistemaSaldo
                    .atualizarTela
            ) {

                await window.SistemaSaldo
                    .atualizarTela();
            }


        } catch (erro) {

            console.error(
                'Erro no Fortune Snake:',
                erro
            );


            await atualizarMsg(
                '⚠️ Ocorreu um erro no jogo.',
                '#ff4d4d'
            );

        } finally {

            btnSpin.disabled =
                false;
        }

    }
);

</script>

</body>
</html>
