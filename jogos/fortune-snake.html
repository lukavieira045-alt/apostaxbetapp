:root{
    --bg:#020805;
    --panel:#06130d;
    --panel2:#0b2115;

    --gold:#54e58a;
    --gold2:#9dffc2;
    --gold3:#18733d;

    --red:#075c31;
    --red2:#18a957;

    --green:#28d17c;
    --green2:#7affb1;

    --text:#effff4;
    --muted:#8eaa99;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:
        radial-gradient(
            circle at 50% -10%,
            #14552f 0%,
            #092617 38%,
            #020604 85%
        );
    color:white;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    border:0;
    outline:none;
    cursor:pointer;
}

.game{
    width:min(100%,620px);
    min-height:100vh;
    padding:8px 9px 20px;
    position:relative;
    overflow:hidden;
}

.game::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.10;
    background-image:
        radial-gradient(
            #9dffc2 .7px,
            transparent .8px
        );
    background-size:20px 20px;
}

.glow{
    position:fixed;
    width:600px;
    height:600px;
    left:50%;
    top:-330px;
    transform:translateX(-50%);
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            rgba(40,209,124,.30),
            rgba(40,209,124,.07) 40%,
            transparent 72%
        );
    filter:blur(12px);
}

/* =====================================================
   TOPO
===================================================== */

.top{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:10;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.brand-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:26px;
    background:
        linear-gradient(
            145deg,
            #a5ffc5,
            #28d17c 48%,
            #087039
        );
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.8),
        0 5px 20px rgba(0,0,0,.5),
        0 0 22px rgba(40,209,124,.35);
}

.brand-title{
    font-size:15px;
    font-weight:1000;
    letter-spacing:1px;
}

.brand-sub{
    margin-top:3px;
    color:#8eaa99;
    font-size:8px;
    letter-spacing:1.6px;
}

.balance{
    min-width:125px;
    padding:7px 11px;
    border-radius:13px;
    text-align:right;
    background:
        linear-gradient(
            180deg,
            #0d2b1a,
            #04100a
        );
    border:1px solid #246b43;
    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        0 5px 15px rgba(0,0,0,.35);
}

.balance-label{
    display:block;
    color:#789383;
    font-size:8px;
    letter-spacing:1px;
}

.balance-value{
    display:block;
    margin-top:2px;
    color:#9dffc2;
    font-size:16px;
    font-weight:1000;
}

/* =====================================================
   TÍTULO
===================================================== */

.title-area{
    text-align:center;
    position:relative;
    z-index:5;
    padding:4px 0 10px;
}

.title{
    font-size:clamp(28px,8vw,45px);
    line-height:1;
    font-weight:1000;
    letter-spacing:3px;
    text-transform:uppercase;
    background:
        linear-gradient(
            180deg,
            #d4ffe2 0%,
            #54e58a 45%,
            #168044 100%
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(
        0 5px 8px rgba(0,0,0,.8)
    );
}

.subtitle{
    margin-top:7px;
    color:#8eaa99;
    font-size:9px;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

/* =====================================================
   MÁQUINA
===================================================== */

.machine{
    position:relative;
    z-index:3;
    padding:8px;
    border-radius:28px;
    background:
        linear-gradient(
            145deg,
            #9dffc2 0%,
            #24894f 10%,
            #0d3921 17%,
            #041009 78%,
            #38c977 100%
        );
    box-shadow:
        0 22px 50px rgba(0,0,0,.72),
        0 0 0 1px rgba(90,255,157,.35),
        0 0 28px rgba(40,209,124,.12);
}

.machine-inner{
    padding:10px;
    border-radius:22px;
    background:
        linear-gradient(
            180deg,
            #0c2a18,
            #030b06 50%,
            #082014
        );
    box-shadow:
        inset 0 1px rgba(255,255,255,.12),
        inset 0 -25px 45px rgba(0,0,0,.55);
}

.machine-header{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.machine-header-line{
    width:25%;
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            #54e58a,
            transparent
        );
}

.machine-header-text{
    margin:0 12px;
    color:#8dffb4;
    font-size:10px;
    font-weight:1000;
    letter-spacing:2px;
}

.machine-feature{
    position:absolute;
    right:4px;
    top:5px;
    color:#587463;
    font-size:7px;
    letter-spacing:1px;
}

/* =====================================================
   ROLOS
===================================================== */

.reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:8px;
    border-radius:19px;
    background:#010503;
    border:1px solid #287748;
    box-shadow:
        inset 0 0 35px #000,
        0 8px 20px rgba(0,0,0,.6);
    position:relative;
    overflow:hidden;
}

.reels::before{
    content:"";
    position:absolute;
    left:4%;
    right:4%;
    top:50%;
    height:2px;
    transform:translateY(-50%);
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,255,160,.9),
            transparent
        );
    box-shadow:
        0 0 13px rgba(40,209,124,.8);
    z-index:20;
    pointer-events:none;
}

.reels::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:50%;
    height:55px;
    transform:translateY(-50%);
    background:
        radial-gradient(
            ellipse,
            rgba(40,209,124,.09),
            transparent 70%
        );
    z-index:5;
    pointer-events:none;
}

.reel{
    height:245px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(
            180deg,
            #020805,
            #0d2b19 50%,
            #010503
        );
    border:1px solid #286344;
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.9),
        0 5px 12px rgba(0,0,0,.5);
}

.reel::before,
.reel::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:29%;
    z-index:15;
    pointer-events:none;
}

.reel::before{
    top:0;
    background:
        linear-gradient(
            rgba(1,7,4,.97),
            transparent
        );
}

.reel::after{
    bottom:0;
    background:
        linear-gradient(
            transparent,
            rgba(1,7,4,.97)
        );
}

.strip{
    position:absolute;
    left:0;
    right:0;
    top:0;
    will-change:transform;
}

.symbol{
    height:82px;
    display:grid;
    place-items:center;
    position:relative;
    font-size:46px;
    filter:
        drop-shadow(
            0 6px 8px rgba(0,0,0,.85)
        );
}

.symbol span:first-child{
    transform:translateY(-1px);
}

.symbol-label{
    position:absolute;
    bottom:2px;
    color:#9bb6a5;
    font-size:6px;
    letter-spacing:1px;
}

.reel.spinning .symbol{
    filter:
        blur(2px)
        brightness(1.2);
}

.reel.win{
    box-shadow:
        inset 0 0 30px rgba(40,209,124,.45),
        0 0 28px rgba(40,209,124,.9);
}

.symbol.win-symbol{
    animation:
        winPulse .45s ease-in-out infinite alternate;
}

@keyframes winPulse{
    from{
        transform:scale(1);
        filter:
            brightness(1)
            drop-shadow(
                0 0 2px rgba(80,255,150,.5)
            );
    }

    to{
        transform:scale(1.14);
        filter:
            brightness(1.55)
            drop-shadow(
                0 0 14px rgba(80,255,150,1)
            );
    }
}

/* =====================================================
   STATUS
===================================================== */

.result-line{
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8eaa99;
    font-size:9px;
    letter-spacing:1px;
}

.status{
    min-height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:7px 10px;
    border-radius:11px;
    background:#020805;
    border:1px solid #245238;
    color:#ccebd8;
    font-size:10px;
    text-align:center;
    font-weight:800;
}

/* =====================================================
   CONTROLES
===================================================== */

.main-controls{
    display:grid;
    grid-template-columns:1fr 1.7fr 1fr;
    gap:8px;
    margin-top:11px;
}

.control-box{
    min-height:66px;
    padding:8px 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:
        linear-gradient(
            180deg,
            #10331f,
            #06150c
        );
    border:1px solid #286443;
    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 6px 15px rgba(0,0,0,.45);
}

.control-label{
    color:#789383;
    font-size:7px;
    letter-spacing:1px;
}

.control-value{
    margin-top:3px;
    color:#9dffc2;
    font-size:15px;
    font-weight:1000;
}

.spin-button{
    min-height:66px;
    border-radius:19px;
    background:
        radial-gradient(
            circle at 50% 18%,
            #d4ffe2 0%,
            #54e58a 35%,
            #20a75d 68%,
            #087039 100%
        );
    color:#021d0d;
    font-size:20px;
    font-weight:1000;
    letter-spacing:1px;
    border:3px solid #b9ffd0;
    box-shadow:
        0 7px 0 #07532d,
        0 13px 24px rgba(0,0,0,.6),
        inset 0 2px 4px rgba(255,255,255,.85);
    transition:.1s;
}

.spin-button:active{
    transform:translateY(5px);
    box-shadow:
        0 2px 0 #07532d,
        0 7px 12px rgba(0,0,0,.5);
}

.spin-button:disabled{
    opacity:.5;
    filter:grayscale(.35);
}

/* =====================================================
   APOSTAS
===================================================== */

.bet-panel{
    margin-top:9px;
    padding:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
    border-radius:15px;
    background:#041009;
    border:1px solid #245238;
}

.bet-label{
    color:#789383;
    font-size:8px;
    letter-spacing:1px;
}

.bet-buttons{
    display:flex;
    gap:5px;
}

.bet{
    min-width:49px;
    padding:8px 4px;
    border-radius:9px;
    background:#0b2515;
    border:1px solid #245238;
    color:#ccebd8;
    font-size:10px;
}

.bet.active{
    color:#baffd0;
    border-color:#45db82;
    box-shadow:
        0 0 13px rgba(40,209,124,.35);
}

/* =====================================================
   EXTRAS
===================================================== */

.extra-controls{
    margin-top:8px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.extra{
    min-height:40px;
    padding:8px 4px;
    border-radius:11px;
    background:#06150c;
    border:1px solid #245238;
    color:#b1c9ba;
    font-size:9px;
    font-weight:700;
}

.extra.active{
    color:#aaffc7;
    border-color:#3ed77d;
    background:#0c2d19;
}

.extra:disabled{
    opacity:.35;
}

/* =====================================================
   AUTO
===================================================== */

.auto-button{
    width:100%;
    margin-top:8px;
    min-height:43px;
    border-radius:12px;
    background:
        linear-gradient(
            135deg,
            #0a2816,
            #164b2a
        );
    border:1px solid #49dc86;
    color:#aaffc7;
    font-weight:1000;
    font-size:11px;
    box-shadow:
        0 5px 15px rgba(0,0,0,.35);
}

.auto-button:disabled{
    opacity:.4;
}

/* =====================================================
   INDICADOR
===================================================== */

.free-spins-indicator{
    position:fixed;
    top:72px;
    right:10px;
    z-index:500;
    display:none;
    padding:9px 13px;
    border-radius:11px;
    background:
        linear-gradient(
            135deg,
            #54e58a,
            #159b50
        );
    color:#02200e;
    font-size:11px;
    font-weight:1000;
    box-shadow:
        0 4px 18px rgba(40,209,124,.65);
}

.free-spins-indicator.active{
    display:block;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    to{
        transform:scale(1.06);
    }
}

/* =====================================================
   SUPER BÔNUS
===================================================== */

.super-bonus-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:
        radial-gradient(
            circle,
            rgba(175,255,205,.98),
            rgba(18,169,87,.97)
        );
}

.super-bonus-overlay.active{
    display:flex;
    animation:bonusIn .45s ease-out;
}

@keyframes bonusIn{
    from{
        opacity:0;
        transform:scale(.75);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.bonus-icon{
    font-size:90px;
    animation:
        snakeBonus 1s infinite alternate;
}

@keyframes snakeBonus{
    to{
        transform:scale(1.13) rotate(3deg);
    }
}

.bonus-title{
    margin-top:10px;
    font-size:clamp(29px,9vw,58px);
    line-height:1;
    font-weight:1000;
    color:#023b1b;
    text-shadow:
        0 2px 0 #fff,
        0 0 25px rgba(255,255,255,.9);
}

.bonus-sub{
    margin-top:15px;
    font-size:18px;
    font-weight:1000;
    color:#064b25;
}

.bonus-number{
    margin-top:10px;
    font-size:clamp(70px,20vw,120px);
    line-height:.9;
    font-weight:1000;
    color:#05753a;
    text-shadow:
        0 4px 0 #fff,
        0 0 30px rgba(0,255,110,.8);
}

/* =====================================================
   PARTÍCULAS
===================================================== */

.particle{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#6dff9f;
    z-index:1500;
    pointer-events:none;
    animation:
        particleFly .9s ease-out forwards;
}

@keyframes particleFly{
    to{
        transform:
            translate(var(--x),var(--y))
            scale(.1);
        opacity:0;
    }
}

.coin{
    position:fixed;
    z-index:1500;
    pointer-events:none;
    font-size:18px;
    animation:
        coinFly 1s ease-out forwards;
}

@keyframes coinFly{
    to{
        transform:
            translate(var(--x),var(--y))
            rotate(500deg)
            scale(.2);
        opacity:0;
    }
}

/* =====================================================
   INFO
===================================================== */

.info{
    margin-top:8px;
    padding:11px;
    border-radius:14px;
    background:#041009;
    border:1px solid #1e432f;
    color:#88a493;
    font-size:9px;
    line-height:1.55;
}

.info b{
    color:#ccebd8;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:400px){

        padding:7px;
    }

    .reels{

        padding:6px;
    }

    .bet{
        min-width:42px;
        font-size:9px;
    }

    .brand-title{
        font-size:13px;
    }
}

function dinheiro(valor){

        .toLocaleString(

            }
        );

/* =====================================================
   SALDO REAL
   NÃO ALTERADO
===================================================== */

async function aguardarSistemaSaldo(){

    for(
        let tentativa = 0;
        tentativa < 100;
        tentativa++
    ){

        if(
            window.SistemaSaldo &&
            typeof window.SistemaSaldo.get === "function"
        ){

            return true;

        }

        await esperar(100);

    }

    console.error(
        "SistemaSaldo não foi carregado."
    );

    return false;

}

async function obterSaldo(){

    const sistemaDisponivel =
        await aguardarSistemaSaldo();

    if(!sistemaDisponivel){

        return 0;

    }

    try{

        const valor =
            await window.SistemaSaldo.get();

        return Number(valor) || 0;

    }catch(erro){

        console.error(
            "Erro ao obter saldo:",
            erro
        );

        return 0;

    }

}

async function atualizarSaldo(){

    const saldo =
        await obterSaldo();

    saldoEl.textContent =
        dinheiro(saldo);

    return saldo;

}

async function debitarSaldo(valor){

    const sistemaDisponivel =
        await aguardarSistemaSaldo();

    if(!sistemaDisponivel){

        statusEl.textContent =
            "❌ Sistema de saldo não carregado.";

        return false;

    }

    try{

        const resultado =
            await window.SistemaSaldo.debitar(
                valor
            );

        if(resultado){

            await atualizarSaldo();

        }

        return resultado === true;

    }catch(erro){

        console.error(
            "Erro ao debitar saldo:",
            erro
        );

        return false;

    }

}

async function creditarSaldo(valor){

    const sistemaDisponivel =
        await aguardarSistemaSaldo();

    if(!sistemaDisponivel){

        statusEl.textContent =
            "❌ Sistema de saldo não carregado.";

        return false;

    }

    try{

        const resultado =
            await window.SistemaSaldo.creditar(
                valor
            );

        if(resultado){

            await atualizarSaldo();

        }

        return resultado === true;

    }catch(erro){

        console.error(
            "Erro ao creditar saldo:",
            erro
        );

        return false;

    }

}

function iniciarAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state === "suspended"
        ){

            audioContext.resume();

        }

    }catch(e){}

}

/* SOM BASE */

function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.16
){

    if(!som || !audioContext)
        return;

    try{

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type =
            tipo;

        osc.frequency.value =
            frequencia;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            audioContext.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + duracao
        );

        osc.connect(gain);
        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.stop(
            audioContext.currentTime +
            duracao +
            .04
        );

    }catch(e){}

}

const nomes = {

function escolherSimbolo(){

    let total = 0;

    for(
        const simbolo of CONFIG.simbolos
    ){

        total +=
            CONFIG.pesos[simbolo];

    }

    let valor =
        Math.random() * total;

    for(
        const simbolo of CONFIG.simbolos
    ){

        valor -=
            CONFIG.pesos[simbolo];

        if(valor <= 0)
            return simbolo;

    }

    return "🍒";

}

function criarSimbolo(simbolo){

    return `
        <div class="symbol">
            <span>${simbolo}</span>
            <span class="symbol-label">
                ${nomes[simbolo] || ""}
            </span>
        </div>
    `;

}

function preencherRolo(elemento){

    let html = "";

    for(
        let i=0;
        i<35;
        i++
    ){

        html +=
            criarSimbolo(
                escolherSimbolo()
            );

    }

    elemento.innerHTML =
        html;

}

/* =====================================================
   RESULTADO
===================================================== */

function gerarResultado(){

    return [
        escolherSimbolo(),
        escolherSimbolo(),
        escolherSimbolo()
    ];

}

/* =====================================================
   PREPARAR RESULTADO
===================================================== */

function prepararResultado(
    elemento,
    simboloFinal
){

    const antes = [];

    for(
        let i=0;
        i<18;
        i++
    ){

        antes.push(
            escolherSimbolo()
        );

    }

    const depois = [];

    for(
        let i=0;
        i<10;
        i++
    ){

        depois.push(
            escolherSimbolo()
        );

    }

    const lista = [
        ...antes,
        simboloFinal,
        ...depois
    ];

    elemento.innerHTML =
        lista.map(
            criarSimbolo
        ).join("");

    const simbolo =
        elemento.querySelector(
            ".symbol"
        );

    if(!simbolo)
        return;

    const altura =
        simbolo.offsetHeight;

    elemento.style.transition =
        "none";

    const posicaoCentral =
        18;

    elemento.style.transform =
        `translateY(${
            -(posicaoCentral * altura) +
            ((245 - altura) / 2)
        }px)`;

}

/* =====================================================
   ANIMAÇÃO
===================================================== */

function animarRolo(
    elemento,
    final,
    indice
){

    return new Promise(resolve => {

        preencherRolo(
            elemento
        );

        const simbolo =
            elemento.querySelector(
                ".symbol"
            );

        const altura =
            simbolo ?
            simbolo.offsetHeight :
            82;

        const voltas =
            turbo ?
            14 + indice * 2 :
            22 + indice * 4;

        const distancia =
            -(voltas * altura);

        elemento.style.transition =
            "none";

        elemento.style.transform =
            "translateY(0px)";

        void elemento.offsetHeight;

        const tempo =
            turbo ?
            900 + indice * 180 :
            CONFIG.tempos[indice];

        elemento.style.transition =
            `transform ${tempo}ms cubic-bezier(.12,.72,.16,1)`;

        elemento.style.transform =
            `translateY(${distancia}px)`;

        setTimeout(
            () => {

                prepararResultado(
                    elemento,
                    final
                );

                somParada(indice);

                resolve();

            },
            tempo
        );

    });

}

/* =====================================================
   RODADAS GRÁTIS
===================================================== */

async function executarRodadasGratis(){

    while(
        rodadasGratis > 0
    ){

        await esperar(
            turbo ? 400 : 900
        );

        if(
            rodadasGratis <= 0
        )
            break;

        await girar(
            true
        );

        rodadasGratis--;

        freeSpinsCount.textContent =
            rodadasGratis;

    }

    freeSpinsIndicator
        .classList
        .remove("active");

    statusEl.textContent =
        "Rodadas grátis finalizadas!";

}

/* =====================================================
   AUTO 10 PAGO
===================================================== */

async function iniciarAutoPago(){

    if(girando)
        return;

    const saldo =
        await obterSaldo();

    if(
        saldo < aposta
    ){

        statusEl.textContent =
            "Saldo insuficiente.";

        return;

    }

    autoRodadas =
        10;

    modoAutoPago =
        true;

    freeSpinsLabel.textContent =
        "AUTO:";

    freeSpinsCount.textContent =
        autoRodadas;

    freeSpinsIndicator
        .classList
        .add("active");

    auto10Button.disabled =
        true;

    while(
        autoRodadas > 0
    ){

        const saldoAtual =
            await obterSaldo();

        if(
            saldoAtual < aposta
        ){

            statusEl.textContent =
                "Saldo insuficiente. AUTO parado.";

            break;

        }

        await girar(
            true
        );

        autoRodadas--;

        freeSpinsCount.textContent =
            autoRodadas;

        await esperar(
            turbo ? 350 : 800
        );

    }

    autoRodadas =
        0;

    modoAutoPago =
        false;

    freeSpinsIndicator
        .classList
        .remove("active");

    auto10Button.disabled =
        false;

    if(!girando){

        statusEl.textContent =
            "AUTO finalizado.";

    }

}

/* =====================================================
   ESPERA
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

/* =====================================================
   GIRO
===================================================== */

async function girar(
    rodadaEspecial=false
){

    if(girando)
        return;

    girando =
        true;

    spinButton.disabled =
        true;

    auto10Button.disabled =
        true;

    respinButton.disabled =
        true;

    limparVitoria();

    iniciarAudio();

    iniciarMusica();

    const ehGratis =
        rodadaEspecial &&
        !modoAutoPago;

    const ehAutoPago =
        rodadaEspecial &&
        modoAutoPago;

    if(!rodadaEspecial){

        const saldo =
            await obterSaldo();

        if(
            saldo < aposta
        ){

            statusEl.textContent =
                "❌ Saldo insuficiente.";

            girando =
                false;

            spinButton.disabled =
                false;

            auto10Button.disabled =
                false;

            return;

        }

        const debitado =
            await debitarSaldo(
                aposta
            );

        if(!debitado){

            statusEl.textContent =
                "❌ Não foi possível registrar a aposta.";

            girando =
                false;

            spinButton.disabled =
                false;

            auto10Button.disabled =
                false;

            return;

        }

    }

    if(ehAutoPago){

        const debitado =
            await debitarSaldo(
                aposta
            );

        if(!debitado){

            statusEl.textContent =
                "❌ Não foi possível registrar a aposta.";

            girando =
                false;

            return;

        }

    }

    winDisplay.textContent =
        dinheiro(0);

    if(ehGratis){

        statusEl.textContent =
            "🎰 RODADA GRÁTIS";

    }else if(ehAutoPago){

        statusEl.textContent =
            "🔄 AUTO — GIRANDO";

    }else{

        statusEl.textContent =
            "🎰 GIRANDO...";

    }

    resultLineEl.textContent =
        "Os rolos estão girando...";

    reelBoxes.forEach(
        reel =>
            reel.classList.add(
                "spinning"
            )
    );

    somGiro();

    const resultado =
        gerarResultado();

    await Promise.all([

        animarRolo(
            reels[0],
            resultado[0],
            0
        ),

        animarRolo(
            reels[1],
            resultado[1],
            1
        ),

        animarRolo(
            reels[2],
            resultado[2],
            2
        )

    ]);

    reelBoxes.forEach(
        reel =>
            reel.classList.remove(
                "spinning"
            )
    );

    const [a,b,c] =
        resultado;

    const tresIguais =
        a === b &&
        b === c;

    const tresCobras =
        a === "🐍" &&
        b === "🐍" &&
        c === "🐍";

    if(tresCobras){

        const premio =
            aposta *
            CONFIG.pagamentos["🐍"];

        const creditado =
            await creditarSaldo(
                premio
            );

        if(creditado){

            winDisplay.textContent =
                dinheiro(premio);

            statusEl.textContent =
                `🐍🐍🐍 SUPER BÔNUS! +${dinheiro(premio)}`;

            resultLineEl.textContent =
                "TRÊS COBRAS — 10 RODADAS GRÁTIS!";

            destacarVitoria();

            somVitoria();

            criarParticulas(45);

            criarMoedas();

        }else{

            statusEl.textContent =
                "❌ Erro ao creditar prêmio.";

        }

        if(!rodadaEspecial){

            girando =
                false;

            spinButton.disabled =
                false;

            await atualizarSaldo();

            ativarSuperBonus();

            return;

        }

    }

    else if(tresIguais){

        const multiplicador =
            CONFIG.pagamentos[a] || 0;

        const premio =
            aposta *
            multiplicador;

        const creditado =
            await creditarSaldo(
                premio
            );

        if(creditado){

            winDisplay.textContent =
                dinheiro(premio);

            statusEl.textContent =
                `✨ VITÓRIA! +${dinheiro(premio)}`;

            resultLineEl.textContent =
                `TRÊS ${nomes[a] || a} IGUAIS`;

            destacarVitoria();

            somVitoria();

            criarParticulas(28);

            criarMoedas();

        }else{

            statusEl.textContent =
                "❌ Erro ao creditar prêmio.";

        }

    }

    else{

        winDisplay.textContent =
            dinheiro(0);

        statusEl.textContent =
            "❌ NÃO FOI DESSA VEZ";

        resultLineEl.textContent =
            "Dois iguais e um diferente — sem prêmio.";

    }

    await atualizarSaldo();

    girando =
        false;

    spinButton.disabled =
        false;

    if(!modoAutoPago){

        auto10Button.disabled =
            false;

    }

}

            turbo ?
            "⚡ Turbo ON" :
            "⚡ Turbo";

    }
);

/* =====================================================
   INFO
===================================================== */

infoButton.addEventListener(
    "click",
    () => {

        iniciarAudio();
        somToque();

        infoEl.hidden =
            !infoEl.hidden;

        infoButton.classList.toggle(
            "active",
            !infoEl.hidden
        );

    }
);

/* =====================================================
   RESPIN
===================================================== */

respinButton.addEventListener(
    "click",
    () => {

        iniciarAudio();
        somToque();

        if(
            !respinButton.disabled
        ){

            girar(true);

        }

    }
);

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

reels.forEach(
    preencherRolo
);

reels.forEach(
    elemento => {

        prepararResultado(
            elemento,
            escolherSimbolo()
        );

    }
);

betDisplay.textContent =
    dinheiro(aposta);

/* =====================================================
   INICIALIZAÇÃO DO SALDO
===================================================== */

async function inicializarSaldo(){

    statusEl.textContent =
        "Conectando ao saldo...";

    const sistemaDisponivel =
        await aguardarSistemaSaldo();

    if(!sistemaDisponivel){

        saldoEl.textContent =
            "R$ 0,00";

        statusEl.textContent =
            "❌ Sistema de saldo não carregado.";

        return;

    }

    const saldo =
        await atualizarSaldo();

    statusEl.textContent =
        saldo >= aposta ?
        "Pronto para jogar." :
        "Saldo insuficiente para esta aposta.";

}

inicializarSaldo();

/* =====================================================
   EVENTO DE ATUALIZAÇÃO DO SALDO
===================================================== */

window.addEventListener(
    "saldoAtualizado",
    () => {

        atualizarSaldo();

    }
);

</script></body>
