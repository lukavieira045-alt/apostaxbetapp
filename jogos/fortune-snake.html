<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Fortune Snake 3D - ApostaXBet</title>

<!-- MÚSICA ORIGINAL DO SNAKE -->
<audio id="bgMusic" loop preload="auto">
    <source src="musica-fortune-snake.mp3" type="audio/mpeg">
</audio>

<style>
:root{
    --bg:#050207;
    --gold:#ffd700;
    --purple:#9100ff;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; width:100%; min-height:100%; background: #050207; color:white; font-family: system-ui, sans-serif; overflow:hidden; }
body{ display:flex; justify-content:center; align-items:center; height:100vh; }
button{ font-family:inherit; border:0; cursor:pointer; touch-action:manipulation; }

/* =========================================
   FUNDO DE TEMPESTADE (TROVÕES)
========================================= */
.storm-bg{
    position:fixed; inset:0; z-index:-2;
    background: radial-gradient(circle at 50% -20%, #2a0e45 0%, #000 80%);
}
.lightning{
    position:fixed; inset:0; z-index:-1;
    background:white; opacity:0;
    pointer-events:none;
    mix-blend-mode:overlay;
}
@keyframes flash{
    0%, 90%, 100%{ opacity:0; }
    92%{ opacity:0.6; }
    93%{ opacity:0; }
    94%{ opacity:0.4; }
    96%{ opacity:0; }
}

/* =========================================
   JOGO
========================================= */
.game{ 
    width:min(100%, 500px); 
    padding:15px; 
    position:relative; 
    z-index:10;
    display:flex; flex-direction:column; gap:15px;
}

/* TOPO */
.top-bar{ display:flex; justify-content:space-between; align-items:center; }
.logo-area{ display:flex; align-items:center; gap:10px; }
.logo-icon{ font-size:30px; filter: drop-shadow(0 0 10px gold); }
.title{ font-weight:900; font-size:20px; color:var(--gold); text-transform:uppercase; line-height:1; text-shadow: 0 2px 5px #000; }
.saldo-box{ background:rgba(0,0,0,.8); padding:8px 15px; border-radius:20px; border:1px solid #444; text-align:right; }
.saldo-val{ color:#00ff88; font-weight:bold; font-size:18px; }

/* MÁQUINA 3D */
.slot-frame{
    background: linear-gradient(180deg, #ffd700, #b8860b 10%, #1a0b2e 30%, #000);
    padding:15px; border-radius:25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.9), 0 0 0 5px #333;
    position:relative;
}
.slot-inner{
    background: #000; padding:10px; border-radius:15px;
    box-shadow: inset 0 0 30px #000; border: 2px solid #333;
}
.reels-container{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    background: #111; padding:5px; border-radius:10px;
    position:relative; overflow:hidden;
}
/* Linha de Pagamento */
.reels-container::after{
    content:""; position:absolute; top:50%; left:0; right:0; height:2px;
    background:rgba(255,0,204,.5); box-shadow:0 0 10px #ff00cc; z-index:5;
}

.reel{
    height:180px; background: linear-gradient(180deg, #000, #222, #000);
    border-radius:8px; overflow:hidden; position:relative;
    border: 1px solid #333;
}
.strip{ position:absolute; top:0; left:0; width:100%; will-change:transform; }

/* IMAGENS 3D */
.symbol{ height:60px; display:grid; place-items:center; }
.symbol img{
    width:50px; height:50px; object-fit:contain;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.8));
    transform: scale(1.1);
}
.reel.spinning .symbol img{ filter: blur(4px); }

/* CONTROLES */
.controls{ display:grid; grid-template-columns: 1fr 1.5fr 1fr; gap:10px; }
.btn-box{ background:#1a0b2e; border-radius:12px; padding:10px; text-align:center; border:1px solid #4a2c7a; }
.label{ font-size:10px; color:#aaa; text-transform:uppercase; }
.val{ font-size:16px; font-weight:900; color:#fff; margin-top:3px; }

.spin-btn{
    height:60px; border-radius:30px;
    background: linear-gradient(180deg, #ff00cc, #9100ff);
    color:white; font-size:22px; font-weight:900; text-transform:uppercase;
    border: 3px solid #ff88ee;
    box-shadow: 0 6px 0 #5b00a8, 0 10px 20px rgba(0,0,0,.5);
    transition: transform .1s;
}
.spin-btn:active{ transform:translateY(6px); box-shadow: 0 0 0 #5b00a8; }
.spin-btn:disabled{ opacity:.5; filter:grayscale(1); }

.bets{ display:flex; justify-content:center; gap:5px; margin-top:5px; }
.bet-opt{ padding:8px 12px; background:#111; border:1px solid #333; color:#888; border-radius:8px; font-weight:bold; }
.bet-opt.active{ background:var(--gold); color:#000; border-color:#fff; box-shadow: 0 0 10px var(--gold); }

.msg{ text-align:center; color:#aaa; font-size:12px; min-height:15px; }
</style>
</head>

<body>

<!-- EFEITO DE TROVÃO NO FUNDO -->
<div class="storm-bg"></div>
<div class="lightning" id="lightning"></div>

<div class="game">
    <header class="top-bar">
        <div class="logo-area">
            <div class="logo-icon">🐍</div>
            <div class="title">FORTUNE<br>SNAKE 3D</div>
        </div>
        <div class="saldo-box">
            <div style="font-size:9px;color:#aaa">SALDO</div>
            <span class="saldo-val" id="saldo">R$ 0,00</span>
        </div>
    </header>

    <section class="slot-frame">
        <div class="slot-inner">
            <div class="reels-container" id="reels">
                <div class="reel"><div class="strip" id="r1"></div></div>
                <div class="reel"><div class="strip" id="r2"></div></div>
                <div class="reel"><div class="strip" id="r3"></div></div>
            </div>
        </div>
    </section>

    <section class="controls">
        <div class="btn-box"><div class="label">Aposta</div><div class="val" id="betDisplay">R$ 1,00</div></div>
        <button class="spin-btn" id="spinButton">GIRAR</button>
        <div class="btn-box"><div class="label">Ganho</div><div class="val" id="winDisplay">R$ 0,00</div></div>
    </section>

    <section class="bets">
        <button class="bet-opt" data-bet="0.50">0.50</button>
        <button class="bet-opt active" data-bet="1.00">1.00</button>
        <button class="bet-opt" data-bet="2.00">2.00</button>
        <button class="bet-opt" data-bet="5.00">5.00</button>
    </section>

    <div class="msg" id="status">Pronto para jogar</div>
</div>

<script>
"use strict";
const CONFIG = {
    apostaInicial: 1.00,
    pesos: { "snake": 3, "diamond": 5, "trophy": 10, "coin": 25, "lemon": 30, "cherry": 35 },
    pagamentos: { "snake": 10.00, "diamond": 6.00, "trophy": 4.00, "coin": 2.50, "lemon": 1.50, "cherry": 1.20 },
    tempos: [1200, 1700, 2200]
};

// IMAGENS 3D REAIS (PNGs)
const IMAGENS = {
    "snake": "https://cdn-icons-png.flaticon.com/512/616/616408.png",
    "diamond": "https://cdn-icons-png.flaticon.com/512/2933/2933116.png",
    "trophy": "https://cdn-icons-png.flaticon.com/512/3112/3112946.png",
    "coin": "https://cdn-icons-png.flaticon.com/512/2535/2535063.png",
    "lemon": "https://cdn-icons-png.flaticon.com/512/1135/1135543.png",
    "cherry": "https://cdn-icons-png.flaticon.com/512/1135/1135548.png"
};

const saldoEl = document.getElementById("saldo");
const betDisplay = document.getElementById("betDisplay");
const winDisplay = document.getElementById("winDisplay");
const statusEl = document.getElementById("status");
const spinButton = document.getElementById("spinButton");
const bgMusic = document.getElementById("bgMusic");
const lightning = document.getElementById("lightning");
const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
const reelBoxes = [...document.querySelectorAll(".reel")];

let aposta = CONFIG.apostaInicial;
let girando = false;
let audioContext = null;

// EFEITO DE TROVÃO ALEATÓRIO
function iniciarTempestade(){
    setInterval(() => {
        if(Math.random() > 0.7){
            lightning.style.animation = "none";
            lightning.offsetHeight; 
            lightning.style.animation = "flash 0.5s ease-out";
        }
    }, 3000);
}

function obterSaldo(){ return window.SistemaSaldo ? Number(window.SistemaSaldo.get()) || 0 : 0; }
function debitar(v){ return window.SistemaSaldo ? window.SistemaSaldo.debitar(v) : false; }
function creditar(v){ return window.SistemaSaldo ? window.SistemaSaldo.creditar(v) : false; }
function atualizarSaldoVisual(){ 
    saldoEl.textContent = Number(obterSaldo()).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    if(window.SistemaSaldo && window.SistemaSaldo.atualizarTela) window.SistemaSaldo.atualizarTela();
}

const simbolos = Object.keys(CONFIG.pesos);
function escolherSimbolo(){
    let total = simbolos.reduce((s, k) => s + CONFIG.pesos[k], 0);
    let r = Math.random() * total;
    for(let k of simbolos){ r -= CONFIG.pesos[k]; if(r <= 0) return k; }
    return simbolos[0];
}

function criarSimbolo(key){
    return `<div class="symbol"><img src="${IMAGENS[key]}" draggable="false"></div>`;
}

function preencherRolo(el){ el.innerHTML = Array(20).fill(0).map(()=>criarSimbolo(escolherSimbolo())).join(""); }

function prepararResultado(el, vals){
    const extras = Array(8).fill(0).map(()=>escolherSimbolo());
    el.innerHTML = [...extras, ...vals, ...extras].map(criarSimbolo).join("");
    el.style.transition = "none";
    el.style.transform = `translateY(${-8 * 60}px)`;
}

function encontrarLinhas(res){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return linhas.filter(l => {
        const v = l.map(i => res[i]);
        return v.every(x => x === v[0]);
    });
}

function calcularPremio(res){
    let premio = 0;
    encontrarLinhas(res).forEach(l => {
        premio += aposta * (CONFIG.pagamentos[res[l[0]]] || 0);
    });
    return premio;
}

function initAudio() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
function tocarSom(f, d, t="sine", v=0.15){
    if(!audioContext) return;
    try{
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.001, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(v, audioContext.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + d);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d);
    }catch(e){}
}

async function girar(){
    if(girando) return;
    girando = true;
    spinButton.disabled = true;
    statusEl.textContent = "Girando...";

    initAudio();
    if(bgMusic.paused) bgMusic.play().catch(()=>{});

    // DESCONTO IMEDIATO
    if(obterSaldo() < aposta){ statusEl.textContent = "Saldo insuficiente."; girando=false; spinButton.disabled=false; return; }
    if(!debitar(aposta)){ statusEl.textContent = "Erro ao apostar."; girando=false; spinButton.disabled=false; return; }

    reelBoxes.forEach(r => r.classList.add("spinning"));
    tocarSom(115, 0.18, "sawtooth", 0.15);

    const res = Array(9).fill(0).map(escolherSimbolo);
    const cols = [[res[0],res[3],res[6]], [res[1],res[4],res[7]], [res[2],res[5],res[8]]];
    
    reels.forEach(preencherRolo);
    
    await Promise.all(reels.map((el, i) => new Promise(resolve => {
        el.style.transition = `transform ${CONFIG.tempos[i]}ms cubic-bezier(.15,.8,.1,1)`;
        el.style.transform = `translateY(-${(12+Math.random()*5)*60}px)`;
        setTimeout(() => { prepararResultado(el, cols[i]); tocarSom(230+i*80, 0.12, "triangle", 0.15); resolve(); }, CONFIG.tempos[i]);
    })));

    reelBoxes.forEach(r => r.classList.remove("spinning"));
    
    const premio = calcularPremio(res);
    if(premio > 0){
        winDisplay.textContent = Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
        statusEl.textContent = `VITÓRIA! +${Number(premio).toFixed(2)}`;
        creditar(premio);
        tocarSom(600, 0.3, "sine", 0.15);
        // Efeito de vitória
        lightning.style.background = "#ffd700";
        lightning.style.animation = "flash 0.8s ease-out";
        setTimeout(() => lightning.style.background = "white", 1000);
    } else {
        winDisplay.textContent = "R$ 0,00";
        statusEl.textContent = "Tente novamente";
    }

    atualizarSaldoVisual();
    girando = false;
    spinButton.disabled = false;
}

document.querySelectorAll(".bet-opt").forEach(b => b.onclick = () => {
    if(girando) return;
    aposta = Number(b.dataset.bet);
    document.querySelectorAll(".bet-opt").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    betDisplay.textContent = Number(aposta).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
});

spinButton.onclick = girar;
iniciarTempestade();
atualizarSaldoVisual();
reels.forEach(preencherRolo);
</script>
</body>
</html>
