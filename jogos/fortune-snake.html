/* =====================================================
   JOGO
===================================================== */

.game{

}

.machine{

.machine-header{

/* =====================================================
   ROLOS
===================================================== */

.reels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:8px;

    border-radius:18px;

    background:#030504;

    border:1px solid #536b58;

    box-shadow:
        inset 0 0 30px #000,
        0 7px 18px rgba(0,0,0,.5);

    position:relative;
    overflow:hidden;
}

.reels::before{
    content:"";
    position:absolute;
    left:4%;
    right:4%;
    top:50%;
    height:3px;

    transform:translateY(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,221,112,.8),
            transparent
        );

    box-shadow:
        0 0 14px rgba(255,216,100,.7);

    z-index:10;
    pointer-events:none;
}

.reel{
    height:252px;
    border-radius:14px;
    overflow:hidden;
    position:relative;

    background:
        linear-gradient(
            180deg,
            #07100a,
            #17251b 50%,
            #050806
        );

    border:1px solid #4b6252;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.8),
        0 4px 10px rgba(0,0,0,.45);
}

.reel::before,
.reel::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:29%;
    z-index:4;
    pointer-events:none;
}

.reel::before{
    top:0;
    background:
        linear-gradient(
            rgba(2,5,3,.97),
            transparent
        );
}

.reel::after{
    bottom:0;
    background:
        linear-gradient(
            transparent,
            rgba(2,5,3,.97)
        );
}

.strip{
    position:absolute;
    left:0;
    right:0;
    top:0;

    will-change:transform;
}

.symbol{
    height:84px;

    display:grid;
    place-items:center;

    position:relative;

    font-size:52px;

    filter:
        drop-shadow(
            0 5px 7px rgba(0,0,0,.8)
        );
}

.reel.spinning .symbol{
    filter:
        blur(2px)
        brightness(1.15);
}

.reel.win{
    border-color:#ffe36a;

    box-shadow:
        inset 0 0 25px rgba(255,210,80,.35),
        0 0 24px rgba(255,210,80,.8);
}

@keyframes winPulse{
    from{
        transform:scale(1);
        filter:
            brightness(1)
            drop-shadow(
                0 0 0
                rgba(255,220,90,0)
            );
    }

    to{
        transform:scale(1.12);
        filter:
            brightness(1.5)
            drop-shadow(
                0 0 12px
                rgba(255,220,90,.95)
            );
    }
}

.symbol.win-symbol{
    animation:
        winPulse
        .5s
        ease-in-out
        infinite
        alternate;
}

.particle{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ffd967;

    z-index:1100;

    pointer-events:none;

    animation:
        particleFly
        .85s
        ease-out
        forwards;
}

@keyframes particleFly{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.1);

        opacity:0;
    }
}

.coin{
    position:fixed;

    z-index:1101;

    pointer-events:none;

    font-size:18px;

    animation:
        coinFly
        .9s
        ease-out
        forwards;
}

    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(360deg)
            scale(.25);

        opacity:0;
    }
}

function formatarDinheiro(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}

/* =====================================================
   SISTEMA DE SALDO
   IMPORTANTE:
   AS FUNÇÕES DO SEU SISTEMA SÃO ASYNC.
===================================================== */

async function obterSaldo(){

    try{

        if(
            !window.SistemaSaldo ||
            typeof
            window.SistemaSaldo.get !==
            "function"
        ){

            return 0;
        }

        const valor =
            await window.SistemaSaldo.get();

        return Number(valor) || 0;

    }catch(e){

        console.error(
            "Erro ao obter saldo:",
            e
        );

        return 0;
    }

}

async function debitar(valor){

    try{

        if(
            !window.SistemaSaldo ||
            typeof
            window.SistemaSaldo.debitar !==
            "function"
        ){

            return false;
        }

        return await
            window.SistemaSaldo.debitar(
                valor
            );

    }catch(e){

        console.error(
            "Erro ao debitar:",
            e

        return false;

/* =====================================================
   SÍMBOLOS
===================================================== */

function escolherSimbolo(){

    const simbolos =
        CONFIG.simbolos;

    const pesos =
        CONFIG.pesos;

    const total =
        simbolos.reduce(
            (s,simbolo)=>
                s + pesos[simbolo],
            0
        );

    let valor =
        Math.random()*total;

    for(
        const simbolo
        of simbolos
    ){

        valor -=
            pesos[simbolo];

        if(valor<=0){

            return simbolo;
        }
    }

    return simbolos[0];
}

function criarSimbolo(simbolo){

    return `
        <div class="symbol">
            <span>${simbolo}</span>
        </div>
    `;

}

/* =====================================================
   PREENCHER ROLO
===================================================== */

function preencherRolo(elemento){

    let html="";

    for(
        let i=0;
        i<24;
        i++
    ){

        html +=
            criarSimbolo(
                escolherSimbolo()
            );
    }

    elemento.innerHTML =
        html;

    elemento.style.transition =
        "none";

    elemento.style.transform =
        "translateY(0px)";
}

/* =====================================================
   PREPARAR RESULTADO
===================================================== */

function prepararResultado(
    elemento,
    valorFinal
){

    /*
       Criamos 8 símbolos acima
       + o resultado central
       + 8 abaixo.

       O índice 8 é exatamente
       a posição central do rolo.
    */

    let lista=[];

    for(
        let i=0;
        i<8;
        i++
    ){

        lista.push(
            escolherSimbolo()
        );
    }

    lista.push(
        valorFinal
    );

    for(
        let i=0;
        i<8;
        i++
    ){

        lista.push(
            escolherSimbolo()
        );
    }

    elemento.innerHTML =
        lista.map(
            criarSimbolo
        ).join("");

    const altura =
        elemento
        .querySelector(
            ".symbol"
        )
        .getBoundingClientRect()
        .height;

    elemento.style.transition =
        "none";

    elemento.style.transform =
        `translateY(${-8*altura}px)`;
}

/* =====================================================
   RESULTADO
===================================================== */

function gerarResultado(){

    return [

        escolherSimbolo(),

        escolherSimbolo(),

        escolherSimbolo()

    ];

}

/* =====================================================

===================================================== */

function initAudio(){

    try{

        if(!audioContext){

            audioContext =
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();
        }

    }catch(e){}

}

function tocarSom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.15
){

    if(!som)
        return;

    try{

        initAudio();

        const oscilador =
            audioContext
            .createOscillator();

        const ganho =
            audioContext
            .createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        ganho.gain.exponentialRampToValueAtTime(
            volume,
            audioContext.currentTime+.015
        );

        ganho.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime+duracao
        );

        oscilador.connect(
            ganho
        );

        ganho.connect(
            audioContext.destination
        );

        oscilador.start();

        oscilador.stop(
            audioContext.currentTime+
            duracao+
            .03
        );

    }catch(e){}

}

async function iniciarAutoPlayPago(){

        aposta

        statusEl.textContent =

            formatarDinheiro(

    rodadasRestantes=10;

    freeSpinsCount.textContent =
        rodadasRestantes;

async function iniciarLoopAuto(){

    while(
        rodadasRestantes>0 &&
        !girando
    ){

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    700
                )
        );

        if(
            rodadasRestantes<=0
        )
            break;

        await girar(true);

        rodadasRestantes--;

        freeSpinsCount.textContent =
            rodadasRestantes;
    }

    if(
        rodadasRestantes<=0
    ){

        freeSpinsIndicator
            .classList
            .remove("active");

        statusEl.textContent =
            modoAuto
            ? "AUTO FINALIZADO!"
            : "RODADAS GRÁTIS FINALIZADAS!";

        modoAuto=false;
    }

}

/* =====================================================
   GIRO DE UM ROLO
===================================================== */

function animarRolo(
    elemento,
    indice,
    resultado
){

    return new Promise(
        resolve=>{

            const tempo =
                turbo
                ? 550+
                    indice*120
                : CONFIG.tempos[indice];

            /*
               Primeiro colocamos
               símbolos aleatórios.
            */

            preencherRolo(
                elemento
            );

            const altura =
                elemento
                .querySelector(
                    ".symbol"
                )
                .getBoundingClientRect()
                .height;

            /*
               Muitos símbolos para
               realmente parecer que
               o rolo está girando.
            */

            const distancia =
                -(
                    14+
                    Math.floor(
                        Math.random()*7
                    )
                )*
                altura;

            elemento.style.transition =
                `transform ${tempo}ms cubic-bezier(.12,.72,.16,1)`;

            elemento.style.transform =
                `translateY(${distancia}px)`;

            setTimeout(
                ()=>{

                    /*
                       Quando termina,
                       colocamos o símbolo
                       vencedor exatamente
                       no centro.
                    */

                    prepararResultado(
                        elemento,
                        resultado
                    );

                    somParada(
                        indice
                    );

                    resolve();

                },
                tempo
            );

        }
    );

}

/* =====================================================
   GIRO PRINCIPAL
===================================================== */

async function girar(
    especial=false
){

    if(girando)
        return;

    girando=true;

    spinButton.disabled=true;

    auto10Button.disabled=true;

    initAudio();

    iniciarMusica();

    somGiro();

    /*
       RODADA NORMAL
    */

    if(!especial){

        const saldo =
            await obterSaldo();

        if(
            saldo<
            aposta
        ){

            statusEl.textContent =
                "SALDO INSUFICIENTE";

            resultLineEl.textContent =
                "Saldo atual: "+
                formatarDinheiro(
                    saldo
                );

            girando=false;

            spinButton.disabled=false;

            auto10Button.disabled=false;

            return;
        }

        const debitado =
            await debitar(
                aposta
            );

        if(!debitado){

            statusEl.textContent =
                "ERRO AO REGISTRAR APOSTA";

            await
                atualizarSaldoVisual();

            girando=false;

            spinButton.disabled=false;

            auto10Button.disabled=false;

            return;
        }

    }

    /*
       AUTO PAGO
    */

    else if(
        modoAuto
    ){

        const debitado =
            await debitar(
                aposta
            );

        if(!debitado){

            rodadasRestantes=0;

            modoAuto=false;

            freeSpinsIndicator
                .classList
                .remove("active");

            statusEl.textContent =
                "Saldo insuficiente.";

            await
                atualizarSaldoVisual();

            girando=false;

            spinButton.disabled=false;

            auto10Button.disabled=false;

            return;
        }

    }

    /*
       SUPER BÔNUS:
       especial + !modoAuto
       = NÃO DESCONTA.
    */

    winDisplay.textContent =
        formatarDinheiro(0);

    statusEl.textContent =
        especial
        ? (
            modoAuto
            ? `🔄 AUTO — ${rodadasRestantes} restantes`
            : `🐍 GRÁTIS — ${rodadasRestantes} restantes`
        )
        : "GIRANDO...";

    resultLineEl.textContent =
        "Boa sorte...";

    reelBoxes.forEach(
        reel=>
            reel.classList.add(
                "spinning"
            )
    );

    /*
       UM resultado para os
       três rolos.
    */

    const resultado =
        gerarResultado();

    /*
       Cada rolo recebe
       exatamente um símbolo.
    */

    await Promise.all(

        reels.map(
            (elemento,indice)=>
                animarRolo(
                    elemento,
                    indice,
                    resultado[indice]
                )
        )

    );

    reelBoxes.forEach(
        reel=>
            reel.classList.remove(
                "spinning"
            )
    );

    /*
       RESULTADO:
       SÓ TRÊS IGUAIS GANHA.
    */

    const iguais =
        resultado[0] ===
        resultado[1] &&
        resultado[1] ===
        resultado[2];

    /*
       SUPER BÔNUS:
       TRÊS COBRAS.
    */

    const superBonus =
        resultado[0] === "🐍" &&
        resultado[1] === "🐍" &&
        resultado[2] === "🐍";

    if(superBonus){

        destacarVitoria();

        const premio =
            aposta*
            CONFIG.pagamentos["🐍"];

        winDisplay.textContent =
            formatarDinheiro(
                premio
            );

        statusEl.textContent =
            "🐍 SUPER BÔNUS!";

        resultLineEl.textContent =
            "TRÊS COBRAS! • 10 RODADAS GRÁTIS";

        /*
           A vitória das três
           cobras é creditada.
        */

        await creditar(
            premio
        );

        await
            atualizarSaldoVisual();

        girando=false;

        spinButton.disabled=false;

        auto10Button.disabled=false;

        await ativarSuperBonus();

        return;
    }

    /*
       VITÓRIA NORMAL
    */

    if(iguais){

        const simbolo =
            resultado[0];

        const multiplicador =
            CONFIG.pagamentos[
                simbolo
            ] || 0;

        const premio =
            aposta*
            multiplicador;

        destacarVitoria();

        winDisplay.textContent =
            formatarDinheiro(
                premio
            );

        statusEl.textContent =
            "✨ VITÓRIA! "+
            formatarDinheiro(
                premio
            );

        resultLineEl.textContent =
            "TRÊS SÍMBOLOS IGUAIS!";

        somVitoria();

        criarParticulas(30);

        criarMoedas();

        await creditar(
            premio
        );

    }

    /*
       DERROTA
    */

    else{

        winDisplay.textContent =
            formatarDinheiro(0);

        statusEl.textContent =
            especial
            ? "❌ NÃO FOI DESSA VEZ"
            : "❌ PERDEU";

        resultLineEl.textContent =
            "DOIS IGUAIS + UM DIFERENTE = PERDE";

    }

    await
        atualizarSaldoVisual();

    girando=false;

    spinButton.disabled=false;

    auto10Button.disabled=false;

}

                )
        );

    }

    if(
        !window.SistemaSaldo
    ){

        statusEl.textContent =
            "SISTEMA DE SALDO NÃO CARREGADO";

        return;
    }

    /*
       Preenche os rolos.
    */

    reels.forEach(
        preencherRolo
    );

    /*
       Coloca símbolos iniciais
       corretamente no centro.
    */

    reels.forEach(
        (elemento)=>{
            prepararResultado(
                elemento,
                escolherSimbolo()
            );
        }
    );

    betDisplay.textContent =
        formatarDinheiro(
            aposta
        );

    /*
       CARREGA O SALDO REAL.
    */

    await
        atualizarSaldoVisual();

    statusEl.textContent =
        "PRONTO PARA GIRAR";

}

window.addEventListener(
    "saldoAtualizado",
    ()=>{
        atualizarSaldoVisual();
    }
);

document.addEventListener(
    "pointerdown",
    ()=>{
        initAudio();
    },
    {
        once:true
    }
);

iniciar();

</script></body>
</html>
