<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fortune Snake - Mini</title>

<style>
body {
    background:#1a0b2e;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.game-container {
    background:linear-gradient(180deg,#2d1b4e 0%,#1a0b2e 100%);
    border:2px solid #ffd700;
    border-radius:15px;
    padding:20px;
    width:320px;
    text-align:center;
    box-shadow:0 0 20px rgba(255,215,0,.3);
}

.slot-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin:20px 0;
    background:#0f0518;
    padding:10px;
    border-radius:10px;
    border:1px solid #4a2c7a;
}

.slot-cell {
    width:80px;
    height:80px;
    background:#2a1b3d;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    border:1px solid #3d2b5a;
    transition:
        background .2s,
        transform .15s,
        box-shadow .2s;
}

.slot-cell.spinning {
    transform:scale(1.06);
    box-shadow:0 0 15px rgba(255,215,0,.5);
}

.slot-cell.wild {
    background:#ffd700;
    border-color:#ffaa00;
    box-shadow:0 0 15px #ffd700;
    animation:pulse 1s infinite;
}

.slot-cell.win {
    background:#00ed91;
    border-color:#00ffaa;
    box-shadow:0 0 18px rgba(0,237,145,.7);
}

.controls {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
}

.bet-display {
    background:#0f0518;
    padding:8px 15px;
    border-radius:20px;
    border:1px solid #4a2c7a;
    font-weight:bold;
    color:#ffd700;
}

button.spin-btn {
    background:linear-gradient(45deg,#ff00cc,#3333ff);
    border:none;
    color:white;
    padding:12px 30px;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(255,0,204,.4);
    transition:transform .1s,box-shadow .2s;
}

button.spin-btn:active {
    transform:scale(.95);
}

button.spin-btn:hover {
    box-shadow:0 0 20px rgba(255,0,204,.7);
}

button.spin-btn:disabled {
    opacity:.5;
    cursor:not-allowed;
    filter:grayscale(1);
}

.message-area {
    min-height:30px;
    margin-top:10px;
    color:#00ed91;
    font-weight:bold;
    font-size:14px;
    text-shadow:0 0 5px rgba(0,237,145,.5);
}

@keyframes pulse {
    0% { transform:scale(1); }
    50% { transform:scale(1.05); }
    100% { transform:scale(1); }
}
</style>
</head>

<body>

<div class="game-container">

    <h2 style="color:#ffd700;margin:0;">
        🐍 Fortune Snake
    </h2>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-grid" id="grid"></div>

    <div class="controls">

        <div class="bet-display">
            Aposta: R$ 1,00
        </div>

        <button class="spin-btn" id="btnSpin">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>
const SIMBOLOS = ['🏆','💰','💎','🧧'];

const VALORES = {
    '🏆':5,
    '💰':3,
    '💎':4,
    '🧧':2
};

const APOSTA_FIXA = 1.00;

const gridEl = document.getElementById('grid');
const msgEl = document.getElementById('msgArea');
const btnSpin = document.getElementById('btnSpin');


// ================================
// CRIA GRID
// ================================

for(let i = 0; i < 9; i++){

    const cell = document.createElement('div');

    cell.className = 'slot-cell';

    cell.textContent = '❓';

    gridEl.appendChild(cell);
}


// ================================
// MENSAGEM
// ================================

function atualizarMsg(texto, cor='#00ed91'){

    msgEl.style.color = cor;
    msgEl.textContent = texto;
}


// ================================
// SÍMBOLO PARA ANIMAÇÃO
// ================================

function simboloAleatorio(){

    const lista = [
        '🏆',
        '💰',
        '💎',
        '🧧',
        '🐍'
    ];

    return lista[
        Math.floor(Math.random() * lista.length)
    ];
}


// ================================
// ANIMAÇÃO DO GIRO
// ================================

function animarGiro(cells){

    return new Promise(resolve => {

        const duracao = 3200;

        const inicio = performance.now();

        function frame(agora){

            const tempo = agora - inicio;

            const progresso =
                Math.min(tempo / duracao, 1);

            /*
             * Começa muito rápido
             * e desacelera suavemente.
             */
            const easeOut =
                1 - Math.pow(1 - progresso, 4);

            const intervalo =
                45 + (330 * easeOut);

            cells.forEach(cell => {

                cell.textContent =
                    simboloAleatorio();

                cell.classList.add('spinning');

            });

            if(progresso >= 1){

                cells.forEach(cell => {
                    cell.classList.remove('spinning');
                });

                resolve();

                return;
            }

            setTimeout(() => {

                requestAnimationFrame(frame);

            }, intervalo);
        }

        requestAnimationFrame(frame);
    });
}


// ================================
// GERA RESULTADO
// ================================

function gerarResultado(){

    const resultado = [];

    for(let i = 0; i < 9; i++){

        /*
         * O Wild aparece aleatoriamente.
         */
        const wild =
            Math.random() < 0.08;

        if(wild){

            resultado.push('🐍');

        }else{

            const simbolo =
                SIMBOLOS[
                    Math.floor(
                        Math.random() *
                        SIMBOLOS.length
                    )
                ];

            resultado.push(simbolo);
        }
    }

    return resultado;
}


// ================================
// VERIFICA LINHA
// ================================

function verificarLinha(a,b,c){

    const linha = [a,b,c];

    const quantidadeWild =
        linha.filter(x => x === '🐍').length;

    /*
     * Não existe prêmio apenas com Wild.
     */
    if(quantidadeWild === 3){
        return 0;
    }

    const simboloBase =
        linha.find(x => x !== '🐍');

    if(!simboloBase){
        return 0;
    }

    /*
     * Todos precisam ser:
     * símbolo base ou Wild.
     */
    const combinacaoValida =
        linha.every(
            x => x === simboloBase || x === '🐍'
        );

    if(!combinacaoValida){
        return 0;
    }

    return VALORES[simboloBase] || 0;
}


// ================================
// CARREGA SALDO
// ================================

async function carregarSaldo(){

    if(!window.SistemaSaldo){

        atualizarMsg(
            '⚠️ Sistema de saldo não encontrado!',
            '#ff4d4d'
        );

        return;
    }

    try{

        const saldo =
            await window.SistemaSaldo.atualizarTela();

        if(typeof saldo === 'number'){

            atualizarMsg(
                `Saldo: R$ ${saldo.toFixed(2)}`
            );
        }

    }catch(e){

        console.error(e);

        atualizarMsg(
            'Saldo carregado',
            '#00ed91'
        );
    }
}

carregarSaldo();


// ================================
// GIRAR
// ================================

btnSpin.addEventListener('click', async () => {

    if(!window.SistemaSaldo){

        atualizarMsg(
            '⚠️ Sistema de saldo não carregado!',
            '#ff4d4d'
        );

        return;
    }

    try{

        const saldo =
            await window.SistemaSaldo.get();

        if(saldo < APOSTA_FIXA){

            atualizarMsg(
                '❌ Saldo insuficiente!',
                '#ff4d4d'
            );

            return;
        }

        btnSpin.disabled = true;

        atualizarMsg(
            '🎰 Girando...',
            '#ffd700'
        );

        /*
         * Debita R$1,00
         */
        await window.SistemaSaldo.debitar(
            APOSTA_FIXA
        );

        const cells =
            document.querySelectorAll('.slot-cell');

        cells.forEach(cell => {

            cell.className = 'slot-cell';

        });

        /*
         * Animação
         */
        await animarGiro(cells);

        /*
         * Resultado aleatório
         */
        const resultado =
            gerarResultado();

        resultado.forEach((simbolo,index) => {

            cells[index].textContent =
                simbolo;

            if(simbolo === '🐍'){

                cells[index].classList.add('wild');

            }

        });


        // ============================
        // CALCULA AS 3 LINHAS
        // ============================

        let ganho = 0;

        let linhasVencedoras = 0;

        for(let row = 0; row < 3; row++){

            const idx = row * 3;

            const premio =
                verificarLinha(
                    resultado[idx],
                    resultado[idx + 1],
                    resultado[idx + 2]
                );

            if(premio > 0){

                ganho +=
                    APOSTA_FIXA * premio;

                linhasVencedoras++;

                cells[idx]
                    .classList.add('win');

                cells[idx + 1]
                    .classList.add('win');

                cells[idx + 2]
                    .classList.add('win');
            }
        }


        // ============================
        // PAGAMENTO
        // ============================

        if(ganho > 0){

            await window.SistemaSaldo.ganhar(
                APOSTA_FIXA,
                ganho / APOSTA_FIXA
            );

            atualizarMsg(
                `🎉 Ganhou R$ ${ganho.toFixed(2)}!`,
                '#00ed91'
            );

        }else{

            atualizarMsg(
                '❌ Não ganhou desta vez.',
                '#aaa'
            );
        }


        // Atualiza saldo visual
        if(window.SistemaSaldo.atualizarTela){

            await window.SistemaSaldo.atualizarTela();
        }

    }catch(erro){

        console.error(erro);

        atualizarMsg(
            '⚠️ Ocorreu um erro no giro.',
            '#ff4d4d'
        );

    }finally{

        btnSpin.disabled = false;
    }

});
</script>

</body>
</html>
