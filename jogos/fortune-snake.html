<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fortune Snake - Mini</title>

    <style>

        body {
            background: #1a0b2e;
            color: white;
            font-family: sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background:
                linear-gradient(
                    180deg,
                    #2d1b4e 0%,
                    #1a0b2e 100%
                );

            border: 2px solid #ffd700;
            border-radius: 15px;

            padding: 20px;

            width: 320px;

            text-align: center;

            box-shadow:
                0 0 20px
                rgba(255, 215, 0, 0.3);
        }

        .slot-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 5px;

            margin: 20px 0;

            background: #0f0518;

            padding: 10px;

            border-radius: 10px;

            border: 1px solid #4a2c7a;
        }

        .slot-cell {
            width: 80px;
            height: 80px;

            background: #2a1b3d;

            border-radius: 8px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;

            border: 1px solid #3d2b5a;

            transition:
                transform .08s,
                box-shadow .08s;
        }

        /*
         * Efeito durante o giro
         */

        .slot-cell.spinning {
            transform:
                scale(1.04);

            box-shadow:
                0 0 14px
                rgba(255, 215, 0, .45);
        }

        .slot-cell.wild {
            background: #ffd700;

            border-color: #ffaa00;

            box-shadow:
                0 0 15px #ffd700;

            animation:
                pulse 1s infinite;
        }

        .slot-cell.win {
            background: #00ed91;

            border-color: #00ffaa;

            box-shadow:
                0 0 18px
                rgba(0, 237, 145, .7);
        }

        .controls {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-top: 15px;
        }

        .bet-display {
            background: #0f0518;

            padding: 8px 15px;

            border-radius: 20px;

            border: 1px solid #4a2c7a;

            font-weight: bold;

            color: #ffd700;
        }

        button.spin-btn {
            background:
                linear-gradient(
                    45deg,
                    #ff00cc,
                    #3333ff
                );

            border: none;

            color: white;

            padding:
                12px 30px;

            border-radius:
                25px;

            font-size:
                18px;

            font-weight:
                bold;

            cursor:
                pointer;

            box-shadow:
                0 4px 15px
                rgba(255, 0, 204, .4);

            transition:
                transform .1s;
        }

        button.spin-btn:active {
            transform:
                scale(.95);
        }

        button.spin-btn:disabled {
            opacity: .5;

            cursor:
                not-allowed;

            filter:
                grayscale(1);
        }

        .message-area {
            height: 30px;

            margin-top: 10px;

            color: #00ed91;

            font-weight: bold;

            font-size: 14px;

            text-shadow:
                0 0 5px
                rgba(0, 237, 145, .5);
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

    </style>
</head>

<body>

<div class="game-container">

    <h2 style="color:#ffd700; margin:0;">
        🐍 Fortune Snake
    </h2>

    <div
        class="message-area"
        id="msgArea"
    >
        Carregando saldo...
    </div>

    <div
        class="slot-grid"
        id="grid"
    ></div>

    <div class="controls">

        <div class="bet-display">
            Aposta: R$ 1,00
        </div>

        <button
            class="spin-btn"
            id="btnSpin"
        >
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const SIMBOLOS = [
    '🏆',
    '💰',
    '💎',
    '🧧'
];

const VALORES = {
    '🏆': 5,
    '💰': 3,
    '💎': 4,
    '🧧': 2
};

const APOSTA_FIXA = 1.00;

const MULTIPLICADOR_BONUS = 10;


/* =====================================================
   ELEMENTOS
===================================================== */

const gridEl =
    document.getElementById(
        'grid'
    );

const msgEl =
    document.getElementById(
        'msgArea'
    );

const btnSpin =
    document.getElementById(
        'btnSpin'
    );


/* =====================================================
   CRIA GRID
===================================================== */

for (
    let i = 0;
    i < 9;
    i++
) {

    const cell =
        document.createElement(
            'div'
        );

    cell.className =
        'slot-cell';

    cell.textContent =
        '❓';

    gridEl.appendChild(
        cell
    );
}


/* =====================================================
   MENSAGEM
===================================================== */

function atualizarMsg(
    texto,
    cor = '#00ed91'
) {

    msgEl.style.color =
        cor;

    msgEl.textContent =
        texto;
}


/* =====================================================
   SÍMBOLO PARA O GIRO
===================================================== */

function simboloAleatorio() {

    const lista = [
        '🏆',
        '💰',
        '💎',
        '🧧',
        '🐍'
    ];

    return lista[
        Math.floor(
            Math.random() *
            lista.length
        )
    ];
}


/* =====================================================
   GIRO ESTILO SLOT
===================================================== */

function animarGiro(cells) {

    return new Promise(resolve => {

        /*
         * Giro rápido.
         */

        const DURACAO =
            2200;

        const inicio =
            performance.now();

        let ultimoFrame =
            inicio;

        let intervalo =
            45;


        function girar(agora) {

            const passado =
                agora - inicio;

            const progresso =
                Math.min(
                    passado / DURACAO,
                    1
                );


            /*
             * Começa extremamente rápido
             * e desacelera no final.
             */

            const desaceleracao =
                Math.pow(
                    progresso,
                    3
                );


            intervalo =
                38 +
                desaceleracao * 190;


            /*
             * Troca os símbolos.
             */

            if (
                agora - ultimoFrame >=
                intervalo
            ) {

                ultimoFrame =
                    agora;


                cells.forEach(
                    cell => {

                        cell.textContent =
                            simboloAleatorio();

                        cell.classList.add(
                            'spinning'
                        );

                    }
                );
            }


            /*
             * Ainda girando.
             */

            if (
                progresso < 1
            ) {

                requestAnimationFrame(
                    girar
                );

                return;
            }


            /*
             * Final.
             */

            cells.forEach(
                cell => {

                    cell.classList.remove(
                        'spinning'
                    );

                }
            );


            resolve();
        }


        requestAnimationFrame(
            girar
        );

    });
}


/* =====================================================
   RESULTADO
===================================================== */

function gerarResultado() {

    const resultado =
        [];

    let temWild =
        false;


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const isWild =
            Math.random() < 0.20;


        const simbolo =
            isWild
                ? '🐍'
                : SIMBOLOS[
                    Math.floor(
                        Math.random() *
                        SIMBOLOS.length
                    )
                ];


        resultado.push(
            simbolo
        );


        if (
            isWild
        ) {

            temWild =
                true;
        }

    }


    return {
        resultado,
        temWild
    };
}


/* =====================================================
   CALCULA GANHO
===================================================== */

function calcularGanho(
    resultado,
    cells
) {

    let ganho =
        0;


    for (
        let row = 0;
        row < 3;
        row++
    ) {

        const idx =
            row * 3;


        const s1 =
            resultado[idx];

        const s2 =
            resultado[idx + 1];

        const s3 =
            resultado[idx + 2];


        let base =
            null;


        /*
         * TRINCA
         */

        if (
            s1 === s2 &&
            s2 === s3 &&
            s1 !== '🐍'
        ) {

            base =
                s1;
        }


        /*
         * WILD
         */

        else if (
            s1 === s2 &&
            s3 === '🐍'
        ) {

            base =
                s1;
        }

        else if (
            s1 === '🐍' &&
            s2 === s3 &&
            s2 !== '🐍'
        ) {

            base =
                s2;
        }

        else if (
            s1 === s3 &&
            s2 === '🐍' &&
            s1 !== '🐍'
        ) {

            base =
                s1;
        }


        if (
            base
        ) {

            const valor =
                VALORES[base] ||
                0;


            ganho +=
                APOSTA_FIXA *
                valor;


            cells[idx]
                .classList
                .add('win');

            cells[idx + 1]
                .classList
                .add('win');

            cells[idx + 2]
                .classList
                .add('win');
        }
    }


    return ganho;
}


/* =====================================================
   BOTÃO GIRAR
===================================================== */

btnSpin.addEventListener(
    'click',
    async () => {

        if (
            !window.SistemaSaldo
        ) {

            atualizarMsg(
                '⚠️ Sistema de saldo não carregado!',
                '#ff4d4d'
            );

            return;
        }


        btnSpin.disabled =
            true;


        try {

            const saldo =
                await window.SistemaSaldo
                    .get();


            if (
                saldo <
                APOSTA_FIXA
            ) {

                atualizarMsg(
                    '❌ Saldo insuficiente!',
                    '#ff4d4d'
                );

                btnSpin.disabled =
                    false;

                return;
            }


            /*
             * DEBITA APOSTA
             */

            await window.SistemaSaldo
                .debitar(
                    APOSTA_FIXA
                );


            atualizarMsg(
                '🎰 Girando...'
            );


            const cells =
                document.querySelectorAll(
                    '.slot-cell'
                );


            /*
             * LIMPA EFEITOS
             */

            cells.forEach(
                cell => {

                    cell.className =
                        'slot-cell';

                    cell.textContent =
                        '🌀';
                }
            );


            /*
             * GIRO
             */

            await animarGiro(
                cells
            );


            /*
             * RESULTADO FINAL
             */

            const {
                resultado,
                temWild
            } =
                gerarResultado();


            resultado.forEach(
                (simbolo, index) => {

                    cells[index]
                        .textContent =
                        simbolo;


                    if (
                        simbolo ===
                        '🐍'
                    ) {

                        cells[index]
                            .classList
                            .add(
                                'wild'
                            );
                    }
                }
            );


            /*
             * CALCULA
             */

            let ganho =
                calcularGanho(
                    resultado,
                    cells
                );


            /*
             * BONUS WILD
             */

            if (
                temWild &&
                ganho > 0
            ) {

                ganho *=
                    MULTIPLICADOR_BONUS;


                atualizarMsg(
                    `🔥 WILD ATIVO! x${MULTIPLICADOR_BONUS}`,
                    '#ffd700'
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            700
                        )
                );
            }


            /*
             * PAGAMENTO
             */

            if (
                ganho > 0
            ) {

                await window.SistemaSaldo
                    .ganhar(
                        APOSTA_FIXA,
                        ganho /
                        APOSTA_FIXA
                    );


                atualizarMsg(
                    `✅ Ganhou R$ ${ganho.toFixed(2)}!`,
                    '#00ed91'
                );

            } else {

                atualizarMsg(
                    '❌ Não ganhou desta vez.',
                    '#aaa'
                );
            }


            /*
             * ATUALIZA SALDO
             */

            if (
                window.SistemaSaldo
                    .atualizarTela
            ) {

                await window.SistemaSaldo
                    .atualizarTela();
            }


        } catch (
            erro
        ) {

            console.error(
                'Fortune Snake:',
                erro
            );


            atualizarMsg(
                '⚠️ Erro ao processar o giro.',
                '#ff4d4d'
            );

        } finally {

            btnSpin.disabled =
                false;
        }
    }
);


/* =====================================================
   INÍCIO
===================================================== */

async function iniciar() {

    if (
        window.SistemaSaldo
    ) {

        try {

            const saldo =
                await window.SistemaSaldo
                    .get();

            atualizarMsg(
                `Saldo: R$ ${saldo.toFixed(2)}`
            );

        } catch {

            atualizarMsg(
                'Saldo indisponível.',
                '#ff4d4d'
            );
        }

    } else {

        /*
         * saldo.js é módulo e pode
         * ainda estar carregando.
         */

        setTimeout(
            iniciar,
            150
        );
    }
}

iniciar();

</script>

</body>
</html>
