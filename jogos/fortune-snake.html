<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortune Snake - ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #08000f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* =====================================================
   FUNDO ANIMADO — SEM QUADRADO LARANJA
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: -20%;
    pointer-events: none;
    z-index: -3;

    background:
        radial-gradient(circle at 15% 25%,
            rgba(255, 0, 204, .28),
            transparent 28%),
        radial-gradient(circle at 85% 25%,
            rgba(0, 120, 255, .25),
            transparent 28%),
        radial-gradient(circle at 75% 80%,
            rgba(130, 0, 255, .28),
            transparent 30%),
        radial-gradient(circle at 20% 80%,
            rgba(0, 255, 200, .16),
            transparent 28%);

    filter: blur(28px);

    animation:
        fundoMovimento 12s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.75) 1px,
            transparent 2px
        );

    background-size: 55px 55px;
    opacity: .25;

    animation:
        estrelas 15s linear infinite;
}

@keyframes fundoMovimento {
    0% {
        transform: translate(-3%, -2%) scale(1);
    }

    50% {
        transform: translate(3%, 2%) scale(1.08);
    }

    100% {
        transform: translate(-2%, 3%) scale(1.04);
    }
}

@keyframes estrelas {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-120px);
    }
}

/* =====================================================
   BRILHO
===================================================== */

.background-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,204,.12),
            rgba(100,0,255,.08),
            transparent 70%
        );

    filter: blur(20px);

    animation:
        glow 6s ease-in-out infinite alternate;

    pointer-events: none;
    z-index: -1;
}

@keyframes glow {
    from {
        transform: scale(.9);
        opacity: .45;
    }

    to {
        transform: scale(1.12);
        opacity: .8;
    }
}

/* =====================================================
   EFEITO DE RAIO LENTO
===================================================== */

.lightning {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,.18),
            transparent 45%
        );
}

.lightning.active {
    animation: raioLento 1.8s ease-out;
}

@keyframes raioLento {
    0% {
        opacity: 0;
    }

    15% {
        opacity: .65;
    }

    28% {
        opacity: .08;
    }

    42% {
        opacity: .5;
    }

    60% {
        opacity: .04;
    }

    100% {
        opacity: 0;
    }
}

/* =====================================================
   JOGO — MAIOR E MAIS PRÓXIMO DA TELA
===================================================== */

.game-container {
    width: 430px;
    max-width: 96vw;

    padding: 22px;

    text-align: center;

    border: 2px solid #ffd700;
    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.97),
            rgba(22,9,34,.98)
        );

    box-shadow:
        0 0 20px rgba(255,215,0,.22),
        0 0 60px rgba(145,0,255,.18);

    backdrop-filter: blur(8px);

    position: relative;

    transform-origin: center;
    transition: transform .12s ease;
}

/* vibração visual da máquina */

.game-container.shake {
    animation: shakeGame .55s ease-in-out;
}

@keyframes shakeGame {
    0%,100% {
        transform: translate(0,0);
    }

    15% {
        transform: translate(-4px,2px);
    }

    30% {
        transform: translate(4px,-2px);
    }

    45% {
        transform: translate(-3px,-2px);
    }

    60% {
        transform: translate(3px,2px);
    }

    75% {
        transform: translate(-2px,0);
    }
}

/* =====================================================
   TÍTULO
===================================================== */

h2 {
    margin: 0 0 5px;

    color: #ffd700;

    font-size: 27px;

    text-shadow:
        0 0 8px rgba(255,215,0,.5),
        0 0 20px rgba(255,0,204,.3);
}

.subtitle {
    color: #c5b7d6;
    font-size: 14px;
}

/* =====================================================
   MENSAGEM
===================================================== */

.message-area {
    min-height: 32px;
    margin: 13px 0;

    font-weight: bold;
    color: #00ed91;

    text-shadow:
        0 0 8px rgba(0,237,145,.35);
}

/* =====================================================
   MÁQUINA
===================================================== */

.slot-machine {
    display: flex;
    gap: 8px;

    padding: 14px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #050207
        );

    border: 2px solid #4a2c7a;
    border-radius: 17px;

    overflow: hidden;

    box-shadow:
        inset 0 0 25px #000,
        0 0 20px rgba(115,0,255,.18);
}

.reel {
    flex: 1;

    height: 108px;

    overflow: hidden;

    position: relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border: 2px solid #51306d;
    border-radius: 11px;

    box-shadow:
        inset 0 0 15px #000;
}

.reel-strip {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
}

.symbol {
    height: 108px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 52px;

    text-shadow:
        0 0 12px rgba(255,255,255,.2);
}

.reel.stopping {
    box-shadow:
        0 0 24px rgba(255,215,0,.65),
        inset 0 0 15px #000;
}

.win {
    animation: pulse .5s infinite;

    text-shadow:
        0 0 15px #ffd700,
        0 0 30px #ff00cc;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* =====================================================
   RESULTADO
===================================================== */

.result {
    margin-top: 13px;

    min-height: 34px;

    font-weight: bold;
    font-size: 19px;
}

/* =====================================================
   CONTROLES
===================================================== */

.controls {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 12px;

    margin-top: 19px;
}

.bet {
    background: #0b0610;

    border: 1px solid #4a2c7a;

    border-radius: 22px;

    padding: 11px 15px;

    color: #ffd700;

    font-weight: bold;

    white-space: nowrap;
}

button {
    border: 0;

    color: white;

    font-weight: bold;
    font-size: 18px;

    padding: 14px 28px;

    border-radius: 26px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 18px rgba(255,0,204,.35);

    cursor: pointer;

    transition:
        transform .12s ease,
        box-shadow .2s ease;
}

button:active {
    transform: scale(.94);
}

button:hover {
    box-shadow:
        0 0 25px rgba(255,0,204,.65);
}

button:disabled {
    opacity: .5;
    filter: grayscale(1);
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 420px) {

    .game-container {
        width: 96vw;
        padding: 18px;
    }

    .reel {
        height: 100px;
    }

    .symbol {
        height: 100px;
        font-size: 46px;
    }

    .slot-machine {
        padding: 10px;
        gap: 6px;
    }
}

@media (max-width: 360px) {

    .game-container {
        padding: 15px;
    }

    .reel {
        height: 88px;
    }

    .symbol {
        height: 88px;
        font-size: 40px;
    }

    .bet {
        font-size: 13px;
        padding: 9px 10px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>
<div class="lightning" id="lightning"></div>

<div class="game-container" id="gameContainer">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>

/* =====================================================
   SOM DA ROLETA / CAÇA-NÍQUEIS
===================================================== */

let audioCtx = null;
let somAtivo = true;
let somIntervalo = null;

function iniciarAudio() {

    if (!audioCtx) {

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function tocarTom(
    frequencia,
    duracao,
    tipo = "sine",
    volume = 0.035
) {

    if (!somAtivo) return;

    iniciarAudio();

    const oscilador =
        audioCtx.createOscillator();

    const ganho =
        audioCtx.createGain();

    oscilador.type = tipo;

    oscilador.frequency.setValueAtTime(
        frequencia,
        audioCtx.currentTime
    );

    ganho.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duracao
    );

    oscilador.connect(ganho);
    ganho.connect(audioCtx.destination);

    oscilador.start();

    oscilador.stop(
        audioCtx.currentTime + duracao
    );
}

/* Som característico de ponteiro de roleta */

function iniciarSomRoleta() {

    if (!somAtivo) return;

    iniciarAudio();

    pararSomRoleta();

    let passo = 0;
    let intervalo = 95;

    function tick() {

        if (!somAtivo) return;

        const frequencias = [
            260,
            310,
            370,
            440,
            520
        ];

        tocarTom(
            frequencias[passo % frequencias.length],
            .045,
            "square",
            .018
        );

        passo++;

        /* Vai ficando mais espaçado lentamente */
        intervalo = Math.min(
            170,
            intervalo + 3
        );

        somIntervalo = setTimeout(
            tick,
            intervalo
        );
    }

    tick();
}

function pararSomRoleta() {

    if (somIntervalo) {

        clearTimeout(
            somIntervalo
        );

        somIntervalo = null;
    }
}

/* =====================================================
   SOM DE VITÓRIA
===================================================== */

function somVitoria() {

    if (!somAtivo) return;

    iniciarAudio();

    tocarTom(
        523,
        .14,
        "sine",
        .055
    );

    setTimeout(() => {

        tocarTom(
            659,
            .14,
            "sine",
            .055
        );

    }, 130);

    setTimeout(() => {

        tocarTom(
            784,
            .18,
            "sine",
            .06
        );

    }, 260);

    setTimeout(() => {

        tocarTom(
            1046,
            .30,
            "sine",
            .055
        );

    }, 410);
}

/* =====================================================
   SOM DE DERROTA
===================================================== */

function somDerrota() {

    if (!somAtivo) return;

    iniciarAudio();

    tocarTom(
        190,
        .18,
        "sawtooth",
        .035
    );

    setTimeout(() => {

        tocarTom(
            140,
            .25,
            "sawtooth",
            .03
        );

    }, 180);
}

/* =====================================================
   RAIO + TROVÃO LENTO
===================================================== */

function efeitoRaio() {

    const raio =
        document.getElementById(
            "lightning"
        );

    const jogo =
        document.getElementById(
            "gameContainer"
        );

    /* Reinicia animação */

    raio.classList.remove("active");

    void raio.offsetWidth;

    raio.classList.add("active");

    /* Vibração visual */

    jogo.classList.remove("shake");

    void jogo.offsetWidth;

    jogo.classList.add("shake");

    /* Vibração física do celular */

    if (
        navigator.vibrate
    ) {

        navigator.vibrate([
            80,
            90,
            120,
            110,
            70
        ]);
    }

    /*
       Pequeno trovão grave.
       Mais lento e discreto para
       não ficar agressivo.
    */

    if (somAtivo) {

        setTimeout(() => {

            tocarTom(
                75,
                .42,
                "sawtooth",
                .045
            );

        }, 260);

        setTimeout(() => {

            tocarTom(
                48,
                .65,
                "sawtooth",
                .025
            );

        }, 500);
    }
}

/* =====================================================
   DADOS DO JOGO
===================================================== */

const APOSTA = 1.00;

const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS = {

    "🍒": 1.20,

    "🍋": 1.50,

    "💰": 2.00,

    "💎": 3.00,

    "🏆": 4.00,

    "🐍": 7.00
};

const msg =
    document.getElementById(
        "msgArea"
    );

const result =
    document.getElementById(
        "result"
    );

const button =
    document.getElementById(
        "btnSpin"
    );

const reels = [

    document.getElementById(
        "reel0"
    ),

    document.getElementById(
        "reel1"
    ),

    document.getElementById(
        "reel2"
    )
];

const strips = [

    document.getElementById(
        "strip0"
    ),

    document.getElementById(
        "strip1"
    ),

    document.getElementById(
        "strip2"
    )
];

/* =====================================================
   MENSAGEM
===================================================== */

function mensagem(
    texto,
    cor = "#00ed91"
) {

    msg.textContent = texto;
    msg.style.color = cor;
}

/* =====================================================
   CRIAR ROLOS
===================================================== */

function criarRolo(strip) {

    strip.innerHTML = "";

    for (
        let volta = 0;
        volta < 12;
        volta++
    ) {

        for (
            const simbolo of SIMBOLOS
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "symbol";

            div.textContent =
                simbolo;

            strip.appendChild(div);
        }
    }
}

strips.forEach(
    criarRolo
);

/* =====================================================
   SÍMBOLO ALEATÓRIO
===================================================== */

function simboloAleatorio() {

    return SIMBOLOS[
        Math.floor(
            Math.random() *
            SIMBOLOS.length
        )
    ];
}

/* =====================================================
   PREPARAR ROLO
===================================================== */

function prepararRolo(strip) {

    strip.style.transition =
        "none";

    strip.style.transform =
        "translateY(0px)";

    strip.offsetHeight;
}

/* =====================================================
   GIRAR ROLO
===================================================== */

function girarRolo(
    index,
    resultado,
    duracao
) {

    return new Promise(
        resolve => {

            const strip =
                strips[index];

            const reel =
                reels[index];

            const altura = 108;

            const simbolosPorVolta =
                SIMBOLOS.length;

            const simboloFinal =
                resultado[index];

            const posFinal =
                SIMBOLOS.indexOf(
                    simboloFinal
                );

            /*
               Mais voltas para dar
               sensação real de caça-níquel.
            */

            const voltas =
                8 + Math.floor(
                    Math.random() * 3
                );

            const deslocamento =
                -(
                    (
                        voltas *
                        simbolosPorVolta
                    ) +
                    posFinal
                ) * altura;

            prepararRolo(
                strip
            );

            reel.classList.remove(
                "stopping"
            );

            setTimeout(() => {

                strip.style.transition =
                    `transform ${duracao}ms cubic-bezier(.10,.72,.16,1)`;

                strip.style.transform =
                    `translateY(${deslocamento}px)`;

                setTimeout(() => {

                    reel.classList.add(
                        "stopping"
                    );

                    resolve();

                }, duracao);

            }, index * 160);

        }
    );
}

/* =====================================================
   EXECUTAR GIRO
===================================================== */

async function executarGiro(
    resultado
) {

    await Promise.all([

        girarRolo(
            0,
            resultado,
            2200
        ),

        girarRolo(
            1,
            resultado,
            2600
        ),

        girarRolo(
            2,
            resultado,
            3000
        )

    ]);
}

/* =====================================================
   CALCULAR PRÊMIO
===================================================== */

function calcularPremio(
    resultado
) {

    if (
        resultado[0] ===
        resultado[1] &&
        resultado[1] ===
        resultado[2]
    ) {

        return PAGAMENTOS[
            resultado[0]
        ] || 0;
    }

    return 0;
}

/* =====================================================
   BOTÃO GIRAR
===================================================== */

button.addEventListener(
    "click",
    async function() {

        if (
            !window.SistemaSaldo
        ) {

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled = true;

        try {

            iniciarAudio();

            const saldo =
                await window.SistemaSaldo.get();

            if (
                typeof saldo !== "number" ||
                saldo < APOSTA
            ) {

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled =
                    false;

                return;
            }

            /* Raio lento + vibração */

            efeitoRaio();

            /* Som de roleta */

            iniciarSomRoleta();

            /* Debita */

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            mensagem(
                "🎰 A máquina está girando..."
            );

            result.textContent = "";

            const resultado = [

                simboloAleatorio(),

                simboloAleatorio(),

                simboloAleatorio()

            ];

            await executarGiro(
                resultado
            );

            /* Para o som */

            pararSomRoleta();

            result.textContent =
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if (
                premio > 0
            ) {

                reels.forEach(
                    reel => {

                        reel.classList.add(
                            "win"
                        );
                    }
                );

                somVitoria();

                if (
                    navigator.vibrate
                ) {

                    navigator.vibrate([
                        80,
                        60,
                        120,
                        60,
                        180
                    ]);
                }

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio / APOSTA
                );

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent =
                    `${resultado.join("   ")} 💰`;

            } else {

                somDerrota();

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if (
                window.SistemaSaldo
                    .atualizarTela
            ) {

                await window.SistemaSaldo
                    .atualizarTela();
            }

        } catch (
            erro
        ) {

            console.error(
                erro
            );

            pararSomRoleta();

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        } finally {

            setTimeout(() => {

                reels.forEach(
                    reel => {

                        reel.classList.remove(
                            "stopping",
                            "win"
                        );

                    }
                );

                button.disabled =
                    false;

            }, 700);
        }
    }
);

</script>

</body>
</html>
