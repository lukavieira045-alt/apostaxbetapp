.reels:after{
    content:"";
    position:absolute;
    left:3%;
    right:3%;
    top:50%;
    height:3px;
    transform:translateY(-50%);
    background:#ffd84e;
    box-shadow:0 0 14px #ffd84e;

    pointer-events:none;
}

.reel{
    position:relative;
    height:300px;

    border-radius:14px;
    background:linear-gradient(#07100c,#18251e,#050806);
    border:1px solid #4b6256;

}

.reel:before,
.reel:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:31%;
    z-index:10;
    pointer-events:none;
}

.reel:before{
    top:0;
    background:linear-gradient(#020503,transparent);

.reel:after{

    background:linear-gradient(transparent,#020503);

"use strict";

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const simbolos=[
    "🍒",
    "🍋",
    "🪙",
    "💎",
    "🏮",
    "🐍"
];

const multiplicadores={
    "🍒":2,
    "🍋":3,
    "🪙":4,
    "💎":6,
    "🏮":8,
    "🐍":10
};

const pesos=[
    32,
    27,
    18,
    11,
    8,
    4
];

/* =====================================================
   ESTADO
===================================================== */

let aposta=1;

let girando=false;

let som=true;

let turbo=false;

let gratis=0;

let autoRestante=0;

let autoAtivo=false;

let audio=null;

/* =====================================================
   ELEMENTOS
===================================================== */

const saldoEl=
    document.getElementById("saldo");

const statusEl=
    document.getElementById("status");

const resultEl=
    document.getElementById("result");

const winEl=
    document.getElementById("winValue");

const betEl=
    document.getElementById("betValue");

const spinButton=
    document.getElementById("spin");

const reels=[
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
];

const boxes=
    document.querySelectorAll(".reel");

const freeBox=
    document.getElementById("free");

const freeCount=
    document.getElementById("freeCount");

const bonus=
    document.getElementById("bonus");

/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){

    return Number(valor||0)
        .toLocaleString(
            "pt-BR",
            {
                style:"currency",
                currency:"BRL"
            }
        );
}

/* =====================================================
   SALDO REAL
===================================================== */

async function lerSaldo(){

    try{

        if(
            !window.SistemaSaldo ||
            typeof window.SistemaSaldo.get!=="function"
        ){
            return 0;
        }

        return Number(
            await window.SistemaSaldo.get()
        )||0;

    }catch(e){

        console.error(
            "Erro no saldo:",
            e
        );

        return 0;
    }
}

async function atualizarSaldo(){

    const valor=
        await lerSaldo();

    saldoEl.textContent=
        dinheiro(valor);

    return valor;
}

/* =====================================================
   ÁUDIO
===================================================== */

function iniciarAudio(){

    try{

        if(!audio){

            audio=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(
            audio.state==="suspended"
        ){
            audio.resume();
        }

    }catch(e){}
}

function beep(
    freq=440,
    tempo=.1
){

    if(!som)
        return;

    try{

        iniciarAudio();

        const osc=
            audio.createOscillator();

        const gain=
            audio.createGain();

        osc.frequency.value=freq;

        osc.type="triangle";

        gain.gain.setValueAtTime(
            .0001,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .16,
            audio.currentTime+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audio.currentTime+tempo
        );

        osc.connect(gain);

        gain.connect(
            audio.destination
        );

        osc.start();

        osc.stop(
            audio.currentTime+
            tempo+
            .02
        );

    }catch(e){}
}

/* =====================================================
   MÚSICA
===================================================== */

const musica=
    new Audio("fortune_ember.mp3");

musica.loop=true;
musica.volume=.28;

function tocarMusica(){

    if(!som)
        return;

    musica.play().catch(
        ()=>{}
    );
}

/* =====================================================
   ESCOLHER SÍMBOLO
===================================================== */

function escolher(){

    const total=
        pesos.reduce(
            (a,b)=>a+b,
            0
        );

    let n=
        Math.random()*total;

    for(
        let i=0;
        i<simbolos.length;
        i++
    ){

        n-=pesos[i];

        if(n<=0)
            return simbolos[i];
    }

    return simbolos[0];
}

/* =====================================================
   RESULTADO
===================================================== */

function gerarResultado(){

    return [
        escolher(),
        escolher(),
        escolher()
    ];
}

/* =====================================================
   CONSTRUIR ROLO
===================================================== */

function montarRolo(
    elemento,
    resultado,
    indice
){

    /*
       5 símbolos antes do resultado
       e 5 depois.

       O resultado fica exatamente
       no centro da janela.
    */

    let lista=[];

    for(let i=0;i<5;i++){

        lista.push(
            escolher()
        );
    }

    lista.push(
        resultado[indice]
    );

    for(let i=0;i<5;i++){

        lista.push(
            escolher()
        );
    }

    elemento.innerHTML=
        lista.map(
            s=>`
                <div class="symbol">
                    ${s}
                </div>
            `
        ).join("");

    const altura=100;

    elemento.style.transition="none";

    elemento.style.transform=
        `translateY(${-5*altura}px)`;

    return altura;
}

/* =====================================================
   GIRAR UM ROLO
===================================================== */

function animarRolo(
    elemento,
    caixa,
    resultado,
    indice
){

    return new Promise(
        resolve=>{

            const altura=
                montarRolo(
                    elemento,
                    resultado,
                    indice
                );

            caixa.classList.add(
                "spinning"
            );

            const tempo=
                turbo
                ?650+indice*220
                :1500+indice*350;

            requestAnimationFrame(
                ()=>{
                    requestAnimationFrame(
                        ()=>{

                            /*
                               O resultado já começa
                               na posição central.

                               Portanto mantemos
                               exatamente -500px.
                            */

                            elemento.style.transition=
                                `transform ${tempo}ms cubic-bezier(.12,.72,.18,1)`;

                            elemento.style.transform=
                                `translateY(${-5*altura}px)`;
                        }
                    );
                }
            );

            setTimeout(
                ()=>{

                    caixa.classList.remove(
                        "spinning"
                    );

                    beep(
                        260+indice*90,
                        .12
                    );

                    resolve();

                },
                tempo+40
            );
        }
    );
}

/* =====================================================
   DESTAQUE
===================================================== */

function destacar(){

    boxes.forEach(
        b=>{
            b.classList.add("win");

            const simbolo=
                b.querySelector(
                    ".symbol:nth-child(6)"
                );

            if(simbolo){
                simbolo.classList.add(
                    "win-symbol"
                );
            }
        }
    );
}

/* =====================================================
   RODADAS GRÁTIS
===================================================== */

function atualizarGratis(){

    freeCount.textContent=
        gratis;

    freeBox.classList.toggle(
        "active",
        gratis>0
    );
}

/* =====================================================
   PRÊMIO
===================================================== */

function calcularPremio(resultado){

    const [a,b,c]=resultado;

    if(
        a===b &&
        b===c
    ){

        return {
            ganhou:true,
            premio:
                aposta*
                multiplicadores[a],
            bonus:
                a==="🐍"
        };
    }

    return {
        ganhou:false,
        premio:0,
        bonus:false
    };
}

/* =====================================================
   GIRO
===================================================== */

async function girar(){

    if(girando)
        return;

    iniciarAudio();
    tocarMusica();
    beep(180,.08);

    /* RODADA GRÁTIS */

    const rodadaGratis=
        gratis>0;

    if(rodadaGratis){

        gratis--;

        atualizarGratis();

    }else{

        /*
           SALDO REAL
        */

        const saldo=
            await lerSaldo();

        if(saldo<aposta){

            statusEl.textContent=
                "SALDO INSUFICIENTE";

            resultEl.textContent=
                "Saldo atual: "+
                dinheiro(saldo);

            beep(100,.18);

            return;
        }

        /*
           DEBITA DO SISTEMA REAL
        */

        const ok=
            await window.SistemaSaldo
                .debitar(aposta);

        if(!ok){

            statusEl.textContent=
                "NÃO FOI POSSÍVEL DEBITAR";

            await atualizarSaldo();

            return;
        }

        await atualizarSaldo();
    }

    girando=true;

    spinButton.disabled=true;

    boxes.forEach(
        b=>b.classList.remove(
            "win"
        )
    );

    winEl.textContent=
        "R$ 0,00";

    statusEl.textContent=
        rodadaGratis
        ? "🐍 RODADA GRÁTIS..."
        : "GIRANDO...";

    resultEl.textContent=
        "Aguarde os três rolos...";

    /*
       Resultado único.
       O visual e o prêmio usam
       exatamente o mesmo resultado.
    */

    const resultado=
        gerarResultado();

    await Promise.all(
        reels.map(
            (r,i)=>
                animarRolo(
                    r,
                    boxes[i],
                    resultado,
                    i
                )
        )
    );

    const resultadoFinal=
        calcularPremio(
            resultado
        );

    /* SUPER BÔNUS */

    if(
        resultadoFinal.bonus
    ){

        destacar();

        winEl.textContent=
            dinheiro(
                resultadoFinal.premio
            );

        statusEl.textContent=
            "🐍 SUPER BÔNUS!";

        resultEl.textContent=
            "TRÊS COBRAS! • 10 RODADAS GRÁTIS";

        /*
           Primeiro paga a vitória
           das três cobras.
        */

        if(
            resultadoFinal.premio>0
        ){

            await window.SistemaSaldo
                .creditar(
                    resultadoFinal.premio
                );
        }

        await atualizarSaldo();

        beep(523,.18);

        setTimeout(
            ()=>beep(659,.18),
            100
        );

        setTimeout(
            ()=>beep(784,.22),
            200
        );

        setTimeout(
            ()=>beep(1046,.30),
            300
        );

        bonus.classList.add(
            "active"
        );

        setTimeout(
            ()=>{

                bonus.classList.remove(
                    "active"
                );

                gratis+=10;

                atualizarGratis();

                statusEl.textContent=
                    "10 RODADAS GRÁTIS ATIVADAS!";

                terminarGiro();

            },
            2200
        );

        return;
    }

    /* VITÓRIA NORMAL */

    if(
        resultadoFinal.ganhou
    ){

        destacar();

        winEl.textContent=
            dinheiro(
                resultadoFinal.premio
            );

        statusEl.textContent=
            "🏆 VITÓRIA!";

        resultEl.textContent=
            "TRÊS SÍMBOLOS IGUAIS!";

        await window.SistemaSaldo
            .creditar(
                resultadoFinal.premio
            );

        await atualizarSaldo();

        beep(523,.15);

        setTimeout(
            ()=>beep(659,.15),
            100
        );

        setTimeout(
            ()=>beep(784,.25),
            200
        );

    }

    /* PERDA */

    else{

        statusEl.textContent=
            "NÃO FOI DESSA VEZ";

        resultEl.textContent=
            "DOIS IGUAIS + UM DIFERENTE = PERDE";

        await atualizarSaldo();
    }

    terminarGiro();
}

/* =====================================================
   TERMINAR GIRO
===================================================== */

function terminarGiro(){

    girando=false;

    spinButton.disabled=false;

    if(
        autoAtivo &&
        autoRestante>0
    ){

        autoRestante--;

        if(
            autoRestante<=0
        ){

            autoAtivo=false;

            statusEl.textContent=
                "AUTO FINALIZADO";

            return;
        }

        setTimeout(
            ()=>{
                girar();
            },
            turbo?350:800
        );

    }
}

   BOTÃO GIRAR
===================================================== */

spinButton.addEventListener(
    "click",

        iniciarAudio();
        girar();
    }
);

/* =====================================================
   APOSTAS
===================================================== */

document

.forEach(

        botao.addEventListener(

            ()=>{

                if(girando)

                iniciarAudio();

                aposta=

                    );

                document

                .forEach(
                    b=>

                        )
                );

                botao.classList.add(

                );

                betEl.textContent=

        );

);

   SOM
===================================================== */

document
.getElementById("sound")
.addEventListener(

            ? "🔊 SOM"

document

/* =====================================================
   AUTO 10
===================================================== */

document
.getElementById("autoButton")
.addEventListener(
    "click",
    async ()=>{

        if(girando)
            return;

        iniciarAudio();

        const saldo=
            await lerSaldo();

        /*
           Se já existem rodadas grátis,
           permite iniciar o automático.
        */

        if(
            gratis<=0 &&
            saldo<aposta
        ){

            statusEl.textContent=
                "SALDO INSUFICIENTE";

            resultEl.textContent=
                "Saldo atual: "+
                dinheiro(saldo);

            return;
        }

        autoAtivo=true;

        autoRestante=10;

        statusEl.textContent=
            "10 RODADAS AUTOMÁTICAS";

        girar();
    }
);

   PARAR AUTO
===================================================== */

document
.getElementById("stop")
.addEventListener(
    "click",
    ()=>{

        autoAtivo=false;

        autoRestante=0;

        statusEl.textContent=
            "AUTO PARADO";

        beep(180,.08);
    }
);

/* =====================================================
   BOTÃO AUTO EXTRA
===================================================== */

document
.getElementById("auto")
.addEventListener(
    "click",
    ()=>{

        document
        .getElementById("autoButton")
        .click();
    }
);

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciar(){

    /*
       Espera o saldo.js carregar.
    */

    for(
        let i=0;
        i<30 &&
        !window.SistemaSaldo;
        i++
    ){

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    100
                )
        );
    }

    if(!window.SistemaSaldo){

        statusEl.textContent=
            "SISTEMA DE SALDO NÃO CARREGADO";

        return;
    }

    /*
       Mostra o saldo real.
    */

    await atualizarSaldo();

    /*
       Monta os rolos iniciais.
    */

    reels.forEach(
        r=>{

            const resultado=[
                escolher(),
                escolher(),
                escolher()
            ];

            montarRolo(
                r,
                resultado,
                0
            );
        }
    );

    betEl.textContent=
        dinheiro(aposta);

    statusEl.textContent=
        "PRONTO PARA JOGAR";
}

document.addEventListener(
    "pointerdown",
    ()=>{
        iniciarAudio();
    },
    {once:true}
);

iniciar();
