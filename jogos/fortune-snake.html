<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Snake - ApostaXBet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#07000d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* =====================================================
   FUNDO COM LUZES, FUMAÇA E PARTÍCULAS
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:-10;

    background:
        radial-gradient(circle at 15% 25%,rgba(180,0,255,.35),transparent 25%),
        radial-gradient(circle at 85% 20%,rgba(0,130,255,.30),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(255,0,180,.30),transparent 27%),
        radial-gradient(circle at 15% 85%,rgba(80,0,255,.32),transparent 27%);

    filter:blur(35px);

    animation:luzesFundo 12s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-9;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 2px);

    background-size:55px 55px;
    opacity:.20;

    animation:particulas 15s linear infinite;
}

@keyframes luzesFundo{
    0%{
        transform:translate(-4%,-3%) scale(1);
    }
    50%{
        transform:translate(4%,3%) scale(1.08);
    }
    100%{
        transform:translate(-2%,5%) scale(1.04);
    }
}

@keyframes particulas{
    from{transform:translateY(0);}
    to{transform:translateY(-120px);}
}

/* =====================================================
   FUMAÇA
===================================================== */

.fumaca{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-8;
    overflow:hidden;
}

.fumaca span{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(150,150,170,.08);
    filter:blur(35px);
    animation:fumar 14s ease-in-out infinite alternate;
}

.fumaca span:nth-child(1){
    left:-40px;
    bottom:5%;
}

.fumaca span:nth-child(2){
    right:-50px;
    top:15%;
    animation-delay:3s;
}

.fumaca span:nth-child(3){
    left:35%;
    bottom:-70px;
    animation-delay:6s;
}

@keyframes fumar{
    0%{
        transform:translate(0,30px) scale(.8);
        opacity:.15;
    }
    50%{
        transform:translate(50px,-80px) scale(1.25);
        opacity:.35;
    }
    100%{
        transform:translate(-40px,-150px) scale(1.5);
        opacity:.08;
    }
}

/* =====================================================
   RAIOS LENTOS
===================================================== */

.raios{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
    overflow:hidden;
    opacity:0;
}

.raio{
    position:absolute;
    width:4px;
    height:65vh;

    background:linear-gradient(
        180deg,
        transparent,
        #bfffff,
        #00eaff,
        transparent
    );

    filter:
        drop-shadow(0 0 8px #00eaff)
        drop-shadow(0 0 20px #00eaff);

    clip-path:polygon(
        50% 0,
        62% 30%,
        52% 30%,
        72% 58%,
        58% 57%,
        68% 100%,
        43% 65%,
        50% 65%,
        31% 38%,
        45% 39%
    );

    transform:rotate(8deg);
}

.raio1{
    left:13%;
    top:-5%;
}

.raio2{
    right:16%;
    top:-8%;
    transform:rotate(-10deg);
}

.raios.ativo{
    animation:raioLento 2.8s ease-out;
}

@keyframes raioLento{
    0%{opacity:0;}
    18%{opacity:.9;}
    30%{opacity:.15;}
    48%{opacity:.8;}
    65%{opacity:.08;}
    100%{opacity:0;}
}

/* =====================================================
   TREMOR DA MÁQUINA
===================================================== */

.game-container.impacto{
    animation:tremor 0.65s ease;
}

@keyframes tremor{
    0%,100%{transform:translate(0,0);}
    10%{transform:translate(-4px,2px);}
    20%{transform:translate(4px,-2px);}
    30%{transform:translate(-5px,-2px);}
    40%{transform:translate(5px,3px);}
    50%{transform:translate(-3px,-3px);}
    60%{transform:translate(3px,2px);}
    70%{transform:translate(-2px,0);}
}

/* =====================================================
   JOGO
===================================================== */

.game-container{
    width:430px;
    max-width:94vw;
    padding:22px;

    text-align:center;

    border:2px solid #4d2375;
    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            rgba(50,25,87,.97),
            rgba(16,5,27,.98)
        );

    box-shadow:
        0 0 25px rgba(145,0,255,.28),
        0 0 70px rgba(0,80,255,.12),
        inset 0 0 30px rgba(0,0,0,.7);

    backdrop-filter:blur(8px);

    position:relative;
}

/* sem quadrado amarelo */
.game-container::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(160,0,255,.45),
            transparent,
            rgba(0,220,255,.35),
            transparent
        );

    background-size:300% 300%;
    animation:borda 7s linear infinite;

    z-index:-1;
}

@keyframes borda{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* =====================================================
   TÍTULO
===================================================== */

h2{
    margin:0 0 5px;
    color:#ffd700;

    text-shadow:
        0 0 8px #ffd700,
        0 0 18px #ff00cc;
}

.subtitle{
    color:#c5b7d6;
    font-size:13px;
}

/* =====================================================
   MENSAGEM
===================================================== */

.message-area{
    min-height:30px;
    margin:12px 0;

    font-weight:bold;
    color:#00ed91;

    text-shadow:
        0 0 8px rgba(0,237,145,.35);
}

/* =====================================================
   MÁQUINA
===================================================== */

.slot-machine{
    display:flex;
    gap:8px;

    padding:12px;

    background:
        linear-gradient(
            145deg,
            #100719,
            #030105
        );

    border:2px solid #412565;
    border-radius:15px;

    overflow:hidden;

    box-shadow:
        inset 0 0 25px #000,
        0 0 18px rgba(115,0,255,.20);
}

.reel{
    flex:1;

    height:100px;

    overflow:hidden;
    position:relative;

    background:
        linear-gradient(
            180deg,
            #29153c,
            #13091d
        );

    border:2px solid #51306d;
    border-radius:10px;

    box-shadow:
        inset 0 0 15px #000;
}

.reel::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.35)
        );
}

.reel-strip{
    position:absolute;
    width:100%;
    top:0;
    left:0;

    will-change:transform;
}

.symbol{
    height:100px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:48px;

    text-shadow:
        0 0 8px rgba(255,255,255,.35);
}

.reel.stopping{
    box-shadow:
        0 0 20px rgba(170,0,255,.55),
        inset 0 0 15px #000;
}

.win{
    animation:pulse .5s infinite;

    text-shadow:
        0 0 12px #ffd700,
        0 0 25px #ff00cc;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

/* =====================================================
   RESULTADO
===================================================== */

.result{
    margin-top:12px;
    min-height:32px;

    font-weight:bold;
    font-size:18px;
}

/* =====================================================
   CONTROLES
===================================================== */

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    margin-top:18px;
}

.bet{
    background:#0b0610;

    border:1px solid #4a2c7a;
    border-radius:20px;

    padding:10px 13px;

    color:#ffd700;
    font-weight:bold;
    white-space:nowrap;
}

button{
    border:0;
    color:white;

    font-weight:bold;
    font-size:17px;

    padding:13px 25px;
    border-radius:25px;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 5px 18px rgba(255,0,204,.35);

    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

button:hover{
    box-shadow:
        0 0 25px rgba(255,0,204,.65);
}

button:disabled{
    opacity:.5;
    filter:grayscale(1);
    cursor:not-allowed;
}

@media(max-width:380px){
    .game-container{
        padding:16px;
    }

    .reel{
        height:82px;
    }

    .symbol{
        height:82px;
        font-size:39px;
    }
}
</style>
</head>

<body>

<div class="fumaca">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="raios" id="raios">
    <div class="raio raio1"></div>
    <div class="raio raio2"></div>
</div>

<div class="background-glow"></div>

<div class="game-container" id="gameContainer">

    <h2>🐍 Fortune Snake</h2>

    <div class="subtitle">
        🐍 Boa sorte!
    </div>

    <div class="message-area" id="msgArea">
        Carregando saldo...
    </div>

    <div class="slot-machine">

        <div class="reel" id="reel0">
            <div class="reel-strip" id="strip0"></div>
        </div>

        <div class="reel" id="reel1">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel" id="reel2">
            <div class="reel-strip" id="strip2"></div>
        </div>

    </div>

    <div class="result" id="result">
        Boa sorte!
    </div>

    <div class="controls">

        <div class="bet">
            Aposta: R$ 1,00
        </div>

        <button id="btnSpin" type="button">
            GIRAR
        </button>

    </div>

</div>

<script type="module" src="../saldo.js"></script>

<script>
// =====================================================
// AUDIO
// =====================================================

let audioCtx = null;

function iniciarAudio(){

    if(!audioCtx){

        audioCtx = new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

function tocarTom(
    frequencia,
    duracao,
    tipo="sine",
    volume=.04
){

    iniciarAudio();

    const osc =
        audioCtx.createOscillator();

    const ganho =
        audioCtx.createGain();

    osc.type = tipo;

    osc.frequency.setValueAtTime(
        frequencia,
        audioCtx.currentTime
    );

    ganho.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duracao
    );

    osc.connect(ganho);
    ganho.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime + duracao
    );
}

// =====================================================
// SOM DE CAÇA-NÍQUEL
// =====================================================

let somGiroInterval = null;

function iniciarSomGiro(){

    iniciarAudio();

    let passo = 0;

    somGiroInterval =
        setInterval(() => {

            if(!audioCtx) return;

            const frequencias = [
                220,
                260,
                300,
                340,
                390,
                330
            ];

            tocarTom(
                frequencias[passo % frequencias.length],
                .055,
                "square",
                .025
            );

            passo++;

        }, 115);
}

function pararSomGiro(){

    if(somGiroInterval){

        clearInterval(
            somGiroInterval
        );

        somGiroInterval = null;
    }
}

// =====================================================
// SOM DE MOEDAS
// =====================================================

function somMoedas(){

    iniciarAudio();

    const notas = [
        880,
        1174,
        1396,
        1760,
        2093
    ];

    notas.forEach((nota,index)=>{

        setTimeout(()=>{

            tocarTom(
                nota,
                .16,
                "sine",
                .065
            );

        },index * 105);

    });
}

// =====================================================
// SOM DE TROVÃO
// =====================================================

function somTrovao(){

    iniciarAudio();

    tocarTom(
        65,
        .65,
        "sawtooth",
        .055
    );

    setTimeout(()=>{

        tocarTom(
            48,
            .9,
            "sawtooth",
            .045
        );

    },180);
}

// =====================================================
// EFEITOS
// =====================================================

function efeitosGiro(){

    const raios =
        document.getElementById("raios");

    const jogo =
        document.getElementById("gameContainer");

    raios.classList.remove("ativo");

    void raios.offsetWidth;

    raios.classList.add("ativo");

    jogo.classList.remove("impacto");

    void jogo.offsetWidth;

    jogo.classList.add("impacto");

    if(
        navigator.vibrate
    ){

        navigator.vibrate([
            80,
            70,
            110,
            80,
            140
        ]);
    }

    somTrovao();

    setTimeout(()=>{

        raios.classList.remove("ativo");

    },2800);
}

// =====================================================
// CONFIGURAÇÃO
// =====================================================

const APOSTA = 1.00;

const SIMBOLOS = [
    "🍒",
    "🍋",
    "💰",
    "💎",
    "🏆",
    "🐍"
];

const PAGAMENTOS = {
    "🍒":1.20,
    "🍋":1.50,
    "💰":2.00,
    "💎":3.00,
    "🏆":4.00,
    "🐍":7.00
};

const msg =
    document.getElementById("msgArea");

const result =
    document.getElementById("result");

const button =
    document.getElementById("btnSpin");

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
];

const strips = [
    document.getElementById("strip0"),
    document.getElementById("strip1"),
    document.getElementById("strip2")
];

function mensagem(
    texto,
    cor="#00ed91"
){

    msg.textContent = texto;
    msg.style.color = cor;
}

// =====================================================
// CRIA ROLOS GRANDES
// IMPORTANTE: MUITAS VOLTAS PARA OS ÍCONES NÃO SUMIREM
// =====================================================

function criarRolo(strip){

    strip.innerHTML = "";

    for(
        let volta = 0;
        volta < 18;
        volta++
    ){

        for(
            const simbolo of SIMBOLOS
        ){

            const div =
                document.createElement("div");

            div.className = "symbol";

            div.textContent =
                simbolo;

            strip.appendChild(div);
        }
    }
}

strips.forEach(criarRolo);

function simboloAleatorio(){

    return SIMBOLOS[
        Math.floor(
            Math.random() *
            SIMBOLOS.length
        )
    ];
}

// =====================================================
// PREPARAR ROLO
// =====================================================

function prepararRolo(strip){

    strip.style.transition =
        "none";

    strip.style.transform =
        "translate3d(0,0,0)";

    strip.offsetHeight;
}

// =====================================================
// GIRO
// =====================================================

function girarRolo(
    index,
    resultado,
    duracao
){

    return new Promise(resolve=>{

        const strip =
            strips[index];

        const reel =
            reels[index];

        const altura = 100;

        const quantidade =
            SIMBOLOS.length;

        const simboloFinal =
            resultado[index];

        const posFinal =
            SIMBOLOS.indexOf(
                simboloFinal
            );

        /*
         * Mantemos o resultado bem dentro
         * do rolo para nunca ficar vazio.
         */
        const voltas =
            10 + index * 2;

        const indiceFinal =
            (
                voltas * quantidade
            ) + posFinal;

        const deslocamento =
            -(indiceFinal * altura);

        prepararRolo(strip);

        reel.classList.remove(
            "stopping"
        );

        setTimeout(()=>{

            strip.style.transition =
                `transform ${duracao}ms cubic-bezier(.10,.72,.18,1)`;

            strip.style.transform =
                `translate3d(0,${deslocamento}px,0)`;

            setTimeout(()=>{

                reel.classList.add(
                    "stopping"
                );

                resolve();

            },duracao);

        },index * 120);

    });
}

// =====================================================
// EXECUTAR GIRO
// =====================================================

async function executarGiro(
    resultado
){

    await Promise.all([

        girarRolo(
            0,
            resultado,
            1850
        ),

        girarRolo(
            1,
            resultado,
            2200
        ),

        girarRolo(
            2,
            resultado,
            2550
        )

    ]);
}

// =====================================================
// PREMIAÇÃO
// =====================================================

function calcularPremio(
    resultado
){

    if(
        resultado[0] === resultado[1] &&
        resultado[1] === resultado[2]
    ){

        return PAGAMENTOS[
            resultado[0]
        ] || 0;

    }

    return 0;
}

// =====================================================
// GIRO PRINCIPAL
// =====================================================

button.addEventListener(
    "click",
    async function(){

        if(!window.SistemaSaldo){

            mensagem(
                "⚠️ Sistema de saldo não encontrado!",
                "#ff4d4d"
            );

            return;
        }

        button.disabled = true;

        iniciarAudio();

        try{

            const saldo =
                await window.SistemaSaldo.get();

            if(
                typeof saldo !== "number" ||
                saldo < APOSTA
            ){

                mensagem(
                    "❌ Saldo insuficiente!",
                    "#ff4d4d"
                );

                button.disabled = false;

                return;
            }

            await window.SistemaSaldo.debitar(
                APOSTA
            );

            /* efeitos ao apertar */
            efeitosGiro();

            /* som contínuo de caça-níquel */
            iniciarSomGiro();

            mensagem(
                "🎰 Os rolos estão girando..."
            );

            result.textContent =
                "🎰 • 🎰 • 🎰";

            const resultado = [

                simboloAleatorio(),
                simboloAleatorio(),
                simboloAleatorio()

            ];

            await executarGiro(
                resultado
            );

            /* para o som dos rolos */
            pararSomGiro();

            result.textContent =
                resultado.join("   ");

            const premio =
                calcularPremio(
                    resultado
                );

            if(premio > 0){

                reels.forEach(
                    reel=>{
                        reel.classList.add(
                            "win"
                        );
                    }
                );

                await window.SistemaSaldo.ganhar(
                    APOSTA,
                    premio / APOSTA
                );

                somMoedas();

                if(
                    navigator.vibrate
                ){

                    navigator.vibrate([
                        100,
                        80,
                        100,
                        80,
                        180
                    ]);
                }

                mensagem(
                    `🎉 Ganhou R$ ${premio.toFixed(2)}!`,
                    "#00ed91"
                );

                result.textContent =
                    `${resultado.join("   ")} 💰`;

            }else{

                mensagem(
                    "😈 Não foi dessa vez...",
                    "#aaa"
                );
            }

            if(
                window.SistemaSaldo.atualizarTela
            ){

                await window.SistemaSaldo
                    .atualizarTela();

            }

        }catch(erro){

            console.error(erro);

            pararSomGiro();

            mensagem(
                "⚠️ Ocorreu um erro no giro.",
                "#ff4d4d"
            );

        }finally{

            pararSomGiro();

            setTimeout(()=>{

                reels.forEach(
                    reel=>{

                        reel.classList.remove(
                            "stopping",
                            "win"
                        );

                    }
                );

                button.disabled = false;

            },600);
        }
    }
);
</script>

</body>
</html>
