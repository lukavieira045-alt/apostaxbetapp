<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Fortune Snake Pro - ApostaXBet</title>

<!-- MÚSICA ORIGINAL DO SNAKE -->
<audio id="bgMusic" loop preload="auto">
    <source src="musica-fortune-snake.mp3" type="audio/mpeg">
</audio>

<style>
:root{
    --gold:#ffd700;
    --gold-dark:#b8860b;
    --purple:#9100ff;
    --dark:#050207;
    --panel-bg: #1a0b2e;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

/* TELA INTEIRA */
html, body{ 
    margin:0; padding:0; width:100%; height:100%; 
    background: var(--dark); 
    color:white; 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    overflow:hidden;
}

/* FUNDO COM TROVÃO */
body.storm{ animation: lightning 6s infinite; }
@keyframes lightning{
    0%, 90%, 100%{ background: #050207; }
    92%{ background: #2a0e45; }
    93%{ background: #ffffff; }
    94%{ background: #050207; }
}

.game{ 
    width:100%; height:100vh; 
    display:flex; flex-direction:column; 
    justify-content:space-between; 
    padding:10px; 
    position:relative; z-index:10;
}

/* TOPO (SALDO) */
.header{ 
    display:flex; justify-content:space-between; align-items:center; 
    padding:10px 15px; 
    background: rgba(0,0,0,0.7); 
    border-radius: 50px; 
    border: 1px solid #333;
    backdrop-filter: blur(10px);
}
.logo{ font-weight:900; font-size:18px; color:var(--gold); text-transform:uppercase; line-height:1; text-shadow: 0 0 10px rgba(255,215,0,.5); }
.saldo-box{ 
    background: linear-gradient(180deg, #222, #000); 
    padding:8px 20px; border-radius:50px; 
    border:1px solid #444; 
    box-shadow: inset 0 0 10px #000; 
    min-width: 130px; text-align: center;
}
.saldo-val{ color:#00ff88; font-weight:bold; font-size:18px; text-shadow: 0 0 10px rgba(0,255,136,.5); }

/* MÁQUINA CENTRAL (ESTILO IMAGEM) */
.machine-wrapper{
    flex-grow: 1;
    display:flex; align-items:center; justify-content:center;
    padding: 10px 0;
}

.machine{
    width: 100%; max-width: 480px;
    background: linear-gradient(180deg, #ffd700 0%, #b8860b 10%, #1a0b2e 30%, #000 100%);
    padding:20px; border-radius:30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.9), 0 0 0 5px #4a2c7a;
    position:relative;
}

.screen{
    background: #000; padding:15px; border-radius:20px;
    box-shadow: inset 0 0 50px #000; border: 4px solid #222;
    position:relative; overflow:hidden;
}

.reels{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; position:relative; }
.reel{
    height:200px; background: linear-gradient(180deg, #050505, #1a1a1a 50%, #050505);
    border-radius:15px; overflow:hidden; position:relative;
    border: 2px solid #333; box-shadow: inset 0 0 20px #000;
}

/* LINHA DE PAGAMENTO */
.reels::after{
    content:""; position:absolute; top:50%; left:0; right:0; height:3px;
    background: linear-gradient(90deg, transparent, #ff00cc, transparent);
    box-shadow: 0 0 20px #ff00cc; z-index:5; opacity:.8;
}

.strip{ position:absolute; top:0; left:0; width:100%; will-change:transform; }

/* SÍMBOLOS 3D */
.symbol{ height:66px; display:grid; place-items:center; position:relative; }
.sym-img{
    width:50px; height:50px; border-radius:50%;
    display:grid; place-items:center; font-size:28px; font-weight:900;
    box-shadow: 0 5px 15px rgba(0,0,0,.8), inset 0 2px 2px rgba(255,255,255,.4);
}
.sym-cobra{ background: radial-gradient(circle at 30% 30%, #00ff88, #006400); border:2px solid #00ff88; }
.sym-diamante{ background: radial-gradient(circle at 30% 30%, #00ffff, #0088ff); border:2px solid #00ffff; }
.sym-trofeu{ background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b); border:2px solid #ffd700; }
.sym-moeda{ background: radial-gradient(circle at 30% 30%, #ffaa00, #cc8800); border:2px solid #ffaa00; }
.sym-limao{ background: radial-gradient(circle at 30% 30%, #ffff00, #aaaa00); border:2px solid #ffff00; }
.sym-cereja{ background: radial-gradient(circle at 30% 30%, #ff0044, #880022); border:2px solid #ff0044; }

.reel.spinning .sym-img{ filter: blur(3px); }

/* CONTROLES (PAINEL INFERIOR) */
.controls-area{
    background: linear-gradient(180deg, #1a0b2e, #050207);
    padding: 15px; border-radius: 25px 25px 0 0;
    border-top: 2px solid #4a2c7a;
    box-shadow: 0 -10px 30px rgba(0,0,0,.8);
}

.main-controls{ display:grid; grid-template-columns: 1fr 1.8fr 1fr; gap:10px; align-items:center; margin-bottom: 15px; }
.info-box{ 
    background: #000; border-radius:15px; padding:10px; text-align:center; 
    border:1px solid #333; box-shadow: inset 0 0 10px #000;
}
.lbl{ font-size:9px; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.val{ font-size:16px; font-weight:900; color:#fff; margin-top:2px; }

.spin-btn{
    height:70px; border-radius:50px;
    background: linear-gradient(180deg, #ff00cc 0%, #9100ff 100%);
    color:white; font-size:22px; font-weight:900; text-transform:uppercase;
    border: 4px solid #ff88ee;
    box-shadow: 0 8px 0 #5b00a8, 0 15px 30px rgba(145,0,255,.4);
    transition: all .1s;
}
.spin-btn:active{ transform:translateY(8px); box-shadow: 0 0 0 #5b00a8; }
.spin-btn:disabled{ opacity:.5; filter:grayscale(1); }

.bets{ display:flex; justify-content:center; gap:8px; }
.bet-opt{ 
    padding:10px 15px; background: linear-gradient(180deg, #222, #111); 
    border:1px solid #444; color:#888; border-radius:10px; font-weight:bold; font-size:13px;
    box-shadow: 0 4px 0 #000;
}
.bet-opt.active{ background: linear-gradient(180deg, #ffd700, #b8860b); color:#000; border-color:#fff; box-shadow: 0 0 15px rgba(255,215,0,.5); }

.msg{ text-align:center; color:#aaa; font-size:12px; min-height:15px; font-weight:bold; margin-top: 5px;}
</style>
</head>

<body class="storm">

<div class="game">
    <!-- TOPO -->
    <header class="header">
        <div class="logo">🐍 FORTUNE<br>SNAKE PRO</div>
        <div class="saldo-box">
            <div style="font-size:9px;color:#aaa">SALDO</div>
            <span class="saldo-val" id="saldo">R$ 0,00</span>
        </div>
    </header>

    <!-- MÁQUINA -->
    <div class="machine-wrapper">
        <section class="machine">
            <div class="screen">
                <div class="reels" id="reels">
                    <div class="reel"><div class="strip" id="r1"></div></div>
                    <div class="reel"><div class="strip" id="r2"></div></div>
                    <div class="reel"><div class="strip" id="r3"></div></div>
                </div>
            </div>
        </section>
    </div>

    <!-- CONTROLES -->
    <div class="controls-area">
        <section class="main-controls">
            <div class="info-box"><div class="lbl">Aposta</div><div class="val" id="betDisplay">R$ 1,00</div></div>
            <button class="spin-btn" id="spinButton">GIRAR</button>
            <div class="info-box"><div class="lbl">Ganho</div><div class="val" id="winDisplay">R$ 0,00</div></div>
        </section>

        <section class="bets">
            <button class="bet-opt" data-bet="0.50">0.50</button>
            <button class="bet-opt active" data-bet="1.00">1.00</button>
            <button class="bet-opt" data-bet="2.00">2.00</button>
            <button class="bet-opt" data-bet="5.00">5.00</button>
        </section>

        <div class="msg" id="status">PRONTO PARA JOGAR</div>
    </div>
</div>

<script>
"use strict";
const CONFIG = {
    apostaInicial: 1.00,
    pesos: { "cobra": 2, "diamante": 4, "trofeu": 8, "moeda": 20, "limao": 30, "cereja": 36 },
    pagamentos: { "cobra": 15.00, "diamante": 8.00, "trofeu": 5.00, "moeda": 3.00, "limao": 1.50, "cereja": 1.20 },
    tempos: [1200, 1700, 2200]
};

const SIMBOLOS_VISUAIS = {
    "cobra": { cls: "sym-cobra", txt: "🐍" },
    "diamante": { cls: "sym-diamante", txt: "💎" },
    "trofeu": { cls: "sym-trofeu", txt: "🏆" },
    "moeda": { cls: "sym-moeda", txt: "$" },
    "limao": { cls: "sym-limao", txt: "🍋" },
    "cereja": { cls: "sym-cereja", txt: "🍒" }
};

const saldoEl = document.getElementById("saldo");
const betDisplay = document.getElementById("betDisplay");
const winDisplay = document.getElementById("winDisplay");
const statusEl = document.getElementById("status");
const spinButton = document.getElementById("spinButton");
const bgMusic = document.getElementById("bgMusic");
const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];
const reelBoxes = [...document.querySelectorAll(".reel")];

let aposta = CONFIG.apostaInicial;
let girando = false;
let audioContext = null;

// SISTEMA DE SALDO ROBUSTO
function obterSaldo(){ 
    try {
        if(window.SistemaSaldo && typeof window.SistemaSaldo.get === "function"){
            return Number(window.SistemaSaldo.get()) || 0;
        }
    } catch(e){ console.log("Erro ao ler saldo", e); }
    return 0; 
}

function debitar(v){ 
    try {
        if(window.SistemaSaldo && typeof window.SistemaSaldo.debitar === "function"){
            return window.SistemaSaldo.debitar(v);
        }
    } catch(e){}
    return false; 
}

function creditar(v){ 
    try {
        if(window.SistemaSaldo && typeof window.SistemaSaldo.creditar === "function"){
            return window.SistemaSaldo.creditar(v);
        }
    } catch(e){}
    return false; 
}

function atualizarSaldoVisual(){ 
    const val = obterSaldo();
    saldoEl.textContent = val.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    try {
        if(window.SistemaSaldo && typeof window.SistemaSaldo.atualizarTela === "function") {
            window.SistemaSaldo.atualizarTela();
        }
    } catch(e){}
}

const simbolos = Object.keys(CONFIG.pesos);
function escolherSimbolo(){
    let total = simbolos.reduce((s, k) => s + CONFIG.pesos[k], 0);
    let r = Math.random() * total;
    for(let k of simbolos){ r -= CONFIG.pesos[k]; if(r <= 0) return k; }
    return simbolos[0];
}

function criarSimbolo(key){
    const v = SIMBOLOS_VISUAIS[key];
    return `<div class="symbol"><div class="sym-img ${v.cls}">${v.txt}</div></div>`;
}

function preencherRolo(el){ el.innerHTML = Array(20).fill(0).map(()=>criarSimbolo(escolherSimbolo())).join(""); }

function prepararResultado(el, vals){
    const extras = Array(8).fill(0).map(()=>escolherSimbolo());
    el.innerHTML = [...extras, ...vals, ...extras].map(criarSimbolo).join("");
    el.style.transition = "none";
    el.style.transform = `translateY(${-8 * 66}px)`;
}

function encontrarLinhas(res){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return linhas.filter(l => {
        const v = l.map(i => res[i]);
        return v.every(x => x === v[0]);
    });
}

function calcularPremio(res){
    let premio = 0;
    encontrarLinhas(res).forEach(l => {
        premio += aposta * (CONFIG.pagamentos[res[l[0]]] || 0);
    });
    return premio;
}

function initAudio() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
function tocarSom(f, d, t="sine", v=0.15){
    if(!audioContext) return;
    try{
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.001, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(v, audioContext.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + d);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d);
    }catch(e){}
}

async function girar(){
    if(girando) return;
    girando = true;
    spinButton.disabled = true;
    statusEl.textContent = "GIRANDO...";

    initAudio();
    if(bgMusic.paused) bgMusic.play().catch(()=>{});

    const saldoAtual = obterSaldo();
    if(saldoAtual < aposta){ 
        statusEl.textContent = "SALDO INSUFICIENTE"; 
        girando=false; spinButton.disabled=false; 
        return; 
    }
    
    if(!debitar(aposta)){ 
        statusEl.textContent = "ERRO AO APOSTAR"; 
        girando=false; spinButton.disabled=false; 
        return; 
    }

    atualizarSaldoVisual();

    reelBoxes.forEach(r => r.classList.add("spinning"));
    tocarSom(115, 0.18, "sawtooth", 0.15);

    const res = Array(9).fill(0).map(escolherSimbolo);
    const cols = [[res[0],res[3],res[6]], [res[1],res[4],res[7]], [res[2],res[5],res[8]]];
    
    reels.forEach(preencherRolo);
    
    await Promise.all(reels.map((el, i) => new Promise(resolve => {
        el.style.transition = `transform ${CONFIG.tempos[i]}ms cubic-bezier(.15,.8,.1,1)`;
        el.style.transform = `translateY(-${(12+Math.random()*5)*66}px)`;
        setTimeout(() => { prepararResultado(el, cols[i]); tocarSom(230+i*80, 0.12, "triangle", 0.15); resolve(); }, CONFIG.tempos[i]);
    })));

    reelBoxes.forEach(r => r.classList.remove("spinning"));
    
    const premio = calcularPremio(res);
    if(premio > 0){
        winDisplay.textContent = Number(premio).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
        statusEl.textContent = `VITÓRIA! +${Number(premio).toFixed(2)}`;
        creditar(premio);
        tocarSom(600, 0.3, "sine", 0.15);
        document.body.style.animation = "none";
        document.body.offsetHeight;
        document.body.style.animation = "lightning 0.3s 3";
    } else {
        winDisplay.textContent = "R$ 0,00";
        statusEl.textContent = "TENTE NOVAMENTE";
    }

    atualizarSaldoVisual();
    girando = false;
    spinButton.disabled = false;
}

document.querySelectorAll(".bet-opt").forEach(b => b.onclick = () => {
    if(girando) return;
    aposta = Number(b.dataset.bet);
    document.querySelectorAll(".bet-opt").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    betDisplay.textContent = Number(aposta).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
});

spinButton.onclick = girar;
atualizarSaldoVisual();
reels.forEach(preencherRolo);
window.addEventListener('focus', atualizarSaldoVisual);
</script>
</body>
</html>
