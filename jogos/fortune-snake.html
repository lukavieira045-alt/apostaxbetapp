    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
];

const reelBoxes=[
    ...document.querySelectorAll(".reel")
];

/* =====================================================
   ESTADO
===================================================== */

let aposta=APOSTA_INICIAL;

let girando=false;

let som=true;

let turbo=false;

let rodadasGratis=0;

let autoRodadas=0;

let autoAtivo=false;

let audioContext=null;

/* =====================================================
   SALDO — CORRIGIDO COM AWAIT
===================================================== */

async function obterSaldo(){

    try{

        if(
            !window.SistemaSaldo ||
            typeof window.SistemaSaldo.get!=="function"
        ){

            console.error(
                "SistemaSaldo não carregado."
            );

            return 0;
        }

        const valor=
            await window.SistemaSaldo.get();

        return Number(valor)||0;

    }catch(erro){

        console.error(
            "Erro ao obter saldo:",
            erro
        );

        return 0;
    }
}

async function atualizarSaldo(){

    try{

        if(
            !window.SistemaSaldo ||
            typeof window.SistemaSaldo.get!=="function"
        ){

            saldoEl.textContent=
                "R$ 0,00";

            return 0;
        }

        const saldo=
            await window.SistemaSaldo.get();

        const numero=
            Number(saldo)||0;

        saldoEl.textContent=
            numero.toLocaleString(
                "pt-BR",
                {
                    style:"currency",
                    currency:"BRL"
                }
            );

        return numero;

    }catch(erro){

        console.error(
            "Erro ao atualizar saldo:",
            erro
        );

        return 0;
    }
}

/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){

    return Number(valor||0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );
}

/* =====================================================
   ÁUDIO
===================================================== */

function iniciarAudio(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(
            audioContext.state==="suspended"
        ){

            audioContext.resume();

        }

    }catch(e){}
}

function somFX(
    frequencia,
    duracao,
    tipo="sine",
    volume=.18
){

    if(!som)
        return;

    try{

        iniciarAudio();

        if(!audioContext)
            return;

        const osc=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        osc.type=tipo;

        osc.frequency.value=
            frequencia;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            audioContext.currentTime+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime+duracao
        );

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.stop(
            audioContext.currentTime+
            duracao+
            .03
        );

    }catch(e){}
}

function somClique(){

    somFX(
        450,
        .07,
        "triangle",
        .15
    );
}

function somGiro(){

    somFX(
        100,
        .16,
        "sawtooth",
        .16
    );

    setTimeout(
        ()=>{
            somFX(
                145,
                .14,
                "sawtooth",
                .15
            );
        },
        90
    );
}

function somParada(i){

    somFX(
        240+(i*80),
        .15,
        "triangle",
        .18
    );
}

function somVitoria(){

    [523,659,784,1046]
    .forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    somFX(
                        freq,
                        .23,
                        "sine",
                        .22
                    );
                },
                i*90
            );

        }
    );
}

function somBonus(){

    [523,659,784,1046,1318]
    .forEach(
        (freq,i)=>{

            setTimeout(
                ()=>{
                    somFX(
                        freq,
                        .30,
                        "sine",
                        .24
                    );
                },

            );

    );
}

===================================================== */

musica.loop=true;

musica.volume=.30;

/* =====================================================
   SÍMBOLOS
===================================================== */

function escolherSimbolo(){

    const simbolos=
        Object.keys(PESOS);

    const total=
        simbolos.reduce(
            (s,x)=>s+PESOS[x],
            0
        );

    let valor=
        Math.random()*total;

    for(
        const simbolo of simbolos
    ){

        valor-=PESOS[simbolo];

        if(valor<=0)
            return simbolo;
    }

    return simbolos[0];
}

function criarSimbolo(simbolo){

    return `
        <div class="symbol">
            <span>${simbolo}</span>
            <span class="symbol-label">
                ${NOMES[simbolo]}
            </span>
        </div>
    `;
}

function preencherRolo(elemento){

    let html="";

    for(let i=0;i<24;i++){

        html+=
            criarSimbolo(
                escolherSimbolo()
            );
    }

    elemento.innerHTML=html;
}

/* =====================================================
   RESULTADO
===================================================== */

function gerarResultado(){

    return [
        escolherSimbolo(),
        escolherSimbolo(),
        escolherSimbolo()
    ];
}

function prepararRolo(
    elemento,
    resultado,
    indice
){

    const extras=[];

    for(let i=0;i<8;i++){

        extras.push(
            escolherSimbolo()
        );
    }

    const lista=[
        ...extras,
        resultado[indice],
        ...extras
    ];

    elemento.innerHTML=
        lista.map(
            criarSimbolo
        ).join("");

    const altura=
        elemento
        .querySelector(".symbol")
        .offsetHeight;

    const inicio=
        extras.length;

    elemento.style.transition=
        "none";

    elemento.style.transform=
        `translateY(${-inicio*altura}px)`;
}

/* =====================================================
   ANIMAÇÃO DO ROLO
===================================================== */

function girarRolo(
    elemento,
    box,
    resultado,
    indice
){

    return new Promise(
        resolve=>{

            prepararRolo(
                elemento,
                resultado,
                indice
            );

            box.classList.add(
                "spinning"
            );

            const altura=
                elemento
                .querySelector(".symbol")
                .offsetHeight;

            const inicio=8;

            const destino=
                -(inicio*altura);

            const tempo=
                turbo
                ? 550+(indice*220)
                : 1000+(indice*350);

            requestAnimationFrame(
                ()=>{

                    elemento.style.transition=
                        `transform ${tempo}ms cubic-bezier(.12,.72,.18,1)`;

                    elemento.style.transform=
                        `translateY(${destino}px)`;
                }
            );

            setTimeout(
                ()=>{

                    box.classList.remove(
                        "spinning"
                    );

                    somParada(indice);

                    resolve();

                },
                tempo+30
            );
        }
    );
}

/* =====================================================
   PRÊMIO
===================================================== */

function calcularPremio(resultado){

    const a=resultado[0];

    const b=resultado[1];

    const c=resultado[2];

    /* 3 IGUAIS */

    if(
        a===b &&
        b===c
    ){

        return {
            premio:
                aposta*
                PAGAMENTOS[a],

            bonus:
                a==="🐍"
        };
    }

    /* 2 IGUAIS + 1 DIFERENTE
       = PERDE */

    return {
        premio:0,
        bonus:false
    };
}

/* =====================================================
   PARTÍCULAS
===================================================== */

function particulas(qtd=25){

    const x=
        window.innerWidth/2;

    const y=
        window.innerHeight*.42;

    for(
        let i=0;
        i<qtd;
        i++
    ){

        const p=
            document.createElement("span");

        p.className="particle";

        p.style.left=
            x+"px";

        p.style.top=
            y+"px";

        p.style.setProperty(
            "--x",
            ((Math.random()-.5)*280)+"px"
        );

        p.style.setProperty(
            "--y",
            ((Math.random()-.7)*240)+"px"
        );

        document.body.appendChild(p);

        setTimeout(
            ()=>p.remove(),
            900
        );
    }
}

/* =====================================================
   INDICADOR DE GRÁTIS
===================================================== */

function atualizarGratis(){

    freeSpinsCount.textContent=
        rodadasGratis;

    freeSpins.classList.toggle(
        "active",
        rodadasGratis>0
    );
}

/* =====================================================
   FINALIZAÇÃO
===================================================== */

async function finalizarRodada(){

    girando=false;

    spinButton.disabled=false;

    if(!autoAtivo)
        return;

    if(autoRodadas<=0){

        autoAtivo=false;

        stopAuto.disabled=true;

        statusEl.textContent=
            "10x AUTO FINALIZADO";

        return;
    }

    setTimeout(
        ()=>{
            spin();
        },
        turbo?350:750
    );
}

/* =====================================================
   GIRO PRINCIPAL
===================================================== */

async function spin(){

    if(girando)
        return;

    iniciarAudio();

    somGiro();

    iniciarMusica();

    let gratis=false;

    /* =================================================
       RODADA GRÁTIS
    ================================================= */

    if(rodadasGratis>0){

        gratis=true;

        rodadasGratis--;

        atualizarGratis();

    }

    /* =================================================
       RODADA NORMAL
    ================================================= */

    else{

        const saldo=
            await obterSaldo();

        if(
            saldo<aposta
        ){

            statusEl.textContent=
                "SALDO INSUFICIENTE";

            resultLineEl.textContent=
                "Saldo real da sua conta: "+
                dinheiro(saldo);

            somFX(
                120,
                .18,
                "square",
                .14
            );

            await atualizarSaldo();

            return;
        }

        /* =================================================
           DEBITA CORRETAMENTE COM AWAIT
        ================================================= */

        if(
            !window.SistemaSaldo ||
            typeof window.SistemaSaldo.debitar!=="function"
        ){

            statusEl.textContent=
                "SISTEMA DE SALDO NÃO CARREGADO";

            console.error(
                "window.SistemaSaldo.debitar não encontrado."
            );

            return;
        }

        const debitado=
            await window.SistemaSaldo.debitar(
                aposta
            );

        if(!debitado){

            statusEl.textContent=
                "NÃO FOI POSSÍVEL DEBITAR";

            await atualizarSaldo();

            return;
        }

        await atualizarSaldo();
    }

    /* =================================================
       COMEÇA O GIRO
    ================================================= */

    girando=true;

    spinButton.disabled=true;

    statusEl.textContent=
        gratis
        ? "🐍 RODADA GRÁTIS..."
        : "GIRANDO...";

    resultLineEl.textContent=
        "Os três rolos estão girando...";

    winDisplay.textContent=
        "R$ 0,00";

    reelBoxes.forEach(
        box=>{
            box.classList.remove(
                "win"
            );
        }
    );

    const resultado=
        gerarResultado();

    await Promise.all(
        reels.map(
            (r,i)=>
                girarRolo(
                    r,
                    reelBoxes[i],
                    resultado,
                    i
                )
        )
    );

    const resultadoPremio=
        calcularPremio(
            resultado
        );

    const premio=
        resultadoPremio.premio;

    winDisplay.textContent=
        dinheiro(premio);

    /* =================================================
       SUPER BÔNUS
    ================================================= */

    if(
        resultadoPremio.bonus
    ){

        reelBoxes.forEach(
            box=>{
                box.classList.add(
                    "win"
                );
            }
        );

        document
        .querySelectorAll(
            ".symbol"
        )
        .forEach(
            el=>{
                el.classList.add(
                    "win-symbol"
                );
            }
        );

        statusEl.textContent=
            "🐍 SUPER BÔNUS!";

        resultLineEl.textContent=
            "TRÊS COBRINHAS — 10 RODADAS GRÁTIS!";

        somBonus();

        particulas(70);

        /* Credita primeiro o prêmio
           normal das três cobras */

        if(premio>0){

            await window.SistemaSaldo.creditar(
                premio
            );
        }

        await atualizarSaldo();

        bonusOverlay.classList.add(
            "active"
        );

        setTimeout(
            ()=>{
                
                bonusOverlay.classList.remove(
                    "active"
                );

                rodadasGratis+=10;

                atualizarGratis();

                girando=false;

                spinButton.disabled=false;

                statusEl.textContent=
                    "10 RODADAS GRÁTIS ATIVADAS!";

                if(autoAtivo){

                    setTimeout(
                        ()=>spin(),
                        turbo?350:700
                    );
                }

            },
            2300
        );

        return;
    }

    /* =================================================
       VITÓRIA NORMAL
    ================================================= */

    if(premio>0){

        reelBoxes.forEach(
            box=>{
                box.classList.add(
                    "win"
                );
            }
        );

        statusEl.textContent=
            `🏆 VITÓRIA! +${dinheiro(premio)}`;

        resultLineEl.textContent=
            "TRÊS SÍMBOLOS IGUAIS!";

        somVitoria();

        particulas(35);

        /* Credita o prêmio real */

        const creditado=
            await window.SistemaSaldo.creditar(
                premio
            );

        if(!creditado){

            console.error(
                "Erro ao creditar prêmio."
            );
        }

        await atualizarSaldo();

    }

    /* =================================================
       PERDA
    ================================================= */

    else{

        statusEl.textContent=
            "NÃO FOI DESSA VEZ";

        resultLineEl.textContent=
            "DOIS IGUAIS + UM DIFERENTE = PERDE";

        await atualizarSaldo();
    }

    /* =================================================
       CONTROLE DO AUTO
    ================================================= */

    if(autoAtivo){

        autoRodadas--;

        if(autoRodadas<=0){

            autoAtivo=false;

            stopAuto.disabled=true;

            statusEl.textContent=
                "10x AUTO FINALIZADO";

            girando=false;

            spinButton.disabled=false;

            return;
        }
    }

    await finalizarRodada();
}

/* =====================================================

===================================================== */

autoButton.addEventListener(
    "click",
    ()=>{

        if(girando)
            return;

        iniciarAudio();

        somClique();

        /* Se houver rodadas grátis,
           o AUTO usa as grátis primeiro */

            autoRodadas=10;

            stopAuto.disabled=false;

            statusEl.textContent=

            spin();

            return;

           usando await */

                    saldo<aposta

                    statusEl.textContent=
                        "SALDO INSUFICIENTE";

                    resultLineEl.textContent=

                    return;

                autoAtivo=true;

                autoRodadas=10;

                stopAuto.disabled=false;

                statusEl.textContent=

                spin();
            }
        );
    }
);

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

reels.forEach(
    preencherRolo
);

betDisplay.textContent=
    dinheiro(aposta);

/*
   Espera o módulo saldo.js
   terminar de inicializar.
*/

async function iniciarJogo(){

    let tentativas=0;

    while(
        !window.SistemaSaldo &&
        tentativas<30
    ){

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    100
                )
        );

        tentativas++;
    }

    if(!window.SistemaSaldo){

        statusEl.textContent=
            "ERRO AO CARREGAR SISTEMA DE SALDO";

        console.error(
            "saldo.js não carregou."
        );

        return;
    }

    await atualizarSaldo();

    statusEl.textContent=
        "PRONTO PARA JOGAR";
}

iniciarJogo();

/*
   Atualiza o saldo periodicamente
   sem criar saldo novo.
*/

setInterval(
    ()=>{
        atualizarSaldo();
    },
    2000
);

    "focus",
    ()=>{

    }
);
