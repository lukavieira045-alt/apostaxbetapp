<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saque - ApostaXBet</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.topo {
    text-align: center;
    padding: 25px 10px;
    background: #111;
    border-bottom: 2px solid #d9b21f;
}

.topo h1 {
    color: #e6c229;
    margin: 0;
}

.saldo {
    margin-top: 10px;
    color: #00ed91;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 600px;
    margin: 25px auto;
}

.card {

    background: #151515;
    border: 2px solid #d9b21f;
    border-radius: 20px;
    padding: 25px;

}

h2 {

    text-align: center;
    color: #e6c229;

}

.info {

    color: #aaa;
    text-align: center;
    line-height: 1.5;

}

input {

    width: 100%;
    padding: 15px;
    margin: 15px 0;

    border-radius: 10px;
    border: 1px solid #d9b21f;

    background: #080808;
    color: white;

    font-size: 17px;

}

.botao {

    width: 100%;
    padding: 16px;

    border: 0;
    border-radius: 12px;

    background: #00df8a;
    color: #000;

    font-weight: bold;
    font-size: 17px;

}

.resultado {

    display: none;

    margin-top: 20px;
    text-align: center;

}

.aviso {

    color: #777;
    font-size: 12px;

}

.voltar {

    display: block;

    margin-top: 25px;

    text-align: center;

    padding: 15px;

    background: #d9b21f;

    color: #000;

    text-decoration: none;

    border-radius: 12px;

    font-weight: bold;

}

</style>

</head>


<body>


<header class="topo">

<h1>🎰 ApostaXBet</h1>

<div class="saldo" id="displaySaldo">
💰 Saldo: R$ 0,00
</div>

</header>


<main class="container">


<section class="card">


<h2>💵 Solicitar Saque</h2>


<p class="info">

Digite o valor que deseja sacar.

</p>


<input 
id="valor"
type="number"
placeholder="Valor do saque">


<input
id="pix"
placeholder="Chave PIX">


<button class="botao" onclick="sacar()">

💵 Solicitar saque

</button>



<div id="resultado" class="resultado">

<h3>✅ Solicitação criada</h3>

<p>
Seu saque foi enviado para análise.
</p>

<p class="aviso">

Área demonstrativa.

</p>

</div>



<a href="index.html" class="voltar">

← Voltar para o início

</a>



</section>


</main>



<script>

function sacar(){

let valor =
document.getElementById("valor").value;

let pix =
document.getElementById("pix").value;


if(valor == "" || pix == ""){

alert("Preencha todos os campos.");

return;

}


document.getElementById("resultado")
.style.display="block";


}

</script>


</body>
</html>
