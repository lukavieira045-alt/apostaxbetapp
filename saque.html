<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saque - ApostaXBet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.topo {
    text-align: center;
    padding: 25px 10px;
    background: #111;
    border-bottom: 2px solid #d9b21f;
}

.topo h1 {
    color: #e6c229;
    margin: 0;
}

.saldo {
    margin-top: 10px;
    color: #00ed91;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 600px;
    margin: 25px auto;
}

.card {
    background: #151515;
    border: 2px solid #d9b21f;
    border-radius: 20px;
    padding: 25px;
}

h2 {
    text-align: center;
    color: #e6c229;
}

.info {
    color: #aaa;
    text-align: center;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #d9b21f;
    background: #080808;
    color: white;
    font-size: 17px;
}

.botao {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: #00df8a;
    color: #000;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
}

.botao:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.resultado {
    display: none;
    margin-top: 20px;
    text-align: center;
}

.sucesso {
    color: #00ed91;
}

.erro {
    color: #ff5555;
}

.aviso {
    color: #777;
    font-size: 12px;
}

.voltar {
    display: block;
    margin-top: 25px;
    text-align: center;
    padding: 15px;
    background: #d9b21f;
    color: #000;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
}
</style>
</head>

<body>

<header class="topo">

    <h1>🎰 ApostaXBet</h1>

    <div class="saldo" id="displaySaldo">
        💰 Saldo: R$ 0,00
    </div>

</header>

<main class="container">

<section class="card">

    <h2>💵 Solicitar Saque</h2>

    <p class="info">
        Digite o valor que deseja sacar e sua chave PIX.
    </p>

    <input
        id="valor"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Valor do saque"
    >

    <input
        id="pix"
        type="text"
        placeholder="Telefone PIX: (11) 98765-4321"
    >

    <button
        id="btnSaque"
        class="botao"
        onclick="sacar()"
    >
        💵 Solicitar saque
    </button>

    <div
        id="resultado"
        class="resultado"
    ></div>

    <a
        href="index.html"
        class="voltar"
    >
        ← Voltar para o início
    </a>

</section>

</main>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://jxbzjiwmajjzxgihfjgt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_XSQ0Lb5v5QD6tQ_xOao_sA_QfxqqhuJ";


const ENDPOINT =
"https://jxbzjiwmajjzxgihfjgt.supabase.co/functions/v1/quick-endpoint";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const displaySaldo =
document.getElementById("displaySaldo");


const resultado =
document.getElementById("resultado");


const btnSaque =
document.getElementById("btnSaque");



function mostrarResultado(
    mensagem,
    sucesso = false
) {

    resultado.style.display = "block";

    resultado.className =
        sucesso
        ? "resultado sucesso"
        : "resultado erro";

    resultado.innerHTML =
        mensagem;
}



async function atualizarSaldo() {

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabase.auth.getSession();


    if (sessionError) {

        console.error(
            "Erro na sessão:",
            sessionError
        );

        return;
    }


    const session =
        sessionData?.session;


    if (!session?.user) {

        displaySaldo.innerText =
            "💰 Faça login para ver seu saldo";

        return;
    }


    const {
        data,
        error
    } =
        await supabase
        .from("saldos")
        .select("valor")
        .eq("user_id", session.user.id)
        .maybeSingle();


    if (error) {

        console.error(
            "Erro ao buscar saldo:",
            error
        );

        return;
    }


    const saldo =
        Number(data?.valor || 0);


    displaySaldo.innerText =
        "💰 Saldo: R$ " +
        saldo
        .toFixed(2)
        .replace(".", ",");
}



window.sacar = async function () {

    resultado.style.display = "none";


    const valorInput =
        document.getElementById("valor");


    const pixInput =
        document.getElementById("pix");


    const valor =
        Number(valorInput.value);


    let pix =
        pixInput.value.trim();


    /* =========================
       VALIDA VALOR
    ========================= */

    if (!valor || valor <= 0) {

        mostrarResultado(
            "❌ Digite um valor de saque válido."
        );

        return;
    }


    /* =========================
       VALIDA PIX
    ========================= */

    if (!pix) {

        mostrarResultado(
            "❌ Digite sua chave PIX."
        );

        return;
    }


    /*
     * Remove máscara do telefone:
     *
     * (11) 98765-4321
     * 11 98765-4321
     * 11987654321
     *
     * viram somente números.
     */

    pix =
        pix.replace(/\D/g, "");


    /*
     * Se tiver 11 números,
     * assume DDD + telefone
     * e acrescenta o código do Brasil.
     */

    if (pix.length === 11) {

        pix =
            "55" + pix;
    }


    /*
     * Telefone brasileiro:
     *
     * 55 + DDD + 9 dígitos
     */

    if (!/^55\d{11}$/.test(pix)) {

        mostrarResultado(
            "❌ Digite um telefone válido com DDD.<br><br>" +
            "Exemplo: (11) 98765-4321"
        );

        return;
    }



    btnSaque.disabled =
        true;


    btnSaque.innerText =
        "⏳ Enviando saque...";


    try {


        /* =========================
           VERIFICA SESSÃO
        ========================= */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (sessionError) {

            throw new Error(
                "Não foi possível verificar sua sessão."
            );
        }


        const session =
            sessionData?.session;


        if (!session?.user) {

            mostrarResultado(
                "❌ Sua sessão expirou. Faça login novamente."
            );

            return;
        }



        /* =========================
           BUSCA SALDO
        ========================= */

        const {
            data: saldoData,
            error: saldoError
        } =
            await supabase
            .from("saldos")
            .select("valor")
            .eq("user_id", session.user.id)
            .maybeSingle();


        if (saldoError) {

            throw new Error(
                "Não foi possível consultar seu saldo."
            );
        }


        const saldoAtual =
            Number(
                saldoData?.valor || 0
            );


        if (valor > saldoAtual) {

            mostrarResultado(
                "❌ Saldo insuficiente."
            );

            return;
        }



        /* =========================
           ENVIA PARA A FUNÇÃO
        ========================= */

        const resposta =
            await fetch(
                ENDPOINT,
                {
                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            session.access_token,

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        valor: valor,

                        pix: pix

                    })
                }
            );



        /* =========================
           LÊ RESPOSTA
        ========================= */

        let dados = null;


        try {

            dados =
                await resposta.json();

        } catch {

            dados = null;
        }



        /* =========================
           ERRO DA FUNÇÃO
        ========================= */

        if (!resposta.ok) {

            console.error(
                "Erro da quick-endpoint:",
                resposta.status,
                dados
            );


            const mensagem =
                dados?.erro ||
                dados?.error ||
                dados?.message ||
                "A solicitação de saque foi recusada.";


            mostrarResultado(
                "❌ " + mensagem
            );


            return;
        }



        /* =========================
           SUCESSO
        ========================= */

        mostrarResultado(
            `
            <h3>✅ Solicitação criada</h3>

            <p>
                Seu saque foi enviado para análise.
            </p>

            <p class="aviso">
                Valor: R$ ${valor
                    .toFixed(2)
                    .replace(".", ",")}
            </p>
            `,
            true
        );


        valorInput.value =
            "";

        pixInput.value =
            "";


        await atualizarSaldo();


    } catch (erro) {

        console.error(
            "Erro ao solicitar saque:",
            erro
        );


        mostrarResultado(
            "❌ Não foi possível enviar o saque. Tente novamente."
        );


    } finally {

        btnSaque.disabled =
            false;

        btnSaque.innerText =
            "💵 Solicitar saque";
    }

};



/* =========================
   CARREGA SALDO
========================= */

await atualizarSaldo();

</script>

</body>
</html>
