<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Mania</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020611;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.jogo{
    width:100%;
    max-width:600px;
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 20%,#1d5db5,#07183d 45%,#020611 80%);
    padding-bottom:25px;
}

.topo{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 15px;
    background:#081632;
    border-bottom:2px solid #263d72;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.relogio{
    font-family:monospace;
    font-size:18px;
}

.banner{
    margin:25px 10px 20px;
    height:125px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:3px solid #16163d;
    border-radius:8px;
    background:linear-gradient(#171743,#090925);
    box-shadow:
        0 0 20px #00eaff88,
        inset 0 0 25px #5225c988;
}

.banner span{
    color:#55fff5;
    font-size:27px;
    font-weight:900;
    text-shadow:0 0 10px #00ffff;
}

.maquina{
    margin:0 8px;
    padding:8px;
    background:linear-gradient(90deg,#10183c,#43207b,#10183c);
    border-radius:12px 12px 0 0;
}

.rolos{
    height:500px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    overflow:hidden;
    background:#10162d;
    border:4px solid #090d21;
    border-radius:8px;
}

.rolo{
    overflow:hidden;
    background:#b8d09f;
    border-right:3px solid #34435c;
}

.lista{
    transition:transform 1s cubic-bezier(.12,.78,.18,1);
}

.simbolo{
    height:165px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:linear-gradient(#e1f0d0,#a5c98e 75%,#87ae72);
    border-bottom:4px solid #52675b;
}

.cinco{
    font-family:Georgia,serif;
    font-size:70px;
    font-weight:bold;
    color:#fff1ce;
    text-shadow:
        4px 4px #683036,
        -2px -2px #9b682d;
}

.moeda{
    font-family:Georgia,serif;
    font-size:52px;
    font-weight:bold;
    color:#e8f0c9;
    text-shadow:3px 3px #53734a;
}

.rosto{
    width:110px;
    height:110px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    background:#f0d29a;
    border:7px solid #f7e7bd;
    box-shadow:0 7px #5b814b;
}

.x2{
    position:absolute;
    bottom:5px;
    font-size:43px;
    font-weight:bold;
    color:#d9e3bf;
    text-shadow:3px 3px #39472d;
}

.info{
    height:75px;
    margin-top:8px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    background:#0d1730;
    border:1px solid #263965;
    border-radius:17px;
}

.info div{
    text-align:center;
}

.info small{
    display:block;
    color:#8e9bb8;
    font-size:10px;
    margin-bottom:5px;
}

.valor{
    color:#a8ff5c;
    font-size:21px;
}

.controles{
    display:grid;
    grid-template-columns:65px 65px 1fr 65px 65px;
    gap:6px;
    align-items:center;
    padding:15px 5px;
}

.botao{
    width:60px;
    height:60px;
    border:0;
    border-radius:50%;
    background:linear-gradient(#2b3d66,#10182f);
    color:white;
    font-size:30px;
}

.girar{
    width:125px;
    height:125px;
    justify-self:center;
    border-radius:50%;
    border:7px solid #26eff5;
    background:radial-gradient(circle,#12323d,#06101b);
    color:#4ffff4;
    font-size:45px;
    box-shadow:
        0 0 25px #00eaff,
        inset 0 0 20px #00eaff66;
}

.botao:active,
.girar:active{
    transform:scale(.93);
}

.mensagem{
    text-align:center;
    height:28px;
    color:#a7ff68;
    font-size:16px;
}

.aviso{
    text-align:center;
    color:#64769c;
    font-size:10px;
    padding:10px;
}
</style>
</head>

<body>

<div class="jogo">

    <div class="topo">
        <div class="logo">Lobby Mania</div>
        <div class="relogio" id="relogio">03:27:59</div>
    </div>

    <div class="banner">
        <span>Nova rodada é de empurrar!</span>
    </div>

    <div class="maquina">

        <div class="rolos">

            <div class="rolo">
                <div class="lista" id="rolo1"></div>
            </div>

            <div class="rolo">
                <div class="lista" id="rolo2"></div>
            </div>

            <div class="rolo">
                <div class="lista" id="rolo3"></div>
            </div>

        </div>

        <div class="mensagem" id="mensagem">
            Pronto para jogar
        </div>

        <div class="info">

            <div>
                👤
            </div>

            <div>
                <small>SALDO DEMO</small>
                <span class="valor" id="saldo">R$ 0,03</span>
            </div>

            <div>
                <small>APOSTA</small>
                <span class="valor" id="aposta">R$ 0,50</span>
            </div>

        </div>

        <div class="controles">

            <button class="botao">🔇</button>

            <button class="botao" onclick="diminuir()">−</button>

            <button class="girar" onclick="girar()">★</button>

            <button class="botao" onclick="aumentar()">+</button>

            <button class="botao" onclick="automatico()">▶</button>

        </div>

    </div>

    <div class="aviso">
        Jogo demonstrativo com créditos fictícios.
    </div>

</div>

<script>

const simbolos = [

    '<div class="simbolo"><div class="cinco">5</div></div>',

    '<div class="simbolo"><div class="rosto">🙂</div><div class="x2">×2</div></div>',

    '<div class="simbolo"><div class="moeda">0,05</div></div>',

    '<div class="simbolo"><div class="cinco">5</div></div>',

    '<div class="simbolo"><div class="rosto">😄</div><div class="x2">×2</div></div>',

    '<div class="simbolo"><div class="moeda">0,05</div></div>'

];

const rolos=[
    document.getElementById("rolo1"),
    document.getElementById("rolo2"),
    document.getElementById("rolo3")
];

let saldo=0.03;
let aposta=0.50;
let girando=false;

function montar(){

    rolos.forEach((rolo,coluna)=>{

        let html="";

        for(let i=0;i<20;i++){

            html += simbolos[(i+coluna*2)%simbolos.length];

        }

        rolo.innerHTML=html;

    });

}

function atualizar(){

    document.getElementById("saldo").textContent=
        "R$ "+saldo.toFixed(2).replace(".",",");

    document.getElementById("aposta").textContent=
        "R$ "+aposta.toFixed(2).replace(".",",");

}

function girar(){

    if(girando) return;

    girando=true;

    document.getElementById("mensagem").textContent="Girando...";

    rolos.forEach((rolo,i)=>{

        const pos=-(Math.floor(Math.random()*8)+8)*165;

        rolo.style.transition=
            "transform "+(0.9+i*0.25)+"s cubic-bezier(.12,.78,.18,1)";

        rolo.style.transform=
            "translateY("+pos+"px)";

    });

    setTimeout(()=>{

        const ganhou=Math.random()<0.2;

        if(ganhou){

            saldo+=aposta*2;

            document.getElementById("mensagem").textContent=
                "Você ganhou!";

        }else{

            document.getElementById("mensagem").textContent=
                "Tente novamente";

        }

        atualizar();

        girando=false;

    },1500);

}

function aumentar(){

    aposta=Math.min(5,aposta+0.50);

    atualizar();

}

function diminuir(){

    aposta=Math.max(0.50,aposta-0.50);

    atualizar();

}

function automatico(){

    if(!girando){

        girar();

    }

}

let segundos=3*3600+27*60+59;

setInterval(()=>{

    segundos++;

    let h=Math.floor(segundos/3600)%24;
    let m=Math.floor(segundos%3600/60);
    let s=segundos%60;

    document.getElementById("relogio").textContent=
        [h,m,s].map(n=>String(n).padStart(2,"0")).join(":");

},1000);

montar();
atualizar();

</script>

</body>
</html>
